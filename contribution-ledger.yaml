# Ведомость соглашения о вкладе воркспейса и перечень личностей, которыми здесь
# подписываются коммиты. Её читает ОДИН разборщик — scripts/cla-gate/cla.py, гейт
# дерева scripts/cla-gate/run-all.sh. Второго перечня личностей в дереве не
# заводится: он разошёлся бы с этим молча.
#
# Форма — по соседу (PRO-Robotech/kaname, cla-ledger.yaml и tools/clagate), но не
# его путь: одноимённый отслеживаемый файл в двух стволах запрещён. Единица
# счёта — АДРЕС, а не имя. Причина (note) обязательна у каждой записи; запись
# signatories/waivers без предмета в истории области — находка. owners не
# самоистекают: это политика («соглашения с самим собой не бывает»), а не
# послабление.

# Область — ОТНОСИТЕЛЬНО ЭТОГО ФАЙЛА: `.` означает воркспейс целиком.
scope:
  - .

# Граница суждения. История, достижимая из этой ревизии, вердикта НЕ получает:
# гейт перечисляет её адреса без записи числом, но не судит. После неё — строго.
history_floor:
  commit: 6eddaa5e9c9b596976e205f4e012d47e00eaf8e3
  note: >-
    База полосы, заведшей ведомость (ствол воркспейса на 2026-09-27). История до
    неё несёт адреса, отнести которые к своим, подписавшим или машинным вправе
    только владелец. Перепись по приписке GitHub (gh api
    repos/PRO-Robotech/kacho-workspace/commits/<sha> → author.login): адрес
    dlputilin@dobry-kot.ru приписан ДРУГОЙ учётной записи (FR-Solution,
    107264732), noreply@anthropic.com — машинной учётной записи claude (81847),
    noreply@prorobotech.local, kacho@prorobotech.ru, kacho@pro-robotech.local и
    dev@kacho не приписаны никому; соавторами трейлером названы ещё kacho@local,
    pdl.48.hot@gmail.com и dk@prorobotech.com. Полный перечень с числами печатает
    гейт при каждом прогоне (bash scripts/cla-gate/run-all.sh), и число здесь не
    выписано: история до границы неизменна, но перечень сужается записями.

    Предикат снятия: гейт сам краснеет, когда за границей не останется ни
    одного вклада без записи, — тогда граница снимается, и судится вся история.
    Пока она стоит, новые вклады судятся строго: вклад вне ведомости после
    границы — находка гейта.

