# Ведомость соглашения о вкладе воркспейса и перечень личностей, которыми здесь
# подписываются коммиты. Её читает ОДИН разборщик — scripts/cla-gate/cla.py — в
# трёх местах: гейт дерева (scripts/cla-gate/run-all.sh), хук отправки
# (scripts/hooks/pre-push судит отправляемый диапазон) и перепись по диапазону.
# Второго перечня личностей в дереве нет: он разошёлся бы с этим молча.
#
# Форма — по соседу (PRO-Robotech/kaname, cla-ledger.yaml и tools/clagate), но не
# его путь: одноимённый отслеживаемый файл в двух стволах запрещён. Единица
# счёта — АДРЕС, а не имя. Причина (note) обязательна у каждой записи; запись
# signatories/waivers без предмета в истории области — находка. owners не
# самоистекают: это политика («соглашения с самим собой не бывает»), а не
# послабление. Сверх соседа — раздел history_only и граница history_floor: адрес
# «только история» покрывает вклад лишь в коммитах, достижимых из границы.

# Область — ОТНОСИТЕЛЬНО ЭТОГО ФАЙЛА: `.` означает воркспейс целиком.
scope:
  - .

# Граница истории: коммиты, достижимые из этой ревизии (она включительно), —
# история. Записи history_only действуют только в ней; после неё тот же адрес —
# находка гейта и отказ хука отправки.
history_floor:
  commit: 6eddaa5e9c9b596976e205f4e012d47e00eaf8e3
  note: >-
    База полосы, заведшей ведомость (ствол воркспейса на 2026-09-27). Решение
    владельца 2026-09-27, переданное диспетчером полосы: история до границы
    остаётся как есть, вперёд — только своя личность. Граница — предел действия
    раздела history_only, а не освобождение истории от суждения: судится вся
    история, до границы — по всем разделам.

    Предикат снятия: граница без единой записи history_only сама становится
    находкой гейта. Сдвигать её вперёд значит объявить историей то, что было
    отправлено после неё, — это решение владельца, а не правка ради зелёного.

# Личность правообладателя.
owners:
  - email: pointpu@in-cloud.io
    note: >-
      Единственная своя личность: «pointpu@in-cloud.io то что прописано в
      gitconfig» (владелец, 2026-09-27, передано диспетчером полосы). Приписка
      GitHub подтверждает тождество числом: коммит 6eddaa5e9c приписан учётной
      записи pointpu с идентификатором 211894461. Норма подписи коммита —
      git-issues.md, gi-identity-owner-only.

# Сторонние авторы, принявшие соглашение вне коммита. Причина называет, ЧЕМ и
# КОГДА принято.
signatories: []

# Машинные личности, чей вклад авторским произведением не является.
waivers: []

# Только история: адрес покрывает вклад в коммитах, достижимых из history_floor,
# и НЕ покрывает ничего после неё. Классифицировал владелец 2026-09-27 (ответы
# переданы диспетчером полосы, цитаты — в записях); число вкладов каждого адреса
# печатает гейт при каждом прогоне и здесь не выписано.
history_only:
