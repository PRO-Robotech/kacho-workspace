# Манифест владения адаптера оснастки — ЕДИНСТВЕННОЕ место, где объявлено,
# что порождается из канонической оснастки для других агентских сред.
#
# ВХОД против ВЫХОДА. `.claude/**` и корневой `CLAUDE.md` — канонические входы;
# всё, перечисленное в `owned_outputs`, — производное. Правка производного
# уедет при следующей регенерации, а гейт назовёт её расхождением: предмет
# правки всегда во входе.
#
# ПОЧЕМУ ТОЧНЫЙ ПЕРЕЧЕНЬ, А НЕ ШАБЛОН. Шаблон подхватывает новое молча, и тогда
# «лишний выход» перестаёт быть отличимым от «выход, о котором никто не решал».
# Точный перечень стоит одной строки при заведении файла и делает оба состояния
# видимыми: строка без файла и файл без строки — обе находки.
#
# ЧУЖОЙ ПАКЕТ ВЫХОДОМ НЕ ЯВЛЯЕТСЯ. Пакет внутри `.agents/skills/`, которого нет
# среди `skills`, принадлежит другой установке: генератор его не пишет и не
# удаляет, гейт не считает его лишним и — несущее требование — чужой пакет
# НЕ МАСКИРУЕТ расхождение владеемого.
#
# Норма — `.claude/rules/change-graph.md` §Оснастка. Гейт —
# `scripts/adapter-gate/run-all.sh`. Генератор — `scripts/adapter/generate.py`.
schema_version: 1

# Единственные входы, которые вправе читать генератор. Чтение чего-либо вне
# этого набора — находка (`CG_ADAPTER_INPUT_NOT_CANONICAL`): производное,
# зависящее от неканонического входа, перестаёт быть воспроизводимым из
# оснастки.
canonical_inputs:
  - CLAUDE.md
  - .claude/adapters.yaml
  - .claude/agents
  - .claude/hooks
  - .claude/rules
  - .claude/skills
  - .claude/settings.json

# Пространства, внутри которых адаптер отвечает за КАЖДЫЙ отслеживаемый файл.
# Отслеживаемый файл здесь, не названный в `owned_outputs`, — лишний выход.
# Пакеты скилов перечислены поимённо (см. «чужой пакет» выше), а не каталогом.
owned_namespaces:
  - AGENTS.md
  - .codex/agents
  - .codex/hooks
  - .codex/hooks.json

# ПРИВЯЗКИ ПРАВИЛ НЕ ПРОЕЦИРУЮТСЯ — И ЭТО ОБЪЯВЛЕНО, А НЕ ВЫВЕДЕНО ИЗ МОЛЧАНИЯ.
#
# Решением владельца 2026-09-17 правило доезжает до агента предзагрузкой: у
# правила заведён каталог `.claude/skills/rule-<имя>/`, чей `SKILL.md` —
# СИМВОЛЬНАЯ ССЫЛКА на `../../rules/<имя>.md`. Такой каталог — АДРЕС правила, а не
# экспертиза: своего содержимого у него нет ни байта.
#
# Спроецировать его значило бы записать ТЕКСТ ПРАВИЛА вторым экземпляром — в
# `.agents/skills/rule-<имя>/SKILL.md`. Вторая копия нормативного текста расходится
# с оригиналом молча; это ровно тот класс, ради которого заведён весь адаптер. К
# тому же перечень скилов второй среды объявил бы тридцать правил экспертизами, а
# корпус во вторую среду едет иначе — телом агента, не пакетом скила.
#
# ПРЕДИКАТ — СВОЙСТВО ФАЙЛА, НЕ ИМЯ КАТАЛОГА. Имя `rule-*` подделывается одним
# `mkdir`; исключение по имени было бы дырой, через которую экспертиза под
# зарезервированным именем выпадает из перечня молча. Каталог `rule-*`, чей
# `SKILL.md` НЕ ссылка, привязкой не является и обязан быть НАХОДКОЙ.
#
# КЛЮЧ ЧИТАЕТСЯ, А НЕ УКРАШАЕТ. Его берут `scripts/adapter/generate.py` и
# `scripts/adapter-gate/probe.py` (предикат `skills-roster`); убери ключ либо
# напиши в `predicate` незнакомое значение — набор ответит БЕЗ ПРЕДМЕТА, а не
# зелёным. Объявление, которое ничего не держит, стареет молча — это и есть класс,
# ради которого весь этот манифест существует.
skill_bindings:
  # Имя предиката. Единственное известное значение — `symlinked-skill-md`;
  # всякое другое читатель обязан назвать отказом, а не понять по-своему.
  predicate: symlinked-skill-md
  # Зарезервированный префикс имени. Он НЕ предикат: по нему считается лишь то,
  # у кого имя занято, — привязкой каталог делает ссылка.
  reserved_prefix: rule-

# Скилы, чьи ПОЛНЫЕ пакеты порождаются: `SKILL.md` и всё вложенное — ссылки,
# ассеты, скрипты. Потерянный вложенный ресурс — находка
# (`CG_ADAPTER_NESTED_ASSET_MISSING`), а не «пакет почти целый».
# Перечень обязан совпадать с отслеживаемыми директориями `.claude/skills/*/`.
skills:
  - change-graph
  - code-authoring
  - doc-truthfulness
  - evgeniy
  - gate-authoring
  - godzila
  - hardening-audit-loop
  - kacho-docs-writer
  - load-testing-coach
  - measurement-discipline
  - security-surface
  - testing-code-coach
  - testing-product-coach
  - verdict-and-landing

# Точный набор владеемых выходов. Сверяется в обе стороны: с деревом и с
# регенерацией во временный каталог.
owned_outputs:
  - AGENTS.md
  - .agents/skills/change-graph/SKILL.md
  - .agents/skills/code-authoring/SKILL.md
  - .agents/skills/doc-truthfulness/SKILL.md
  - .agents/skills/evgeniy/SKILL.md
  - .agents/skills/gate-authoring/SKILL.md
  - .agents/skills/godzila/SKILL.md
  - .agents/skills/hardening-audit-loop/SKILL.md
  - .agents/skills/hardening-audit-loop/references/audit-round.workflow.js
  - .agents/skills/kacho-docs-writer/SKILL.md
