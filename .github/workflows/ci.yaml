name: ci
# ТРИГГЕРЫ СУЖЕНЫ ПО ВЕТКЕ — это исполнение решения владельца 2026-08-12, а не
# оптимизация по вкусу (#282). До 2026-08-19 здесь стояло `on: [push, pull_request]`,
# а `.claude/backup/git-issues.md` §«Накопительная релизная ветка» в трёх местах
# обещало обратное: «PR ВНУТРЬ релизной ветки конвейером не проверяется». Обещание
# было верно для монорепо (там `push`/`pull_request` сужены по `main` во всех
# процессах) и ложно здесь. Цена измерена: за 200 последних прогонов (окно с
# 2026-08-16T20:58Z) на не-`main` ветках — 142 прогона по 8 job'ов, при обещанном
# нуле; каждая ветка оплачивалась ДВАЖДЫ, событием `push` и событием
# `pull_request`.
#
# КОНТРОЛЬ В ОБРАТНУЮ СТОРОНУ. Защита ветки `main` требует ВОСЕМЬ контекстов
# поимённо, и каждый обязан производиться заданием ниже. `pull_request` обязан
# нести `main` в `branches` и НЕ обязан сужаться по `paths`: контекст, который не
# начался, не зеленеет и не краснеет, а остаётся «ожидается» — и слияние
# блокируется навсегда. Оба условия держит
# `scripts/tooling-gate/check-05-workflow-triggers-narrowed.sh`, доказанный
# инъекцией в обе стороны; это не комментарий, а проверка.
#
# ОБРАТНОЕ НЕВЕРНО, И ЭТО НАДО ЧИТАТЬ КАК ФАКТ, А НЕ КАК НЕДОСМОТР. Заданий ниже
# ДЕВЯТЬ: `change-graph-proofs` заведён 2026-09-02 (ws#504) и в перечень
# обязательных контекстов НЕ входит — его красное видно в перечне проверок PR,
# но слияние не блокирует. Прежняя редакция этой строки утверждала «ровно восемь
# job'ов ниже» и стала бы ложью в момент появления девятого. Предикат остатка:
#
#   gh api repos/PRO-Robotech/kacho-workspace/branches/main/protection \
#     --jq '.required_status_checks.contexts[]' | grep -c 'оснастка контура'
#
# Ноль означает, что вторая половина не закрыта; закрывается она настройкой
# репозитория, а не деревом, и потому решением владельца, а не этим файлом.
#
# `workflow_dispatch` — законный способ прогнать конвейер по релизной ветке руками,
# когда это действительно нужно. Он не тратит ранер сам по себе.
# Версия анализатора объявлена ОДИН РАЗ на весь процесс. Прежде её выбирал образ
# ранера (`apt-get install shellcheck`), и вердикт принадлежал не дереву, а
# картинке: локальная 0.11 давала SC2329 на объявлении функции под `trap`,
# ранерная — SC2317 на каждой строке её тела. Одно объявление означает, что
# расхождение между заданиями невозможно by construction, а не проверяется.
env:
  SHELLCHECK_VERSION: "0.11.0"

# СОБЫТИЯ `push` НЕТ ВОВСЕ (решение владельца 2026-09-20 «на любом бранче конвейер
# не активен»). Прежде оно было сужено по `main`, и каждое вливание оплачивалось
# ДВАЖДЫ: прогон на PR плюс прогон на push в ствол сразу за слиянием — второй
# судил то же дерево, что первый, и ничего нового не устанавливал. Осталось ровно
# одно событие, и оно несущее: девять обязательных контекстов защиты `main`
# производятся прогоном `pull_request`, поэтому снять ещё и его значило бы
# заблокировать слияние навсегда — контекст, который не начался, не зеленеет и не
# краснеет, а остаётся «ожидается».
#
# ЧТО ЭТИМ ТЕРЯЕТСЯ, названо вслух: состояние ствола между вливаниями не
# перепроверяется ничем, кроме прогона того PR, которым оно создано. Ручной
# прогон остаётся — `workflow_dispatch`.
# АВТОЗАПУСКА НЕТ НИ НА ОДНОЙ ВЕТКЕ (решение владельца 2026-09-20). Задания ниже
# ОПИСАНЫ и исполнимы, но ни одно событие дерева их не поднимает: остался только
# ручной `workflow_dispatch`.
#
# ЧТО ЭТИМ СНЯТО, названо вслух, чтобы зелёное не обещало лишнего: девять
# обязательных контекстов сняты с защиты `main` тем же решением — контекст, который
# не начался, остаётся «ожидается» и заблокировал бы слияние навсегда. Значит PR
# больше не несёт машинного вердикта, и единственный, кто судит ветку до отправки,
# — хук отправки воркспейса (`scripts/*/run-all.sh`, семь наборов). Он гоняет
# МЕНЬШЕ, чем задания ниже: у гейтовых наборов не зовутся `inject.sh`, не идут
# `shellcheck` внутри job'ов и не идут job'ы целиком (линт оболочек и `bats`,
# доказательства хуков, гейт цитируемых команд, проба фикстур). Прогонять их
# вручную: `gh workflow run ci.yaml --ref <ветка>`.
on:
  workflow_dispatch:
jobs:
  bats-and-shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install bats-core
        run: sudo apt-get update -qq && sudo apt-get install -y bats
      - name: shellcheck пиннутой версии (local == CI)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          # Версия печатается в вердикт: без неё «зелено» не несёт с собой, чем
          # именно оно получено, и следующее расхождение снова будет невидимым.
          shellcheck --version | sed -n 's/^version: /установлен shellcheck /p'
      - name: shellcheck core bash scripts
        # `|| true` глушит ЗАМЕЧАНИЯ линта — и вместе с ними глушил бы «файла нет
        # вовсе». Существование каждого из этих трёх имён утверждает отдельно
        # job `tooling-gate`, поэтому исчезновение файла остаётся громким.
        run: shellcheck bootstrap.sh sync-all.sh tests/test_helper.bash || true   # informational
      - name: shellcheck tooling-gate scripts (strict)
        working-directory: scripts/tooling-gate
        run: shellcheck -x -- *.sh
      - name: run bats tests
        # Перечень явный, а не `tests/*.bats`: под маской исчезнувший файл просто
        # перестаёт исполняться, и суита остаётся зелёной с меньшим объёмом.
        # Явное имя ломается заметно, а существование каждого имени отдельно
        # утверждает tooling-gate (job `tooling-gate` ниже).
        run: bats tests/bootstrap.bats tests/sync-all.bats

  tooling-gate:
    name: конвейер и агенты не утверждают о дереве того, чего в нём нет
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # Разборщик YAML — ПРЕДПОСЫЛКА `check-05`: он читает объявление триггеров
      # разобранным, а не подстрокой (упоминание `pull_request` в комментарии
      # триггером не является). Без разборщика проверка честно отвечает VOID, а
      # `run-all.sh` отдаёт за VOID код 2 — тихо зелёным это не станет.
      #
      # КОД 2 РОНЯЕТ ЭТОТ ШАГ, И ЭТО ЗАДУМАНО. С ws#458 «без предмета» отделено
      # от находки собственным кодом, чтобы хук отправки мог их различать: в
      # свежем клоне воркспейса клона продукта нет вовсе, и там VOID — факт
      # расписания, а не находка. ЗДЕСЬ предпосылка создаётся шагами job'ы,
      # поэтому VOID означает, что сломалось само создание условия, — и шаг
      # обязан покраснеть. Различие делает не `if`, а то, КТО спрашивает.
      - name: разборщик YAML для check-05
        run: python3 -m pip install --quiet PyYAML
      - name: tooling-gate
        run: bash scripts/tooling-gate/run-all.sh
      - name: гейт доказан инъекцией — дефект краснеет, законный близнец молчит
        run: bash scripts/tooling-gate/inject.sh
      # ── rules-gate ЖИВЁТ ЗДЕСЬ, А НЕ ОТДЕЛЬНЫМ ЗАДАНИЕМ ─────────────────────
      #
      # Предмет набора — РАСКЛАДКА корпуса правил, и с 2026-09-17 она другая.
      # Прежний довод («`.claude/rules/` читается средой автоматически и целиком,
      # поэтому лишний файл возвращает свою цену в окно КАЖДОГО агента») отозван
      # вместе с решением 2026-09-13: каталог снят с автозагрузки
      # (`.claude/settings.json` → `claudeMdExcludes`), `CLAUDE.md` правил не
      # импортирует (`grep -c '^@' CLAUDE.md` → 0), и правило доезжает до агента
      # ЗАКРЕПЛЕНИЕМ — `MANIFEST.md`, колонка «закреплено за агентами» (объявление)
      # → `skills:` во frontmatter агента (исполнение) → `.claude/skills/rule-*/`
      # (носитель, символьная ссылка). Имя правила здесь маской, а не угловыми
      # скобками, и это не вкусовщина: `check-01-workflow-paths` судит КАЖДУЮ
      # координату конвейера на существование, а разбор рвёт токен по угловой
      # скобке — от подстановки остаётся обрубок пути, которого в дереве нет.
      # Находка была бы по форме записи, а не по существу; маска из разбора
      # исключена явно (шаблон), поэтому предмет проверки не сужается.
      #
      # Довод на замену — тот же по форме и другой по предмету: расхождение этих
      # трёх мест не проявляется НИЧЕМ. Правило без агента не прочитает никто —
      # оно написано, лежит в каталоге и мертво; агент со ссылкой на
      # несуществующее правило молча работает без нормы. Ни то, ни другое не
      # ломает продукт и не краснеет само.
      #
      # СОСТОЯНИЕ НАБОРА НА 2026-09-18, названное вслух, чтобы зелёное не
      # обещало лишнего: перевод проверок на закрепление ЗАВЕРШЁН. `check-02`
      # обходит то же замыкание `@import` от `CLAUDE.md` и ищет в нём
      # ПРОТИВОПОЛОЖНОЕ — правило, вернувшееся в автозагрузку; к нему прибавились
      # `check-04` (привязка правило↔агент в обе стороны) и `check-05`
      # (диспетчер знает каждого исполнителя). С 2026-09-21 прибавился
      # `check-10`: адрес правила и скила-привязки обязан резолвиться ТЕМ
      # адресом, которым написан, — сосед `check-07` резолвит по базовому имени
      # и считает архив настоящим местом нормы, поэтому ссылка на путь корпуса
      # для файла, уехавшего в `.claude/backup/`, у него не висит. Замер на ЭТОМ
      # дереве (сведённая голова волны `02b3e6f2` плюс полоса правдивости
      # утверждений, 2026-09-21) — тремя категориями, а не «зелено»:
      # `bash scripts/rules-gate/run-all.sh` — код 0, рассмотрено проверок 11,
      # пройдено 11, провалено 0, без предмета 0;
      # `bash scripts/rules-gate/inject.sh` — код 0, частей 11, утверждений 397,
      # сошлось 397, разошлось 0, у каждой из одиннадцати проверок есть находка и
      # законный близнец. Числа сняты ПОСЛЕ сборки волны: на дереве одной полосы
      # они другие, и ровно этим прежняя редакция этой шапки была ложной —
      # объявляла десять проверок и 371 утверждение, когда соседняя полоса уже
      # завела одиннадцатую.
      #
      # ПОЧЕМУ ШАГАМИ СУЩЕСТВУЮЩЕГО ЗАДАНИЯ, А НЕ СВОИМ — довод решающий и он
      # про НАСТРОЙКУ РЕПОЗИТОРИЯ: защита `main` требует контексты ПОИМЁННО, а
      # имя контекста — это `name` задания. Своё задание дало бы контекст ВНЕ
      # обязательного перечня: его красное было бы видно в сводке PR и слияния
      # НЕ блокировало — ровно то половинчатое состояние, которое ниже объявлено
      # у `change-graph-proofs`. Шаг существующего задания блокирует, и дыра
      # закрывается деревом, а не настройкой. Имя задания при этом НЕ
      # расширяется: переименование обязательного контекста оставило бы прежнее
      # имя навсегда в состоянии «ожидается» и заблокировало бы слияние.
      #
      # Предпосылок сверх уже созданных набору не нужно — предмет целиком в этом
      # дереве, клон продукта ему не требуется. Цена замерена `time` на этой
      # машине (замер 2026-09-21, ОДИННАДЦАТЬ проверок и одиннадцать частей
      # инъекции): `run-all.sh` — 1.7 с; `inject.sh` — ДВА прогона, 114 с и 127 с,
      # и названы оба: разброс между ними больше, чем вклад любой одной части,
      # поэтому одно число здесь было бы точнее, чем замер. Прежние 1.3 с и 73 с
      # сняты на десяти частях и оставлены тут провенансом, а не текущей ценой;
      # ещё раньше объявлялись 4.8 с при девяти частях на базе линии.
      # Платит не проверка, а песочницы: каждая проба разворачивает копию дерева.
      # Своё задание
      # оплачивалось бы выкладкой дерева и установкой разборщика — фиксированной
      # ценой, кратно большей самой работы.
      - name: rules-gate — закрепление правил за агентами сходится с объявлением
        run: bash scripts/rules-gate/run-all.sh
      - name: rules-gate доказан инъекцией — дефект краснеет, законный близнец молчит
        run: bash scripts/rules-gate/inject.sh

  hook-proofs:
    name: доказательства хуков инъекцией исполняются, а не лежат текстом
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0` — ПРЕДПОСЫЛКА, а не запас: хук свежести строит полосу
      # ствола ОБОИХ деревьев и, не найдя её у воркспейса, честно отказывается
      # выносить вердикт по нерезолвящимся координатам. Мелкий клон одной ветки
      # ссылки `origin/main` не создаёт вовсе, поэтому 18 инъекций переставали
      # срабатывать — и попадали в «разошлось» вместо «не выполнилось», то есть
      # набор краснел не по существу. Локально проба этого не показывает никогда:
      # там ствол в клоне есть.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # Обоим доказательствам нужно НАСТОЯЩЕЕ дерево продукта рядом: они гоняют
      # пробы по живым фрагментам, а не по выдуманным строкам. Без него docfresh
      # отказывается работать целиком, и с 2026-08-27 набор это ЧИТАЕТ: он
      # объявляет себя «не выполнилось» (код 2) и называет причину, вместо того
      # чтобы записывать молчание отказавшегося хука в расхождения. До той правки
      # копия без дерева продукта давала 41 «разошлось» и 32 вакуумных «молчит»
      # при полностью исправном хуке — то есть третья категория подавалась и
      # красным, и зелёным сразу (#329).
      #
      # `ref: main` — ствол продукта. Пин на долгоживущую интеграционную ветку снят
      # 2026-08-07 ОДНОВРЕМЕННО со слиянием, ровно как предписывал стоявший здесь
      # комментарий: ствол опубликован прямо в main (1306 коммитов, fast-forward),
      # ветка снята, и checkout по ней начал падать — три job'а воркспейса краснели
      # не по существу, а потому что sibling нечем было выложить.
      #
      # Предпосылка снятия ПРОВЕРЕНА, а не предположена: анализаторов сужения списков
      # на main — 18 файлов (прежний довод «0 против 18 на стволе» больше не держится),
      # корневой Makefile на месте (на нём держится ветка рассуждения в самом скрипте).
      # То есть сверять теперь есть с чем, и пин стал бы указывать в никуда.
      - name: checkout монорепо в project/kacho
        uses: actions/checkout@v7
        with:
          repository: PRO-Robotech/kacho
          ref: main
          path: project/kacho
          # Тоже ПРЕДПОСЫЛКА: три пробы строят вход из ИСТОРИИ дерева продукта
          # (предок вершины, отставшая локальная ветка, ключ кэша по вершине).
          # Мелкий клон её не несёт, и пробы честно объявляли «не выполнилось» —
          # то есть доказательство было неполным, а выглядело как расхождение.
          # Локально этого не видно: там клон полный, и набор сходится целиком.
          # Числа проб здесь намеренно НЕ выписаны: набор печатает своё число сам,
          # а выписанное устаревает молча при первой же добавленной пробе.
          fetch-depth: 0
      # Разборщик YAML — ПРЕДПОСЫЛКА одной из проб, а не удобство. Без него
      # страж классов честно объявляет пропуск («разборщик недоступен»), и проба,
      # которая ждёт от него находки, докладывает «дефект прошёл». То есть в
      # чистом окружении конвейера эта проверка не срабатывала НИ РАЗУ, а её
      # красный вердикт читался как дефект стража — хотя стражу нечем было читать.
      - name: разборщик YAML для стража классов
        run: python3 -m pip install --quiet PyYAML
      - name: shellcheck пиннутой версии (local == CI)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          # Версия печатается в вердикт: без неё «зелено» не несёт с собой, чем
          # именно оно получено, и следующее расхождение снова будет невидимым.
          shellcheck --version | sed -n 's/^version: /установлен shellcheck /p'
      - name: shellcheck hook scripts (strict)
        run: shellcheck -x scripts/hook-proofs.sh .claude/hooks/*.sh .claude/hooks/*/prove.sh
      - name: hook-proofs
        run: bash scripts/hook-proofs.sh

  vault-gate:
    name: записки хранилища знаний сверены с деревом продукта
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck пиннутой версии (local == CI)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | sed -n 's/^version: /установлен shellcheck /p'
      # Гейт выводит запрещённые потребителю механизмы ИЗ ДЕРЕВА монорепо — из
      # анализаторов сужения списков. Без монорепо выводить не из чего, и гейт
      # отвечает VOID (код 2), а не «чисто»: неразличение этих исходов и есть тот
      # класс, который он ловит.
      #
      # `ref: main` — пин на интеграционную ветку снят 2026-08-07 вместе со слиянием.
      # Довод, ради которого он стоял («на main анализаторов ЕЩЁ НЕТ: 0 файлов против
      # 18 на стволе»), исчерпан замером: на main их 18. Ранний снос пина не «прошёл бы
      # тихо» — гейт сказал бы VOID и уронил джобу, поэтому снятие безопасно проверяемо.
      - name: checkout монорепо в project/kacho
        uses: actions/checkout@v7
        with:
          repository: PRO-Robotech/kacho
          ref: main
          path: project/kacho
      - name: shellcheck vault-gate (strict)
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck && shellcheck -x -- scripts/vault-gate/*.sh
      # Сначала — доказательство, что гейт СПОСОБЕН упасть и способен смолчать.
      # Гейт, чью работоспособность не доказали, отчитывается зелёным одинаково
      # и когда всё хорошо, и когда он сломан.
      - name: vault-gate доказывает свою работоспособность
        run: KACHO_MONOREPO="$PWD/project/kacho" ./scripts/vault-gate/inject.sh
      - name: записки не выдают снятый механизм за текущий
        run: KACHO_MONOREPO="$PWD/project/kacho" ./scripts/vault-gate/run-all.sh

  doc-commands:
    name: quoted make commands run from the monorepo root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # Needs the monorepo checked out beside the workspace: the check reads the
      # real Makefiles under project/kacho and asserts every make command quoted in
      # docs/ resolves against them. Without it there is nothing to check against,
      # and the script says so instead of passing vacuously.
      #
      # `ref: main` — пин на интеграционную ветку снят 2026-08-07 вместе со слиянием.
      #
      # Довод, ради которого он стоял, стоит сохранить: пока `main` был заморожен
      # позади ствола, проверка читала ЕГО Makefile'ы и отвечала про них — замер
      # 2026-08-05 давал 31 находку против `main` и 44 против ствола при трёх общих,
      # то есть 28 из 31 названных были ложными, а 41 настоящая не называлась вовсе.
      # Это и есть цена сверки не с тем деревом: гейт остаётся на вид исправным.
      # Отдельно проверено то, на чём держится целая ветка рассуждения в скрипте, —
      # КОРНЕВОЙ Makefile: на main он теперь есть.
      - name: checkout монорепо в project/kacho
        uses: actions/checkout@v7
        with:
          repository: PRO-Robotech/kacho
          ref: main
          path: project/kacho
      # Сначала — доказательство, что гейт СПОСОБЕН упасть, способен смолчать и
      # способен отличить «предмета нет» от «всё чисто». Гейт, чью работоспособность
      # не доказали, печатает один и тот же успех в обоих случаях.
      - name: гейт цитат доказывает свою работоспособность
        run: bash scripts/check-doc-commands-inject.sh
      - name: docs quote commands that exist
        run: python3 scripts/check-doc-commands.py

  skills-gate:
    name: оснастка не утверждает о дереве того, чего в нём нет
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck пиннутой версии (local == CI)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | sed -n 's/^version: /установлен shellcheck /p'
      # Набор существовал, но не звался НИОТКУДА: ни один job его не запускал, и
      # шесть проверок утверждений оснастки о дереве не исполнялись ни разу в
      # конвейере. Проверка, которую никто не гоняет, отличается от отсутствующей
      # только тем, что создаёт уверенность.
      #
      # Дерево продукта нужно `check-06`: он выводит раскладку каталогов
      # документации из ЧУЖОГО дерева. Без него проверка честно отвечает VOID, а
      # run-all отдаёт за VOID код 2 — то есть тихо зелёным это не станет.
      #
      # Клон выкладывается шагом ВЫШЕ именно затем, чтобы VOID здесь был
      # невозможен: с ws#458 код 2 не блокирует локальную отправку (там клона
      # может не быть вовсе), но в конвейере роняет job — предпосылку тут
      # создаёт сама job'а, и её отсутствие есть поломка, а не факт расписания.
      - name: checkout монорепо в project/kacho
        uses: actions/checkout@v7
        with:
          repository: PRO-Robotech/kacho
          ref: main
          path: project/kacho
      # СЕТЕВАЯ УСТАНОВКА — СО СВОИМ ПРЕДЕЛОМ (#278).
      #
      # Загрузка либо мгновенна, либо виснет насмерть: этот шаг однажды провисел
      # ДВА ЧАСА и держал запрос на слияние, а сводка показывала «идёт» —
      # неотличимо от честной очереди. Предел джобы такого не ловит, если его нет,
      # а без предела ШАГА не видно, что именно встало.
      - name: install shellcheck
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # СТАВИМ, ТОЛЬКО ЕСЛИ НЕТ. Образ ранера несёт shellcheck сам; шаг
          # существовал на случай, когда не несёт, и платил за это обращением к
          # зеркалам ПРИ КАЖДОМ прогоне — а зеркала и есть то, что виснет.
          if command -v shellcheck > /dev/null; then
            echo "shellcheck уже в образе: $(shellcheck --version | awk '/^version:/{print $2}')"
            exit 0
          fi
          echo "shellcheck в образе нет — ставлю"
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
      # Порог — `warning`: у набора есть замечания уровня info (кавычки вокруг
      # регулярных выражений, `A && B || C`), и они здесь намеренные. Порог назван
      # прямо, а не спрятан за `|| true`: глушение кода возврата скрыло бы и
      # «файла нет вовсе».
      - name: shellcheck skills-gate
        working-directory: scripts/skills-gate
        run: shellcheck -x --severity=warning -- *.sh
      # Сначала — доказательство, что гейт СПОСОБЕН упасть и способен смолчать.
      - name: skills-gate доказывает свою работоспособность
        run: bash scripts/skills-gate/inject.sh
      - name: утверждения оснастки сверены с деревом
        run: bash scripts/skills-gate/run-all.sh

  docs-gate:
    name: документы объявляют то, чем их измеряют
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `fetch-depth: 0` — предпосылка check-05, а не запас. Ведомость приёмок
      # продукта называет ревизию ВОРКСПЕЙСА, на которой вердикт прочитан, и
      # проверка читает документ `git show <ревизия>:docs/specs/<имя>` в ЭТОМ
      # дереве. Выкладка по умолчанию несёт ОДИН коммит: на ней не резолвится ни
      # одна запись, проверенных становится ноль, и набор отдаёт VOID — то есть
      # job краснеет не находкой, а несозданным условием.
      #
      # Запись, чья ревизия лежала на ветке ревью, а ветка с origin снята, не
      # резолвится и при полной глубине: это ТРЕТЬЯ КАТЕГОРИЯ, проверка называет
      # её отдельной строкой и в проверенные не засчитывает. Замер на ревизиях
      # origin (2026-09-16): записей 3, резолвятся 2, третья — `5024be89`,
      # `lane/acc-2117` на origin больше нет.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: shellcheck пиннутой версии (local == CI)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | sed -n 's/^version: /установлен shellcheck /p'
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # СЕТЕВАЯ УСТАНОВКА — СО СВОИМ ПРЕДЕЛОМ (#278).
      #
      # Загрузка либо мгновенна, либо виснет насмерть: этот шаг однажды провисел
      # ДВА ЧАСА и держал запрос на слияние, а сводка показывала «идёт» —
      # неотличимо от честной очереди. Предел джобы такого не ловит, если его нет,
      # а без предела ШАГА не видно, что именно встало.
      - name: install shellcheck
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # СТАВИМ, ТОЛЬКО ЕСЛИ НЕТ. Образ ранера несёт shellcheck сам; шаг
          # существовал на случай, когда не несёт, и платил за это обращением к
          # зеркалам ПРИ КАЖДОМ прогоне — а зеркала и есть то, что виснет.
          if command -v shellcheck > /dev/null; then
            echo "shellcheck уже в образе: $(shellcheck --version | awk '/^version:/{print $2}')"
            exit 0
          fi
          echo "shellcheck в образе нет — ставлю"
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: shellcheck docs-gate (strict)
        run: shellcheck -x -- scripts/docs-gate/*.sh
      # Дерево продукта выкладывается ЗДЕСЬ, потому что check-03 сверяет координату,
      # на которую ссылается держащее утверждение приёмки, — а координата живёт в
      # продукте. Без этого шага проверка объявляет «без предмета» на КАЖДОМ прогоне:
      # она присутствует, исполняется и не может ни подтвердить, ни опровергнуть
      # ничего. Предпосылке полагается СВОЁ УСЛОВИЕ, а не послабление проверке.
      # `fetch-depth: 0` — не запас, а предпосылка: check-03-acceptance-tree-claims
      # меряет числа приёмки НА НАЗВАННЫХ ЕЮ РЕВИЗИЯХ, а они историчны и с каждым
      # днём уезжают дальше от вершины (замер 2026-08-19: от 714 до 965 коммитов;
      # число тут ОРИЕНТИР — оно растёт само, предпосылка от него не зависит).
      # Выкладка по умолчанию несёт ОДИН коммит, и на ней не резолвится ни одна из
      # них — проверено прогоном на клоне глубины 1: находок 16 из 16. Полная
      # история резолвит все, потому что каждая — предок `main`.
      - name: checkout монорепо в project/kacho
        uses: actions/checkout@v7
        with:
          repository: PRO-Robotech/kacho
          ref: main
          fetch-depth: 0
          path: project/kacho
      # ВТОРОЕ дерево предмета. Служба доступа вынесена из монорепо отдельным
      # репозиторием (`kacho#2598`): путей `services/iam/` на стволе продукта ноль,
      # а пробы, на которые ссылается приёмка KAN-AUTHN-1, живы — в `kaname`.
      # Координата называет свой ДОМ, и `check-03-holding-claim-resolves` резолвит
      # его по идентичности в том числе клоном `project/<имя>`. Без этого шага три
      # координаты выходят ТРЕТЬЕЙ КАТЕГОРИЕЙ на каждом прогоне: набор отдаёт 2, и
      # вердикт по ним не выносится никогда — то есть «дом назван» стало бы способом
      # не проверять. Предпосылке полагается своё условие, а не послабление проверке.
      # `fetch-depth: 1` здесь достаточно: у этого дерева спрашивается ВЕРШИНА ствола,
      # а не историческая ревизия (ревизии меряет `check-03-acceptance-tree-claims`, и
      # он читает дерево продукта).
      - name: checkout репозитория службы в project/kaname
        uses: actions/checkout@v7
        with:
          repository: PRO-Robotech/kaname
          ref: main
          path: project/kaname
      # Сначала — доказательство, что гейт СПОСОБЕН упасть и способен смолчать.
      # Гейт, чью работоспособность не доказали, отчитывается зелёным одинаково
      # и когда всё хорошо, и когда он сломан.
      - name: docs-gate доказывает свою работоспособность
        run: ./scripts/docs-gate/inject.sh
      # Доказательства разложены по проверкам, как в наборе vault-gate. Шаг стоит
      # ЗДЕСЬ, а не в отчёте на словах: проба, которую не прогоняет никто, — та же
      # форма без содержания, что и гейт, чью работоспособность не доказали.
      - name: закрепления приёмки — гейт доказан инъекцией
        run: KACHO_MONOREPO="$PWD/project/kacho" ./scripts/docs-gate/inject-03.sh
      # Второй дом приёмок — дерево продукта. Прогоны здесь ТРИ, а не два: на
      # целом дереве молчат оба гейта, дефект второго дома роняет только check-04,
      # дефект первого — только check-01. Без третьего молчание соседа было бы
      # неотличимо от молчания мёртвого.
      - name: вердикт приёмки дерева продукта — гейт доказан инъекцией
        run: KACHO_MONOREPO="$PWD/project/kacho" ./scripts/docs-gate/inject-04.sh
      # Ведомость приёмок — третий предмет набора, и её гейт доказывается так же,
      # как два соседних. Инъекция синтетическая и своего дерева продукта не
      # требует: она поднимает одноразовое со своим `origin/main`.
      - name: ведомость приёмок продукта — гейт доказан инъекцией
        run: ./scripts/docs-gate/inject-05.sh
      - name: вердикт приёмки и состояние записки читаются машинно
        run: ./scripts/docs-gate/run-all.sh

  authz-fixtures-lint:
    name: authz-fixtures bootstrap — lint (KAC-122)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck пиннутой версии (local == CI)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | sed -n 's/^version: /установлен shellcheck /p'
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: smoke JWT minter
        run: |
          python3 tests/authz-fixtures/setup-jwt.py --secret test-secret --sub user@example.com --exp-hours 1 \
            | python3 -c "import sys; t=sys.stdin.read(); parts=t.split('.'); assert len(parts)==3, f'jwt parts={len(parts)}'"
          python3 tests/authz-fixtures/setup-jwt.py --secret test-secret --bulk --exp-hours 1 \
            | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); assert set(d.keys())>={'jwtBootstrap','jwtNoBindings','jwtInvitee'}, list(d.keys())"
      - name: smoke patch-env
        run: |
          # Создать dummy fixtures + env, патчнуть, проверить что ключи добавились
          cat > /tmp/fixtures.json <<JSON
          {"foo":"bar","baz":42}
          JSON
          cat > /tmp/env.json <<JSON
          {"id":"x","name":"y","values":[{"key":"existing","value":"v1","type":"default","enabled":true}]}
          JSON
          python3 tests/authz-fixtures/patch-env.py /tmp/fixtures.json /tmp/env.json
          python3 -c "import json; d=json.load(open('/tmp/env.json')); keys={v['key'] for v in d['values']}; assert keys=={'existing','foo','baz'}, keys"
      - name: shellcheck setup.sh
        run: shellcheck tests/authz-fixtures/setup.sh || true   # informational

  # ── ДОРОГАЯ ПОЛОСА КОНТУРА ИЗМЕНЕНИЙ (SDD-1) ────────────────────────────────
  #
  # ПОЧЕМУ ОТДЕЛЬНОЕ ЗАДАНИЕ, А НЕ ШАГ В ХУКЕ ОТПРАВКИ. Оснастку контура до
  # ws#504 не звало НИЧТО: хук выводит перечень глобом `scripts/*/run-all.sh`, а
  # каталога контура в этом выводе не было — молча и без строки в переписи. Две
  # поломки прожили на стволе незамеченными. Разделение сделано по ЗАМЕРУ:
  # дешёвая полоса (58 с) уехала в набор `scripts/change-graph-gate/run-all.sh`,
  # который хук подхватывает сам; дорогая — сюда, потому что 17 минут на каждую
  # отправку воркспейса означали бы, что хук начнут обходить.
  #
  # Логика полосы живёт в СКРИПТЕ, а не в этом объявлении: блок `run:`
  # исполняется под `bash -e`, и код возврата оборвал бы шаг молча, до любой
  # развилки. Что конвейер зовёт ИМЕННО этот скрипт и что процесс срабатывает на
  # `main`, держит `scripts/change-graph-gate/check-03-ci-calls-every-artifact-of-the-set.sh`
  # — он читает разобранный YAML, а не подстроку: имя скрипта стоит и в этом
  # комментарии.
  change-graph-proofs:
    name: оснастка контура изменений способна упасть, а не только зеленеет
    runs-on: ubuntu-latest
    # 17.3 мин замерено; предел взят с запасом на медленный ранер, но конечным:
    # прогон, снятый по пределу, — третья категория исхода, и она обязана быть
    # отличима от красного по строке, а не по времени ожидания.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: разборщик YAML — fixtures контура объявлены YAML
        run: python3 -m pip install --quiet PyYAML
      # Конвейер обязан быть НАДМНОЖЕСТВОМ хука, а не дополнением к нему: обход
      # хука объявлен законным (`KACHO_SKIP_PREPUSH=1`, `--no-verify`), и без
      # этого шага дешёвую полосу не гонял бы никто.
      - name: дешёвая полоса — та же, что подхватывает хук отправки
        run: bash scripts/change-graph-gate/run-all.sh
      - name: набор доказан инъекцией — дефект краснеет, законный близнец молчит
        run: bash scripts/change-graph-gate/inject.sh
      - name: дорогая полоса — доказательства падучести контура
        run: bash scripts/change-graph-gate/prove-all.sh
