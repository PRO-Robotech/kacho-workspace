name: ci
# КОГДА КОНВЕЙЕР ЗАПУСКАЕТСЯ — решение владельца 2026-10-01 (ws#886): «обычный
# PR-конвейер» — `ci.yaml` запускается на `pull_request` в `main`, его задания
# становятся обязательными контекстами защиты `main` (настройка администратора),
# `scripts/merge-readiness.sh` работает стандартно, по контекстам. Цена, принятая
# владельцем: каждый PR воркспейса гоняет конвейер (~20–30 мин).
#
# Этим ОТОЗВАНО решение 2026-09-20 «на любом бранче конвейер не активен» (ws#715):
# при нём ни одно событие дерева конвейер не поднимало, обязательные контексты были
# сняты с защиты, и PR вливались при нуле машинных проверок (#715, #763, #768,
# #806, #809).
#
# СОБЫТИЙ ТРИ, и каждое несёт своё:
#   pull_request (base `main`) — производит контексты, которых требует защита;
#   push (`main`) — перепроверяет ствол после вливания: прогон PR судил дерево
#     ветки, а не результат слияния с успевшим уйти вперёд стволом;
#   workflow_dispatch — ручной прогон любой ветки, когда он действительно нужен.
#
# ТРИГГЕРЫ СУЖЕНЫ ПО ВЕТКЕ (решение владельца 2026-08-12, #282): прогон тратится на
# PR в ствол и на сам ствол, а не на каждую ветку дважды. `pull_request` обязан
# нести `main` в `branches` и НЕ обязан сужаться по `paths`: контекст, который не
# начался, не зеленеет и не краснеет, а остаётся «ожидается» — и слияние
# блокируется навсегда. Оба условия и сверку перечня обязательных контекстов с
# заданиями ниже держит `scripts/tooling-gate/check-05-workflow-triggers-narrowed.sh`
# (сетевая половина — ручкой `KACHO_BRANCH_PROTECTION_CHECK=1`), доказанный
# инъекцией в обе стороны.
#
# ИМЯ КОНТЕКСТА — `name:` задания, а без него — ключ задания. Перечень
# обязательных контекстов защиты выставляет администратор; дерево его не держит, и
# предикат остатка — сверка перечня с заданиями:
#
#   gh api repos/PRO-Robotech/kacho-workspace/branches/main/protection \
#     --jq '.required_status_checks.contexts[]'
#
# Секретов задания не читают: соседние деревья (`PRO-Robotech/kacho`,
# `PRO-Robotech/kaname`) публичны и берутся токеном по умолчанию, поэтому PR из
# любой ветки получает те же задания, что и ствол.
#
# ВЕРДИКТ PR В ВЕТКУ БЕЗ ОБЯЗАТЕЛЬНЫХ КОНТЕКСТОВ (ws#788). PR в ветку эпика или
# волны событие `pull_request` не поднимает — оно сужено по `main`, — поэтому
# вердикт такого PR — check-runs ручного прогона этого процесса на его голове, а
# не `statusCheckRollup`: запуск — `gh workflow run ci.yaml -R
# PRO-Robotech/kacho-workspace --ref <ветка>`, чтение —
# `scripts/merge-readiness.sh PRO-Robotech/kacho-workspace <PR>`. Прогона на
# голове нет — «не выполнилось», а не зелёное. PR в `main` судится обязательными
# контекстами, и ручной прогон их не заменяет (ws#886): путь выбирает защита
# базы, а не имя репозитория.
#
# ДО ОТПРАВКИ ВЕТКУ СУДИТ ХУК ОТПРАВКИ ВОРКСПЕЙСА. Перечень наборов он выводит из
# дерева (`git ls-files 'scripts/*/run-all.sh'`), рукописного списка нет; число
# здесь не выписано, потому что меняется при каждом заведённом наборе — предикат
# тот же. Он гоняет МЕНЬШЕ, чем задания ниже: у гейтовых наборов не зовутся
# `inject.sh`, не идут `shellcheck` внутри job'ов и не идут job'ы целиком (линт
# оболочек и `bats`, доказательства хуков, проба фикстур). Их гонит конвейер PR в
# `main` либо ручной прогон. Гейт цитируемых команд хук исполняет с ws#816 —
# проверкой набора docs-gate `scripts/docs-gate/check-09-quoted-make-commands-resolve.sh`.
#
# Версия анализатора объявлена ОДИН РАЗ на весь процесс. Прежде её выбирал образ
# ранера (`apt-get install shellcheck`), и вердикт принадлежал не дереву, а
# картинке: локальная 0.11 давала SC2329 на объявлении функции под `trap`,
# ранерная — SC2317 на каждой строке её тела. Одно объявление означает, что
# расхождение между заданиями невозможно by construction, а не проверяется.
env:
  SHELLCHECK_VERSION: "0.11.0"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  bats-and-shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Песочницы проб переносят корневую подпись в свой HOME (ws#785); у ранера её нет.
      - name: корневая подпись ранера — учётная запись запустившего прогон
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
      - name: install bats-core
        run: sudo apt-get update -qq && sudo apt-get install -y bats
      - name: shellcheck пиннутой версии (local == CI)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          # Версия печатается в вердикт: без неё «зелено» не несёт с собой, чем
          # именно оно получено, и следующее расхождение снова будет невидимым.
          shellcheck --version | sed -n 's/^version: /установлен shellcheck /p'
      - name: shellcheck core bash scripts
        # `|| true` глушит ЗАМЕЧАНИЯ линта — и вместе с ними глушил бы «файла нет
        # вовсе». Существование каждого из этих трёх имён утверждает отдельно
        # набор tooling-gate (задание `tooling-gate`), поэтому исчезновение файла
        # остаётся громким.
        run: shellcheck bootstrap.sh sync-all.sh tests/test_helper.bash || true   # informational
      - name: shellcheck tooling-gate scripts (strict)
        working-directory: scripts/tooling-gate
        run: shellcheck -x -- *.sh
      # Линт наборов, чьи задания звали их поимённо до ws#753 (прогон и
      # доказательство теперь исполняют задания наборов ниже выводом перечня по
      # заданиям, линта в них нет): шаги перенесены ДОСЛОВНО, со своим
      # порогом у каждого набора — сменить порог значило бы сменить предмет.
      # Вторую установку анализатора (`apt-get install shellcheck`, ставившую
      # версию дистрибутива поверх пина) шаг больше не несёт (ws#464): пин выше
      # остаётся ЕДИНСТВЕННОЙ установкой, а не побеждает по порядку PATH.
      - name: shellcheck vault-gate (strict)
        run: shellcheck -x -- scripts/vault-gate/*.sh
      - name: shellcheck residue-census (strict)
        run: shellcheck -x -- scripts/residue-census/*.sh
      - name: shellcheck remote-heavy (strict)
        run: shellcheck -x -- scripts/remote-heavy/*.sh
      # Порог — `warning`: у набора есть замечания уровня info (кавычки вокруг
      # регулярных выражений, `A && B || C`), и они здесь намеренные. Порог назван
      # прямо, а не спрятан за `|| true`: глушение кода возврата скрыло бы и
      # «файла нет вовсе».
      - name: shellcheck skills-gate
        working-directory: scripts/skills-gate
        run: shellcheck -x --severity=warning -- *.sh
      - name: shellcheck docs-gate (strict)
        run: shellcheck -x -- scripts/docs-gate/*.sh
      - name: shellcheck suites-gate и общей библиотеки наборов (strict)
        run: shellcheck -x -- scripts/suites-gate/*.sh scripts/lib/*.sh
      - name: run bats tests
        # Перечень явный, а не `tests/*.bats`: под маской исчезнувший файл просто
        # перестаёт исполняться, и суита остаётся зелёной с меньшим объёмом.
        # Явное имя ломается заметно, а существование каждого имени отдельно
        # утверждает набор tooling-gate (задание `tooling-gate` ниже).
        run: bats tests/bootstrap.bats tests/sync-all.bats


  # ── НАБОРЫ ПРОВЕРОК: ЗАДАНИЕ НА КОНТЕКСТ, ПРИНАДЛЕЖНОСТЬ ОБЪЯВЛЯЕТ НАБОР ──────
  #
  # Прежде у наборов были свои задания, и каждое звало СВОЙ набор поимённо. Хук
  # отправки выводил перечень глобом и видел все наборы, конвейер — только
  # выписанные: набор, заведённый в дереве (`crossrepo-gate`), на стволе не
  # исполнялся, и это не краснело ничем (ws#753, ws#817). Затем перечень стал
  # выводиться одним заданием на все наборы — и защита `main`, которая требует
  # контексты ПОИМЁННО, перестала получать четыре из них: имя контекста — `name:`
  # задания, и задание на все наборы производит одно имя вместо требуемых
  # (возврат по #816). Слияние встало бы до правки защиты.
  #
  # ОБА ИНВАРИАНТА СРАЗУ. Задания ниже несут имена контекстов, которых требует
  # защита, а какие наборы каждое исполняет, решает НЕ этот файл: набор объявляет
  # своё задание файлом `scripts/<набор>/ci-job`, и задание исполняет выводом
  # перечня (`scripts/lib/run-suites.sh --job "$GITHUB_JOB"`) ровно объявивших его.
  # Перечень наборов выводится из индекса git (`scripts/lib/suites.py`), выписанного
  # списка в конвейере нет; набор без объявления, объявление несуществующего задания
  # и задание, переставшее звать вывод, роняют КАЖДОЕ задание — каждое прежде своего
  # прогона спрашивает `scripts/lib/ci_suites.py`, покрывает ли разметка всё дерево.
  # Статически то же держит `scripts/suites-gate/check-04-ci-calls-every-suite.py`;
  # что защита требует только производимые здесь имена — сетевая половина
  # `scripts/tooling-gate/check-05-workflow-triggers-narrowed.sh`.
  #
  # ПРЕДПОСЫЛКИ — ОДНИ НА ВСЕ НАБОРЫ, объединением, а не перечнем по набору: их дом —
  # локальное действие `.github/actions/suite-prerequisites` (подпись ранера,
  # разборщик YAML, клоны продукта с полной историей); полную историю воркспейса
  # выкладывает `actions/checkout` задания. Набор, заведённый завтра, получает их
  # сам, в каком бы задании он ни объявил себя.
  #
  # VOID ЗДЕСЬ — ПОЛОМКА (`--void-is-failure`): предпосылки создаёт само задание,
  # и набор без предмета означает, что сломалось создание условия. Локально код
  # 2 остаётся своим — там клона продукта может не быть вовсе.
  #
  # ДОКАЗАТЕЛЬСТВО ПЕРВЫМ (`--proofs`): `inject.sh` каждого набора исполняется
  # перед его прогоном — гейт, чью способность упасть не доказали, отчитывается
  # зелёным одинаково и когда исправен, и когда сломан. Части доказательства
  # (`inject-<N>*.sh`) зовёт вход набора сам.
  #
  # ПРЕДЕЛЫ — по замеру прогона задания на машине разработки 2026-10-01 (команда
  # замера — `bash scripts/lib/run-suites.sh --proofs --void-is-failure --job <ключ>`
  # с клонами продукта рядом, длительность — разность `date +%s`; у каждого задания
  # число своё, оно стоит у его предела), с запасом: замер не больше 70 % предела.
  # В конвейере эти задания ещё не замерены: первый прогон мерится длительностью
  # из `actions/runs/<N>/jobs`, и предел приводится к замеру тем же изменением.
  tooling-gate:
    name: конвейер и агенты не утверждают о дереве того, чего в нём нет
    runs-on: ubuntu-latest
    # замер на машине разработки: 759 с
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/suite-prerequisites
      - name: наборы задания и их доказательства — разметка выведена из дерева
        run: KACHO_MONOREPO="$PWD/project/kacho" bash scripts/lib/run-suites.sh --proofs --void-is-failure --job "$GITHUB_JOB"
      # Инструмент расписания полос (`flow-acceleration.md` §«Раздача») — не набор:
      # `run-all.sh` у него нет, потому что маршрутов работ в стволе воркспейса
      # может не быть вовсе, и хук отправки получал бы «без предмета» на каждой
      # отправке; выводом перечня он поэтому не исполняется и зовётся шагом. Его
      # приёмка — известный пример и отказы на синтетике.
      - name: расписание полос считает известный пример и отказывает на цикле
        run: bash scripts/lane-schedule/inject.sh
      # Перепись следов прогона (`testing.md` §«Прогон не оставляет следов», ws#967) —
      # инструмент приёмки, не набор: `run-all.sh` у неё нет, потому что «следов 0»
      # судится на прогоне полосы, а не на дереве. Здесь доказывается, что сравнение
      # способно назвать след, смолчать на близнеце и отличить «сравнивать нечего».
      - name: перепись следов прогона называет след и не путает пустое с чистым
        run: bash scripts/residue-census/inject.sh
      # Детектор застоя полос (ws#1001) — инструмент диспетчера, не набор: его предмет —
      # журналы живой сессии, которых у ранера нет. Доказательство гонит прибор и хук
      # stall-signal на подложенной сессии: застой — код 1 с перечнем, близнец — 0,
      # нечитаемое — 2.
      - name: детектор застоя называет застой и не путает нечитаемое с чистым
        run: bash scripts/stall-census-inject.sh
      # Чтение CI (ws#1006) — инструмент шаблона волны, не набор: его предмет — PR на
      # площадке. Доказательство гонит ci-read.sh против двойника gh на ответах о
      # kacho#3140: неполный набор (30 из 68) и идущие прогоны — 3, устаревшая база — 4,
      # красное — 1, нечитаемое и пара вне ведомости — 2, полный зелёный — 0.
      - name: чтение CI не называет зелёным неполный набор и устаревшую базу
        run: bash scripts/ci-read-inject.sh
      # Тяжёлый прогон во внешнем кластере (ws#984) — инструмент, не набор: предмет
      # его — кластер, которого у ранера нет. Доказательство гонит run.sh против
      # двойника kubectl: ns снимается на успехе, падении команды, TERM и OOM, код
      # команды доходит, адрес кластера в вывод не попадает, ns kacho и чужое ns —
      # отказ.
      - name: тяжёлый прогон в кластере снимает своё ns на каждом исходе
        run: bash scripts/remote-heavy/inject.sh
      # Мутационный прогон того же инструмента (`mutants.py`, ~11 мин) вынесен в
      # задание `lane-schedule-mutants` ниже (Д55, ws#884): шагом этого задания он
      # обрывал всё задание по `timeout-minutes` (прогон 36783305602 — снят на
      # 5 мин 13 с шага), и вместе с ним не исполнялся rules-gate.


  vault-gate:
    name: записки хранилища знаний сверены с деревом продукта
    runs-on: ubuntu-latest
    # замер на машине разработки: 155 с
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/suite-prerequisites
      - name: наборы задания и их доказательства — разметка выведена из дерева
        run: KACHO_MONOREPO="$PWD/project/kacho" bash scripts/lib/run-suites.sh --proofs --void-is-failure --job "$GITHUB_JOB"


  skills-gate:
    name: оснастка не утверждает о дереве того, чего в нём нет
    runs-on: ubuntu-latest
    # замер на машине разработки: 40 с
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/suite-prerequisites
      - name: наборы задания и их доказательства — разметка выведена из дерева
        run: KACHO_MONOREPO="$PWD/project/kacho" bash scripts/lib/run-suites.sh --proofs --void-is-failure --job "$GITHUB_JOB"


  docs-gate:
    name: документы объявляют то, чем их измеряют
    runs-on: ubuntu-latest
    # замер на машине разработки: 138 с
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/suite-prerequisites
      - name: наборы задания и их доказательства — разметка выведена из дерева
        run: KACHO_MONOREPO="$PWD/project/kacho" bash scripts/lib/run-suites.sh --proofs --void-is-failure --job "$GITHUB_JOB"


  # ── НАБОРЫ, СВЕРЯЮЩИЕ СТВОЛЫ ТРЁХ ПРОДУКТОВ (ws#724, возврат check-verifier) ─
  #
  # `foundation-candidates`, `comment-language-gate` и `crossrepo-gate` судят не
  # это дерево, а стволы `kacho`, `kaname` и `corelib` рядом с ним. Задание
  # исполняет их выводом перечня по заданию (каждый объявил его в своём `ci-job`),
  # а три клона с полной историей создаёт `.github/actions/suite-prerequisites`:
  # ведомости обоих храповиков закрепляют РЕВИЗИЮ ствола и спрашивают, предок ли
  # она ствола, — мелкий клон не несёт ни ревизии, ни истории.
  #
  # Цена своего задания названа вслух: с решения владельца 2026-10-01 (ws#886)
  # защита `main` требует контексты поимённо, а имени этого задания в перечне нет —
  # его красное видно в сводке PR, но слияния не блокирует, пока администратор не
  # внесёт имя (предикат — `gh api …/branches/main/protection` в шапке).
  product-trunk-gates:
    name: наборы, сверяющие стволы продуктов, судят их, а не пустоту
    runs-on: ubuntu-latest
    # замер на машине разработки: 105 с
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/suite-prerequisites
      - name: наборы задания и их доказательства — разметка выведена из дерева
        run: KACHO_MONOREPO="$PWD/project/kacho" bash scripts/lib/run-suites.sh --proofs --void-is-failure --job "$GITHUB_JOB"


  # ── МУТАЦИОННЫЙ ПРОГОН РАСПИСАНИЯ ПОЛОС — СВОИМ ЗАДАНИЕМ (Д55, ws#884) ──────
  #
  # Приёмка ws#884 нашла порчи инструмента, на которых `inject.sh` оставался
  # зелёным. `mutants.py` портит копию инструмента по одному решению за раз и
  # краснеет, если набор не покраснел хоть на одной порче. Прогон идёт ~11 мин,
  # поэтому живёт не в `tooling-gate` (там — наборы задания и быстрый `inject.sh`
  # расписания), а здесь, со своим лимитом.
  #
  # ФИЛЬТР ПУТЕЙ — ШАГОМ, А НЕ `paths:` ТРИГГЕРА: задание, которое не началось, не
  # зеленеет и не краснеет, а остаётся «ожидается» (check-05, утверждение C).
  # Здесь задание начинается ВСЕГДА и при нетронутом `scripts/lane-schedule/**`
  # завершается success строкой «пропущено: предмет не тронут». База сравнения:
  # `pull_request` — `base.sha` события; `push` — `before`. Базы нет (ручной
  # прогон, первая отправка ветки) или её коммита нет в клоне — прогон ИДЁТ:
  # неизвестное решается в сторону исполнения, а не пропуска. Сбой самого
  # `git diff` роняет шаг (`bash -e`) — тихо «не тронуто» он не станет.
  #
  # КОНТЕКСТ ВНЕ ОБЯЗАТЕЛЬНОГО ПЕРЕЧНЯ НЕ БЛОКИРУЕТ СЛИЯНИЕ (шапка процесса,
  # «ИМЯ КОНТЕКСТА»): красное этого задания останавливает PR, только если администратор
  # внёс его имя в обязательные контексты защиты `main`. Предикат —
  #   gh api repos/PRO-Robotech/kacho-workspace/branches/main/protection \
  #     --jq '.required_status_checks.contexts[]'
  lane-schedule-mutants:
    name: набор расписания полос краснеет на порче каждого решения инструмента
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: предмет тронут — scripts/lane-schedule против базы события
        id: subject
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "база сравнения у события «$EVENT» не определена — прогон идёт"
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "коммита базы $base в клоне нет — прогон идёт"
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD -- scripts/lane-schedule/)"
          if [ -n "$changed" ]; then
            printf 'тронуто против %s:\n%s\n' "$base" "$changed"
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "против $base в scripts/lane-schedule/ изменений нет"
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi
      - name: набор расписания краснеет на порче каждого решения инструмента
        if: steps.subject.outputs.touched == 'true'
        run: python3 scripts/lane-schedule/mutants.py
      - name: пропущено — предмет не тронут
        if: steps.subject.outputs.touched != 'true'
        run: |
          echo "пропущено: предмет не тронут — scripts/lane-schedule/** против базы события без изменений"

  hook-proofs:
    name: доказательства хуков инъекцией исполняются, а не лежат текстом
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0` — ПРЕДПОСЫЛКА, а не запас: хук свежести строит полосу
      # ствола ОБОИХ деревьев и, не найдя её у воркспейса, честно отказывается
      # выносить вердикт по нерезолвящимся координатам. Мелкий клон одной ветки
      # ссылки `origin/main` не создаёт вовсе, поэтому 18 инъекций переставали
      # срабатывать — и попадали в «разошлось» вместо «не выполнилось», то есть
      # набор краснел не по существу. Локально проба этого не показывает никогда:
      # там ствол в клоне есть.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Песочницы проб переносят корневую подпись в свой HOME (ws#785); у ранера её нет.
      - name: корневая подпись ранера — учётная запись запустившего прогон
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # Обоим доказательствам нужно НАСТОЯЩЕЕ дерево продукта рядом: они гоняют
      # пробы по живым фрагментам, а не по выдуманным строкам. Без него docfresh
      # отказывается работать целиком, и с 2026-08-27 набор это ЧИТАЕТ: он
      # объявляет себя «не выполнилось» (код 2) и называет причину, вместо того
      # чтобы записывать молчание отказавшегося хука в расхождения. До той правки
      # копия без дерева продукта давала 41 «разошлось» и 32 вакуумных «молчит»
      # при полностью исправном хуке — то есть третья категория подавалась и
      # красным, и зелёным сразу (#329).
      #
      # `ref: main` — ствол продукта. Пин на долгоживущую интеграционную ветку снят
      # 2026-08-07 ОДНОВРЕМЕННО со слиянием, ровно как предписывал стоявший здесь
      # комментарий: ствол опубликован прямо в main (1306 коммитов, fast-forward),
      # ветка снята, и checkout по ней начал падать — три job'а воркспейса краснели
      # не по существу, а потому что sibling нечем было выложить.
      #
      # Предпосылка снятия ПРОВЕРЕНА, а не предположена: анализаторов сужения списков
      # на main — 18 файлов (прежний довод «0 против 18 на стволе» больше не держится),
      # корневой Makefile на месте (на нём держится ветка рассуждения в самом скрипте).
      # То есть сверять теперь есть с чем, и пин стал бы указывать в никуда.
      - name: checkout монорепо в project/kacho
        uses: actions/checkout@v7
        with:
          repository: PRO-Robotech/kacho
          ref: main
          path: project/kacho
          # Тоже ПРЕДПОСЫЛКА: три пробы строят вход из ИСТОРИИ дерева продукта
          # (предок вершины, отставшая локальная ветка, ключ кэша по вершине).
          # Мелкий клон её не несёт, и пробы честно объявляли «не выполнилось» —
          # то есть доказательство было неполным, а выглядело как расхождение.
          # Локально этого не видно: там клон полный, и набор сходится целиком.
          # Числа проб здесь намеренно НЕ выписаны: набор печатает своё число сам,
          # а выписанное устаревает молча при первой же добавленной пробе.
          fetch-depth: 0
      # Соседний клон — ПРЕДПОСЫЛКА трёх проб docfresh (полоса соседних клонов,
      # секция G4): хук читает `corelib/**` из `project/corelib`. Без клона пробы
      # объявляют «не выполнилось» (код 2), а до ws#839 одна из них читалась
      # расхождением. Мелкий клон достаточен: пробам нужен индекс, а не история.
      - name: checkout соседнего клона в project/corelib
        uses: actions/checkout@v7
        with:
          repository: PRO-Robotech/corelib
          ref: main
          path: project/corelib
      # Разборщик YAML — ПРЕДПОСЫЛКА одной из проб, а не удобство. Без него
      # страж классов честно объявляет пропуск («разборщик недоступен»), и проба,
      # которая ждёт от него находки, докладывает «дефект прошёл». То есть в
      # чистом окружении конвейера эта проверка не срабатывала НИ РАЗУ, а её
      # красный вердикт читался как дефект стража — хотя стражу нечем было читать.
      - name: разборщик YAML для стража классов
        run: python3 -m pip install --quiet PyYAML
      - name: shellcheck пиннутой версии (local == CI)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          # Версия печатается в вердикт: без неё «зелено» не несёт с собой, чем
          # именно оно получено, и следующее расхождение снова будет невидимым.
          shellcheck --version | sed -n 's/^version: /установлен shellcheck /p'
      - name: shellcheck hook scripts (strict)
        run: shellcheck -x scripts/hook-proofs.sh .claude/hooks/*.sh .claude/hooks/*/prove.sh
      - name: hook-proofs
        run: bash scripts/hook-proofs.sh


  # Тот же гейт исполняет и задание `docs-gate` — проверкой набора docs-gate
  # (`scripts/docs-gate/check-09-quoted-make-commands-resolve.sh`, ws#816), и его
  # доказательство — частью `scripts/docs-gate/inject-09.sh`. Задание осталось
  # носителем своего имени контекста: защита `main` требует его поимённо (ws#886).
  doc-commands:
    name: quoted make commands run from the monorepo root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # Needs the monorepo checked out beside the workspace: the check reads the
      # real Makefiles under project/kacho and asserts every make command quoted in
      # docs/ resolves against them. Without it there is nothing to check against,
      # and the script says so instead of passing vacuously.
      #
      # `ref: main` — пин на интеграционную ветку снят 2026-08-07 вместе со слиянием.
      #
      # Довод, ради которого он стоял, стоит сохранить: пока `main` был заморожен
      # позади ствола, проверка читала ЕГО Makefile'ы и отвечала про них — замер
      # 2026-08-05 давал 31 находку против `main` и 44 против ствола при трёх общих,
      # то есть 28 из 31 названных были ложными, а 41 настоящая не называлась вовсе.
      # Это и есть цена сверки не с тем деревом: гейт остаётся на вид исправным.
      # Отдельно проверено то, на чём держится целая ветка рассуждения в скрипте, —
      # КОРНЕВОЙ Makefile: на main он теперь есть.
      - name: checkout монорепо в project/kacho
        uses: actions/checkout@v7
        with:
          repository: PRO-Robotech/kacho
          ref: main
          path: project/kacho
      # Сначала — доказательство, что гейт СПОСОБЕН упасть, способен смолчать и
      # способен отличить «предмета нет» от «всё чисто». Гейт, чью работоспособность
      # не доказали, печатает один и тот же успех в обоих случаях.
      - name: гейт цитат доказывает свою работоспособность
        run: bash scripts/check-doc-commands-inject.sh
      - name: docs quote commands that exist
        run: python3 scripts/check-doc-commands.py


  authz-fixtures-lint:
    name: authz-fixtures bootstrap — lint (KAC-122)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck пиннутой версии (local == CI)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | sed -n 's/^version: /установлен shellcheck /p'
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: smoke JWT minter
        run: |
          python3 tests/authz-fixtures/setup-jwt.py --secret test-secret --sub user@example.com --exp-hours 1 \
            | python3 -c "import sys; t=sys.stdin.read(); parts=t.split('.'); assert len(parts)==3, f'jwt parts={len(parts)}'"
          python3 tests/authz-fixtures/setup-jwt.py --secret test-secret --bulk --exp-hours 1 \
            | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); assert set(d.keys())>={'jwtBootstrap','jwtNoBindings','jwtInvitee'}, list(d.keys())"
      - name: smoke patch-env
        run: |
          # Создать dummy fixtures + env, патчнуть, проверить что ключи добавились
          cat > /tmp/fixtures.json <<JSON
          {"foo":"bar","baz":42}
          JSON
          cat > /tmp/env.json <<JSON
          {"id":"x","name":"y","values":[{"key":"existing","value":"v1","type":"default","enabled":true}]}
          JSON
          python3 tests/authz-fixtures/patch-env.py /tmp/fixtures.json /tmp/env.json
          python3 -c "import json; d=json.load(open('/tmp/env.json')); keys={v['key'] for v in d['values']}; assert keys=={'existing','foo','baz'}, keys"
      - name: shellcheck setup.sh
        run: shellcheck tests/authz-fixtures/setup.sh || true   # informational


  # ── ДОРОГАЯ ПОЛОСА КОНТУРА ИЗМЕНЕНИЙ (SDD-1) ────────────────────────────────
  #
  # ПОЧЕМУ ОТДЕЛЬНОЕ ЗАДАНИЕ, А НЕ ШАГ В ХУКЕ ОТПРАВКИ. Оснастку контура до
  # ws#504 не звало НИЧТО: хук выводит перечень глобом `scripts/*/run-all.sh`, а
  # каталога контура в этом выводе не было — молча и без строки в переписи. Две
  # поломки прожили на стволе незамеченными. Разделение сделано по ЗАМЕРУ:
  # дешёвая полоса (58 с) уехала в набор `scripts/change-graph-gate/run-all.sh`,
  # который хук подхватывает сам; дорогая — сюда, потому что 17 минут на каждую
  # отправку воркспейса означали бы, что хук начнут обходить.
  #
  # Логика полосы живёт в СКРИПТЕ, а не в этом объявлении: блок `run:`
  # исполняется под `bash -e`, и код возврата оборвал бы шаг молча, до любой
  # развилки. Что конвейер зовёт ИМЕННО этот скрипт (а дешёвую полосу и
  # доказательство набора — выводом перечня по этому заданию) и что процесс
  # срабатывает на `main`, держит
  # `scripts/change-graph-gate/check-03-ci-calls-every-artifact-of-the-set.sh`
  # — он читает разобранный YAML, а не подстроку: имя скрипта стоит и в этом
  # комментарии.
  #
  # ДЕШЁВАЯ ПОЛОСА — ЗДЕСЬ ЖЕ, под этим контекстом, которого требует защита `main`:
  # набор `change-graph-gate` объявил это задание (`scripts/change-graph-gate/ci-job`),
  # и задание исполняет его выводом перечня по заданию — как исполнялось до ws#753,
  # когда шаги стояли поимённо. Под заданием без обязательного контекста красное
  # дешёвой полосы слияния бы не останавливало.
  change-graph-proofs:
    name: оснастка контура изменений способна упасть, а не только зеленеет
    runs-on: ubuntu-latest
    # 17.3 мин замерено на дорогой полосе; предел взят с запасом на медленный
    # ранер, но конечным: прогон, снятый по пределу, — третья категория исхода, и
    # она обязана быть отличима от красного по строке, а не по времени ожидания.
    # Дешёвая полоса с доказательством — 147 с на машине разработки (замер и его
    # команда — шапка заданий наборов выше); вместе с дорогой полосой предел 35.
    timeout-minutes: 35
    steps:
      # Предпосылки обеих полос — одни на все наборы (`.github/actions/suite-prerequisites`):
      # клон фундамента с полной историей нужен `check-05` дешёвой полосы (записи,
      # перенесённые из corelib, признаются по якорю, опубликованному веткой или
      # тегом, — мелкий клон их не несёт), история воркспейса и клон продукта —
      # `check-04` (освобождения ролей в пакетах `docs/changes/*/`). Нужны ли они
      # ДОРОГОЙ полосе — не измерено: по коду её точки входа клона продукта не
      # читают; прогона без них не было (снять — отдельным изменением с прогоном).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/suite-prerequisites
      # Конвейер обязан быть НАДМНОЖЕСТВОМ хука, а не дополнением к нему: обход
      # хука объявлен законным (`KACHO_SKIP_PREPUSH=1`, `--no-verify`). Дешёвую
      # полосу (`run-all.sh`) и доказательство набора (`inject.sh`) исполняет
      # вывод перечня по этому заданию; поимённых вызовов НЕТ: второй выписанный
      # дом одного вызова расходился бы с первым молча (ws#753). Что вывод их
      # действительно исполняет — набор есть в переписи, объявил это задание,
      # ключ `--proofs` стоит — и что поимённого дубля нет, держит
      # `scripts/change-graph-gate/check-03-*`.
      - name: дешёвая полоса контура и её доказательство — выводом перечня по заданию
        run: KACHO_MONOREPO="$PWD/project/kacho" bash scripts/lib/run-suites.sh --proofs --void-is-failure --job "$GITHUB_JOB"
      - name: дорогая полоса — доказательства падучести контура
        run: bash scripts/change-graph-gate/prove-all.sh
