name: ci
on: [push, pull_request]
jobs:
  bats-and-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats-core + shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y bats shellcheck
      - name: shellcheck core bash scripts
        # `|| true` глушит ЗАМЕЧАНИЯ линта — и вместе с ними глушил бы «файла нет
        # вовсе». Существование каждого из этих трёх имён утверждает отдельно
        # job `tooling-gate`, поэтому исчезновение файла остаётся громким.
        run: shellcheck bootstrap.sh sync-all.sh tests/test_helper.bash || true   # informational
      - name: shellcheck freeze-gate scripts (strict)
        working-directory: scripts/freeze-gate
        run: shellcheck -x -- *.sh
      - name: shellcheck tooling-gate scripts (strict)
        working-directory: scripts/tooling-gate
        run: shellcheck -x -- *.sh
      - name: run bats tests
        # Перечень явный, а не `tests/*.bats`: под маской исчезнувший файл просто
        # перестаёт исполняться, и суита остаётся зелёной с меньшим объёмом.
        # Явное имя ломается заметно, а существование каждого имени отдельно
        # утверждает tooling-gate (job `tooling-gate` ниже).
        run: bats tests/bootstrap.bats tests/sync-all.bats tests/freeze-gate.bats

  tooling-gate:
    name: конвейер и агенты не утверждают о дереве того, чего в нём нет
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tooling-gate
        run: bash scripts/tooling-gate/run-all.sh
      - name: гейт доказан инъекцией — дефект краснеет, законный близнец молчит
        run: bash scripts/tooling-gate/inject.sh

  hook-proofs:
    name: доказательства хуков инъекцией исполняются, а не лежат текстом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      # Обоим доказательствам нужно НАСТОЯЩЕЕ дерево продукта рядом: они гоняют
      # пробы по живым фрагментам, а не по выдуманным строкам. Без него docfresh
      # честно отказывается работать (и это одна из его же проб), но остальные
      # пробы стали бы «НЕ ВЫПОЛНИЛОСЬ» — то есть набор ничего бы не доказал.
      - name: checkout monorepo into project/kacho
        uses: actions/checkout@v4
        with:
          repository: PRO-Robotech/kacho
          path: project/kacho
      - name: shellcheck hook scripts (strict)
        run: shellcheck -x scripts/hook-proofs.sh .claude/hooks/*.sh .claude/hooks/*/prove.sh
      - name: hook-proofs
        run: bash scripts/hook-proofs.sh

  doc-commands:
    name: quoted make commands run from the monorepo root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      # Needs the monorepo checked out beside the workspace: the check reads the
      # real Makefiles under project/kacho and asserts every make command quoted in
      # docs/ resolves against them. Without it there is nothing to check against,
      # and the script says so instead of passing vacuously.
      - name: checkout monorepo into project/kacho
        uses: actions/checkout@v4
        with:
          repository: PRO-Robotech/kacho
          path: project/kacho
      - name: docs quote commands that exist
        run: python3 scripts/check-doc-commands.py

  authz-fixtures-lint:
    name: authz-fixtures bootstrap — lint (KAC-122)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: smoke JWT minter
        run: |
          python3 tests/authz-fixtures/setup-jwt.py --secret test-secret --sub user@example.com --exp-hours 1 \
            | python3 -c "import sys; t=sys.stdin.read(); parts=t.split('.'); assert len(parts)==3, f'jwt parts={len(parts)}'"
          python3 tests/authz-fixtures/setup-jwt.py --secret test-secret --bulk --exp-hours 1 \
            | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); assert set(d.keys())>={'jwtBootstrap','jwtNoBindings','jwtInvitee'}, list(d.keys())"
      - name: smoke patch-env
        run: |
          # Создать dummy fixtures + env, патчнуть, проверить что ключи добавились
          cat > /tmp/fixtures.json <<JSON
          {"foo":"bar","baz":42}
          JSON
          cat > /tmp/env.json <<JSON
          {"id":"x","name":"y","values":[{"key":"existing","value":"v1","type":"default","enabled":true}]}
          JSON
          python3 tests/authz-fixtures/patch-env.py /tmp/fixtures.json /tmp/env.json
          python3 -c "import json; d=json.load(open('/tmp/env.json')); keys={v['key'] for v in d['values']}; assert keys=={'existing','foo','baz'}, keys"
      - name: shellcheck setup.sh
        run: shellcheck tests/authz-fixtures/setup.sh || true   # informational
