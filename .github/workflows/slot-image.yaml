name: slot-image
# ОБРАЗ POD СЛОТА (ws#1482): scripts/remote-heavy/slot-image/Dockerfile под каждую версию go из
# scripts/remote-heavy/slot-image/go-versions — в docker.io/prorobotech/kacho-heavy-slot.
#
# ЛИЧНОСТЬ ОБРАЗА — digest, а не тег. run.sh (slot_image) берёт образ ТОЛЬКО как
# `<repo>@sha256:<digest>` со строки `<версия> sha256:<digest>` файла go-versions; тег
# `go<версия>-<12 знаков sha256 Dockerfile>-<12 знаков коммита>` — лишь для людей, и подменённый
# тег не выбирается никогда. Digest попадает в дерево только PR-ом в main (строку печатает
# задание publish). Строки digest нет — run.sh берёт golang:<версия> и ставит среду шагами
# подготовки, назвав причину строкой.
#
# СОБЫТИЯ (сужение — tooling-gate check-05): pull_request в `main`, push в `main`,
# workflow_dispatch. Задания два:
#   • verify — на pull_request: собирает образ под каждую версию БЕЗ `docker login` и без
#     секретов (исполняется workflow головы PR, поэтому секретов в нём нет ни в одном шаге);
#     правки образа в PR нет — сборки нет, строкой;
#   • publish — только push в main и workflow_dispatch с ref main, под environment
#     `slot-image`: учётка Docker Hub — секреты окружения (deployment branches = main), а не
#     организации. Версия с закреплённым digest, который есть в реестре, — сборки нет; иначе
#     сборка, публикация и строка `<версия> sha256:<digest>` для PR в main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slot-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Холодная сборка — около 4 мин на версию, три версии — около 12 мин; 30 мин — 40 %.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: образ слота собирается под каждую версию go (без публикации)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          d=scripts/remote-heavy/slot-image
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --quiet FETCH_HEAD HEAD -- "$d" .github/workflows/slot-image.yaml; then
            echo "правки образа слота в PR нет ($d, slot-image.yaml) — сборки нет"; exit 0
          fi
          n=0
          while read -r v _; do
            case "$v" in ''|'#'*) continue ;; esac
            [[ "$v" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::$d/go-versions: строка вне формы версии: «$v»"; exit 1; }
            n=$((n + 1))
            echo "собираю образ слота под go $v (без публикации)"
            docker build --pull --build-arg "GO_VERSION=$v" -t "slot-verify:go$v" "$d"
          done < "$d/go-versions"
          [ "$n" -gt 0 ] || { echo "::error::$d/go-versions: версий ноль — собирать нечего"; exit 1; }
          echo "версий $n собрано, публикации нет (pull_request)"

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: slot-image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: образ слота под каждую версию go — публикация и digest для дерева
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          d=scripts/remote-heavy/slot-image
          repo=docker.io/prorobotech/kacho-heavy-slot
          h="$(sha256sum "$d/Dockerfile" | cut -c1-12)"
          [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ] || { echo "::error::секретов Docker Hub в окружении slot-image нет — публиковать нечем"; exit 1; }
          printf '%s' "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin docker.io > /dev/null
          n=0; pin=""
          while read -r v dg _; do
            case "$v" in ''|'#'*) continue ;; esac
            [[ "$v" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::$d/go-versions: строка вне формы версии: «$v»"; exit 1; }
            n=$((n + 1))
            if [[ "${dg:-}" =~ ^sha256:[0-9a-f]{64}$ ]] && docker manifest inspect "$repo@$dg" > /dev/null 2>&1; then
              echo "go $v: digest $dg закреплён в дереве и есть в реестре — сборки нет"; continue
            fi
            t="$repo:go$v-$h-${SHA:0:12}"
            echo "go $v: digest в дереве ${dg:-не закреплён} — собираю $t"
            docker build --pull --build-arg "GO_VERSION=$v" -t "$t" "$d"
            docker push "$t"
            # RepoDigests docker пишет без «docker.io/»: судится имя репозитория, а не префикс реестра.
            got="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$t" | sed -n 's|^\(docker\.io/\)\{0,1\}prorobotech/kacho-heavy-slot@||p' | head -1)"
            [[ "$got" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest опубликованного $t не прочитан"; exit 1; }
            echo "опубликован $t как $repo@$got"
            pin="$pin$v $got"$'\n'
          done < "$d/go-versions"
          [ "$n" -gt 0 ] || { echo "::error::$d/go-versions: версий ноль — собирать нечего"; exit 1; }
          if [ -n "$pin" ]; then
            { echo "### Строки для $d/go-versions (PR в main)"; echo '```'; printf '%s' "$pin"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::закрепить в $d/go-versions PR-ом в main: $(tr '\n' ';' <<< "$pin")"
          fi
          echo "версий $n, Dockerfile $h"
