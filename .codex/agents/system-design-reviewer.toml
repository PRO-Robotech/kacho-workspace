| дифф вводит мутацию и Operation, ссылочные типы либо код отказа по линии резолва | `Skill rule-api-conventions` | `.claude/rules/api-conventions.md` §«Форма ресурса — flat message + Operations»; §«Имя ресурса: одна форма, пустого не бывает» (почему от id); §«By-lane code-split»; §«Reference-типы — 3-way naming»; §«Структура ресурсов — проектируем удобно» |
