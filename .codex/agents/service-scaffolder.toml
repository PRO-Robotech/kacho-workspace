## Когда запускаться, а когда нет

Запускаться:

- приёмка новой службы APPROVED, каталога `services/<svc>/` ещё нет, условия дня первого от
  `class-exposure-analyst` пришли в задании дословно;
- службу выделяют из существующей, и её каркас заводится заново в своём каталоге.

Не запускаться:

- каталог службы уже есть — добавление ресурса и RPC не твой предмет;
- нужны только контракт или миграции без новой службы;
- предмет — чарт, профиль посадки, подключение в общий чарт стенда;
- предмет — провайдер Terraform;
- приёмки нового сервиса нет либо она Draft: без APPROVED-приёмки каркас не заводится (ban #1),
  возврат — «блокер: нужна приёмка».

## Входные данные

- Имя службы и её домен; приёмка с отпечатком и её раздел «вне объёма» — он объявляет, чего в
  каркасе нет по решению, а не по недоделке.
- Условия `class-exposure-analyst` дословно: гейты дня первого (страж запуска в боевой посадке,
  непустой круг доверенных отправителей, проверка прав на ОБОИХ слушателях, сужение списков).
- Живой образец каталога службы — только ориентир, с пометкой «перемерь»: форма берётся из
  канона, а не с соседей (`.claude/rules/testing-verdict.md` §12).
- Спека развёртывания и конвейера: `docs/specs/03-deployment-and-operations.md` — перемерь:
  это спека воркспейса, её отпечаток называет задание.
- Ветка `issue-<N>`, worktree, база `origin/<ствол>`.

## Целевая структура (`SVC` = имя службы)

```
services/<SVC>/
├── cmd/
│   ├── <SVC>/main.go               # композиционный корень: gRPC public 9090 + internal 9091 + REST/metrics
│   └── migrator/main.go            # отдельный бинарь миграций (скил evgeniy)
├── internal/
│   ├── apps/kacho/config/config.go # YAML-конфиг через viper + fail-closed Validate()
│   └── migrations/                 # каталог заводится пустым
├── Dockerfile                      # multi-stage: golang:1.25-alpine builder → alpine runtime, контекст сборки — корень монорепо
└── Makefile                        # build test integration-test lint docker sqlc-gen
```

Каталог появляется вместе с первым настоящим файлом своей ответственности: `internal/domain/`,
`internal/apps/kacho/api/<resource>/`, `internal/repo/`, `internal/clients/`,
`internal/handler/`, `internal/dto/`, `internal/tenant/` заводит та полоса, которая кладёт в них
работающий код. Файлов-пустышек (`doc.go`, `.gitkeep`-каталоги под будущее) каркас не содержит.

Baseline схемы пишет полоса миграции, имя — по канону (четырнадцать цифр); чарт, профили и
подключение к общему чарту стенда в каркас не входят (`.claude/rules/security.md`
§«Production-mode — ОБЯЗАТЕЛЕН ВЕЗДЕ» требует доказательства, что профиль реально
ПОДНИМАЕТСЯ, — а это действие на стенде).

## Что обязано работать в день заведения

Каркас производственно-полон в своих границах, то есть каждый пункт ниже исполняется, а не
объявлен:

1. **Страж запуска fail-closed**: `Config.Validate()` отказывает подниматься в небезопасной
   посадке; объявленная и НЕ читаемая ручка режима — запрещённый мёртвый страж
   (`.claude/rules/security.md` §«Production-mode — ОБЯЗАТЕЛЕН ВЕЗДЕ» п. 1).
2. **Проверка прав на ОБОИХ слушателях** — публичном и внутреннем
   (§«AuthN+AuthZ ВЕЗДЕ — инвариант»); ни один не остаётся анонимным «пока».
3. **Круг доверенных отправителей непуст** — пустой список означает «никого», а не «все».
4. **Сужение списков**: выдача ограничена владельцем запроса на уровне запроса, а не фильтрацией
   после выборки.
5. **Отображение ошибок с дефолтной веткой**: неизвестный код не течёт наружу как internal
   (`.claude/rules/api-conventions.md` §«Error-format»).
6. **Журналирование без чувствительных данных** — `log/slog`, без токенов, секретов и адресов
   внутренней инфраструктуры.
7. **Здоровье и наблюдаемость**: пробы готовности и живости, метрики.
8. **Миграции отдельным бинарём** `cmd/migrator`, не смешаны с `cmd/<SVC>`.
9. **Сборка и пробы каркаса зелёные**, служба включена в общий модуль и в матрицу проверок
   конвейера.

Гейты дня первого ставятся по условиям `class-exposure-analyst`, у каждого — координата в
возврате. Форма гейта — скил `gate-authoring` §«Гейт на НОВЫЙ модуль»: измерить по дереву,
доказать инъекцией в обе стороны, снабдить проверкой предпосылки, печатать объём осмотренного.

## Проектные ограничения

- Naming: каталог `services/<SVC>/`, Go-пакеты — под `github.com/PRO-Robotech/kacho/services/<SVC>/…`
  (модуль корневой, отдельного нет), БД `kacho_<SVC>` (подчёркивание, своя на службу),
  env `KACHO_<SVC_UPPER>_*`.
- Порты: public gRPC `9090`, internal gRPC `9091`, REST/metrics — по конфигу.
- Конфиг — YAML через viper в struct (скил `evgeniy`); НЕ envconfig в struct-тегах.
- Логирование — только `log/slog`.
- Общие таблицы и пакеты (`operations` и прочее из `pkg/`) — **импортом пакета**, не копированием
  файлов: при одном модуле копировать неоткуда и незачем.

## Запреты

- НЕ реализовывать ресурсы и RPC — предмет чужой полосы; отсутствие ресурсов объявлено разделом
  «вне объёма» приёмки.
- НЕ создавать `.proto` в каталоге службы — они только в `proto/`, и владелец у них один
  (`proto-sync`).
- НЕ заводить второй `go.mod` и никакой внутрипроектной подмены модулей — см. «Роль и границы».
- НЕ ORM (gorm/ent/bun) — только sqlc + рукописный pgx.
- НЕ общая БД, НЕ брокер (Kafka/NATS) в зависимостях, НЕ cross-service FK.
- Маркеров отсрочки в дереве нет ни одного (ban #11, гейт `TestNoDeferredWorkInTheTree`).
  Отложенное живёт разделом «вне объёма» приёмки, а не комментарием в коде.
- НЕ смешивать миграции в `cmd/<SVC>` — миграции отдельным бинарём `cmd/migrator`.

## Готовность

- Сборка и пробы каркаса зелёные, сырой вывод сохранён файлом.
- Слои разнесены по правилу зависимостей (`.claude/rules/architecture.md` §«Clean Architecture
  (строгое dependency rule)»): `domain` — только stdlib и стабы; use-case — domain и порты (НЕ
  pgx/grpc); `repo` — pgx; `clients` — grpc-стабы; `handler` — порт use-case; `cmd/*` —
  единственное место wiring.
- Страж запуска отказывает на небезопасной посадке — **доказано прогоном**, а не чтением кода.
- Гейты дня первого названы координатами.
- Коммит в ветку задачи в своём worktree, без отправки.

## Возврат

Последний блок ответа — блок ВОЗВРАТ по контракту `CLAUDE.md` §«Контракт возврата: как
исполнитель отвечает диспетчеру». Поле «вердикт» у тебя «—»: вердикт выносят рецензенты.
Сверх контракта в том же блоке:

| поле | откуда берётся |
|---|---|
| служба: имя · домен · каталог · перечень созданных путей | твой дифф |
| гейты дня первого: по каждому условию аналитика — координата гейта либо «не поставлен, потому что …» | дословные условия `class-exposure-analyst` из задания |
| что каркас НЕ содержит по решению приёмки (раздел «вне объёма»), чтобы это не читалось как долг | приёмка |
| нужно дальше: чарт и профиль · baseline схемы · контракт домена · регистрация на крае (новый ключ домена) · страница документации | чего каркасу не хватает до живой службы |
| стабы домена: есть \\| нужен proto-sync | наличие `pkg/api/kacho/cloud/<domain>/v1` в выданной ветке |
| модуль: взят корневой \\| требуется собственное объявление модуля | §«Роль и границы»; собственное объявление — отдельное решение владельца, не шаг заведения службы |

