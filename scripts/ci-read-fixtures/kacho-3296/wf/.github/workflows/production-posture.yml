name: production-posture
jobs:
  # Выбор затронутого (kacho#3148): на черновике запроса в ветку эпика задания ниже
  # исполняются, только если их выбрала карта `.github/ci-paths.json`; на ready, на
  # запросе в main, на push и ручном запуске — полный прогон. Пропуск даёт `skipped`,
  # а сводный вердикт на черновике красный по построению: «целевой прогон: N из M».
  changes:
    name: выбор затронутого (posture)
  stand:
    name: stack ${{ matrix.stack }} boots (kind, production posture)
    # ЛИТЕРАЛЬНАЯ МАТРИЦА БЕЗ include/exclude — намеренно: такую свод раскрывает по
    # ногам и ждёт КАЖДУЮ. Матрицу из выражения он принимал бы одним образцом, и
    # зелёная нога `dev-prod` доказывала бы проверку за несостоявшуюся `own`.
    # Цель подъёма выводится из имени цепочки (`<цепочка>-up`), поэтому второе
    # измерение не нужно. `fail-fast: false`: отказ одной ноги не снимает вердикт
    # другой — это два разных утверждения о двух цепочках.
    strategy:
      matrix:
        stack: [dev-prod, own]
