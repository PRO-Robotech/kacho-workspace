jobs:
  suite:
    name: набор — оснастка, пробы, покрытие, долг
  stand:
    name: автономный стенд — служба без платформы
  stand-ceremony:
    name: автономный стенд — волна церемонии и распорядители аккаунта (второй шард)
  edgeselftests:
    name: самопроверки против подставного края (стенда не нужно)
  chart-own:
    name: стенд посадки own (kind) — полоса входа паролем и своя церемония
  trunkverdict:
    name: вердикт ствола — красное не остаётся без читателя
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
