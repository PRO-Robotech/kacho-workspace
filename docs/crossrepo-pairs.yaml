# ВЕДОМОСТЬ ПАРНЫХ ФАЙЛОВ МЕЖДУ РЕПОЗИТОРИЯМИ (запрет #20).
#
# ЗАЧЕМ ОНА СУЩЕСТВУЕТ
#
# Запрет #20 говорит: файл, чей владелец — другой репозиторий, в этом дереве не
# лежит; нужен предмет — заводится ребро сборки пином, не нужен — файла нет.
# Правило само называло своего держателя: «сегодня — НИЧЕМ, гейта на парные
# файлы между репозиториями в дереве нет; он выразим и заводится своим
# изменением» (`.claude/rules/polyrepo.md`). Это он.
#
# ЧТО ЭТО НЕ ЕСТЬ
#
# Это НЕ список прощённых. Запись — РЕШЕНИЕ по паре, а не разрешение ей быть.
# Пара без записи — находка; запись без пары — тоже находка (самоистечение):
# послабление, которому нечего прощать, не истечёт больше никогда.
#
# ТРИ ЗАКОННЫХ РЕШЕНИЯ, ЧЕТВЁРТОГО НЕТ
#
#   vendored — владелец ВНЕ наших репозиториев; копия есть форма ввоза, а не
#              наша копия. Годится ровно для ввезённого чужого;
#   own      — одноимённость ПО ПОСТРОЕНИЮ: у каждого репозитория свой файл с
#              этим именем, и предмет у них разный. Совпадает имя, а не предмет;
#   debt     — копия, и это признано. Обязателен `issue`: за долгом отвечает
#              названная задача, иначе он ничей.
#
# Решение `debt` без задачи — находка гейта. Решение `own` на побайтово
# СОВПАДАЮЩЕЙ паре — тоже находка: «предмет разный» и «содержимое одинаково»
# вместе не бывают.
#
# ЕДИНИЦА СЧЁТА — ОТСЛЕЖИВАЕМЫЙ ПУТЬ, лежащий более чем в одном стволе. Не
# «контракт», не «инструмент»: путь. Замер 2026-09-16 по трём стволам
# (`kacho@45d1719fe8`, `kaname@83ddd08a`, `corelib@1d25468`) — пар 51.

pairs:
  # ── ввезённое чужое: владелец вне наших репозиториев ─────────────────────────
  - path: proto/google/api/annotations.proto
    decision: vendored
    note: контракт аннотаций gRPC-HTTP; ввозится ради компиляции buf, владелец — upstream
  - path: proto/google/api/http.proto
    decision: vendored
    note: то же дерево ввоза
  - path: proto/google/rpc/status.proto
    decision: vendored
    note: то же дерево ввоза
  - path: proto/google/LICENSE
    decision: vendored
    note: лицензия ввезённого дерева; едет вместе с ним by construction
  - path: proto/LICENSE
    decision: vendored
    note: лицензия дерева контрактов; едет вместе с ввезённым

  # ── одноимённость по построению: у каждого репозитория свой ──────────────────
  - path: LICENSE
    decision: own
    note: лицензии РАЗНЫЕ — BUSL-1.1 у платформы, AGPL-3.0 у службы, Apache-2.0 у фундамента
  - path: README.md
    decision: own
    note: свой у каждого продукта
  - path: .gitignore
    decision: own
    note: состав игнорируемого — свойство своего дерева
  - path: .dockerignore
    decision: own
    note: то же
  - path: Makefile
    decision: own
    note: цели свои у каждого дерева
  - path: go.mod
    decision: own
    note: объявление СВОЕГО модуля; одноимённость обязательна by construction
  - path: go.sum
    decision: own
    note: производное своего go.mod
  - path: provenance.mk
    decision: own
    note: происхождение образа своего продукта
  - path: .github/golangci.yml
    decision: own
    note: набор правил своего дерева
  - path: .github/workflows/ci.yml
    decision: own
    note: состав заданий свой; каждое отличие у фундамента названо его шапкой замером
  - path: .github/workflows/docker-build.yml
    decision: own
    note: образы свои
  - path: .github/workflows/e2e-newman.yml
    decision: own
    note: свой набор сквозных проб и свой стенд
  - path: proto/buf.yaml
    decision: own
    note: модуль контрактов свой
  - path: proto/buf.gen.yaml
    decision: own
    note: входы порождения свои; у платформы корень `kacho`, у службы `kaname`
  - path: proto/declared-breaks.yaml
    decision: own
    note: перечень объявленных разрывов СВОЕГО контракта

  # ── долг: копия, и она признана ─────────────────────────────────────────────
  - path: proto/corelib/api/v1/operation.proto
