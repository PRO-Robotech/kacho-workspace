reviewer_self_refutations:
- Первый замер body_sha256 дал расхождение — подстановка через $(cat) срезала хвостовой перевод строки.
  Сырое тело ответа API хешируется ровно в объявленное 4c397c14. Автор прав.
- Заявил, что предикат без сужения даёт 2, а не 1. «Сужение ДО GO» есть путь '*.go'; снятие только его,
  с сохранением ':!*_test.go', даёт ровно 1 и ровно комментарий vpc. Второй файл — _test.go, законно исключённый
  узкой формой. Автор прав.
- Не нашёл стража П25 и заподозрил мёртвую координату. Путь я выдумал сам; настоящий — services/iam/internal/apps/kaname/config/own_ceilings.go
  строка 113. Сокращение автора резолвится. Автор прав.
- Заподозрил, что «гейт G7» в документе не определён. G7 объявлен в godoc продукта у domain.accountScopedKinds
  и реализован credential_ceiling_anchor_test.go. Замечание снято мной.
