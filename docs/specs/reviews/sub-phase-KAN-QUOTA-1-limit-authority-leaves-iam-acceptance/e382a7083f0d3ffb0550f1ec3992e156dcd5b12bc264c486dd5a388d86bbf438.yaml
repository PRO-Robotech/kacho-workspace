- 'стенд не поднимался: ни одна проба, фикстура и посев не исполнялись — о РАБОТЕ сценария на живой установке
  вердикта нет, только о его конструируемости и производителях'
- конструируемость «Дано» доказана СХЕМОЙ, а не посевом; посев остаётся за фикстурой F-KAN-Q3-SCOPE стадии
  S3
- сценарии редакций 1-16 повторно не рецензировались — дельта их GWT не касается, предикат назван в scope
- 'ствол продукта origin/main не судился намеренно: линия впереди него, координаты П35 в стволе отсутствуют,
  и это отставание ствола'
- истинность семи решений ролей до кода не проверялась — проверено их наличие, роль, вердикт и привязка
  к отпечатку
- реализация П25, план v4 и его кандидат предметом этого круга не были
