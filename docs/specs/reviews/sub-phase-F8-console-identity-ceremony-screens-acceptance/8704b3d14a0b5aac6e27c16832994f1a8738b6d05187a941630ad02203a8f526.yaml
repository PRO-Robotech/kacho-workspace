      - "§14 п. 31: «Построенность «Дано» утверждается до отправки формы»"
    predicate: >-
      Посев vacuity.cjs (measurement.experiment.results.self_abort_before_submit). У консоли без
      Р10 приложение отменяет задержанное до отправки. Дословная проверка проходит 25 из 25, и
      «Тогда» F8-46 зеленеет 25 из 25, хотя в момент глагола чтения с прежним носителем в полёте
      нет. Строгая проверка («у задержанного к отправке нет исхода») краснеет 25 из 25. Ложного
      красного она не даёт: 40 из 40 у консоли с Р10, 10 из 10 у консоли без упорядочения.
    why_not_blocking: >-
      Близнец F8-47 собирает то же «Дано» и краснеет на той же отмене 25 из 25, если отмена
      общая для экрана. DoD 10в требует показать F8-46 красной до упорядочения на настоящей
      консоли. У консоли @f445aaaa554 средства отмены в прод-коде нет вовсе: N20 даёт 0 сроков
      транспорта, `AbortController` не встречается. Проскочить может только отмена, которая
      есть лишь перед сменой пароля и не затрагивает заведение фактора.
    ask: >-
      В «Дано» F8-46 и в §14 п. 31 дописать, что к отправке формы у задержанного нет исхода: ни
      отмены, ни ответа. F8-47 наследует это через «то же построение «Дано»». Автор пробы вносит
      это в проверку «Дано» независимо от следующей редакции.

minor_findings:
  - id: M-C18-2-1
    kind: FORMAT
    text: >-
      N20 и Р10 называют «120 с» пределом посредника. В чарте это умолчание ручки:
      `{{ $ing.proxyReadTimeout | default "120" }}` (api-gateway-ingress.yaml:34). Предел чтения
      у посредника отмеряется между двумя чтениями ответа, а не на весь ответ. Для глагола без
      ответа цена названа верно. Назвать это умолчанием ручки.
  - id: M-C18-2-2
    kind: FORMAT
    text: >-
      F8-46: «в переписи есть ещё одно обращение `GET /iam/v1/accounts` — то же чтение, выпущенное
      страницей снова». Строка не отделяет повтор от любого другого чтения того же пути. Форма из
      N19 это позволяет: второе обращение выпущено после ответа на первое и записано после него,
      2000 из 2000 у автора и 400 из 400 здесь. По ней можно сказать «записано после выпуска
      глагола», не сравнивая исход с выпуском. Правка по желанию: строгий порядок документ
      решением оставил модульной пробе.
  - id: M-C18-2-3
    kind: FORMAT
    text: >-
      Р6 п. 1: «исход обращения — событие ответа, то есть заголовки: в этот момент браузер
      применяет печенья ответа». В строке N19 это свойство словами не названо. Данные его
      покрывают: повтор чтения после того, как `fetch` глагола разрешился на заголовках,
      получает 200 — 2000 из 2000 у автора и 400 из 400 здесь. Проверка §14 п. 32 («у каждого
      свойства … есть строка §1.11») требует назвать его в N19.
  - id: M-C18-2-4
    kind: FORMAT
    text: >-
      Шапка: строка «круг C18-1 …» кончается без точки перед «— **редакция 8 …». Дата строки
      редакции 7 (2026-09-25) позже даты её круга (2026-09-24, время записи ревью по UTC): у
      строк разные основания времени.

