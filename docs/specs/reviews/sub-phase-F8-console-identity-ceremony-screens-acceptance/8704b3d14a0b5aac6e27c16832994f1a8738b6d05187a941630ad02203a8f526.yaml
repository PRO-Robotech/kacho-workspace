kind_recurrence_note: >-
  Род PRODUCER блокировал в кругах 4, 5 и C18-1, и каждый раз на свойстве переписи Р6. Здесь он
  не блокирует. Форма, предложенная в C18-1, внесена: свойство переписи входит в документ только
  с опытом в §1.11 (Р6 п. 1, §14 п. 32). Предикат п. 32 рецензент прогнал сам: обход «Дано» и
  «Тогда» §11 по словам порядка. «Тогда», сравнивающего исход одного обращения с выпуском
  другого, не найдено. «Затем» F8-27, F8-43 и повтор F8-35 стоят на форме «второе выпущено
  после ответа на первое», и она измерена. Единственное новое важное замечание (I-C18-2-1) —
  о построенности «Дано», а не о свойстве прибора. Повтором рода оно не является.

