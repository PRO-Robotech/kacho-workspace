blocking_findings:
  - id: B2-1
    kind: CONSTRUCTIBILITY
    title: >-
      Бюджет оси источника (Р7 ч. 2) построен на неверной посылке: «что идёт в счёт» взято из
      шапки rate.go, а не из мест записи следа
    coordinates:
      doc: "Р7 ч. 2 (таблица бюджета); сценарий F8-41; DoD п. 10а; §14 п. 16"
      tree:
        - project/kaname/internal/apps/kaname/api/humansession/rate.go:109 (recordFailure — след по ОБЕИМ осям)
        - project/kaname/internal/apps/kaname/api/humansession/login.go:411
        - project/kaname/internal/apps/kaname/api/humansession/change_password.go:162
        - project/kaname/internal/apps/kaname/api/humansession/sf_enroll.go:220
        - project/kaname/internal/apps/kaname/api/humansession/recovery_complete.go:299
        - project/kaname/internal/apps/kaname/api/humansession/step_up.go:274
    measured: >-
      recordFailure зовут ПЯТЬ мест, а не два. Документ называет «отказы входа и неподошедшее
      подтверждение смены пароля» — это шапка rate.go, и она уже, чем код: след пишут также
      ConfirmSecondFactor (несовпавший код) и StepUp (суждённое предъявление).
    consequence: >-
      F8-28 («неверный первый код» на second-factor/confirm) даёт след по оси источника и в
      таблицу бюджета не внесён. Настоящий счёт — 11 за прогон и 33 за три, а не 10 и 30.
      F8-41 в нынешней редакции («не превышает 10 … не превышает 30») краснеет на ВЕРНОЙ
      реализации, и первым побуждением будет подправить число — ровно тот дрейф, против
      которого Р7 заведено.
    also:
      - >-
        Перечень исключений неполон: в коде четвёртым стоит «исчерпание ёмкости проверяющего
        (PWV-15.3)» (step_up.go:288 и шапка rate.go).
      - >-
        «Ось адреса снимается успешным входом» — ResetFailures(FailureByAddress) зовут также
        step_up.go:165, sf_enroll.go:280, sf_remove.go:129, sf_backup_codes.go:127,
        recovery_complete.go:280.
      - >-
        F8-41 не называет, ЧЕМ сторож читает потолок «из профиля прогона»: браузерная проба
        доступа к values умбреллы не имеет, и средство не названо ни одно.
      - >-
        «Краснеет, когда бюджет к нему приблизился» — порог не квантифицирован; предикат без
        числа исполнить нельзя.
    verified_not_counting:
      - "F8-36 (SECOND_FACTOR_NOT_ENROLLED) — step_up.go:223-231: отказ по состоянию следа не оставляет"
      - "F8-29 — sf_enroll.go:205: ErrEnrollmentNotPending без recordFailure"
      - "F8-32 — sf_remove.go / sf_backup_codes.go recordFailure не зовут"
      - "F8-06, F8-07 — форма судится до gate.check; F8-08 — отказ формы; F8-10 — недоступность"
    measured_values:
      addressAttempts: 5
      addressWindow: 15m
      sourceAttempts: 50
      sourceWindow: 15m
      source: project/kacho/deploy/helm/umbrella/values.prod.yaml:769-772
      source_axis_reset: "ResetFailures(FailureBySource) в дереве — 0 мест; «только временем» подтверждено"

  - id: B2-2
    kind: CONSTRUCTIBILITY
    title: "F8-29 требует сессии старше окна свежести, а средства построения не названо"
    coordinates:
      doc: "§11 группа H, F8-29 («предъявление в сессии старше окна свежести»); §11 преамбула («ожидание — условия, не времени»); DoD п. 5 («трижды подряд»)"
      tree:
        - project/kacho/deploy/helm/umbrella/values.own.yaml:47 (selfServiceFreshness 15m)
        - project/kaname/internal/apps/kaname/api/humansession/sf_enroll.go:84
    measured: "окно свежести на цепочке own — 15m; посев старением сессии в §11 не описан"
    consequence: >-
      Третья ось, снимаемая ТОЛЬКО временем, — и она осталась вне Р7, хотя Р7 заведено ровно
      про такие оси. Либо ждать 15 минут на каждом из трёх прогонов, либо назвать средство
      (управляемые часы, посев отметки предъявления, своя величина в профиле прогона).
      Не названо ни одно — Given не конструируем.

  - id: B2-3
    kind: CONSTRUCTIBILITY
    title: >-
      §1.5: число и перечень второго пути посева не совпадают с предметом; заменяющий предикат
      снова по НАПИСАНИЮ пути, контроля в обе стороны против него не исполнено
    coordinates:
      doc: "§1.5 («четыре обращения»); DoD п. 16 (ссылается на §1.5); §14 п. 3 (требует контроля в обе стороны от каждого числа §1)"
      tree:
        - project/kacho/ui-future/e2e/specs/assurance.ts:141,143,153,154 (четыре /self-service/)
        - project/kacho/ui-future/e2e/specs/assurance.ts:125 (GET /sessions/whoami — пятое)
        - project/kacho/ui-future/e2e/specs/assurance.ts:161-166 (whoami под expect.poll — многократно)
    measured: >-
      assurance.ts трогает чужого поставщика в ПЯТИ местах, не в четырёх. Документ говорит
      «четыре обращения» и перечисляет четыре, подставив чтение уровня ВМЕСТО отправки потока
      повышения (:154). Число получено `grep -rln '/self-service/'` — предикатом по написанию
      пути, а не по предмету «ведёт чужую церемонию»; whoami под него не попадает by
      construction. Расширение предиката до предмета (`kratos|\.ory|KRATOS`) даёт второй файл
      — registration-refusal-named.spec.ts, — то есть контроля в обе стороны исполнено не было
      ни в одну.
    consequence: >-
      Формулировка правки («о методе, а не о числе») верна, но метод не применён: класс
      воспроизведён на следующем предикате. Сценарий F8-43 при этом предмет закрывает целиком
      («уровень уверенности читается ответом НАШЕГО глагола»), поэтому правка — к §1.5, не к
      сценарию.
    verified_correct:
      - "§1.5: 24 различных файла вместо 47 — воспроизведено (47 без sort -u, 24 с ним); 23 из 23 спецификаций + fixtures.ts — воспроизведено comm-сверкой"
      - "§1.6: 4 условия вместо 5 — воспроизведено; пятым попаданием была проза (configmap-nginx.yaml:281 на полосе)"

  - id: B2-4
    kind: COVERAGE
    title: >-
      Переезд фикстуры (F8-20/F8-21) убивает предмет целой спецификации, и её судьба не
      названа ни в §3, ни в §12, ни в DoD
    coordinates:
      doc: "§11 группа E (F8-20, F8-21); §1.5 («три следствия»); §3; §12; DoD п. 12"
      tree:
        - project/kacho/ui-future/e2e/specs/registration-refusal-named.spec.ts (6 тестов)
        - project/kacho/ui-future/e2e/specs/fixtures.ts (identityRefusalFromText, identityRefusalOnPage)
    measured: >-
      Предмет спецификации — РАСПОЗНАВАНИЕ страницы отказа ЧУЖОГО поставщика: её разметка
      вшита дословно (REFUSAL_PAGE, «webhook failed with status code 401»), страница подаётся
      setContent. После F8-20 register() ведёт `POST /iam/v1/auth/register`, отвечающий
      google.rpc.Status JSON — распознавать нечего.
    consequence: >-
      testing.md §subject-removal-two-outcomes: исходов ровно два — снять вместе с предметом
      ОДНИМ изменением либо перевести на признак, производимый деревом, с инъекцией. Документ
      не называет ни одного, а DoD п. 12 («ни одна спецификация набора не зовёт чужой поток»)
      этого не ловит: спецификация чужой поток не ЗОВЁТ, она его МОКАЕТ. Это четвёртое
      следствие переезда, которого «три следствия» §1.5 не перечислили — тот же недобор
      предиката, что в B2-3.

