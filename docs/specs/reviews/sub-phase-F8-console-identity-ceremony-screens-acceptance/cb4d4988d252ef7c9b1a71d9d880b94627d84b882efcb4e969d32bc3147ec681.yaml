  security_surface_note: >-
    Приёмка трогает церемонии личности: неразличимость причин отказа (Р4, F8-40), открытая
    переадресация (F8-13), признак формы (F8-07, F8-08), негашение носителя при молчании
    службы (F8-19, F8-25). Дефекта защиты документ не раскрывает: safeInternalPath в дереве
    уже стоит, и сценарий делает его держателем, а не сообщает о дыре.
  disclosure_safe: true
  disclosure_note: >-
    Ни документ, ни эта запись не несут сборки «координата + условие + следствие» о
    действующем дефекте защиты. Названные координаты — это места ДЕЙСТВУЮЩЕЙ защиты и
    величины потолка, объявленные профилем, который и так публичен.

