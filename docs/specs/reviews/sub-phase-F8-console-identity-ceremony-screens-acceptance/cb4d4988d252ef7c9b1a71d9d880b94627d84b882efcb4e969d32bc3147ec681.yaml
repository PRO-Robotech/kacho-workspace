accepted_as_closed:
  - id: B1
    kind: SCOPE
    outcome: closed
    evidence: >-
      Р3а несёт цену (два места параметров на посадке сосуществования), отвергнутый исход
      (вынуть settings из полосы — сломал бы посадку сосуществования) и предикат истечения
      (DoD п. 18). Свобода адреса воспроизведена: host/src/utils/host-context.ts:65 —
      точное сравнение `/accounts`; префикса `/account/` в ui-future нет ни одного.
      Посылка Р3а подтверждена: configmap-nginx.yaml:239 — полоса
      `^/(login|registration|recovery|verification|settings|error|consent|logout)(/|$)`,
      settings среди восьми.
  - id: B2
    kind: COVERAGE
    outcome: closed
    evidence: "F8-39 заведён и несёт положительный контроль ВНУТРИ сценария (переход на /registration есть) — «перехода нет» не зеленеет тождественно."
  - id: B3
    kind: NEGATIVE
    outcome: closed
    evidence: "F8-40 заведён, утверждает ПОБАЙТОВОЕ равенство экрана с F8-05 и отсутствие различимости по тексту, полю и наблюдаемой длительности."
  - id: B4
    kind: TWIN
    outcome: closed
    evidence: "F8-02 переведён на прибор близнеца (браузер), различие сведено к одному факту; наблюдение рендером вынесено в F8-42, и тот несёт знаменатель обхода (число источников подчарта консоли по каждой цепочке)."
  - id: B5
    kind: CONSTRUCTIBILITY
    outcome: partially_closed
    evidence: >-
      Формулировка правки — о МЕТОДЕ: названо, на какой вопрос отвечал прежний предикат («кто
      зовёт нашу фикстуру») и на какой обязан («кто ведёт чужую церемонию»). Второй путь посева
      найден, F8-43 заведён, производитель и DoD п. 16 даны. НЕ закрыто: заменяющий предикат
      снова по написанию пути, число неверно (B2-3), и четвёртое следствие переезда пропущено
      (B2-4).
  - id: B6
    kind: CONSTRUCTIBILITY
    outcome: partially_closed
    evidence: >-
      Двухосевость потолка перемерена верно (5/15m по адресу, 50/15m по источнику;
      ResetFailures по оси источника в дереве ноль — «только временем» подтверждено). Часть 1
      решения (свой адрес у каждого отрицания) годна. НЕ закрыто: арифметика бюджета и посылка
      «что идёт в счёт» (B2-1), и третья ось свежести не рассмотрена вовсе (B2-2).
  - id: B7
    kind: DoD
    outcome: closed
    evidence: "Р8 заведено, цена названа (имя теста связано с документом ⇒ ID не переприсваиваются); DoD пп. 4а, 10, 13 требуют печати разности множеств ID поимённо в обе стороны."
  - id: B8
    kind: FORMAT
    outcome: closed
    evidence: >-
      F8-13 перечисляет четыре формы поимённо и называет положительного близнеца. Держатель
      воспроизведён: ui-future/shared/src/lib/redirect.ts, safeInternalPath — резолв
      `new URL(raw, origin)` и сравнение `url.origin !== origin` закрывает ВСЕ четыре, включая
      `//чужое` (резолв поднимает его в чужое происхождение) и `/\чужое` (WHATWG нормализует
      обратную косую); плюс отдельная проверка протокола против `javascript:`. Второй предикат
      не заведён — верно.

findings_home:
  verdict: не_годен_как_дом
  measured:
    - "ветка — tooling-docfresh-recognition-boundary; её предмет — хук docfresh, не приёмка F8"
    - "документ НЕ отслеживается: git status --porcelain → `?? docs/specs/sub-phase-F8-…md`"
    - "запись круга 1 ЗАКОММИЧЕНА (a1598318) на той же ветке — вердикт в дереве есть, судимого содержимого нет"
    - "за время круга HEAD ушёл a1598318 → 5f77d665 тремя чужими коммитами: на ветке параллельно пишет другой исполнитель"
  reasoning: >-
    Выбор РЕПОЗИТОРИЯ (§0.3, воркспейс docs/specs/) обоснован и принимается: три довода
    проверяемы, прецедент F4d в дереве есть. Спор не о нём. Негоден ВЕТОЧНЫЙ дом: приёмку
    ищут по эпику #1266 / задаче #1274, а ветка названа по хуку оснастки; единица запроса на
    слияние — волна, и через эту ветку приёмка утащила бы в запрос чужую правку docfresh.
    Плюс общий клон с параллельным писателем.
  remedy: >-
    Отдельная ветка, названная предметом (эпик/под-фаза), с приёмкой и ОБЕИМИ записями ревью
    в ней; запрос на слияние — в составе волны identity, не волны оснастки. Дом §0.3 при этом
    не меняется: путь остаётся docs/specs/.
  note: "Это находка о размещении, а не блокирующее замечание к контракту; в blocking_count не входит."

