blocking:
  - id: B11-1
    kind: PRODUCER
    where: §1.13 N28; Р11 первый пункт; F8-58; §11.2 строка F8-58
    finding: >-
      Отказ «последний способ входа» производитель выпускает СИНХРОННО, до создания операции:
      revoke.go @d9e233f42 — `lastMethodRefusal(ctx, in.UserID, 0)` перед `uc.ops.Create`
      (комментарий там же: «судится синхронно, чтобы отказ назвал следующий шаг клиенту, и
      ещё раз под замком внутри транзакции — второе чтение держит инвариант»). На краю это
      `DELETE …/accessKeys/{id}` → 400, code 9, reason LAST_SIGN_IN_METHOD. В `error` операции
      он попадает только при гонке двух снятий. Документ утверждает обратное (N28: «внутри
      операции»; Р11: «Отказ приходит в error операции»), и единственный держатель F8-58
      подставляет только гоночный путь. Раздел, показывающий синхронный отказ снятия
      безымянно или убирающий ключ из перечня, проходит все 67 сценариев.
    required: >-
      Перемерить N28 (оба места выпуска). F8-58 — синхронный путь (подставленный ответ
      `DELETE` 400/code 9/LAST_SIGN_IN_METHOD → текст дословно, ключ в перечне, «Удалить» есть);
      путь `error` операции — отдельным сценарием либо вторым «И» с названным различием.
      Поправить Р11 и строку §11.2.
  - id: B11-2
    kind: COVERAGE
    where: Р11 («имя и описание … отказ раздел показывает дословно у поля»; N28 «читать отказ в двух местах»); группа L
    finding: >-
      Синхронные отказы мутаций Ф7, кроме свежести, держателя не имеют. FinishRegistration
      @d9e233f42 отказывает синхронно формой поля (`Illegal argument <field>: <rule>`, Ф7-46),
      состоянием испытания (CHALLENGE_EXPIRED / _ALREADY_PRESENTED / _NOT_ISSUED), происхождением
      (ORIGIN_NOT_ALLOWED), обнаружимостью (CREDENTIAL_NOT_DISCOVERABLE) — finish_registration.go
      :93-157, до `operations.NewFromContext` :159. Группа L утверждает только отказ свежести
      (F8-51, F8-57, с окном повышения) и отказ в `error` операции (F8-54). Обещание Р11 «отказ
      имени у поля дословно» не держит ни один сценарий; раздел, показывающий синхронный 400
      общим текстом или молча, зелен.
    required: >-
      Модульный сценарий (близнец F8-55, различие — ответ приёма результата): синхронный 400
      `Illegal argument name: <правило>` → поле «Имя» отмечено текстом службы, введённое цело,
      операции не ждали; и одно «И» о синхронном 400 состояния испытания (текст дословно,
      «Добавить» снова доступна, повтор — с новым испытанием).

