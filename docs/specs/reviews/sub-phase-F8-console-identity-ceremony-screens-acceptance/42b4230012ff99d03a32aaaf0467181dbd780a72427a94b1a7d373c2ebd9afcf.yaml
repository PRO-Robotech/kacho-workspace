blocking_findings:
  - id: B3-1
    kind: CONSTRUCTIBILITY
    title: >-
      Ось 4 (шаг одноразового кода): принятый шаг пишет ТАКЖЕ `confirm` — через ActivateTOTP,
      а не только RecordAcceptedStep. Посев «второй фактор заведён» сам предъявляет код,
      поэтому средство Р9 «не более одного предъявления» невыполнимо для пяти сценариев
    coordinates:
      doc: "§1.10 ось 4; Р9 таблица, строка оси 4; F8-30, F8-31, F8-33, F8-35, F8-43; F8-45; DoD 10б и 16; §16.2 обязанность 3"
      tree:
        - kaname@497c44b7:internal/repo/kaname/pg/login_method_repo.go:335 — activateTOTPTx `SET state='active', last_accepted_step = $3`
        - kaname@497c44b7:internal/repo/kaname/pg/login_method_repo.go:409 — recordAcceptedStepTx (ЕДИНСТВЕННЫЙ писатель, которого называет документ)
        - kaname@497c44b7:internal/repo/kaname/pg/login_method_repo.go:317 — upsertPendingTOTPTx `last_accepted_step = NULL` (переzаведение — единственное, что ось сбрасывает)
        - kaname@497c44b7:internal/apps/kaname/api/humansession/sf_enroll.go:251 — `w.ActivateTOTP(ctx, user.ID, row.CreatedAt, res.Step, now)`
        - kaname@497c44b7:internal/totpverify/verifier.go:277 — `if last.known && step <= last.step { OutcomeReplayed }`
        - kaname@497c44b7:internal/totpverify/verifier.go:72 — `Period = 30 * time.Second`
        - kaname@497c44b7:internal/repo/kaname/pg/login_method_repo.go:169 — `m.AcceptedStep, m.StepAccepted = *step, true`
        - kaname@497c44b7:internal/apps/kaname/api/humansession/sf_present.go:98…114 — prepare читает AcceptedStep
        - kaname@497c44b7:internal/apps/kaname/api/humansession/sf_present.go:242 — countsAsAttempt(verdictMismatched) = true
        - kaname@497c44b7:internal/apps/kaname/api/humansession/login.go:287 — вход тоже идёт через presenter.prepare
    predicate: "git grep -n 'last_accepted_step' 497c44b7 -- '*.go' | grep -v _test.go"
    measured: >-
      Писателей столбца ТРИ. Документ называет одного — `RecordAcceptedStep` — и по нему
      заключает «принятый шаг запоминается». На деле шаг пишет и `confirm`: activateTOTPTx
      кладёт `last_accepted_step = res.Step`, то есть ступень ПОДТВЕРЖДАЮЩЕГО кода. После
      confirm строка активна и StepAccepted = true.
    consequence: >-
      §11 преамбула предписывает сеять второй фактор глаголами `enroll` и `confirm`, то есть
      посев САМ предъявляет одноразовый код. Любое следующее предъявление в том же
      30-секундном шаге даёт `step <= last.step` → OutcomeReplayed → verdictMismatched →
      отказ `authentication failed` И след по ОБЕИМ осям. Значит средство оси 4, объявленное
      Р9 («у каждого сценария свой человек и НЕ БОЛЕЕ ОДНОГО предъявления»), для пяти
      сценариев невыполнимо by construction — посев уже израсходовал единственное
      предъявление.
    affected_scenarios:
      - "F8-30 (снятие с предъявлением кода) — положительный, утверждает успех"
      - "F8-31 (перечеканка запасных кодов) — положительный, утверждает успех"
      - "F8-33 (вход с кодом второго фактора до уровня 2) — положительный, утверждает 200"
      - "F8-35 (повышение уровня) — положительный, утверждает успешное повышение"
      - "F8-43 (переезд оснастки: enroll → confirm → step-up без ожидания) — держатель переезда"
    second_order: >-
      Два следствия, и оба несущие. (1) Единственный способ развести шаги — дождаться
      следующего, то есть вернуть `nextWindow()` (ui-future/e2e/specs/assurance.ts:104, зов на
      :151), который F8-45 объявляет находкой, а DoD 10б — нулём. F8-43 и F8-45 на этой
      редакции противоречат друг другу. (2) Если шаги иногда расходятся сами, вердикт набора
      становится функцией ФАЗЫ стенных часов — DoD 5 «тот же вердикт трижды подряд»
      превращается в жребий, ровно то, что Р9 называет отвергнутым исходом.
    budget_impact: >-
      Каждый повтор пишет след, идущий в счёт: +1 к бюджету на каждый из пяти сценариев. 11+5
      = 16 за прогон, 48 за три при потолке 50 — 96 %, против объявленного порога 80 % (40).
      То есть число 11 опровергнуто не только правилом счёта (B3-2), но и арифметически.
    outcomes_available_to_author: >-
      Исходов несколько и выбор за автором: посев второго фактора не через `confirm`
      (фикстурой, кладущей строку сразу активной без принятого шага) · собственный секрет TOTP
      у пробы с управляемым моментом · один разнос шагов на весь прогон с явной ценой · либо
      перенос сценария к владельцу условия. Ревьюер исхода не выбирает; требуется, чтобы
      средство было названо и чтобы оно не было ожиданием.

  - id: B3-2
    kind: COVERAGE
    title: >-
      Перепись пишущих след взята по НАПИСАНИЮ имени `recordFailure`: `sf_enroll.go:327` —
      общий хвост ЧЕТЫРЁХ глаголов, а таблица Р7 приписывает его одному. Глаголов семь, а не
      пять, и сторож F8-41 построен на пятистрочном правиле
    coordinates:
      doc: "Р7, таблица «место вызова → глагол» (5 строк); F8-41 «по пяти местам вызова»; DoD 10а; §16.2 обязанность 1; §14 п. 20"
      tree:
        - kaname@497c44b7:internal/apps/kaname/api/humansession/sf_enroll.go:321 — recordFailureTx, тело зовёт recordFailure на :327
        - kaname@497c44b7:internal/apps/kaname/api/humansession/sf_enroll.go:317 — confirm (единственный глагол, который документ приписал :327)
        - kaname@497c44b7:internal/apps/kaname/api/humansession/sf_backup_codes.go:154 — перечеканка запасных кодов, под `if countsAsAttempt(v)` (:153)
        - kaname@497c44b7:internal/apps/kaname/api/humansession/sf_remove.go:163 — снятие второго фактора, под `if countsAsAttempt(v)` (:162)
        - kaname@497c44b7:internal/apps/kaname/api/humansession/step_up.go:291 — запасной путь повышения (recordRefusalAttempt), когда общая транзакция не сложилась
    predicate: "git grep -n 'recordFailureTx(' 497c44b7 -- '*.go' | grep -v _test.go → 4 места вызова + определение"
    measured: >-
      Мест вызова СВОБОДНОЙ функции `recordFailure` действительно пять — здесь документ не
      ошибся. Ошибка в колонке «глагол»: строка `sf_enroll.go:327 | подтверждение второго
      фактора` неверна по предмету. Эта строка — хвост, в который сходятся ЧЕТЫРЕ глагола:
      подтверждение второго фактора, перечеканка запасных кодов, снятие второго фактора и
      запасной путь повышения. Глаголов, пишущих след, СЕМЬ.
    consequence: >-
      F8-41 утверждает счёт «по ПЯТИ местам вызова таблицы Р7». Браузерная проба мест вызова
      не видит — она видит пары «глагол · отказ», и правило отображения берёт из этой таблицы.
      Отказ `verdictMismatched` на `/second-factor/remove` и `/second-factor/backup-codes` в
      таблице ОТСУТСТВУЕТ, значит сторож его не считает. §11 эти глаголы содержит (F8-30,
      F8-31, F8-32), а с учётом B3-1 они этот отказ и производят. Сторож заведён ровно затем,
      чтобы «первым о переполнении не сказал чужой сценарий, упавший по чужой причине», — и
      на этом классе он неспособен упасть.
    method_note: >-
      Это обязанность 1 документа, не исполненная на один уровень глубже: «по местам вызова, а
      не по шапке» применено к одному идентификатору и остановлено на его написании. Предикат
      по предмету — «кто пишет след», а не «где написано слово recordFailure» — даёт семь
      глаголов одной командой.

important_findings:
  - id: I3-1
    kind: DoD
    title: "DoD 4а несёт устаревший диапазон F8-01…F8-43, и §16.2 утверждает о нём обратное"
    coordinates:
      doc: "строка 1389 (DoD 4а) — `F8-01…F8-43`; строка 655 (Р8) — `F8-01…F8-45`; строка 1611 (§16.2) — «DoD 4а диапазон называл верно и не трогался»; §14 п. 24 «документ верен о себе»"
    why_not_blocking: >-
      Операционный предикат пункта верен и самообновляем: «множество ID, снятых с имён тестов,
      сравнивается с МНОЖЕСТВОМ ID §11». Устаревший диапазон стоит в поясняющей половине
      фразы, а не в предикате.
    why_it_matters: >-
      Это четвёртый случай одного класса за три круга (круг 2 нашёл документ «трижды неверным о
      себе»), и на этот раз документ ОБЪЯВЛЯЕТ, что place проверен. Диапазон исключает ровно
      F8-44 и F8-45 — держателей обязанностей 4 и 3.

  - id: I3-2
    kind: CONSTRUCTIBILITY
    title: "Ось 3 названа одной, а у неё две разные семантики снятия, и читателей четыре, а не два"
    coordinates:
      doc: "§1.10 ось 3 — «читатель: sf_enroll.go:84 и sf_enroll.go:205», «снимается предъявлением в церемонии повышения»"
      tree:
        - kaname@497c44b7:sf_enroll.go:84 — `now.Sub(s.LastPresentedAt) > d.Freshness` — свежесть СЕССИИ, снимается предъявлением
        - kaname@497c44b7:sf_enroll.go:205 — `now.Sub(row.CreatedAt) > uc.deps.Freshness` — срок НЕЗАВЕРШЁННОГО заведения, предъявлением НЕ снимается
        - kaname@497c44b7:sf_enroll.go:136 — `ExpiresAt: now.Add(uc.deps.Freshness)`
        - kaname@497c44b7:sf_status.go:74 — `PendingUntil: row.CreatedAt.Add(uc.deps.Freshness)`
    predicate: "git grep -n 'Freshness' 497c44b7 -- 'internal/apps/kaname/api/humansession/*.go' | grep -v _test.go"
    note: >-
      Для F8-27/F8-43 обе величины — 15 минут, а enroll→confirm укладывается в секунды, поэтому
      препятствием сегодня не становится. Но обязанность 3 требовала ПОЛНОГО перечня, и ось,
      слитая из двух с разными условиями снятия, полной переписью не является.

  - id: I3-3
    kind: FORMAT
    title: "Бюджетная строка «F8-29 · F8-36 → 0» верна числом, но основание названо чужое"
    coordinates:
      doc: "Р7 ч. 2, строка «F8-29 сессия не свежа · F8-36 повышать нечем | повышение: verdictNotEnrolled вне countsAsAttempt | 0»"
    note: >-
      Для F8-36 основание верно и ПЕРЕМЕРЕНО мной (см. verified.f8_36_zero). Для F8-29 оно
      неверно: у F8-29 ответ ПОДСТАВЛЕН пробой (обращения к службе нет вовсе), а само повышение
      в нём УСПЕШНО — verdictMatched. Ноль верен, причина приписана чужая.

  - id: I3-4
    kind: FORMAT
    title: "F8-31 «Given условия F8-30, второй фактор заведён» читается двояко"
    note: >-
      F8-30 оканчивается СНЯТЫМ фактором. «Условия F8-30» = предусловия или исход? При втором
      чтении «второй фактор заведён» ложно. Требуется однозначная формулировка — тем более что
      от неё зависит, сколько предъявлений одноразового кода сценарий делает (B3-1).

  - id: I3-5
    kind: FORMAT
    title: "F8-32 отсутствует в бюджетной таблице даже нулевой строкой"
    note: >-
      F8-29 и F8-36 названы нулевыми строками явно, F8-32 (снятие незаведённого →
      verdictNotEnrolled → 0) не назван вовсе. Перепись, называющая нули выборочно, не даёт
      знаменателя.

method_verdict:
  question: "вошёл ли метод §1.0 в документ КАК МЕТОД, или остался списком исправленных частностей"
  answer: "как раздел и как форма изложения — да; как метод — нет"
  evidence_for:
    - "§1.0 записан не увещеванием, а четырьмя обязанностями, и у каждой колонка «чем круг 2 её доказал» — то есть свой опровергающий случай"
    - "две производные формы названы и применены дословно: «предикат по написанию» против «предиката по предмету»; «проверка не зовёт предмет ≠ не зависит от предмета»"
    - "обязанность 2 воспроизводима и ПЕРЕМЕРЕНА мной: /self-service/ даёт 4, предметный предикат даёт 5 (строки 141,143,153,154 и 125), расширение действительно даёт второй файл"
    - "обязанность 4 породила §1.5а — перепись судеб с двумя законными исходами и ценой отвергнутого; довод перевода семи тестов я проверил своим разбором и признал верным"
    - "обязанность 3 породила §1.10 и Р9 — средство построения на каждую ось"
  evidence_against:
    - "обязанность 1 применена к ОДНОМУ идентификатору (`recordFailure`) и остановлена на его написании; один уровень глубже (`recordFailureTx`) даёт ещё три глагола — B3-2"
    - "обязанность 3 объявила перечень осей полным, но перепись ПИСАТЕЛЕЙ оси 4 снова взята по одному имени (`RecordAcceptedStep`), мимо `ActivateTOTP` — B3-1"
    - "обязанность 2 применена к §1.5 — месту, которое назвал круг 2, — и не применена ни к Р7, ни к §1.10; расширенный предикат на `last_accepted_step` и на `recordFailureTx` даёт обе находки этого круга"
    - "§14 п. 24 объявляет «документ верен о себе», а §16.2 утверждает, что DoD 4а проверен и верен, — на этой редакции неверно (I3-1)"
  decisive_test: >-
    Метод проверяется тем, находит ли он то, на что прошлый круг НЕ указывал. Все три
    показанных применения §1.0 — к трём местам, которые круг 2 назвал поимённо. Ни одна из
    четырёх обязанностей не прогнана по месту, которого в замечаниях круга 2 не было. Я прогнал
    обязанности 1 и 3 на один уровень глубже — двумя командами
    (`git grep recordFailureTx`, `git grep last_accepted_step`) — и получил оба блокирующих
    этого круга.
  consequence_for_task_form: >-
    Поправка круга 2 приземлилась как СОДЕРЖАНИЕ документа, а не как порядок работы:
    обязанности записаны, но исполнены только там, где на них указали. Записать метод в
    документ и исполнить метод — разные действия, и §1.0 сегодня свидетельствует о первом.
    Следующий шаг задания имеет смысл сделать ИСПОЛНЯЕМЫМ выходом, а не разделом: по каждому
    числу о дереве автор обязан напечатать ОБА предиката (по написанию и по предмету) с их
    выводами — включая те, где расширение не дало ничего. Решение о форме — за диспетчером
    (`.claude/rules/multi-agent-flow-orchestration.md` §14а).

