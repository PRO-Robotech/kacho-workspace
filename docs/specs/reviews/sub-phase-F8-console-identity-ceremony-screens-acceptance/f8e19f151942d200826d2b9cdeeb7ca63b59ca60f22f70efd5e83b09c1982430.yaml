blocking_findings:
  - id: B-C18-1
    kind: PRODUCER
    title: >-
      Порядок событий слушателя контекста — не порядок страницы. «Тогда» F8-46 «отменено страницей …
      записано раньше выпуска POST» и «вторая ветвь правила отпускания не сработала» у верной
      консоли краснеют. Выбор ветви тем же порядком ошибается в ту же сторону
    anchored_in_delta:
      - "Р6 п. 1 (редакция 7): «исход различает «ответа нет» и «отменено страницей», а порядок записей — порядок событий слушателя контекста; на нём стоит упорядочение F8-46»"
      - "F8-46 «Дано»: «страница выпустила `POST /iam/v1/auth/password`, пока у задержанного нет исхода. Тогда проба … отправляет задержанное краю сама»"
      - "F8-46 «Тогда»: «исход задержанного обращения — «отменено страницей», и он записан **раньше** выпуска `POST /iam/v1/auth/password`»; «между выпуском глагола и его исходом страница обращений к краю не выпускала»; «вторая ветвь правила отпускания не сработала»"
      - "§11.1, строка F8-46/F8-47: «перепись несёт ещё исход «отменено страницей» и порядок событий (Р6 п. 1)»; DoD 10в «F8-46 видена … зелёной после»"
    predicate: >-
      Опыт tmp/f8-c18-probe (см. measurement.experiment). Консоль с упорядочением Р10 в обеих
      допустимых формах (отмена и выпуск в одном такте; выпуск после исхода отмены). У 36 из 950
      исполнений слушатель контекста записал выпуск глагола раньше отмены задержанного, и
      правило отпускания ушло в ветвь 2. В форме пробы полосы (`page.route`) таких 27 из 500.
      Частота зависит от нагрузки на слушатель: у формы «выпуск после исхода отмены» под
      `context.route` было 0 из 175, с одним добавочным слушателем стало 6 из 100. Контроль в обе стороны. Во всех 36 продукт прав: носитель новый, чтение у страницы
      отменено, `fulfill` не подействовал. Консоль без упорядочения даёт ветвь 2 и погашенный
      носитель в 25 из 25.
    consequence: >-
      Проба F8-46 недетерминированно красна на верном продукте — до 7,5 % исполнений (15 из 200,
      отмена и выпуск в одном такте, `page.route`). Ни одна форма нуля устойчиво не дала: у формы
      «выпуск после исхода отмены» под `context.route` 0 из 175 стало 6 из 100 от одного
      добавочного слушателя. DoD требует вердикта «трижды подряд», и держатель, красный через раз на исправной
      консоли, его не даст. Кроме того, «Тогда» держит на приборе свойство, которого прибор не
      производит. Это ровно род PRODUCER, и третий раз подряд в одном и том же месте — у свойства
      переписи Р6.
    remedy_proposed: >-
      (1) Р6 п. 1: снять «порядок записей — порядок событий слушателя контекста». На его место —
      измеренное: порядок записей разных обращений порядком страницы не является (36 из 950), а
      «исход» глагола — событие ответа (заголовки), не `requestfinished`. (2) F8-46 «Тогда»
      перевести на исход, а не порядок: задержанное кончилось у страницы отменой (net::ERR_ABORTED),
      а не ответом края; носитель новый; ни одного `401 session ended`; повтор чтения выпущен после
      ответа глагола — по событию `response` — и получил 200. Какая ветвь сработала, проба
      печатает как сведение, а не утверждение: исход верен при любой, потому что `fulfill` на
      отменённом не действует (36 из 36). Красное до остаётся различимым: у консоли без Р10 чтение
      у страницы получает 401, носитель пуст. (3) Строгий порядок «отмена раньше выпуска глагола»
      держит модульная проба упорядочения (§11.1 её уже называет), где часы и порядок управляемы.
      (4) F8-47 — то же: «задержанное кончилось у страницы ответом края 200, а не отменой» вместо
      вывода из порядка. (5) Опыт — в §1.11 отдельным N с командой, числами и обеими сторонами
      (форма N16).

important_findings:
  - id: I-C18-1
    kind: COVERAGE
    title: >-
      Единица упорядочения не названа, а транспорт консоли зовёт глагол перечня ВНУТРИ логического
      вызова мутации. Если «мутация в полёте» — логический вызов, получается тупик
    coordinates:
      - "kacho@f445aaaa554 ui-future/shared/src/api/client.ts:115–125: `fetch` мутации → при вызове повышения `await requestStepUp(...)` → повтор `fetchJson(..., true)`"
      - "Р10 п. 1: «Мутации в полёте она дожидается»; перечень Р10 содержит повышение (stepUp)"
    reading: >-
      Сетевое обращение мутации к этому моменту уже имеет исход (401), а логический вызов ещё
      ждёт окна повышения. Упорядочение по логическому вызову ждало бы само себя. Держатель
      есть — F8-35, повышение с карточки, — но покраснеет он таймаутом, а не названной причиной.
    ask: >-
      В Р10 назвать единицу — сетевое обращение (`fetch`, поток), а не логический вызов
      транспорта. В модульную пробу упорядочения — случай «мутация получила вызов повышения:
      повышение не ждёт её повтора, повтор выпускается после исхода повышения».
  - id: I-C18-2
    kind: COVERAGE
    title: >-
      Р10 п. 2 задерживает все новые обращения вкладки до исхода глагола. Чем ограничено это
      ожидание, не названо, а у транспортов консоли срока нет
    coordinates:
      - "Р10 пп. 2–3: «новые ждут исхода»; «исход глагола — любой: ответ, отказ, «ответа нет»»"
      - "kacho@f445aaaa554: в shared/src/api, host/src/utils, dashboard/src/utils нет ни `AbortSignal.timeout`, ни `signal:` — git grep, 0 строк"
    reading: >-
      «Ответа нет» как оборванное соединение производитель имеет — это подсадка F8-18. Для
      зависшего соединения его нет. Прежде зависшая смена пароля держала одну форму, после Р10 она
      держит все модули вкладки.
    ask: >-
      Назвать, чем кончается ожидание исхода глагола (срок транспорта глагола либо срок края),
      либо назвать границу и её цену так же, как названа граница «вкладка».

minor_findings:
  - id: M-C18-1
    kind: FORMAT
    text: >-
      Р10: «Глаголы, носителя не ставящие, — признак формы, чтение состояния и заведение второго
      фактора, выход». Назван 4 из 5, пропущен запрос кода восстановления (S3). 13 − 8 = 5.
  - id: M-C18-2
    kind: FORMAT
    text: >-
      Р10, абзац «Граница решения — вкладка»: строка «…не заводит (§3). Посев и оснастка проб — не
      консоль…» шире колонки и сводит два предмета в одну строку. Разнести на два абзаца.

