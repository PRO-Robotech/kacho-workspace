premise_check:
  claim: >-
    Задание: одобрена редакция 6, 6c64f565…; лежит в ws, ветка acc-f8, копия tmp/ws-f8-acc; судить
    текущую редакцию на её отпечатке.
  result: >-
    Подтверждено с уточнением. Ветка acc-f8. HEAD 263ae7ac несёт редакцию 6: `git show HEAD:<док> |
    sha256sum` → 6c64f565…1fd7, совпадает с заданием. Текущая редакция 7 лежит в рабочем дереве
    (`git status` → ` M` на документе), отпечаток f8e19f15…0982430. Судится она.
  lanes_adjudication:
    E-CARRIER_mechanism: >-
      ПОДТВЕРЖДЕНО по дереву. kacho@f445aaaa554 gateway/internal/middleware/auth_own_session.go:91–99:
      при `!found` и пути не из полосы формы край зовёт EndSessionCarriers и отвечает 401. Цепочка
      края оборачивает весь `httpMux` (`gateway/cmd/api-gateway/main.go:1214`), и
      `/iam/v1/accounts` — путь платформы: IsLoginLanePath его не знает (login_lane_paths.go:39–61).
      На петле механизм воспроизведён: консоль без упорядочения, задержанное чтение отправлено с
      прежним носителем после ответа смены пароля → носитель у браузера пуст 25 из 25.
    E-CARRIER_remedy_at_edge_or_service: >-
      ОПРОВЕРЖЕНО (довод полосы края подтверждён). kaname@cbbac984b
      docs/engineering/acceptance/login-lane-issues-our-session-and-logout-ends-it-server-side.md
      (sha256 713ff0bd…, запись ревью 713ff0bd….yaml `verdict: APPROVED`). Ф3-10 «Тогда»: «…F4d-22,
      носитель гасится». Ф3-19 «Тогда»: «прежний носитель `S` с этого момента даёт «сессии нет»».
      Оба средства края и службы запрещены одобренным, и Р10 верно их отвергает.
    P-F823-VACUOUS: >-
      Принято со слов полосы консоли (прогон @fc35fa9f651 на стенде). Здесь это не перемерялось.
      Проба @a8bc25bfcd6 / @987718650a5 (account-settings.spec.ts:178–258) отправляет задержанное
      сама, с носителем момента выпуска, и это прочитано. Форма F8-46, ветвь 2, повторяет её.
    C18_as_condition: >-
      Верно: C18 невыполним в прежней форме. Условие, производитель которого — консоль (Р10), —
      верное решение по существу.

