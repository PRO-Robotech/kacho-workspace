  - id: B4-1
    kind: PRODUCER
    status: PARTIALLY_CLOSED
    closed_part: >-
      Обращения, которые выпускает КОД КОНСОЛИ в странице: F8-01, F8-04, F8-14, F8-18, F8-20,
      F8-35, DoD 14 и F8-37/F8-38. Р6 теперь пишет каждое выпущенное обращение в момент выпуска и
      без фильтра по пути. Распознаватель верен в обе стороны, у отрицания есть положительная
      сторона — подсадка в F8-18. F8-37 судит три вида обращения и печатает отнесённое по референту.
    verified:
      - "фильтр `apiCalls` — fixtures.ts:461–467 `if (/\\/v1\\//.test(u))` по ответам: воспроизведено; различных адресов поставщика с `/v1/` — 0 из 8"
      - "распознаватель `^/(\\.ory|oauth2)(/|$)|/self-service/|/sessions/whoami`: «да» 8 из 8 (N15 дословно); «нет» 0 из 13 путей полосы (kaname@497c44b7 handler.go:71–89); сверх документа — 0 и на собственных путях края `/iam/v1/auth/me`, `/iam/v1/me`, `/iam/v1/me/memberships`, `/healthz`"
      - "утверждение «при любой базе» верно: клиент поставщика выпускает только `/self-service/…` и `/sessions/whoami` (shared/src/lib/kratos.ts:176, 195, 201, 207, 213, 224, 229); у построителя `hydraUrl()` вызывающих нет (git grep 'hydraUrl\\(' → только объявление config.ts:81)"
      - "Р6 п. 1 про шаги перенаправления и окна подтверждён экспериментом, но только для слушателя уровня КОНТЕКСТА; слушатель страницы окна не видит. Р6 говорит «страницы контекста», значит формулировка верна"
