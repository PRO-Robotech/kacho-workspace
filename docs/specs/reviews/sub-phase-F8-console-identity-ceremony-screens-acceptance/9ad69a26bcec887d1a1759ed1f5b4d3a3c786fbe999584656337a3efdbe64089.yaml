blocking_findings:
  - id: B5-1
    kind: PRODUCER
    residual_of: B4-1
    title: >-
      Перепись Р6 — по дельте «одна на все сценарии §11» — не видит обращений контекста запросов.
      Именно этим транспортом идут все пять обращений к поставщику второго пути посева, и именно
      его I4-1 назначает посеву. Поэтому отрицание F8-43 не может упасть, а положительная половина
      F8-43 не может позеленеть
    anchored_in_delta:
      - "Р6 (новое): «Перепись обращений — одна на все сценарии §11»; п. 1 «Каждое обращение, которое выпустили страницы контекста браузера сценария»"
      - "§11 преамбула (новое, I4-1): «посев идёт отдельным контекстом запросов, не делящим банку печенья с браузером … подтверждение второго фактора перевыпускает носитель»"
      - "§14 п. 30 (новое): «Каждое отрицание «ни одного адреса поставщика» стоит на приборе, способном его увидеть»; §16.4 (новое): «у каждого отрицания … есть положительная сторона»; Р6 п. 3 перечисляет держимые подсадкой F8-01, F8-04, F8-14, F8-18, F8-20, F8-35, а F8-43 в перечне нет"
    coordinates:
      doc: "F8-43 («её перепись обращений содержит POST …/enroll, затем …/confirm» и «не содержит ни одного из пяти обращений к поставщику — включая чтение уровня уверенности»); DoD 16; Р6 пп. 1 и 3; §11 преамбула (I4-1); §14 п. 30; §16.4"
      tree:
        - "kacho@f445aaaa554:ui-future/e2e/specs/assurance.ts:111 `page.request.get(${KRATOS}${path})` (инициация потоков), :117 `page.request.post` (отправка потоков), :125 `page.request.get(${KRATOS}/sessions/whoami)` — это пятое обращение, чтение уровня"
        - "kacho@f445aaaa554:ui-future/e2e/specs/stepup.spec.ts:53 зовёт `assuranceLevel(page)` напрямую, мимо `raiseAssurance`"
    predicate: >-
      Эксперимент tmp/f8-r5-probe/probe.cjs. Сервер получил 4 чтения `/.ory/kratos/public/sessions/whoami`,
      перепись контекста (`context.on('request')`) увидела 1 — запрос страницы. `page.request`,
      `context.request` и `request.newContext()` в перепись не попали. Контроль «да» в том же прогоне:
      перенаправление и окно перепись контекста увидела.
    measured: >-
      Р6 п. 1 видит только то, что выпустили страницы. Все пять обращений к поставщику в оснастке
      assurance.ts идут через `page.request`, а I4-1 отправляет посев второго фактора в отдельный
      контекст запросов. Отсюда два исхода для F8-43 на Р6. (1) Отрицание «ни одного из пяти …
      включая чтение уровня уверенности» тождественно истинно для обращений контекста запросов:
      не переехавшее чтение уровня его красным не сделает. Это тот же класс, что B4-1: у поставщика
      нет `/v1/`, а здесь у транспорта нет события страницы. (2) Положительная половина «её
      перепись содержит enroll, затем confirm» при посеве контекстом запросов (форма I4-1) не может
      позеленеть. Сценарий противоречит собственной преамбуле, и первым это покажет прогон, а не
      документ. Подсадка F8-18 держит только виды «переход · запрос страницы · без ответа», вида
      «контекст запросов» в ней нет, поэтому пропуск не видит ни она, ни F8-37: её обход исключает
      `e2e`.
    consequence: >-
      Это угроза корректности задачи, а не форма. DoD 16 — «второй путь посева переехал целиком,
      все ПЯТЬ обращений» — на отрицательной стороне не держит ничто. Держатель в самом опасном
      месте слеп: у пятого обращения, чтения уровня, уже есть история пропуска (круг 2), а его
      держатель не видит транспорта, которым это обращение идёт сегодня. При этом §14 п. 30 и §16.4
      объявляют класс B4-1 закрытым для всех отрицаний. По измерению это неверно, то есть снова
      вводящий в заблуждение текст о том, что держатели держат.
    fix_scope: >-
      Одно место, объём не растёт. Сценарии, ID и бюджет не меняются: подсадка идёт на адрес
      поставщика. (а) Р6 п. 1 пишет и обращения, выпущенные КОНТЕКСТАМИ ЗАПРОСОВ сценария:
      `page.request`, `context.request` и отдельный контекст посева I4-1. Для этого нужна обёртка
      контекста запросов, потому что событий страницы эти обращения не порождают (измерено).
      Другой путь — F8-43 называет свой прибор с этим свойством, и строка §11.1 F8-43 его называет.
      (б) У отрицания F8-43 есть положительная сторона: обращение к адресу поставщика, подсаженное
      через контекст запросов, делает перепись красной с координатой, а без подсадки она зелёная.
      Это новый вид в Р6 п. 3 либо «И» в F8-43. (в) §14 п. 30 и §16.4 привести к измеренному.
    why_not_raised_earlier: >-
      Сам F8-43 старше дельты, но в кругах 1–4 производитель его переписи назван не был: строка
      §11.1 называла оснастку. Приписать его Р6 и увести посев в отдельный контекст запросов —
      ходы редакции 5, и только их сочетание делает оба исхода верными по построению. Рецензент
      круга 4 сам описал исправление B4-1 как «каждый запрос и ответ страницы», и эта граница
      оказалась узкой.

important_findings:
  - id: I5-1
    kind: FORMAT
    title: "F8-37 относит страницу доступности служб к «не обращению», а она обращается к поставщику"
    coordinates: "kacho@f445aaaa554:ui-future/host/src/pages/ReachabilityPage/ReachabilityPage.tsx:11–12 (пути `/.ory/kratos/public/health/ready`, `/.ory/hydra/public/health/ready`), :27 `fetch(path, { credentials: \"include\" })`"
    note: >-
      Это запрос браузера к поставщику по нажатию кнопки. Он не относится ни к одному из трёх видов
      F8-37 (поток · запрос к потоку · сессия): это проба готовности. Её отнесение к `#2733` уже
      принято в §1.8/§7 и названо поимённо, поэтому молчаливого пропуска нет. Но основание
      исключения должно звучать как «обращение вне трёх видов (проба готовности), предмет #2733»,
      а не «не к обращению», иначе заголовок F8-37 «обращающихся … ноль» на зелёном неверен.
  - id: I5-2
    kind: FORMAT
    title: "У следствия для S1 не назван заменитель чтения сессии при монтировании"
    note: >-
      Заменитель в дереве есть: `/iam/v1/auth/me` края, session_identity_handler.go:124
      @f445aaaa554. Имя одной фразой в Р6 снимет вопрос у исполнителя. Контроль «нет»
      распознавателя стоит распространить и на пути края: там 0, измерено этим кругом.
  - id: I4-2
    kind: FORMAT
    status: carried_over
    note: "Не тронуто редакцией 5 по заданию. Замечание в силе: отказы, которые проба делает своим запросом, в перепись сторожа F8-41 не попадают. Это тот же факт о транспорте, что в B5-1, поэтому одна правка Р6 п. 1 может закрыть оба"
  - id: M5-1
    kind: FORMAT
    title: "В шапке строке круга 4 не хватает конца предложения"
    note: "«Запись — в том же каталоге» и следующая строка «— **редакция 5 …» слиплись без точки"

