    (§4): цепочки, которая одновременно разворачивает консоль и не обслуживает адреса церемоний
    чужим экраном, не существует — мой рендер это подтвердил (dev: консоль есть, полоса чужого
    экрана 1; own и prod: консоли нет вовсе). Стенд мне заданием не назван, разрешения на подъём
    нет. Это ТРЕТИЙ исход, он не зачитывается ни в зелёное, ни в красное.
  what_i_did_instead: >-
    Конструируемость судил по производителям: у каждого «Дано» проверял, существует ли глагол,
    фикстура или ручка, которая его строит. Так и найдены B5 (второй путь посева не переписан)
    и B6 (разделяемая ось потолка темпа). Оба — находки о СЦЕНАРИИ, а не о продукте.

verdict_rationale: >-
  Документ сильный: перепись §1 сделана до сценариев, три из шести её чисел я воспроизвёл
  СВОИМИ выражениями, главное — рендер §1.7 — сошлось полностью вместе с положительным
  контролем. Заявление автора, что условие готовности из задания истинно и бессодержательно,
  ВЕРНО, и знаменатель обхода в §13 его чинит. Возврат вызван не этим, а восемью местами, где
  документ утверждает свойство и не даёт ничего, что могло бы упасть при его нарушении:
  поверхность безопасности без сценария (B3), решение без держателя (B2), пара близнецов с
  разными приборами (B4), под-фаза без адреса (B1), «Дано», конструируемость которых зависит от
  нераспознанного или разделяемого ресурса (B5, B6), и DoD, объявленный непроверяемо (B7, B8).
  Ни одно из восьми не требует переписывания документа — все правятся добавлением.
