# ═════════════════════════════════════════════════════════════════════════════
# БЛОКИРУЮЩИЕ — род из закрытого словаря, координата в документе, что добавить
# ═════════════════════════════════════════════════════════════════════════════
blocking:
  - id: B1
    kind: SCOPE
    where: 'Р1 · Р3 · §5 (строка S2) · §13 п. 11 · сценарии F8-23…F8-32'
    finding: >-
      Адрес экрана параметров учётной записи не назван НИГДЕ. Семь глаголов S2 висят на «экране
      параметров учётной записи» без адреса, а `/settings` — ОДИН ИЗ ВОСЬМИ адресов полосы
      (configmap-nginx.yaml:239). По Р1 на посадке, объявившей чужой интерфейс, полоса
      перехватывает эти адреса ДО оболочки — значит если экран сядет на `/settings`, то на
      посадке сосуществования (той самой, что благословляет Р1 и утверждает F8-02) все семь
      глаголов S2 недостижимы by construction, а человек получает чужой экран настроек, который
      наших глаголов второго фактора и повышения не зовёт вовсе. Это дыра в
      production-полноте S2 (ban #14), а не деталь вёрстки.
    why_not_cosmetic: >-
      DoD 11 существует только для S1 и называет три ведомых адреса из восьми; переписи
      маршрутов после S2 нет ни одной. То есть решение не отложено — оно не принято, и §15
      («решения, не оставленные развилкой») о нём молчит.
    fix: >-
      Принять решение в Р3 явно и назвать цену: либо экран садится на `/settings` и тогда
      названо, что на посадке сосуществования S2 недоступна (и это сказано в §5 как граница),
      либо он садится вне восьми адресов, и тогда `/settings` остаётся «названной страницей», а
      Р3 говорит, куда она ведёт. В обоих случаях — пункт DoD с переписью восьми адресов ПОСЛЕ
      S2 и конкретный адрес во `When` сценариев F8-23…F8-32.

  - id: B2
    kind: COVERAGE
    where: 'Р4 (следствие) · §5 (S3) · §12 · §13'
    finding: >-
      Вторая половина Р4 — «до под-фазы S3 консоль этого пути НЕ обещает», и строка
      «не получается войти» появляется «ни одной под-фазой раньше» — держателя не имеет: ни
      сценария, ни пункта DoD. Ничто не мешает реализации S1 поставить на экране входа путь на
      `/recovery`, который по Р3 ответит страницей «такого адреса здесь нет». Это ровно тот
      класс, который Р4 объявляет худшим отсутствия.
    fix: >-
      Сценарий S1: «Дано условия F8-01 · Когда браузер открывает /login · Тогда на экране нет
      пути ни на /recovery, ни на /verification». Близнец — F8-01 (экран отрисован, поля и
      кнопка есть), единственное различие — предмет утверждения; «мёртвым» экран быть не может,
      потому что F8-01 судит тот же экран положительно.

  - id: B3
    kind: NEGATIVE
    where: '§8 ось «безопасность» · §9 строка 4 · Р4 п. 1 и п. 2 · группа B'
    finding: >-
      «Неразличимость причин отказа входа» объявлена поверхностью безопасности в ТРЁХ местах и
      не судится НИ ОДНИМ сценарием. F8-05 меняет пароль у ЗАВЕДЁННОГО человека; сценария
      «адрес в службе не заведён» на полосе входа нет (проверено поиском по всему документу:
      «не заведён» встречается только в F8-14 про регистрацию и в F8-32 про второй фактор).
      Следовательно, консоль, которая начнёт различать «такого адреса нет» и «пароль неверен» —
      то есть отвечать на вопрос «а заведён ли такой человек» тому, кто пароля не знает, —
      пройдёт весь набор зелёной.
    fix: >-
      Отрицательный сценарий: «Дано условия F8-04, но адрес посевом НЕ заведён · Когда отправлена
      форма входа · Тогда ответ 401, code 16, `authentication failed` · И экран показывает
      ПОБАЙТОВО тот же текст и то же состояние формы, что в F8-05». Близнец — F8-05,
      единственное различие — заведён ли адрес. Конструируемо тривиально: посев просто не
      делается.

  - id: B4
    kind: TWIN
    where: 'F8-02 (§11 группа A) и строка F8-02 в §11.2'
    finding: >-
      Пара F8-01 / F8-02 меняет ДВА факта, а не один: объявленность адреса чужого интерфейса И
      ПРИБОР НАБЛЮДЕНИЯ. F8-01 наблюдается браузером, F8-02 — чтением рендера раздачи
      (§11.1 отдаёт их разным производителям: браузерная проба против helm-гейта). Поэтому пара
      НЕ изолирует заявленный факт: Р1 утверждает «маршрут консоли недостижим by construction»,
      а это утверждение браузером не проверяется ни разу, и сломанный маршрут консоли оставил бы
      F8-02 зелёным.
    why_constructible_today: >-
      Браузерное наблюдение F8-02 конструируемо УЖЕ СЕГОДНЯ и легче, чем F8-01: цепочка `dev`
      разворачивает консоль (30 источников) и держит полосу чужого экрана (1) и блоки .ory (2) —
      мой рендер. То есть у отрицательного близнеца предусловие §4 не требуется вовсе.
    fix: >-
      Наблюдать F8-02 тем же прибором: «Когда браузер открывает /login на цепочке, объявившей
      адрес чужого интерфейса · Тогда отдан НЕ экран консоли (перепись обращений страницы
      содержит адрес чужого поставщика)». Гейт рендера при этом остаётся вторым свидетелем, а не
      единственным.

  - id: B5
    kind: CONSTRUCTIBILITY
    where: '§1.5 · §11 группа E (F8-20, F8-21) · §13 п. 12'
    finding: >-
      Перепись §1.5 НЕ РАСПОЗНАЁТ второй путь посева через чужую церемонию, и §11 его не
      переселяет. `ui-future/e2e/specs/assurance.ts` ведёт чужие потоки напрямую —
      `/self-service/settings/browser`, `/self-service/settings`,
      `/self-service/login/browser?refresh=true&aal=aal2`, `/self-service/login` с
      `method: "totp"`, — и его импортируют `stepup.spec.ts` и `users.spec.ts`. Образец
      документа (`registerAndSignIn|tenantWithProject|register\(`) его не ловит: в перечень 24
      он не попал (проверено). Между тем это посев ровно ДВУХ церемоний S2 — заведения второго
      фактора и повышения уровня, — то есть предмет F8-27 и F8-35.
    why_it_matters: >-
      Документ сам объявляет мерой опасности «снятие чужого экрана до переезда фикстуры убивает
      весь набор» и §1.1 сам настаивает на контроле в обе стороны против предиката, не умеющего
      распознать предмет. Здесь этот контроль не применён — и промах пришёлся на ту часть
      набора, которую S2 обязан переселить. После посадки S2 `stepup.spec.ts` и `users.spec.ts`
      продолжат сеять чужой церемонией, а поймает это только оговорка DoD 12 («ни одна
      спецификация набора не зовёт чужой поток»), у которой ни производителя, ни сценария нет.
    fix: >-
      (1) перемерить §1.5 содержательным предикатом (`grep -rn '/self-service/' *.ts`) и назвать
      обе несущие фикстуры с числом зависимых спецификаций; (2) завести в группе E сценарий
      переезда посева второго фактора и повышения на наши глаголы (enroll/confirm/step-up),
      с близнецом; (3) дать DoD 12 производителя — перепись набора, печатающую знаменатель.

  - id: B6
    kind: CONSTRUCTIBILITY
    where: 'F8-09 · §11 «Соглашения» · §13 п. 5'
    finding: >-
      «Дано» F8-09 («подряд исчерпан потолок неверных предъявлений») расходует РАЗДЕЛЯЕМЫЙ,
      временной ресурс, и ни ось, ни величина, ни изоляция не названы. Потолок двухосевой —
      kaname/internal/apps/kaname/api/humansession/rate.go, окна «по адресу и по источнику»; на
      посадке это addressAttempts 5 / addressWindow 15m и sourceAttempts 50 / sourceWindow 15m
      (deploy/helm/umbrella/values.prod.yaml:769-772; цепочка `own` их наследует, своих значений
      не ставит). Ось источника — одна на ВЕСЬ браузерный набор с одного бегуна, и по шапке
      rate.go в неё считаются все отказы входа и неподошедшее подтверждение смены пароля, то
      есть F8-05, F8-09, F8-24, F8-34 и проверка старого пароля в F8-23.
    why_it_matters: >-
      Исчерпав ось адреса (5), сценарий кладёт в ось источника не меньше шести, а окно
      снимается ВРЕМЕНЕМ — пятнадцатью минутами, которых ни условием, ни посевом не отменить.
      Это прямо противоречит соглашению §11 «ожидание — условия, не времени» и DoD 5 «тот же
      вердикт трижды подряд»: три прогона подряд укладываются в одно окно источника, и при
      любом повторе, шардировании или втором прогоне против того же стенда соседние сценарии
      начнут получать 429 вместо своих 400/401 — то есть набор станет зелёным или красным по
      жребию порядка.
    fix: >-
      Назвать в «Дано» ось (адрес), величину и то, что каждый сценарий сеет СВОЙ адрес; назвать
      величину оси источника и показать счётом, что набор в неё укладывается ТРИЖДЫ, либо
      потребовать её переопределения на стенде прогона. Третий законный исход — объявить F8-09
      неконструируемым в общем прогоне и вынести его в отдельную изоляцию.

  - id: B7
    kind: DoD
    where: '§11.1 · §13 пп. 4, 10, 13'
    finding: >-
      Двусторонней трассируемости по ID нет. §11.1 сопоставляет ID ФАЙЛАМ (две браузерные
      спецификации на 34 сценария), пробы по DoD 4 несут только `// verifies #2780` и
      `// verifies #1274` — номер ЗАДАЧИ, а не номер сценария. Поэтому DoD 10 («ни один сценарий
      не помечен пропущенным») и DoD 13 непроверяемы: по дереву нельзя сказать, какой из
      F8-01…F8-38 не сел. Пункт DoD, который нельзя объявить пройденным или непройденным
      объективно, — не DoD.
    fix: >-
      Потребовать, чтобы ID сценария стоял в пробе машинно-читаемо (в заголовке `test(…)` либо
      рядом с `verifies`, как уже принято в наборе), и добавить пункт DoD: перепись печатает
      знаменатель 38, называет каждый ненайденный ID и краснеет на пустом обходе.

  - id: B8
    kind: FORMAT
    where: 'F8-13 (§11 группа B)'
    finding: >-
      «Когда» несёт местозаполнитель `returnTo=<адрес чужого происхождения>` вместо конкретного
      значения — при том что именно КЛАСС значения решает, ловится ли дефект. Открытая
      переадресация объявлена поверхностью безопасности (§8, §9), а наивная проверка
      `startsWith('/')` отвергает `https://чужое` и ПРОПУСКАЕТ протокол-относительный
      `//чужое`, обратную косую и `/\чужое` — то есть сценарий, реализованный по букве, зеленеет
      против настоящего дефекта.
    fix: >-
      Назвать во «Когда» перечень конкретных значений (абсолютный чужой, протокол-относительный,
      с обратной косой) и в «Тогда» — что исход на каждом один и тот же: переход на корень
      консоли, происхождение страницы равно происхождению консоли.

