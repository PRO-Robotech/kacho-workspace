blocking_findings:
  - id: B4-1
    kind: PRODUCER
    title: >-
      Держатель, которому редакция 4 передала «выход не обращается к поставщику» (F8-18, DoD 14),
      стоит на переписи `apiCalls(page)`, которая по построению НЕ ВИДИТ ни одного адреса
      поставщика; вторая названная переписью F8-37 судит только «ведущие браузер» файлы, а DoD 14
      приписывает ей ещё запросы и чтение сессии
    anchored_in_delta:
      - "F8-18, новое «И» редакции 4 (git diff, строка `+**And** не содержит ни одного адреса чужого поставщика — ни запроса к его потоку выхода, ни перехода на него (оба сегодня есть, §1.8)`)"
      - "DoD 14, новый текст редакции 4: «…ни переходом, ни запросом к его потоку, ни чтением его сессии; перепись F8-37 это печатает числом. Места выхода (AuthContext.tsx, shared/src/api/auth.ts) снимаются уже на S1 — их держит F8-18»"
      - "§11.1 строка 1 (переписана редакцией 4 при снятии F8-02): «перепись — `apiCalls(page)` из ui-future/e2e/specs/fixtures.ts»; Р6: «apiCalls(page) уже есть»"
    coordinates:
      doc: "§11.1 строка «F8-01, F8-03, F8-04…F8-19, …»; Р6; F8-18; DoD 14; F8-37; (тот же производитель у отрицательных половин F8-01, F8-04, F8-14, F8-20, F8-35)"
      tree:
        - "kacho@f445aaaa554:ui-future/e2e/specs/fixtures.ts:461–467 — `apiCalls`: `const u = new URL(r.url()).pathname; if (/\\/v1\\//.test(u)) seen.push(`${r.status()} ${u}`)`"
        - "kacho@f445aaaa554:ui-future/shared/src/lib/config.ts:62 — база поставщика `/.ory/kratos/public`"
        - "kacho@f445aaaa554:ui-future/shared/src/api/auth.ts:185 — `window.location.assign(\"/.ory/kratos/public/self-service/logout/browser\")`"
        - "kacho@f445aaaa554:ui-future/shared/src/contexts/AuthContext.tsx:86 (`kratos.whoami()` при каждом монтировании), :142–143 (`initLogout`/`submitLogout`)"
    predicate: >-
      git grep -nE '/\.ory/[^"'"'"'` ]*/v1/' f445aaaa554 -- 'ui-future/**/*.ts' 'ui-future/**/*.tsx' | grep -v node_modules | wc -l → 0
      (из 30 литералов `/.ory/` в прод-дереве консоли); контроль фильтра в обе стороны:
      /\/v1\//.test('/iam/v1/auth/login') → true · '/.ory/kratos/public/sessions/whoami' → false ·
      '/.ory/kratos/public/self-service/logout/browser' → false
    measured: >-
      Перепись, названная производителем, пропускает только пути с `/v1/`. Ни один адрес
      поставщика `/v1/` не содержит. Значит утверждение «перепись не содержит ни одного адреса
      чужого поставщика», построенное на ней, тождественно истинно — оно не краснеет ни при
      переходе на поток выхода поставщика (auth.ts:185), ни при запросах к нему (AuthContext
      :142–143), ни при чтении его сессии (:86). Положительного контроля у БРАУЗЕРНОЙ переписи
      документ не требует нигде (F8-38 — инъекция статической переписи F8-37, другой прибор).
      Вторая половина: F8-37 «Тогда» считает файлы, «ведущие браузер на адрес церемонии», а DoD 14
      (редакция 4) приписывает ей «ни запросом к его потоку, ни чтением его сессии».
    consequence: >-
      Корректность, а не форма. (1) На S1 утверждение DoD 14 «места выхода снимаются уже на S1 —
      их держит F8-18» не держит НИЧТО: F8-37 — сценарий S2, а отрицание F8-18 на названной
      переписи не способно упасть; S1 садится зелёным с выходом, который по-прежнему ведёт
      браузер на поток выхода поставщика и шлёт ему запросы. (2) После S2 чтение сессии
      поставщика (AuthContext.tsx:86) и запросы к его потокам не видит ни браузерная перепись
      (фильтр `/v1/`), ни F8-37 в своей формулировке — и эпик #2564 «снять Ory из kacho»
      получает от приёмки подтверждение «консоль к поставщику не обращается», истинность которого
      ни один держатель не проверяет. Текст документа при этом утверждает обратное («их держит
      F8-18», «перепись F8-37 это печатает числом») — это ровно «вводящий в заблуждение текст»
      критерия ban19.
    fix_scope: >-
      Два места, объём не растёт: (а) §11.1 строка 1 и Р6 — перепись отрицания «ни одного адреса
      поставщика» записывает КАЖДЫЙ запрос и ответ страницы (метод, путь, запрос; `apiCalls` с
      фильтром `/v1/` для неё непригоден), и у неё названа положительная сторона: одно
      подсаженное обращение к адресу поставщика делает её красной с координатой, на снятой
      подсадке — зелёной; (б) F8-37 «Тогда» расширить до «обращающихся к поставщику — переходом,
      запросом к его потоку или чтением его сессии» (предмет N8), либо DoD 14 перестать
      приписывать ей то, чего она не судит. Сценариев, ID и бюджета правка не меняет: подсадка
      идёт во вход переписи, а не живым обращением.
    why_not_raised_earlier: >-
      Производитель `apiCalls(page)` назван с редакции 1, и круги 1–3 его фильтр не читали. Класс
      старше этого круга, но несущее утверждение на нём — S1-держатель мест выхода (N8) — внесено
      редакцией 4, и именно оно делает класс блокирующим сейчас. Найдено тем же приёмом, что B3-1
      и B3-2: производитель прочитан на уровень глубже своего имени.

important_findings:
  - id: I4-1
    kind: FORMAT
    title: "Посев «Дано» в той же банке печенья, что и браузер, делает F8-33 неисполнимым"
    note: >-
      Регистрация посева выдаёт сессию, подтверждение перевыпускает носитель (sf_enroll.go — новый
      bearer, handler.go:662 Set-Cookie). Если посев идёт `page.request` (общая банка с
      браузером), у браузера живая сессия уровня 2, и `/login` по F8-11 формы не покажет — F8-33
      не дойдёт до «Когда». Исполнимо отдельным контекстом запросов посева (или очисткой печенья
      перед открытием `/login`); стоит сказать одной фразой в преамбуле §11. Следствия для
      продукта нет — исполнитель увидит это первым же прогоном.
  - id: I4-2
    kind: FORMAT
    title: "«Сторож считает не меньше истинного» верно только для отказов, прошедших через перепись страницы"
    note: >-
      Отказы, которые проба делает своим запросом, а не страницей (например «вход прежним паролем
      даёт 401» в F8-23), в браузерную перепись не попадают, и сторож недосчитает — сторона
      небезопасная. При запасе 17 из 50 угрозы потолку нет; достаточно сказать, что такие
