      doc: "Р6 п. 4 (статическая перепись набора, «обход» и «Находка также — импорт построителя … или его клиента»); §11.1 строка «статическая перепись набора»"
      tree: "единственный импорт набора из дерева консоли — shared/src/test/console-table-rows.ts; F8-37 исключает `/test/` (предикат PROD, §1.11), console-provider-assurance-not-read исключает только `e2e`"
    predicate: >-
      Опыт b, последний случай. Помощник `ui-future/shared/src/test/level-helper.ts` читает
      `/.ory/kratos/public/sessions/whoami`, fixtures.ts его импортирует. Статическая перепись →
      0, зелёная. `echo ui-future/shared/src/test/level-helper.ts | grep -vE
      'node_modules|\.test\.|/e2e/|/test/'` → 0, то есть F8-37 этого файла не читает. Такое
      место не видит ни один из двух статических приборов.
    why_not_blocking: >-
      На измеренной ревизии замыкание импортов — один файл без поставщика (0 упоминаний, 0
      импортов). Поэтому 6 → 0 и прочие числа не меняются, а сегодняшний предмет F8-43 прибор
      видит (6 узлов). Обход шириной ровно `ui-future/e2e/**` задало решение диспетчера, и
      автор внёс ровно его. Отрицание способно упасть на всём, что лежит в наборе, и не
      способно только на переносе за границу обхода.
    fix_for_implementer: >-
      Обходить `ui-future/e2e/**` вместе с транзитивным замыканием относительных импортов,
      выходящих из набора. Сегодня это 1 файл, и он печатается в знаменателе. Добавить подсадку:
      помощник вне набора с адресом поставщика, импортированный из набора, → 1 с координатой
      помощника. Другой путь — утверждать перечень внешних импортов поимённо (сегодня 1). Первый
      путь честнее: перечень устаревает молча.
  - id: I4-2
    kind: FORMAT
    status: carried_over
    note: >-
      В силе, и N16 теперь подтверждает его замером. Р7 утверждает, что счёт сторожа F8-41
      «не меньше истинного» и что сторона ошибки выбрана безопасной. Для отказов, которые проба
      делает своим контекстом запросов, это неверно. Пример — «вход прежним паролем даёт 401» в
      F8-23, если его делает проба, а не экран: перепись страниц такого отказа не видит, и
      сторож недосчитает. Угрозы потолку нет: запас 17 из 50, и есть вторая половина на уровне
      развёртывания. Исполнителю достаточно подавать во вход сторожа и запись выпускающего по
      семи глаголам. Документ оставил замечание открытым явно (§16.5).
  - id: I5-1
    kind: FORMAT
    status: carried_over
    note: "Основание исключения страницы доступности служб в F8-37: «обращение вне трёх видов (проба готовности), предмет #2733», а не «не к обращению». Документ оставил открытым явно"
  - id: I5-2
    kind: FORMAT
    status: carried_over
    note: "Заменитель чтения сессии при монтировании — маршрут края `/iam/v1/auth/me` (gateway session_identity_handler.go:124 @f445aaaa554); назвать одной фразой. Документ оставил открытым явно"

minor_findings:
  - id: M5-1
    kind: FORMAT
    status: carried_over
    note: "Строка круга 4 в шапке без конца предложения; строки истории только дописываются, поэтому исправлять — следующей строкой, а не правкой"
  - id: M6-1
    kind: FORMAT
    title: "N16: «браузер той же версии, что закреплена набором» — закреплён драйвер, а не браузер"
    note: >-
      @playwright/test 1.56.1 закрепляет Chromium 141.0.7390.37 (playwright-core/browsers.json).
      В ~/.cache/ms-playwright его нет, и опыт круга 5, как и мой, шёл на /usr/bin/google-chrome
      152.0.7977.82. На вывод это не влияет: обращения контекста запросов выпускает процесс
      узла, а не браузер, поэтому их невидимость от браузера не зависит. Верная формулировка —
      «драйвер той же версии; браузер — системный Chrome 152».
  - id: M6-2
    kind: FORMAT
    title: "«step-up нет» держится формой оснастки, а не прибором"
    note: >-
      Граница названа честно, и этого достаточно. Требование «один контекст, заведённый
      оснасткой» тот же статический прибор может держать почти даром: в `assurance.ts` после S2
      ровно одно место заводит контекст запросов, и литерала `/iam/v1/auth/step-up` нет. Это
      рекомендация исполнителю, а не условие.

