closure_of_round_5_blocking:
  - id: B5-1
    kind: PRODUCER
    status: CLOSED
    by_dispatcher_form:
      item_1: >-
        ИСПОЛНЕНО. Р6 судит только трафик консоли: выпущенное страницами контекста браузера,
        слушателем уровня контекста. Положительная сторона — подсадка из кода страницы в F8-18;
        она держит F8-01, F8-04, F8-14, F8-18, F8-20 (экранная часть) и F8-35. Опыт a: 12 из 12
        красных с координатой, 2 из 2 зелёных. F8-43 выведен с Р6 целиком, и это верно по
        предмету: у F8-43 нет трафика консоли, «Когда» у него исполняет оснастка.
      item_2: >-
        ИСПОЛНЕНО. Статическая перепись набора: узлы разбора `ui-future/e2e/**`, знаменатель,
        красное на пустом обходе. После S2 — 0, подсаженная ссылка → 1 с координатой, близнец —
        путь нашего глагола → 0. До S2 названы перечень и число: 6 узлов в 1 файле из 37,
        поимённо. Производитель назван в §11.1: проба рядом с F8-37 в shared/src/test, прогон —
        тестами модуля vpc. Опыт b воспроизвёл каждое из этих чисел.
      item_3: >-
        ИСПОЛНЕНО. В §14 п. 30 названы три транспорта и прибор каждого. Прямо сказано, что
        транспорт контекста запросов в перепись Р6 не попадает (1 из 4). В §16.4 обе прежние
        формулировки помечены «исправлено редакцией 6» со ссылкой на §16.5, и прежний текст не
        стёрт.
    beyond_the_form: >-
      У положительной половины F8-43 («содержит enroll, затем confirm», «step-up нет», уровень из
      ответов) после пункта (1) прибора не осталось. Автор сам назвал ей производителя — запись
      выпускающего: ответы, которые оснастка получила своим контекстом, в порядке выпуска. Для
      «содержит» этот прибор годен по построению, потому что невыпущенное обращение краснит
      утверждение. Для отрицания о поставщике он не используется. У «step-up нет» положительная
      сторона — та же запись того же прогона, увидевшая enroll и confirm. Граница названа: всё
      идёт одним контекстом, который оснастка заводит сама, и прибор этого не держит. Вывод
      принят. Сопутствующее замечание — M6-2.
    residual: "нет блокирующего остатка; граница обхода статического прибора — важное I6-1"

