verdict_rationale: >-
  Решение диспетчера внесено ровно и полностью, и каждое его следствие проверено опытом, а не
  чтением. Перепись страниц краснеет на подсадке из кода страницы по всем 12 сочетаниям формы и
  вида и молчит без неё. Статическая перепись краснеет на подсаженной ссылке с координатой,
  молчит на близнеце и на комментарии, краснеет на пустом обходе. Числа N16 воспроизведены
  независимым прибором до узла. Сценарии, ID и бюджет не тронуты. Блокирующих нет. Четыре важных
  замечания (I6-1, I4-2, I5-1, I5-2) и три малых — поручения исполнителю, условиями одобрения
  они не являются.

