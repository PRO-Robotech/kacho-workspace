# ─────────────────────────────────────────────────────────────────────────────
blocking_findings:
  - id: B1
    kind: COVERAGE
    where: 'F1-52 When, And «конфигураций проверяющего остаётся две»; §1.4 утверждение 3'
    finding: >-
      Утверждение 3 (решение диспетчера: tokenpolicy «общей делается ПОЛИТИКА, а не функция»
      в силе; движок проверяющим не становится) держит F1-52, а его обход ограничен пакетами
      §1.3, то есть только kacho. Движок подключается к службе доступа (LINE-A-1) — в kaname,
      а там уже живут два проверяющих НАШ токен: internal/presentedcred (читатель
      удостоверения, предъявленного на публичном слушателе) и
      internal/handler/tokenintrospecthttp (авторитет отзыва); оба импортируют tokenpolicy,
      построены в cmd/kaname/serve.go:936 и :1471 (kaname 32637536f4c, то же на cbbac984b7b).
      Обход F1-52 зелен при любом импорте церемонии этими пакетами, а положительный контроль
      «5 файлов kacho» делает его похожим на полный. «Конфигураций остаётся две» верно только
      для kacho.
    predicate: >-
      git -C kaname grep -l 'corelib/tokenpolicy' 32637536f4c -- 'internal/presentedcred/*.go'
      'internal/handler/tokenintrospecthttp/*.go' ':!*_test.go' → 2;
      git -C kaname grep -nE 'presentedcred\.New\(|tokenintrospecthttp\.NewHandler\(' 32637536f4c → 2
    required_change: >-
      Включить в обход F1-52 проверяющие наш токен пакеты kaname (с их положительным
      контролем — импорт tokenpolicy) и назвать ревизию; строку «конфигураций две» либо
      сузить до kacho, либо перемерить по трём деревьям. Производитель половины в kaname —
      в таблице группы G.
  - id: B2
    kind: COVERAGE
    where: '§1.4 утверждение 2 («ключница — единственный держатель подписных ключей: движку не передаётся приватный материал»); F1-50 Given и третье And'
    finding: >-
      Утверждение 2 безусловно, а F1-50 его не держит. Сценарий исключает артефакты, не
      предъявляемые нашим поверхностям (код авторизации; по §12 строке 4 — и обновление), и
      его гейт ищет только «подписывающий вход с получателем ПРИВАТНОГО КЛЮЧА». Штатная форма
      движка для кода и токена обновления — симметричная подпись секретом, который держит сам
      движок; ветка названного производителя corelib#20 так его и строит
      (oauthceremony/ceremony.go: Config.SigningSecret — «ключ подписи артефактов» —
      передаётся движку как глобальный секрет, в пакете церемонии, вне поддерева). Такое
      состояние нарушает утверждение 2, но ни одно «Тогда» группы G его не ловит. Текст о
      безопасности заявляет больше, чем держит его сценарий, — ban19: вводит в заблуждение.
    predicate: >-
      git -C corelib grep -n 'GlobalSecret\|SigningSecret' origin/lane/oauth2-engine-intake --
      'oauthceremony/*.go' → ceremony.go:141-142 и поле Config
    required_change: >-
      Решить одно из двух и записать: (а) сузить утверждение 2 до ключей, которыми подписан
      НАШ токен (JWS), и назвать отдельно, кто держит, хранит и вращает симметричный секрет
      движка для кода и токена обновления (фаза §12 строки 2–4, держатель); либо (б) внести
      этот секрет в охват F1-50 («подписывающий вход» — любой, включая симметричный) с
      держателем. Сегодняшнее «движку не передаётся приватный материал» ложно для
      конструкции, которую строит названный производитель.
  - id: B3
    kind: CONSTRUCTIBILITY
    where: 'F1-47 второе/третье And; F1-48 первое и третье And; §1.5 третий пункт (чтение F1-39); §1.4 утверждение 1 «рядом PROVENANCE»'
    finding: >-
      У класса «наш файл под корнем поддерева» исход противоречив. F1-47 допускает файл,
      которого нет у источника, если он в перечне (добавление патчем). F1-48 требует у КАЖДОГО
      файла поддерева строку копирайта и идентификатор источника без изменений — у
      добавленного файла их нет. §1.5 читает F1-39 так, что наш файл несёт НАШ заголовок. Три
      требования к одному файлу несовместимы. Класс не гипотетичен: corelib#20 кладёт
      internal/oauth2/PROVENANCE.md и internal/oauth2/LICENSE В корень поддерева, ветка
      производителя добавляет туда PROVENANCE.md с нашим заголовком, PROVENANCE.patch и свой
      лист storage/tx. §1.4 пересказывает эту раскладку как «рядом PROVENANCE», хотя ссылается
      на corelib#20. Как следствие, производитель сам завёл исключение, которого сценарий не
      называет, — по базовому имени, а не по пути (diff -x PROVENANCE.md): файл
      PROVENANCE.md на любой глубине поддерева проходит сверку зелёным (измерено посевом, rc 0),
      хотя F1-47 требует красного.
    predicate: >-
      .github/scripts/oauth2-provenance.sh на `git archive` ветки lane/oauth2-engine-intake @
      5e50b9f: законное дерево → 0; internal/oauth2/handler/x/PROVENANCE.md → 0; лишний
      internal/oauth2/extra_unlisted.txt → 1
    required_change: >-
      Назвать место манифеста (PROVENANCE, файл патчей) точным путём и то, что сравнению он не
      подлежит по ПУТИ, а не по имени; назвать исход для файла, добавленного патчем: какой
      заголовок он несёт (наш — F1-39) и что гейт узнаёт его по перечню, а не по заголовку;
      F1-48 «каждый файл поддерева» сузить до файлов, пришедших от источника. Исправить
      «рядом» на раскладку corelib#20.

non_blocking_findings:
  - id: N1
    kind: COVERAGE
    finding: >-
      Перепись §1.4 считает у источника только github.com/ory/x. Источник импортирует ещё
      github.com/ory/go-convenience (3 не-тестовых файла: authorize_request_handler.go,
      handler/openid/strategy_jwt.go, handler/openid/validator.go) и github.com/ory/go-acc (2
      файла под //go:build tools). F1-47 («ни одного модуля github.com/ory/») их покрывает;
      таблица занижает объём вырезов. Добавить строку.
  - id: N2
    kind: COVERAGE
    finding: >-
      F1-48 судит отслеживаемые файлы, а не модули, которые движок приносит в граф (go-jose,
      ristretto, govalidator, deepcopy, retryablehttp под MPL-2.0 и др.). Совместимость их
      лицензий не судит ни один гейт: гейт kacho dependencylicense по собственной шапке судит
      наличие лицензии, а не совместимость; у фундамента и kaname такого гейта нет. Сегодня
      принесённые модули пермиссивны или MPL-2.0 (класс уже в графе фундамента), угрозы нет;
      граница F1-48 должна быть названа так же, как названа граница govulncheck.
  - id: N3
    kind: FORMAT
    finding: >-
      F1-49 «уведомлений у модуля четыре»: база OSV отдаёт 6 записей, 4 — после слияния
      синонимов (GO-2021-0109/0110 = GHSA-7mqr/-v3q9). Назвать единицу и то, что ведомость
      сверяется с учётом синонимов, иначе одно уведомление даст два красных.
  - id: N4
    kind: DoD
    finding: >-
      Посадка F1-52 названа моментом («с посадки поддерева»), а не изменением; половина в
      kacho (и в kaname после B1) не может существовать раньше, чем потребитель закрепит
      фундамент с поддеревом. Выровнять с формулой F1-51 и назвать изменение.
  - id: N5
    kind: PRODUCER
    finding: >-
      «Путь входа группа G не снимает»: держатель — браузерная проба #2780, а #2780 открыта
      как раз потому, что пробы нет. Сказать прямо, что сегодня держателя нет.
  - id: N6
    kind: COVERAGE
    finding: >-
      F1-50 «каждым включённым потоком движка»: перечень включённых потоков обязан браться из
      того же объявления, из которого собирается движок, пустой перечень ⇒ красный; иначе
      новый поток выпадет из пробы молча. В исключении назвать токен обновления явно (§12
      строка 4), а не только код.
  - id: N7
    kind: FORMAT
    finding: >-
      Положительный контроль F1-48 опирается на quota/refusal.sql.tmpl, а квоты снимаются
      целиком (решение владельца 2026-09-16) — контроль исчезнет вместе с предметом. Нужна
      собственная фикстура.
  - id: N8
    kind: CONSTRUCTIBILITY
    finding: >-
      Подписывающий интерфейс движка имеет и проверяющую половину (разбор и проверка
      выданного). Вместе F1-50 (связка одна), F1-51 (церемония не импортирует набор) и F1-52 (вне
      поддерева никто не разбирает наш токен) определяют, где эта половина живёт; документ
      этого не называет. Назвать (отказ в связке либо под корнем поддерева), чтобы F1-52 не
      ослабили на первой реализации.
  - id: N9
    kind: FORMAT
    finding: >-
      F1-47 «материал источника по коммиту … сверяет с контрольной суммой»: h1 — сумма архива
      модуля, а не дерева git. Назвать материал: архив модуля по версии, сумма h1 и Origin.Hash
      = коммит (так и делает сценарий производителя).

found_by_the_way:
  - >-
    Ветки названного производителя corelib#20 (lane/oauth2-engine-intake @ 5e50b9f,
    lane/oauth2-intake-gates @ b9b99a8) сегодня расходятся с группой G: go.mod несёт
    github.com/ory/x v0.0.729, github.com/ory/go-convenience, github.com/ory/pop/v6 (F1-47 будет
    красным); oauthceremony/translate.go импортирует go-jose/v3 (F1-51); движок собран с
    симметричной стратегией и для токена доступа (F1-50). Это законный «красный раньше
    зелёного», но предикат снятия corelib#20 требований F1-47/F1-50/F1-51 не содержит — задача
    должна быть выровнена с приёмкой.
  - >-
    kaname несёт SPDX AGPL-3.0-or-later, kacho — BUSL-1.1, фундамент — Apache-2.0: направление
    «движок Apache-2.0 в фундаменте → потребители» совместимо; запрет F1-48 верно поставлен
    на фундамент, а не на потребителей.

