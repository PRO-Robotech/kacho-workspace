    text: >-
      Врезка иллюстрирует форму `GET /iam/v1/accounts/{accountId}/users/{userId}` «по образцу
      IAM-ID-2 §1301» и говорит «а не глобальный …/users/{userId}». IAM-ID-2 §П17 (строка
      1143) числит `/iam/v1/users/{user_id}` действующим глобальным чтением. Приёмка предфазы
      S3.1 (производитель остатка) обязана явно назвать: заменяет ли она глобальный путь
      гейтируемого чтения аккаунт-скоупным или добавляет вариант, и показать, что сегмент
      {accountId} извлекается authz-слоем края БЕЗ реинтродукции снятого поля account_id на
      backend-запрос (§2.3 сохранён на транспорте). Это НЕ дефект контракта этого документа:
      он корректно называет ограничение (форма, не фильтр; §2.3 соблюдён) и легитимно делегирует
      РЕСТ-форму приёмке S3.1. Замечание — чтобы вопрос не потерялся у производителя остатка.
    why_not_blocking: >-
      Семантика объекта гейта названа полностью и согласована с двумя APPROVED (IAM-ID-2 §1301,
      IAM-ID-1 §В-7); транспорт легитимно делегирован приёмке предфазы S3.1 (отдельный предмет,
      как 31/57). Механизм конструируем в принципе (вызывающий из сессии есть, аккаунт из пути —
      одобренный приём IAM-ID-2). Уборка/уточнение у производителя, не условие одобрения этого
      документа.

