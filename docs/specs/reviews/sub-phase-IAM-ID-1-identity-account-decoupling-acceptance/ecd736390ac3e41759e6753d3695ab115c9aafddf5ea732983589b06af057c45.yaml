    rod: '—'
    class: '[DATED] §1.9 смешивает историческую монорепо-таблицу ($R) с перебазированным субъект-блоком; member_remover=4 на $R'
    text: >-
      §1.9 стоит внутри блока §1.0–§1.9, помеченного кругом 13 как ИСТОРИЯ (замер по монорепо).
      Круг 16 внёс в §1.9 живой субъект-блок (membership_id 2 на $KN), при этом историческая
      таблица §1.9 продолжает нести member_remover=4 на $R. Class-exposure отметил member_remover=5
      на kaname (числовая таблица, не пункт возврата). Число вне остатка S3.1 (снятие уже
      приземлено, §1.9) и в помеченном историей блоке.
    why_not_blocking: >-
      В §1.0–§1.9, помеченном ИСТОРИЕЙ (круг 13), и не входит в остаток. Ни одно действующее
      «Тогда» на него не опирается. Смешение живого субъект-блока с исторической таблицей в одной
