blocking_findings:
  - id: B16-1
    rod: CONVENTION
    class: >-
      [CONVENTION] монорепо-предикат остатка S3.1 пережил перебазировку: НЕ перемерен, НЕ помечен,
      противоречит перебазированной врезке — ровно тот предикат, что class-exposure назвал пунктом 4
      возврата kaname#292
    where:
      - '§2.3а, внутри блока «[!warning] Круг 3 перенёс эту работу из S2 в S3», подраздел «Радиус смены объекта — измерен, а не назван»: git show "$R":gateway/internal/middleware/embed/permission_catalog.json | grep -c ''"object_type": "iam_user"'' # 10 — записей каталога на объекте личности'
      - 'врезка «Перебазировка S3.1» (§2.3а) утверждает: «монорепо-формы ниже помечены как перемеренные» — а этот подраздел НЕ помечен (в отличие от соседних блоков «ТРИ глагола» и «все четыре», получивших круг-16 [!warning])'
      - '§20.2 (строка 6 таблицы было→стало) сам называет этот предикат: «§2.3а: радиус объекта «10 записей на iam_user» → 15 записей … аккаунт-скоупны через super_admin только 2 … место правки: врезка «Перебазировка S3.1»» — то есть автор знает о предикате, но правку внёс ТОЛЬКО во врезку, а исходный подраздел оставил как есть'
    sign: >-
      Подраздел «Радиус смены объекта — измерен» стоит в ЖИВОМ §2.3а и предъявляет «10» как радиус
      смены объекта на МОНОРЕПО ($R = gateway/…/permission_catalog.json). Он противоречит
      перебазированной врезке ДВАЖДЫ: (а) дерево — 10 (монорепо) против 15 (субъект-дерево kaname);
      (б) объём смены — «10 записей на объекте личности» как радиус (подразумевает, что меняются
      все) против «2 из 15» (меняются только v_get/v_list; прочие 13 — надзорные/субъект, объект
      не меняется). Врезка обещает читателю, что «монорепо-формы ниже помечены»; здесь обещание
      ложно ровно на предикате, который class-exposure назвал причиной ⛔.
    subject: >-
      Class-exposure kaname#292 вернул ⛔ именно потому, что предикаты S3.1 меряли покинутое
      монорепо (его пункт 4 — этот радиус дословно). Круг 16 перебазировал остальные S3.1-предикаты
      (mbr, глаголы, membership_id, адрес модели, источник каскада, «три глагола»→«два»), но этот
      один оставил монорепо-формой без пометки. Приёмка — единственный артефакт санкции остатка
      S3.1: автор будущей приёмки S3.1 читает §2.3а как handoff остатка. Взяв «10 записей на объекте
      личности» как радиус смены объекта, он сменит object_type у ВСЕХ 15 записей (в т.ч. у 13
      надзорных прав, чей объект оставаться должен iam_user — они cloud-level, «super_admin from
      account», не аккаунт-скоупны через голый super_admin), а это отняло бы у надзорных прав их
      уровень облака. Радиус остатка завышен в ~7 раз (10-всё против 2-из-15), и это тот самый
      класс «перечень «что S3.1 сменит» шире, чем дерево поддерживает», который class-exposure и
      назвал.
    why_not_a_measurement_gap: >-
      Ни один сценарий не теряет производителя; предмет — не покрытие, а ПЕРЕБАЗИРОВКА ПРЕДИКАТА на
      авторитетное дерево (полирепо-дисциплина) и правдивость собственного обещания врезки. Это тот
      же класс «два места об одном предикате, из которых верно одно», который class-exposure назвал
      причиной возврата; круг 16 закрыл его во всех местах, кроме этого одного.
    predicate_of_removal: >-
      Одно из двух, любое:
      (а) пометить подраздел «Радиус смены объекта — измерен» круг-16 [!warning] дословно как
      соседние блоки («ТРИ глагола», «все четыре»): «здесь стояло «10 записей на iam_user» на
      монорепо — на субъект-дереве их 15, из которых объект меняют ровно 2 (v_get/v_list); прочие
      13 надзорные/субъект — объект iam_user СОХРАНЯЮТ; монорепо-форма историческая»; либо
      (б) заменить сам предикат на субъект-дерево: git show f8fc5a37:internal/apps/kaname/seed/embedded/permission_catalog.json
      → 15 записей на iam_user; из них required_relation v_get + v_list = 2 меняют object_type на
      iam_membership. Врезка тогда перестаёт нести ложное обещание «монорепо-формы ниже помечены».
    repeat_of_prior_round_rod: false   # круг 14 — SCOPE, круг 15 — APPROVED; CONVENTION впервые. §14а не срабатывает

