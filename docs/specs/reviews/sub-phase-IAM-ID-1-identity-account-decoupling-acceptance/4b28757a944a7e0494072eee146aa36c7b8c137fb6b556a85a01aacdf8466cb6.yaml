non_blocking_findings:
  - id: N-r1
    rod: '—'
    class: '[COORDINATE] писатели кортежа (§1.5а класс 3) в ноте ПЕРЕДАННОГО сценария 31 и в change-log §19.2 отнесены к S3.1, тогда как действующий контракт кладёт их в полосу Б'
    text: >-
      Действующий контракт однозначен: писатели кортежа области (invite.go/mirror_tx.go/delete.go)
      переводятся в ПОЛОСЕ Б (§4 production-complete S3 row: «писатели … переводятся после S3.1,
      IAM-ID-1-86, полоса Б»; §4 S4-row: «кортеж области — из членства, IAM-ID-1-86, после S3.1»;
      сценарий 86 — их держатель). Но нота ПЕРЕДАННОГО сценария 31 ещё несёт легаси-абзац «пять
      писателей … все правятся в той же стадии» (стадия 31 = S3.1), а change-log §19.2 пишет
      «§1.5а класс «3, 6» … это предмет S3.1». Класс 6 (звено цепи областей / объект гейта) —
      действительно S3.1; класс 3 (писатели) — полоса Б. Смешение верно для класса 6 и неверно для
      класса 3.
    why_not_blocking: >-
      Действующий контракт этого документа (сценарий 86, §4 production-complete, §4 S4-row) кладёт
      писателей в полосу Б однозначно — реализатор этого документа не введён в заблуждение. Спорный
      текст живёт в НЕДЕЙСТВУЮЩИХ местах: тело ПЕРЕДАННОГО сценария 31 (его APPROVED — у приёмки
      S3.1) и change-log круга 15. Ни одно активное «Тогда» не теряет производителя. Риск —
      downstream: будущий автор приёмки S3.1, читая ноту 31 и §19.2, может вписать перевод
      писателей в S3.1, дублируя полосу Б — но это ловится на ревью приёмки S3.1, где §4/86 этого
      документа явно закрепляют писателей за полосой Б.
    suggested_cleanup: >-
      В ноте сценария 31 снять (или пометить принадлежащим полосе Б / сценарию 86) абзац «пять
      писателей … все правятся в той же стадии»; в §19.2 разнести: класс 6 → S3.1, класс 3
      (писатели) → полоса Б (86). Лучше сделать это при написании приёмки S3.1, чтобы её автор не
      перехватил писателей.
  - id: N-r2
    rod: '—'
    class: '[DATED] исторический блок шапки круга 12 («прежняя шапка … этот текст не одобряет») ещё несёт «S3.1 приземляется одним изменением … 61 действующий сценарий»'
    text: >-
      Строка 180 (ОБЪЁМ САНКЦИИ круга 12) повторяет снятую кругом 15 формулировку «S3.1 одним
      изменением» и число 61. Блок ЯВНО помечен историческим и не-одобряющим; правка исторической
      шапки запрещена (change-graph.md §2, история дописывается, не переписывается). Перенос круга 14
      (N2) — исполнен в том смысле, что действующая часть очищена; исторический блок остаётся как
      есть по праву. Отмечено, чтобы «S3.1 одним изменением» в шапке не прочли как действующее.
    why_not_blocking: >-
      Блок исторический и не-одобряющий by construction; действующая часть от него не зависит.

