blocking_findings:
  - id: B14-1
    rod: SCOPE
    class: '[SCOPE] владение кодированием предфазы S3.1 объявлено двумя противоположными способами; расхождение заведено кругом 14 и не сведено'
    where:
      - '§2.5 «S3.1 — предфаза перед В1 … Предфаза — отдельный предмет, задачу заводит диспетчер»'
      - '§4, строка «S3.1 — ПРЕДФАЗА перед В1»: «Отдельный предмет со своей задачей; сценарии — §2.3а, IAM-ID-1-31, -57»'
      - '§1.10.6 «Предфаза — отдельный предмет со своей задачей (заводит диспетчер) … её сценарии — … IAM-ID-1-31, -57»'
      - 'DoD п.26 «Предфаза — отдельный предмет со своей задачей … её кодирование под своим APPROVED, не под этим»'
      - 'ПРОТИВ: §4, строка стадии S3 — S3.1 стоит ПЕРВЫМ КОДИРУЕМЫМ шагом этой стадии («S3.1 — одним изменением: тип членства в модели прав · … · записи каталога прав · строка форм ответа края»)'
      - 'ПРОТИВ: §2.3а (нота круга 6) — S3.1/S3.2/S3.3 как шаги стадии S3, S3.1 кодируется здесь'
      - 'ПРОТИВ: сценарий 31, нота: «Правка модели делается на S3, шагом S3.1 (§2.3а объявляет перенос своим заголовком; §4, §9.1 говорят то же)»'
      - 'ПРОТИВ: сценарий 57, нота: «Что этот сценарий проверяет сегодня — смену объекта гейта, то есть шаг S3.1»'
      - 'ПРОТИВ: §9.1 перечисляет 31 и 57 под стадией S3 ЭТОГО документа; §9.3 считает 31 и 57 среди 73 ДЕЙСТВУЮЩИХ'
    sign: >-
      Один и тот же шаг S3.1 стоит в §4 ДВАЖДЫ — строкой стадии S3 (кодируется здесь) и
      отдельной строкой предфазы (кодируется под СВОИМ APPROVED, не под этим). DoD п.26
      однозначен по-русски: «её кодирование под своим APPROVED, не под этим». Стадия-S3-текст
      столь же однозначно описывает кодирование S3.1 как работу ЭТОГО документа. Обе картины
      внутренне связны и взаимоисключающи.
    subject: >-
      Приёмка — единственный артефакт санкции, и её APPROVED обязан однозначно сказать, что
      разрешено кодировать. Здесь он не говорит: реализатор, читающий §4-стадию-S3 либо ноту
      сценария 31, закодирует S3.1 под ЭТИМ APPROVED — ровно то, что DoD п.26 запрещает.
      Второй, симметричный дефект — учёт сценариев 31 и 57: §2.5/§1.10.6 объявляют их
      сценариями ОТДЕЛЬНОГО предмета (S3.1), кодируемого под своим APPROVED, но 31/57 при этом
      сосчитаны в действующих-73 и НЕ несут пометки зависимости от отдельной приёмки S3.1 —
      в отличие от нового сценария 86 (несёт «после предфазы S3.1, В-14») и в отличие от
      сценариев с `*` (01, 55, 68, 73), помеченных зависимостью от IAM-ID-2. Именно эта
      асимметрия — доказательство несведённости: круг 14 пометил НОВЫЙ сценарий, но не вернулся
      к 31/57, чьим предметом S3.1 и является.
    why_not_a_measurement_gap: >-
      Ни один сценарий не теряет производителя и roadmap не пере/недокрыт — предмет находки не
      покрытие, а ВЛАДЕНИЕ санкцией: коды́руется ли S3.1 под этим APPROVED, и чьи сценарии
      31/57. Это тот же класс «два места об одном предмете, из которых верно одно», который
      документ старательно вычищает в других точках; круг 14 завёл его заново.
    predicate_of_removal: >-
      Свести владение S3.1 к ОДНОЙ картине, любой из двух:
      (а) S3.1 кодируется под ЭТИМ документом как шаг стадии S3 — тогда снять из §2.5, §4
      (строка предфазы), §1.10.6 и DoD п.26 формулировку «отдельный предмет … кодирование под
      своим APPROVED, не под этим», оставив только очерёдность «S3.1 до В1»; либо
      (б) S3.1 — отдельный предмет под своим APPROVED — тогда (1) в §4 строка стадии S3 и нота
      сценария 31 перестают описывать кодирование S3.1 как работу этого документа; (2) сценарии
      31 и 57 получают пометку зависимости от отдельной приёмки S3.1 РОВНО так, как 86 несёт
      «после предфазы S3.1» и как `*`-сценарии несут зависимость от IAM-ID-2, чтобы DoD п.1
      «исполнимый производитель» читался у них как зависимость под гейтом, а не как собственный
      производитель этого документа; (3) §9.1/§9.3 отражают их состояние согласованно с (2).
      Предикат старта В1 (DoD п.26, тип членства ≥1) от выбора не зависит и остаётся как есть.
    not_verified_by_reviewer: >-
      Что именно намеревался диспетчер (S3.1 под отдельным APPROVED или под этим) — не мой
      предмет; я сужу ТЕКСТ редакции 14, а он несёт обе картины. Выбор между (а) и (б) —
      продуктовый, его делает автор/диспетчер, а не рецензент.

non_blocking_findings:
  - id: N1
    rod: '—'
    class: '[COORDINATE] §4 несёт S3.1 в двух строках таблицы'
    text: >-
      Даже после выбора владения (B14-1) две строки §4 про S3.1 стоит свести в одну либо
      явно перекрёстно сослать, иначе расхождение вернётся при следующей правке. Часть той
      же починки.
  - id: N2
    rod: '—'
    class: '[DATED] прежняя шапка круга 12 «✅ APPROVED» и блок ОБЪЁМ САНКЦИИ описывают 61 сценарий и S3.1 «одним изменением … под этим документом»'
    text: >-
      Блок помечен «ниже — прежняя шапка кругов 1–12 дословно … этот текст не одобряет», то
      есть исторический и законно неправленый (change-graph.md §2). Отметки достаточно; но
      строка ОБЪЁМ САНКЦИИ («S3.1 приземляется одним изменением … глаголы ресурса членства …»)
      совпадает по формулировке с действующей стадией-S3-текстом и потому подпитывает
      расхождение B14-1 из «истории». При починке B14-1 стоит убедиться, что действующая часть
      не повторяет её буквой.
  - id: N3
    rod: '—'
    class: '[REFERENCE] предфаза S3.1 не имеет ни номера задачи, ни адреса своей будущей приёмки'
    text: >-
      DoD п.26 говорит «задачу заводит диспетчер» и «кодирование под своим APPROVED», но ни
      номер задачи S3.1, ни путь её будущей приёмки в документе не названы. Для §6а-соседей
      документ даёт точные координаты; для собственной предфазы — нет. Как только диспетчер
      заведёт предмет S3.1, стоит внести его координату рядом с DoD п.26 (иначе «блокирует
      старт В1» ссылается на предмет без адреса).

