what_is_well_done_and_not_a_finding:
  - '§6а оформлен как ЗАВИСИМОСТЬ, а не решение за соседа: у каждой из четырёх приёмок (5.3, 1.2, 1.3, IAM-ID-2) названы точная строка расхождения, замена по решению круга 14, сценарий-держатель здесь; встроенно сосед не правится; готовность — DoD п.25. Цитаты сверены дословно.'
  - 'Четыре «Тогда», чей контракт-дом у одобренного соседа (80→5.3, 81→1.2, 82→1.3, 55→IAM-ID-2), НЕ выданы за готовое: первичный производитель — в полосах Б/А этого документа, а согласование контракта-дома помечено зависимостью §6а и гейтится DoD п.25. Это не «производитель не посажен», а корректно объявленная межприёмочная зависимость.'
  - 'S3.1 предикат старта В1 (DoD п.26) назван проверяемо и воспроизведён: 0 из 32 сегодня, ≥1 требуется.'
  - 'У всех проверенных сценариев группы H (74/75/76/82/55/86) назван производитель и стоит положительный близнец у каждого отрицания, с дельтой в один факт; инъекции в обе стороны заказаны (DoD п.18, П-1…П-19).'
  - 'Конвенции соблюдены: мутации через Operation с поллингом (§5 преамбула), адресация по неизменяемому usr (§2.1, ban #15), инварианты на DB-уровне (S1/S2, ban #10), снятие поля с резервированием номера и имени (§2.3, api-conventions §«Принято-и-проигнорировано»), явный отказ снятого параметра вместо молчаливого приёма (Р7, сценарий 83).'
  - 'Счёт (83/73) воспроизводится обходом файла; предикаты полноты и назначения несут контроль в обе стороны.'

