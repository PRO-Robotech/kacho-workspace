discrepancy_resolved_by_unit:
  question_from_dispatcher: >-
    Автор предфазы нашёл вне своего предмета: from_request_field: "account_id" несут ТРИ RPC,
    а §1.5 родителя называет ДВА. Правка переписи или строка для полосы?
  my_measurement:
    subject_tree: "kaname @ f8fc5a37 — git grep -c 'from_request_field: \"account_id\"' -- proto/kaname/cloud/iam/v1/user_service.proto → 3"
    which_rpcs: "Invite (строка 83) · ResendInvite (131) · RemoveFromAccount (274) — определено по блоку каждого rpc, а не окном"
    parent_predicate_tree: "монорепо kacho @ $R=475f8527 — предикат §1.5 читает proto/kacho/cloud/iam/v1/user_service.proto"
    parent_predicate_state: "⟳ НЕ ВЫПОЛНИЛОСЬ — 475f8527 не резолвится в клоне project/kacho; ветки release/identity-4 на origin нет (git fetch: couldn't find remote ref). Число 2 я не подтвердил и не опроверг."
    why_three_and_not_two: "ResendInvite в монорепо не существовал ни разу: git log -S'rpc ResendInvite' --all -- proto/kacho/cloud/iam/v1/user_service.proto → 0 коммитов. Единица разная: §1.5 мерила КОНТРАКТ МОНОРЕПО, автор предфазы — КОНТРАКТ СЛУЖБЫ."
  verdict: >-
    НЕ блокирующее и НЕ строка для полосы кода. Третий носитель в родителе УЖЕ имеет названный
    исход, и не в одном месте: §1.10.2 («ResendInviteRequest.account_id = 2 … остаётся»,
    предикат на $K=kaname), §2.5 Р4, §1.10.2/§2.5 сноска «на крае снимается только запись
    allowlist Invite, запись ResendInvite остаётся», сценарий IAM-ID-1-84. То есть
    «принято-и-проигнорировано» здесь не возникает: несделанного исхода нет.
  recommendation_non_blocking: >-
    При следующем открытии родителя дописать к месту 5 §1.5 одну оговорку единицы — «монорепо
    @ $R; на субъект-дереве носителей ТРИ (Invite · ResendInvite · RemoveFromAccount), исходы
    — §1.10.2». Это снимет класс «два числа об одном предмете без названной единицы»
    (writing.md §2). Отдельного круга не требует.

