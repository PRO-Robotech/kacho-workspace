  b20_1_closed_self_contradiction:
    result: ЗАКРЫТ
    how: >-
      Абзац §2.3а «Форма пути — аккаунт-скоупная» теперь называет сегмент {accountId} ОТБОРОМ
      (формулировка перенята у предфазы S3.1 §1.1/§4.1), отдельным абзацем говорит, что
      областью решения о доступе сегмент НЕ является (её называет membership_id), и третьим
      абзацем — что слота для ОТБОРА в переписи §1.5 нет вовсе. Вывод «§2.3 соблюдён»
      перевешен на довод «сегмент — не поле РЕСУРСА»; довод про места 2/5 для вывода больше
      не используется. Самопротиворечия в абзаце нет: ни одно из трёх утверждений не
      отрицает другого.
  n20_1_edge_does_not_glue:
    result: подтверждено ЗАМЕРОМ (kacho @ 8d70f599834)
    predicate: |
      git grep -n -A12 'type AuthzCheckInput struct' 8d70f599834 -- gateway/
        → ResourceType string; ResourceID string — ДВА скалярных поля
