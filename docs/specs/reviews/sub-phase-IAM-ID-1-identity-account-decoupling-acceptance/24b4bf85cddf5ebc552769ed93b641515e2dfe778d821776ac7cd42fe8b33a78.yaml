blocking_findings:
  - id: B20-1
    kind: CONVENTION
    title: ОТБОР выдан за ОБЛАСТЬ — самопротиворечие внутри одного абзаца врезки §2.3а
    where: §2.3а, врезка «ИМЕНОВАНИЕ ОБЪЕКТА ГЕЙТА», абзац «Форма пути — аккаунт-скоупная»
    what_the_text_says: >-
      Двумя предложениями раньше: «Областью решения о доступе он при этом **не является** —
      её называет `membership_id`». Затем: «Поле `account_id` в запросе — это место 2/5
      переписи §1.5 (поле-**область**, сохранённое явно), а **не** снятое §2.3 место 1».
    why_wrong:
      - >-
        САМОПРОТИВОРЕЧИЕ: один и тот же `account_id` запроса назван «не областью решения» и
        тут же «поле-область». Врезка существует ровно затем, чтобы решить, ЧТО называет
        область решения; противоречие стоит в ней самой.
      - >-
        НЕВЕРНАЯ АТРИБУЦИЯ ПО §1.5: места 2 и 5 переписи — это `InviteUserRequest.account_id`
        и `scope_extractor.from_request_field: "account_id"` у `Invite`/`RemoveFromAccount`.
        Новый сегмент `{accountId}` на `UserService.Get`/`ListOperations` не является ни тем,
        ни другим: это НОВОЕ вхождение, и его род — ОТБОР, которого в переписи §1.5 слота нет
        вовсе. Перепись §1.5 меряет сегодняшнее дерево; новый сегмент в неё не входит.
      - >-
        ЦЕНА ОШИБКИ НАЗВАНА В ТОЙ ЖЕ ВРЕЗКЕ: третья отвергнутая альтернатива — «гейт на
        `account` + сужение данных», отвергнутая как НЕОБРАТИМАЯ (ban #18, ось
        перспективности). Читатель, принявший `account_id` за поле-область, переизобретёт
        ровно её.
    what_is_correct_and_must_stay: >-
      Вывод абзаца — верен и подтверждён мной: §2.3 остаётся соблюдён, потому что снятое
      место 1 (`User.account_id`) — поле РЕСУРСА, а сегмент пути полем ресурса не является.
      Этот вывод от «поля-области» не зависит и в правке не нуждается.
    how_to_close: >-
      Назвать род сегмента одним словом и одним: ОТБОР (как уже сказано двумя предложениями
      выше и как это дословно сделано в приёмке предфазы §1.1 и §4.1). Довод §2.3-соблюдения
      строить на «не поле ресурса», а не на приписывании местам 2/5.
    reference_that_gets_it_right: >-
      Приёмка предфазы S3.1, §4.1: «Редакция 2 называет область полем `membership_id`, а
      сегмент `{accountId}` несёт **отбор** (§1.1)». Формулировка уже найдена — в родителе
      она осталась прежней.

important_non_blocking:
  - id: N20-1
    kind: precision
    title: «край склеивает тип с одним идентификатором» — край не склеивает вовсе
    where: §2.3а, таблица «Отвергнуто замером», строка про композитный объект
    measured: >-
      kacho @ 8d70f599: AuthzCheckInput (gateway/internal/middleware/authz.go:70-82) несёт
      ResourceType и ResourceID ОТДЕЛЬНЫМИ скалярными полями; вызов
      m.cfg.Checker.Check(ctx, AuthzCheckInput{… ResourceType: resourceType, ResourceID:
      resourceID.String() …}) на строке 1186 передаёт пару, а не строку. Выражение
      descriptor.ResourceType+":"+descriptor.ResourceID встречается в этом файле ТОЛЬКО в
      журнальных вызовах (строки 1129, 1219, 1232, 1250) и на путь Check не попадает.
      Склейки нет и в адаптере gateway/internal/clients/.
    why_not_blocking: >-
      ВЫВОД абзаца («композит требует расширить арность деривации фундамента») верен и моим
      замером УСИЛИВАЕТСЯ: у края ровно одно скалярное поле ResourceID, значит композит
      непредставим без правки структуры. Неточен глагол, а не заключение.
    note: >-
      Тот же класс в приёмке предфазы стоит НАЗВАННЫМ ПРОИЗВОДИТЕЛЕМ сценария S31E-11 и там
      блокирует (B2-2 записи предфазы).
  - id: N20-2
    kind: precision
    title: таблица атомарности делит ОДИН блок scope_extractor между двумя полосами
    where: §2.3а, таблица «Реализация АТОМАРНА и КРОСС-ПОЛОСНА»
    what: >-
      `object_type` отнесён к полосе «модель + каталог | kaname», `from_request_field` — к
      полосе «край | kacho (gateway)». Обе величины — соседние поля ОДНОГО
      option (corelib.authz.v1.scope_extractor) в kaname
      proto/kaname/cloud/iam/v1/user_service.proto и ОДНОГО объекта "scope_extractor" в
      сгенерированном kacho gateway/internal/middleware/embed/permission_catalog.json.
    why_not_blocking: >-
      Я заводил это кандидатом в блокеры и ОПРОВЕРГ собственным замером: каталог существует
      в ОБОИХ деревьях (исходник — опции proto в kaname, встроенная копия — JSON в kacho),
      поэтому у каждой полосы есть свой артефакт, и регенерация переносит обе величины
      вместе. Описание неточно, но change-set исполним, а «Приземляются вместе» это
      покрывает.
    how_to_improve: >-
      Сказать, что полоса kaname меняет ОБЕ величины в опции proto, а полоса kacho
      регенерирует встроенный каталог и вносит строку таблицы форм ответа на новый тип.
  - id: N20-3
    kind: coverage
    title: остаток «сведён к ДВУМ вещам» не называет правку контракта двух запросов
    what: >-
      Механика редакции 20 требует, чтобы `from_request_field: "membership_id"` разрешался,
      а путь нёс два плейсхолдера. Измерено @ kaname f8fc5a37: GetUserRequest несёт ТОЛЬКО
      `string user_id = 1`; ListUserOperationsRequest — `user_id`, `page_size`, `page_token`;
      HTTP-путь `rpc Get` сегодня `/iam/v1/users/{user_id}`. Поля `membership_id` и
      `account_id` в этих сообщениях НЕТ. Сам документ предупреждает: «неразрешённое поле
      роняет процесс при старте».
    why_not_blocking_here: >-
      Родитель прямо делегирует: «Производитель каждого «Тогда» остатка — приёмка предфазы
      S3.1». REST-форму и записи каталога предфаза называет (§1.1, DoD пп. 1–2). Но СУДЬБА
      поля `user_id` не названа НИ ОДНИМ из двух документов — это блокер записи предфазы
      (B2-1), а здесь остаётся заметкой: перечень остатка стоит привести к механике редакции
      20, назвав правку контракта третьей вещью.

