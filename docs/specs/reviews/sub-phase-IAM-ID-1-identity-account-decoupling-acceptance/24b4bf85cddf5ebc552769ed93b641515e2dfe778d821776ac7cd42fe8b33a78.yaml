targeted_checks_from_task:
  - id: T1
    what: механика переписана с «край СОБИРАЕТ объект из двух значений» на «край ЧИТАЕТ membership_id»
    result: ПОДТВЕРЖДЕНО
    evidence: >-
      git diff показывает переписанную врезку §2.3а: заголовок «ИМЕНОВАНИЕ АККАУНТА ГЕЙТА» →
      «ИМЕНОВАНИЕ ОБЪЕКТА ГЕЙТА — ЧЛЕНСТВО СВОИМ СОБСТВЕННЫМ id `mbr-…`, ОДНИМ полем запроса»;
      тело: «Край **читает** идентификатор членства из **одного** поля запроса».
  - id: T2
    what: существо сохранено — объект гейта есть членство, идентичность которого пара
    result: ПОДТВЕРЖДЕНО
    evidence: >-
      Существо подтверждено деревом, а не текстом: kaname.membership_mirror_id(p_user_id,
      p_account_id) LANGUAGE sql IMMUTABLE (internal/migrations/0001_initial.sql:1251-1255) —
      идентификатор детерминированно производится ИЗ пары, значит «id по построению есть пара»
      верно буквально. Форма закреплена CONSTRAINT memberships_id_form_check
      (строка 2169): '^mbr-[0-9abcdefghjkmnpqrstvwxyz]{17}$'.
  - id: T3
    what: обе величины записи каталога — скаляры
    result: ПОДТВЕРЖДЕНО
    evidence: >-
      Текст: «обе величины остаются **скалярами**, как и у всех прочих записей каталога».
      Дерево подтверждает: сгенерированный каталог
      kacho gateway/internal/middleware/embed/permission_catalog.json несёт у обеих записей
      "scope_extractor": {"object_type": "iam_user", "from_request_field": "user_id"} — два
      скаляра; исходник — option (corelib.authz.v1.scope_extractor) в
      kaname proto/kaname/cloud/iam/v1/user_service.proto.
  - id: T4
    what: изоляция названа структурной
    result: ПОДТВЕРЖДЕНО
    evidence: >-
      «**Изоляция становится СТРУКТУРНОЙ, а не проверяемой.** Членство называет **ровно одну**
      пару … поэтому „назвать человека, которого нет в названном аккаунте“ **невыразимо**».
      Довод верен: membership_mirror_id принимает ровно пару, а memberships_id_form_check не
      допускает иной формы.
  - id: T5
    what: subject внесён в семантику гейта
    result: ПОДТВЕРЖДЕНО
    evidence: >-
      Текст: «`super_admin: admin from account` и `subject: [user]` (сам член — для
      самочтения); `v_get` = `… or subject or super_admin`, `v_list` = `… or super_admin`».
      Сверено с деревом @ kaname f8fc5a37, блок type iam_user: define subject: [user];
      define v_get: [...] or subject or super_admin; define v_list: [...] or super_admin —
      совпадает дословно, включая асимметрию v_get/v_list.

declared_deviation_assessment:
  declared_by_author: >-
    Задание говорило «не трогая сценарии», но механическая строка объекта жила и в сценариях
    IAM-ID-1-31 и -57; поправлены ТОЛЬКО механические оговорки этих двух, Given/When/Then не
    тронуты.
  verdict: ПОДТВЕРЖДЕНО ЗАМЕРОМ — отступление ровно такое, как объявлено
  method: >-
    git diff -U0 дал 15 хунков. Диапазоны в новом файле: 3 (шапка), 30 (журнал редакций),
    3022–3210 (§2.3а — врезка и таблицы), 4893–4902, 5006–5008. Ближайший заголовок сценария
    выше каждого из двух последних диапазонов получен awk-обходом:
    4876 «#### IAM-ID-1-31 · Административный уровень одного аккаунта не растекается на
    человека» и 4992 «#### IAM-ID-1-57 · Каскад супер-доступа разрешается относительно
    НАЗВАННОГО аккаунта». Иных сценариев правка не касается.
  gwt_untouched: >-
    В обоих сценариях строки **Given** / **When** / **Then** и «**And** положительный
    контроль» пришли в диффе КОНТЕКСТОМ (префикс пробела), то есть не менялись. Изменены
    только клаузы «**And** «контекст» — …» и «**And** отказ, когда вызывающий не
    `super_admin` …», то есть механические оговорки. Структура утверждения сохранена:
    отказ + побайтовое равенство промаху + положительный близнец с ОДНОЙ дельтой.

