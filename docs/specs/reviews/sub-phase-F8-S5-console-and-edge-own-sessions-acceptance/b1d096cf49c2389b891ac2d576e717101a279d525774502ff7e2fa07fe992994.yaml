approval_scope_note: >-
  Одобрен контракт края и консоли. Ответы полосы, на которые ссылаются браузерные сценарии,
  производит приёмка службы (kaname own-sessions, отпечаток b304ad58…). На этом круге она
  возвращена ровно по одному блокирующему (COVERAGE, Р3/OS-04). Его исправление не трогает
  ни одного «Тогда», которое этот документ цитирует (пути Р1, тексты SESSION_NOT_FOUND и
  SESSION_IS_CURRENT, `ended`, `current`, `userAgent`). Если служба на следующем круге
  поменяет любое из них, этот вердикт перестаёт покрывать затронутые сценарии.

