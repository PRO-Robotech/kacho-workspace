# ─────────────────────────────────────────────────────────────────────────────
adjudication_floor_22:
  question: подтверждает ли рецензент число 22, или перебивает своим основанием?
  answer: ПОДТВЕРЖДАЮ. Своего основания перебить нет; основание автора перемерено и ДОБРАНО.
  авторское_основание_перемерено:
    predicate: "python3 -c \"import base64,os,math; print(len(base64.urlsafe_b64encode(os.urandom(16)).rstrip(b'=')), math.ceil(128/6), 8*6)\""
    result: '22 · 22 · 48 — BASE64URL(16 байт) = 22 символа; ceil(128/6) = 22; 8 символов = 48 бит. Обе величины автора верны.'
  добавлено_рецензентом:
    note: >-
      Автор обосновал пол СНИЗУ (ниже — слабо) и СВЕРХУ (выше — отвергает стойкое из-за
      кодировки), но не назвал цену совместимости. Она измерена и равна нулю для всех ходовых
      производителей `state`.
    predicate: "длины ходовых форм: base64url(32)=43 · UUID с дефисами=36 · hex(16)=32 · base64url(16)=22"
    result: >-
      Все проходят пол 22; 22 — ровно нижняя граница, а не отсечка живого клиента. Единственное,
      что пол отвергает, — base64url(12)=16 символов (96 бит), то есть значение, намеренно
      укороченное относительно 128-битного канона. Ни одна ходовая библиотека столько не отдаёт.
  почему_не_перебиваю:
    - '43 (BASE64URL(32), пол code_verifier по RFC 7636) отверг бы стандартные 128-битные значения — строже без основания.'
    - '16 (96 бит) и 8 (умолчание источника) — числа без своей опорной величины; 8 = 48 бит назван слабым замером.'
    - '22 — единственное число в этом ряду, выведенное ИЗ величины (128 бит), а не назначенное.'
  предел_вердикта: >-
    Подтверждаю число и его основание. Не утверждаю, что 22 — единственно возможный пол:
    утверждаю, что он выведен, а не назначен, и что цена его для клиента измерена и нулевая.

