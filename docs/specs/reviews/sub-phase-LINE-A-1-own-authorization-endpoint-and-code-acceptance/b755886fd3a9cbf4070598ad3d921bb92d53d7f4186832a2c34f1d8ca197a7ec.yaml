non_blocking_findings:
  - id: N4
    class: '[FORMAT] Р13 «Радиус» называет механизм наследования, точный не для всех трёх сценариев'
    detail: >-
      «Сценарии 03, 06, 07 ссылаются на запрос 02 дословно («тот же запрос, что в 02» · «посев
      как в 02»)». Замер: 03 несёт первую формулировку (строка 400), 07 — вторую (строка 428),
      06 — НИ ОДНОЙ. 06 привязан к 02 через «(близнец 02)» в заголовке и строку положительного
      близнеца, то есть дисциплиной change-graph §6, а не цитатой.
    why_not_blocking: 'Исход (наследование 22-символьного state) держится; неточна формулировка о собственном тексте.'
    recommendation: 'При следующей правке документа — назвать для 06 действующий механизм (близнец в один факт), а не цитату, которой в нём нет.'
  - id: N5
    class: '[FORMAT] 06 и 29 НЕРАЗЛИЧИМЫ на проводе — риск ложного зелёного у пробы 06'
    detail: >-
      Оба дают 302 на R с error=invalid_request, без `state` и без описания (описание не уходит
      намеренно, Р13 п.3). Проба 06, написанная с коротким или отсутствующим `state`, получит
      ожидаемый 06 ответ, фактически проверив правило 29.
    why_not_blocking: >-
      Контракт уже связывает 06 с 02 в один факт, то есть ТРЕБУЕТ у 06 валидного state. Дефект
      возможен только у пробы, и снимается условием полосе кода (см. conditions_for_code_lane C2).
  - id: N6
    class: '[CONVENTION] эхо `state` в отказном перенаправлении 06/07 — осознанное расхождение с RFC 6749 §4.1.2.1'
    detail: >-
      RFC 6749 §4.1.2.1 требует возвращать `state` в отказном перенаправлении, если он был
      прислан. У 29 возвращать нечего — расхождения НЕТ. У 06/07 `state` прислан и валиден, а
      приёмка отдаёт только `error`. Сценарий 06 при этом ссылается на ту же §4.1.2.1 (по другому
      поводу — по поводу права перенаправлять).
      Провенанс: норма RFC названа мной по знанию текста RFC 6749 §4.1.2.1; файла RFC в дереве
      нет, командой на своей ревизии я это не перемерял.
    why_not_blocking: >-
      06 и 07 правкой НЕ тронуты (не перелитигирую). Для НОВОГО материала (29) выбор корректен и
      конфликта не даёт. Цена расхождения реальна, но не ломает исполнимость: клиент, ведущий
      несколько параллельных запросов авторизации, теряет корреляцию отказа со своим ожиданием.
    recommendation: 'Отдельным предметом — решить, эхать ли `state` на отказах 06/07. Не в этом круге.'
  - id: N7
    class: '[FORMAT] неединообразие графы «образец» в §9'
    detail: 'Строка 29/30 называет образцом сценарий (06); строки 23/24 называют файловые координаты. Прецедент без координаты в таблице уже есть (25).'
    why_not_blocking: 'Производитель назван координатой; неединообразен только образец.'

