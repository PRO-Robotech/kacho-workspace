  question: отличается ли близнец ровно одним фактом?
  answer: ДА — и дельта ВЫЧИСЛЕНА, а не принята объявлением (change-graph.md §6).
  посев_дельты:
    predicate: 'python3 — построение трёх значений state и сверка предикатом len<22'
    '30': "state='VBV3Db5BMpjm4DM8t6fI-A' len=22 → проходит"
    '29_ветвь_б': "state='VBV3Db5BMpjm4DM8t6fI-' len=21 → отвергается"
    '29_ветвь_а': "state='' len=0 → отвергается тем же предикатом"
    дельта: >-
      21-символьное значение есть ЛИТЕРАЛЬНЫЙ префикс 22-символьного (s22[:21]==s21 → True);
      различие ровно один символ, остальное байт-в-байт. Один факт — длина.
  две_ветви_одного_When:
    вопрос: 'законно ли, что 29 несёт две ветви When?'
    ответ: >-
      ДА, и это не послабление, а ПРЕДМЕТ сценария. Обе ветви лежат на ОДНОЙ оси (длина: 0 и 21),
      и сценарий УТВЕРЖДАЕТ их совпадение по исходу отдельной строкой. Именно это утверждение
      делает обязательность `state` наблюдаемой, а не выводимой читателем — то, чего требовал
      M11 п.1. Разведи ветви по двум ID — утверждение о совпадении исчезло бы.
  граница_с_обеих_сторон:
    ответ: 'ДА — 21 отвергается (29), 22 проходит (30). Сценарий 30 сам называет, зачем он: «без этого близнеца пол, проверенный только снизу, зеленел бы на реализации, отвергающей ЛЮБОЙ state».'

