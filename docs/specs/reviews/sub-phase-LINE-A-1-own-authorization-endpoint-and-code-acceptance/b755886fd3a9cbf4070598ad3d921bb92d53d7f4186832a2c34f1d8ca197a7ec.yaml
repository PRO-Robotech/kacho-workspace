refusal_form_and_delivery:
  question: разведено ли пересечение Р13 с Р4, или только объявлено?
  answer: РАЗВЕДЕНО — назван критерий, и обе стороны критерия несут свои сценарии.
  критерий: >-
    «Доверена ли уже цель перенаправления». ДО того как клиент и redirect_uri сверены —
    отказ БЕЗ перенаправления (04, 05). ПОСЛЕ — отказ ЧЕРЕЗ перенаправление (06, 07, 29).
  тот_же_разделитель_что_в_06:
    предикат: 'сверка формулировок 06 и 29 в дереве'
    '06': '«здесь отказ идёт через перенаправление (клиент и redirect_uri уже сверены и валидны — RFC 6749 §4.1.2.1), в отличие от 04/05, где перенаправлять некуда»'
    '29': '«отказ перенаправляем, а не «без перенаправления»: клиент и redirect_uri к этому моменту уже сверены (Р4), цель доверена — в отличие от 04/05, где перенаправлять некуда»'
    вывод: 'Разделитель ОДИН И ТОТ ЖЕ, назван обоими сценариями своими словами и с одной и той же ссылкой на 04/05. Не объявление — критерий.'
  структурная_опора_проверена:
    predicate: 'чтение github.com/ory/fosite@v0.49.0/authorize_request_handler.go — порядок вызовов в newAuthorizeRequest'
    result: >-
      validateAuthorizeRedirectURI стоит на относительной строке 56 функции, проверка длины
      state — на 91+ (абсолютная 426). Проверка state ДЕЙСТВИТЕЛЬНО после сверки redirect_uri,
      то есть цель к этому моменту доверена. Посылка задания ПОДТВЕРЖДЕНА.
  что_уходит_в_перенаправление:
    уходит: 'error=invalid_request — и больше ничего'
    не_уходит: '`state` (не прислан либо отвергнут) и описание отказа (история браузера + заголовок источника перехода)'
    паритет_с_06_07_проверен:
      predicate: "grep -n '302' по дереву — Then сценариев 06 и 07"
      result: '06 → «302 на R с error=invalid_request»; 07 → «перенаправление на R с error=unsupported_response_type». Ни один не эхает `state` и не несёт описания. Паритет, который Р13 заявляет, в тексте ЕСТЬ.'
  код_перенаправления:
    выбран: 302
    источник_отдаёт: '303 See Other на обоих путях (по замеру класс-экспозиции: authorize_write.go:66, authorize_error.go:68)'
    примечание: >-
      Приёмка ВЛАДЕЕТ наблюдаемым и выбрала 302 на обоих путях; 302 конформен RFC 6749 §4.1.2.
      Это закрывает Б2 пересверки классов («замысел сменил наблюдаемый код без владельца») в
      пользу сохранения прежнего наблюдаемого.

