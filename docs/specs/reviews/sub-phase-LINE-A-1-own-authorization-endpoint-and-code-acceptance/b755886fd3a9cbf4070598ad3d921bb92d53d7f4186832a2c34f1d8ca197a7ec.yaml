radius_02_04_05_09_and_inheritance:
  question: исправлены ли Given 02/04/05/09 и наследуют ли 03/06/07 без противоречия?
  answer: ИСПРАВЛЕНЫ — 4 из 4; наследование ДЕРЖИТСЯ, но заявленный механизм точен не для всех трёх.
  исправлено:
    '02': 'payload: «state = <непрозрачная строка клиента, длиной не ниже пола Р13 — 22 символа>»'
    '04': 'And-строка: «state — не ниже пола Р13 (22 символа): отличие от 02 остаётся ровно в одном факте — redirect_uri»'
    '05': 'And-строка: то же, отличие — client_id'
    '09': 'And-строка: «валидный запрос ниже означает в том числе валидный state»'
  наследование_проверено_по_дереву:
    predicate: "grep -n 'что в 02\\|как в 02' по документу"
    '03': "НЕСЁТ — строка 400: «When тот же запрос, что в 02». Наследует payload 02 дословно."
    '07': "НЕСЁТ — строка 428: «Given посев как в 02». Наследует посев; When меняет response_type."
    '06': >-
      НЕ НЕСЁТ ни одной из двух процитированных формулировок. Given выписан целиком, When —
      «запрос без code_challenge либо с code_challenge_method = plain». Привязка к 02 идёт
      ТОЛЬКО через «(близнец 02)» в заголовке и строку положительного близнеца.
  вывод: >-
    ИСХОД верен: 06 связан с 02 дисциплиной близнеца (change-graph.md §6 — ровно один факт
    различия), значит `state` наследуется вместе с остальным payload 02. ЗАЯВЛЕННЫЙ МЕХАНИЗМ
    («ссылаются на запрос 02 дословно») точен для 03 и 07 и неточен для 06. Это неточность
    утверждения приёмки о собственном тексте, а не противоречие контракта: 06 не «остался
    противоречить», он привязан другим — и тоже действующим — способом.
  блокирует: НЕТ
  почему_не_блокирует: >-
    Сценарий исполним, доказуем и о дереве не лжёт. Риск ложного зелёного реален (см. N5) и
    снимается условием полосе кода, а не новым кругом приёмки.

