conditions_for_code_lane:
  note: >-
    Не замечания к приёмке и не основание для круга. Условия, которые полоса реализации обязана
    внести в СВОЮ форму задания, чтобы правила Р13 не зазеленели ложно.
  items:
    - id: C1
      condition: >-
        Наш писатель перенаправления отдаёт 302 на ОБОИХ путях (успех и отказ). Источник, на
        который похож этот код, отдаёт 303 See Other — взяв его форму, полоса покрасит девять
        утверждений приёмки сразу.
      predicate_for_lane: "grep -c '302' по приёмке → 9; grep -c '303' → 0. Проба обязана утверждать ИМЕННО 302, а не «любое 3xx»."
    - id: C2
      condition: >-
        Проба 06 (PKCE) обязана слать `state` длиной ≥22, взятый у 02. Иначе она пройдёт на правиле
        29, а не 06: на проводе оба исхода побайтово одинаковы (302 → R, error=invalid_request, без
        `state`, без описания). То же для 07.
      predicate_for_lane: >-
        В фикстуре 06/07 значение `state` берётся из общей фикстуры 02, а не задаётся отдельной
        короткой константой. Инъекция: укоротить state в фикстуре 06 → проба обязана ОСТАТЬСЯ
        зелёной по 06 и при этом не стать единственным доказательством правила 29.
    - id: C3
      condition: >-
        Величина пола (22) объявляется ОДИН раз и читается и стражем старта, и путём запроса.
        Незаданность величины обязана ОТКАЗЫВАТЬ В ПУСКЕ, а не подставлять умолчание: умолчание,
        подставляемое молча, делает стража мёртвым (security.md §«Production-mode», класс
        «declared-but-never-read»).
      predicate_for_lane: 'Умолчание величины — нулевое; страж падает на нуле; проба стража красная на незаданной величине.'
    - id: C4
      condition: >-
        Проверка `state` стоит ПОСЛЕ сверки клиента и `redirect_uri` — иначе отказ перестанет быть
        перенаправляемым и 29 покраснеет по причине, которой приёмка не называла.
      predicate_for_lane: 'Порядок в обработчике: клиент → область → redirect_uri → state. Проба порядка: короткий state при НЕзарегистрированном redirect_uri обязан дать исход 04 (без перенаправления), а не 29.'
    - id: C5
      condition: 'Описание отказа не уходит в строку запроса перенаправления ни на одном отказном пути (история браузера + заголовок источника перехода).'
      predicate_for_lane: 'Проба утверждает СОСТАВ параметров перенаправления (ровно {error}), а не только наличие error.'

