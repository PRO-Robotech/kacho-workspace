blocking_findings:
  - id: B1
    class: '[SCOPE] сужение объёма опирается на ЛОЖНОЕ одобрение — A-1 S1 сажает поведение (проверяющий пароля + своя сессия), у которого на базе НЕТ одобренной приёмки (ban #1)'
    sign: >-
      Документ трижды объявляет поведение входа уже одобренным: Обзор (стр. 57–63) «поведение входа
      НЕ переизобретается — оно уже одобрено … sub-phase-ID-PW-1-* (проверяющий пароля). Эти приёмки
      владеют наблюдаемым поведением входа»; §4 (стр. 267) «F4d / F4e / ID-PW-1 (одобрены)»; §7 (стр.
      558) «ID-PW-1 (проверяющий пароля, ✅ APPROVED)». §9 (стр. 608) приписывает поведение проверки
      пароля владельцу ID-PW-1. A-1 S1 при этом ЯВНО сажает это поведение: Р1 «сажает … свой
      проверяющий пароля (ID-PW-1), свою сессию человека»; §10 DoD п. 2 «хранилище способов входа
      человека и хранилище своей сессии провязаны».
    subject: >-
      На базе ID-PW-1 (проверяющий пароля) и своя сессия человека НЕ одобрены НИГДЕ, и это держат
      три места:
      (1) воркспейсная приёмка sub-phase-ID-PW-1-…-acceptance.md сама объявляет: «Статус: SUPERSEDED
      … Одобрения здесь не было: прежняя редакция — DRAFT, кругов ревью ноль, запрет #1 по ней не
      снимался ни разу», и указывает дом — PRO-Robotech/kaname:docs/engineering/acceptance/
      password-verifier-follows-the-stored-value.md (kaname#94);
      (2) этот дом на b673325f НЕ существует: `git cat-file -e b673325f:docs/engineering/acceptance/
      password-verifier-follows-the-stored-value.md` → ошибка; строки password-verifier-follows и
      kaname#94 в дереве службы не встречаются;
      (3) фактический владелец поведения входа/сессии/удостоверений в службе —
      docs/engineering/acceptance/login-session-and-credentials-are-our-contract.md (iam Ф1), и он
      DRAFT: «Статус: DRAFT — вердикт не вынесен; санкции на код нет (ban #1)»; он же несёт проверку
      пароля (argon2id, «проверка пароля по существующему хешу», §2 Р1). Документ LINE-A-1 этого
      владельца НЕ цитирует ВОВСЕ — только ID-PW-1 по снятому воркспейсному имени.
      Итог: одобрить A-1 значит санкционировать написание проверяющего пароля и своей сессии человека
      без одобренной приёмки — ровно то, что запрещает ban #1 и что я как единственный гейт пропускать
      не вправе. F4d (посадка/маршрутизация) и F4e (уровни/шаг вверх) — APPROVED и предметом B1 НЕ
      являются; B1 сужен строго до проверяющего пароля и своей сессии.
    experiment: >-
      Прочитаны шапки на b673325f: `git show b673325f:docs/engineering/acceptance/
      login-session-and-credentials-are-our-contract.md | head` → DRAFT; `git cat-file -e
      b673325f:docs/engineering/acceptance/password-verifier-follows-the-stored-value.md` → отсутствует;
      воркспейсная ID-PW-1 → SUPERSEDED, «одобрения не было». F4d/F4e воркспейсные шапки → APPROVED
      (круг 3). Числа сверены командами, приведёнными в возврате.
    predicate_of_removal: >-
      В Обзоре, §4, §7 и §9 утверждение о владельце поведения входа называет НАСТОЯЩЕГО владельца
      (login-session-and-credentials-are-our-contract.md, kaname — либо преемника password-verifier)
      и его НАСТОЯЩИЙ статус, а не «ID-PW-1 ✅ APPROVED»; и выполнено ОДНО из двух:
      (а) A-1 объявляет посадку своего входа S1 (проверяющий пароля + своя сессия) ЗАВИСЯЩЕЙ от
      одобрения этой приёмки — переключение развёрнутой посадки на `own` не садится, пока владелец не
      APPROVED; ЛИБО (б) A-1 несёт сценарии проверки пароля и своей сессии сам.
      Проверяемо: `grep -niE 'ID-PW-1.*APPROVED|одобрен' <doc>` не даёт ложного одобрения проверяющего
      пароля; `git show <base>:docs/engineering/acceptance/login-session-and-credentials-are-our-contract.md
      | head` показывает статус, на который документ ссылается.

non_blocking_findings:
  - id: N1
    class: '[SCOPE, минор] введение не ссылается на 04-roadmap-and-phasing.md §3'
    text: >-
      Чек-лист §3.1 требует ссылку на roadmap §3 как источник объёма под-фазы. Здесь §3 roadmap — это
      «Уровни тестов», а Линия A / #2564 в roadmap не упомянуты ВООБЩЕ (grep пуст): это линейная
      декомпозиция эпика, чей источник объёма — #2564 и решения владельца 2026-09-19, и они в
      документе названы. Не блокирует: авторитет объёма назван и трассируем. Пожелание: одной строкой
      сказать, что roadmap §3 к линейному эпику не применяется как источник объёма.
  - id: N2
    class: '[TRACEABILITY, минор] §7 не называет дом поведения входа в службе'
    text: >-
      Строка §7 про ID-PW-1 даст читателю мёртвую координату (воркспейсная ID-PW-1 SUPERSEDED). При
      правке B1 назвать дом — login-session-and-credentials-are-our-contract.md (kaname) — чтобы
      трассируемость шва вход→церемония вела в живой артефакт.

