    Посылка «нашими силами этого ещё нет» — подтверждена. Это усиливает B1: проверяющий пароля и
    своя сессия человека в КОДЕ отсутствуют И не имеют одобренной приёмки — A-1 S1 построил бы их
    под несуществующей санкцией (ban #1).

