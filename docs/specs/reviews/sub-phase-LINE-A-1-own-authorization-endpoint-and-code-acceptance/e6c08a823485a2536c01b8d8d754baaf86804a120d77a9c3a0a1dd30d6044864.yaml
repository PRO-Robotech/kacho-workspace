constructibility:
  method: >-
    Приёмка ДО кода: хранилища кода и семейства refresh-токенов не существуют, посев их Given
    неисполним by construction (предмет реализации). Проверено то, что проверяемо на базе: не
    запрещён ли схемой хотя бы один нетривиальный Given из уже существующих ресурсов.
  interactive_client_given:
    result: КОНСТРУИРУЕМ (не запрещён схемой)
    evidence: >-
      internal/domain/interactive_client.go несёт InteractiveClientStatus {ACTIVE, DELETING}
      (зеркалится DB CHECK), RedirectURIs (≥1, каждый https://), id `ic-<17>` hyphen-canon; локальный
      репозиторий internal/repo/kaname/pg/interactive_client_repo.go существует @ b673325f — то есть
      redirect_uris хранятся ЛОКАЛЬНО, и посев ACTIVE-клиента с локальным списком возможен без
      провайдера. Заявление §1 «локальный redirect_uris читается уже сейчас» — подтверждено деревом.
  login_authority_given: >-
    Уровень I: Given аутентифицированного человека — посев ответа порта LoginAuthority (тест-оснастка),
    конструируем by construction. Уровни доверия «1»/«2» — собственность F4e (APPROVED).
  seeded_of_total: >-
    посеяно 0 из N ИСПОЛНЕНИЕМ (стенд/изоляция заданием не назван, хранилища кода не существуют);
    конструируемость interactive-client Given установлена ЧТЕНИЕМ схемы, а не посевом — см. remainders.

