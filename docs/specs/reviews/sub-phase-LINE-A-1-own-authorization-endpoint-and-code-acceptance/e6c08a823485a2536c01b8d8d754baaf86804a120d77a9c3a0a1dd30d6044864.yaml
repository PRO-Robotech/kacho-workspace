    Центральная посылка сужения объёма: «поведение входа НЕ переизобретается — оно уже одобрено
    (F4d/F4e/ID-PW-1)», поэтому A-1 сажает и интегрирует его, но НЕ несёт его сценариев.
  status: ОПРОВЕРГНУТА ЧАСТИЧНО — для ID-PW-1 (проверяющий пароля) и своей сессии человека.
  method: >-
    Прочитаны шапки соседних приёмок в дереве службы и в воркспейсе, по своей ревизии b673325f.
    F4d и F4e — APPROVED (воркспейс, круг 3), посылка для них ВЕРНА. ID-PW-1 — НЕ одобрена нигде на
    базе (см. blocking_findings B1).

