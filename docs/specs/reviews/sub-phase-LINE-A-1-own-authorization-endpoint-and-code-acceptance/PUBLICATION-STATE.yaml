machine_distinguishability:
  question: >-
    можно ли по дереву машинно отличить запись, чьё событие опубликовано, от записи, чьё
    событие не публиковалось?
  answer: НЕТ
  measured:
    field_census: >-
      grep -rn 'published:' docs/specs/reviews --include='*.yaml' → 14 записей несут поле;
      13 говорят `false`, одна (…F1b…/f55c521c….yaml) — `true`
    counterexample: >-
      из 13 «false» по меньшей мере ДВЕ — 304d545e… и b755886f… — на деле опубликованы
      (события измерены выше). То есть значение `false` покрывает ОБА состояния сразу и
      различителем не является ни в одну сторону.
    no_reader_in_tree: >-
      grep -rln 'docs/specs/reviews' scripts/ → ноль. Ни один гейт дерева каталог записей
      не обходит; docs-gate check-01/check-04 судят ОБЪЯВЛЕНИЕ вердикта в шапке документа,
      про событие не знают вовсе.
    coordinate_is_not_in_the_record: >-
      даже внешний предикат «сходить и посмотреть» из записи не строится: обе записи
      называют `task: PRO-Robotech/kacho#2564` (эпик), а события опубликованы в #2721
      (задача под-фазы). Обход всех 8 комментариев #2564 даёт ноль попаданий по обоим
      отпечаткам. Адреса, по которому положено искать событие, в записи НЕТ.
  why_it_is_this_way_and_not_a_bug_of_the_author: >-
    Поле `event.published` заполняет рецензент в момент письма, а публикация — будущее
    событие, которого он знать не может. Утверждение о будущем, записанное в неизменяемый
    журнал, стареет в ложь по построению — и исправить его на месте нельзя, потому что
    правка поля вердикта неотличима от подделки. Дефект структурный: состояние поставлено
    ОБЪЯВЛЕНИЕМ там, где оно обязано быть ВЫЧИСЛЯЕМЫМ.
  what_could_hold_it_going_forward:
    - id: 1
      предложение: >-
        Различитель ВЫЧИСЛЯЕМЫЙ, а не объявленный — как в соседнем SUPERSEDED.yaml, где
        действующая запись определяется равенством `имя == sha256(предмет)`. Здесь:
        «событие записи <X> существует ⟺ в объявленной области событий есть комментарий,
        чьё тело побайтово равно каноническому рендеру `required_body_for_courier` этой
        записи». Предикат тотален: отвечает про любую запись, списка не требует и от
        полноты чьего-либо перечня не зависит.
      чего_не_хватает_сегодня: >-
        (а) поля `event_scope` (репозиторий + номер задачи, куда публикуются события по
        ЭТОМУ документу) — его нет ни в одной записи, а `task:` указывает на эпик, не на
        адресата; (б) канонической побайтовой формы тела — сегодня тела двух событий
        различаются составом («@ <ревизия>» есть у обоих, но у записи редакции 3
        `required_body_for_courier` ревизии не содержит), поэтому сверка возможна лишь
        по вхождению отпечатка, а не по равенству.
    - id: 2
      предложение: >-
        Ведомость публикаций СОСЕДНИМ файлом (`EVENTS.yaml` в каталоге записей), строку в
        которую добавляет курьер ТЕМ ЖЕ коммитом, каким публикует событие. Строка несёт
        `subject_sha256` · `database_id` · `node_id` · `api_url` · `body_sha256` · `actor`
        · `created_at` — словарь уже существует в дереве, он взят из записи
        …F1b…/f55c521c….yaml, где событие предшествовало записи и потому попало внутрь неё.
      почему_соседом: >-
        Запись вердикта остаётся неприкосновенной — правка её полей продолжает быть
        подделкой и продолжает отклоняться. Дополняется ведомость, а не журнал вердиктов.
      предел_назван_честно: >-
        Ведомость без стража — тоже ОБЪЯВЛЕНИЕ: строку может вписать и тот, у кого события
        нет. Сама по себе она переносит ложь из одного файла в другой.
    - id: 3
      предложение: >-
        Страж, который ведомость СУДИТ, а не читает: `scripts/docs-gate/check-06-…` берёт
        `database_id` каждой строки, тянет комментарий по api_url и требует совпадения
        `body_sha256`, `actor` ∈ policy.review_authority, `created_at == updated_at`
        (комментарий не редактировался) и вхождения `subject_sha256` в тело. Только эта
        связка делает состояние ИЗМЕРЯЕМЫМ, а не объявленным; пункты 1–2 без неё дают
        удобство чтения, но не истину.
      парная_проба: >-
        страж обязан краснеть на подставленном входе: строка с несуществующим database_id,
        строка с чужим actor, строка, чей body_sha256 разошёлся с телом. Без инъекционной
        пробы зелёный страж неотличим от стража, ничего не читающего.
    - id: 4
      предложение: >-
        Убрать из записи рецензента то, чего он знать не может: оставить
        `required_body_for_courier` и `event_scope`, а булево `published` не писать вовсе.
        Поле, которого нет, не лжёт; состояние читается там, где его есть кому измерить.
  предел_этой_записи: >-
    Настоящая запись ни одного из четырёх пунктов НЕ вводит — она их называет. Сама она
    такое же ОБЪЯВЛЕНИЕ, как и уточняемые: её строки держатся приведёнными командами и
    тем, что каждая команда воспроизводима, а не машинным стражем. Стража на этот предмет
    в дереве нет; предмет и предикат снятия названы пунктом 3.
