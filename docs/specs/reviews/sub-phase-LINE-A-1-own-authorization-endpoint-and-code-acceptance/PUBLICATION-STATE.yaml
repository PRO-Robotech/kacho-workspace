# Запись-уточнение СОСТОЯНИЯ публикации и коммита — каталог записей ревью приёмки LINE-A-1.
#
# ЧТО ЭТА ЗАПИСЬ ДЕЛАЕТ И ЧЕГО НЕ ДЕЛАЕТ.
#   Делает: называет действительное состояние внешнего события полномочия и коммита
#   содержимого для каждой записи этого каталога, с командой и её выводом на каждое
#   утверждение.
#   НЕ делает: не выносит вердикта, не пересматривает, не подтверждает и не отменяет
#   ни одного прежнего. Вердикт каждой записи лежит в ней самой, не тронут и здесь не
#   оценивается. Предмет этой записи — ТОЛЬКО состояние публикации и коммита.
#
# ПОЧЕМУ ПРЕЖНИЕ ЗАПИСИ НЕ ИСПРАВЛЕНЫ НА МЕСТЕ (две причины, каждая достаточна).
#   1. Журнал ревью ДОПОЛНЯЕТСЯ, а не переписывается: `.claude/rules/change-graph.md`
#      §«история ревью добавляется, не переписывается» — прежняя запись не редактируется
#      и не удаляется, новое утверждение получает СОСЕДНИЙ файл. Перезапись стёрла бы
#      единственное свидетельство того, ЧТО именно рецензент видел в момент вердикта.
#   2. Правка поля «событие опубликовано» в чужой записи вердикта ОТКЛОНЕНА средой как
#      подделка следа аудита, и отклонение правильное: снаружи такая правка неотличима
#      от подделки — тот же байт мог бы вписать и тот, у кого события нет. Состояние,
#      которое нельзя дописать в запись, не подделав её, выражается ДОБАВЛЕННЫМ соседом.
#
# ЧЕМ ОБОСНОВАНЫ ФОРМА И МЕСТО (канон каталога, четыре признака — как у соседнего
# `…-class-exposure/revalidation/SUPERSEDED.yaml`, той же природы файла):
#   1. `change-graph.md` §«история ревью добавляется, не переписывается» — сосед есть
#      законная форма нового утверждения о прежних записях.
#   2. Пространство имён каталога — `<sha256 прочитанного предмета>.yaml`: имя файла ЕСТЬ
#      отпечаток предмета. Эта запись предмета-приёмки не читает и вердикта не несёт,
#      поэтому её имя НАМЕРЕННО вне этого пространства — ASCII-слова, не 64 hex. Это и
#      есть машинный различитель: предикат `^[0-9a-f]{64}\.yaml$` её не захватывает, и
#      читатель записей вердиктов не примет её за вердикт.
#   3. Машинно читаемое состояние в этом дереве пишется YAML (`docs/changes/policy.yaml`,
#      записи ревью `<sha256>.yaml`, ведомость `SUPERSEDED.yaml`); проза — `.md`.
#   4. Место — ТОТ ЖЕ каталог, что уточняемые записи, а не отдельный: координаты записей
#      неизменны (их не переносят и не переименовывают — перемещение чужого файла ломает
#      адресацию так же молча, как правка), а читатель, нашедший записи, находит и это
#      уточнение рядом, без внешнего указателя.
#
# КАК ЧИТАТЬ ССЫЛКИ НИЖЕ: уточняемая запись называется ОТПЕЧАТКОМ своего предмета
# (`clarifies_record_subject_sha256`), а не именем файла. Имя файла в этом каталоге равно
# отпечатку, но адресует именно отпечаток: переименуют файл — утверждение останется верным.

