non_blocking_findings:
  - id: N1
    class: '[FORMAT/DoD-когерентность] аутентификация конфиденциального клиента на обмене приписана ДВУМ стадиям'
    detail: >-
      §5 группа B помечена (S1) и сценарии 10 (Given несёт клиентскую аутентификацию) и 12
      (invalid_client) — S1; §10 DoD S1 п.4 требует invalid_client (12) → клиентская
      аутентификация ГЕЙТИТСЯ в S1. Но §3 таблица стадий кладёт «аутентификация конфиденциального
      клиента на обмене» ТОЛЬКО в S2, а §10 DoD S2 п.13 повторно объявляет её, ссылаясь на те же
      сценарии 10/12.
    why_not_blocking: >-
      Действующий контракт (сценарии + S1 DoD п.4 + §9) однозначно кладёт клиентскую
      аутентификацию в S1; S1 DoD п.4 гейтит её в S1 → S1 НЕ садится без неё, дыры не отгружается,
      ban #14 для S1 удовлетворён. Дефект — двойной учёт одной способности (§3 таблица S1 её
      опускает, S2 её повторяет), а не пробел покрытия и не понижение S1.
    recommendation: >-
      Свести владение способностью в S1: в §3 добавить «аутентификация конфиденциального клиента
      на обмене» в строку S1 и убрать/переформулировать §10 DoD S2 п.13 (иначе документ
      противоречит себе на оси, ради которой ban #14 и назван). Учесть при правке дока
      (новая редакция → новое ревью, change-graph §2) либо на реализации.
  - id: N2
    class: '[FORMAT] потолок тела без отдельного GWT-сценария'
    detail: >-
      Р10/сценарий 24 называют «потолок тела» среди различимых отказов ДО именования кода, но
      отдельного сценария Given-When-Then «тело сверх потолка → отказ» нет. Для нового эндпоинта
      авторизации (GET) тела нет; для полосы authorization_code токен-эндпоинта (POST) действует
      уже существующий потолок тела токен-эндпоинта.
    recommendation: >-
      Либо добавить сценарий на превышение потолка тела на полосе authorization_code, либо явно
      сослаться в DoD на переиспользуемый потолок тела токен-эндпоинта. Не блокирует.
  - id: N3
    class: '[FORMAT] буквы групп не в алфавитном порядке'
    detail: 'Группы идут F,A,B,C,G,H,D,I (F вынесена первой ради нарратива отзыва). ID сценариев 01–28 последовательны, трассировка не страдает.'
    recommendation: 'Косметика; можно упорядочить буквы групп. Не блокирует.'

