b1_closure:
  question: >-
    закрыт ли B1 круга 1 ([SCOPE] сужение объёма опиралось на ЛОЖНОЕ одобрение — A-1 сажал
    поведение входа, у которого на базе не было одобренной приёмки, ban #1)?
  answer: ДА — ЗАКРЫТ. Опора A-1 теперь на Ф1, и Ф1 — удовлетворённое основание, не отложенная зависимость.
  что_было_в_круге_1: >-
    Редакция 1 называла владельцем поведения входа воркспейсную sub-phase-ID-PW-1-* (проверяющий
    пароля) и sub-phase-…-session; ID-PW-1 = SUPERSEDED (кругов ревью ноль, ban #1 не снимался),
    и A-1 S1 ЯВНО сажал это поведение — то есть код входа без одобренной приёмки. Оценка круга 1
    снята на УСТАРЕВШЕЙ рабочей копии службы (kaname @ b673325f, −51 коммит от origin/main).
  что_изменилось_в_редакции_2:
    - >-
      ложная опора на ID-PW-1 УБРАНА; владельцем поведения входа назван Ф1
      (kaname:docs/engineering/acceptance/login-session-and-credentials-are-our-contract.md); §1
      перебазирован на origin/main dd66b5be.
    - >-
      A-1 более НЕ несёт сценариев поведения входа (§5 явно: «A-1 не несёт сценариев поведения
      входа»); вход ИНТЕГРИРУЕТСЯ через шов LoginAuthority (Р2). Предмет A-1 — церемония OAuth
      над швом, не сам вход.
  проверено_рецензентом_на_своей_ревизии:
    Ф1_отпечаток:
      predicate: >-
        git show origin/main:docs/engineering/acceptance/login-session-and-credentials-are-our-contract.md
        | sha256sum (в project/kaname @ dd66b5be)
      result: 7bdef28764f6dc3c78615faf75006c9639f2fbd3d828faa18f4fdc5f109bd14b — совпал с заявленным «7bdef287…»
    Ф1_запись_ревью:
      path: docs/specs/reviews/login-session-and-credentials-are-our-contract/7bdef287…yaml (origin/main kaname)
      verdict: APPROVED
      issued: true
      ban1_lifted: true
      round: 11
      subject_sha256: 7bdef287… (равен текущему отпечатку файла Ф1)
      external_event: https://github.com/PRO-Robotech/kacho/issues/1268#issuecomment-5711678709
      actor: pointpu
      publication_mode: courier_of_agent_verdict
    Ф1_код_посажен:
      predicate: >-
        git grep -niE 'argon2|bcrypt' origin/main -- internal/apps/kaname/api/humansession/login.go
        internal/apps/kaname/config/login_lane.go (в project/kaname)
      result: >-
        проверяющий пароля (argon2id/bcrypt) ЕСТЬ; хранилища basic_credential_repo.go,
        login_method_repo.go, human_session_repo.go присутствуют на origin/main — вход ПОСАЖЕН.
  вывод: >-
    Поведение входа — под APPROVED-приёмкой Ф1 (санкция ban #1 выдана, событие есть). A-1 строит
    церемонию поверх УЖЕ одобренного и посаженного входа — не «зависит от будущего APPROVED».
    Ban #1 удовлетворён: код входа под Ф1, церемония над швом — под этой приёмкой.
  род_SCOPE_повторился: НЕТ — B1 разрешён; второго круга рода SCOPE нет.

