constructibility:
  method: >-
    Судил по дереву службы (origin/main dd66b5be) и его схеме, а не по подъёму стенда. Стенд не
    поднимался (реализация A-1 не начата — сеять её собственные производители нечем).
  seeded_verified: 1
  of_nontrivial_givens: 1
  details:
    - >-
      Given интерактивного клиента (02/04/05: ic-… ACTIVE, локальный redirect_uris) —
      КОНСТРУИРУЕМ: ресурс есть (states ACTIVE/DELETING, поле RedirectURIs, ValidateRedirectURIs
      https/≤16/≤512), локальное хранилище есть (interactive_client_repo.go + таблица в
      0001_initial.sql). Посев существующего репо строит состояние — схемой не запрещено.
    - >-
      Given аутентифицированного человека (уровни "1"/"2") — соответствует реальному состоянию
      Ф1/F4e (acr_floor.go присутствует; уровни реальны). В изоляции конструируется посевом
      ответа шва (Р2), в E/P — реальным входом Ф1.
  not_executed:
    note: >-
      Givens, зависящие от СОБСТВЕННЫХ производителей A-1 (выданный код, refresh_token, ответ
      порта LoginAuthority), посеять сегодня нельзя — их производители «заказаны у реализации».
      Это ОЖИДАЕМО для приёмки до кода, а не дефект конструируемости и не «⟳ не выполнилось»
      вердикта: приёмка судима замером дерева, замер выполнен полностью.

