  twin: 'ПРОЙДЕНО — все отрицания несут близнеца в один факт'
  constructibility: 'ПРОЙДЕНО — Given интерактивного клиента конструируем (репо+схема есть); прочие — производители A-1, ожидаемо не начаты'
