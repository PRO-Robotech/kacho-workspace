subject_absence_measured:
  question: предмет A-1 (церемония OAuth своими силами) действительно отсутствует — не over/under-scope?
  answer: ДА — предикаты §1 (A,C,D,F,G,H) дают ноль на origin/main dd66b5be; предмет реален.
  base: PRO-Robotech/kaname @ dd66b5be (origin/main)
  measured:
    - {predicate: 'A authorization_code в internal/handler/clienttokenhttp (не тест)', result: EMPTY}
    - {predicate: 'C хранилище authorization_code/auth_code/authz_code (repo/migrations, не тест)', result: EMPTY}
    - {predicate: 'D PKCE/code_challenge/code_verifier (internal, не тест)', result: EMPTY}
    - {predicate: 'F refresh_token НАШЕЙ выдачи (искл. hook/webhook)', result: 'лишь output-only grant_types + PII-каталог; нашей выдачи нет'}
    - {predicate: 'G .well-known/oauth-authorization-server', result: EMPTY}
    - {predicate: 'H порт LoginAuthority', result: EMPTY}
  name_collision_handled:
    note: >-
      На origin/main ЕСТЬ iamv1.AuthorizeService (Check/BatchCheck/ListSubjects/ExpandRelations/
      WhoAmI) — это сервис РЕШЕНИЯ доступа (ReBAC/authz), НЕ browser-facing OAuth-эндпоинт
      авторизации. Предикат B в §1 сужен фильтром `grep -iE 'path|mux.Handle|"/'` именно чтобы
      исключить эту коллизию имён — сделано корректно. OAuth-эндпоинт /iam/v1/authorize
      отсутствует.

