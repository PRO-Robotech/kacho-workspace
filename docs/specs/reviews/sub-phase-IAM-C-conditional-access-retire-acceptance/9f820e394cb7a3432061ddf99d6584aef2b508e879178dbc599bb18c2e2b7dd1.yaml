prior_blocking_check:
  - id: B1
    status: closed
    evidence: >-
      IAM-C-10 утверждает `404`, `application/json`, тело дословно
      `{"code":5,"message":"Not Found","details":[]}` на всех шести вызовах. Утверждается и
      побайтовое равенство с `GET /iam/v1/neverExisted/abc`, и что ни аутентификация, ни права не
      вызываются. Положительный близнец — ListByAccount → 200, меняет один факт: маршрут есть.
      Строка §5.4 и §13.1/§13.2 переписаны так же. Производитель назван по самому внешнему
      отвечающему слою (сторож маршрута, main.go:1214). Всё перемерено рецензентом
      самостоятельно (gates_run_by_the_reviewer).
  - id: B2
    status: closed
    evidence: >-
      IAM-C-11 утверждает тот же `404` побайтово в обеих посадках. Сторож ветвится только по
      слушателю и маршруту (external_route_gate.go:85–105) и посадку не читает — проверено чтением.
      Описание «unauthenticated…», 403 анониму и «missing access token» сняты. Положительный
      близнец — анонимный запрос на ListByAccount → `401` единым отказом authnrefusal: заголовок
      `Bearer realm="kacho", error="invalid_token"` и тело дословно совпадают с захватом
      рецензента. Производитель — refuseUncredentialed (auth.go:1093–1106), затем
      authnrefusal.WriteHTTP.
prior_non_blocking_check:
  - id: N1
    status: closed
    evidence: >-
      «Различимость» перечисляет три 404 и три 403. Сверено @e9ce4ffbdc: notFoundMessage
      (permission_denied_response.go:240) — формат владельца либо "not found"; writeHTTPNotFound
      (:252) — без ключа details; stepUpDenyMessage (auth_stepup.go:252) — текст дословно совпадает.
  - id: N2
    status: closed
    evidence: '§13.1 смягчает довод и даёт исправленную форму: дефект каталога не должен выглядеть как отсутствие маршрута.'
  - id: N3
    status: closed
    evidence: 'В Given IAM-C-10 назван аккаунт `A` (`<A>`, проект `<P>`); близнецы IAM-C-10/11 ссылаются на него.'

