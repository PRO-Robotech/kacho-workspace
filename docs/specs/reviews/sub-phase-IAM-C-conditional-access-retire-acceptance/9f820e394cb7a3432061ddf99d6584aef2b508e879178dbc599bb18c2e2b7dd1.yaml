gates_run_by_the_reviewer:
  - >-
    Независимый захват: временная проба TestZZReviewerCapture3249 в одноразовой рабочей копии
    kacho @ e9ce4ffbdc (после прогона снята, в дерево не вносилась), сборка realEdge. Команда:
    `heavy-slot.sh --local … go-race -- go test ./internal/restmux/ -run 'TestZZReviewerCapture3249$'
    -count=1 -v` → `ok … 0.031s`, код 0. Сессия и аноним на шести ретайренных путях и на
    /iam/v1/neverExisted/abc: 404, CT application/json, WWW-Authenticate пуст, тело
    {"code":5,"message":"Not Found","details":[]} — 14 из 14 совпадений. Аноним на
    ListByAccount — 401, WWW-Authenticate `Bearer realm="kacho", error="invalid_token"`, тело
    authnrefusal дословно как в документе. Сессия на ListByAccount — 403 "permission denied:
    iam.access_bindings_by_account.list" (отказывающая проверка сборки).

