producers_walk:
  revision: 'PRO-Robotech/kacho @ e9ce4ffbdc (голова origin/3172-identity-own-2; та же ревизия, что в §13.2)'
  rows:
    - claim: '403/code 7/"permission denied"/AUTHZ_DENIED на промахе каталога'
      result: >-
        Верно для посредника прав в одиночку: authz.go:905 (!found), permission_denied_response.go:70,
        :99, :269–:311. Держатель TestAuthz_HTTP_CatalogMissIsDenied (authz_refusal_distinct_test.go:74)
        судит middleware.AuthzMiddleware.HTTP напрямую, без цепочки края.
    - claim: 'ретайренный путь доходит до промаха каталога на краю'
      result: >-
        НЕВЕРНО на внешнем слушателе: см. B1.
    - claim: 'тело ретайренного пути = тело никогда-не-бывшего пути, кроме metadata.fqn'
      result: >-
        Верно для ветки !found (resourceLabel пуст, subject пуст, тип нарушения один «catalog»),
        но ветка на внешнем слушателе недостижима (B1). Эхо — не дословный путь: grpcMethodForPath
        (dpop_http_middleware.go:395) возвращает "/" + путь, то есть "//iam/v1/…".
    - claim: 'близнец: ListByAccount у владельца аккаунта → 200'
      result: >-
        Конструируемо: rest_route_table_gen.go:102; permission_catalog.json:2475 (v_list, account,
        без hide_existence); kaname proto/kaname/cloud/iam/v1/fga_model.fga — `v_list: … or owner`.
    - claim: 'IAM-C-11 production-strict: 401 от RequireForAllRequests (main.go:628)'
      result: 'НЕВЕРНО: см. B2.'
    - claim: 'IAM-C-11 production: 403, описание "unauthenticated: authentication required"'
      result: 'НЕВЕРНО: см. B2.'
    - claim: 'норма hard-catalog-complete — одна строка, security-hardening.md:15'
      result: 'Верно: grep -n даёт одну строку :15.'

blocking_findings:
  - id: B1
    kind: PRODUCER
    where: 'IAM-C-10 (Then целиком); §5.4 строка «аутентифицированный»; §13.1 «Код края уже производит этот ответ»; §13.2 строки IAM-C-10'
    text: >-
      На внешнем слушателе края ретайренный путь до проверки прав НЕ ДОХОДИТ. При e9ce4ffbdc
      самый внешний слой цепочки REST, не считая потолка тела и восстановления после паники, —
      сторож маршрута kacho#3053: gateway/cmd/api-gateway/main.go:1214
      `inner = restHandler.ExternalRouteGate(httpMux, inner)` стоит СНАРУЖИ authInterceptor (:1205),
      DPoP (:1203) и authzMW (:1200). gateway/internal/restmux/external_route_gate.go:61–103: координата,
      которой нет ни в собственных путях края, ни в публичной таблице маршрутов grpc-gateway,
      получает промах маршрутизации grpc-gateway `404` («внутренних и несуществующих разом»), и
      цепочка не вызывается. Держатель: TestExternalListener_InternalSpacesAnswerNoRouteBeforeTheChain
      (external_route_gate_test.go:279) с близнецом absentTwinPath требует `404` от grpc-gateway и
      `reached=false`. Маршрута /iam/v1/conditions* в таблице нет:
      `git show e9ce4ffbdc:gateway/internal/middleware/rest_route_table_gen.go | grep -c conditions` → 0,
      шаблонов с переменной в третьем сегменте /iam/v1/{…} — 0; на own-mux под /iam/ только точный
      /iam/v1/auth/me. Значит, все шесть вызовов IAM-C-10 и `GET /iam/v1/neverExisted/abc`
      отвечают `404`, `code` 5, а не `403`/7/AUTHZ_DENIED. Утверждение «ни один не отвечает 404»
      ложно. Ретайренный путь — промах МАРШРУТИЗАЦИИ, а не промах КАТАЛОГА. Промах каталога на краю
      бывает только у смонтированного метода без записи: на внутреннем слушателе или у публичного
      маршрута без строки каталога, то есть ровно у нарушения hard-catalog-complete. Производитель
      в §13.2 назван по посреднику прав в одиночку, его держатели не собирают цепочку края.
    fix: >-
      Исход промаха каталога (403/AUTHZ_DENIED, §13.1) может остаться, норма не правится. IAM-C-10
      утверждает промах маршрутизации: `404`, тело производит grpc-gateway (code 5; дословное тело
      захватить производителем, не писать по памяти), ни authn, ни authz не вызываются. Сравнение с
      путём, которого не было никогда, СОХРАНИТЬ: теперь оно имеет производителя (один ответ
      сторожа) и совпадать должно побайтово, без оговорки про fqn. Положительный близнец
      ListByAccount → 200 оставить: он меняет ровно один факт — маршрут есть. Различимость `404`
      маршрутизации и `404` владельца и скрытия существования — по `message`. Производитель в
      §13.2 — external_route_gate.go и main.go:1214. Держатель края — кейс newman через внешний
      слушатель.
  - id: B2
    kind: PRODUCER
    where: 'IAM-C-11 (обе ветви Then); §5.4 строка «анонимный»; §13.1 «при любом состоянии аутентификации … раньше отвечает входной рубеж»; §13.2 строки IAM-C-11'
    text: >-
      (а) Сторож маршрута стоит снаружи аутентификации (B1). Поэтому анонимный вызов ретайренного
      пути получает `404` в ЛЮБОЙ посадке, и в production-strict тоже, а не `401`. Это объявленная
      цена решения kacho#3053: «аноним отличает публичный маршрут (401) от отсутствующего (404)»,
      external_route_gate.go:71–73. (б) Даже на маршруте, который пропускает сторож, аноним без
      удостоверения не доходит до посредника прав ни в production, ни в production-strict:
      AuthInterceptor.refuseUncredentialed (gateway/internal/middleware/auth.go:1093–1106, заведён
      e00dfe9b19, #2958) отвечает единым отказом `401` во всякой посадке, кроме dev, если путь не
      публичный и строка не допускает анонима. Значит, «403 в посадке production» и описание
      нарушения "unauthenticated: authentication required" на краю производителя не имеют. Ветка
      ";unauthenticated" из authz.go:910 видна только пробам посредника в одиночку
      (TestAuthz_GRPC_CatalogMiss_UnauthenticatedReason). (в) Производитель `401`, названный в
      §13.2 (RequireForAllRequests, main.go:628), не первый: authInterceptor (:1205) стоит снаружи
      DPoP. (г) Неправленая строка того же Then — `WWW-Authenticate: … missing access token"` — не
      производится: authnrefusal.Challenge = `Bearer realm="kacho", error="invalid_token"`, тело —
      code 16, "authentication failed", AUTHN_REQUIRED (gateway/internal/authnrefusal/authnrefusal.go:45–57).
    fix: >-
      IAM-C-11 утверждает тот же `404` промаха маршрутизации, что IAM-C-10, без токена, в обеих
      посадках, побайтово равный ответу на никогда-не-бывший путь. Положительный близнец — тот же
      анонимный запрос на СУЩЕСТВУЮЩИЙ публичный маршрут, например `GET /iam/v1/accounts/<A>/accessBindings`
      без токена. Он даёт `401` единым отказом (authnrefusal: код, текст, заголовок дословно) и
      меняет ровно один факт: маршрут есть. Строки про 403 анониму, описание "unauthenticated…" и
      "missing access token" снять.

non_blocking_findings:
  - id: N1
    text: >-
      Абзац «Различимость промаха и нехватки права» не универсален. У строк каталога с hide_existence
      нехватка права на чтении даёт `404` (writeHTTPNotFound), а у отказа по уровню
      подтверждения — stepUpDenyMessage, а не "permission denied: <право>". Оговорить обе
      линии. Непустое право есть у всех 359 строк каталога, пустых 0, `<exempt>` 24 (подсчёт
      разбором permission_catalog.json @e9ce4ffbdc).
  - id: N2
    text: >-
      Второй довод §13.1 против `404` слабее, чем написано: промах маршрутизации grpc-gateway
      отличим от `404` владельца ("<Resource> %s not found") и от `404` скрытия существования по
      `message`. После B1 абзац переписать: `404` уже производится сторожем маршрута, а
      `403` остаётся исходом промаха КАТАЛОГА.
  - id: N3
    text: >-
      Given IAM-C-10 говорит «владелец аккаунта» без имени, а близнец ссылается на `<A>`. Назвать `A`
      в Given.

open_questions_adjudication:
  - question: >-
      Решение диспетчера «промах каталога → 403» и внешний `404` kacho#3053 — противоречие ли это?
    reviewer_reading: >-
      Нет, если развести предметы. 403 — исход промаха каталога у смонтированного метода, и норма
      hard-catalog-complete с ним согласна. 404 — исход промаха маршрутизации на внешнем слушателе.
      Обратный вариант — сделать внешний ответ на ретайренный путь `403` — потребует пропускать
      непубличные координаты сквозь сторож. Тогда либо внутреннее пространство станет отличимо от
      несуществующего, либо `403` снова назовёт внутренний метод и его право. Это откат kacho#3053,
      ban06, расширение поверхности. Рекомендация — первый вариант.

remainders:
  constructibility: >-
    Посеяно 0 из 2 (Given IAM-C-10: владелец аккаунта с токеном; близнец ListByAccount). «Не
