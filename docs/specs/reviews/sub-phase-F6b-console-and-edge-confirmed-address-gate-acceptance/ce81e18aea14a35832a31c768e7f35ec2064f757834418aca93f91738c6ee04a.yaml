important_findings:
  - id: I5-1
    kind: PRODUCER
    scenario: F6b-55
    title: "Страж слота пути не назван производителем"
    note: >-
      Близнец F6b-55 требует метку «условие не создано» с именем слота clusterTargetUserId на каждом
      шаге, которому нужна цель. Сегодня gen.py сторожит только адрес слушателя (require_env_url,
      :356) и слот субъекта auth (:454); слот, подставляемый в путь и тело, стражем не покрыт.
      Строке §5 стоит назвать нового стража рядом с ними, иначе без слота шаг уйдёт с пустым
      идентификатором и даст красное вместо «не выполнилось».
  - id: I5-2
    kind: COVERAGE
    scenario: F6b-55
    title: "Свежесть цели теперь — на прогон посева, а не на прогон набора"
    note: >-
      Сегодня цель заводится с runId прогона коллекции, и первый шаг «снятие до выдачи — 404»
      верен при любом повторе. После F6b-55 цель живёт прогон посева: newman-parallel.sh сеет один
      раз на вызов (:22, :476), поэтому вызов бегуна свеж; повтор коллекции без посева после
      прерванного прогона застанет действующую выдачу. Стоит одной фразой в F6b-55 сказать, что
      набор исполняется только бегуном после его посева.

