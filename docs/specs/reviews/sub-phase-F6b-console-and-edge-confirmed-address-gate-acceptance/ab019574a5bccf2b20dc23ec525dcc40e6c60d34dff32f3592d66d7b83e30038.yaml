blocking_findings:
  - id: B4-1
    kind: PRODUCER
    scenario: F6b-52
    title: "Ожидаемый красный гейта до кода назван неверно: находок не пять, и один каталог обхода не существует"
    finding: >-
      «Тогда» F6b-52 утверждает «находок пять» с координатами prodseed_matrix.py:191,
      prodseed_network.py:77, cluster_admin.py:322 и двумя строками собранной коллекции (:538, :546).
      Обход того же предмета по дереву @b7608fe9750 даёт шесть строк: пропущена
      cluster_admin.postman_collection.json:579 — строка сценария перед запросом, которая и задаёт
      адрес, по которому запрос уходит на самом деле. Числа пять не даёт ни одна единица: по
      строкам литерала — 6, по обращениям (запросам) — 4. Гейт, построенный по перечню документа,
      судил бы декоративные строки и молчал на исполняемой. Второе: обход называет каталог
      `e2e/`, которого в дереве нет ни на одной из ревизий, при правиле «число осмотренных по
      каждому каталогу, пустой обход — отказ гейта» — гейт либо красен навсегда, либо несёт
      мёртвую координату.
    required_change: >-
      назвать единицу находки (строка с литералом или обращение) и дать число этой единицы со всеми
      координатами — 6 с :579 или 4 по одному на запрос; убрать `e2e/` из обхода либо сказать, что
      каталога нет и как гейт судит отсутствующий каталог. DoD п. 9 ссылается на этот вывод — он
      правится тем же изменением.
    evidence: experiment.runs[2], experiment.runs[3]
  - id: B4-2
    kind: COVERAGE
    scenario: F6b-51
    title: "Одно из девяти мест — человек, которого заводит случай cluster_admin, — не держится ничем"
    finding: >-
      Р17 распространяет путь человека на «случаи наборов, заводящие человека сами (cluster_admin.py)»,
      вид по умолчанию — Ф-п, а §5 оставляет заведение в шаге CLUSTER-ADMIN-SEED-TARGET-USER. Но
      единственная проба вида — перепись F6b-51 — печатается посевом после его завершения, то есть
      до прогона случаев, и человека случая в ней быть не может: её «место заведения — … или шаг
      случая набора» не строится. Сам случай на неподтверждённой цели зелен: выдача
      неподтверждённому заводится записью и видна (EV-56, Р12 службы), и ListAdmins её покажет.
      Гейт F6b-52 доказывает только отсутствие вызова хука, а не подтверждённость. Чтения приёмника
      случаем тоже нет: предусловие F6b-53 — о посеве, у окружения newman слота адреса приёмника нет.
    required_change: >-
      одно из двух: (а) цель выдачи администратора облака заводит посев видом Ф-п и отдаёт случаю
      слотом окружения — тогда её держит F6b-51; (б) случай сам заводит Ф-п и утверждает свой исход
      ответом «кто я» (emailVerified: true) с близнецом, а его чтение приёмника получает
      производителя — слот окружения и предусловие, как F6b-53. Строка §5 и DoD п. 9 — по выбранному.
    evidence: experiment.runs[4]

important_findings:
  - id: I4-1
    kind: PRODUCER
    title: "Отрицательные «И» F6b-46 не могут упасть: перепись посева их не видит"
    note: >-
      Преамбула определяет перепись посева как журнал обращений к краю и к поверхности чтения
      приёмника. Вызов хука сегодня идёт grpcurl во внутренний слушатель службы, а чтение хранилища —
      kubectl exec psql (prodseed_matrix.py:164–223); ни то ни другое в такую перепись не попадает,
      поэтому «нет ни обращения к хуку поставщика, ни обращения к хранилищу службы» зелено по
      построению. Суть держит F6b-52. Либо перепись записывает каждый исходящий вызов посева, либо эти
      «И» заменяются ссылкой на F6b-52 и на равенство кода телу письма.
  - id: I4-2
    kind: SCOPE
    title: "Зависимость от kacho#1773 для стенда стоит перемерить"
    note: >-
      Рендер стенда наборов направляет почтовую полосу службы в приёмник стенда (invite-mail relay
      kacho-umbrella-mailpit:1025), письмо подтверждения идёт той же очередью
      (invite_mail_outbox/outbox.go:171 @ c8559057b), а стенд самой службы уже берёт код у своего
      приёмника (§1.12). Если на стенде письмо доходит без #1773, строка доставки §3.2 и DoD п. 0
      сложнее, чем есть, а волна P1 зря ждёт задачу P3. Перемерить и либо снять зависимость для
      стенда, либо назвать, что именно #1773 добавляет.
  - id: I4-3
    kind: FORMAT
    title: "F6b-54 (б): «он есть — один» при двух объектах с этим именем"
    note: "Рендер стенда несёт Service и Deployment kacho-umbrella-mailpit; назвать вид объекта (Deployment) либо «объекты шаблона mail-receiver.yaml»."
  - id: I4-4
    kind: PRODUCER
    title: "Р17 ссылается на §1.13 за измерением, которого там нет"
    note: >-
      «вызовов приглашения в посевах и случаях ноль» — в §1.13 такого предиката нет. Замер этого
      круга: в tests/authz-fixtures (без .md) — только имена служебной учётной записи invitee; в
      gateway/tests/newman/cases — 0. Дописать предикат с контролем.
  - id: I4-5
    kind: CONSTRUCTIBILITY
    title: "Посев узнаёт аккаунт человека по external_id = адрес — после регистрации так не найдёт"
    note: >-
      Регистрация заводит личный аккаунт и проект default тем же построением, что хук
      (user/mirror_tx.go:413 → BootstrapPersonalResourcesTx @ c8559057b), поэтому «Дано» F6b-48
      строится. Но её ExternalID — сгенерированный субъект своей полосы (registration/register.go,
      NewOwnLaneSubject), а db_lookup и ожидание строки ищут по external_id = адрес
      (prodseed_matrix.py:171–223). Р17 стоит сказать, откуда посев берёт идентификаторы человека и
      аккаунта — с поверхностей края, как код и положение.

