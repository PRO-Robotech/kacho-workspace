blocking_findings:
  - id: B1-1
    kind: SCOPE
    title: >-
      Правило владельца — об УЧЁТНОЙ ЗАПИСИ, а документ держит его на ОДНОЙ полосе края.
      Перепись полос, выставляющих личность человека, не составлена: на HTTP их четыре, на
      нативном gRPC одна, держатель назван у двух
    coordinates:
      doc:
        - "§0 (строки 42–45) — «край не пропускает её СЕССИЮ»"
        - "§1.2 (строки 92–93) — «точка, через которую проходит каждый HTTP-путь с нашим носителем, одна — полоса сессии»"
        - "Р2 (строки 226–239) — вопрос края сформулирован о «носителе такой сессии»; довод «расхождение выходит отказом, а не проходом»"
        - "§3.2 (строки 462, 469–470) — строки «полоса базового секрета человека» и «нативная gRPC-поверхность края»"
      tree:
        - kacho@499ad3085fd:gateway/internal/middleware/auth.go:991 — tryOwnSession (полоса сессии)
        - kacho@499ad3085fd:gateway/internal/middleware/auth.go:1001 — tryBasicCredential (базовый секрет)
        - kacho@499ad3085fd:gateway/internal/middleware/auth.go:1004 — tryBearerJWT (токен доступа)
        - kacho@499ad3085fd:gateway/internal/middleware/auth.go:1007 — tryDevSecretJWT (только посадка dev)
        - kacho@499ad3085fd:gateway/internal/middleware/auth.go:729 — principalFromVerifiedToken: вид принципала берётся из утверждения токена, вид «user» не исключён
        - kacho@499ad3085fd:gateway/cmd/api-gateway/main.go:940,945 — Unary/Stream той же полосы на нативном gRPC
        - kaname@c083ad5bbfa:proto/kaname/cloud/iam/v1/user_token_service.proto:19–24,75 — персональный токен человека, принципал `user:<id>`
    predicate: "git show 499ad3085fd:gateway/internal/middleware/auth.go | grep -n 'a\\.try[A-Za-z]*(w, r' → 4 строки"
    measured: >-
      Полос HTTP, выставляющих личность, четыре; документ называет держателя правила для двух:
      сессия — край (S1), базовый секрет — служба (§3.2). Полоса токена доступа человека не
      названа НИ в объёме, НИ вне объёма — слов «токен», «JWT», «персональный» в документе ноль
      (`grep -ci 'токен\\|jwt' <док>` → 0). Строка §3.2 о нативном gRPC обоснована отсутствием
      НОСИТЕЛЯ СЕССИИ, а не отсутствием человека: та же полоса токена там стоит.
    consequence: >-
      Решение владельца и предмет задания говорят «никаких прав и никакого доступа к API» для
      учётной записи, а не для сессии. Р2 выводит «второй проверки не заводится» из того, что
      край спрашивает о каждом пути, — это верно только там, где край спрашивает. Документ сам
      называет цену дня посадки: каждый существующий человек становится неподтверждённым (§1.4,
      Р1). Значит перепись обязана пройти по ТОЧКАМ ЖИЗНЕННОГО ЦИКЛА удостоверения — выдача и
      предъявление, включая удостоверения, выданные до дня посадки
      (security-hardening §«Контроль, действующий на ВЫДАЧЕ, но не на ПРЕДЪЯВЛЕНИИ»;
      §«Части, исправные по отдельности, не сходятся в целое»).
    required: >-
      Раздел переписи полос (предикат — выше) и по каждой полосе один из двух исходов:
      (а) держатель правила назван — край (сценарий и близнец в S1) либо служба (строка §3.2
      с носителем и предикатом возврата, плюс заказ в DoD п. 1); (б) предикатом показано, что
      полоса личности человека не выставляет. Строку §3.2 о нативном gRPC переписать от
      учётной записи. Какой исход выбрать — решает автор; рецензент требует, чтобы выбор был
      сделан и держался сценарием либо предикатом.
    disclosure_note: >-
      Находка — о полноте переписи в проекте правила, которого в дереве ещё нет, а не о
      действующем дефекте; названы только публичные координаты полос. Сборки «координата +
      условие + следствие» об исполняемом пути нет.

  - id: B1-2
    kind: COVERAGE
    title: >-
      У ПЕРВОГО письма подтверждения нет производителя: экран обещает письмо, которого никто не
      отправляет, а фикстура набора это маскирует нажатием «ещё раз»
    coordinates:
      doc:
        - "Р8 (строки 353–356) — текст «перейдите по ссылке из письма», кнопка «Отправить письмо ЕЩЁ РАЗ»"
        - "F6b-12 — «Тогда» утверждает только экран; письма после регистрации не утверждает никто"
        - "F6b-18 — перепись при открытии ⊆ {auth/me, csrf}: POST verify-email при открытии экрана запрещён"
        - "Р13, F6b-32 (строки 434–437, 771–777) — фикстура: регистрация → экран → «Отправить письмо ещё раз» → ссылка"
        - "F6b-19 «Дано» — «обращений к POST verify-email ещё не было»; F6b-21 — 429 после одного обращения"
      tree:
        - kaname@lane/address-verification-acceptance-20260922 (4f97464b…) Ф6 Р3 — письмо уходит на POST /iam/v1/auth/verify-email, и только на нём
        - Ф6 Р6 — отметку ставит предъявление; регистрация отметки не ставит; ни одно следствие регистрации письма не ставит (`grep -n -i 'регистрац' <Ф6>` — ни одного следствия «письмо»)
    measured: >-
      Ни этот документ, ни Ф6 не называют, кто отправляет первое письмо: после регистрации и
      после входа неподтверждённого человека. Единственный путь к письму — нажатие «Отправить
      письмо ещё раз». Сценария «зарегистрировался → письмо пришло без нажатия» нет.
    consequence: >-
      Главный путь решения владельца — регистрация, письмо, ссылка, подтверждение — не утверждён
      ни одним сценарием. Человек после регистрации и каждый существующий человек в день посадки
      (Р1) видят «перейдите по ссылке из письма», а письма нет. Фикстура Р13 нажимает «ещё раз»
      и потому зеленеет на продукте, где первое письмо не уходит никогда (gate-authoring §11
      «фикстура не снисходительнее продукта»). Выбор производителя меняет исходы F6b-19 и F6b-21:
      если регистрация отправляет письмо и открывает промежуток, «ещё раз» сразу после неё —
      это 429, а не 200.
    required: >-
      Назвать производителя первого письма (служба при регистрации и первом входе
      неподтверждённого · консоль при первом приходе на экран · либо текст без «ещё раз» и
      явное решение, что первое письмо — по нажатию), утвердить его сценарием главного пути с
      близнецом, перестроить «Дано» F6b-19/F6b-21 и фикстуру Р13 под выбранный путь; если
      производитель — служба, строка заказа в §3.2 и DoD п. 1.

  - id: B1-3
    kind: COVERAGE
    title: >-
      Ветви нового экрана без сценария, и две из них — о защите: отказ чужого адреса возврата на
      /verification и ветвь «в браузере вошёл другой человек»
    coordinates:
      doc:
        - "Р8 (строки 346–348) — «отвергнутый адрес возврата отвергается тем же правилом, что у входа (F8-13)»; «Продолжить» уводит на адрес возврата (строки 365–366), F6b-23 это утверждает"
        - "Р9, таблица после успеха (строки 393–398) — четыре строки"
        - "Р9, отказы (строки 400–402) — предъявление, частота, признак формы"
      tree:
        - docs/specs/sub-phase-F8-console-identity-ceremony-screens-acceptance.md F8-13 — «адрес возврата чужого происхождения отвергнут», предмет — экран входа
    measured: >-
      Ветвей Р9 семь (четыре строки таблицы и три отказа), со сценарием три: строка «сессия
      есть, адрес подтверждён» — F6b-29; строка «сессии нет» — F6b-27; отказ предъявления —
      F6b-30. Без сценария четыре: «в браузере вошёл другой человек», «край не ответил по
      существу», отказ по частоте на подтверждении, отвергнутый признак формы на подтверждении.
      Отказа чужого адреса возврата на /verification нет ни одним сценарием этого документа.
    consequence: >-
      /verification — НОВЫЙ читатель адреса возврата; общая функция сборки не доказывает, что
      новый читатель её зовёт, а F8-13 держит только экран входа. Положительная половина
      (F6b-23) есть, отрицательной нет — пара неполна (change-graph §6). Ветвь «другой человек»
      — место, где подтверждение по ссылке и сессия в браузере принадлежат разным людям; решение
      о ней принято (Р9), держателя у него нет.
    required: >-
      Сценарий: /verification с адресом возврата чужого происхождения — «Продолжить» после
      подтверждения не уводит документ за пределы происхождения консоли; близнец — F6b-23.
      Сценарии на строки 3 и 4 таблицы Р9 и на два отказа подтверждения (частота, признак
      формы) — с близнецами; уровень (стенд либо компонент с дублёром транспорта) выбирает
      автор.

