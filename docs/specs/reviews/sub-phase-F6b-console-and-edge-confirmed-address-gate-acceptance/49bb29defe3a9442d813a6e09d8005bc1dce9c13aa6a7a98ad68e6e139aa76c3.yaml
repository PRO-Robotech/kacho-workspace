# ─── НЕ БЛОКИРУЮЩИЕ ──────────────────────────────────────────────────────────
important_findings:
  - id: I3-1
    kind: PRODUCER
    title: "Р3а и строка §3.2 о смене адреса не называют окно кэша решений края"
    note: >-
      Кэш решений края хранит только «разрешено» (authz.go, phaseCheck; окно — умолчание загрузчика
      5 с, KACHO_API_GATEWAY_AUTHZ_CACHE_TTL_SECONDS, в профилях зонта не задано) и сбрасывается
      потоком смены субъекта, который питают выдачи и членства. Поэтому утверждение Р3а «о праве
      служба отвечает по текущей отметке» верно на промахе кэша: решение, закэшированное до снятия
      отметки, отвечает без вопроса к службе (прогон этого круга). Граница окна на Л2 и Л3 от этого
      не растёт — её держит окно сверки и окно полосы секрета, 5 с. Сегодня пути снятия отметки
      нет, поэтому это не расхождение, а неполнота предиката возврата. Назвать это окно в Р3а рядом
      с окном сверки и добавить в строку §3.2 о смене адреса: глагол смены адреса питает поток
      смены субъекта. То же попросил у приёмки службы её круг 2 (N1).
  - id: I3-2
    kind: SCOPE
    title: "Реестр — второй потребитель той же сверки; ни эта приёмка, ни приёмка службы его не называют"
    note: >-
      Второй блок издателей в каждом профиле — чарт реестра; его проверяющий спрашивает ту же
      сверку для записи нашего издателя (services/registry/cmd/kacho-registry/tokenverifier.go:48).
      Правило держится по построению — Р5а службы отвечает по отметке, кто бы ни спросил, а о праве
      судит Р4а, — но держатель у этой поверхности не назван. Одна строка §3.2 вне объёма: реестр,
      держатель Р5а и Р4а службы, окно — кэш сверки реестра, его величина.
  - id: I3-3
    kind: FORMAT
    title: "Две формулировки шире своего предмета"
    note: >-
      (а) Р16: пути, на которых HTTP не задаёт сверку, — четыре пути плюс ВСЕ глаголы формы
      (isPublicHTTPPath), а не только перечень Р5; вывод держится следующей же фразой (глаголы
      формы судит служба по сессии). (б) F6b-35 и строка Л3 Р16: «тот же единый текст, что у
      всякой неудачи подлинности на этой поверхности» — у полосы базового секрета на нативной свой
      текст credential refused; точнее — «всякой неудачи подлинности предъявителя».
  - id: I3-4
    kind: PRODUCER
    title: "Опоры F6b-35 держат выбор полосы и единство текста, но не тексты отзыва"
    note: >-
      TestF1b09 утверждает для отозванного только коды; пять неудач TestF1b12 отзыва не содержат.
      Тексты Л3 держит только сам F6b-35 — прогон этого круга их подтвердил. Сказать это в
      последнем «И» F6b-35. Сквозной пробы обеих половин (служба отвечает active false по отметке,
      край отказывает) после посадки не построить: неподтверждённый человек нашего токена получить
      не может; сходимость держит общий ответ сверки, тот же, что для отозванного токена, — это
      стоит назвать одной фразой.

