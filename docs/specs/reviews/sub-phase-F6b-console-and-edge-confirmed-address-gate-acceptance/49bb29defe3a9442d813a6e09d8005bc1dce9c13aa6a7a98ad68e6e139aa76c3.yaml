    (kaname@d39886c09, запись 5fb3e84e….yaml): блокирующее B1 COVERAGE — полоса обмена кода и
    оборота токена обновления собственной церемонии службы уже есть и правила выдачи не спрашивает;
    не блокирующее N1 — окно кэша решений края (то же, что I3-1).
  effect_here: >-
    Край путь выдачи /iam/v1/token не ведёт (git grep по не-тестовому gateway → 0), а предъявление
    нашего токена краю держит Р5а, поэтому содержание этого документа от B1 службы не зависит.
    Следующая редакция службы изменит Р5 (и, возможно, Р5а) — по собственному правилу §1.9 эта
    приёмка сверяется с ней тем же кругом; правка текста этого документа — новый отпечаток и новое
    ревью, это одобрение на неё не переносится.
  found_on_the_way: >-
    В Р4в службы строка «Строк 1 + 1 + 1 + 4 + 5 + 4 + 1 + 1 + 2 = 19» в сумме даёт 20: Revoke
    стоит двумя строками (о себе и о другом), методов круга 19. Это предмет автора приёмки службы.

