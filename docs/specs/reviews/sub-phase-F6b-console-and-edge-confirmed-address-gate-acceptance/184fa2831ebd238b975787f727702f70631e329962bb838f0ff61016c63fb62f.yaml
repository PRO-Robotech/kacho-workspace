    kind: PRODUCER
    title: >-
      Держатель Л3 на предъявлении назван не тем вопросом: о токене нашей чеканки край спрашивает
      сверку /internal/tokens/introspect, а заказ адресован IsRevoked
    coordinates:
      doc:
        - "§1.8 (строки 249–252) — «:516 · :1163 — вопрос о живости токена»; «:152 — этот вопрос задаётся службе (IsRevoked)»"
        - "Р16, строка Л3 (628) — «ответ на вопрос края о живости токена (IsRevoked, задаётся на каждом предъявлении…)»"
        - "§3.2, строка Л3 (676) — заказ kaname#456 на IsRevoked"
        - "§6 п. 1 — «ответ «не действует» на вопросе края о живости токена»"
        - "F6b-35 «Дано» (832) — дублёр вопроса о живости отвечает revoked = true"
      tree:
        - "kacho@499ad3085fd:gateway/internal/middleware/auth_revocation.go:195 — if vt.ReadRevocation { return a.platformRevocationCheck(…) }"
        - "kacho@499ad3085fd:gateway/internal/config/tokenissuers.go:247 — ReadRevocation = true у записи нашего издателя"
        - "kacho@499ad3085fd:gateway/cmd/api-gateway/main.go:380 — полоса записи (IsRevoked по jti); :400–418 — полоса нашего авторитета через IntrospectionCache"
        - "kacho@499ad3085fd:gateway/internal/config/config.go:538 — KACHO_INTROSPECTION_CACHE_TTL_SECONDS, умолчание 5"
        - "kacho@499ad3085fd:deploy/helm/umbrella/values.dev.yaml:217,220 (и values.dev-prod, values.prod, values.fe3455-prod) — platformIssuer назван, revocationUrl …:9097/internal/tokens/introspect; прежнего издателя в перечне нет (values.dev.yaml, абзац над блоком)"
        - "kaname@c083ad5bbfa:internal/handler/tokenintrospecthttp/handler.go:57 — IntrospectPath; api/session_revocations/handler.go:212 — IsRevoked принимает только token_jti"
        - "приёмка службы, редакция 2 (26758cccf, 5fb3e84e…), Р5а — правило предъявления на сверке /internal/tokens/introspect: владелец не подтверждён → 200 {active:false}"
    predicate: >-
      git show 499ad3085fd:gateway/internal/middleware/auth_revocation.go | grep -n 'if vt.ReadRevocation {' → 195;
      git grep -n 'revocationUrl:' 499ad3085fd -- deploy/helm → 8 строк, все …/internal/tokens/introspect;
      эксперимент TestF1b09_… → PASS
    measured: >-
      Вопрос края о живости выбирается ЗАПИСЬЮ ИЗДАТЕЛЯ. Токен нашей чеканки — а на стендах только
      наш издатель и принимается — идёт к нашему авторитету, сверке /internal/tokens/introspect,
      через кэш края с окном 5 с. IsRevoked обслуживает полосу записи — токены прочих принятых
      издателей, и знает только jti. Числа §1.8 верны, вывод из них — нет.
    consequence: >-
      Служба, исполнившая заказ §3.2 дословно, правила на Л3 не удержит: вопрос, которому заказ
      адресован, о токенах человека краем не задаётся. F6b-35 утверждает не ту полосу. Приёмка
      службы в редакции 2 держит правило предъявления на сверке — два документа линии заказывают
      разные производители одного вердикта. Окно кэша края не названо, хотя у Л2 окно 5 с названо.
    required: >-
      Назвать производителем Л3 на предъявлении сверку /internal/tokens/introspect (Р5а службы) и
      переписать §1.8, строку Л3 Р16, строку §3.2 и §6 п. 1; назвать окно кэша края; «Дано»
      F6b-35 — токен нашего издателя и дублёр полосы нашего авторитета. Для полосы записи —
      предикатом показать, что на стендах токены человека к ней не приходят, либо заказать ту же
      отметку и там.
    disclosure_note: >-
      Находка — о проекте правила, которого в дереве ещё нет: заказ адресован не тому вопросу.
      Сборки «координата + условие + следствие» об исполняемом пути нет.

