        - "§6 п. 2 — F6b-35 зелёный и до кода, и после"
      tree:
        - "kacho@499ad3085fd:gateway/internal/middleware/auth.go:516–522 — нативная: отозванный → codes.Unauthenticated, authFailedMsg"
        - "kacho@499ad3085fd:gateway/internal/middleware/auth.go:97 — authFailedMsg = authentication failed"
        - "kacho@499ad3085fd:gateway/internal/middleware/auth.go:1163–1167 — HTTP: 401, token revoked"
        - "kacho@499ad3085fd:gateway/internal/middleware/auth_revocation.go — шапка revocationDenyDescription: нативная поверхность этот текст намеренно не несёт"
        - "базовый секрет — один текст на обеих поверхностях (auth.go:451, :1035, basicCredentialRefusalText)"
    predicate: "эксперимент TestF1b12_… → «предъявлено 5, различимых сообщений 1»"
    measured: >-
      По HTTP текст отказа предъявителя — token revoked; на нативной — authentication failed, один
      на все неудачи подлинности. У базового секрета тексты совпадают.
    consequence: >-
      Сценарий, объявленный зелёным до кода, на существующем крае зелёным быть не может: его
      утверждение о нативном тексте производитель не даёт. Автор проб либо ослабит утверждение,
      либо заведёт второй текст на нативной поверхности вопреки её назначению.
    required: >-
      Утверждать на нативной поверхности UNAUTHENTICATED и authentication failed для полосы
      предъявителя, единый текст полосы — для базового секрета; по HTTP — 401 и token revoked.

