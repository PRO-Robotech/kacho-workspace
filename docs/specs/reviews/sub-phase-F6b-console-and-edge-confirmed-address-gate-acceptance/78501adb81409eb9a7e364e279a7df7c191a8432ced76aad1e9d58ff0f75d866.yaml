    where: "§6 п. 1 (стр. ~1963–1968) и §8 «Редакция 8»"
    finding: >-
      Единственный предмет редакции — сменить устаревший отпечаток пары службы; новый отпечаток
      aa40e652… принадлежит редакции 7 службы, которую этот же круг вернул (запись службы на aa40e652,
      CHANGES_REQUESTED, FORMAT: неисполнимые команды §0.5). Исправление службы даст новый отпечаток,
      и п. 1 устареет так же, как устарел 94d6a4b6… — это второй раз одного класса: круг 7 записал
      его не блокирующим и назвал выход («сослаться на приёмку службы без отпечатка — её запись ревью
      называет отпечаток сама»). Редакция 8 выход не взяла и повторила класс. Одобрять её — значит
      заведомо выпустить устаревшую через одну правку ссылку и ещё одно событие полномочия впустую.
    fix: >-
      §6 п. 1 и §8: назвать пару службы ссылкой на документ и каталог её записей ревью
      (действующее одобрение выводится из записи и события, change-graph §2), без отпечатка
      неодобренной редакции; отпечаток допустим только у редакции, уже имеющей APPROVED-запись и
      событие (60278225…, круг 5). Тогда следующая правка службы не требует редакции этого документа.

