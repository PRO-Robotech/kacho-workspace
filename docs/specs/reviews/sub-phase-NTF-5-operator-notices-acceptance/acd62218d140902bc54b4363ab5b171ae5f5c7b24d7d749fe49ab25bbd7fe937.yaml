blocking:
  - id: B1
    kind: PRODUCER
    title: "Р2/Р10/Р16/Р21 опираются на возвращённую редакцию NTF-3 и её опровергнутую посылку: notify-api не может звать справочник, годность контакта и место проверки прав у производителя другие"
    scenarios: [NTF5-17, NTF5-18, NTF5-59, NTF5-90, NTF5-96, NTF5-97, NTF5-98, NTF5-99, NTF5-100, NTF5-103, NTF5-104, NTF5-105]
    evidence: >-
      Р2 (последний пункт) отдаёт все три поверхности, то есть InternalNoticeService, NoticeService и
      контакты, развёртыванию notify-api. Там же Create зовёт DescribeScope (Р10), чтение по проекту
      зовёт DescribeScope при промахе (Р16), PATCH контакта зовёт Resolve, а GET берёт владельца из
      DescribeScope (Р21). Все эти методы ограждены субъектом service:notify.
      (1) Возврат редакции 52ef8689, на которую документ ссылается (B2-2), уже опроверг это:
      «справочник — только для notify-sender». Запись возврата — предок воркспейса измерения
      2462e115.
      (2) В текущей редакции производителя (NTF-3 62d42441, Р8, строки 580-589) у notify-api своя
      идентичность и нет служебного принципала: справочник ему отвечает отказом двери. NTF-6 редакции
      4 уже потребляет эту форму.
      (3) Р21 пишет «поле security и всё его поведение — NTF-3 Р20» и сразу вводит годность через
      Resolve: SUBJECT_INACTIVE и NO_CONFIRMED_ADDRESS при назначении отвергаются (NTF5-98, 99).
      У производителя (Р20, строки 892-901; NTF3-114 строки 2086-2088) годность — Check v_get, а
      состояние и адрес при назначении не судятся. В итоге три поля одного ресурса получают две
      семантики годности.
      (4) Р21: «права — у края». У производителя (Р25, строки 981-982) это Check в use-case после
      формата, у края — освобождение. От этого зависят порядок и коды NTF5-103 и NTF5-105.
      (5) Строки §1.6 и §11 о том, что NTF-6 Р3б/Р11/Р16 берут ContactService редакции 2, устарели:
      NTF-6 bd960b46, строки 520 и 1189, контракт NTF-5 снял.
      Если одобрить документ в таком виде, будет запечатан контракт, который производитель по Д15
      (NTF-3) уже не объявляет, и сценарии J и A (17, 18) на нём не строятся.
    fix: >-
      Сверить документ с текущей редакцией NTF-3 и с её вердиктом, а не только с отпечатком.
      Для каждого вызова DescribeScope, ListAccounts и Resolve назвать развёртывание-вызывающего. Если
      это notify-api, дать путь, который производитель объявляет: либо перенести вызов в
      notify-sender, либо заменить вопросом клиента прав фундамента о вызывающем или названном
      пользователе, как Р20/Р25 NTF-3. Годность контактов account_legal и operations привести к
      семантике поля security (Check v_get при назначении, состояние и адрес — при постановке письма)
      либо оформить отличие спором со строкой возврата. Тогда NTF5-98 и NTF5-99 (usr-blk)
      переписываются в положительные, по образцу NTF3-114. Место проверки прав и порядок «формат →
      право» взять из Р25 NTF-3. §1.6 и §11 перемерить по NTF-6 bd960b46. Если NTF-3 редакции 7
      вернут и форма изменится, перемерить на новой ревизии.
  - id: B2
    kind: CONSTRUCTIBILITY
    title: "Две Given не строятся: sa-1 отвергается формой id до Resolve; кэш DescribeScope для prj-1 в NTF5-90 не может быть пуст"
    scenarios: [NTF5-99, NTF5-90]
    evidence: >-
      (а) NTF5-99, ветка sa-1. Р21 проверяет форму userId синхронно, до Resolve: «invalid user id».
      Префикса sa в каноне corelib нет, учётная запись службы несёт sva (ids/ids.go:376 @34bc810).
      ResourceID на неизвестном префиксе отдаёт INVALID_ARGUMENT «invalid user id 'sa-1'», code 3.
      Сценарий же утверждает code 9 с текстом непригодности и ответ подмены справочника. При верной
      реализации ветка упадёт. Тот же класс уже был у производителя (возврат NTF-3 52ef, B2-4), и
      там его закрыла Р11а.
      (б) NTF5-90. Кэш областей — таблица базы notify (DoD 10.1 п.3), и «ответ Create кэш
      пополняет» (Р10). N1 с аудиторией projectIds=[prj-1] создан над той же базой, поэтому строка
      prj-1 → acc-1 в кэше есть. «Кэш процесса чтения не прогрет» к кэшу в базе неприменимо.
      List по prj-1 пройдёт без службы доступа и вернёт 200, а не 503, как утверждает сценарий.
    fix: >-
      (а) Заменить sa-1 на id вида sva-<crockford> и назвать, какой исход даёт производитель: у NTF-3
      62d42441 это Check v_get → ложь → непригодность (NTF3-114). Клетку «код INVALID_ARGUMENT от
      справочника» утвердить отдельной подменой, не связывая её с формой id.
      (б) Строить Given без пополнения кэша: запрос по проекту, которого нет ни в одной аудитории
      (например, prj-1 при аудиториях N2 allAccounts и N3 accountIds), либо посев извещения прямой
      вставкой. Назвать это в Given.
  - id: B3
    kind: CONVENTION
    title: "Проверка формы чужих id (account, project, user) без записанного исключения B4 и вопреки собственной Р10"
    scenarios: [NTF5-105, NTF5-99]
    evidence: >-
      Р10 (строка 536): «Формы чужого идентификатора notify не проверяет (api-format-check-own-only)».
      Р21 (строки 719-721) и NTF5-105 отвергают формой invalid account id, invalid project id,
      invalid user id. Это id типов, которыми владеет служба доступа. Правило допускает такую
      проверку только как записанное решение в трёх границах (api-b4-recorded-exceptions:
      family-agnostic, запись в docs/architecture сервиса, ссылка из правила). Производитель ресурса
      контактов записал ровно это исключением Р11а; документ на него не ссылается и держит
      противоположное утверждение.
    fix: >-
      Снять противоречие. Либо сослаться на исключение NTF-3 Р11а (family-agnostic ResourceID по
      канону префиксов) для путей и полей контактов и сузить Р10 до «существование — у владельца»,
      либо перейти на existence-only и переписать NTF5-105 (а), (в), (г). Выбранное согласовать с B2 (а).

important:
  - id: I-1
    kind: FORMAT
    text: >-
      §1.6 утверждает, что класс «ссылка на соседа» закрыт сверкой на 2462e115. Таблица отпечатков
      на момент рассмотрения устарела для NTF-1, NTF-2 и NTF-6 (см. neighbours_measured). Перемерить
      таблицу перед отдачей и добавить в неё колонку «вердикт на отпечаток».
  - id: I-2
    kind: PRODUCER
    text: >-
      Шаг ступени на правке контакта. NTF-6 bd960b46 (строка 227) пишет, что у производителя шага
      повышения уровня на правке контакта нет. Этот документ по дереву утверждает умолчание каталога
      «2» (§1.4, NTF5-102). Если у края метод контактов по Р25 NTF-3 — освобождение, назвать, действует
      ли на него пол required_acr_min, и замерить это. Без замера пара NTF5-102/97 держит утверждение,
      противоположное соседу.
  - id: I-3
    kind: FORMAT
    text: >-
      NTF5-66 утверждает «DescribeScope — по одному разу на аккаунт». Для 250 аккаунтов при кэше без
      срока счёт верен только на первом этапе. Назвать этап или утверждать «не более одного раза на
      аккаунт за всё время пробы».

