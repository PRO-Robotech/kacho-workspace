important:
  - id: I-1
    kind: FORMAT
    text: >-
      Р10 шаг 5 кладёт «`OK` без поля `exists`» во вторую строку со счётчиком
      `notify_recipient_directory_refused_total{ns="notify",code}`. Но у ответа OK нет gRPC-кода, и
      значение метки `code` для него не названо. У NTF-3 для такого ответа названа метка
      `code="UnknownOutcome"`. Стоит назвать метку явно. Кроме того, «без поля» различимо только при
      `optional bool exists` в контракте — на это нужна одна фраза в Р10. Держателя у этой клетки
      нет. Замечание не блокирует: клетка совпадает с NTF-3 (misconfigured без терминального
      исхода), и её отличия от соседа документ не утверждает.
  - id: I-2
    kind: PRODUCER
    text: >-
      Строка возврата о NTF3-114 против двери остаётся открытой: на c0ea704a эта строка в дельте не
      менялась. Передать её автору NTF-3 должен диспетчер.

