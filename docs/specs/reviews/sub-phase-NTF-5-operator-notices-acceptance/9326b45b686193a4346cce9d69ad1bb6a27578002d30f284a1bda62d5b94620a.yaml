blocking:
  - id: B1
    kind: NEGATIVE
    title: "Отказ `DescribeScope` раскрытия кодом второй строки шага 5 Р10 без держателя; отнесение INVALID_ARGUMENT к нетерминальной строке расходится с таблицей NTF-3, на которую Р10 ссылается"
    scenarios: [NTF5-67]
    evidence: >-
      Редакция 7 дописала в Р10 (строки 745-752) правило: отказ `DescribeScope` раскрытия «любым
      кодом обеих строк шага 5» даёт ту же приостановку на странице k, «вторая строка шага 5
      добавляет сигнал и счётчик». Держатель назван один — NTF5-67 (б), и у него код `UNAVAILABLE`,
      то есть первая строка. Для второй строки (`PERMISSION_DENIED`, `UNAUTHENTICATED`,
      `INVALID_ARGUMENT`, `NOT_FOUND`, …) в этом месте нет ни «Тогда», ни близнеца. Опасность
      усиливает ссылка шага 5 на таблицу «Отказ вызова справочника» NTF-3 Р7 «без изменений». В
      этой таблице (NTF-3 строка 677 @aa831a960) `INVALID_ARGUMENT` — терминальный `INVALID`, и сам
      документ в Р8 применяет её так же. Реализация, которая берёт общий классификатор NTF-3 и для
      `DescribeScope` раскрытия, закроет строку владельца `acc-150` терминально и пойдёт к
      следующему аккаунту. Извещение класса OB этому владельцу не уйдёт, а все 110 сценариев
      останутся зелёными. Документ в §17 утверждает обратное: «каждое место … получило букву с
      близнецом». Класс тот же, что B2 круга 6.
    fix: >-
      (1) В NTF5-67 добавить букву (в), отличающуюся от (б) одним фактом: код отказа
      `DescribeScope{accountId: acc-150}` — `INVALID_ARGUMENT` вместо `UNAVAILABLE`. «Тогда» в
      момент снятия: то же, что (б) (строк по `acc-150` и `acc-201…250` нет, строки владельца
      `acc-150` с терминальным исходом нет, `ListAccounts` третьей страницы не вызывался,
      `notify_notice_fanout_pending{…}` = 1), плюс
      `notify_recipient_directory_refused_total{ns="notify",code="InvalidArgument"}` ≥ 1 и ненулевой
      `misconfigured`. После снятия: 250 писем, повторов нет. Близнец — (б): счётчик не изменился,
      сигнала нет. Строки добавить в §8, §9 и DoD 10.2 п.4. (2) В Р10 шаг 5 написать прямо, что для
      `DescribeScope` и `ListAccounts` клетка `INVALID_ARGUMENT` отличается от таблицы NTF-3 Р7
      (там терминальна), и дать основание. Например: отказ страницы или области терминального
      исхода не даёт, адресаты остатка неизвестны — то же правило, что «Отказ на странице» NTF-3 Р7.
      Сейчас текст приписывает это NTF-3. (3) Для проверки заявки (NTF5-18) у `INVALID_ARGUMENT` то же
      расхождение с NTF-3. Либо держать его буквой (е) — «(г) с кодом `INVALID_ARGUMENT`», близнец
      (г), — либо назвать в Р10 исход, отличный от окна, и держать его.

important:
  - id: I-1
    kind: FORMAT
    text: >-
      Р10 шаг 5 (строки 701-706) называет свои две строки «таблица «Отказ вызова справочника» NTF-3
      Р7». Но NTF-3 сама ограничивает таблицу «всеми тремя методами справочника» (`Resolve` и два
      своих списка) и кладёт `INVALID_ARGUMENT` в отдельную терминальную строку. Для двух методов
      этого документа (`DescribeScope`, `ListAccounts`) таблица своя, и это надо сказать как
      отличие с основанием, а не как перенос «без изменений». Правка входит в fix B1, п. (2).
  - id: I-2
    kind: FORMAT
    text: >-
      §1.6: «Ревизия сверки редакции 7 — один коммит `issue-880@ff0c1b310` (последний коммит до
      коммита самой редакции)». `ff0c1b310` не входит в историю ветки (`git merge-base
      --is-ancestor ff0c1b310 HEAD` → 1). Это сосед `f152624a7` с тем же родителем `d9dc30005`, его
      повторить из ветки нельзя. Последний коммит до редакции — `0c30011e8`, а между ними вышла
      редакция 11 NTF-2 (`9b8911760`). Её дельта опору документа не задевает (строк о коде
      подтверждения 0). После редакции вышли одобрение NTF-2 на `9098d6ef` (`52fed403d`) и редакция 13
      NTF-3 (`aa831a960`). Перемерить §1.6 на коммите из истории ветки.
  - id: I-3
    kind: FORMAT
    text: >-
      В Р6 примеры `acc0123456789abcdefgh` и `prj0123456789abcdefgh` имеют 21 символ, а форма id
      службы доступа — префикс и 17 символов, всего 20 (§1.4; corelib ids.go:5). Проверку `path`
      примеры проходят, но id верной формы не являются. К тому же строкой ниже сказано «длина ссылки
      — 60 символов», а это верно только для id длиной 20. Взять тела по 17 символов.
  - id: I-4
    kind: PRODUCER
    text: >-
      Строка возврата о NTF3-114 против двери по-прежнему открыта (на `9e4404d1` строка не
      изменилась). Довести её до автора NTF-3 — дело диспетчера.

