blocking:
  - id: B10-1
    kind: PRODUCER
    anchors: ["Р10 шаг 3 (последнее предложение)", "Р10 шаг 6, первый пункт", "NTF5-118 (а)", "NTF5-119 (б), (в)", "§8 строка NTF5-118, 119", "Р19 notify_notice_create_pending"]
    text: >-
      После отмены операции Create строку заявки не снимает ни одна названная запись. Отмена делает
      общий обработчик фундамента: CancelOwned пишет только строку Operation (corelib
      operations/repo.go:672-675 @34bc810), таблицы заявок notify он не знает. Фиксация шага 3 при
      0 строк Operation «откатывается целиком» — значит, откатывается и снятие заявки. Шаг 6
      говорит: «заявку с завершённой операцией notify-sender снимает… взятие шага 2 берёт только
      заявки, чья операция done = false». Взятие, которое такие заявки не берёт, их и не снимает;
      другой записи, снимающей заявку, нет. Подметальщик Р14 удаляет только извещения. Из-за этого
      три «Тогда» не производятся. NTF5-119 (б): «заявка снята, notify_notice_create_pending = 0» —
      notify-sender в обвязке остановлен, обвязка исполняет только шаги 2 и 3, и шаг 3 откатился.
      NTF5-119 (в): «pending после каждого повтора = 0» в исходе (б). NTF5-118 (а): «pending = 0» и
      «после того как pending стал 0» — если метрика считает строки заявок. Определение метрики в Р19
      («заявки создания, ещё не проверенные у владельца») не говорит, считается ли заявка с
      завершённой операцией. Если нет — pending = 0 держится, а строка остаётся навсегда (утечка без
      сигнала). Если да — тревога Р19 срабатывает на каждую отмену. Без названной записи реализация
      вправе оставить строку либо снять её любым путём, и сценарий этого не различит.
    required: >-
      Назвать запись, снимающую заявку с завершённой операцией, и её место — одним из двух способов,
      одинаково в Р10 шаг 3, шаг 6, §8 и DoD 10.1 п.3. (а) Взятие шага 2 берёт заявки при любом
      состоянии операции. Заявку с done = true оно удаляет одной записью (например, `DELETE … USING
      <operations> WHERE done = true RETURNING`) без вызова справочника, а проверку у владельца
      зовёт только для done = false. Фразу «берёт только заявки, чья операция done = false» тогда
      исправить. (б) Фиксация при 0 строк Operation откатывает извещение, событие и напоминания, но
      той же либо следующей транзакцией удаляет заявку. «Откатывается целиком» тогда исправить.
      Определить notify_notice_create_pending через предмет: считаются строки заявок либо заявки с
      done = false. «Тогда» NTF5-118 (а) и NTF5-119 (б), (в) привести к выбранному: в NTF5-119 (б)
      обвязка исполняет запись снятия тем же кодом («шаги notify-sender», §6) либо утверждение
      «заявка снята» заменяется на утверждение о строке после шага снятия. Нужен близнец снятия
      одним фактом: заявка с done = false при том же шаге не снимается и получает вызов DescribeScope.

important:
  - id: I-1
    kind: PRODUCER
    text: >-
      DoD 10.1 п.9 берёт запись носителя notify в гейте изоляции на эту под-фазу, стадию S1. Но
      NTF-4 первой регистрирует InternalSuppressionService на слушателе notify-api. Как только
      регистрация появится в дереве, e2e-ban6-domains.py выведет домен notify провязанным, и без
      записи эндпоинта гейт на стволе упадёт (gap → rc=2) ещё до S1 NTF-5. Оговорка «если ствол
      уже несёт запись — вторая не заводится» здесь верна. Но реальный первый производитель — NTF-4,
      и строка возврата в §11 должна дойти до автора NTF-4 (вопрос диспетчеру).
  - id: I-2
    kind: FORMAT
    text: >-
      NTF5-118 (в): после отказа usr-op2 «дальше — как (а)», то есть отказ DescribeScope снимается,
      часы переводятся на T0 + 2m и T0 + 10m + 1s. «Тогда» (в) утверждает исход «как (г)». Стоит
      назвать момент утверждения (T0 + 2m), иначе проверка при T0 + 10m + 1s сравнивает с (г) на
      другом времени.

