important:
  - id: I-1
    kind: PRODUCER
    text: >-
      NTF5-122 (з) держит «Ф4 пишет только строку операции» не для всех форм дефекта. Обвязка несёт
      только таблицу операций и T1, T2, а NTF-3 Р18 ставит строку operation-failed «при включённом
      флаге». Ф4, которая ставит строку сама, но лишь при заданной опции записи ленты или флаге
      (параметр либо настройка NewRepo), в обвязке без опции строки не поставит. Тогда (з) зелёная, а
      предикат п.2а («ровно четыре функции на pgx.Tx») лишний параметр не считает. Фраза DoD 10.1 п.2а
      «иначе NTF5-122 (з) красный» верна только для безусловной записи. Совет: в Р23 и п.2а назвать
      сигнатуры Ф3 и Ф4 поимённо (ctx, tx, id и ответ либо статус; ни опции ленты, ни флага) и
      сделать сигнатуру вторым держателем. Либо в (з) подать Ф4 с включённым флагом, если такая ручка
      у фундамента появится. Для самой NTF-5 последствий нет: операции notify по флагу модуля не
      идут. Но утверждение документа о держателе шире того, что держатель ловит.

