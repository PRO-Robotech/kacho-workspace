ra10_closure:
  condition_a: >-
    Закрыто. Единица предиката — экспортируемая функция, названы поимённо Ф1…Ф4, число — четыре,
    параметр — pgx.Tx (Р23, DoD 10.1 п.2а). Выбрано «успех и ошибка порознь» (вариант разбора
    классов), `markDoneWithMetadataCAS` не экспортируется, довод назван (metadata пишет Ф1).
    Предикат п.2а выполним на предписанном построении: Ф3 = экспорт markDoneCAS, Ф4 = экспорт
    markErrorCAS, по одной функции каждая.
  condition_b: >-
    Закрыто. «Функция пишет только строку операции» — отдельный пункт Р23; строку operation-failed
    ставит вызывающий Ф4 своей записью в ту же транзакцию. Держатель — NTF5-122 (з) с близнецом (и)
    (перепись строк по каталогу базы, положительный контроль). Предел держателя — I-1 ниже.
  condition_c: >-
    Закрыто. Граница с NTF-3 Р18 проведена по функциям: Р18 касается только Ф4, Ф1…Ф3 — только
    NTF-5. Чтение NTF-3 Р18 сверено: вызывающие терминальной записи ошибки там — исполнитель и
    Reconciler фундамента (NTF-3 строка 1073), а строка Д6 NTF-3 (строка 449) уже говорит «функции
    фундамента, вызываемые тем же кодом, что … терминальную запись операции», то есть строку ставит
    вызывающий. Противоречия с NTF-3 нет, отражение — строкой возврата (§11).
  consequence_named: >-
    Письма о сбое Create оператору нет: терминальные отказы шагов 4, 5 пишет notify-sender через Ф4,
    операции Р5 и Р21 рождаются завершёнными (NTF-3 Р18, последний пункт, процитирован верно).
  race_for_f4: "добавлено NTF5-122 (к) — гонка Ф4 против CancelOwned, 20 повторов; прежде гонку держала только Ф3 (ж)"

