questions_for_dispatcher:
  - >-
    B1 можно закрыть двумя путями. Путь сегментами в NTF-5 соседей не трогает. Путь через правку
    формы `path` в NTF-1 требует переодобрения NTF-1, и там уже открыт RA-09 о границах той же
    формы. Выбор пути — за диспетчером.
  - >-
    NTF3-114 против двери kaname (I-4) до сих пор не передан автору NTF-3.
