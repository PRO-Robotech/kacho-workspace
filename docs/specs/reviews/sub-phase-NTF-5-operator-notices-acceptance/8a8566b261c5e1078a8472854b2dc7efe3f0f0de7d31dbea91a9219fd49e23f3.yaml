blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    title: "Ссылка письма Р6 (`link` типа `path` с `?accountId=`/`?projectId=`) запрещена формой `path` одобренной NTF-1 530e2296 — каждое письмо OB уходит в `INVALID`"
    scenarios: [NTF5-58, NTF5-65, NTF5-66, NTF5-85, NTF5-104]
    evidence: >-
      Редакция 6 опирается на NTF-1 530e2296 (§1.6, строка 309: «Р7 шаблон (атрибут ссылки —
      абсолютный путь, Р6 здесь)»). В этой редакции NTF-1 Р7 (строки 536-546) задаёт форму значения
      `path`: сегменты из `[A-Za-z0-9._~-]`, разделённые одной `/`; `?`, `#`, `%` запрещены. Значение
      вне формы — `attrs_invalid`, исход `INVALID`, терминально (NTF-1 Р11, строка 704; держатель
      NTF1-G24). В этом документе Р6 (строка 546) задаёт `link` (тип `path`) как
      `/notices/<noticeId>?accountId=<A>` либо `?projectId=<P>`, а «Тогда» утверждают такую ссылку в
      принятом письме: строки 1822, 1844, 2200. Против notify, построенного по одобренной NTF-1,
      любая строка извещения с такой ссылкой не рендерится. SMTP-узел не примет ни одного письма OB,
      так что сценарии с «SMTP-узел принял» не строятся. Строка §1.6 «атрибут ссылки письма —
      абсолютный путь с одной ведущей косой» доводит сверку только до ведущей косой и `?` не видит.
    fix: >-
      Выразить область в ссылке сегментами пути, а не параметром запроса. Например
      `/notices/<noticeId>/accounts/<A>` и `/notices/<noticeId>/projects/<P>`, либо
      `/accounts/<A>/notices/<noticeId>` — форму выбирает автор и называет маршрут консоли, который
      NTF-6 примет стадией экранов. Прогнать пример ссылки через правило формы NTF-1 Р7 (§1.4) и
      поправить Р6, строку таблицы маршрутов (948), «Тогда» 1822, 1844, 2200 и строку NTF-1 в §1.6.
      Второй путь — правка формы в NTF-1, то есть переодобрение соседа. Его выбирает диспетчер, не
      этот документ.
  - id: B2
    kind: NEGATIVE
    title: "Вторая строка шага 5 Р10 (отказ-неисправность справочника: misconfigured, счётчик, курсор без возврата к первой странице) без держателя и без близнеца"
    scenarios: [NTF5-18, NTF5-67]
    evidence: >-
      Р10 шаг 5 (строки 667-677) делит коды ответа справочника на две строки. Первая —
      недоступность: держатели NTF5-18 (разрыв) и NTF5-67 (`UNAVAILABLE`). Вторая —
      `PERMISSION_DENIED`, `UNAUTHENTICATED`, `INVALID_ARGUMENT`, `NOT_FOUND`, … и `OK` без
      `exists`: «та же клетка плюс сигнал misconfigured и счётчик
      notify_recipient_directory_refused_total{ns="notify",code}». Редакция 6 добавила к ней в Р10
      (строки 711-714) новое утверждение: «Отказ на свой курсор обход с первой страницы не начинает
      … (в том числе INVALID_ARGUMENT на page_token) … позиция остаётся прежней». Ни одно «Тогда» не
      утверждает сигнал, счётчик или то, что после такого отказа нет вызова `ListAccounts` без
      `pageToken`: grep по счётчику находит только Р10 и §16. Реализация может на INVALID_ARGUMENT
      своего курсора начать обход заново или не вести счётчик. Уникальность строк доставки прячет
      повторный обход в числе писем, поэтому такая реализация проходит все 110 сценариев. Тот же
      класс в тот же момент возвращён у NTF-3 (4e2ffe87, B5-1).
    fix: >-
      В NTF5-67 добавить букву, которая отличается от базы одним фактом — кодом отобранного отказа.
      Отобранный вызов (запрос третьей страницы) отвечает `INVALID_ARGUMENT` (поле `page_token`)
      вместо `UNAVAILABLE`. «Тогда» в момент снятия отказа: ровно 200 строк `scheduled`;
      `notify_recipient_directory_refused_total{ns="notify",code="INVALID_ARGUMENT"}` ≥ 1; сигнал
      `misconfigured` поднят; `ListAccounts` без `pageToken` вызван ровно 1 раз (обход не начат
      заново). После снятия: 250 писем, повторов нет. Близнец — база NTF5-67 (`UNAVAILABLE`):
      счётчик 0, сигнала нет. Для шага 5 при создании нужна такая же пара в NTF5-18:
      `DescribeScope` → `PERMISSION_DENIED` даёт `done=false`, счётчик и сигнал; близнец — (а)/(б).
      Добавить строки в §8, §9 и DoD.

important:
  - id: I-1
    kind: FORMAT
    text: >-
      §1.6 измерена на a67820c41, но к коммиту самой редакции 00657b629 после этой ревизии вышло пять
      записей. NTF-3 4e2ffe87 — ⛔ (d4824b213, NEGATIVE B5-1: отказ справочника на странице после
      первой; NTF-5 этих списков не зовёт). NTF-2 — редакция 10, 27cd8f06 (b8b0d9dc3), и на неё
      возврат 12791651d. Дельта a67820c41→HEAD по NTF-2: строк о коде подтверждения и email_verified
      0, опора посева не задета. NTF-6 — разбор классов «к коду» (5be61c6b5). NTF-1 530e2296 —
      разбор классов «вернуть в приёмку» RA-07…RA-09 (0a7dda36f). RA-09 требует решить в NTF-1 Р7
      границы формы `path`: «/» без сегментов, хвостовая «/», пустой сегмент. Новая ссылка по B1
      не должна попадать ни в одну из этих границ. RA-07 (5.7.x у класса security) и RA-08
      (нормализация у kaname) опор NTF-5 не задевают. Строку «нет: разборов классов на 530e2296
      нет» нужно перемерить на коммите самой редакции.
  - id: I-2
    kind: FORMAT
    text: >-
      §1.4, абзац о ValidateResourceID: «отвергает … длину, отличную от ShortIDLen = 20» — неполно.
      Функция принимает и id из закрытого перечня посеянного (`domain.IsSeededResourceID`, строка
      58 ids.go @734f69fb4). Сценариев это не меняет (`acc12` в перечне нет), но утверждение о
      дереве должно быть точным.
  - id: I-3
    kind: CONSTRUCTIBILITY
    text: >-
      NTF5-68 «Дано»: «каждый из acc-1…acc-4 создан на секунду позже … (часы базы обвязки)».
      `created_at` пишет приложение, а не база: account_repo.go:216 `time.Now().UTC()` @734f69fb4.
      Назвать средство посева: прямая вставка с явным `created_at` в обвязке либо пауза ≥ 1 с между
      вызовами `Create`. Иначе исполнитель будет искать «часы базы», которых нет.
  - id: I-4
    kind: PRODUCER
    text: >-
      Строка возврата о NTF3-114 против двери по-прежнему открыта. Довести её до автора NTF-3 —
      дело диспетчера.

