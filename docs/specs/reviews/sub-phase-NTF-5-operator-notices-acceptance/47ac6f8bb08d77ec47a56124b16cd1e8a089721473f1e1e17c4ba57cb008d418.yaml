blocking:
  - id: B1
    kind: SCOPE
    title: "У контактов три несовместимых контракта в трёх текущих приёмках эпика, и основание З10 опровергнуто"
    scenarios: [NTF5-96, NTF5-97, NTF5-98, NTF5-99, NTF5-100, NTF5-101, NTF5-102, NTF5-103, NTF5-104, NTF5-105, NTF5-106, NTF5-59, NTF5-60, NTF5-61, NTF5-76, NTF5-95]
    evidence: >-
      NTF-5 заводит ContactService: List/Set/Delete на /notify/v1/contacts, у контакта нет
      идентификатора, категория — перечисление SECURITY/ACCOUNT_LEGAL/OPERATIONS, source ∈ PROJECT,
      ACCOUNT, DEFAULT_OWNER, правка по отношению admin. Документ утверждает, что это «форма NTF-6 Р3
      без переименований» (Р21) и что «в NTF-3 контракта нет, 0 упоминаний» (§1.6, З10). На текущем
      дереве оба утверждения неверны. NTF-6 (c82cd21b…) заказывает ресурс-назначение: POST
      /notify/v1/contactAssignments, GET …:resolve, у назначения есть contactAssignmentId;
      /notify/v1/contacts в NTF-6 не встречается ни разу. NTF-3 редакции 5 (301c23dc…, Р20) заводит
      AccountNotificationContacts{account_id, security} на GET|PATCH
      /notify/v1/accounts/{accountId}/contacts. Там категория — поле, source ∈ EXPLICIT | ACCOUNT_OWNER,
      право на правку — v_update, текст отказа другой («contact user <id> is not eligible for account
      <account_id>»). Прочие категории и переопределение проектом NTF-3 прямо оставляет NTF-5 для
      расширения того же ресурса (строки 724-727, 2654). В итоге у одного предмета — контакта
      безопасности аккаунта — три пути, три формы и два текста отказа. Если одобрить NTF-5 в таком виде,
      контракт с двумя владельцами будет запечатан.
    fix: >-
      Свести три контракта к одному. Спор о доме передать диспетчеру строкой возврата. Самый короткий
      путь по текущему дереву такой: NTF-5 расширяет ресурс NTF-3 Р20 полями account_legal и operations
      и вводит переопределение на проекте в той же форме (тот же путь, то же отношение, тот же текст
      отказа); ContactService, З10 и строка §1.6 про «0 упоминаний» снимаются. Другой путь: диспетчер
      выбирает форму NTF-5 или NTF-6, а две остальные приёмки правятся под неё отдельным рассмотрением.
      В любом случае каждый путь, поле, source и текст отказа контакта должен совпадать побайтно во всех
      трёх документах.
  - id: B2
    kind: PRODUCER
    title: "Ответы справочника Resolve и форма API настроек в «Тогда» не совпадают с тем, что объявляет их производитель NTF-3"
    scenarios: [NTF5-58, NTF5-62, NTF5-63, NTF5-64, NTF5-93, NTF5-97, NTF5-99, NTF5-78, NTF5-79]
    evidence: >-
      Р8, Р21 и §3 З3/З8 вызывают Resolve{namespace, subject, resource_ref, relation} и добавляют в
      исход NO_CONFIRMED_ADDRESS третье условие — «пользователь не ACTIVE». Текущая редакция
      производителя (NTF-3, 301c23dc…) объявляет другое. Во-первых, Resolve{namespace, subject?,
      audience}, где audience ∈ resource{resource_refs[1..100], relation=v_get} | self{} |
      account_owner{account_id}; при account_owner владельца отдаёт сам справочник (строки 474-480).
      Во-вторых, для неактивного пользователя там есть отдельный исход SUBJECT_INACTIVE →
      NO_ADDRESS(inactive) (строки 494, 765). Отсюда два следствия. NTF5-64 и NTF5-93 утверждают
      NO_CONFIRMED_ADDRESS / NO_ADDRESS, а при верной реализации NTF-3 они упадут. У владельца аккаунта
      два производителя: DescribeScope.ownerUserId (Р10) и Resolve account_owner (NTF-3). Кроме того,
      стадия S4 (NTF5-78, 79) описана формой updateMask entries.<module>.<kind>.<channel>. Но владелец
      настроек теперь существует (NTF-3 Р10), и форма у него другая: rules{module, event_class} с
      закрытым перечнем классов и модулем из ведомости подключённых. Строка «производителя нет» и
      заказ в §8 устарели, а сценарии S4 не выполнимы на API владельца.
    fix: >-
      Перенести вызовы справочника на форму NTF-3 (resource_refs, account_owner). З8 снять и сослаться
      на SUBJECT_INACTIVE → NO_ADDRESS(inactive), после чего поправить «Тогда» у NTF5-64 и NTF5-93.
      Решить, откуда берётся владелец. Вариант первый: ownerUserId из DescribeScope убрать и брать
      владельца через account_owner. Вариант второй: записать, почему нужны оба пути и что утверждается,
      если они расходятся. Клетку «obligation не отключается» переписать на форму NTF-3 Р10. Там она,
      скорее всего, держится построением: модуля notify нет в ведомости подключённых, класса вида в
      перечне event_class нет. Тогда NTF5-78 и 79 утверждают отказ INVALID_ARGUMENT для module=notify с
      положительным близнецом на подключённом модуле, стадия S4 и заказ снимаются, а производителем
      становится NTF-3. Если NTF-3 редакции 5 вернут и её форма изменится, пункт перемеряется на новой
      ревизии.
  - id: B3
    kind: CONSTRUCTIBILITY
    title: "Инвариант уникальности строки доставки не допускает второго и третьего напоминания DECOMMISSION"
    scenarios: [NTF5-71, NTF5-03]
    evidence: >-
      По Р8 на один этап у субъекта одна строка, и это держит уникальность в базе по (noticeId, stage,
      revision, subject). По Р5 у DECOMMISSION три напоминания одного этапа reminder в одной ревизии
      (startsAt − 30d, − 7d, − 1d). NTF5-71 требует два письма reminder на одну ревизию, NTF5-03 —
      три назначенных напоминания. При объявленном ограничении вставка второй строки reminder
      нарушает UNIQUE. Получается, что состояние «Тогда» NTF5-71 схемой запрещено: письмо не уйдёт
      или обработка упадёт на 23505, и неверным окажется сценарий, а не продукт.
    fix: >-
      Включить в ключ уникальности момент напоминания (или идентификатор назначенного этапа), например
      (noticeId, stage, revision, scheduled_at, subject). Назвать это в Р8 и в DoD 10.1 п.3. Добавить
      отрицание с близнецом: повторная обработка того же напоминания не даёт второго письма, а
      следующее по сроку напоминание даёт.

important:
  - id: I-1
    kind: FORMAT
    text: >-
      В §1.3 неверен счёт. Приведённая команда печатает 19 строк, а не «17 строк плюс
      registry_repository». Типов с прямой связью project — 19, registry_repository — двадцатый (связь
      через parent). 19 − 2 + 1 = 18, так что сам перечень в Р4 верен. Исправить число и формулировку.
  - id: I-2
    kind: TWIN
    text: >-
      NTF5-77 («Start и Complete у TERMS_CHANGE — без писем») утверждает отсутствие, но положительного
      близнеца в §9 нет. Нужна пара, где отличается ровно один факт: Complete у MAINTENANCE даёт письмо
      completed. Сейчас письма completed у MAINTENANCE не утверждает ни один сценарий.
  - id: I-3
    kind: PRODUCER
    text: >-
      NTF5-45: notify вызывает InternalIAMService.Check о v_get пользователя на ресурсе модуля, но не
      сказано, под каким субъектом. Перечень звена NTF-1 Р2 для notify — {ResolveSend} плюс методы
      Р10 этой под-фазы, а Check в нём не назван. Внести Check (или BatchCheck) в ограждение Р10 и
      перечень звена либо назвать иной путь.
  - id: I-4
    kind: FORMAT
    text: >-
      По Р10 кэш DescribeScope хранится бессрочно, а существование области проверяется при Create. Не
      сказано, идёт ли Create мимо кэша. Если ответ exists=true взят из кэша, извещение можно создать для
      удалённого аккаунта. Записать, что проверка существования при Create всегда зовёт владельца
      (consumer-validates-by-owner), а кэш служит только адресации и чтению.
  - id: I-5
    kind: CONSTRUCTIBILITY
    text: >-
      NTF5-45: у N1 не задан вид, а affectedResources допустимы только у MAINTENANCE, OUTAGE и
      DECOMMISSION (Р4). Назвать вид N1 в Given.
  - id: I-6
    kind: FORMAT
    text: >-
      Р21: у справочника бывает отказ вызова INVALID_ARGUMENT, например тип субъекта user: при
      идентификаторе sa-… в NTF5-99. Отображение на Set не задано: «любой иной исход» покрывает исходы,
      а не отказы вызова. Добавить строку, иначе на sa-1 одно тело отказа не гарантировано.

