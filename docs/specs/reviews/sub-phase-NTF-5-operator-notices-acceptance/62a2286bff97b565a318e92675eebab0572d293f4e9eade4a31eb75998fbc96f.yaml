blocking:
  - id: B1
    kind: COVERAGE
    title: "Ответ двух новых методов службы доступа (DescribeScope, ListAccounts) держит только подмена в обвязке notify; производителя не судит ни один сценарий"
    scenarios: [NTF5-17, NTF5-18, NTF5-66, NTF5-67, NTF5-68]
    evidence: >-
      Р10 объявляет контракт производителя. DescribeScope{accountId | projectId} →
      {exists, accountId, ownerUserId}: для проекта — его аккаунт и владелец аккаунта,
      несуществующая область → exists=false с пустыми полями. ListAccounts{pageToken, pageSize} →
      идентификаторы аккаунтов курсором. Эти ответы используют NTF5-17 (exists=false), NTF5-66 и 67
      (250 аккаунтов по 100) и адресация Р8 (аккаунт проекта). Но все эти сценарии идут против
      подмены: §6, строка «служба доступа со стороны notify» — «подмена … над посеянными данными».
      В обвязке службы доступа производителя судит только NTF5-68, и там один ответ:
      DescribeScope{accountId: acc-1} → exists=true. Ни один сценарий не проверяет в обвязке
      службы доступа: DescribeScope{projectId} → аккаунт и владелец; exists=false на
      несуществующей области; обход ListAccounts — каждый аккаунт ровно один раз, в заданном
      порядке, пустой следующий курсор в конце. При этом порядок выдачи и форма курсора ListAccounts
      в Р10 не заданы (у публичного списка notify они заданы, строки 766-767). Реализация службы
      доступа, у которой DescribeScope всегда отвечает exists=true или ListAccounts отдаёт только
      первую страницу с пустым курсором, пройдёт все 110 сценариев. Отказ по несуществующему
      аккаунту (Р10 шаг 4) тогда не наступит никогда, а allAccounts дойдёт до первых 50 или 100
      аккаунтов молча. Тот же класс в тот же момент возвращён у NTF-3 (ee6f908e, B4-1).
    fix: >-
      В Р10 назвать порядок выдачи ListAccounts и курсор, например `(created_at, id)` по
      возрастанию, с непрозрачным токеном, умолчанием 50 и потолком 1000, как у списков продукта.
      Добавить, что в конце обхода next_page_token пуст. В NTF5-68 (или отдельной буквой без нового
      номера) в обвязке службы доступа с сертификатом notify-sender проверить:
      (а) DescribeScope{projectId: prj-1} → {exists: true, accountId: acc-1, ownerUserId: usr-own};
      (б) DescribeScope{accountId: acc-9} → {exists: false}, прочие поля пусты — близнец (а) для
      аккаунта acc-1; (в) ListAccounts с pageSize=2 на посеве из 5 аккаунтов проходит 3 страницы,
      в объединении ровно эти 5, каждый по одному разу, в названном порядке, у последней страницы
      next_page_token пуст. Близнец — pageSize=5, одна страница. Добавить строки §8 и DoD 10.1 п.5,
      10.2 п.6.
  - id: B2
    kind: NEGATIVE
    title: "Отказы на вход у DescribeScope и ListAccounts не названы и не держатся"
    scenarios: [NTF5-68]
    evidence: >-
      Правило `api-pagesize`: pageSize вне [0..1000] и мусорный pageToken дают INVALID_ARGUMENT, а не
      clamp и не первую страницу. Правило `api-malformed-id-sync`: id проверяется формой первым
      стейтментом RPC. У ListAccounts нет ни отказа на pageSize, ни отказа на мусорный pageToken.
      У DescribeScope не названы отказы, когда не задана ни одна из областей, заданы обе, id пустой
      или неверной формы. Раскрытие allAccounts в notify-sender хранит курсор в базе и повторяет
      его (Р10, NTF5-67). Если производитель на мусорный или устаревший курсор молча отдаёт первую
      страницу, повтор после сбоя приведёт к повторному обходу с начала. Для этого случая
      документ опирается только на уникальность строк доставки, а не на отказ. Без держателя
      реализация в TDD может подрезать pageSize или игнорировать токен, и проба этого не
      заметит. Тот же класс в тот же момент возвращён у NTF-3 (ee6f908e, B4-2).
    fix: >-
      В Р10 для обоих методов записать отказы: ListAccounts — pageSize вне [0..1000] и мусорный
      pageToken → INVALID_ARGUMENT с полем page_size / page_token, проверка до вопроса о праве
      (`api-pagination-before-shortcircuit`); DescribeScope — ни одной или обе области →
      INVALID_ARGUMENT `"exactly one of accountId, projectId"`, пустая → `"<field>: required"`,
      неверная форма → `"invalid <res> id '<X>'"`. Держатели — буквы NTF5-68 в обвязке службы
      доступа с сертификатом notify-sender. Близнецы — pageSize=1000 даёт страницу, запрос без
      токена даёт первую страницу, DescribeScope{accountId: acc-1} → OK. Добавить строки §8, §9
      и DoD.

important:
  - id: I-1
    kind: FORMAT
    text: >-
      §1.6 верна на объявленной ревизии 58471e572. После неё вышли три записи: NTF-3 ee6f908e —
      возврат (04025df90); NTF-1 — редакция 9, отпечаток 530e22968ff1 (2fa62337b), вердикта на неё
      нет; NTF-6 47bd8b70 — ✅ (fe6231afe). Ни одна не опровергает опору NTF-5, это проверено в
      neighbours_measured. В следующей редакции нужно перемерить таблицу на её собственном коммите.
      У NTF-6 в столбце «вердикт» должно стоять APPROVED.
  - id: I-2
    kind: PRODUCER
    text: >-
      Строка возврата о NTF3-114 (usr-U с неподтверждённым адресом назначается контактом) против
      ответа двери по-прежнему открыта: на ee6f908e расхождение то же. Доводить до автора NTF-3 — дело
      диспетчера, не автора NTF-5.
  - id: I-3
    kind: FORMAT
    text: >-
      NTF5-67 «Тогда»: «ListAccounts с курсором второй — не меньше 2 раз, из них последний — OK».
      Число повторов между первым отказом и снятием отказа зависит от расписания повторов на
      управляемых часах, и форма «не меньше 2» это верно учитывает. Стоит одной фразой сказать,
      что при стоящих часах повтор не обязан произойти. Иначе проба, которая ждёт второго отказа
      до перевода часов, повиснет.

