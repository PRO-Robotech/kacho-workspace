    b_default_6s: "FAIL TestRevocationWindowIsDeclaredPolicy «окно разошлось с политикой … держит 6s, политика объявляет 5s»; остальные PASS"
    c_default_removed: "FAIL TestRevocationWindowIsDeclaredPolicy «запись политики без предмета»; площадок 11"
    d_dir_out_of_scan: "FAIL TestRevocationWindowIsDeclaredPolicy «запись политики без предмета»; файлов 31"
    e_knob_out_of_dictionary: "FAIL TestEveryAuthzWindowKnobIsDeclared, названы файл и ручка; кроме того, TestRevocationWindowIsDeclaredPolicy «без предмета»"
