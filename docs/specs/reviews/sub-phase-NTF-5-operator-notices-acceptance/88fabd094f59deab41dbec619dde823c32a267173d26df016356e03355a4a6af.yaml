experiment:
  isolation: >-
    Отдельные worktree kacho @1d42a6728bf и corelib @v1.8.0 (это пин kacho). Подключены
    `go mod edit -replace` на локальный corelib, после проб сняты. В рабочую копию ветки
    ничего не попало.
  change_applied: >-
    Сделана ровно та правка, которую предписывает DoD 10.1 п.10.
    services/notify/internal/config/config.go с тегом
    `envconfig:"KACHO_NOTIFY_LIST_FILTER_CACHE_TTL" default:"5s"`; ручка добавлена в knobNames
    семьёй list-filter; каталог добавлен в revocationScanRoots; в corelib Windows добавлена запись
    `notify KACHO_NOTIFY_LIST_FILTER_CACHE_TTL: 5s`. Ещё добавлен файл services/notify/cmd/notify-api
    с литералом `CacheWindow:` — это форма держателя, которую Р17 берёт от строителя хоста (Д17, NTF-4).
  command: >-
    go test ./internal/repohygiene/ -run 'TestRevocationWindowIsDeclaredPolicy|TestEveryAuthzWindowKnobIsDeclared|TestEveryVerdictCacheServiceIsDeclared|TestKnobShapePredicateHasControlsBothWays|TestEveryVerdictCacheProcessDeclaresItsOwnKnob' -v -count=1
  baseline: "5 из 5 PASS; файлов разобрано=31, площадок=11, записей политики=11; ручек формы 10 из 10"
  twin_with_change: >-
    5 из 5 PASS; файлов разобрано=32 (+1 — единственный .go каталога), площадок=12, записей=12;
    держателей 8 (было 7); ручек формы 11 из 11; перечень конструкторов прежний
  injections:
