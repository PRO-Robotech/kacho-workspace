questions_for_dispatcher:
  - >-
    NTF-4 (редакция 18 @b1e19abd904) задаёт ручке KACHO_NOTIFY_AUTHZ_CACHE_TTL границу «1 с … 30 с».
    Это выше RevocationPolicy.Ceiling = 10 с (corelib authz/revocation_policy.go:153), и записи окна
    в переписи гейта NTF-4 не заводит. Имя ручки подходит под форму AUTHZ+TTL, поэтому
    TestEveryAuthzWindowKnobIsDeclared покраснеет на ней сама. Передать автору NTF-4. Это же
    снимает I-1 и I-3 выше.
  - "Запись носителя notify в INTERNAL_ENDPOINTS первой нужна NTF-4 (перенос I-3 круга 12)."
