important:
  - id: I-1
    kind: DoD
    text: >-
      DoD 10.1 п.10: «каталог services/notify/internal/config — в перечне revocationScanRoots», и
      близнец ждёт, что файлов разобрано станет больше на число .go-файлов каталога. Это верно,
      только если ствол к старту S1 ещё не несёт каталог в перечне. У NTF-4 (редакция 18 @b1e19abd904)
      в том же каталоге будет ручка окна звена прав KACHO_NOTIFY_AUTHZ_CACHE_TTL. Её форма (AUTHZ+TTL)
      по всему дереву обязывает к записи в knobNames и Windows, а тогда и к каталогу в обходе. Если
      NTF-4 сядет первой, п.10 надо выполнять без второй записи каталога, а прирост файлов будет 0.
      Лучше дописать оговорку так же, как у п.9: «если ствол уже несёт каталог — вторая запись не
      заводится; прирост считать от ствола до правки NTF-4».
  - id: I-2
    kind: DoD
    text: >-
      В списке близнеца DoD 10.1 п.10 четыре проверки. Пятая, TestEveryVerdictCacheProcessDeclaresItsOwnKnob,
      не названа, а она краснеет «запись Windows без процесса: notify», если в services/notify нет
      литерала CacheWindow (experiment.premise_holder_absent). Предпосылку Р17 называет (поле
      CacheWindow строителя хоста, ручка NTF-4, Д17), и S1 ждёт NTF-4, так что состояние достижимо.
      Стоит назвать эту проверку в близнеце и сказать, что зелёная она только при держателе.
  - id: I-3
    kind: PRODUCER
    text: >-
      Процесс в переписи гейта один на каталог. Поэтому запись `notify KACHO_NOTIFY_LIST_FILTER_CACHE_TTL`
      делает notify «объявленным со своей ручкой» для обеих проверок держателей, даже если окно
      звена прав NTF-4 в Windows так и не попало. Для NTF-5 это не дефект: ручку NTF-4 документ
      не трогает и прямо это говорит. Но так закрывается сигнал о чужом окне. Вопрос маршрута —
      диспетчеру (вопросы ниже).

