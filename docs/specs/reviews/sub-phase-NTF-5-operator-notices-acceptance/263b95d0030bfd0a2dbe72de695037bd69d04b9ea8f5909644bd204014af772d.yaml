blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    title: "NTF5-67: при остановке всей подмены после второй страницы ListAccounts 200 писем невозможны — вызовы, нужные для писем второй сотни, идут после этой страницы"
    scenarios: [NTF5-67]
    evidence: >-
      В Given сказано: «подмена службы доступа останавливается после второй страницы ListAccounts»,
      то есть отказывает вся подмена, а не один метод (§6: одна подмена отвечает на DescribeScope,
      ListAccounts, Resolve и ResolveSend). В Then: «пока подмена стоит — писем 200». По собственным
      решениям документа каждому письму аккаунта из второй страницы нужны три вызова той же
      подмены, и все они возможны только после того, как вторая страница получена:
      (1) DescribeScope. У allAccounts заявки нет, кэш пуст, раскрытие зовёт его при промахе
      (Р10, NTF5-66: «250 вызовов, по одному на аккаунт»);
      (2) Resolve кандидата (Р8);
      (3) ResolveSend на каждое письмо (Д4, Р1 — общий конвейер).
      Аккаунт нельзя спросить раньше, чем страница его назвала. Значит, при буквальном Given письма
      acc-101…acc-200 откладываются (Р8: UNAVAILABLE — строка откладывается), и за время простоя
      уходит не больше 100 писем. Сколько именно, зависит от порядка работы конвейера, которого
      документ не задаёт. «Тогда» утверждает исход, который его «Дано» не производит. Проба по
      этому сценарию будет либо красной на верной реализации, либо зелёной только при особом
      расписании.
    fix: >-
      Сбой задать одним методом и одним вызовом. Например: подмена отвечает UNAVAILABLE на
      ListAccounts с курсором второй страницы (третий вызов), на всё прочее отвечает штатно. Тогда
      «писем 200, fanout_pending = 1» при простое и «250 всего, третья страница запрошена с курсором
      второй» после подъёма следуют из Р8, Р10 при любом порядке конвейера. Если нужен сбой всей
      подмены, утверждать число, которое от порядка не зависит: «не больше 200, ни одного письма
      аккаунтам третьей страницы; после подъёма ровно 250, без повторов». Проверить тем же вопросом
      все Given со сбоем зависимости (NTF5-18, 90, 104 его выдерживают: там разорван один путь,
      а утверждаемые вызовы идут по другому).

important:
  - id: I-1
    kind: FORMAT
    text: >-
      §1.6 утверждает, что соседи сверены по отпечатку, вердикту и опровергнутым посылкам. На момент
      коммита редакции (bc3af0c80, 07:06) столбец «вердикт» устарел в трёх строках. NTF-2 a4f11cee —
      возврат (b62fd8407, 07:00). NTF-3 f0cfd653 — возврат (aa2bfc068, 07:02), редакция 9 538b4d3f
      тоже возвращена (6c8a26bb1). NTF-4: после f9e8de7e возвращена f6453d34 (be9a25800), а не только
      1a6019bc. После одобрения вышли и разборы классов до кода NTF-1 (0ab60915b) и NTF-6
      (a6a67ee29), оба «вернуть в приёмку». Я сверил каждую запись с опорами NTF-5: ни одна опора не
      опровергнута (neighbours_measured). Нужно назвать одну ревизию сверки, коммит, а не «и
      последующие записи», и перемерять таблицу непосредственно перед отдачей.
  - id: I-2
    kind: PRODUCER
    text: >-
      Расхождение с NTF-3 подтверждено деревом. NTF3-114 (и на 538b4d3f) утверждает, что `usr-U`
      с неподтверждённым адресом назначается контактом (`done=true`). Дверь kaname @734f69fb4 на
      вопрос о таком человеке отвечает «нет» (admission раньше модели). Вопрос, который задаёт
      notify-api, от поля не зависит. Поэтому на одной реализации и одной подмене NTF3-114 (поле
      security) и NTF5-98 (поле operations) вместе зелёными быть не могут. Версия NTF-5 совпадает
      с деревом; править нужно NTF-3. Строка возврата в §11 есть, её нужно довести до автора NTF-3.
  - id: I-3
    kind: FORMAT
    text: >-
      Create теперь асинхронный: приём в notify-api, фиксация в notify-sender. Р4 («startsAt ставит
      сервер = момент создания») и Р5 («startedAt = моменту создания») не говорят, какой это момент —
      приёма заявки или фиксации извещения. Это же касается createdAt. На часах, стоящих на T0,
      сценарии это не различают, но реализации различат. Нужно назвать момент одной строкой в Р10.
  - id: I-4
    kind: COVERAGE
    text: >-
      Д14: DescribeScope и ListAccounts ограждены типом из перечня без надзора. Тип держат сценарии
      NTF-3 и NTF-1 F12. У двух новых методов нет ветки, которая упадёт, если их строка каталога
      окажется под надзором. Для этого нужен вызывающий, который является администратором облака.
      Предлагается дописать в NTF5-68 ветку «субъект user с system_admin на cluster:cluster_root →
      PERMISSION_DENIED» с близнецом service:notify → OK.
  - id: I-5
    kind: FORMAT
    text: >-
      NTF5-109 (в): «как в NTF5-01, но audience.projectIds=["bad-1"]». Нужно явно сказать, что
      projectIds заменяет accountIds. Иначе по порядку Р4 первым сработает «exactly one of» (NTF5-16).
      И в §4: номер задачи NTF-6 известен — PRO-Robotech/kacho#2925.

