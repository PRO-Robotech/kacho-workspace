blocking: []

important:
  - id: I-1
    kind: FORMAT
    text: >-
      Граница транзакции взятия прямо не названа. В Р10 шаге 2 есть «db-skip-locked» и «в той же
      транзакции взятия». NTF5-119 (г) и (д) требуют, чтобы повторное взятие после «Дано» (заявку
      уже взяли, DescribeScope = exists=true) увидело строку. Это выполняется, только если
      транзакция взятия закрыта до шага 3 и блокировка строки заявки не держится до фиксации. На
      это же указывает запись шага 3 с условием на состояние заявки (db-cas): это отдельная
      транзакция. Одна фраза в шаге 2 — «транзакция взятия закрывается до фиксации, фиксация —
      своя транзакция шага 3» — сняла бы прочтение, при котором (г)/(д) не строятся.
  - id: I-2
    kind: PRODUCER
    text: >-
      Перенос из круга 10, I-1. Запись носителя notify в INTERNAL_ENDPOINTS гейта изоляции (DoD
      10.1 п.9) первой нужна NTF-4: InternalSuppressionService регистрируется на notify-api
      раньше. Документ это оговаривает («если ствол уже несёт запись — вторая не заводится»).
      Вопрос маршрута — диспетчеру.

