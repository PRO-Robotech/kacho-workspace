    от умолчания (5s) одним фактом — моментом чтения. NTF5-54 (г), (д) — близнец (в). Перепись
    гейта (DoD п.10) не строится — B12-1
  RA-8: >-
    закрыт. Производитель — правка corelib operations (Р23): три формы, по одной функции на
    каждую; форма 3 — экспорт markDoneCAS / markErrorCAS без изменения условия; принципал без
    запасного; READ COMMITTED. Все пять мест записи операции в транзакции ссылаются на Р23.
    Стадия S1 ждёт тега (§5), граница с NTF-3 Р18 названа, держатель — NTF5-122 (ж), гонка на 20
    повторов
  RA-9: >-
    закрыт. NTF5-121: вызов прямо на слушатель notify-api клиентом с SAN края и пересланным
    принципалом. Отказ на Create (usr-c, usr-v) и на Get (usr-c): PERMISSION_DENIED
    «permission denied», use-case не исполнялся, в журнале ровно один Check. Близнецы — usr-op на
    Create, usr-v на Get. NTF5-22 и 24 названы держателями уровня края; перепись «метод ↔ право»
