blocking:
  - id: B12-1
    kind: CONSTRUCTIBILITY
    anchors: ["Р17 (абзац после таблицы ручек)", "Р16 (посадка сужателя)", "DoD 10.1 п.10", "§23 строка RA-7"]
    text: >-
      Пункт DoD 10.1 п.10 требует от гейта окна отзыва состояния, которое при его нынешнем
      устройстве получить нельзя. Отдельных дефектов три.
      (1) «Конструктор listnarrow.New — в словаре конструкторов гейта». Имя конструктора гейт
      сопоставляет без квалификатора, и это сделано намеренно (ownership.go:134-139,
      `verdictCacheCtorNames[fn.Sel.Name]`; gate.go: «the package qualifier is no longer read»).
      Если записать в словарь `New`, окно по конструктору получит любой процесс, где есть вызов
      `<что угодно>.New(`, — это 195 не-тестовых файлов в services/ и gateway/ @1d42a6728bf.
      TestEveryVerdictCacheServiceIsDeclared (revocationwindow_test.go:239) потребует записи
      Windows для каждого такого процесса. Чтобы выполнить пункт буквально, придётся либо
      заставить гейт читать квалификатор (это меняет его договор, и нужна своя инъекция), либо
      сломать перепись. Сужатели модулей (authzfilter у compute, storage, vpc, nlb) в словаре
      конструкторов тоже не стоят: они держатся только ручкой. Поэтому довод «так же, как ручки
      окна сужателя модулей» (Р16) требования к конструктору не содержит.
      (2) «Запись RevocationPolicy.Windows с ключом `notify-api KACHO_NOTIFY_LIST_FILTER_CACHE_TTL`».
      Гейт собирает ключ сверки как serviceOfPath(каталог) + " " + ручка
      (revocationwindow_test.go:111-113), а serviceOfPath для services/notify/… даёт `notify`
      (:178-190). Площадка будет сверяться с ключом `notify KACHO_NOTIFY_LIST_FILTER_CACHE_TTL`,
      и запись `notify-api …` даст находку «окно не объявлено политикой». Кроме того, перепись
      держателей берёт имя процесса из первого слова ключа (:247-248), и процесс `notify` окажется
      необъявленным. Различать два развёртывания одного каталога (notify-api и notify-sender) гейт
      сегодня не умеет.
      (3) Гейт читает только закрытый перечень каталогов конфигурации revocationScanRoots
      (revocationwindow_test.go:40-60). Каталога services/notify/internal/config в нём нет, и
      пункт п.10 его не называет. Без этого ручка в словаре knobNames не даст ни одной площадки, и
      инъекция «ручка снята из сборки сужателя» гейт не уронит: сверять ему нечего.
      Что нужно: переписать п.10 (и абзац Р17, и строку §23) так, чтобы его можно было выполнить.
      Ручка — в knobNames, семья list-filter. Каталог конфигурации notify — в revocationScanRoots.
      Ключ Windows — в той форме, которую производит гейт (`notify KACHO_NOTIFY_LIST_FILTER_CACHE_TTL`),
      либо правка serviceOfPath под имена развёртываний, названная производителем со своей
      инъекцией. Требование к listnarrow.New снять, либо заменить правкой сопоставления
      конструкторов с квалификатором — тогда со своей инъекцией и близнецом: «чужой `x.New` окна
      не даёт».

important:
  - id: I-1
    kind: COVERAGE
    text: >-
      NTF5-122 (д): «создание операции E3 любой из двух функций создания с пустым принципалом».
      Р23 и DoD 10.1 п.2а говорят «обе функции создания отвергают пустой принципал». Проба,
      вызвавшая только одну функцию, формально выполнит букву (д), и подстановка SystemPrincipal во
      второй функции останется без держателя. Это тот самый класс CX5-33. Лучше развести на (д1),
      (д2) — по функции на каждую, с близнецами (е1), (е2).
  - id: I-2
    kind: CONVENTION
    text: >-
      CX5-36 (в) требует задавать CacheMaxEntries сужателя явно; RA-7 этого не требовал. В Р16 про
      предел размера окна ничего нет, а неположительное значение сужатель заменяет умолчанием
      10000 (listnarrow/narrower.go:218-219 @34bc810). Если предел остаётся умолчанием фундамента,
      это нужно сказать словами. Иначе — ручка или константа сборки с обоснованием.
  - id: I-3
    kind: PRODUCER
    text: >-
      Перенос из круга 11, I-2: запись носителя notify в INTERNAL_ENDPOINTS гейта изоляции первой
      нужна NTF-4. Вопрос маршрута — диспетчеру.

