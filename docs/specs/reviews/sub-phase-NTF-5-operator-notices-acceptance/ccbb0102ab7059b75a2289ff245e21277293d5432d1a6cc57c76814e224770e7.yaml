closed_from_previous_round:
  - id: B17-1
    kind: CONSTRUCTIBILITY
    status: закрыто
    evidence: >-
      §8 строка NTF5-68 (строка 3429): проба — «интеграционная проба kaname в её обвязке над
      иерархией, заведённой только методами создания службы доступа по шагам 1–7», `N = 10`
      (аккаунт миграции + пять аккаунтов регистрации + четыре `AccountService.Create`), иное `N` —
      «не выполнилось»; «буквы (а)–(п) — против самой службы доступа, не против подмены». «Дано» шаг 7
      называет аккаунты регистрации с координатой `register.go:238`, `:275` @kaname `8a84dcff6` и
      `N = 10`. Перепись `grep -nE 'посеянн|посев|\(5,|5 аккаунт|все 5'` на ccbb0102: оставшиеся
      попадания — история шапки (24), §1.3/§1.4 о посеянном миграцией аккаунте (190, 308, 311, 892),
      «Дано» NTF5-68 об аккаунте миграции (2988), §6 о подмене `notify`/манифесте/подавлении
      (1660, 1667, 1672, 1679, 1682), иные сценарии (2052, 2079, 3325), §8 NTF5-22/81 (3410, 3435),
      §11 (3888), история §12–§30. О строках службы доступа в пробе NTF5-68 — ни одного.

important:
  - id: I-1
    kind: CONSTRUCTIBILITY
    text: >-
      Шаг 7 «Дано» NTF5-68 разносит по секундам только вызовы обвязки, создающие аккаунт, и затем
      утверждает «секунды `created_at` у всех `N` разные» (буква (з)). Аккаунт миграции `acc-sys`
      вызовом обвязки не является: его `created_at` — `now()` транзакции миграции
      (`0001_initial.sql:3210` @kaname `8a84dcff6`), а `accounts.created_at` хранится с микросекундами
      (`account_repo.go:233,243-251`: `time.Now().UTC()` без усечения). Если первая регистрация шага 2
      попадёт в ту же секунду, что миграция, `L`, упорядоченный по `(createdAt, id)` усечённых до
      секунды ответов, может разойтись с порядком базы, и (з) покраснеет без дефекта продукта.
    default_fixed_on_review: >-
      Обвязка делает первую регистрацию шага 2 не раньше чем через 1 s после `createdAt` аккаунта
      `acc-sys` (из ответа `AccountService.Get`/`List`), и до первой буквы сверяет попарную
      различимость секунд `createdAt` в `L`; совпадение — «не выполнилось» (фикстура), как и иное `N`.
      Довод: то же средство и тот же исход, что уже названы шагом 7 для прочих аккаунтов. Круг 17 этот
      пробел не назвал — недосмотр рецензента, не новая правка документа.
  - id: I-2
    kind: FORMAT
    text: >-
      «Дано» шаг 3: «бутстрап-учётка обвязки» не названа. Строится: в базе миграции есть служебная
      учётка `svab91854890de887e6d` (`kacho-bootstrap-admin`, аккаунт `acc-sys`) с выдачей
      `system_admin` на кластер (`0001_initial.sql:3418`, `:3843` @kaname `8a84dcff6`), и
      `GrantAdmin` требует от вызывающего `system_admin@cluster` (`cluster/grant_admin.go:108`).
      Человек через `seed.RunBootstrapAdmin` для этой роли не годится: он должен быть
      зарегистрирован (`seed/bootstrap_admin.go:3-11`), а регистрация заводит ему аккаунт — `N` стал бы
      11. Ограничение «иных вызовов, создающих аккаунт, обвязка не делает» и сверка `N = 10` это
      отсекают, поэтому замечание не блокирует. Рекомендация — назвать учётку в шаге 3.
    default_fixed_on_review: "вызывающий шага 3 — посеянная миграцией служебная учётка svab91854890de887e6d"
  - id: I-3
    kind: FORMAT
    text: >-
      Перенесено из круга 17 (I-1), не исправлено: средство §6 «отказ отобранных вызовов» (строка 1673)
      приводит отбор `Resolve` «о данном субъекте по данной области», а NTF5-59 (а), (б) и строка 2798
      отбирают `Resolve{account_owner{account_id: acc-1}}` — без субъекта. Дописать пример отбора по
      форме аудитории и её `account_id`.
  - id: I-4
    kind: CONSTRUCTIBILITY
    text: >-
      Перенесено из круга 17 (I-2), не исправлено: почему барьер шага 6 (`materializedAt` =
      `MAX(updated_at)` по ACTIVE-строкам членов выдачи) держит именно объект `project:prj-1` для (н),
      документ не говорит. Держится тем, что путь создания материализует всех членов выдачи одним
      проходом в одной транзакции. Стоит записать одной фразой.
  - id: I-5
    kind: SCOPE
    text: >-
      Перенесено из круга 17 (I-3): формы `account_owner` и `account_reader`, их исходы и клетки берутся
      из NTF-3 редакции 35 (рабочая копия, вердикта нет). При одобрении NTF-3 — повторная сверка.

