important:
  - id: I-1
    kind: SCOPE
    text: >-
      Документ сверял соседей на `2ef21d90b`, где NTF-4 — редакция 18 @`53f865d8`. Редакция 19 NTF-4
      (`5cb8057d…`, коммит 5f87c1819, вердикта нет) на ветке уже правит Р20 по Д20 (2). Она же
      пишет «методы, публичные по контракту (их заводит NTF-3)», хотя строки NoticeService и
      контактов проекта вносит NTF-5. Когда редакция 19 будет одобрена, §1.4, §1.6 и §11 нужно
      перемерить на её отпечатке. Строку возврата к NTF-4 стоит дополнить: «строки перечня вносит
      и NTF-5».
  - id: I-2
    kind: TWIN
    text: >-
      Близнец NTF5-49 (г)–(б) меняет вызывающего (usr-x без привязок вместо usr-t — владельца
      аккаунта), а не только право. Чище, как в NTF5-44: тот же пользователь, у которого привязка
      viewer на prj-t есть или нет.
  - id: I-3
    kind: PRODUCER
    text: >-
      DoD 10.1 п.2а (б) не называет, входит ли в перепись `AsOwned(r Repo) OwnedOperationRepo`
      (owner.go:115 @34bc810). Если Ф1…Ф4 встанут на тип, который возвращает AsOwned, его параметр
      `Repo` (интерфейс вне набора) станет находкой уже на неизменённом коде. Стоит назвать AsOwned
      поимённо — внутри переписи или вне её.

