blocking:
  - id: B15-1
    kind: PRODUCER
    where: "DoD 10.2 п.5 (строка 3706: «держатель — NTF5-84»); DoD 10.1 п.4 (строки четырёх методов NoticeService и «ни одного метода Internal* в перечне нет» — без держателя); Р2, абзац о перечне"
    text: >-
      Дельта Д20 (2) вводит восемь строк перечня методов notify на внешнем gRPC-входе края. DoD 10.2
      п.5 называет держателем строк `Get` и `Update` обоих сервисов контактов сценарий NTF5-84. Но
      NTF5-84 читает внешним gRPC только `ProjectNotificationContactsService/Get` (и
      `NoticeService/ListByAccount`). Если строки `Update` нет в перечне, NTF5-84 остаётся зелёным.
      Такая строка закрыла бы `PATCH` контактов по нативному gRPC, а ради SDK и провайдера
      инфраструктуры как кода Д20 (2) его и открывает. У строк `NoticeService/Get` и `GetByAccount`
      (DoD 10.1 п.4) держателя нет вовсе. У утверждения «ни одного метода `Internal*` в перечне нет»
      тоже: NTF5-26 (б) проверяет отказ перехватчика, а не состав перечня.
      Настоящие держатели в дереве есть @`1d42a6728bf`, документ их не называет. Состав перечня
      вычисляется из дескрипторов в kacho `gateway/internal/allowlist/parity_test.go`:
      `TestAllowlist_EveryPublicRPCIsRoutable` (публичное в дескрипторах минус перечень — пусто),
      `TestAllowlist_NoInternalRPCIsRoutable` (пересечение перечня с `Internal*` — пусто),
      `TestAllowlist_NoEntryWithoutAnRPC`. Население сверяется с диском в
      `TestAllowlist_CensusCoversEveryProtoFile`: новый каталог `proto/kacho/cloud/notify/v1` без
      blank-импорта краснеет. Ключ домена в карте соединений проверяет
      `gateway/cmd/api-gateway/route_wiring_parity_test.go`.
      Что сделать: в DoD 10.1 п.4 и 10.2 п.5 назвать эти пробы держателями строк перечня и ключа
      `notify` (с дописанным импортом notify в население `parity_test.go`), а NTF5-84 оставить
      держателем того, что чтение по gRPC доходит до `notify-api` и судится `Check`. Другой вариант —
      добавить в NTF5-84 (или новую букву) вызов `ProjectNotificationContactsService/Update` внешним
      gRPC. Тогда сквозной держатель строки `Update` появится у маршрута мутации, который Д20
      открывает впервые.
    predicate: >-
      git -C project/kacho show 1d42a6728bf:gateway/internal/allowlist/parity_test.go | grep -n '^func Test'
      → 325 CensusCoversEveryProtoFile, 366 EveryPublicRPCIsRoutable, 387 NoEntryWithoutAnRPC,
      409 NoInternalRPCIsRoutable; grep -nE 'route_wiring|EveryPublicRPC|NoInternalRPC|parity' <файл> → 0;
      grep -n 'держатель — NTF5-84' <файл> → 3706

