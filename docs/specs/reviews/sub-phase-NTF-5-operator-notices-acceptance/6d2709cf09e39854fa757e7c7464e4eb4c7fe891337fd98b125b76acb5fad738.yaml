blocking:
  - id: B9-1
    kind: COVERAGE
    anchors: ["Р2 «Операции»", "Р10 шаг 1–3", "NTF5-26 (в)", "§3 З20", "§9", "DoD 10.1 п.3"]
    text: >-
      Длительная операция Create (done=false до окна Р17) по Д18 доступна оператору через внутренний
      слушатель края, и по NTF-4 Р20 с того же слушателя доходит не только Get, но и
      POST /operations/{id}:cancel (NTF4-94 (б)). Обработчик фундамента отменяет незавершённую
      операцию владельца (corelib operationspb.Cancel → CancelOwned). Документ исхода отмены операции
      Create не называет нигде: ни в Р2, ни в Р10, ни в сценариях. Шаг 3 Р10 «одна транзакция:
      извещение … Operation → done=true» не говорит, что фиксация извещения условна на
      незавершённость операции. Без этого реализация вправе зафиксировать извещение после отмены
      операции — «done с CANCELLED, а извещение есть», то есть фантом против api-operation-done.
      Д18 требует описать опрос «как в NTF-4 Р20», а Р20 называет обе ветки: Get и Cancel на
      внешнем входе — NOT_FOUND. У NTF5-26 внешняя ветка есть только для Get.
    required: >-
      Решить исход Cancel операции Create и записать в Р2/Р10. Вариант (а): отмена до фиксации —
      операция done с отменой, заявка снята, извещения нет, писем нет; фиксация шага 3 — CAS по
      состоянию операции и заявки в одной транзакции, гонка Cancel × фиксация — ровно один исход
      (две горутины, повторы, по образцу NTF5-33). Вариант (б): отмена не поддерживается —
      названный синхронный отказ, заявка продолжает жить. В обоих: сценарий Cancel на внутреннем
      слушателе края с близнецом (тот же вызов после done=true → FAILED_PRECONDITION «operation …
      already completed» либо Get вместо Cancel) и буква NTF5-26 — Cancel на внешнем входе →
      NOT_FOUND без вызова notify, как NTF4-93 (б). Производитель в §8, строки в §9 и DoD.
  - id: B9-2
    kind: TWIN
    anchors: ["NTF5-26 (б)", "§9 строка «NTF5-26 (а), (б) | NTF5-01 на стенде»"]
    text: >-
      Близнецом gRPC-отказа NTF5-26 (б) названо «NTF5-01 на стенде (вызов на внутреннем слушателе
      края)» с отличием «вход края: внешний / внутренний слушатель». Внутреннего gRPC-слушателя у
      края нет: внутренний слушатель края — только REST (main.go:1384-1406 @1d42a6728bf; gRPC-листенер
      снят #1024). Поэтому названный близнец либо невыполним, либо отличается двумя фактами —
      входом и протоколом (REST вместо gRPC). Отказ (б) остаётся неотличимым от «метода нет вовсе».
    required: >-
      Назвать выполнимого близнеца, отличающегося одним фактом. Например: тот же gRPC-вызов
      InternalNoticeService/Create с тем же payload и принципалом прямо на слушателе notify-api
      клиентом с SAN края (обвязка §6, NTF5-01) — меняется только точка входа: внешний gRPC края /
      слушатель notify-api. Либо встречный контроль гейта изоляции на notify-api, если он назван
      производителем (B9-3). Поправить строку §9.
  - id: B9-3
    kind: PRODUCER
    anchors: ["NTF5-26 последнее «And»", "§8 строка NTF5-26, 49", "DoD 10.1 п.4"]
    text: >-
      «Тогда» NTF5-26 утверждает: гейт deploy/scripts/assert-ban6-external-isolation.py печатает
      InternalNoticeService/* в объёме осмотренного и зелёный. Производителем §8 назван скрипт
      «существует». На 1d42a6728bf у скрипта нет записи cluster-internal эндпоинта для носителя
      notify (INTERNAL_ENDPOINTS: iam, geo, nlb, registry, vpc, compute, storage). Домен с
      Internal*-контрактом без эндпоинта носителя CONTROL-COUNTERPART не подтверждает, и прогон
      падает (rc=2). Если домен сузить флагом --domains, notify выпадает из объёма осмотренного — и
      первая половина «Тогда» ложна. Без правки гейта «Тогда» не производится. Ни NTF-5, ни NTF-4
      @5f564162 (NTF4-30 опирается на тот же гейт) правку не называют.
    required: >-
      Назвать производителя: запись носителя notify в INTERNAL_ENDPOINTS (Service и порт слушателя
      notify-api в форме Х5, authority сертификата), вывод носителя домена notify в
      e2e-ban6-domains.py, проверку предпосылки «незарегистрированный метод → отказ маршрутизации»
      на носителе Х5, самопроверку карты в обе стороны. Указать, кто её вносит: эта под-фаза или
      NTF-4 как первая Internal*-поверхность notify (тогда — ссылкой и строкой §1.6). Поправить §8
      и DoD 10.1 п.4.

important:
  - id: I-1
    kind: FORMAT
    text: >-
      Д18 и DoD 10.2 п.5 говорят, что id операции PATCH контактов — с приставкой nop. Ни один
      сценарий группы J этого не утверждает: NTF5-97, 102 проверяют только done=true в ответе.
      Стоит дописать приставку в «Тогда» NTF5-97 — так же, как NTF5-01 утверждает её для Create.
  - id: I-2
    kind: PRODUCER
    text: >-
      После e90b7042f приёмка NTF-1 получила возврат на 4d0428033c6 (коммит 6b5ce0e81, B11-1:
      запись через unsafe мимо гейта формы; описание атрибутов у прямого feed.Put). Ссылку письма
      (Р6) строит сам notify значением form.ParsePath, строки извещений — собственные строки notify.
      Опоры на опровергнутое этим возвратом здесь нет. При следующей редакции NTF-1 строку §1.6
      надо сверить заново.
  - id: I-3
    kind: PRODUCER
    text: >-
      Строка возврата о NTF3-114 против двери по-прежнему открыта. На cbdb3431 строки NTF3-114 не
      менялись. Передать её автору NTF-3 должен диспетчер.

