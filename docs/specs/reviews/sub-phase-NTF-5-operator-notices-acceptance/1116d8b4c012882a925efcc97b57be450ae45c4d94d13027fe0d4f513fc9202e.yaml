blocking:
  - id: B17-1
    kind: CONSTRUCTIBILITY
    where: "§8, строка NTF5-68, колонка «проба» (строка 3425 файла)"
    text: >-
      «Дано» NTF5-68 переписано по B16-1: строк службы доступа обвязка не вставляет, люди заводятся
      регистрацией (шаг 2), ожидаемый перечень `L` берётся обходом `AccountService.List`, `N = |L|`,
      `5 ≤ N ≤ 50`. Строка производителя в §8 осталась от редакции 17: «интеграционная проба kaname
      над посеянными аккаунтами (5, включая посеянный миграцией)» и «буквы (а)–(к) — против самой
      службы доступа». Обе части противоречат «Дано». (1) «Посеянными» — ровно тот вид построения,
      который B16-1 снял. (2) Число 5 на базе kaname @`8a84dcff6` построить нельзя. Регистрация
      заводит пользователю свой аккаунт: `internal/apps/kaname/api/registration/register.go:238`
      (`TenantAccountID: mirror.User.AccountID`) и `:275` (`account_id`, `binding_id` владельца).
      Пять регистраций шага 2 дают ещё пять аккаунтов, то есть `N ≥ 10`. Автор пробы, взявший число
      из §8, напишет утверждение, которое на собранном «Дано» краснеет без дефекта продукта. (3) Буквы
      (л)–(п) тоже идут против самой службы доступа, но в этой колонке их нет: колонка 2 той же
      строки их называет, колонка 4 — нет.
      Перепись §29 искала предикатом `kaname\.(accounts|projects|users)` и прозу о посеве не
      захватила. Поэтому закрывать надо классом «описание держателя NTF5-68 вне «Дано»
      рассказывает о посеве или о числе аккаунтов», а не одной строкой. Предикат переписи:
      `grep -nE 'посеянн|посев|\(5,|5 аккаунт|все 5' <файл>` по §6, §8, §10. На 1116d8b4 он даёт
      9 попаданий. О строках самой службы доступа из них только строка 3425. Прочие относятся к
      другому: заголовок §6 (1659), манифест модели (1666), подмена `notify` (1671, 1678),
      подавление NTF-4 (1681, 3431), обвязка края (3406), стенд NTF-2 (3884).
    fix: >-
      Переписать колонку «проба» строки NTF5-68 §8 в терминах «Дано»: интеграционная проба kaname
      над иерархией, построенной методами создания (шаги 1–7 NTF5-68), с перечнем `L` и `N = |L|`.
      Буквы (а)–(п) — против самой службы доступа, не против подмены. Повторить перепись
      предикатом выше и отнести каждое попадание к строке §30 или к «не о службе доступа».

important:
  - id: I-1
    kind: FORMAT
    text: >-
      Средство §6 «отказ отобранных вызовов» перечисляет отбор `Resolve` «о данном субъекте по
      данной области». NTF5-59 (а), (б) отбирают `Resolve{audience: account_owner{account_id: acc-1}}`,
      а у этой формы субъекта нет. Добавить пример отбора по форме аудитории и её `account_id`, чтобы
      средство явно умело то, на что опираются буквы.
  - id: I-2
    kind: CONSTRUCTIBILITY
    text: >-
      Шаг 6 (ожидание `materializedAt`) — законный барьер видимости для (л), (н). Почему законный,
      документ не говорит. `materializedAt` — это `MAX(updated_at)` по ACTIVE-строкам
      `access_binding_target_members` выдачи (`internal/repo/kaname/pg/access_binding_repo.go:1668-1690`
      @`8a84dcff6`), то есть «хотя бы один объект». Для (н) нужен конкретный объект `project:prj-1`.
      Барьер держится, потому что путь создания материализует всех членов выдачи одним проходом
      `ReconcileBindingForward` в одной транзакции (`reconcile/forward.go`, `flush`). Прямой факт
      складывает триггер журнала тем же коммитом (`internal/clients/relations.go:36-41`: внешний
      движок снят). Стоит записать одной фразой с этими координатами: при дроблении прохода
      барьер перестанет держать (н), и это должно быть видно из документа.
  - id: I-3
    kind: SCOPE
    text: >-
      Формы `account_reader`, `account_owner`, исходы и клетки берутся из NTF-3 редакции 35. Это
      рабочая копия без вердикта (NTF-3 @ рабочего дерева, sha256 17635b5a…). Сверено:
      `AUDIENCE_DENIED` у `account_owner` означает «у аккаунта нет владельца-пользователя», `subject`
      при `account_owner` отвергается (NTF-3 строки 963–988, 1062). При одобрении NTF-3 —
      повторная сверка по этим строкам.

