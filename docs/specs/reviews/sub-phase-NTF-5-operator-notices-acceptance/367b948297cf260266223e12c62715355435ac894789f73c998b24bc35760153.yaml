important:
  - id: I-1
    kind: PRODUCER
    text: >-
      Р2 и DoD 10.1 п.4 требуют сразу двух вещей: «второго соединения к `notify` не заведено» и «ключ
      `notify` есть в карте, которую строит `dialBackends`» (держатель (ii)). На @1d42a6728bf
      `dialBackends` открывает `grpc.NewClient` на каждый ключ `cfg.BackendAddrs()`
      (mtls_config.go:77-85). Если просто добавить `notify` в `BackendAddrs` с адресом
      `notifyInternal`, получится второе соединение к тому же адресу. Оба требования выполнимы только
      тогда, когда ключ `notify` ставится псевдонимом соединения `notifyInternal` внутри
      `dialBackends`. Если псевдоним поставить после этого вызова в `main`, проба (ii) его не увидит.
      Это условие к коду, по Д22 оно идёт в замысел, а не в приёмку. Наблюдаемый исход приёмка уже
      утверждает, поэтому пункт не блокирует.
  - id: I-2
    kind: FORMAT
    text: >-
      «Близнец (г)» NTF5-49 изменяет факт из «Дано» (у `usr-x` привязок на `prj-t` нет): привязка
      `viewer` введена прямо в строке «And», а не посевом в «Дано». Изменение названо явно, поэтому
      сценарий читается однозначно. Чище было бы вынести её отдельной строкой «Дано близнеца», как
      сделано в NTF5-44.

