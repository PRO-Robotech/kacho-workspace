  design_edition: 5
  design_edition_commit: null   # ред. 5 вносится ТЕМ ЖЕ коммитом, что и эта строка
  records_bound_to_it: 1

# --- Соответствие отпечатков и НУМЕРАЦИИ редакций замысла -------------------
#
# ЧТО ЭТОТ БЛОК ЗАКРЫВАЕТ. История редакций в шапке замысла (строка 6) называет
# отпечатки ДВУХ редакций — ред. 2 и ред. 3. Записей в каталоге ПЯТЬ. То есть
# документ не знает двух своих редакций, засвидетельствованных лежащими рядом
# файлами, и читатель истории считает, что их не было.
#
# ПОЧЕМУ ДОПИСАНО ЗДЕСЬ, А НЕ В ШАПКЕ ЗАМЫСЛА. Дописать историю в самом замысле
# нельзя даром: ЛЮБАЯ правка его тела меняет sha256, а значит обесценивает
# действующую пересверку `1e287a16….md` (её вердикт ⛔) и всё, что ниже
# (`change-graph.md` §4) — то есть чеканит новую редакцию. Чеканка редакции — акт
# владельца замысла, а не сопровождения оснастки. Это не довод, а ЗАМЕР: абзац,
# добавленный в шапку на пробу, дал отпечаток
# 1554fc16a58ef4181c67c6aa014e8e4cabd921477ba83e04c12c28b4eeee50c9 и три находки
# `check-06` (запись `1e287a16…` перестала быть действующей и осталась без строки);
# проба откачена, замысел байт в байт прежний. Поэтому соответствие записано
# СОСЕДОМ — той же формой, которой эта ведомость и заведена.
#
# Каждая строка выведена из свидетельства: `evidence` называет координату, где
# отношение НАПИСАНО, а не выведено сопровождением.
