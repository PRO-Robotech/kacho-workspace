# --- Чем перечень держится и где его предел --------------------------------
completeness:
  predicate: >-
    Каждая запись `<X>.md` каталога названа ровно одной строкой `superseded`
    ЛИБО удовлетворяет X == sha256(замысел). Проверяется сравнением переписи
    `ls revalidation/*.md` с полем `record` строк ведомости.
  # Перепись каталога. Держится не вниманием: гейт меряет каждое из трёх чисел
  # сам и сверяет с объявленным здесь. Прозаическая строка с числами отсюда
  # УБРАНА намеренно — машине она невидима, и именно в ней числа отстали первыми.
  census:
    records_total: 6        # файлов вида <sha256>.md в каталоге
    superseded_rows: 5      # строк `superseded` ниже
    bound_to_design: 1      # записей, чей отпечаток равен замеренному отпечатку замысла
  held_by: >-
    scripts/docs-gate/check-06-revalidation-superseded-complete.py — судит ПО ДЕРЕВУ
    (состав каталога выводится обходом индекса, а не читается отсюда), ловит обе
    стороны (файл без строки и строку без файла), считает отпечаток замысла на месте
    и не знает ни одного отпечатка наизусть. Доказан инъекцией в обе стороны:
    scripts/docs-gate/inject-06.sh; конвейер зовёт оба артефакта заданием `docs-gate`.
    Здесь стояла запись «машинного стража на этот предикат в дереве НЕТ» — она снята
    вместе со своим предметом, тем же изменением, которым страж заведён.
