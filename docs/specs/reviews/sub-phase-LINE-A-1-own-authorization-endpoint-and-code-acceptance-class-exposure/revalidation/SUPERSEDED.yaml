# --- Различитель: вычисляется, ведомости не требует ------------------------
#
# Запись `<X>.md` ДЕЙСТВУЮЩАЯ ⟺ X == sha256 замысла на этой ревизии. Предикат
# тотален (отвечает про любую запись) и не зависит от полноты списка ниже:
#
#   sha256sum docs/specs/sub-phase-LINE-A-1-own-authorization-endpoint-and-code-design.md
#
# Замерено на этой ревизии: ff573dd9162365a0ba181d16826f6e3e750367f8c93759c4b7ba7bbcfbe5439c
# (редакция 5 — правка истинности шапки и концовки о круге приёмки; технических
# решений не меняла). Запись с таким именем в каталоге ЕСТЬ — пересверка на
# редакцию 5 сделана тем же изменением, и действующая запись одна. Это измерение,
# а не вердикт: вердикт лежит в самой записи (⛔ одобрять нельзя).
#
# ЧИСЛА ЗДЕСЬ НЕ ПЕРЕПИСЫВАЮТСЯ ВНИМАНИЕМ. Каждое из них меряет
# `scripts/docs-gate/check-06-revalidation-superseded-complete.py` и сверяет с
# объявленным: отпечаток он считает сам по содержимому замысла, состав каталога
# берёт обходом индекса. Объявление, отставшее от дерева, — находка набора, а не
# устаревшая справка. Прежняя редакция этого блока объявляла ноль привязанных
# записей при одной лежащей рядом — ровно тот случай, ради которого гейт заведён.
binding_as_of:
