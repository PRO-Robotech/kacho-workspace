      источника», а сама запись fba913b6… называет своим источником клон
      github.com/ory/fosite тега v0.49.0 как ЗАВИСИМОСТЬ (её строка «Ревизии»).
    owner: 'автор замысла / class-exposure-analyst — номер редакции и её форма их владение'
    note: >-
