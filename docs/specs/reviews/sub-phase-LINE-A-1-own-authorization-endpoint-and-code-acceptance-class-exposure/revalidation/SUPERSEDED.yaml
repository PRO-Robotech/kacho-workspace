# ЧЕГО ЭТОТ БЛОК НЕ РЕШАЕТ — названо прямо, потому что владение чужое.
# РАЗРЕШЕНО ВЛАДЕЛЬЦЕМ ЗАМЫСЛА РЕД. 6 — строка снимается вместе со своим предметом,
# как и обещала её собственная `note`.
resolved_by_design_owner:
  - subject: 'номер и форма редакции fba913b6…'
    resolution: >-
      НОМЕР: редакция 2 (верна нумерация истории замысла, не заголовки записей).
      Редакцию чеканит отпечаток тела (change-graph §2/§4), поэтому нумерация
      обязана быть ИНЪЕКТИВНОЙ: fba913b6… и f8e20fab… — разные тела (834 против 1109
      строк по шапкам самих записей), значит номера разные. Заголовок записи ревью
      номера НЕ чеканит — он повторяет номер, объявленный самим телом, а тело при
      переписывании после ⛔ номер не подняло. ФОРМА: обычная зависимость, а не
      «вендор-порт файлов источника» — свидетельство прямое: п. 6 перечня решений
      записи fba913b6….md и её адъюдикация H7 («у зависимости нет файловой границы:
      ввозится модуль, не файлы»). Поля `form`/`read_design_form`/`superseded_by_form`
      выправлены тем же изменением.
    resolved_in: >-
      шапка замысла, врезка «РАСХОЖДЕНИЕ НУМЕРАЦИИ И ФОРМЫ — РАЗРЕШЕНО» (ред. 6)
    note_on_side_effect: >-
      Из того же свидетельства следует: вендор-порт снят ред. 2, а не ред. 3, как
      говорит строка истории. Строка истории не редактируется (она утверждение о
      прошлом); поправка стоит в той же врезке замысла.

_superseded_unresolved_kept_for_history:
