# Ведомость обесценивания записей пересверки классов — LINE-A-1.
#
# ЗАЧЕМ ОТДЕЛЬНЫМ ФАЙЛОМ, А НЕ РАЗМЕЩЕНИЕМ.
# Координата записи ревью адресуется ИЗ ЧУЖИХ документов: запись приёмки
# b755886f….yaml (строка 102) и запись 5859db4e… (строка 11) ссылаются на
# записи этого каталога путём. Пометка состояния ПЕРЕМЕЩЕНИЕМ меняет путь и тем
# превращает чужое утверждение в указание туда, где предмета нет, — правкой
# файла, которого перемещающий не открывал. Поэтому состояние выражено
# ДОБАВЛЕННЫМ СОСЕДОМ: координаты записей неизменны, состояние читается отсюда.
#
# ЧЕМ ОБОСНОВАНА ФОРМА (канон каталога, три признака):
#   1. `change-graph` §3 — «история ревью добавляется, а не переписывается;
#      прежняя запись не редактируется и не удаляется — новая редакция получает
#      СОСЕДНЮЮ». Сосед — законная форма для нового утверждения о прежних.
#   2. Пространство имён каталога — `<sha256 прочитанного предмета>.<ext>`: имя
#      файла есть отпечаток. Ведомость не читает предмета и отпечатка не несёт,
#      поэтому её имя НАМЕРЕННО вне этого пространства — ASCII-слово, не 64 hex.
#      Это и есть машинный различитель: `^[0-9a-f]{64}\.md$` её не захватывает.
#   3. Машинно читаемое состояние в этом дереве пишется YAML (`docs/changes/policy.yaml`,
#      запись приёмки `<sha256>.yaml`), прозаические записи — `.md`. Ведомость
#      читается машиной → YAML.
#
# ЧЕГО ЭТА ВЕДОМОСТЬ НЕ УТВЕРЖДАЕТ: она не выносит и не отменяет вердиктов. Вердикт
# каждой записи лежит в ней самой и не тронут. Здесь только отношение «какая редакция
# замысла сменила ту, на отпечаток которой запись привязана».

