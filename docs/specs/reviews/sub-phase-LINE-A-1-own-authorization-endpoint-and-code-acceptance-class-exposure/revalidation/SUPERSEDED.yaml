  predicate: >-
    Каждая запись `<X>.md` каталога названа ровно одной строкой `superseded`
    ЛИБО удовлетворяет X == sha256(замысел). Проверяется сравнением переписи
    `ls revalidation/*.md` с полем `record` строк ведомости.
  measured_on_this_revision: 'записей .md — 4; строк ведомости — 4; привязанных к замыслу — 0; неучтённых — 0'
  limit_named_plainly: >-
    Машинного стража на этот предикат в дереве НЕТ. Полнота ведомости сегодня держится
    этой строкой и обзором, а не прогоном: запись, добавленная без своей строки, молча
    прочитается как действующая. Предмет и предикат снятия названы; снимается строка
    вместе с появлением стража.
