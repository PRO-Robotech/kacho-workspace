decision_R9:
  question: не ломает ли форма «credential refused» контракт клиента и объявлено ли решение продукта
  declared_by_product: ДА, и объявлено шире, чем документ ссылается
  evidence:
    - 'PRO-Robotech/kacho#1215 (закрыта 2026-08-24, P1): предикат снятия п.4 — «отказ по недостаточному уровню неотличим от отказа по негодному секрету»'
    - 'разбор в дереве — gateway/internal/middleware/auth_basic_stepup.go, раздел «ПОЧЕМУ ОТКАЗ ПО ПОЛУ НА ЭТОЙ ПОЛОСЕ — НЕ ВЫЗОВ RFC 9470» (середина файла, не шапка — N5)'
    - 'объявление КЛИЕНТУ: PRO-Robotech/kaname:docs/content/first-credential.mdx — «401 означает, что строка не принята, и причин четыре … недостаточный уровень аутентификации … Исход у всех четырёх один и неразличимый» и врезка «Базовый токен даёт уровень 1 — часть глаголов ему недоступна НАВСЕГДА … смотрите порог, а не строку»; то же — docs/content/api/tokens.mdx. Документ этих мест не называет (N4)'
  client_contract:
    verdict: не ломает объявленного контракта
    reasons:
      - 'BAT-1-58/59 (APPROVED 2026-08-24) требуют «отказ по недостаточному уровню» + проход обычного чтения тем же удостоверением — неразличимая форма им не противоречит, различение даёт пара 24.3/24.4'
      - 'следующий шаг клиента восстановлен страницей продукта (интерактивная сессия), а не текстом отказа — осознанный размен против оракула годности'
    named_cost: >-
      Форма отдаёт `error="invalid_token"` на ГОДНОЕ удостоверение; по RFC 6750 это код «истёк,
      отозван, искажён». Клиент, построенный по стандарту, вправе счесть строку мёртвой. Цена
      решением принята и клиенту объявлена, но в Р9 не названа — N4.
  surface_scope: >-
    Р9 описывает формы REST (401, тело JSON, WWW-Authenticate). На нативном gRPC края — тот же
    вердикт, иные формы: предъявитель — UNAUTHENTICATED "insufficient_user_authentication" без
    acr_values, базовое — UNAUTHENTICATED "credential refused"
    (`TestBasicLaneStepUp_FloorRefusalIsIndistinguishableFromCredentialRefusal_GRPC`,
    `TestStepUpAlwaysOn_GRPC_SensitiveRPC_BelowFloor_Refused`). Документ сам называет нативный
    gRPC поверхностью двух классов (§1.6), а Р9 о нём молчит — N1.

