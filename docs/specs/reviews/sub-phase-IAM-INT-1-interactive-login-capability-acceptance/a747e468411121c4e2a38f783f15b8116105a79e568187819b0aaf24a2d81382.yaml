carriers_measured:
  question: носителей личности у края три класса, а не два?
  answer: ДА — три класса человеческих носителей в production-посадке; на нативном gRPC два из трёх
  author_command_verbatim:
    home: PRO-Robotech/kacho @ 41c75cb678 (вершина origin/main на момент круга; своя рабочая копия)
    command: go test ./gateway/internal/middleware/ -run 'TestStepUpLaneParity|TestIdentityLaneCensus' -count=1 -v
    exit_code: 0
    output_matches_declared: true
    output:
      - 'перепись вывода: файлов прочитано 43 · методов AuthInterceptor 37 · достижимо от HTTP 17 · полос 4'
      - 'перепись: полос аутентификации 4 · устанавливают личность в production 3 · доносят уровень уверенности до внутреннего замка 3'
      - 'перепись: полос аутентификации 3 · спрашивают пол 3 (глагол kaname.cloud.iam.v1.UserTokenService/Issue, пол "2")'
  my_own_expression:
    what: >-
      Не перепись автора, а обход ВСЕГО прод-кода края по признаку «записывает личность» —
      вызов `setPrincipalHeaders(`, `.injectPrincipal(` либо запись заголовка
      `principalmeta.HeaderPrincipalID`, — с группировкой по объемлющей функции. Единица —
      функция, а не метод одного типа; предикат на тип получателя не смотрит.
    scanned: 'прод-файлов Go края 106 · мест записи личности 14 · функций 9'
    functions:
      - '(a *AuthInterceptor) tryKratosSession — сессия браузера, REST'
      - '(a *AuthInterceptor) tryHydraJWT — подписанный предъявитель, REST'
      - '(a *AuthInterceptor) tryBasicCredential — базовое удостоверение, REST'
      - '(a *AuthInterceptor) tryDevSecretJWT — симметричный токен разработки, в production отвергается (проба: статус 401, личность пуста)'
      - '(m *DPoPMiddleware) injectVerifiedTokenHeaders — подписанный предъявитель с привязкой к ключу, REST; монтируется ручкой KACHO_API_GATEWAY_AUTHN_ENABLE_DPOP, которую не выставляет ни один профиль (незакомментированных `enableDpop:` в профилях — 0)'
      - '(a *AuthInterceptor) authorize — нативный gRPC: сертификат пира (только service_account), базовое удостоверение, подписанный предъявитель, HS256 (вне dev отвергается `validateJWT`)'
      - '(a *AuthInterceptor) authorizeViaLookup — продолжение полос предъявителя'
      - '(a *AuthInterceptor) injectAnonymous — только dev, принципал system'
      - 'setPrincipalHeaders — сам помощник (законный близнец: не полоса)'
    positive_control: предикат нашёл все четыре полосы переписи автора по имени
    result: >-
      Человеческих классов в production — 3 (сессия · подписанный предъявитель · базовое
      удостоверение); на нативном gRPC — 2 (сессии нет: в теле `authorize` ни одного обращения к
      поставщику сессии, прочитано). Функций REST, записывающих личность, — 5, из них в
      production-посадке личность устанавливают 3. Число классов у автора и у меня совпало,
      полученное РАЗНЫМИ выражениями.
    divergence_named: >-
      Моё выражение видит пятую функцию записи личности на REST (DPoPMiddleware) — вне
      населения переписи автора, потому что та ограничена методами *AuthInterceptor. На число
      классов и на число production-полос не влияет (класс тот же, ни один профиль её не
      монтирует), влияет на заявление §1.6 о радиусе переписи — см. N3.
  second_home:
    checked: >-
      PRO-Robotech/kaname @ 3458fcce: internal/authzguard/acr_floor.go, public_caller_policy.go
      (`grpcsrv.EvaluateStepUp`, отказ `PermissionDenied "permission denied"`),
      internal/presentedcred/reader.go, deploy/values.prod.yaml `presentedCredential.enabled: true`
      — существуют и говорят то, что документ им приписывает. Ствол службы 6074ac57→3458fcce
      названных документом путей не касается: `git diff 6074ac57 3458fcce -- <9 путей>` — 0 строк.
  edition1_base_claim:
    checked: >-
      `git show bb26d905:gateway/internal/middleware/auth.go | grep -c 'func (a \*AuthInterceptor) try'`
      → 3; на 0dafb250a7^1 → 3; на 0dafb250a7 → 4. Редакция 1 была верна для своей базы.
      0dafb250a7 — предок origin/main (проверено).

