blocking_findings:
  - id: B1
    class: '[CONSISTENCY] редакция 2 объявляет третий класс и оставляет открытым вопрос, на который он и есть ответ'
    sign: >-
      Третий класс §1.6 — базовое удостоверение человека — это персональный токен вида SECRET:
      `PRO-Robotech/kaname:proto/kaname/cloud/iam/v1/user_token_service.proto`, поле
      `credential_kind = 7`, вид `CREDENTIAL_KIND_SECRET` «предъявляемый КАК ЕСТЬ — в
      Authorization: Bearer на крае»; выпуск реализован (`internal/apps/kaname/api/user_tokens/usecases.go`),
      перепись полос края показывает у полосы личность `usr…` (человек). Р3 редакции 2 строится
      на этом ответе («у базового удостоверения уровень — константа вида "1"»), сценарий 24.4
      утверждает ему `200` на поле `1`. При этом в том же документе:
      §6 «Вопрос 1. Является ли персональный токен предъявителем края?» — открыт, «Приёмка не
      выбирает» (строка 1523); §5 «Персональный токен как предъявитель края | 236 записей
      закрыто уровнем | … решение владельца» (строка 1508); сценарий 16, второе «И»:
      «персональный токен не является предъявителем края до отдельного решения (§6, вопрос 1)»
      (строка 1011).
    subject: >-
      Решение, которого §6 ждёт, принято продуктом в APPROVED-приёмке
      `sub-phase-BAT-1-basic-access-token-acceptance.md` §2.3 («уровень удостоверения — «1», и
      следствие названо») и посажено (#1142, 0dafb250a7). Один предмет — «является ли
      персональный токен предъявителем края» — документ утверждает двумя противоположными
      способами, и расхождение заведено ЭТОЙ редакцией: до неё третьего класса в тексте не было.
      Одобрить это значит утвердить контракт, в котором 24.4 и 16 спорят о том, существует ли
      носитель, на котором 24.4 стоит.
    why_the_census_missed_it: >-
      Знаменатель A отбирает по СЛОВАРЮ («носител», форма отказа, числа), а не по ПРЕДМЕТУ;
      те же места называют носителя «персональный токен» / `UserTokenService` — законная форма
      записи предмета, которую распознаватель не знает (testing.md §«Гейт на класс», п. 7).
      Предикат, расширенный синонимами (`персональн|UserTokenService|базов|предъявител[ья] края|token validation failed`),
      добавляет сценарии 16 и 18; 18 адъюдицирован чтением как ложное попадание («базовом
      профиле» helm), 16 — настоящее. Вне сценариев — §5 строка 3 и §6 вопрос 1.
    predicate_of_removal: >-
      (а) §6 вопрос 1 закрыт ссылкой на BAT-1 §2.3 для вида SECRET, и названо, что остаётся
      открытым для вида KEYPAIR (обмен), с замером на стволе; (б) строка §5 переписана либо
      снята по своему же условию возврата; (в) второе «И» сценария 16 называет ВИД и его исход
      перемерен на стволе; (г) знаменатель A отбирает по предмету — предикат выше либо
      равносильный — и вывод с адъюдикацией ложных попаданий приложен; обратный контроль на
      редакции 1 сохранён.
    not_verified_by_reviewer: >-
      Исход сценария 16 для вида KEYPAIR на стволе (после появления токен-эндпоинта платформы
      Ф2 обмен идёт у нашего издателя, а не у поставщика) рецензентом НЕ перемерялся — это
      «не выполнилось», а не «верно» и не «ложно»; перемер — часть пункта (в).
  - id: B2
    class: '[HOLDER] держатель клаузы 24.3 объявлен шире своего радиуса'
    sign: >-
      §1.8, строка `IAM-INT-1-24 · 24.3`: держатель
      `TestBasicLaneStepUp_FloorRefusalIsIndistinguishableFromCredentialRefusal_REST` описан как
      держащий «статус, заголовок и тело». Он держит РАВЕНСТВО отказа по полу отказу на
      негодный секрет, а не буквальные тело `{"code":16,"message":"credential refused"}` и
      заголовок `Bearer error="invalid_token", error_description="credential refused"`, которые
      утверждают клауза 24.3 и Р9.
    experiment:
      injection: >-
        текст `ErrCredentialRefused` в gateway/internal/middleware/basic_credential_lane.go
        "credential refused" → "authentication failed" (оба отказа сдвигаются вместе):
        `go test ./gateway/... -count=1` — код 0, пакетов ok 24, FAIL 0
      positive_control: >-
        асимметрия — только отказ по полу в tryBasicCredential → authFailedMsg: красный
        `…_REST` с «различимый заголовок вызова — оракул годности» и «различимое тело — оракул
        годности»
      reverted: оба отката — `git status --porcelain` пуст, держатель снова зелёный
      corpus: >-
        буквальный текст «credential refused» в тестах края стоит только в дублёрах
        (`status.Error(...)` возвращают сами пробы), ни одной проверки ответа; в документах обоих
        деревьев — 0 вхождений
    subject: >-
      §1.8 существует, чтобы у каждой клаузы стояла проба, «которая покраснеет». Для буквальной
      части 24.3 такой пробы нет ни в процессе, ни на стенде, а раздел «Чего перепись НЕ
      покрывает» называет эту дыру только для шлюзовой формы (12, 14, 22, 24.2). Одобрение
      удостоверило бы держатель, которого нет.
    predicate_of_removal: >-
      строка 24.3 и раздел «Чего перепись НЕ покрывает» называют, что буквальные тело и
      заголовок отказа базового удостоверения не держит ни одна проба (либо клауза 24.3 перестаёт
      утверждать литерал и утверждает только отношение); DoD S3 требует держателя литерала.

non_blocking_findings:
  - id: N1
    class: '[SCOPE] Р9 не называет поверхность'
    text: >-
      Р9 сформулирована для всех носителей, а формы у неё — REST. На нативном gRPC края
      подписанный предъявитель получает UNAUTHENTICATED без acr_values. Одна строка: «формы Р9 —
      REST-края; нативный gRPC несёт тот же вердикт кодом UNAUTHENTICATED и сообщениями …» либо
      явное исключение с причиной, как сделано для двери службы.
  - id: N2
    class: '[MEASUREMENT] положительный контроль предиката §1.6 наполовину считает комментарий'
    text: >-
      `HTTP → 2` = один вызов `tryKratosSession` + одна строка комментария «Kratos path suppresses
      the JWT paths». Сними вызов — контроль всё равно покажет 1. С `grep -v '^\s*//'` — HTTP → 1,
      authorize → 0. Класс тот, что документ сам назвал на слове «possession».
  - id: N3
    class: '[CLAIM RADIUS] граница переписи названа не вся'
    text: >-
      «четвёртая полоса роняет пробу своим именем» верно для методов *AuthInterceptor. Функция
      записи личности другого типа уже есть — DPoPMiddleware.injectVerifiedTokenHeaders
      (dpop_http_middleware.go), не смонтирована ни в одном профиле. Назвать вторую границу
      рядом с первой.
  - id: N4
    class: '[REFERENCE] клиентское объявление решения Р9 не процитировано, цена не названа'
    text: >-
      Сослаться на PRO-Robotech/kaname:docs/content/first-credential.mdx (401, «причин четыре»,
      врезка об уровне 1) и docs/content/api/tokens.mdx; назвать, что `invalid_token` на годном
      удостоверении — отступление от семантики RFC 6750, принятое ради закрытия оракула.
  - id: N5
    class: '[COORDINATE] «шапка auth_basic_stepup.go»'
    text: >-
      Разбор оракула лежит разделом в середине файла, шапка пакета отвечает на другие вопросы
      (почему отображение, почему нераспознанное — отказ). Назвать раздел.
  - id: N6
    class: '[NUMBER] посылка задачи называла другое число'
    text: >-
      #2570 назвала 33/290/27 = 350; документ — 27/284/27 = 338. Верны оба на своих ревизиях:
      350 держалось до 220d9470a7 включительно, 338 — с 6ee6c2d581 (#2649, 2026-09-14). Одна
      фраза о различии ревизий, чтобы 338 не читалось как опровержение посылки.
  - id: N7
    class: '[COORDINATION] §10 п.1 предписывает править шапку'
    text: >-
      «статус дока → APPROVED» противоречит change-graph.md §2, которому редакция 2 сама следует.
      Заменить на «запись ревью + событие полномочия».
  - id: N8
    class: '[ONE-FACT] держатель 24.1 в процессе — не пара одного человека'
    text: >-
      В переписи полоса базового удостоверения предъявляет `usr0000000000000bat1`, сессия и
      предъявитель — `usr_alice_acc_a1b2`. Для вердикта по полу не существенно (он от
      идентификатора не зависит), но строка «три полосы» не есть Given сценария «один человек»;
      «наполовину» уже стоит — назвать причину и эту.
  - id: N9
    class: '[DATED] два имени пакета в одном документе'
    text: >-
      Введение S1 называет пакет `kacho.cloud.iam.v1`, контракт посажен в `kaname.cloud.iam.v1`, и
      §1.8/сценарий 23 редакции 2 уже называют путь службы. Раздел объявлен непересмотренным —
      законно; одна строка отметки предупредит неверное прочтение.

