      `git diff -U0 7c9f24c3 9a4b8b0a`; `сесси\w* браузера|подписанн\w* предъявител` по телам
      сценариев → 16 24 25.
  - id: N5
    class: '[COORDINATION] у стадий S1–S4 нет задачи-трекера'
    text: >-
      Шапка: «Эпик/тикет: KAC-IAM-INT-1 — завести до старта S1». Контракт S1 посажен
      (PRO-Robotech/kacho 23145dcd75, 2026-08-03), а задачи, называющей IAM-INT-1, кроме #2570 нет
