blocking_findings:
  - id: B3
    class: '[CONSTRUCTIBILITY] редакция 3 заводит персональный токен вида FEDERATED, которого схема не допускает'
    sign: >-
      §1.6: «Выдача одна — UserTokenService.Issue … а видов выдачи три — SECRET, KEYPAIR и FEDERATED
      (приёмка BAT-1, §2.5)» и строка таблицы видов `FEDERATED` («подписанный предъявитель · пуст ·
      не принято — §6, вопрос 1»); §5: «Персональный токен видов KEYPAIR и FEDERATED как предъявитель
      края … 311 записей из 338 закрыты уровнем»; §6 вопрос 1: «ОТКРЫТ для видов KEYPAIR и
      FEDERATED», исход (а) «у FEDERATED — внешнее утверждение засчитывается за уровень 1»; врезка
      сценария 16: FEDERATED «в сценарий не взят: его не производит ни один посев». Все 10
      вхождений `FEDERATED` заведены редакцией 3 (`grep -c FEDERATED` на редакциях 1 и 2 — 0).
    subject: >-
      У личности вида FEDERATED не бывает by construction, и это держат три места продукта и
      одобренная приёмка: (1) выдача —
      `PRO-Robotech/kaname:internal/apps/kaname/api/user_tokens/usecases.go`,
      `domain.ResolveIssuedKind(in.CredentialKind, false, false)`: FEDERATED отвергается
      INVALID_ARGUMENT «FEDERATED is not available for this credential — it has no trusted_subjects
      field»; (2) хранилище — CHECK `user_oauth_clients_credential_kind_ck` в
      `PRO-Robotech/kaname:internal/migrations/0001_initial.sql` допускает только KEYPAIR, SECRET,
      LEGACY; (3) федеративная полоса эндпоинта выдачи разрешает пару (издатель, субъект) только в
      строку `service_account_oauth_clients` (`PRO-Robotech/kaname:internal/repo/kaname/pg/trusted_issuer_repo.go`,
      `Kind: domain.AssertionClientServiceAccount`) — её принципал служебная учётка, освобождённая
      от пола, и «уровень пуст» для неё предмета не имеет; (4) BAT-1 §4.1: «федеративного вида у
      личности нет by construction». Документ прочёл §2.5 BAT-1 (словарь обоих глаголов выдачи) и
      не прочёл §4.1 (разбиение словаря по таблицам); прочёл производителя ОБМЕНА и не прочёл
      производителя ВЫДАЧИ. Отсутствие вида в посевах — следствие запрета схемы, а не пробел
      оснастки. Одобрить значит поставить владельцу в §6 выбор о предмете, которого нет, и
      приписать в §5 «311 записей закрыто уровнем» виду, чей держатель от пола освобождён.
    experiment: >-
      kaname@37ee8509: `go test ./internal/apps/kaname/api/user_tokens/ -run
      '^TestBAT1_14_ExplicitLegacyKindIsRefusedWithTheFieldName$' -count=1 -v` — PASS. Инъекция:
      личности допущен FEDERATED (`ResolveIssuedKind(in.CredentialKind, in.CredentialKind ==
      domain.CredentialKindFederated, true)`) — FAIL «вид FEDERATED выпущен у личности, где его быть
      не может» (usecase_secret_kind_test.go:220). Откат — `git status --porcelain` пуст.
    predicate_of_removal: >-
      В утверждениях о ПЕРСОНАЛЬНОМ токене `FEDERATED` не встречается либо встречается только как
      «у личности не выдаётся» с координатами (1)–(4): §1.6 называет выдаваемых видов персонального
      токена два — SECRET и KEYPAIR; §5 и §6 вопрос 1 сужены до KEYPAIR; врезка сценария 16
      называет причину — запрет схемы. Если федеративная полоса упоминается, её принципал назван
      служебной учёткой, освобождённой от пола.

non_blocking_findings:
  - id: N1
    class: '[TRACEABILITY] §8 не догнал сценарий 16'
    text: >-
      Строка §8 «10, 14, 15, 16, 17 | newman, волна церемонии». Клаузы 16.2–16.4 держатся не волной
      церемонии, а машинным посевом (`tests/authz-fixtures/prodseed_matrix.py`, слот
      `jwtUserTokenPlatformIssuer`) и набором края (`gateway/tests/newman/cases/authn_edge.py`,
      `F1B-D-PLATFORM-USER-TOKEN-ACCEPTED`). Предикат: строка §8 для 16 называет оба дома.
  - id: N2
    class: '[FORMAT] Given сценария 16 не называет второго предъявителя'
    text: >-
      «Given предъявитель из сценария 14», а 16.2–16.4 вводят другого человека (слот посева матрицы,
      `prodseed-utok-{RID}`) внутри «Тогда/И». Одна строка «And» в Given — ключевая пара человека от
      нашего издателя. Предикат: Given сценария 16 называет её держателя.
  - id: N3
    class: '[CONSISTENCY, вне населения] сценарий 27 против обменных слотов посева'
    text: >-
      Отрицательная пара сценария 27: «посев не записывает ни одного значения предъявителя,
      полученного иначе как церемонией». Слот `jwtUserTokenPlatformIssuer` уже есть в посеве, слот
      16.2 требует DoD S2 — оба человеческие и получены обменом, а не церемонией. Определение гейта
      («литерал или ковка харнессом») их, по чтению, не ловит, первая половина фразы абсолютна.
      Назвать область гейта 27 (слоты церемонии) либо исключение обменных слотов с причиной.
      Предикат: `grep -n jwtUserTokenPlatformIssuer tests/authz-fixtures/prodseed_matrix.py` непуст,
      и документ говорит, покрывает ли их гейт 27.
