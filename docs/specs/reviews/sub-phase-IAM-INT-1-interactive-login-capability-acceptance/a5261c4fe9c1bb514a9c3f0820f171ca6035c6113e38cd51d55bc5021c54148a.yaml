    class: '[NEIGHBOR CONSISTENCY] Р11 и §6 вопрос 5 держат открытым свойство, решённое для той же службы одобренной IAM-ID-1-64'
    sign: >-
      Р11 снимает из сценариев 04 и 05 признак полосы, который утверждала одобренная редакция 1, и
      стоит на трёх доводах, «каждый достаточен сам». Довод 2: признак, «заведённый у одного ресурса,
      … разделил бы ресурсы службы надвое, и этого различия никто бы не решал». §6 вопрос 5: «Несут
      ли отказы службы на полосах прямого чтения и формы машинный признак полосы? … Приёмка не
      выбирает», исход (б) — «служба различает эти полосы кодом и тоном … расхождение с конвенцией
      платформы записывается решением в документации службы». Документ IAM-ID-1 не называет ни разу
      (`grep -n -E 'IAM-ID-1|identity-account-decoupling' <документ>` — пусто).
    subject: >-
      Свойство решено для той же службы: docs/specs/sub-phase-IAM-ID-1-identity-account-decoupling-acceptance.md
      — ✅ APPROVED, круг 12 (2026-08-24); сценарий 64 входит в санкцию («61 действующий сценарий»,
      отозваны 43-48, 63, 66, 67). IAM-ID-1-64: «NOT_FOUND / HTTP 404 с reason-токеном
      RESOURCE_NOT_FOUND … аккаунт есть собственная строка iam, и полоса прямого чтения»; «чтение
      собственного несуществующего членства даёт тот же NOT_FOUND с тем же токеном»; «утверждаются и
      код, и токен … клиент ключуется на токен (api-conventions.md §By-lane code-split)». Отсюда:
      (1) довод 2 ложен — различие решено, и в пользу признака; служба к тому же несла признак
      прямого чтения и формы у ресурса предела вплоть до его выпила (kacho@a9e635c7cd:
      `ReasonResourceNotFound` и `ReasonInvalidResourceID` в
      services/iam/internal/apps/kacho/api/limit/usecases.go и limit_repo.go; в kaname последний
      производитель снят 61053691, 2026-09-13); (2) исход (б) вопроса 5 молча отменил бы клаузу
      IAM-ID-1-64 — ровно тот класс, который сама редакция 4 назвала второй ошибкой из списка
      оппонентов для F2-39 и закрыла словами «пересмотр F2 — предмет F2»; здесь он на третьем
      одобренном соседе (после BAT-1 в круге по редакции 2 и F2 в доводке); (3) довод 1 («у Get
      полосу называет код») расходится с таблицей api-conventions §By-lane, где полосы sync-format и
      direct-read названы с токенами INVALID_RESOURCE_ID и RESOURCE_NOT_FOUND, и со строкой
      «Regression: assert reason-token И code (не только code)»; у Get к тому же два производителя
      INVALID_ARGUMENT — обязательность (`interactive_client_id: required`) и форма; (4) довод 3
      решает ЗНАЧЕНИЕ домена (WIRE-3-01: `iam.kaname.cloud` у полос с объявленным признаком), а не
