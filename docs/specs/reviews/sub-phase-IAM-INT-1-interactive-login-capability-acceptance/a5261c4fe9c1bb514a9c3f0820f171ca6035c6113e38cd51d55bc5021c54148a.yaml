      `iamerr.Wrapf(iamerr.ErrNotFound, "InteractiveClient ic-00000000000000000 not found")`, и
      проба держит отображатель (`shared.MapRepoErr` → `StripSentinel`) на тексте, который выдала
      её же фикстура, — производителя текста она не читает. Интеграционная читает настоящее
      хранилище, но утверждает вхождение (`require.Contains`), а не равенство. Сообщение на проводе —
      остаток обёртки хранилища целиком, поэтому композиция двух проб держит «сообщение содержит», а
      не «сообщение равно». По правилу самого документа строка, чей текст держит лишь непрогнанный
      кейс стенда либо проба на подделке, — «наполовину» (16.3; «Чего перепись НЕ покрывает» о 24–25).
      Класс — B2 круга по редакции 2: объявлен держатель шире своего радиуса, и инъекция это
      опровергает. Кейс стенда `IAM-IC-GT-NEG-ABSENT` утверждает текст равенством (`.to.eql`), то
      есть держатель есть — на стенде, который не поднимался.
    experiment: >-
      kaname@5303cebd, своя копия. База — обе модульные пробы и
      `TestInteractiveClient_05_Get_NotFound` — PASS. Инъекция одного факта:
      internal/repo/kaname/pg/interactive_client_repo.go:46, формат `"InteractiveClient %s not found"`
      → `"interactive client lookup: InteractiveClient %s not found (stale)"`. `go test
      ./internal/apps/kaname/api/interactive_client/ -count=1` — ok; `go test ./internal/repo/kaname/pg/
      -run '^TestInteractiveClient_' -count=1 -v` — все шесть PASS, включая …_05_Get_NotFound.
      Сообщение, уходящее при этом на провод (временная проба в пакете use-case с той же ошибкой
      хранилища): `code=NotFound message="interactive client lookup: InteractiveClient
      ic-00000000000000000 not found (stale)"` — 04.1 нарушена, держатели в процессе зелёные. Откат
      и снятие временной пробы — `git status --porcelain` пуст.
    predicate_of_removal: >-
      Строка 04.1 не объявляет «держится», пока ни одна проба в процессе не сравнивает РАВЕНСТВОМ
      сообщение, построенное из ошибки настоящего хранилища: состояние «наполовину», и названо, что
      модульная проба держит отображатель на тексте своей подделки, интеграционная — вхождение, а
      дословно текст держит только кейс стенда `IAM-IC-GT-NEG-ABSENT`, не прогонявшийся; либо назван
      держатель, которого роняет та же инъекция (приставка к формату текста хранилища).

non_blocking_findings:
  - id: N1
    class: '[ACCURACY] перечень полос с признаком в Р11 уже переписи'
    text: >-
      Р11: «Признак служба ставит отказам квот, ссылок, членства и ролей модулей и отказу в правах —
      производителей … шесть». Видов названо пять; шестой производитель —
      pkg/subjectchange/positionlost.go (потеря позиции журнала смены субъекта), он и входит в
      «берут у объявления 4». Предикат: перечень называет шестого либо сказано «в том числе».
  - id: N2
    class: '[TRACEABILITY] у вопроса 5 нет задачи'
    text: >-
      «Задачи на него нет» — верно (kacho#1756 обходит только дерево платформы). Какой бы исход ни
      выбрала правка B4, у отсутствующего производителя признака в службе (IAM-ID-1-64 его тоже не
      получает) задача нужна по ban #11. Рецензент задач не заводит — за оркестратором. Предикат:
      вопрос 5 либо строка §1.8 называет номер задачи.
  - id: N3
    class: '[PAIRING] отрицание 04.1 без названного близнеца'
    text: >-
      «NOT_FOUND на отсутствующий» без положительной пары неотличимо от «NOT_FOUND на всё». Близнец
      есть — Get живого клиента в сценарии 01 (отличается одним фактом: строка существует), и кейс
      стенда его несёт, — но сценарий 04 его не называет, в отличие от 05.2. Предикат: 04 называет
      близнеца.
  - id: N4
    class: '[EDITION INVENTORY] два перечня «правлено/не тронуто» надо сложить, чтобы прочесть'
    text: >-
      Перечень первого прохода говорит «Не тронуто: … §7.1, §7.2», второй проход их правит и
      называет это своим перечнем. Каждое верно для своего прохода, но читатель, остановившийся на
      первом, получит неверное. Предикат: у первого перечня пометка «кроме правленного вторым
      проходом» либо один сводный перечень.

