blocking_findings: []

non_blocking_findings:
  - id: N1
    class: '[ACCURACY] IAM-ID-2-13 привлечена к границе, которой она не управляет'
    text: >-
      Врезка о коллизии, §4 п. 10 и абзац отвергнутых исходов Р11 называют основанием запрета
      различимости ДВА источника: `security.md` §«Hardening-инварианты» п. 6 и одобренную
      IAM-ID-2-13. Первое точно и достаточно — оно ровно про «hide-existence 404 обязан быть
      byte-identical настоящему backend-miss». Второе шире своего предмета: у IAM-ID-2-13 ОБА
      сравниваемых ответа производит СЛУЖБА (чужое членство в аккаунте B и несуществующее, оба
      читаются путём аккаунта A), и край их не скрывает —
      `kaname.cloud.iam.v1.MembershipService/Get` несёт `required_relation = viewer`, а не `v_get`,
      и флага `hide_existence` не имеет, то есть обе ветви `HidesExistenceOnDeny` для него ложны.
      Признак приедет на ОБА ответа одинаково, и различаться они будут по-прежнему только
      подставленным идентификатором — то есть IAM-ID-2-13 остаётся выполненной, а не нарушенной.
      Не блокирует: решение (исход «а»), инвариант §4 п. 10 и отказ от записи расхождения в
      документации службы стоят на первом основании каждый сам по себе (у последнего первая
      половина — «предмет расхождения принадлежит КРАЮ, а решение записывалось бы в документации
      СЛУЖБЫ» — самодостаточна). Предикат: запись каталога для MembershipService/Get; правка —
      либо снять второй источник в трёх местах, либо назвать его тем, чем он является: соседка
      запрещает различимость ДВУХ ОТВЕТОВ СЛУЖБЫ, и признак этого не нарушает.
  - id: N2
    class: '[TRACEABILITY] у долга признака по-прежнему нет задачи — и теперь у него две половины'
    text: >-
      Перенесено из круга по редакции 4 и не закрыто; документ это признаёт прямо («Задачи на
      производителя нет», Р11 и строки 04.2, 05.3 §1.8). Редакция 6 добавила вторую половину —
      паритет `details` у скрытого `404` края и расширение держателя байт-идентичности, — то есть
      долг вырос и перешагнул границу репозитория: вторая половина лежит в
      `gateway/internal/middleware` платформы. Ban #11 формально удовлетворён тем, что предмет
      назван внутри этой приёмки (DoD S1 п. 3, §4 п. 10) с предикатом снятия, а не отложен «на
      потом»; но кросс-репозиторная половина без номера в трекере не будет видна никому, кто читает
      не этот документ. Рецензент задач не заводит — за оркестратором. Предикат: строки 04.2 и 05.3
      §1.8 либо §6 вопрос 5 называют номер задачи, чей предикат обходит дерево службы, и номер
      задачи платформы на паритет деталей.
  - id: N3
    class: '[FRESHNESS] оба блока переписи §1.8 помечены «прогнано на редакции 5»'
    text: >-
      Пометка стоит в комментарии обоих блоков кода (`# дом: воркспейс, корень дерева; прогнано на
      редакции 5`), а подаётся редакция 6. Рецензент прогнал оба предиката на редакции 6 — вывод
      совпал с объявленным дословно, то есть пометка КОНСЕРВАТИВНА, а не ложна. Не блокирует;
      предикат: пометка называет редакцию, на которой блок прогнан последний раз, либо снята в
      пользу «переписи воспроизводимы на любой редакции — они читают сам документ».
  - id: N4
    class: '[ACCURACY] Р11 цитирует дерево службы на `0444cb54`, а подана редакция на `83ddd08a`'
    text: >-
      Абзацы Р11 «Что в дереве службы» и «Где производитель» помечены ревизией `0444cb54`, тогда
      как врезка редакции 6 объявляет ревизией сверки `83ddd08a` и объясняет, почему числа не
      перемерялись (диффа кода между ними нет — четыре файла, все под `docs/`). Рецензент
      перемерил ключевые из них на `83ddd08a` сам: 299/67/311, 6 производителей признака, перепись
      гейта домена отказа — все совпали. Не блокирует; предикат: помеченная ревизия совпадает с
      объявленной ревизией сверки, либо рядом сказано, что число перенесено и почему оно обязано
      совпасть.

