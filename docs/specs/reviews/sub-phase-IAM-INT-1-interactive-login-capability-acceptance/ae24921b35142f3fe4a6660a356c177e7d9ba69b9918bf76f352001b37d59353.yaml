producers_walk:
  method: >-
    Перепись документа воспроизведена рецензентом НА РЕДАКЦИИ 6, а не принята из отчёта: оба
    предиката §1.8 (знаменатель A — население; знаменатель B — клаузы и строки таблицы) прогнаны
    дословно и дали в точности объявленный вывод — «сценариев 34 · по предмету 7 : 12 14 16 22 23
    24 25 · в населении 9 : 04 05 12 14 16 22 23 24 25» и «клауз 22 · строк таблицы 25 (из них
    клауз 22) · метка не единожды [] · клауза без строки [] · строка без клаузы [] · сценарий
    населения без строки [] · строка вне населения []». Блоки помечены «прогнано на редакции 5» —
    вывод на редакции 6 тот же (неблокирующее N3).
  then_without_producer: >-
    Клауз без производителя ДВЕ — 04.2 и 05.3, — и обе названы состоянием «не начат» в §1.8, а не
    растворены. Это ЗАКОННЫЙ исход, а не пробел: контракт обеих полос решён одобренными соседками
    той же службы, поэтому «переписать под производимое» отменяло бы одобренное (ошибка редакции
    4). Остальные двадцать клауз производителя имеют.
  given_homes: >-
    Ось «Дано» пройдена по девяти сценариям населения. У 04 и 05 дом назван и условие
    конструируемо («строки нет» производится отсутствием записи — на стенде by construction, в
    процессе подставным хранилищем; близнец — клиент сценария 01 штатным Create). У 24 и 25 столбец
    «производит сегодня» честно говорит «нет» — входной гейт S3 не пройден, и это условие (б)
    исходного APPROVED, а не новая находка.
  holders_can_fail: >-
    Способность падать проверена ОПЫТОМ, а не чтением, по трём держателям: 04.1 — инъекция в
    формат текста хранилища (обе пробы остаются зелёными ⇒ «наполовину», см. B5); 05.1 — прочитан
    исходник: сравнение сообщения РАВЕНСТВОМ с текстом, который строит настоящий производитель
    (`corevalidate.ResourceID` с именем ресурса от службы); 05.2 — подставное хранилище отмечает
    обращение, и положительный близнец требует, чтобы годная форма до хранилища ДОШЛА (иначе
    отрицание зеленело бы на «отвергаем всё»). Гейт домена отказа службы прогнан:
    `go test ./internal/refusaldomain/ -run '^TestRefusalDomainComesFromTheDeclaration$'` — PASS,
    перепись дословно как в Р11: «не-тестовых файлов Go разобрано 845, производителей
    `errdetails.ErrorInfo` найдено 6 (берут у объявления 5), ведомость прощений: 1 записей, из них
    сработало 1, находок 0».
  numbers_remeasured_by_the_reviewer:
    - '299 / 67 / 311 — вызовы общего отображателя в не-тестовом дереве службы, файлы, и с пробами: совпало'
    - '6 и 8 — производители `errdetails.ErrorInfo` против производителей `WithDetails`; два лишних
       файла — ровно `internal/apps/kaname/shared/errdetails.go` и `internal/authzguard/acr_floor.go`,
       как называет Р11'
    - 'две ветви `validateID` — опыт повторён временной пробой в пакете use-case (снята, откат чист):
       `id = ""` → InvalidArgument, `interactive_client_id: required`, деталей 1
       (`field_violations:{field:"interactive_client_id"}`); `id = "не-идентификатор"` →
       InvalidArgument, `invalid interactive client id ''не-идентификатор''`, деталей 0. Таблица Р11
       воспроизведена дословно'
    - '24 / 6 и 27 / 7 — перепись встроенной копии каталога края разбором того же файла по обеим
       ветвям `HidesExistenceOnDeny`: всего записей 338, по эвристике 24 (служба 6), с явным флагом
       27 (служба 7); шесть `Get` службы — ровно
       `{AccessBinding,Account,Group,Project,ServiceAccount,User}Service/Get`; три записи флага —
       registry Update/Delete и InternalSessionRevocationsService/ListByUser. Совпало по всем шести
       числам и по составу'
    - '221 = 186 + 35 — знаменатель переписи соседок (в воркспейсе 187 файлов, минус сам документ);
       39 строк с бэктик-формой; 34 из них прежний широкий предикат не видит. Совпало'
