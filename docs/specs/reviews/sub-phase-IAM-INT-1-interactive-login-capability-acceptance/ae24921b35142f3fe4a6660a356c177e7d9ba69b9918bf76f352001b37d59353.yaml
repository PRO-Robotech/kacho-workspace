      ТРИ ошибки редакции 5 первыми; все три названы найденными оппонентами, а не автором
    - '`git diff --shortstat f007441f 2a37a7fd -- <документ>` — 656 вставок, 83 удаления
      (три коммита: 8a7435f9 · bcb73bf8 · 2a37a7fd)'
