       Совпало'
    - '91 — совпадений починенного предиката по двадцати приёмкам домена службы. Совпало'
    - 'разложение 39 без остатка — 20 домена службы · 15 других служб · 4 черновика: перечни сверены
       поимённо с выводом предиката, сошлись полностью; IAM-FMB опознан как
       `sub-phase-iam-accessbinding-forward-materialization-acceptance.md` (заголовок «Sub-phase
       IAM-FMB»). Четыре черновика — DRAFT все четыре, сверено шапками'
    - 'слепота предиката редакции 5 воспроизведена на живом примере: прежний широкий предикат видит
       у IAM-ID-2 РОВНО ОДНУ строку — 831, перечень нормативных ссылок, — а починенный четыре, среди
       них 2603 и 2935. То есть «адъюдикация по совпавшей строке» и не могла увидеть решающую клаузу'
  neighbour_consistency:
    verdict: СОШЛОСЬ
    checked: >-
      IAM-ID-1-64 и IAM-ID-2-04 прочитаны в своих документах; обе приёмки одобрены, обе клаузы в
      санкции. Ни один исход редакции 6 их не отменяет: §6 вопрос 5 закрыт, исход (б) снят, Р11
      прямо называет пересмотр предметом соседок. WIRE-1 — ✅ APPROVED, решение W3 и сценарий
      WIRE-3-01 («в деталях отказа `domain` равен `iam.kaname.cloud`») прочитаны: делегирование
      значения домена точное, второго места об одном значении не заведено. Ложное предложение
      редакции 5 («полосу формы держит конвенция») в дереве НЕ ЖИВО ни в одном месте: все восемь
      его вхождений — цитаты с пометкой об отзыве (предикат
      `grep -n 'не пиннит\|держит конвенц\|полосы формы — конвенц'`).
  collision_claim_verified_independently: >-
    Коллизия со скрытием существования — не риторика, проверена рецензентом с обеих сторон.
    (1) скрытый `404` края действительно БЕЗ деталей: `buildGRPCNotFoundStatus` есть
    `status.New(codes.NotFound, notFoundMessage(desc))` и ничего больше, и его godoc это объявляет.
    (2) признак действительно приехал бы на настоящий промах ТЕХ ЖЕ шести `Get`: все шесть
    use-case службы зовут общий отображатель (account 31 · user 43 · group 23 · project 16 ·
    service_account 17 · access_binding 83 вызова), а его ветвь `ErrNotFound` — единственная точка.
    (3) держателя у второй половины нет: единственная проба края о деталях скрытого отказа —
    `TestAuthz_GRPC_ReadDeny_NoDenyReasonsLeak` — требует лишь, чтобы деталь не повторяла причину
    отказа; перепись всех проб края, читающих `Details()`, даёт три файла, и ни одна из трёх не
    сверяет детали скрытого `404` с деталями настоящего промаха. (4) коллизии СЕГОДНЯ НЕТ, и это
    важно для точности заявления: из 24 скрывающих `Get` признак производят только те службы,
    что его завели, — geo и vpc, — но их производители зовутся ровно из geo Region/Zone (публичное
    чтение, скрытия нет) и vpc AddressPool (Internal-ресурс, в перечне 24 его нет). То есть признак
    заводит оракул ВПЕРВЫЕ, как документ и утверждает. (5) условие приземления конструируемо:
    `ErrorInfo` несёт только `reason`, `domain` и метаданные `{resource_type, resource_id}` —
    всё это краю известно (он уже подставляет id в текст).

