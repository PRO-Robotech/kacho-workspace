prior_blocking_check:
  - id: B4
    status: CLOSED
    repeated_experiment: >-
      Тот самый опыт, которым B4 найдено, повторён на редакции 6. (a) Исходный предикат
      `grep -n -E 'IAM-ID-1|identity-account-decoupling' <документ>` давал ПУСТО на редакции 4 —
      на редакции 6 даёт 36 попаданий; зеркальный `IAM-ID-2|membership-read` — 41. (b) Прочитаны
      соседки: IAM-ID-1-64 (строки 3377–3389) требует «`NOT_FOUND` / HTTP 404 с `reason`-токеном
      `RESOURCE_NOT_FOUND`» и «утверждаются и код, и токен»; IAM-ID-1-63 отозван и НЕСЁТ прямой
      указатель «предмет сценария (синхронный отказ формы) сохранён и перенацелен … — IAM-ID-2-04».
      (c) Поиск производителей признака в дереве службы на 83ddd08a — две строки в одном файле,
      обе комментарий набора `tests/newman/cases/iam-interactive-client.py`; импортов
      `corelib/errors` в не-тестовом дереве 0, с пробами 5; контроль разборщика в обратную
      сторону — тот же поиск по не-тестовому `services/` платформы на 45d1719fe8 находит geo и
      vpc. Производителя нет — ровно как документ и говорит.
    different_result: >-
      Редакция 4 снимала признак «под производимое» и ставила владельцу выбор, одна сторона
      которого молча отменяла одобренную клаузу. Редакция 6 этого не делает НИ ОДНИМ исходом:
      Р11 называет ОБЕИХ соседок (IAM-ID-1-64 — полоса отсутствия, IAM-ID-2-04 — полоса формы),
      §6 вопрос 5 ЗАКРЫТ, исход (б) снят явно, пересмотр назван предметом IAM-ID-1 и IAM-ID-2.
      Довод 2 редакции 4 («различия никто бы не решал») заменён на верный и проверяемый («признак
      у одного ресурса расколол бы собственные строки службы надвое»). Довод 1 («у Get полосу
      называет код») снят с опровержением: у Get производителей INVALID_ARGUMENT два, и это
      ПОКАЗАНО опытом, а не сказано. Клаузы 04.2 и 05.3 стоят в §1.8 со состоянием «не начат», с
      названным отсутствием производителя и задачи. Предикат снятия B4 выполнен по всем пяти его
      пунктам.
    reviewer_verified_beyond_the_predicate: >-
      Сверх предиката рецензент проверил САМИ основания, а не только их цитирование.
      IAM-ID-2 — ✅ APPROVED, круг 7, 2026-08-27 (шапка прочитана); отозванных сценариев в ТЕЛАХ
      нет: `awk '/^#### IAM-ID-2-/{h=$0} /САНКЦИЯ ОТОЗВАНА/ && h!=""{n++} END{print n+0}'` → 0, и
      контроль в обратную сторону тем же предикатом по IAM-ID-1 → 13. Голая форма
      `grep -c 'САНКЦИЯ ОТОЗВАНА'` по файлу IAM-ID-2 даёт 1, и единственное попадание — строка
      1863, где документ цитирует СВОЙ ЖЕ предикат отзыва: автор эту свою ошибку назвал сам, и
      рецензент её воспроизвёл. Клаузы IAM-ID-2-04 (строка 2603) и IAM-ID-2-13 (строка 2935)
      прочитаны целиком и говорят то, что документ цитирует, дословно.
  - id: B5
    status: CLOSED
    repeated_experiment: >-
      Та же инъекция, на вершине ствола службы kaname@83ddd08a, в своей копии.
      База: `go test ./internal/apps/kaname/api/interactive_client/ -count=1` — ok.
      Инъекция одного факта: internal/repo/kaname/pg/interactive_client_repo.go, формат
      `"InteractiveClient %s not found"` → `"interactive client lookup: InteractiveClient %s not
      found (stale)"`. Под инъекцией модульный пакет — ok; `go test ./internal/repo/kaname/pg/
      -run '^TestInteractiveClient_' -count=1 -v` — ВСЕ ШЕСТЬ PASS, включая …_05_Get_NotFound
      (Postgres в контейнере, docker доступен). Откат — `git status --porcelain` пуст.
      То есть факт, которым B5 найдено, ЖИВ: держатели в процессе текст настоящего хранилища
      дословно не держат.
    different_result: >-
      Изменился не продукт, а УТВЕРЖДЕНИЕ документа, и именно это требовал предикат снятия.
      Строка 04.1 §1.8 больше не объявляет «держится» — состояние «наполовину», и названо
      построчно, что именно держит каждый держатель: модульная проба сравнивает текст, который
      подала ЕЁ ЖЕ подделка хранилища (прочитано: `fakeRepo{getErr: iamerr.Wrapf(ErrNotFound,
      "InteractiveClient ic-00000000000000000 not found")}`), то есть держит отображатель;
      интеграционная читает настоящее хранилище, но `require.Contains`, а не равенство
      (прочитано в interactive_client_integration_test.go:195); дословно текст держит только
      кейс стенда `IAM-IC-GT-NEG-ABSENT`, и он утверждает РАВЕНСТВОМ (`.to.eql('InteractiveClient
      ic-00000000000000000 not found')`) с положительной парой — прочитан в
      tests/newman/cases/iam-interactive-client.py, не прогонялся. Держатель равенства в процессе
      вынесен предметом — DoD S1 п. 4. Те же слова стоят в §7.2, §8 и «Чего перепись НЕ
      покрывает»: второго места об одном предмете не заведено.
