blocking: []

non_blocking:
  - >-
    Р4, фраза «срок, через который клиент выхода узнаёт исход, — сумма двух бюджетов» верна лишь для
    неоспоренного чтения: ожидание на fetchMu (JWKSCache.refresh, single-flight) срок запроса не
    соблюдает, и при неответившем источнике запрос может ждать чужое чтение и затем делать своё.
    Свойство общее с путём запроса и предметом KA1 не является; формулировку стоит сузить до «одно
    чтение набора — не дольше его бюджета», утверждения «Тогда» это не меняет.
  - >-
    Ветка 503 и смена срока на голове полосы kacho#2996 написаны до одобрения редакции 9 — факт для
    диспетчера по ban #1, не дефект документа.
  - >-
    Строка KA1-34 таблицы производителей (вне дельты, одобрена в круге 6) цитирует домен стенда в
    значении registry-token.issuer; документ публичен — заменить на «адрес издателя реестра стенда».

