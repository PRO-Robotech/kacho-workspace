blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    where: KA1-14, близнец «уровень 2» причины (к) KA1-10 и KA1-11
    claim: >-
      Базового удостоверения уровня 2 не существует: уровень полосы — константа «1»,
      проставляемая каждому удостоверению; посев П3 тоже заводит только уровень 1. Близнец
      не строится, и отказ (к) неотличим от «полосы нет».
    evidence:
      code: "gateway/internal/middleware/basic_credential_lane.go:41 (const BasicCredentialLevel = \"1\"), :236 (AuthenticationLevel: BasicCredentialLevel)"
    fix: >-
      Близнец (к) — тот же bas-00000000000000ka1 на глаголе без пола (или с полом 1) → 200 / OK;
      отличие — один факт, пол глагола. Для нативной строки (к) назвать в П5 пол на методе ProbeService/Ping.
  - id: B2
    kind: CONSTRUCTIBILITY
    where: KA1-32, раздел «Посев» («пробы старта … засеивают только окружение процесса»)
    claim: >-
      «Тогда» требует 200 на GET /iam/v1/accounts и ответ KA1-01 при молчащем авторитете, то есть
      набор ключей по «адресу набора харнесса», авторитет отзыва нашей чеканки для
      issuer.example.test (П1 — для kaname.kacho.local) и путь до обработчика. Посев объявлен
      «только окружение», а на уровне процесса 200 на этом маршруте требует ещё каталог прав и
      владельца выдачи. Уровень «старт процесса и харнесс» не говорит, как харнесс получает
      разобранную процессом конфигурацию.
    fix: >-
      Разделить: (1) старт процесса с тремя объявлениями — стартует; (2) харнесс слоя
      аутентификации, собранный из конфигурации, разобранной тем же загрузчиком, с записью
      П7-подобного набора и авторитетом нашей чеканки для issuer.example.test (новая строка посева).
  - id: B3
    kind: COVERAGE
    where: Р4, строка KACHO_API_GATEWAY_IDENTITY_CALL_BUDGET — «а также отзыв сессий при выходе»
    claim: >-
      Решение без сценария и без исхода: ни один сценарий не утверждает бюджет на Revoke выхода,
      а «исход превышения» Р4 называет только путь аутентификации (503) и мост (504). Выход
      сегодня best-effort — 200 с warnings при сбое отзыва, свой срок 5s. Реализация вправе
      не тронуть этот вызов, и ничего не покраснеет.
    evidence:
      code: gateway/internal/handler/logout_handler.go — context.WithTimeout(…, 5*time.Second) вокруг Verify и Revoke; «Failures … do not surface as HTTP 5xx»
    fix: >-
      Назвать исход (200 c warnings в пределах бюджета, отказ не меняется) и добавить сценарий
      с близнецом: Revoke дублёра молчит → ответ выхода раньше бюджета+допуск; Revoke отвечает → 200 без warnings.

