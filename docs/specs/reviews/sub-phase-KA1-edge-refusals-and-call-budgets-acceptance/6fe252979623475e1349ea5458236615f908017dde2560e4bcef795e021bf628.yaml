blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    where: KA1-34 «Когда» (издатель службы — «её отрисованная конфигурация, ключ `issuer`»); строка KA1-34 таблицы производителей («`issuer` службы — дословно в 7 из 7»); исход на базе KA1-34 «зелены до и после»
    claim: >-
      Ключ `issuer` в отрисованной конфигурации службы доступа не единственен: в стенде fe3455
      ConfigMap kaname-config (config.yaml) несёт ДВА ключа `issuer` — registry-token.issuer =
      https://registry.in-cloud.io/iam/token и token-signing.issuer = https://kaname.kacho.local.
      Утверждение «issuer службы дословно в 7 из 7» верно только для token-signing.issuer.
      Проба, написанная по тексту «ключ issuer», на базе либо красна на fe3455 (взят первый
      ключ — издатель токенов реестра), либо проходит выбором «любой совпавший» — то есть
      заявленный исход «охрана, зелена до и после» зависит от выбора реализатора, а не от
      документа.
    evidence:
      seed: >-
        helm template цепочкой fe3455 @ e801c0f7844: yq kaname-config → config.yaml, строки 44
        (registry-token.issuer) и 111 (token-signing.issuer); шаблон
        deploy/helm/umbrella/charts/kaname/templates/configmap.yaml:105 (registry-token, условный)
        и :198 (token-signing).
    fix: >-
      Назвать координату однозначно: ConfigMap kaname-config → data.config.yaml →
      token-signing.issuer (тот, которым служба штампует iss токенов нашей чеканки); отсутствие
      этого пути в отрисовке стенда с Deployment kaname — красный пробы с именем стенда, а не
      «не сравнён». Строку таблицы производителей KA1-34 перемерить этим путём.

