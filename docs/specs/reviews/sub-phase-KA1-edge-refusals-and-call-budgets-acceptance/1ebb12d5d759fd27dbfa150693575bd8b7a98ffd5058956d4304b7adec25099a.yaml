blocking:
  - id: B1
    kind: COVERAGE
    where: >-
      Р7 (перечень условий «выход не выполнен»; фраза «Отказы пути (401 по Р2 — KA1-13 (а)) этим
      решением не меняются»); Р4 (таблица ручек: IDENTITY_CALL_BUDGET ограничивает вызовы к
      внутреннему слушателю службы доступа); «Что НЕ входит», последний пункт («чтение наборов
      ключей — у них свои объявленные бюджеты»); шапка и таблица производителей («производители —
      голова полосы kacho#2996 d7710e33530»).
    claim: >-
      Полоса, которую документ называет производителем Р7, уже меняет наблюдаемое на этом пути
      сверх Р7: на голове origin/2996 (03b3dec9fe6) выход при источнике проверочных ключей, не
      ответившем проверяющему, отвечает 503 «выход не выполнен», а не 401; и проверку предъявителя
      на выходе ограничивает ручка KACHO_API_GATEWAY_IDENTITY_CALL_BUDGET вместо константы 5s.
      Документ называет только «отзыв не ответил либо ответил ошибкой» и прямо утверждает, что
      401 пути не меняется, а чтение наборов ключей оставляет своим объявленным бюджетам
      (KACHO_JWKS_FETCH_TIMEOUT_SECONDS, умолчание 5). Итог: исход «источник ключей молчит» на
      выходе пути токенов не назван ни одним сценарием, а реализация его уже производит —
      изменение наблюдаемого без одобренной приёмки (ban #1). Это тот же класс, ради которого
      Р7 заведено: ответ, после которого клиент не знает, что живое удостоверение надо гасить
      повторно; документ обязан решить его явно, а не оставить полосе.
    evidence:
      seed: >-
        git diff d7710e33530 03b3dec9fe6 -- gateway/internal/handler/logout_handler.go: ветка
        middleware.KeySourceUnanswerable(verr) → writeBody(503, logoutNotPerformedBody);
        context.WithTimeout(r.Context(), h.callBudget) вокруг Verify вместо 5*time.Second; новый
        файл gateway/internal/handler/logout_key_source_test.go (126 строк). На d7710e33530 —
        `ctx, cancel := context.WithTimeout(r.Context(), 5*time.Second)` (logout_handler.go:186)
        и 401 на любой ошибке Verify. Объявленный бюджет чтения набора — gateway/internal/config/config.go:534
        (KACHO_JWKS_FETCH_TIMEOUT_SECONDS default 5), jwt_verifier.go:274–282.
    fix: >-
      Решить в Р7 (и Р4) явно, одним из двух: (а) источник проверочных ключей не ответил
      проверяющему → выход «не выполнен», 503 тело Р7, Set-Cookie нет; положительный близнец —
      проверяющий решил «негоден» → 401 по Р2 (отличие — один факт: решил ли проверяющий);
      сценарий с ID, производитель (logout_key_source_test.go на названной ревизии полосы) и
      исход на базе e3476f0bc28; в Р4 — назвать, какой бюджет ограничивает проверку предъявителя
      на выходе, и как он соотносится с KACHO_JWKS_FETCH_TIMEOUT_SECONDS (внешний срок 1s
      при объявленных 5s делает эту ручку на пути выхода недостижимой выше 1s — сказать, что это
      решение, либо выбрать иное); поправить пункт «Что НЕ входит» о наборах ключей; (б) либо
      оставить 401 и бюджет 5s, назвав это решением, — тогда полоса kacho#2996 обязана снять
      ветку 503 и смену бюджета. Ревизию полосы в шапке и таблицах перепинить на ту, о которой
      документ судит.

