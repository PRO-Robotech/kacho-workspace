seeding:
  isolation: >-
    git worktree --detach kacho @e9ce4ffbd в scratchpad сессии; снят после прогона
    (git worktree remove — rc 0). Стенд не поднимался: задание его не называло.
  runs:
    - given: 'П0 — манифест Р1, пин kaname@422d1bc6f, тег main-422d1bc6 в 5 профилях, system_class в subjectUsersets'
      command: 'GOWORK=off go test ./internal/repohygiene/ -run ''<7 тестов сценария 01>'' -count=1 -v'
      outcome: >-
        PASS 5 — canon, Readable, NotASecondDeclaration, NamedPredicate,
        ConsumerOwnedStructuralRelationsHaveProducers. FAIL 2 —
        TestModuleManifestFormIsJudgedByTheOneExecutor и TestManifestFormCensusFollowsTheTree,
        корень снимает kaname#872 (Д9). Совпало с переписью автора.
    - given: тот же П0
      command: 'GOWORK=off go test ./deploy/ -run ''TestOutsourcedImagePinAgreesWithItsModulePin$'' -count=1'
      outcome: ok (в круге 1 без тега — 7 находок)
    - given: 'близнец Р1 п. 4 — subjectUsersets без system_class'
      command: 'TestConsumerOwnedStructuralRelationsHaveProducers'
      outcome: 'FAIL — «fga_model.fga:1315 — `registry_registry#public_reader` объявлено, но НИ ОДНА точка эмиссии его не пишет»'
    - given: DoD S1 п. 1, предикат yq
      command: 'diff <(yq ''{"resources": .resources, "roles": .roles}'' <манифест>) <(yq … фикстура)'
      outcome: '0 строк при ключе на месте фикстуры (после producer); 4 строки при ключе после objectType'
  gate_change_scope: >-
    hasSubjectUserset пропускает отношение, если в его составе ЕСТЬ хотя бы одна вершина
    субъекта. В каноне @422d1bc6f system_class есть в 5 определениях
    (grep "define .*\[[^]]*system_class" → строки 269, 1315, 1333, 1334, 1357); у четырёх из
    них в составе уже есть user. Новым пропуском правка делает ровно одно отношение —
    registry_registry#public_reader.
  summary: >-
    Посеяно «Дано» S1 (сценарий 01 и его близнец, близнец Р1 п. 4, предикат DoD S1); исходы
    совпали с документом. Числа «deploy 488/0, repohygiene 2636/2, dataplane 115/0» — от автора:
    я прогонял подмножества. Не выполнилось: стенд П2/П3 и integration-окружение registry П1.

