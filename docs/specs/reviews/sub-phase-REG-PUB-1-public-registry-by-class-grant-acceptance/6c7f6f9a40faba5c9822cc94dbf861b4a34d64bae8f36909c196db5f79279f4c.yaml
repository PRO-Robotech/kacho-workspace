closure_of_round_1:
  B1_CONSTRUCTIBILITY: >-
    ЗАКРЫТО. Производитель гейта формы назван: kaname#872 (OPEN, «iam: судья манифеста отвергает
    роль над ресурсом без своей службы»; gh issue view 872 -R PRO-Robotech/kaname). «Дано»
    сценария 01 требует пин kaname с этой правкой, а порядок Р9 ставит S1 после неё. Второй
    гейт, найденный посевом (TestConsumerOwnedStructuralRelationsHaveProducers), получил
    производителя Р1 п. 4. Основание Д9 сверено: catalog_resource_spelling.go:93-94 @422d1bc6f
    объявляет registry.repositories ресурсом без своей службы; tables_gen.go — у
    registry_repository глаголы v_delete, v_get, v_list, v_update.
  B2_DoD: >-
    ЗАКРЫТО. Сравнение сужено до resources и roles через yq, seed сравнивается со стволом,
    строка переписи исправлена. Предикат исполнен: с ключом на месте фикстуры diff пуст (0
    строк), seed — 0 строк. Предикат чувствителен к порядку ключей (см. non_blocking).
  B3_PRODUCER: >-
    ЗАКРЫТО. Р9 п. 2 — вложенный чарт kaname (configmap.yaml:105, путь
    kaname.config.apiServer.registryToken.*) и отказ рендера при разных значениях; Р1 п. 3 —
