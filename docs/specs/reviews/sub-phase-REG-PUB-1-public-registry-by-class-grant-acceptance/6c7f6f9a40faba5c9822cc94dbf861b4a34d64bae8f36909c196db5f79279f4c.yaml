    → 5); Р9 п. 3 — второй подъём до kaname с #495; DoD S1, S3, S6.
  B4_CONSTRUCTIBILITY: >-
    ЗАКРЫТО. Анонимная половина вынесена в сценарий 29 (стендовая часть S3); 17 в S2 без
    анонимного шага; утверждение о независимости S2 теперь верно.
