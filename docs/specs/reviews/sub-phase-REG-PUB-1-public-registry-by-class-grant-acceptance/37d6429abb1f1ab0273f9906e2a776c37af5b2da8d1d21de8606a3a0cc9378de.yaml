    id: B1
    where: 'П0 (строки 287–293); «Посев «Дано»: прогон» (340–353); REG-PUB-1-01 «Дано» (358); П2 (303–304); Р1 «Порядок выкатки» (185)'
    claim: >-
      Дельта перевела манифест Р1 п. 1 во вложенное правило, но «Дано», которые его
      используют, остались на kaname без kaname#874. П0 — «манифест Р1 п. 1; пин
      kaname@422d1bc6f»; «Дано» 01 — «пин, в который влита kaname#872»; П2 и Р1 — «kaname с
      #856 на стенде». На любом из них новый манифест отвергается строгим разбором (это
      утверждает и сам Р1 п. 2), и сценарий 01 (а на стенде — 02 и всё, что ждёт роль) падает
      на верном продукте. Таблица посева мерена на прежней форме и к ред. 7 не относится.
      Нужно: П0 и «Дано» 01 — пин не ниже ревизии вливания kaname#879 (до вливания — голова
      874); П2 и Р1 «Порядок выкатки» — образ kaname с kaname#874; таблица посева —
      перемерить (числа этой записи, seeding.runs[0..1], годятся).
    predicate: seeding.runs[3] (красный при «Дано» 01 буквально) против seeding.runs[0] (зелёный на 5f6f29902)
  - kind: TWIN
    id: B2
    where: 'REG-PUB-1-13 «Близнец»; П2 — роль rol-reg-get (строка 318)'
    claim: >-
      Отрицание 13 и близнец 11 различаются двумя фактами (list над registries и вложенное
      правило), и текст это признаёт, ссылаясь на то, что list на visibility не действует.
      Это утверждение о реализации, а не проверка её: форму вопроса о видимости выбирает
      замысел (строка 300). Вывод видимости, спрашивающий у kaname v_list класса anonymous на
      реестре, проходит и 11 (list есть), и 13 (list нет) — и показывает PUBLIC для роли
      [get, list] без children, при которой репозитории без входа не читаются (ложь Р2).
      Нужно: rol-reg-get → [get, list] над registry.registries (без имён и меток; RoleService.Create
      её принимает, children на входе и так запрещён) — тогда 11 и 13 различаются ровно
      вложенным правилом. Выдача классу такой роли разрешена воротами только-чтения (SC-21).
    predicate: 'sed -n 318p и 429–440p документа; kaname role.proto @origin/874 — комментарий Rule.children'
  - kind: FORMAT
    id: B3
    where: 'REG-PUB-1-03 «Тогда» (строки 390–391); Р1 п. 3 («поле children роли край отдаёт через REST»)'
    claim: >-
      «Тогда» 03 — «глаголы роли ровно get и list над registry.registries и
      registry.repositories, других правил нет» — написано под прежнюю форму. Проба, взятая
      буквально (rules[0].resources == [registries, repositories]), краснеет на верном
      продукте, а прежняя форма (ND-07 (б)) это «Тогда» проходит. Это единственный сценарий,
      читающий роль через край, и только он может держать утверждение Р1 п. 3. Нужно
      конкретное тело: rules длины 1; rules[0] — module "registry", resources ["registries"],
      verbs ["get","list"], children длины 1 с resources ["repositories"], verbs ["get","list"]
      и без resourceNames/matchLabels. Отрицание: роль без children (прежняя форма) — красный.
    predicate: 'sed -n 385–396p документа; role.proto @origin/874: Rule{resources=2, verbs=3, resource_names=4, match_labels=5, module=6, children=7}'

