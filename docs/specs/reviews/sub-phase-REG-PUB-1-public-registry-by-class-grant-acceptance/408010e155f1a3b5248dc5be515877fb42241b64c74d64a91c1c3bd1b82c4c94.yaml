blocking:
  - kind: CONSTRUCTIBILITY
    where: сценарий REG-PUB-1-53, «Given» (строки 604–605)
    text: >-
      «Given … цепочка стека prod (общее значение global.kacho.registry.anonymousSubjectId
      пусто)» верно только до S4. DoD S4 этой же задачи требует значение в prod без
      перекрытия, после чего «Дано» в написанной форме не строится, а держатель-рендер на
      prod с одним перекрытием собственного ключа kaname проверяет уже случай «рядом с общим
      значением» (второе «And»). Случай «собственный ключ kaname один» — тот самый, на котором
      стоит отказ Р9 п. 2, — остаётся без держателя. Замер: prod без перекрытия на dc4e91348 —
      0 и 0; после S4 по DoD S4 — 1 и 1. Правка: в «Given» перекрытие
      --set-string global.kacho.registry.anonymousSubjectId= явно, как это уже сделано в
      REG-PUB-1-52; то же для строки DoD S3 «собственный ключ registry без общего».
  - kind: COVERAGE
    where: Р9 п. 5 (строки 260–261); DoD S3 (перечень исходов пробы рендера)
    text: >-
      Р9 п. 5 утверждает: «Сторона, выдающая анонимный токен, без узнающей не включается ни в
      одном рендере». Рендер опровергает: dev (общее значение задано) с --set registry.enabled=false
      → код 0, у kaname anonymous-client-id: "registry-anonymous" есть, пода registry в рендере
      нет (счёт 0 и 1). registry.enabled — условие подчарта в Chart.yaml умбреллы, то есть
      законная ручка оператора, а одиночная установка чарта registry самим документом названа
      поддерживаемой формой (Р9 п. 2). Свойство, которым п. 2 обосновывает отказ на собственном
      ключе kaname, в этом рендере не выполнено, а текст о безопасности объявляет его
      безусловным. Исход выбирает диспетчер (вопрос ниже): (а) приёмка заказывает отказ рендера
      умбреллы при заданном общем значении и выключенном подчарте registry — исход в DoD S3 и
      «And» в REG-PUB-1-53 с близнецом (registry.enabled=true → код 0); (б) п. 5 сужается до
      «в рендере, где подчарт registry включён», а остаток называется прямо.

non_blocking:
  - kind: FORMAT
    where: REG-PUB-1-53, первое «Then»
    text: >-
      «в выводе нет ни KACHO_REGISTRY_ANONYMOUS_SUBJECT_ID, ни anonymous-client-id:» на
      отказавшем рендере истинно всегда (stdout пуст). Различающая часть — причина отказа;
      держатель стоит на render_must_fail_because (deploy/tests/helm/outcome.sh), иначе
      отрицание принимает любой отказ, включая несобранные зависимости.
  - kind: FORMAT
    where: REG-PUB-1-52 (б)
    text: >-
      «When» называет scope=repository:<X>/app:pull, держатель TestToken_AnonymousDisabled_NoCreds_401
      шлёт запрос без scope и собирает обработчик с fakeIssuer{anonEnabled:false}, а не из
      пустой ручки. Связь «пустая ручка → anonEnabled=false» держит kaname#495 (вне
      под-фазы) — назвать это одной фразой в строке производителя 52.
  - kind: PRODUCER
    where: строка производителя 53
    text: >-
      Названы _helpers.tpl обоих чартов; отказ всплывает из deployment.yaml:90 (kaname) и
      deployment.yaml:237 (registry) через include — это одно и то же, но строка П3 и
      строка производителя называют разные файлы. Достаточно «_helpers.tpl, зовётся из
      deployment.yaml».
  - kind: FORMAT
    where: прежние минорные замечания записи a582030e…
    text: >-
      Дельтой не тронуты и остаются (держатель 28, предикат инварианта 5, «ровно X» в 11,
      «все репозитории X» в 29, двуязычный предикат текстов S2).

