blocking: []

non_blocking:
  - kind: PRODUCER
    where: «Сценарий → производитель», строка 28; DoD S3; «Снятие прежнего объёма»
    text: >-
      «Тогда» 28 утверждает: ровно один вопрос (system_class:anonymous, v_get,
      registry_repository:{X}/app). Названные держатели проверяют только наличие субъекта:
      TestSystemClass_SC39_… — az.hasSubject(scAnonClass), TestDataplane_RG1_AnonDisabled_… —
      hasSubject(...). Ровно один вопрос проверяет только
      TestDataplane_REGPUB128_AnonymousSubjectIsAskedAsTheClass из regpub1_anonymous_subject_test.go
      ветки 3274: require.Equal(t, []checkCall{{scAnonClass, "v_get", object}}, az.checks()).
      Этот файл назвать держателем 28 и явно оставить при снятии прежнего объёма.
  - kind: FORMAT
    where: инвариант 5
    text: >-
      Предикат не ловит новое поле. buf breaking на добавление поля не жалуется, а grep считает
      только '^+ *rpc '. Нужен счёт добавленных объявлений полей в diff
      proto/kacho/cloud/registry без строк комментариев, ожидание — 0. Отсутствие поля
      visibility частично держит сценарий 11 («ключа visibility нет»).
  - kind: FORMAT
    where: сценарий 11
    text: >-
      «В странице ровно X» зависит от того, нет ли в общем проекте стенда других реестров,
      открытых классу. Надёжнее «содержит X, не содержит Y».
  - kind: FORMAT
    where: сценарии 17, 29
    text: >-
      В редакции 9 стояло «удаление реестра требует пустого пространства имён (delete.go)»,
      теперь это снято. Опустошение перечисляет только X/app. Для 29 (после 20 уже есть
      X/late) записать: «все репозитории X (app, late)».
  - kind: COVERAGE
    where: «Решение владельца»
    text: >-
      Следствие диспетчера говорит «выдача классу или пользователю». Выдачи роли
      registry.public.read пользователю в сценариях нет. В перечень «в объёме остаётся» она не
      входит, поэтому замечание не блокирует. Если её добавлять, то одним positive-кейсом S2.
  - kind: FORMAT
    where: DoD S2, предикат текстов
    text: >-
      Предикат ищет только по-русски. Английских «any-path-to-PUBLIC» в @636bd5435 13 строк:
      public.go:123, listauthz.go:200, fga_intent.go:97, domain/registry.go:126,
      0005_repository_configs.sql:30,51 и др. Все они о пути поля visibility→PUBLIC и
      остаются верными. Это стоит записать одной строкой, чтобы следующий читатель не принял
      их за пропуск (testing.md, предикат по двуязычному корпусу).

