blocking_findings:
  - id: B1
    kind: PRODUCER
    where: 'F4d-51, «И» об административном ResetSecondFactor на своей записи (строка 1383)'
    claim: '«PERMISSION_DENIED / 403 · AUTHZ_DENIED» — уровень сессии вызывающего не назван'
    why: >-
      Пол «2» судится раньше отношения: в kaname publicCallerPolicy.Unary() стоит до
      publicObjectDoor.Unary() (cmd/kaname/serve.go:966–973 @ db8bcb7e8), у края платформы шаг вверх
      — в слое authN (gateway/internal/middleware/auth_stepup.go:159, :224 @ origin/main kacho). Под
      сессией «1» не держатель получает UNAUTHENTICATED / 401 · code 16, а не 403. Единственная
      текущая сессия «Дано» F4d-51 — S1 уровня «1», и соседние «И» об отказах судятся в состоянии
      «Дано» («ни в одном отказе фактор не снят, сессии не тронуты»). Проба по этому чтению
      краснеет на верном продукте. Ф12-45 (б) ставит этот вызов под сессию «2» (человек W) именно
      поэтому; F4d-20 развела распорядителей и A₁ по уровню тем же способом.
    predicate: >-
      git -C project/kaname show db8bcb7e8:cmd/kaname/serve.go | sed -n 966,973p — callerPolicy раньше
      objectDoor; awk-блок F4d-51 | grep -c 'сесси[а-я]* «2»\|S3' в строке этого «И» → 0
    fix: >-
      Назвать сессию: под S3 до снятия либо под S1 после снятия (обе — «2»). Близнец в одно различие
      — тот же вызов на своей записи личностью с system_admin на кластере → 200 (как Ф12-45 (б)),
      либо ссылка на Ф12-45 (б) как на держателя близнеца.

