execution_check:
  - id: B1
    kind: CONSTRUCTIBILITY
    outcome: снят
    how: >-
      Выбран первый исход предиката снятия (а): строка зеркала человека прежней полосы переживает
      перевод (тот же id, те же привязки), субъект остаётся значением прежней полосы (законный
      близнец F4d-52), чеканка по Р10 — только людям, впервые заводимым нашим входом (§8 S2,
      §15 Решение 4 п. 2, §17.3). Путь первого способа, который предлагал круг 4 (F4d-13 либо
      посев), автор опроверг доказательно, и опровержение подтверждено: Given F4d-13 — человек
      полосы own, а стоящее предусловие группы B определяет его субъектом own: (прочитано,
      строки 1210–1217 и 1245–1246 документа); посев не вправе ставить отметку подтверждения
      (предикат 4 ниже). Вместо него — владелец ящика после подтверждения адреса; производителя в
      дереве нет, он заказан (kaname#458 под kaname#456, обе OPEN — gh issue view). Это третий
      исход ban #11 (предмет с причиной), а не утверждение без держателя: незавершённость S2 до
      посадки заказанного показывает замыкающая величина (посев ниже, шаги 3–4 → 1). Условие (б)
      исполнено: строки 1–2 §16.3 зачёркнуты с пометкой, новая строка называет заказанного
      производителя. Условие (в) исполнено: §17.3 и §15 Решение 4 — перевод писем не рассылает и
      способов не раздаёт; цена названа (шаг подтверждения ящика при первом входе).
  - id: B2
    kind: PRODUCER
    outcome: снят
    how: >-
      Выбран первый исход предиката снятия: замыкающая величина §17.4 — одна команда на базе
      стенда, три числа, норма «без нашего входа — 0», контроль непустого обхода (users_total > 0,
      ноль — «не выполнилось»), близнецы по одному факту. Команда исполнена мной дословно на схеме
      после всех миграций kaname@cbbac984b7b1 — вывод совпал с таблицей автора во всех шести
      шагах, мой дополнительный близнец тоже краснеет (посев ниже). §16.3 и §8 называют её вывод
      производителем квантора; отсутствие машинного держателя сказано прямо.

