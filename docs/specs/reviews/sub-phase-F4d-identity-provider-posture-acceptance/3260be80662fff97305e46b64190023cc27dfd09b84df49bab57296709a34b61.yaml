blocking_findings:
  - id: B1
    class: '[CONSTRUCTIBILITY] «заводится заново с субъектом по Р10» не строится для людей, чья строка зеркала переживает перевод'
    sign: >-
      §8 держит перевод стенда правкой одной строки профиля («Перевод стенда обратим правкой
      одной строки профиля»): база платформы при переводе остаётся, строка зеркала каждого
      человека прежнего поставщика — ACTIVE с субъектом прежней полосы. Редакция требует от
      каждого такого человека «заводится на полосе own заново — приглашением либо посевом, с
      идентификатором субъекта по Р10» (§15 Решение 4, «Что решено», п. 2; §8 S2) и называет
      производителем F4d-52 — «строка зеркала переходит в ACTIVE с идентификатором субъекта по
      Р10» (§16.3, строка 2).
    subject: >-
      Для этих людей такого перехода не бывает. Ключ почты полный —
      `CREATE UNIQUE INDEX users_identity_email_uniq ON kaname.users USING btree (lower(email))`
      (kaname@cbbac984b7b1, internal/migrations/0001_initial.sql:5080), и это тот самый ключ,
      которым F4d-52 держит отказ второго заведения одного человека. Посев выше: заведение нашим
      входом на занятую почту отвергнуто, строка осталась с субъектом прежней полосы и без
      способа входа; близнец со свободной почтой заведён с субъектом own:. Приглашение на
      существующую строку идемпотентно (прочитано). Чеканка own: в прод-коде службы одна —
      internal/apps/kaname/api/registration/register.go:177, новая строка зеркала. Given F4d-52
      («человек, которого заводит наш вход; строка переходит в ACTIVE») для них не наступает,
      поэтому F4d-52 — производитель другого состояния.
      Строится другое: та же строка (id и привязки прав сохраняются), субъект — значение прежней
      полосы (законный близнец F4d-52: головы own: не несёт и находкой не считается), первый
      наш способ входа — глаголом F4d-13 («распорядитель заводит ему способ „пароль“», Given
      «человек без единого способа входа» — ровно посеянное состояние) либо посевом (Р4). Так же
      это моделирует одобренная соседка: Ф1 §3.10, Given Ф1-52 — «та же личность (тот же id)»,
      проверочное значение положено посевом. Сверх того: путь, который строится, — «распорядитель
      заводит первый способ каждому человеку стенда», — для человека наблюдаемо похож на массовый
      сброс, который Решение 4 оставляет «не принятым»; документ об этом молчит (Ред-1).
    predicate_of_removal: >-
      (а) §15 Решение 4 п. 2 и §8 S2 называют, что строка зеркала человека переводимого стенда
      переживает перевод (id и привязки), субъект остаётся значением прежней полосы, первый наш
      способ входа даёт F4d-13 либо посев, а чеканка по Р10 относится к людям, впервые заводимым
      на полосе own, — ЛИБО прямо решают, что зеркало заводится заново, и называют цену (привязки
      прав теряются, «обратим правкой одной строки» перестаёт быть верным); (б) строка 2 §16.3
      называет производителем сценарий, чей Given есть это состояние, а не F4d-52; (в) одна фраза
      о том, почему первый способ, заведённый распорядителем каждому, не есть отвергнутый массовый
      сброс, либо названа его цена. Новых сценариев это не требует (Ред-4).
  - id: B2
    class: '[PRODUCER] квантор «каждый из них» условия S2 не держится ничем, что способно покраснеть'
    sign: >-
      §8 S2: число личностей прежнего поставщика «названо перед переводом — величина
      операционная, а не норма»; «каждый из них заводится … и входит нашим входом (F4d-52,
      F4d-42)». §16.3 даёт этой части производителей F4d-52 (форма субъекта одного заводимого
      человека) и F4d-42 / F4d-16 (сквозной набор на одном человеке полосы own).
    subject: >-
      Ни один из названных производителей не читает ни числа, названного до перевода, ни
      множества людей стенда: по их Given стенд, где один из N названных остался без нашего
      способа входа, даёт F4d-52 зелёным (на другом человеке), F4d-42 зелёным (на тестовом), а
      число названо — условие S2 читается выполненным. Прежняя редакция держала это
      замыкающим числом («не переехал — в норме ноль»); эта замыкание сняла и не заменила.
      Документ сам отвергает в §16.6 п. 3 величину без предиката — число личностей теперь того
      же рода. Установлено чтением Given производителей, прогоном не исполнялось.
    predicate_of_removal: >-
      Либо замыкающая величина после перевода — «число личностей, названных до перевода, у
      которых нет нашего способа входа, названо — в норме ноль» — с формой команды (соединение
      строк зеркала и строк способа входа по id человека на базе стенда) и близнецом; либо строка
      §16.3 для квантора говорит «машинного держателя нет», как строка санкции, и называет
      операционный шаг, которым он исполняется.

