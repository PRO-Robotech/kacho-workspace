    ЗАНОВО — приглашением либо посевом, с идентификатором субъекта по Р10; производитель F4d-52»
  seeded: 2 of 2
  not_executed: 1
  seed:
    home: PRO-Robotech/kaname @ cbbac984b7b1 (ревизия, которую называет §16.1), выгрузка `git archive` в scratchpad; дерево службы не тронуто
