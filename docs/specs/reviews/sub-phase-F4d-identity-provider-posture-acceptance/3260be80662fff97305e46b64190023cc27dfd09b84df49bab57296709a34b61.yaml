    command: >-
      go test ./internal/apps/kaname/api/registration/ -run
      '^(TestReviewSeed_LegacyPersonCannotBeCreatedAnew|TestRegisterIntegration_F4_11_24_OccupiedAddressIsOneRefusal)$'
      -count=1 -v — под замком interim.lock, MemoryMax=10G
    exit_code: 0
    output:
      - 'seeded legacy state: {users:1 methods:0 sessions:0 accounts:1}'
      - 'register same email -> err=registration refused'
      - 'after refused register: {users:1 methods:0 sessions:0 accounts:1}'
      - 'subject of legacy person stays "9b2f3c1e-…", own-lane=false'
      - 'twin fresh address -> created, rows {users:1 methods:1 sessions:1 accounts:1}, субъект own: (assertAllThree)'
      - '--- PASS: TestRegisterIntegration_F4_11_24_OccupiedAddressIsOneRefusal (3.58s) — фикстура дерева, занятый адрес — один отказ'
