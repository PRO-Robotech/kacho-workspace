blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    summary: >-
      F8S4-09 не строится так, как описан посев. Шаг 3 посева К кладёт копию одного удостоверения
      в аутентификатор каждого из четырёх контекстов. Счётчик подписи `signCount` (обязательное
      поле Credential CDP, protocol.d.ts:18741, 1.56.1) документ не называет вовсе: grep → 0.
      Служба сверяет счётчик утверждения правилом Ф7 (Ф13 строка 559 «переиспользуется»,
      строка 1666 (е)). В kaname@d2f6f182fab JudgeCounter (webauthnverify/verify.go:542)
      отвергает утверждение, если присланное значение не больше хранимого, кроме случая 0/0
      (finish_assertion.go:146 → RefusalCounter). Виртуальный аутентификатор сдвигает счётчик на
      каждом предъявлении. Поэтому первый контекст сдвигает хранимое значение, а копии с тем же
      начальным значением во втором–четвёртом контекстах получают единый отказ `401`. В итоге
      «Тогда» F8S4-09 (успешный вход ×4) не наступает при верной реализации экрана. Перепись §6.3
      для F8S4-09 (4 успеха, 0 отказов) тоже неверна.
    fix: >-
      Назвать `signCount` значением в шаге 3 и в authData регистрации шага 2: по контекстам
      строго возрастающее начальное значение выше хранимого после предыдущего входа. Либо регистрация
      Ф7 на каждый контекст (+3 регистрации в §6.3). Сверить перепись §6.3 и DoD п. 10.
    evidence: >-
      grep -ci signcount документа → 0; Ф13 @d2f6f182fab строки 559, 1666; verify.go:542;
      finish_assertion.go:146–150.
  - id: B2
    kind: DoD
    summary: >-
      Предикат DoD п. 1 «git grep -c 'test("F8S4-' по двум файлам проб = 14» верная реализация
      выполнить не может. Модульные пробы лежат в двух файлах: LoginPage.test.tsx и
      carrier-order.test.ts. Вместе с браузерной пробой файлов три. Оба модульных файла пишут
      пробы вызовом `it(`: @9b14ae7f01c `test("` → 0 и 0, `it(` → 16 и 11. F8-46 к тому же —
      цикл `it(\`F8-46 · ${name}…\`)` по CARRIER_VERBS (строки 294–297). Строка F8S4-11 в этом
      перечне получит имя «F8-46 · …», а не «F8S4-11». Предикат по форме дерева даёт 8, а не 14.
      Условие «// verifies внутри вызова test(…)» для `it(` не определено.
    fix: >-
      Назвать три файла и форму вызова каждого (`test(` у playwright, `it(` у vitest). Предикат
      должен считать ID в имени теста независимо от вызова. Для F8S4-11 назвать отдельную пробу с
      ID в имени либо явное правило имени внутри цикла F8-46.
    evidence: "git show 9b14ae7f01c:<файл> | grep -c 'test(\"' / '\\bit(' по трём файлам"

