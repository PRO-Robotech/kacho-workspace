important:
  - id: I1
    summary: >-
      §7 п.1 говорит, что предикат ловит «любую кавычку», но шаблон `["`]` одинарную кавычку не
      ловит: синтетика `it('F8S4-07')` даёт 0. На измеренной ревизии оба модульных файла пишут
      имена двойной кавычкой или шаблонной строкой, поэтому ошибка возможна только в сторону
      меньшего числа: предикат покраснеет и ложно не позеленеет. Слова «любой кавычке» в
      следующей правке стоит сузить либо добавить `'` в класс.

