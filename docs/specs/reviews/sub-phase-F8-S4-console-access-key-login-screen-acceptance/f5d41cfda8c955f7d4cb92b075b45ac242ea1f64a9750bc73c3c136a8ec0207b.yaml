blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    summary: >-
      Бюджет оси источника не объявлен, а F8 Р7 ч. 2 действует здесь целиком (§6.0). Ф13 Р9:
      каждая выдача испытания — попытка источника, пара «begin + единый отказ» — две. Сценарии
      S4 тратят за прогон 12–14 попыток: 02·1, 03·1, 04·2, 05·2–4, 09·4, 10·1, 12·1. F8 Р7 даёт
      11 за прогон, потолок источника — 50 за 15 мин, и снимается он только временем. Три прогона
      подряд (DoD п. 3) дают 69–75. Сторож F8-41 считает только «401 на путях семи глаголов» и
      выдачу испытания не видит. Верная реализация может получить 429 по источнику.
    fix: >-
      Добавить в документ перепись S4 по группам F8 Р7 (begin и access-key/login) с числом за
      прогон и за три. Расширить F8-41 новым глаголом или показать числом, что сумма не выходит за
      потолок. Это оформить сценарием-сторожем с производителем и DoD-пунктом.
    evidence: >-
      grep -c 'бюджет\|F8-41' документа → 0; F8 Р7 — sub-phase-F8-…:1050–1172; Ф13 Р9 —
      passwordless-login-with-access-key.md@d2f6f182fab.
  - id: B2
    kind: TWIN
    summary: >-
      §6.2 называет у пары F8S4-01 / F8S4-02 одно различие — «нажата ли кнопка». По тексту их
      три: у F8S4-02 есть посев П-п+К, у F8S4-01 нет; адрес `/login` против
      `/login?returnTo=/dashboard`; нажатие. Утверждение §6.2 опровергнуто текстом документа.
    fix: >-
      Дать F8S4-01 «Дано» F8S4-02 и When «открывает /login?returnTo=/dashboard, кнопку не
      нажимает».
    evidence: "awk-выборка Given/When обоих сценариев (строки 299–309 документа)"

