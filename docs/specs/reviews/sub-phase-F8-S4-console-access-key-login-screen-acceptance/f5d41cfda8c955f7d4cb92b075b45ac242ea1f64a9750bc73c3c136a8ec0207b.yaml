      Флаг резервного копирования проверяется на согласованность с предъявлением, а аутентификатор
      предъявляет BE=0 (N5). Следует прямо написать: BE=0, BS=0.
  - id: I2
    summary: >-
      F8S4-06 не называет ни наличие `window.PublicKeyCredential`, ни ответ транспорта на вход,
      а у близнеца F8S4-08 названо и то и другое. Нужно выровнять «Дано».
  - id: I3
    summary: >-
      §3 «перечень ключей»: у отложенного предмета нет номера задачи. Нужно завести задачу и
      вписать её номер в следующую редакцию (ban11-three-outcomes).

