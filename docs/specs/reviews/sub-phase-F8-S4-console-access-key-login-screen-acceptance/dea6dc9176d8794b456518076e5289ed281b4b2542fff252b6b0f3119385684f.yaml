measurement:
  s4_share_by_probe: >-
    Журнал прогона (`gh run view 38198101708 --log`), шаг source-axis-budget: «[F8S4-15] … по
    прогонам 20 · всего 20 · бюджет 20»; разбивка F7-07-console 2 · F8S4-02 1 · F8S4-02 (путь
    ключа) 3 · F8S4-03 1 · F8S4-03 (путь ключа) 1 · F8S4-04 2 · F8S4-05 4 · F8S4-09 4 · F8S4-10 1 ·
    F8S4-12 1 = 20. Совпадает с таблицей §13 построчно и с §6.3 (15 выдач + 5 отказов).
  f841_share: >-
    «[F8-41] … 17 · бюджет 18»; ни одного ID F8S4- в списке F8-41. Ведомость шага работы — 18 =
    11 + 4 + 2 + 1; в замере нет строки F8S6-01 (комментарий работы, строки ~1055–1058, называет
    это и для прогона 38170813139). Предмет — доля F8-41, не S4; документ число 17 называет верно.
  selftest: >-
    Самопроверка того же прогона: «ok F8S4-15 · доля S4 20 при бюджете 20 — в бюджете», «ok …
    выдача испытания сверх бюджета — красное», «ok … названо число — 21», «ok … та же запись на
    пути признака формы — не красное», «ok … три прогона — 60», «ok … 61 — красное». Близнецы
    F8S4-15 (21-я выдача / путь признака формы) исполнены.
  registrations: >-
    Вложения kacho-2909-source-registrations отчёта прогона (артефакт console-e2e-results):
    F8S4-01, -02, -03, -04, -05, -09, -10, -12 — по 1, итого 8 = §6.3 и DoD п. 10. Сверх того по 1
    у F8S4-02 и F8S4-03 пути ключа и у F7-07-console (в §6.3 «—»). Сторож регистраций зелёный:
    258 · бюджет 320.
  arithmetic: >-
    18 + 20 = 38; 38/320 = 11,875 % → 11,9; 3 × 38 = 114, 114/320 = 35,6 %; 38/50 = 76 %;
    320 − 38 = 282; 18 + 303 = 321, 18 + 302 = 320. Сходится.

blocking: []

important:
  - id: I1
    kind: FORMAT
    summary: >-
      §6.3 ставит «—» в столбец регистраций трёх новых строк (F8S4-02 и F8S4-03 пути ключа,
      F7-07-console), хотя отчёт того же прогона даёт по 1 у каждой. Итог 8 верен для строк
      сценариев access-key-login, и документ честно говорит, что столбец не перемерялся. На вердикт
      не влияет: сторож регистраций судит общую сумму (258/320) и зелёный. В следующей правке
      заменить «—» числом 1 и назвать, что 8 — это доля строк сценариев.
  - id: I2
    kind: CONVENTION
    summary: >-
      F8S4-15 «Дано» и DoD п. 10 закрепляют чужую величину `KACHO_CEREMONY_FAILURE_BUDGET` = 18
      (F8-41 и другие полосы). Когда новая полоса допишет строку ведомости, этот документ устареет,
      хотя предмет S4 не изменится. Текст уже смягчён: «величина ведомости набора (на замере §13 —
      18)». Сторож и проба развёртывания берут число из работы, так что лжи о поведении здесь нет.
  - id: I3
    summary: >-
      Вне предмета S4. F8S6-01 стоит в ведомости F8-41 с одним отказом, но ни в замере
      38170813139, ни в 38198101708 этот отказ не появился, хотя второй прогон зелёный. Поэтому
      F8-41 и даёт 17 из 18. Это предмет полосы F8-S6 (kacho#3062), к этому документу не относится.

