blocking_findings: []

non_blocking_findings:
  - id: N3-1
    kind: control_prints_the_same_value
    where: '§1.4, таблица «что выдаёт такие кортежи сегодня», строка якорных селекторов'
    what: >-
      Проза под таблицей говорит «Контроль печатает непустые и ДРУГИЕ значения». Для строки
      ролей это верно (1 против 3), для строки якорных селекторов — нет: перемерено, iam.user
      → 4 и контроль iam.group → 4, то есть значение ТО ЖЕ.
    why_not_blocking: >-
      Контроль свою работу делает: непустой ответ доказывает, что предикат не слеп. Неверна
      только характеристика «другие», и ни одно число раздела от этого не меняется.
    suggested: 'заменить «непустые и другие» на «непустые» — либо назвать, что у второй строки совпадение случайно'
  - id: N3-2
    kind: twin_not_named_by_id
    where: 'S31E-16'
    what: >-
      Положительный близнец поимённо не назван. Фактически он есть — S31E-01 (дельта одна: у
      человека ЕСТЬ членство), а роль положительного контроля внутри сценария играет клауза
      про GET /iam/v1/me.
    why_not_blocking: >-
      Утверждение сценария — о НЕПРЕДСТАВИМОСТИ адреса, и оно доказуемо без второго прогона;
      «мёртвым предметом» оно не читается, потому что соседние 17 сценариев ту же поверхность
      проходят.
    suggested: 'дописать «положительный близнец — S31E-01» одной строкой'
  - id: N3-3
    kind: predicate_could_be_stronger
    where: 'врезка под S31E-18'
    what: 'полоса неизвестного ПАРАМЕТРА ЗАПРОСА теперь измерена мной (grpc-gateway v2.30.0 runtime/query.go:117–126 + отсутствие своего QueryParameterParser у края) — у «Тогда» есть производитель, и оговорку можно заменить замером'
    why_not_blocking: 'вывод сценария от этого не меняется — он усиливается'

task_lines_for_the_code_lane:
  - 'В GetUserRequest и ListUserOperationsRequest вместе со снятием user_id (reserved 1 + reserved "user_id") ЗАВОДЯТСЯ поля-носители нового пути — account_id и membership_id, с НОВЫМИ номерами (1 зарезервирован). Приёмка называет это следствием пути и через DoD п.1/п.2, но именами полей запроса не называет: сегмент пути без поля запроса — состояние, запрещённое схемой связывания (это же нашёл круг 1, B1).'
  - 'Строка таблицы форм ответа края (kacho gateway/internal/middleware/permission_denied_response.go) на тип iam_membership: назвать ШАБЛОН дословно и сказать, какой идентификатор в него подставляется. «Побайтово равна строке iam_user» исполнимо двояко — как та же строка ("User %s not found") и как та же ФОРМА контракт-тона; требование hardening-инварианта 6 — совпадение с настоящим backend-miss ЭТОГО маршрута, и именно его надо зафиксировать пробой.'
  - 'Полоса негодной формы membershipId: у соседнего посаженного маршрута IAM-ID-2 (MembershipService.Get) областью гейта служит account_id, поэтому негодный membership_id доходит до службы и получает INVALID_ARGUMENT (corevalidate.ResourceID, internal/apps/kaname/api/membership/get.go:44). У новых маршрутов область — сам membership_id, поэтому негодная форма не резолвится в объект и отвечает отказом (S31E-07). Различие законно и оракулом не является; НЕ «чинить» его проверкой формата ПЕРЕД authz на поле-области.'
  - 'Фаза migrate доказывается предикатом «не ноль кортежей на НОВОМ объекте при действующей выдаче» (§6.1, S31E-13/14). Факт запуска реконсайлера предикатом не является; проба обязана падать на непроизошедшей перематериализации.'
  - 'Новая коллекция newman (DoD п. 13) заводится вместе со строкой ведомости производителя — иначе MR линии краснеет.'

