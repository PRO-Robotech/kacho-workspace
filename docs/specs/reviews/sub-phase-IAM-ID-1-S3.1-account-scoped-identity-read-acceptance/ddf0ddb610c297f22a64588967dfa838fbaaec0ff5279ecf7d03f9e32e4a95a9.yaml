dispatcher_question_1_resolved_by_measurement:
  question: >-
    S31E-18 утверждает НЕРАЗЛИЧИМОСТЬ ответа, а не INVALID_ARGUMENT. Верно ли это, или
    контракт обязан назвать иной исход?
  authors_position: >-
    Край разбирает ТЕЛО с DiscardUnknown; полоса для неизвестного ПАРАМЕТРА ЗАПРОСА отдельным
    замером не устанавливалась, поэтому в «Тогда» не называется — утверждение о ней не имело
    бы производителя.
  my_measurement:
    body_lane: |
      git show 8d70f599834:gateway/internal/restmux/mux.go — блок комментария над publicMarshaler
      (строки ~360–398): ключ остаётся отбрасываемым ВЗВЕШЕННО, четыре довода, из них №2 —
      «клауза update_mask РЕАЛИЗОВАНА именно DiscardUnknown». Утверждение автора о теле ИСТИННО.
    query_lane: |
      go.mod: github.com/grpc-ecosystem/grpc-gateway/v2 v2.30.0
      $GOMODCACHE/…/grpc-gateway/v2@v2.30.0/runtime/query.go:117–126 —
        fieldDescriptor = fields.ByName(...); если nil → fields.ByJSONName(...); если снова nil:
        «We're not returning an error here because this could just be an extra query parameter
         that isn't part of the request» → grpclog.Infof(...); return nil
      собственного QueryParameterParser край не ставит: git grep 'QueryParameterParser' -- gateway/ → 0
        (единственные попадания PopulateQueryParameters — в пробе restmux/repeated_scalar_query_param_test.go)
  verdict: >-
    Автор прав, и его утверждение оказалось СИЛЬНЕЕ, чем он заявил: неизвестный параметр
    запроса на этом крае отбрасывается молча БИБЛИОТЕКОЙ, а не только телом — то есть у «Тогда»
    S31E-18 («ответ побайтово равен ответу без предъявленного поля») производитель ЕСТЬ и он
    назван замером выше. Требовать INVALID_ARGUMENT было бы требованием БЕЗ производителя: его
    пришлось бы завести SetQueryParameterParser'ом, а это продуктовое решение обо ВСЕХ RPC
    края, не предмет этой под-фазы. Блокирующим не является ни при каком прочтении.
  offered_to_author_non_blocking: >-
    Врезку под S31E-18 можно усилить измеренным производителем (координата и строки выше)
    вместо оговорки «отдельным замером не устанавливалась». Нового круга не требует.

