blocking_findings:
  - id: B2-1
    kind: CONVENTION
    title: судьба поля `user_id` в двух запросах не названа — исхода нет ни одного из трёх законных
    where: §1.1 (таблица форм), §2 F1/F2, §5 DoD п. 1
    measured: >-
      kaname @ dd66b5be / f8fc5a37, proto/kaname/cloud/iam/v1/user_service.proto:
      message GetUserRequest несёт ТОЛЬКО `string user_id = 1`;
      message ListUserOperationsRequest — `user_id`, `page_size`, `page_token`;
      rpc Get сегодня объявляет get: "/iam/v1/users/{user_id}".
      Поле `user_id` — единственный сегодня носитель адресуемой личности.
    what_the_doc_does: >-
      §1.1 переводит оба глагола на путь `…/accounts/{accountId}/memberships/{membershipId}/user`,
      где `{userId}` сегмента БОЛЬШЕ НЕТ, а S31E-01 прямо утверждает: «`id` ответа равен
      человеку **названного членства** — вызывающий его отдельно не называл: личность
      выводится из членства, а не сверяется с ним».
    why_blocking:
      - >-
        Поле остаётся в сообщении запроса, перестав быть сегментом пути, и его исход не
        назван. api-conventions.md §«Принято-и-проигнорировано — ЗАПРЕЩЕНО» даёт ровно три
        законных исхода: реализовать · отвергать явно `INVALID_ARGUMENT` с именем поля ·
        снять с контракта с резервированием номера И имени. Четвёртого («молча принять и
        выбросить») не существует, и именно он получается по умолчанию.
      - >-
        Если поле останется и БУДЕТ читаться, то у входа «членство `M_A` + `userId` другого
        человека» нет названного «Тогда» ни в одном сценарии: непонятно, промах это,
        `INVALID_ARGUMENT` или оракул, различающий «несовпало» и «нет доступа». Это дыра в
        анти-оракуле §1.5, которая прямо противоречит его же требованию побайтовой
        неразличимости трёх исходов.
      - >-
        Предмет ровно этой предфазы: §1.1 и DoD п. 1 объявляют наблюдаемую REST-форму, а
        судьба поля запроса — наблюдаемое поведение API, а не правка кода. §6.2 («ни .proto»)
        это не выводит из области: документ ничего не правит, он НАЗЫВАЕТ наблюдаемое.
    how_to_close: >-
      Назвать исход по каждому из двух сообщений одним из трёх законных и добавить
      соответствующий сценарий: при «снять с контракта» — резервирование номера и имени и
      ломающее изменение объявлено; при «отвергать явно» — сценарий с `INVALID_ARGUMENT` и
      именем поля; при «реализовать» — сценарий на несовпадение `user_id` и человека
      названного членства, с ответом, побайтово равным §1.5-эталону (иначе оракул).
    same_gap_in_parent: >-
      Родитель тем же молчанием не называет правку контракта в перечне остатка — заметка
      N20-3 моей записи 24b4bf85….yaml. Производителем «Тогда» остатка родитель называет
      ЭТУ приёмку, поэтому исход обязан появиться здесь.

  - id: B2-2
    kind: PRODUCER
    title: «строка объекта края» у края не производится — названный производитель S31E-11 её не строит
    where: S31E-11 (второй «And»), §3 строка S31E-11, §5 DoD п. 7
    what_the_doc_claims: >-
      S31E-11 «Тогда»: «строка объекта края **побайтово равна** строке, для которой
      реконсайлер пишет кортежи», и «край — `ResourceType + ":" + ResourceID`
      (`kacho gateway/internal/middleware/authz.go`)». §3 повторяет ту же координату
      производителем. DoD п. 7: «Строка объекта края = строка объекта реконсайлера».
    measured: >-
      kacho @ 8d70f599, gateway/internal/middleware/authz.go:
      (а) AuthzCheckInput (строки 70-82) несёт `ResourceType string` и `ResourceID string`
          ОТДЕЛЬНЫМИ скалярными полями;
      (б) вызов на строке 1186 — m.cfg.Checker.Check(ctx, AuthzCheckInput{… ResourceType:
          resourceType, ResourceID: resourceID.String() …}) — передаёт ПАРУ, не строку;
      (в) выражение descriptor.ResourceType+":"+descriptor.ResourceID встречается в этом
          файле ТОЛЬКО в журнальных вызовах — строки 1129, 1219, 1232, 1250 («resource», …)
          — и на путь Check не попадает;
      (г) склейки нет и в адаптере gateway/internal/clients/ (предикат по Sprintf/конкатенации
          с ":" дал пусто).
      Реконсайлер строку действительно строит: fmt.Sprintf("%s:%s", fgaType, objectID) —
      kaname internal/apps/kaname/api/access_binding/reconcile/tuples.go:69.
    why_blocking:
      - >-
        «Тогда» утверждает ПОБАЙТОВОЕ РАВЕНСТВО двух строк, а одной из них не существует:
        у края объекта-строки нет ни на одном шаге пути Check. Утверждение в этой форме не
        проверяемо, а названный производитель его не производит — это ровно род PRODUCER.
      - >-
        Координата названа ФАЙЛОМ, в котором выражение есть, — поэтому ошибка не видна
        чтением: grep найдёт строку и подтвердит. Отличает предмет только вопрос, попадает
        ли выражение на путь Check; ответ — нет, оно журнальное.
      - >-
        Это ТОТ ЖЕ класс, на котором круг 1 заблокировал B3: утверждение о том, ЧТО именно
        производит каждая из двух сторон, взятое чтением, а не замером. Редакция 2 сняла
        композит и на той же оси сделала новое непроверенное утверждение о крае.
      - >-
        DoD п. 7 наследует дефект: «контракт-проба края↔реконсайлера» на строку, которой у
        края нет, не пишется.
    what_survives_and_must_not_be_over_corrected: >-
      СУЩЕСТВО S31E-11 ВЕРНО и моим замером УСИЛИВАЕТСЯ: у края ровно ОДНО скалярное поле
      ResourceID, значит композит «тип:id:id» непредставим без правки структуры
      AuthzCheckInput — то есть вывод «расхождению взяться неоткуда, потому что половин
      больше нет» стоит прочнее, чем написано. Править надо форму утверждения и координату,
      а не вывод.
    how_to_close: >-
      Переформулировать «Тогда» на то, что действительно наблюдаемо и имеет производителя:
      край подаёт ПАРУ (ResourceType="iam_membership", ResourceID=`mbr-<17>`), реконсайлер
      пишет кортежи на объект, склеенный из той же пары той же формой; утверждать равенство
      ПАРЫ края и пары, из которой реконсайлер строит строку, либо равенство строк там, где
      обе стороны строку действительно строят. Координату края назвать той, что на пути
      Check (AuthzCheckInput и вызов Checker.Check), а не журнальной строкой. DoD п. 7
      привести к той же форме.

important_non_blocking:
  - id: N2-1
    kind: FORMAT
    title: S31E-07 не несёт строки дельты, которой снабжены остальные отрицания
    what: >-
      Все прочие отрицательные сценарии открываются курсивной строкой «*Близнец S31E-NN;
      изменён ровно один факт — …*». S31E-07 её не несёт: он начинается сразу с «**Given**
      те же условия, что в S31E-01». Близнец по сути назван (условия S31E-01), изменённый
      факт очевиден (негодная форма идентификатора), но форма разошлась с остальными
      шестнадцатью.
    how_to_close: добавить ту же курсивную строку дельты.
  - id: N2-2
    kind: precision
    title: ссылка S31E-07 на «задокументированную authz-first полосу» указывает не на тот раздел
    what: >-
      S31E-07 ссылается на `api-conventions.md` §«By-lane code-split». Этот раздел владеет
      разделением NOT_FOUND / FAILED_PRECONDITION по линии резолва и прямо требует для
      malformed own-id синхронный `INVALID_ARGUMENT` первым стейтментом. Толерантность
      «authz-first, гейт края короткозамыкает до backend-валидации» объявлена в
      `testing.md` §«e2e-инварианты». Утверждение сценария защитимо, но сослано на раздел,
      который говорит противоположное про malformed id.
    note: >-
      Производитель у сценария на дереве ЕСТЬ —
      kacho gateway/internal/middleware/authz_malformed_id_test.go; вопрос только в ссылке.
    how_to_close: сослаться на владельца толерантности и назвать, почему у края порядок иной.
  - id: N2-3
    kind: form
    title: §6.1 записан как открытый вопрос, тогда как решение принято
    what: см. блок dispatcher_decision_check выше — существо записано верно и полностью, форма нет.
    how_to_close: >-
      Переписать §6.1 из «Вопрос владельцу — один, и он несущий» в «Решение — принято
      (владелец, делегировано диспетчеру)», сохранив обоснование (обратимость, ban #18) и
      убрав «Пока ответа нет». Открытых вопросов после этого — 0.
  - id: N2-4
    kind: precision
    title: координата гейта дрейфа без дерева
    what: >-
      DoD п. 7 называет `internal/authzmap/fga_model_drift_test.go` без префикса дерева,
      тогда как документ везде пишет `kaname …` / `kacho …`. Файл существует в kaname
      (проверено: git ls-tree dd66b5be -r --name-only | grep drift →
      internal/authzmap/fga_model_drift_test.go).
    how_to_close: добавить префикс дерева, как в остальных координатах.

