round1_blockers_closure_check:
  - id: B1
    kind: CONSTRUCTIBILITY
    was: сегмент пути против поля — «сегмент пути без поля запроса» запрещён схемой связывания
    author_claim: исчез как предмет — область называет ОДНО поле `membership_id`, плейсхолдер пути и есть поле запроса
    my_verdict: ЗАКРЫТ, и закрыт именно так
    evidence: >-
      §1.2 объявляет запись каталога двумя скалярами; §1.1 даёт путь, где `{membershipId}`
      и есть поле области. Дерево подтверждает, что это ШТАТНАЯ форма, а не изобретение:
      посаженный сосед IAM-ID-2 несёт ровно её —
      kaname proto/kaname/cloud/iam/v1/membership_service.proto, rpc Get:
      get: "/iam/v1/accounts/{account_id}/memberships/{membership_id}" со
      scope_extractor { object_type: "account" from_request_field: "account_id" }.
      Плейсхолдер пути связан с полем запроса; противоречию взяться неоткуда.
  - id: B2
    kind: SCOPE
    was: §4 делает вывод, которого в цитатах нет (подмена референта — запрет любого account_id выводился из §2.3)
    author_claim: §4 переписан под §1.5 родителя (пять мест, четыре смысла) и приведён к ред.20 `24b4bf85`
    my_verdict: ЗАКРЫТ
    evidence: >-
      §4.1 воспроизводит перепись §1.5 родителя пятью строками и называет смыслы верно:
      место 1 `User.account_id` — поле РЕСУРСА, снято §2.3; места 2 и 5 — поле, называющее
      ОБЛАСТЬ решения. Сверено с §1.5 редакции 20 родителя дословно — совпадает. Ссылка на
      родителя дана отпечатком `24b4bf85…` (§4.3, шапка), а не `a8fd4f94` из ствола; врезка
      «Рецензент круга 1 читал ДРУГУЮ редакцию» называет предикат перепроверки. Обратный
      контроль §4.1 исполним: я перемерил `grep -cE 'reserved 6;|reserved "account_id"'` по
      kaname proto/kaname/cloud/iam/v1/user.proto — предмет §2.3 остаётся снятым.
  - id: B3
    kind: CONSTRUCTIBILITY
    was: композит `iam_membership:<account>:<user>` не производим ни одной из двух сторон
    author_claim: снят решением — объект есть собственный id ресурса, обе стороны уже строят «тип + `:` + ОДИН id»
    my_verdict: ЗАКРЫТ ПО СУЩЕСТВУ, но координата края названа НЕВЕРНО — см. блокер B2-2
    evidence_for: >-
      Существо верно: kaname.membership_mirror_id(p_user_id, p_account_id) LANGUAGE sql
      IMMUTABLE (0001_initial.sql:1251-1255) чеканит `mbr-` + 17 из пары; форма закреплена
      CONSTRAINT memberships_id_form_check (строка 2169). Реконсайлер действительно
      односоставен: fmt.Sprintf("%s:%s", fgaType, objectID) —
      kaname internal/apps/kaname/api/access_binding/reconcile/tuples.go:69.
    evidence_against_the_edge_coordinate: см. blocking_findings B2-2
  - id: B4
    kind: COVERAGE
    was: источник отношения не назван
    author_claim: >-
      назван — `account: [account]`, `super_admin: admin from account`,
      `subject: [user]`; `v_get` несёт `subject`, `v_list` не несёт, асимметрия
      объявлена намеренной
    my_verdict: ЗАКРЫТ
    evidence: >-
      §1.3 называет все три источника таблицей и выводит глаголы. Сверено с деревом
      @ kaname dd66b5be, блок `type iam_user` в internal/authzmodel/fga_model.fga:
      define account: [account] · define super_admin: admin from account ·
      define subject: [user] · define v_get: [user, service_account, group#member] or
      subject or super_admin · define v_list: [user, service_account, group#member] or
      super_admin. Асимметрия — сегодняшний факт на `iam_user`, документ её СОХРАНЯЕТ и
      называет намеренной (S31E-10 утверждает её исходом, с положительным близнецом S31E-06).

load_bearing_check_path_form:
  question_from_task: >-
    Прежнее указание диспетчера «поля `account_id` не нужно вовсе» автор опроверг замером —
    подтвердить независимо, и убедиться, что ОТБОР не выдаётся за ОБЛАСТЬ.
  my_verdict: АВТОР ПРАВ — подтверждаю независимо; оба утверждения проверены на дереве
  evidence_flat_read_forbidden:
    document: docs/specs/sub-phase-IAM-ID-2-membership-read-acceptance.md
    status: '✅ APPROVED — круг 7 (вердикт acceptance-reviewer), 2026-08-27 (шапка, строка 3)'
    quote_2_2_level_4: >-
      «Одиночное чтение живёт **только** на аккаунт-скоупном пути
      `GET /iam/v1/accounts/{accountId}/memberships/{membershipId}`, и аккаунт в нём —
      **обязательная часть отбора**, а не украшение пути: строка отдаётся, лишь если
      принадлежит названному аккаунту. Плоской формы `GET /iam/v1/memberships/{id}` не
      существует (§2.6).»
    quote_lane_C: >-
      «отмена держится **полосой C** гейта IAM-ID-2-15, которая красит плоское чтение по
      идентификатору независимо от автора и от того, какой документ его разрешил» и
      «Она красит плоское чтение по идентификатору **независимо от того, какой документ его
      разрешил**, — то есть держит свойство дерева, а не согласие двух текстов.»
    why_it_binds: >-
      Причина запрета названа там же и действует здесь дословно: идентификатор членства
      вычислим офлайн из пары, поэтому плоское чтение по нему задаёт вопрос «в каких
      аккаунтах состоит этот человек» арифметикой вместо параметра. Я подтвердил
      вычислимость деревом (membership_mirror_id, IMMUTABLE). Значит `account_id` в пути
      НУЖЕН, и прежнее указание диспетчера опровергнуто верно.
  selection_not_passed_off_as_scope:
    prephase: ДЕРЖИТ
    evidence: >-
      §1.1: «Сегмент `{accountId}` — часть ОТБОРА, а не украшение пути … Членство, не
      принадлежащее названному аккаунту, даёт промах независимо от прав вызывающего» и
      «**Областью решения о доступе сегмент НЕ является** — её называет `membership_id`».
      §4.1: «Редакция 2 называет область полем `membership_id`, а сегмент `{accountId}`
      несёт **отбор**». Сценарий S31E-03 утверждает это ИСХОДОМ, а не прозой.
    parent: НЕ ДЕРЖИТ — блокер B20-1 моей записи 24b4bf85….yaml (отбор назван «поле-область»)
    note: >-
      Асимметрия существенна: правит её родитель, а не предфаза. Предфаза формулировку уже
      нашла; родителю её и надо перенять.

dispatcher_decision_check:
  what_task_says: >-
    Решение диспетчера, внесено в §6.1: действующие прямые выдачи при смене объекта гейта
    ПЕРЕНОСЯТСЯ реконсайлером, а не объявляются снятыми; перенос обратим, снятие ломает
    держателей (ban #18); фаза migrate обязана быть доказана предикатом «не ноль на новом
    объекте», а не фактом запуска реконсайлера.
  substance: ЗАПИСАНО ВЕРНО И ПОЛНОСТЬЮ
  substance_evidence:
    - '§1.4 п. 2: «предикат перехода — ненулевое число кортежей на новом объекте при действующей выдаче, а не факт запуска реконсайлера»'
    - '§1.4 п. 3: contract — только после доказанной migrate'
    - 'S31E-13 (положительный близнец), S31E-14 (непроизошедшая перематериализация ОБЯЗАНА быть красной), S31E-15 (снятие только при «ноль на старом И не-ноль на новом»)'
    - 'DoD п. 9 повторяет все три условия'
    - 'ban #18 и обратимость названы дословно в §6.1'
  form: ЗАПИСАНО КАК ОТКРЫТЫЙ ВОПРОС, А НЕ КАК ПРИНЯТОЕ РЕШЕНИЕ
  form_evidence: >-
    §6.1 озаглавлен «Вопрос владельцу — один, и он несущий» и заканчивается «Пока ответа
    нет, сценарии S31E-13/14/15 описывают **первый** исход». То есть документ считает выбор
    неразрешённым, тогда как задание называет его принятым и делегированным.
  my_handling: >-
    НЕ блокер. По §3.8 моего чек-листа открытый вопрос с явно записанным умолчанием и
    названным обоснованием (обратимость, ban #18) — дефолтабельный, и он фиксируется
    вердиктом, а не возвращается. ФИКСИРУЮ ДЕФОЛТ ЯВНО: выдачи ПЕРЕНОСЯТСЯ; фаза migrate
    доказывается предикатом «не ноль на новом объекте при действующей выдаче». Вопроса
    владельцу этот пункт больше не порождает. Просьба к автору — важное замечание N2-3:
    переписать §6.1 из «вопроса» в «решение», сохранив обоснование.

