# ─────────────────────────────────────────────────────────────────────────────
carrying_claim_C1:
  question: воскрешает ли хоть один сценарий снятое §2.3 поле account_id
  author_claim: >-
    GetUserRequest/ListUserOperationsRequest несут account_id → 0; user.proto reserved 6 +
    reserved "account_id" → 2, @ kaname dd66b5be
  my_own_measurement:
    GetUserRequest_fields: [user_id]
    GetUserRequest_account_id: 0
    ListUserOperationsRequest_fields: [user_id, page_size, page_token]
    ListUserOperationsRequest_account_id: 0
    user_proto_reserved: 2
    user_proto_reserved_lines: ['42: reserved 6;', '43: reserved "account_id";']
  reverse_control:
    predicate_discriminates: true
    evidence: >-
      RemoveUserFromAccountRequest (user_service.proto:573, поле на :580) несёт account_id = 2 —
      значит «→ 0» выше различает предмет, а не отсутствие слова в файле. Контроль автора
      воспроизведён и верен.
  verdict_on_C1: >-
    ПОДТВЕРЖДЕНО как ЧИСЛО и ОПРОВЕРГНУТО как ДОВОД. Числа автора верны все три. Но вывод,
    который документ из них делает (§4: «аккаунт-скоупное чтение личности не имеет
    тенант-задаваемого поля account_id»), из них НЕ следует — см. блокирующий B2.

# ─────────────────────────────────────────────────────────────────────────────
blocking_findings:
  count: 4
  kinds: [CONSTRUCTIBILITY, SCOPE, CONSTRUCTIBILITY, COVERAGE]
  items:

    - id: B1
      kind: CONSTRUCTIBILITY
      title: >-
        «Аккаунт в СЕГМЕНТЕ пути» и «контракт запроса БЕЗ поля account_id» — не совместимы
        by construction; сценарии требуют состояния, запрещённого схемой связывания пути
      where: [§1.1, S31E-01, S31E-04, S31E-05, S31E-06, S31E-09, S31E-10, §5 DoD п.1, п.2]
      predicate_and_numbers:
        path_placeholder_is_always_a_request_field:
          kaname_iam_protos_at_dd66b5be: 'плейсхолдеров пути 64 · без соответствующего поля запроса 0'
          kacho_protos_at_8d70f599: 'плейсхолдеров 40 · кажущихся исключений 7 · подлинных 0'
          adjudication_of_the_7: >-
            Все семь — артефакт МОЕГО разбора, а не дерева: регулярное выражение по `rpc …`
            перебегало границу тела и привязывало шаблоны UpdateRules/UpdateRule к
            GetSecurityGroupRequest. Прочитано глазами: UpdateSecurityGroupRulesRequest несёт
            security_group_id, UpdateSecurityGroupRuleRequest несёт security_group_id и rule_id.
            Подлинных исключений ноль. Называю прямо, потому что первая форма предиката
            над-сообщала.
        option_contract_verbatim:
          source: project/kacho/proto/corelib/authz/v1/authz_options.proto:229-235
          text: >-
            «The api-gateway authz middleware builds the FGA Check object as `<object_type>:<id>`
            where the id is taken from `from_request_field`.» · «Name of the proto request field
            from which the scope id is taken. Must be a top-level field on the request message and
            a non-empty string.»
        edge_extraction_path_branch:
          source: project/kacho/gateway/internal/middleware/resource_extractor.go:130-149
          finding: >-
            ExtractFromHTTP ДЕЙСТВИТЕЛЬНО умеет брать величину из сегмента пути — но только из
            плейсхолдера, ИМЕНОВАННОГО тем же полем, что стоит в from_request_field, и при пустом
            поле немедленно возвращает "*". Сегмент — второй ИСТОЧНИК того же поля, а не
            замена полю. Сопровождающий комментарий (:151-155) называет это прямо: край обязан
            авторизовать объект, «the handler is about to act on», то есть ровно ту величину,
            которую grpc-gateway свяжет в поле сообщения.
      what_this_means: >-
        Чтобы маршрут GET /iam/v1/accounts/{accountId}/users/{userId} существовал, {accountId}
        обязан быть полем GetUserRequest — иначе шаблон нечего связывать. Значит «Тогда» S31E-05
        («контракт запроса не несёт поля account_id») и «Когда» S31E-01 («вызывает путь с
        сегментом аккаунта») описывают взаимоисключающие миры. Ни один сценарий не исполним, пока
        одно из двух утверждений не снято.
      why_scope_deferral_does_not_save_it: >-
        Документ выносит механизм в «Что НЕ входит» как выбор из двух: сырой сегмент против нового
        режима-источника scope_extractor. Выбора нет: первого варианта в дереве не существует
        (сегмент читается только как источник НАЗВАННОГО поля), второй требует ровно того поля,
        которое документ запрещает. Отложен не механизм, а несущее решение, и одна из двух его
        ветвей уже закрыта деревом. Приёмка называет НАБЛЮДАЕМОЕ, которого ни одна из ветвей не
        производит.
      remedy_is_the_authors: >-
        Исход выбирает автор, не я. Но он обязан быть один из трёх: (а) признать поле запроса
        законным (оно не есть снятое §2.3 поле — см. B2) и переписать S31E-05/10 на то, что
        действительно требуется; (б) отказаться от сегмента и назвать иную форму; (в) заказать
        новый источник сегмента как ПРЕДМЕТ с предикатом, а не вынести его из области.

    - id: B2
      kind: SCOPE
      title: >-
        §4 делает из своей же цитаты вывод, которого в ней нет: §2.3 снял ПОЛЕ РЕСУРСА
        User.account_id, а не поле-область запроса; §2.3а прямо требует брать объект ИЗ ПОЛЯ ЗАПРОСА
      where: [§4, §1.2, S31E-05, S31E-10, §5 DoD п.2, Обзор]
      quotes_verified_verbatim: true
      quote_1:
        source: 'родительская приёмка §2.3 (строки 2506-2511)'
        status: процитирована дословно
      quote_2:
        source: 'родительская приёмка §2.3а, врезка круга 3 (строки 2553-2557)'
        status: процитирована дословно
        decisive_fragment: >-
          «у края меняется то, из какого ПОЛЯ ЗАПРОСА берётся объект»
      the_source_the_document_did_not_read:
        section: 'родительская приёмка §1.5 «Контракт: где сегодня стоит аккаунт — пять мест, четыре разных смысла» (строка 1657)'
        table:
          - {place: 1, what: 'User.account_id = 6 — домашний аккаунт человека', outcome: 'СНЯТО с резервированием — это и есть предмет §2.3'}
          - {place: 2, what: 'InviteUserRequest.account_id = 1 — аккаунт, в который приглашают; вход анти-BOLA-гейта', outcome: 'ПЕРЕЕЗЖАЕТ вместе с глаголом, не снимается'}
          - {place: 3, what: 'ListUsersRequest.account_id = 4', outcome: снять}
          - {place: 4, what: 'внутренние сообщения, account_id = 2', outcome: 'ОСТАЮТСЯ — другой предмет'}
          - {place: 5, what: 'scope_extractor.from_request_field: "account_id" — объект, про который спрашивает гейт', outcome: 'у Invite переезжает; у RemoveFromAccount ОСТАЁТСЯ'}
        parent_says_verbatim: >-
          «Поле №2 нельзя просто вырезать. … Поле — это то, про что гейт задаёт вопрос; без него у
          гейта нет объекта, вызов становится unscoped и fail-closed, то есть глагол перестаёт
          работать вовсе.»
      finding: >-
        Документ отождествляет место 1 с местами 2/5. Поле запроса, называющее ОБЛАСТЬ решения о
        доступе, — это смысл 2/5, сохранённый родительской приёмкой явно; снятое §2.3 поле —
        смысл 1, поле РЕСУРСА, называвшее домашний аккаунт личности. Завести
        GetUserRequest.account_id как источник области НЕ значит воскресить User.account_id = 6:
        это разные поля в разных сообщениях с разными смыслами. Обратное утверждение документа
        («снятое §2.3 поле не воскресает» как довод против поля запроса) — подмена референта.
        Расхождение приёмки со спекой разрешается в пользу спеки.
      landed_confirmation: >-
        Посаженное чтение членства IAM-ID-2 (kaname @ dd66b5be,
        proto/kaname/cloud/iam/v1/membership_service.proto:138-148) делает ровно это:
        get: "/iam/v1/accounts/{account_id}/memberships/{membership_id}" при
        GetMembershipRequest{account_id = 1, membership_id = 2}, scope_extractor
        {object_type: "account", from_request_field: "account_id"}. Комментарий поля в контракте:
        «Аккаунт, в котором читается членство. ОБЯЗАТЕЛЕН: он и есть объект, про который край
        спрашивает модель прав». То есть «биндит аккаунт ПОЛЕМ» — это не дефект образца, а
        механизм, которым сегмент вообще доходит до гейта.

    - id: B3
      kind: CONSTRUCTIBILITY
      title: >-
        Композит iam_membership:<accountId>:<userId> не производим ни одной из двух сторон,
        байт-совпадение которых он объявляет; у членства уже ЕСТЬ неизменяемый id mbr-<17>,
        и документ не упоминает его ни разу
      where: [§1.2, §1.3, S31E-11, S31E-12, §5 DoD п.6, «Предмет ровно три» п.3]
      producers_measured:
        reconciler:
          source: 'kaname internal/apps/kaname/api/access_binding/reconcile/tuples.go:69 и reconcile.go:451'
          builds: 'fmt.Sprintf("%s:%s", fgaType, objectID) — ОДИН objectID, одно поле'
        edge:
          source: 'kacho gateway/internal/middleware/authz.go (descriptor.ResourceType+":"+descriptor.ResourceID)'
          builds: 'ResourceType + ":" + ResourceID — ОДИН ResourceID, из ОДНОГО названного поля'
        catalog_survey:
          source: 'kacho gateway/internal/middleware/embed/permission_catalog.json @ 8d70f599'
          distinct_from_request_field_values: '20+ (project_id 43 · account_id 14 · user_id 10 · instance_id 17 · …)'
          composite_two_field_sources: 0
          control: >-
            предикат различает — он печатает два десятка разных значений, а не пустоту
      landed_membership_id:
        form: 'mbr-<17>, дефис-канон'
        db_check: >-
          kaname internal/migrations/0001_initial.sql:2169 —
          CONSTRAINT memberships_id_form_check CHECK (id ~ '^mbr-[0-9abcdefghjkmnpqrstvwxyz]{17}$')
        minted_deterministically: >-
          kaname internal/migrations/0001_initial.sql:1254 —
          SELECT 'mbr-' || substr(md5('membership:' || p_user_id || ':' || p_account_id), 1, 17)
        contract: 'kaname proto/kaname/cloud/iam/v1/membership.proto:30 — «Resource id prefix: `mbr-`»'
        document_mentions_mbr: 0
      finding: >-
        S31E-11 объявляет побайтовое равенство строки объекта у края и у реконсайлера, но ни одна
        из сторон не умеет собрать двухчастный идентификатор: обе склеивают тип с ОДНИМ
        идентификатором, а край берёт его из одного названного поля. Производителя у «Тогда» нет
        — не «ещё не написан», а не выразим объявленным механизмом. Одновременно у объекта уже
        есть внешне-адресуемый неизменяемый id (mbr-<17>), которым ban #15 велит ключевать
        authz-target и grant-scope; документ его не принимает и не отвергает — он о нём молчит.
        Молчание здесь и есть дефект: выбор между mbr-<17> и парой — несущее решение приёмки,
        объявившей строковую схему своим третьим предметом.
      note_for_the_author: >-
        Родительская приёмка (круг 9, усилено кругом 11) признала ПАРУ естественным ключом
        членства — но для ГЛАГОЛА СНЯТИЯ, и на том основании, что областью решения там является
        аккаунт. Она же оставила mbr-… внешне-адресуемым идентификатором для ЧТЕНИЯ
        (IAM-ID-1-64). Перенести довод о снятии на строку authz-объекта чтения нельзя молча:
        это отдельное решение, и его надо принять явно, с предикатом.

    - id: B4
      kind: COVERAGE
      title: >-
        Заявленная параллельность с IAM-ID-2 не выполняется в решающей точке: посаженное чтение
        членства гейтится объектом account/viewer, а не объектом членства; типа iam_membership
        нет ни в модели, ни в каталоге, и документ не называет этого расхождения
      where: [§1.1, §1.2, S31E-12, §5 DoD п.7]
      measured:
        iam_membership_in_fga_model:
          source: 'kaname internal/authzmodel/fga_model.fga @ dd66b5be'
          types_declared: 33
          membership_type_present: 0
        iam_membership_in_permission_catalog:
          source: 'kacho gateway/internal/middleware/embed/permission_catalog.json @ 8d70f599'
          object_type_iam_membership: 0
          control: 'object_type iam_user 10 · account 14 — предикат находит соседей, значит различает'
        landed_membership_rpc_gate:
          Get: 'required_relation "viewer", scope_extractor {object_type: "account", from_request_field: "account_id"}'
          List: 'required_relation "viewer", тот же экстрактор'
          Create: 'required_relation "editor", тот же экстрактор'
      finding: >-
        §1.1 объявляет целевую форму «параллельной» IAM-ID-2. По ПУТИ параллельность есть, по
        ГЕЙТУ её нет: образец спрашивает viewer на account, документ — v_get/v_list на композите
        членства. Это законный выбор, но он ОТЛИЧИЕ, а не параллель, и в документе не назван.
        Отдельно: §1.2 объявляет источником отношения super_admin названного аккаунта, тогда как
        образец опирается на viewer/editor; какой из двух источников действует и как они
        соотносятся, документ не решает. Сценарий S31E-03 («рядовой член → промах») при образце
        viewer@account дал бы противоположный исход — то есть у него нет однозначного «Тогда»,
        пока источник отношения не назван.

  # ─────────────────────────────────────────────────────────────────────────────
important_findings:
  - id: N1
    kind: FORMAT
    title: побайтовое равенство утверждается, но ожидаемые байты не названы
    where: [S31E-02, S31E-03, S31E-07, S31E-08, S31E-12, §5 DoD п.4]
    text: >-
      Пять сценариев требуют ответа, «побайтово равного настоящему промаху», и ни один не
      называет ни самой строки, ни координаты строки таблицы форм, с которой её сверять.
      Производитель назван (permission_denied_response.go — существует), но утверждение о
      БАЙТАХ без названных байтов проверяется только через сам продукт, то есть зеленеет при
      любой согласованной паре. Назвать эталон: либо ожидаемое тело, либо «строка таблицы для
      типа X равна строке для типа iam_user», с предикатом сверки.

  - id: N2
    kind: FORMAT
    title: родитель назван по ИМЕНИ и «APPROVED», без отпечатка — и файл правлен после одобрения
    where: [шапка, строки 9-11]
    measured:
      parent_sha256_today: a8fd4f943e243a0d956619532e615f7b7b6795889c04cdd4cd447896f0539b99
      parent_edits: >-
        9de4f372 (2026-09-13) · 37ee702d (2026-08-25) · 4e37e76e (2026-08-25); одобрение — круг 12,
        2026-08-24, то есть правка 9de4f372 легла ПОСЛЕ него
      parent_sha256_by_commit:
        9de4f372: a8fd4f943e243a0d
        37ee702d: '8524378966118b07'
        4e37e76e: a74960bb30ab0d70
    text: >-
      change-graph.md §2: вердикт привязан к отпечатку, а не к файлу по имени. Документ строит
      всю согласованность (§4) на родителе, названном именем и словом APPROVED. Назвать
      отпечаток редакции, которую автор читал.
    separate_fact_for_the_dispatcher: >-
      Отпечаток c5937b4e, названный ЗАДАНИЕМ как родительский и APPROVED, в этом дереве не
      резолвится ни во что: git cat-file -t c5937b4e → «Not a valid object name»; ни одна из трёх
      редакций родителя не даёт sha256 с таким префиксом; поиск строки по *.md и *.yaml
