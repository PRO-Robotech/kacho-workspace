method_verdict: >-
  Посевом ничего не проверено: службы notify в дереве нет, стенда и разрешения на посев в задании
  нет. Координаты §1 и §8 в дереве kacho @1d42a6728bf и kaname @cbbac984b перемерены и сошлись.
  B3-1 основан на перемере соседа NTF-3 по текущему отпечатку 3a511717…. B3-2 основан на записи
  ревью NTF-5 @47ac6f8b, постановке диспетчера и измерении края. Замечания круга 2 B2-2, B2-3,
  B2-4 и B2-5 закрыты. B2-1 закрыт на 301c23dc, но снова открыт сменой редакции производителя
  (B3-1).
