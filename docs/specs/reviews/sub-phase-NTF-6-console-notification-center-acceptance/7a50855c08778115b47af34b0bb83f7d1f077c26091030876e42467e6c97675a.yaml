  - id: B3-1
    kind: PRODUCER
    scenarios: [NTF6-02, NTF6-04, NTF6-05, NTF6-06, NTF6-07, NTF6-09, NTF6-10, NTF6-11, NTF6-12, NTF6-13, NTF6-14, NTF6-15, NTF6-16, NTF6-17, NTF6-18, NTF6-20, NTF6-21, NTF6-22, NTF6-24, NTF6-25, NTF6-26, NTF6-27, NTF6-28, NTF6-29, NTF6-31, NTF6-32, NTF6-33, NTF6-34, NTF6-35, NTF6-36, NTF6-49, NTF6-52, NTF6-53]
    title: >-
      Производитель S1 и S2 в текущей редакции записал другой контракт, и назвал его ответом на
      заказ этого документа. Два документа разошлись навстречу друг другу.
    evidence: >-
      docs/specs/sub-phase-NTF-3-kacho-modules-notifications-acceptance.md, отпечаток 3a511717…
      (редакция 6, строка шапки 21). Р29 (строки 952-990) и «Решение по заказу NTF-6 Р3а
      (@c82cd21b) — API принадлежит этой приёмке, NTF-6 правится по этому столбцу» (строки
      980-990, также 356-358 и 1030). Расхождения с §1.7 и Р3а документа:
      (1) лента — GET /notify/v1/inboxItems (строки 581, 988), а у NTF-6 — /inbox;
      (2) настройки — NotificationPreferences{entries[], digest_period, seen_up_to}: ячейки
      {module, kind, channel, state, explicit} правятся через POST /notify/v1/preferences:setEntries,
      а маска PATCH знает только {digest_period, seen_up_to} (строки 594-613). У NTF-6 — rules[] и
      PATCH с маской rules (NTF6-27, 28, 29, 31);
      (3) каталог GET /notify/v1/catalog есть (строки 959-975), а §1.7 п.3 и Р5 утверждают, что
      его нет;
      (4) подписки — /notify/v1/notificationSubscriptions с kinds и channel (строки 620-633), у
      NTF-6 — /notify/v1/subscriptions с eventClasses (NTF6-33…36, 53, DoD 6);
      (5) «Вид» — пять значений, в том числе IDENTITY_SECURITY и CREDENTIAL_EXPIRING с ячейкой
      ALWAYS. На этом стоят NTF6-24 (три строки), NTF6-25 и NTF6-28 (значение SECURITY вне
      перечисления). Номера строк и ID сценариев NTF-3, названные в §8 (NTF3-73…92, 146, 148), —
      это координаты редакции 301c23dc, а её заменила редакция производителя. Сама редакция 6
      NTF-3 внутренне несогласована (строки 1498 /inbox, 1607 eventClasses) — это предмет её
      ревьюера. Р3в в редакции 6 не принят (grep 'Р3в' → 0).
    required_change: >-
      Автор этого не исправит новой редакцией в одиночку: документы опять разойдутся. Сначала
      диспетчер закрепляет одного владельца формы публичного API notify. По постановке это NTF-3:
      «API настроек и контактов в notify». NTF-3 объявляет то же в Р29. Затем NTF-3 доводится до
      внутренне согласованной редакции, и только после этого NTF-6 перестраивает §1.7, Р3а, Р5, Р6,
      Р18, Р19 и сценарии S1/S2 на её отпечаток. Решение Р3в (поля module, resourceType, projectId
      элемента ленты) нужно получить в той же редакции NTF-3. Если диспетчер выберет обратное
      (NTF-6 заказывает, NTF-3 следует), NTF-3 откатывает Р29, и для NTF-6 это строка спора.
  - id: B3-2
    kind: OPEN-QUESTION
    scenarios: [NTF6-37, NTF6-38, NTF6-39, NTF6-41, NTF6-42, NTF6-43, NTF6-44, NTF6-45, NTF6-46, NTF6-50, NTF6-54]
    title: >-
      S3 утверждает контракт контактов, у которого дом не решён. Производитель, на котором S3
      построена, возвращён именно по этому предмету.
    evidence: >-
      S3 построена на NTF-5 Р21 @47ac6f8b (ContactService, /notify/v1/contacts, пара «область ×
      категория», без id). Запись ревью NTF-5 на этот отпечаток — CHANGES_REQUESTED, блокирующий
      SCOPE «У контактов три несовместимых контракта в трёх текущих приёмках эпика».
      Постановка диспетчера относит «API настроек и контактов в notify» к NTF-3. NTF-3 р.6
      (строка 990) держит контакт безопасности полем аккаунта по
      /notify/v1/accounts/{accountId}/contacts, а категории и проект отдаёт NTF-5. Документ сам
      признаёт спор (§1.7 п.5, Р13: «S3 — после … решения диспетчера по двум спорам»). Второй спор
      — код отказа по полу: NTF-5 З11 и NTF5-102 требуют 403, край производит 401
      (stepup.spec.ts:113-126, измерено). Утверждения «Тогда» одиннадцати сценариев (пути, тело
      PATCH, форма DELETE с запросом, source, 401) зависят от ответа на эти вопросы. Такой вопрос
      для реализации критичен, и закрыть его умолчанием на ревью нельзя.
    required_change: >-
      Диспетчер решает дом контракта контактов и код отказа по полу. После этого S3 пишется на
      одобряемую редакцию выбранного производителя. Другой путь — вынести S3 из объёма этой
      приёмки: снять или отложить сценарии с открытой задачей, с предикатом «решение диспетчера
      записано» и без утверждений «Тогда» о несуществующем контракте. Тогда одобрение S1/S2
      возможно раньше.

