premise_check:
  premise: >-
    Задание исходит из того, что редакция 6 закрывает четыре пункта разбора классов на d5fe4734
    (CX6-01, 02, 04, 07) и согласована с Д1–Д16.
  result: confirmed
  detail: >-
    CX6-01 закрыт. Р10а объявляет NOTIFY_SOURCE_BY_OWNER одним местом, исчерпывающим по типу
    JournalOwner. Гейт сверяет его с журналами дерева и с ведомостью внешнего журнала (она есть в
    дереве). subjects.test.ts обходит все 23 записи. NTF6-60 проходит карточку группы целей, где
    написания расходятся; его Given строится из существующих функций и допустимого тела.
    CX6-02 закрыт. Р20 кладёт клиент, счёт и загрузчик в shared (импорты внутри shared идут через
    @shared). DoD 6 переписан и больше не красит верную реализацию. Координаты §8 переведены:
    ссылок на notify/src/api и host/src/lib/unread-count в §8 и §9 ноль.
    CX6-04 закрыт. У Р2 есть канал во время работы (/console-config.json, отрендеренный чартом) и
    три исхода с видимым «не прочитано». NTF6-61 проходит канал на стенде, который ставит uif
    подчартом; NTF6-47 утверждает тело ответа.
    CX6-07 закрыт. Р7 проверяет сегменты isPlatformId до ResourceLink. У NTF6-16 две ветки,
    gamma и delta, и у каждой близнец alpha, отличающийся одним фактом.
    По Д14: надзор администратора облака над лентой не утверждает ни один сценарий. По Д15: своего
    контракта и заказов нет, заказ resourceTypes[] к NTF-3 явно отвергнут. По Д16: документ в
    ветке, статическая форма DRAFT.

blocking_findings: []

non_blocking_findings:
  - "[PRODUCER] Гейт console_notify_source_key_test.go (Р10а) сверяет NOTIFY_SOURCE_BY_OWNER с каталогом службы в дереве (services/<каталог>) и с последним сегментом пути модуля. Ключ модуля каталога notify производит NTF-3: перечень источников выводится из объявления флага, а сборка идёт по своей таблице. Каталог службы — только заместитель этого ключа. Если NTF-3 назовёт модуль иначе, чем каталог, гейт останется зелёным. Сквозной держатель есть на одном модуле (NTF6-60, nlb). Когда в дереве появится таблица сборки или перечень источников notify, гейт стоит перевести на неё. До тех пор посылку «ключ модуля = каталог службы» лучше назвать в Р10а со ссылкой на NTF3-149."
  - "[COVERAGE] Три пункта разбора классов, которые аналитик держит «заказом модульной пробы», в DoD не названы. CX6-05: ветки «опоздавший ответ цикла» и «опрос в полёте во время отметки». Текст Р18 правило задаёт, но DoD 2 этих веток не перечисляет. CX6-08: «Вы подписаны» и перечень кандидатов обязаны выводиться обходом до пустого nextPageToken, а Р10 и Р11 обход не требуют. CX6-11: отказ каталога или настроек на экране настроек. Р2 это правило задаёт, но модульной пробы NotificationSettingsPage в DoD нет. Ни одно «Тогда» от этого не ложно, поэтому пункты не блокируют. Их надо отобразить в решения замысла и перепроверить на ревалидации разбора классов."
  - "[FORMAT] Р7 требует непустой projectId для любой ссылки. resourceDetailHref для спек службы доступа projectId не читает, поэтому строка ленты о ресурсе без проекта потеряла бы ссылку. Сегодня такой строки нет: у kaname нет ячейки CONSOLE (NTF3-149). Формулировку «projectId проверяется, когда спека проектная» можно внести при следующей правке."
  - "[FORMAT] Условие CX6-07 предлагало кодирование сегмента вторым рубежом. Р7 от него отказывается и записывает причину: на принятом алфавите кодирование тождественно, а в общей функции адреса оно сменило бы поведение остальных вызывающих. Решение законное. Ревалидации разбора классов стоит отметить это как принятое отклонение от условия."
  - "[PRODUCER] Отпечатки NTF-1 (b347b81f) и NTF-5 (263b95d0) в ветке уже сменились (коммиты 2fa62337b и de3ba2e0c). Опора документа в обоих сохранилась: у NTF-1 это Р9 и NTF1-N01, у NTF-5 — Р22. Р13 требует пересверки с одобренными редакциями до старта, этого достаточно."

