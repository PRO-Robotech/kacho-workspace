non_blocking_findings:
  - "[FORMAT] G0 говорит, что registerAndSignIn даёт acc-A, но Tenant (fixtures.ts:111) несёт только {email, projectId}; id аккаунта нужен шагу 3 G1 и путям /notify/v1/accounts/<acc-A>/contacts. Готовая функция onlyAccount живёт в users.spec.ts:53 и в перенос Р14 не названа. Состояние строится (аккаунт существует и читается GET /iam/v1/accounts), но без названного источника id пробы S3 рискуют завести копию onlyAccount — это тот класс «три места об одном», против которого написан Р14. Добавить onlyAccount в перенос Р14 и в DoD 14."
  - "[NEGATIVE] NTF3-157 утверждает 503 и на PATCH контактов; консольного сценария есть только на GET (NTF6-58). Отображение отвергнутого PATCH уже закреплено отрицаниями 400 и 403 (NTF6-41, 45, 46) и общим правилом Р2, поэтому это не блокирует. Если сценарий понадобится, близнецом будет NTF6-38."
  - "[FORMAT] NTF6-59, последнее And («в Мои подписки строки этой сети нет») истинно по построению: POST подменён и до сервера не доходит. Держат сценарий утверждения о карточке и опросе операции. Строку можно снять или пометить как контроль, чтобы её не считали доказательством."
  - "[PRODUCER] Отпечаток NTF-3 62d42441 снова не лежит в коммите: сосед правится без коммита и уже ушёл на 0654310d. Форма перемерена и совпадает. Р13 требует пересверки с одобренной редакцией NTF-3 до старта; этого достаточно."

