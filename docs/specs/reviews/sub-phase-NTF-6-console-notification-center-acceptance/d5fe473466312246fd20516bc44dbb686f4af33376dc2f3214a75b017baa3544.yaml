premise_check:
  premise: >-
    Задание исходит из того, что редакция 5 закрывает круг 1 прохода (B4-1 CONSTRUCTIBILITY,
    B4-2 NEGATIVE) и согласована с Д1–Д16.
  result: confirmed
  detail: >-
    B4-1 закрыт: §1.6 описывает secondAccountMembership по её коду; G1 собран четырьмя шагами из
    функций, которые существуют в дереве с названными сигнатурами; обобщение inviteIntoAccount
    принимает аккаунт и страницу приглашающего, и приглашение в дереве проб остаётся одним
    (DoD 14). B4-2 закрыт: три метода Р25, дающие UNAVAILABLE, получили сценарии консоли с
    близнецами, отличающимися одним фактом (NTF6-56/07, 57/10, 58/37, 59/33); Р2 разводит сбой
    загрузки модуля и отказ данных; Р18 записывает поведение счётчика при отказе. Д14 предмета
    консоли не касается — ни один сценарий не утверждает надзор администратора облака над лентой.
    Д15 соблюдено: своего контракта и заказов нет. Д16 соблюдено: документ в ветке, статическая
    форма DRAFT.

