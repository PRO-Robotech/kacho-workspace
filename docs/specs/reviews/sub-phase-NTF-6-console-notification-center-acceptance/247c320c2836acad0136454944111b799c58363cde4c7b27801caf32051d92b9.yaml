blocking_findings:
  - id: B1-1
    kind: PRODUCER
    scenarios: [NTF6-04, NTF6-05, NTF6-09, NTF6-13, NTF6-14, NTF6-17, NTF6-20, NTF6-21, NTF6-24, NTF6-26, NTF6-27, NTF6-33, NTF6-34, NTF6-47]
    title: >-
      Производитель S1-ядра опровергнут соседним контрактом: G0 требует «флаг включён у vpc», а
      «Тогда» — строку «сеть создана»; NTF-3 на измеренной редакции vpc не подключает и событий
      создал/обновил/удалил не производит. Производителя флага по модулю в NTF-1 нет.
    evidence: >-
      docs/specs/sub-phase-NTF-3-kacho-modules-notifications-acceptance.md @8a3165cc §3: «vpc — не
      подключается … нет каталога notifications/, нет таблицы ленты, нет сервера ленты, нет записи в
      перечне источников notify»; подключается один storage (volume-error, snapshot-error,
      image-error); registry тоже не подключается. grep 'сводк' в NTF-3 → 0. В NTF-1 @077e9fff
      объявления global.kacho.notifications.* нет (grep → 0). Документ в §1.7 измерил у NTF-3 только
      отсутствие /notify/v1 и в Р3/Р13 не заказывает ни событий ресурсов vpc, ни флага.
    required_change: >-
      Заказать недостающее явно: в Р3 (или отдельном Р) — «события ресурсов модулей kacho (Д10,
      ТВ4: создал/обновил/удалил) в ленте консоли и каталоге» с производителем NTF-3, и «флаг по модулю
      Д7 с выведенным перечнем источников» с производителем NTF-1; Р13 гейтить стадии и на них; §1.7
      дополнить измерением NTF-3 §3. Либо перестроить Given S1 на единственный производимый источник.
      Противоречие NTF-3 §3 с ТВ4/Д10 — строкой спора в возврат.
  - id: B1-2
    kind: CONVENTION
    scenarios: [NTF6-05, NTF6-11, NTF6-27, NTF6-28, NTF6-30, NTF6-38, NTF6-42, NTF6-43]
    title: >-
      Заказанная форма контракта (Р3) расходится с конвенциями API, и документ фиксирует её
      («NTF-3 вправе переименовать только правкой обоих документов»).
    evidence: >-
      (а) PATCH /notify/v1/preferences с updateMask-путями entries.<module>.<kind>.<channel> по
      repeated-полю entries[] — путь маски не адресует элемент повторяющегося поля, а динамические
      ключи из каталога не выражаются known-set’ом единой маски (api-conventions.md
      api-mask-unknown, api-mask-parity). (б) Контакты — PATCH /notify/v1/contacts на коллекцию без id
      и «DELETE переопределения проекта» без пути (NTF6-43 When без адреса): ресурс без id и без
      REST-пути (api-rest-paths, ban15-id-addressing). (в) Порядок ленты createdAt убыв. — отступление
      от api-pagination-cursor (created_at, id) ASC без записанного решения. (г) Точный счётчик >99
      (NTF6-11 «непрочитанных: 150») при сужении «то же множество, что лента» требует проверки прав
      на неограниченном множестве — против security.md §«Get/List: проверка прав постранично».
    required_change: >-
      Выразить правку ячейки конвенционно (например :verb с {module, kind, channel, enabled}
      либо ресурс ячейки с id), контакту дать id и путь, NTF6-43 — конкретный запрос; порядок
      ленты — записанным решением-исключением с основанием; счётчик — ограниченный (например,
      не больше 100 с признаком «больше»), NTF6-11 утверждать по нему.
  - id: B1-3
    kind: CONSTRUCTIBILITY
    scenarios: [NTF6-40, NTF6-45, NTF6-46]
    title: >-
      Нетривиальные Given без названного строителя: право «читать контакты без права правки» не
      названо ни ролью, ни отношением; «член аккаунта с неподтверждённой почтой, вошедший» — без
      фикстуры.
    evidence: >-
      Р3 строка «контакты» называет отказ PERMISSION_DENIED AUTHZ_DENIED, но не заказывает у
      kaname/NTF-3 отношения чтения и правки контактов и их держателей по умолчанию; §8 NTF6-45/46
      отсылает к «манифест notify, NTF-3», где их нет. По NTF-2 зарегистрированный без
      подтверждения находится в положении подтверждения (рубеж Ф6); сценария его приглашения и
      членства нет ни у NTF-2, ни в fixtures.ts.
    required_change: >-
      Назвать отношения (чтение/правка контактов аккаунта и проекта), кто их держит по умолчанию,
      роль, дающую только чтение, и заказать это в Р3; для NTF6-40 — назвать фикстуру, строящую
      члена с неподтверждённой почтой, либо заменить отказ на достижимое состояние (например, не
      ACTIVE) с близнецом.
  - id: B1-4
    kind: TWIN
    scenarios: [NTF6-20]
    title: "Близнец NTF6-20 (NTF6-04) отличается больше чем одним фактом."
    evidence: >-
      В NTF6-04 читает владелец U-A (создатель); в NTF6-20 — другой человек U-B, приглашённый без
      роли. Отличаются читающий, его членство и наличие роли. Положительный «U-B с ролью на prj-A
      видит строку» есть только как Given NTF6-21, не как утверждение.
    required_change: >-
      Завести положительного близнеца: U-B с прямой ролью на prj-A видит строку о net2 и счётчик
      растёт; NTF6-20 — то же без роли.

