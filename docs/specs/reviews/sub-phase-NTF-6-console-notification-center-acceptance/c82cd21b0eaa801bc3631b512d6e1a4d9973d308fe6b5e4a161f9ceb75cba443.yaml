blocking_findings:
  - id: B2-1
    kind: PRODUCER
    scenarios: [NTF6-04, NTF6-05, NTF6-06, NTF6-08, NTF6-09, NTF6-10, NTF6-11, NTF6-12, NTF6-13, NTF6-14, NTF6-22, NTF6-24, NTF6-27, NTF6-28, NTF6-31, NTF6-33, NTF6-35, NTF6-36, NTF6-37, NTF6-38, NTF6-40, NTF6-41, NTF6-42, NTF6-43, NTF6-44, NTF6-45, NTF6-46, NTF6-50, NTF6-51]
    title: >-
      Заказанный производитель NTF-3 в текущей редакции записал другой контракт по каждой строке
      Р3а и Р3г. §1.7 («NTF-3 не несёт ничего») устарел, а спор нацелен на состояние, которого уже нет.
    evidence: >-
      docs/specs/sub-phase-NTF-3-kacho-modules-notifications-acceptance.md @301c23dc. (1) Лента:
      GET /notify/v1/inbox (Р9), а не /inboxItems. Состояние прочтения — одна позиция seen_up_to в
      NotificationPreferences (строка 556, правка PATCH с маской seen_up_to, NTF3 строка 1387). Нет
      :markRead по элементам, нет :countUnread {count, exact}. (2) Настройки: rules[]{module,
      event_class} → mail_enabled, event_class — закрытое перечисление RESOURCE_CHANGE | STATE_CHANGE |
      OPERATION_FAILED, правка PATCH с маской. Нет измерения «канал», нет вида и нет :setEntries.
      (3) Каталога GET /notify/v1/catalog нет (grep → 0). (4) Подписки: /notify/v1/subscriptions,
      target{resource|project} + event_classes, недоступная цель — FAILED_PRECONDITION
      PEER_RESOURCE_MISSING (строка 584). (5) Контакты: AccountNotificationContacts{account_id,
      security} по GET/PATCH /notify/v1/accounts/{accountId}/contacts (строка 713). Одна категория,
      переопределения проектом нет. Строки 328-330: «Переопределение проектом и прочие категории
      заводятся с первым читателем в NTF-5». Два документа об одном контракте противоречат друг
      другу во всех пяти пунктах. Документ NTF-6 оговаривает: «адресат вправе переименовать только
      правкой обоих документов». Этого условия не выполнено ни с одной стороны.
    required_change: >-
      Свести контракт с NTF-3 в одну форму: либо принять контракт NTF-3 и перестроить Р3а, Р3г и
      сценарии на него, либо перечислить в строке спора каждое расхождение (1)–(5) поимённо.
      Какой документ уступает, решает диспетчер. §1.7 перемерить на текущем отпечатке NTF-3.
      Стадию S3 связать с тем, где на самом деле лежит производитель трёх категорий и
      переопределения проектом (по NTF-3 — NTF-5).
  - id: B2-2
    kind: PRODUCER
    scenarios: [NTF6-02, NTF6-09, NTF6-24, NTF6-34, NTF6-47]
    title: >-
      Производитель флага (NTF-1 Р9) назван координатой, которой на названном отпечатке нет. Опровержение
      возражения круга 1 ложно в том виде, в каком оно записано.
    evidence: >-
      §1.7 утверждает: «строки 416 и 1392 @9c442b0d; отпечаток файла — 077e9fff…; посылка возражения
      („grep → 0“) не воспроизводится». Перемерено:
      git show 9c442b0d:docs/specs/sub-phase-NTF-1-notification-gateway-core-acceptance.md | sha256sum →
      077e9fff…, и на этом содержимом grep -cE 'notifications\.enabled|global\.kacho\.notif' → 0.
      Объявление есть только в рабочей редакции NTF-1, которая ещё не одобрена: на отпечатке a6cb0c1f
      это строки 459 и 1462 (в начале ревью, на 53e35308, — 458 и 1444). Р9 там называется «Р9 (Д7)».
    required_change: >-
      Сослаться на редакцию NTF-1, в которой объявление действительно есть, с её отпечатком и
      строками. Снять утверждение, что посылка круга 1 не воспроизводится. Признать, что
      производитель флага — неодобренная редакция NTF-1, и гейтить им стадии через Р13.
  - id: B2-3
    kind: CONVENTION
    scenarios: [NTF6-35]
    title: >-
      Подписка на чужой ресурс, недоступный или несуществующий, отвечает NOT_FOUND 404. Ресурс
      принадлежит vpc, а для чужого ресурса линия проверки у владельца обязывает отвечать
      FAILED_PRECONDITION.
    evidence: >-
      Р3а, строка «подписки»: «NOT_FOUND 404 — ресурса нет или нет права v_get». NTF6-35: «первые
      два ответа — 404, code = 5». Конвенция api-lane-peer-validate: «нет или не то состояние у
      владельца → FAILED_PRECONDITION», red: «NOT_FOUND на чужой ресурс». vpc_network принадлежит vpc
      (owner-map), notify — потребитель. reason в NTF6-35 не назван (api-reason-both-sides). Сосед
      NTF-3 @301c23dc, строка 584, отвечает по той же конвенции: FAILED_PRECONDITION
      PEER_RESOURCE_MISSING, побайтно одинаково для обоих случаев.
    required_change: >-
      Р3а и NTF6-35: отвечать 400 с code = 9 (FAILED_PRECONDITION) и reason = PEER_RESOURCE_MISSING
      (либо записанным исключением, как Р16, с основанием), тела побайтно равны. NOT_FOUND 404
      оставить для DELETE чужой подписки: это свой ресурс notify, и там код верен.
  - id: B2-4
    kind: CONSTRUCTIBILITY
    scenarios: [NTF6-04, NTF6-05, NTF6-08, NTF6-13, NTF6-14, NTF6-17, NTF6-51, NTF6-28]
    title: >-
      Ядро S1 недостижимо по собственному правилу документа: Р3б ограничивает аудиторию ленты
      «прямой ролью на проекте», а U-A такой роли не имеет. Кроме того, у Given NTF6-28 (вид класса
      S в каталоге стенда) нет строителя.
    evidence: >-
      (а) Р3б: «Аудитория строки ленты о событии ресурса — пользователи с прямой ролью на проекте
      ресурса (Д8)». U-A заведён registerAndSignIn как владелец аккаунта. В kaname @cbbac984b
      internal/apps/kaname/api/account/create.go (ownerTuples) выдача владельца —
      user:<owner>#owner@account:<A>. В …/api/project/create.go:166-207 доступ владельца к проекту
      материализуется из привязки аккаунта, привязки на области project:<id> нет. Сосед NTF-3 @301c23dc,
      строка 436, определяет прямую роль как «привязку с субъектом user:<id> на области project:<id>;
      роль на аккаунте … не входит». Поэтому NTF6-04 («U-A видит строку о своей сети») и зависящие
      от него сценарии противоречат Р3б. Д8 «прямую роль» относит к умолчанию СВОДКИ, для ленты в Д8
      — «всегда», право — v_get. NTF-3 (строка 431) даёт ленту «всем, кому видно». Ограничение
      аудитории ленты прямой ролью приписано Д8 без строки спора.
      (б) NTF6-28: «вид класса S из каталога стенда <s-kind> модуля <s-module>». Ни Р3а, ни Р3б не
      заказывают вида S в каталоге. Шаблоны S kaname в NTF-2 идут почтой (NTF-2, строка 347).
      Предпосылка DoD 13 проверяет только vpc и registry.
    required_change: >-
      (а) Привести аудиторию ленты к Д8 («всегда», право v_get в момент чтения, постранично — как в
      Р3г) и снять «прямую роль» из Р3б. Если ограничение нужно, выдать U-A в G0 прямую роль на
      prj-A и заявить отступление от Д8 строкой спора. (б) Назвать производителя вида S в каталоге и
      заказать его. Вписать в предпосылку DoD 13 «в каталоге есть хотя бы один вид класса S». Если
      такого вида не будет, перестроить NTF6-28 на вид, который заведомо есть.
  - id: B2-5
    kind: TWIN
    scenarios: [NTF6-45]
    title: "Близнец NTF6-45 (ветка чтения NTF6-46) отличается тремя фактами, а §6 объявляет один."
    evidence: >-
      NTF6-45 Given: «G0, G1; у U-B нет привязок notify.contact_assignment.*». Сессия уровня 1,
      назначений нет. NTF6-46 Given: «исход NTF6-38 (назначение OPERATIONS → U-B); роль .view; сессия
      U-B уровня 2». Различаются привязка, наличие назначения и уровень сессии. Строка §6 «NTF6-45 |
      NTF6-46 (чтение) | есть / нет привязки view» не соответствует тексту. В §11 заявлено, что класс
      осмотрен по всей таблице; этот пункт осмотр пропустил.
    required_change: >-
      Завести положительного близнеца чтения, отличающегося от NTF6-45 только привязкой .view
      (G0, G1, та же сессия, тот же набор назначений), либо привести Given NTF6-45 к Given ветки
      чтения NTF6-46 во всём, кроме привязки.

non_blocking_findings:
  - "[CONSTRUCTIBILITY] G1 описывает приём приглашения «церемонией NTF-2». Существующая фикстура строит ACTIVE иначе: U-B сначала регистрируется, потом приглашается, и членство сразу ACTIVE (ui-future/e2e/specs/users.spec.ts:195-197, 229-262). Сослаться на неё. Для PENDING (NTF6-40) назвать строителя явно: приглашение ещё не зарегистрированной почты, без входа."
  - "[PRODUCER] Строки классов S и OB в ленте (Р4 «лента дублирует их», строка Д11 в таблице §2, NTF6-19) без производителя: NTF-2 шлёт S только почтой (NTF-2, строка 347), NTF-3 даёт S ленту «—» (строка 431). NTF6-19 держится подменой и годен. Утверждение «приходят в ленту» заказать либо снять."
  - "[FORMAT] NTF6-47 «без объявления»: назвать значения (global.kacho.notifications.enabled=false, перечень пуст). Отсутствие ключа по Д7 и NTF-1 Р9 — отказ рендера, а не «служба не объявлена»."
  - "[FORMAT] Р2: назвать путь значения, по которому чарт консоли получает признак из объявления NTF-1 Р9 (общий global или вывод зонтичного чарта). Иначе «вывод из одного объявления» не проверяем для отдельной установки чарта консоли."
  - "[FORMAT] §1.7 «Ревизии измерения: воркспейс issue-880@9c442b0d». Соседние приёмки правятся в рабочей копии без коммита. Мерить соседей по отпечатку содержимого, а не по коммиту ветки."

