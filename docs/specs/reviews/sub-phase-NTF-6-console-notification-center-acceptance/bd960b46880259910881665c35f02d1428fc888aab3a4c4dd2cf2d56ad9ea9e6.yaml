blocking_findings:
  - id: B4-1
    kind: CONSTRUCTIBILITY
    where: §7 G1; §1.6 абзац «Второй член аккаунта»; Р14; DoD 14; через G1 — NTF6-38, 39, 41, 43, 45, 46, 49, 50, 54, 20, 21
    summary: >-
      Названная фикстура не строит состояние G1. По G1 пользователя U-B приглашает U-A в acc-A, и
      у U-B в acc-A активное членство. Функция secondAccountMembership (ui-future/e2e/specs/users.spec.ts:199-262
      @1d42a6728bf) делает другое. Внутри себя она регистрирует нового арендатора-приглашающего
      (register(page) и onlyAccount(page)), поднимает уровень ему и приглашает переданную почту в
      его собственный, только что созданный аккаунт. Этот аккаунт она и возвращает, а свой
      контекст закрывает. Приглашающего или аккаунт она не принимает: у неё параметры browser,
      invitee и baseURL. Получается, что U-B станет членом нового аккаунта acc-H, а не acc-A, и
      у acc-H не будет ни проекта prj-A, ни живой сессии владельца. §1.6 описывает функцию
      неверно: «приглашаемый сначала регистрируется… затем владелец аккаунта поднимает уровень и
      приглашает». На деле приглашаемый должен уже существовать, а владельца функция заводит
      сама. В дереве проб /iam/v1/users:invite вызывается один раз, и это вызов внутри этой же
      функции. Рядом в users.spec.ts записано: «не хватает второго ЧЕЛОВЕКА в аккаунте».
      Перенос в fixtures.ts (Р14, DoD 14) функцию не меняет и поэтому дефект не лечит.
    predicate: >-
      git -C project/kacho show origin/main:ui-future/e2e/specs/users.spec.ts | sed -n 199,262p
      → сигнатура (browser, invitee, baseURL), внутри register(page), приглашение в host.id.
      git -C project/kacho grep -n 'users:invite' origin/main -- ui-future/e2e → 1 вхождение.
    fix: >-
      Назвать фикстуру, которая строит G1 при заданном приглашающем. Например, обобщить функцию
      одним изменением: принимать страницу и аккаунт приглашающего (U-A, acc-A) и почту и id
      приглашаемого. users.spec.ts тогда вызывает её со своим свежим хостом, и копии не
      появляется. Второй путь: расписать шаги G1 явно. U-B регистрируется в своём контексте,
      U-A выполняет raiseAssurance (у G0 уровень «1», а пол приглашения — «2»), затем
      POST /iam/v1/users:invite {accountId: acc-A, email: U-B}, затем ожидание state = ACTIVE в
      GET /iam/v1/accounts/{acc-A}/memberships. Сразу исправить описание в §1.6 и перенацелить
      DoD 14 с «перенесена» на «строит членство в заданном аккаунте», с пробой предпосылки.
  - id: B4-2
    kind: NEGATIVE
    where: Р2 (второй пункт); Р18; §1.7 таблица; §6; группы B, F, G
    summary: >-
      Консоль никак не показывает отказ по недоступности у производителя. В редакции NTF-3,
      которую документ цитирует, записаны отказы fail-closed. Лента: UNAVAILABLE, «страницы нет,
      не 200 с пустыми items» (NTF3-158). Контакты, GET и PATCH: UNAVAILABLE (NTF3-157). Создание
      подписки: UNAVAILABLE, PEER_UNAVAILABLE (NTF3-156). Все три есть в таблице методов Р25.
      Таблица §1.7 их не перечисляет, и ни один сценарий NTF-6 не утверждает, что консоль
      покажет при таком ответе. Р2 говорит, что при отказе края по доступности экран покажет
      ModuleUnavailablePanel, но у этого нет ни сценария, ни пункта DoD, ни строки §8.
      ModuleErrorBoundary в §1.4 — канон сбоя загрузки модуля, а не ответа данных. Без
      отрицания пустой ленты остаётся только NTF6-07: пустой ответ, текст «Уведомлений пока
      нет», значка нет. Консоль, показавшая отказ как пустоту, этот сценарий пройдёт, хотя
      сервер закрыт (ui.md ui-empty-state-for-empty-answer). То же со счётчиком Р18: при отказе
      ленты значок гаснет так же, как при N = 0. То же с экраном контактов: он показал бы
      «по умолчанию — владелец». NTF6-45 этот класс для 403 держит («а не пустую строку и не
      владельца»), а для UNAVAILABLE нет.
    predicate: >-
      grep -n 'NTF3-15[6-8]\|UNAVAILABLE' docs/specs/sub-phase-NTF-6-console-notification-center-acceptance.md
      → только Р2, и сценария нет. grep -n 'NTF3-158' <NTF-3> → Р25 и сценарий.
    fix: >-
      Нужны сценарии с положительными близнецами, где отличается ровно один факт: ответ края
      503 UNAVAILABLE вместо 200 (строится подменой, как §5).
      (а) Лента: экран не показывает «Уведомлений пока нет», показывает вывод error-presentation
      и не рисует строк. Близнец — NTF6-07.
      (б) Счётчик: при отказе inbox значок не принимает вид «прочитано». Решение Р18 при отказе
      записать явно: например, значок прежнего опроса сохраняется либо появляется признак
      недоступности. Близнец — NTF6-10.
      (в) Контакты: при отказе GET не показывается владелец «по умолчанию». Близнец — NTF6-37.
      (г) Подписка: при отказе POST карточка не показывает «Вы подписаны». Близнец — NTF6-33.
      Р2 привести в соответствие: ModuleUnavailablePanel оставить для сбоя загрузки модуля
      (NTF6-03), а отказ данных показывать выводом error-presentation. Добавить NTF3-156…158 в
      таблицу §1.7, строки в §6 и §8 и счёт в DoD 15.

