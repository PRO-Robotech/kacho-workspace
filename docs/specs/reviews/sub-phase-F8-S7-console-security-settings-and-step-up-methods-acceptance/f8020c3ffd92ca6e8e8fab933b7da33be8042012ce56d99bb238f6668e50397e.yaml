blocking:
  - kind: CONSTRUCTIBILITY
    where: "F8-S7-80 «Дано» в newman (§8 п.3, положительный кейс)"
    finding: >-
      Положительный newman-кейс требует С-кл — человека с подтверждённым адресом, паролем и
      зарегистрированным ключом. Посев С-кл существует только в playwright (access-key-seed.ts:
      raiseSeedToLevelTwo → seedAccessKey, CBOR-аттестация «none» на TS). У newman и у python-фикстур
      нет ни заведения кода, ни регистрации ключа: фикстура края для людей одна —
      tests/authz-fixtures/verified_human.py (Ф-п / Ф-н: register, verify-email/confirm, me). Кейс, «Дано»
      которого не строится, на сборке выпадет либо подменится, и паритет «200 / 403» останется
      односторонним. Попутно близнец не однофактен: С-кл против человека с неподтверждённым адресом
      отличаются и адресом, и наличием ключа.
    predicate: >-
      git -C project/kacho grep -lE 'attestation|access-key/begin|second-factor/enroll' 8514270c4 -- '*.py' | wc -l → 0;
      git -C project/kacho grep -cE 'second-factor|access-key|webauthn|totp' 8514270c4 -- tests/authz-fixtures/ gateway/tests/newman/ → пусто;
      git -C project/kacho show 8514270c4:tests/authz-fixtures/verified_human.py | grep -n '^def ' → register, confirm, who_am_i, enroll (Ф-п/Ф-н)
    required: >-
      Один из двух (выбор автора):
      (а) положительный кейс — ретрансляция ответа службы человеку Ф-п без ключа: 400, code 9,
      ACCESS_KEY_NOT_REGISTERED, «no access key is registered: register an access key first» (производитель —
      SUA-21); близнец — Ф-н тем же запросом: 403, code 7, EMAIL_NOT_VERIFIED; отличающий факт один —
      подтверждён ли адрес; оба «Дано» строит verified_human.py; 200 c allowCredentials остаётся за
      браузерной F8-S7-21 на стенде (DoD п.4);
      (б) оставить 200 и назвать фикстуру python, которая заводит код и регистрирует ключ через край
      (перенос submitRegistration «none» из access-key-seed.ts), заказом kacho#3230; близнец — тот же
      человек до подтверждения адреса — не строится (ключ требует «2»), поэтому пара всё равно вида (а).
