      -R PRO-Robotech/kacho --state all — после #2933 новых нет. Ban #11, третий исход без
      ответственного.
    fix: >-
      Правка документа не нужна, кроме номера. Завести задачу area:compute с формулировкой из строки
      §6 (признак, проба с близнецом по v_get на интерфейсе, отказом не закрывается). Вписать номер в
      строку §6, в таблицу, в §1.14 (а) и Р2. Снять пометку «блокирующая».
  - id: B2
    kind: CONVENTION
    anchor: "§6, строка «Письмо о переходе в ERROR не из CREATING (П4, П5, П6)» и строка таблицы"
    what: >-
      Дефект корректности сверщика storage (ветви П4–П6 недостижимы) без задачи. Документ сам
      объявляет строку блокирующей. Задачи в трекере нет.
    fix: >-
      Завести задачу area:storage «сверщик storage не производит пар READY/≠READY и DELETING/*». Вписать
      номер в строку §6 и в таблицу. Снять пометку «блокирующая».

non_blocking_findings:
  - id: N1
    anchor: "маршрут класса (§14а)"
    what: >-
      Класс «отложенная работа без предмета в трекере» (род CONVENTION) повторяется четвёртый круг
      подряд. Автор приёмки закрыть его не может: заведение задачи в kacho — не его момент. Редакция
      28 это признала и ушла на ревью с заранее известным возвратом. Ещё один круг на этом же
      отпечатке предмета не имеет. Нужен шаг «завести две задачи» ДО следующего круга; после него
      правка документа сводится к номерам.
  - id: N2
    anchor: "§6, строки «Каналы…», «Выбор локали…», «Сводка по видам…», «DiskType…», «Подписки группы…»"
    what: >-
      Это исключения объёма с предикатом, а не отложенная работа, но таблица «Отложенная работа →
      задача» их не называет ни в одном из двух классов. Правило начала §6 делит строки на «работу» и
      «чужой предмет соседней под-фазы»; эти пять не относятся ни к тому, ни к другому. При следующей
      правке одной фразой назвать третий класс: «исключение объёма с предикатом, не работа».

