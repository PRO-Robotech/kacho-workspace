blocking_findings:
  - id: B1
    kind: CONSTRUCTIBILITY
    anchors: ["NTF3-161 (б) When", "§8 средства построения условий"]
    what: >-
      Given (б) требует 50 повторов, «в каждом повторе хранимое заново P1». После первого повтора
      хранимое — P3. Р10 и Д25 делают отметку монотонной, поэтому публичный PATCH вернуть её к P1 не
      может: это ровно то свойство, которое сценарий и утверждает. Средства, которое пишет строку
      настроек notify в обход публичного пути, в §8 нет: С1–С16 такого не содержат, у С8 предмет —
      лента модуля. В написанном виде Given со второго повтора не строится, и проба либо проверяет
      один повтор вместо 50, либо собирает условие непоименованным способом.
    predicate: >-
      grep -nE 'заново|P1\)' <документ> → единственное место — строка 2538; awk '/^\| С1 \|/,/^\*\*Общий Given/'
      <документ> → нет средства, пишущего строку настроек notify.
    required: >-
      Назвать средство: например, С17 — посев строки настроек пользователя notify (seen_up_to = P1)
      прямой записью в базу kacho_notify обвязки перед каждым повтором. Другой путь — 50 разных
      посеянных пользователей, у каждого P1 выставлен публичным PATCH. Строку §8 и производителя в
      §11 дописать.

  - id: B2
    kind: COVERAGE
    anchors: ["Р2 (пересланная системная личность)", "§7 «Фоновое задание освобождения»", "§1.14 итог"]
    what: >-
      Перепись §1.14 нашла путь, которым пишущий метод vpc (ReleaseOwnedAddress, исход RELEASED →
      строка Address DELETED) зовётся под системной личностью: фоновое задание nlb
      (free_ip_runner.go:465-466, operations.SystemPrincipal()). По этому пути Р2 принимает решение:
      инициатор — system:<компонент>, где компонент называет службу и роль отправителя, а не общую
      системную личность. У решения нет ни одного «Тогда». §7 объявляет путь «публичным API не
      конструируется», а покрытием называет форму Р2 и NTF3-62. Но NTF3-62 утверждает только отказ
      строке без инициатора и значения system:<компонент> не проверяет. Значение наблюдаемо: это
      инициатор строки журнала и ленты, которую консоль показывает арендатору. По Д22 наблюдаемый
      исход принадлежит приёмке. Путь конструируем тем же приёмом, что С15: балансировщик создаётся
      публичным API (адрес выделен), строка nlb прямой записью переводится в состояние, которое
      выбирает задание (selectStuckSQL), затем задание исполняется один раз в обвязке nlb + vpc. Д24
      требует решения по каждому найденному пути, и решение здесь принято, но его держателя нет.
    predicate: >-
      grep -nE 'free_ip_runner|SystemPrincipal|system:<компонент>' <документ> → Р2, §1.14, §7, §11
      NTF3-70; ни одного **Then** с инициатором system: по строке Address.
    required: >-
      Завести сценарий (например, букву NTF3-160 (и) или новый номер): посев застрявшей строки nlb
      (новое средство §8), одно исполнение задания, Then — строка журнала vpc Address DELETED и
      строка ленты с инициатором system:<имя компонента задания nlb>, строк с user: и с общей
      системной личностью — 0. Близнец — тот же адрес, снятый публичным Delete: инициатор user:usr-A.
      Строки в §10, §11, §12.2. Либо, если значение компонента в приёмке не утверждается, снять его
      из Р2, записав решение с основанием.

  - id: B3
    kind: CONVENTION
    anchors: ["§1.13 «вызовы обёрток», vpc", "§1.14 «Публичный вход», compute"]
    what: >-
      Д24: каждое утверждение о дереве — команда и число @ревизия, которые воспроизводятся. Две
      напечатанные команды дельты дают не то число, что напечатано рядом. (1) vpc Outbox().Emit: по
      команде 77, в документе 50. 50 выходит только с отсевом строк-комментариев, которого в
      команде нет. (2) compute (Attach|Detach)\(ctx: по команде 6, в документе 5. Таблица §1.14
      сама называет шесть мест (instance.go:820,879,965,976; instance_nic.go:62,120). Выводы
      документа от этого не меняются. Но перепись заведена, чтобы закрыть класс RA-01..RA-03
      («утверждение о дереве не предикатом»), и в ней самой класс остался. Следующий читатель,
      перезапустив команду, получит другое число и не узнает, какое из двух верно.
    predicate: >-
      в PRO-Robotech/kacho: git grep -nE '[^A-Za-z]Outbox\(\)\.Emit\(' 1d42a6728bf --
      'services/vpc/internal/**/*.go' ':!**/*_test.go' | wc -l → 77 (с | grep -vE ':[0-9]+:\s*//' → 50);
      git grep -nE '\.(Attach|Detach)\(ctx' 1d42a6728bf -- 'services/compute/internal/apps/**/*.go'
      ':!**/*_test.go' | wc -l → 6.
    required: >-
      Привести каждую пару «команда → число» дельты к воспроизводимому виду: в команду vpc дописать
      отсев комментариев (либо напечатать 77 и объяснить разницу), у compute напечатать 6. Прогнать
      все команды §1.13 и §1.14 заново одним проходом, числа брать из вывода.

non_blocking_findings:
  - "Р10 и NTF3-161 (в): «последняя выданная позиция ленты». Позиция приёма — одна последовательность базы notify на всех пользователей (Р9). Стоит одной фразой сказать, что верхняя граница — наибольшая позиция всей ленты, а не наибольшая позиция, видимая вызывающему. Текст отказа («latest inbox position») читается как второе. Given (в) («P3 — последняя выданная позиция ленты») согласуется с первым прочтением, поэтому это замечание к форме."
  - "NTF3-160 (з): When читает P0 только журналов vpc и storage, а Then утверждает строки журнала compute «после P0». По общему Given P0 compute прочитан до привязок. Лучше назвать явно, что P0 compute читается там же, после привязок: MarkDeleting пишет Instance UPDATED (instance_repo.go:490), и счёт строк compute от выбора момента зависит."
  - "§7: компенсация сорвавшегося Create признана эквивалентной (д) по методу и контексту. Её можно построить подменой ответа vpc в обвязке (приём С7). Это стоит сделать хотя бы в замысле, но не блокирует: исход у vpc тот же."
  - "Д23: согласование ротации и контрольного значения Р11 NTF-4 на обоих развёртываниях NTF-3 не утверждает. Предмет — NTF-4; в строке §2.1 полезна ссылка «держит NTF-4», чтобы он не выпал."
  - "Неблокирующие прошлых кругов вне дельты остаются в силе: С15 строить через InstanceRepo.SetStatusCAS; словарь READY/AVAILABLE в Given (г); форма вставки NTF3-70 и 23502 против CX3B-25 (б) — к design-author."

method_verdict: >-
  Судилась дельта 20 → 21 против Д1–Д25. Каждое утверждение дельты о дереве перемерено напечатанным
  предикатом на @1d42a6728bf, полнота переписи §1.14 — контролем по графу импортов, payload новых
  букв — по контрактам. Итог: 3 блокирующих. Given NTF3-161 (б) не строится. Решение Р2 по
  системному пути без держателя. Две пары «команда → число» не воспроизводятся (Д24). Посев не
  выполнялся: стенда нет, это «не выполнилось», в зелёное не зачитано.

