blocking_findings:
  - id: RA1-1
    kind: COVERAGE
    title: Гейт NTF3-70 не определён на эмиттере nlb — число «сегодня у nlb 1» считает другим термином, чем гейт после под-фазы
    where: "NTF3-70 Then («число прямых вставок в таблицу журнала мимо неё (0 у каждого модуля; сегодня у nlb 1 — §1.13)»); Р3 («Прямой вставки … мимо функции фундамента после под-фазы нет (сегодня у nlb одна)»); §1.13 строка nlb и итог («из них 1 — прямая вставка мимо эмиттера»); §11 строка NTF3-70 (переводится только free_ip_runner.go:487)"
    finding: >-
      Гейт NTF3-70 делит писателей на Go на два класса: «вызов функции фундамента» и «прямая
      вставка в таблицу журнала мимо неё». По Р3 функция фундамента — одна точка, которая пишет
      строку журнала и строку ленты. Перепись §1.13 судит другим термином: «мимо ЭМИТТЕРА». Эмиттер
      nlb (repo/kacho/pg/outbox_emitter.go:37) — не функция фундамента, а собственный литерал
      модуля `INSERT INTO kacho_nlb.nlb_outbox`. Через него идут все глаголы nlb; разбор классов
      насчитал 31 вызов Outbox().Emit. В термине гейта литеральных вставок мимо функции фундамента
      у nlb сегодня ДВЕ, а не одна. Документ пишет «одна», и §11 переводит на функцию фундамента
      только free_ip_runner.go:487. Поэтому исход гейта на эмиттере nlb не определён. Автор гейта
      вправе (1) счесть его законным писателем — тогда «одна точка» Р3 у nlb не соблюдена,
      а строку ленты ставит вторая реализация; (2) считать его обходом — тогда гейт после под-фазы
      красный, пока эмиттер не переведён, а документ этого перевода не называет. Разбор классов
      (CX3B-24 (а)) требовал перевести оба места, и RA-01 был возвращён ровно за утверждение
      документа, от которого зависит, что увидит гейт. NTF3-68 по NetworkLoadBalancer ловит
      отсутствие строки ленты в поведении. Но он не отличает одну точку от второй реализации, а
      гейт — единственный держатель паритета «журнал ↔ лента» по построению.
    fix: >-
      Назвать эмиттер nlb в термине гейта и довести число до конца. В §1.13 у строки nlb и в итоге
      написать: мест записи на Go у nlb 2, оба — литеральная вставка мимо функции фундамента
      (эмиттер модуля и шаг доведения снятия). В Р3 и NTF3-70 — «сегодня у nlb 2», после под-фазы
      0. В §11 у строки NTF3-70 — оба места nlb (outbox_emitter.go и free_ip_runner.go) переводятся на
      функцию фундамента. Если выбран иной путь (эмиттер модуля объявлен законной точкой), его
      надо записать решением: чем эмиттер nlb ставит строку ленты, и как гейт отличает его от
      обхода — по имени функции, с инъекцией. Тогда формула «одна точка» в Р3 правится.
      Инъекция (а) может остаться на vpc. Если эмиттер nlb переводится, нужна пара на nlb: литерал
      вставки в outbox_emitter.go — красный, вызов функции фундамента — зелёный.

non_blocking_findings:
  - "NTF3-62 утверждает отказ функции базы как SQLSTATE 23502 с именем колонки инициатора. Разбор классов CX3B-25 (б) ставит замыслу условие: «функция базы при невыставленной настройке поднимает отказ с именем настройки, а не подставляет значение». Если замысел поднимет своё исключение, код будет не 23502, и проба NTF3-62 покраснеет. По Д22 наблюдаемое утверждает приёмка, поэтому замыслу нужно согласовать CX3B-25 (б) с 23502 (например, настройка читается в колонку NOT NULL, а имя настройки идёт в сообщение). Строка к design-author, не к автору приёмки."
  - "§7, пункт о прямой вставке nlb фоновым заданием: исход «LB DELETED от сверщика несёт system:<компонент> и одну строку ленты» не утверждает ни один сценарий. Держатся только форма (Р2), отказ без инициатора (NTF3-62) и путь через функцию (NTF3-70). Сценарий можно построить в интеграционной обвязке nlb: посев строки DELETING старше порога и фейковый клиент vpc, как NTF3-133..137 сеют операции. Это заказ CX3B-25 (в) к integration-tester. Блокирующим не считаю: фраза §7 «публичным API не конструируется» верна."
  - "NTF3-160 (б): у When нет полного тела ListenerService.Create — порт, протокол, имя. Одного targetGroupId для пробы мало. Дописать тело, как у прочих сценариев с конкретным payload."
  - "§1.13, предикат функций базы: обход каталога migrations/ даёт и не-SQL попадание (vpc migrations/README.md:233). Команда верна, но к ней стоит приписать `-- '*.sql'`, чтобы число попаданий было числом мест SQL."

method_verdict: >-
  RA-01 закрыт по функциям базы: перепись §1.13 сведена к таблицам журнала, все 6 функций и 12
  триггеров сверены с деревом @1d42a6728bf, у NTF3-62, NTF3-70 и нового NTF3-160 есть близнецы,
  строки §10 и §11. Given NTF3-160 конструируемы по коду; посевов не было, это «не выполнилось».
  Судилась только дельта 16 → 17 (Д22). Возврат один, COVERAGE. Для писателей на Go перепись
  считает «мимо эмиттера», а гейт — «мимо функции фундамента». На эмиттере nlb эти термины
  расходятся, поэтому исход гейта для главного писателя nlb документ не определяет. Правка
  точечная: число и перечень переводимых мест nlb в Р3, §1.13, NTF3-70 и §11.

