blocking_findings:
  - id: B5-1
    kind: NEGATIVE
    title: Отказ справочника посреди обхода страниц назван в Р7, но не держится ни одним сценарием, а текст правила двусмыслен
    where: "Р7, строки 610–615 (последний пункт «Потребитель обоих списков…»); NTF3-56 (только единственный вызов); NTF3-103 (а); NTF3-140 (а)"
    finding: >-
      Редакция 11 вводит новое утверждение: при отказе или недоступности справочника на любой
      странице письма по уже полученным страницам ставятся, а остаток уходит на следующий проход.
      Держатель отказов справочника — NTF3-56, но он отвечает кодом на первый и единственный вызов.
      Отказа на странице 2 и дальше нет ни в одном сценарии. Кроме того, текст правила говорит сразу
      две вещи. «Клетка таблицы … для всего прохода» при `DEFER` значит «письмо в этом цикле не
      собирается», то есть проход отложен целиком. «Письма по уже полученным страницам ставятся»
      значит, что проход исполнен частично. Реализация может выбрать любое прочтение, и все
      сценарии останутся зелёными. Может быть и третий вариант: ошибка на странице N принята за
      конец выдачи, а окно сводки закрыто. Тогда адресаты со страниц N и дальше молча теряют сводку
      за это окно, а после восстановления справочника следующий проход берёт уже новое окно. Это тот
      же класс, что B4-1: письма пропадают молча, и ни одна проба этого не видит. Разница только в
      том, что потеря идёт через отказ, а не через одну прочитанную страницу.
    fix: >-
      (1) В Р7 выбрать одно прочтение и записать его однозначно. Например: «отказ на странице N >
      1 — сигнал и счётчик клетки; письма адресатам со страниц 1..N−1 ставятся; адресаты со страниц
      N и дальше получают письмо за то же окно на следующем проходе после восстановления; окно
      сводки для них не закрывается». Для сводки назвать, что именно не сдвигается: окно адресата,
      а не глобальная отметка прохода. (2) Держатели с близнецами. NTF3-103 (б): как (а), подмена
      справочника (С7) отвечает `UNAVAILABLE` на вторую страницу `ListProjectAudience`, поэтому
      сводку получает только usr-A. После восстановления следующий проход даёт usr-B ровно одно
      письмо с теми же 2 строками, а usr-A второго письма не получает. Близнец — (а) без отказа.
      NTF3-140 (б): как (а), `UNAVAILABLE` на вторую страницу `ListExpiringCredentials`, поэтому
      письмо только по uoc1. Через 1h, после восстановления, ставится письмо по uoc4 и записывается
      запись однократности, а по uoc1 второго письма нет. Близнец — (а). (3) Строки §10 и
      производитель §11: сборщик сводки и задание напоминаний `services/notify`, подмена С7. Номера
      сценариев не нужны, достаточно букв.

non_blocking_findings:
  - "Р19 требует, чтобы границы окна были одни на весь проход, но держателя у этого нет: в NTF3-140 (а) часы между страницами не двигаются. Можно дописать к (а): часы сдвигаются на 1 мин между первой и второй страницей, а expires_after и expires_before во втором вызове те же (наблюдается подменой С7 или записью вызовов). Иначе реализация, которая пересчитывает `сейчас` на каждой странице, пройдёт все сценарии, хотя курсор в новом окне становится недействителен."
  - "Базой a67820c41 одобрена NTF-1 редакции 9 на отпечатке 530e22968ff (коммит a67820c41). §1.12 NTF-3 держится за NTF-1 @b347b81f. Сверить опоры §1.12 диффом с новой редакцией NTF-1 и перевести ссылки на неё (как в редакции 9 NTF-3)."
  - "NTF-6 в §1.12 держится @d5fe4734. На NTF-6 есть запись «принято» на 47bd8b7054c (коммит fe6231afe). После одобрения NTF-3 перевести ссылку NTF-6 на итоговый отпечаток (Д15)."

method_verdict: >-
  Возврат круга 4 закрыт полностью. У обоих списков справочника названы порядок и курсор, отказы
  пагинации записаны первым стейтментом, у каждого есть держатель с близнецом. Обход всех страниц
  записан у потребителя, и у каждого из пяти мест есть держатель, различающий «только первая
  страница». Сверх возврата класс закрыт у публичных списков. Счёт 158/7/151 сходится, у каждого
  живого сценария есть строка §11, гигиена 0, Д14–Д16 соблюдены. Новый возврат касается одного
  утверждения, которое внесла сама правка: об отказе посреди обхода. Текст двусмыслен, держателя
  нет, а пропуск стоит тихой потери сводки или напоминания `security`. Правка — одно уточнение в Р7,
  буквы NTF3-103 (б) и NTF3-140 (б), строки §10 и §11. Новых номеров не нужно.
