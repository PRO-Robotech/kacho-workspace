non_blocking_findings:
  - id: N1
    anchor: "§1.10 (строки 403–407)"
    what: >-
      Число «путей модулей kacho 0» верно, но предикат упасть не может. Три документа написаны до
      монорепо и называют модули именами репозиториев, а не путями services/. Контроль: git grep
      -nE 'services/' → 1 строка на все три документа; git grep -cE
      'kacho-(vpc|compute|nlb|storage|registry|geo)' @b746239d5b8 → 3.7: 2, 3.9: 1, W2.B: 1.
      По содержанию утверждение верно: отложенные уведомления там про домен прав. Это одобрение
      заявки JIT и break-glass (3.7:38, :50) и Approve/Deny (W2.B:539). Лучше назвать эти
      координаты или взять предикат по именам репозиториев. На этом утверждении не стоит ни одно
      решение.
  - id: N2
    anchor: "§1.8 (строки 376–378)"
    what: >-
      Слова «единственный обходчик сроков — expiredcredsweep» шире замера. По expires_at обходит и
      internal/apps/kaname/retention (registry.go:334–341: утверждения, отзывы, выпуски) @734f69fb4.
      Вывод «производителя напоминания нет» держится на remind → 0 по всему дереву. Уточнить до
      «обходчик сроков ключей».
  - id: N3
    anchor: "§1.3"
    what: >-
      В координате subscription.proto:359-480 файл на @1d42a6728bf имеет 479 строк. Предикат по
      всему файлу даёт тот же 0 и сильнее среза.
  - id: N4
    anchor: "запись редакции 23"
    what: >-
      Запись говорит «выводы и сценарии не изменились», хотя текст Then и близнеца NTF3-163 правлен.
      Утверждения при этом не изменились. Точнее было бы «утверждения сценариев не изменились».
  - id: N5
    anchor: "вне дельты"
    what: >-
      Неблокирующие прошлых кругов остаются в силе. С15 строить через InstanceRepo.SetStatusCAS.
      Форма вставки NTF3-70 и 23502 против CX3B-25 (б) — к design-author.

method_verdict: >-
  Судилась дельта 22 → 23 против B1 круга 2 и Д1–Д25. Все команды дельты (одиннадцать групп)
  прогнаны на закреплённых ревизиях, и все числа и координаты воспроизводятся. Самопроверки шапки
  §1 различают дефект: на редакции 22 они дают 7 и 1, на редакции 23 — 1 и 0. Утверждения, на
  которых стоят решения (Р7 SUBJECT_INACTIVE, Р19, Р2 членство группы), рецензент проверил и
  чтением кода, а не только числом. Блокирующих нет. Пять неблокирующих — формулировки и сила
  одного предиката, на котором не стоит решение. Посев не выполнялся: стенда нет, это «не
  выполнилось», в зелёное не зачитано.

