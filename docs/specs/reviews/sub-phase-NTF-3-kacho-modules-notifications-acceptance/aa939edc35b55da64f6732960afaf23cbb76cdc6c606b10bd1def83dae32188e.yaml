non_blocking_findings:
  - id: N1
    kind: FORMAT
    anchor: "группа B, «Подготовка источников ПИ» (стр. 3743); С22 (стр. 2023)"
    what: >-
      Payload подготовки не называет размещение: зону `vol-0` (`zoneId`) и регион образа
      (`regionId`) у `img-1` и `img-3`. Предикаты вставки его судят. Снимок наследует зону тома
      (`snapshotInsertCAS`). Образ со снимка требует, чтобы зона тома-предка лежала в зонах региона
      образа (`imageInsertCoherentSQL`, `snap_ok`, image_repo.go @1d42a6728bf). Том со снимка
      требует `snapshot.zone_id = zone_id` тома (`volumeInsertCoherentSQL`, `snap_ok`). С единственной
      парой обвязки `rg-1`/`zn-1` Given строится, поэтому это не блокирует. Стоит дописать в ПИ и в
      NTF3-160 (в) `zoneId = "zn-1"` и `regionId = "rg-1"`, чтобы автор проб не угадывал.
  - id: N2
    kind: FORMAT
    anchor: "NTF3-43, Given And (стр. 3840)"
    what: >-
      `SnapshotService.Copy` и `ImageService.Copy` вызываются без `targetZoneId` и `targetRegionId`.
      Оба поля обязательны: пустое даёт INVALID_ARGUMENT «target_zone_id: required»
      (snapshot.go:595-596) и «target_region_id: required» (image.go:759-760). Копия вставляется
      только при ACTIVE-привязке того же класса в целевой зоне (copySnapshotSQL, copyImageSQL).
      Копировать в ту же зону продукт не запрещает, и в `zn-1`/`rg-1` привязка есть: на ней
      создан `vol-0`. Поэтому Given строится. Это не новое против редакций 30–31, но цели копии
      стоит назвать.
