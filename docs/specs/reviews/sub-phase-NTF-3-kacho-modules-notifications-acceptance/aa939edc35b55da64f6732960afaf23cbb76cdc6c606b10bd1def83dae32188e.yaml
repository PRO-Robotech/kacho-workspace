  code_predicates: >-
    kacho @1d42a6728bf. `Confirm` — `UPDATE <таблица вида> SET state='READY' … WHERE id=$1 AND state
    IN ('CREATING','ERROR')`, общая для томов, снимков и образов (reconciler/store.go:192-196).
    Снимок с тома — `v.state = 'READY'` (snapshot_repo.go:209), отказ «Volume <id> is not ready»
