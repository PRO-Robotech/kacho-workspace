blocking_findings:
  - id: B1
    kind: CONSTRUCTIBILITY
    anchor: "группа B, вводный абзац (стр. 3728–3735); NTF3-06 (стр. 3747–3750), NTF3-43 (стр. 3825–3833), NTF3-52 (стр. 3908), NTF3-54 близнец (стр. 3929)"
    what: >-
      Переписав группу B на запись перехода (С21), редакция 31 закрепила посадку, в которой
      вставка оставляет строку в CREATING, а сверщик Given больше не строит. Одновременно она
      сняла у источников пометку готовности, которая в редакции 30 стояла (`vol-0` и `snp-0`
      READY/READY, стр. 3943 и 3946 редакции 30; `snp-1` и `img-1` READY/READY в NTF3-43,
      стр. 4034). При этом глаголы, которые Given зовёт, требуют готового источника:
      - `SnapshotService.Create` вставляет строку только с тома в READY: `WHERE v.id = $6 AND
        v.project_id = $2 AND v.state = 'READY'` (snapshot_repo.go:209); иначе отказ «Volume <id>
        is not ready» (:287-288);
      - снимок-копия — `WHERE src.state = 'READY'` (snapshot_repo.go, copySnapshotSQL);
      - образ со снимка — отказ «Snapshot <id> is not ready» (image_repo.go:322-323);
      - том со снимка или образа — `sp.state = 'READY'` (volume_repo.go:372,380; :522,526).
      Все координаты — kacho @1d42a6728bf.
      Состояние рождения строки задаёт `bornState(readyOnCommit)` (volume_repo.go:58-64): при
      посадке группы B это CREATING. Поэтому в том виде, как они записаны, не строятся:
      ветви снимка и образа NTF3-06 (`snp-1` с `vol-0`, `img-1` со `snp-0`); NTF3-43 (`usr-A
      создал snp-1 и img-1`, затем `Copy`); ветви NTF3-52 (`snp-3`, `img-3`); близнец NTF3-54
      (`img-1` из `ImageService.Create`). Посевом Given отвергся бы FAILED_PRECONDITION ещё до
      When. Сценарий неверен — продукт тут ни при чём.
    fix: >-
      В каждом таком Given назвать конструктор готовности источника: запись выхода в READY из
      CREATING (С21, функция `Confirm` — `WHERE state IN ('CREATING','ERROR')`, store.go:192-196)
      на `vol-0`, `snp-0`, на источнике `snp-1`/`img-1` в NTF3-43 и на источнике `img-1` в NTF3-54.
      Проба утверждает `status = READY` (для тома — AVAILABLE) до вызова глагола. Если строки
      `resource-event`, которые даёт эта подготовка, ложатся в счёт Then, счёт должен их учесть
      либо начинаться с позиции, прочитанной после подготовки.
non_blocking_findings:
  - id: N1
    anchor: "NTF3-160 (з) (стр. 2524–2534)"
    what: >-
      Главное положительное утверждение (з) — «каждая строка, которую записал этот Delete, несёт
      user:usr-A». Если Delete не записал ни одной строки, оно зелено. По Д31 это законно: исход
      Delete вне объёма, и утверждается только «если событие произошло». Но тогда (з) падает
      только на строке с инициатором service:/system:, а близнец «строк user:usr-A по ins-4 — 0»
      зелен и при пустом журнале. Пересланная личность на Detach уже держится буквами (г) и (ж).
      Стоит назвать это в §10: (з) ловит ровно чужой инициатор, пустоту не ловит. Можно и
      вывести (з) из счёта держателей пересылки.
  - id: N2
    anchor: "§6, строка «Снос инстанса при привязанном интерфейсе…» (стр. 1885–1899)"
    what: >-
      Строка исключения утверждает нынешний исход публичного Delete как прочитанный факт: «интерфейс
      не отвязывается, строка инстанса удаляется», instance.go:958-981. Сценария или решения это не
      делает, поэтому не SCOPE. Но это ровно тот предмет, который Д31 выводит за объём, и держит
      его #2934. Лучше сослаться на тело задачи, а не повторять исход своими словами, — иначе он
      устареет вместе со стволом.
  - id: N3
    anchor: "группа B, вводный абзац; NTF3-160 Given (стр. 2419–2420), (в), (г)"
    what: >-
      Группа B утверждает CREATING до записи, но не говорит, что цикл сверщика в её обвязке не
      запущен. При фейковом бэкенде в G0 параллельный `Confirm` увёл бы строку в READY между Get
      и записью, и счёт строк NTF3-130 и NTF3-53 поплыл бы. Там же в группе L готовность `vol-1`
      (в) и `vol-11`/`vol-12` (г) по-прежнему держит неназванный построитель: сверщик, которого
      документ больше не меряет. Это не новое против редакции 30, но с B1 закрывается одной
      правкой: назвать С21 `Confirm` как конструктор готовности везде, где Given требует READY,
      и сказать, что цикл сверщика в обвязке storage не стартует.
