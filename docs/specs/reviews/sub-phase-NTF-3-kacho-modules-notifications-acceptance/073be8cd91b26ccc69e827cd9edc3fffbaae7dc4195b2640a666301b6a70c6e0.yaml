method_verdict: >-
  Рамку Д31 проверил предикатом по всем вхождениям терминов жизненного цикла, каждое разобрано по
  роли. SCOPE-блокирующих нет. Переписанные Given групп B и S сверены с SQL-предикатами вставки и
  перехода в дереве. Одна регрессия конструируемости: источники потеряли состояние READY, а
  посадка группы B родить их готовыми не даёт. Сценарии при этом неверны — продукт не виноват.
  Прочее вне дельты судилось в прошлых кругах и не перепроверялось.
