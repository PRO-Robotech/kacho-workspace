non_blocking_findings:
  - "С15: «одна прямая запись статуса по id». В дереве тот же переход уже делает `InstanceRepo.SetStatusCAS(PROVISIONING → STOPPED)` (instance_repo.go:364). Автору проб стоит строить посев им, а не своим SQL, как это делает instance_resize_stopped_race_integration_test.go:26-35: так фикстура не станет снисходительнее продукта, если у статуса появится CHECK. Это условие к коду — замысел, а не приёмка (Д22)."
  - "Given (г): «диски … оба `READY`» — словарь статуса строки storage. Публичный Volume.Status такого значения не имеет, там AVAILABLE=2. Строка не из дельты, Then при этом утверждает публичное AVAILABLE/IN_USE. Документ везде использует этот словарь, так что двусмысленности нет — это замечание к форме."
  - "Неблокирующие прошлых кругов, не относящиеся к дельте, остаются в силе: форма вставки в журнал именем-переменной для NTF3-70 и согласование 23502 с CX3B-25 (б) — к design-author."

