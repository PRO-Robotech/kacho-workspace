blocking_findings:
  - id: B1
    kind: PRODUCER
    anchor: "Р3 (атрибут authz_rev), Р30 «Версия события», §3 шаг (13) и рёбра, §8 С24, NTF3-175, §11 строка NTF3-175"
    what: >-
      Д133 (1) требует, чтобы событие модуля несло токен версии прав службы доступа R_E — полный
      pg_snapshot службы доступа. Модуль kacho пишет событие в своей транзакции и в своей базе
      (database-per-service), снимка транзакций чужой базы у него нет. Как и когда модуль этот токен
      получает, документ не говорит нигде: шаг (13) §3 называет только намерение регистрации с
      поколением; ребра «модуль → служба доступа» за токеном в §3 нет; RPC выдачи токена в поверхности
      Р7 нет; §11 для NTF3-175 называет производителем «функцию фундамента Р3, функции базы notifygen,
      намерения модулей», ни одна из которых токена службы доступа произвести не может. С24 ссылается
      на путь, которого нет: «токен … проба получает у службы доступа тем же путём и в тот же момент,
      что модуль при записи события». Не определено и поведение при недоступной службе доступа в
      момент мутации модуля (мутация отказывает UNAVAILABLE? событие пишется без токена? позже
      дописывается?) и момент снятия токена относительно коммита транзакции модуля (до коммита —
      окно между снятием и коммитом; после — уже не «той же транзакцией»). Предикат:
      grep -n 'authz_rev\|R_E\|токен версии' <документ> — ни одно из 40+ попаданий не называет источник
      значения; grep -n 'xid8\|pg_snapshot\|снимок транзакций' — только определение «полный снимок».
    fix_direction: >-
      Назвать производителя токена: метод службы доступа (внутренний слушатель, кто вправе звать),
      момент снятия относительно транзакции модуля и почему он корректен для ограды «< R_E», исход при
      недоступности службы доступа (fail-closed мутации — либо иной, с сценарием и близнецом); внести
      ребро в §3 и в polyrepo-карту рёбер; переписать С24 на этот метод; добавить производителя в §11
      и пробу (строку сценария) на отказ пути токена.
  - id: B2
    kind: COVERAGE
    anchor: "Р30, §12 DoD, группа W — против дословного Д133 (1) задания"
    what: >-
      Д133 (1) называет механику ограды, которой в документе нет ни одним словом: (а) колонка
      authz_rev типа xid8 на ВСЕХ путевых таблицах прав, ставится триггером BEFORE INSERT OR UPDATE (не
      DEFAULT); (б) гейт «таблицы, которые читает Resolve = таблицы с authz_rev»; (в) проба паритета
      «Resolve с оградой на бесконечности = живому relverdict.Subjects»; (г) версия зеркала — bigint
      (сегодня source_version timestamptz — §1.15 сам это меряет, смена типа в документе не названа);
      (д) один производитель проекции и поколения (триггер resource-event). Предикат:
      grep -nE 'xid8|BEFORE INSERT|relverdict|Subjects|bigint|бесконечност|путев' <документ> → 0
      попаданий по механике ограды. Без (а)+(б) ограда пропускает изменённое право молча через любую
      путевую таблицу без колонки (членство группы, выдачи, правила ролей, материализованные кортежи), и
      поведенческие буквы NTF3-174 (е), (з) этого не ловят — они проверяют две таблицы из многих. Без
      (в) ограда может отличаться от живого ответа прав на неизменённом состоянии, и держателя нет.
      relverdict.Subjects в дереве есть: project/kaname @8a84dcff6
      internal/repo/kaname/pg/relverdict/subjects.go:192.
    fix_direction: >-
      Внести (а)–(д) решениями (дополнить Р30) и держателями: гейт паритета таблиц Resolve ↔ authz_rev
      с инъекцией (таблица без колонки → красный, близнец — с колонкой) и пустым обходом красным;
      интеграционную пробу паритета ограды на бесконечности с relverdict.Subjects по всем охватам GW;
      пробу «колонку ставит триггер, а не DEFAULT» (UPDATE строки права меняет authz_rev); строку
      миграции смены типа версии зеркала. Каждое — в §10 (близнец), §11 (производитель), §12 (DoD).
  - id: B3
    kind: CONSTRUCTIBILITY
    anchor: "Р30 «Вопрос с оградой» («отбрасывая каждую строку прав, изменённую не раньше R_E»); NTF3-174 (а), (в); NTF3-178; NTF3-165"
    what: >-
      «Строка прав» не определена, и от этого зависит, достижимо ли «Тогда». Токен R_E снимается при
      записи события модулем, а намерение регистрации применяется службой доступа ПОЗЖЕ (асинхронно,
      С23 это и моделирует). Применение поколения пишет строки службы доступа — кортежи владения
      (документ сам их называет: NTF3-174 «кортежи владения … сняты/не восстановлены») и
      материализованные кортежи привязок на объект (kaname @8a84dcff6, таблица
      access_binding_emitted_tuples — 20 упоминаний в 0001_initial.sql; запись круга 1 Д129 опиралась
      на неё как на форму, которую читает перечисление). Их версия ≥ R_E по построению. Если Resolve
      читает их — буквальная ограда «версия < R_E» выбрасывает всех, чьё право на новый объект пришло
      этим применением, и аудитория CREATED пуста; тогда NTF3-174 (а) (9 субъектов на v1 с R1) и
      NTF3-165 недостижимы. Если Resolve читает только исходные строки (привязки, правила, членство) —
      это надо сказать, и тогда же назвать, откуда для DELETED берутся «держатели выдач на объект,
      снятых каскадом этим удалением» (NTF3-174 (в), NTF3-178): каскад удаляет строки, и по «текущему
      состоянию прав» отличить выдачу, снятую каскадом E, от снятой до E отдельным Delete (близнец
      NTF3-178) нечем, если удалённое нигде не сохраняется. Документ не называет ни исключения строк,
      записанных применением самого g_E, ни хранения каскадно снятых выдач.
    fix_direction: >-
      В Р30 перечислить, какие строки прав читает вопрос с оградой (это же — предмет гейта B2 (б)), и
      правило для строк, записанных применением поколения g_E того же объекта (вне ограды либо
      судятся по поколению, а не по R_E); назвать, где и сколько живёт запись о выдачах, снятых
      каскадом удаления (с поколением снятия), и кто её пишет; пересчитать NTF3-174 (а)–(в), NTF3-178
      под выбранное правило. Если правило требует решения владельца — вопрос владельцу.
