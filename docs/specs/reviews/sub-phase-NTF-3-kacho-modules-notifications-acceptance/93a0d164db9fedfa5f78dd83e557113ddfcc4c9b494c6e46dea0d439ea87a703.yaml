blocking_findings:
  - id: B2-1
    kind: CONSTRUCTIBILITY
    scenarios: [NTF3-10, NTF3-41, NTF3-42, NTF3-44, NTF3-45, NTF3-51]
    title: >-
      Переходы П4 и П5 на сошедшейся строке сверщик не производит: строка READY с
      observed_state=READY в его рабочий набор не попадает. У образа, внесённого Register, нет и
      координаты бэкенда — сверщик такую строку не наблюдает вовсе.
    evidence: >-
      @1d42a6728bf: рабочий набор прохода — только `WHERE r.state <> r.observed_state`
      (reconciler/store.go:133, loop.go:162 `Drifted`); Confirm пишет `state='READY',
      observed_state='READY'` (store.go:194); рост размера — `UPDATE volumes SET size_bytes …
      WHERE … state = 'READY'` без касания observed_state (repo/pg/volume_repo.go:627-634);
      Register вставляет `state='READY', observed_state='READY'` без `binding_id`
      (repo/pg/image_repo.go:380-386), а строка без координаты сверщиком не исполняется
      («row has no backend coordinate», loop.go step). Единственный вызывающий `ResizeVolume` в
      не-тестовом коде — loop.go (ActionResize). Значит: NTF3-41 «снять объект под READY → один
      проход → ERROR» даёт 0 переходов; NTF3-10/42 «Update size → проход → ResizeVolume отвергнут»
      — ResizeVolume не вызывается вовсе; NTF3-45 вторая половина (после П7 снова READY/READY) —
      0 переходов; NTF3-44 — 0 переходов при любом наблюдении. Таблица §1.8 (П4, П5) и §1.9
      («Register → только П4») утверждают производимость, которой нет.
    required: >-
      Для П4/П5 на томе, снимке и образе: либо построить Given законным путём дерева (строка
      выходит из сошедшегося состояния: например, предыдущий проход с отказом наблюдения даёт
      observed_state=UNKNOWN, следующий — наблюдение, и только тогда ветка Decide) и сказать это
      в §1.8 с координатами, либо объявить, что сегодня переходов П4/П5 на сошедшейся строке нет,
      и по собственному критерию Р9 не подключать на них письмо, а изменение сверщика (рабочий
      набор, включающий расхождение размера и периодическое перенаблюдение) назвать отдельным
      предметом с задачей и предикатом. Ветку Register (Р13, §1.9, NTF3-44): у строки нет
      координаты бэкенда, переходов 0 — снять письмо о ней как не имеющее производителя либо
      назвать предмет, который координату заводит. NTF3-51 перевести на конструируемого близнеца.
    product_defect_note: >-
      Независимо от приёмки: рост размера тома, принятый операцией (`done=true`), до бэкенда не
      доходит — строка не попадает в рабочий набор сверщика. Комментарий image_repo.go:374-375
      («сверщик перепроверит… и переведёт строку в ERROR, если объекта нет») с кодом расходится.
      Это предмет задачи о корректности storage, не этой приёмки.
  - id: B2-2
    kind: PRODUCER
    scenarios: [NTF3-30]
    title: >-
      REST-пара NTF3-30 (HTTP 404, code 5 «Not Found») краем не производится: неизвестный путь
      отвечает авторизующая прослойка отказом 403 / code 7 до маршрутизатора.
    evidence: >-
      @1d42a6728bf: `inner = authzMW.HTTP(inner)` (gateway/cmd/api-gateway/main.go:1288-1289)
      оборачивает REST-маршрутизатор; для пути без маршрута `resolveRestFQN` возвращает сам путь
      (middleware/authz_util.go:225-231), каталог его не знает → `outcomeDeny` «catalog: no entry
      for method» (middleware/authz.go:813-844) → `writeHTTPDeny` пишет 403 (permission_denied_response.go:309-314).
      Предикат документа (`WithRoutingErrorHandler|WithErrorHandler` → 0) искал не ту прослойку.
    required: >-
      Выписать пару, которую край производит (для аутентифицированного вызывающего — 403 и code 7
      с причиной каталога; для анонимного — измерить и назвать), и производителем в §10 назвать
      авторизующую прослойку края. Гейт изоляции внутренних методов остаётся вторым утверждением.
  - id: B2-3
    kind: PRODUCER
    scenarios: [NTF3-07]
    title: >-
      «вызовов глаголов бэкенда по vol-1 за этот проход 0 (счётчик вызовов фейка)» — неверно для
      правильного продукта и опирается на прибор, которого нет.
    evidence: >-
      Observe — глагол порта (fake/faults.go:31) и вызывается на каждой строке рабочего набора до
      решения (loop.go:198); строка ERROR/ABSENT в наборе, значит Observe по vol-1 вызван 1 раз.
      Счётчика вызовов у фейка нет: `git grep -niE 'calls|count' 1d42a6728bf --
      services/storage/internal/blockbackend/fake/*.go ':!*_test.go'` → 0. Та же неточность в
      §1.8 П8 («глагол бэкенда не вызывается»).
    required: >-
      Утверждать 0 вызовов изменяющих глаголов (CreateVolume, CloneVolume, CopySnapshot,
      CreateSnapshot, ResizeVolume, Delete*) и 1 вызов Observe; назвать прибор счёта и его
      производителя в §10 (он заводится в тестовом дереве фейка).

non_blocking_findings:
  - kind: PRODUCER
    text: >-
      `notify_suppressed_total` в NTF-1 (a31661de…) не встречается ни разу; §12 и DoD 5а называют
      метку `scope` расширением существующей формы. Счётчик заводится здесь — назвать его новым
      в §10 (строка NTF3-13/14/49) и в DoD 5а.
  - kind: CONSTRUCTIBILITY
    text: >-
      NTF3-48: `UserService.Delete` отказывает FAILED_PRECONDITION, если пользователь владеет
      аккаунтом. В G0 назвать владельца аккаунта `prj-1` не `usr-A`.
  - kind: FACT
    text: >-
      §1.8 «хранимые состояния CREATING/READY/…; AVAILABLE/IN_USE выводятся» — Decide ветвится по
      `domain.VolumeStatusAvailable/InUse` после `DeriveStatus(state, false)` (store.go:170), для
      снимка и образа тоже. Формулировку привести к коду; на предмет не влияет.

