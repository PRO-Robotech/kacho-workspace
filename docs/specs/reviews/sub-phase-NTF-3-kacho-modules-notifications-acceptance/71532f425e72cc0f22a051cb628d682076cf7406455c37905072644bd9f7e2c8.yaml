blocking_findings:
  - id: B1
    kind: CONVENTION
    anchor: "§6 «Что НЕ входит», пункт «Сужение ListByInstance у vpc пообъектно по интерфейсу» (строки 1914-1919)"
    what: >-
      Документ откладывает дефект корректности словами «ведётся отдельной задачей», но саму задачу
      не называет, и в трекере её нет. Поиск gh issue list -R PRO-Robotech/kacho --state all по
      запросам «ListByInstance», «nicinternal», «сужение ListByInstance», «releaseAndDelete» и
      «пообъектно» дал 0 подходящих задач (2026-09-30). Дефект настоящий, и редакция 25 его
      подтверждает. В модели v_get и editor на vpc_network_interface — независимые прямые
      отношения (fga_model.fga:1043-1053). vpc сужает ListByInstance по каждому интерфейсу
      (relations.go:51, nicinternal/service.go:238). releaseAndDelete удаляет строку инстанса
      сразу после пустого списка (instance.go:960-981 @1d42a6728bf). Отсюда сценарий: у начавшего
      есть v_delete на инстансе, но нет v_get на привязанном интерфейсе. Тогда Р2 редакции 25
      пропускает доделывателя, интерфейс не отвязывается, строка инстанса удаляется, и интерфейс
      вместе с адресом остаётся привязанным к несуществующему инстансу. Сегодня тот же проход идёт
      под запасной личностью, vpc её отвергает (authn_interceptor.go:85), и проход прерывается, не
      удалив ничего. Значит, этот исход под-фаза открывает впервые и именно на доделывателе. У
      отложенного есть причина и предикат снятия, но нет предмета — это третий исход ban #11 без
      ответственного. К тому же слова «ведётся задачей» — утверждение о трекере без предиката (Д24).
    fix: >-
      Выбрать одно. (1) Завести задачу о корректности (area:vpc; ListByInstance сужается по
      compute_instance, как ListAttachments у storage), вписать её номер в пункт §6 и в Р2. Там же
      сказать, что до её закрытия доделыватель наследует исход публичного Delete. (2) Внести правку
      сужения в под-фазу и держать её буквой NTF3-164 (д). Посев: у начавшего v_delete на ins-d
      есть, v_get на nic-d нет. Then: строка инстанса на месте либо nic-d отвязан — по решению.
      Близнец — (а).

non_blocking_findings:
  - id: N1
    anchor: "§10, строка NTF3-164 (б)"
    what: >-
      В строке близнеца отличие названо только как «привязка снята». Given (б) теперь снимает ещё и
      пообъектные записи usr-B на ins-r, nic-r и vol-r. Привести строку к Given.
  - id: N2
    anchor: "§8 С1; NTF3-164 Given («посевом С1 сняты … пообъектные записи»)"
    what: >-
      В строке С1 названы привязки ролей, группы и выдачи, а снятия пообъектных записей модели там
      нет. Снятие записей по объекту — это отдельная возможность обвязки службы доступа. Нужно
      назвать её в С1 или сказать, что Given ждёт материализацию до ответа «нет». Не блокирует:
      проба предпосылки спрашивает все пять вопросов, поэтому неверно построенный Given даст «не
      выполнилось», а не ложное красное.
  - id: N3
    anchor: "NTF3-163 (г), посев С18 для CREATING"
    what: >-
      lb-g создан публично (операция done=true), поэтому строка CREATED и регистрация прав прошли до
      P0. У настоящей сироты CREATING их не бывает (free_ip_runner.go:373-374). Утверждения после P0
      это не ломает, но лента lb-g в обвязке кончается на CREATED без DELETED. Стоит сказать это
      одной фразой, чтобы исход (г) не читали как «сирота удалена молча и для ленты тоже».
  - id: N4
    anchor: "N3–N4 круга 1"
    what: "Неблокирующие N3 (ветка «субъект запасной») и N4 круга 1 остаются в силе; дельта их не трогает."

