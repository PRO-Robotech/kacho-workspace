blocking_findings:
  - id: B2-1
    kind: CONSTRUCTIBILITY
    title: Подключение модуля к notify без шагов NTF-1 K03 — у notify нет субъекта на Claim, рендер и старт отказывают
    where: "§3 (абзац «Подключённый модуль несёт»); NTF3-04; NTF3-66; G0; Р26; DoD 12.2 п.2"
    finding: >-
      NTF-1 @a6cb0c1f NTF1-K03 перечисляет семь шагов подключения службы kacho и у каждого пропуска
      называет свой красный: (1) ключ ленты и его ручка — отказ старта (B05); (4) звено Р2 на
      слушателях модуля, перечень {Subscribe, Claim, Ack}, таблица из notify.spiffe — Claim от notify
      получает PERMISSION_DENIED (C06); (5) строки каталога прав Claim/Ack — гейт аннотаций (C07);
      (7) строка таблицы подключаемых источников. Кроме того, NTF-1 Р10 и NTF1-H08 требуют у каждого
      источника выведенного перечня запись notify.sourceLimits.<модуль> и не дают ей умолчания:
      без записи рендер отвергается. В документе нет ни одного из четырёх пунктов — ни в §3, ни в
      NTF3-04, ни в Р26, ни в DoD 12.2 п.2. Поэтому G0 («notify забирает строку storage») на пяти
      модулях не строится. Given NTF3-66 (values из двух ключей) даёт отказ рендера, а не перечень
      «compute, nlb, registry, vpc, kaname».
    fix: >-
      Дополнить §3 и DoD 12.2 п.2 шагами NTF1-K03 (1), (4), (5), (7) для каждого из пяти модулей и
      записью notify.sourceLimits.<модуль>; в Р26 указать ручку ключа ленты модуля и sourceLimits
      как ручки NTF-1 с их границами. В NTF3-04 вывести отдельную строку на каждый пропуск. Given
      NTF3-66 и G0 дополнить записями sourceLimits. Добавить отрицательный сценарий «модуль без
      перечня звена {Subscribe, Claim, Ack} → Claim PERMISSION_DENIED, строка pending» с близнецом
      NTF3-15.
  - id: B2-2
    kind: NEGATIVE
    title: У публичного API notify-api нет ни одного fail-closed сценария на недоступность службы доступа
    where: "Р9, Р11 (последний пункт о проверке цели), Р20; группы M, O, R"
    finding: >-
      Новая публичная поверхность — пять сервисов notify-api. Каждый из них зовёт службу доступа:
      выдача ленты (listauthz), создание подписки на ресурс и на проект (Check v_get), контакты (GET —
      v_get на account; PATCH — v_update и проверка годности контакта). Р11 объявляет
      «UNAVAILABLE, PEER_UNAVAILABLE (fail-closed)» только для подписки, и ни один сценарий этого не
      утверждает. Для ленты и контактов исход при недоступной службе доступа не назван вовсе. Кроме
      того, Р11 называет производителем «справочник», хотя проверку цели делает Check клиентом прав
      фундамента: справочник по Р7 доступен только notify-sender. Неназванный исход на мутации
      допускает fail-open: подписка создаётся, контакт назначается без проверки годности.
    fix: >-
      Исправить Р11 на «служба доступа недоступна». Завести сценарии с близнецами: создание подписки
      при остановленной службе доступа → 503/UNAVAILABLE, reason=PEER_UNAVAILABLE, подписок 0
      (близнец NTF3-87); PATCH контакта → UNAVAILABLE, контакт не изменён (близнец NTF3-113); выдача
      ленты → UNAVAILABLE, а не 200 с пустой страницей (близнец NTF3-73). Пару «HTTP + code»
      сверить по таблице края.
  - id: B2-3
    kind: CONVENTION
    title: Подписка принимает kinds=STATE_CHANGE, но доставки по ней нет — принятое без читателя
    where: "Р11 (kinds), Р5 (строка «сбой / восстановление», колонка «мгновенно» — прочерк), Р3 (закрытые атрибуты resource-event), Р29"
    finding: >-
      Р11 принимает в подписке kinds из {RESOURCE_CHANGE, STATE_CHANGE}. Но по Р5 сбой и
      восстановление ресурса мгновенно не доставляются никому, кроме инициатора намерения. Адресованная
      строка volume-error/volume-recovered уходит только ему. Строка resource-event несёт закрытые
      атрибуты без состояния (Р3), поэтому переход в ERROR notify не отличит от любой правки
      UPDATED. Подписчик с kinds=[STATE_CHANGE] писем не получит никогда: ни один сценарий этого не
      утверждает, производителя у такого письма нет. Это значение, принятое и проигнорированное
      (api-accepted-ignored). По тому же признаку ячейка каталога (storage, STATE_CHANGE, CONSOLE) =
      ALWAYS не имеет своей доставки: в ленту консоли событие попадает строкой resource-event вида
      RESOURCE_CHANGE.
    fix: >-
      Выбрать один исход. Первый: снять STATE_CHANGE из kinds подписки — INVALID_ARGUMENT с полем
      kinds и близнецом, как NTF3-90 (ж). Второй: определить доставку — например, атрибут перехода
      у resource-event и отбор по нему — со сценарием и близнецом. Ячейку CONSOLE у STATE_CHANGE
      снять либо назвать её производителя.
  - id: B2-4
    kind: CONVENTION
    title: Префикс-строгая проверка формата ЧУЖИХ id без записанного исключения B4
    where: "Р11 (resource_id «по приставке вида», часть до «/» у registry_repository); NTF3-90 (в), (л); NTF3-116 (acc@1, u@1); NTF3-114 (sa-1)"
    finding: >-
      storage_volume, registry_repository, account, user — чужие для notify типы. По
      api-format-check-own-only чужой id проверяется только существованием у владельца. Исключение
      api-b4-recorded-exceptions допустимо лишь как записанное решение (docs/architecture сервиса) и в
      трёх границах. Первая из них: проверка family-agnostic, чужой префикс проходит к владельцу.
      Р11 задаёт проверку «по приставке вида», и записи решения нет. В том же пункте документ сам
      ссылается на api-format-check-own-only, отказываясь судить имя репозитория, то есть непоследователен.
      Следствие для контракта. При префикс-строгой проверке user id назначение sa-1 в NTF3-114
      получит INVALID_ARGUMENT «invalid user id», а не FAILED_PRECONDITION, который утверждает сценарий.
    fix: >-
      Либо записать исключение B4 в границах (family-agnostic corevalidate.ResourceID по
      платформенному каталогу, запись в docs/architecture notify и ссылка из правила) и переписать
      Р11 и NTF3-90/116 без слов «по приставке вида»; либо перейти на existence-only: мусорный чужой
      id → FAILED_PRECONDITION PEER_RESOURCE_MISSING, как у невидимой цели, и поправить NTF3-90 (в), (л)
      и NTF3-116. Выбранное согласовать с NTF3-114 (sa-1).

non_blocking_findings:
  - "Р9: выдача ленты упорядочена `occurred_at DESC, id DESC`, а api-pagination-cursor задаёт курсор (created_at, id) по возрастанию. occurred_at ставят часы разных модулей, а seenUpTo — позиция приёма. Порядок показа и отметка просмотра судятся разными осями. Назвать отступление решением либо упорядочить по позиции приёма."
  - "Р7/Р12/Р13: у Resolve типы resource_refs ограничены видами namespace. Не сказано, с каким namespace notify зовёт Resolve для строк сводки (пространство notify, а строки — видов модулей) и для мгновенного письма по подписке. Назвать: вызов на строку, namespace — модуль строки."
  - "§11 NTF3-127: координата deploy/helm/umbrella/charts/notify расходится с NTF-1 Р1 deploy/helm/notify/ (подчарт зонтика). Назвать, рендерится ли notify-api при пустом перечне источников (NTF1-N04) и при установке рядом с самостоятельной kaname (Д1)."
  - "DoD 12.1 п.1: «сервер подписки отказывает в старте владельцу, чей журнал не несёт initiator/occurred_at» — сценария нет. Добавить либо снять пункт."
  - "Р5, последний абзац: «событие сбоя … строки ленты не ставит». NTF3-131 утверждает 2 строки resource-event. Уточнить: «адресованной строки»."
  - "Д10 «операции и удаление с именем»: у operation-failed атрибута имени ресурса нет. Назвать это решением со строкой спора либо добавить имя (DNS-метку)."
  - "NTF-4 @7d036fa6 подавляет отписку парой (ns, шаблон) — NOTICE_TEMPLATE. Здесь выключатель — ячейка (модуль, вид, канал). Назвать связь двух выключателей: ставит ли ссылка отписки ячейку DISABLED, или это отдельное подавление. Иначе у пользователя два разных «отключено»."

method_verdict: >-
  Форма сильная. Производитель назван у всех «Тогда» (0 без производителя). Все 147 живых номеров
  входят в списки проб DoD; лишних номеров в DoD нет. Близнецов 115 строк. Каталог (19/14/11) и
  перечень кодов (17) пересчитаны и сходятся. Решения диспетчера Д1–Д13 перенесены. Отступления
  (Д8 — категории контактов и переопределение проектом, Д10 — виды без типа модели) названы
  строками §1.11 с причиной. Возврат вызван четырьмя местами. Шаги подключения NTF-1 не
  перенесены на сторону модуля. У новой публичной поверхности нет fail-closed сценариев. В
  подписке есть значение без доставки. Формат чужих id проверяется вне записанного исключения.
