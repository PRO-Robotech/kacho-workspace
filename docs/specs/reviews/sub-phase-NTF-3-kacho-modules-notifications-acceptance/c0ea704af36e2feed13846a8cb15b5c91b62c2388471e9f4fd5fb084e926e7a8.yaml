blocking_findings:
  - id: D17-1
    kind: SCOPE
    title: У notify-api публичный слушатель и маршрут края к нему, а по Д17 у notify публичного слушателя нет по построению
    where: "Р8, строки 694–705; Р25, строка 1160; §4, строка 1386 (замещение NTF-1 Р1); NTF3-116, строка 2405; NTF3-127, строки 2902–2906; §6 и §13 (про Х5 и порядок стадий ничего нет)"
    finding: >-
      Д17 (вариант (б) по Х5 NTF-4): corelib получает форму хоста «только внутренний слушатель»;
      у notify публичного слушателя нет по построению (Р20 и З4 в силе); цепочку прав и
      идентичности собирает один строитель хоста; решение действует и для NTF-1, notify один.
      Редакция 13 утверждает обратное. Р25 — «Сервисы регистрируются на публичном слушателе
      `notify-api` и маршрутизируются краем». NTF3-116 вызывает `AccountNotificationContactsService`
      «по gRPC на публичном слушателе `notify-api`». NTF3-127 держит «маршруты края к `notify`
      указывают только на `notify-api`». Замещение NTF-1 Р1 в §4 опирается на тот же публичный
      API. NTF-4 Р20, на который ссылается Д17, говорит: «Публичного слушателя у notify нет и не
      появляется», а соединение края с notify лежит под ключом `notifyInternal`, «и это
      единственное имя notify в крае». Реализация по NTF-3 поднимет у notify публичный слушатель
      через пару `servicehost`. Реализация по NTF-4 и Д17 его не поднимет, и тогда весь публичный
      API NTF-3 (Р9–Р11, Р20, Р29; NTF3-73…95, 112…116, 146…149, 156, 157) останется без пути от
      края. Держателя, который это различает, нет. Зависимости NTF-3 от выпуска corelib с Х5 в
      документе тоже нет: grep 'Х5' → 0.
    fix: >-
      (1) Р8 и Р25 переписать под Д17: публичные по контракту сервисы notify (настройки,
      подписки, контакты, лента, каталог) обслуживаются на единственном gRPC-слушателе notify
      (mTLS), который поднимает носитель в форме Х5, с той же цепочкой прав и идентичности. Край
      маршрутизирует к нему внешние REST-пути `/notify/v1/…`. Назвать, как это согласуется с
      ban06: на том же слушателе живёт `InternalSuppressionService` NTF-4, поэтому граница «внешнее
      / внутреннее» держится таблицей маршрутов края, а не слушателем. Нужны держатель-отрицание —
      путь `InternalSuppressionService` через внешний вход края → отказ, по образцу NTF3-30 и
      `assert-ban6-external-isolation.py`, — и положительный близнец: `GET /notify/v1/preferences`
      через внешний вход → 200. (2) Решить, остаётся ли разделение на `notify-sender` и
      `notify-api`. Если да — у `notify-api` тоже форма Х5, и в крае добавляется второе имя notify
      рядом с `notifyInternal` NTF-4. Это расходится с «единственное имя notify в крае», поэтому
      нужна строка disputes против NTF-4 Р20 либо один ключ края на оба набора. Если «notify
      один» из Д17 означает одно развёртывание — Р8 снять, а секрет почты и публичный API
      развести другим способом, не слушателем. Выбор — строкой в §2 с основанием от Д17. (3)
      NTF3-116: «на публичном слушателе» заменить на слушатель из п.1. NTF3-127: число портов пода
      и отсутствие публичного слушателя — у каждого развёртывания notify. (4) §4: строка замещения
      NTF-1 Р1 и З9 NTF-4 под новую форму. §13: зависимость стадии, которая вводит API notify, от
      тега corelib с Х5 (как «S3 ждёт Х5» в NTF-4 §1.1). §11 и DoD — производитель Х5.
  - id: D17-2
    kind: COVERAGE
    title: Держатель начала первого окна NTF3-103 (д) утверждает попадание события, которое по Р12 лежит вне окна
    where: "NTF3-103 (д), строки 2285–2293; Р12, строки 917–921"
    finding: >-
      По Р12 первое окно адресата без записей — (E − P, E], и «событие, принятое до начала
      первого окна, в сводку адресата не входит». В (д) событие `net-8` создано в t0 − 30h. Проход
      в t0 впервые встречает `usr-A` и `usr-B`, первое окно — (t0 − 24h, t0]. Сценарий требует:
      «каждый получает ровно одно письмо с 1 строкой (`net-8`)». Но t0 − 30h < t0 − 24h, поэтому
      по правилу `net-8` в окно не входит, сводка пуста и не отправляется. Верная реализация Р12
      проваливает эту букву, а реализация «первое окно без нижней границы» её проходит. Держатель
      ловит обратное тому, что утверждает правило. Вторая половина буквы (`usr-N`, окно
      (t0, t0 + 24h], `net-8` вне его) и близнец (запись с концом t0 − 48h, 3 строки) правилу
      соответствуют.
    fix: >-
      Перенести `net-8` внутрь первого окна `usr-A` и `usr-B`, например на t0 − 6h. Тогда
      t0 − 6h ∈ (t0 − 24h, t0], у `usr-A` и `usr-B` по письму с `net-8`; у `usr-N` окно
      (t0, t0 + 24h], `net-8` вне окна и есть в его ленте консоли (Р9, проверка v_get при выдаче);
      близнец — окно (t0 − 48h, t0 + 24h], 3 строки. Чтобы граница держалась явно, в ту же букву
      добавить событие `net-9` в t0 − 30h: его нет ни в одном письме прохода t0. Это отличает
      правило от реализации «первое окно без нижней границы». В каждом Given группы P, где есть
      событие, писать сверку «T ∈ (S, E]».

non_blocking_findings:
  - "Р12: у смены периода держится только направление DAY → HOUR (NTF3-108 (а)). Направление HOUR → DAY из примера Р12 («окно созреет в ближайшие 00:00») пробы не имеет. Реализация «E = S + новый период» проходит (а), а после HOUR → DAY сдвигает сетку адресата на 10:00. Буква NTF3-108 (б): HOUR → DAY в 10:30 при S = 10:00; проход в 00:00 следующих суток — одно письмо за (10:00, 00:00]; близнец без смены периода."
  - "Р12: не названо, какие события выбирают проекты, чью аудиторию читает проход, когда у адресата записей ещё нет (первое окно) либо записи есть, но далеко в прошлом (догон). Фразой «события, попавшие в окно» это не решается: окно у каждого адресата своё, а адресатов проход узнаёт из аудитории. Достаточно одной фразы, например: «проход читает аудиторию проектов, у которых есть события позже самого старого незакрытого начала окна среди записей, либо в последнем периоде — для адресатов без записей»."
  - "NTF3-103 (г): оговорка «проходы промежуточных тактов получают тот же отказ и ничего не пишут» утверждает исход проходов, которых сценарий не вызывает: в предисловии группы P проходы идут только в названные моменты. Либо назвать их явно (например, «часы на t0 + 24h + 5m, сборщик проходит»), либо снять оговорку."

method_verdict: >-
  Возврат круга 6 закрыт по существу: такт, сетка, созревание, догон одним письмом, закрытие
  однажды на начало окна. Держатель (г) ловит реализацию «одно окно за проход». Счёт
  158/7/151 сходится, гигиена 0, Д14–Д16 не задеты. Новых возвратов два. Первый — по новому
  решению Д17: документ заводит у notify публичный слушатель и маршрут края к нему, а Д17 и
  NTF-4 Р20 это исключают. Без правки публичный API NTF-3 остаётся без пути, и зависимость от
  выпуска corelib с Х5 не названа. Второй — у держателя начала первого окна (д) время события
  лежит вне окна, которое производит Р12: буква требует обратного правилу.
