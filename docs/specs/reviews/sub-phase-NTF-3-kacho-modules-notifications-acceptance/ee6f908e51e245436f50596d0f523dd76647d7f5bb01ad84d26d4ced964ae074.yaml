    сверялись. Д14–Д16 взяты из текста задания.
  seeded: 0
  seeding_note: >-
    Посевов не было: в дереве нет ни notify, ни справочника, стенд заданием не назван. Новые буквы
    NTF3-118 (е), (ж), (з) отвергаются синхронной проверкой входа до вопроса к модели. Их Given —
    это Given NTF3-118, а он в прошлых кругах проверен. Близнец (ж) на 100 ссылок держится на
    id `vol-101`…`vol-199` той же формы, что `vol-1`/`vol-20`, у которых Р11а даёт `nil`. Близнец
    (з) держится на `vol-2`, а он в Given посеян. `storage_snapshot` — вид storage (§1.2, строка
    163), поэтому (з) падает на смеси, а не на типе. Исход «не выполнилось», а не «зелёный».
  confirmed:
    - "B3-1 закрыт: `resource_refs: required` перенесён в шаг (1) Р7. Держит его NTF3-118 (е), близнец `[{storage_volume, vol-1}]` → ADDRESS, строка §10 есть, производитель — §11 и DoD 12.2 п.4."
    - "B3-2 закрыт: отрицания «101» и «смесь» вынесены в буквы (ж) и (з), у каждой близнец по одному факту: 100 ссылок без `vol-199` против 101; `{storage_volume, vol-2}` против `{storage_snapshot, snp-1}`. Строки §10 есть, граница 100 названа в §11 и DoD."
    - "Перепись отказов Resolve в Р7 (11 отказов) сверена по держателям: у каждого есть буква или сценарий, строка §10 и производитель §11."
    - "Неблокирующие круга 3 выполнены: место записывающей подмены названо (порт модели сценария использования Resolve, перехватчик в счёт не входит). Строки §10 NTF3-28 и NTF3-151 называют тип вместе с отношением и id."
    - "Д14: семь мест Д-1…Д-7 названы в §1.12 (строка 370) и в Р28 (строки 1145–1153), BatchCheck отнесён к AuthorizeService (строки 1246–1247). Д15: строка решения в §2.1 (строка 421). Д16: файла в main и origin/main нет (0)."
  refuted:
    - "Заголовок редакции 10 утверждает, что отказы трёх методов справочника переписаны полностью: «ListProjectAudience 3, ListExpiringCredentials 4». Проверка это опровергает. `page_size` вне [0..1000] не назван ни у одного из двух методов (`api-pagesize`). Мусорный `page_token` не назван у ListExpiringCredentials. Многостраничного обхода ListExpiringCredentials нет ни в одном сценарии, и Р19 не говорит, что задание проходит все страницы (B4-1, B4-2)."

blocking_findings:
  - id: B4-1
    kind: COVERAGE
    title: Пагинация ListExpiringCredentials в контракте есть, но ни сценарий, ни решение потребителя её не держат
    where: "Р7, строка 579 (сигнатура с page_token и page_size); Р19, строка 939 (задание зовёт метод на окно); NTF3-122; NTF3-140..145"
    finding: >-
      Метод списочный: в сигнатуре есть page_token и page_size. Но ни один сценарий не проходит
      больше одной страницы. Р19 говорит «зовёт ListExpiringCredentials на окно» и не требует
      пройти все страницы. Порядок выдачи и форма курсора (по какой колонке идёт курсор) тоже не
      заданы. Реализация по этой приёмке может читать одну первую страницу, и все сценарии останутся
      зелёными. Если в окне больше учётных данных, чем помещается на страницу по умолчанию (50),
      часть напоминаний класса `security` потеряется молча, и ни одна проба этого не заметит.
      Следующий проход задания снова получит ту же первую страницу: записи однократности не убирают
      учётные данные из окна. Для сравнения, ListProjectAudience такой держатель имеет (NTF3-117,
      page_size=2, все страницы).
    fix: >-
      Р7: назвать порядок выдачи ListExpiringCredentials и курсор, например `(expires_at, id)` по
      возрастанию, непрозрачный токен. Р19: записать, что задание проходит страницы до пустого
      next_page_token. Добавить букву NTF3-122 (г): тот же первый вызов с page_size=1 и обходом всех
      страниц даёт в объединении ровно `{uoc1, soc1}`, по одному на страницу. В NTF3-140..145 (или
      отдельной буквой) добавить: у задания напоминаний страница справочника меньше числа истекающих
      учётных данных, и письмо получает каждый из них, а не только первые. Близнец — то же число в
      пределах одной страницы. Строки §10 и производитель §11 (обход в задании notify-sender).
  - id: B4-2
    kind: NEGATIVE
    title: Отказы пагинации внутренних списков справочника не названы и не держатся
    where: "Р7, строки 571–583 (перепись «ListProjectAudience 3, ListExpiringCredentials 4»); NTF3-117; NTF3-122; §10; §11"
    finding: >-
      По `api-pagesize` значения page_size вне [0..1000] и мусорный page_token дают INVALID_ARGUMENT,
      а не clamp и не первую страницу. Перепись Р7 объявлена полной, но у ListProjectAudience нет
      отказа на page_size, а у ListExpiringCredentials — ни на page_size, ни на мусорный page_token.
      Без держателя реализация в TDD может молча подрезать page_size или начать с первой страницы.
      С мусорным курсором задание напоминаний тогда пойдёт по кругу по первой странице, и отказа
      оно не увидит. У публичных списков notify-api эти отказы есть (строки 1050, 1807–1808), а у
      внутренних — нет. Та же ось осталась непокрытой.
    fix: >-
      В Р7 для обоих методов записать: page_size вне [0..1000] — INVALID_ARGUMENT с полем page_size;
      мусорный page_token — INVALID_ARGUMENT с полем page_token; оба проверяются до права и до
      чтения (`api-pagination-before-shortcircuit`). Держатели — буквы NTF3-117 (page_size=1001;
      близнец page_size=1000 даёт страницу) и NTF3-122 (мусорный page_token и page_size=1001;
      близнецы — без токена и page_size=1000). Добавить строки §10 и производителя §11. Перепись в
      Р7 исправить на «ListProjectAudience 4, ListExpiringCredentials 6».

non_blocking_findings:
  - "Р11а (г) перечисляет обязательные поля справочника без нового `resource_refs: required` (строки 789–791). Это не id-поле, и функция формата его не касается. Но Р11а (г) читают как список всех отказов `<field>: required` у справочника, поэтому стоит дописать или прямо сказать, что Р11а перечисляет только id-поля."
  - "Таблица Р11а объявляет, что измерено «каждое id-подобное слово документа». `vol-101`…`vol-199` из NTF3-118 в таблице нет. Форма у них та же, что у `vol-1`, исход тот же (`nil`), но их стоит вписать в строку `nil`, иначе утверждение таблицы неверно."
  - "§1.12 держит NTF-1 @b347b81f. На этот отпечаток NTF-1 есть свежая запись первичного разбора классов «вернуть в приёмку» (коммит 0ab60915b, RA-01…RA-06). Когда выйдет новая редакция NTF-1, сверить опоры §1.12 диффом, как в редакции 9."
  - "NTF-6 в §1.12 держится @d5fe4734. Рабочая копия NTF-6 в ветке изменена и не закоммичена (чужая правка). После одобрения NTF-3 перевести NTF-6 на итоговый отпечаток (Д15)."

method_verdict: >-
  Возврат круга 3 закрыт полностью: у B3-1 и B3-2 есть буквы, близнецы, строки §10 и производитель.
  Перепись отказов Resolve (11) сверена по держателям. Счёт 158/7/151 сходится, у каждого живого
  сценария есть строка §11, гигиена 0, Д14–Д16 соблюдены. Новый возврат касается соседнего метода
  справочника, а не Resolve. ListExpiringCredentials — единственный вход задания напоминаний
  класса `security`. Его пагинация не держится ни обходом, ни отказами, а Р19 не требует обхода.
  Реализация, читающая одну страницу, пройдёт все сценарии, а часть напоминаний потеряет молча.
  Правка: две-три буквы, порядок и курсор в Р7, одна фраза в Р19, строки §10 и §11. Новых номеров
  не нужно.
