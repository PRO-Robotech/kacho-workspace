      ResolveVerbsAndTier (rule_verbs.go:63), delete → admin (verbBackCompatTier, :158); отношение
      admin у registry_registry прямое [user, service_account, group#member] (fga_model.fga:1295) —
      кортеж user:<s> admin registry_registry:<id> его даёт. kacho @ffbe930dbe: CreateRepository —
      registryGate(v_create), затем requireRegistryAdmin при PUBLIC (handler/repository.go:52-60),
      отказ — PERMISSION_DENIED с текстом «creating a public repository requires registry admin»
      (listauthz.go:205-207), до Operation. Близнец (г): get, create → ярус editor, admin false,
      v_create true — отказ ровно этим производителем.
  - id: B2
    kind: TWIN
    status: closed
    evidence: >-
      Близнец NTF3-189 (а): CREATED поколения 1 при надгробии gT ≥ 2 — REJECTED_STALE по «Приём
      поколения — CAS» (строка 2085); публикация object_generation 1 при надгробии — REJECTED_STALE по
      «Публикация для анонимного чтения» (строки 2194-2196); вопрос об аудитории — без отказа: барьер
      срабатывает только при «последнее применённое меньше g_E» (строка 2081). Все три исхода
      производятся правилами документа; вред назван и держится гейтом NTF3-187 (г).
  - id: B3
    kind: PRODUCER
    status: closed
    evidence: >-
      Р30 «Переименование репозитория — два события двух объектов» (строки 2112-2135): DELETED прежнего
      id и CREATED нового, по строке журнала и намерению на каждое, поколения из счётчиков обоих id,
