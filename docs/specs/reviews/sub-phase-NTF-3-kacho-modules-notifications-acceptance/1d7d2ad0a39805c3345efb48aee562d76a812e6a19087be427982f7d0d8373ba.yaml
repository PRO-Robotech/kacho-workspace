defaults_fixed_at_review:
  - id: D1
    question: >-
      NTF3-189 не объявляет порядок прогона букв и близнецов. Близнец (а) (внедрение снятия счётчика) и
      близнец (б) (регистрация gT + 2 прямым вызовом С24) меняют состояние объекта …/pub; если они
      исполнены в одной цепочке перед (в), DELETED usr-B получит поколение gT + 2, не новее головы
      gT + 2 — REJECTED_STALE, и Given (в) («надгробие gT + 2») не построится.
    default: >-
      Близнецы (а) и (б) NTF3-189 — каждый отдельным прогоном от состояния, названного в их When; основная
      цепочка — (а) → (б) → (в) без близнецов; (г) — отдельный прогон, как сказано в документе. Автор проб
      вписывает это в шапку функции пробы; правка документа при следующей редакции — одной фразой, как у
      NTF3-186 («каждая в отдельном прогоне от состояния после (а)»).
