blocking_findings:
  - id: B1-1
    kind: CONVENTION
    title: Форма права на отправку и субъект notify расходятся с Д2 и Д4 без строки спора
    where: "§2.1 строка Д4; §1.9; Р7; §8 G0 (выдачи манифестов); NTF3-21; NTF3-50; NTF3-55; §12.2 п.4"
    finding: >-
      Д4: право на отправку — отношение модели kaname «service:<модуль> sender на
      notification_namespace:<модуль>»; Д3: reader на notification_feed:<модуль> у service:notify;
      Д2: служебный принципал service:<имя> из сертификата, заводится только манифестом модели.
      Документ пересказывает Д4 как «send на ленту модуля» (строка Д4 таблицы §2.1), в G0 сеет
      «send модулей на свои ленты», «send notify на ленту notify», говорит о «кортеже reader учётки
      notify» (§1.9, Р7, G0, NTF3-55) и о выдаче «своей учётке» (NTF3-50). Отношения send на ленте в
      модели нет, учётки у notify как субъекта нет (NTF-1 @a6cb0c1f Р2 п.5, Р5, замещение З1). Строки
      спора с Д2/Д4 нет.
    fix: >-
      Переписать строку Д4 §2.1 дословно по Д4; в G0, §1.9, Р7, NTF3-21, NTF3-50, NTF3-55 —
      service:<модуль> sender notification_namespace:<модуль>, service:notify reader
      notification_feed:<модуль>, строка манифеста в форме NTF-1 Р5; слово «учётка» для notify снять.
  - id: B1-2
    kind: CONSTRUCTIBILITY
    title: Право notify на справочник не строится — перечень методов звена, тип объекта и форма строки манифеста не названы
    where: "Р7; §8 G0; NTF3-23, 27, 50, 55, 117–122; §12.2 п.4"
    finding: >-
      (а) Д2: субъект из сертификата появляется только на закрытом перечне методов. NTF-1 @a6cb0c1f
      S2 ставит на слушатели kaname перечень {ResolveSend}. Документ не расширяет его методами
      Resolve, ListProjectAudience, ListExpiringCredentials; на них у вызова notify субъекта нет, и
      Check reader ложен — Given NTF3-23 («notify вызывает Resolve … → ADDRESS») не строится.
      (б) Тип объекта справочника не назван («объект справочника», «тип объекта справочника»).
      (в) Формы строки манифеста для выдачи reader на справочник нет: строка NTF-1 Р5 —
      {namespace, readers: [notify]}, и её валидатор знает только ленту. Близнец NTF3-50 («та же
      строка в манифесте notify») поэтому не выразим. (г) NTF-1 Р5 закрывает перечень типов без
      надзора администратора облака {notification_feed, notification_namespace}. Входит ли туда
      тип справочника — не решено; а от этого зависит, читает ли администратор облака адреса всех
      пользователей мимо модели.
    fix: >-
      Назвать тип (например notification_recipient_directory, объект-одиночка), определить
      define reader: [service] и строку манифеста notify с правилом валидатора. Внести три метода в
      перечень звена Д2 на слушателях kaname и в перечень вызывающих. Решить, входит ли тип в
      перечень без надзора, и держать это сценарием с близнецом. Правку NTF-1 назвать строкой §4.
  - id: B1-3
    kind: CONSTRUCTIBILITY
    title: Форма адресата «субъект» не определена ни здесь, ни в NTF-1 — адресованные строки модулей получат INVALID
    where: "Р3 (fanout), §4 строка «NTF-1 Р7», NTF3-06, 10, 15, 43, 52, 129, 133; перечень источников"
    finding: >-
      NTF-1 @a6cb0c1f Р6: «форма адресата в NTF-1 одна — адрес … адресация субъекта — NTF-3
      (NTF1-G21)»; запись перечня источников несёт «формы адресата». Страж старта notify отвергает
      форму address вне {kaname, standProbeNamespace}. Строка без разрешённой формы получает
      INVALID(recipient_form_not_allowed). Документ считает форму subject уже существующей в NTF-1
      (§4: «NTF-1 Р7: адресат — address | subject») и дописывает только fanout. В итоге форму subject
      не определяет никто: её вид (только user:<id>?), проверку при Put и в notify, формы в записях
      перечня модулей ({subject, fanout}) и страж. Строки user:usr-A от storage и от движка операций
      по правилу NTF1-G21 не дойдут до отправки.
    fix: >-
      Завести решение «форма адресата subject»: вид значения, кто его ставит, проверка при
      постановке и приёме. В записях перечня источников модулей объявить формы {subject, fanout},
      у notify — свои. Добавить сценарий «строка модуля с формой address → INVALID» с близнецом
      «subject → SENT». Строку §4 исправить на текущий текст NTF-1.
  - id: B1-4
    kind: CONSTRUCTIBILITY
    title: Класс security у notify/credential-expiring запрещён NTF-1 без названного замещения
    where: "Р5 (строка истечения), Р19, NTF3-140..145, §12.3 п.3"
    finding: >-
      NTF-1 @a6cb0c1f Р6: класс security допустим только пространствам identityNamespaces = {kaname}.
      Это константа сборки, значением установки перечень не расширяется. Гейт сборки на шаблон
      security вне перечня красный (NTF1-G20). По NTF-1 Р7 limits обязательны для security.
      Р19 ставит шаблону notify/credential-expiring класс security в пространстве notify, не
      расширяя перечень и не объявляя limits. Шаг bundle красный, и NTF3-140..145 не строятся.
    fix: >-
      Либо расширить identityNamespaces до {kaname, notify} строкой §4 (замещение NTF-1 Р6) с
      причиной, limits шаблона и отрицательным сценарием «шаблон security модуля kacho отвергнут»
      с близнецом; либо выразить неотключаемость напоминания иначе, не классом security.
  - id: B1-5
    kind: SCOPE
    title: Допуск часов — второй механизм о предмете, который NTF-1 уже решила полосой отсечки
    where: "Р23, Р26 (clockSkewTolerance), §4, §13, NTF3-123..125, §12.2 п.4"
    finding: >-
      Р23 заводит global.kacho.notifications.clockSkewTolerance с границами [1s, 30s] и ориентиром
      2s, ссылаясь на то, что «NTF-1 Р3 оставил допуск NTF-3». В NTF-1 @a6cb0c1f Р3 — исключение
      kaname. Сам допуск там уже решён в Р5: полоса notificationCutoffGuard, [1s..10m], ориентир 30s,
      правило «REVOKED, если enqueued_at < отсечка + полоса» для каждой ленты (NTF1-F20). Выходят две
      ручки об одном правиле. Близнец NTF3-125 (C + 3s → ALLOW при допуске 2s) противоречит полосе
      NTF-1. Строка NTF3-125 о ленте службы доступа утверждает ALLOW от ResolveSend, но по NTF-1 Р3 и
      G22 для пространства kaname ResolveSend не зовётся вовсе.
    fix: >-
      Правило отсечки в kaname взять у NTF-1 (полоса), свою ручку kaname не заводить. Если сверка
      source_now в notify нужна, её допуск вывести из той же величины и так и назвать. Переписать
      NTF3-123..125, Р26, §13 и DoD 12.2 п.4. Строку о ленте kaname снять.
  - id: B1-6
    kind: COVERAGE
    title: Ось канала (Д9 «каналы — интерфейсом») контрактом не выражена; Р5 утверждает обратное
    where: "Р5 (последний пункт), Р10, Р11, §6; соседняя NTF-6"
    finding: >-
      Р5: «вебхук и мессенджер — новые значения канала той же подписки и того же правила». Но
      правило Р10 — {module, event_class} → mail_enabled, а подписка Р11 канала не несёт. Нового
      значения канала в этих контрактах нет: новый канал — это новое поле и смена формы. Д9 требует
      каналы интерфейсом. Приёмка NTF-6 (c82cd21b), построенная «поверх API этой под-фазы», ждёт
      оси канала (entries[]{module, kind, channel, state}, каталог GET /notify/v1/catalog, подписка с
      channel). В NTF-3 этих контрактов нет.
    fix: >-
      Ввести канал ключом правила и подписки: закрытое перечисление, в объёме — MAIL; лента консоли
      — ALWAYS, правкой не выразима. Добавить сценарий «неизвестный канал → INVALID_ARGUMENT с полем»
      и близнеца. Какой форме API быть (правила Р10 или entries/каталог NTF-6), решает эта приёмка,
      потому что API её; решение назвать, чтобы NTF-6 правилась по нему.
  - id: B1-7
    kind: CONSTRUCTIBILITY
    title: NTF3-57 требует управляемых часов базы модуля — такого средства нет
    where: "NTF3-57 Given/Then; §8"
    finding: >-
      Given: «управляемые часы базы модуля стоят на 2026-10-01T10:00:00.734Z»; Then: occurredAt =
      «2026-10-01T10:00:00Z». У storage (и registry) журнал пишется триггером, время строки ставит база
      (created_at DEFAULT now(), 20260828153423_storage_subscription_journal.sql:136 @1d42a6728bf).
      В §8 (С6) управляемых часов базы модуля нет.
    fix: >-
      Утверждать occurredAt равным времени транзакции строки журнала, усечённому до секунды
      (прочитанному пробой из таблицы), без дробной части. Либо назвать средство, которое задаёт
      время базы, и внести его в §8.

non_blocking_findings:
  - "G0: у usr-E роль с v_get на project:prj-1 и без v_get на ресурсы storage, а про vpc ничего не сказано. usr-E — в аудитории ListProjectAudience (NTF3-117). Если роль даёт v_get на сети, «писем 0» в NTF3-109 ложно, а NTF3-103 про usr-E молчит. Сузить роль: без v_get на ресурсы любого модуля."
  - "NTF3-79: отказ ленты консоли несёт текст «notification settings are available to users only» — это текст настроек. Назвать текст ленты либо один общий текст для всех сервисов notify."
  - "NTF3-135: не назван глагол vpc, который отвечает Operation с done=true и ошибкой INVALID_ARGUMENT, — по api-error-codes-vocab формат отвергается синхронно, без Operation. Назвать производителя или снять половину."
  - "NTF-1 @a6cb0c1f Р10: «сводку вместо отложенных писем (DEFER(recipient_net)) заводит NTF-3». Здесь ни решения, ни строки спора нет. Взять или отклонить явно."
  - "Строка §4 о замещении NTF-1 Р1 называет только слушатель. NTF-1 Р1 говорит и «база kacho_notify — только для счётчиков лимитов»; лента консоли, настройки, подписки и контакты это тоже замещают."
  - "Контакты правит держатель v_update на аккаунт, а задание говорит «пользователь меняет только свои». Записать решением, что контакт — свойство аккаунта."
  - "Р14: лимиты шаблонов storage записаны числами в notification.yaml (20/ч, 200/ч), а Д11 называет числа поставляемыми значениями с границами. Указать, что лимиты шаблона — форма NTF-1 Р7, а не ручка установки."
  - "NTF3-95: id репозитория reg-1/pub содержит «/». Определить форму resourceId цели подписки для составных id (Р25 — corevalidate.ResourceID первым стейтментом)."
  - "Строка редакции 5 в шапке не несёт счёта. Его надо вписать: номеров 148, снято 5, живых 143, стадий 3, решений Р1–Р26."

