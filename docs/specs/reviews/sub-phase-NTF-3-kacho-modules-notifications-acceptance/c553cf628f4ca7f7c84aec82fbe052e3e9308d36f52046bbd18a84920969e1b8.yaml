blocking_findings:
  - id: B1
    kind: CONSTRUCTIBILITY
    anchor: "NTF3-163 Given и (б); NTF3-164 Given и (б); §7 «отзыв прав — посев С1»"
    what: >-
      Исход буквы (б) зависит от времени. Отказ владельца после отзыва прав Given не гарантирует.
      Положительный вердикт владелец держит в кэше вердиктов. Окно кэша — «окно отзыва», и
      обнулить его нельзя: страж старта отвергает CacheWindow <= 0 (corelib
      servicecontract/contract.go:1123 @34bc8104a). Ключ кэша — (субъект, отношение, тип, id)
      (corelib authz/cache.go:179). Умолчание — 5s: vpc deploy/values.yaml:186 и
      internal/apps/kacho/config/config.go:121; storage config.go:146 @1d42a6728bf. Этот ключ
      ложится в кэш ещё в самом Given. NTF3-163: usr-B создаёт lb-r, nlb зовёт
      CreateOwnedAddress под usr-B. Тот метод требует editor на project
      (internal_address_service.proto:190-194), как и ReleaseOwnedAddress (:236-240), значит ключ
      один: (usr-B, editor, project, prj-1). NTF3-164: usr-B привязывает nic-r и vol-r. Attach и
      Detach у vpc и у storage требуют одного отношения editor на одном объекте
      (internal_network_interface_service.proto:39-56, internal_volume_service.proto:35-51).
      Посев, отзыв через С1 и запуск прохода в обвязке укладываются в окно. Тогда владелец
      отвечает из кэша «можно», адрес A5 (и nic-r, vol-r) освобождается, и (б) краснеет при
      верной реализации. После окна (б) зеленеет. Проверка «модель отвечает нет» спрашивает
      службу доступа, а не кэш владельца, и этого не видит.
    fix: >-
      Назвать в Given окно кэша вердиктов владельцев в обвязке (значение ручки vpc и storage).
      Условие: проход запускается не раньше, чем окно истекло после ответа модели «нет». Другой
      вариант — управляемые часы кэша (Cache.SetNowFunc, corelib authz/cache.go:359), сдвинутые за
      окно. И то и другое — Given, а не ожидание наугад.
  - id: B2
    kind: CONSTRUCTIBILITY
    anchor: "NTF3-164 Given («вопрос модели о usr-B на project:prj-1 отвечает «нет»»)"
    what: >-
      Проверка предпосылки NTF3-164 задаёт не тот вопрос, который задают владельцы. На пути
      прохода vpc проверяет editor на vpc_network_interface:nic-r, storage — editor на
      storage_volume:vol-r (аннотации выше). В модели эти отношения — прямые субъекты объекта или
      admin объекта. От editor проекта они не выводятся: kaname internal/authzmodel/fga_model.fga
      @734f69fb4, type vpc_network_interface и type storage_volume: «define editor: [user,
      service_account, group#member] or admin»; super_admin идёт только от super_admin проекта.
      Отзыв привязки роли снимает пообъектные записи материализацией, а это eventually consistent
      (data-integrity fga-flat-contract-a). Ответ «нет» по project:prj-1 не означает «нет» по
      nic-r и vol-r. Буква (б) остаётся недетерминированной и при закрытом B1. У NTF3-163 вопрос
      предпосылки совпадает с вопросом владельца (editor на project:prj-1), там этого дефекта нет.
    fix: >-
      Проверка предпосылки NTF3-164 спрашивает модель ровно то, что спросят владельцы: usr-B —
      editor на vpc_network_interface:nic-r и на storage_volume:vol-r. Добавить и вопросы
      предварительных чтений прохода (ListByInstance и ListAttachments), если у них своё отношение.
      Ждать, пока все ответы станут «нет», затем выждать окно кэша (B1).
  - id: B3
    kind: COVERAGE
    anchor: "Р2 («у балансировщика в CREATING — начавший его Create»); NTF3-163; §10 NTF3-163"
    what: >-
      Р2 вводит поведение, у которого нет держателя. Задание nlb выбирает строки в DELETING и в
      CREATING (free_ip_runner.go:77-86, WHERE status IN ('DELETING','CREATING') @1d42a6728bf) и
      сегодня освобождает адрес сироты CREATING под запасной личностью. По Р2 после под-фазы
      сироту CREATING доделывают личностью начавшего его Create. Если начавшего не восстановить,
      владелец не вызывается. Все буквы NTF3-163 (а, б, в) и близнец строят только DELETING.
      Реализация, которая ищет лишь операцию Delete, для CREATING не найдёт начавшего и не
      вызовет владельца. Адрес сироты CREATING утечёт навсегда, и ни один сценарий не покраснеет.
      Сегодня эта функция работает — значит, это регресс существующего поведения без держателя.
    fix: >-
      Добавить букву NTF3-163 (г). Посев С18: строка балансировщика в CREATING старше порога,
      строка операции Create с done=false и субъектом usr-A, выделенный адрес. После прохода:
      адрес NOT_FOUND. В журнале vpc ровно одна строка — Address DELETED с initiator =
      "user:usr-A". В журнале nlb строк по балансировщику 0 (emitReconcileFinalize стоит только
      на DELETING, free_ip_runner.go:375). Близнец по одному факту — (а).

non_blocking_findings:
  - id: N1
    anchor: "§8 С18, С19 — столбец «где»"
    what: >-
      В С18 обвязка «nlb + vpc», в С19 — «compute + storage + vpc». NTF3-163 и NTF3-164 и §10
      требуют ещё службу доступа в посадке production. Привести столбец к составу обвязки
      сценария.
  - id: N2
    anchor: "NTF3-164 Then (а), (в)"
    what: >-
      У VolumeService.Get vol-s, NetworkInterfaceService.Get nic-s и InstanceService.Get ins-n и
      других не назван вызывающий. В NTF3-163 он везде указан как «от usr-A». Дописать.
  - id: N3
    anchor: "Р2, исход (2) «субъект — запасной {system, bootstrap}»"
    what: >-
      Ветка «строка операции есть, субъект запасной» (умолчание столбцов principal_type/principal_id:
      nlb 0001_initial.sql:198-199, compute 0008_operations_principal.sql:19-20) держателя не
      имеет, (в) строит только «строки нет». В посадке production исход наблюдаемо совпадает с
      (в) (vpc отвергает system, authn_interceptor.go:85), поэтому не блокирует. Отдельная
      буква различила бы «не вызвал» и «вызвал и получил отказ» только по счётчику вызовов
      владельца.
  - id: N4
    anchor: "N1–N5 круга 3 RA-03"
    what: "Неблокирующие круга 3 прохода RA-03 остаются в силе; дельта их не трогает."

