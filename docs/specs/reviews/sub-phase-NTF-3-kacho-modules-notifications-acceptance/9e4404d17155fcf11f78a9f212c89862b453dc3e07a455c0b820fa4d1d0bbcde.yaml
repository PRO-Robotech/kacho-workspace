blocking_findings:
  - id: B6-1
    kind: COVERAGE
    title: Повтор незакрытого окна сводки держится проходом, которого расписание Р12 не производит; догон нескольких созревших окон не определён
    where: "Р12, строки 890 и 910–916; NTF3-103 (б), (в), строки 2226–2244; Р26 (ручки такта сборщика нет)"
    finding: >-
      Правка ввела окно у каждого адресата: незакрытое окно собирается «следующим циклом сборщика
      с теми же границами», а следующее окно начинается с конца закрытого. Сборщик по Р12 проходит
      «раз в период адресата». Для usr-B (период DAY) после отказа в t0 + 24h следующий цикл по
      правилу — t0 + 48h. В этот момент у usr-B созрели два окна: (t0, t0 + 24h] и
      (t0 + 24h, t0 + 48h]. Сколько окон проход собирает и сколько писем выходит, в документе не
      сказано. Держатели (б) и (в) этот момент обходят: повторный проход поставлен на t0 + 25h, а
      такой проход расписание Р12 не производит (у сборщика нет такта чаще периода, ручки в Р26
      нет). Реализация «один проход в период, одно окно адресата за проход» проходит (б) и (в),
      если проба вызывает проход на t0 + 25h. В работе же она сдвигает сводку адресата на один
      период после каждого отказа, и отставание копится без предела: окна собираются по одному за
      цикл, созревают тоже по одному, и адресат больше никогда не догоняет. Пробы этого не видят.
      Тот же пробел — у первого окна адресата: откуда оно начинается у пользователя, у которого
      записи закрытия ещё нет (новая привязка или ни одного события в его проектах). G0 задаёт это
      данностью («окна начинаются в t0»), но правило, которое производит эту данность, не названо.
    fix: >-
      (1) В Р12 назвать расписание прохода и правило созревания. Например: сборщик тикает раз в
      KACHO_NOTIFY_DIGEST_TICK (новая ручка Р26 с границами и стражем NTF3-126) либо раз в час
      постоянной сборки; проход собирает каждое окно адресата, конец которого ≤ сейчас и записи
      закрытия у которого нет, от старшего к младшему. Выбрать одно: одно письмо на окно или одно
      письмо на все созревшие окна, где закрываются все охваченные окна. (2) Назвать начало первого
      окна адресата без записи закрытия, например: начало периода, в котором адресат впервые попал
      в выдачу ListProjectAudience. (3) Держатель — буква NTF3-103 (г): как (б), но без прохода на
      t0 + 25h; следующий проход — в момент, который производит расписание из п.1 (при такте, равном
      периоду, — t0 + 48h), с событием `net-6` во втором окне. Тогда usr-B получает окно
      (t0, t0 + 24h] с net-3 и vol-3 и окно (t0 + 24h, t0 + 48h] с net-6 (двумя письмами или одним,
      как выбрано в п.1), а в t0 + 72h — 0 писем. Близнец — (г) без отказа. Если выбран такт
      короче периода, держатель (б) остаётся, а t0 + 25h выводится из такта. (4) Строки §10 и §11,
      пункт DoD. Номера сценариев не нужны, хватит буквы.

non_blocking_findings:
  - "Р12: у записи закрытия окна `(адресат, конец окна)` не названо, что при смене периода адресата (DAY → HOUR, Р10) окно, открытое по старому периоду, закрывается по какому периоду. Если правка п.1 B6-1 выберет письмо на все созревшие окна, это решается там же; иначе — одна фраза в Р12."
  - "Таблица С7: в режиме пересылки «N-й по счёту вызов метода в проходе» — у сборщика и у задания напоминаний проходы разные. Уточнить, что счёт ведётся отдельно на каждый проход каждого задания; иначе в NTF3-140 (б) счёт может включить вызовы сборщика сводки, если они идут в той же обвязке."

method_verdict: >-
  Возврат круга 5 закрыт: у отказа страницы одно прочтение, перепись вызовов справочника внутри
  прохода полная, у каждого вызова держатель с близнецом, строки §10, §11 и DoD есть, соседние
  отпечатки воспроизведены. Счёт 158/7/151 сходится, гигиена 0, Д14–Д16 соблюдены. Новый возврат
  касается правила, которое внесла сама правка: окно у каждого адресата. Его держатель проверяет
  повтор в момент, которого расписание сборщика не производит. Случай, который расписание
  производит, — два созревших окна у одного адресата — не определён и не держится ничем.
  Пропуск стоит бессрочного отставания сводки после каждого отказа справочника. Правка: одна
  фраза о расписании и созревании в Р12 (при необходимости ручка Р26), начало первого окна,
  буква NTF3-103 (г), строки §10 и §11.
