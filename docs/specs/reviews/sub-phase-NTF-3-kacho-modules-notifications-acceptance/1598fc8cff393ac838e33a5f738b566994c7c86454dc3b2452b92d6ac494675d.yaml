blocking_findings:
  - id: B1
    kind: COVERAGE
    anchor: "Р30 «Колонка версии прав» («триггер BEFORE INSERT OR UPDATE … идентификатор транзакции, последней записавшей строку»), «Вопрос с оградой»; NTF3-180 (б), NTF3-181 (б)"
    what: >-
      Ограда определяет «право не менялось с R_E» как «строку права никто не ПИСАЛ после R_E», а
      служба доступа переписывает исходные строки прав без изменения права на каждом своём старте.
      Измерено @8a84dcff6: cmd/kaname/serve.go:2040–2073 на каждом старте зовёт
      seed.BackfillOwnerBindings → syncAllSystemRoleSelectorsTx
      (internal/apps/kaname/seed/migrate_backfill.go:197, 286), который для КАЖДОЙ системной роли
      делает INSERT INTO kaname.role_rule_selectors … ON CONFLICT (role_id, rule_fp) DO UPDATE SET …,
      updated_at = now() без WHERE (:384–393), и seed.ReseedSystemRoleVerbs → RolesW().ReplaceRoleVerbs
      (internal/apps/kaname/seed/role_verb_reseed.go:195), то есть
      DELETE FROM kaname.role_verb WHERE role_id = $1 + INSERT заново
      (internal/repo/kaname/pg/role_repo.go:956, :961). Обе таблицы Р30 относит к исходным строкам
      («роль, её глаголы и правила»), обе получат триггер authz_rev. Следствие: после любого
      перезапуска или выкатки службы доступа у каждого события с R_E, снятым до старта, ограда
      отбрасывает всех субъектов, чьё право идёт через системную роль (admin, edit, view), — аудитория
      ожидающих строк молча сужается почти до пустой; отказа, счётчика и сигнала нет. То же для любой
      правки строки права, не меняющей права (служебные столбцы updated_at, состояние учёта). Ни
      одного сценария на это состояние нет: NTF3-181 (а) снимает токен ПОСЛЕ последнего посева и
      этого не видит, NTF3-181 (б) правит значимое поле. Предикат:
      grep -nEi 'reseed|SyncAllSystemRole|досев|старт службы доступа|IS DISTINCT' <документ> → 0.
    fix_direction: >-
      Определить в Р30, что двигает authz_rev: только изменение права (перечень значимых столбцов
      каждой таблицы вопроса; триггер ставит новую версию лишь при NEW IS DISTINCT FROM OLD по ним,
      на INSERT — всегда), и что досев старта строк с прежним содержимым версию не двигает
      (замена роли «снять всё — положить заново» становится разностной либо сохраняет версию
      неизменной пары). Добавить сценарий: событие с R_E; служба доступа перезапущена (досев
      системных ролей и проекции глаголов отработал); вопрос с R_E — аудитория та же, что до
      перезапуска; близнец по одному факту — между R_E и вопросом изменён набор глаголов системной
      роли посевом: субъекты этой роли выпали. Плюс инъекция в гейт NTF3-180: триггер без сравнения
      значимых столбцов — красный, близнец — с сравнением. Строки §10, §11, §12.
  - id: B2
    kind: PRODUCER
    anchor: "Р30 «Поколение и проекция — один производитель» («четыре столбца source_version (§1.15) переводятся … в поколение bigint, одна форма на всех её местах»); §1.15 «все четыре — версия объекта от его владельца»; NTF3-182 Then"
    what: >-
      Д133 (1) решает «зеркало: версия-bigint». Редакция 38 переводит в поколение bigint все четыре
      столбца §1.15, включая kaname.relation_fact.source_version и
      kaname.public_read_publication.source_version, и утверждает, что все четыре — версия объекта от
      владельца. Для relation_fact это неверно: столбец пишет триггер журнала
      kaname.relation_fact_from_journal (AFTER INSERT ON kaname.fga_outbox) значением
      coalesce(payload->>'source_version', NEW.created_at) — у строк выдач (прямые кортежи прав,
      владелец аккаунта) версии владельца нет, это время строки журнала
      (internal/migrations/20260916020000_public_read_publication_is_ordered_by_its_owner.sql, функция
      Up: `v_version := coalesce(v_owner::timestamptz, NEW.created_at)`; столбец DEFAULT '-infinity',
      0001_initial.sql:2359 @8a84dcff6). Тем же значением судится порядок записи и снятия кортежа
      (`… WHERE relation_fact.source_version < EXCLUDED.source_version`,
      `DELETE … AND source_version <= v_version`) — это страж от воскрешения снятого права. Какое целое
      поколение получает строка выдачи без объекта-владельца и чем после перевода упорядочены запись и
      снятие кортежа выдачи, документ не говорит: у значения нет производителя, а «Тогда» NTF3-182
      «четыре столбца … переведены в bigint» требует его. Реализация вынуждена либо придумать
      значение (риск перестановки write/delete кортежа права — лишний доступ), либо разойтись с
      документом. Аналогично public_read_publication: её версию пишет путь публикации реестра
      (fga_outbox.EmitPublicationTx), а Р30 не говорит, что публикация несёт g_E.
    fix_direction: >-
      Сузить перевод до решения владельца: поколение bigint — у зеркала, рёбер и головы объекта
      (то, что пишет приём регистрации/снятия), с поимённым перечнем столбцов; relation_fact и
      public_read_publication — либо остаются на своём упорядочении (и это сказано, с причиной), либо
      назван производитель целого значения для строк выдач и публикаций и сохранность стража порядка
      write/delete кортежа (сценарий: снятие кортежа выдачи, затем запоздалая запись той же выдачи с
      прежней версией — права нет; близнец — запись новее снятия — право есть). Поправить §1.15
      («все четыре — версия объекта от владельца») и NTF3-182.
