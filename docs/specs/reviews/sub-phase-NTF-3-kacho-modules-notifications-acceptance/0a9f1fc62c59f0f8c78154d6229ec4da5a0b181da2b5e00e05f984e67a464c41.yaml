blocking_findings:
  - id: D20-1
    kind: PRODUCER
    title: NTF3-159 (г) утверждает исход, которого названный производитель на названной ревизии не даёт
    where: "NTF3-159 (г), строки Then «(г) — gRPC NOT_FOUND … ответы (в) и (г) совпадают …»; Р8, фраза «побайтно той же формы, что метод, которого нет; признак — имя сервиса … (NTF3-159 (в), (г))»; §11, строка NTF3-159, «(в), (г) отказ маршрута refuseRoute … резолвер для метода вне перечня»"
    finding: >-
      Буква (г) вызывает внешним gRPC-входом `kacho.cloud.notify.v1.NotificationNoSuchService/Get`
      с токеном usr-A. Ожидает NOT_FOUND «unknown method: …», побайтно как (в), и называет
      производителем обоих `refuseRoute` (gateway/internal/proxy/route_refusal.go @1d42a6728bf).
      Но `refuseRoute` срабатывает только для имён, которые `HasInternalSuffix` признаёт Internal.
      `NotificationNoSuchService` к ним не относится. Такой вызов проходит перехватчик отказа
      маршрута насквозь и попадает в звено прав `authzMW.Stream`. Там `phaseCatalog` не находит
      записи каталога и в боевой посадке отказывает: PermissionDenied, «catalog: no entry for
      method» (authz.go:812–846). До Resolver и shimproxy.go:54 вызов не доходит. NTF-3 цепочку
      края не меняет. Значит, реализация, в точности выполняющая этот документ, на (г) красная, а
      совпадение (в) и (г) по коду и тексту держателю недостижимо. Та же неверная посылка стоит в
      Р8 и в §11. Юнит-проба края route_refusal_test.go сравнивает те же два класса имён, но на
      заменителе звена прав, который пропускает несуществующий метод. Посылку она не подтверждает.
    fix: >-
      Выбрать одно. (1) В (г) взять несуществующее имя Internal-формы, например
      `kacho.cloud.notify.v1.InternalNoSuchService/Get`. Тогда (в) и (г) дают NOT_FOUND «unknown
      method: <метод>» с одинаковым набором полей статуса. Это держит то, что правда о крае: отказ
      Internal* судится по имени и не выдаёт, есть ли такой Internal-метод у notify. Близнец (г) —
      (в): меняется только существование метода. (2) Либо снять (г), а из Р8 и §11 убрать
      утверждение «побайтно той же формы, что метод, которого нет» и «резолвер для метода вне
      перечня». Исход не-Internal метода вне перечня (отказ каталога звена прав) — свойство края,
      NTF-3 его не заводит и утверждать его здесь не нужно. В обоих вариантах: строка §10 для (г),
      если буква остаётся, и сверка Р8 с новой формулировкой.

non_blocking_findings:
  - "NTF3-127, новое «строка самоотчёта посадки notify-api — форма «только внутренний слушатель» (Х5)»: NTF-4 Х5 называет ключ и значение (`listener_form`, закрытый набор `pair` | `internal_only`). Утверждать нужно их: `listener_form=internal_only`. Инъекция «адрес публичного слушателя → отказ старта с именем поля» — проба процесса, а не гейт рендера; в §11 способ пробы для этой буквы назвать отдельно от «гейт рендера с инъекционной парой»."
  - "NTF3-159 (д): Then «не маршрутизируется, исход — как у любого Internal*-пути» не называет HTTP-статус и code. Назвать пару, которую производит NTF4-30 (api-case-asserts-pair), и сам путь, а не «пути — NTF-4 Р7»."
  - "Р8: фраза «ошибочная запись в перечне этого не меняет (NTF3-159 (в), (г))» ссылается на буквы, которые ошибочной записи в перечне не ставят. Держатель этого свойства — третья разность гейта края allowlist/parity_test.go (AllowedMethods ∩ Internal* = ∅) и `HasInternalSuffix` в Resolver. Сослаться на них."
  - "§2.1 заканчивается на Д20. Д21 (обязательность атрибутов notification.yaml) задевает и шаблоны NTF-3 (Р17, Р18: например `description` у operation-failed, `reason` у *-recovered). По Д22 перечень «шаблон × атрибут × откуда × законен ли нуль» — предмет замысла. В приёмке достаточно строк Д21 и Д22 в §2.1 со следствием «перечень — в замысле NTF-3»."

method_verdict: >-
  Возврат круга 1 прохода Д17 закрыт. D17-1 закрыт переписью всех мест о слушателе и крае, сверен
  с Д17 и Д20 и с кодом края @1d42a6728bf (ключ соединения = домен пакета, отказ Internal* до звена
  прав). D17-2 закрыт: границы окна в NTF3-103 (д) сходятся с Р12. Неблокирующие выполнены. Счёт
  159/7/152, производители, гигиена, Д16 — в порядке. Судилась только дельта 13 → 15 (Д22). Новый
  возврат один. Буква NTF3-159 (г) и опирающаяся на неё фраза Р8 утверждают, что несуществующий
  не-Internal метод получает от края тот же отказ маршрута, что Internal*. На названной ревизии
  такой вызов раньше отвергает звено прав (отказ каталога), и держатель на верной реализации
  красный.
