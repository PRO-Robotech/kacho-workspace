non_blocking_findings:
  - "Термин §1.13 делит писателей на Go на два класса: вызов функции фундамента и ЛИТЕРАЛЬНЫЙ INSERT. Вставка в таблицу журнала именем-переменной (форма compute outbox.go:115, fmt.Sprintf с константой таблицы) не попадает ни в один из них. Сегодня таких вставок в журнал 0 — это измерено контролем §1.13, поэтому число верно. Но гейт после под-фазы на такой вставке должен быть красным, иначе он ловит только литерал. Предлагаю замыслу и автору гейта судить обход по узлу разбора (любой INSERT, чья цель — литерал таблицы журнала ИЛИ ссылка на объявление `Table` модуля, вне функции фундамента), а при следующей правке приёмки — букву (г) у NTF3-70 с этой формой и близнецом. Не блокирует: наблюдаемое сегодня определено, текст документа истинен."
  - "Неблокирующие круга 1, не относящиеся к дельте, остаются в силе: согласование NTF3-62 (SQLSTATE 23502) с условием CX3B-25 (б) — строка к design-author; LB DELETED от сверщика — заказ integration-tester (CX3B-25 (в))."

