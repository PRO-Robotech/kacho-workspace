blocking_findings:
  - id: B1
    kind: CONVENTION
    anchor: "§6, пункт «Сужение ListByInstance у vpc … и видимость зеркала networkInterfaces» (строки 1944-1953); §1.14 (строки 712-722); Р2 (строки 841-851)"
    what: >-
      Документ передаёт задаче #2933 два предмета: модель видимости зеркала networkInterfaces и дефект
      корректности. Дефект такой: снос при расхождении видимостей удаляет строку инстанса, хотя
      интерфейс к нему привязан. Задача несёт только первый предмет. В её теле (gh issue view 2933
      -R PRO-Robotech/kacho --json body, 2026-09-30) есть признак, предмет и предикат о видимости
      зеркала. Там нет ни releaseAndDelete, ни исхода «интерфейс привязан к несуществующему
      инстансу», ни пробы сноса. DoD задачи допускает «письменный отказ от расширения». Предикат
      снятия в §6 («#2933 закрыта приёмкой с вердиктом о модели сужения ListByInstance и видимости
      зеркала») такой отказ тоже выполняет. Сценарий: #2933 закрыта отказом от расширения, строка §6
      снята, а удаление строки инстанса при привязанном интерфейсе остаётся в двух путях без
      держателя — в публичном Delete (instance.go:958-981 @1d42a6728bf) и, после NTF-3, в проходе
      доведения снятия (Р2). Предмет отложенного назван задачей, которая его не несёт. Это тот же
      класс, что B1 круга 2 (ban #11, третий исход без ответственного).
    fix: >-
      Дерево менять не нужно, одного из двух достаточно. (1) Дописать в #2933 дефект корректности:
      признак (снос при v_get на инстансе и без v_get на интерфейсе удаляет строку инстанса, интерфейс
      остаётся привязанным), пробу сноса при расхождении видимостей с близнецом и запрет закрывать
      задачу отказом, пока исход в дереве. Предикат снятия в §6 переписать так, чтобы отказ от
      расширения его не выполнял. (2) Завести отдельную задачу о корректности (area:compute либо
      area:vpc) с этим признаком и пробой. Вписать её номер в §6, §1.14 и Р2 рядом с #2933 и
      привязать предикат снятия к ней.
  - id: B2
    kind: CONVENTION
    anchor: "§6, пункт «Письмо о переходе в ERROR не из CREATING (П4, П5, П6)» (строки 1934-1942)"
    what: >-
      Пункт сам себя объявляет блокирующим: «номер вписывается сюда до одобрения; без номера строка —
      блокирующая». Номера нет. В трекере такой задачи тоже нет: gh issue list -R PRO-Robotech/kacho
      --state all --search по «сверщик storage», «недостижим», «Drifted», «storage ERROR», «переход в
      ERROR», «Volume ERROR», а также все задачи, созданные 2026-09-30 (последняя — #2933), дают 0
      подходящих; #922 о клейме строк, не о переходах. Редакция 27 пункт не трогала. Это дефект
      корректности сверщика storage без предмета — третий исход ban #11 без ответственного.
    fix: >-
      Завести задачу о корректности (area:storage: переход в ERROR не из CREATING не имеет
      производителя; предикат — производитель строки READY либо DELETING → Drifted в дереве).
      Вписать её номер в пункт §6 и снять фразу «номер вписывается до одобрения».

non_blocking_findings:
  - id: N1
    anchor: "Р2 (строки 847-849) против §6 (строки 1946-1948)"
    what: >-
      Р2 говорит, что исход сноса при расхождении видимостей документ «не утверждает ни в одну
      сторону». Пункт §6 его утверждает: «получает по интерфейсу пустую страницу и удаляет строку
      инстанса». По коду верно второе. Привести Р2 к одной форме: исход известен и назван в §6, но
      сценарием под-фазы не держится.
  - id: N2
    anchor: "маршрут класса"
    what: >-
      Род CONVENTION с классом «отложенная работа без предмета в трекере» повторился третий круг
      подряд (круг 2 B1, этот круг B1 и B2). По §14а класс переезжает в форму задания автору: перед
      сдачей для каждого «вне под-фазы» сверить тело названной задачи с тем, что ей передано.

