can_fail_analysis: >-
  Дефект «сравнение строками» NTF3-161 (г) ловит с обеих сторон. Основная буква (сначала 10, затем
  9): при строковом greatest хранимое станет "9" > "10" — красное по seenUpTo = 10; при строковой
  сверке с последней выданной второй вызов с 9 отвергнется как лежащий за "10" — красное по «оба
  done=true». Близнец (сначала 9, затем 10): строковая сверка отвергнет первый вызов — красное.
  При числовом сравнении обе ветки зелёные, близнец отличает рабочий путь от мёртвого
  (seenUpTo движется 9 → 10). В (а) с позициями одного разряда строковый дефект не виден — это
  и есть единственный различающий факт пары (а)/(г).
non_blocking_findings:
  - id: N1
    kind: FORMAT
    anchor: "§2.1 «Решения диспетчера Д1–Д25 и Д31 — следствие для NTF-3» (стр. 674-703)"
    what: >-
      Д34 применено в Р10 и NTF3-161, но строки в таблице §2.1 нет, заголовок по-прежнему
      «Д1–Д25 и Д31». У каждого прочего применённого решения там строка со следствием и
      держателем. Дописать строку «Д34 | числовой порядок позиций в seen_up_to | Р10 | NTF3-161 (г)»
      и поправить заголовок.
  - id: N2
    kind: FORMAT
    anchor: "NTF3-161 (г), Given (стр. 2776-2778)"
    what: >-
      Производитель десяти записей ленты не назван, и «двух новых записей» читается двояко: все ли
      десять видны usr-A или только две. Значения 9 и 10 опираются на незаписанную посылку:
      последовательность позиций свежей базы начинается с 1 и не имеет пропусков. Given
      утверждает позиции GET до When, поэтому при другой реализации буква даёт «не выполнилось»,
      а не ложное красное; блокирующим это не делается. Стоит назвать путь (например, десять
      правок одного тома через приём, как NTF3-72/73) и написать, что usr-A видит все десять.
  - id: N3
    kind: TWIN
    anchor: "§10, строка NTF3-161 (г) | NTF3-161 (а) (стр. 4241)"
    what: >-
      Кроме смены разряда (г) отличается от (а) ещё одним фактом: большее значение (10) равно
      последней выданной позиции, в (а) P2 < P3. Атрибуцию красного это не путает: строковый
      дефект падает на смене разряда, а приём значения, равного последней выданной, держит
      близнец (в). Если нужна строгая пара в один факт — одиннадцать записей (позиции 9, 10, 11).
      Значения 9/10 и seenUpTo = 10 заданы Д34 дословно, поэтому документ здесь следует решению.
