premise_check:
  task_premise: >-
    Посылка задания: SHA-256 редакции — 077fdc20…7521, круг 2. sha256sum рабочего файла и
    git show HEAD:<путь> | sha256sum дают 077fdc208ced5c99b0a69b12c97109b28e1b7e451fbbffb545dad1f418747521.
    Подтверждена. Решения Д1–Д22 сверены по записи круга 1 (там они найдены в первых сообщениях
    транскриптов агентов author:NTF-3 и author:NTF-1); Д23–Д25 — по тексту задания.
  seeded: 0
  seeding_note: >-
    Стенд и изоляция для посева заданием не названы, поэтому посев — «не выполнилось», в зелёное не
    зачитан. Конструируемость новых Given (С17, С18, NTF3-161 (б), (в), NTF3-163) проверена чтением
    дерева @1d42a6728bf.
  constructibility:
    - "NTF3-163 / С18: selectStuckSQL (free_ip_runner.go) берёт status IN ('DELETING','CREATING') AND updated_at < now() - age AND leaseCoherent. У балансировщика, созданного публично из подсети, адрес и ключ аренды заполнены оба, поэтому leaseCoherent истинно. CHECK статуса допускает DELETING (0022_…:142). Триггеры на load_balancers — только квотные AFTER INSERT OR DELETE (0032_…:393,414), updated_at сами не двигают. Возраст задаётся параметром NewFreeIPRunner(…, ageThreshold). Ветка DELETING зовёт emitReconcileFinalize (NLB DELETED). ReleaseLease адреса модуля — исход RELEASED. Условие строимо."
    - "NTF3-163, близнец: публичный Delete зовёт releaseVIP → ReleaseLease (delete.go) и снимает строку, поэтому задание её не подбирает. Строимо."
    - "NTF3-161 (б) / С17: прямая запись seen_up_to в базу notify обвязки перед каждым повтором. Возврат назад публичным путём не нужен, противоречие круга 1 снято. (в) строится публичным PATCH из пустого. Строимо."
  confirmed:
    - "B1 круга 1 (CONSTRUCTIBILITY) закрыт: С17 в §8, Given (б) и близнец (б) опираются на него; производитель — §11."
    - "B2 круга 1 (COVERAGE) закрыт: Р2 называет system:nlb-free-ip-runner; у NTF3-163 есть Then на инициатора строк vpc и nlb, на строки ленты и записи ленты консоли; близнец отличается одним фактом (снятие публичным Delete); строки в §7, §8, §10, §11, DoD 12.2, 12.4."
    - "B3 круга 1 (CONVENTION, числа): все пары «команда → число» дельты воспроизводятся (список выше)."
    - "Неблокирующие круга 1 учтены: Р10 (вся лента), NTF3-160 (з) (момент P0 compute, две строки), §7 (компенсация), Д23 (держит NTF-4)."
    - "Счёт 163/7/156 сходится, дубликатов 0, гигиена 0."
  refuted:
    - "Заявление редакции 22 «сокращённые команды («…») выписаны целиком»: в §1.3, строка 214, команда начинается с «… |» (B1)."
    - "Д24 «каждое утверждение о дереве — предикат»: в §1 и §2.2 шесть утверждений о дереве стоят «со слов разведки», без команды (B1)."

blocking_findings:
  - id: B1
    kind: CONVENTION
    anchors: ["§1.2 (строка 206)", "§1.3 (строки 214, 217)", "§1.8 (строки 334, 345)", "§1.10 (строка 371)", "§2.2 (строка 700)", "запись редакции 22 (строка 51)"]
    what: >-
      Д24: каждое утверждение документа о дереве должно быть предикатом с командой и числом
      @ревизия, а не словами автора. Редакция 22 заявляет, что все команды §1 прогнаны и все
      сокращённые команды выписаны целиком. Но в §1.3 (строка 214) осталась команда «… | grep -nE
      '^\s+[A-Za-z.]+ (initiator|actor|occurred_at)…' → 0»: её начало не выписано, и воспроизвести
      её нельзя. Ещё шесть утверждений о дереве стоят «со слов разведки» и без команды: 206 (журнал
      службы доступа состояния не передаёт), 217 (журнал аудита compute — 0028_audit_outbox.sql),
      334 (путь проверки прав состояние пользователя не читает — на этом стоит клетка
      SUBJECT_INACTIVE Р7), 345 (производителя напоминания «≤14d before expires_at» нет — на этом
      стоит Р19), 371 (три приёмки — домен прав), 700 (членство доходит правкой группы). Две из
      них (334, 345) несут решения. Та же редакция 22 сама опровергла одно такое утверждение
      («находит только два гейта», строка 161). Значит, у класса уже есть подтверждённый ложный
      экземпляр в этом документе. Выборочные замеры рецензента остальные утверждения не
      опровергают (ниже). Но Д24 требует, чтобы в документе стояла команда, а не проверка
      рецензента.
    predicate: >-
      grep -nE 'со слов|Со слов' <документ> | grep -vE '^[0-9]{1,2}:>' → 7 строк (161, 206, 217,
      334, 345, 371, 700); 161 — запись о снятии, остальные 6 — утверждения без команды.
      grep -nE '`…' <документ> | grep -E 'grep ' → строка 214.
    reviewer_measurements: >-
      Замеры для замены, которые может взять автор. (1) строка 214: git show
      1d42a6728bf:proto/corelib/subscription/subscription.proto | grep -nE '^\s+[A-Za-z.]+
      (initiator|actor|occurred_at)[a-z_]* = ' | wc -l → 0 (файл 479 строк). (2) строка 217: git
      ls-tree --name-only 1d42a6728bf services/compute/internal/migrations/ | grep -i audit → 2
      (0028_audit_outbox.sql, 20260823001500_audit_journal_gets_its_receiver.sql). (3) строка 345: в
      kaname @734f69fb4 git grep -nEi 'remind|alerts? .*before expires' -- '*.go' ':!*_test.go'
      ':!pkg/api/**' → 0; комментарий «≤14d» есть только в сгенерированном
      service_account_oauth_client.pb.go:73. (4) строка 185 (не «со слов», но без команды): git grep
      -lE 'Outbox\(\)\.Emit\(ctx, "AddressPool"' 1d42a6728bf --
      'services/vpc/internal/apps/kacho/api/addresspool/' | wc -l → 5, верно. Строки 206, 334, 371
      и 700 автор меряет сам: для 334 — читатели invite_status в пути проверки прав kaname; для
      700 — писатель события группы при правке членства.
    required: >-
      Одним проходом по §1–§2 (grep 'со слов' плюс grep '…' в командах) заменить каждое такое
      утверждение командой, числом и ревизией. Если утверждение измерить нельзя, снять его или
      перенести в «вопросы» с явной пометкой, что на нём не стоит ни одно решение. Р7
      (SUBJECT_INACTIVE) и Р19 должны опираться на измеренное. В записи редакции утверждать только
      то, что сделано: «все команды §1 прогнаны» вместо «все утверждения о дереве — предикатом»,
      если второе не выполнено.

non_blocking_findings:
  - "NTF3-163, близнец: не сказано, когда читается P0. Then утверждает строки user:usr-A «после P0», поэтому P0 должен читаться до публичного Delete. Нужно назвать момент явно, как в NTF3-160 (з) редакции 22."
  - "NTF3-163: «после приёма этих строк `notify-sender` `GET /notify/v1/inbox`» читается так, будто ленту выдаёт notify-sender. По Д20 ленту выдаёт notify-api. Лучше: «после того как notify-sender принял эти строки, usr-A вызывает GET … (notify-api)»."
  - "С18 (§8) не называет порог возраста задания (60s), который Given NTF3-163 приписывает С18. Порог задаётся параметром ageThreshold в NewFreeIPRunner. Стоит вписать его в строку С18."
  - "Строки 520 и 491–493 §1.13 указывают координаты разных строк одних триггеров: CREATE TRIGGER (544, 119, 554) и EXECUTE FUNCTION (546, 124, 556). Стоит сказать один раз, какую строку берёт таблица."
  - "Неблокирующие прошлых кругов вне дельты остаются в силе: С15 строить через InstanceRepo.SetStatusCAS; форма вставки NTF3-70 и 23502 против CX3B-25 (б) — к design-author."

method_verdict: >-
  Судилась дельта 21 → 22 против трёх блокирующих круга 1 и Д1–Д25. Все пары «команда → число»
  дельты воспроизведены на закреплённых ревизиях. Конструируемость С17, С18, NTF3-161 и NTF3-163
  проверена по коду задания, CHECK и триггерам. Три блокирующих круга 1 закрыты. Одно новое
  блокирующее того же рода Д24: в §1 и §2.2 остались утверждения о дереве без команды и одна
  сокращённая команда, хотя запись редакции заявляет обратное. Посев не выполнялся: стенда нет,
  это «не выполнилось», в зелёное не зачитано.

