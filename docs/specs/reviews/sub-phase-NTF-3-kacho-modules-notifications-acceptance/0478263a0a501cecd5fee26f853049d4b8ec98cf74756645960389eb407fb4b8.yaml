dependencies_note: >-
  Документ опирается на решения NTF-1 по номеру (Р7, Р8, Р9, §1.4, ResolveSend, клетки словаря
  исходов, уборщик с возвратом лимита). Перемерено против редакции NTF-1
  077e9fff783bad06b1a3f2f2e051e85fa26d0960d7c3aea0f16e221ea10b5260 (круг 3 NTF-1 — ВОЗВРАТ,
  блокирующих 2: учётка-субъект `send` у kaname и форма выдачи `reader`). Ни одна из двух находок
  NTF-1 не меняет того, на что опирается NTF-3 (G0 сеет кортеж `reader` notify на ленте storage —
  посев, форма которого решается NTF-1). Если NTF-1 изменит Р8 (ключи окна, возврат лимита), Р9
  (клетки DEFER/DENIED/EXPIRED) или форму выдачи `reader`, одобрение NTF-3 перепроверяется.

