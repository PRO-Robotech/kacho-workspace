round2_closure:
  B2-1: >-
    закрыт. §1.8 переписан переписью писателей пары state/observed_state и ветвями П1–П8 с
    отметкой достижимости; П4/П5/П6 объявлены без производителя, письмо к ним не подключено (Р9,
    Р15, §6 с предикатом пересмотра), сценарии NTF3-08/41/42/44 сняты с сохранением номера;
    Register — NTF3-54 (пишет инициатора, письма не рождает). Перемерено: driftedSQL `WHERE
    r.state <> r.observed_state` (store.go:127-135), Confirm `state IN ('CREATING','ERROR')`
    (store.go:196), MarkError `state <> 'DELETING'` (store.go:257), Decide ветви CREATING
    Absent→Provision / Error→ReportVanished / иначе Confirm, ERROR Ready→Confirm / иначе None
    (decide.go:102-162), Terminal = !Retryable, Retryable ⇔ Unavailable (outcome.go:93) @1d42a6728bf.
    Все шесть вставок в три таблицы — в таблице писателей (`git grep -nEi 'INSERT INTO
    (volumes|snapshots|images)\b' -- ':!*_test.go' ':!*.md'` → 6 строк, все названы).
  B2-2: >-
    закрыт. NTF3-30: пара 403 / code 7 / ErrorInfo AUTHZ_DENIED для аутентифицированного,
    производитель — прослойка прав края. Перемерено: `inner = authzMW.HTTP(inner)`
    (main.go:1288-1289), resolveRestFQN → grpcMethodForPath (authz_util.go:225-232,
    dpop_http_middleware.go:362), промах каталога → outcomeDeny «catalog: no entry for method»
    (authz.go:813-844), `Reason: "AUTHZ_DENIED"` (permission_denied_response.go:92,342).
    gRPC-половина: у kaname нет UnknownServiceHandler (`git grep UnknownServiceHandler
    734f69fb4 -- '*.go' ':!*_test.go'` → 0), незарегистрированный сервис на :9090 отвечает
    UNIMPLEMENTED.
  B2-3: >-
    закрыт. NTF3-07: Observe ровно 1, изменяющих глаголов 0; прибор — обёртка порта в тестовом
    дереве storage, производитель назван в §10 и DoD 11.2.3. Конструируемость обёртки: цикл
    принимает любой blockbackend.Backend через открыватель (`openerFor{b Backend}`,
    cycle_integration_test.go:99-104).
  round2_non_blocking: >-
    все три учтены: notify_suppressed_total назван новым (Р14, §10, DoD 5а); владелец аккаунта
    `usr-own` в G0; §1.8 формулирует выведенный статус через DeriveStatus.

