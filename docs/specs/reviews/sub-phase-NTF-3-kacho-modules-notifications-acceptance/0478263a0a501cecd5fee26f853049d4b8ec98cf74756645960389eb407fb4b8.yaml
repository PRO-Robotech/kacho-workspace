blocking_findings: []

non_blocking_findings:
  - kind: CONSTRUCTIBILITY
    text: >-
      G0 не называет посев, без которого Given «usr-A вызвал VolumeService.Create …, done=true»
      не строится: зона и регион у geo (Create — EnsureZoneExists/RegionOfZone; Register —
      EnsureRegionExists), тип диска ACTIVE, бэкенд хранения и действующая ревизия привязки для
      (тип, зона) — без неё вставка даёт 0 строк; и право создания ресурсов storage у usr-A (G0
      даёт только «роль с v_get», тогда как NTF3-10 для usr-B право создания называет явно).
      Автору проб: взять seedBinding (services/storage/internal/reconciler/cycle_integration_test.go)
      и дублёр geo.
  - kind: FACT
    text: >-
      «Storage в обвязке поднят со сверщиком (задан вид бэкенда — фейк)» (§9 группа B) — вида
      «фейк» у открывателя нет (BackendOpener.Supports/Kinds, clients/backend_opener.go:54-64;
      fake.New в не-тестовом коде 0). Обвязка собирается в тестовом коде: репозитории с
      WithReadyOnCommit(false) и reconciler.New(…, открыватель, отдающий фейк) — как
      cycle_integration_test.go:99-104.
  - kind: TWIN
    text: >-
      NTF3-45 (выход из ERROR письма не ставит) — отрицательное утверждение без строки в §8;
      законный близнец — NTF3-06 (переход в ERROR ставит строку). NTF3-53: §8 называет близнецом
      NTF3-06 (цикл сверщика), а тело — «тот же вызов по строке CREATING» (прямой вызов функции);
      одно-фактная пара — внутренняя, её и держать в пробе.
  - kind: PRODUCER
    text: >-
      `notify_source_identity_mismatch_total` в NTF-1 (077e9fff…) не встречается ни разу, а §10
      строка NTF3-17 относит счётчик к клиенту ленты «(NTF-1)». DoD 11.2 п.2 заводит его здесь —
      в §10 назвать его новым, как сделано для notify_suppressed_total.
  - kind: FACT
    text: >-
      NTF3-12: «так её зовёт и цикл сверщика» — сегодня цикл зовёт store.MarkError без
      транзакции вызывающего (loop.go:312,376 → s.pool.Exec). Это требование к новому коду
      (DoD 11.2.3), не факт дерева; при реализации держать формулировку как требование.
  - kind: FACT
    text: >-
      NTF3-51: «внутренних проекций» Volume и Image — VolumeInternal, ImageInternal; у снимка
      внутренней проекции нет (internal_*_service.proto @1d42a6728bf) — утверждение о дескрипторах
      судить по существующим.

method_verdict: >-
  Посев не выполнялся (стенда и разрешения нет). Конструируемость проверена чтением дерева
  производителя на всём пути строки: вставка → выборка рабочего списка → наблюдение → решение →
  запись, для каждой ветви П1–П8 и каждого пути вставки. Прибор NTF3-07 проверен на
  подставимость порта. Одна оговорка G0 (неполный перечень посева) не делает Given
  неконструируемым: фикстура существует и называется в замечании.
