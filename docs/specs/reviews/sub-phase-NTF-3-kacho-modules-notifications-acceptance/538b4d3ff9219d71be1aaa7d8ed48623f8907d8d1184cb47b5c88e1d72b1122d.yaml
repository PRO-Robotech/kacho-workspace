blocking_findings:
  - id: B3-1
    kind: NEGATIVE
    title: Отказ Resolve на пустом списке resource_refs записан в Р7, но ни один сценарий его не держит
    where: "Р7, строки 549–550 («ссылок 0 или больше 100, смесь типов — INVALID_ARGUMENT с полем resource_refs»); NTF3-118; §10; §11 строка 3317"
    finding: >-
      Р7 ограничивает `resource_refs` диапазоном [1..100], и отказ на нуле ссылок — это отказ
      обязательности набора. В §9 нет вызова с `resource_refs=[]`. Без держателя TDD-реализация этот
      отказ не породит. Цикл по пустому набору не найдёт ни одной видимой ссылки и вернёт
      `AUDIENCE_DENIED` («ни одна ссылка не видна»). Это тот самый исход, «неотличимый от законного»,
      против которого Р7 вводит шаг (1). Класс тот же, что у B2-1, соседняя клетка.
    fix: >-
      Добавить в NTF3-118 букву (е): `resource_refs=[]` при базовом вызове → INVALID_ARGUMENT, поле
      `resource_refs`; не AUDIENCE_DENIED, 0 вопросов к модели. Близнец — базовый вызов
      `[{storage_volume, vol-1}]` → ADDRESS. Добавить строку §10. В §11 и DoD 12.2 п.4 дописать
      нижнюю границу. Отказ записать в шаг (1) порядка проверки входа, раз это обязательность.
  - id: B3-2
    kind: TWIN
    title: У отказов NTF3-118 «101 ссылка» и «смесь типов» нет близнеца и нет строки §10
    where: "NTF3-118, When/Then (второй и третий вызовы); §10 (есть только строка NTF3-118 (vol-20))"
    finding: >-
      Строка «And близнец» у NTF3-118 — это `resource_refs=[vol-20]` → AUDIENCE_DENIED, близнец первого
      вызова. У двух отрицаний того же сценария (101 ссылка → INVALID_ARGUMENT и смесь
      `storage_volume`+`storage_snapshot` → INVALID_ARGUMENT) положительного близнеца по одному факту нет,
      и в §10 для них строки нет. Отказ на 101 без утверждения, что 100 принимается, неотличим от
      отказа на любом числе больше 3: граница [1..100] остаётся непроверенной сверху. Отказ на смеси
      без близнеца того же типа неотличим от отказа на `storage_snapshot` как таковом.
    fix: >-
      Добавить (или оформить буквами) пару для 101: 100 ссылок `storage_volume` → ADDRESS, против 101 →
      INVALID_ARGUMENT `resource_refs`. Для смеси: `[{storage_volume, vol-1}, {storage_snapshot,
      snp-1}]` → INVALID_ARGUMENT; близнец `[{storage_volume, vol-1}, {storage_volume, vol-2}]` →
      ADDRESS. Если `snp-1` в Given отсутствует, его нужно засеять — иначе близнец `[{storage_snapshot,
      snp-1}]` не строится. Для каждого — строка §10.

non_blocking_findings:
  - "NTF3-118 и NTF3-120: «0 вопросов к модели» и «1 вопрос за базовый» верны, только если записывающая подмена стоит на порту сценария использования Resolve (так устроен образец recordingChecker). Право вызывающего `Check(service:notify, reader, notification_recipient_directory:root)` задаётся той же дверью. Если подмена встанет на всю дверь, базовый вызов даст 2 вопроса, а буквы — по 1. Одна фраза «счёт — по порту сценария использования, проверку права вызывающего перехватчиком не считаем» снимает двусмысленность."
  - "NTF3-151, точная пара: вместе с типом меняются отношение (reader/token_issuer) и id объекта (root/usr-A). Это неизбежно, отношения у разных типов свои. Строку §10 стоит писать как «тип объекта вместе с его отношением», а не «тип объекта»."
  - "§1.12 держит NTF-6 @d5fe4734. В рабочей копии ветки NTF-6 изменена и не закоммичена (sha256 7916badf…). Перевести NTF-6 на итоговый отпечаток NTF-3 после одобрения (Д15)."

method_verdict: >-
  B2-1 закрыт классом «обязательное поле»: пять полей Resolve и границы ListExpiringCredentials,
  каждое с буквой, близнецом, строкой §10 и производителем. Счёт 158/7/151 сходится, у каждого живого
  сценария есть строка §11, гигиена 0. Д14–Д16 соблюдены. Возврат узкий, и все его пункты — в одном
  сценарии NTF3-118 на том же шаге проверки входа Р7. Первый: нижняя граница «ссылок 0» без
  держателя, отсюда исход AUDIENCE_DENIED, неотличимый от законного. Второй: у отрицаний «101» и
  «смесь» нет близнецов. Правка — две-три буквы и три строки §10, новых номеров не нужно.
