non_blocking_findings:
  - "NTF3-159 (д) держит «Internal*-путь не доходит до notify» только для вызывающего БЕЗ права метода: 403 даёт звено прав до диспетчера. Край, ошибочно смонтировавший REST-маршрут `InternalSuppressionService` на внешнем mux, на (д) тоже зелёный. Р8 (строка «до notify не доходят (NTF4-30; NTF3-159 (д))») и §11 (производитель (д) — «и классификация путей Internal* … не пускающая путь к notify») приписывают букве свойство, которое она не проверяет. Свойство при этом удержано: гейт assert-ban6-external-isolation.py (NTF4-30) и проба края external_refusal_shape_test.go названы в §11. По Д22 наблюдаемый исход в документе есть, поэтому возврата нет. При следующей правке: либо добавить букву с вызывающим, у которого есть `notify.suppressions.get` на cluster (близнец (д), отличие — только право; исход — отказ диспетчера, счётчик notify без изменений), либо снять (д) из держателей классификации в Р8 и §11."
  - "NTF3-159 (д) цитирует `main.go:1286-1289`. Обёртка authzMW.HTTP стоит на строках 1288-1289, 1286 — idempotency. Координату стоит сузить."

