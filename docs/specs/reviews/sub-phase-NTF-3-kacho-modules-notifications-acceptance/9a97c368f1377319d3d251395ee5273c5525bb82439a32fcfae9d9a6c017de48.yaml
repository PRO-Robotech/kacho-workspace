round_note: >-
  Круг 2 на предмет «NTF3-182 и атомарность кортежей одного события» (редакция 41 — правки по
  кругу 1 на редакцию 40). Оба блокирующих круга 1 закрыты по существу: B1 (COVERAGE) — гейт
  стороны модуля NTF3-187 и наблюдаемая проба NTF3-188 с записью вызовов С27 и близнецами С28;
  B2 (CONSTRUCTIBILITY) — производитель поколения назван (счётчик объекта модуля, переживающий
  удаление), сценарий NTF3-189. Возврат — по трём новым дефектам, внесённым новым сценарием
  NTF3-189: его Given не строится при действующей проверке прав реестра, близнец (а) утверждает
  отказ, который правило барьера не производит, буква (в) утверждает событие переименования,
  форма которого нигде не решена. Роды отличаются от рода круга 1 (CONSTRUCTIBILITY повторяется,
  но предмет другой — права посева, а не производитель поколения).
