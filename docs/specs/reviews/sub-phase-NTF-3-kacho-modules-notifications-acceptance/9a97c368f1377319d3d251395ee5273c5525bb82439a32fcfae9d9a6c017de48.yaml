blocking_findings:
  - id: B1
    kind: CONSTRUCTIBILITY
    anchor: "NTF3-189 Given (строка 3939) и When (а) (строка 3944); привязка из NTF3-188 Given (строка 3904)"
    what: >-
      NTF3-189 строит Given созданием репозитория pub пользователем usr-A с visibility = PUBLIC, а
      When (а) — тем же созданием пользователем usr-B. Явный PUBLIC на создании требует отношения
      admin на registry_registry реестра: services/registry/internal/handler/repository.go:57-60
      @ffbe930dbe (requireRegistryAdmin, отказ PERMISSION_DENIED «creating a public repository
      requires registry admin»). В модели admin у registry_registry — только прямой
      ([user, service_account, group#member] or super_admin; internal/authzmodel/fga_model.fga:1295
      @kaname 8a84dcff6), не выводится ни из owner, ни из предка. Создатель реестра получает лишь
      кортежи project и owner (fga_intent.go:242, :254 @ffbe930dbe); привязка С1 из NTF3-188 —
      «на prj-1 роли, дающей v_get и изменяющие глаголы», то есть кортеж на project:prj-1
      (access_binding/tuples.go @8a84dcff6), admin на reg-1 не дающий. Ни usr-A, ни usr-B admin на
      reg-1 не держат — оба создания отвергнуты PERMISSION_DENIED до Operation, Given NTF3-189 не
      существует, (а)–(в) не исполнимы.
    fix_direction: >-
      Назвать в Given посев, дающий usr-A и usr-B admin на registry_registry:<id reg-1> (привязка,
      нацеленная на объект реестра, роль с этим отношением), и утверждать его до When (Check admin —
      true); либо строить публичность реестром с defaultRepositoryVisibility = PUBLIC, выставленной
      администратором в Given, и утверждать наследование. Близнец по одному факту — без admin:
      PERMISSION_DENIED, Operation нет.
  - id: B2
    kind: TWIN
    anchor: "NTF3-189 (а), близнец (строки 3952-3955); таблица отказов справочника (строка 1181); Р30 «Барьер поколения»"
    what: >-
      Близнец (а) — счётчик снят вместе с репозиторием, CREATED нового несёт поколение 1 — утверждает
      «вопрос об аудитории CREATED поколения 1 — UNAVAILABLE OBJECT_GENERATION_NOT_APPLIED». Отказ
      определён документом так: «последнее применённое службой доступа поколение объекта меньше g_E
      события» (строка 1181; Р30 «Барьер поколения»). В Given голова объекта — надгробие gT > g1 ≥ 1;
      последнее применённое поколение gT не меньше 1 — барьер не срабатывает. Поколение 1 у этого id
      применено — это CREATED прежнего воплощения (счётчик начинает с 1, g1 = 1), и по правилу
      документа вопрос отвечает аудиторией прежнего репозитория без отказа — ровно та опасность,
      которую круг 1 назвал («аудитория чужого объекта»). Утверждённый исход близнеца ни одним
      правилом документа не производится: проба с такой строкой либо красна на верной реализации,
      либо толкает реализацию к правилу, которого в Р30 нет.
    fix_direction: >-
      Привести Тогда близнеца к правилу: ответ без отказа, и он содержит usr-A (аудитория прежнего
      воплощения) и не содержит usr-B — это и есть наблюдаемый вред снятого счётчика; либо, если
      вопрос о поколении не выше надгробия должен отказывать, ввести это правило в Р30 и строку
      1181 с производителем и сценарием-близнецом.
  - id: B3
    kind: PRODUCER
    anchor: "NTF3-189 (в) (строки 3963-3968); §11 строка NTF3-189; §3 шаг (15); перепись видов registry (строки 885-896)"
    what: >-
      Буква (в) утверждает «строка resource-event CREATED объекта …/pub от переименования» и
      применённую регистрацию его поколением. Что пишет журнал на RenameRepository, документ не решает
      нигде: grep -n 'Rename\|переимен' по документу даёт лишь строку 734 (комментарий о «переименовании
      назад») и саму букву (в); §11 называет производителем NTF3-189 только «счётчик объекта,
      переживающий удаление», путь переименования — нет. Переименование меняет id объекта модели
      (<реестр>/<имя>) и затрагивает два объекта; в дереве оно пишет четыре намерения одной
      транзакцией: регистрацию нового, снятие старого, ОТДЕЛЬНОЕ снятие публикации старого и
      регистрацию публикации нового (rename_repository.go:311-330 @ffbe930dbe, renameIntents) — два
      снятия одного объекта в одном событии, что Р30 «Единица поколения — событие» и гейт NTF3-187
      запрещают, а публикация через регистрацию запрещена NTF3-186. Целевая форма (DELETED старого
      id и CREATED нового, каждое со своим поколением счётчика; публикация нового — методом
      SetPublicReadPublication с object_generation его CREATED; аудитория DELETED старого) не названа,
      и производителя у «Тогда» буквы (в) нет.
    fix_direction: >-
      Решить в Р30 (или в разделе Repository §2) события переименования: DELETED объекта старого
      имени и CREATED объекта нового имени, по одной строке намерения на каждый, поколения — из
      счётчиков обоих id той же транзакции, публикация нового — методом публикации; назвать
      производителем services/registry/internal/apps/kacho/api/registry/rename_repository.go
      (правится) в §11 и §3 шаге (15); в NTF3-189 (в) утверждать и снятие tmp (надгробие с поколением
      его DELETED, кортежей нет). Гейт NTF3-187 — инъекция «два снятия одного объекта в событии
      переименования» с близнецом.
