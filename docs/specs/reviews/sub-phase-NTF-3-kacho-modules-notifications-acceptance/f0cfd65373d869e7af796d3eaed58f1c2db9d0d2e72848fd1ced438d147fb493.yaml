blocking_findings:
  - id: B2-1
    kind: NEGATIVE
    title: Отказ Resolve на пустом resource_refs[i].id и на пустом account_owner.account_id записан, но ни один сценарий его не держит
    where: "Р7 (строки 543-545), Р11а (г) (строка 759); NTF3-118, NTF3-120; §10; §11 строка NTF3-23..29, 48, 117..122; таблица «Отказ вызова справочника», строка INVALID_ARGUMENT"
    finding: >-
      Р7 вводит два отказа: `resource_refs[i].id: required` и `audience.account_owner.account_id:
      required`, оба INVALID_ARGUMENT. Р11а (г) включает эти поля в перечень, закрытый классом. В §9
      нет ни одного сценария, где Resolve получает пустой id ссылки или пустой account_id владельца;
      в §10 нет строки близнеца; §11 для справочника называет только `project_id: required`
      ListProjectAudience. Без держателя реализация по TDD эти отказы не породит. Тогда пустой id
      уйдёт к модели объектом вида `storage_volume:` — ровно тот красный признак
      `api-resourceid-empty`, который закрывал B1-2. Исход такого вызова в таблице отказов тоже не
      определён: строка INVALID_ARGUMENT говорит только о «проверке типа ресурса или отношения».
      К тому же классу относится необязательный по форме `subject?`. Для аудиторий `resource` и `self`
      он нужен, но исход пустого `subject` при такой аудитории не записан.
    fix: >-
      Добавить в NTF3-118 (или в NTF3-120) буквы: `resource_refs=[{storage_volume, ""}]` →
      INVALID_ARGUMENT `resource_refs[0].id: required`, вопроса к модели нет; близнец —
      `[{storage_volume, vol-1}]`. Затем `account_owner{account_id=""}` → INVALID_ARGUMENT
      `audience.account_owner.account_id: required`; близнец — `acc-1` (NTF3-120). Затем `subject`
      пуст при `resource`/`self` → INVALID_ARGUMENT `subject: required`; близнец — `user:usr-A`.
      Для каждой буквы — строка §10. В §11 дописать эти отказы производителю справочника. В строке
      INVALID_ARGUMENT таблицы отказов назвать и отказ по обязательности (дефект сборки запроса
      notify, терминально).

non_blocking_findings:
  - "§1.12 сверен с NTF-1 @12a66925 (редакция 7), а принята редакция 8 @b347b81f (abc1fd487). Я сравнил: правки между ними не задевают ни одной строки таблицы §1.12. Отпечаток нужно перевести на принятый."
  - "NTF3-151, близнец по типу. Отрицание идёт через Resolve, близнец — через InternalIAMService/Check, поэтому меняются и вход, и объект. Место двери у обоих одно (Д-3), так что вывод верен. Пару в один факт даёт Check `{user:usr-ca, reader, notification_recipient_directory:root}` → false рядом с тем же Check на `iam_user:usr-A`/`token_issuer` → true; ради неё стоит добавить одну строку «And»."

method_verdict: >-
  Все три блокирующих круга 1 закрыты, каждый проверен пробой или сверкой с деревом: функция формата
  на 102 словах документа, текст отказа kinds, словарь storage. Счёт 158/7/151 сходится, у каждого
  живого сценария есть строка §11, в каждом пункте DoD есть сценарий. Д14–Д16 перенесены. Остался
  один возврат, и он узкий: у двух полей Resolve отказ по обязательности записан в решении, а держит
  его ноль сценариев. Это остаток класса B1-2, а заголовок редакции утверждает, что класс закрыт.
