blocking_findings:
  - id: B1-1
    kind: CONSTRUCTIBILITY
    title: Примеры неверного формата чужих id не сходятся с функцией, которую Р11а называет производителем
    where: "Р11а (а); Р11; NTF3-90 (в), (м); NTF3-116 (acc@1); NTF3-114 (sa-1); §10 строка NTF3-88; §11 строки NTF3-87..95, 112..116"
    finding: >-
      Р11а задаёт проверку формата чужих id одной функцией — corevalidate.ResourceID фундамента,
      family-agnostic. Я прогнал её на пине corelib @34bc8104a на примерах документа. Функция
      принимает «vol@1», «prj@1» и «acc@1»: устаревшая слитная форма у неё проверяет только первые
      три символа, а vol, prj и acc входят в каталог. Значит, «Тогда» в NTF3-90 (в) (`invalid
      storage_volume id 'vol@1'`), в NTF3-90 (м) (`invalid project id 'prj@1'`) и в NTF3-116 (`invalid
      account id 'acc@1'`) названный производитель не выдаст. Такой вход дойдёт до Check и получит
      FAILED_PRECONDITION либо PERMISSION_DENIED. Обратная ошибка в NTF3-114: «sa-1» функция
      отвергает (приставки sa в каталоге нет, у сервисного аккаунта приставка sva). Документ же
      утверждает, что «формат проходит, Р11а», и ждёт FAILED_PRECONDITION «not eligible».
    fix: >-
      Каждый пример прогнать через corevalidate.ResourceID на пине и записать исход в сценарий.
      Для отказа по формату взять вход, который функция отвергает: без известной приставки и без
      дефиса после неё (например, «u@1», «zz9»), — так в каждом из (в), (м) и NTF3-116. Для
      назначения сервисного аккаунта взять id с приставкой sva. Либо, если отказ «vol@1» нужен,
      назвать строгую проверку тела отдельным решением, но это выходит за границы B4 (а). Строку §10
      и производителя §11 согласовать.
  - id: B1-2
    kind: NEGATIVE
    title: Пустой обязательный чужой id цели подписки не отвергается — ResourceID пропускает пустую строку
    where: "Р11 (resource_id, project_id цели), Р11а (а); NTF3-90"
    finding: >-
      corevalidate.ResourceID возвращает nil на пустом id (validate.go:468-471 @34bc8104a).
      api-resourceid-empty требует у обязательного поля-ссылки своей проверки на обязательность:
      INVALID_ARGUMENT «<field>: required». В Р11 и Р11а её нет. NTF3-90 (г) проверяет только цель
      без resource и без project. Случаи `target.resource = {resourceType: "storage_volume",
      resourceId: ""}` и `target.project = {projectId: "", module: "storage"}` не определены. По
      написанному пустой id пройдёт формат и ответит линией владельца `storage_volume  not found`,
      то есть с вырезанным id. Это ровно красный признак правила.
    fix: >-
      Записать в Р11: пустые `resource_id`, `project_id` и `resource_type` дают INVALID_ARGUMENT с
      полем (`target.resource.resource_id: required` и т. д.), проверка идёт до права. Добавить
      в NTF3-90 буквы (н), (о) с близнецом NTF3-87, строку §10 и производителя §11.
  - id: B1-3
    kind: TWIN
    title: Пара NTF3-65/67 судит вид словом журнала, а не словом провода — отрицание упасть не может
    where: "NTF3-65 (второе «And»), NTF3-67; §1.9; §2.1 строка Д3; §1.12 (отпечаток NTF-1 a6cb0c1f)"
    finding: >-
      Действующая редакция NTF-1 @0311f05f (Р4, Р9, N07) и corelib @34bc8104a (KindDictionary,
      journal.go:345) задают вид на проводе словарём ObjectType: `notification_feed`. Слово
      `notification` — ключ журнала владельца, наружу оно не выходит. Поэтому отрицание NTF3-65
      («открытие потока с видом notification — INVALID_ARGUMENT») зелено при любом значении флага,
      а положительный близнец NTF3-67 («вид notification есть в словаре подписки storage») не
      пройдёт на верной реализации. Отрицание не отличает «флаг выключен» от «флаг включён».
      Корень в том, что §1.12 сверяет документ с NTF-1 @a6cb0c1f, а NTF-1 с тех пор сменила
      редакцию. У storage есть другие виды, поэтому по NTF-1 N07 (а) исход при флаге false —
      INVALID_ARGUMENT с текстом corelib.
    fix: >-
      Перевести §1.12 на NTF-1 @0311f05f и перепроверить каждую строку таблицы. В NTF3-65 утверждать
      `Subscribe` с `kinds: ["notification_feed"]` → INVALID_ARGUMENT, текст `kinds:
      "notification_feed" is not a kind of this owner; known kinds: <виды storage>`. В NTF3-67 —
      `notification_feed` в словаре `Opened` storage. §1.9 и строку Д3 назвать словом провода.
      Строка §10 — «флаг false / true: notification_feed вне словаря / в словаре».

non_blocking_findings:
  - "NTF3-151, близнец по типу: `project:prj-1` с `v_get` cluster-администратору даёт модель (fga_model.fga:414, 425 @734f69fb4), а не надзор. Близнец зелен и при надзоре, снятом на всех типах, то есть утверждение «надзор на прочих типах не тронут» он не держит. Взять близнец NTF-1 F12: `iam_user:<id>` с `token_issuer`, где «да» даёт только надзор. Либо снять утверждение и сослаться на F12."
  - "§1.12: отпечатки соседей устарели — NTF-1 теперь 0311f05f (редакция 6), NTF-6 — bd960b46 (редакция 4). NTF-6 ссылается на NTF-3 @a623c209, а не на эту редакцию: после одобрения NTF-6 надо перевести на итоговый отпечаток (строка диспетчеру)."
  - "§3: в перечне рёбер нет ребра `notify-api → служба доступа` (InternalIAMService/Check о назначаемом пользователе, Р20; публичный AuthorizeService/BatchCheck ленты, Р9; Check контактов и цели подписки). Назвать шаги на стороне службы доступа — допуск вызывающего на её слушателях — тем же приёмом, что у прочих рёбер."
  - "Д14: NTF3-151 поведенчески проходит только место Д-3 (verdictForRelation — дверь, через которую идут методы справочника). Остальные места для типа справочника держатся одной декларацией перечня и гейтом NTF1-F12. Довод верен; стоит записать его одной фразой в Р28, чтобы читатель не искал утверждение «на всех путях» в сценарии."

method_verdict: >-
  Все четыре блокирующих круга 2 закрыты правками редакции 7. Производитель назван у каждого
  «Тогда», близнец — у каждого нового отрицания, счёт 158/7/151 сходится, каталог (18/14/11) и
  шаги гейта (46) пересчитаны. Д14–Д16 перенесены строками §2.1. Возврат вызван тремя местами. Два
  из них выявлены прогоном и чтением названных в документе функций, а не соседних документов:
  примеры формата не проходят corevalidate.ResourceID, пустой id она пропускает, а вид на проводе
  назван словом журнала.
