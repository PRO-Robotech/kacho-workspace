blocking_findings:
  - id: B1
    kind: COVERAGE
    anchor: "§3 шаг (15) (столбец сигнала отказа); §11 строка NTF3-185 (столбец «Чем измерено»); §12.2"
    what: >-
      Атомарность события делится на две стороны: служба доступа применяет набор под одним g_E
      (NTF3-185), а модуль kacho обязан класть одну строку намерения на событие объекта и доставлять
      её одним вызовом (§3 шаг (15); §11 NTF3-185 называет производителем «модули kacho … правится:
      registry доставлял вызов на кортеж со сдвигом версии — sync_registrar.go:89 @ffbe930dbe»).
      Дефект, который нашла полоса K2, — ровно на стороне модуля. Но единственная проба, названная
      сигналом отказа шага (15) и «Чем измерено» в §11, — NTF3-185 близнец, интеграционная проба в
      дереве службы доступа через С24, а С24 по определению «без модуля kacho». Модуль, оставшийся с
      доставкой «вызов на кортеж» (registry: sync_registrar.go:76–90 @ffbe930dbe, цикл по
      intent.Tuples) либо с одним намерением на несколько объектов (vpc: network/delete.go:118–158
      @ffbe930dbe — одно EmitUnregister на route table, security group и сеть), ни одну пробу
      документа не краснит: NTF3-175 видит лишь «намерение есть» и барьер поколения (первый вызов
      применяет g_E, ListEventAudience не отказывает, потерянный кортеж владения невидим), гейт
      NTF3-186 судит только субъект user:*. Предикат: перечень Test-имён документа
      (grep -on 'Test[A-Z][A-Za-z0-9_]*') — гейта формы «строка намерения = одно событие одного
      объекта, один вызов с полным набором» среди 16 имён нет.
    fix_direction: >-
      Добавить держатель на стороне kacho: (1) гейт дерева kacho (repohygiene), который по каждому
      писателю намерения регистрации/снятия судит «одна строка намерения на событие одного объекта,
      набор целиком, один вызов RegisterResource/UnregisterResource на строку» и печатает объём;
      инъекция — доставка по кортежу (цикл вызовов по intent.Tuples) и одно намерение на несколько
      объектов — красный с файлом и строкой; близнец — зелёный; пустой обход — красный; (2)
      наблюдаемый сценарий модуля: usr-A создаёт репозиторий (registry) через край, служба доступа
      в обвязке — у объекта голова g_E и оба кортежа (parent, owner), Check(usr-A, v_get) true, вызов
      регистрации записан ровно один; близнец по одному факту — доставка по кортежу (внедрением в
      обвязке): owner отсутствует. Строки §3 (15), §10, §11, §12.
  - id: B2
    kind: CONSTRUCTIBILITY
    anchor: "Р30 «Приём поколения — CAS» («Снятие оставляет надгробие … регистрация поколения не новее надгробия зеркала не восстанавливает»), «Публикация для анонимного чтения» («снятый объект не публикуется ни при какой версии»), Р3 («g_E … у каждого события объекта на 1 больше предыдущего»); NTF3-185 (г), NTF3-186 (в)"
    what: >-
      Объект registry_repository адресуется ИМЕНЕМ: id = <registryID>/<repo>
      (fga_intent.go repoObjectID @ffbe930dbe; комментарий UnregisterIntentForRepo там же прямо
      называет повторное создание репозитория с тем же именем штатным случаем). Р30 оставляет на
      снятом объекте надгробие с поколением снятия до горизонта (не меньше 720h), отвергает
      регистрацию не новее надгробия и — новое в редакции 40 — публикацию «ни при какой версии».
      Документ не называет производителя поколения нового объекта с тем же id: если счётчик модуля
      живёт в строке ресурса (у реестра признак существования репозитория — строка
      registry_repository_registration, снимаемая при удалении), новый репозиторий начнёт с g_E = 1,
      его CREATED уйдёт в REJECTED_STALE без записи — ни parent, ни owner, создатель без доступа к
      своему репозиторию, публикация невозможна до ухода надгробия, а вопрос об аудитории — барьер
      поколения либо аудитория чужого объекта. Ни один сценарий не строит Given «объект снят и создан
      заново с тем же id в пределах горизонта», хотя NTF3-185 (г) и NTF3-186 (в) ставят надгробие
      именно этому типу. Предикат: grep -niE 'пересозд|заново.*созда|тем же имен' <документ> — ни
      одного попадания о репозитории.
    fix_direction: >-
      Решить в Р30, что поколение объекта, адресуемого именем, продолжается поверх надгробия
      (производитель — счётчик модуля, переживающий удаление строки ресурса, либо приём службы
      доступа, выдающий следующее поколение после надгробия на CREATED; выбрать одно и назвать) и
      что запоздалая доставка прежнего объекта по-прежнему отвергается. Сценарий: репозиторий
      reg-1/pub создан, снят (надгробие g), создан заново тем же именем — регистрация применена,
      owner нового создателя есть, прежнего — нет, публикация нового применяется; близнец по одному
      факту — запоздалая регистрация снятого объекта с поколением не новее g — REJECTED_STALE.
      Строки §10, §11, §12.
