non_blocking_findings:
  - id: N1
    kind: COVERAGE
    where: "NTF3-185 (б)"
    note: >-
      Повтор поколения 1 при голове 2 — «старше головы», что уже держит NTF3-174 (д). Случай
      синхронной доставки и дренажа — повтор поколения, РАВНОГО голове, с тем же набором; его держит
      только косвенно близнец (а) (другой набор). Лучше повторять поколение 2 при голове 2.
  - id: N2
    kind: COVERAGE
    where: "Р30 «Публикация для анонимного чтения»; NTF3-186"
    note: >-
      Порядок двух строк намерения реестра (регистрация и публикация create-with-PUBLIC) не
      гарантирован; документ не говорит явно, что публикация объекта без головы (регистрация ещё не
      пришла) применяется. Вывод из «REJECTED_STALE только при надгробии» верен, но сценария нет.
  - id: N3
    kind: FORMAT
    where: "NTF3-182 When/Then"
    note: >-
      «buf breaking против ствола» при объявленном ломающем изменении — исход не назван (ожидается
      отчёт о нарушениях ровно по перечисленным номерам). Пред-существующее, правкой 40 не внесено.
  - id: N4
    kind: FORMAT
    where: "NTF3-174 (в), (г), (к)"
    note: >-
      «кортежи владения» у vol-41, зарегистрированного через С24, где по умолчанию (редакция 40) один
      структурный кортеж; формулировку стоит привести к «кортежи объекта».
