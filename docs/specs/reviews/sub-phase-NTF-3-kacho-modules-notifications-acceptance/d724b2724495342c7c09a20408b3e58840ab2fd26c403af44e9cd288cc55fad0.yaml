blocking_findings:
  - id: B1
    kind: CONSTRUCTIBILITY
    anchors: ["NTF3-160 (г) Given/When", "§7 строка «Привязка диска»"]
    what: >-
      Given (г) требует успешных AttachDisk и DetachDisk (`done=true`, `vol-11` → IN_USE → AVAILABLE)
      на инстансе, созданном `usr-A`, но не называет состояния инстанса и фикстуры, которая его
      строит. Воркер AttachDisk первым шагом зовёт GateForAttach: `status IN ('RUNNING','STOPPED')`,
      иначе FAILED_PRECONDITION «Instance must be RUNNING or STOPPED» (compute
      repo/instance_repo.go:442-447; api/instance/instance.go:813). Instance.Create кладёт машину в
      PROVISIONING (instance.go:450-452, «переход к RUNNING — COMP-2»), Start требует STOPPED, Stop —
      RUNNING (instance.go:750-757); других записей статуса в не-тестовом дереве compute нет
      (git grep 'SET status' → только CAS lifecycle и DELETING). То же зафиксировано в
      services/compute/tests/newman/cases/instance-nic-attach.py:23-32 («собрать НЕЛЬЗЯ … ни одного
      перехода из PROVISIONING не существует»). Сценарий в написанном виде завершится отказом
      операции, а не строками журнала: неверен сценарий, а не продукт. Утверждение §7 «публичным
      API конструируется» о дереве ложно — ровно то, что раздел «Чего посеять нельзя» обязан назвать.
    predicate: >-
      в репозитории PRO-Robotech/kacho: git grep -n "SET status\|InstanceStatusRunning\b" 1d42a6728bf --
      services/compute/internal ':!*_test.go' → переходов из PROVISIONING 0.
    required: >-
      Назвать, как строится машина в RUNNING или STOPPED в интеграционной обвязке (compute и storage
      в одной обвязке уже названы в §11): например, посев строки инстанса compute со статусом
      RUNNING/STOPPED прямой записью в базу compute как фикстура, помеченная seed со ссылкой; либо
      перенести When (г) на внутренний вызов storage `InternalVolumeService.Attach/Detach` от
      отправителя из круга пересылающих с пересланной личностью `usr-A`/`usr-B` — тогда Then о
      статусе тома и строках журнала/ленты остаётся в силе, а публичный AttachDisk уходит в строку §7
      как неконструируемый до COMP-2. В обоих путях — исправить строку §7 (что конструируется, что
      нет и почему, с командой), строку §10 (близнец не меняется) и §11 (фикстура).

non_blocking_findings:
  - "(г) Then «строк журнала storage после P0 с инициатором вида service: или system: — 0» опирается на то, что сверщик storage между P0 и чтением не идёт — это в Given названо. Если выбран путь с посевом строки инстанса, стоит добавить: посев выполняется ДО чтения P0 (иначе посев в базу compute журнал storage не трогает — сейчас это верно, но утверждение держится на порядке)."
  - "Неблокирующие прошлых кругов, не относящиеся к дельте, остаются в силе (форма вставки в журнал именем-переменной для NTF3-70; согласование 23502 с CX3B-25 (б) — к design-author)."

method_verdict: >-
  Судилась только дельта 18 → 19 (Д22). Класс RA-02 закрыт правильно: пересланный субъект —
  инициатор (Р2), перепись пересылаемых путей воспроизведена, производитель и близнец (г) есть,
  число строк на привязку и снятие верно по SQL. Но Given (г) неконструируем @1d42a6728bf: успешный
  AttachDisk требует машины в RUNNING/STOPPED, а из PROVISIONING в дереве перехода нет. Блокирующих 1
  (CONSTRUCTIBILITY). Посевов не было — «не выполнилось», в зелёное не зачитано.

