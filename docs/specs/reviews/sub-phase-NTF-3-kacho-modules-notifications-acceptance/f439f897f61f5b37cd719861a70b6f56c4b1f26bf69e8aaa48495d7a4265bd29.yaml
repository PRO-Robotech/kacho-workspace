    - given: "Снимок = все, у кого есть v_get, с раскрытыми группами"
      evidence: >-
        У kaname есть перечисление ListUsers по реляционной форме: проходит каскады, scope_grant и
        group#member, user_filters [user, service_account], подстановку не выдаёт
        (internal/apps/kaname/api/access_binding/expand_access.go:11-25,58).
    - given: "Снимок в той же транзакции, что зеркало и кортежи"
      evidence: >-
        Кортежи хранятся в реляционной форме в базе kaname (access_binding_emitted_tuples,
        decision door over the relational form), а не во внешнем хранилище. Одна транзакция
        поэтому возможна.
    - given: "GW usr-R: resource_names: [\"vol-31\"] до создания vol-31"
      evidence: "Опровергнуто, см. B1: reconcile/forward.go:564 сравнивает с ObjectID, а id выдаёт ids.NewID при создании."
