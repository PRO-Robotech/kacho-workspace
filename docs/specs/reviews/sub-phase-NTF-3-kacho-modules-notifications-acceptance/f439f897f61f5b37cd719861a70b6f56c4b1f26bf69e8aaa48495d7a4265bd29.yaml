non_blocking_findings:
  - id: N1
    kind: FORMAT
    anchor: "§8, строка С1"
    what: "С1 ссылается на снятые NTF3-24 и NTF3-104. Ссылки надо заменить на NTF3-168 или убрать."
  - id: N2
    kind: OPEN-QUESTION
    anchor: "Р30, «Намерение, устаревшее для зеркала»; NTF3-174 (д)"
    what: >-
      Для устаревшей версии правило «снимок по зеркалу на момент приёма» описано только на случай,
      когда зеркало уже несёт более новую версию. Не описан случай, когда зеркала уже нет:
      регистрация старой версии пришла после UnregisterResource. Такое возможно, когда отравленную
      строку очереди обходят по MaxAttempts. Неясно, какой снимок получает такая версия и
      восстанавливает ли она зеркало. Дефолт ревью: снимок пустой (READY, 0 субъектов), зеркало не
      восстанавливается. Это надо записать в Р30 одной строкой.
  - id: N3
    kind: OPEN-QUESTION
    anchor: "Р10 (ячейка OWN_ACTIONS: «Других писем ячейка не касается»), Р16, Р18"
    what: >-
      Д129 (6) документ читает так: под «собственное действие» попадают только письма resource-event
      (сводка и подписка). Письмо о сбое операции, отправленное её инициатору, и письмо о сбое ресурса
      инициатору намерения ячейкой не глушатся. Прочтение записано явно и разумно: иначе сигнал
      о сбое по умолчанию бы пропадал. Дефолт ревью этот выбор принимает, подтверждение остаётся за диспетчером.
  - id: N4
    kind: OPEN-QUESTION
    anchor: "Р30 «Владелец и администраторы аккаунта и администратор облака … в аудитории есть»; NTF3-76; NTF3-174 (и)"
    what: >-
      Вывод буквально следует из Д129 (1) и модели (or super_admin, any_admin from cluster), но
      последствие нигде не названо. Каждый администратор облака попадает в снимок каждого события
      каждого арендатора, и ему по умолчанию приходят сводки (ячейка RESOURCE_CHANGE EMAIL включена)
      об изменениях всех ресурсов всех аккаунтов. Объём и выход данных арендаторов в почтовый ящик
      оператора — это стратегический выбор, вопрос к владельцу. Дефолт ревью: держать как
      написано, а последствие назвать в Р30.
  - id: N5
    kind: CONVENTION
    anchor: "§1.12; шапка, «Ревизии измерения»"
    what: >-
      Документ опирается на NTF-1 @530e2296 (редакция 9). В дереве лежит одобренный NTF-1 c19490f9,
      и сверка дельты 530e2296 → c19490f9 в §1.12 не сделана. Это не дельта Д129: так было уже на
      одобренной редакции 34. При следующей правке строки таблицы §1.12 надо перемерить на c19490f9.
