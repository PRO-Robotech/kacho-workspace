blocking_findings:
  - id: B1
    kind: CONSTRUCTIBILITY
    anchor: "Группа W, общее «Дано» GW (usr-R); NTF3-165 (д) и «ровно 10 субъектов»; NTF3-171 (10 субъектов, страницы 4+4+2)"
    what: >-
      В GW у usr-R до When стоит правило, закреплённое по имени: resource_names: ["vol-31"]. Сам том
      vol-31 создаётся только в When, публичным VolumeService.Create, и id ему выдаёт ids.NewID.
      Служба доступа сравнивает resource_names с id объекта:
      project/kaname @8a84dcff6 internal/apps/kaname/api/access_binding/reconcile/forward.go:564
      `containsStringForward(sel.ResourceNames, o.ObjectID)`, а в комментарии role.proto сказано
      «Pin-by-id … opaque-id». Значит, правило, записанное до создания, указывает на id, которого
      ещё нет. Под него не попадёт ни один том, созданный в When. Тот же запрет документ формулирует
      и сам, в Р11а: «id, которого производитель не чеканит, в «Дано» не посеять». Поэтому
      usr-R в снимке CREATED vol-31 не окажется. Следствия: буква (д) недостижима, «ровно 10
      субъектов» в NTF3-165 неверно, и всё, что на это число опирается, тоже не сходится: выдача
      10 субъектов и страницы 4+4+2 в NTF3-171.
    fix_direction: >-
      Охват по закреплённому имени надо строить на объекте, чей id уже известен. Вариант 1: сначала
      создать том, затем посевом С1 выдать usr-R правило с его id, а утверждать событие UPDATED
      следующей версии (близнец — версия до выдачи). Вариант 2: утверждать эту букву на уровне
      службы доступа через С24, с id, заданным пробой, как в NTF3-174. После этого пересчитать
      числа в NTF3-165 и NTF3-171.
  - id: B2
    kind: FORMAT
    anchor: "NTF3-170 (а) «запись и 10 строк аудитории (как NTF3-165)»; NTF3-170 (б) «все 10 строк аудитории» (оба раза и в близнецах)"
    what: >-
      vol-37 и vol-38 создаются без меток {env: prod}: метки в When не названы. Ни один из них не
      vol-31. Отсюда по правилу Р30 и по самому GW: usr-L (сужение по меткам env: prod) и usr-R
      (закреплён vol-31) в снимки этих томов не входят. Аудитория получается {usr-A, usr-B, usr-C,
      usr-D, usr-M, usr-T, usr-blk, usr-own}, то есть 8 субъектов, а не 10. «Тогда» противоречит
      правилу документа, и проба, написанная по такому тексту, либо падает, либо требует подгонки.
      Однозначности нет.
    fix_direction: >-
      Указать число, которое следует из GW для тома без меток (8), и перечислить субъектов явно.
      Другой вариант — создавать vol-37 и vol-38 с метками {env: prod}, тогда получится 9: usr-R по-прежнему
      привязан к vol-31.
security_check:
  wildcard_not_audience: >-
    Соблюдено. Р5, Р30 и NTF3-166 исключают user:*, sva-1 и system:*, у близнеца — привязка. Р11
    отказывает в доставке тому, кто видит объект только по подстановке (NTF3-95).
  snapshot_without_addresses: >-
    Соблюдено. Р30 «Адресов в снимке нет». ListEventAudience отдаёт только user:<id> (NTF3-171:
    «адресов в ответах нет»). Адрес выдаёт только Resolve после проверки ACTIVE и подтверждения
    (Р6, Р7).
  single_mechanism: >-
    Соблюдено. Предикат grep -nE 'ListProjectAudience|visible_refs|resource_refs|якор|момент отправки|переходн'
    по документу: все совпадения — либо шапка, либо §4 «замещение», либо записи о снятых сценариях,
    либо фраза «у каналов notify нет». Отдельно разобрана проверка Check(v_get) при создании
    подписки (Р11). Она отвечает на вопрос о существовании цели, а не на вопрос, кому доставлять,
    и Р11 это прямо оговаривает. Переходного режима нет (шапка, Р30, §4).
