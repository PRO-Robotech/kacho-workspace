blocking_findings:
  - id: B1-1
    kind: CONSTRUCTIBILITY
    scenarios: [NTF3-06, NTF3-07, NTF3-08, NTF3-10, NTF3-11, NTF3-12, NTF3-13, NTF3-14]
    title: >-
      Given NTF3-06 «том AVAILABLE + терминальный отказ глагола, который сверщик исполнит →
      statusReason=BACKEND_REJECTED» деревом не строится; «то же для снимка и образа» — тем более.
    evidence: >-
      reconciler/decide.go:135-152 @1d42a6728bf: у AVAILABLE/IN_USE сверщик исполняет глагол
      бэкенда ТОЛЬКО при недоехавшем увеличении размера (ActionResize); иначе ActionNone, либо
      ActionReportVanished без вызова глагола → MarkError(PRECONDITION_FAILED) (loop.go:312).
      Глагол с терминальным исходом → BACKEND_REJECTED исполняется у CREATING (ActionProvision,
      loop.go:376 → ReasonFor). У снимка и образа состояния CREATING/READY/DELETING/ERROR
      (snapshot.proto:21-30, image.proto:35-44) — AVAILABLE нет, изменения размера нет.
    required: >-
      Переписать Given на реально производимые переходы: CREATING → ERROR (терминальный отказ
      CreateVolume/CreateSnapshot/CloneVolume/CopySnapshot → BACKEND_REJECTED) для всех трёх
      типов; при желании — второй путь AVAILABLE/READY → ERROR через пропажу объекта
      (PRECONDITION_FAILED) и путь изменения размера тома. Таблицу близнецов §8 (NTF3-07/08
      «AVAILABLE») поправить тем же изменением.
  - id: B1-2
    kind: COVERAGE
    scenarios: [NTF3-09, NTF3-10]
    title: >-
      Р13 перечисляет глаголы намерения не полностью: строки ресурса рождают ещё Snapshot.Copy,
      Image.Copy и InternalImageService.Register; что пишется в intent_initiator на них — не сказано,
      ограничение колонки не определено, производитель Given NTF3-09 не назван.
    evidence: >-
      snapshot_service.proto:93 `rpc Copy`, image_service.proto:117 `rpc Copy`,
      internal_image_service.proto:53 `rpc Register` (system_admin @ cluster, образ вносит
      оператор установки в проект арендатора) @1d42a6728bf. Для Register инициатор — оператор, а
      не арендатор: письмо о пропаже зарегистрированного образа уйдёт оператору либо не уйдёт
      никому. NTF3-09 требует строку без инициатора «созданную до изменения схемы», а Р9-а
      (прода нет, без обратного заполнения) такой строки в живой установке не оставляет.
    required: >-
      Назвать intent_initiator для каждого глагола, рождающего или меняющего строку (включая Copy
      и Register) и решение о получателе для Register; объявить ограничение колонки на уровне БД
      (NOT NULL / CHECK), и тогда либо назвать живой путь, дающий пустого инициатора (он и есть
      Given NTF3-09), либо снять NTF3-09 и ветку `no_initiator` как мёртвые. Сценарии на Copy и
      Register.
  - id: B1-3
    kind: NEGATIVE
    title: >-
      У двух из пяти исходов Р10 нет сценария: `UNAVAILABLE`/срок (DEFER, fail-closed, «срок
      строки не продлевается») и `SUBJECT_NOT_FOUND` (NO_ADDRESS(subject_gone)).
    evidence: >-
      §9 группы C–E: сценарии на ADDRESS (23), AUDIENCE_DENIED (24), NO_CONFIRMED_ADDRESS (25, 26);
      на недоступность службы доступа и на удалённого субъекта — ни одного. Чек-лист требует
      UNAVAILABLE peer fail-closed.
    required: >-
      Добавить: служба доступа недоступна → строка DEFER, 0 SMTP-сессий, expires_at не сдвинут,
      после восстановления доставлена; недоступность дольше 24h → EXPIRED. Субъект удалён между
      постановкой и доставкой → NO_ADDRESS(subject_gone), счётчик. Каждый с близнецом NTF3-15.
  - id: B1-4
    kind: COVERAGE
    title: >-
      Лимит на проект (Р14: 200 писем в час) объявлен и не имеет ни одного сценария; проверен
      только лимит на получателя (NTF3-13/14).
    required: >-
      Пара сценариев 200-е/201-е письмо проекту за час от разных получателей (каждый ниже своего
      лимита); переход ресурса коммитится, reason="limit" с различимой меткой уровня лимита.
  - id: B1-5
    kind: FORMAT
    scenarios: [NTF3-18, NTF3-30, NTF3-17]
    title: >-
      «Тогда» без конкретного наблюдаемого значения.
    evidence: >-
      NTF3-18 — «в пределах срока реакции, объявленного NTF-1»: приёмки NTF-1 в дереве нет
      (`ls docs/specs | grep -i ntf` → NTF-3, NTF-4), число не определено, утверждение упасть не
      может. NTF3-30 — «пара HTTP-статус + code утверждается по таблице края» без самих значений.
      NTF3-17 — «соединение отвергается» без наблюдаемого исхода (код/ошибка рукопожатия/метрика с
      именем).
    required: >-
      NTF3-18: назвать границу числом здесь (либо сослаться на NTF-1 по отпечатку, когда он будет).
      NTF3-30: выписать пару (HTTP-статус, code) из таблицы края. NTF3-17: назвать исход и имя
      счётчика.
  - id: B1-6
    kind: CONVENTION
    title: >-
      Новые runtime-рёбра notify→storage (лента) и notify→kaname (справочник Resolve) не
      фиксируются в таблице рёбер спеки; DoD называет только записи vault.
    evidence: >-
      docs/specs/01-architecture-and-services.md:44-57 — таблица runtime cross-domain edges и норма
      «Новое ребро фиксируется…»; правило data-integrity `new-edge-in-polyrepo`, polyrepo
      `poly-acyclicity-statement`. В документе строки 175 и 804 — только упоминание и vault.
    required: >-
      Пункт DoD S2: строки рёбер в таблице 01 с назначением и утверждением ацикличности
      (storage и kaname notify не зовут).

non_blocking_findings:
  - kind: TWIN
    text: >-
      §8: у NTF3-24/25/26 близнец — NTF3-15 (обработка строки), а не NTF3-23 (прямой Resolve);
      NTF3-16 против NTF3-15 меняет два факта — дать близнеца, где строка `volume-error` тоже
      вставлена прямой вставкой.
  - kind: COVERAGE
    text: >-
      decide.go:154-159: ERROR при здоровом объекте возвращается в строй (ActionConfirm). Значит
      цикл ERROR → AVAILABLE → ERROR даёт по Р15 второе письмо. Сказать это явно и закрыть
      сценарием (второе письмо ставится; лимит его ограничивает).
  - kind: CONVENTION
    text: >-
      intent_initiator — субъект арендатора в строке ресурса: утвердить, что он не выходит в
      публичную проекцию Get/List (security `sec-two-projections`), либо сказать, где выходит.
  - kind: NEGATIVE
    text: >-
      Р11: `reader` на справочнике выдаётся строкой манифеста самого notify. Нужен отрицательный
      сценарий «манифест иного модуля объявляет ту же выдачу → судья манифеста отвергает», иначе
      Check справочника сводится к «кто написал манифест» и держится одним списком SAN.
  - kind: SCOPE
    text: >-
      Введение не ссылается на 04-roadmap §3; в спеке-книге требований к нотификациям нет.
      Назвать источником scope требования владельца 2026-09-29/30 и эпик #2914 явно.
  - kind: FACT
    text: >-
      NTF3-08 опирается на `WHERE state <> 'DELETING'` (store.go:258), а публичная страница
      storage volume.mdx:376 обещает «DELETING, затем ERROR с BACKEND_REJECTED» при отказе
      снятия. Одна из двух сторон ложна; к этой приёмке не относится, но кандидат на находку.

