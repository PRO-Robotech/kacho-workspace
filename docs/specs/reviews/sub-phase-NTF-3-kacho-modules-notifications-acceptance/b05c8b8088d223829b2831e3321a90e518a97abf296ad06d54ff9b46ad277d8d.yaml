non_blocking_findings:
  - id: N1
    kind: CONVENTION
    anchor: "Р2, абзац об имени снятия (стр. 731-735); шапка, строка редакции 34; §2.1 строка Д127 (г)"
    what: >-
      Утверждение «у пулов адресов — имена пулов, заведённых до единой формы» дерево опровергает.
      project/kacho @ffbe930dbef, services/vpc/internal/migrations/715001_resource_name_single_form.sql:
      address_pools входит в перечень таблиц; имя не по форме (включая пустое) заменяется на id
      (UPDATE … SET name = id WHERE name IS NULL OR name !~ form), затем ставится
      CHECK (name ~ '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'). Домен: RcNameVPC.Validate → nameform.OK.
      В мигрированной базе пул с именем вне DNS-метки не существует. Это подтверждает замер автора,
      который правило про пулы тоже не подтвердил. Ни один «Тогда» на это не опирается: снимок несёт
      хранимое имя как есть, и для пула оно — DNS-метка. Поэтому замечание не блокирует, но при
      следующей правке пулы надо убрать из списка исключений Р2, шапки и §2.1, а не держать там
      ложное основание.
  - id: N2
    kind: FORMAT
    anchor: "§2.1, стр. 705-710"
    what: >-
      Между строкой Д31 и строками Д127 (в), Д127 (г), Д128 стоит пустая строка, а заголовок
      «### 2.2» идёт сразу за ними без пустой строки. В CommonMark/GFM три новые строки отрываются
      от таблицы (у них нет заголовка и разделителя) и отображаются абзацем с вертикальными чертами.
      На смысл не влияет; исправить — убрать пустую строку перед Д127 и поставить её перед «### 2.2».
  - id: N3
    kind: COVERAGE
    anchor: "§11 строка NTF3-61; §12.1 п.2"
    what: >-
      Что исключение «отбор по меткам неисполним» названо на клиентской странице подписки и в записи
      решения, держится строкой гейта subscriptionstatelabels_test.go в §11, но ни один сценарий
      это не утверждает. Держатель назван, производитель назван — не блокирует; при желании —
      отдельное «И» к NTF3-61 с предикатом (гейт красный, если вид без типа состояния не назван
      на странице).
