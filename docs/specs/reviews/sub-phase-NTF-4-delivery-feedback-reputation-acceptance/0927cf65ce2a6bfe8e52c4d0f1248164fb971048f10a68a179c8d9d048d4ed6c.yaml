blocking_findings:
  - id: B4-1
    kind: PRODUCER
    where: "§3.1 строка Д2; Р7; NTF4-24…NTF4-30, NTF4-82…NTF4-86; §8 строки 24–29 и 82–86; Р16; §11 «новое межсервисное ребро — нет»"
    claim: >-
      Строка Д2 в §3.1 говорит: администратор приходит к Р7 «пересланным принципалом из круга
      пересылающих». Но ни одна часть документа этого не производит. Не названо, кто пересылает;
      не названы круг пересылающих notify, его ручка и отказ в старте на пустом круге. В закрытом
      перечне 25 ручек Р16 такой ручки нет. У notify до NTF-4 входящих вызовов нет (Д1), значит
      NTF-1 круга тоже не заводит. Штатный путь человека к Internal*-службе в дереве —
      внутренний mux края: служба монтируется через <домен>InternalAddr, образец Р7 (RevokeAdmin)
      несёт google.api.http и «REST exposed ONLY on the cluster-internal listener». Если путь
      этот, появляется ребро край→notify и маршрут опроса операций с префиксом nop. А §11
      утверждает, что нового ребра нет. Если путь другой (прямой вызов с пользовательским
      токеном), notify нужна проверка токена, и её ручек в Р16 тоже нет. В обоих случаях Given
      «вызывающий — администратор кластера» и «Тогда» NTF4-24 «актор — субъект из удостоверения
      вызывающего» производителя не имеют.
    evidence:
      - "grep -n -iE 'пересыла|forward|restmux|InternalAddr|gateway' <док> → единственное место — стр. 163 (строка Д2)"
      - "kacho 1d42a6728bf gateway/internal/restmux/mux.go:434-448 — перечень <домен>InternalAddr без notify"
      - "kaname 734f69fb4 internal_cluster_service.proto:105-110 — google.api.http у RevokeAdmin"
      - ".claude/rules/security.md строки sec-forwarded-trust-aware-extract, sec-forwarder-allowlist-nonempty, sec-forwarder-bootguard-empty-circle, sec-forwarder-in-selfreport-and-gate, sec-admin-ui-rpc-internal-only"
    required: >-
      Выбрать и назвать путь личности администратора до InternalSuppressionService. Для
      выбранного пути назвать:
      (1) производителя — пересылающий, его координату; для края — регистрацию во внутреннем mux и
      маршрут OperationService.Get по префиксу nop;
      (2) ребро в §11 и в строке «рёбра» Д4, либо обоснование, почему ребра нет;
      (3) ручку круга (или ручки проверки токена) в перечне Р16 с границами и сценарий
      отказа в старте на пустом круге;
      (4) отрицательный сценарий: пир вне круга пересылает личность администратора → личность
      снята, отказ; положительный близнец — тот же вызов от пересылающего из круга (NTF4-24);
      (5) держателя в §8 и пункт DoD S3.
  - id: B4-2
    kind: COVERAGE
    where: "Р5 (инвариант «одна запись на (отпечаток, область, ns, шаблон)»); NTF4-11, NTF4-19; §8; DoD S2"
    claim: >-
      Причины SOFT_BOUNCE и COMPLAINT имеют одну область NOTICE и пустые ns и шаблон. Значит, у
      обеих один ключ уникальности. Р5 определяет только «повторное событие той же причины». Что
      происходит, когда на ключе, где уже стоит одна причина, приходит событие другой, не
      сказано. Опасная линия: для A действует бессрочная COMPLAINT. Затем набирается порог
      мягких отказов. Если SOFT_BOUNCE обновит ту же запись по правилу «та же запись, новый
      expiresAt», жалоба молча получит срок SOFT_TTL и истечёт. После этого письма notice снова
      пойдут адресату, который пожаловался, — это против Д11 и против Р13 («обратная связь только
      сужает»). Обратная линия (COMPLAINT после SOFT_BOUNCE) тоже не определена: нарушение
      уникальности, потеря жалобы или перезапись. Сценария нет ни на одну из линий.
    evidence:
      - "Р5, стр. 259-261: «Инвариант БД: не больше одной записи на (отпечаток адреса, область, ns, шаблон). Повторное событие той же причины обновляет…»"
      - "grep -n -iE 'друг(ой|ая) причин|разн(ой|ые) причин|приоритет' <док> → 0"
    required: >-
      Назвать в Р5 правило для разных причин на одном ключе. Варианты: (а) причина входит в ключ,
      и записей две; (б) порядок старшинства «бессрочная не заменяется срочной, срок только
      растёт». Добавить сценарии интеграционного уровня:
      COMPLAINT → затем порог SOFT_BOUNCE → жалоба действует после SOFT_TTL + 1 с (П9), строка
      notice → SUPPRESSED(complaint);
      обратный порядок SOFT_BOUNCE → COMPLAINT → запись бессрочна.
      Положительный близнец — NTF4-19 (одна причина). Добавить в §8 и DoD S2.

non_blocking_findings:
  - id: N4-1
    kind: CONVENTION
    where: "Р6 («все письма класса notice отключаемы: неотключаемых писем класса notice в сборке NTF-1…NTF-4 нет»); §3.1 Д9"
    note: >-
      Д9 разрешает отписку только от отключаемых видов. Документ сводит это к равенству «класс
      notice = отключаемый вид». Но это утверждение о содержимом соседних под-фаз, и никакая
      проверка его не держит. NTF-3 Р14 объявляет у всех шаблонов модулей class: notice. Д9
      относит к неотключаемому классу S напоминание об истечении ключей (реализуется в notify) и
      письма из аудита kaname (NTF-2). Если хоть одно такое письмо окажется notice, NTF-4 молча
      повесит на него List-Unsubscribe, а отписка и жалоба его подавят. Рекомендую правило
      единого валидатора notify/spec: «неотключаемый вид не может иметь класс notice» (либо
      признак отключаемости в notification.yaml, от которого зависит заголовок), и сценарий с
      близнецом. Как минимум — строку зависимости от NTF-2/NTF-3 с предикатом.
  - id: N4-2
    kind: FORMAT
    where: "Р2, условие 3 для отписки"
    note: >-
      Проверка отписки сравнивает From письма отписки с получателем. У адресата, который
      пересылает почту или пишет с псевдонима, отписка отвергается (recipient_mismatch). Это
      разумная цена, но стоит назвать её остатком рядом с Р6.
  - id: N4-3
    kind: TWIN
    where: "NTF4-15"
    note: >-
      Близнец NTF4-01 отличается больше чем одним фактом: сертификат ящика, срок ожидания и
      другой предмет утверждения. Чистый близнец — тот же стенд с доверенным сертификатом, где
      notify_feedback_poll_last_success_timestamp растёт и признак feedback_stale = 0.

