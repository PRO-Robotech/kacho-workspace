blocking_findings:
  - id: B15-1
    kind: CONSTRUCTIBILITY
    anchors:
      - "NTF4-107, Given: «в пробе P < D < I (в границах Р16); выпуски — в t0 + I, t0 + 2I, t0 + 3I, t0 + 4I»"
      - "NTF4-107, Then: «после (а): П5 принял ровно 3 контрольных письма»; «после (б): выпуск t0 + 4I прочитан»"
    summary: >-
      Шаг (а) заканчивается в t0 + 3I + D + P. «Ровно 3 принятых выпуска» и «четвёртый выпуск
      в t0 + 4I попадает в (б)» следуют из Given только при 3I + D + P < 4I, то есть D + P < I.
      Кроме того, выпуски стоят ровно в t0 + kI, только если I кратно P. Такт исполняет
      держатель, интервал отсчитывается от последнего принятого выпуска (Р10), поэтому при
      I, не кратном P, выпуски сдвигаются. Given требует только P < D < I, а этого мало.
    counterexample: >-
      I = 60 с, D = 50 с, P = 20 с. Условие P < D < I выполнено, границы Р16 тоже: POLL ≥ 5 с,
      CANARY_INTERVAL ≥ 1 мин, 30 с ≤ DEADLINE < INTERVAL. (а) идёт до 60·3 + 50 + 20 = 250 с,
      а четвёртый выпуск принят на такте 240 с, внутри (а). Тогда «ровно 3» красное на исправном
      продукте, и (б) читает уже пятый выпуск, а не t0 + 4I.
    required: >-
      Дописать в Given NTF4-107 (и в строку П9, если там стоят стендовые значения) условие
      «I кратно P и D + P < I», оставаясь в границах Р16. Либо переформулировать Then через
      номера выпусков, а не через моменты времени. Близнец NTF4-73 и прочие утверждения
      сценария не меняются.
    basis: >-
      gate-authoring §«детерминизм входа и управляемые часы»; чек-лист acceptance-reviewer §3.5
      «Конструируемость Given»: Given должен строить состояние, из которого «Тогда» выводится,
      при любом допустимом по нему значении.

non_blocking_findings:
  - id: N15-1
    kind: SCOPE
    anchors:
      - "NTF4-23, Then: «вторая → SENT (локальная часть различается, Р15)»"
      - "§1, строка «нормализация адреса»"
    summary: >-
      Это остаток класса RA-01. Р15 редакции 15 больше не определяет нормализацию: «её семантику
      задаёт NTF-1». При этом NTF4-23 ссылается на Р15 как на основание того, что локальная часть
      сохраняет регистр. Строка §1 «нормализация адреса» этого элемента не называет, хотя по
      правилу связи §1 она обязана назвать каждый элемент соседа, на котором стоит «Тогда».
      Сосед этот элемент производит: NTF-1 редакция 10, строка 637 — «локальная часть без
      изменений». Исправление: в NTF4-23 сослаться на строку §1, а в строку добавить элемент
      «локальная часть без изменений».
  - id: N15-2
    kind: FORMAT
    anchors: ["Р20, таблица «Оси дескриптора носителя у notify — откуда каждая величина»"]
    summary: >-
      Таблица утверждает, что источник назван «у каждой оси servicecontract.Spec на пине замера».
      Разбор `type Spec struct` @34bc810 даёт 29 полей, и пяти из них в таблице нет: `Logger`,
      `OwnContour`, `TrustDomainKnob`, `SelfCheck`, `Existence`. Значение каждого выводится из
      документа: `OwnContour` пуст (он отвергнут в Р20); `SelfCheck` = nil при `AuthzViaIAM`
      (contract.go:1086-1090); `Existence` = nil при изъятом `HideExistence` (:1395-1400);
      `TrustDomainKnob` = `KACHO_NOTIFY_AUTHZ_TRUST_DOMAIN`, и пустое значение отвергается
      (:1006). Но утверждение о полноте буквально неверно. Для той же оси, что `ForwarderKnobs`,
      имя ручки назвать стоит.
  - id: N15-3
    kind: SCOPE
    anchors: ["§1, «Открытый возврат разбора классов NTF-1 на d524e7bd…»"]
    summary: >-
      План говорит только о редакции 11 NTF-1 (4d042803…). В ветке есть и редакция 12
      (b92f0c2b…, коммит записи fff10b522, CHANGES_REQUESTED). Закрепление от этого не меняется:
      одобрения у неё нет. План стоит дополнить при следующей правке, иначе он читается как
      исчерпывающий.

dispatcher_note: >-
  В приёмке NTF-1 редакции 10 (строка 638) сказано: нормализация — «та же семантика, что Р15
  приёмки NTF-4». Р15 NTF-4 теперь семантику не определяет и отсылает к NTF-1. Ссылка стала
  круговой; определение при этом у NTF-1 есть в той же строке («локальная часть без изменений,
  домен — NormalizeDomain»). Это предмет для автора NTF-1, а не блокирующее NTF-4.

