ra_resolution:
  RA-01:
    status: "закрыт"
    evidence: >-
      Шапка и §1 стоят на d524e7bd… (редакция 10 NTF-1). Это действующее одобрение: записи
      на редакции 11 (4d042803…) и 12 (b92f0c2b…) — CHANGES_REQUESTED. Команды сверки
      воспроизведены: `git merge-base --is-ancestor c115d2008 419ce7343` → 0; `git show
      2fa62337b|eb29a7d93:<NTF-1> | sha256sum` → 530e2296… / d524e7bd…; numstat 166/44; `### Р`
      18/18; `**ID:** NTF1-` 148 → 149; для редакции 11 — `89250d24e` → 4d042803…, numstat 76/18.
      Строка словаря §1 перечня причин `INVALID` не выписывает. Имена `attrs_invalid` и
      `recipient_invalid`, `NormalizeDomain`, типы `form.*`, B28 и G24 (з) есть в редакции 10
      NTF-1 (строки 637–663, 772, 794, 1754–1758). Строка «форма значений» внесена в §1 и во
      второй список §1.1. Остаток класса — N15-1.
  RA-02:
    status: "закрыт"
    evidence: >-
      Р11: контрольное значение — функция отпечатка Р15 целиком над закреплённым набором
      адресов; ловит и смену ключа, и смену профиля; перезаписи нет. Р15: вход — `address.Normalized`,
      нулевое значение отвергается. §9: перенос записей вне объёма. NTF4-106 с близнецом NTF4-77
      отличается одним фактом (профиль вместо ключа); проверено, что строка контрольного
      значения не перезаписывается и что X1 после отказа X2 снова готов.
  RA-03:
    status: "закрыт по правилу; у сценария-держателя — B15-1"
    evidence: >-
      Р10 называет правило `feedback_route` целиком: подъём, «новый выпуск не снимает», снятие
      только прочтением ожидаемого. Р12 называет правило снятия у каждого из семи признаков. Оба
      перехода признака установки — условное обновление, WARN только на 0→1. Держатель
      NTF4-107 в текущей форме недетерминирован — B15-1.
  RA-04:
    status: "закрыт"
    evidence: >-
      Х5 несёт поле `listener_form` (`pair` | `internal_only`, нулевое значение — `pair`).
      Второй список §1.1 и строка §8 «40, 42–49…» говорят, что Х5 правит observability только
      полем формы. Р20 задаёт правило гейта и отвергнутый вариант с ценой. Цена перемерена:
      `git grep 'PublicMTLS:'` без тестов → kacho 7, kaname 1. Трёхсостояние `internal_mtls`
      сверено со скриптом гейта (`assert-production-posture.sh` @1d42a6728bf: "true"/"n/a"/"false",
      сравнение равенством). NTF4-108 и NTF4-109 — пара, отличие в одном ключе.
      kaname стоит в перечне гейта (SERVICES, строка 145), но строит его kacho
      (`services/iam/cmd/kaname`) на пине corelib kacho. Поэтому `listener_form = pair` у kaname
      в NTF4-108 производится подъёмом пина без правки kaname.
  RA-05:
    status: "закрыт по существу; неполнота таблицы — N15-2"
    evidence: >-
      Пять ручек слушателя добавлены в Р16: 22 + 10 = 32 ручки, 32 строки таблицы, у каждой
      граница и поставляемое значение; §8 «Р16» говорит «32 со стадии S3»; DoD S3 п.7.
      `grpcsrv.PlatformInternalAdmission` существует (`grpcsrv/admission_posture.go:88`
      @34bc810). Таблица осей заявляет полноту «каждой оси Spec», но пяти полей Spec в ней нет
      (N15-2).
  N14-1: "закрыт: (а) строка «нормализация адреса» по редакции 10 и Р10; (б) Р11 и NTF4-106"
