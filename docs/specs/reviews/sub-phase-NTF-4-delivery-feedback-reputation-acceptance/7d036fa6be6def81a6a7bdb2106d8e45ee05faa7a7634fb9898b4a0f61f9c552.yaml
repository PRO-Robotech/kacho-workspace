non_blocking_findings:
  - id: N6-1
    kind: FORMAT
    where: "NTF4-94 «Then» (б)"
    note: >-
      Исход (б) задан только сравнением: «побайтно равен ответу notify на тот же Cancel». HTTP-ответ
      края и gRPC-ответ notify побайтно сравнить нельзя. Сам исход определён кодом: `Cancel`
      завершённой SUCCESS-операции даёт FAILED_PRECONDITION с текстом "operation E already
      completed" (corelib operationspb/handler.go @34bc810). На краю это HTTP 400. Учесть в
      пробе: утверждать пару (HTTP 400, code 9) и текст, а сравнение с прямым вызовом — по коду
      и тексту.
  - id: N6-2
    kind: FORMAT
    where: "NTF4-92 «And общий страж … не вызывается»; §8 строка 91–92 «вызовов стража круга 0»"
    note: >-
      Счётчика вызовов у `TrustedForwarders.Require` нет, и на integration-уровне старта его не
      наблюдать. Наблюдаемая форма — отказ несёт текст загрузчика и не содержит текста стража
      («must pin at least one trusted-forwarder SAN»). Пробе утверждать это.
  - id: N6-3
    kind: CONVENTION
    where: "Р16 строка KACHO_NOTIFY_AUTHZ_TRUSTED_FORWARDER_SANS; Р20 «один ответчик — загрузчик»"
    note: >-
      Проверка границы 1…8 не должна читать сырое поле `*TrustedForwarderSANs` вне аксессора
      `TrustedForwarders`, иначе гейт TestRawTrustedForwarderCircleIsReadInExactlyOnePlacePerService
      покраснеет (DoD S3 п.7). Проверять либо строку окружения до записи в поле, либо внутри
      аксессора. Второй предикат о пустоте круга безопасен только потому, что проверка формы SAN
      не пропускает пустых записей. Реализации это нужно сохранить.
  - id: N6-4
    kind: COVERAGE
    where: "Р20, набор соединений края"
    note: >-
      `/readyz` края обходит все соединения набора (health.go:61-88), значит, опросит и
      `notifyInternal`. Нужно одно из двух: notify отвечает `grpc.health.v1.Health/Check` на
      внутреннем слушателе под своим звеном прав, либо край исключает это соединение из обхода.
      notify не входит в критический набор готовности края. Иначе на каждой пробе готовности
      будет WARN «backend not serving».
  - id: N6-5
    kind: CONVENTION
    where: "DoD S3 п.9; .claude/rules/polyrepo.md:61 poly-edge-notify-acyclic"
    note: >-
      Задачи на правку строки канона пока нет, и старт S3 привязан к её заведению. Задачу
      заводит диспетчер. Заодно передаётся N5-4: NTF-5 сеет подавление через несуществующий
      метод InternalSuppressionService (NTF-5 :690).

