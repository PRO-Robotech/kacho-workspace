round5_resolution:
  B5-1: >-
    Закрыт. Выбран вариант (б): операции `nop` снаружи недоступны. Решение принимает
    происхождение запроса, а не отдельный набор соединений. В `resolveBackend` появляется
    закрытый перечень бэкендов, доступных только с внутреннего слушателя, с одной записью
    `notifyInternal`. Проверка `listenerorigin.IsExternal(ctx)` стоит до поиска соединения, отказ
    — `operations.NotFoundStatus`. Довод «экземпляр общий» перемерен: `/operations/{id}` не
    опознаётся как внутренний путь и уходит в `publicMux` на обоих слушателях
    (mux.go:1005-1037). REST-регистрация OpsProxy идёт в процессе, через
    `RegisterOperationServiceHandlerServer` (mux.go:986-997). Поэтому метка внутреннего слушателя
    доходит до `resolveBackend` через контекст запроса. На внешнем gRPC-сервере метки нет
    никогда: её ставит только `ConnContext` http-сервера (listenerorigin.go:36-44, :70-76). Отказ
    побайтно совпадает с ответом владельца на невыпущенный id: владелец отвечает тем же
    производителем (corelib operationspb/handler.go `notFound` → `operations.NotFoundStatus`).
    Вызовов `Check` за шаг NTF4-93 ноль: оба метода `OperationService` в таблице прав края —
    `<exempt>`. Имя в крае одно: `prefixToBackend[nop] = "notifyInternal"` и ключ соединения
    совпадают. Ключа `notify` нет, причина названа (proxy/server.go:89-106, `backends[domain]`).
    Счёт «+3» в NTF4-94 сходится с кодом края: `Cancel` читает до изменения (proxy.go:216-243).
    Сценарии NTF4-93/94 — взаимные близнецы с одним отличием (слушатель). Строка §8 93–94,
    DoD S3 п.3 и п.6а, §11, З4 — на месте.
  non_blocking_round5: >-
    N5-1: условие старта S3 записано — S3 не стартует без заведённой задачи; номер заводит
    диспетчер (перенесено в N6-5). N5-2: один ответчик на пустой круг — загрузчик, исключения в
    держателе Р16 нет. N5-3: `TrustAnyKnob` = пустая строка, текст стража в сценариях не
    утверждается. N5-4: дефект NTF-5, в NTF-4 не переносится (всё ещё в
    docs/specs/sub-phase-NTF-5-operator-notices-acceptance.md:690).

