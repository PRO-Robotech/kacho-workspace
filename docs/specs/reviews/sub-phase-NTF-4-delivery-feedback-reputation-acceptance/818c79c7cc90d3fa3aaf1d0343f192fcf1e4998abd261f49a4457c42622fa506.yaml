blocking_findings:
  - id: B2-1
    kind: SCOPE
    where: "§1.1 («Правок вне kacho две»; «В corelib не правится servicecontract»); Р10 стр. 274-276; NTF4-40 And; §8 строка 40…79; DoD S5 п.2"
    claim: >-
      NTF4-40 утверждает: «в самоотчёте посадки есть ось `mail_dns` со значением `verified`».
      Самоотчёт посадки — это одна строка `boot security posture`. Её форму задаёт corelib, а не
      сервис: `observability.BootPosture` с закрытым набором из 10 полей и `LogBootPosture`,
      который сам себя называет «единственным местом, где живут msg и имена полей контракта».
      Оценщик `assert-production-posture.sh` читает именно эти ключи. Значит, ось `mail_dns`
      требует третьей правки вне kacho — в corelib `observability/bootposture.go`. В §1.1 её нет,
      хотя перепись там объявлена полной. Отказ от правки `servicecontract` обоснован верно, но
      он не отвечает на вопрос, чем самоотчёт получит новое поле.
    evidence:
      - "git -C project/corelib show 34bc810:observability/bootposture.go — поля service, auth_mode, db_sslmode, public_mtls, internal_mtls, authz_check, trusted_forwarders, identity_provider, own_rest_public_tls, own_rest_internal_tls; mail_dns нет"
      - "git -C project/kacho show 1d42a6728bf:deploy/scripts/assert-production-posture.sh:383 — оценщик перечисляет ровно эти ключи"
    required: >-
      Выбрать одно из двух и записать решение в §1.1 и §8.
      (а) Добавить Х3: поле `mail_dns` в `observability.BootPosture` и `LogBootPosture` corelib.
      У остальных сервисов в нём значение «n/a», как у `identity_provider`. Назвать задачу
      corelib и пин, указать держателя оценки в `assert-production-posture.sh` и перечень служб,
      у которых ось обязательна.
      (б) Снять ось из самоотчёта и доказывать её иначе: метрикой `notify_mail_dns_posture` плюс
      отказом в старте, который держат NTF4-42…47/75/76/79. Тогда исправить NTF4-40, Р10,
      DoD S5 п.2 и строку В6 в §5.
  - id: B2-2
    kind: DoD
    where: "§1.1 стр. 94-96; DoD S1 п.5; DoD S5 п.2"
    claim: >-
      Держателем собственного DNS-стража notify DoD называет
      `TestServiceDeclaringPostureKnobsHasABootGuard` («страж обязан быть виден держателю»). Но
      этот держатель по своему описанию локальный страж не судит: «Локальная `Config.Validate()`
      остаётся законной как ДОПОЛНЕНИЕ и этим гейтом не судится». Судит он только достижение
      `servicecontract.New` и закрытый перечень `postureSpecFields`. Держатель, который не может
      покраснеть на снятом DNS-страже, делает пункт DoD неизмеримым. DoD S1 п.5 точно так же
      приписывает ему отказ в старте на каждой незаданной ручке NTF-4. Этого он тоже не судит:
      ручки NTF-4 не входят в `postureSpecFields`.
    evidence:
      - "git -C project/kacho show 1d42a6728bf:internal/repohygiene/bootguardpresence_test.go:43-48, 83-86"
    required: >-
      Назвать держателя, который способен упасть. Для DNS-стража это пробы NTF4-42…47, 75, 76, 79
      плюс инъекция «страж сведён к return nil → проба краснеет». Для обязательности ручек Р16 —
      проба notify, перебирающая объявленный перечень ручек с инъекцией по каждой; назвать её
      координату. Упоминание `TestServiceDeclaringPostureKnobsHasABootGuard` оставить только для
      того, что он действительно судит: notify доводит свои посадочные ручки до
      `servicecontract.New`.

non_blocking_findings:
  - id: N2-1
    kind: CONSTRUCTIBILITY
    where: "П1; NTF4-74 (стенд)"
    note: >-
      По П1 исходящий приёмник стенда пересылает письма домена возврата «по MX зоны стенда». Но
      приёмник стенда — mailpit (templates/mail-receiver.yaml), а он пересылает на один
      настроенный узел по совпадению получателя, а не маршрутизирует по MX. Назвать механизм
      (пересылка по совпадению на узел приёмника ящика) и не утверждать, что стенд проверяет
      маршрут по MX: MX проверяет только страж Р10.
  - id: N2-2
    kind: CONSTRUCTIBILITY
    where: "П1; NTF4-40/41/52 (стенд)"
    note: >-
      Не сказано, как notify на стенде разрешает имена в зоне DNS стенда: в deploy нет ни
      dnsConfig, ни stub-зоны (git grep → 0). Дефолт, зафиксированный на ревью: ручки адреса
      резолвера у notify нет; стенд задаёт dnsConfig пода только в профиле стенда; держатель
      NTF4-52 утверждает, что в values.prod.yaml переопределения DNS пода нет. Резолвер, который
      задаёт оператор, может подменить ответы проверкам Р10, поэтому такая ручка была бы ручкой
      обхода.
  - id: N2-3
    kind: FORMAT
    where: "Р12, таблица закрытых перечней; NTF4-11, 34, 35, 66"
    note: >-
      Сценарии пользуются метриками и метками, которых нет в закрытом перечне Р12:
      notify_ceiling_deferred_total{ceiling, class}, notify_complaints_total{ns, template},
      метки ns и template у notify_reputation_breach, а также
      notify_feedback_poll_last_success_timestamp, notify_feedback_canary_last_success_timestamp,
      notify_secret_generation_applied_timestamp. Внести их в перечень.
  - id: N2-4
    kind: FORMAT
    where: "NTF4-58 When"
    note: >-
      «После роста признака перечитывания»: в этом сценарии перезагрузка отвергнута, поэтому
      applied_timestamp не растёт. Условие перехода — secret_reload_rejected = 1.
  - id: N2-5
    kind: FORMAT
    where: "NTF4-29 (в)"
    note: >-
      «Текст называет поле address» — дать текст дословно, как в (а) и (г), например
      `"address: invalid"`, и указать reason.
  - id: N2-6
    kind: FORMAT
    where: "Р2; NTF4-11"
    note: >-
      Отчёт ARF от петли обратной связи обычно приходит на зарегистрированный адрес без токена,
      а токен лежит в Return-Path вложенного исходного письма. Написать, откуда берётся токен
      для ARF: из адреса доставки или из вложения. Сейчас «токен b плюс feedback-report»
      подразумевает адрес доставки.
  - id: N2-7
    kind: FORMAT
    where: "NTF4-16, последний And"
    note: >-
      В сквозном сценарии на П1 стоит утверждение интеграционного уровня («integration-проба
      на П6 читает счётчик»). Вынести его в отдельный интеграционный ID либо в близнеца NTF4-37,
      как в NTF4-09.

