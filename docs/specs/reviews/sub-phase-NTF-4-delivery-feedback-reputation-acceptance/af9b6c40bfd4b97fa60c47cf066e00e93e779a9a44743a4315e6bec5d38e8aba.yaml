blocking_findings:
  - id: B3-1
    kind: NEGATIVE
    where: "Р7 (Delete); NTF4-24, NTF4-25, NTF4-29; §8 строка 24–29; DoD S3 п.3"
    claim: >-
      `InternalSuppressionService/Delete` — единственная мутация нового ресурса `Suppression`.
      Отрицательных сценариев по входу и состоянию у неё нет: NTF4-25 проверяет только права, а
      NTF4-29 — только `Get` и `Lookup`. Поэтому не утверждено, что будет в пяти случаях: Delete с
      идентификатором не по форме; Delete существующего по форме, но отсутствующего `id`; Delete
      истёкшей записи, которая по Р5 невидима; повторный Delete уже снятой записи; два
      одновременных Delete одной записи. Не сказано и то, где приходит отказ: синхронно или
      ошибкой в `Operation`. Образец, на который ссылается сам документ (`RevokeAdmin`), отвечает
      на несуществующий объект NotFound. Без сценариев у этих «Тогда» нет ни держателя, ни
      однозначной формы.
    evidence:
      - "grep -n 'Delete' <док> → в сценариях только NTF4-24 (успех) и NTF4-25 (PERMISSION_DENIED)"
      - "kaname 734f69fb4 internal_cluster_service.proto:98-100 — «Revoking a non-existent or already-revoked admin returns NotFound»"
      - ".claude/rules/api-conventions.md строки api-malformed-id-sync, api-lane-direct-read, api-reason-token; .claude/rules/data-integrity.md строка concurrent-integration-test"
    required: >-
      Добавить сценарии с близнецом NTF4-24, у каждого одно отличие:
      (а) `suppressionId` = `not-an-id` → синхронно `INVALID_ARGUMENT`,
      `"invalid suppression id 'not-an-id'"`, `reason = INVALID_RESOURCE_ID`, `Operation` не создан;
      (б) `id` по форме, но в БД его нет → синхронно `NOT_FOUND`, `"Suppression <id> not found"`,
      `reason = RESOURCE_NOT_FOUND` (либо явно выбрать отказ внутри `Operation` и так и написать);
      (в) запись с `expiresAt` в прошлом (П9) → тот же исход, что в (б): её невидимость
      распространяется и на Delete;
      (г) повторный Delete после NTF4-24 → как (б);
      (д) два одновременных Delete одной записи (integration, testcontainers) → ровно один успех,
      второй получает исход (б), и запись аудита ровно одна.
      Всё это внести в §8 и DoD S3.
  - id: B3-2
    kind: DoD
    where: "§10 DoD S1 п.1, S5 п.1, S5 п.2; §8 строка 40…79"
    claim: >-
      (1) Сценарии NTF4-70 и NTF4-78 не требуются ни одним пунктом DoD: S1 п.1 перечисляет
      01…15, а S5 п.1 — 40…52. Оба отрицательные и оба несут нагрузку. NTF4-70 — инъекционный
      близнец, без которого проверка подписи в NTF4-41 может оказаться пустой. NTF4-78 —
      несовпадение получателя у отписки, то есть граница подлинности обратной связи (Р2, условие
      3). Стадию можно объявить готовой, когда они красные или не написаны.
      (2) DoD S5 п.2 перечисляет «NTF4-42…NTF4-49, NTF4-75, NTF4-76, NTF4-79» — это 11 ID — и
      требует, чтобы «все десять» покраснели на инъекции «return nil». В перечень попал NTF4-49,
      а это положительный близнец: при снятом страже он остаётся зелёным. §8 перечисляет верно:
      42–47, 75, 76, 79 и 48. Пункт DoD в нынешнем виде невыполним буквально и расходится с §8.
    evidence:
      - "python: раскрытие диапазонов NTF4-a…b в §10 → отсутствуют [70, 78]"
      - "стр. 1281 (§8): «красные все девять проб 42–47, 75, 76, 79 и проба 48»; стр. 1385-1386 (DoD S5 п.2): «NTF4-42…NTF4-49, NTF4-75, NTF4-76, NTF4-79 … красные все десять проб»"
    required: >-
      Внести NTF4-78 в DoD S1 п.1, а NTF4-70 — в DoD S5 п.1 (и указать уровень: сквозной на П1).
      В DoD S5 п.2 привести перечень к §8: 42–48, 75, 76, 79, всего десять; NTF4-49 — зелёный
      контроль при снятом страже не нужен. Держать перечни DoD и §8 одним предикатом: каждый ID
      1…N входит хотя бы в один пункт DoD.

non_blocking_findings:
  - id: N3-1
    kind: FORMAT
    where: "NTF4-33 When"
    note: >-
      Given — П6 (интеграционный уровень), а в перечне стоит NTF4-16, сквозной сценарий через
      глагол kaname на П1. Интеграционный аналог — NTF4-80. Заменить либо назвать уровень, на
      котором захватывается журнал NTF4-16.
  - id: N3-2
    kind: TWIN
    where: "NTF4-80"
    note: >-
      Близнец NTF4-38 отличается больше чем одним фактом: класс (`notice` против `security`),
      наличие подавления и исход. Как контроль того, что счётчик вообще двигается, он работает.
      Чистый близнец — та же строка `security` на A без записи подавления, которая истекает
      `EXPIRED(platform_unavailable)` при недоступном ретрансляторе: счётчик уменьшен на 1.
  - id: N3-3
    kind: FORMAT
    where: "NTF4-16 Given"
    note: >-
      «Потрачено не больше 3 запросов окна (П2, П4 и этот)»: П4 сам включает П2, поэтому число
      запросов неоднозначно. Назвать точное число запросов на A к шагу When.

