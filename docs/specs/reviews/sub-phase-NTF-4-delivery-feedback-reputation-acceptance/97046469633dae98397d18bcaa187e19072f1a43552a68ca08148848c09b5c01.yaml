blocking_findings:
  - id: B9-1
    kind: CONSTRUCTIBILITY
    anchors: [NTF4-16, NTF4-17, NTF4-24, П2, §1.2, §8 строка 16–17, DoD S2 п.1]
    summary: >-
      Ожидаемый исход окна печатается до шага и выводится из момента НАЧАЛА шага:
      «`resent_same`, если t16 < R(П2) + ttl» (и так же t17, «t24 раньше R_K + ttl»). Но жив ли код,
      kaname решает не в t16: (1) итоговый запрос шага уходит после решения вызова PoW — П1
      порог «без проверки» не поднимает, и NTF4-16 сам принимает итоговый ответ после PoW; (2) по
      NTF-2 (33e199c9…, строка 483, NTF2-67) чтение адреса и постановка идут вне пути ответа, то
      есть решение принимается и после ответа глагола, вплоть до наблюдённого приращения t16'.
      Гарантия П2 «код жив в момент раньше R(П2) + ttl» относится к моменту решения kaname, а
      применена к t16. Ветка `queued` верна (решение позже t16 ≥ T + ttl), ветка `resent_same` —
      нет.
    failure_scenario: >-
      Окончание П4 — R(П2) + ttl − 5 с; t16 = это значение (вне [R+ttl, T+ttl), ≥ T + first-pause),
      проба печатает ожидание `resent_same`. Край отвечает 429 PROOF_OF_WORK_REQUIRED, клиент
      решает вызов за 3 с, итоговый запрос уходит в R(П2) + ttl − 2 с; kaname отвечает 200 {} и
      ставит строку вне пути ответа через 4 с — в R(П2) + ttl + 2 с. Код П2 отчеканен в
      R(П2) + 0,1 с и истёк в R(П2) + ttl + 0,1 с, поэтому kaname чеканит новый: `queued` +1,
      `resent_same` +0. «Тогда» («вырос ровно на 1 по напечатанному ожидаемому исходу») красный
      на исправном продукте. То же — в NTF4-17 (и ложная сверка «код тот же, что в письме П2») и в
      третьем запросе NTF4-24.
    required: >-
      Исход определять от моментов, которые ограничивают решение kaname, а не от начала шага:
      решение лежит в [R16, t16'], где R16 — отправка итогового принятого запроса шага, t16' —
      момент, когда проба заметила приращение. `resent_same` определён, если t16' < R(П2) + ttl;
      `queued` определён, если R16 ≥ T(П2) + ttl; иначе исход моментами не определён. Одно из двух,
      по выбору автора: (а) ставить шаг только в определимую ветку `queued` — t16 не раньше
      max(T(П2) + ttl, T(П2) + first-pause, окончание П4); ветка всегда определена, так как
      R16 ≥ t16; либо (б) сохранить обе ветки, но печатать R16 и t16' и утверждать исход ПОСЛЕ
      шага: определённый — ровно он +1, другой +0; неопределённый — сумма `resent_same` +
      `queued` ровно +1, `cooldown`/`capped` +0, а сверка кода в письме NTF4-17 — по фактическому
      исходу. Тем же правилом — t17, t24 (с R_K, T_K), строка «пока код жив» §1.2, П2 («заведомо
      жив» — о моменте решения kaname), строка 16–17 §8 и DoD S2 п.1 («ожидаемый напечатан до
      шага»). Утверждения о подавлении (SUPPRESSED +1, SENT +0, письма нет) от выбора не зависят.

