blocking_findings:
  - id: B22-1
    kind: CONSTRUCTIBILITY
    anchors:
      - "§0а, таблица, строка NTF4-119: «(а)–(г) … заданы (н1)–(н4) и десять ручек стадии S3»"
      - "§0а, «Зависимости части Основы»: «Е10 … От исхода Е10 зависит, на каком дереве судится NTF4-119 (а)»"
      - "NTF4-119 (а): «экземпляр готов: диагностический слушатель отвечает /readyz»"
      - "Х5 (§1.1): «Отказы старта, судящие служимый набор, судят набор внутреннего сервера так же, как в паре»"
    what: >-
      В Основе Given NTF4-119 (а) нельзя построить на дереве без регистраций NTF-3. Документ
      оставляет это открытым («не измерено», Е10), а замер закрывает вопрос не в пользу документа.
      Носитель corelib отказывает в старте, если из служимого набора не выводится ни одного домена
      Kachō. Здоровье и рефлексия при этом изъяты поимённо. Отказ стоит в `servicehost.Serve`:
      `domainsOf` → «из служимого набора не вывелось ни одного домена. Ноль целей есть ОТКАЗ».
      По Х5 этот отказ действует и в форме «только внутренний слушатель». В части Основы
      регистраций NTF-4 нет, а регистрации NTF-3 (S2-B7) приходят волной Н3-Ф4 позже Н3-Ф3а. Значит,
      корень `notify-api` на дереве части Основы завершается отказом старта, и утверждение
      «экземпляр готов» на нём ложно. Вариант (в) из Е10 («пустой набор допустим») противоречит
      правилу Х5, которое документ сам утверждает. То же касается выкатки развёртывания `notify-api`
      между волнами: под не станет готовым. У NTF4-122 этой проблемы нет: проба сама добавляет
      испытательную регистрацию.
    evidence: >-
      corelib v1.10.0 (9e7e0369) и HEAD 1705d2b: `servicehost/serve.go:107-111` (`served :=
      mergeServed(...)`, `domains, err := domainsOf(served)`, `return err`), `:479-499` (отказ при
      `len(out) == 0`); изъятия — `servicehost/audit.go:78-86` (`grpc.health.v1.Health`,
      `grpc.reflection.v1.ServerReflection`). Команда: `git -C project/corelib grep -n 'ни одного домена'
      v1.10.0 -- servicehost/` → serve.go:497.
    requirement: >-
      В §0а назвать дерево, на котором судится NTF4-119 (а), и сделать его конструируемым. Вариантов
      два. (1) Given 119 (а) получает ту же испытательную регистрацию, что NTF4-122, и сценарий судится
      в Основе на дереве Н3-Ф3а. (2) Буква 119 (а) переходит в «после посадки S2-B7», и это записано в
      таблице §0а с полосой. Вариант (в) Е10 в документе не допускать. Выбор между (а) и (б) Е10 —
      маршрут, решает его диспетчер. Но контракт обязан назвать, на каком дереве Given строится, и
      дерево без служимого домена таким быть не может.
  - id: B22-2
    kind: TWIN
    anchors:
      - "§0а, таблица, строка NTF4-92: «целиком … Given: (н1)–(н4) и десять ручек стадии S3; круг задан пустым значением»"
      - "NTF4-92: «Близнец: NTF4-88 …»; «Given то же, что в NTF4-88 (все ручки Р16 в границах, KACHO_NOTIFY_SUPPRESSION_HARD_TTL = 72h)»"
      - "NTF4-88 — стадия S1 (строка 2394, раздел «Стадия S1» 2174–2487): Given П7 с зоной NTF4-40, П6, П10"
    what: >-
      NTF4-92 — отрицательный сценарий, и §0а включает его в Основу целиком. Положительный близнец у
      него назван один — NTF4-88. NTF4-88 относится к стадии S1, а S1 по §0а идёт после Основы. Его
      Given требует П7 с зоной NTF4-40 (S5), испытательного источника П6 и ящика П10. Ручку
      `KACHO_NOTIFY_SUPPRESSION_HARD_TTL` загрузчик `notify-api` не читает (Р22). Получается, что в
      Основе у отказа старта на пустом круге нет положительной пары. Зелёное «процесс завершился
      ненулевым кодом» нельзя отличить от «загрузчик `notify-api` отказывает всегда». Таблица §0а
      переписывает Given, но тело сценария осталось прежним, и в двух местах один предмет описан
      по-разному.
    requirement: >-
      Назвать для NTF4-92 близнеца, который есть в Основе и отличается ровно одним фактом: тот же
      корень `notify-api`, те же (н1)–(н4) и десять ручек, а круг задан непустым значением в границах.
      Старт при этом готов. Это возможно только после B22-1: годится NTF4-119 (а) на конструируемом
      дереве либо новая буква. Записать близнеца в самом сценарии или в строке §0а. В строке §0а
      сказать явно, что для Основы Given NTF4-92 заменяет «то же, что в NTF4-88».
non_blocking_findings:
  - id: N22-1
    kind: PRODUCER
    anchor: "§0а, «После Основы»: «NTF4-30. В Основе свойство … держат NTF4-112 и буквы (в), (г) NTF3-159»"
    what: >-
      Given NTF3-159 требует, чтобы `InternalSuppressionService` был зарегистрирован на слушателе
      `notify-api` и на внутреннем mux края (приёмка NTF-3, строка 3694). В Основе этого нет. Поэтому
      буквы (в) и (г) NTF3-159 в Основе свойство не держат, пока NTF-3 не изменит свой Given. Свойство
      по-прежнему держит NTF4-112 с инъекцией. Ссылку на NTF3-159 нужно снять или оговорить.
  - id: N22-2
    kind: CONSTRUCTIBILITY
    anchor: "NTF4-122 Given: «испытательный сервис пакета kacho.cloud.notify.v1 с методом Get на объекте cluster»"
    what: >-
      Документ не называет фикстуру, которая строит испытательный сервис. Носитель выводит карту
      прав из аннотаций дескрипторов, слинкованных в бинарь (`catalogderive.Derive`,
      `servicehost/serve.go:112`). Рукописный `grpc.ServiceDesc` без зарегистрированного дескриптора
      старт не пройдёт. Образец, который это решает, есть: динамический дескриптор через
      `protodesc.NewFile` + `protoregistry.GlobalFiles.RegisterFile` с аннотацией в
      corelib `servicehost/wiring_test.go:103-139`. Его стоит назвать в строке 122 §8, а путь файла
      дескриптора взять отличным от путей NTF-3 в том же пакете.
  - id: N22-3
    kind: FORMAT
    anchor: "шапка, строка редакции 24, и §32: «Одобрение редакции 23 к этой редакции не переходит»"
    what: >-
      У редакции 23 одобрения нет (в шапке у неё «вердикта нет», записи на 78603409 нет). Последнее
      одобрение — у редакции 22. Фразу заменить на «одобрение редакции 22 к этой редакции не переходит;
      у редакции 23 вердикта нет».
  - id: N22-4
    kind: OPEN-QUESTION
    anchor: "§0а, «Зависимости части Основы»: Х1 (Е8), Е9"
    what: >-
      Это зависимости маршрута, а не контракта. Сценарии и DoD части Основы не меняются при любом
      исходе. DoD п.6 требует записи `nop` → `notify`, а производитель постоянной (Х1) пока не
      назван, поэтому DoD части Основы не исполним до решения Е8. Для одобрения блокером это не
      является, если выбор Е8 будет записан до старта S3-C4н, как и указано в tasks.md §1.
