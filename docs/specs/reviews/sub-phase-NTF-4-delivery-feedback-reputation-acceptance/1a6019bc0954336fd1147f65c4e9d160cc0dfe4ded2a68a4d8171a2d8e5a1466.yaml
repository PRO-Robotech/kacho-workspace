ra_resolution:
  RA-01:
    status: "закрыт по существу"
    note: >-
      Решение совпадает с предложенным разбором: ожидаемый выпуск — принятый ответом 250 на DATA,
      срок — от момента принятия, непринятая попытка повторяется тактом опроса с новым номером,
      её письмо — stale; сценарий NTF4-103 с близнецом NTF4-74 и восстановлением в фазе (б).
      Класс пройден по Р2, Р10, Р12, NTF4-100, §8. Блокирующее B11-1 — о новом утверждении,
      которое автор добавил сверх RA-01, а не о самом RA-01.
  RA-02:
    status: "закрыт по существу"
    note: >-
      Фиксация каждого сообщения отдельной транзакцией с продлением, темп продления от срока
      аренды без новой ручки, DELE после фиксации, эпоха аренды; NTF4-104 с близнецом NTF4-95 на
      переводе часов П10 по RETR. Арифметика NTF4-104 перемерена: Δ = TTL/4 < TTL/3, между
      фиксациями срок не истекает; под инъекцией «продление только в начале сеанса» аренда
      кончается на 4-м–5-м RETR (зависит от строгости сравнения), к QUIT применено меньше 8 —
      красный при любом варианте. Замечание N11-1 — о снятой строке про продление на такте.

blocking_findings:
  - id: B11-1
    kind: COVERAGE
    anchors: [Р10 строки 554–559, NTF4-103, DoD S7 п.1, "NTF-1 a6cb0c1f… Р11 (строки 524–525 на 189f2ad8)"]
    summary: >-
      Р10 утверждает: «попытка контрольного письма не питает сигналов отправки строк ленты
      NTF-1 (размыкатель, misconfigured)». Держатель этого утверждения — одна строка NTF4-103
      («строка security получает SENT»). Она не способна упасть на одной ветке и отсутствует на
      другой.
    details:
      - >-
        Ветка «размыкатель» (4xx). По NTF-1 Р11 4xx открывает размыкатель одним отказом
        (NTF1-G07 «размыкатель открыт» после одной попытки). Если контрольное письмо питает
        размыкатель, строка security из (а) получает DEFER(platform_unavailable) и повторяется;
        срок строки длиннее такта, и строка уходит в окне между повторами контрольного письма.
        NTF4-103 утверждает только итоговое SENT без границы — реализация с дефектом зелёная.
      - >-
        Ветка «misconfigured» (5xx на DATA, NTF-1 Р11: «5xx на MAIL FROM/DATA → сигнал
        misconfigured»). Сценария нет вовсе: NTF4-103 даёт только 451. Ложный misconfigured —
        ложный признак неисправности настройки у оператора; утверждение Р10 о нём не держит
        ничто.
    required: >-
      (1) В NTF4-103 утвердить не только итог, но отсутствие отсрочки: по строке security из (а)
      исходов DEFER(platform_unavailable) 0 — строка отправлена с первой обработки; сигнал
      misconfigured нулевой за весь шаг (счётчики исходов «подтвердить» и признак misconfigured —
      NTF-1, строка 708 документа). (2) Покрыть ветку 5xx: вариант NTF4-103 (или отдельный
      сценарий с близнецом NTF4-103, отличие — код 554 вместо 451 на DATA контрольного письма):
      not_accepted +N, feedback_route 0, misconfigured нулевой, строка security SENT без DEFER.
      (3) Инъекция в DoD S7 п.1 для этой части: «исход попытки контрольного письма
      классифицируется словарём строк NTF-1» — красные DEFER по строке и misconfigured.
      Внести в §8 строку 73–74, 100, 103 и DoD S7.

non_blocking_findings:
  - id: N11-1
    kind: COVERAGE
    anchors: [Р21 строки 979–1005]
    summary: >-
      Правка удалила строку редакции 10 «Держатель продлевает аренду каждым тактом опроса» и
      не заменила её: продление названо только внутри сеанса (фиксация, темп «пока открыт
      сеанс»), попытка взять аренду каждым тактом — только у не-держателей. Заголовок «не только
      на его границе» продление на такте подразумевает, но буквально оно больше нигде не сказано.
      Буквальная реализация даст держателю в простое терять аренду каждые TTL и переходить между
      репликами с ростом эпохи; сценарии это не ловят (95–97 и 104 это пропускают). Рекомендация:
      вернуть одной строкой «держатель продлевает аренду тем же условным обновлением при каждом
      такте опроса, в том числе при открытии сеанса и при выпуске контрольного письма вне
      сеанса» и добавить в NTF4-95 «номер эпохи аренды за шаг не вырос».
  - id: N11-2
    kind: DoD
    anchors: [DoD S7 п.1, §8 строка 73–74, 100, 103]
    summary: >-
      Предсказание инъекции «номер становится ожидаемым при заведении» («feedback_route = 1
      после (а)») верно только для варианта без повтора по такту либо с сохранением срока
      первой попытки. Если под инъекцией сохранены повтор каждым тактом и отсчёт срока от
      последнего заведения, срок перезапускается каждый такт (POLL < DEADLINE), и feedback_route
      остаётся 0 — ожидаемого красного нет. Рекомендация: назвать инъекцию целиком (прежнее
      поведение редакции 10: выпуск раз в интервал, ожидаемый при заведении) и красный — по
      двум утверждениям (N ≥ 2 и feedback_route = 0), либо добавить в NTF4-103 утверждение о
      состоянии «ожидаемого выпуска нет» в kacho_notify после (а).
  - id: N11-3
    kind: COVERAGE
    anchors: [Р21, "CX4R-02 условие «число сообщений за сеанс ограничено»"]
    summary: >-
      Условие разбора CX4R-02 ограничивало число сообщений за сеанс; редакция 11 заменила его
      правилом «сеанс читает перечисленное при открытии». При продлении внутри сеанса прогресс
      это не ломает, но замена — решение автора, а §19 называет её перенесённой без оговорки.
      Стоит сказать одной строкой, что ограничение не нужно и почему.
  - id: N11-4
    kind: FORMAT
    anchors: [§8 строка 95–97, 104]
    summary: >-
      «фиксация четвёртого сообщения теряет аренду» — точно только при нестрогом сравнении
      «срок истёк при now ≥ expires»; при строгом — пятого. Красный от этого не зависит;
      формулировку лучше свести к «к QUIT применено меньше 8».

