resolution_of_round_19:
  B19-1:
    status: закрыт
    evidence: >-
      В Р22 появился закрытый перечень ручек NTF-1 у `notify-api`, группы (н1)–(н4), у каждой
      названа причина. Прочие ручки NTF-1 перечислены как необъявляемые, основание —
      `api-accepted-ignored`. Держатель группы — проба Р16 (одно объявление ручек NTF-1 на оба
      загрузчика, сверка в обе стороны, снятие и границы, три новые инъекции; всего их восемь).
      Добавлены сценарий NTF4-119 и случай (9) рендер-гейта NTF4-117. Оси `DBSSLMode` и `Authz`
      таблицы Р20 ссылаются на (н3) и (н4). Реплики и PDB: у `notify-api` задано требование с
      причиной (строка §1 и Р22), гейт `notify-availability-test.sh` судит каждое развёртывание
      закрытым перечнем, есть NTF4-118 с пятью инъекциями и пустым рендером и DoD S3 п.8в для
      `values.prod.yaml`.
  B19-2:
    status: закрыт
    evidence: >-
      (а) Предикат воспроизведён @1d42a6728bf: `grep -nE 'for s in \$[A-Z_]+; do \[ "\$s" = "\$svc" \]'`
      → 2 (:192, :202). Контроль — переменных из окружения 5 (:118, :124, :151, :187, :219),
      обходов таблицы 2 (:230, :397), `svc` в разделе C 0. Правило «служба с несколькими строками
      судится по развёртыванию, голое имя — находка» покрывает оба перечня. NTF4-109 получил
      варианты (и)/(к) и (л)/(м): отрицания с положительными близнецами, отличие в одном факте.
      (б) Условие допуска взято из кода. Воспроизведено @734f69fb4: `authorizeAnonymousPeer(ctx)`
      → caller_authority.go:95, `SANToServiceDomain` → :164, `ServiceNameFromSAN(` →
      caller_policy.go:366, `svcNamePrefix = "kacho-"` → fgaproxy.go:59. `AuthorizeService` в
      GatewayFrontedInternalRPCs 0, в ReadFloorRPCs 0; FullMethod в SANRestrictedInternalRPCs 1.
      Учётки названы (`kacho-notify`, `kacho-notify-api`), есть NTF4-120 и близнец NTF4-121.
      Координата факта одна: `sed '/^## 29/,$d' <док> | grep -c grpc_register` → 0.
  N19-1: "закрыт: Р12 и Р22 сужены — `notify_reputation_breach` одним рядом `kind`, метка `object` только у двух метрик перечитывания"
  N19-2: "закрыт: в Р11 у обеих метрик перечитывания есть `object`"
  N19-3: >-
    закрыт. N17-1: у ожидания смены признака есть предел K + `…_SECRET_RELOAD_INTERVAL` + M и
    исходы «красный» или «не выполнилось» по состоянию `..data` в поде. N17-2: в П1 названы стендовые
    P = 5 с, D = 30 с, I = 60 с, LEASE_TTL = 30 с, POLL_STALE_MAX = 2 мин,
    SECRET_RELOAD_INTERVAL = 5 с. Проверено по границам Р16 и С1–С3: I = 12P; P < D; D + P = 35 < 60;
    STALE_MAX 120 ≥ max(20, 65); LEASE_TTL 30 ≥ max(30, 10) и 30 < 115. Бюджет
    I + D + 2P + 2M = 160 с сходится с NTF4-74.

non_blocking_findings:
  - id: N20-1
    kind: CONVENTION
    anchors: ["Р22, «Учётка и допуск к kaname», пункт «пол внутреннего слушателя kaname»: «Ни один перечень, сужающий пол дальше, `AuthorizeService` не содержит»"]
    summary: >-
      Вывод верен, но состав «перечней, сужающих пол дальше» набран перечислением автора, а не
      выведен предикатом из цепочки (Д24). Во внутренней цепочке kaname после CallerPolicy стоят
      ещё три звена: `git show 734f69fb4:cmd/kaname/serve.go | sed -n '/^\tinternalUnary = append(internalUnary,/,/^\t)/p' | grep -c '\.Unary()'`
      → 4 (internalCallerPolicy, addressGate, internalSystemViewerFloor, internalACRFloor).
      ACRFloor судит тот же GatewayFrontedInternalRPCs, поэтому он покрыт косвенно. addressGate в
      документе не назван. Вызов без принципала он пропускает (`address_gate.go`, `judge`: «Принципала
      нет: судить нечего»), так что вывод не меняется. Держатель NTF4-120 собирает только пол и
      обработчик, а не всю цепочку корня. Если в ReadFloorRPCs попадёт `AuthorizeService`, проба
      останется зелёной, красными станут только стендовые NTF4-24…26. Нужно дописать предикат
      цепочки и исход каждого звена. Держатель можно оставить как есть: стенд этот случай
      покрывает.
  - id: N20-2
    kind: COVERAGE
    anchors: ["Р20, «Правило гейта после NTF-4»: «Находка по строке notify называет развёртывание»", "assert-production-posture.sh:235 @1d42a6728bf"]
    summary: >-
      Отказ «deployment/$dep НЕ РАЗВЁРНУТ» в :235 подсказывает оператору `POSTURE_SKIP="$svc"`.
      Для notify это `POSTURE_SKIP=notify`, а по новому правилу такое значение само даёт находку.
      Документ требует, чтобы находка называла развёртывание, но в NTF4-109 нет варианта с
      неразвёрнутым `notify-api`, который проверял бы текст подсказки. Стоит добавить этот вариант
      (подсказка — `POSTURE_SKIP="notify-api"`) с близнецом в виде развёрнутого `notify-api`.
  - id: N20-3
    kind: FORMAT
    anchors: ["Р20: «разделу C имя службы не нужно: `… | awk 'NR>=444' | grep -c 'svc'` → 0»"]
    summary: >-
      Раздел C на @1d42a6728bf начинается со строки 438 (заголовок `# C. СОХРАНЁННЫЕ НАСТРОЙКИ`), а не
      с 444. `awk 'NR>=438'` тоже даёт 0, исход не меняется. Координату стоит поправить, чтобы
      предикат покрывал весь раздел.
  - id: N20-4
    kind: FORMAT
    anchors: ["NTF4-117 (§7, стадия S6)", "DoD S3 п.8г"]
    summary: >-
      Случаи (7)–(9) NTF4-117 и сам гейт заводятся в S3 (DoD S3 п.8г), а сценарий записан в разделе
      стадии S6. Состав по стадиям назван явно, поэтому трассировка не рвётся. Для чтения проще
      вынести случаи (7)–(9) отдельным ID в S3 либо поставить в S3 ссылку.
  - id: N20-5
    kind: SCOPE
    anchors: ["§1 правило опоры, момент (1) — N19-4 записи круга 19"]
    summary: "Остаётся за замыслом, как и в круге 19. На приёмку не влияет."

