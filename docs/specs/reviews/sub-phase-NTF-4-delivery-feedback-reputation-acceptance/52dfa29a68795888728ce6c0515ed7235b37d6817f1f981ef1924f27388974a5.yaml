second_mechanism_check:
  result: none_in_acceptance
  note: >-
    У смены пары DKIM один механизм — NTF-1 Р19 (NTF1-P17/P18), один сигнал — признак `dkim`;
    в Р11 два исхода, метки `deferred` нет, NTF4-99 снят. Монтирование объекта ключа DKIM теперь
    держит один держатель — NTF4-117; NTF1-I01 считает его по службам (ровно notify), NTF4-117 — по
    развёртываниям notify. Это два разных разреза одного свойства, а не два механизма. Замечание
    круга 24 о `docs/changes/issue-2919/design.md` (исход `deferred` и проверка `dkim` в Р11) вне
    предмета этого ревью и остаётся строкой «нужен следующий».
security_check:
  note: >-
    Свойство «`notify-api` (на нём внутренний слушатель, куда приходит край) не монтирует ключ
    подписи» теперь имеет проверку, способную упасть: инъекция (10) поднимает счёт ссылок до 2 и
    называет развёртывание. Форма «том целиком» на объекте ключа DKIM держится инъекцией (11) —
    она же условие для NTF4-59 на стенде (при `subPath` новое поколение до пода не доходит).
non_blocking_findings:
  - id: N25-1
    kind: FORMAT
    anchor: "NTF4-117 Given (строки 3545–3547): «объект ключа DKIM и его монтирование в `notify-sender` в рендере есть»"
    what: >-
      Сам объект ключа DKIM чарт не рендерит: по NTF-1 Р19 его создаёт оператор (боевая посадка) или
      посев стенда, а чарт ссылается на него по имени из узла почты. Измерено на ветке NTF-1
      `2915-dkim-sign`: deployment.yaml монтирует `secretName: {{ $dkim.secretName }}` томом без
      `subPath`, объекта `kind: Secret` с ключом DKIM в шаблонах нет. Утверждения «Тогда» считают
      ссылки, а не объект, поэтому исход однозначен и Given строится. Точнее писать: «в рендере есть
      монтирование объекта ключа DKIM в `notify-sender` по имени из узла почты; сам объект вне
      рендера (NTF-1 Р19)». Тогда автор гейта не станет утверждать присутствие объекта в рендере.
  - id: N25-2
    kind: FORMAT
    anchor: "DoD S3 п.8г (строки 3959–3961): «стадия S6 дополняет его … (случаи (1)–(6), DoD S6 п.2)»"
    what: >-
      Перечень случаев, которые добавляет S6, не обновлён: по §0а и DoD S6 п.2 их восемь —
      (1)–(6), (10), (11). Неоднозначности для исполнителя S6 нет, потому что DoD S6 п.2 называет
      одиннадцать инъекций явно. Но один предмет описан в двух местах по-разному. Нужно дописать
      «(10), (11)».
  - id: N25-3
    kind: FORMAT
    anchor: "§8 строка 117, колонка «производитель»: «два развёртывания, два объекта и две учётки»; DoD S6 п.4 «называет два объекта секрета»"
    what: >-
      Заголовок сценария теперь говорит «три объекта секрета», а эти два места — «два». Различие
      законно: собственных объектов NTF-4 два, третий заводит NTF-1. Однако для читателя это не
      названо. Стоит добавить «(третий — объект ключа DKIM, NTF-1)».
