b13_resolution:
  B13-1:
    status: "закрыт"
    items:
      "(1) перезакрепление": >-
        Шапка, §1 и §1.2 стоят на действующих одобрениях: NTF-1 530e2296… (запись APPROVED, коммит
        a67820c41) и NTF-2 9098d6ef… (запись APPROVED, коммит 52fed403d). Команды сверки
        воспроизведены: `git show 258c92d5e:<NTF-1> | sha256sum` → b347b81f…, `git show
        2fa62337b:<NTF-1> | sha256sum` → 530e2296…, numstat 170/21; `### Р` 18 и 18, `**ID:**
        NTF1-` 142 → 148; для NTF-2 `a6a6474dd` → 33e199c9…, `9b8911760` → 9098d6ef…, numstat
        945/235. Предикат полноты `grep -n '<8 знаков>'` находит только шапку, сверку (включая путь
        записи открытого разбора в §1) и историю правок §12–§22.
      "(2) нормализация": >-
        Р15 берёт `address.Normalize` NTF-1 и своей нормализации не определяет; З11 замещает только
        функцию хеша; §8 строки 04…67, 24–29, 101–102 разделяют производителей; `notify/address`
        во втором списке §1.1 с абзацем переписи редакции 14. Сверено с NTF-1 530e2 строками 583,
        596–598 (сторож `feed.ErrRecipientInvalid`, `INVALID(recipient_invalid)`).
      "(3) словарь и неразбираемый адрес": >-
        Строка словаря §1 называет причины `INVALID` и клетку отказа `ResolveSend`; Р17: строка с
        неразбираемым адресом — `INVALID(recipient_invalid)` до подавления, записей подавления и
        счётчиков не трогает, держатель — NTF1-G24 (з).
      "(4) повтор Ack": >-
        Правило повтора NTF-1 (NTF1-B26, строка 1105 NTF-1 530e2) распространено на `SUPPRESSED`
        без исключений в §1, Х3 и Р17; причина входит в исход; держит проба Х3 (DoD S2 п.2).
      "(5) строки §1.2": >-
        Сверено с NTF-2 9098d6ef строками 462–468 (лестница только на recovery и register, ключи
        /32, /64, /24, /56, /48), 481–498 (ступени), 631–634 (ручки, граница floor-interval), 642
        (1,25 × суммы, включая пол и письмо о торможении). Следствия для П1, П2, NTF4-16, NTF4-17,
        NTF4-24 названы.
  N13-1: >-
    закрыт: план по RA-07…RA-09 в §1 — какие строки NTF-4 меняет каждый вариант; сверх плана
    сказано, что он сверку новой одобренной редакции не заменяет.

blocking_findings: []

non_blocking_findings:
  - id: N14-1
    kind: SCOPE
    anchors:
      - "§1, «Открытый возврат разбора классов NTF-1» (строки 184–196)"
      - "§1, строка таблицы «нормализация адреса»; §1.1 второй список, строка «нормализация адреса»"
    summary: >-
      Редакция 10 NTF-1 (d524e7bd…, коммит eb29a7d93, 08:06) закоммичена раньше редакции 14
      NTF-4 (48c2d70f8, 08:10), вердикта на неё нет. По правилу §1 документа закрепление идёт за
      действующим одобрением — это 530e2296…, так что выбор закрепления верен. Документ о
      существовании редакции 10 не говорит, но план открытого возврата её исходы покрывает.
      Рецензент сверил дельту 530e2 → d524e7bd заранее: RA-07 закрыт вариантом (а) — ратификация
      5xx на RCPT класса 5.7 сохранена, и NTF-1 прямо ссылается на NTF4-06 и NTF4-07; RA-08 закрыт
      первым вариантом — единственность сужена до `corelib/notify` и `services/notify`. По плану
      §1 ни то ни другое строк NTF-4 не меняет. Две вещи из редакции 10 при будущей сверке
      стоит внести в строку «нормализация адреса»: (а) у гейта NTF1-B27 появились узлы «вызов
      `golang.org/x/net/idna`» и «преобразование в `address.Normalized` или `address.Domain` вне
      `notify/address`», обход включает `services/notify`. Проверки DNS NTF-4 (Р10) по этой
      причине IDNA вызывать не могут; сегодня им это и не нужно: `KACHO_NOTIFY_RETURN_DOMAIN` —
      имя по RFC 1123 (строка 947), домен `From` — ручка NTF-1. (б) Смена именованного профиля
      IDNA перекладывает ключи сетки, а значит и отпечатки записей подавления Р15 — последствие
      для действующих записей подавления стоит назвать одной фразой.
  - id: N14-2
    kind: FORMAT
    anchors: ["§1, предикат полноты отпечатка соседа"]
    summary: >-
      Предикат говорит «строки только шапки, сверки и истории правок». Он находит ещё путь записи
      открытого разбора классов (строка 185) — эта строка лежит в разделе сверки §1, так что
      предикат выполнен. Если план открытого возврата уедет из §1, предикат станет ложным;
      надёжнее назвать и её.

dispatcher_note: >-
  Когда NTF-1 редакция 10 (d524e7bd…) получит вердикт, NTF-4 по своему правилу §1 сверяется с
  ней. По заранее сделанной сверке рецензента (N14-1) строки таблицы не меняются. В предмете
  сверки остаются только уточнения к строке «нормализация адреса». Это решение по порядку, не
  блокирующее.

