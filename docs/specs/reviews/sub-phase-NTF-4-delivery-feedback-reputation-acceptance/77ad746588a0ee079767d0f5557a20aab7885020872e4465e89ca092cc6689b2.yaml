resolution_of_round_16:
  B16-1:
    status: "закрыт"
    evidence: >-
      Стендовый бюджет NTF4-74 теперь I + D + 2P + 2M от начала шага s, M = 30 с — названный запас
      на работу такта. Вывод пересчитан: (1) ожидаемый выпуск есть в s — принят не позже s + M;
      (2) нет — последний принятый не позже s, следующий выпуск на первом такте не раньше
      «принятый + I», то есть не позже s + I + P, принят за M; (3) принятый в a выпуск либо
      прочитан тактом раньше a + D (фиксация не позже a + D + M), либо признак поднят первым тактом
      не раньше a + D, то есть не позже a + D + P, и работой такта за M. Максимум
      s + I + P + M + D + P + M = s + I + D + 2P + 2M. Пересылка стенда в бюджет не входит, потому
      что правило Р10 держит её сроком D: опоздание поднимает `feedback_route`, а «Тогда» требует 0.
      Маршрут стенда производит NTF-4 (чарт П1), поэтому это красный, а не «не выполнилось».
      Контрпример круга 16 (пересылка 6 с при P = 5, D = 30, I = 60) теперь зелёный: исход наступает
      до s + I + 3P + 6, а это меньше бюджета I + D + 2P + 60. Проба читает «Тогда» в момент первого
      исхода. Следующий выпуск не раньше чем через I (I ≥ 1 мин по Р16), поэтому приращение
      `applied` +1 однозначно.
    class_sweep: >-
      Правило «ось реального времени» применено и к остальным сценариям со сроком. NTF4-01: вывод
      P + 2M ≤ `…_POLL_STALE_MAX` верен. По Р16 (строка 1061) нижняя граница — max(4P, P + 60 с),
      а P + 2M = P + 60 с. NTF4-15: ожидание M после смены сертификата гарантирует, что вход,
      начатый до смены, завершён к началу шага (б). Длительность шага STALE_MAX + P + M следует
      из Р12 так: последняя фиксация не позже начала шага, подъём первым тактом после STALE_MAX,
      затем работа такта. NTF4-103/105: B = 30 с совпадает с общим правилом.
  N16-1:
    status: "закрыт"
    evidence: >-
      «Прочитано не позже такта X» стоит в сетке тактов, в С2 и в NTF4-74, 95, 100, 107. Поиск
      `(читается|прочитан[оа]?) (тактом|последним|следующим)` вне таблицы §25 даёт 0.
  N16-2:
    status: "закрыт"
    evidence: >-
      Given NTF4-100 называет С1–С3 «как в NTF4-74» и прямо говорит, что момент подъёма от них
      не зависит. When доводит такты до первого такта не раньше a + D включительно.
  N16-3:
    status: "закрыт"
    evidence: >-
      Пример нарушения С1 пересчитан: I = 60, D = 30, P = 7. Такты кратны 7, выпуск 1 — на 63,
      срок истекает в 93, подъём — на 98. «Тогда» требовал бы 1 на такте 91, первом не раньше 90.
      Пример верен, С2 и С3 в нём выполнены (7 < 30; 37 < 60).

non_blocking_findings:
  - id: N17-1
    kind: FORMAT
    anchors:
      - "Р11: «время доставки новой версии объекта в том задаёт кубелет, а не notify. Поэтому сценарии ждут смены признака … а не фиксированный срок»"
      - "NTF4-71, And (стенд): «после роста `notify_secret_generation_applied_timestamp`»"
      - "NTF4-58, When: «после того как на обеих репликах … `secret_reload_rejected` = 1»; NTF4-59, Then: «письма после роста признака перечитывания»"
    summary: >-
      Стендовые шаги ротации ждут сигнала, срок которого задаёт кубелет. Правило стенда в начале
      §7 такой случай не покрывает: задержку вне notify, которую не держит правило продукта, оно
      не называет. Ложного красного на исправном продукте здесь нет, потому что срока нет. Но у
      шага нет и исхода, если сигнал не пришёл: шаг висит до тайм-аута задания, и держатель сам
      решает, что это такое. Лечится одной строкой в П1: назвать предел доставки тома стенда
      (частоту синхронизации кубелета), который проба печатает до прогона, и
      бюджет = предел + `…_SECRET_RELOAD_INTERVAL` + M. Сигнал, не пришедший в бюджет, — красный,
      если том уже обновлён (проба читает `..data` пода), и «не выполнилось», если том не обновлён.
      Свойство перечитывания держит интеграционная проба NTF4-71/99, поэтому замечание не блокирующее.
  - id: N17-2
    kind: FORMAT
    anchors: ["NTF4-74, When (стенд): бюджет I + D + 2P + 2M; П1 не называет стендовых значений `…_CANARY_INTERVAL`, `…_CANARY_DEADLINE`, `…_POLL_INTERVAL`"]
    summary: >-
      Стендовые значения трёх ручек не названы. С поставляемыми значениями (I = 1 ч, D = 15 мин,
      P = 1 мин) бюджет NTF4-74 выходит около 78 мин на один шаг. Утверждение от этого не ложное,
      но стоит назвать стендовый профиль ручек в П1 (например, значения пробы P = 5 с, D = 30 с,
      I = 60 с — бюджет 190 с) и печатать их до прогона, как П1 уже делает для окна kaname.

