blocking_findings:
  - id: B8-1
    kind: CONSTRUCTIBILITY
    anchors: [NTF4-16, П1, П4]
    summary: >-
      Given NTF4-16 требует, чтобы до шага When П4 закончился (DSN рода hard подан, `Lookup(A)`
      вернул запись), и выбирает t16 в [T(П2) + first-pause, R(П2) + recovery-code-ttl), называя
      промежуток «не пустым по построению профиля стенда (П1)». П1 гарантирует только
      recovery-code-ttl > first-pause + 60 с — длительность П4 (подача DSN в приёмник ящика плюс
      опрос notify, ограниченный лишь KACHO_NOTIFY_FEEDBACK_POLL_STALE_MAX стенда, граница Р16 до
      24 ч) в неравенство не входит.
    failure_scenario: >-
      Профиль стенда: recovery-code-ttl = 5 мин (нижняя граница NTF-2 Р8), first-pause = 60 с,
      KACHO_NOTIFY_FEEDBACK_POLL_INTERVAL = 1 мин (поставляемое), поставка DSN и опрос заняли
      4 мин. Тогда `Lookup(A)` вернул запись позже R(П2) + ttl, допустимого t16 нет; шаг либо
      исполняется после истечения кода и kaname даёт `queued` вместо `resent_same` — красный на
      исправном продукте, либо поведение пробы не определено документом.
    required: >-
      Одно из двух, по выбору автора: (а) в П1 добавить к неравенству длительность П4 на стенде —
      например recovery-code-ttl > first-pause + 60 с + бюджет П4, где бюджет П4 назван
      (KACHO_NOTIFY_FEEDBACK_POLL_STALE_MAX стенда плюс подача), печатается пробой до прогона, и
      правило «П4 не завершился до R(П2) + ttl − ε — шаг не выполнилось»; либо (б) принять в
      NTF4-16 оба исхода окна так же, как в NTF4-24 — `resent_same`, если t16 < R(П2) + ttl, иначе
      `queued` (при t16 ≥ T(П2) + ttl), с печатью моментов и исключением щели; близнец NTF4-17 —
      тем же правилом. Утверждение о подавлении (SUPPRESSED +1, SENT +0, письма нет) от выбора не
      зависит.

non_blocking_findings:
  - id: N8-1
    kind: FORMAT
    summary: >-
      П2: R(П2) названо «отправкой запроса (2)», но при вызове PoW запросов два — первый (429) и
      повтор с X-Kacho-Proof. Нижняя оценка R ≤ постановка верна для обоих, а верхняя T ≤ R + 60 с
      строже бюджета NTF-2 («60 с от ответа глагола») и при R = первой попытке сократится на
      время решения вызова. Назвать R моментом отправки итогового (принятого) запроса и сказать,
      что бюджет отсчитан от него намеренно строже NTF-2.
  - id: N8-2
    kind: FORMAT
    summary: >-
      Стендовые сценарии, меняющие общее состояние стенда (NTF4-15 — сертификат ящика, NTF4-58 —
      ключ DKIM и перекат, NTF4-62/63 — пароли ящика, NTF4-56 — перекат), в правиле
      «Последовательность» П1 не названы; параллельно с 01–03, 41, 16/17 они меняют исход чужого
      шага. NTF-2 такие Given ставит только на своём П6. Добавить их в «Последовательность» (или
      назвать изоляцию).

