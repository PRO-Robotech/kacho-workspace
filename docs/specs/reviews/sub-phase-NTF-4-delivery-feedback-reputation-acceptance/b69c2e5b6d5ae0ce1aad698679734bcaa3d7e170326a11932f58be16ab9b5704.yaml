blocking_findings:
  - id: B26-1
    kind: PRODUCER
    anchor: >-
      Р16, абзац после таблицы («Умолчания у ручки в исходнике нет… 5 с объявляет установка») и
      пункт «`values.prod.yaml` и профили стенда… задают равной 5 с»; DoD S3 п.7 («Гейты круга и окна
      отзыва (§8, строка 91–92) зелёные»); §8 строка 91, 92 (перечень гейтов окна)
    what: >-
      Решение «величину окна объявляет установка, умолчания в исходнике нет» делает гейт переписи
      окон дерева kacho `TestRevocationWindowIsDeclaredPolicy` (internal/repohygiene/revocationwindow_test.go:65
      на origin/main) красным по построению: запись corelib «notify KACHO_NOTIFY_AUTHZ_CACHE_TTL» = 5s
      (ветка 77-notify, 18d105d) сверять не с чем, гейт читает величину только из исходника. Измерено
      на b04fe339a8: FAIL с текстом «гейт обязан читать её там, где её пишет посадка». Документ этот
      гейт не называет вовсе; §8 строка 91–92 и DoD S3 п.7 перечисляют только
      `TestEveryVerdictCacheProcessDeclaresItsOwnKnob`, и DoD S3 п.7 обещает «гейты окна отзыва
      зелёные», что при принятом решении недостижимо без правки гейта. Утверждение «values.prod.yaml и
      профили стенда задают 5 с» тоже без держателя: проба Р16 судит загрузчик, а не values, а NTF4-124
      подаёт 5 с окружением, не рендером чарта.
    fix: >-
      Назвать производителя и держателя: гейт переписи окон читает величину площадки notify-api из
      values чарта notify (по `knob:"notify.authz.cacheTTL"` либо пути values, названному в Р16) и
      сверяет её с записью `authz.RevocationPolicy.Windows`; красный на инъекциях — ключ снят из
      values.prod.yaml, значение 7s в values при записи 5s, значение 11s (выше Ceiling); близнец —
      5s в values и в записи, гейт молчит и печатает «площадок сопоставлено» с notify среди них.
      Внести `TestRevocationWindowIsDeclaredPolicy` в §8 (строка 91–92 или 123–124) и в DoD S3 п.7;
      назвать, чья полоса правит гейт (kacho `tools/revocationwindowgate`) и что запись переписи в
      corelib — правка вне NTF-4 со ссылкой на её задачу (Х-строка §1.1) и тег corelib, к которому
      поднимается пин.
  - id: B26-2
    kind: PRODUCER
    anchor: >-
      NTF4-123 «Тогда»: «число в тексте — значение `authz.RevocationPolicy.Ceiling`, а не число,
      записанное в notify»; абзац после NTF4-124 («эти два сценария добавляют… число верхней границы
      приходит из политики платформы»); Р16, держатель (перечень девяти инъекций)
    what: >-
      NTF4-123/124 не способны отличить «граница из политики» от «граница — литерал 10 с в notify»:
      при Ceiling = 10 с оба варианта дают отказ на 11s с текстом «10s» и старт на 5s. Именно этот
      класс дефекта и породил CX5-40 — собственная константа notify (`AuthzCacheTTLMax`, 30 с; в дереве
      services/notify/cmd/notify-api/internal/config/config_test.go:131 @b04fe339a8 «окно звена прав
      выше 30 с»). Утверждение «Тогда» без пробы, способной на нём упасть; среди инъекций держателя Р16
      инъекции «граница окна — литерал в notify» нет.
    fix: >-
      Добавить в держатель Р16 (или в NTF4-123) проверку, способную упасть: `authz.RevocationPolicy` —
      переменная (corelib v1.10.0, revocation_policy.go:151), проба присваивает `Ceiling` другое значение
      (например 7s), ждёт отказа на 8s с границей `7s` и старта на 7s, восстанавливает политику;
      инъекция — литерал 10 с вместо чтения политики → красный на 8s. Либо разбором исходника:
      верхняя граница ручки — выражение `authz.RevocationPolicy.Ceiling`, инъекция — литерал. Число
      инъекций держателя и DoD S1 п.5 / S3 п.7 пересчитать.
