b9_1_resolution:
  path_chosen: "(б) — оба исхода окна сохранены, исход утверждается после шага"
  rule_location: "§6 П2, «Правило исхода шага»"
  soundness_check: >-
    Перемерено рассуждением на границах. Решение kaname о запросе шага d лежит в [R, t′]: запрос
    уходит в R (после решения вызова PoW), счётчик исхода растёт не раньше решения, проба замечает
    его в t′. Чеканка кода K m лежит в [R_K, T_K]. (1) t′ < R_K + ttl ⇒ d ≤ t′ < R_K + ttl ≤ m + ttl —
    код жив, `resent_same` верен. (2) R ≥ T_K + ttl ⇒ d ≥ R ≥ T_K + ttl ≥ m + ttl — код истёк,
    `queued` верен. (3) иначе утверждается только сумма, `cooldown`/`capped` +0 — верно при любом
    d. Запаздывание опроса пробы увеличивает t′ и только сужает определённую ветку (1), ложного
    красного не рождает. Контрпример круга 9 (итоговый запрос в R+ttl−2 с, постановка в R+ttl+2 с)
    теперь даёт t′ > R+ttl и R16 < T+ttl — исход не определён, утверждается сумма; зелёный на
    исправном продукте.
  pauses: >-
    Верны: t16 ≥ T(П2) + first-pause, а решение П2 ≤ T(П2); t24 ≥ t16′ + second-pause, а решение
    NTF4-16 ≤ t16′. Отсчёт паузы от предыдущего решения до следующего не меньше названного.
  dependent_facts: >-
    Код в письме NTF4-17 и выбор K в NTF4-24 — по фактическому исходу (тот из двух, что вырос на 1);
    промежуток чеканки K — [R(П2), T(П2)] либо [R16, t16′]. Утверждения о подавлении (SUPPRESSED
    +1, SENT +0, письма нет) от исхода не зависят.
  class_sweep: >-
    grep по «ожидаем* исход|до шага|вне промежутк|напечатанному» вне истории правок (§12–§17)
    находит только новые формулировки «исход до шага не печатается» (строки 1350, 1381, 1549) и
    посторонние «до шага» о счётчиках NTF4-80/81/101; строки 2227 и 2318 — о корпусе классификатора,
    к классу не относятся. Утверждение §18 подтверждено.
  scenario_list_unchanged: >-
    87 ID против 87 на редакции 9; md5 отсортированного перечня ID одинаков (e1817d92…) —
    `git show <rev>:<док> | grep -o '^\*\*ID:\*\* NTF4-[0-9]*' | sort | md5sum` на 189f2ad8 и e0969429.

