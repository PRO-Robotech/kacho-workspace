non_blocking_findings:
  - id: N10-1
    kind: CONSTRUCTIBILITY
    anchors: [П2 «Правило исхода шага»]
    summary: >-
      Правило сравнивает моменты пробы (R, t′, R_K, T_K) со сроком кода, который kaname отсчитывает
      по своим часам. На стенде одного узла часы общие, и правило точно. Если стенд когда-либо
      разнесёт пробу и kaname по узлам, границы определённых веток сдвигаются на расхождение часов;
      пробе стоит печатать его и сужать определённые ветки на эту величину. Не блокирует: П1 —
      стенд зонтика на одном узле.
  - id: N10-2
    kind: DoD
    anchors: [docs/changes/issue-2919/]
    summary: >-
      После одобрения редакции 6 шёл первичный разбор классов (RA-01…RA-05) на её отпечаток.
      Разбор на редакцию 10 — решение диспетчера; прежний разбор к новому отпечатку не переходит.

