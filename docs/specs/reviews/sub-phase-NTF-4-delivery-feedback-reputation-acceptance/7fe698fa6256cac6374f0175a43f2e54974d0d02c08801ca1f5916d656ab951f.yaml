second_mechanism_check:
  result: removed
  note: >-
    У события «смена пары DKIM у работающей реплики» остался один механизм — перечитывание NTF-1 на
    такте перепроверки (Р19, NTF1-P17/P18) и один сигнал — признак `dkim`. В Р11 два исхода, и объект
    ключа DKIM не читается; метка `deferred` снята из Р12; NTF4-99 снят и повторно не выдаётся.
    За пределами приёмки второй механизм ещё описан в `docs/changes/issue-2919/design.md` (строки
    463, 469, 478, 1816, 1950: исход `deferred` и проверка `dkim` в перечитывателе Р11). Ревью
    приёмки этот файл не судит, но полоса, взявшая замысел как есть, построит второй механизм.
    Поэтому нужна правка замысла (см. «нужен следующий»).
blocking_findings:
  - id: B24-1
    kind: PRODUCER
    anchor: >-
      Р22, таблица, новая строка «объект ключа DKIM: ключ с селектором | монтирует | не монтирует»
      (строка 1962); §0а п.6 (строка 214: «Объекта ключа DKIM нет тоже: его утверждает держатель NTF-1»);
      NTF4-117 (строки 3540–3548)
    what: >-
      До редакции 26 ключ DKIM лежал в объекте секрета почты. Свойство «ключ подписи монтирует только
      `notify-sender`, и монтирует томом целиком» поэтому держал NTF4-117: «объектов, ссылающихся на
      объект секрета почты, — 1 (`notify-sender`)», без `subPath`, `secretKeyRef` и `envFrom`.
      Редакция 26 вынесла ключ в отдельный объект, но в NTF4-117 этот объект не добавила. Ссылка §0а
      на держатель NTF-1 не верна: в NTF-1 `notify-api` не упомянут ни разу
      (`grep -c 'notify-api' <NTF-1>` → 0). Её NTF1-I01 печатает по объекту ключа DKIM «среди
      объектов служб kacho — ровно notify», а развёртывания одной службы notify эта проверка не
      различает. В итоге у утверждения Р22 «`notify-api` не монтирует ключ подписи» нет проверки,
      которая может упасть. Это свойство безопасности: у `notify-api` есть внутренний слушатель, на
      который приходит край. Форма монтирования (том целиком) нужна и для NTF4-59 на стенде: при
      `subPath` смена пары до пода не доходит, а держателя рендера у этой формы теперь нет ни в
      одном документе.
    fix: >-
      Узкая правка NTF4-117. В «Тогда» добавить: «ссылающихся на объект ключа DKIM — 1 (`notify-sender`),
      том целиком — без `subPath`, `secretKeyRef` и `envFrom`». Добавить инъекцию «ссылка на объект
      ключа DKIM в `notify-api` → красный с именем развёртывания» и инъекцию `subPath` на этом
      объекте. Близнец — рендер без инъекции. В §0а п.6 заменить «утверждает держатель NTF-1» на
      NTF4-117 и поправить в §8 строку держателя NTF4-117.
non_blocking_findings:
  - id: N24-1
    kind: PRODUCER
    anchor: "§4, З13 (новая строка), колонка «с какого момента»"
    what: >-
      Вместе с посадкой S5 «Тогда» NTF1-P02 об envelope `MAIL FROM` станет красным. З13 не говорит,
      кто правит саму пробу NTF1-P02. У З9 для такого случая записано «правка пробы NTF-1 — той же
      стадией». Добавить ту же оговорку и в З13, и в DoD S5.
  - id: N24-2
    kind: FORMAT
    anchor: "§3.1, строка Д23, колонка «решение» (строка 834): «секрет почты (SMTP, POP3, DKIM, кольцо токена)»"
    what: >-
      В колонке «как действует» той же строки теперь написано «Ключа DKIM в объекте секрета почты
      нет». Колонка «решение» при этом осталась в прежней редакции. Неоднозначности для
      исполнителя нет, потому что колонка действия называет замещение явно. Но предмет описан
      в двух местах по-разному. Рядом с решением стоит пометить «DKIM — замещено Д96».
  - id: N24-3
    kind: TWIN
    anchor: "NTF4-58 «Тогда»: `notify_secret_reload_attempts_total{object=\"mail\", result=\"rejected\"}` не вырос"
    what: >-
      Объект секрета почты в этом сценарии не меняется, поэтому утверждение истинно тривиально. Оно
      не отличает «Р11 не читает объект ключа DKIM» от «перечитывание не работает». Точнее было бы
      утверждать, что у `notify_secret_reload_attempts_total` нет ряда по объекту ключа DKIM, а живость
      ряда `object="mail"` уже держат NTF4-71/72.
  - id: N24-4
    kind: COVERAGE
    anchor: "§34, абзац «Названный разрыв»"
    what: >-
      Исход «нет ответа DNS на перепроверке при смене пары DKIM» (прежний NTF4-99) теперь не покрыт
      ни одним сценарием. Документ называет разрыв честно и отдаёт его NTF-1, что правильно: место у
      предмета одно. Но это потеря покрытия на паре документов. Сценарий нужно завести в NTF-1 до
      посадки S6 NTF-1.
