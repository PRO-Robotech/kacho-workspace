blocking_findings:
  - id: B13-1
    kind: SCOPE
    anchors:
      - "шапка, строки 64–76 (закрепления NTF-1 b347b81f «одобрена» и NTF-2 33e199c9 «вердикта нет»)"
      - "§1, правило «закрепление идёт за действующим одобрением» и таблица"
      - "§1.2, «Состояние закрепления на дату редакции 13» и таблица"
      - "Р15 (строка 819), §4 З11 (строка 1156), §8 строка 101–102 (строка 2394), §1.1 второй список"
    summary: >-
      После коммита редакции 13 (58471e572, 07:14) обе соседние приёмки, на которых стоит Given,
      получили новые одобрения. NTF-1 одобрена на редакции 9 530e22968ff… (коммит 2fa62337b, запись
      a67820c41, verdict APPROVED). NTF-2 одобрена на редакции 11 9098d6ef95e… (запись 52fed403d,
      verdict APPROVED). Документ закреплён на NTF-1 b347b81f и NTF-2 33e199c9 и прямо утверждает,
      что b347b81f — действующее одобрение, а у NTF-2 одобрения нет. Правило §1 и §1.2 самого
      документа требует сверить новую одобренную редакцию по строкам и, если свойство названо
      иначе, выпустить новую редакцию. Сверка находит такие свойства у обеих соседних приёмок.
      Одно из них даёт противоречие по производителю, а не только устаревшую ссылку.
    details:
      - >-
        NTF-1 530e22968 Р8 и Р10 (RA-02 её первичного разбора): нормализация адреса — ОДНА функция
        corelib `notify/address.Normalize` (семантика — Р15 NTF-4). Её зовут `feed.Put` и notify;
        «второй нормализации адреса нет ни у источника, ни в notify»; единственность держит гейт
        NTF1-B27. Ключ сетки теперь «ключевой хеш адреса, нормализованного address.Normalize».
        NTF-1 сама ссылается на З11 NTF-4. У NTF-4 на f9bc15ad: `grep -c
        'address\.Normalize\|notify/address'` → 0. Р15 определяет нормализацию сам. В §8 строке
        101–102 производитель — «одна функция отпечатка — services/notify/, NTF-4 (З11)». В
        колонке «что замещается» у З11 записано, что в NTF-1 «нормализация адреса не названа», — на
        действующей редакции это уже неверно. Во втором списке §1.1 координаты corelib
        `notify/address` нет. По правилу §1.1 самого документа «координата, которой нет ни в
        одном из двух списков, — пробел переписи». Через неё проходят «Тогда» NTF4-23, NTF4-29 и
        NTF4-101/102. Если реализовать нормализацию так, как её называет §8, в notify появится
        вторая нормализация, и одобренный гейт NTF1-B27 станет красным.
      - >-
        NTF-1 530e22968 Р11: у `INVALID` появились причины `attrs_invalid` и `recipient_invalid`.
        Адрес, который `address.Normalize` не разбирает, получает в notify исход
        `INVALID(recipient_invalid)`. Добавлены клетка «отказ ResolveSend → DEFER(platform_unavailable)
        + misconfigured» и ратификация терминального `RECIPIENT_REJECTED` для 5.7.x со ссылкой на
        NTF4-07. Строка таблицы §1 «закрытый словарь исходов» перечисляет `INVALID` без причин.
        Р17 и NTF4-101/102 не говорят, что получает строка ленты с неразбираемым адресом при
        порядке «подавление до сетки»: отпечатка у неё нет (Р15).
      - >-
        NTF-1 530e22968 Р8 (NTF1-B26): «повтор Ack после записанного исхода» — тот же токен и исход
        дают успех без изменения, другой исход — OUTCOME_ALREADY_RECORDED; «правило одно для всех
        исходов Р11». Х3 добавляет в сервер ленты исход `SUPPRESSED(reason)`, но не говорит, что
        правило повтора распространяется и на него.
      - >-
        NTF-2 9098d6ef95e против строк §1.2 (закреплено 33e199c9): лестница края больше не стоит на
        `register/confirm` (строки 462–466, 687 NTF-2; строка таблицы §1.2 его перечисляет).
        Инвариант пары теперь — «1,25 × суммы суточных пределов kaname на один адрес, включая пол
        и письмо о торможении» (строка 642 NTF-2; строка §1.2 — «включая пол»). У окна появилась
        граница `1 ч ≤ floor-interval ≤ 24 ч` (строка 634; в строке ручек §1.2 её нет). Ключи
        лестницы края — отдельные окна по источнику и по длинам префикса подсети (строки
        629–631). Стадия S2 и сквозная часть NTF4-24 по §1.2 ждали одобрения NTF-2. Одобрение
        есть, но на редакции, отличной от закреплённой.
    required: >-
      (1) Перезакрепить Given на действующих одобрениях: NTF-1 530e22968… и NTF-2 9098d6ef95e…
      (шапка, §1, §1.2). Сверить таблицы по строкам с командой и итогом так же, как в
      редакции 13. (2) Нормализация: Р15 опирается на corelib `notify/address.Normalize` из NTF-1
      и не определяет вторую нормализацию; в §8 строке 101–102 производители разделены —
      нормализация от corelib (NTF-1), ключевой хеш и его ключ от notify (NTF-4); З11 переписан по
      530e2; `notify/address` внесён во второй список §1.1. (3) Строка словаря исходов в §1 и Р17:
      причины `INVALID` и исход строки с неразбираемым адресом при порядке «подавление до сетки».
      (4) Х3: правило повтора Ack NTF-1 распространяется на `SUPPRESSED` (или явно сказано, почему
      нет). (5) Строки §1.2 — по NTF-2 9098d6ef; следствия для П1/П2 и NTF4-24 названы.

non_blocking_findings:
  - id: N13-1
    kind: SCOPE
    anchors: ["NTF-1 первичный разбор классов на 530e22968 (коммит 0a7dda36f): RA-07, RA-08"]
    summary: >-
      У действующей редакции NTF-1 открыт возврат первичного разбора классов, и он задевает
      ровно те строки, на которых стоит B13-1. RA-07 (вариант б) переводит 5.7.x на RCPT для
      `security` в `DEFER` «с правкой NTF4-07 в той же волне». RA-08 сужает утверждение «второй
      нормализации нет» и выделяет ключ окон kaname. Если перезакрепить NTF-4 на 530e2 сейчас,
      следующая редакция NTF-1 почти наверняка снова даст этот же SCOPE. См. dispatcher_note.

dispatcher_note: >-
  Решение Д17 распространено и на NTF-1. Кроме того, у NTF-1 открыт возврат RA-07…RA-09, который
  задевает NTF4-07 и нормализацию адреса. Рекомендация рецензента: сначала довести NTF-1 до
  редакции 10 с одобрением, затем перезакрепить NTF-4 один раз на NTF-1 r10 и NTF-2 9098d6ef.
  Круг NTF-4 на неустоявшемся соседе предмета не имеет
  (multi-agent-flow-orchestration §«Круг не запускается там, где ПРЕДМЕТА ещё нет»). Если
  выбрать RA-07 (б), в той же волне правится NTF4-07.

dispatcher_decisions_check:
  method: >-
    Дельта редакции 13 (`git diff e96497a8e 58471e572 -- <док>`, 520 строк) сверена с каждым
    решением Д1–Д17. Унаследованный текст сверен по записям кругов 10–12.
  results:
    D1: "соблюдено: InternalSuppressionService — не вызов отправки (З4); входящих вызовов отправки нет"
    D2: "соблюдено: перечень звена идентичности у notify пуст; субъект Р7 — только пересланный принципал (Р20)"
    D3: "не задет дельтой"
    D4: "не задет дельтой; права NTF-4 стоят на объекте cluster (Х2)"
    D5: "не задет дельтой"
    D6: "соблюдено; правки corelib Х1, Х3, Х5 названы задачами. Координата NTF-1 `notify/address` в переписи отсутствует (B13-1)"
    D7: "не задет дельтой"
    D8: "не задет дельтой"
    D9: "не задет дельтой"
    D10: "вне предмета NTF-4"
    D11: "соблюдено: своих потолков нет (Р8), сетка — NTF-1"
    D12: "не задет дельтой"
    D13: "соблюдено по порядку (NTF-4 после NTF-1); закрепление — на недействующих редакциях соседей (B13-1)"
    D14: "не задевает: права NTF-4 на объекте cluster; ни notification_feed, ни мест надзора документ не называет"
    D15: "соблюдено: форма API настроек и контактов в NTF-4 не задаётся"
    D16: "соблюдено: DRAFT, документ в ветке issue-880"
    D17: >-
      соблюдено. Х5 — форма носителя corelib «только внутренний слушатель»: публичный сервер не
      собирается; адрес, транспорт и регистратор публичного слушателя — отказ старта с именем
      поля. Внутренний сервер собирается той же функцией, что внутренняя половина пары (один
      строитель, одна цепочка звеньев). OwnContour отвергнут как вторая сборка цепочки. Отдельная
      задача и выпуск corelib есть. S3 ждёт Х5 («Х2 и Х5 — до старта стадии S3»). Публичного
      слушателя у notify нет по построению (Р20, З4).
  dispute_lines: "строк спора с Д1–Д17 нет"

