resolution_of_ra_01:
  status: "закрыт"
  evidence: >-
    (1) Given NTF-1 закреплён на одобренной редакции 13. Проверено: `git show 5f3851113:<NTF-1> |
    sha256sum` → 05828e42…; запись 05828e42….yaml несёт `verdict: APPROVED`, её коммит 46e2a3819.
    `git merge-base --is-ancestor 46e2a3819 f7613a665` → 0 и `… 003cd67b6` → 0, как и сказано в
    абзаце «Почему правило такое». (2) Сверка редакций 10 → 13 воспроизведена.
    `git show eb29a7d93:<NTF-1> | sha256sum` → d524e7bd…; `git diff --numstat eb29a7d93 5f3851113`
    → 231/26. Заголовков `### Р…` 18 и 18, diff пуст. Множество `**ID:** NTF1-…` — 149 и 149,
    diff пуст. (3) Абзац про unsafe в B27/B28 заменён фактами записей. В строке «форма значений»
    держатель больше не называется, есть ссылка на Р7 закреплённой редакции (Р7 NTF-1 занимает
    строки 640–750 редакции 13). В строке «нормализация адреса» появился отказ ключа сетки на
    нулевом значении. Сверено с NTF1-B27 And (нуль) (строка 1388 редакции 13):
    `INVALID(recipient_invalid)`, SMTP-сессий 0. Координаты B27 (нуль), B28 (нуль) и B28 (гейт)
    в редакции 13 есть (строки 2229, 2304, 2309).
  class_sweep: >-
    Класс закрыт правилом «опора на соседний документ»: опора — неизменный факт, сверка — в двух
    названных моментах, исходов три, указано, куда пишется исход. Проверки по всем местам:
    - NTF-2: `git show 9b8911760:<NTF-2> | sha256sum` → 9098d6ef…;
      `git log 9b8911760..ac1e4ace6 -- <NTF-2>` → пусто; в каталоге записей NTF-2 одна запись
      APPROVED (9098d6ef, коммит 52fed403d).
    - NTF-5: запись 2fe29c35 — APPROVED, коммит dbcd30a81, редакция 12. Это самое позднее
      одобрение NTF-5: второе, 1f4852e4 (редакция 8, коммит 59bf85f00), — его предок.
    - NTF-3: запись 0478263a — APPROVED. Ни одна из 9 версий файла на ac1e4ace6 и ни одна версия
      по `--all` не даёт отпечатка 0478263a (0 совпадений).
    - DoD S3 п.9: на ac1e4ace6 обе строки `poly-edge-gateway-notify` и `poly-edge-notify-acyclic`
      в `.claude/rules/polyrepo.md` есть, последний коммит файла — a7236a082.
    - DoD S7 п.4: `git grep -c NTF ac1e4ace6 -- docs/specs/04-roadmap-and-phasing.md` → код 1,
      вывода нет.
    - Слова «действующ*/текущ*/последн* одобрение/открытый возврат» в теле до §12 найдены только
      в двух местах: в строках истории шапки (53, 58), которые по правилу не переписываются, и в
      самом тексте правила или его обосновании (150, 190). Прочие совпадения — «действующий ключ»,
      «действующая аренда» и «действующая запись подавления» — к соседям не относятся.
    - Отпечатки соседей стоят только в шапке, сверке и Р6, как объявлено: 05828e42 — строки
      88–89, 143, 197–200, 271–272; 9098d6ef — 97–98, 435–451; 2fe29c35 — 701–702.

non_blocking_findings:
  - id: N18-1
    kind: FORMAT
    anchors: ["§1, правило опоры: «Записи ревью только дописываются, и исход опубликованной записи не меняется»", "Р6: запись NTF-3 0478263a…, «коммит 0f38646d1»"]
    summary: >-
      У записи NTF-3 0478263a два коммита. 0f38646d1 её создал, 189f2ad86 правил: поменял строку
      `content_commit_note`, вердикт не тронут. Документ называет коммит создания, и это верно. Но
      для записи с несколькими коммитами правило опоры не говорит, какой коммит считать «коммитом
      записи» в проверке `merge-base --is-ancestor`. Стоит уточнить: «коммит, добавивший запись»
      (`git log --diff-filter=A`). Исход проверки от этого сегодня не меняется.
  - id: N18-2
    kind: SCOPE
    anchors: ["DoD S3 п.9", "разбор классов 77ad7465…, questions_to_owner Q-01"]
    summary: >-
      Q-01 разбора классов спрашивает, одна служба notify или две (notify-sender и notify-api по
      NTF-3 Р8). NTF-4 стоит на Д17 («notify один»), с ним согласна, а разрыв с правилом рёбер
      называет в DoD S3 п.9. Противоречие остаётся на стороне NTF-3 и правила polyrepo. Ни
      сценарий, ни DoD NTF-4 от него не зависят, пока действует Д17. Поэтому это не блокирующее
      этой приёмки. Но замысел S3 не стоит одобрять, пока NTF-3 не приведена к Д17.
  - id: N18-3
    kind: FORMAT
    anchors: ["N17-1, N17-2 записи круга 17"]
    summary: >-
      Не блокирующие N17-1 (у ожидания тома в ротации нет предела) и N17-2 (в П1 не названы
      стендовые значения I, D и P) редакцией 18 не тронуты. Они остаются заказом на следующую
      редакцию.

