blocking_findings:
  - id: B12-1
    kind: SCOPE
    anchors:
      - "шапка строки 63–66 (Given закреплён на NTF-1 a6cb0c1f…, «круг 5 по ней — возврат»)"
      - "§1 строки 113–123 (правило: одобрят другую редакцию — сверить таблицу по строкам; свойство названо иначе или снято — новая редакция)"
      - "§1 таблица, строка 139 (нет gRPC-слушателя; гейт паритета монтирования называет notify с нулём сервисов; NTF1-G19)"
      - "§4 З9 (строка 1063)"
      - "§20 последний абзац (строка 2710)"
    summary: >-
      Приёмка NTF-1 одобрена на редакции b347b81f… (запись
      docs/specs/reviews/sub-phase-NTF-1-notification-gateway-core-acceptance/b347b81f330b3a3a0e5694eaf05e303493d16148067c4309ebee9da2602736b3.yaml,
      verdict APPROVED, коммит abc1fd487 — родитель коммита редакции 12). §20 утверждает
      обратное: «одобренной редакции, отличной от закреплённой, ни у NTF-1, ни у NTF-2 нет».
      По правилу §1 самого документа одобренную редакцию сверяют с таблицей §1 по строкам, и
      сверка находит свойство, названное в одобренной NTF-1 иначе, — именно то, которое NTF-4
      замещает (З9).
    details:
      - >-
        NTF1-G19 в одобренной редакции b347b81f больше не опирается на
        TestGRPCMountParity_EveryDeclaredServiceIsMounted («называет notify с нулём объявленных
        сервисов» снято). Держатель G19 теперь — новая проба services/notify/servesurface_test.go:
        «вызовов, чья цель — grpc.NewServer, точка входа фундамента, поднимающая gRPC-сервер
        (grpcsrv.NewServer, servicehost.Serve), либо функция Register…Server сгенерированного
        стаба, — 0» в не-тестовых пакетах под services/notify/, с инъекцией и близнецом.
      - >-
        NTF-4 З9 поднимает у notify внутренний gRPC-слушатель с InternalSuppressionService и
        OperationService, то есть вводит ровно то, что эта проба называет находкой. З9 замещает
        формулировку G19 редакции a6cb0c1f («гейт паритета монтирования называет notify с нулём»)
        и не называет держателя одобренной редакции — servesurface_test. Реализация NTF-4 по
        этому документу покрасит одобренный держатель NTF-1, и ни одна строка приёмки не говорит,
        что с ним делать (снять, сузить перечень до двух названных Register…Server, перевести в
        «слушатель один — внутренний gRPC»).
      - >-
        Прочие изменения NTF-1 a6cb0c1f → b347b81f, сверенные по строкам таблицы §1: Р4 (вид на
        проводе notification_feed) — NTF-4 вид не называет; Р5 (перечень путей надзора, Д14) —
        права NTF-4 на объекте cluster, перечнем не затронуты; Р9/NTF1-N07 (исход Subscribe при
        выключенном флаге) — NTF-4 не использует; Р10, Р11 (таблица исходов, размыкатель,
        misconfigured), G07, G15, G16, G20, H01…H10, N04, L01, I04 — без изменения смысла; DoD
        NTF-1 п.12 добавил «пины corelib и kaname поднимаются в kacho одним изменением» —
        касается правок Х NTF-4 в corelib и kaname (§1.1) как порядка посадки.
    required: >-
      (1) Перезакрепить Given на одобренной редакции NTF-1 b347b81f… (шапка, §1): таблица §1 —
      координаты по b347b81f; строка 139 — свойство и держатель одобренной G19. (2) Дописать З9:
      замещается и держатель servesurface_test одобренной G19 — названо, какой исход у него после
      NTF-4 (например: перечень допустимых Register…Server у notify — ровно
      InternalSuppressionService и OperationService, точка входа фундамента — одна, прочее —
      находка; инъекция и близнец сохраняются), с производителем в §8 и пунктом DoD S3. (3)
      Исправить утверждение §20 и сверить по той же процедуре NTF-2 (у NTF-2 на момент круга
      одобренной редакции нет — подтверждено). (4) Учесть DoD NTF-1 п.12 в порядке посадки правок
      Х, если он их касается.

non_blocking_findings:
  - id: N12-1
    kind: DoD
    anchors: [NTF4-103 When (а), DoD S7 п.1, "NTF-1 b347b81f Р11 и G07"]
    summary: >-
      Предсказание инъекции для NTF4-103 — «DEFER(platform_unavailable) по строке security ≥ 1».
      NTF-1 не определяет, что открытый размыкатель делает со следующими строками: в Р11 он
      только назван, в G07 наблюдается как «размыкатель открыт». Если открытый размыкатель не
      забирает строк до своего закрытия по часам, строка при стоящих часах исхода не получит, и
      шаг «ждёт её исхода, не переводя часов» не имеет срока. Рекомендация: назвать бюджет
      ожидания исхода (не дождались — красный, а не «не выполнилось») и, если NTF-1 выставляет
      состояние размыкателя наблюдаемым, утверждать его напрямую.
  - id: N12-2
    kind: DoD
    anchors: [NTF4-95 Given, "§8 строка 95–97, 104", DoD S1 п.1, Р21]
    summary: >-
      Инъекция «держатель не продлевает аренду тактом вне сеанса» даёт рост эпохи в NTF4-95
      только если в шаге есть промежуток без продления длиннее …_LEASE_TTL. Given NTF4-95 не
      связывает I (…_CANARY_INTERVAL) с …_LEASE_TTL, а Р21 одновременно говорит «ящик пуст и
      сеанс не открывается» — не сказано, открывает ли проверка пустого ящика POP3-сеанс (а
      продление внутри сеанса стоит). Рекомендация: зафиксировать в Given I > …_LEASE_TTL +
      …_POLL_INTERVAL и уточнить в Р21, что проверка пустого ящика — это (или не это) сеанс.
      Класс тот же, что у N11-2: предсказание инъекции, не гарантированное Given.

