round4_resolution:
  B4-1: >-
    Закрыт по существу. Путь выбран и назван: внутренний REST-слушатель края, mTLS, notify (Р20).
    Круг пересылающих = {SAN края}, ручка в Р16 с границами. Пустой круг — отказ общего стража
    (NTF4-92, близнец NTF4-88). Пир вне круга (NTF4-91, близнец NTF4-24): личность снята, отказ
    PERMISSION_DENIED "permission denied" до Check. Правки края названы. Ребро край→notify внесено
    в §11 и в строку Д4. NTF1-G21/G16 замещены явно (З9). Держатели и DoD S3 п.3, 6–9 на месте.
    Цепочку перемерил в corelib 34bc810: у недоверенного пира личность снимается без отказа
    (grpcsrv/cert_identity.go withTrustedPrincipal: ветка !trusted → WithoutPrincipal; в
    identity_arrival.go refused() только для foreign_namespace и incomplete). Затем authz.Interceptor
    в ветке «нет принципала» отдаёт DecisionDenied, и это даёт status PermissionDenied
    "permission denied" (authz/interceptor.go:208-209, 331-337). Остаток — B5-1 (операции
    `nop` через край).
  B4-2: >-
    Закрыт. Причина входит в ключ, поэтому у разных причин разные записи и свои сроки. Порядок
    причин в исходе закрыт. Сценарии: NTF4-89 (COMPLAINT, затем SOFT; контроль B внутри) и
    NTF4-90 (SOFT, затем COMPLAINT); у обоих близнец NTF4-19. Они в §8 и в DoD S2 п.1.
  non_blocking_round4: >-
    N4-1: равенство «отключаемый ⇔ notice» теперь держится построением (Р6, ссылка на NTF5-78…80
    сверена). N4-2: остаток про псевдоним назван. N4-3: у NTF4-15 чистый близнец внутри сценария.
    Все три учтены.

