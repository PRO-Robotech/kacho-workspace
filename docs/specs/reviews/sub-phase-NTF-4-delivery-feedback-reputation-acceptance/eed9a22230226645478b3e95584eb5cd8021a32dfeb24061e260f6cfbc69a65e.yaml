blocking_findings:
  - id: B5-1
    kind: COVERAGE
    where: "Р20 («Что правится в крае»: префикс nop → notify в prefixToBackend, ключ notifyInternal); З4; NTF4-24 (опрос через край); NTF4-30; §11 строка «публичный RPC или край» («поверхность только внутренняя»)"
    claim: >-
      Р20 велит добавить префикс операций `nop` в карту `prefixToBackend` края, а соединение с
      внутренним слушателем notify — в набор соединений края. У края одна такая карта и один
      набор соединений (`backends`). OpsProxy строится из них и регистрируется на ВСЕХ
      поверхностях: на внешнем gRPC-сервере (`main.go:1165-1166`, `registerExternalGRPCServices`)
      и на обоих REST-mux (`mux.go:985-995`). Внутренние соединения в этом наборе уже лежат
      (`backends["iamInternal"]`). Значит, названный производитель неизбежно открывает путь
      внешний TLS-вход края → `OperationService.Get/Cancel` для id `nop-…` → внутренний слушатель
      notify. Документ этого не решает и не утверждает. §11 и З4 называют поверхность notify
      «только внутренней». NTF4-30 судит только `InternalSuppressionService`: держатель
      `assert-ban6-external-isolation.py` смотрит на Internal*-методы, а `OperationService`
      не Internal*. Так у внешнего входа в notify нет ни решения, ни сценария. Правило
      о поверхности безопасности обязано быть решением, а не побочным следствием общей карты.
      Прецедент есть: операции `geo` маршрутизируются так же. Но у geo есть публичный слушатель,
      а у notify публичного слушателя нет по построению (Р1, Д1). Кроме того, Р20 называет ключ
      соединения `notifyInternal`, а значение карты — `notify`. Если прочесть буквально,
      `resolveBackend` не найдёт соединения, ответит NOT_FOUND, и опрос NTF4-24 на стенде
      покраснеет.
    evidence:
      - "kacho 1d42a6728bf gateway/cmd/api-gateway/main.go:1165-1166 — opsproxy.New(backends) на внешнем gRPC-сервере"
      - "kacho 1d42a6728bf gateway/internal/restmux/mux.go:985-995 — opsproxy.New(conns) на каждом mux"
      - "kacho 1d42a6728bf gateway/internal/opsproxy/proxy.go:86-101, 153 — одна карта prefixToBackend; значение — ключ в backends"
      - "grep -n 'внешн' <док> — внешний вход упомянут только в NTF4-30 для InternalSuppressionService"
    required: >-
      Решить и назвать, доступны ли операции `nop` с внешнего входа края.
      (а) Доступны (как у geo): сказать это в Р20, З4 и §11; назвать, что права дают
      `operations.CheckRecordedOwnership` края и владельца. Добавить сценарий: внешний вход,
      `GET /operations/<nop-id>` от НЕ создателя → ответ побайтово равен ответу на
      несуществующий id; близнец — тот же вызов от создателя → `done = true`.
      (б) Недоступны: назвать правку края, которая разводит набор соединений внешней и
      внутренней поверхности OpsProxy. Добавить сценарий: внешний вход, `nop`-id создателя →
      NOT_FOUND, побайтово как у несуществующего; близнец — тот же вызов на внутреннем слушателе
      → OK. Держатель — проба края.
      В обоих вариантах: значение `prefixToBackend["nop"]` = имя ключа соединения, одно имя в
      Р20 и в §8; строка в §8 и пункт DoD S3.

non_blocking_findings:
  - id: N5-1
    kind: CONVENTION
    where: "DoD S3 п.9; §11; .claude/rules/polyrepo.md:61 poly-edge-notify-acyclic"
    note: >-
      Действующая строка канона называет красным «край … держит клиента notify» и предполагает,
      что оператор зовёт InternalSuppressionService сам. Выбор Р20 делает её красной. Документ
      это признаёт: DoD S3 п.9 требует правки «задачей воркспейса». Но задача не названа
      номером, а правка канона — не предмет приёмки. Нужна заведённая задача (или строка спора
      диспетчеру) до старта S3. Иначе реализация S3 садится на красную строку правила.
  - id: N5-2
    kind: FORMAT
    where: "Р16 строка KACHO_NOTIFY_AUTHZ_TRUSTED_FORWARDER_SANS («1 … 8 записей … Пустое значение — отказ общего стража круга»); держатель Р16 («за каждой границей — отказ с именем ручки и границы»); NTF4-92"
    note: >-
      Одно входное значение (пустой круг = 0 записей, за нижней границей) обещано двум
      производителям отказа. Загрузчик называет ручку и границу, общий страж печатает свой
      текст. NTF4-92 утверждает текст стража. Назвать порядок: загрузчик нижнюю границу этой ручки
      не судит и отдаёт её стражу. Держатель Р16 делает для неё исключение по тексту.
  - id: N5-3
    kind: FORMAT
    where: "Р20 «Ручки „доверять любому пересылающему“ … у notify нет»; NTF4-92"
    note: >-
      В боевом режиме `TrustedForwarders.Require` печатает и `SANsKnob`, и `TrustAnyKnob`
      («the dev opt-in %s is not honoured in production», trusted_forwarders.go @34bc810). У
      notify такой ручки нет, поэтому текст отказа назовёт несуществующую ручку либо пустую
      строку. Назвать, что notify передаёт в `TrustAnyKnob`. Лучше, чтобы NTF4-92 утверждал:
      текст не называет ручку, которой нет в загрузчике.
  - id: N5-4
    kind: COVERAGE
    where: "межприёмочное: docs/specs/sub-phase-NTF-5-operator-notices-acceptance.md:486"
    note: >-
      NTF-5 сеет записи подавления «через InternalSuppressionService NTF-4», а у Р7 есть только
      Get/Lookup/Delete. Это дефект NTF-5, не NTF-4. Передаётся диспетчеру, чтобы NTF-5 сеяла
      путём продукта (DSN/ARF по П3), а не несуществующим методом.

