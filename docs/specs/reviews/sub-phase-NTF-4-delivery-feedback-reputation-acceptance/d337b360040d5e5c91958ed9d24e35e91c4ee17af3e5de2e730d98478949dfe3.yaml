  - id: N23-2
    kind: CONSTRUCTIBILITY
    anchor: "NTF4-122 Given, NTF4-119 «В Основе»: «экземпляр собран тем же путём сборки, что корень, и проба добавляет к нему одну регистрацию»"
    what: >-
      Как корень принимает добавочную регистрацию, документ не говорит. Это форма фикстуры, а не
      контракта, и производитель назван (NTF-4, полоса S3-C2н). Полосе стоит следить, чтобы точка
      добавления не оказалась вызовом `Register…Server` в не-тестовом корне вне записи З9: такой
      вызов краснит инъекцию DoD S3 п.8.
