blocking_findings:
  - id: B19-1
    kind: COVERAGE
    anchors:
      - "Р16, «Держатель — проба notify»: «ручки NTF-1 судит держатель ручек NTF-1»"
      - "Р16, строка «Какое развёртывание какую ручку читает»; Р22, строка «ручки NTF-4 (Р16)»"
      - "Р16, граница `KACHO_NOTIFY_INTERNAL_PORT`: «порт диагностического слушателя `notify-api` (ручка NTF-1)»"
      - "Р20, таблица осей, строка `DBSSLMode`: «посадка базы `kacho_notify` — ручки NTF-1 (Р3)»"
      - "§1, строка «≥ 2 реплики и PDB notify»; П1 «`notify-api` — две реплики»"
    what: >-
      Документ так и не говорит, какие ручки NTF-1 читает загрузчик `notify-api` и кто их судит.
      Р16 требует от загрузчика каждого развёртывания две непересекающиеся группы, чьё объединение —
      все ручки, которые загрузчик читает. Группа NTF-4 закрыта: 23 ручки у `notify-sender`, 12 у
      `notify-api`. Группу NTF-1 документ отдаёт держателю ручек NTF-1. Но закреплённая редакция 13
      NTF-1 (05828e42) описывает один процесс notify с одним загрузчиком: отказы старта по ручкам
      NTF-1 утверждаются её сценариями (NTF1-E04, NTF1-G06, NTF1-H08 и другими) о том процессе,
      который после раскладки Р22 стал `notify-sender`. У `notify-api` группа NTF-1 при этом не
      пуста. Сам документ опирается как минимум на две её ручки: порт диагностического слушателя
      `notify-api` (граница `…_INTERNAL_PORT`) и посадку базы `kacho_notify` (ось `DBSSLMode`).
      В результате у `notify-api` нет ни закрытого перечня ручек NTF-1, ни держателя. Если одну из
      них не задать, `notify-api` может молча стартовать, и сценария на этот отказ нет. Ручка NTF-1,
      которую `notify-api` объявляет, но не читает (например, креды SMTP или origin установки),
      была бы принятой и проигнорированной (`api-accepted-ignored`): Р16 держит это правило только
      для группы NTF-4. Та же дыра у строки §1 «≥ 2 реплики и PDB notify»: гейт NTF-1
      `notify-availability-test.sh` судит одно развёртывание. У `notify-api` число реплик названо
      только для стенда (П1), а для `values.prod.yaml` не названо ни требование, ни явный отказ от
      него.
    fix: >-
      В Р22 добавить строку «ручки NTF-1» с закрытым перечнем по каждому развёртыванию. У
      `notify-api` это, как минимум, база `kacho_notify` с посадкой, порт диагностического
      слушателя и посадочные оси NTF1-G15. В Р16 назвать держателя группы NTF-1 у `notify-api`:
      либо проба `required_knobs_test.go` судит и эту группу (снятие, границы, сверка в обе стороны,
      инъекция «ручка NTF-1, которой `notify-api` не читает, в его группе»), либо названный
      сценарий. В строке §1 про реплики и PDB сказать для `notify-api` одно из двух: либо требование
      с держателем (рендер-гейт, см. NTF4-117), либо явный отказ от него с причиной. Появятся новые
      отказы — у каждого должен быть положительный близнец.
    predicate: >-
      `grep -n 'notify-api' <док> | grep -iE 'ручк[а-я]* NTF-1|NTF-1.*ручк'` @12ac29577 даёт 1
      совпадение (строка 1277, граница `…_INTERNAL_PORT`). Строки, перечисляющей ручки NTF-1 у
      `notify-api`, нет. `grep -n 'PDB\|notify-availability' <док>` → строки 334, 991, 1756, 3345:
      все они о notify одним процессом, `notify-api` ни в одной не назван.

  - id: B19-2
    kind: CONVENTION
    anchors:
      - "Р20, «Самоотчёт посадки»: «Перечни гейта, которые на `1d42a6728bf` судят запись по имени службы … (`FORWARDER_NARROWING_REQUIRED`, `:187`, `:191-192`, `:231`)»"
      - "§1.1, абзац «Редакция 20 пройдена тем же методом»: «`AuthorizeService` на внутреннем слушателе kaname допускает любой проверенный сертификат модуля (`cmd/kaname/grpc_register.go:163-172` @`734f69fb4`, комментарий «admits any verified module SA»)»"
      - "§28, список «Утверждения о дереве, добавленные этой редакцией, — предикаты с командой»"
    what: >-
      Д24 требует, чтобы каждое утверждение о дереве было предикатом с командой и числом на ревизии,
      а не перечислением автора. Два утверждения редакции 20 записаны перечислением или по
      прочитанному комментарию. Оба на своей ревизии неполны.
      (а) Списков по имени службы в гейте посадки два, а документ называет один. Второй —
      `POSTURE_SKIP`: объявлен в `:151`, сравнивается с именем службы в `:202`, применяется в
      разделах A (`:232`) и B (`:399`). Если оператор задаст `POSTURE_SKIP=notify`, гейт молча
      пропустит оба развёртывания, в том числе посадку `notify-api` с его входящей поверхностью.
      NTF4-109 такого варианта не несёт, и правило Р20 «у notify перечень судит по развёртыванию»
      этот список не задевает.
      (б) Допуск к `AuthorizeService` kaname выведен из комментария. Код решает иначе: у вызова без
      пересланного принципала `authorizeAnonymousPeer` пропускает только сертификат, чей SAN
      разбирается `authzguard.SANToServiceDomain`, а тот требует имя сервисной учётки с префиксом
      `kacho-` (`internal/authzguard/fgaproxy.go:59`, `:158`; `internal/apps/kaname/api/authorize/caller_authority.go`,
      `authorizeAnonymousPeer`). Документ не называет сервисную учётку `notify-api` и не связывает
      её с этим условием. Учётка вне префикса получила бы на каждый `Check` отказ
      `PERMISSION_DENIED`, и сценарии S3 (NTF4-24…29, 82…86, 91) не построились бы. Кроме того, у
      одного факта в документе две координаты: §1 (второй список) — `:155-170`, §1.1 — `:163-172`.
    fix: >-
      (а) Заменить перечисление предикатом, который находит каждый список гейта, сравниваемый с
      `$svc`. Пример — `grep -nE 'for s in \$[A-Z_]+; do \[ "\$s" = "\$svc" \]'` по файлу @1d42a6728bf
      → 2. Для каждого списка назвать, судит ли он у notify по развёртыванию. Для `POSTURE_SKIP` —
      либо «по развёртыванию», либо «пропуск notify запрещён». Добавить вариант NTF4-109 с
      положительным близнецом.
      (б) Записать условие из кода с командой, а не из комментария. Назвать сервисную учётку
      `notify-api` (и `notify-sender`) и утверждение «SAN `notify-api` проходит
      `SANToServiceDomain`». Держателем может стать проба П11 с настоящим kaname (NTF4-24/26 и так
      зовут `Check`) плюс отрицательный близнец: учётка вне префикса получает `PERMISSION_DENIED`
      без вопроса модели. Оставить одну координату факта.
    predicate: >-
      `git show 1d42a6728bf:deploy/scripts/assert-production-posture.sh | grep -nE '_REQUIRED=|_SKIP='`
      → строки 151 (`POSTURE_SKIP`), 187 (`FORWARDER_NARROWING_REQUIRED`); сравнение с `$svc` —
      строки 192 и 202. `git show 734f69fb4:internal/authzguard/fgaproxy.go | grep -n 'svcNamePrefix\s*='`
      → 59: `svcNamePrefix = "kacho-"`. `grep -c 'POSTURE_SKIP' <док>` @12ac29577 → 0.

non_blocking_findings:
  - id: N19-1
    kind: FORMAT
    anchors: ["Р12, «Что из перечня есть у `notify-api`»: «…все с `object=\"address_key\"`»", "Р12, таблица метрик, строка `notify_reputation_breach` (метка — только `kind`)"]
    summary: >-
      Метка `object` есть у двух счётчиков и метки времени перечитывания. У
      `notify_reputation_breach` её нет: там одна метка `kind`, и признак `secret_reload_rejected`
      сведён по объектам реплики. NTF4-113 утверждает его без `object`. Фразу нужно сузить до двух
      метрик.
  - id: N19-2
    kind: FORMAT
    anchors: ["Р11 (строки 968, 984 на 12ac29577)"]
    summary: >-
      Р11 называет `notify_secret_generation_applied_timestamp` и
      `notify_secret_reload_attempts_total{result}` без метки `object`, а таблица Р12 и сценарии
      уже несут её. Стоит дописать `object` там, где ожидание касается одного объекта.
  - id: N19-3
    kind: FORMAT
    anchors: ["N17-1, N17-2 записи круга 17; N18-1 записи круга 18"]
    summary: >-
      N18-1 закрыт: коммит записи определён как коммит добавления. N17-1 (у ожидания тома в ротации
      нет предела) и N17-2 (в П1 не названы стендовые значения I, D и P) редакциями 19–20 не тронуты,
      заказ остаётся.
  - id: N19-4
    kind: SCOPE
    anchors: ["§1 правило опоры, момент (1) «перед одобрением замысла»"]
    summary: >-
      По заданию диспетчера NTF-1 одобрена позже, на редакции 16 (390b5a33). В момент замысла это
      даст исход (б) правила опоры. На приёмку это не влияет: правило объявляет сверку только в
      названные моменты. Отмечено, чтобы автор замысла не пропустил.

