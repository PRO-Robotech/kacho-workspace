resolution_of_round_15:
  B15-1:
    status: "закрыт на управляемых часах"
    evidence: >-
      Абзац «Сетка тактов управляемых часов» (строки 1515–1535) задаёт условия С1 (I кратно P),
      С2 (P < D) и С3 (D + P < I) и значения пробы P = 5 с, D = 30 с, I = 60 с, LEASE_TTL = 30 с.
      Все они в границах Р16 (строки 1057–1063): POLL ≥ 5 с; CANARY_INTERVAL ≥ 1 мин;
      30 с ≤ DEADLINE < INTERVAL; LEASE_TTL ≥ max(30 с, 2P) и < STALE_MAX − P при STALE_MAX ≥ 65 с.
      Такты пересчитаны по правилу абзаца (выпуск — на первом такте не раньше «последний принятый
      + I»; подъём признака — на первом такте не раньше «принятие + D»):
      NTF4-107 — выпуски 60/120/180/240, подъём 90, конец (а) 215 < 240, (б) до 245: выпуск 4 на 240,
      прочитан до 245; ровно одна строка WARN; «Тогда» согласно.
      NTF4-73 — шаг до 95, выпуск 1 на 60, подъём 90, выпуска 2 (120) в шаге нет.
      NTF4-95/96 — шаг до 185, выпуски 60/120/180 прочитаны до срока; I > LEASE_TTL + 2P (60 > 40).
      NTF4-103/105 — попытки 60…95, их 8 (≥ 2); (б): 100 — принят, 105 — прочитан.
      Контрпример круга 15 (I = 60, D = 50, P = 20) теперь исключён условием С3.
  N15-1:
    status: "закрыт"
    evidence: >-
      В строку §1 «нормализация адреса» добавлено «локальную часть она оставляет без изменений,
      регистр в ней не сводится (на этом стоит NTF4-23)». NTF4-23 ссылается на эту строку, а не
      на Р15.
  N15-2:
    status: "закрыт"
    evidence: >-
      Таблица осей Р20 дополнена полями Logger, OwnContour, TrustDomainKnob (имя ручки названо),
      SelfCheck и Existence. Счёт «полей 32, строк объявления 30» воспроизведён:
      `git -C project/corelib show 34bc810:servicecontract/contract.go`, тело `type Spec struct`
      без комментариев даёт 30 строк и 32 имени. Разность множеств имён Spec и таблицы (comm -23) пуста.
  N15-3:
    status: "не правился, на закрепление не влияет (§24 это называет)"

blocking_findings:
  - id: B16-1
    kind: CONSTRUCTIBILITY
    anchors:
      - "NTF4-74, When, стендовая ветка: «проба ждёт роста `notify_feedback_canary_last_success_timestamp` в бюджете I + 2 × `…_POLL_INTERVAL` реального времени от начала шага — следующий выпуск не дальше I плюс такт от последнего принятого, его чтение — ещё через такт; рост не пришёл в бюджете — красный»"
      - "§7, абзац «Сетка тактов управляемых часов»: «письмо, которое П5 укладывает в П10 сразу, читается следующим тактом»; «На стенде (П1) ... шаг ограничен бюджетом реального времени»"
    summary: >-
      Бюджет I + 2P на стенде не выводится ни из Given, ни из правил продукта. Вывод «его чтение —
      ещё через такт» взят из интеграционного двойника П5, который кладёт письмо в П10 сразу. На
      стенде письмо идёт из исходящего приёмника через пересылку в приёмник ящика (П1), и задержка
      этой пересылки нигде не ограничена. Кроме того, настоящие часы добавляют время обработки такта,
      а порядок выпуска и сеанса внутри такта Р10/Р21 не закрепляют: «Выпуск не ждёт конца сеанса
      опроса ящика». Запас бюджета сверх этих величин — не больше одного такта P, а в худшей фазе
      почти ноль. Шаг, превысивший бюджет, объявлен красным. Значит, на исправном продукте стенд
      краснеет, и именно на финальной сквозной проверке. Класс тот же, что у B15-1: момент в
      «Тогда» не следует из Given. Прежняя редакция («тот же срок» = I + D + 1 с) имела запас D;
      редакция 16 его сняла.
    counterexample: >-
      Стенд: P = 5 с, D = 30 с, I = 60 с (в границах Р16). Шаг начался сразу после того, как
      письмо последнего принятого выпуска L прочитано на такте L + P. Следующий выпуск — на такте
      L + I + P − ε, то есть почти через I после начала шага. Пересылка на стенде заняла 6 с, и
      письма в ящике на такте L + I + 2P нет. Оно прочитано на такте L + I + 3P, это больше
      бюджета I + 2P от начала шага, и шаг красный. При этом прочитано оно раньше истечения срока
      (6 + 5 < 30), и `feedback_route` = 0: продукт исправен по Р10.
    required: >-
      Стендовую ветку NTF4-74 вывести из правила продукта, а не из поведения двойника. Ожидаемый
      выпуск читается раньше истечения своего срока, иначе поднимается `feedback_route`, а «Тогда»
      требует его = 0. Поэтому оправданная граница — I + P + D от начала шага, плюс названный запас
      на обработку такта; более позднее чтение и так красное по признаку. Второй путь — назвать в П1
      предел задержки пересылки стенда как условие и превышение считать «не выполнилось». Правило
      «читается следующим тактом» абзаца сетки ограничить интеграционным П5 (см. N16-1).
    basis: >-
      Чек-лист acceptance-reviewer §3.5 «Конструируемость Given»: Given обязан строить состояние,
      из которого «Тогда» выводится при любом допустимом значении. gate-authoring, «детерминизм
      входа и управляемые часы». Тот же класс, что B15-1 круга 15.

non_blocking_findings:
  - id: N16-1
    kind: FORMAT
    anchors:
      - "§7, абзац сетки: «письмо, которое П5 укладывает в П10 сразу, читается следующим тактом»"
      - "NTF4-107, Then (б): «он прочитан тактом t0 + 4I + P»; NTF4-74: «читается тактом t0 + I + P»; NTF4-95: «письмо выпуска 3 прочитано последним тактом»"
    summary: >-
      Порядок выпуска и POP3-сеанса внутри одного такта Р10/Р21 не закрепляют. Р21 закрепляет
      только продление аренды в начале такта до входа в ящик, а Р10 говорит, что выпуск не ждёт
      конца сеанса. Реализация, которая выпускает письмо до открытия сеанса, прочтёт письмо
      П5 на том же такте. Все наблюдаемые утверждения после шагов от этого не меняются: они
      проверяют после шага, а не на такте. Но формулировки «прочитан тактом X» держатель может
      перенести в утверждение о метке времени, и тогда оно покраснеет. Лечится одним из двух:
      закрепить порядок в Р21 либо писать «не позже такта X».
  - id: N16-2
    kind: FORMAT
    anchors: ["NTF4-100, Given"]
    summary: >-
      Абзац сетки требует, чтобы каждый сценарий с тактами называл в Given, какие из С1–С3 он
      требует. NTF4-100 их не называет: он наследует их через «путь NTF4-74 пройден», и §24
      относит его к пройденным. Утверждение сценария (подъём на первом такте не раньше
      «принятие k+1 + D») условий С не требует. Стоит написать прямо «С не требуются» либо
      «С1–С3 как в NTF4-74».
  - id: N16-3
    kind: FORMAT
    anchors: ["NTF4-107, Given: «Без С1 и С3 эти утверждения не следуют — при I = 60 с, D = 50 с, P = 20 с ...»"]
    summary: >-
      В приведённом контрпримере I кратно P (60 = 3 × 20), то есть С1 выполнено, а нарушено
      только С3. Это контрпример к отказу от С3, а не от С1. Для С1 нужен второй пример с I, не
      кратным P, например P = 7 с.

