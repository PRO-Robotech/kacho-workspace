blocking_findings:
  - id: B1-1
    kind: SCOPE
    where: "шапка, стр. 20-21; §1 DoD S1 п.4; §3.2 Р10 стр. 225-226; DoD S3 п.2; §8 строки 24–29 и 40"
    claim: >-
      Документ объявляет «собственный предмет NTF-4 лежит в одном стволе kacho», но сам требует
      правок в corelib и в модели прав, и ни у одной из них нет задачи в трекере эпика.
    evidence:
      - "ids.KnownHyphenPrefixes живёт в corelib: git -C project/corelib grep -n KnownHyphenPrefixes origin/main → ids/*.go; DoD S1 п.4 сам называет «выпуск corelib и подъём пина»"
      - "servicecontract — пакет corelib (git ls-tree -d origin/main в corelib → servicecontract); ось mail_dns заводится там (Р10, DoD S5 п.2)"
      - "права kacho-служб лежат в kaname: vpc.networks.get встречается в kaname origin/357 internal/apps/kaname/seed/embedded/permission_catalog.json и internal/authzmap/permissions_to_relations.go; DoD S3 п.2 «запись каталога прав на каждый метод» координаты не называет"
    required: >-
      Исправить строку «дом предмета»: назвать все три ствола. Для правок corelib (префикс nsp,
      ось mail_dns) и для записи каталога прав notify.suppressions.* назвать координату и задачу
      (новую либо под-задачу corelib#77 / kaname#484), и указать в §8, какой ствол производит
      каждую из них. §11 «новое межсервисное ребро — нет» перепроверить с учётом этого.
  - id: B1-2
    kind: CONSTRUCTIBILITY
    where: "§6 П3, П5, П6; сценарии 04, 05, 10, 19, 20, 23, 31, 32, 60, 61, 64–67"
    claim: >-
      На интеграционном уровне нечем подать сообщение обратной связи. П3 подаёт сообщение
      «в приёмник ящика обратной связи», а этот приёмник заведён только в П1 (стенд). П5 — это
      только SMTP-ретранслятор (стадии AUTH/RCPT/DATA), а POP3-двойника для testcontainers
      нет ни среди посевов, ни в §8. Сценарии, помеченные интеграционными (инъекция точки
      прерывания в NTF4-10, 8 горутин в NTF4-31, управляемые часы в 04/19/64), без стенда
      построить нельзя.
    required: >-
      Завести посев (например, П10): POP3-сервер поверх TLS в дереве проб notify, который исполняет
      настоящий протокол (библиотекой, а не заглушкой), с управляемым набором писем, паролей и
      сертификатом; у каждого интеграционного сценария указать его в Given. Либо перевести
      эти сценарии на П1 и снять пометку «интеграционный».
  - id: B1-3
    kind: PRODUCER
    where: "§3.2 Р11 стр. 244-246; сценарии 56–59; §8 строки 56–57 и 58–59"
    claim: >-
      Для NTF4-56…59 производителя нет. (а) «Объект секрета меняется, и аннотация контрольной суммы
      перекатывает поды». Норма sec-chart-config-checksum покрывает только рендер configmap.
      Секрет почты в боевой посадке задаёт оператор, а контрольную сумму нерендеренного объекта
      чарт не вычисляет. В NTF-1 механизма тоже нет: grep -c checksum в
      sub-phase-NTF-1-…-acceptance.md (f073429e…) → 0. (б) «PDB удерживает прежние» (NTF4-58, Р11):
      PDB не управляет перекатом Deployment. Перекатом управляют стратегия
      maxUnavailable/maxSurge и проба готовности. В NTF-1 maxUnavailable → 0 упоминаний.
      Утверждение приписано механизму, который этого не делает.
    required: >-
      Назвать, чем смена секрета доходит до процесса: перечитыванием смонтированных файлов с
      признаком применённой версии либо явным шагом раскатки с контрольной суммой, которую
      передаёт оператор. Назвать держателя этого механизма. В Р11/NTF4-58 заменить PDB на
      стратегию (maxUnavailable: 0) плюс проба готовности и указать, в какой под-фазе и каким
      рендер-гейтом она держится.
  - id: B1-4
    kind: COVERAGE
    where: "§3.2 Р1, Р2, Р10; §9; сценарий 69"
    claim: >-
      Вся петля держится на невысказанной предпосылке установки. DSN уходят на envelope MAIL FROM
      вида <токен>@<домен возврата>, отписка — на адрес из List-Unsubscribe с токеном. До ящика
      POP3 они дойдут, только если у домена возврата есть MX и ящик принимает любую локальную часть
      (catch-all или subaddressing). Р10 проверяет SPF/DKIM/DMARC/выравнивание, но не MX домена
      возврата и не маршрут локальной части с токеном. §9 перечисляет действия оператора и эту
      предпосылку не называет. При ошибке маршрута обратная связь пропадает молча: NTF4-69 читает
      ноль как законный ноль, а feedback_stale следит только за успехом опроса, а не за доставкой.
    required: >-
      Назвать требование к установке (MX домена возврата и приём ящиком адресов с токеном) и его
      проверку. Например: в Р10 добавить проверку MX; периодически отправлять контрольное письмо
      на адрес возврата с токеном и ждать его в ящике; при недоставке поднимать отдельный признак.
      Добавить сценарий на это и близнеца, в котором маршрут исправен.

non_blocking_findings:
  - id: N1-1
    kind: FORMAT
    where: "Р5, Р7; NTF4-21"
    note: >-
      NTF4-21 утверждает, что Get истёкшей записи возвращает NOT_FOUND, но ни Р5, ни Р7 не
      говорят, что после expiresAt запись удаляется или скрывается. Дефолт, зафиксированный на
      ревью: истёкшая запись невидима для Get/Lookup и удаляется подметальщиком. Вписать его в Р5.
  - id: N1-2
    kind: FORMAT
    where: "Р12; сценарии 01–10, 31"
    note: >-
      Значения метки result (applied, bad_token, recipient_mismatch, stale, unparsed, duplicate,
      refreshed) рассыпаны по сценариям, а refreshed встречается только в NTF4-31. Объявить в Р12
      закрытый перечень значений метки и что означает каждое.
  - id: N1-3
    kind: FORMAT
    where: "NTF4-13"
    note: >-
      В When нет конкретного письма отписки: From, To, токен. По Р2 п.3 отправитель должен
      совпасть с получателем строки, а близнеца с несовпадающим отправителем для отписки нет.
  - id: N1-4
    kind: CONSTRUCTIBILITY
    where: "NTF4-16, NTF4-17, NTF4-24"
    note: >-
      На адрес A идут три-четыре запроса кода восстановления подряд (П2, NTF4-16, NTF4-24), а
      SUPPRESSED лимит источника не возвращает (Р17). В Given указать, что лимит источника по A в
      профиле стенда допускает нужное число запросов; иначе прогон получит «не выполнилось» от
      предела частоты, а не от предмета.
  - id: N1-5
    kind: COVERAGE
    where: "NTF4-33"
    note: >-
      Путь успеха Lookup (NTF4-26), в запросе которого есть сырой адрес, в проверку журнала не
      входит. Добавить его.
  - id: N1-6
    kind: FORMAT
    where: "Р2"
    note: >-
      Назвать предел длины токена: локальная часть адреса не длиннее 64 октетов (RFC 5321), а в
      неё должны войти версия ключа, id строки и усечённый код аутентичности.
  - id: N1-7
    kind: SCOPE
    where: "шапка; DoD S7 п.4"
    note: >-
      В 04-roadmap-and-phasing.md записи для NTF нет (grep уведомл|notif|NTF → 0), поэтому якорь
      объёма — эпик #2914 и решения диспетчера. В задаче DoD S7 п.4 назвать и 04, а не только 01.
  - id: N1-8
    kind: FORMAT
    where: "NTF4-09"
    note: "Given ссылается на П1, а утверждение о HTTP-сервере — интеграционное. Развести по уровням."

