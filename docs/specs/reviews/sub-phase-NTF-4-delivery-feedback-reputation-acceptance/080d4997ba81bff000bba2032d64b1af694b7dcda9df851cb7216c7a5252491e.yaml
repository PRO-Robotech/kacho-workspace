blocking_findings:
  - id: B7-1
    kind: CONSTRUCTIBILITY
    anchors: [П1, П2, П4, NTF4-16, NTF4-17, NTF4-24, "§1.1 второй список, строка «глагол запроса кода восстановления»", "§8 строка 16–17"]
    summary: >-
      Given стендовых сценариев, которые ставят письмо глаголом восстановления kaname через край,
      построены по семантике глагола до NTF-2 («каждый запрос — новая строка ленты, считается
      только общий лимит ≥ 4»). После NTF-2 (Д11: «kaname на адресата — повтор того же
      действующего кода, пауза, часовой и суточный потолок»; «край — по IP//64 и подсетям только
      для анонимных почтовых глаголов, proof-of-work после порога») такое состояние
      недостижимо так, как оно описано.
    details:
      - >-
        NTF4-16: «до шага When на A ровно один запрос (П2); шаг When — второй запрос окна». По
        NTF-2 Р6 второе письмо ставится не раньше первой паузы; запрос внутри паузы даёт `200 {}`
        и НЕ ставит строки (исход `cooldown`, NTF2-05, NTF2-64). Тогда утверждение «исход строки
        в ленте kaname — SUPPRESSED(hard_bounce), secret_attrs = NULL» не на чем проверять: строки
        нет, а «приёмник не получил письма на A» станет зелёным при любом исходе. Given не
        называет ни момента шага When относительно паузы, ни величин паузы в профиле стенда.
      - >-
        NTF4-24: «следующий запрос кода восстановления на A даёт исход SENT» — третий запрос
        окна; по NTF-2 он допустим не раньше второй паузы и в пределах часового потолка. Ни
        то ни другое в Given не названо (П1 говорит только «лимит не меньше 4 за окно»).
      - >-
        П2 не говорит, что A (и B в NTF4-17) — подтверждённый адрес ACTIVE учётки. По NTF-2 Р6
        для адреса без учётки строка ленты не заводится вовсе; тогда NTF4-17 («исход SENT,
        приёмник получил одно письмо на B») не строится, а NTF4-16 и NTF4-17 совпадают по ответу
        и по пустоте приёмника — близнец перестаёт различать.
      - >-
        Стендовый прогон зовёт `POST /iam/v1/auth/recovery` с одного источника пробы многократно
        (П2 в NTF4-01/02/03, 15, 41, 62/63; NTF4-16, 17, 24, 25, 26, 93/94 через П4). По NTF-2 Р5
        выше порога «без проверки» край отвечает вызовом proof-of-work (`429`,
        `PROOF_OF_WORK_REQUIRED`), выше жёсткого — `429 RATE_LIMITED`. Given не называет, как
        проба проходит лестницу (решает вызов по контракту NTF-2, порог стенда, разные
        источники).
      - >-
        §1.1, второй список: «глагол запроса кода восстановления — приёмка
        recovery-of-access.md (origin/357) … глагол не меняется». NTF-2 замещает Ф5-01 этой
        приёмки (повтор того же живого кода) и вводит окно адресата — утверждение неверно для
        мира, в котором NTF-4 входит в реализацию (Д13: NTF-2 — первая волна).
    required: >-
      Закрепить в §1 Given от NTF-2 так же, как от NTF-1: отпечаток редакции NTF-2 и таблицу
      свойств (окно recovery: паузы, часовой потолок, повтор того же кода, строки для адреса без
      учётки нет; лестница края для анонимных почтовых глаголов). В П1 назвать ручки паузы и
      потолков окна recovery в профиле стенда и способ прохождения лестницы края пробой. В П2
      назвать A и B подтверждёнными адресами ACTIVE учёток (фикстура). В NTF4-16 шаг When — не
      раньше T(П2) + первая пауза (величина печатается пробой), с утверждением исхода
      `kaname_mail_intents_total{verb="recovery"}` = `resent_same` либо `queued`; в NTF4-24 —
      не раньше второй паузы и в пределах часового потолка. Исправить строку §1.1 о глаголе.
      Пройти класс по всему документу: каждое Given, которое ставит письмо источником через
      анонимный глагол, проверить против окна адресата и лестницы края.

non_blocking_findings:
  - id: N7-1
    kind: FORMAT
    summary: >-
      Р16: «Границы включительные», но у `…_LEASE_TTL` и `…_CANARY_DEADLINE` верхняя граница
      строгая. Назвать исключения в самой фразе. Границы взаимозависимы: при
      `…_POLL_INTERVAL` = 5 с нижняя граница `…_POLL_STALE_MAX` (20 с) несовместима с
      `…_LEASE_TTL` ≥ 30 с и < STALE_MAX − POLL. Держатель «значение на каждой границе — старт»
      должен подбирать зависимые ручки; сказать это в описании держателя.
  - id: N7-2
    kind: FORMAT
    summary: >-
      NTF4-95/96: «ровно 3 контрольных письма» и `canary applied` = 3 за 3 × CANARY_INTERVAL
      зависят от того, попадает ли третий выпуск (момент 3·I после взятия аренды) и его
      прочтение в срок шага. Назвать момент взятия аренды на управляемых часах и срок шага
      (например 3·I + интервал опроса + 1 с).

