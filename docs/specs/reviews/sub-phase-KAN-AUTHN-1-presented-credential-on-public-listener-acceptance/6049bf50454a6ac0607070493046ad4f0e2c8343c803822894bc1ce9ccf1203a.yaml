r11_b1_closure:
  status: закрыт
  basis: >-
    Единица выведена из переписи входов процесса (ключ файла настроек, переменная службы,
    переменная края) к путям трёх чартов, а не из перечня форм записи. Путь, на котором стоял
    R11-B1, — env-блок профиля — теперь своё выражение П3 и различает посадку own во всех трёх
    чартах (env · kaname.env · extraEnv) и в рецептах (--set env.…=, export); близнец external —
    0. Потоковое отображение, замеченное кругом 11 тем же классом, — П4. Пути вне выражений
    названы с причиной и замером (Д1, Д2, умолчание службы с пробой, файл значений вне дерева).
    Контроль настоящим входом из дерева есть: на стволе продукта выражение видит посаженную
    накладку values.own.yaml.

blocking: []

non_blocking:
  - id: R12-N1
    note: >-
      П5 знает одну запись пары — `- name:` и `value:` на двух соседних строках. Запись пары одной
      строкой (`- {name: KANAME_AUTHN__IDENTITY_PROVIDER, value: own}`) и пара с посторонней
      строкой между `name:` и `value:` дают П1–П6 · Д1 · Д2 = 0 (посевы 0a4a45de01, 03b7244aef в
      tmp/review-618-r12/seed.git). Не блокирует: ни одна форма не живёт в дереве ни для какой
      переменной — однострочных пар `{name: …, value: …}` в *.yaml/*.yml/*.tpl на caa48b770d 0;
      из 409 строк `- name: <ИМЯ_ЗАГЛАВНЫМИ>` 408 идут прямо перед value/valueFrom, одна — имя
      шага CI, не пара окружения. Стоит назвать обе в таблице «пути вне выражений» с этим
      замером либо расширить П5.
  - id: R12-N2
    note: >-
      §7 п. 4 (строка 1239, вне дельты) говорит «сегодня посадка own в дереве развёртывания не
      выбрана ни разу», и так же читается заголовок §1.7. Контроль на стволе, добавленный этой
      же дельтой, показывает, что на 4382f05c0a это не так (П1 → 2, values.own.yaml). Сам §1.7
      теперь привязан к ревизиям верно; во фразе §7 п. 4 «сегодня» стоит заменить на «на
      ревизиях §1.7».

