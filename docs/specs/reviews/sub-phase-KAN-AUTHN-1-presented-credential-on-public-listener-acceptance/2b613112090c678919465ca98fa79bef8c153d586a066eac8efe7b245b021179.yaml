blocking:
  - id: R11-B1
    kind: PRODUCER
    where: §1.7 (единица и три выражения); наследуют §5 строка п.4 и §11 строка «посадка own»
    defect: >-
      Предикат производителя §7 п.4 не различает посадку own, объявленную переменной окружения
      через env-блок профиля, — законным, документированным и живым в корне чарта продукта путём
      объявления этого поля. Единица «строка-ключ YAML либо --set» — перечень форм, и он пропускает
      форму ровно так, как прежний перечень корней пропускал корень: класс не снят, а переехал с оси
      «корень» на ось «форма».
    evidence:
      - "services/iam/INSTALL.md:88 @caa48b770d: поле `authn.identity-provider` ⇔ переменная `KANAME_AUTHN__IDENTITY_PROVIDER`"
      - "services/iam/internal/apps/kaname/config/load.go:58 @caa48b770d: явный BindEnv на эту переменную; TestDocumentedEnvName_IdentityProvider (identity_provider_test.go:171) — переменная доезжает до поля"
      - "services/iam/deploy/templates/deployment.yaml:138 — `range .Values.env` → env контейнера; боевой профиль того же чарта values.prod.yaml объявляет этим путём 26 ручек (`git show caa48b770d:services/iam/deploy/values.prod.yaml | python3 -c 'import sys,yaml; print(len(yaml.safe_load(sys.stdin)[\"env\"]))'` → 26)"
      - "тот же путь есть у подчарта зонта (charts/kaname/templates/deployment.yaml:522, профиль deploy/helm/umbrella/values.dev.yaml ведёт `kaname.env`) и у края (gateway/deploy/templates/deployment.yaml:461 `extraEnv`, переменная KACHO_API_GATEWAY_IDENTITY_PROVIDER)"
    seeded_counterexample:
      - seed: "services/iam/deploy/values.prod.yaml, в блок `env:` одна строка `  KANAME_AUTHN__IDENTITY_PROVIDER: own`"
        predicate: "e1=4 · e2=0 · e3=0"
        render: "`helm template t . -f values.prod.yaml` (helm v4.2.4) → env контейнера KANAME_AUTHN__IDENTITY_PROVIDER=\"own\" (конфиг при этом несёт identity-provider: \"external\"; старшинство окружения над файлом — порядок viper у загрузчика load.go, прочитано, не прогонялось; без него посадку own даёт тот же посев в базовом профиле, где строка конфига не рендерится вовсе)"
      - seed: "deploy/helm/umbrella/values.dev.yaml, `kaname.env` += `KANAME_AUTHN__IDENTITY_PROVIDER: own`"
        predicate: "e2=0 · e3=0"
      - seed: "gateway/deploy/values.yaml, `extraEnv: {KACHO_API_GATEWAY_IDENTITY_PROVIDER: own}`"
        predicate: "e2=0 · e3=0"
    today_truth: >-
      Утверждение «посадку own не объявляет ни один профиль» на обеих ревизиях ВЕРНО и по
      env-форме: `git grep -nE '^[[:space:]]*(KANAME_AUTHN__IDENTITY_PROVIDER|KACHO_API_GATEWAY_IDENTITY_PROVIDER)[[:space:]]*:' <rev>`
      → 1 (gateway/docs/content/install/configuration.mdx:190, значение external, не профиль).
      Дефект — в способности предиката упасть, а не в сегодняшнем нуле: профиль own, заведённый
      работой §7 п.4 так, как боевой профиль заводит соседние ручки, оставит признак §11 на 0, и
      документ будет утверждать отсутствие производителя при его наличии.
    same_class_same_fix: >-
      Потоковое отображение (`authn: { identityProvider: own }`) e2 тоже не видит — посев в
      values.prod.yaml → e2=0; форма живая в дереве (97 строк `{ key: … }` в *values*.yaml @caa48b770d),
      для этой ручки не использована.
    minimal_fix: >-
      Единицу вывести из переписи путей объявления поля (ключ YAML · --set · env-блок профиля ·
      потоковое отображение), каждый путь — своим выражением с посеянным контролем «1» и близнецом
      «0», как сделано для ключа. Пример выражения для env-формы, проверенный посевом
      (база 0 · посев iam 1): git grep -nE "(KANAME_AUTHN__IDENTITY_PROVIDER|KACHO_API_GATEWAY_IDENTITY_PROVIDER)[\"']?[[:space:]]*[:=][[:space:]]*[\"']?own([\"'[:space:],}]|\$)" caa48b770d -- '*.yaml' '*.yml' | wc -l.
      Путь, оставленный вне предиката, назвать в тексте с причиной и замером его употребления для
      этой ручки (сегодня 0). Та же подстановка — в строки §5 и §11.

