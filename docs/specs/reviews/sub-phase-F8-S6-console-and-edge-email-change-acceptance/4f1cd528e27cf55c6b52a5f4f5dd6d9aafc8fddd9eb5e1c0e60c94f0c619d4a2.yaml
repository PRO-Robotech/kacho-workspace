blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    where: F8S6-02, вторая строка «Тогда»
    claim: >-
      «в приёмнике по N письма с кодом нет» ложно на исправном продукте. Посев Занято заводит
      второго человека на N через seedConfirmedHuman, а он ждёт письмо регистрации на N
      (awaitLetter, ceremony-seed.ts:272–285) — письмо с кодом подтверждения по N в приёмнике
      уже лежит. Отсутствие к тому же не ограничено сроком.
    predicate: >-
      ui-future/e2e/specs/ceremony-seed.ts:seedConfirmedHuman → awaitLetter(mailbox, email, before)
      @kacho 4e96de2c2: письмо регистрации на адрес посева обязательно, иначе conditionNotCreated
    fix: >-
      Судить письма по N, принятые ПОСЛЕ запроса смены (перечень до запроса — как before у
      awaitLetter), и вида email-change; срок отсутствия задаёт близнец — сперва дождаться письма
      по N₂, затем прочесть N.
  - id: B2
    kind: CONSTRUCTIBILITY
    where: F8S6-05, Given/When
    claim: >-
      Порядок не назван: код берётся «из письма» в When — после посева занятости. seedConfirmedHuman
      снимает перечень писем по N до регистрации и требует ровно одно новое письмо
      (expect(fresh.length).toBe(1), mail-receiver.ts:awaitLetter). Если письмо смены человека
      U по N ещё не принято приёмником к этому снимку, новых писем два — посев красный на
      исправном продукте (поломка фикстуры, а не отказ продукта), либо код читается не из того
      письма.
    fix: >-
      В Given: письмо смены по N дождано (код C взят) ДО посева занятости; When предъявляет C.
  - id: B3
    kind: COVERAGE
    where: §2 Р3, Р4 против §5
    claim: >-
      Утверждения решений без сценария: (1) Р4 строка «400, поле code» — текст у поля кода,
      состояние «код» (служба: пустой code → 400 Illegal argument code: required, EC Р5);
      (2) Р3 «Отмена» — возврат в покой без обращения к глаголам, из «формы» и из «кода»;
      (3) Р3 «Отправить снова» — нажатие после конца отсчёта зовёт email-change ещё раз и
      оставляет состояние «код». Ни один из F8S6-01…11 их не утверждает.
    fix: >-
      Сценарий на каждое (ось времени для (3) — подстановкой первого ответа с Retry-After: 0 по
      F8 Р9, ось 3а), либо для (1) записать, что «Подтвердить» на пустом поле выключена, и
      утверждать это вместо ответа 400.

