prior_round_resolution:
  B1_CONSTRUCTIBILITY: >-
    снято — F8S6-02 снимает before по N и N₂ после обоих посевов, судит только письма смены вне
    before (codeLine вида email-change), срок отсутствия — письмо по N₂, запрошенное позже. На
    исправном продукте письма смены по N нет (EC Р4: на занятый адрес письмо не ставится),
    письмо регистрации второго человека лежит в before.
  B2_CONSTRUCTIBILITY: >-
    снято — код C берётся до seedConfirmedHuman на N; before посева (ceremony-seed.ts:seedConfirmedHuman,
    снимок до seedHuman) уже содержит письмо смены, новое письмо ровно одно — регистрации
    (awaitLetter: expect(fresh.length).toBe(1)). Регистрация на N при отложенной смене допустима:
    уникальность держит users_identity_email_uniq только в исходе (EC Р4).
  B3_COVERAGE: >-
    снято по (1) и (2): F8S6-12 — пустой code → 400, code 3, «Illegal argument code: required»
    производится службой (email_change.go:445 FieldRequired("code") @ae1d4e35b1d0; EC Р5);
    F8S6-13 — «Отмена» из формы и из кода. По (3) сценарий заведён (F8S6-14), но его Given
    неконструируем — см. B4.

blocking:
  - id: B4
    kind: CONSTRUCTIBILITY
    where: F8S6-14, Given и первое «Тогда»; §6 строка F8S6-14
    claim: >-
      Подставленный первый ответ «200, {}, Retry-After: 0» служба произвести не может: заголовок
      ставит retryAfterSeconds(out.NextAllowedIn), а он округляет вверх и не отдаёт меньше 1
      (handler.go:1440–1449 @kaname ae1d4e35b1d0: `if s < 1 { s = 1 }`); на успехе запроса
      NextAllowedIn = Pace.Interval (email_change.go:382), то есть профиль 60 с. Подстановка
      обязана быть в форме, которую отдаёт производитель (шапка producer-answers.ts; там же
      laneTooManyAttempts — «не меньше одной»). Следствие для предмета: с Retry-After 0 отсчёт
      не запускается вовсе, и утверждение Р3 «Отправить снова включается ПО КОНЦУ отсчёта» не
      исполняется — экран, который после настоящего отсчёта кнопку не включает, F8S6-14 пройдёт.
      Проба не способна упасть на том, что Р3 ей поручает.
    predicate: >-
      git -C project/kaname show ae1d4e35b1d0:internal/handler/loginlanehttp/handler.go | sed -n 1440,1449p
      → s < 1 → s = 1; там же :1121 Retry-After из retryAfterSeconds(out.NextAllowedIn)
    fix: >-
      Подставлять Retry-After: 1 (наименьшее, что производит служба); «Тогда» после первого
      обращения — состояние «код», «Отправить снова» выключена с отсчётом 1 с; проба ждёт
      УСЛОВИЯ «кнопка включена», а не времени (F8 Р9, редакция 9, образец F6b-19 / §11.4);
      затем «Отправить снова» и прежние утверждения о втором обращении. Строку §6 — тем же.

important:
  - >-
    F8S6-02: «срок отсутствия задаёт письмо по N₂» — граница эвристическая: порядок доставки
    писем на разные адреса дренажем не обещан, при параллельном дренаже ложное письмо по N могло
    бы прийти позже письма по N₂ (ложно-зелёный исход, не красный на исправном). Терпимо: у
    службы свой держатель (EC-09, EC-26). Можно назвать цену одной строкой.
  - >-
