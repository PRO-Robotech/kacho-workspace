blocking: []

non_blocking:
  - id: N1
    where: F8S6-15 (б), F8S6-16 (б); порядок переписи
    observed: >-
      После успешного повышения StepUpModal зовёт auth.refresh() до pending.resolve()
      (StepUpModal.tsx:148–156 @fd9f1793e; AuthContext.refresh → sessionIdentity, затем whoami при
      подтверждённом адресе). Поэтому между step-up → 200 и повтором глагола в переписи стоят
      чтения личности. Перечень (б) читается как упорядоченная подпоследовательность обращений
      (так же уже стоит F8S6-03, одобренный), и в форме F8 Р6 п. 1 порядок законен: каждое
      следующее обращение выпущено после ответа на предыдущее. Проба не должна утверждать
      «ничего между» — иначе она красна на верной реализации. Утверждение (а) «после него нет ни
      step-up, ни GET /me» верно: «Отменить» refresh не зовёт (StepUpModal.tsx cancel → close).
      Можно одной фразой назвать это в (б).
  - id: N2
    where: шапка, строка редакции 6
    observed: "«посев Ч2Ф (§4)», а в §4 он назван «Шаг 2Ф» — одно имя на предмет."
  - id: N3
    where: F8S6-16, второй близнец
    observed: >-
      F8S6-01 строится посевом Ч2, а F8S6-16 — Ч + 2Ф: отличие больше одного факта (второй
      контекст). Основной близнец (б) отличается ровно одним фактом, так что требование §3.2
      выполнено; ближе как второй близнец — F8S6-13 (б) или F8S6-14 без подстановки (посев Ч).
  - id: N4
    where: F8S6-16 (а)
    observed: "можно добавить «адрес в разделе прежний» симметрично F8S6-15 (а)."
  - id: N5
    observed: "Неблокирующие кругов 2–4 (N1, N2 круга 4) не трогались и остаются в силе."

