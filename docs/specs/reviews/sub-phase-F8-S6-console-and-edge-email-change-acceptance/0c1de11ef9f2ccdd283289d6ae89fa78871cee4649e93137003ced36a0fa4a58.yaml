  seeded: 0
  by_named_fixture: >-
    Шаг 2Ф: newSeed (ceremony-seed.ts:179), seedSecondFactor (ceremony-seed.ts:428, возвращает
    backupCodes), вход глаголом полосы — @fd9f1793e. Повышение запасным кодом до «2»: step_up.go
    принимает lookup_secret (kaname@73b94cd6d:step_up.go:11,46), assurance.MethodLookupSecret,
    уже исполняется браузерной пробой cloud-admin-lane.spec.ts:247 (submit(LANE.stepUp, …,
    {method: "lookup_secret", code: backupCodes[0]})); окно StepUpModal поле «Запасной код»
    (SecondFactorCodeField.tsx:37), заголовок «Подтверждение действия», кнопка «Отменить»
    (StepUpModal.tsx:170–175). Заведение фактора в другой сессии носитель браузера не трогает
    (sf_enroll.go: отзыва сессий нет — git grep -i revok → 0; F8 N19 опытом: «заведение фактора
    его не трогает»), отложенную смену не касается (упоминаний email-change в sf_enroll.go нет).
    Порядок F8S6-15 (запрос до заведения, предъявление после) покрыт формулой EC Р2 «условие
    судится на каждом пути по заведённому»; EC-29 судит смежную форму.
  not_executed: >-
    браузерные F8S6-01…09, 12…16 — доставки писем на стенде нет (kacho#1773), стенда и разрешения
    на посев задание не дало; F8S6-15/16 дополнительно требуют пина службы с влитой 770 (§7 п. 2).
    «Не выполнилось» — не зачитано ни в зелёное, ни в красное.

