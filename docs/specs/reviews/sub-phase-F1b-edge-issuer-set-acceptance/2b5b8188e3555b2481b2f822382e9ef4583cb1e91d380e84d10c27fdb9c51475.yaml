    Четыре прогона команды документа в ИЗОЛИРОВАННОЙ копии (каталог вне любого репозитория):
    контроль · снятие предикат-строки · снятие числовой строки · неравенство внутри строки.
    Общие рабочие копии не тронуты — правок в них не производилось, все обращения к деревьям
