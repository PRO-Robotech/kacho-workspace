# ─────────────────────────────────────────────────────────────────────────────
# ГЛАВНОЕ ЭТОГО КРУГА: испытывался не документ, а ЛЕКАРСТВО
# ─────────────────────────────────────────────────────────────────────────────
remedy_under_test:
  what_was_prescribed_by_round_4: >-
    Средство обязано стать АРИФМЕТИЧЕСКИМ, а не более подробным: (1) строка переписи несёт
    МОЩНОСТЬ предписанного, и сверка держателя становится вычитанием; (2) норма над ОТКРЫТЫМ
    населением получает держателем ПЕРЕПИСЬ с двумя величинами рядом, а не перечень названных
    экземпляров.
  what_the_author_delivered: >-
    Колонка «предписано · утверждается» у 48 строк, четыре строки с мощностью «предикат»,
    единая команда сверки в теле документа, прогон формы по 48 строкам редакции 4 как ВХОД
    работы, и держатель-перепись у каждой из четырёх предикат-строк.

  # ── 1. Исполняется ли команда ВЕРБАТИМ ────────────────────────────────────
  command_runs_verbatim:
    answer: ДА
    method: >-
      Блок кода §5.0 скопирован из документа БЕЗ ЕДИНОЙ ПРАВКИ и исполнен из корня рабочей
      копии редакции 5 (origin/lane/f1b-round2 @ 2f3cace5).
    output_reproduced_byte_for_byte: >-
      строк 52 Σ предписано 93 Σ утверждается 93 предикат-строк 4 расхождения []
    matches_the_comment_in_the_document: true
    exit_code: 0
    verdict: >-
      Предикат, стоящий в документе, исполняется как написан и печатает ровно то, что рядом с
      ним объявлено. Это редкий случай: за четыре круга ни один из моих собственных предикатов
      и ни один авторский не прошёл вербатим с первого раза.

  # ── 2. Честны ли числа на ВЫБОРКЕ ─────────────────────────────────────────
  numbers_are_honest_on_the_sample:
    answer: ДА — подгонки не найдено
    sample_size: 16
    sample_includes_all_four_predicate_rows: true
    method: >-
      По каждой строке выборки прочитан ТЕКСТ НОРМЫ в её разделе-источнике и ТЕЛО ДЕРЖАТЕЛЯ в
      §5, и наблюдаемые выписаны ПОИМЁННО с обеих сторон. Сверялся состав, а не число.
    rows_checked_clean:
      - {row: Н01, предписано: 1, норма: '§2.1 «не задано ⇒ одна запись из пина и работает»', держатель_несёт: 'Ф1б-11 — край поднимается и принимает токен прежнего издателя'}
      - {row: Н02, предписано: 3, норма: '§2.1 «ноль элементов ⇒ отказ · безусловный · страж считает элементы»', держатель_несёт: 'Ф1б-02 — все три порознь, плюс положительный контроль'}
      - {row: Н09, предписано: 2, норма: '§2.2 «состав перечислен · и закрыт»', держатель_несёт: 'Ф1б-09а — обе половины'}
      - {row: Н11, предписано: 2, норма: '§2.2 «коды двух исходов РАЗНЫЕ»', держатель_несёт: 'Ф1б-09 — пара на обеих поверхностях'}
      - {row: Н14, предписано: 2, норма: '§2.3 биусловие объявления', держатель_несёт: 'Ф1б-01 — обе импликации, снял/вернул'}
      - {row: Н19, предписано: 2, норма: '§2.4 «проходит на ОБЕИХ поверхностях»', держатель_несёт: 'Ф1б-10 — дословно «на обеих поверхностях»'}
      - {row: Н25, предписано: 3, норма: '§6 п. 1 — край в области · первая конфигурация в области · поле предиката снято', держатель_несёт: 'Ф1б-01 — три порознь, и это правка редакции 5'}
      - {row: Н36, предписано: 3, норма: '§6 п. 10 — три раздельных счёта', держатель_несёт: 'Ф1б-09 — проба вызывает каждый и требует роста ровно его'}
      - {row: Н41, предписано: 3, норма: '§7 п. 4 — три величины типов', держатель_несёт: 'Ф1б-07 (две полосы края) + Ф1б-13 (первая конфигурация, скаляр)'}
      - {row: Н50, предписано: 3, норма: '§0 наблюдаемая цель фазы', держатель_несёт: 'Ф1б-11 · Ф1б-12 · Ф1б-13 — по одной на поверхность'}
      - {row: Н51, предписано: 2, норма: '§7 п. 3 — второй реализации не заводится · состав сверяется одним объявлением', держатель_несёт: 'Ф1б-02а (перепись разборов) + Ф1б-01 (один перечень)'}
      - {row: Н52, предписано: 2, норма: '§6 п. 5 — проба существует по каждой из трёх · каждая утверждает проход', держатель_несёт: 'Ф1б-14, перепись N = M = K'}
    no_under_statement_found: >-
      Ни в одной строке выборки «предписано» не занижено под то, что утверждает держатель. Это
      и был главный способ подделать равенство сумм, и его нет.
    one_over_statement_named: >-
      Н50 несёт 3 при §0, говорящем «край на ОБЕИХ его поверхностях» — то есть о ДВУХ. Третья
      поверхность (плоскость данных реестра) краем не является, и §0 о ней в этом предложении
      не говорит. Завышение безопасно (оно не прячет непокрытого) и здесь названо только затем,
      чтобы «сверено» было отличимо от «не сверялось».
    rows_where_the_SETS_diverge_despite_equal_numbers: [Н24, Н48, Н49]
    rows_where_they_diverge_more_weakly: [Н01, Н03, Н25, Н33, Н39, Н50]
    rows_with_no_row_at_all_from_a_declared_source: >-
      заголовки Ф1б-04 (обе половины) · Ф1б-03 (зеркальный страж) · Ф1б-05 (вторая половина)

  # ── 3. ГЛАВНОЕ ИСПЫТАНИЕ: расхождение МИМО вычитания ──────────────────────
  discrepancy_past_the_subtraction:
    answer: НАЙДЕНО, и не одно — два блокирующих плюс одно важное
    the_author_named_this_test_himself: >-
      «Если следующий круг найдёт расхождение того же рода МИМО вычитания — значит арифметика
      тоже описательна». Испытание поставлено и пройдено НЕ В ПОЛЬЗУ арифметики.

    structural_reason_measured_by_injection:
      method: >-
        Одно-фактная инъекция в ИЗОЛИРОВАННОЙ копии (каталог вне любого репозитория, общие
        рабочие копии не тронуты). Одна и та же команда документа, четыре прогона, различие
        между прогонами — РОВНО ОДИН факт.
      runs:
        - {прогон: '0 контроль', вход: 'нетронутая редакция 5', вывод: 'строк 52 Σ 93 Σ 93 предикат 4 расхождения []'}
        - {прогон: '1 инъекция', вход: 'СНЯТА строка Н49 целиком', вывод: 'строк 51 Σ 93 Σ 93 предикат 3 расхождения []'}
        - {прогон: '2 инъекция', вход: 'СНЯТА строка Н28 (мощность 3 · 3)', вывод: 'строк 51 Σ 90 Σ 90 предикат 4 расхождения []'}
        - {прогон: '3 инъекция', вход: 'Н28 переписана в 3 · 2', вывод: "строк 52 Σ 93 Σ 92 предикат 4 расхождения ['Н28']"}
      verdict: >-
        ВЫЧИТАНИЕ ЛОВИТ НЕРАВЕНСТВО ВНУТРИ СТРОКИ И СЛЕПО К ОТСУТСТВИЮ СТРОКИ. Прогон 3
        краснеет и называет координату — форма работает для того, что обещает. Прогоны 1 и 2
        дают `расхождения []` ПОБАЙТОВО КАК КОНТРОЛЬ: сумма по строкам не может увидеть строку,
        которой нет. Снятие держателя у правила §7 п. 6 — ровно того, ради которого заводилось
        Б13, — проходит вычитание молча.
      why_this_is_the_root_class: >-
        Род, отвергший документ три круга подряд, называется «норма объявлена, держателя нет».
        Его предмет — ОТСУТСТВУЮЩАЯ строка. Инструмент, суммирующий по строкам, к нему слеп
        BY CONSTRUCTION, а не по недосмотру автора.
      the_row_count_is_not_a_guard: >-
        Команда печатает «строк 52», и это выглядит защитой. Ею оно не является: 52 ни с чем не
        сравнивается, а настоящий отказ — не «кто-то снял строку», а «норму написали и строки ей
        не завели», и тогда числа 53 не существовало никогда. То же требование, что корпус
        предъявляет всякому обходчику: «ноль находок» обязано быть отличимо от «ноль
        прочитанного». Здесь неотличимо.
      predicate_rows_escape_entirely: >-
        Четыре предикат-строки вносят 0 в ОБЕ суммы. Что бы в них ни стояло, вычитание об этом
        не высказывается вовсе — и ОБА блокирующих этого круга лежат именно в предикат-строках.
        Это не совпадение: там единственное место переписи, где арифметики нет.

    the_authors_own_table_proves_it:
      quote: >-
        «строк, где предписано ≠ утверждается — 9» · «норм, у которых строки не было ВОВСЕ — 4»
      arithmetic: >-
        9 из 13 поймало вычитание. Остальные 4 — наблюдаемая цель фазы · правило §7 п. 6 ·
        §7 п. 3 · §6 п. 5 о существовании проб — вычитанием пойманы быть НЕ МОГЛИ: у них не
        было строки, чтобы попасть в сумму. Их нашёл ОБХОД — то самое описательное средство,
        которое остановилось на трёх кругах подряд, теперь снабжённое пятым источником (§0).
      the_prose_overclaims_and_contradicts_itself_in_one_paragraph: >-
        §5.0: «Мощность поймала это первым же вычитанием — цель перечисляет три поверхности и не
        имела ни одного держателя в переписи (Б10.4)». Три утверждения в одном предложении, и
        они несовместимы: строки не было ⇒ вычитать было нечего; тот же абзац сам говорит
        «перепись обходила §2, §6 и §7 и до §0 не доходила» ⇒ починка была ДОБАВЛЕНИЕМ ИСТОЧНИКА
        В ОБХОД, то есть описательной; а ссылка «(Б10.4)» атрибутирует находку РЕЦЕНЗЕНТУ
        прошлого круга. Заслуга формы здесь приписана задним числом.

    what_the_arithmetic_DID_buy_and_it_is_real: >-
      Форма нашла ЧЕТЫРЕ строки, чей состав расходился с нормой, и три из них не называл никто
      (Н17, Н22, Н36). Это первый круг из четырёх, где инструмент нашёл больше, чем рецензент.
      Отвергается не средство, а заявление о нём: оно закрыло ОДНУ зернистость — состав внутри
      СУЩЕСТВУЮЩЕЙ строки — и не закрыло ту, ради которой заводилось.
    fourth_of_the_four_was_named_after_all: >-
      Н32 круг по редакции 4 назвал — Б10.4, «ось „отказ по издателю без записи“ → Н32 (частный
      случай: наш издатель и отсутствие записи НАБОРА)». Верно «три не назывались никем», а не
      четыре. Число ничего не решает и потому важное, а не блокирующее (З1), но §1 того же
      документа требует предиката у каждой величины, а это — центральное свидетельство в пользу
      лекарства.

# ─────────────────────────────────────────────────────────────────────────────
blocking_findings:
  - id: Б14
    класс: >-
      состав множества, заданного ПРЕДИКАТОМ, расходится со своим примером и со своим
      производителем — и расхождение лежит в предикат-строке, где арифметики нет
    same_род_as_earlier_rounds: true
    род_history: >-
      Тот же род, что все шесть круга по редакции 2, Б7 круга по редакции 3 и Б10 круга по
      редакции 4: норма и её держатель расходятся ПО СОСТАВУ. ЧЕТВЁРТЫЙ РАЗ. Новое здесь одно:
      прежние три раза расхождение было в числе либо в наличии строки, а это — в предикате,
      то есть в единственном месте переписи, куда вычитание не дотягивается by construction.
    section: §2.5 (строки ~528–533) · строка Н24 · Ф1б-11
    subject: >-
      §2.5 определяет схлопываемое множество ПРЕДИКАТОМ — «всякая ошибка ПРОВЕРЯЮЩЕГО, не
      являющаяся неисправностью нашей посадки», — и это решение верно. Но рядом стоят ещё два
      утверждения о том же множестве, и все три несовместимы между собой.
    three_statements_that_disagree:
      - утверждение: >-
          ПРЕДИКАТ (§2.5): множество — ошибки ПРОВЕРЯЮЩЕГО. Отзыв проверяющим не производится:
          §2.3 ТОГО ЖЕ ДОКУМЕНТА говорит дословно «у края отзыв исполняет СЛОЙ authN … а
          проверяющий таких различий не производит».
        следствие: отзыв ВНЕ множества.
      - утверждение: >-
          ПЕРЕЧЕНЬ ПРИМЕРОВ (§2.5): «запись издателя отсутствует · подпись · адресат · тип ·
          срок · ОТОЗВАННОЕ УДОСТОВЕРЕНИЕ — приводится как ПРИМЕРЫ ВХОДОВ».
        следствие: отзыв ВНУТРИ множества.
      - утверждение: >-
          ОБОСНОВАНИЕ (§2.5): «сам перечень был у́же того, что продукт схлопывает и обязан
          схлопывать, — ОТЗЫВ ПРИХОДИТ В ТУ ЖЕ КОНСТАНТУ». Сказано о продукте, без названия
          поверхности.
        следствие: фактическое утверждение, и оно ПОВЕРХНОСТНО-ЗАВИСИМО.
    measurement:
      revision: PRO-Robotech/kacho @ origin/main 3f1471b413
      предикат: >-
        git show origin/main:gateway/internal/middleware/auth.go — ветви обеих поверхностей
        читаются подряд; константы описаний разрешены обходом:
        `git grep -hn 'revocationDenyDescription\s*=\|authFailedMsg\s*=' origin/main
         -- 'gateway/internal/middleware/*.go' ':!*_test.go'`
      таблица:
        - {ветвь: 'ошибка проверяющего', нативная_gRPC: 'authFailedMsg', REST: 'token validation failed'}
        - {ветвь: 'ОТЗЫВ', нативная_gRPC: 'authFailedMsg — СХЛОПНУТ', REST: 'revocationDenyDescription = "token revoked" — ОТДЕЛЬНЫЙ'}
        - {ветвь: 'привязка машинного токена', нативная_gRPC: 'authFailedMsg — СХЛОПНУТА', REST: '"sender-constrained token required" — ОТДЕЛЬНАЯ'}
        - {ветвь: 'источник набора не ответил', нативная_gRPC: 'codes.Unavailable, своя константа', REST: '503, своя константа'}
      вывод_замера: >-
        «Отзыв приходит в ту же константу» ВЕРНО на нативной gRPC и ЛОЖНО на REST. Сам код это
        и объявляет: комментарий ветви gRPC говорит «carries the same constant message (no
        varying text to read state off)», а ветвь REST кладёт собственное описание.
      зеркальная_половина_тоже_не_держится: >-
        §2.5 называет отказ по привязке машинного токена среди тех, что «ОБЯЗАНЫ отличаться».
        На нативной gRPC он БАЙТ-ИДЕНТИЧЕН отказу проверяющего. То есть утверждение «обязаны
        отличаться» ложно ровно для одной из двух поверхностей — при том что §2.5 сам
        постановил формулировать требование ПО ПОВЕРХНОСТИ, а не поперёк двух.
    why_the_subtraction_cannot_see_it: >-
      Н24 — предикат-строка. Её вклад в обе суммы — ноль. Никакое неравенство здесь
      невыразимо: расходятся не числа, а СОСТАВ множества, и расходится он с ПРИМЕРОМ и с
      ПРОИЗВОДИТЕЛЕМ, а не с числом держателя.
    why_it_is_substantive_and_not_editorial:
      - >-
        Держатель Ф1б-11 берёт ветви «ИЗ ПРОИЗВОДИТЕЛЯ: проба обходит ветви ошибки
        ПРОВЕРЯЮЩЕГО». Отзыв ветвью проверяющего не является ⇒ в перепись не попадёт ⇒
        «различных троек 1» останется зелёным при различимом отзыве на REST. Утверждение,
        которое документ делает о продукте, не может упасть НИ ОТ ЧЕГО.
      - >-
        Исполнитель, читающий перечень примеров буквально, подаст отзыв ветвью → перепись
        покраснеет на REST → и «починка» будет схлопыванием отзыва в общую константу, то есть
        ОТМЕНОЙ осознанного решения §2.2 («отозванное удостоверение — отказ удостоверению:
        вызывающему следует пройти вход заново»). Документ повёл бы правку против собственного §2.2.
      - >-
        Это ровно тот вред, ради которого §2.5 и заменял перечень предикатом: перечень
        «ловит ровно свои элементы и дрейфует». Здесь он не дрейфует — он ПРОТИВОРЕЧИТ
        предикату, стоящему двумя абзацами выше.
    what_is_NOT_wrong: >-
      Решение заменить перечень предикатом — верное, и круг его подтверждает. Поведение
      продукта защитимо на обеих поверхностях. Неверны ДВА предложения §2.5: пример и
      обоснование.
    remedy: >-
      Радиус — два предложения. (1) Снять «отозванное удостоверение» из перечня примеров либо
      назвать его прямо ВНЕ предиката, как уже названы привязка и отсутствующее удостоверение.
      (2) Обоснование «отзыв приходит в ту же константу» — либо снять, либо назвать поверхность
      («на нативной gRPC — да; на REST у него своё описание, и это решение §2.2»). (3) Фразу
      «отказы, которые обязаны ОТЛИЧАТЬСЯ» привести к поверхности: на gRPC они не отличаются, и
      это тоже решение, а не дефект.

  - id: Б15
    класс: >-
      держатель-перепись объявлен над НЕ ТЕМ населением, что его норма, и получившийся
      предикат готовности НЕДОСТИЖИМ иначе как переразметкой
    same_род_as_earlier_rounds: true
    род_note: >-
      Продолжение Б13 круга по редакции 4 («правило над открытым населением закрыто двумя
      точечными утверждениями»). Требуемая ФОРМА держателя доставлена — перепись, а не перечень,
      и это принимается целиком. Неверно её НАСЕЛЕНИЕ, и неверно в обе стороны сразу.
    section: §7 п. 6 (врезка) · строка Н49 · Ф1б-08
    what_was_asked_and_delivered: >-
      Круг по редакции 4 просил «перепись по населению с ДВУМЯ величинами рядом, падающую на
      пустом обходе». Редакция 5 даёт ТРИ величины — «величин в объявлении N · резолвится у края
      M · названо разменом здесь K», требование N = M + K, падение на пустом обходе, и оговорку
      «ось, названная разменом, из знаменателя не исчезает». Это лучше, чем просили.
    defect_one_population_narrower_than_the_rule:
      правило_§7_п_6: >-
        «величина, объявленная общей политикой, резолвится в неё У КАЖДОЙ ПОЛОСЫ; собственная
        константа или ручка поверхности — находка»
      строка_Н49_и_перепись: >-
        «резолвится в него У КРАЯ» · «резолвится у края M»
      следствие: >-
        Население правила двумерно (величины × полосы), население переписи одномерно (величины,
        только край). Первая конфигурация из-под держателя выпадает целиком. Сегодня она берёт
        обе названные величины — и именно поэтому выпадение невидимо: она покраснела бы МОЛЧА,
        перестав их брать, ровно как §6 п. 1 описывает про словарь гейта.
    defect_two_population_wider_than_the_subject:
      замер:
        revision: PRO-Robotech/corelib @ v1.5.0 (67cf5af5eca0), пин сверен по go.mod продукта
        объявление: corelib/tokenpolicy
        единица: >-
          экспортируемая именованная константа пакета, чьё значение — числовой литерал,
          выражение над time.* либо сумма таких же констант этого пакета
        величин_N: 14
        резолвится_краем_M: 4
        разбор_остальных_десяти:
          - {категория: 'своя константа того же предмета', сколько: 1, пример: 'окно вынужденного перезапроса — ось 1 самого §7 п. 6'}
          - {категория: 'предмет есть, величины у края НЕТ ВОВСЕ', сколько: 1, пояснение: 'край является принимающей ключи поверхностью; ни константы, ни ручки этого предмета у него нет — настоящая находка, и правило её ловит'}
          - {категория: 'ПРЕДМЕТА У КРАЯ НЕТ ВОВСЕ', сколько: 8, пояснение: 'край не чеканит токенов, не публикует и не снимает ключей, не держит удостоверений и не принимает подписанных утверждений клиента — ни своей константы, ни ручки по этим предметам нет'}
      следствие: >-
        N = M + K требует K = 9 при восьми величинах, у которых ПРЕДМЕТА У КРАЯ НЕТ. Размен —
        это ЦЕНА, которую платят; объявить разменом отсутствие предмета значит назвать ценой то,
        за что никто не платит. Предикат готовности оказывается недостижим иначе как
        переразметкой восьми неприменимых величин в фиктивные размены — то есть «закрываема ли
        линия» отвечает НЕТ by construction (ban #19), а форма закрытия становится ровно тем
        классом, который §2.5 этого же документа снял у себя: «требование без предмета
        неотличимо от исполненного».
    why_the_subtraction_cannot_see_it: >-
      Н49 — предикат-строка, вклад в обе суммы ноль. Больше того: инъекция показала, что СНЯТИЕ
      этой строки целиком тоже проходит вычитание молча (прогон 1). Правило, ради держателя
      которого заводилось Б13, защищено арифметикой ровно ни на сколько.
    remedy: >-
      Четвёртая величина в переписи и одно слово в строке. (1) «величин N · резолвится M ·
      ПРЕДМЕТА У КРАЯ НЕТ P · названо разменом K», требуется N = M + P + K — тогда неприменимое
      называется неприменимым, а не разменом, и величина, у которой предмет ПОЯВИТСЯ, уедет из
      P и уронит перепись сама. (2) Население привести к правилу: «у каждой полосы», то есть
      пара чисел печатается по КАЖДОЙ конфигурации порознь — сумма по двум конфигурациям
      запрещена по той же причине, по которой Ф1б-14 уже запрещает сумму по двум деревьям.

  - id: Б16
    класс: >-
      перепись объявляет о СЕБЕ «без держателя — 0», и этот ноль ЛОЖЕН — с обеих сторон:
      строка называет держателя, который её наблюдаемых не несёт, и норма объявленного
      источника не имеет строки вовсе
    same_род_as_earlier_rounds: true
    род_history: >-
      Это КОРНЕВОЙ род в его ИСХОДНОЙ форме — «норма объявлена, держателя нет», — тот самый,
      что отверг документ на редакции 2 шестью блокирующими. ЧЕТВЁРТЫЙ РАЗ. И он лежит ровно
      там, куда инъекция показала слепоту вычитания: в отсутствующей строке и в строке, чьё
      число сходится при несовпадающих множествах.
    why_it_is_the_heaviest_of_the_three: >-
      §6 п. 13 объявляет перепись ПРЕДИКАТОМ ПРОВЕРЯЕМОСТИ документа: «у каждого нормативного
      утверждения назван держатель, „без держателя“ — НОЛЬ». Круг идёт ПО ней и отдельно
      проверяет лишь то, чего в ней нет. Ложный ноль обесценивает не строку, а сам обход:
      следующий круг, доверившись ему, не посмотрит туда, где дыра.
    instances:
      - id: Б16.1
        subject: >-
          Н48 («ПРОФИЛИ и ШАБЛОН ЧАРТА края приведены тем же изменением», §6 п. 11, мощность
          2 · 2, держатель Ф1б-14). Тело Ф1б-14 не несёт НИ ОДНОГО из двух наблюдаемых.
        predicate: >-
          Тело сценария — строки 1609–1653. `grep -ci 'профил\|чарт\|шаблон'` по этому
          диапазону → 0. Прогнан дважды, независимо, двумя читателями; оба дали ноль.
        ближайшее_что_там_есть_и_почему_это_не_оно: >-
          «каждое МЕСТО ПИНА издателя, которого фаза коснулась, получает ИСХОД». Другое
          население (§1.4 определяет места пина как gateway/ плюс values*.yaml — шаблон чарта
          в этот путевой образец не входит) и другое свойство: «получает исход» — не
          «приведён тем же изменением». Плюс §1 источником переписи не объявлен вовсе.
        the_substance_is_partly_held_ELSEWHERE_and_the_row_does_not_say_so: >-
          Шаблон чарта держит гейт посадки (§6 п. 9, строка Н35, держатель вне §5). То есть
          законный исход здесь — АДРЕС на Н35, как уже сделано для §6 п. 2 и §6 п. 7. Его нет.
        why_the_subtraction_is_silent: 2 − 2 = 0 при пустом пересечении множеств.
      - id: Б16.2
        subject: >-
          Сценарий Ф1б-04 — ЕДИНСТВЕННЫЙ из шестнадцати, кого не называет держателем НИ ОДНА
          строка переписи. Его заголовок — объявленный источник нормы («Источников у него
          ПЯТЬ: … ЗАГОЛОВОК СЦЕНАРИЯ §5 …»), и он предписывает ДВА наблюдаемых, у которых нет
          ни строки, ни адреса.
        predicate: >-
          Счёт держателей по колонке переписи: Ф1б-11 ×10 · Ф1б-12 ×7 · Ф1б-09 ×7 · Ф1б-13 ×5 ·
          Ф1б-10 ×5 · Ф1б-01 ×5 · Ф1б-14 ×4 · Ф1б-09а ×3 · Ф1б-08 ×3 · Ф1б-06 ×3 · Ф1б-05 ×3 ·
          Ф1б-03 ×2 · Ф1б-02а ×2 · Ф1б-02 ×2 · Ф1б-07 ×1 · **Ф1б-04 ×0**. Сумма 62 вхождения
          при 52 строках (строки с двумя держателями). Воспроизведено независимо дважды.
        два_наблюдаемых_без_строки:
          - 'негодный адрес записи (пуст · одни разделители · не абсолютный) ⇒ отказ старта с указанием издателя и негодного адреса'
          - 'в ПРОИЗВОДСТВЕННОЙ ПОСАДКЕ незащищённая схема адреса набора отвергается — отдельная поверхность, а не переформулировка; и это свойство БЕЗОПАСНОСТИ: источник набора назван единственным якорем доверия проверки подписи'
        ближайшая_строка_про_другое: >-
          Н22 — «адрес записи ИЗ ИЗДАТЕЛЯ не выводится»: предмет там деривация адреса, здесь —
          его ГОДНОСТЬ. Разные наблюдаемые.
      - id: Б16.3
        subject: >-
          Ещё две половины объявленных заголовков без строки, тот же класс, меньший вес:
          Ф1б-03 («издатель без записи источника отвергает старт» и ЗЕРКАЛЬНЫЙ случай — запись
          есть, принимающего её издателя нет) — Ф1б-03 назван держателем дважды, и обе строки
          (Н22, Н23) про §2.5, а не про стража; Ф1б-05, вторая половина заголовка («наш
          издатель ВНЕ ПЕРЕЧНЯ принимаемых отвергает старт») — первая половина имеет Н04,
          вторая не имеет ничего, а Н15/Н16 держат соседнего стража, не этого.
        счёт_по_группе: >-
          Смысловых групп стражей старта пять; строку имеют две (Н02 вырожденный перечень,
          Н04 двойное объявление), одна покрыта наполовину (Н15 — авторитет отзыва), две не
          покрыты (годность адреса, привязка «издатель → источник»).
    why_this_is_exactly_what_the_injection_predicted: >-
      Прогоны 1 и 2 инъекции показали: снятая строка проходит вычитание побайтово как контроль.
      Б16.2 и Б16.3 — тот же случай, только строка не снята, а НЕ ЗАВЕДЕНА, и разницы для суммы
      никакой. Б16.1 — второй слепой случай: число сходится, множества пусты в пересечении.
      Предсказание инструмента и находка совпали, и это сильнее любой из них порознь.
    remedy: >-
      (1) Н48 — либо адрес на Н35 в теле §6 п. 11, либо утверждение в Ф1б-14; (2) Ф1б-04 —
      строка на обе его половины (вторая половина, производственная посадка, свою строку
      обязана иметь отдельно: это другая поверхность); (3) Ф1б-03 и Ф1б-05 — строка либо
      адрес; (4) и ГЛАВНОЕ, без чего первые три — снова три точечные правки: команда §5.0
      обязана печатать ЗНАМЕНАТЕЛЬ ОБХОДА, а не только числитель (см. раздел о лекарстве).

