    Четыре блокирующих круга по редакции 4 проверены ЗАМЕРОМ и ЧТЕНИЕМ ДЕРЕВА, а не прочтением
    документа: Б11 — перемером устройства композиционного корня, Б13 — переписью населения
    общего объявления политики, Б10 — поимённой сверкой состава у четырёх экземпляров, Б12 —
    проверкой утверждения «by construction».
