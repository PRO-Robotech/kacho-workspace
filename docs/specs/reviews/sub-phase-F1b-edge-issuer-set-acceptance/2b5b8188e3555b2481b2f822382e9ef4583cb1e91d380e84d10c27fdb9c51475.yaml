round_4_blockers_closure:
  - id: Б10
    класс: норма предписывает СОСТАВ, держатель покрывает его частично
    closed: true
    closed_by_form_and_by_substance_for_all_four_instances: true
    how_verified_per_instance:
      Б10.1_пять_причин: >-
        ЗАКРЫТО СМЕНОЙ ФОРМЫ, а не перечислением. Множество §2.5 задано предикатом «всякая
        ошибка проверяющего, не являющаяся неисправностью посадки», обе границы названы
        (шире — «прочие отказы authN», у́же — перечень из пяти), держатель стал ПЕРЕПИСЬЮ
        «ветвей подано N · различных троек описание · код · заголовок — 1», ветви берутся из
        производителя, на пустом обходе проба падает. Это ровно то, что круг просил, и в лучшей
        форме. Остаток по СОСТАВУ множества открыт отдельно как Б14 — он о примере и
        обосновании, а не о предикате.
      Б10.2_источник_материала: >-
        ЗАКРЫТО. Н18 = 2 · 2; §2.4 разводит положительную и отрицательную половины пронумерованным
        перечнем; Ф1б-10 несёт обе дословно, включая «непроверенная либо отсутствующая цепочка
        материала привязки НЕ ДАЁТ — токен выпускается БЕЗ привязки». Двойное отрицание (З8)
        снято. Область названа: обе половины живут в PRO-Robotech/kaname, и это сказано в теле
        сценария, а не только в §3.
      Б10.3_пара_конфигураций: >-
        ЗАКРЫТО. §7 п. 4 несёт таблицу из ТРЁХ величин (полоса прежнего издателя на крае — 2 ·
        наша на крае — 1 · первая конфигурация — 1, скаляр). Ф1б-07 утверждает две и НАЗЫВАЕТ
        АДРЕС третьей; Ф1б-13 утверждает третью и говорит, почему она здесь. Проверено чтением
        обоих тел: адреса встречные, дубля нет.
      Б10.4_два_неверных_адреса: >-
        ЗАКРЫТО обоими концами. Заведена Н50 (цель фазы, три поверхности, три держателя); Н32
        расширена с частного случая до формулировки оси и получила ТРИ держателя вместо одного.
        Арифметика таблицы «ось → строка» проверена заново: вхождений девять, различных осей
        семь, своих строк потребовали три — сходится.
    residue: >-
      Род закрыт для ЧИСЛОВЫХ строк. В предикат-строках он жив — Б14, Б15.

  - id: Б11
    класс: названный держатель структурно НЕ СПОСОБЕН упасть на том, ради чего назван
    closed: true
    how_verified: >-
      Опыт круга по редакции 4 принят целиком и воспроизведён в тексте без смягчения:
      «настоящее соединение» держателем БОЛЬШЕ НЕ ОБЪЯВЛЯЕТСЯ, средством названо монтирование
      обоих писателей заголовка плюс ЧТЕНИЕ ЗАГОЛОВКА ответа. Обе половины стоят и в §2.5, и в
      теле Ф1б-11 — то есть идущий по §5 механически их найдёт.
    the_third_half_is_named_as_WORK_and_the_claim_is_verified_in_the_tree: >-
      Документ говорит: «цепочка обязана собираться ОДНИМ выражением, которое зовут и
      композиционный корень, и проба; общего выражения сборки в дереве НЕТ, и его заведение
      есть работа фазы». Перемерено на 3f1471b413: цепочка собирается операторами внутри
      main.go (`inner = authzMW.HTTP(inner)`; `inner = authInterceptor.HTTP(inner)`), и ВСЕ 53
      файла каталога корня — package main, то есть чужая проба их не импортирует by
      construction. Утверждение верно.
    second_half_also_corrected: >-
      «Недостижим позиционно, а не структурно» теперь сказано УСЛОВНО и с условием: соседний
      слой не смонтирован ни на одном профиле, объект строится только при выставленной ручке,
      и требование сформулировано ВПЕРЁД. Это то, что круг просил.

  - id: Б12
    класс: цена решения названа и ЗАНИЖЕНА; второе следствие не названо
    closed: true
    how_verified: >-
      Оба смягчения СНЯТЫ и снятие объяснено таблицей «смягчение → почему снято». Названо, что
      различие доступно НЕ ПРЕДЪЯВИВШЕМУ годного удостоверения и сообщает ТЕКУЩЕЕ СОСТОЯНИЕ
      источника набора названного издателя, а не факт о таблице. Различие довода и цены
      проведено ровно там, где круг его требовал: «там ветвь ПОСЛЕ проверки подписи, здесь —
      ПЕРЕД». Решение объявлено ПОСТОЯННЫМ РАСШИРЕНИЕМ ПОВЕРХНОСТИ и вынесено отдельной строкой
      §7 п. 7 — то есть попало в единственное место, где размены читают целиком. Встречное
      требование Н44 оставлено и ограничивает цену.
    the_by_construction_claim_checked: >-
      «Перестановка порядка невозможна by construction — подпись проверяется тем самым ключом,
      который резолв и добывает» — ВЕРНО: проверки подписи без разрешённого ключа не существует
      как замысла. Утверждение при этом аккуратно сужено до ПОРЯДКА и на различимость не
      распространяется (см. З2 — там названа оставшаяся логическая слабина, важная, не блокирующая).

  - id: Б13
    класс: правило над ОТКРЫТЫМ населением закрыто двумя точечными утверждениями
    closed: partially
    what_is_closed: >-
      ФОРМА держателя доставлена и превзошла требуемое: перепись вместо перечня, три величины
      вместо двух, падение на пустом обходе, оговорка «ось, названная разменом, из знаменателя
      не исчезает, а переезжает в K», и прямое «две названные оси — ЭКЗЕМПЛЯРЫ правила, а не
      его держатель». Принимается целиком.
    what_is_open: >-
      НАСЕЛЕНИЕ переписи не совпадает с населением правила — у́же по полосам, шире по предмету;
      получившийся предикат недостижим иначе как фиктивными разменами. Открыто как Б15.

# ─────────────────────────────────────────────────────────────────────────────
writers_remeasured:
  предмет: >-
    Врезка §2.5 объявляет пару «формо-полно A = 9 : 8», «без писателя слоя прав A′ = 8 : 7»,
    и называет форму, о которой были слепы оба прежних предиката (построение статуса с
    последующим добавлением деталей).
  method: >-
    Независимый замер с ПУСТЫМ контекстом, ревизия та же — 3f1471b413. Обход ВСЕХ 106
    не-тестовых .go каталога gateway/ с нейтрализацией комментариев и строковых литералов;
    константы описаний разрешены обходом, локальная msg — ближайшим присваиванием вверх до func;
    на выходе «НЕРАЗРЕШЁННЫХ выражений: 0». Обратная сверка по пробам не дала ни одного текста,
    которого нет в переписи.
  units_named_separately_because_three_are_legitimate:
    производящих_мест: 27
    мест_выбирающих_текст: 38
    различных_текстов: {нативная_gRPC: 8, REST: 13, объединение: 16, общих: 5}
  verdict_per_surface:
    нативная_gRPC: >-
      СХОДИТСЯ ТОЧНО. 8 с писателем слоя прав, 7 без — ровно пара документа. Число 8, которым
      закрылась редакция 5, ВЕРНО, и поправка автора (7 → 8) подтверждается.
    REST: >-
      НЕ СХОДИТСЯ: документ даёт 9, замер — 13. Недостача 4.
  why_REST_is_short_and_it_is_the_SAME_class_the_document_is_about:
    - >-
      Предикат документа для REST сужен ПУТЕВЫМ ОБРАЗЦОМ до одного каталога, НЕ рекурсивно:
      `-- 'gateway/internal/middleware/*.go'`. Писатели 401 живут и вне его — проверено:
      `git grep -ln 'StatusUnauthorized' origin/main -- 'gateway/**/*.go' ':!*_test.go'`
      даёт два файла вне middleware/. Их описания в переписи документа отсутствуют.
    - >-
      Предикат ТРЕТЬЕЙ формы в той же врезке написан РЕКУРСИВНО (`gateway/internal/**/*.go`).
      То есть две половины ОДНОЙ единицы счёта считают по разной области — и разойтись обязаны
      были сразу.
    - >-
      Писателей на REST не три, как говорит врезка, а шесть: общий писатель отказа (12 вызовов)
      и пять самостоятельных, из них два не ставят WWW-Authenticate на 401 вовсе, а один кладёт
      в поле кода HTTP-статус вместо кода смысла. 11 из 23 мест, выбирающих текст, идут МИМО
      общего писателя.
  does_this_touch_the_CONCLUSION_of_the_врезка: >-
    НЕТ. Вывод — «одно и то же событие даёт на двух поверхностях разные байты: token validation
    failed против authentication failed» — замером подтверждён и от единицы не зависит. Документ
    сам это оговаривает, и оговорка верна.
  does_it_touch_unit_B_which_IS_load_bearing: >-
    НЕТ по существу и ДА по области. B = 1 на каждой поверхности — подтверждено: все ветви
    JWTVerifier.Verify сводятся в одну константу на каждой полосе. Но «1» посчитана тем же
    суженным обходом; переписи по ВСЕМУ дереву края, которую требует Ф1б-11 («точка приёма
    одна, и это предъявляется переписью ПО ДЕРЕВУ ПОВЕРХНОСТИ»), врезка не исполняет.
  severity: важное (З3), не блокирующее — вывод не опровергнут, а число врезки ничего не открывает

# ─────────────────────────────────────────────────────────────────────────────
important_findings:
  - id: З1
    subject: >-
      «Четыре не назывались никем» — верно ТРИ. Н32 круг по редакции 4 назвал в Б10.4 как один
      из двух неверных адресов. Число центральное: им обосновано, что форма нашла больше круга.
      Это по-прежнему верно, но на три, а не на четыре.
  - id: З2
    subject: >-
      §7 п. 7 объявляет размен ПОСТОЯННЫМ и обосновывает это тем, что «перестановка порядка
      невозможна by construction». Обоснование покрывает ОДИН из двух конъюнктов цены. Цена
      возникает из порядка И из решения РАЗВЕСТИ два отказа; порядок неотзываем, решение —
      отзываемо (его довод — §2.2, «не посылать арендатора чинить исправное»). Снять цену можно,
      не трогая порядка: схлопнув оба отказа в один. То есть «постоянный» следует не из
      построения, а из того, что довод §2.2 принят постоянным, — и сказать надо второе.
      Радиус — одно придаточное.
  - id: З3
    subject: >-
      Число REST во врезке §2.5 (9) занижено на 4 из-за нерекурсивного путевого образца, тогда
      как соседний предикат той же врезки рекурсивен. Разобрано выше.
  - id: З4
    subject: >-
      Н33 («край требует привязку от машинного принципала на ОБЕИХ поверхностях», мощность 2 · 2,
      держатель Ф1б-10). Тело Ф1б-10 говорит «предъявление токена машинного принципала БЕЗ
      привязки КРАЕМ отвергается» — поверхности не названы, наблюдаемое одно неразличённое.
      Соседнее предложение ТОГО ЖЕ сценария поверхности называет («проходит на обеих
      поверхностях», Н19), то есть автор различает, когда имеет в виду различие. Вычитание
      2 − 2 = 0 молчит. Не блокирующее по двум причинам: §6 п. 7 обе поверхности называет, а
      проба в дереве обе половины уже утверждает поимённо
      (`TestF1b10_EdgeRequiresBindingFromOurIssuersMachineTokens`, REST и gRPC, в обе стороны).
      Радиус — два слова.
  - id: З5
    subject: >-
      §0 объявлен ПЯТЫМ источником нормативных утверждений и получил ровно одну строку (Н50).
      Он перечисляет ЧЕТЫРЕ наблюдаемых: приём на обеих поверхностях края с тем же принципалом ·
      отказ издателю без записи · ключ одного издателя не проверяет токен другого · отзыв
      читается у нас и недоступность даёт отказ. Три последних — переформулировки Н32, Н22, Н28
      и потому строк не требуют (правило автора соблюдено), НО по его же правилу «Рода 2»
      половина, чей держатель в другом разделе, обязана нести АДРЕС в теле пункта. В §0 адресов
      нет ни одного. Это ровно тот дефект, который редакция 5 исправила в §6 п. 2 и §6 п. 7, —
      и он переехал в новый источник вместе с его добавлением.
  - id: З6
    subject: >-
      Наблюдаемая цель §0 говорит «проходит край на ОБЕИХ его поверхностях» — две. Строка Н50
      несёт мощность 3 («на каждой из трёх поверхностей»), включая плоскость данных реестра,
      которая краем не является. Завышение безопасно и держателя имеет, но норма и строка
      расходятся по составу в третий раз подряд в противоположную сторону — и вычитание к этому
      так же слепо, как к занижению.
  - id: З7
    subject: >-
      Возражение З2 круга по редакции 4 (второй репозиторий в §3 «Область») — ОТВЕЧЕНО и
      закрыто: Ф1б-14 называет оба дерева, требует переписи по каждому порознь и ЗАПРЕЩАЕТ
      сумму, назвав причину. Сверено с деревом: идентификаторы фазы в PRO-Robotech/kacho — 12,
      в PRO-Robotech/kaname — 1 (Ф1б-10), и половина Ф1б-10 действительно живёт во втором.
      Названо здесь потому, что прошлый круг поднимал это дважды.

  - id: З8
    subject: >-
      Н01 и Н34 держит ОДНО И ТО ЖЕ предложение Ф1б-11 («край поднимается и принимает токен
      прежнего издателя»). Н34 = {поднимается, работает} — покрыто. Собственное наблюдаемое Н01
      («множество МОЩНОСТИ 1 — это сужение, а не „принимаем любого“») не покрыто: Н32
      предъявляется в другом Given, где край поднят с ДВУМЯ издателями. Исходов два, и оба
      находка: либо двойной счёт (запрещён собственным правилом «переформулировка не
      считается»), либо наблюдаемое без держателя. Σ = 93 верна в обоих случаях.
  - id: З9
    subject: >-
      Н39 берёт источником ЗАГОЛОВОК Ф1б-02а («разбор объявления ОДИН, и его ЗОВУТ ОБА
      ЧИТАТЕЛЯ»), а в строку попала только первая половина. Вторая утверждается в теле (Then,
      «она зовёт ТОТ ЖЕ предикат, что исполнит процесс»), но строкой не названа — то есть её
      снятие не уронило бы ни таблицу, ни вычитание. Сценарий сам предупреждает об этом классе
      двумя абзацами ниже («вторая без первой есть ровно „тест, чей заголовок шире тела“»).
  - id: З10
    subject: >-
      §7 п. 3 называет держателем «второй реализации не заводится» перепись Ф1б-02а о РАЗБОРАХ
      ОБЪЯВЛЕНИЯ, тогда как предмет пункта — РЕАЛИЗАЦИИ ПРОВЕРКИ. Это разные предметы (§1.1
      меряет построения проверяющего, §3.1 п. 1 — разбор объявления). Обе переписи в Ф1б-02а
      есть по отдельности, и вторая требует N = 1, M = 2 — то есть держатель существует, а
      АДРЕС в §7 п. 3 ведёт не на ту перепись. Вычитание адресов не судит.
  - id: З11
    subject: >-
      Н03, второй элемент. Норма §2.1 — «у каждого своя ОБЪЯВЛЕННАЯ запись источника»
      (требование к объявлению, страж старта). Держатель Ф1б-06 утверждает «свой СНИМОК набора
      у каждой записи» — свойство времени выполнения, предмет Н27. Страж объявления живёт в
      Ф1б-03, которого строка не называет. 2 · 2 сходится, множества — нет.
  - id: З12
    subject: >-
      Н25 по СОБСТВЕННОМУ правилу мощности даёт 4, а не 3: «гейт держит ОБЕ конфигурации в
      области» — правило считает конфигурации, значит 2, плюс «запись снята» и «предикат снят»
      = 4. Разбор §6 п. 1 и держателя даёт 3 ({край в области · первая конфигурация в области ·
      поле снято}), где «запись послабления снята» — та же запись с другой стороны. Число верно
      только при разборе, ОТЛИЧНОМ от напечатанного в самой строке. Уверенность низкая,
      названо механически.
  - id: З13
    subject: >-
      Ось «отзыв, обе семантики недоступности» в таблице §6 п. 5 адресована на Н07 · Н11 · Н28,
      и НИ ОДНА из трёх мощностей не считает поверхности (1 · 2 · 3 — отказ, два кода, три
      свойства), тогда как §6 п. 5 называет ось «на ОБЕИХ поверхностях края». По существу
      держится — Ф1б-09 говорит «обе пары предъявляются на обеих поверхностях», — но из шести
      осей перечня пять несут поверхности в мощности, а эта не несёт ни в одной строке.

corroboration_by_independent_readers:
  method: >-
    Два читателя с ПУСТЫМ контекстом, запущенные до того, как я сформулировал свои находки:
    один мерил дерево (писатели отказа, население общего объявления политики), другой читал
    документ целиком и сверял все 52 строки правилом самого автора. Ни одному не сообщались
    мои выводы.
  what_converged_independently:
    - >-
      Обе стороны нашли РОД «число сходится, множества нет» — я на Н24 и Н49, второй читатель
      на девяти строках. Пересечение непустое: Н33 (мой З4 = его Р-3) и Н50 (мой З6 = его Р-1)
      названы обоими порознь. Совпадение двух РАЗНЫХ выражений по одному предмету — единственное
      дешёвое свидетельство, что ни одно не слепо.
    - >-
      Н48 я отложил как спорное, его предикат закрыл: ноль вхождений в теле держателя. Без
      второго читателя это осталось бы важным вместо блокирующего.
    - >-
      Ф1б-04 с нулём строк я не нашёл вовсе. Найдено счётом по колонке держателей — механическим
      обходом, которого я не делал, потому что шёл ОТ НОРМ К СТРОКАМ, а не от сценариев к строкам.
  and_this_is_itself_the_answer_to_the_remedy_question: >-
    Три находки из трёх пришли РАСХОЖДЕНИЕМ С ЧУЖИМ ЗАМЕРОМ, ни одна — перечитыванием своего.
    Четвёртый круг подряд детектор один и тот же: вторая независимая голова. Арифметика этого
    не заменила и заменить не могла — она сверяет два числа, написанные ОДНОЙ рукой.

