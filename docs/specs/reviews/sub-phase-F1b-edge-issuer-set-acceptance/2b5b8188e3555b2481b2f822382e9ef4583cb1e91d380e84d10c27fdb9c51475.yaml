cycle_convergence:
  by_round:
    редакция_2: {blocking: 6, экземпляров: 6, родов: 1}
    редакция_3: {blocking: 3, экземпляров: 3, родов: 3}
    редакция_4: {blocking: 4, экземпляров: 7, родов: 3}
    редакция_5: {blocking: 3, экземпляров: 7, родов: 1}
  both_units_named_because_one_alone_lies:
    блокирующие: 6 → 3 → 4 → 3
    экземпляры: 6 → 3 → 7 → 7
    родов_за_круг: 1 → 3 → 3 → 1
  ряд_убывает_по_блокирующим_и_ПЛОСКИЙ_по_экземплярам: true
  и_вот_почему_эти_два_числа_расходятся: >-
    Экземпляры считать ПОПЕРЁК КРУГОВ нельзя, и это надо сказать прямо, а не спрятать за
    «стало не хуже». ИНСТРУМЕНТ СМЕНИЛСЯ: круг по редакции 4 вёл один читатель, этот —
    три независимых обхода (мой, плюс два читателя с пустым контекстом: перепись дерева и
    сплошной обход документа его же правилом), плюс инъекция над командой автора. Больший
    улов при том же документе означает более чувствительный прибор, а не более дефектный
    текст. Сравнимо здесь только ОДНО число — блокирующих, и оно убывает.
  родов_за_круг_убыло_до_одного: >-
    На редакциях 3 и 4 отвергали ТРИ разных рода (состав · неспособный упасть держатель ·
    занижённая цена). Этот круг отвергает ОДИН — «норма и держатель расходятся по составу», —
    во всех трёх его блокирующих. Два рода прошлого круга (Б11, Б12) закрыты и не вернулись.

  # ── Ответ на прямой вопрос: наступил ли род ЧЕТВЁРТЫЙ раз ──────────────────
  same_род_fourth_time:
    answer: ДА
    statement: >-
      РОД «НОРМА И ЕЁ ДЕРЖАТЕЛЬ РАСХОДЯТСЯ ПО СОСТАВУ» ОТВЕРГАЕТ ДОКУМЕНТ ЧЕТВЁРТЫЙ РАЗ ПОДРЯД.
      Оба экземпляра этого круга — Б14 и Б15 — лежат в ПРЕДИКАТ-СТРОКАХ, то есть в единственных
      четырёх строках переписи, где арифметики нет by construction.
    but_it_moved_and_that_is_measurable: >-
      Прежде род жил в числовых строках и в отсутствующих строках. Числовые строки он покинул —
      выборка из шестнадцати не дала ни одного занижения. Осталось ровно то, до чего вычитание
      не дотягивается. Это не «то же самое место»: класс вытеснен в остаток, и остаток назван.

  # ── Ответ на прямой вопрос: СОШЁЛСЯ ЛИ ЦИКЛ И ЧЕМ ─────────────────────────
  did_the_cycle_converge:
    answer: >-
      ЧАСТИЧНО, И РАЗДЕЛЕНИЕ ЗДЕСЬ И ЕСТЬ ВЫВОД: арифметика терминировала СВОЮ зернистость и
      не терминировала класс. Оставшееся закрыл бы ещё один круг внимательности — и это ровно
      то, чего лекарство обещало избежать.
    what_the_arithmetic_DID_terminate:
      - >-
        состав внутри СУЩЕСТВУЮЩЕЙ строки — на любой глубине, а не на той, на которой написано
        средство. Доказано прогоном 3 инъекции: неравенство краснеет и называет координату;
      - >-
        и терминировала ИЗМЕРИМО: форма нашла четыре расхождения, три из которых не назвал никто
        за три круга. Первый круг из четырёх, где инструмент опередил рецензента.
    what_it_did_NOT_and_CANNOT_terminate:
      - >-
        ОТСУТСТВУЮЩУЮ СТРОКУ — то есть корневой предмет рода. Сумма по строкам не видит строки,
        которой нет; прогоны 1 и 2 инъекции побайтово равны контролю. Четыре из тринадцати
        расхождений «первого прогона» нашёл ОБХОД, а не вычитание, и это видно в таблице самого
        автора;
      - >-
        ПРЕДИКАТ-СТРОКИ — они вносят ноль в обе суммы. Оба блокирующих этого круга здесь.
    therefore_the_answer_to_the_authors_own_question: >-
      Автор написал: «если следующий круг найдёт расхождение того же рода МИМО вычитания —
      значит арифметика тоже описательна». Расхождение найдено, и не одно. Но вывод точнее
      авторской формулировки: арифметика НЕ описательна — она честно механична в своей области,
      и область у неё УЖЕ предмета. Заменять её не надо; надо назвать её границу и закрыть
      остаток вторым, тоже механическим средством.
    what_would_close_the_remainder_mechanically: >-
      Не третье указание, как обходить, и не четвёртая колонка. Два хода, оба того же рода, что
      уже применены в этом же документе: (1) ЗНАМЕНАТЕЛЬ ОБХОДА — команда печатает не только
      «строк 52», но и «абзацев-источников осмотрено N · из них имеющих строку либо адрес M»,
      выводя N из §0/§2/§6/§7 механически и падая при N = 0; тогда отсутствующая строка даёт
      неравенство, а не молчание. Ровно эту форму документ УЖЕ требует от Ф1б-01 («проверок в
      объявлении N · предъявлено N»), от Ф1б-14 («сценариев N · найдено M») и от Ф1б-08
      («величин N · резолвится M»), — к самой переписи он её не применил. (2) ПРЕДИКАТ-СТРОКА
      обязана нести в четвёртой колонке не только слово «предикат», но и ИМЯ ВЕЛИЧИН своей
      переписи, а команда — проверять, что держатель их называет; сегодня строка, у которой
      написано «предикат», неотличима от строки, у которой написано «предикат» и ничего за ним
      не стоит.
    honest_caveat: >-
      Второй ход этот круг НЕ проверял на исполнимость и предписанием не является — он назван
      как направление, потому что «ещё один круг внимательности» направлением не является.

  is_the_predmet_missing: >-
    НЕТ. Случай «круг не запускается там, где предмета ещё нет» не наступает: у обоих
    блокирующих производитель измерен и существует в дереве, дерево ОПЕРЕЖАЕТ документ, ни одна
    правка не ждёт чужой задачи, число блокирующих УБЫВАЕТ. Радиус пятого круга — два
    предложения §2.5, одна величина в переписи §7 п. 6, одно слово в строке Н49 и два слова в
    Ф1б-10. Ни одно не меняет области фазы и ни одно не требует переписывать §5, §6 или §7.
  therefore_this_is_a_ROUND_and_not_a_pause: true

