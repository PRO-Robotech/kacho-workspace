what_this_review_does_not_cover:
  - >-
    ОБЛАСТЬ ЗЕЛЁНОГО НАЗВАНА УЗКО. Прогонов проб фазы в этом круге НЕ БЫЛО ВОВСЕ: ни одного
    `go test`. Круг читал документ, исполнял его собственную команду сверки, ставил инъекцию над
    этой командой в изолированной копии и мерил ДЕРЕВО чтением `git show` / `git grep` по
    прибитым ревизиям. О поведении развёрнутого края здесь не сказано ничего; стенд не поднимался.
  - >-
    ВЕРНОСТЬ ДЕРЖАТЕЛЯ ПО СУЩЕСТВУ не проверялась там, где проверялось совпадение СОСТАВА: у 16
    строк выборки установлено, что названный сценарий несёт наблюдаемые своей нормы поимённо, а
    не что они верны о продукте. На это отвечает прогон.
  - >-
    Тридцать шесть строк переписи из пятидесяти двух в выборку не вошли. «Расхождений нет» сказано
    о шестнадцати, а не о пятидесяти двух; о прочих не известно ничего, и это названо, потому что
    иначе выборка читалась бы как перепись.
  - >-
    Замер писателей и замер величин политики выполнены НЕЗАВИСИМЫМИ читателями с пустым
    контекстом; их числа я принял, проверив КЛЮЧЕВЫЕ своими командами (форма объявления шести
    констант · путевой образец врезки · два файла-писателя вне middleware/ · три лишних текста
    REST). Остальное их вывода воспроизведено не было и здесь помечено как их замер, а не мой.
  - >-
    Находки о ПРИЗЕМЛЁННОМ КОДЕ предметом этого документа не являются и вердикта не образуют.
    Записано, чтобы знание не пропало с сессией: третья категория отрендерена отказом подлинности
    на одной из полос REST при том, что соседняя той же природы отвечает иначе и объявляет себя
    образцом; поле кода у одного писателя несёт HTTP-статус вместо кода смысла; два писателя не
    ставят WWW-Authenticate на 401; тексты отказа подлинности не закреплены ни одной пробой края,
    хотя тон объявлен частью контракта. Ни одно из перечисленного в приёмку не просится.
  - >-
    Задач в трекере по прямому запрету владельца не заведено НИ ОДНОЙ.
  - >-
    Публичность репозиториев соблюдена намеренно: ни одна находка не собирает в одном месте
    координату, условие недействия защиты и следствие для постороннего. Там, где требование
    формулируется без первой части, приведён предикат переписи, а не рецепт.

