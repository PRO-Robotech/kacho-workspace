three_limits_check:
  question: действительно ли у трёх названных пределов нет машинного предиката
  предел_1:
    имя: норма в исключённом пункте, не названная строкой
    молчание_подтверждено: 'Р12 (§1) — на своём входе, отличном от И9'
    предикат_есть_и_не_заведён: >-
      НА ПОЛОВИНУ. «Является ли предложение нормой» предиката не имеет — это верно. Но «изменился
      ли предмет записи ведомости с тех пор, как её вынесли» предикат имеет: отпечаток содержимого
      исключённого источника, закреплённый в записи. Прототип: отпечатки шести исключённых
      источников сняты на контроле; Р12 → красное ['§1'], контроль и Р5 → зелено. Это ровно
      самоистечение, которое документ обещал в редакции 6 и снял как невозможное, и ровно норма
      change-graph §2 (вердикт привязан к отпечатку, а не к имени).
    цена_названа: >-
      Для 4 записей из 6 (§1 — 104 строки, §3.2 — 7, §4 проза — 6, §6 п. 13 — 28) цена мала. Для
      §5 (1515 строк) и преамбулы (310 строк, журнал правится каждой редакцией) отпечаток краснел
      бы на всякой правке: на Р3 он покраснел ['§5'], потому что сама перепись лежит внутри §5.
  предел_2:
    имя: согласованная правка обоих концов
    предикат: >-
      надёжного нет — согласен. Лексическое сходство текста строки и пункта корпус уже испытывал
      на естественном языке и отверг (security-disclosure.md). Выборка по существу: 3 пункта
      (§4 п. 6, §4 п. 7, §3.3), 9 адресов — все верны.
    сосед_без_имени: >-
      ОДНО-КОНЦЕВАЯ подмена ДОМА (Р3) — не согласованная правка, а правка одного конца, и она
      молчит, потому что у дома второго конца нет. Предикат выразим той же формой, что у повтора:
      адрес строки в теле дома. Замер: домов, уже несущих адрес своей строки, 23 из 54; не несут 31.
  предел_3:
    имя: верность держателя по существу
    предикат: 'смысловой половины внутри документа нет — согласен'
    сосед_без_имени: >-
      ОДНО-КОНЦЕВАЯ подмена держателя (Р11) молчит. Предикат выразим формой З14, которую автор
      построил для мест и не применил к держателям: тело сценария называет свою строку. Замер: пар
      «строка → держатель» 69, тело сценария уже называет строку в 26, не называет в 43. Утверждение
      «чем виден: ничем внутри документа» шире верного.

