# ─────────────────────────────────────────────────────────────────────────────
# ПЕРВЫМ: факт, на котором молчат ВСЕ оси
# ─────────────────────────────────────────────────────────────────────────────
fact_where_all_axes_are_silent:
  answer: >-
    НАЙДЕН — тринадцать одно-фактных прогонов из четырнадцати моих молчат на всех осях: у
    двенадцати вывод ПОБАЙТОВО равен контролю, у тринадцатого (Р1) сдвигаются только две
    печатаемые суммы при пустых списках всех осей и коде 0. Одиннадцать из тринадцати лежат ВНЕ
    трёх пределов, которые документ объявил полным перечнем.
  тяжелейший: >-
    Р5 — в тело §2.3 вписано НОВОЕ нормативное утверждение о продукте («край обязан отвергать
    токен без `kid` на обеих поверхностях одним отказом»). Вывод побайтово равен контролю, код 0.
    Близнец Р5т — то же предложение новым пунктом §6 п. 14 — краснеет `без держателя ['§6 п. 14']`.
    Одно-фактное различие между ними — ГДЕ лежит норма: в источнике, у которого уже есть строка,
    либо в новом. Держащихся источников 47 из 53; значит знаменатель A видит новую норму в
    меньшинстве случаев, а §6 п. 13 объявляет ноль «у каждого нормативного утверждения всех
    разделов». Это блокирующее Б19.
  второй_по_тяжести: >-
    Р1 — у строки Н28 (норма над ЗАКРЫТЫМ населением, мощность `3 · 3`) мощность заменена словом
    `**предикат**`. Строка выходит из вычитания без единой находки: Σ 102 → 99 с обеих сторон,
    «предикат-строк» 5 → 6, все списки пусты, код 0. Строка-исключение из арифметики не
    загейчена ничем — ровно тот класс, что Б17 нашёл у ведомости, опустившийся на уровень строки,
    при том что §5.0 прозой объявляет перечень предикат-строк («пять: Н17, Н24, Н40, Н49, Н59»)
    и с колонкой его не сверяет.

