my_own_injection:
  method: >-
    Изолированная копия документа в каталоге сессии вне любого репозитория; на каждый прогон —
    свежая копия и команда, извлечённая ИЗ САМОЙ КОПИИ (блок со словом ЧИСЛИТЕЛЬ). Каждый прогон
    отличается от контроля одним фактом; у каждого отрицательного — близнец, отличающийся одним
    фактом и краснеющий, иначе молчание не отличить от смерти оси. Ни один прогон не повторяет
    И1–И47 редакции 7 и М1–М9 круга по редакции 6. Семантика отрисовки прогонов Р6, Р6h, Р7, Р8
    проверена разбором markdown-it 3.0.0 в режиме commonmark: «Приложение» — заголовок h1, пункт 8
    — видимый пункт списка между двумя блоками кода, сценарий — видимый абзац во врезке.
  runs:
    - id: Р0
      факт: контроль, копия не тронута
      код: 0
      вывод_равен_объявленному: true
    - id: Р1
      факт: 'Н28: мощность `3 · 3` → `**предикат**` (норма над закрытым населением объявлена открытой)'
      вывод: 'строк 59 Σ предписано 99 Σ утверждается 99 предикат-строк 6 расхождения []; все списки пусты'
      код: 0
      молчат_все_оси: true
    - id: Р2
      факт: 'Н05: держатель `Ф1б-11` заменён словами «вне §5» — держатель НЕ НАЗВАН'
      код: 0
      вывод_равен_контролю: true
      опровергает: >-
        §5.0 «Держатель вне §5 — законный исход, но обязан быть НАЗВАН» и строку 19 перечня 22
        («строка без того и другого — находка»): предикат — подстрока `вне §5` в ячейке.
    - id: Р3
      факт: 'Н12: дом `§2.2` → `§2.4` — чужой, существующий и держащийся подраздел'
      код: 0
      вывод_равен_контролю: true
      механизм: >-
        У дома второго конца нет («дом адреса в теле не требует: строка написана из него»), а у
        прежнего дома остаются семь других строк. Одно-концевая подмена места в колонке.
    - id: Р4
      факт: 'Н27: в ячейку нормы дописано третье законное сочетание, мощность `4 · 4` не тронута'
      код: 0
      вывод_равен_контролю: true
      опровергает: >-
        §5.0, таблица «что средство терминировало»: «состав внутри существующей строки — на любой
        глубине». Доказательство там (прогон 3/4) меняло ЧИСЛО, а не СОСТАВ; оба числа пары
        `a · b` проставлены одной рукой в одной ячейке, и вычитание сравнивает их между собой, а
        не с текстом нормы.
    - id: Р5
      факт: 'в тело §2.3 (держится строками Н11, Н13–Н17) вписана НОВАЯ норма о продукте'
      код: 0
      вывод_равен_контролю: true
    - id: Р5т
      факт: 'близнец Р5: то же предложение новым пунктом §6 п. 14'
      вывод: "без держателя ['§6 п. 14']"
      код: 1
    - id: Р6
      факт: 'раздел «Приложение» с нормой, заголовок Setext (строка `=====` под текстом), в конце §5'
      код: 0
      вывод_равен_контролю: true
    - id: Р6т
      факт: 'близнец Р6: тот же раздел, заголовок ATX `# Приложение…`'
      вывод: "без раскладки ['Приложение: требования к краю']"
      код: 1
    - id: Р6h
      факт: 'тот же раздел, заголовок HTML `<h1>…</h1>`'
      код: 0
      вывод_равен_контролю: true
    - id: Р7к
      факт: 'в конец §7 добавлены два примера-блока `~~~`, каждый показывает строку ```` ``` ````; между ними пусто'
      код: 0
      вывод_равен_контролю: true
      роль: сами блоки нейтральны — различие Р7 против Р7к ровно одна строка пункта
    - id: Р7
      факт: 'то же, и между блоками пункт `8.` с нормой о продукте'
      код: 0
      вывод_равен_контролю: true
      механизм: >-
        Прибор переключает «блок кода» на КАЖДОЙ строке, начинающейся с ``` или ~~~; CommonMark
        закрывает блок только забором того же знака и не меньшей длины. Строка ``` внутри
        блока `~~~` для прибора — граница, для отрисовки — содержимое; пункт 8 между блоками
        читателю виден, прибору — нет.
    - id: Р7т
      факт: 'близнец Р7: в блоках слово «пример» вместо строки забора'
      вывод: "без держателя ['§7 п. 8']"
      код: 1
    - id: Р8
      факт: 'новый сценарий `Ф1б-17` во врезке `> ` в конце §5; ни одна строка его не называет'
      код: 0
      вывод_равен_контролю: true
      опровергает: >-
        строку 12 перечня 22 («похожий, но не узнанный заголовок сценария — находка»): оба
        образца — узнанный и `неузнанная разметка` — требуют начала строки, и префикс врезки
        выводит сценарий из-под обоих.
    - id: Р8т
      факт: 'близнец Р8: тот же сценарий без `> `'
      вывод: "не названы ['Ф1б-17']"
      код: 1
    - id: Р10
      факт: 'Н07: из «где объявлена» снят повтор `§6 п. 5` — пункт держится ещё девятью строками'
      вывод: "код 0; единственный сдвиг — в ось адрес-ссылка добавлено '§6 п. 5→Н07'"
      код: 0
      говорит_только_печатью: true
    - id: Р11
      факт: 'Н12: держатель `Ф1б-09` → `Ф1б-10` — существующий и названный другими строками'
      код: 0
      вывод_равен_контролю: true
      в_пределе: предел 3 (верность держателя) — см. three_limits_check
    - id: Р12
      факт: 'в §1 (исключён ведомостью целиком) вписана норма о продукте'
      код: 0
      вывод_равен_контролю: true
      в_пределе: предел 1, на своём входе (И9 автора — §6 п. 13, здесь — §1)
    - id: Р14
      факт: 'раскладка: ПЕРЕД строкой `§2 | подраздел` добавлена `§2 | раздел целиком` — одному разделу две единицы'
      код: 0
      вывод_равен_контролю: true
      механизм: 'раскладка читается в dict — побеждает последняя строка, противоречие не видно'
    - id: Р14т
      факт: 'близнец Р14: та же лишняя строка ПОСЛЕ настоящей'
      вывод: "без держателя ['§2'] · места нет — 29 элементов"
      код: 1
    - id: Р15
      факт: 'ведомость: запись `§1` повторена второй строкой с другим основанием'
      код: 0
      вывод_равен_контролю: true
      механизм: 'ведомость читается во множество — повтор схлопывается'
