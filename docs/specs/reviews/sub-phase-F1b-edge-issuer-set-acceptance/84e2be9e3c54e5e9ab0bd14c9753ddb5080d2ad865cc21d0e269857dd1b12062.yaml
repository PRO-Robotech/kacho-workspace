twenty_two_values_check:
  claim: >-
    §5.0 и журнал: «двадцать две величины, все выведены либо сверены; двадцать одна доказана
    прогоном».
  method: >-
    Выборка 11 строк перечня своим выражением: подменить ДЕРЕВО и посмотреть, сдвинется ли
    величина. Выведенная обязана сдвинуться; сверенная — дать находку при расхождении сторон.
  результаты:
    - {строка: 2, 'величина': 'граница блока кода', 'подмена': 'Р7', 'исход': 'НЕ выведена: правило прибора ≠ правило CommonMark, скрытая норма'}
    - {строка: 4, 'величина': 'набор разделов из всех заголовков # и ##', 'подмена': 'Р6, Р6h', 'исход': 'НЕ сдвинулась: заголовок Setext и HTML в набор не входят и находкой не становятся'}
    - {строка: 5, 'величина': 'имя раздела ## §N любой ширины', 'подмена': 'Р17', 'исход': 'выведена — сдвинулась и покраснела'}
    - {строка: 6, 'величина': 'единица источника из таблицы раскладки', 'подмена': 'Р14', 'исход': 'НЕ сверена: две единицы одному разделу — молчание'}
    - {строка: 9, 'величина': 'текст между единицами', 'подмена': 'Р16', 'исход': 'выведена — сдвинулась и покраснела (имя см. З22)'}
    - {строка: 12, 'величина': 'заголовок сценария', 'подмена': 'Р8', 'исход': 'НЕ сверена: похожий заголовок во врезке — не находка'}
    - {строка: 13, 'величина': 'ведомость P', 'подмена': 'Р15', 'исход': 'НЕ сверена: повтор записи схлопнут молча'}
    - {строка: 14, 'величина': 'мощность N · M либо предикат', 'подмена': 'Р1, Р4', 'исход': 'НЕ сверена: выбор «число или предикат» ни с чем не сверяется; N не выводится из текста нормы'}
    - {строка: 16, 'величина': 'дом и повтор', 'подмена': 'Р3, Р10', 'исход': 'сверена ТОЛЬКО у повтора и только кодом при одиночном держателе'}
    - {строка: 19, 'величина': 'держатель строки', 'подмена': 'Р2', 'исход': 'НЕ сверена: «вне §5» — подстрока, имя не требуется'}
    - {строка: 21, 'величина': 'единственность имени', 'подмена': 'Р14, Р15', 'исход': 'единственность не распространена на ключи двух таблиц, хотя они — такие же ключи сопоставления'}
  итог: >-
    Из 11 проверенных строк держатся подменой 2 (5, 9), не держатся 9. Утверждение «все двадцать
