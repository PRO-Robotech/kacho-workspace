blocking_findings:
  - id: Б19
    класс: >-
      ДВА НОЛЯ ПЕРЕПИСИ — О ЗАПИСАННОМ, А ОБЪЯВЛЕНЫ О ПРИСУТСТВУЮЩЕМ: «без держателя — ноль»
      считает источники, а объявлен о каждом нормативном утверждении; «расхождения — ноль»
      сравнивает два числа одной руки, а объявлен терминирующим состав на любой глубине
    same_род_as_earlier_rounds: true
    section: §6 п. 13 · §5.0 таблица знаменателей («что ловит») · §5.0 таблица «что средство терминировало»
    что_объявлено:
      - >-
        §6 п. 13: «у каждого нормативного утверждения всех разделов и заголовков §5 назван
        держатель, «без держателя» — НОЛЬ»; «перепись отвечает: не объявлено ли нормой то, чего
        никто не проверяет». Редакция 7 расширила область с «§0, §2, §6, §7» до «всех разделов».
      - '§5.0: знаменатель A «ловит норму, у которой строки не завели».'
      - '§5.0: арифметика терминировала «состав внутри существующей строки — на любой глубине».'
    что_измерено:
      - >-
        Р5: новое нормативное утверждение в §2.3 — вывод побайтово равен контролю; близнец Р5т
        (то же предложение в новом пункте) краснеет. Прибор судит ИСТОЧНИК: из 53 источников 47
        держатся, и в любом из них новая норма без строки невидима. Названный предел 1 покрывает
        только исключённые — 6 из 53.
      - >-
        Р4: в ячейку нормы существующей строки дописано наблюдаемое, мощность `4 · 4` не тронута —
        вывод равен контролю. «Предписано» проставлено рукой и с текстом нормы не сверяется ничем.
    почему_блокирующее: >-
      Тот же класс, что Б16 и Б18 — ноль у́же, чем читается, — и на этот раз в пункте
      определения готовности. §6 п. 13 в нынешней формулировке неизмерим своей же командой:
      команда меряет другое. Следующий круг, доверившись нолю, не прочтёт держащиеся источники —
      а они и есть основная масса документа.
    ошибка_роли_названа: >-
      Формула «терминировала состав внутри существующей строки на любой глубине» пришла в
      документ из записи круга по редакции 5 — моей роли. Доказательство там меняло число, а не
      состав; утверждение было шире доказанного, и автор его унаследовал. Р4 его опровергает.
    remedy_варианты_а_не_предписание:
      - >-
        (1) Минимум, достаточный для снятия: §6 п. 13 и §5.0 говорят «у каждого ИСТОЧНИКА» и
        «мощность проставлена рукой»; к пределам добавлены два с населением числом — «новое
        утверждение в держащемся источнике (47 из 53)» и «новое наблюдаемое в ячейке строки» —
        оба о смысле, оба видны только читателю.
      - >-
        (2) Если нужен механизм — отпечаток держащегося источника в строках, которые его
        называют: правка источника требует переподтвердить его строки. Цена — переподтверждение
        при всякой правке §2/§6; решает автор.
    radius: два абзаца §5.0, один пункт §6, две строки таблицы пределов

  - id: Б20
    класс: >-
      ОПИСАНИЕ ПРИБОРА САМИМ СОБОЙ ЛОЖНО, И НА ЭТОТ РАЗ — В УТВЕРЖДЕНИИ О ПОЛНОТЕ: «перечень
      пределов ПОЛНЫЙ», «три предела, все о смысле, а не о форме», «разметка, которой прибор не
      знает, — находка», «все двадцать две выведены либо сверены»
    same_род_as_earlier_rounds: true
    section: §5.0 «Чего знаменатель НЕ делает» · §5.0 «Чем задана сама перепись» · журнал редакции 7 (строка З17)
    предикат_опровержения: >-
      Девять одно-фактных прогонов о ФОРМЕ, не о смысле, молчат на всех осях, у каждого близнец
      либо положительный контроль краснеет:
    экземпляры:
      - {id: Р6, 'форма': 'заголовок Setext', 'предикат выразим': 'строка из `=` или `-` под непустой строкой — неузнанная разметка'}
      - {id: Р6h, 'форма': 'заголовок HTML', 'предикат выразим': '`<h1`…`<h6` вне кода — неузнанная разметка'}
      - {id: Р7, 'форма': 'забор ~~~ со строкой ``` внутри', 'предикат выразим': 'граница блока — тем же знаком и не короче открывающего (CommonMark)'}
      - {id: Р8, 'форма': 'заголовок сценария во врезке', 'предикат выразим': 'допустить префикс `>` в образце неузнанной разметки'}
      - {id: Р14, 'форма': 'повтор ключа раскладки', 'предикат выразим': 'единственность ключа таблицы — как у имени источника'}
      - {id: Р15, 'форма': 'повтор записи ведомости', 'предикат выразим': 'то же'}
      - {id: Р1, 'форма': 'строка объявляет себя предикатом', 'предикат выразим': 'перечень предикат-строк объявлен прозой («пять: Н17, Н24, Н40, Н49, Н59») — сверить с колонкой в обе стороны'}
      - {id: Р2, 'форма': 'держатель «вне §5» без имени', 'предикат выразим': 'объявленных держателей вне §5 два — сверить имя с перечнем'}
      - {id: Р3, 'форма': 'одно-концевая подмена дома', 'предикат выразим': 'адрес строки в теле дома (31 из 54 домов его сегодня не несут)'}
    почему_блокирующее:
      - >-
        Тот же класс, что Б17: свойство, которое инструмент себе приписывает, опровергнуто
        одно-фактным опытом. Там — «самоистекает», здесь — «полон».
      - >-
        Утверждение о полноте отменяет обход: следующий круг читает «перечень ПОЛНЫЙ» и не
        смотрит на формы. Этот круг посмотрел — и нашёл девять за одну выборку.
      - >-
        Слово «все» в утверждении о приборе над прозой опровергается одним элементом вне его
        перечня. Шесть кругов подряд род находил именно такой элемент.
    remedy_варианты_а_не_предписание:
      - >-
        (1) Сходящийся вариант: утверждение о приборе ОГРАНИЧИТЬ ПЕРЕЧНЕМ, а не квантором. Назвать
        узнанное подмножество разметки (заборы ``` без вложенности, заголовки ATX `#`/`##`/`###`,
        пункты `N.`/`Nх.` с отбивкой продолжения, строки `| Нxx |`, `**ID:` в начале строки,
        скрытый текст `<!--`) и сказать: вне перечня — вне прибора. Ограниченное утверждение
        опровергается только внутри своего перечня, а там его держит инъекция.
      - >-
        (2) Дешёвые из девяти закрыть кодом — единственность ключей обеих таблиц, перечень
        предикат-строк, имя держателя вне §5, узнавание Setext/HTML-заголовков и забора по знаку и
        длине: каждое — строка-две команды и прогон с близнецом.
      - >-
        (3) Дом (Р3) — либо второй конец, либо поимённо в пределах; «строка написана из него» —
        довод, а не проверка.
    radius: абзац «Чего знаменатель НЕ делает», таблица 22, строка З17 журнала; код — по выбору автора

