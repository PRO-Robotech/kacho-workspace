disputes_resolved:
  - предмет: возражение автора против средства З14, предложенного прошлым кругом
    позиция_автора: >-
      Засчитывать адрес при совпадении источника строки и пункта дало бы четыре ложных находки;
      неверной была колонка с одним местом, а не правило.
    вердикт: ПРИНЯТО — опровергнуто замером в пользу автора, а не уступлено
    чем: >-
      колонка несёт теперь все места (75 в 41 строке, мой предикат дал те же числа), и у четырёх
      пунктов, покрытых прежде только адресом, строки называют их местами повтора.

# ─────────────────────────────────────────────────────────────────────────────
род_and_ряд:
  род_наступил_шестой_раз: ДА
  где_теперь: >-
    В УТВЕРЖДЕНИИ ПРИБОРА О СОБСТВЕННОЙ ПОЛНОТЕ — в перечне своих пределов и в перечне двадцати
    двух величин, — и в ЕДИНИЦЕ головного ноля определения готовности (источник вместо
    утверждения). Круг по редакции 6 нашёл род в свойстве и населении прибора; редакция 7 закрыла
    оба и объявила перечень пределов полным — род ушёл в само объявление полноты.
  чем_это_установлено: >-
    ОПЫТОМ, а не тем, что искать стало нечем: четырнадцать моих одно-фактных прогонов, из них
    тринадцать молчат на всех осях, у каждого отрицательного — краснеющий близнец. Ни одна находка
    не выведена вычитанием из прошлых кругов, ни одна не повторяет авторский прогон.
  механизм_шести_кругов_один: >-
    Документ делает об инструменте утверждение с квантором всеобщности («все», «полный»,
    «любая», «у каждого»), а инструмент держит перечень. Каждый круг рецензент находит элемент вне
    перечня. Лекарство, которое сходится, — утверждения о приборе ограничиваются перечнем, который
    прибор узнаёт, а всё вне перечня называется вне прибора (Б20, вариант 1). Это перенос класса в
    форму задания (multi-agent-flow-orchestration.md §14а, «класс, отвергший работу дважды»).
  что_НЕ_блокирует: >-
    Оба блокирующих — об инструменте документа, а не о нормах продукта. Продуктовая часть
    (сценарии, нормы §2 и §6, размены §7) в этом круге изменений по существу не получила — только
    адреса держателей в телах пунктов, — и регрессии в ней я не нашёл.
  ряд:
    блокирующих: {ред2: 6, ред3: 3, ред4: 4, ред5: 3, ред6: 2, ред7: 2}
    оговорка: >-
      Ряд перестал убывать. Сравнимо только это число; экземпляры поперёк кругов не сравниваются —
      инструмент рецензии менялся каждый круг.

what_is_NOT_wrong:
  - >-
    Команда исполняется вербатим и печатает объявленное побайтово — третий круг подряд, при росте
    формы вдвое.
  - >-
    Ведомость загейчена так, как просил круг: все шесть записей несущие, запись без предмета и
    противоречие со строкой краснеют.
  - >-
    Население выведено из дерева там, где объявлено (Р16, Р17 сдвигают величину), и две нормы
    Б18 держатся строками.
  - >-
    Авторская таблица инъекции честна в моей выборке из пяти строк — все воспроизведены
    дословно; первая рука следов, противоречащих второй, не оставила.
  - >-
    Название И9 «измеренным пределом» — верный жест: предел, показанный молчащим прогоном, стоит
    дороже предела, объявленного словом. Этот круг лишь показывает, что таких пределов больше трёх.

gates_run_before_handoff:
  условие_создано: >-
    KACHO_MONOREPO=<воркспейс>/project/kacho, KACHO_HOME_KANAME=<воркспейс>/project/kaname
  где: 'рабочая копия записи — origin/review/f1b-round2 @ 483aaa39 плюс этот файл'
  результаты:
    - {набор: adapter-gate, код: 0, перепись: 'рассмотрено 7, пройдено 7, провалено 0, без предмета 0'}
    - {набор: change-graph-gate, код: 0, перепись: 'рассмотрено 4, пройдено 4, провалено 0, без предмета 0'}
    - {набор: docs-gate, код: 0, перепись: 'рассмотрено 6, пройдено 6, провалено 0, без предмета 0'}
    - {набор: rules-gate, код: 0, перепись: 'рассмотрено 3, пройдено 3, провалено 0, без предмета 0'}
    - {набор: skills-gate, код: 0, перепись: 'рассмотрено 7, пройдено 7, провалено 0, без предмета 0'}
    - {набор: tooling-gate, код: 0, перепись: 'исполнено 9, пройдено 9, провалено 0, без предмета 0'}
    - {набор: vault-gate, код: 0, перепись: 'рассмотрено 5, пройдено 5, провалено 0, без предмета 0'}
  область_зелёного: >-
    Наборы судят ДЕРЕВО ВОРКСПЕЙСА, а не содержание приёмки; docs-gate читает объявленный вердикт и
    не судит его истинности (change-graph §2). Прогнанная на рецензируемой ветке команда §5.0 —
    отдельный предмет, её исход выше.

