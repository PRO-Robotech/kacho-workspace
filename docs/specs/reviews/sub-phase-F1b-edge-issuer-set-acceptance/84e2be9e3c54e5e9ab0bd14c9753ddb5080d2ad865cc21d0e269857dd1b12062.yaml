      вывод: "без раскладки ['§07'] · раскладка без раздела ['§7'] · места нет — 13"
      код: 1
  итог_счётом: >-
    Моих одно-фактных прогонов 14 (Р1–Р5, Р6, Р6h, Р7, Р8, Р10, Р11, Р12, Р14, Р15), близнецов
    и контролей блоков 6 (Р5т, Р6т, Р7к, Р7т, Р8т, Р14т), положительных контролей 2 (Р16, Р17).
    Молчат на всех осях 13 из 14; Р10 говорит только печатью при коде 0. Все пять близнецов
    отрицательных прогонов краснеют с координатой — оси живы на моих входах. В пределах,
    названных документом, лежат два (Р11, Р12); остальные одиннадцать — вне их.
  моя_ошибка_внутри_прогона: >-
