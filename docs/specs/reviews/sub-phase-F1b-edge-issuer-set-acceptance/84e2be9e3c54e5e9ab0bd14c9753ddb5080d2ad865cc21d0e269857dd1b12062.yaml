consistency_of_two_hands:
  what_was_verified:
    - 'вербатим-исполнение команды — вывод и код побайтово равны объявленному'
    - 'колонка «ред. 7» большой таблицы §5.0 — все 17 величин, которые печатает команда, равны её выводу; две непечатаемые (57 со сценарием, 2 только «вне §5») сошлись со счётом по колонке держателей'
    - 'мест-повторов 75 в 41 строке — предикат числа `·` в колонке даёт 75 и 41 (у ред. 6 — 0)'
    - 'разбивка по дому §2 28 · §6 17 · §5 5 · §7 6 · §0 1 · §3 1 · §4 1 — пересчитана, Σ 59'
    - 'без фразы, внесённой в §6 п. 5, — шесть находок «повтор без адреса в теле»: воспроизведено поимённо'
    - 'все шесть записей ведомости НЕСУЩИЕ: снятие каждой даёт `без держателя` с её именем (дефект первой руки снят)'
    - 'выборка авторской таблицы инъекции — И12, И17, И18, И42, И43 — воспроизведена дословно, включая «32, первое Н02→§4 п. 3» и «4, первое преамбула→…»'
    - 'журнал и §5.0 согласны о 22 / 21 / 3; «экземпляров 6» взято из записи круга по редакции 6'
    - 'оборванной половины прежнего предложения о предикат-строках не осталось'
  contradictions_found:
    - место: '§5.0, строка 1200, против вывода той же команды'
      суть: >-
        «любая непустая ось и любое расхождение сверки дают 1», тогда как контроль печатает
        непустую ось «адрес-ссылка» ['§3.1 проза→Н39'] при коде 0: `ref` в условие отказа не
        входит. Утверждение о коде у́же, чем читается. См. З18.
    - место: '§5.0 «Единица задаёт и то, что лежит МЕЖДУ единицами» против прибора'
      суть: >-
        документ называет прозу раздела до первого подраздела источником `§N проза`; у раздела с
        единицей «пункт» без пунктов до первого `###` прибор называет её `§N` (Р16 → `§3`). Строка,
        написанная по документу, получила бы «места нет». См. З22.
  следов_первой_руки_противоречащих_второй: >-
    не найдено: числа, ведомость, адреса в телах и таблица инъекции сходятся с деревом. Оба
    найденных противоречия — о приборе и не зависят от того, какая рука их внесла.

