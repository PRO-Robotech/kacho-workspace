important_findings:
  - id: З18
    предмет: >-
      Ось «адрес-ссылка» печатается и код не роняет; отсюда два неверных утверждения — «любая
      непустая ось даёт 1» (§5.0) и «снятие места из колонки ловится тем, что пункт остаётся без
      держателя (И33)».
    признак: >-
      Контроль сам печатает непустую ось при коде 0. Р10: снятие повтора `§6 п. 5` у Н07 даёт
      только новый элемент этой оси при коде 0. Пунктов с одним держателем 19 из 47 — только у них
      снятие места роняет код; у 28 остальных — нет.
    remedy: >-
      Сделать `ref` осью отказа и объявить законные ссылки ведомостью в документе (сегодня такая
      одна — `§3.1 проза→Н39`), с теми же тремя проверками, что у ведомости исключений.

  - id: З19
    предмет: >-
      «Сверка N − P − void = M» алгебраически равна конъюнкции двух уже существующих осей и
      покраснеть одна не может.
    признак: >-
      При отсутствии повторов имени и записей без предмета N − P − void = |(имена ∖ P) ∩ места| = M
      по построению. Во всех четырёх авторских прогонах, где сверка краснеет (И3, И4, И12, И23),
      рядом краснеет «без предмета» либо «имя не единственно». Утверждение «сходятся не по
      построению, а по дереву» верно для двух обходов и неверно для их независимости.
    remedy: назвать сверку сводкой двух осей либо снять; независимым контролем она не является

  - id: З20
    предмет: 'у пределов 1 и 3 есть выразимый предикат для их форменной половины'
    признак: 'three_limits_check выше — прототип отпечатка и замеры 23/54 и 26/69'
    remedy: >-
      Либо завести (отпечаток — у четырёх малых записей ведомости; второй конец держателя), либо
      переписать «машинного предиката нет» точнее: нет у распознавания нормы, есть у перемены
      предмета записи.

  - id: З21
    предмет: 'одно-концевая подмена держателя (Р11) не названа, хотя у мест та же подмена ловится'
    признак: 'Р11 — вывод равен контролю; асимметрия «два конца у места, один у держателя» решением не названа'
    remedy: объединить с З20 либо назвать в пределах поимённо

  - id: З22
    предмет: 'имя прозы до первого подраздела у раздела с единицей «пункт» — `§N`, а не `§N проза`, как пишет документ'
    признак: "Р16 → без держателя ['§3']"
    remedy: одна фраза документа либо одна ветка chop

