command_runs_verbatim:
  answer: ДА — вывод побайтово равен объявленному, код 0
  method: >-
    Блок ```sh, несущий слово ЧИСЛИТЕЛЬ, извлечён из документа по содержимому фенса (не по
    номерам строк; ровно один такой блок, проверено утверждением) и исполнен `bash` из корня
    рабочей копии tmp/f1b-review6 на origin/lane/f1b-round2 @ 6d4f0d5c. Строки `# -> …` из того
    же блока взяты как объявленный вывод и сравнены `diff` с фактическим — различий ноль.
  output:
    - 'строк 59 Σ предписано 102 Σ утверждается 102 предикат-строк 5 расхождения []'
    - "источников 53 держатся строкой 47 из них только повтором 24 нормы не несут 6 без держателя [] висячих адресов [] повтор без адреса в теле [] места нет [] адрес-ссылка (строка не отвечает) ['§3.1 проза→Н39']"
    - 'сценариев 16 названы держателем 16 не названы [] висячих держателей [] строка без нормы либо держателя []'
    - 'ЧЕМ ЗАДАНА САМА ПЕРЕПИСЬ: разделов 8 раскладкой 8 без раскладки [] раскладка без раздела [] записей ведомости 6 без предмета [] ведомость против строки [] имя не единственно [] неузнанная разметка [] сверка N-P-void=M сходится'
    - 'код возврата 0'
  note: >-
    Задание называло расхождение объявленного и фактического вывода у первой руки. В конечной
    редакции его нет: четыре строки и код совпали побайтово. Вербатим-исполнимость держится
    третий круг подряд при росте тела команды с 61 до 127 строк (единица — строки между
    маркерами heredoc; прошлый круг называл «57» в иной единице, сюда её не переношу).

