blocking_findings:
  - id: B1
    section: "§2.2 / Ф1б-09"
    subject: >-
      §2.2 объявляет нормой «Коды двух исходов РАЗНЫЕ, и это часть требования»
      (401 отозванному, 503/UNAVAILABLE при молчащем авторитете). Ни один сценарий
      §5 не утверждает ни одного кода.
    predicate: "grep -nE '401|503|UNAVAILABLE' в разделе §5 → 0 попаданий; во всём документе — только строки 233-234 (§2.2)"
    consequence_measured: >-
      Приземлённая проба gateway/internal/e2e/f1b_two_issuer_e2e_test.go:389 шаг (3)
      утверждает только «не 200 / не OK» и остаётся зелёной при слипании 503 в 401,
      хотя продукт коды различает (gateway/internal/middleware/auth.go:495-505 и :1209-1215).
      Требование, объявленное нормативным, не может упасть.
  - id: B2
    section: "§2.2"
    subject: >-
      §2.2 объявляет исключение — на предварительно разрешённых путях REST (живость,
      вход, выход) вопрос об отзыве не задаётся — и ни один сценарий не фиксирует
      состав этого перечня.
    predicate: "grep -c 'предварительно разрешённ' в §5 → 0"
    consequence: >-
      Послабление в контроле безопасности без сценария растёт молча: путь, действующий
      властью удостоверения, попадёт в перечень, и не покраснеет ничто.
  - id: B3
    section: "§2.5 / Ф1б-11 против Ф1б-12"
    subject: >-
      §2.5 требует «ОБЕ поверхности отвечают на неудачу проверки подлинности одним
      постоянным сообщением». Утверждение несёт только Ф1б-12 (нативная gRPC);
      Ф1б-11 (REST) его не несёт.
    predicate: "grep -n 'постоянн' по документу → строка 570 только внутри Ф1б-12; в дереве TestF1b12_AuthNRefusalsAreIndistinguishableOnTheNativeSurface — только native"
    consequence: >-
      Нарушено собственное правило документа §1.3: «всякое утверждение о крае обязано
      быть предъявлено дважды, иначе оно сказано про половину». Сообщение производит слой
      authN, у которого две поверхностные ветви (auth.go:335 и :850), поэтому свойство не
      наследуется автоматически от единственности проверяющего.
  - id: B4
    section: "§2.3"
    subject: >-
      §2.3 говорит «связка держится двумя местами, и оба обязаны существовать»:
      композиционный корень отказывает в старте, и сам слой отказывает на предъявлении,
      если читателя нет. Сценарий есть только у первого (Ф1б-05).
    predicate: "grep -nE 'провяз|читател' в §5 → ни одного утверждения о непровязанном читателе на пути предъявления"
  - id: B5
    section: "§6 п.10"
    subject: >-
      Пункт готовности требует счётчика мягкого прохода и РАЗДЕЛЬНЫХ счётчиков двух
      полос. Ни один сценарий §5 его не предъявляет.
    predicate: "grep -c 'счётчик' в §5 → 0; 'раздельн' в §5 → 0"
    consequence: >-
      Это ровно класс security.md §Hardening п.8, который документ сам называет в своей
      нормативке: мёртвый контроль без счётчика невидим.
  - id: B6
    section: "Ф1б-02а"
    subject: >-
      Заголовок сценария — «разбор объявления ОДИН, и его зовут оба читателя»; блок
      **Then/And** утверждает только вторую половину. Единственность разбора не
      утверждается ничем.
    predicate: >-
      В дереве гейта на единственность нет: git grep -n 'TokenAcceptance' origin/main
      -- internal/repohygiene scripts → пусто. У соседнего предмета (перечень проверок)
      такой гейт есть — tokencheckcomposition_test.go:223.
    consequence: "Класс «тест, чей заголовок шире тела» — testing.md §«Гейт на класс» п.6."
important_findings:
  - "Требования трассируемости документ не объявляет (F1 §11 объявляет: «Каждый идентификатор трассируется в имя теста»). В дереве трассируются 12 ID из 15; Ф1б-04, Ф1б-05, Ф1б-14 по ID не трассируются, хотя производители у Ф1б-04 и Ф1б-05 есть."
  - "§6 п.9 несёт врезку «ИСПОЛНЕНО» с прочитанным исходом гейта посадки. Приёмка судит ТРЕБУЕМОЕ; свидетельство исполнения принадлежит записи ревью либо задаче, иначе документ самозаверяет свой же пункт готовности."
  - "§7 собирает размены, но размен §6 п.7 (привязка не достижима ни на одной сегодняшней посадке) живёт только во врезке §6 и в §7 не назван."
  - "Ф1б-08 «вынужденный перезапрос ограничен собственным интервалом» лицензирует расхождение: край объявляет 3 с (jwt_verifier.go:336), политика — 30 с (UnknownKeyIDRefetchInterval), и первая конфигурация равенство сверяет пробой, а край — нет (git grep -n UnknownKeyIDRefetchInterval origin/main -- gateway → пусто). Решал ли кто-нибудь это различие, по дереву не видно (architecture.md §«Параллельные полосы одного механизма»)."
  - "Ф1б-02а: все утверждения ждут отказа; явного положительного близнеца («профиль, с которым процесс поднимается, пробу не роняет») нет. Перепись объёма его не заменяет."
  - "Ссылки на docs/specs/04-roadmap-and-phasing.md нет. Не блокирует: фаза ведётся эпиком продукта #896, а на roadmap ссылаются 22 приёмки из 186."
product_findings_not_blocking_this_document:
  - "Ф1б-01: обязательная проверка critical-headers (11-я из 11) объявлена и исполняется краем, но токена с этим признаком ей не подают нигде. Предикаты пусты втроём; контроль в обратную сторону — у первой конфигурации проба есть (services/registry/internal/clients/jwks/f1_critical_headers_test.go). Сценарий сформулирован верно, его не исполняет код."
  - "Ф1б-03 и Ф1б-04: «сообщение называет издателя» и «с указанием издателя и негодного адреса» — производство есть (tokenissuers.go:265, :139-142), утверждающей пробы нет; все 30 утверждений по тексту отказа сверяют имя ручки либо различитель ряда."
  - "Ф1б-10: «предъявление с доказательством владения проходит» — утверждается присутствие cnf (auth.go:229-247), не владение; полоса владения (dpop_e2e_test.go) заведена на прежнего издателя."
  - "Ф1б-14: инъекция в обе стороны отсутствует у двух стражей фазы — gateway/cmd/api-gateway/f1b_revocation_wiring_test.go:94 и семи функций TestF1b_* в gateway/deploy/f1b_token_acceptance_declared_test.go (git grep -n 'TestF1b' origin/main -- '*inject*' '*.sh' → пусто)."
  - "Ф1б-07: «послабление несёт предикат снятия» существует прозой в двух комментариях; машинного держателя нет."
premises_of_issue_2566:
  - premise: "документ DRAFT и записи ревью под него нет"
    outcome: ПОДТВЕРЖДЕНА
    predicate: >-
      Шапка строка 3 — «Статус: ⏳ DRAFT». Каталогов в docs/specs/reviews за всю историю
      пять, ни один не про F1b (git log --all --name-only -- 'docs/specs/reviews/**').
      Оговорка: у самой F1 записи тоже нет — она одобрена до cutover, её вердикт объявлен
      шапкой и читается scripts/docs-gate/check-01.
  - premise: "код под приёмку приземлён"
    outcome: ПОДТВЕРЖДЕНА
    predicate: >-
      6159e9e2c7 (PR продукта #954), 52 файла, 2026-08-22T06:15:24+05:00. Независимое
      подтверждение — состояние самого гейта: на базе у записи края InScope:false с
      предикатом, на стволе обе записи InScope:true и Predicate не заполнено ни у одной.
  - premise: "девять сценариев F1 названы производимыми пробами этого документа"
    outcome: ПО СУЩЕСТВУ ВЕРНА, ЧИСЛО НЕ ВОСПРОИЗВЕДЕНО
    predicate: >-
      Единица счёта — сценарий F1, чья метка уровня несёт множитель по конфигурациям
      либо поверхностям. По знаку «×» их ДЕСЯТЬ (F1-13, 17, 18, 19, 20, 21, 24, 33, 41, 42);
      считая F1-25, у которого тот же множитель написан словами, — ОДИННАДЦАТЬ. Девяти не
      даёт ни одна названная единица. Существо при этом стоит: идентификаторов F1-NN в
      дереве края НОЛЬ (git grep -ohE 'F1-[0-9]{2}' origin/main -- 'gateway/' → пусто),
      все 18 живут у первой конфигурации; вторую половину этих сценариев производят пробы,
      несущие идентификаторы Ф1б-NN. DoD F1 пп. 7 и 8 требуют «обеих конфигураций» и
      «каждой из трёх поверхностей» прямым текстом.
