  homoglyph_check: >-
    Идентификаторы строк переписи — кириллическая Н: 48 уникальных; латинских H<NN> — ноль.
    Проверено, потому что омоглиф сделал бы половину таблицы невидимой для обхода.
  independent_adjudication:
    method: >-
      Собственный обход §2 (строки 262–498) правилом, которое автор ввёл в редакции 4: не «есть
      ли строка у абзаца», а «сколько наблюдаемых свойств абзац предписывает и сколько имеют
      строку». §6 и §7 обойдены тем же правилом независимым читателем; его находки
      адъюдицированы мной поимённо, две отклонены как чтение, четыре приняты.
    applied_the_authors_own_rule_to_itself: true
    verdict_on_completeness: >-
      ПЕРЕПИСЬ ПОЛНА ПО СВОЕЙ ЕДИНИЦЕ И НЕПОЛНА ПО ПРЕДМЕТУ. Строка есть у каждого СВОЙСТВА, как
      правило и требует. Но четыре нормы предписывают СОСТАВ (перечень причин, перечень величин,
      источник материала, пару конфигураций), и в каждом случае строка либо держатель покрывают
      состав частично. Правило обхода редакции 4 спустилось на один уровень — с абзаца на
      свойство — и остановилось НАД уровнем, на котором класс уцелел: над составом внутри
      свойства. Это блокирующее Б10.
    seventeen_new_rows_claim: >-
      Строка 755 утверждает «Производитель проверен у КАЖДОЙ из СЕМНАДЦАТИ новых строк».
      Пометок «⟵ ново» в таблице — 24; строк, добавленных редакцией 4, — 7. Семнадцать было
      числом редакции 3. Число ничего не решает, поэтому важное, а не блокирующее (З1).
blocking_findings:
  - id: Б10
    класс: >-
      норма предписывает СОСТАВ, а строка переписи либо держатель покрывают его частично
    same_род_as_earlier_rounds: true
    род_history: >-
      Тот же род, что все шесть круга по редакции 2 («норма объявлена, держателя нет») и Б7
      круга по редакции 3 («норма расщеплена надвое, строку получила половина»). ТРЕТИЙ РАЗ.
    section: §2.5 (строки 401–405) · §6 п.7 · §7 п.4 · §6 п.5
    instances:
      - id: Б10.1
        subject: >-
          §2.5 вводит перечень из ПЯТИ причин, которые анти-оракул обязан схлопнуть: «запись
          издателя отсутствует · подпись · адресат · тип · срок». Держатели утверждают ТРИ.
        predicate: >-
          Строка 402 — перечень из пяти. Ф1б-11 строка 1056: «у трёх ветвей (запись издателя
          отсутствует · подпись · адресат) побайтово совпадают тело ответа, код транспорта, код
          смысла и заголовок вызова». Ф1б-12 строка 1104: «отказ по издателю побайтово совпадает
          с отказом по подписи и по адресату здесь же». Ни «тип», ни «срок» не утверждаются как
          схлопывающиеся ни на одной поверхности.
        three_widths_disagree: >-
          Н24 («неотличим от ПРОЧИХ отказов authN») ⊃ перечень §2.5 (пять) ⊃ держатели (три).
          Шире перечня Н24 сегодня ложна: на REST-поверхности живёт отказ по привязке машинного
          токена со своим постоянным описанием, и он ОБЯЗАН отличаться — он действен и требует
          годного удостоверения. Уже перечня — держатели.
        producer_exists_in_tree: true
        producer_detail: >-
          Производитель есть у ВСЕХ пяти: все пять причин возвращаются из JWTVerifier.Verify, и
          её ошибку на каждой поверхности принимает ровно одна точка, сводя всё, кроме
          неисправности посадки, в одну константу. Значит это не «Тогда без производителя», а
          именно состав без держателя, и радиус правки — перечисление в двух сценариях.
        why_substantive: >-
          Тип — ось, на которой фаза САМА заводит зависимость отказа от полосы: Ф1б-07 требует,
          чтобы отсутствие типа принималось на одной полосе и отвергалось на другой. Отказ по
          типу, получивший собственное описание, немедленно становится перечислительным оракулом
          по издателям — ровно тем, ради запрета которого §2.5 и написан. Ни один сценарий этого
          не уронит.
        set_is_also_under_inclusive: >-
          Перечень из пяти у́же того, что продукт схлопывает и обязан схлопывать: отозванное
          удостоверение приходит в ту же константу, и соседний код прямо объявляет это
          требованием. Перечисление будет дрейфовать при каждой новой ветви.
      - id: Б10.2
        subject: >-
          §6 п.7 предписывает «материал доходит от ПРОВЕРЕННОЙ ЦЕПОЧКИ сертификата хопа выдачи
          через контур до подписанта». Строка Н18 говорит другое — «привязка из ПРЕДЪЯВЛЕННОГО
          материала», — и тело Ф1б-10 утверждает только это.
        predicate: >-
          Слово «цепочк» встречается в документе четырежды — строки 681, 1197, 1204, 1323 — и ни
          разу в §5. Ф1б-10 (1033–1042) источника материала не называет: «Then токен несёт
          привязку к предъявленному материалу, а не к выдуманному подписантом».
        why_substantive: >-
          Непроверенная цепочка тоже «предъявлена». Отрицательная половина — непроверенный или
          отсутствующий сертификат НЕ даёт материала привязки — и есть то, без чего привязка
          ничего не значит, и именно её сценарий не несёт.
        producer_exists_in_tree: true
        producer_detail: >-
          Производитель есть и лежит во ВТОРОМ репозитории: PRO-Robotech/kaname,
          internal/handler/registrytokenhttp/f1b_binding_source_test.go — две пробы, прямая и
          зеркальная, именованные по Ф1б-10. Документ второго репозитория не называет нигде (см.
          З2).
      - id: Б10.3
        subject: >-
          §7 п.4 объявляет размен между КОНФИГУРАЦИЯМИ: «Полоса прежнего издателя НА КРАЕ
          принимает ДВА значения типа токена, У ПЕРВОЙ КОНФИГУРАЦИИ — одно». Строка Н41 излагает
          ДРУГУЮ пару — «прежняя полоса — два значения, НАША — одно», то есть две полосы края.
        predicate: >-
          Строка 1312–1313 против строки 746. Предикат снятия того же пункта (строка 1318) —
          «приведение ОБЕИХ КОНФИГУРАЦИЙ к одному объявлению» — подтверждает первое чтение.
          Ф1б-07 — проба пакета над двумя полосами края; утверждения о первой конфигурации она
          не несёт, и grep 'первой конфигурац' по §5 даёт только строки 810 и 844, обе о другом.
        producer_exists_in_tree: true
        producer_detail: >-
          Расхождение фактическое и измеримое: у края тип объявлен МНОЖЕСТВОМ (поле-срез), у
          первой конфигурации — СКАЛЯРОМ, то есть закрыт одним значением by construction. Это и
          есть предмет размена, и он не утверждается ничем.
      - id: Б10.4
        subject: >-
          В таблице «ось перечня → строка» (§5.0) два адреса из семи ведут на строки, чьи
          держатели этой оси не несут: ось «приём нашего издателя» → Н03 → Ф1б-06 (проба пакета,
          поверхностей не касается); ось «отказ по издателю без записи» → Н32 (частный случай:
          наш издатель и отсутствие записи НАБОРА).
        consequence: >-
          Главная наблюдаемая цель фазы, объявленная §0 («наш токен проходит край на обеих
          поверхностях»), собственной строки переписи не имеет ни одной. Свойство держится
          Ф1б-11/12/13 и адресом на них не снабжено.
        arithmetic_of_the_table_is_correct: >-
          Сам счёт автора верен и воспроизведён: вхождений девять (пять у края, четыре у третьей
          поверхности), различных осей семь, своих строк потребовали три. Неверны два адреса из
          семи, а не арифметика.
    remedy: >-
      Правка ТЕРМИНИРУЮЩАЯ, а не ещё одно указание обходчику. Три круга подряд средство было
      описательным — «считай абзацы», «считай свойства», — и каждый раз ловило предыдущую
      зернистость и пропускало следующую. Два структурных хода закрывают класс арифметикой, а не
      вниманием: (1) строка переписи несёт МОЩНОСТЬ того, что её норма предписывает, и сверка
      держателя становится сравнением двух чисел; (2) множество в §2.5 задаётся ПРЕДИКАТОМ, а не
      списком («всякая ошибка проверяющего, не являющаяся неисправностью посадки»), — тогда
      держатель утверждает его исчерпывающе by construction и не дрейфует с каждой новой ветвью.
  - id: Б11
    класс: >-
      названный держатель структурно НЕ СПОСОБЕН упасть на том, ради чего назван
    same_род_as_earlier_rounds: false
    section: §2.5 (строки ~396–398) и Ф1б-11 (строки 1063–1070)
    subject: >-
      Редакция 4 расширила область Н24 на заголовок и назвала средство: «Держится тождество
      заголовка сегодня ПОРЯДКОМ МОНТИРОВАНИЯ СЛОЁВ, а не структурой, — поэтому утверждение
      предъявляется через настоящее соединение и сверяет полученное клиентом, безразлично к тому,
      какой писатель ответил»; и в Ф1б-11: «Утверждение предъявляется ЧЕРЕЗ НАСТОЯЩЕЕ СОЕДИНЕНИЕ:
      ему безразлично, какой писатель ответил, поэтому перестановку оно ловит». Последнее
      ОПРОВЕРГНУТО опытом.
    experiment: >-
      Одно-фактный опыт в изолированной копии ревизии: тот же токен, тот же настоящий сервер и
      настоящее соединение, различие ТОЛЬКО в порядке двух слоёв. При порядке композиционного
      корня три ветви отдают побайтово одинаковые тело и заголовок. При переставленном порядке
      три ветви отдают ТРИ РАЗНЫХ описания в заголовке. То есть перестановка ловится — но ловит
      её не «настоящее соединение», а МОНТИРОВАНИЕ ОБОИХ СЛОЁВ в пробе и ЧТЕНИЕ ЗАГОЛОВКА.
    why_the_declared_means_cannot_fall:
      - >-
        Существующая сквозная проба фазы монтирует ОДИН слой — gateway/internal/e2e/
        f1b_two_issuer_e2e_test.go:238, auth.HTTP(sink). Соседнего писателя в её цепочке нет,
        поэтому перестановка слоёв корня не может изменить её исход by construction.
      - >-
        Её вспомогательная функция предъявления возвращает ТОЛЬКО код состояния; тело сливается,
        ответные заголовки не читаются ни разу во всём файле. Утверждение о заголовке предъявить
        нечем.
      - >-
        Проба НЕ МОЖЕТ взять цепочку из корня: цепочка собирается строками внутри func main(),
        общей функции сборки в дереве нет, и все 18 не-тестовых файлов каталога корня — package
        main. Требование «через настоящее соединение» выполнимо пробой, которая корня не видит.
      - >-
        Настоящее соединение здесь не только не достаточно, но и не необходимо: в дереве уже
        есть образец, утверждающий все три наблюдаемых сразу на обычном регистраторе, с
        положительным контролем и с отдельной пробой того, что сравнение способно увидеть
        различие.
    second_half_of_the_finding: >-
      «Недостижим он ПОЗИЦИОННО, а не структурно» сегодня тоже неточно. Соседний слой не
      смонтирован НИ НА ОДНОМ профиле: разбор всех 28 файлов значений дерева даёт ноль (текстовый
      предикат здесь слеп — он считает прозу комментариев; контроль в обратную сторону на
      синтетике прогнан). При невыставленной ручке объект не строится, ветка монтирования не
      исполняется, и перестановка строк корня даёт побайтово тот же обработчик. То есть
      «позиционно» верно условно — при включённой ручке, — а сказано безусловно.
    what_is_NOT_wrong: >-
      Свойство продукта в порядке: при сегодняшнем порядке три ветви схлопываются, измерено. И
      посылка автора о том, что тождество держится не структурой, верна. Неверно СРЕДСТВО, и
      неверно оно измеримо.
    remedy: >-
      Назвать средством то, что ловит: проба монтирует цепочку ТЕМ ЖЕ выражением, что
      композиционный корень (а такого выражения в дереве нет — значит его заведение есть работа
      фазы и её надо назвать), либо, если это дорого, — обе ветви сравниваются на цепочке,
      содержащей ОБА писателя, и проба ЧИТАЕТ заголовок. «Через настоящее соединение» оставить
      можно, но оно не является ни необходимым, ни достаточным и держателем быть не может.
  - id: Б12
    класс: цена решения названа и ЗАНИЖЕНА; второе следствие не названо
    same_род_as_earlier_rounds: partial
    род_note: >-
      Родня Б8 круга по редакции 3: там основание отклонения не выдержало замера, здесь замера не
      выдерживает названная цена. Оба — «утверждение, которым решение обосновано, замером не
      подтверждается».
    section: §2.5, абзац «Цена этого решения названа, потому что она не нулевая» (строки ~415–421)
    subject: >-
      Документ принимает осознанную различимость неисправности посадки и называет ОДНУ цену: «в
      окне, когда наш источник набора не отвечает, различие двух исходов сообщает предъявителю,
      что у названного им издателя ЕСТЬ запись», и смягчает её двумя утверждениями: «в нём
      поверхность деградирована целиком» и «вне окна различия нет». Первое замером не
      подтверждается, второе у́же свойства.
    predicate_and_measurement:
      - >-
        «Поверхность деградирована целиком» — неверно. Обращение к источнику набора происходит
        только для запросов, чей идентификатор ключа отсутствует в прогретом снимке, и не чаще
        одного раза в короткий интервал НА ЗАПИСЬ (интервал — собственная константа поверхности,
        и это тот же предмет, что Б13). Платформа при этом обслуживает арендаторов нормально,
        а различие живо. Смягчение, которым цена оправдана, описывает состояние, в которое
        посадка не приходит.
      - >-
        Что узнаёт вызывающий — не только «запись есть». Резолв ключа стоит ДО проверки подписи,
        поэтому различие доступно вызывающему, НЕ предъявившему годного удостоверения, и
        сообщает ТЕКУЩЕЕ СОСТОЯНИЕ источника набора названного издателя, а не факт о таблице
        записей. Состояние опрашивается по выбору вызывающего, а не только во время нашей
        неисправности; и один из принимаемых издателей — третья сторона, чей источник набора
        нам не принадлежит.
    what_is_correct_and_verified: >-
      Встречное требование Н44 («отказ посадки не называет издателя») ПРОИЗВОДИТЕЛЯ ИМЕЕТ:
      описание отказа посадки — постоянная, употреблений ровно два (по одному на поверхность),
      издателя не несёт; обёрнутые ошибки, которые несут внутренние значения, уходят ТОЛЬКО в
      журнал, а клиенту уезжает постоянная. Заголовка вызова у этого писателя нет. Эта половина
      закрыта, и это сказано прямо.
    does_the_argument_from_2_2_transfer: >-
      ДА, и это подтверждено кодом: соседняя ветвь объявляет довод дословно тем же. Но переносится
      ДОВОД, а не ЦЕНА, и документ этого различия не проводит. В §2.2 разведение двух кодов
      бесплатно, потому что та ветвь стоит ПОСЛЕ проверки подписи и вызывающему без годного
      удостоверения недоступна. В §2.5 ветвь стоит ПЕРЕД ней. Именно это, а не сам довод, делает
      здесь цену ненулевой — и именно это в документе не названо.
    remedy: >-
      Один абзац: снять смягчение, которое замером не подтверждается; назвать, что различие
      доступно без годного удостоверения и сообщает состояние, а не только наличие записи; и
      сказать, чем это ограничено — либо принять как расширение поверхности и назвать его в
      приёмке прямо (ban #18, ось «безопасность»: расширение, которое не названо, отвергает
      решение), либо назвать встречное требование, как уже сделано для Н44.
  - id: Б13
    класс: правило над ОТКРЫТЫМ населением закрыто двумя точечными утверждениями
    same_род_as_earlier_rounds: true
    род_note: >-
      Это род Б9 круга по редакции 3 — «чинить экземпляр, объявляя, что чинишь класс», — ВТОРОЙ
      РАЗ. Б9 нашёл вторую ось; редакция 4 внесла вторую ось и объявила правило над всеми
      величинами. Держателя получили оси, правило — нет.
    section: §7 п.6, замыкающий абзац (строки 1373–1375)
    subject: >-
      Пункт объявляет: «величина, объявленная общей политикой, резолвится в неё у КАЖДОЙ полосы;
      собственная константа или ручка поверхности — НАХОДКА, пока не названа здесь отдельной
      строкой с основанием». Это норма над открытым населением. Строки Н46 и Н47 держат ДВЕ
      названные величины; у самого правила нет ни строки, ни адреса, ни держателя. Переписи по
      объявлению политики («величин N, резолвится у края M, собственных K, названо разменом K'»)
      не требует ни один сценарий.
    author_names_the_risk_and_does_not_close_it: >-
      Тот же абзац говорит: «распадись он на два пункта, следующая ось (а рядом в том же
      объявлении лежат ещё величины) снова оказалась бы вне перечня». Риск назван верно и закрыт
      двумя точечными утверждениями — тем самым способом, который абзац и отвергает.
    predicate_population_measured: >-
      Единица счёта — экспортируемая числовая либо срочная величина общего объявления политики
      (PRO-Robotech/corelib @ v1.5.0, пин сверен по go.mod продукта). Величин ДЕВЯТЬ. Край
      резолвит ЧЕТЫРЕ (считая ту, что резолвится только запасным путём и на живом пути замещена
      собственной ручкой). Разница не исчерпывается двумя названными осями: среди нерезолвимых
      есть величина потребительской стороны, которую первая конфигурация резолвит, а край не
      резолвит вовсе. Координата и следствие здесь намеренно не собираются в одном месте
      (security.md §«Публичные артефакты»); предикат воспроизводит перепись за одну команду.
    remedy: >-
      Дать правилу держателя того же рода, что у него предмет: перепись по объявлению политики с
      ДВУМЯ величинами рядом («величин N · резолвится M»), падающая на пустом обходе, — а не
      перечень названных осей. Тогда третья величина не уедет тем же путём, которым уехал допуск
      часов на редакции 3, и правило перестанет держаться вниманием.
important_findings:
  - id: З1
    subject: >-
      Строка 755: «Производитель проверен у КАЖДОЙ из СЕМНАДЦАТИ новых строк». Семнадцать —
      число редакции 3. Пометок «⟵ ново» в таблице 24, строк добавлено редакцией 4 семь.
      Число ничего не решает и предиката при себе не имеет; §1 того же документа требует
      предиката у каждой величины.
  - id: З2
    subject: >-
      Возражение З6 круга по редакции 3 остаётся без ответа — ни принято, ни опровергнуто.
      Требование Н40 («каждый идентификатор трассируется, утверждается переписью ПО ДЕРЕВУ») не
      называет, по какому дереву. Замер: идентификаторы фазы стоят в ОБОИХ репозиториях, и обе
      половины Ф1б-10 живут в разных — край в продукте, контур выдачи в PRO-Robotech/kaname.
      §3 «Область» второго репозитория не называет ни строкой. Автор принял и починил
      ИДЕНТИЧНЫЙ класс для Н39 (З2 круга по редакции 3 — «область названа, иначе утверждение
      шире дерева») и оставил его здесь. Возражение рецензента — тоже утверждение: оно
      исполняется либо опровергается предикатом, а не обходится молчанием.
  - id: З3
    subject: >-
      Из трёх адресов «Рода 2» работает один. Условие «адрес читается тем, кто ответа ещё не
      знает» выполнено только у §6 п.5 — он называет держателей и предупреждает о расхождении
      «девять осей — три строки» В СОБСТВЕННОМ ТЕЛЕ. У §6 п.2 и §6 п.7 адрес лежит ТОЛЬКО в
      §5.0; идущий по §6 механически найдёт у них по одной строке и заведёт круг заново — ровно
      то, ради чего адреса и вводились. Форма рабочего адреса у автора есть и применена в
      пунктах 5, 9, 10, 11, 12; не применена в двух местах, где расщепление и было найдено.
  - id: З4
    subject: >-
      Ф1б-12: «Заголовка у этой поверхности нет — у неё статус и сообщение». Измерено опытом:
      заголовки ответа ЕСТЬ (тип содержимого и идентификатор запроса), просто ветви они не
      различают; деталей у статуса ноль. Утверждение буквально неверно, по существу верно, и
      утверждаемая форма другая: «метаданные и детали ветвь не различают», причём ноль деталей
      сегодня не утверждает ни одна проба — детали, заведённые на пути подлинности завтра,
      оставили бы существующую пробу зелёной. Документ прав в том, что ноль надо сказать вслух;
      сказан не тот ноль.
  - id: З5
    subject: >-
      §7 п.3 предписывает два наблюдаемых свойства («второй реализации проверки не заводится» и
      «состав обеих сверяется одним объявлением и расхождение краснеет»), а строк переписи с
      источником §7 п.3 — ноль. Второе держится косвенно через Ф1б-01; первое не держится ничем.
      По той же логике, которой автор обосновал счёт §7 п.4, дерево с третьей реализацией
      проверки не покраснеет.
  - id: З6
    subject: >-
      §6 п.1 предписывает «гейт держит ОБЕ конфигурации в области»; Ф1б-01 утверждает только про
      край. Половина слабая (запись первой конфигурации в области уже до фазы), но по правилу
      автора утверждения не имеет. Там же §6 п.5 несёт два свойства сверх девяти осей —
      «сквозные пробы существуют по каждой из трёх» и «несут положительный контроль», — строк у
      них нет; держатся самоподтверждением сценария.
  - id: З7
    subject: >-
      Две формы записи одной координаты в одном файле: «§6 п.2» (перепись и таблицы §5.0) и
      «§6 п. 2» с пробелом (тела сценариев). Обход по одной форме теряет обратные ссылки,
      написанные другой. Предмет мелкий, но он ломает ровно тот механический обход, на который
      документ опирается как на предикат своей проверяемости.
  - id: З8
    subject: >-
      §6 п.7, строки 1197–1198: «материал доходит от проверенной цепочки … через контур до
      подписанта, А НЕ ПРЕДЪЯВЛЕННЫЙ материал НЕ превращается в выдуманный» — двойное отрицание,
      читается как опечатка. Разбор Б10.2 от прочтения не зависит, но фразу стоит поправить: она
      предписывает норму.
  - id: З9
    subject: >-
      §2.3 («слой authN … обязан различать «отозван» и «авторитет не ответил» кодами, которые
      видит клиент») повторяет норму Н11, объявленную в §2.2, и адреса не несёт. Само свойство
      держится; механический обход §2.3 найдёт предписание без строки.
round_3_blockers_closure:
  - id: Б7
    closed: true
    closed_partially: true
    how_verified: >-
      Множество названо перечнем, неисправность посадки объявлена различимой осознанно, область
      расширена на описание · код · заголовок, строки Н42–Н44 заведены, держатели предъявлены на
      обеих поверхностях. Производители измерены и ЕСТЬ: код смысла негодного удостоверения один
      и тот же на двух поверхностях; неотвечающий источник набора уходит в отдельную пару, и она
      отличается от первой по всем трём осям; постоянная отказа посадки издателя не несёт.
      НО перечень из пяти держателями покрыт на три (Б10.1), названная цена замера не выдержала
      (Б12), а средство, которым держится расширение на заголовок, упасть не может (Б11). То
      есть блокирующее закрыто по форме и открыто по существу на новой границе — третий раз
      подряд граница сдвигается на уровень вниз.
  - id: Б8
    closed: true
    how_verified: >-
      Оба числа отозваны, обе единицы названы, обе команды приведены, вывод отделён от чисел и
      от единицы не зависит. Это правильная форма закрытия, и она принимается целиком.
    reviewer_was_wrong_and_says_so_first: >-
      МОЁ число по нативной gRPC (5) было НЕВЕРНО, и автор назвал причину точно: мой предикат
      знал только однострочную форму записи аргумента, а два писателя несут аргумент,
      ПЕРЕНЕСЁННЫЙ на следующую строку. Перемерено формо-осведомлённым выражением: их тексты
      различны между собой и не совпадают ни с одним из пяти, значит 5 + 2 = 7. Автор прав, и
      расхождение разрешено уточнением ФОРМЫ, а не выбором большего числа.
    but_seven_is_not_final_either: >-
      Третья форма записи — построение статуса с последующим добавлением деталей — не известна
      НИ ОДНОМУ из двух предикатов, и она даёт ещё одно описание отказа подлинности на нативной
      gRPC; на REST у неё есть близнец. При формо-полной единице пара выходит 8:8 либо 9:8 — в
      зависимости от того, считать ли писателя слоя прав, отвечающего на отсутствующее
      удостоверение, писателем отказа подлинности. Вывод врезки от этого не зависит и остаётся в
      силе. Названо не как находка, а как единица: слепым оказался предикат ОБЕИХ сторон, в
      одном круге, второй круг подряд.
  - id: Б9
    closed: true
    closed_partially: true
    how_verified: >-
      Обе оси внесены: §7 п.6 несёт ось окна перезапроса и ось допуска часов, Ф1б-08 утверждает
      обе, строки Н46 и Н47 заведены. Ловушка приземлённой пробы названа верно и в точности:
      построение проверяющего несёт запасной путь, проба без ручки в него попадает и закрепляет
      границы против величины, которой у развёрнутого края не бывает; требование «величина
      собирается тем же путём, что в композиционном корне» внесено. Это ровно то, что круг
      просил.
      НО правило, ради которого обе оси держит ОДИН размен, держателя не получило (Б13), а
      население правила — девять величин, из них край резолвит четыре. То есть класс снова
      закрыт двумя экземплярами.
important_of_round_3_disposition:
  З1_три_нормы_без_строк: >-
    принято — заведены Н45, Н46, Н48; проверено, строки есть, держатели несут
  З2_область_Н39: >-
    принято — область названа («у края»), и названа верно; по дереву продукта разборов два, второй законен и назван разменом
  З3_заголовок: >-
    принято — область расширена на описание · код · заголовок, но СРЕДСТВО, которым расширение держится, не выдержало опыта (Б11)
  З4_счётчики: >-
    принято как РАБОТА, а не размен, и обоснование верно — измерено; два общих имени величин и одно отсутствующее, ровно как врезка утверждает
  З5_трассируемость: >-
    не рассматривалось — предмет приземлённого кода, вне области этого ревью
  З6_второй_репозиторий: >-
    НЕ ОТВЕЧЕНО — поднято снова как З2 этого круга
  З7_производитель_перечня: >-
    частично — обозначение сценария как пробы пакета ограничение подразумевает, но вслух не названо
cycle_convergence:
  by_round:
    редакция_2: {blocking: 6, родов: 1}
    редакция_3: {blocking: 3, родов: 3}
    редакция_4: {blocking: 4, родов: 3}
  counting_unit_matters: >-
    Числа 6 → 3 → 4 считают БЛОКИРУЮЩИЕ. Считая ЭКЗЕМПЛЯРЫ, круг по редакции 4 даёт семь
    (Б10 несёт четыре), и тогда ряд по роду «норма и её держатель расходятся» выглядит 6 → 1 → 4.
    Обе единицы законны и мерят разное; пряча одну, ряд читается либо как сходимость, либо как
    провал. Здесь названы обе.
  same_род_third_time: >-
    ДА, И ЭТО СКАЗАНО ОТДЕЛЬНОЙ СТРОКОЙ, как требует правило о сходимости цикла. Род «документ
    объявляет нормой то, чего не утверждает ни один сценарий» отвергает документ ТРЕТИЙ РАЗ
    ПОДРЯД. Сверх того род «чинить экземпляр, объявляя, что чинишь класс» (Б9 → Б13) отвергает
    ВТОРОЙ раз.
  why_it_survives: >-
    Механизм видно, и он один. Каждый круг средство спускается на одну зернистость НИЖЕ и
    останавливается НАД той, на которой класс уцелел: редакция 3 завела перепись по абзацам —
    класс уцелел в расщеплённой норме; редакция 4 завела правило «считай свойства» — класс уцелел
    в СОСТАВЕ внутри свойства (перечень причин, перечень величин, пара конфигураций, источник
    материала). Средство остаётся ОПИСАТЕЛЬНЫМ — указанием обходчику-человеку, — а описательное
    средство ловит ровно ту зернистость, на которой его написали.
  what_would_terminate_it: >-
    Средство обязано стать АРИФМЕТИЧЕСКИМ, а не более подробным. Два хода, оба внутри документа:
    (1) строка переписи несёт МОЩНОСТЬ предписанного — тогда «состав покрыт частично» ловится
    сравнением двух чисел, а не внимательностью, и следующая зернистость не заводится, потому
    что мощность её уже учитывает; (2) норма над ОТКРЫТЫМ населением (правило §7 п.6) получает
    держателем ПЕРЕПИСЬ по населению с двумя величинами рядом, а не перечень названных
    экземпляров. Это перенос класса в ФОРМУ, а не третье указание, как обходить.
  is_the_predmet_missing: >-
    НЕТ. Случай «круг не запускается там, где предмета ещё нет» здесь не наступает: у каждой из
    четырёх блокирующих производитель измерен и существует, дерево ОПЕРЕЖАЕТ документ, ни одна
    правка не ждёт чужой задачи. Радиус четвёртого круга — два сценария, три абзаца и одна
    структурная правка формы переписи.
  radius_of_fix_expected: >-
    Ф1б-11 и Ф1б-12 — перечисление состава; §2.5 — предикат вместо списка и абзац цены; §7 п.6 —
    держатель правила; §6 п.7, §7 п.4 — строка либо адрес; §5.0 — колонка мощности. Ни одно
    блокирующее не меняет области фазы и ни одно не требует переписывать §5, §6 или §7 целиком.
reviewer_own_errors_named_first:
  - >-
    МОЁ ЧИСЛО 5 ПО НАТИВНОЙ gRPC БЫЛО НЕВЕРНО, и автор назвал причину точно. Предикат находил
    оба перенесённых писателя, а извлечение аргумента однострочным выражением давало у них
    пустую строку, и я их отбросил — то есть смотрел на число, а не на СОСТАВ вывода, ровно
    против правила, которое сам же цитировал в прошлом круге. Верно 7.
  - >-
    И 7 не окончательно — но слеп здесь предикат ОБЕИХ сторон: третья форма записи (построение
    статуса с добавлением деталей) не известна ни моему выражению, ни авторскому. Это не
    оправдание моей ошибки, а её класс: за два круга подряд слепота собственного разборщика
    поймалась только расхождением с чужим числом, ни разу — перечитыванием своего.
  - >-
    Одно из блокирующих я едва не завёл на разнице описаний отказа по привязке машинного токена
    между двумя поверхностями. Замер показал: эта причина в множество §2.5 не входит и входить
    не должна — она действенна и требует годного удостоверения. Гипотеза опровергнута замером до
    записи, и названа здесь, чтобы следующий её не повторил.
  - >-
    Четвёртая блокирующая (Б13) выросла из находки независимого читателя, которую я сначала
    прочёл как придирку к прозе. Опровергла моё прочтение перепись населения: девять величин,
    край резолвит четыре. Без переписи я бы её отклонил.
what_this_review_does_not_cover:
  - >-
    Прогон проб фазы исполнен ЧАСТИЧНО и область зелёного названа узко: 7 проб пакета
    gateway/internal/e2e с префиксом фазы плюс три опыта в изолированной копии. Пакеты
    gateway/internal/middleware, gateway/internal/config, gateway/deploy целиком НЕ гонялись;
    стенд не поднимался. О поведении развёрнутого края здесь не сказано ничего.
  - >-
    Верность держателя ПО СУЩЕСТВУ не проверялась там, где проверялось его наличие: у 48 строк
    переписи установлено, что названный сценарий несёт утверждение своей нормы, а не что
    утверждение верно. На это отвечает прогон.
  - >-
    Пять находок круга по редакции 2 о приземлённом коде предметом этого документа не являются и
    здесь не перепроверялись, как и З5 круга по редакции 3 (трассируемость идентификаторов в
    дереве).
  - >-
    Задач в трекере по прямому запрету владельца не заведено ни одной. Побочное, всплывшее по
    дороге и записанное, чтобы знание не пропало с сессией: два писателя отказа подлинности на
    REST-поверхности несут собственные описания мимо общего писателя; одна полоса неисправности
    посадки отвечает парой отказа удостоверению; проверка, стерегущая форму тела отказа, обходит
    двух писателей из десяти известных форм. Всё это — состояние приземлённого кода, предмета
    этого документа не касается и в приёмку не просится.
  - >-
    Публичность репозиториев соблюдена намеренно: ни одна находка не собирает координату,
    условие недействия защиты и следствие для постороннего в одном месте. Там, где требование
    формулируется без первой части, приведён предикат переписи, а не рецепт.
