    table_rows: 48
    unique_ids: 48
    gaps_or_duplicates: none
    by_source_recomputed: {§2: 28, §6: 16, scenario_heading_§5: 1, §7: 3}
    rows_naming_holder_outside_section_5: [Н35, Н37]
    rows_added_by_revision_4: [Н42, Н43, Н44, Н45, Н46, Н47, Н48]
    arithmetic_verdict: >-
      Таблица внутренне сходится по всем четырём величинам и по разбивке источников. Прирост
      41 → 48 объясняется ровно семью добавленными строками, и ни одна из семи не вводит новой
