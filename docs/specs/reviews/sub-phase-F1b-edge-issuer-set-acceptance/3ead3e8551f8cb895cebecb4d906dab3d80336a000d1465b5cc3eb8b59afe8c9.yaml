round_1_blockers_closure:
  - id: Б1
    closed: true
    how_verified: >-
      Замер по дереву: вердикты revocationCheck (auth_revocation.go:179) и
      platformRevocationCheck (:279) дают РАЗНЫЕ пары — отозвано 401 + code 16 на REST и
      codes.Unauthenticated(16) на нативной gRPC; авторитет молчит либо настроен неверно —
      503 + code 14 и codes.Unavailable(14). Обе поверхности зовут один и тот же
      revocationCheck (auth.go:494 и auth.go:1208), значит «обе пары на обеих
      поверхностях» имеет производителя. Держатель Ф1б-09 утверждает пару, а не «не 200 /
      не OK». Оговорка, не блокирующая: на полосе ПРЕЖНЕГО издателя «авторитет не ответил»
      кодов не производит вовсе (мягкий проход) — сценарий это и говорит, ограничивая
      требование НАШЕЙ полосой.
  - id: Б2
    closed: true
    how_verified: >-
      Производитель перечня один и закрыт: isPublicHTTPPath (authz_util.go:257), четыре
      точных адреса, не префиксы. На нативной gRPC такого перечня НЕТ — ноль, что сценарий
      и требует утверждать числом (DefaultPublicAllowlist освобождает от ПРАВ, стоит в
      цепочке после перехватчика подлинности и на вопрос об отзыве не влияет by
      construction). Освобождение касается только вопроса об отзыве: разбор подписи идёт
      раньше и от него не зависит — предъявленный негодный токен на освобождённом пути
      отвергается, что сценарий и утверждает. Замечание о читаемости производителя — З7.
  - id: Б3
    closed: true
    closure_differs_from_request: true
    how_verified: >-
      Закрыто ПО СУЩЕСТВУ, но не так, как просил круг 1, и возражение разобрано отдельно.
      Держатель Н24 предъявлен на ОБЕИХ поверхностях (Ф1б-11 строка 814, Ф1б-12 строка
      843), и у утверждения есть производитель на каждой: три ветви — запись издателя
      отсутствует (jwt_verifier.go:546), подпись (:589), адресат (:604) — лежат внутри
      JWTVerifier.Verify, и на каждой поверхности её ошибку принимает РОВНО ОДНА точка
      (auth.go:468 для gRPC, auth.go:1170 для REST), сводя все три в один текст: REST
      «token validation failed», gRPC «authentication failed». Ни одна из трёх не проходит
      keySourceUnanswerable, поэтому все три идут в 401, а не в 503.
    substantive_question_b_answered: >-
      ВОПРОС (б) — достаточно ли «неотличим внутри своей поверхности», если нападающий
      видит ОБЕ. ОТВЕТ: достаточно, и это выводится, а не принимается на веру. Если ответ
      каждой поверхности постоянен на множестве причин R, то и пара ответов двух
      поверхностей постоянна на R — совместное наблюдение не добавляет различающей
      способности. Условие достаточности одно: обе поверхности обязаны схлопывать ОДНО И
      ТО ЖЕ множество R, и оно выполнено — Ф1б-11 и Ф1б-12 перечисляют одну и ту же тройку
      (издатель · подпись · адресат). Тождество ТЕКСТОВ поперёк поверхностей действительно
      не требуется, и автор прав, что требовать его значило бы требовать невозможного.
      НО достаточность держится ровно на границе множества R, и здесь она пробита дважды —
      обе пробоины блокирующие либо важные, и ни одна не была видна из документа:
      (1) Б7 — «неотвечающий источник набора ⇒ 503» вводит ЧЕТВЁРТЫЙ наблюдаемый класс,
      по построению отличимый от 401 и коррелирующий с «у этого издателя есть запись»;
      он в R не входит, документ его в R не вводит и не выводит явно, держателя у него
      нет; (2) З3 — утверждение покрывает ОПИСАНИЕ, а не всё наблюдаемое: код и заголовок
      ответа под него не подпадают, и соседний писатель REST текст той же ошибки в
      заголовок кладёт неcхлопнутым. Иначе говоря: переформулировка верна, а её область
      объявлена ýже, чем свойство, которым она обосновывается.
  - id: Б4
    closed: true
    how_verified: >-
      Оба места связки существуют. Отказ в СТАРТЕ — двумя независимыми стражами:
      requirePlatformRevocationAuthority (config/tokenissuers.go:385, зовётся из
      TokenAcceptance при readsRevocation) с выходом через main.go:198-201, и
      judgeOurRevocationAuthority (cmd/api-gateway/revocation_validation.go) с выходом
      через main.go:307. Отказ НА ПРЕДЪЯВЛЕНИИ — первая же ветка platformRevocationCheck
      (auth_revocation.go:280-285): при нулевом читателе возвращается revocationUnanswerable,
      то есть пара неисправности посадки на обеих поверхностях. Ветка достижима:
      WithPlatformRevocationCheck на nil молча ничего не делает (:160-163), значит
      состояние «объявили чтение, читателя не дали» представимо и отвергается. Обратная
      сторона (читатель провязан ⇒ тот же токен принимается) в сценарии есть.
  - id: Б5
    closed: true
    closed_at_document_level_only: true
    how_verified: >-
      На уровне ДОКУМЕНТА закрыто: норма §6 п.10 получила держателя Ф1б-09, и держатель
      утверждает ВЕЛИЧИНЫ («растёт ровно тот, чью неисправность воспроизвели»), а не
      наличие. Требование исполнимо — три отдельных имени величин заводятся. Состояние
      приземлённого кода ему не удовлетворяет; это не дефект контракта, но названо
      важным З4, потому что §6 об этом молчит там, где в соседнем пункте 7 такое же
      положение названо разменом.
  - id: Б6
    closed: true
    how_verified: >-
      Обе половины заголовка Ф1б-02а получили утверждения: единственность разбора
      утверждается переписью по дереву, согласие двух читателей — отдельно, и добавлен
      положительный близнец (профиль, с которым процесс поднимается, пробу не роняет).
      Производитель единственности на крае есть и единствен (см. З2); гейта, который бы
      её держал, в дереве нет — но это состояние кода, а не дефект контракта: гейт
      заводится, семь его родственников в internal/repohygiene существуют. Оговорка об
      области — З2.
cycle_convergence:
  round_1:
    blocking: 6
    род: >-
      ОДИН на все шесть: документ объявляет НОРМОЙ то, чего не утверждает ни один
      сценарий §5 (источники — §2, §6, заголовок сценария).
    radius_of_fix: >-
      документ 714 → 1048 строк (+334), сценариев 15 → 16, строк переписи 0 → 41,
      семнадцать строк получили держателя.
  round_2:
    blocking: 3
    род_breakdown:
      - род: >-
          норма объявлена, держателя нет — ТОТ ЖЕ РОД, ЧТО ВСЕ ШЕСТЬ КРУГА 1, ВТОРОЙ РАЗ
        ids: [Б7]
      - род: число без предиката / две величины разных единиц, выданные за одну пару
        ids: [Б8]
      - род: >-
          расхождение параллельных полос одного механизма не названо — при том что
          документ этот класс объявляет и закрывает на соседней оси
        ids: [Б9]
    radius_of_fix_expected: >-
      три абзаца и две строки переписи. Ни одно блокирующее не требует переписывать §5,
      §6 или §7; ни одно не меняет области фазы.
  same_род_twice: >-
    ДА, и это сказано отдельной строкой, как требует правило о сходимости цикла. Род
    «норма объявлена, держателя нет» отвергает документ ВТОРОЙ раз подряд — но не третий,
    и число упало с шести до одного. Класс не воспроизведён целиком: он уцелел РОВНО в
    той точке, где редакция 3 расщепила одну норму надвое и отвела строку переписи только
    одной половине. Это довод не против переписи, а за неё: без §5.0 сегодняшний обход был
    бы невозможен, и Б7 нашёлся именно обходом по ней. Перенос класса в форму задания
    (multi-agent-flow-orchestration.md §14а) состоялся и работает; остаток — не повторение
    цикла, а его хвост.
  numbers_measure_different_things: >-
    6 → 3 меряет БЛОКИРУЮЩИЕ, +334 строки меряет РАДИУС. Радиус круга 1 был велик, потому
    что чинился класс; радиус круга 3 ожидается малым, потому что чинятся три точки. Одно
    число без другого сказало бы неправду о сходимости в обе стороны.
  third_round_expected_short: true
  third_round_path: >-
    Круг 3 идёт ПО ПЕРЕПИСИ §5.0 и отдельно проверяет лишь то, чего в ней нет. Сегодняшний
    обход показал, что «того, чего в ней нет» — четыре нормы (Б7 + три из З1); закрыв их
    строками, автор делает перепись полной, и следующий обход становится механическим.
reviewer_own_errors_named_first:
  - >-
    Первое выражение переписи было СЛЕПЫМ: образец '^\| \*\*?Н[0-9]{2}' требует минимум
    одну звёздочку и потому видел только жирные (новые) строки — 17 из 41. Я принял бы
    17 за полную таблицу, если бы не проверил состав вывода, а не только число.
  - >-
    Второе выражение при поиске держателя нормы «исключение относится к обеим полосам»
    дало ноль: образец «обеим полосам» не совпал с «обеим** полосам» — разметка внутри
    словосочетания. Утверждение в дереве было, распознаватель его не видел. Обе ошибки
    одного класса и обе поймались сверкой СОСТАВА вывода с ожиданием, а не внимательностью.
  - >-
    Расхождение двух моих же агентов по Ф1б-09а («похоже на сценарий без производителя»
    против «производитель есть и единствен») разрешено УТОЧНЕНИЕМ ЕДИНИЦЫ, а не выбором:
    первый мерил наличие ИДЕНТИФИКАТОРА в дереве, второй — наличие ПРОИЗВОДИТЕЛЯ.
    Верны оба, и мерили разное; в перечень пошли оба ответа порознь (З5 и Б2).
what_this_review_does_not_cover:
  - >-
    Пробы не исполнялись. Все вердикты о дереве получены чтением и переписью по
    origin/main продукта e21ce060cd; ни один стенд не поднимался, ни один прогон не
    запускался. О ПОВЕДЕНИИ развёрнутого края здесь не сказано ничего.
  - >-
    Пять находок о приземлённом коде из записи круга 1 (Ф1б-01 critical-headers,
    Ф1б-03/04 текст отказа, Ф1б-10 владение, Ф1б-14 инъекция, Ф1б-07 предикат снятия)
    предметом ЭТОГО документа не являются и здесь не перепроверялись.
  - >-
    Верность держателя ПО СУЩЕСТВУ не проверялась там, где проверялось его наличие: у
    41 строки переписи установлено, что названный сценарий несёт утверждение нормы, а не
    что утверждение верно. На это отвечает прогон.
  - >-
    Побочные находки о продукте, всплывшие по дороге и НЕ заведённые задачами по прямому
    запрету владельца в этом задании: шапка introspection_failure_report.go:16-18
    утверждает «этот процесс метрик не отдаёт вовсе» при живом /metrics с 24 именами;
    комментарий main.go:508-511 описывает мягкое отвержение HMAC-токенов, которого в коде
    нет; http.Error в auth.go:986 пишет text/plain без поля code там, где все соседи на
    той же поверхности пишут JSON с code. Записано, чтобы знание не пропало вместе с
    сессией.
