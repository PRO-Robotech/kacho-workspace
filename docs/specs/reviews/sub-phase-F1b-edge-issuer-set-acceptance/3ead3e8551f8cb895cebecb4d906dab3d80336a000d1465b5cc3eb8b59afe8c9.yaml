      требует минимум одну звёздочку и потому видел только ЖИРНЫЕ (новые) строки — 17 из
      41. Исправленный образец '^\| (\*\*)?Н[0-9]{2}'. Класс — testing.md §«Гейт на
      класс» п.7, применённый к собственному разборщику рецензента.
    table_rows: 41
    unique_ids: 41
    gaps_or_duplicates: none
    by_source_recomputed: {§2: 24, §6: 15, scenario_heading_§5: 1, §7: 1}
    rows_naming_holder_outside_section_5: [Н35, Н37]
    rows_marked_with_round_1_blocker: {Н09: Б2, Н11: Б1, Н16: Б4, Н24: Б3, Н36: Б5, Н39: Б6}
    rows_marked_new: 17
    arithmetic_verdict: >-
      Таблица внутренне сходится. 40 → 41 объясняется ОДНОЙ новой нормой (Н40, §6 п.12);
      прочие 16 пометок «ново» означают «впервые получило держателя», а не «впервые
      сосчитано». 16 + 1 = 17 — сходится с числом пометок.
  independent_adjudication:
    method: >-
      Собственное извлечение предложений с деонтическим маркером по §2 (строки 213–363),
      §6 (893–997), §7 (998–1048) и по 16 заголовкам сценариев, затем адъюдикация каждого
      кандидата руками. Скрипт — только чтобы не пропустить кандидата глазами; решение —
      не машинное.
    candidates_with_deontic_marker: {§2: 19, §6: 9, §7: 7}
    verdict_on_holders: >-
      Все 17 новых строк проверены поимённо: названный держатель в КАЖДОЙ из 17
      действительно несёт утверждение этой нормы в своём теле. Выборочно проверены
      Н12, Н15, Н17, Н22, Н33, Н34 из прежних — тоже несут.
    verdict_on_completeness: >-
      ПЕРЕПИСЬ НЕПОЛНА. Найдено ЧЕТЫРЕ нормативных утверждения §2/§7, которым перепись
      не отводит строки. У трёх держатель есть (важные З1); у ЧЕТВЁРТОГО — §2.5,
      «обе поверхности обязаны отдавать одинаково КОД» — держателя нет ни одного
      (блокирующее Б7). Значит объявленное «без держателя — 0» ЛОЖНО, и ложно оно не
      потому, что держатель плох по существу, а потому, что норма в перепись не попала.
    was_the_zero_bought_by_narrowing: >-
      ЧАСТИЧНО ДА, и это названо прямо. Круг 1 блокировал нормой §2.5 «обе поверхности
      отвечают ОДНИМ постоянным сообщением». Редакция 3 расщепила её надвое: половина о
      ТЕКСТЕ внутри поверхности получила строку Н24 и держателей, половина о КОДЕ между
      поверхностями осталась в прозе §2.5 и в перепись не попала вовсе. Знаменатель при
      этом не уменьшился (40 → 41), поэтому сужение не видно арифметикой — видно только
      обходом.
blocking_findings:
  - id: Б7
    section: "§2.5, строки 339–341"
    same_род_as_round_1: true
    subject: >-
      §2.5 объявляет: «Что обе поверхности ОБЯЗАНЫ отдавать одинаково — это КОД: негодное
      удостоверение ⇒ отказ удостоверению, неотвечающий ИСТОЧНИК НАБОРА ⇒ неисправность
      посадки». Это ДВЕ нормы. Ни одна не имеет строки переписи и ни одна не утверждается
      ни одним сценарием §5.
    predicate: >-
      Перепись §5.0 по колонке «где объявлена»: строк §2.5 ровно три — Н22, Н23, Н24; ни
      одна не о коде. По §5 (строки 447–892) слово «код» встречается только в Ф1б-09
      (строки 748–758) и там относится к оси ОТЗЫВА. Ни одного утверждения о коде для
      негодного удостоверения и ни одного — для неотвечающего источника набора.
    producer_exists_in_tree: true
    producer_detail: >-
      Производители ЕСТЬ, то есть это не «Тогда без производителя», а именно норма без
      держателя. Негодное удостоверение: REST 401 + code 16, нативная gRPC
      codes.Unauthenticated(16) — сходятся. Неотвечающий источник набора: отдельная ветвь
      keySourceUnanswerable в проверяющем края принимает ErrJWKSUnreachable/
      ErrJWKSFetchFailed и уводит в полосу 503, а не 401.
    consequence_measured: >-
      Следствие для БЕЗОПАСНОСТИ, а не только для формы. 503-против-401 — единственный
      оставшийся различитель отказов края, и он коррелирует с фактом «у этого издателя
      ЕСТЬ запись»: издатель без записи даёт 401, издатель с записью, чей источник набора
      не отвечает, — 503. Это перечислительный оракул по издателям, ровно того рода,
      который §2.5 и запрещает. Ветвь достижима предъявителем: вынужденный перезапрос по
      неизвестному идентификатору ключа — предмет самого же Ф1б-08.
    remedy: >-
      Завести обе строки переписи и держателя. Достаточно расширить Ф1б-11/Ф1б-12 парой
      «код транспорта + код смысла» для обоих классов (как это уже сделано в Ф1б-09 для
      отзыва) и сказать в §2.5, входит ли «неотвечающий источник набора» в множество,
      которое анти-оракул обязан схлопнуть, либо объявлено различимым осознанно.
  - id: Б8
    section: "§2.5, врезка «Прежняя редакция требовала…» — основание отклонения Б3"
    same_род_as_round_1: false
    subject: >-
      Врезка отклоняет блокирующее круга 1 замером «внешних описаний отказа authN на REST
      — 8, на нативной gRPC — 1» и выводом «семь из восьми принадлежат полосам, которых
      фаза не касается». Ни одно из двух не воспроизводится: числа сняты РАЗНЫМИ единицами
      счёта, и у второго предиката нет вовсе.
    predicate: >-
      Единица «уникальный внешний текст отказа после раскрытия констант»: REST — 9
      написано, 8 достижимо (девятое, authFailedMsg в auth_stepup.go:137, недостижимо:
      его условие !stepUpCeremonyReachable ложно у обоих вызывающих); нативная gRPC — 5
      (missing Bearer token · authentication failed · token missing subject ·
      insufficient_user_authentication · credential refused). Единица «текст, которым
      поверхность отвечает на ошибку проверки»: REST 1 (token validation failed), gRPC 1
      (authentication failed). То есть 8 и 1 — величины разных единиц; при согласованной
      единице пара 8:5 либо 1:1, и заявленная асимметрия 8:1 не наступает ни при какой.
    predicate_named_by_author_covers_only_one_side: >-
      Врезка приводит предикат только для REST («отбор аргументов-описаний у функции,
      пишущей отказ REST, sort -u»). У числа «1» предиката нет. Сверх того посылка
      «REST-ветвь пишет отказ ОДНОЙ функцией» неверна: писателей на REST три —
      writeHTTPUnauthorized, инлайн-запись в enforceStepUpHTTP (обходит первого) и
      http.Error, пишущий text/plain без поля code.
    second_claim_not_reproduced: >-
      «Семь из восьми принадлежат полосам, которых фаза не касается» — по замеру чужим
      полосам принадлежит ТРИ (credential refused · session ended · session revocation
      check unavailable), спорно четыре (insufficient_user_authentication — пол, общий у
      предъявителя и сессии). Среди перечисленных автором «чужих» стоит «привязка
      машинного токена», которая есть предмет §2.4 и держатель Ф1б-10, то есть полоса,
      которую фаза как раз касается.
    what_survives: >-
      ВЫВОД врезки верен и замером не опровергнут: старая норма о тождестве ТЕКСТА между
      поверхностями о продукте ложна (REST token validation failed против gRPC
      authentication failed на одном и том же событии), переформулировка по поверхности
      верна, и держатели у Н24 есть на обеих. Блокирует не решение, а ОСНОВАНИЕ: §1 того
      же документа требует предиката у каждого числа, а это число — единственная запись
      о том, почему блокирующее рецензента отклонено.
    remedy: >-
      Назвать одну единицу счёта и привести обе величины ею, либо снять числа и оставить
      довод, который от них не зависит: одно и то же событие даёт на двух поверхностях
      разные байты, значит тождество текста поперёк поверхностей недостижимо и не нужно.
  - id: Б9
    section: "Ф1б-08 и §7 п.6"
    same_род_as_round_1: false
    subject: >-
      Документ находит расхождение параллельных полос одного механизма (окно вынужденного
      перезапроса: реестр берёт величину из общего объявления политики, край несёт
      собственную константу), объявляет класс и ЗАКРЫВАЕТ размен. В ТОМ ЖЕ сценарии
      Ф1б-08 лежит ВТОРАЯ ось того же класса — допуск на расхождение часов, — и она не
      названа ни требованием, ни разменом.
    predicate: >-
      Общее объявление — PRO-Robotech/corelib:tokenpolicy (пин v1.5.0), несёт ОБЕ
      величины: ClockSkew = 60s (policy.go:167) и UnknownKeyIDRefetchInterval = 30s
      (policy.go:173). Реестр берёт обе (verifier.go:239 и verifier.go:91). Край не берёт
      ни одной: окно — собственная константа forcedRefreshMinInterval = 3s
      (jwt_verifier.go:336); допуск — собственная ручка KACHO_JWT_CLOCK_SKEW_SECONDS
      с умолчанием 30 (config.go:527-528), и умолчание ДЕЙСТВУЕТ — ручку не задаёт ни
      один профиль развёртывания. Расхождения 30↔3 и 60↔30.
    document_own_rule_violated: >-
      Ф1б-08 сам устанавливает правило: «Нужна другая величина — она объявляется РАЗМЕНОМ
      со своим предикатом снятия (§7 п. 6), а не остаётся молча». Допуск часов остаётся
      молча. Плюс testing.md §«Гейт на класс» п.1 — чинить класс, а не экземпляр, — тот
      самый принцип, которым автор обосновывает перепись §5.0.
    landed_probe_asserts_a_value_the_edge_never_has: >-
      Приземлённая проба TestF1b08_ClockSkewIsAssertedOnBothSides
      (gateway/internal/middleware/f1b_token_checks_test.go:128) строит проверяющего БЕЗ
      ручки, попадает в запасной путь jwt_verifier.go:264-265 и закрепляет обе границы
      допуска против tokenpolicy.ClockSkew, то есть против 60 с. Развёрнутый край работает
      с 30 с. Проба зелена и утверждает о величине, которой у края не бывает — то есть
      сегодняшнее утверждение Ф1б-08 об этой оси не может упасть от расхождения.
    remedy: >-
      Один абзац, и исход на выбор автора: либо распространить требование «величина
      резолвится в объявление политики» на допуск часов, либо объявить его шестым-с-
      половиной разменом §7 с предикатом снятия. «Оставить молча» исходом не является по
      правилу самого Ф1б-08.
important_findings:
  - id: З1
    subject: >-
      Перепись §5.0 неполна ещё по ТРЁМ нормам, у каждой держатель есть, строки нет:
      (1) §2.2 «Исключение относится к обеим полосам одинаково» — держатель Ф1б-09а
      (строка 787); (2) §7 п.6 «у обеих конфигураций величина резолвится в объявление
      политики; собственная константа поверхности — находка» — держатель Ф1б-08 (строка
      734), и по объявленному правилу «§7 считается там, где размен называет поведение»
      строка полагается; (3) §6 п.5 в части «приём нашего издателя» и «отказ по издателю
      без записи» на каждой из трёх поверхностей — перечень, объявляющий состав
      утверждений, сам есть нормативное утверждение, и три оси из девяти получили строки
      (Н29–Н31), шесть — нет. Перепись объявлена ПРЕДИКАТОМ проверяемости документа, и
      следующий круг ходит по ней; значит её собственный обход обязан быть полон, иначе
      она даёт «ноль находок», неотличимый от «ноль прочитанного».
  - id: З2
    subject: >-
      Н39 сформулирована ШИРЕ дерева. «Разбор объявления в не-тестовом дереве ОДИН» —
      без указания области. По дереву продукта разборов этой формы объявления ДВА:
      gateway/internal/config/tokenissuers.go:190 (Config.TokenAcceptance) и
      services/registry/internal/apps/kacho/config/tokenissuers.go. Перепись по дереву,
      написанная дословно, даст 2 и покраснеет на верном коде. Назвать область («у края»).
      У края единственность подтверждена: не-тестовый вызывающий ровно один,
      gateway/cmd/api-gateway/main.go:197; гейта на неё в дереве нет (проверено в обе
      стороны: в internal/repohygiene семь гейтов вида singlesource/singularity, ни один
      не про этот предмет), держится соглашением в прозе трёх мест.
  - id: З3
    subject: >-
      Заголовок Ф1б-11/Ф1б-12 обещает НЕОТЛИЧИМОСТЬ, тело утверждает совпадение только
      ОПИСАНИЯ. Это род Б6 круга 1 («тест, чей заголовок шире тела»), и он предметен:
      соседний писатель REST кладёт разобранную ошибку в заголовок WWW-Authenticate
      (dpop_http_middleware.go:208-209), а sanitizeErr (:375-384) снимает кавычки и режет
      до 256 символов, текст НЕ схлопывает — три ветви (издатель · подпись · адресат) дали
      бы три различимых описания, причём ветвь адресата печатает ожидаемое и предъявленное
      значения. Сегодня путь недостижим ПОЗИЦИОННО (порядок монтирования в main.go:1120
      против :1121), а не структурно. Документ знает, что заголовки считаются: Ф1б-03
      (строка 642) говорит «ни в теле, ни в заголовках». Ф1б-11 и Ф1б-12 заголовков не
      называют вовсе.
  - id: З4
    subject: >-
      Ф1б-09 «счётчики раздельны, растёт ровно тот» — требование исполнимо, приземлённый
      код фазы ему НЕ удовлетворяет, и §6 этого не говорит вслух. По дереву раздельных
      ИМЁН величин под три названных предмета два, и оба общие с соседней ветвью:
      introspection_failures_total обслуживает и «ответило не то» (отказ), и «не ответило»
      (мягкий проход); platform_revocation_failures_total — и «настроено неверно», и «не
      ответило». У третьего предмета (наш токен без идентификатора, auth_revocation.go:
      286-290) имени нет вовсе — голый logger.Error без observe(). Сравнить с §6 п.7, где
      такое же положение названо разменом с предикатом снятия; здесь оно не названо.
  - id: З5
    subject: >-
      Трассируемость (Н40, §6 п.12) — предмет остался. Из 16 идентификаторов в дереве
      продукта 13 стоят в именах функций (01–13), 1 только в комментарии (Ф1б-02а), 2 не
      находятся НИ В ОДНОЙ форме — Ф1б-09а и Ф1б-14. Искались формы F1bNN, F1b_NN,
      F1b-NN, F1b.NN, F1b/NN, F1b:NN, F1b NN, с регистром и буквенным суффиксом, плюс
      кириллические написания; распознаватель расширялся дважды (диапазонная форма
      «Ф1б-02…05», перечень через слэш «Ф1б-11/12») — перепись не изменилась, и это
      сказано прямо. Сверх того в дереве девять проб фазы с префиксом F1b БЕЗ номера
      сценария, и одна из них (TestF1b_EveryProfileDeclaresAnAcceptanceTheProcessWillBoot)
      — ровно производитель Ф1б-02а: сценарий исполнен и не трассируем. Круг 1 давал
      3 ненайденных из 15; сегодня 2 из 16. Ф1б-14 не трассируется, будучи тем самым
      сценарием, который трассируемость и требует.
  - id: З6
    subject: >-
      Часть предмета фазы уехала в PRO-Robotech/kaname: четыре пробы TestF1b10_* живут там
      (internal/registrytokenwire, internal/handler/registrytokenhttp). §2.4, §3.1 п.7 и
      §6 п.7 говорят о «контуре выдачи докер-токена», не называя, что он теперь в другом
      репозитории. Перепись трассируемости по одному дереву о полноте покрытия фазы не
      высказывается — это надо сказать в самом требовании Н40, иначе его держатель зелен
      на половине предмета.
  - id: З7
    subject: >-
      Ф1б-09а «проба читает ПРОИЗВОДИТЕЛЯ перечня, а не своё представление о нём» —
      требование верное и предметное: сегодняшний чёрноящичный кейс
      gateway/tests/newman/cases/authn_edge.py:41-42 состав перечня ПЕРЕСКАЗЫВАЕТ прозой.
      Производитель существует и единствен — isPublicHTTPPath, authz_util.go:257, четыре
      точных адреса (/healthz, /readyz, /oauth/logout, /iam/v1/auth/me); он неэкспортируем,
      значит держателем может быть только проба пакета middleware. Это ограничение стоит
      назвать в сценарии — иначе «проба читает производителя» невыполнимо для пробы
      развёртывания и для чёрного ящика.
rejected_important_of_round_1_upheld:
  - id: ссылка на карту фаз
    author_position: отклонено замером «22 из 187»
    reviewer_verdict: ОТКЛОНЕНИЕ ЗАКОННО
    predicate: >-
      Числитель воспроизведён дословно: git grep -l '04-roadmap-and-phasing' origin/main
      -- 'docs/specs/*-acceptance.md' | wc -l → 22. Знаменатель зависит от единицы, и все
      три величины законны: 176 (sub-phase-*-acceptance.md), 186 (docs/specs/*-acceptance.md
      — единица собственного гейта дерева scripts/docs-gate/check-01), 187 (плюс
      docs/changes/standalone-iam/acceptance.md, приёмка по всем признакам, лежащая вне
      pathspec гейта). Круг 1 называл 186, автор 187 — числа разной единицы, не спор.
      Доля 11,8 % по воркспейсу, 10,0 % по обоим домам приёмок, 0 % по второму дому
      (PRO-Robotech/kaname, 34 приёмки, ссылок на карту фаз ноль by construction — карта
      живёт в воркспейсе). 13 из 22 — приёмки ранней нумерации 0.x–3.x, то есть практика
