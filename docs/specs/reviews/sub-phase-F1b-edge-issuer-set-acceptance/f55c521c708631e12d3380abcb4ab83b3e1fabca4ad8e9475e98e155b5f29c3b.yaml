cycle:
  сошёлся: ДА
  чем: >-
    Заморозкой прибора и сужением утверждений о нём, а не ещё одной осью. Блок команды побайтово
    прежний (sha256 fddc96c5…), вывод побайтово прежний; глобальных утверждений о полноте прибора
    вне помеченных цитат не осталось; перечень распознаваемых форм несёт колонку «вне прибора» с
    тринадцатью прогонами прошлого круга поимённо и правило «всё, чего в колонке нет, — вне
    прибора, держатель — чтение рецензента». Род шести кругов — квантор всеобщности над
    конечным перечнем — в утверждениях о приборе больше не наступает.
  почему_ряд_не_убывал_и_почему_теперь_ноль_честен: >-
    Ноль этого круга получен не тем, что искать стало нечем: этот круг нашёл пять важных, и одна
    из них — новая форма слепоты (З25). Ноль получен тем, что утверждения документа перестали эти
    формы отрицать, — именно это решение и меняло, и ровно это здесь проверено.
  новая_форма_слепоты_поданная_как_блокирующее: >-
    НЕТ. Единственная новая форма, найденная этим кругом, — заголовок ATX с табуляцией (З25), — подана
    важной, а не блокирующей, по решению, под которым шёл круг. Средство для неё выбрано такое, чтобы
    следующий круг не мог открыть этот класс заново: авторитет выражения команды над пересказом.
  чего_ноль_НЕ_значит: >-
    Не значит, что прибор ловит больше, чем ловил на редакции 7: он не менялся. Не значит, что
    важные замечания необязательны: они о правдивости текста о приборе; любая их правка даёт новый
    отпечаток и потребует нового круга, на который этот вердикт не переносится.

what_is_NOT_wrong:
  - 'заморозка исполнена буквально: ноль строк в блоке, вывод побайтово прежний — предикат автора воспроизведён'
  - 'журнал ред. 5–7 не переписан: суженные места помечены «сужено/отозвано редакцией 8» с номером находки, прежний текст оставлен в цитате'
  - 'таблица распознаваемых форм — правильная форма: у каждой строки прогон на «краснеет» и прогон на «вне прибора» там, где он показан; пустая клетка объявлена «не показано», а не «нет»'
  - 'числа врезки редакции 8 сошлись с моими предикатами: 47 из 53, 19 · 28, 102 → 99, 5 → 6, 13 в колонке, строк таблицы 24, «девять из одиннадцати» и «держатся 5 и 9» — с записью круга по редакции 7'
  - 'журнал редакции 8 называет свою ошибку первой, в четырёх пунктах, включая перенос формулы роли без перемера'

gates_run_before_handoff:
  условие_создано: 'KACHO_MONOREPO=<воркспейс>/project/kacho, KACHO_HOME_KANAME=<воркспейс>/project/kaname'
  где: 'рабочая копия записи — origin/review/f1b-round2 @ 47097e7b плюс этот файл'
  результаты:
    - {набор: adapter-gate, код: 0, перепись: 'рассмотрено 7, пройдено 7, провалено 0, без предмета 0'}
    - {набор: change-graph-gate, код: 0, перепись: 'рассмотрено 4, пройдено 4, провалено 0, без предмета 0'}
    - {набор: docs-gate, код: 0, перепись: 'рассмотрено 6, пройдено 6, провалено 0, без предмета 0'}
    - {набор: rules-gate, код: 0, перепись: 'рассмотрено 3, пройдено 3, провалено 0, без предмета 0'}
    - {набор: skills-gate, код: 0, перепись: 'рассмотрено 7, пройдено 7, провалено 0, без предмета 0'}
    - {набор: tooling-gate, код: 0, перепись: 'исполнено 9, пройдено 9, провалено 0, без предмета 0'}
    - {набор: vault-gate, код: 0, перепись: 'рассмотрено 5, пройдено 5, провалено 0, без предмета 0'}
  перечень_наборов_выведен: "git ls-files -- ':(glob)scripts/*/run-all.sh' — 7"
  область_зелёного: >-
    Наборы судят ДЕРЕВО ВОРКСПЕЙСА, а не содержание приёмки; docs-gate читает объявленный
    вердикт и не судит его истинности (change-graph.md §2). Команда §5.0 — отдельный предмет, её
    исход выше.

my_own_errors_this_round:
  - >-
    Унаследованная: равносильность в З19 круга по редакции 7 (см. З23) — названа первой в самой
