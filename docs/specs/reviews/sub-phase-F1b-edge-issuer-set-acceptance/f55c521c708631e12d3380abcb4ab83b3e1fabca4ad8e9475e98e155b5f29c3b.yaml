    - {id: N1, 'факт': 'то же, и второй экземпляр `### 2.99` — повтор имени НЕПОКРЫТОГО источника', 'код': 1, 'вывод': "без держателя ['§2.99', '§2.99'] · имя не единственно ['§2.99'] · сверка N-P-void=M СХОДИТСЯ"}
    - {id: N4a, 'факт': 'в §2 перед `### 2.4` заведён второй `### 2.3` — повтор имени ПОКРЫТОГО источника', 'код': 1, 'вывод': "имя не единственно ['§2.3'] · сверка РАСХОДИТСЯ"}
    - {id: N4, 'факт': 'то же, и в ведомость внесена запись `§7 п. 99` без предмета', 'код': 1, 'вывод': "без предмета ['§7 п. 99'] · имя не единственно ['§2.3'] · сверка СХОДИТСЯ — два нарушения сократились"}
    - {id: N2twin, 'факт': 'у `Н07` из колонки снят повтор `§6 п. 5` (источник держат другие строки)', 'код': 0, 'вывод': "только новый элемент оси адрес-ссылка '§6 п. 5→Н07' — как Р10"}
    - {id: N2, 'факт': 'у `Н05` снято ЕДИНСТВЕННОЕ место `§2.1`; `§2.1` держат другие строки', 'код': 1, 'вывод': "места нет ['Н05→']"}
    - {id: N3t, 'факт': 'в конце §2 заведён `## Приложение: …` с нормой', 'код': 1, 'вывод': "без раскладки ['Приложение: требования к краю']"}
    - {id: N3, 'факт': 'то же, между `##` и текстом — табуляция вместо пробела', 'код': 0, 'вывод': 'побайтово равен контролю'}
  отрисовка_N3_проверена: >-
    markdown-it 3.0.0, режим commonmark: `##\tПриложение` — заголовок h2, как и `## Приложение`.
    То есть N3 — заголовок ATX по CommonMark, который выражение команды `^#{1,2} ` не читает.

# ─────────────────────────────────────────────────────────────────────────────
blocking_findings: []

important_findings:
  - id: З23
    предмет: >-
      Сверке `N − P − void = M` приписана РАВНОСИЛЬНОСТЬ, а верна только импликация
    место: >-
      §5.0 строки 1522–1524 («совпадают они тогда и только тогда, когда ни одно имя источника не
      повторено и ни одна запись ведомости не висит в пустоте») и строка 21 таблицы «Чем задана
      сама перепись» (строка 1839: «повтор имени — находка, и `M` расходится с `N − P − void`»)
    признак: >-
      N1: повтор имени непокрытого источника даёт `имя не единственно` и `сверка … сходится`.
      Верно «обе оси пусты ⇒ сходится» и потому «расходится ⇒ непуста одна из осей» — ровно тот
      вывод, который абзац делает дальше («краснеет она только вместе с одной из них»); неверно
      обратное. Сокращаются друг с другом и повтор покрытого имени с висящей записью ведомости: N4a — сверка расходится, N4 (плюс запись без предмета) — сходится при двух красных осях.
    почему_не_блокирующее: >-
      Повтор имени ловит ось `имя не единственно`, код 1 наступает всегда; утверждение завышает
      чувствительность СВОДКИ, а не охват прибора, и вывод абзаца верен.
    ошибка_роли_первой: >-
      Формула «сверка алгебраически РАВНА конъюнкции двух осей» — моя, З19 круга по редакции 7.
      Равенства там нет, есть следование; автор перенёс её в «тогда и только тогда». Тот же путь,
      каким в документ пришла «на любой глубине» из записи круга по редакции 5.
    remedy: >-
      «тогда и только тогда» → «тогда»; в строке 21 «и `M` расходится» → «`M` расходится, если
      повторено имя покрытого источника». Прибор не трогается.

  - id: З24
    предмет: >-
      Три места о предмете Б19 остались несуженными — утверждения о полноте без квантора либо с
      заглавным квантором; у каждого в том же разделе стоит суженный близнец
    места:
      - место: '§5.0 строка 1629 — «Колонка «где объявлена» — место ВСЕХ объявлений нормы»'
        близнец: 'строка 2112 — «обязана нести ВСЕ места … что мест нет сверх названных, судит чтение (Р5)»'
        remedy: '«место» → «обязана быть местом», как на строке 2112'
      - место: '§5.0 строка 2002 — «ноль считался по строкам, которые кто-то завёл, и молчал о нормах, которым строки не завели»'
        суть: >-
          противопоставление подразумевает, что знаменатель это закрыл; Р5 на редакции 8: норма
          без строки внутри держащегося источника — ноль прежний
        близнец: 'таблица знаменателей, строка A («Утверждение, вписанное в источник, где строка уже есть, — не ловит»)'
        remedy: 'дописать «… и о нормах внутри держащегося источника молчит по-прежнему (Р5)»'
      - место: '§6 п. 13 строка 2969 — «Обход идёт в обе стороны: от норм к держателям и от держателей к нормам»'
        суть: 'против §5.0 строки 1504: «Вопроса «у всякой ли нормы есть держатель» не задаёт ни один»'
        близнец: 'выделенный абзац того же пункта, строки 2954–2962, «Ноль — об ИСТОЧНИКАХ»'
        remedy: '«от норм к держателям и от держателей к нормам» → «от источников к строкам и от сценариев к строкам»'
    почему_не_блокирующее: >-
      Ни одно из трёх не приписывает команде находки, которой она не производит, и у каждого
      суженное утверждение о том же предмете стоит в том же разделе, в двух случаях — выделено.
      Читатель, идущий по разделу, не получает из них веры в молчание команды; получает
      противоречие, разрешённое соседней фразой. Класс — «два места об одном предмете, одно
      верно», тот же, что З18 и З22 прошлого круга.

  - id: З25
    предмет: >-
      Ярлык «ATX» в описании распознаваемой формы шире выражения команды — новая форма слепоты
      на краю пересказа
    место: >-
      строки 4 и 5 таблицы «Чем задана сама перепись»; §5.0 строка 1542 («ATX-заголовок иной формы
      (`## Приложение`) … становятся находкой `без раскладки`»); строка A таблицы знаменателей
    признак: 'N3 (табуляция после `##`) — молчит; близнец N3t (пробел) — `без раскладки`. Выражение команды — `^#{1,2} `.'
    почему_не_блокирующее: >-
      По решению этого круга новая слепая форма блокирующей не является, если утверждения о
      приборе её не отрицают; здесь отрицание есть только через ярлык, а литерал `#`/`##` в
      обратных кавычках рядом с ним и заголовки самого документа задают форму «решётки и пробел».
      Норма, внесённая под таким заголовком, попадает в держащийся источник — это случай Р5, уже
      названный вне прибора.
    remedy_сходящееся: >-
      НЕ строка на каждый край пересказа — это воспроизвело бы невязку шести кругов на уровне
      пересказа: у всякого описания выражения словами найдётся край. Одна фраза при таблице:
      «колонка «в какой форме распознаёт» — пересказ выражений команды; где пересказ шире
      выражения, прав текст команды». Тогда форма из колонки есть то, что матчит выражение, и
      опровергнуть утверждение краем пересказа нельзя по построению. Прибор не растёт.

  - id: З26
    предмет: 'занижение, безопасная сторона: «роняет код, только если у источника это место было единственным»'
    место: '§5.0 строка 1656 и строка 16 таблицы (строка 1834 — «снятое место — находка, если оно у источника единственное»)'
    признак: >-
      N2: у строки снято её ЕДИНСТВЕННОЕ место, источник держат другие строки — `места нет
      ['Н05→']`, код 1. Прибор строже описания: пустая ячейка есть «места нет».
    remedy: 'дописать «… либо если оно было единственным местом самой строки — пустая ячейка даёт `места нет`»'

  - id: З27
    предмет: 'заявления врезки редакции 8 о собственной работе шире сделанного'
    места:
      - место: 'строка 364 — «Прогоны круга воспроизведены до правки … двадцать прогонов и контроль»'
        суть: >-
          У круга по редакции 7 прогонов двадцать два и контроль; не воспроизведены Р12 и Р17. Р17 —
          положительный контроль; Р12 — вход §1, отличный от И9 (§6 п. 13), и назван пределом 1
          по И9, а не по себе. Сама фраза числом правдива; пробел — в том, что она не называет двух
          оставшихся.
      - место: 'строка 332 — «Утверждения о приборе … сужены до того, что он проверяет на самом деле»'
        суть: 'шире сделанного на З23–З25'
    remedy: 'назвать Р12 и Р17 невоспроизведёнными; «сужены до того, что он проверяет» — «сужены; остаток — З23–З25 круга по редакции 8»'

minor_notes:
  - >-
    Заголовок колонки «показано вне прибора — молчит» накрывает Р1 (сдвиг сумм) и Р10 (элемент
    оси «адрес-ссылка»), побайтово не молчащие; «молчит» здесь значит «ни одной находки при коде
    0», и документ это различие называет в других местах. Одна оговорка у заголовка сняла бы
    двусмысленность.

