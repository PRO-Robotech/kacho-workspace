next_step: >-
  Оркестратор публикует внешнее событие вердикта под допущенной политикой учётной записью по
  решению владельца. Правка документа по З23–З27 — по выбору автора и владельца; она даст новый
  отпечаток и новый круг, этот вердикт на неё не переносится. После действующего одобрения —
  class-exposure-analyst по одобренному замыслу.
