# ─────────────────────────────────────────────────────────────────────────────
decision_this_round_was_run_under:
  source: задание оркестратора этому кругу
  суть: >-
    Прибор §5.0 заморожен: оси, формы и распознаватели ему не добавляются. Разрешено только
    СУЗИТЬ утверждения о приборе до перечня форм, которые он распознаёт, и назвать остальное
    лежащим вне прибора с держателем «чтение рецензента». Блокирующим считается ровно одно:
    утверждение документа шире того, что прибор проверяет, либо норма продукта, тронутая кругом.
    Новая слепая форма блокирующим не является, если утверждения о приборе её не отрицают.
  как_я_провёл_границу_блокирующего: >-
    Блокирующее — утверждение о приборе, которое (1) приписывает ему обнаружение либо полноту,
    (2) опровергается прогоном и (3) нигде в документе не сужено, так что читатель, поверивший
    ему, примет молчание команды за вердикт. Утверждение, у которого в том же разделе стоит
    явное суженное утверждение о том же предмете, — важное: это «два места об одном предмете,
    одно верно», тот же класс, что З18 и З22 круга по редакции 7, которые я ставил важными.
    Граница взята из прецедента прошлого круга, а не выведена из желания закрыть цикл: при том
    же отношении «утверждение шире прибора, суженный близнец рядом» я ставил З18 и З22 важными;
    проверяется сверкой с записью круга по редакции 7. Сформулирована она по ходу разбора, а не
    до него, — это сказано, чтобы её не приняли за заранее объявленную.

scope:
  reviewed: >-
    Дельта редакции 7 → 8 целиком (50 кусков, +333 −147, один файл); §5.0 целиком (строки
    1153–2218 редакции 8); §6 п. 13 целиком; журнал преамбулы редакций 5–8. Разделы норм
    продукта (§0–§4, §6 п. 1–12, §7) и все шестнадцать сценариев сверены с редакцией 7
    ПОБАЙТОВО, а не перечитаны.
  full_acceptance_document_read: false
  product_part_basis: >-
    Суждение о продуктовой части унаследовано от кругов по редакциям 2–7 (записи перечислены
    выше): у круга по редакции 7 — «регрессии в продуктовой части нет», у всех кругов 3–7
    блокирующие были о переписи и приборе, а не о нормах. Этот круг доказал, что предмет того
    суждения не изменился ни одним байтом, и больше о продуктовой части не утверждает.
    Сверх того в этом круге: у всех 16 сценариев есть Given/When/Then (разбор по заголовкам
    `**ID:`), открытых вопросов в тексте нет (поиск «открыт… вопрос», «TBD», «TODO» — пусто).
  product_revision_consulted: none
  stand_raised: false
  implementation_completion_claimed: false

