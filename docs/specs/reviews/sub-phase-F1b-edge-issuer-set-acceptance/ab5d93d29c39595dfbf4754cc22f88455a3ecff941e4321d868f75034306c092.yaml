# ─────────────────────────────────────────────────────────────────────────────
# ГЛАВНОЕ ЭТОГО КРУГА: испытывался ЗНАМЕНАТЕЛЬ, а не документ
# ─────────────────────────────────────────────────────────────────────────────
denominator_under_test:
  what_round_5_prescribed: >-
    Арифметика честно механична в своей области, и область у неё у́же предмета: сумма по строкам
    не видит строки, которой нет, не высказывается о предикат-строках и не входит в колонку
    держателей. Остаток обязан закрыть второе, тоже механическое средство.
  what_the_author_delivered: >-
    Команда §5.0 печатает ТРИ строки: числитель и два знаменателя обхода. A — абзацы-источники
    (§0 · заголовки 2.N · нумерованные пункты §6 и §7), с осями «без держателя» и «висячих
    адресов» и ведомостью исключений, читаемой ИЗ ДОКУМЕНТА. B — сценарии §5, ось «не названы».
    Шесть одно-фактных прогонов инъекции над самой командой.

  # ── 1. Исполняется ли команда ВЕРБАТИМ ────────────────────────────────────
  command_runs_verbatim:
    answer: ДА — свойство пережило рост формы
    method: >-
      Блок ```sh §5.0 извлечён из документа БЕЗ ЕДИНОЙ ПРАВКИ (строки 1104–1169, включая
      комментарии `# ->`) и исполнен из корня рабочей копии редакции 6
      (origin/lane/f1b-round2 @ abdc9edf).
    output_reproduced_byte_for_byte:
      - 'строк 57 Σ предписано 100 Σ утверждается 100 предикат-строк 4 расхождения []'
      - 'источников 26 строка либо адрес 25 нормы не несут 1 без держателя [] висячих адресов []'
      - 'сценариев 16 названы держателем 16 не названы []'
    matches_the_comment_in_the_document: true
    exit_code: 0
    verdict: >-
      Круг по редакции 5 отметил вербатим-исполнимость как первую за четыре круга. Форма выросла
      с одной печатаемой строки до трёх и с 52 строк обхода до 57 — свойство сохранилось.

  # ── 2. МОЯ инъекция, СВОИМ набором ────────────────────────────────────────
  my_own_injection:
    method: >-
      Изолированная копия документа (каталог вне любого репозитория; общие рабочие копии не
      тронуты, tmp/f1b-round2 не открывался). Команда берётся ИЗ САМОЙ КОПИИ — извлекается
      фенс ```sh, содержащий слово ЧИСЛИТЕЛЬ, — иначе доказывалась бы способность падать у
      чего-то другого. Десять прогонов, каждый отличается от контроля РОВНО ОДНИМ фактом.
      Набор мой, а не авторский: ни один из шести его фактов не повторён.
    runs:
      - id: М0
        факт: контроль, копия не тронута
        числитель: 'Σ 100 = Σ 100, расхождения []'
        знаменатель: 'строка либо адрес 25 · без держателя [] · висячих адресов [] · названы 16'
        код: 0
      - id: М1
        факт: >-
          §7 п. 7 — его ЕДИНСТВЕННЫЙ адрес `Н44` переписан на `Н08`: строка существует, но её
          источник §2.2, а не §7 п. 7, и её норма («мягкий проход прежней полосы») к встречному
          требованию пункта отношения не имеет
        числитель: МОЛЧИТ
        знаменатель: МОЛЧИТ
        вывод_побайтово_равен_контролю: true
        это_и_есть_искомый_факт: true
      - id: М2
        факт: >-
          заведён новый источник §7 п. 8, предписывающий поведение края, без строки и без адреса
        числитель: молчит
        знаменатель: "КРАСНЕЕТ — без держателя ['§7 п. 8']"
        роль: >-
          положительный контроль на МОЁМ входе: знаменатель жив и называет координату, значит
          его молчание в М1/М3/М4/М5/М6/М9 есть вердикт, а не смерть
      - id: М3
        факт: >-
          у ИСКЛЮЧЁННОГО источника §6 п. 13 появилась норма о продукте («край обязан отвергать
          токен неизвестного издателя на обеих поверхностях»)
        числитель: МОЛЧИТ
        знаменатель: МОЛЧИТ
        вывод_побайтово_равен_контролю: true
        опровергает: >-
          §5.0 дословно: «ведомость, у чьей записи предмет появился, роняет перепись САМА»
      - id: М4
        факт: >-
          в ведомость добавлена запись `§7 п. 99` — источника с таким именем в документе нет
        числитель: молчит
        знаменатель: "молчит; печатает «нормы не несут 2», арифметика N = M + P сходится (26 = 24 + 2)"
        опровергает: >-
          testing.md §«Гейт на класс» п. 5 — «запись, которой больше нечего исключать, — находка»
      - id: М5
        факт: >-
          в ведомость добавлена запись `§7 п. 1` — живой источник, НАЗЫВАЮЩИЙ ПОВЕДЕНИЕ
        числитель: молчит
        знаменатель: "молчит; источник тихо уходит из населения, «строка либо адрес» падает 25 → 24"
      - id: М6
        факт: >-
          строка `Н44` называет третьим держателем `Ф1б-70` — сценария с таким именем нет
        числитель: молчит
        знаменатель: "МОЛЧИТ — сценариев 16, названы 16, не названы []"
        асимметрия: >-
          сторона A висячий адрес ловит («висячих адресов»), сторона B висячего держателя не
          ловит: orphan считает только sc ⊄ named и никогда named ⊄ sc
      - id: М7
        факт: >-
          сняты ВСЕ строки `**ID: Ф1б-NN**` (пустой обход по стороне B)
        вывод: 'обход пуст — вердикта нет'
        код: 1
      - id: М8
        факт: сняты ВСЕ строки переписи (пустой обход по числителю)
        вывод: 'обход пуст — вердикта нет'
        код: 1
      - id: М9
        факт: >-
          норма о продукте заведена нумерованным пунктом в §3.1 — раздел ВНЕ населения
          знаменателя, при том что разметка у пункта та самая, которой знаменатель требует
        числитель: молчит
        знаменатель: МОЛЧИТ
        вывод_побайтово_равен_контролю: true

  # ── 3. ФАКТ, НА КОТОРОМ МОЛЧАТ ОБА ────────────────────────────────────────
  fact_where_both_are_silent:
    answer: НАЙДЕН, и не один — четыре разных механизма
    список:
      - {id: М1, механизм: 'адрес на СУЩЕСТВУЮЩУЮ, но ЧУЖУЮ строку засчитывается покрытием'}
      - {id: 'М3/М4/М5', механизм: 'ведомость исключений не гейтится ни в одну сторону'}
      - {id: М6, механизм: 'висячий ДЕРЖАТЕЛЬ на стороне B не ловится'}
      - {id: М9, механизм: 'население A задано ПЕРЕЧНЕМ РАЗДЕЛОВ, и перечень живёт в скрипте'}
    самый_тяжёлый_М1_и_почему:
      признак: >-
        Покрытие источника считается так: `n in decl` ЛИБО в теле есть хоть один `Н\d\d`,
        чей id существует. Совпадение источника адресуемой строки с самим источником НЕ
        проверяется, хотя скрипт эту величину уже вычисляет (третья ячейка строки).
      замер_по_дереву_документа: >-
        Из 26 источников ЧЕТЫРЕ покрыты ТОЛЬКО адресом на строку, чей источник другой:
        §7 п. 1 (Н08→§2.2, Н36→§6 п. 10) · §7 п. 2 (Н01→§2.1, Н04→§2.1) ·
        §7 п. 5 (Н18→§2.4, Н33→§6 п. 7) · §7 п. 7 (Н44→§2.5).
      почему_это_несущее: >-
        ТРИ из четырёх находок, которыми знаменатель себя оправдал, закрыты именно этой формой
        («первые три — адресами»). То есть собственные находки инструмента закрыты тем
        единственным видом покрытия, который он не умеет судить.
      проверено_чтением_и_документ_сегодня_ВЕРЕН: >-
        Все четыре адреса прочитаны против текста своих пунктов и текста адресуемых строк, и
        все четыре по существу верны. Поэтому это ВАЖНОЕ (З14), а не блокирующее: ложного
        утверждения в документе нет, слаб инструмент.

  # ── 4. Выводятся величины или выписаны ────────────────────────────────────
  are_the_values_derived_or_written_out:
    answer: НАПОЛОВИНУ, и обе половины названы
    выводится: >-
      Членство ВНУТРИ объявленного раздела — по дереву документа: `## §0`, заголовки
      `### 2.N`, нумерованные пункты §6 и §7, строки `**ID: Ф1б-NN**`. Это настоящая
      деривация: М2 (новый пункт §7) и М7 (снятые ID) её подтверждают поведением.
    выписано:
      - >-
        НАБОР РАЗДЕЛОВ — литеральный перечень в скрипте: span('## §0'), '## §2', '## §6',
        '## §7'. Ровно та форма, которую документ отвергает для ведомости: «Скрипт, знающий
        исключения сам, есть второе место об одном предмете». Здесь скрипт знает НАСЕЛЕНИЕ.
        Доказано М9: норма с требуемой разметкой, но в §3, невидима.
      - >-
        ВЕДОМОСТЬ ключуется ИМЕНЕМ и не проверяется ни в одну сторону (М3, М4, М5).
    единица_источника_чья: >-
      Источник — не «абзац» и не «норма», а РАЗДЕЛ ОБЪЯВЛЕННОГО ВИДА. Внутри вида единица
      выводится; сам вид выбран перечнем. Отсюда и блокирующее Б18.

  # ── 5. Пустой обход ───────────────────────────────────────────────────────
  empty_traversal_gives_code_1:
    answer: ДА, по ОБЕИМ сторонам
    предикат: >-
      `if not (rows and src and sc): raise SystemExit('обход пуст — вердикта нет')`
    прогоны: [М7 (сняты сценарии) → код 1, М8 (сняты строки) → код 1]
    замечание: >-
      Третья конъюнкта (`src`) непроверяема инъекцией без правки самих заголовков `##` и здесь
      не испытывалась; это названо, чтобы «проверено» не читалось шире сделанного.

# ─────────────────────────────────────────────────────────────────────────────
blocking_findings:
  - id: Б17
    класс: >-
      МЕХАНИЗМ ОБЪЯВЛЕН СВОЙСТВОМ, КОТОРОГО НЕ НЕСЁТ — ведомость исключений не самоистекает
      ни в одну сторону, а документ говорит, что самоистекает
    same_род_as_earlier_rounds: true
    род_history: >-
      Тот же род, что все шесть круга по редакции 2, Б7 (ред. 3), Б10/Б13 (ред. 4),
      Б14/Б15/Б16 (ред. 5): норма и её держатель расходятся. ПЯТЫЙ РАЗ. Сдвиг измерим: прежде
      род жил в числовых строках, потом в предикат-строках и в отсутствующей строке; теперь он
      в САМООПИСАНИИ ЗНАМЕНАТЕЛЯ — в свойстве, которое инструмент себе приписывает.
    section: §5.0, абзац «Ведомость `P` живёт В ДОКУМЕНТЕ, а не в скрипте, и потому самоистекает»
    цитата_которая_опровергнута: >-
      «ведомость, у чьей записи предмет появился, роняет перепись САМА»
    предикат_опровержения:
      - >-
        М3: §6 п. 13 — единственная запись ведомости — получает норму о продукте одной строкой.
        Команда печатает вывод, ПОБАЙТОВО равный контролю. Предмет появился, перепись не упала.
      - >-
        М4: в ведомость добавлена запись на источник, которого в документе нет вовсе. Перепись
        печатает «нормы не несут 2», арифметика N = M + P сходится, красного нет. Запись,
        которой нечего исключать, находкой не становится.
      - >-
        М5: ведомость исключает §7 п. 1 — живой пункт, НАЗЫВАЮЩИЙ ПОВЕДЕНИЕ. Источник молча
        уходит из населения, «строка либо адрес» падает 25 → 24, арифметика сходится.
    почему_это_не_редакционная_правка:
      - >-
        Довод, которым ведомость помещена в документ («скрипт, знающий исключения сам, —
        второе место об одном предмете»), ВЕРЕН и принимается целиком. Неверна вторая половина
        абзаца: из «живёт в документе» не следует «самоистекает». Ключ ведомости — ИМЯ, а имена
        не меняются, когда меняется содержимое.
      - >-
        Корпус требует этого прямо: testing.md §«Гейт на класс», п. 5 — «Исключение живёт, пока
        у него есть предмет… запись, которой больше нечего исключать, — находка». М4 показывает,
        что требование не исполнено.
      - >-
        Цена нечинения — та же, что у Б16: следующий круг ЧИТАЕТ, что ведомость самоистекает, и
        не смотрит туда. Ложное свойство инструмента дороже ложного числа: оно отменяет обход.
    remedy_варианты_а_не_предписание:
      - >-
        (1) Механическая половина — исполнима и мала: перепись обязана требовать, чтобы КАЖДАЯ
        запись ведомости называла СУЩЕСТВУЮЩИЙ источник, и падать, когда не называет (снимает
        М4). Инъекция обязана быть в обе стороны: запись с предметом молчит, запись без
        предмета краснеет с именем.
      - >-
        (2) Семантическая половина машинного предиката НЕ ИМЕЕТ, и это надо сказать прямо
        вместо «самоистекает»: судит ли запись верно (М3, М5) — вопрос к человеку, ровно как
        change-graph §1 говорит о смысле прозы. Фраза о самоистечении заменяется на «ведомость
        видна и правится в документе; её ВЕРНОСТЬ судит читатель, а перепись судит лишь то,
        что у записи есть предмет».
    radius: одно предложение §5.0 плюс две строки команды

  - id: Б18
    класс: >-
      НАСЕЛЕНИЕ ЗНАМЕНАТЕЛЯ ЗАДАНО ПЕРЕЧНЕМ РАЗДЕЛОВ, ЖИВУЩИМ В СКРИПТЕ, и «без держателя — 0»
      поэтому у́же, чем читается: две нормы о продукте лежат вне населения и не имеют ни строки,
      ни адреса
    same_род_as_earlier_rounds: true
    род_note: >-
      Продолжение Б16 («перепись объявляет о СЕБЕ „без держателя — 0“, и этот ноль ЛОЖЕН»).
      Форма закрытия доставлена и работает — это принимается целиком; неверно её НАСЕЛЕНИЕ.
    section: §5.0, таблица знаменателей · §6 п. 13 · §3.1 п. 2 · §4 п. 8
    что_объявлено: >-
      §6 п. 13 объявляет перепись ПРЕДИКАТОМ ПРОВЕРЯЕМОСТИ документа: «у каждого нормативного
      утверждения назван держатель, „без держателя“ — НОЛЬ». §5.0 объявляет критерий, по
      которому раздел становится источником: §7 включён «именно там, где размен НАЗЫВАЕТ
      ПОВЕДЕНИЕ».
    что_измерено:
      предикат: >-
        Тем же обходом, что в команде, но по разделам §3 и §4: нумерованные пункты, поиск
        `Н\d\d` в теле и сверка с колонкой источника переписи.
      находки:
        - источник: §3.1 п. 2
          норма: >-
            «каждая ветка отказа разбора объявления обязана иметь СВОЙ различитель и вход, на
            котором отказать может только она» плюс врезка: «Держит это ПЕРЕПИСЬ по дереву…
            она печатает, сколько веток отказа нашла и сколько из них названо таблицей».
          это_норма_над_ОТКРЫТЫМ_населением: true
          строки_переписи_нет: >-
            Предикат-строк в документе четыре — Н17 (обязательный перечень проверок), Н24
            (неотличимость отказа), Н40 (трассируемость Ф1б-NN), Н49 (величины политики). Ни
            одна не о ветвях отказа разбора. Предикат:
            `grep -cE '^\| (\*\*)?Н[0-9]{2}.*(различител|ветвей отказа|веток отказа)'` → 0.
          держатель_ПО_СУЩЕСТВУ_есть: >-
            Ф1б-02 несёт дословно: «у КАЖДОГО стража старта есть вход, на котором отказать
            может только он… Проверяется таблицей, и таблица печатает свою перепись».
        - источник: §4 п. 8
          норма: >-
            «Общее выражение сборки цепочки края… заводится ДО сквозных проб, и его зовут ОБА —
            корень и проба».
          строки_переписи_нет: >-
            `grep -cE '^\| (\*\*)?Н[0-9]{2}.*(выражен|сборк)'` → 0.
          держатель_ПО_СУЩЕСТВУ_есть: >-
            Ф1б-11/12, клауза «(в) собирает цепочку ТЕМ ЖЕ ВЫРАЖЕНИЕМ, что композиционный
            корень».
    почему_это_блокирующее_а_не_важное:
      - >-
        Ноль в строке «без держателя» читается как «у каждого нормативного утверждения документа
        назван держатель» — так его и объявляет §6 п. 13. Фактически он о четырёх разделах из
        восьми, несущих нормы. Это ровно класс Б16 — ЛОЖНЫЙ НОЛЬ, — и цена та же: следующий
        круг, доверившись переписи, не посмотрит в §3 и §4. Этот круг посмотрел ЧТЕНИЕМ, то
        есть ровно тем способом, ради отмены которого перепись и заведена.
      - >-
        Обе нормы держатся сегодня ТОЛЬКО телом сценария. Ослабь кто-нибудь клаузу (в) у
        Ф1б-11/12 либо строку про перепись различителей у Ф1б-02 — не покраснеет НИЧЕГО: строки
        нет, адреса нет, источник вне населения.
      - >-
        Автор САМ считает §3 источником нормы: §3 п. 3а несёт адрес `Н49`, §3 п. 9 — адреса
        `Н18`, `Н39`, `Н40`. То есть адреса в §3 уже проставлены, а населению §3 не принадлежит
        — два места об одном предмете внутри одной редакции.
      - >-
        Оговорка §5.0 называет НЕ ТОТ отказ: «раздел… не получивший ни `##`-заголовка, ни
        нумерованного пункта, в знаменатель не попадёт. Сегодня таких нет». Оба найденных
        пункта разметку ИМЕЮТ — нумерованный пункт под `##`-заголовком. Отказ приходит не от
        разметки, а от перечня разделов в скрипте, и о нём оговорка молчит.
    почему_это_НЕ_пятая_зернистость: >-
      Я не прошу считать мельче. Претензия структурная и того же рода, что довод самого автора
      про ведомость: населению не место в скрипте. Ведомость он вынес в документ по этой
      причине; перечень разделов — та же сущность и остался внутри.
    remedy_варианты_а_не_предписание:
      - >-
        (1) Объявить набор разделов-источников ТАМ ЖЕ, где ведомость, — в документе, — и читать
        его оттуда; либо вывести признаком, не зависящим от номера раздела.
      - >-
        (2) Что бы ни было выбрано, §3 и §4 обязаны войти в население, а печатаемое красное —
        закрыться по существу. Форма покрытия у §4 сегодня иная (пункты называют СЦЕНАРИЙ, а не
        строку) — значит признак покрытия придётся расширить либо завести строки; это решение
        автора, не моё.
      - >-
        (3) Способность новой формы упасть — инъекцией в обе стороны на КАЖДОМ новом виде
        источника, а не на одном.
    radius: >-
      две-три строки команды плюс закрытие того, что она напечатает. Обе найденные нормы
      держателя ПО СУЩЕСТВУ имеют, поэтому закрытие вероятнее всего адресами, а не новыми
      сценариями.

# ─────────────────────────────────────────────────────────────────────────────
important_findings:
  - id: З14
    предмет: >-
      Покрытие адресом не проверяет, ЧЬЯ строка адресуется. Любой существующий `Н\d\d` в теле
      источника засчитывается покрытием, включая упоминание вскользь.
    признак: М1 — вывод побайтово равен контролю при заведомо чужом адресе.
    состояние_дерева: >-
      Сегодня ВЕРНО: все четыре источника, покрытые только адресом (§7 п. 1, 2, 5, 7), прочитаны
      против своих строк и сходятся по существу. Ложного утверждения в документе нет.
    remedy: >-
      Одна строка: адрес засчитывается, когда источник адресуемой строки равен этому источнику,
      либо когда пункт НАЗЫВАЕТ его держателем явно. Величина уже вычисляется — третья ячейка
      строки переписи.
    почему_важное_а_не_блокирующее: >-
      Документ этого не обещает: он говорит «строка ЛИБО адрес». Слаб инструмент, а не
      утверждение.

  - id: З15
    предмет: >-
      Сторона B не ловит ВИСЯЧЕГО ДЕРЖАТЕЛЯ: строка вправе назвать сценарий, которого нет.
    признак: >-
      М6 — `Н44` называет третьим держателем `Ф1б-70`, знаменатель печатает «названы держателем
      16, не названы []». `orphan` считает только sc ⊄ named; named ⊄ sc не считается никогда.
    асимметрия: >-
      На стороне A тот же класс ПОЙМАН и назван осью «висячих адресов». Две стороны одного
      обхода судят по разным меркам, и различие нигде не объявлено решением.
    состояние_дерева: 'сегодня чисто: named − sc = ∅, проверено'
    remedy: одна строка и одна ось в печати, по образцу «висячих адресов»

  - id: З16
    предмет: >-
      «Строка либо адрес» печатается ВЫЧИТАНИЕМ (`len(src)-len(excl)-len(void)`), а не счётом.
    следствие: >-
      Величина не независима от двух других и потому не может им противоречить — то есть не
      является контролем. При Б17 (ведомость не гейтится) это ровно тот случай, когда третье
      число создаёт вид сверки, не будучи ею: М4 и М5 меняют его «правильно» при неверном входе.
    remedy: >-
      Считать M прямым обходом (у скольких источников ЕСТЬ строка либо адрес) и сверять с
      N − P − |void| как равенством. Тогда расхождение двух способов само становится находкой.

  - id: З17
    предмет: >-
      Врезка §5.0 «Чего инъекция НЕ доказывает» называет два предела — полноту перечня
      источников и верность держателя по существу — и не называет третьего: механических
      проверок, которых знаменатель НЕ ДЕЛАЕТ, хотя мог бы (З14, З15, Б17). Перечень пределов,
      названный неполно, читается как исчерпывающий.
    remedy: дописать названные здесь оси в ту же врезку — либо закрыть их

