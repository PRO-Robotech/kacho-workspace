round_5_blockers_closure:
  - id: Б14
    класс: состав множества, заданного предикатом, расходится с примером и производителем
    closed: true
    how_verified: >-
      Прочитан §2.5 целиком. (1) «Отозванное удостоверение» из перечня примеров СНЯТО и названо
      ВНЕ предиката отдельной врезкой. (2) Обоснование «отзыв приходит в ту же константу»
      переписано ПО ПОВЕРХНОСТЯМ таблицей: на нативной gRPC отзыв и привязка машинного токена
      схлопнуты в общую константу (и ветвь объявляет это своим комментарием), на REST у обоих
      своё описание. (3) Фраза «обязаны отличаться» приведена к поверхности: «вне предиката» НЕ
      значит «обязан отличаться», различие решает своя норма (§2.2, §2.4), а не §2.5.
    замер_подтверждён_независимо: >-
      Проверено на PRO-Robotech/kacho @ 3f1471b413: писатели отказа подлинности на REST живут и
      ВНЕ каталога слоя (gateway/internal/handler/logout_handler.go,
      gateway/internal/subscriptionstream/handler.go), на нативной gRPC вне общего писателя
      поверхностных писателей нет. Вывод врезки («на REST есть писатели мимо общего») держится
      при любом из спорных чисел.
    моя_ошибка_прошлого_круга_названа_первой: >-
      Круг по редакции 5 требовал снять пример и назвать поверхность — автор исполнил и пошёл
      дальше, поправив ТРЕТЬЕ место («обязаны отличаться»), о котором я сказал вскользь.

  - id: Б15
    класс: держатель-перепись объявлен над не тем населением, что его норма
    closed: true
    how_verified: >-
      Строка `Н49` несёт ЧЕТЫРЕ величины — «величин N · резолвится M · предмета у полосы нет
      вовсе P · названо разменом K», N = M + P + K — и печатается ПО КАЖДОЙ ПОЛОСЕ ПОРОЗНЬ;
      сумма по полосам запрещена дословно, с доводом того же рода, что уже стоит у `Ф1б-14`
      про два дерева.
    четвёртая_величина_проверена_замером: >-
      Население 14 воспроизведено независимо на corelib @ v1.5.0 (тег резолвится в 0b2adfb; пин
      продукта `github.com/PRO-Robotech/corelib v1.5.0` сверен по go.mod ствола 3f1471b413).
      Единица автора — экспортируемая именованная константа с числовым либо временным значением
      — даёт ровно 14: MaxTokenTTL · ConsumerKeySetCacheCeiling · RemovalSlack · KeyRemovalGrace
      · ClockSkew · UnknownKeyIDRefetchInterval · KeySetBodyCeiling · KeyIDMaxLen ·
      MinRSAModulusBits · MaxAssertionLifetime · MaxFederatedAssertionLifetime ·
      SecretCredentialTTLCeiling · SecretCredentialTTLDefault · ExpiredCredentialReclaimGrace.
      Строковые словарные значения (алгоритмы, типы токена, виды выдачи, перечень Check) в
      знаменатель не идут — единица это исключает явно.

  - id: Б16
    класс: 'перепись объявляет о себе «без держателя — 0», и этот ноль ложен с обеих сторон'
    closed: true
    per_instance:
      - id: Б16.1
        было: 'Н48 (2 · 2) называл держателем Ф1б-14, который ни одного из двух наблюдаемых не нёс'
        стало: >-
          Н48 сведён к 1 · 1 («ПРОФИЛИ края приведены тем же изменением»), шаблон чарта вынесен
          адресом на `Н35` в тело §6 п. 11, а Ф1б-14 получил абзац, утверждающий профили
          переписью по каталогу, и ОТДЕЛЬНО говорящий, что шаблон чарта здесь НЕ утверждается и
          утверждаться не может. Предикат прошлого круга (`grep -ci 'профил|чарт|шаблон'` по телу
          Ф1б-14) давал 0, теперь даёт 5.
      - id: Б16.2
        было: 'Ф1б-04 — единственный сценарий, которого не называла держателем ни одна строка'
        стало: >-
          Заведены ДВЕ строки, обе с источником `§5 \`Ф1б-04\``: Н53 (годность адреса записи,
          3 · 3, три формы негодности) и Н54 (производственная посадка, незащищённая схема —
          отдельной строкой, как и требовалось: другая поверхность). Знаменатель B печатает
          «названы держателем 16, не названы []».
      - id: Б16.3
        было: 'две половины заголовков Ф1б-03 и Ф1б-05 без строки'
        стало: 'Н55 (зеркальный страж) и Н56 (наш издатель вне перечня) заведены'
    и_главное_из_remedy_доставлено: >-
      Пункт (4) remedy — «команда §5.0 обязана печатать ЗНАМЕНАТЕЛЬ ОБХОДА» — исполнен, и
      исполнен формой, а не тремя точечными правками. Это и есть предмет настоящего круга.

