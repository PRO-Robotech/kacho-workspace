disputes_resolved:
  - id: M
    вопрос: 'M у края — 4 (круг по редакции 5) или 3 (автор)?'
    вердикт: ПРАВ АВТОР, и не по определению, а по способности прибора упасть
    замер_независимый:
      ревизия: 'PRO-Robotech/kacho @ 3f1471b413'
      предикат: >-
        по каждой из 14 констант — `git grep -c "tokenpolicy\.<имя>\b" -- 'gateway/'
        ':!*_test.go'` и то же по `services/registry/`
      край_упоминает_4: [ConsumerKeySetCacheCeiling, ClockSkew, KeySetBodyCeiling, KeyIDMaxLen]
      реестр_упоминает_6: >-
        те же четыре плюс UnknownKeyIDRefetchInterval и MinRSAModulusBits — число M = 6 первой
        конфигурации воспроизведено
      спорная_величина: ClockSkew
    почему_ClockSkew_не_резолвится:
      - >-
        gateway/internal/middleware/jwt_verifier.go:274 — `if cfg.ClockSkew <= 0 { cfg.ClockSkew
        = tokenpolicy.ClockSkew }`: объявление политики приходит ТОЛЬКО запасным путём.
      - >-
        gateway/cmd/api-gateway/main.go:233 — корень передаёт
        `time.Duration(cfg.JWTClockSkewSeconds) * time.Second`, а
        gateway/internal/config/config.go:567 объявляет `default:"30"`. Значение положительно
        при любой посадке, где ручку не выставили в ноль.
      - >-
        tokenpolicy.ClockSkew = 60 * time.Second. Развёрнутый край работает с 30 с при
        объявленных 60 с: константа УПОМЯНУТА и НЕ ДЕЙСТВУЕТ. Ровно это и описывает врезка
        оси 2 — «умолчание её ручки действует», — и замер её подтверждает.
    решающий_довод_а_не_вкус: >-
      Правило Н49 требует РЕЗОЛВА и отправляет названную разменом величину в K. При единице
      «упомянута» ClockSkew попадает и в M, и в K — посчитана дважды, и равенство N = M + P + K
      не сходится ни при каком составе (4 + 8 + 3 = 15 ≠ 14). Сильнее: ДО находки третьей оси
      при моей единице было бы 4 + 8 + 2 = 14 — перепись была бы ЗЕЛЕНОЙ, и ось 3 не нашлась бы.
      Единица «резолвится» — единственная, при которой прибор способен упасть.
    моя_ошибка_названа_прямо: >-
      Моё число 4 верно как счёт УПОМИНАНИЙ и негодно как M: я взял не ту единицу для правила,
      о котором спорил. Числа не выбирались — разошлись единицы, и разбор это установил.

  - id: писатели_13_против_14
    вопрос: 'A″ на REST — 13 (круг по редакции 5) или 14 (автор)?'
    вердикт: >-
      Автор прав в главном: НИ ОДНО из двух чисел ничего не открывает — проверено, а не принято
      на слово.
    проверка: >-
      Единственный вывод, который врезка делает из A″, — «на REST есть писатели, идущие МИМО
      общего». Он держится, пока A″ > A = 9; при 13 и при 14 держится одинаково. `B = 1` от A″
      не зависит вовсе. Замер подтверждает сам факт независимо: писатели 401 на REST живут в
      gateway/internal/handler/ и gateway/internal/subscriptionstream/, то есть вне каталога,
      которым ограничен предикат A.
    единица_названа_автором_верно: >-
      Расхождение — пара «код + описание» как одно описание или два. Это вопрос единицы, и
      автор его так и разрешил, вместо выбора большего.

  - id: третья_ось_работа_а_не_размен
    вопрос: 'верен ли довод «недостаёт кода, а не посадки»?'
    вердикт: ДОВОД ВЕРЕН, проверено замером
    замер:
      - >-
        Читатель MinRSAModulusBits у первой конфигурации один и лежит ВНУТРИ построения снимка:
        services/registry/internal/clients/jwks/verifier.go:719, функция сборки RSA-ключа из JWK
        («такой ключ не попадает в снимок вовсе»).
      - >-
        У края зеркальная функция СУЩЕСТВУЕТ — gateway/internal/middleware/jwk.go:222,
        `rsaFromJWK`, — и сверки в ней нет. `git grep -c 'tokenpolicy.MinRSAModulusBits' --
        'gateway/' ':!*_test.go'` → 0.
      - >-
        Ни ручки, ни ключа профиля, ни чужого решения величина не требует: это константа общего
        объявления. Значит препятствия, которыми обоснованы §7 п. 5 и п. 7 (посадка, решение
        третьей стороны), здесь действительно нет.
    следствие: >-
      Назвать ось разменом было бы отсрочкой под видом решения (ban #11). Классификация «работа
      фазы» принимается.

