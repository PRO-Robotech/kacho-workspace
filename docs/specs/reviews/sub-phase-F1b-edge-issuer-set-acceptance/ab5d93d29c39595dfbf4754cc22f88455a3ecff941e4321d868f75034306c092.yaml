род_and_ряд:
  род_наступил_пятый_раз: ДА
  где_теперь: >-
    В САМОМ ЗНАМЕНАТЕЛЕ — в двух его местах, куда прежнего инструмента не существует: в
    СВОЙСТВЕ, которое инструмент себе приписывает (Б17, ведомость «самоистекает»), и в
    НАСЕЛЕНИИ, которое он себе назначил перечнем в скрипте (Б18).
  чем_это_установлено: >-
    ОБХОДОМ И ОПЫТОМ, а не вычитанием и не тем, что искать стало нечем. Б17 установлен
    одно-фактной инъекцией над самой командой (М3, М4, М5) — все три прогона побайтово либо
    арифметически равны контролю. Б18 установлен тем же обходом, что в команде, применённым к
    разделам §3 и §4, плюс инъекцией М9, плюс чтением тел двух сценариев. Ни одна из двух
    находок не выведена вычитанием из прошлых кругов.
  сдвиг_измерим_и_он_ВНУТРЬ: >-
    ред. 2 — норма без держателя в тексте · ред. 3 — норма, расщеплённая надвое · ред. 4 —
    состав внутри свойства · ред. 5 — предикат-строка и отсутствующая строка · ред. 6 —
    САМООПИСАНИЕ И НАСЕЛЕНИЕ ИНСТРУМЕНТА. Каждый круг род уходил на уровень, где прежнего
    средства нет; теперь он ушёл в то средство, которым его ловят.
  ряд:
    блокирующих: {ред2: 6, ред3: 3, ред4: 4, ред5: 3, ред6: 2}
    экземпляров: {ред2: 6, ред3: 3, ред4: 7, ред5: 7, ред6: 6}
    родов_за_круг: {ред2: 1, ред3: 3, ред4: 3, ред5: 1, ред6: 1}
    оговорка_о_сравнимости: >-
      Сравним ряд БЛОКИРУЮЩИХ — он убывает. Экземпляры поперёк кругов сравнивать нельзя:
      инструмент менялся каждый круг, и этот круг вёл ДЕСЯТЬ одно-фактных прогонов инъекции
      против шести авторских. Больший улов при том же тексте означает более чувствительный
      прибор.
  что_закрыто_и_не_вернулось: >-
    Все три блокирующих круга по редакции 5 закрыты ПО СУЩЕСТВУ, а не по форме; ни один не
    вернулся. Прежние роды — «держатель, структурно не способный упасть», «занижённая цена»,
    «расщеплённая норма» — не наступали второй раз ни разу.

# ─────────────────────────────────────────────────────────────────────────────
what_is_NOT_wrong:
  - >-
    ЗНАМЕНАТЕЛЬ — ВЕРНОЕ ЛЕКАРСТВО, и это круг подтверждает опытом, а не вежливостью. Он жив
    (М2 краснеет с координатой на моём собственном факте), падает на пустом обходе кодом 1 по
    обеим сторонам (М7, М8), исполняется вербатим и нашёл четыре находки, три из которых не
    называл никто за пять кругов. Обратная сторона обхода — «всякий ли держатель кем-то назван»
    — заведена впервые за пять кругов и сразу дала находку (Ф1б-04).
  - >-
    Решение печатать ТРИ строки и разводить «без держателя» и «висячих адресов» порознь —
    верное: М1 и М2 показывают, что одна ось скрывала бы случай, ради которого заведена другая.
  - >-
    Шесть авторских прогонов инъекции построены правильно: контроль в обе стороны (прогон 4
    доказывает, что числитель жив), пустой обход отдельным прогоном, и прямо сказано, что
    прогоны 1 и 2 — разные отказы при одном факте.
  - >-
    Замеры этого круга — четырнадцать величин политики, M у обеих полос, место третьей оси,
    писатели REST — воспроизведены независимо и сошлись с авторскими всюду, кроме единицы,
    которую он же и назвал.

