  - "стенд не поднимался — о поведении на кластере вердикта нет"
  - "ветка chore/remove-codex-projection не рецензировалась — она не влита и предметом этой приёмки не является"
  - "клон продукта в дереве отстаёт от своего ствола на 21 коммит — проверки, читающие продукт, судили отставшую копию"
  - "истинность утверждений прежних редакций не перепроверялась"

