      следом — иначе ствол несёт красный набор»
    second_consequence: >-
      ведомость исключений вести допустимо, но её ведёт полоса снятия кода, а не
      эта приёмка; ведомость истекает сама
    end_predicate: набор change-graph-gate даёт код 0 и «мимо приёмки 0»
    verdict: >-
      требование закрыто САМИМ документом — отдельного замечания не остаётся

  load_bearing_argument_verified:
    claim: >-
      §10: «фикстуры описывают мир целиком из своих файлов, поэтому смерть
      предмета их вердикта не меняет»
    checked_by: чтение кода, а не текста
    finding: >-
      фикстура несёт собственный world.yaml, семейство читает его через
      world.read(...)/world.has(...), реального дерева для мира кейса не трогает
    verdict: >-
      довод верен. Это ИСПРАВЛЕНИЕ формулировки круга 1, где было «их фикстуры
      описывают мир, которого дерево больше не производит» — та версия
      подразумевала зависимость от дерева, новая точнее.

# ── Важные, не блокирующие ────────────────────────────────────────────────────
non_blocking:
  - id: N1
    where: scripts/change-graph-gate/check-04-canonical-inputs-match-manifest.sh
    observed: >-
      проверка сверяет REGISTERED_CANONICAL_INPUTS семейства cg.adapter с
      canonical_inputs манифеста производного; на этой редакции зелёная
      (7 = 7, расхождений 0). После снятия производного манифеста не станет, и
      она даст код 2 — VOID, «сверять не с чем».
    why_not_blocking: >-
      её собственная шапка это поведение объявляет, читает она ИСПОЛНЯЕМОЕ, а не
      текст §10, и ведёт её та же полоса снятия кода, что и ведомость исключений.
      Приёмка перечисляет следствия промежутка и это в перечень не внесла —
      довесок к §13, а не дефект: третья категория не есть краснота.
    suggested: одной строкой в §13 назвать её рядом с девятью диагностиками

  - id: N2
    where: отчёт автора
    observed: >-
      «остальные семь наборов зелёные» — на замере зелёных пять; crossrepo-gate
      и docs-gate дают код 2 (без предмета 1 у каждого) при провалено 0.
    why_not_blocking: про отчёт, не про документ; правится формулировкой

  - id: N3
    where: .claude/rules/change-graph.md, строки 27 и 84
    observed: >-
      «196 кейсов приёмки из 196» при фактических 198 на стволе — число было
      ложным ДО обоих кругов; «33 семейства» верно. Перенесено из круга 1.
    why_not_blocking: >-
      файл вне диффа и вне предмета под-фазы. Но обещание «сменятся после снятия
      кода» без задачи есть обещание без держателя (ban #11) — нужен предмет.

