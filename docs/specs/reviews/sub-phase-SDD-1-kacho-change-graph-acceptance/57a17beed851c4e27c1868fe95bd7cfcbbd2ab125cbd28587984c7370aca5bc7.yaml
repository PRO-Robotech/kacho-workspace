# ── Закрытие блокирующих круга 1 ──────────────────────────────────────────────
blocking_resolution:
  - id: B1
    was: >-
      §10, заголовок, 13 надгробий и DoD объявляли производное снятым в
      прошедшем времени, тогда как все шесть его координат были в дереве.
    now_measured:
      heading: "§10 — «производное для чужих сред СНИМАЕТСЯ» (было «НЕТ»)"
      predicate_in_section_10: >-
        стоит блок команды по шести координатам с числами «6 на день этой
        редакции» и «0 — предикат готовности снятия»
      predicate_reproduced: 6
      coordinates_named_openly: true
      tree_contradiction_acknowledged: >-
        §10 несёт абзац о том, что CLAUDE.md предписывает перегенерацию, а
        MANIFEST числит сверяющий набор держателем, — «и они правы сегодня»
      header_states_overtake: >-
        «на ревизии этой редакции производное ещё в стволе воркспейса», снятие
        идёт невлитой веткой, ban #1 опережение разрешает, выдачу намерения за
        свершившееся — нет
      residual_claims_predicate:
        command: "grep -n 'не существует\\|больше нет' <subject>"
        hits_about_derived: 0
        note: >-
          единственное попадание — «SDD-1-POLICY-04 — valid-looking cutover
          commit не существует», к производному отношения не имеет
      tombstones_with_predicate_reference: 13 из 13
      dod_item_carries_same_predicate: true
    verdict: закрыто

  - id: B2
    was: >-
      §13 называл тринадцать осиротевших фикстур «зелёными», тогда как они
      дают HARNESS_CASE_UNKNOWN и exit 40.
    now_measured:
      quoted_output: "HARNESS · HARNESS_CASE_UNKNOWN · exit 40 — приведён дословно"
      names_third_category: true
      says_verdict_not_issued: true
      says_matrix_excludes_them: "185 из 185, поломок harness 0"
      reproduced_by_me: exit 40 на трёх фикстурах, перечень драйвера 185, ADAPTER 0
    verdict: закрыто

