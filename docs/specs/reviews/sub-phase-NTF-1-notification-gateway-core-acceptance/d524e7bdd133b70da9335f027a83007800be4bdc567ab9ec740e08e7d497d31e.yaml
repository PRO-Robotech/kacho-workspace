class_exposure_returns_closed:
  RA-07: >-
    Закрыт вариантом (а) разбора. Ратификация 5xx на `RCPT` класса 5.7 сохранена, неверный довод
    «глаголы security инициирует сам получатель» снят. Цена разложена таблицей по каждому письму
    security. Восстановление и подтверждение повторяет получатель, и повтор снова тратит окно
    (упирается в «пол» NTF-2). Приглашение повторяется только через `ResendInvite` — его
    запускает человек, узнавший о потере. Письма класса S теряются навсегда. Окно потерь названо.
    Довод «иной выбор переписал бы NTF4-06/07» сверен: NTF4-07 — `550 5.7.1` на строке класса
    security (Given «то же», что в NTF4-06) → `RECIPIENT_REJECTED`, `permanent_other`, подавления
    нет. План NTF-4 «Открытый возврат» подтверждает, что вариант (а) строк NTF-4 не меняет.
    Класс «цена названа неполно» переписан по всему документу. В Р5 добавлено: строка
    теряется, класса security эта цена не касается. Это сверено с Р3 (kaname `ResolveSend` не
    зовёт) и Р6 (`identityNamespaces = {kaname}`).
  RA-08: >-
    Закрыт первым вариантом разбора, NTF-2 не правится. Единственность нормализации сужена до
    `corelib/notify` и `services/notify`. Ключ окон kaname NTF-2 назван отдельным ключом со своим
    назначением. Доменная часть всех ключей — `address.NormalizeDomain` с одним именованным
    профилем IDNA (UTS 46, непереходная обработка). У типов `address.Normalized` и `address.Domain`
    закрыт конструктор. Узлы гейта B27 названы по идентичности: вызов пакета `idna` и
    преобразование в эти типы вне `notify/address`. Обход — corelib, `services/notify`, kaname.
    Инъекции и законный близнец (`strings.ToLower` над именем заголовка) тоже названы. Этим закрыт
    и N9-1. Замороженный корпус B27 (IDNA) держит профиль: Unicode-домен и A-label дают одно
    окно, `ß`/`ss` — два. Перепись §1.8 перемерена: на всех трёх пинах 0 файлов, `x/net` доступен.
  RA-09: >-
    Закрыт вариантом (а). Форму проверяет одна функция corelib `notify/form`, и стоит она на
    обеих сторонах. `feed.Put` возвращает `feed.ErrAttrsInvalid` до первого оператора SQL;
    транзакция вызывающего остаётся пригодной к коммиту. Новый B28 несёт сторож, «строк 0»,
    близнеца и гейт преобразования в `form.*` вне `notify/form`, а также утверждает, что
    `notify/form` не тянет `spec` и рендер. Три границы `path` решены: `/` принимается, `/a/` и
    `//a` отвергаются — это G24 (и), (к) и близнец `target = /`. Класс «проверка стоит только у
    потребителя» переписан таблицей Р11 по каждой причине `INVALID`: CR/LF темы перенесён в
    `notify/form`, а G05 теперь строит значение мимо `SendX`.
  N9-2: закрыт — G24 (е) `abcdefghijklmn&next=x` (21 символ), (ж) `abcdefghijklmno` (15).
  N9-3: >-
    Закрыт. Грамматика кнопки задана двумя формами, кнопка с `token` несёт литерал пути, и
    литерал проверяет `notify/spec` (A03). Точные адреса приведены в A01, G03 и G24.

