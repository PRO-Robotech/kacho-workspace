non_blocking:
  - id: N10-1
    kind: SCOPE
    anchors: [Р1, NTF1-G19, "§4 строка NTF-4"]
    text: >-
      Д17 документ не нарушает: у notify NTF-1 gRPC-слушателя нет вовсе, а это строже, чем
      «публичного нет по построению». Но §4 не говорит, что Р1 и допустимый набор пробы G19
      (`servesurface_test.go`) — состояние на посадку NTF-1, которое меняют соседи по Д17. У
      соседей это читается по-разному. NTF-4 (f9bc15ad…, З9) регистрирует
      `InternalSuppressionService` в корне NTF-1 `services/notify/cmd/notify` и меняет набор G19.
      NTF-3 (cbdb3431…, редакция 14, Р8) выносит внутренние сервисы NTF-4 на отдельное
      развёртывание `notify-api`, а у `notify-sender` gRPC-слушателя не оставляет. Для NTF-1
      это не блокирует: её собственный предмет согласован с Д17 при любом выборе. Когда
      диспетчер решит, какой процесс несёт слушатель Х5, строку NTF-4/NTF-3 в §4 стоит дополнить
      ссылкой на З9 NTF-4 или Р8 NTF-3.
  - id: N10-2
    kind: PRODUCER
    anchors: [Р8 «общее у всех ключей на адрес — доменная часть»]
    text: >-
      Гейт B27 держит только отрицательную сторону: вызова IDNA мимо `NormalizeDomain` в kaname
      нет. Положительной стороны — «ключ окон kaname строит домен через `NormalizeDomain`» — в
      NTF-1 не держит никто. Ключ kaname, собранный одним понижением регистра без IDNA, гейт не
      увидит, а для Unicode-домена этот ключ разойдётся с ключом corelib. Утверждение принадлежит
      предмету NTF-2. NTF-2 Р6 (строка `registration`, «домен в A-label нижнего регистра»)
      `NormalizeDomain` не называет. Заказ автору NTF-2, как в orders разбора классов: назвать
      `address.NormalizeDomain` в ключе и держать это пробой ключа на Unicode-домене.
  - id: N10-3
    kind: CONTRACT
    anchors: [Р8, NTF1-B25]
    text: >-
      N9-4 (длительность аренды и предел жизни секрета сверх `ttl`) в редакции 10 не менялся. Он
      заказан автору замысла (CX1-27) и в приёмку не возвращался. Отмечено, чтобы он не выпал при
      пересверке замысла.

