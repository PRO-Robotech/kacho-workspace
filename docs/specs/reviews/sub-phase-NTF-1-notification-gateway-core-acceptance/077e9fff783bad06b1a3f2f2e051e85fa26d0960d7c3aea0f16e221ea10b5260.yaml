blocking:
  - id: B3-1
    kind: CONSTRUCTIBILITY
    summary: >-
      Субъекта права `send` на ленту kaname не существует и завести его нельзя: у службы доступа
      своей служебной учётки не бывает — это закреплённое решение MRW-1 Р1 и держатель в дереве.
      F01 (Given «манифест kaname несёт notifications: {feed}»), F12 «И»
      (`Check(service_account:<учётка kaname>, send, …) — true`) и вся цепочка Р3 для первого
      источника опираются на эту учётку.
    evidence: >-
      kaname internal/servicemanifest/manifest.embedded.yaml:66-67 @734f69fb4 — «Подразделов
      `serviceAccounts` и `joins` у этого раздела НЕТ … своей служебной записи у службы доступа не
      бывает»; держатель — internal/servicemanifest/seed_form_test.go:98-99
      (TestMRW07_GroupWithItsGrantIsAccepted падает, если манифест службы объявляет
      serviceAccounts). В 0001_initial.sql учёток kacho-kaname / kacho-iam нет (перечень строк
      3837-3843). Р3 при этом требует: тип `notification_feed`, `send: [service_account]`;
      «валидатор манифеста принимает … только свою учётку получателем»; запись выдачи
      {лента, учётка, …}. Для kaname-источника поле «учётка» и субъект кортежа пусты по
      построению. `grep -n 'учётк[аи] kaname' <док>` — одно упоминание (F12, стр. 1158), решения о
      том, откуда учётка берётся, нет.
    fix: >-
      Решить явно и записать решением: либо (а) служба доступа получает служебную учётку ради
      ленты — тогда это замещение MRW-1 Р1 строкой §3 (с правкой держателя TestMRW07 и
      сценарием, что учётка не получает иных прав), либо (б) субъект `send` на собственную ленту
      службы доступа выражается иначе (например, выдача на ленту без субъекта-учётки, либо
      отдельный тип получателя) — с правкой Р3 (форма записи выдачи, текст валидатора), F01, F03,
      F07, F12 и K03 п.7 под выбранную форму. В обоих случаях Given F01/F12 должен называть
      посев, который строит субъект, и не противоречить судье формы манифеста службы.
  - id: B3-2
    kind: NEGATIVE
    summary: >-
      Выдача `reader` не имеет ни формы, ни ограничения «кому», ни отрицательного сценария;
      сформулированное правило валидатора её отвергает.
    evidence: >-
      Р3 (стр. 266-268): «выдача `reader` notify — строкой манифеста notify; валидатор манифеста
      принимает только ленту своего модуля и только свою учётку получателем». Строка notify
      называет ленту kaname — не свою; по тексту валидатора она отвергается (как F02). Форма
      строки reader не названа; сценария «модуль M объявляет reader на ленту kaname в своём
      манифесте → отвергнуто» нет (F02 — только про send на чужую ленту). От `reader` зависит
      сужение подписки (E02) и второй ключ `Claim` (C05), т.е. предмет О3.
    fix: >-
      Назвать форму строки `reader` и её правило (например: принимается только в манифесте
      модуля, чья учётка — в декларации `notify.spiffe`, либо выдаётся только манифестом
      источника с получателем из закрытого перечня), сузить текст валидатора до `send`; добавить
      отрицательный сценарий «модуль, не являющийся notify, объявил reader на ленту kaname →
      находка валидатора, кортеж не заведён» с положительным близнецом «та же строка в манифесте
      notify → кортеж заведён» и внести пару в §6.1 и §6.2.

non_blocking:
  - >-
    §1.1, стр. 103: скобка «(без учёта регистра; с `-c` — 12)» — 12 даёт команда без `-i`, а не
    «с -c» (обе формы несут -c). Переписать «без `-i` — 12».
  - >-
    §1.4 / Р22 п.2 ссылаются на `serve.go:478` против `:1158`; на 734f69fb4 applyModuleSeed —
    стр. 479, net.Listen публичного слушателя — около 1157. Ссылаться именем функции, а не
    номером строки.
  - >-
    CallerPolicy kaname несёт третий рукав — перечень точных SAN оператора (`WithSANAllowlist`,
    cmd/kaname/serve.go:786 @734f69fb4, fail-closed на пустом). Это действующий прецедент
    «точный SAN из конфигурации»; стоит назвать его в Р22 как образец, чтобы S1/S2 не завели
    третью форму перечня SAN.
  - >-
    E02 требует у kaname второй ленты («посеянная лента проб») с журнальной строкой вида
    notification; назвать в Given, чем она строится (прямая вставка пробы в журнал либо вторая
    лента в процессе), иначе автор пробы будет выбирать.

