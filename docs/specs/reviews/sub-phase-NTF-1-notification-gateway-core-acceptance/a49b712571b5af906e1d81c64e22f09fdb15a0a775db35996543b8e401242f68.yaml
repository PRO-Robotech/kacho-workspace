prior_findings_closure:
  R20-1:
    status: closed
    evidence: >-
      Добавлен NTF1-P13. В нём проверяются обе стороны каждой границы (9 с и 10 мин 1 с; 59 с и 24 ч 1 с)
      и отдельно для каждой ручки — что она не задана. Текст отказа называет ручку и нарушенную
      границу. Близнец — значения ровно на границах. Есть строка §6.1 на `services/notify/internal/config/*_test.go`
      с инъекцией «граница снята», строка §6.2 и пункт DoD 20. Р19 «Ручки и границы» ссылается на P13.
  R20-2:
    status: closed
    evidence: >-
      Появилась строка средств «старт notify в любой пробе». Она поставляет исправную зону испытания P01
      каждому integration-старту и процедурному старту, в том числе в группах G, H, K, L03–L05 и P.
      Для I06 заведена строка «зона испытания отдельной установки», Given I06 называет зону, строка I06
      в §6.1 называет посев. DoD 17 — `dev-prod` как профиль стенда с посевом. DoD 22 утверждает
      готовность на `dev-prod` с посевом, а установка оператора без записей в нём — отказ старта
      P04…P08, P15, P16. Все три пути из R20-2 (I06, DoD 22, прочие integration-старты) названы.
  R20-nonblocking:
    status: closed
    evidence: >-
      P14 — отказ загрузки ключа и селектора, P15, P16 — записи DKIM или DMARC нет. Производители в
      строке шапки редакции 21 названы через `dnscheck` и `dkim`.

delta_passed:
  producer: >-
    У P13, P14, P15, P16, P17 и P18 есть строки §6.1. Способность упасть задана инъекциями: «граница
    снята», «ошибка разборщика в тексте отказа», «страж сведён к `return nil`» (P15 и P16 вошли в
    перечень DoD 21) и «перечитывание снято». Ответ `/healthz` в P08 держит инъекция «страж перенесён
    до подъёма диагностической поверхности».
  twins: >-
    P13, P14, P15, P16 и P18 получили по строке §6.2, и каждая пара отличается одним фактом.
  rotation_constructibility: >-
    Перечитывание ключа во время работы требует файла тома, а не переменной окружения. В замысле
    df2ce53e… §8 так и есть: `KACHO_NOTIFY_DKIM_KEY_FILE` и `_SELECTOR_FILE`, том без `subPath`.
    Значит, P17 построится и на поде, а не только через порт в пробе.
  d101: >-
    Р19 «Адрес возврата в NTF-1»: envelope `MAIL FROM` — адрес отправителя установки. Части, которым
    нужен отдельный домен возврата, остаются в NTF-4. Это совпадает с Д101.
  d100_d103: >-
    Д100 (носитель `notify-api` в Основе, волна Н3-Ф3а) и Д103 (R41-1, R41-2, N41-3, N41-4) — предмет
    замысла и NTF-4, этой приёмки они не касаются. Замысел df2ce53e… закрывает Д103 переносом текста с
    отпечатком источника df1ce64d…. Ссылок на NTF-4, которые требовали бы закрепления отпечатком, дельта
    приёмки не вносит.

blocking_count: 1
blocking_kinds_distinct: [CONSTRUCTIBILITY]
blocking_findings:
  - id: R21-1
    kind: CONSTRUCTIBILITY
    where: "NTF1-P12, последний пункт «And» (инъекции и близнец); §6.2, строка «P12 (инъекция `dnsConfig` в `values.a8f60d.yaml`) | P12 (`dnsConfig` в `values.dev.yaml`)»"
    claim: >-
      Инъекция «`dnsConfig` пода notify в `values.a8f60d.yaml` → красный `a8f60d`» и близнец «`dnsConfig`
      в `values.dev.yaml` → зелёный» не могут выполниться оба. Цепочка `a8f60d` целиком включает
      `values.dev.yaml` (`deploy/stacks.txt`: `a8f60d:values.dev.yaml,values.dev-prod.yaml,values.a8f60d.yaml`).
      Есть два варианта.
      (1) Держатель судит слитые значения, как сказано в When P12. Тогда `dnsConfig`, объявленный в
      `values.dev.yaml`, наследует профиль `a8f60d` с признаком «нет», и близнец краснеет с именем
      `a8f60d`.
      (2) Держатель судит рендер. В `a8f60d` notify не рендерится (Д102), и в `prod` тоже (перечень
      пуст). Значит, `dnsConfig` пода notify, вписанный в values этих профилей, рендер не меняет,
      инъекции зелёные, и держатель свойства Д102 упасть не может.
      Ключа «`dnsConfig` пода notify» в values нет и в замысле df2ce53e…: под зоной стенда стоит одно
      объявление `global.kacho.standDNS {enabled, serviceIP, clusterDomain}` и помощник
      `notify.dnsConfig`. Профиль `a8f60d` наследует `standDNS` от `values.dev.yaml` и снимает его в
      `values.a8f60d.yaml` значением `enabled: false`. Замысел держит P12 иначе: (в) `standDNS.enabled:
      true` ⇒ признак `stand` судится по слитым значениям. Его инъекции — `standDNS.enabled: true` в
      `values.a8f60d.yaml` и в `values.prod.yaml`, а также ключи пробы `a8f60d` сняты, отчего notify
      попадает в рендер. В приёмке этих инъекций нет. Свойство, ради которого существует Д102 (страж не
      должен проходить на собственном посеве в профиле с настоящей почтой), остаётся без держателя,
      способного упасть.
    predicate: >-
      grep '^a8f60d:' project/kacho/deploy/stacks.txt → цепочка начинается с values.dev.yaml;
      sed -n '2793p;2802,2803p' <NTF-1> — When «слитые значения», инъекция `dnsConfig` в
      `values.a8f60d.yaml` и в `values.prod.yaml`, близнец в `values.dev.yaml`;
      grep -n 'standDNS' <NTF-1> → 0 вхождений; grep -n 'standDNS' docs/changes/issue-2915/design.md →
      §8 (4431), таблица профилей (5109–5115), держатель P12 (5146–5155).
    fix: >-
      В P12 и §6.2 назвать то, что держатель судит, по слоям. Слитые значения: «объявление зоны стенда
      включено ⇒ признак `stand`». Инъекции: включение в `values.a8f60d.yaml` → красный `a8f60d`;
      включение в `values.prod.yaml` → красный `prod`; ключи пробы `a8f60d` сняты, notify попал в
      рендер → красный `a8f60d`. Рендер: у профиля `stand`, где notify рендерится, у пода есть
      `dnsConfig`; у профиля не `stand` его нет. Близнец — `values.dev.yaml` как есть: `dev`, `dev-prod`,
      `prorobotech` и `fe3455` зелёные, а `a8f60d` зелёный, потому что наследование из `values.dev.yaml`
      снято его собственным файлом. Само наследование назвать в Р19 «Профиль стенда» одной фразой. Имя
      ключа в приёмке можно не повторять, достаточно формы «объявление зоны стенда в values».

non_blocking:
  - kind: PRODUCER
    note: >-
      У близнеца P13 вторая половина звучит «notify на зоне испытания NTF1-P01 готов». Строка §6.1 P13
      называет только `go test ./services/notify/internal/config/...`, а unit-проба загрузчика готовности
      не наблюдает. Надо либо оставить в близнеце «загрузчик принимает», либо внести эту половину в строку
      integration-стража.
  - kind: COVERAGE
    note: >-
      Р19 «Ключ и селектор при старте» перечисляет как отказ и «селектор вне формы имени DNS». В P14 шесть
      причин, а этой среди них нет. Исход здесь всё равно закрытый: такой селектор даст отказ `dkim` по
      P15. Но текст отказа, который обещает Р19, ни одна проба не утверждает.
  - kind: COVERAGE
    note: >-
      У проверки SPF «ровно одна запись `v=spf1`» отрицание есть только с одной стороны: две записи
      (P07). Случай «записи нет» не утверждается.
  - kind: FORMAT
    note: >-
      Приёмка говорит, что ключ и селектор лежат «в объекте секрета почты» (Р19, P14, P17, DoD 22). В
      замысле §8 у DKIM свой узел `global.kacho.identity.smtp.dkim {secretName, …}`, а посев D10 создаёт
      «объект ключа DKIM стенда». Надо назвать, один это объект или два, иначе проба I01 «секрет
      смонтирован ровно в notify» допускает два прочтения.
  - kind: DoD
    note: >-
      DoD 22 называет профили без notify в рендере (`prod`, `a8f60d`), но не называет `own`. Профиль
      `fe3455` после D2 по замыслу — `stand`. Перечисление стоит выровнять с таблицей профилей замысла.

out_of_subject_notes:
  - >-
    Д100: носитель `notify-api` и правила «ключ DKIM только в `notify-sender`» — это замысел и NTF-4.
    На посадку NTF-1 развёртывание одно, и формулировки группы P («notify») ему не противоречат.

