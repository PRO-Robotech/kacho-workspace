non_blocking:
  - id: N13-1
    kind: FORMAT
    anchors: ["§1.8 таблица, строка «код внешних модулей» — без держателя (1)", "Р7 путь без держателя (1)"]
    text: >-
      Пакет `plugin` загружает `.so` и отдаёт символ как `any`. Рукописный код трёх деревьев
      может так вызвать чужую функцию над адресом `form.Path`, не задев ни одного из семи видов
      (у `plugin.Open` на linux cgo живёт внутри стандартной библиотеки, а не в `.go` вызывающего).
      По смыслу это путь без держателя (1): код не из трёх деревьев получил адрес. Но путь (1)
      назван «код внешних модулей», а бинарь `.so` модулем не является. Когда шапку будут
      править в следующий раз, стоит назвать `plugin` в строке (1) §1.8. Посевом этот путь не
      проверялся. Вердикт он не меняет: остаток уже назван без держателя, и цена у него та же.
  - id: N13-2
    kind: FORMAT
    anchors: ["Р7 «Мимо функций пакета остаются два пути, и у каждого свой держатель»", "Р8 то же"]
    text: >-
      «Два пути» здесь — две категории: нулевое значение и запись в обход функций. Внутри второй
      категории четыре пути без держателя, а фраза «у каждого свой держатель» читается как
      «держатель есть у всех». Противоречия нет, пути (1)–(4) названы тремя строками ниже.
      Формулировку стоит уточнить при следующей правке.

routing_note: >-
  Род PRODUCER, который повторялся в кругах 11 и 12, закрыт переписью путей (таблица §1.8), а не
