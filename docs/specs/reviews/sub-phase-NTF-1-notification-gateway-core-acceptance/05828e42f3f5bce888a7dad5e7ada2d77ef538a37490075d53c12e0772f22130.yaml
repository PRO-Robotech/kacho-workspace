previous_return_checked:
  B12-1: >-
    Закрыто вариантом (а), и шире, чем требовал возврат. Узел «обход типобезопасности» теперь
    состоит из семи видов: (1) импорт `unsafe`; (2)–(4) три ссылки `reflect`; (5) объявление
    функции без тела; (6) импорт `"C"`; (7) файл исходника не на Go. Виды (5)–(7) судятся по
    разбору без учёта ограничений сборки. Перечень расширений вида (7) сверен с `go/build`
    (go1.26.8, `src/go/build/build.go`, строки 920 и 1087–1103): `.c .cc .cpp .cxx .m .h .hh
    .hpp .hxx .f .F .for .f90 .s .S .sx .swig .swigcxx .syso`. Перечень полон, лишних в нём нет.
    Инъекции (6)–(9) заданы вместе с близнецом «числа видов (5)–(7) по каждому дереву — 0».
    В Р11 вызов `feed.Put` мимо ссылки на объект (`go:linkname`, ассемблер, объектный файл,
    cgo) отнесён к тому же узлу; инъекция (9) — ассемблерный вызов `feed.Put` в kaname. Утверждение
    «`go:linkname` требует `unsafe`» перемерено: сборка файла с `//go:linkname` без импорта
    `unsafe` падает с ошибкой `//go:linkname only allowed in Go files that import "unsafe"`.
  B12-1 (класс): >-
    Перепись закрыта: в таблице §1.8 у каждого пути назван держатель либо стоит пометка «без
    держателя» с ценой. Автор сам нашёл ещё два пути сверх возврата: запись в память
    собственного процесса средствами ОС и гонку данных по многословному значению. Оба внесены
    в Р7, Р8 и Р11 как пути без держателя (3) и (4), и оба перемерены (ниже). Утверждений
    «по построению» о коде, уже исполняющемся в процессе, документ не делает. notify проверяет
    строку ленты той же функцией формы (G05, G24), и этот остаток назван.
  B12-2: >-
    Закрыто. У NTF1-D01 добавлены два And. Первый: `notifygen -check -list` выдаёт множество
    файлов — путь на строку, отсортировано, без повторов, при любом исходе сверки. Проба
    сравнивает это множество с файлами, которые записал `make notifications` в копии дерева без
    порождённых файлов, равенство в обе стороны. Второй: близнец (рукописный файл с заголовком
    `notifygen` в вывод не попадает) и инъекция лишнего пути в вывод (красный с путём). NTF1-D02
    задаёт то же множество на красной сверке. B28 (гейт `Put`), Р11 и §6.1 ссылаются на D01 как
    на производителя. Если генератор не исполнился — это красный прогон гейта, а не пустое
    множество. Близнец инъекции (2) гейта `Put` больше не висит на входе без производителя.
  N12-1: "закрыто: строка круга 12 в шапке называет оба прохода именами записи; строка круга 11 не правлена"

