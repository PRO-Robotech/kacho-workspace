repeat_note: >-
  CONSTRUCTIBILITY блокирует в пятый раз подряд (круги 1–3 и этот), каждый раз на новом
  предмете. Класс общий: Given или Then опирается на то, чего не допускает дерево или
  собственное правило документа. На этот раз перепись §9 круга 3 («существует ли субъект
  правила») прошла, но не задала двух вопросов: (1) не решает ли код kaname исход в обход
  модели; (2) не запрещает ли Given собственное правило документа (Р6) и не требует ли он
  второго объекта, которого в замысле NTF-1 нет. Переносить ли эти два вопроса в форму
  задания автора (§14а), решает диспетчер.

blocking:
  - id: B4-1
    kind: CONSTRUCTIBILITY
    scenarios: [NTF1-F12, NTF1-C03, NTF1-C05, NTF1-F09]
    decisions: [Р4, Р5, З5]
    summary: >-
      F12 требует, чтобы Check(user:<администратор кластера>, sender|reader, …) давал false.
      В дереве kaname это решает не только модель. После отказа модели kaname
      дополнительно спрашивает, не администратор ли кластера субъект, и на «да» разрешает,
      какими бы ни были отношение и объект. Правка, которая снимала бы этот обход для
      notification_feed и notification_namespace, в Р5 и в S2 §5 не названа. Поэтому Then F12
      не производит ни одна из перечисленных правок. На том же держится утверждение Р4
      «тело письма забрать может только notify»: вопрос Check(<субъект>, reader,
      notification_feed:<модуль>) идёт через тот же путь решения.
    evidence:
      - "kaname internal/service/authorize_service.go:545-556 @734f69fb4 — verdict(): CheckWithContext → при false isClusterAdmin(subject) → admin"
      - "там же :392-405 — check(): ветка superGateDecides отдаёт Allowed администратору кластера"
      - "модель без каскада (Р5 «без каскада») этот путь не затрагивает: решение принимает код"
    required_change: >-
      Решением записать в Р5 и в строку S2 §5, что для объектов notification_feed и
      notification_namespace kaname не применяет разрешение по признаку «администратор
      кластера». Перечень этих типов закрыт и объявлен в одном месте; если такое место уже
      есть (по образцу forbiddenObjectTypes), его назвать. F12 утверждает исход через тот же
      вызов проверки, которым пользуются kaname и kacho, а не через голую модель.
      Нужна пара «на наблюдаемом уровне» (hard-regression-observable-level):
      администратор кластера, пересланный доверенным пересылающим, получает отказ на Claim
      (PERMISSION_DENIED, permission denied, строка не арендована) и на ResolveSend.
      Близнец — тот же вызов от service:notify. Пару внести в §6.1, §6.2 и DoD.

  - id: B4-2
    kind: CONSTRUCTIBILITY
    scenarios: [NTF1-H01, NTF1-H03]
    decisions: [Р6, Р10]
    summary: >-
      H01 и H03 ставят письма security из двух источников: H01 — из «kaname» и
      «kaname-fixture-2», H03 — «2S строк security … в двух источниках». Документ сам
      запрещает такое Given. По Р6 класс security разрешён только пространствам закрытого
      перечня identityNamespaces = {kaname}. G20 утверждает, что строка security из другого
      пространства закрывается INVALID(class_not_allowed) и SMTP-сессий по ней 0. Значит,
      строки из второго источника до сетки на адресата не дойдут, и исход H01/H03 будет
      другим. Для security «поперёк источников» невыразимо: источник у этого класса один.
    evidence:
      - "Р6 п.3 (стр. 360-362): identityNamespaces = {kaname}, гейт сборки и страж старта"
      - "NTF1-G20 (стр. 1300-1305): security вне identityNamespaces → INVALID(class_not_allowed)"
      - "NTF1-H01 Given (стр. 1327), NTF1-H03 Given (стр. 1341)"
    required_change: >-
      Сетку security доказывать одним источником kaname: в H03 точность держат две реплики
      notify. Свойство «поперёк источников» доказывать на классе notice (probe и probe-b) —
      отдельным сценарием с близнецом, где в пределах сетки оба источника доставлены.
      Если identityNamespaces задуман ручкой, а не закрытой константой, сказать это в Р6
      и назвать значение фикстуры H01. Тогда G20 должен утверждать и страж старта на
      значении вне {kaname}.

  - id: B4-3
    kind: CONSTRUCTIBILITY
    scenarios: [NTF1-E02, NTF1-N02]
    decisions: [Р4, Р9]
    summary: >-
      Двум Given нужен второй объект, которого в замысле NTF-1 нет.
      (1) E02: «посеянная лента проб notification_feed:probe-b-fixture того же источника» и
      постановка «в ленту probe и в ленту probe-b-fixture». По Р4 и B01 объект ленты —
      notification_feed:<модуль>, одна лента на службу (таблица <svc>_notification_outbox,
      notifygen init). Второй ленты в одном источнике нет ни в замысле, ни в таблице средств
      §6: там названы только пространства probe, probe-b и kaname. Положительный контроль
      внутри E02 построить нечем.
      (2) N02: «глобальный true, notifyProbe … false» на стенде. В NTF-1 подключаемый источник
      на стенде один — notify-probe; kaname становится источником в NTF-2 (Р3, §4). При
      выключенной пробе перечень пуст, и по N04 notify не рендерится вообще. Then «notify-probe
      в перечне notify нет» проходит на пустом предмете, а заголовок «выключает только его»
      не проверен: второго модуля, который остался бы включён, нет.
    required_change: >-
      E02: построить положительный контроль тем же подписчиком без второй ленты. Близнец:
      те же условия, но в фикстурной проверке прав посеян кортеж
      service:probe-b reader notification_feed:probe. Тогда событие приходит, и различие
      между сценариями ровно один факт. Другой путь: объявить в Р8, что одна служба может
      держать несколько лент, и назвать фикстуру, которая это строит.
      N02: перенести в гейт рендера с фикстурной таблицей подключаемых из двух записей
      (notify-probe и фикстурный модуль) и утвердить, что в перечне осталась ровно вторая.
      Либо на стенде утверждать N04-исход честно, а «только его» доказывать рендером.

  - id: B4-4
    kind: SCOPE
    scenarios: []
    decisions: [Р10, §4]
    summary: >-
      Р10 (стр. 461-462) говорит: «автоматическую паузу по жалобам и возвратам заводит NTF-4».
      То же в §4, строка NTF-4: «автоматическая пауза». Это расходится с решением диспетчера
      Д11 «пауза по жалобам только оператором», а строки спора в документе нет. Соседняя
      приёмка NTF-4 (docs/specs/sub-phase-NTF-4-delivery-feedback-reputation-acceptance.md,
      sha256 0927cf65…, стр. 171) держит обратное: «автоматической приостановки шаблона по
      жалобам нет». Документ, таким образом, назначает соседу объём, который тот не несёт и
      который решение запрещает.
    required_change: >-
      Снять из Р10 и §4 автоматическую паузу, записав, что пауза по жалобам ставится только
      оператором (Д11). Либо оставить её, но строкой спора с решением Д11 и доводом, — тогда
      это вопрос диспетчеру, а не молчаливое отступление.

non_blocking:
  - id: N4-1
    kind: FORMAT
    text: >-
      NTF1-M02: в Then стоит «… requires an authenticated caller» с многоточием, и не сказано,
      кто производит отказ. Через authz.Interceptor вызов без субъекта получает
      PERMISSION_DENIED «permission denied» (corelib authz/interceptor.go:331-336 и 209
      @34bc810), и обработчик не вызывается. Текст «subscription requires an authenticated
      caller» даёт только сам сервер подписки (subscription/server.go:233). Нужно назвать
      слой и написать текст полностью.
  - id: N4-2
    kind: FORMAT
    text: >-
      NTF1-G19: «обслуживаются только здоровье и метрики; вызов любого метода gRPC —
      UNIMPLEMENTED». Если проверка здоровья отвечает по gRPC (grpc.health.v1), утверждение
      противоречит само себе. Назвать, по какому протоколу отвечает здоровье, или исключить
      его из «любого метода».
  - id: N4-3
    kind: CONVENTION
    text: >-
      Р10 и H06 задают ручки notify.sources[].rate/burst/paused значениями установки. N03 при
      этом краснеет на «инъекции записи перечня значением установки». Нужно назвать, где
      живут ручки на источник (например, <модуль>.notifications.*), чтобы гейт N03 не принял
      их за ручную запись перечня и чтобы ручка источника, которого нет в выведенном
      перечне, была отказом.
  - id: N4-4
    kind: COVERAGE
    text: >-
      NTF1-M06 проверяет исключение по перечню, а не Р2 п.4: OperationService.Get не входит в
      перечень Р2 kaname {ResolveSend}, поэтому служебного принципала там нет и без п.4.
      Чтобы проверить п.4 («субъект из сертификата не принципал операции»), нужен метод из
      перечня, который читает принципала операции, — либо прямо сказать, что M06 держит
      только перечень.
  - id: N4-5
    kind: SCOPE
    text: >-
      Рассинхрон с соседней приёмкой NTF-4 (0927cf65…): та исходит из того, что после
      NTF-1 notify без БД (Р3 NTF-4 заводит kacho_notify, З4) и что NTF-1 снимает код
      почты kaname (З7). В редакции 4 NTF-1 kacho_notify заводится здесь (Р1, Р10), а
      снятие почты kaname ушло в NTF-2. NTF-4 сама признаёт, что при расхождении прав
      NTF-1 (стр. 83). Правка нужна там, а не здесь; фиксирую, чтобы её не потеряли.

