previous_return_checked:
  B17-1: >-
    Закрыто вариантом (а), в пределах Д19. Р8 различает производителя и приёмника. Производитель —
    вызов `NormalizeDomain` с ошибкой, связанной с именем; сравнение `==` и `Value()` над его
    результатами законны. Приёмник — одно из трёх: (1) ссылка на тип `address.Domain`; (2)
    подстановка типа в параметр типа, явная или выведенная; (3) вызов, чья ошибка присвоена `_`.
    Узел B27 держит три инъекции по видам. Близнец узла воспроизводит форму сравнения доменов
    NTF-4 (Р10): два вызова производителя, узлов 0. У инъекции (2) есть отдельный близнец в §6.2,
    отличие одно — ошибка под именем `err`. §4 называет, что код NTF-4 узлом не является, а исход
    на ошибке производителя утверждает NTF-4. Сверено с NTF-4 в линии (5f87c1819, редакция 19,
    строки 317 и 840–846). Там сравнения идут через результат `NormalizeDomain`, а параметров и
    полей типа `address.Domain` не предписано. Значит, фраза NTF-4 «гейт единственности NTF-1 от
    кода NTF-4 не краснеет» при такой форме кода верна. Узел IDNA не менялся.
  B17-2: >-
    Закрыто. В Given B31 счётчик до постановки равен 2, после постановки в When — 3. Дальше
    арифметика: (а) `unclaimed`, вклад возвращён → 2; (б) `no_ack`, не возвращён → 3; (в) флаг
    выключен, `unclaimed` → 2. Близнец B15 (`platform_unavailable`) → 2. Всё сходится с B30 (а)
    (0 → 1).
  N17-1: "Закрыто. G26 (д, потолок) — новая строка, `Claim` её ни разу не выдавал."
  N17-2: "Закрыто. В Р9 «выключен» появилось «уборщик продолжает работать» со ссылкой на Р8 и B31 (в)."
  N17-3: "Закрыто. Случай G27 (г) назван недостижимым в продукте и законным как проба правила меток."
  N17-4: "Не правился (косметика), остаётся необязательным."

