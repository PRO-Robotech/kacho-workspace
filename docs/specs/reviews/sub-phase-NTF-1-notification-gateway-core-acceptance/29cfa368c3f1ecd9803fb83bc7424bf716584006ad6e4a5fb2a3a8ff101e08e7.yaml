non_blocking:
  - id: N18-1
    kind: PRODUCER
    what: >-
      Вид (3) узла «приёмник `address.Domain`» назван как «вызов `address.NormalizeDomain`». Вызов
      через значение-функцию (`f := address.NormalizeDomain; d, _ := f(s)`) узлом не виден: у
      такого вызова идентичность вызываемого — локальная переменная, и сама ссылка
      `address.NormalizeDomain` вне позиции вызова не считается ни производителем, ни приёмником.
      При этом Р8 определяет приёмник шире — «значение берётся не прямо из вызова-производителя».
      Вреда сверх признанного документом нет: ошибка, связанная с именем и не обработанная, узлом
      тоже не видна, и `Value()` на нуле отвечает `ErrUnset` (B27 (нуль)). Узел IDNA того же гейта
      значение-функцию судит («вызов или значение-функция»). Рекомендация: при следующей правке
      назвать находкой ссылку на `address.NormalizeDomain` не в позиции вызова (вид (4)) либо
      оговорить этот путь рядом с признанным остатком Р8.
  - id: N18-2
    kind: FORMAT
    what: >-
      Given B31 держит «лимит на адресата L» и счётчик 2 → 3 после постановки. Из этого следует
      L ≥ 3, но вслух это не сказано. Автор пробы, взяв L = 2, получит `ErrLimitExhausted` вместо
      постановки. Нужно одно слово: «L ≥ 3».
  - id: N18-3
    kind: SCOPE
    what: >-
      Следствие выбора (а) для кода NTF-4. Сравнения доменов в `services/notify` пишутся без
      параметров, полей и результатов типа `address.Domain`, с организационным выравниванием над
      строками `Value()`. Если NTF-4 понадобится вспомогательная функция над `address.Domain`, это
      первый приёмник, и его вносит правка NTF-1 (Р8). §4 NTF-1 это называет, а NTF-4 в линии —
      нет. Условие к коду — предмет замысла NTF-4 (Д22), в этой приёмке ничего править не нужно.
  - id: N17-4
    what: "Перенесено: порядок строк §6.2 (A10 (к) перед A11 и A10 (а)–(и)) — косметика."

