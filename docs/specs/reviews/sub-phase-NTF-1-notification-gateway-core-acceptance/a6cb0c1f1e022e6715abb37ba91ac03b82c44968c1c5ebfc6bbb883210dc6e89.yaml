repeat_note: >-
  CONSTRUCTIBILITY блокирует шестой круг подряд, и каждый раз на новом предмете. На этом
  круге перепись §1.11 спросила правильное: решает ли код kaname исход в обход модели. Но
  ответила по предикату, который сама же прочла неверно. Команда печатает 29 строк, а
  документ разнёс их на «4 внутри двери + 3 вне». Одна из трёх внешних (module/authz.go) —
  комментарий. Не учтены три настоящих вызова, среди них путь InternalIAMService/Check.
  Второй предмет круга: Given называет слово провода, которого дерево не принимает. Общий
  знаменатель такой: факт о дереве взят из прозы — правила, комментария или собственной
  сводки, — а не из разобранного вывода команды. Переносить ли в форму задания автора шаг
  «каждую строку вывода предиката §1 классифицировать поимённо», решает диспетчер (§14а).

blocking:
  - id: B5-1
    kind: CONSTRUCTIBILITY
    scenarios: [NTF1-F12, NTF1-F22, NTF1-C04, NTF1-C05]
    decisions: [Р4, Р5, З5, §1.11, S2]
    summary: >-
      В переписи §1.11 пропущен путь надзора, через который идёт InternalIAMService/Check.
      F12 проверяет исход именно этим вызовом, а F22 (а) и перехватчик прав каждой службы kacho
      вызывают его же. Обработчик InternalIAMService/Check передаёт вопрос в
      AuthorizeService.CheckRelation, а та — в verdictForRelation. После отказа модели
      verdictForRelation сама спрашивает, не администратор ли облака субъект, и на «да»
      разрешает. Ни check, ни verdict, ни resolveRun при этом не участвуют. Р5, З5, S2 и гейт
      F12 («каждый из 4 путей надзора») перечисляют четыре пути, и этого среди них нет.
      Значит, правки, названные документом, Then F12 (а), (б), (г) и F22 (а) не производят:
      пересланный администратор облака по-прежнему получает true, а Claim ему отдаёт строку.
      Утверждение Р4 «тело письма может забрать только notify» держится на том же пути.
      Сводка переписи тоже неверна. Команда §1.11 на 734f69fb4 печатает 29 строк. «Третий
      вызов вне двери», internal/apps/kaname/api/module/authz.go:26, — это комментарий.
      Документ не называет три настоящих вызова: authorize_service.go:770 (verdictForRelation),
      authzguard/own_door.go:523 (checkAdapter.Check двери собственного публичного слушателя
      kaname) и authzguard/read_authz.go:76 (AllowsVerb — надзор спрашивается первым, у него
      10 вызывающих). Ещё два места в сценариях. F12 (д) — «действие, не разрешающееся в
      отношение» — через InternalIAMService/Check невыразимо: этот запрос несёт отношение, а
      действия у него нет. BatchCheck принадлежит публичному AuthorizeService, а §6.1 записывает
      её в «обработчики InternalIAMService».
    evidence:
      - "kaname internal/apps/kaname/api/internal_iam/handler.go:266-294 @734f69fb4 — Check делегирует AuthorizeService.CheckRelation; запрос {subject_id, relation, object}, поля action нет"
      - "kaname internal/service/authorize_service.go:708-775 @734f69fb4 — CheckRelation → verdictForRelation: модель false → SubjectIsClusterAdminPlainE → admin; комментарий: «Дверь эта — та, через которую идёт КАЖДЫЙ запрос платформы»"
      - "kaname internal/authzguard/own_door.go:505-529 @734f69fb4 — checkAdapter.Check: надзор на отказе объекта; подключён NewOwnDoor (cmd/kaname/serve.go:898, публичный слушатель)"
      - "kaname internal/authzguard/read_authz.go:60-90 @734f69fb4 — AllowsVerb: надзор первым; `git grep -n 'AllowsVerb(\\|AllowsVGet(' 734f69fb4 -- '*.go' ':!*_test.go' | wc -l` → 10"
      - "`git -C kaname grep -n 'isClusterAdmin\\|superGateDecides\\|SubjectIsClusterAdminPlainE' 734f69fb4 -- '*.go' ':!*_test.go' | wc -l` → 29; module/authz.go:26 — строка комментария"
      - "kaname internal/apps/kaname/api/authorize/handler.go:224 — BatchCheck обслуживает публичный AuthorizeService"
    required_change: >-
      Переписать §1.11 по выводу команды поимённо: каждая из 29 строк должна получить класс —
      определение, обёртка, комментарий или путь решения — и отношение к типам Р5. В перечень
      путей надзора двери внести verdictForRelation (CheckRelation, то есть
      InternalIAMService/Check). Для checkAdapter двери публичного слушателя kaname и для
      AllowsVerb сказать, касаются ли они типов Р5. Если касаются — внести их в тот же перечень.
      Если нет — назвать довод и держателя. Р5, З5 и S2 перечисляют все пути; гейт F12 судит
      множество путей, которое печатает перепись, а не константу 4. В F12 развести, какой
      подслучай каким вызовом идёт: (а), (б), (г) — через InternalIAMService/Check;
      (в) и (д) — через публичный AuthorizeService (BatchCheck и Check с действием).
      Исправить строку F12 в §6.1.

  - id: B5-2
    kind: CONSTRUCTIBILITY
    scenarios: [NTF1-E01, NTF1-E02, NTF1-E03, NTF1-F22, NTF1-N07, NTF1-N02, NTF1-N08]
    decisions: [Р4, Р9]
    summary: >-
      Два Given не строятся на corelib 34bc810.
      (1) Слово вида на проводе. Словарь видов Subscribe состоит из Mapping.Kinds[*].ObjectType,
      то есть из типов модели прав. Ключ «notification» — слово журнала владельца, и наружу оно
      не выходит. Поэтому подписка «с видом notification» (E01–E03, E02, F22 (в)) при
      включённом флаге отвергается INVALID_ARGUMENT «kinds: "notification" is not a kind of this
      owner; known kinds: notification_feed». В N07 отрицание («вид не объявлен» →
      INVALID_ARGUMENT) и близнец («с флагом true вид объявлен») для запроса «notification»
      дают один и тот же отказ, то есть отличаются не одним фактом.
      (2) Пустой словарь видов. Если флаг выключен, а у источника других видов нет, журнал
      подписки не собирается: Mapping.validate отвергает пустой Kinds. У notify-probe и
      фикстурного источника N07 других видов документ не называет. Значит, «стартует» из N07
      и N08, а также «служба с false» из N02 и N09, для такого источника ложно: либо он не
      стартует, либо сервер подписки не монтируется, и тогда Subscribe отвечает UNIMPLEMENTED,
      а не INVALID_ARGUMENT.
    evidence:
      - "corelib subscription/journal.go:344-356 @34bc810 — KindDictionary() собирает binding.ObjectType"
      - "corelib subscription/request.go:68-90 @34bc810 — вид вне словаря → INVALID_ARGUMENT «kinds: %q is not a kind of this owner; known kinds: …»"
      - "corelib subscription/journal.go:492-494 @34bc810 — Mapping.Kinds пуст → ошибка сборки журнала"
      - "kacho services/compute/internal/subscriptionjournal/journal.go:126-131 @1d42a6728bf — ключ JournalWordInstance, на проводе ObjectType"
    required_change: >-
      Во всех When и Then писать вид провода: kinds: ["notification_feed"], событие вида
      notification_feed. Слово журнала «notification» оставить только в Р4 как ключ Mapping.Kinds.
      Для флага false явно выбрать исход и утвердить его в N07. Вариант первый: у источника
      есть ещё хотя бы один вид (назвать его у фикстуры и у notify-probe), тогда Subscribe с
      notification_feed → INVALID_ARGUMENT с полным текстом corelib. Вариант второй: при
      пустом словаре сервер подписки не монтируется, тогда Subscribe → UNIMPLEMENTED, и
      N07 с N08 утверждают, что служба стартует. Близнец N07 (true) должен отличаться ровно
      флагом.

non_blocking:
  - id: N5-1
    kind: CONVENTION
    text: >-
      Р2 п.5 вносит в forbiddenObjectTypes только тип service. Гейт
      TestForbiddenProxyObjectTypesAgreeWithTheModel (kacho internal/repohygiene/proxyforbiddentypes.go:106-121
      @1d42a6728bf, сторона Б) требует, чтобы каждый тип модели вне доменов-эмитентов был в
      наборе. notification_feed и notification_namespace к доменам-эмитентам не относятся, так
      что без записи в наборе DoD п.11 («proxyforbiddentypes_test.go на новом пине зелёный»)
      будет красным. На той же записи держится и отказ M10 (б) для этих двух типов при пустом
      домене вызывающего. Нужно назвать оба типа в Р2 п.5 (или в Р5) и в стадии S1.
  - id: N5-2
    kind: FORMAT
    text: >-
      В §6 строка средств «проверка прав фикстурного источника отвечает по посеянным кортежам»
      противоречит F22 (а) и (в): там источник спрашивает настоящую дверь kaname в процессе
      пробы (§6.1). Средство нужно назвать в самом F22, чтобы было видно, какая дверь даёт исход.

