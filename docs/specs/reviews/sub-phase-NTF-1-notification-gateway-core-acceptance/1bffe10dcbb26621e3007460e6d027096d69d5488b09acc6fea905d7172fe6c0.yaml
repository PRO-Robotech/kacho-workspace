    When, их производители прежние.
  twin: >-
    N02 «вне `global`»: близнец — тот же ключ под `global.kacho.notifications.modules`, рендер
    проходит, перечень `{probe-b}`. Различается один факт — место ключа. J05 «вне `global`»:
    близнец — согласный рендер, различается один факт — место декларации. Оба близнеца записаны в
    тексте сценария. Отдельных строк в §6.2 у них нет (N19-1).
