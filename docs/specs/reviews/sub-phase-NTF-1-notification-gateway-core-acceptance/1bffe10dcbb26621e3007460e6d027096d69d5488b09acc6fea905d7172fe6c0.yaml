non_blocking:
  - id: N19-1
    kind: TWIN
    what: >-
      Заголовок §6.2 обещает строку на каждое отрицание, а у двух новых отрицаний строк нет: N02
      «ключ вне `global`» ↔ «тот же ключ под `global.kacho.notifications.modules`» и J05 «декларация
      вне `global`» ↔ «согласный рендер». Близнецы названы прямо в сценариях, поэтому проверяемость
      не страдает. Просьба: при следующей правке дописать две строки в §6.2.
  - id: N19-2
    kind: CONSTRUCTIBILITY
    what: >-
      У J05 «декларация вне `global` (тот же литерал под ключом её подчарта)» не сказано, остаётся ли
      декларация под `global`. От этого зависит исход. Посев показал: если она остаётся (добавочная
      форма), рендер проходит с кодом 0 и молча, а находит её только сверка путей значений. Если
      декларацию перенесли, рендер падает раньше гейта, на помощнике. «Красный с путём» исполним в
      обоих случаях, но только если гейт читает пути значений, а не один рендер. Просьба: назвать
      добавочную форму инъекцией J05, потому что тихая ветка — именно она.
  - id: N19-3
    kind: FORMAT
    what: >-
      Строка 19 таблицы §9 называет род «CONTRACT». Его нет в закрытом словаре: прежние строки берут
      роды SCOPE/FORMAT/…. Это косметика.
  - id: N18-1
    what: "Перенесено без изменений: вызов `address.NormalizeDomain` через значение-функцию (узел B27)."
  - id: N18-2
    what: "Перенесено: Given B31 не говорит «L ≥ 3»."

out_of_subject_notes:
  - >-
    tasks.md:337 (D2) держит прежнюю инъекцию «`notifyProbe.notifications.enabled: true` в
    `values.own-stand.yaml` без `notifyProbe.enabled` → красный переписи с именем `own`». При пути
    редакции 32 этот ключ сначала отвергается рендером (З28, N02), и до переписи дело не доходит.
    Инъекцию нужно перевести на `global.kacho.notifications.modules.notifyProbe.enabled`. Это предмет
    маршрута и замысла, а не приёмки.

