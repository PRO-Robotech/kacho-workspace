        над `.Values.global` даёт в notify и notifyProbe одинаковое значение `false` при
        `global.kacho.notifications.modules.notifyProbe.enabled=false`.
      - >-
        N02 «вне `global`»: шаблон уровня зонтика видит `.Values.notifyProbe`. Ключ
        `notifyProbe.notifications.enabled=false` даёт отказ рендера «notifyProbe.notifications.enabled
        is outside global; …» с именем ключа. Близнец (тот же ключ под `global`) — код 0.
      - >-
        J05 «вне `global`»: при добавочной форме инъекции рендер даёт код 0, то есть молчит.
        `yq '[.. | select(key == "spiffe") | path | join(".")] | .[] | select(test("^global") | not)'`
        находит `notify.spiffe`, на согласных значениях выдача пуста. Отсюда N19-2.

