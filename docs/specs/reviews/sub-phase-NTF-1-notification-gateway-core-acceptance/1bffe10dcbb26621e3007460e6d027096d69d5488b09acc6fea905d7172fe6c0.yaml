design_consistency:
  source: docs/changes/issue-2915/design.md (редакция 32), §13 Е16, З28 «Флаг», «Декларации», карта CX1-106
  E16_required: "Р9, Р12, NTF1-N02, J03, J05 называют пути под global.kacho.…"
  E16_met: >-
    Да. Р9 и N02 называют `global.kacho.notifications.modules.<модуль>.enabled`. Р12, J03 и J05
    называют `global.kacho.spiffe.<служба>`. Тот же путь сверх перечня Е16 стоит в Р2 п.2, Р3, Р6,
    §3 З11, §5 S4, C03, G22 и K03. Набор деклараций {notify, notifyProbe, kaname} совпадает с З28
    «Декларации» (design.md:2094). Отказ рендера на ключе флага вне `global` совпадает с З28
    (design.md:2041). Отрицание J05 «вне `global`» совпадает с критерием J2 в tasks.md:327.
  w4a_predicate: >-
    grep -nE '<модуль>\.notifications\.enabled|(notify|notifyProbe|kaname)\.spiffe' по документу без
    вхождений `global.kacho` дал 1 строку (2939). Она лежит в §9, который начинается со строки 2934,
