non_blocking:
  - id: N9-1
    kind: PRODUCER
    anchors: [NTF1-B27, "§6.1 строка B01–B18, B20–B27"]
    text: >-
      Последнее «И» в B27 («гейт дерева не находит второй нормализации адреса в `corelib/notify` и
      `services/notify`») не называет узел гейта. Непонятно, что считается «нормализацией»: импорт
      `golang.org/x/net/idna`, вызов `strings.ToLower`/`EqualFold` или сравнение доменов. Если
      узлом взять `strings.ToLower`, гейт покраснеет на исправном notify: регистр понижают и в
      других местах, например в заголовках. Это тот же класс, что A09 на круге 7. Сегодня гейт
      покраснеть не может — обоих деревьев ещё нет. Поведение (одно окно на ящик) держат
      integration-утверждения B27. Стоит назвать узел, например «не-тестовый вызов пакета
      `idna` или понижение регистра доменной части вне `notify/address`», а также инъекцию и
      законного близнеца. Сделать это в S1 до первой строки гейта.
  - id: N9-2
    kind: FORMAT
    anchors: [NTF1-G24]
    text: >-
      В G24 (е) стоит значение `abc&next=x длиной ≥ 16`, но литерал содержит 10 символов. Если его
      не дополнить, строка нарушит сразу и алфавит, и длину, и (е) не отличит проверку алфавита
      от (ж) — проверки длины. Нужен конкретный литерал длиной не меньше 16, например
      `abcdefghijklmn&next=x`.
  - id: N9-3
    kind: FORMAT
    anchors: [Р7, NTF1-A01, NTF1-G06, NTF1-G24]
    text: >-
      Р7 собирает ссылку кнопки с `token` как «origin + путь кнопки из шаблона + `?token=`». Но
      грамматика блока `button{text, path|token}` пути у кнопки с `token` не выражает. В A01 и
      G24 такая кнопка без пути, а ожидаемые адреса эллиптичны (`<путь>` в G06, `…` в
      близнеце G24). Неясность перешла из одобренной редакции 8; редакция 9 её только
      назвала. Стоит выразить путь кнопки с `token` в грамматике (например, литералом
      `button{text, token, path: "/…"}`) и привести в G24 точный адрес обеих кнопок.
  - id: N9-4
    kind: CONTRACT
    anchors: [Р8, NTF1-B25, NTF1-B10]
    text: >-
      После B25 строка под арендой живёт дольше `expires_at` на остаток аренды, и её секрет —
      тоже. Длительность аренды в документе не названа: нет ни ручки, ни границы. Срок жизни
      секрета сверх `ttl` сейчас ничем не ограничен. Стоит назвать длительность аренды ручкой с
      границей под стражем старта (в замысле, рядом с политикой отсрочки CX1-14) и сказать, что
      секрет живёт не дольше `expires_at` плюс эта граница.

