class_exposure_returns_closed:
  RA-01: >-
    Закрыт вариантом (б) разбора. Р10: возврат вклада в окно решает только причина последнего
    `DEFER`. Прежнее условие «ни разу не получила ответа на `RCPT`» снято, и это сказано явно.
    Довод верен по Р11: во всех клетках с `platform_unavailable` ретранслятор `DATA` не принял.
    Цена названа: вклад может вернуться за письмо, ушедшее в окне Р14 (`DATA` → `Ack`); сам Р14 —
    «дубль возможен ровно в окне `DATA → Ack`». B15 утверждает исход после `451` на `RCPT`.
    CX1-16: правило «уборщик не закрывает строку под действующей арендой» в Р8 и новый B25 с
    близнецом B15 и запоздалым `Ack` → `LEASE_LOST`. CX1-10: сторож исчерпания — ноль строк
    условного `UPDATE`, без ошибки SQL; B09 переписан — откатывает транзакцию фикстурный
    вызывающий.
  RA-02: >-
    Закрыт. Одна функция corelib `notify/address.Normalize` с семантикой Р15 NTF-4: домен в нижнем
    регистре и в ASCII-форме IDNA, локальная часть без изменений. Сверено с
    docs/specs/sub-phase-NTF-4-delivery-feedback-reputation-acceptance.md:819-825. Её зовут
    `feed.Put` и notify. Неразбираемый адрес: у источника — `feed.ErrRecipientInvalid`, в
    notify — `INVALID(recipient_invalid)`. B27: два написания одного ящика дают одно окно,
    близнец — два ящика по локальной части, отдельно — адрес `user@`. G24 (з) держит сторону
    notify.
  RA-03: >-
    Закрыт. Р8 задаёт правило повтора. Тот же токен и тот же исход — успех без изменения строки.
    Тот же токен и другой исход — `OUTCOME_ALREADY_RECORDED` с текстом. Остальное — `LEASE_LOST`.
    Слово «прочие» даёт первым двум случаям приоритет и над истёкшей арендой, так что правило
    читается однозначно. B26 (а), (б) — у источника; B26 (в) — в notify, с потерей ответа после
    коммита, и на узле ровно одна сессия. Близнецы — B12 и B13.
  RA-04: >-
    Закрыт. В Р11 две новые клетки: недоступность названа кодами (нет ответа, `UNAVAILABLE`,
    `DEADLINE_EXCEEDED`) — это `DEFER(platform_unavailable)`. Отказ (любой иной код или исход
    вне трёх) — `DEFER(platform_unavailable)` + `misconfigured`. Классификация идёт по типу
    ответа, ветки «прочее» нет. G23 проверяет четыре ответа, близнец — F01. На стороне kaname
    CX1-07 (а): сбой чтения записи выдачи — `UNAVAILABLE` с фиксированным текстом, а не
    `NOT_YET_GRANTED`. Держат F23 (близнец F04) и строка «сторона notify» в §6.1. Форма текста
    следует прецеденту kaname: `TextStoreUnavailable = "access key service temporarily
    unavailable"` (internal/apps/kaname/api/access_keys/refusals.go:189 @734f69fb4).
  RA-05: >-
    Закрыт ратификацией с названной ценой, и разбор этот вариант допускал. 5xx на `RCPT`
    терминален с любым расширенным кодом. Иной выбор расходится с NTF-4: там `permanent_other`
    включает `5.7.*` (sub-phase-NTF-4…:464), а NTF4-07 утверждает `RECIPIENT_REJECTED` при
    `550 5.7.1` (:1312-1317). G10 переведён на `550 5.1.1`. G14 утверждает `5.1.1`, `5.7.1` и 5xx
    без расширенного кода; близнец назван в §6.2.
  RA-06: >-
    Закрыт. Р7 задаёт форму `path` (абсолютный путь в закрытом алфавите: без `//`, `..`, схемы,
    `\`, `%`) и `token` (`[A-Za-z0-9_-]`, 16..512). Ссылка собирается сложением строк, разрешения
    относительного адреса нет. У клетки `attrs_invalid` есть сценарий: G24 (а)–(ж) и близнец
    со значениями по форме. Строку вне формы проба ставит мимо `SendX` прямым `UPDATE` и
    запечатывает ключом фикстурного источника с AAD этой строки. Так Given конструируем, и
    строка доходит до проверки формы.
  N8-1: закрыт — G19 отдельной строкой печатает число вызовов через значение-функцию или интерфейс.

