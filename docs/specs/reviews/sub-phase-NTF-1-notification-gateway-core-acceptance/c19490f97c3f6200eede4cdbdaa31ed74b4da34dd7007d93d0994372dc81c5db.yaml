non_blocking:
  - kind: TWIN
    note: >-
      Близнец инъекций P12 называет зелёными пять профилей, а `prod` и `own` не называет. Их цепочки
      `values.dev.yaml` не включают, и на дереве как есть они тоже зелёные. Полный перечень из семи профилей
      сделал бы близнец замкнутым: «падает на пустом обходе» и «печатает 7» уже есть.
  - kind: COVERAGE
    note: >-
      Замысел (держатель P12) называет четвёртую инъекцию: строка профиля удалена из
      `deploy/stacks-mail.txt` → красный. В приёмке это утверждение есть только как «падает на профиле,
      которого нет в перечне признаков», без инъекции в §6.1. Держатель всё равно её несёт, исход закрыт
      замыслом. Можно дописать к инъекциям P12 при следующей правке.

