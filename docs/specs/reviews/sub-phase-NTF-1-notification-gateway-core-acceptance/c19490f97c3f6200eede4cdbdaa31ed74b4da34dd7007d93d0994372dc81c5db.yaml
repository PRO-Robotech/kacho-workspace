prior_findings_closure:
  R21-1:
    status: closed
    evidence: >-
      P12 судит два слоя. Слитые значения: «объявление зоны стенда включено ⇒ признак «да»». Рендер:
      «да» и notify рендерится ⇒ у пода `dnsConfig`; «нет» ⇒ ни `dnsConfig`, ни сервера зоны. Отдельно
      утверждается, что `a8f60d` notify не рендерит. Каждая из трёх инъекций теперь падает на своём слое.
      (1) Объявление включено в `values.a8f60d.yaml`: слитые значения `a8f60d` (признак «нет») →
      красный `a8f60d`. (2) То же в `values.prod.yaml` → красный `prod`, хотя notify в рендере `prod` нет:
      слой слитых значений от рендера не зависит. (3) Ключи, выключающие notify в `a8f60d`, сняты →
      красный по утверждению «`a8f60d` notify не рендерит». Близнец (`values.dev.yaml` как есть) теперь
      выполним вместе с инъекциями: `dev`, `dev-prod`, `prorobotech` наследуют объявление и имеют признак
      «да»; `a8f60d` наследование снимает своим файлом. Р19 «Профиль стенда» называет наследование.
      §6.1 P12 и три строки §6.2 P12 переписаны, каждая пара отличается одним фактом. С замыслом e25cc91d…
      (§12а, держатель P12, утверждения (а)…(г)) совпадает.
    predicate: >-
      grep -v '^#' project/kacho/deploy/stacks.txt @ba01514b98b → цепочки `prorobotech` и `a8f60d`
      начинаются с values.dev.yaml, `fe3455`, `own`, `prod` с ним не связаны;
      sed -n '2809,2830p;2926p;3114,3116p' <NTF-1>; sed -n '5118,5170p' docs/changes/issue-2915/design.md.
  R21-nonblocking:
    status: closed
    evidence: >-
      Близнец P13 теперь звучит «загрузчик принимает, конфигурация несёт значение», и unit-проба
      это наблюдает. В P14 добавлена седьмая причина — `sel_1`, текст `вне формы имени DNS`. Новый P19
      (записи `v=spf1` нет) появился в таблице отказов, в §6.1 (строка стража), в §6.2 (близнец P01) и
      в DoD 20, 21; в перечень инъекции «return nil» он вошёл. Объект ключа DKIM теперь отдельный объект
      (Р19 «Подпись»), I01 печатает его перепись отдельной строкой, сервер зоны стенда даёт 0, как в замысле
      (посев). DoD 22 называет все семь профилей с признаком.
  R20-1_R20-2:
    status: closed
    evidence: "Закрытие засвидетельствовано записью a49b7125…, в дельте 22 эти места не менялись."

decisions_checked:
  d100: "Носитель notify-api входит в Основу — это предмет замысла и маршрута работ. Сценариев приёмки NTF-1 не меняет; противоречия в группе P нет."
  d101: "Р19 «Адрес возврата в NTF-1» и «Тогда» P02: envelope `MAIL FROM` — адрес отправителя установки; rua, выравнивание, MX, длина, dns_posture — в NTF-4. Совпадает."
  d102: "Р19 «Профиль стенда» и P12: перечень семи профилей с явным признаком; `a8f60d` notify не рендерит; посев туда запрещён; P12 судит все семь, инъекции на `a8f60d`. Совпадает."
  d103: "Предмет NTF-4 и замысла. Дельта 22 ссылок на NTF-4, которые требовали бы отпечатка, не вносит."

