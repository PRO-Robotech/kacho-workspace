blocking_count: 2
blocking_kinds_distinct: [COVERAGE, CONSTRUCTIBILITY]
blocking_findings:
  - id: R20-1
    kind: COVERAGE
    where: "Р19, «Ручки и границы» (стр. 1374–1381); §6.1; DoD 20–23"
    claim: >-
      Р19 утверждает, что незаданная ручка или значение вне границы — это отказ в старте с именем
      ручки и границы, для `KACHO_NOTIFY_DNS_BOOT_DEADLINE` (10 с … 10 мин) и
      `KACHO_NOTIFY_DNS_RECHECK_INTERVAL` (1 мин … 24 ч). В NTF-1 ни один сценарий и ни один держатель
      этого не утверждает. NTF1-H08 перечисляет только ручки Р10. В NTF-4 эти две ручки держала проба
      `required_knobs_test.go`: она судит обе стороны каждой границы и снятие каждой ручки (HEAD NTF-4
      §8 стр. 3610). Новая редакция NTF-4 исключила их из своей группы (стр. 1348 и 4572: «в перечне их
      нет»). При переносе держатель потерян, и это противоречит фразе Р19 «Содержание не ослаблено».
    predicate: >-
      grep -n 'DNS_BOOT_DEADLINE\|DNS_RECHECK_INTERVAL' <NTF-1> — вхождения только в Р19, P08–P11,
      §6.2 и §9. Ни в одном Given или When нет значения вне границы или незаданного значения.
    fix: >-
      Нужен сценарий с близнецом. Например, NTF1-P13: каждая из двух ручек по отдельности не задана,
      задана за нижней границей или за верхней → отказ старта с именем ручки и нарушенной границей.
      Близнец — значения ровно на границах, notify стартует. Добавить строку §6.1 на загрузчик notify
      (`services/notify/internal/config/*_test.go`, как у H08) с инъекцией снятой границы. Добавить
      P13 в DoD 20.
  - id: R20-2
    kind: CONSTRUCTIBILITY
    where: "Р19 «Отказ закрытый», «Резолвер»; средства стр. 1488–1489; NTF1-I06 (стр. 2569); DoD 17 и 22; integration-стенды групп G, H, K, L03–L05"
    claim: >-
      После S6 каждый старт notify требует исправной зоны DNS домена `From`, видимой резолвером пода
      или портом резолвера. Иначе notify отказывает в старте или не готов до
      `KACHO_NOTIFY_DNS_BOOT_DEADLINE`. Средство «зона DNS испытания» названо только для P01, P04–P11,
      а «зона стенда» — только для P01–P03. При этом в Given не сказано, откуда исправная зона берётся:
      (а) у NTF1-I06 — отдельный чарт notify с собственными значениями ставится на кластере
      `production-posture.yml` и утверждает «rollout notify готов»;
      (б) у DoD 22 — «`helm install` в боевой посадке с этими значениями доходит до готовности», хотя
      в `values.prod.yaml` переопределения `dnsConfig` по P12 нет, а реальной зоны домена `From` у
      кластера CI нет;
      (в) у прочих integration-стартов notify (G, H, K01–K03, L03–L05), которые теперь проходят через
      страж.
      Сценарии (а) и (в) одобрены на прежних отпечатках. Дельта меняет условие их конструируемости,
      поэтому они входят в её предмет. Названия у таких Given нет — это класс «Given описан, но не
      построится».
    predicate: >-
      grep -n 'зон[аыу] DNS' <NTF-1> — 9 вхождений, из них ни одно не относится к I06, DoD 17, G, H, K
      или L. В строке I06 §6.1 стоит `deploy/tests/helm/notify-standalone-test.sh` и
      `production-posture.yml`, а зоны нет.
    fix: >-
      В средствах написать одной строкой: «каждый integration-старт notify получает исправную зону
      испытания P01 через порт резолвера». В Given I06 и в DoD 22 назвать, на каком профиле идёт
      установка и откуда зона: стендовый профиль с `dnsConfig` и посевом либо зона испытания на
      кластере CI. Если установка в боевой посадке без зоны не может стать готовой, переформулировать
      DoD 22 как ожидаемый отказ старта с именем проверки, у которого близнец — стендовый профиль.

