blocking:
  - id: B6-1
    kind: PRODUCER
    scenarios: [NTF1-N07, NTF1-K03, NTF1-G19]
    decisions: [Р9]
    summary: >-
      Документ трижды приписывает гейту TestGRPCMountParity_EveryDeclaredServiceIsMounted исход,
      которого тот произвести не может. Гейт статический: «объявлен» для него значит «есть
      ServiceDesc в стабах контракта», «смонтирован» — «в композиционном корне дерева kacho
      есть вызов Register<Svc>Server». Судит он по владению пакетом: бинарь, не
      смонтировавший ни одного сервиса proto-пакета, этим пакетом не владеет, и пропуск
      целого пакета гейт не видит. Отсюда три случая.
      (1) Р9 и NTF1-N07 (б): «объявление и монтирование выводятся из одного условия, и гейт их
      согласие видит» и «TestGRPCMountParity… на этой посадке зелёный». Условное монтирование
      во время работы гейт не видит: вызов Register в исходнике есть при любом значении флага.
      Фикстуры N07 (probe, probe-solo) живут в corelib, а гейт обходит только services/ и
      gateway/ kacho. Строка зелёная при любом поведении, то есть упасть не может.
      (2) NTF1-K03, пропуск (3): «гейт монтирования». По C01 у пакета corelib.notify один
      сервис, InternalNotificationFeedService. Служба, пропустившая его подъём, пакетом
      corelib.notify не владеет, и гейт молчит.
      (3) NTF1-G19: «гейт называет notify с нулём объявленных сервисов». Гейт печатает только
      сводную перепись. Бинари без смонтированных сервисов не попадают даже в счётчик
      OwningBinaries, поэтому notify он не называет. Это тот же класс, что закрывался
      редакцией 6, — «факт о дереве взят из прозы»: ни один из трёх выводов не был
      сверен с кодом гейта.
    evidence:
      - "kacho internal/repohygiene/grpcmountparity.go:294-430 @1d42a6728bf — declared = стабы, mounted = вызовы Register в Roots {services, gateway}; находка unmounted только для пакетов, которыми бинарь владеет; OwningBinaries++ только при len(set) > 0; вывод — одна строка сводной переписи"
      - "kacho internal/repohygiene/grpcmountparity_test.go:113-123 @1d42a6728bf — Roots: services, gateway; APIRoot pkg/api"
      - "kacho internal/repohygiene/grpcmountparity.go:382-383 @1d42a6728bf — «домен, у которого не смонтирован ни один сервис, этим правилом не покрыт»"
      - "документ: Р9 стр. 563-567, N07 стр. 1620, K03 стр. 1731, G19 стр. 1472, C01 стр. 997 (один сервис ленты)"
    required_change: >-
      Р9 и N07 (б): снять утверждение о гейте монтирования. Исход «сервер подписки не
      смонтирован» утверждать наблюдением на самой посадке, в той же integration-пробе corelib:
      набор сервисов запущенного сервера (grpc.Server.GetServiceInfo) не содержит
      corelib.subscription.InternalSubscriptionService и содержит остальные. У близнеца (true)
      сервис в наборе есть. Если согласие «объявлено в самоотчёте = смонтировано» во время
      работы нужно держать, назвать держателя, который читает оба значения у запущенного
      процесса. K03 (3): назвать наблюдаемый исход пропуска, который производит репетиция
      procedure_rehearsal_test.go, например Claim notify → UNIMPLEMENTED и тревога возраста.
      Либо назвать гейт, который судит монтирование сервиса ленты у каждой службы с флагом
      notifications и ловит пакет без владельца. G19: заменить последнюю строку переписью, у
      которой есть производитель, например «в композиционном корне notify ни одного
      grpc.NewServer и Register* — число 0, объём осмотренного напечатан», либо опереться
      только на перепись портов пода, которая в G19 уже есть.

non_blocking:
  - id: N6-1
    kind: CONVENTION
    text: >-
      У гейта TestForbiddenProxyObjectTypesAgreeWithTheModel две стороны
      (proxyforbiddentypes.go:91-121 @1d42a6728bf). Сторона А — «запись без референта»: имя в
      forbiddenObjectTypes, которого модель не объявляет, — находка. S1 (corelib) вносит service,
      notification_feed и notification_namespace в набор раньше, чем S2 (kaname) — в модель.
      Если kacho поднимет пин corelib отдельно от пина kaname, гейт покраснеет по стороне А.
      В S3 или DoD п.11 стоит прямо сказать: пины corelib и kaname поднимаются одним изменением
      kacho.
  - id: N6-2
    kind: FORMAT
    text: >-
      В F22 строка «And средство: …» стоит до When, то есть относится к Given. Её стоит
      оформить продолжением Given (или отдельной строкой «Средство»), чтобы «And» не читалось
      как утверждение Then.

