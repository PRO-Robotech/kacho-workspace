blocking:
  - id: B2-1
    kind: CONSTRUCTIBILITY
    summary: >-
      «SAN сверяется целиком (ns/<ns>/sa/<sa>)» (Р10, Р22 п.2) не называет, с ЧЕМ сверяется
      сегмент ns — поэтому различающий факт NTF1-J03 (тот же sa, другое пространство имён) не
      имеет производителя для Subscribe и ResolveSend.
    evidence: >-
      Действующий перевод, который Р10/Р22 переносят в corelib, — kaname
      internal/authzguard/fgaproxy.go @734f69fb4, SANToServiceDomain (:160-181) принимает ЛЮБОЙ
      непустой ns и выводит учётку только из имени sa (ServiceAccountIDForService:
      'sva'||md5('kacho-<svc>'), :185-202). Приставку kacho- Р10 условием снимает, а источника
      пары (ns, sa) → учётка не заводит ни Р10, ни Р22, ни §6 «Средства построения условий».
      Для Claim ns отсекается точным перечнем SAN читателей (C06) — там сверка есть; для
      Subscribe и ResolveSend (перевод Р22) — нет. Тестовый УЦ J03 политику выпуска S4 не несёт,
      так что второго рубежа в пробе нет: J03 «Р22 не переводит его SAN» не из чего произвести.
    fix: >-
      В Р22 п.2 назвать источник привязки (например: закрытый перечень точных SAN → учётка,
      передаваемый композиционным корнем; пустой — отказ старта; входит в самоотчёт п.7), и
      как на него ложатся модульные учётки, выводимые сегодня из имени. Добавить в J03 (или
      отдельным сценарием) Given, строящий этот перечень, и близнеца «тот же SAN внесён в
      перечень → субъект есть».
  - id: B2-2
    kind: COVERAGE
    summary: >-
      Объявленный вариант Restore(feed, template) не имеет ни одного сценария, а его отсечка
      не определена: запись выдачи несёт одну отсечку на ленту.
    evidence: >-
      Р3 (стр. 246-249, 271-276): запись выдачи {лента, учётка, выдано, отозвано, отсечка};
      Restore(feed[, template]) «ставит отсечку = момент своей транзакции». Таблица исходов
      ResolveSend судит «отсечка есть и enqueued_at < отсечка» без различения ленты и шаблона.
      Если Restore шаблона ставит отсечку ленты — он терминально отсекает строки СОСЕДНИХ
      шаблонов (нарушение, которое F06 для Revoke как раз запрещает); если не ставит — строки,
      накопленные под надгробием шаблона, уходят после восстановления (нарушение F05).
      `grep -n Restore <док>` — вариант с шаблоном встречается только в Р3 и строке таблицы
      отказов F17, сценариев с Restore(feed, template) 0.
    fix: >-
      Назвать, где живёт отсечка шаблона (своя запись/колонка) и правило REVOKED для строки
      шаблона; добавить сценарий «Revoke(feed, recovery); поставлены recovery и invite;
      Restore(feed, recovery); поставлен recovery» → накопленный recovery — DENIED(revoked),
      invite (поставленный до Restore) — отправлен, новый recovery — отправлен; близнец — F05.
      Добавить Restore(feed, template) в F17/F18.

non_blocking:
  - >-
    Р22 п.3 называет единственным читателем носителя listnarrow.SubjectFromContext. Общее звено
    прав corelib authz.Interceptor (шаг 3, defaultSubjectExtractor → operations.PrincipalFromContextOK,
    authz/interceptor.go:331 @34bc810) отказывает ДО ветки ScopeFiltered, если принципала нет. На
    внутреннем слушателе kaname это звено не стоит (serve.go:1097-1116 @734f69fb4), поэтому NTF-1
    не ломается; но механизм заводится в corelib для всех, и у источников kacho (NTF-3,
    pkg/servicehost) подписка notify будет отвергнута звеном. Назвать в Р22 отношение к
    SubjectExtractor сейчас, а не в NTF-3.
  - >-
    NTF1-E03: «внутренний mTLS-слушатель» + «пир не предъявил проверенного сертификата» на
    слушателе corelib grpcsrv (ClientAuth = RequireAndVerifyClientCert, grpcsrv/tls.go:114)
    рукопожатием не пройдёт, а на небезопасном слушателе principalIsTrusted = true и пересланное
    принимается (cert_identity.go:381-384). Производитель — модульная проба corelib с
    синтезированным контекстом; так и написать в Given.
  - >-
    NTF1-E08: «тот же вызов без сертификата notify» на внутреннем слушателе kaname невыполним
    (пол CallerPolicy); назвать сравнение «с сертификатом другой модульной учётки» либо
    модульный уровень.
  - >-
    §1.1: команда `git grep -c smtp` даёт 12, а не 24; 24 — с `-i` (перемерено @1d42a6728bf).
    Исправить команду.
  - >-
    Отказы PERMISSION_DENIED на Claim/ResolveSend/Subscribe (C04, C05, F09) на слушателях kaname
    получают ErrorInfo{reason: AUTHZ_DENIED} от DenyDetailUnary (internal/authzguard/deny_details.go),
    если у метода есть строка каталога. Назвать это в Then, чтобы проба не утверждала «голый» отказ.
  - B09 «сторож «лимит исчерпан»» — назвать имя сентинела feed; B14 — текст отказа поля outcome.

