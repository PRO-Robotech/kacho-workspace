blocking:
  - id: B7-1
    kind: PRODUCER
    scenarios: [NTF1-G19]
    summary: >-
      Новая последняя строка G19 утверждает: «в пакетах, достижимых импортом из
      services/notify/cmd/notify (без cmd/notify-probe), вызовов grpc.NewServer и
      Register…Server сгенерированных стабов — 0». Держатель — `services/notify/servesurface_test.go`
      (§6.1). У исправного продукта это число не ноль. notify обязан собирать самоотчёт через
      corelib `servicecontract` (G15, E04, строка §6.1 «элемент NoServedServices»; правило
      sec-posture-judged-by-common-descriptor). `servicecontract` импортирует `grpcsrv`, а в
      `grpcsrv/server.go` стоят `grpc.NewServer(` (:55) и `healthpb.RegisterHealthServer(s, h)`
      (:58), то есть вызов Register…Server сгенерированного стаба. Импортное замыкание
      `cmd/notify` поэтому содержит минимум два вызова, хотя сервер notify не поднимает.
      Держатель, построенный по этой строке, покраснеет на верной реализации. Если же ради
      зелёного его сузить молча, он перестанет видеть вызов регистрации, спрятанный в чужом
      пакете. Это тот же род, что B6-1: держателю приписан исход, которого на исправном
      продукте он дать не может. Разница в том, что держатель здесь новый: перепись класса в
      §9 проверила только существующих держателей, а новый, заведённый той же редакцией, с
      деревом не сверялся.
    evidence:
      - "corelib 34bc810 grpcsrv/server.go:55 — `s := grpc.NewServer(append(base, opts...)...)`; :58 — `healthpb.RegisterHealthServer(s, h)`"
      - "corelib 34bc810 servicecontract/admission.go:18, servicecontract/contract.go:59 — импорт `github.com/PRO-Robotech/corelib/grpcsrv` в не-тестовых файлах"
      - "документ: G19 стр. 1485 (последняя And); §6.1 строка G19 стр. 1822; строка E04/G01/G06/G15 стр. 1802 — corelib `servicecontract`, элемент `NoServedServices`"
    required_change: >-
      Переформулировать последнюю строку G19 так, чтобы на исправном продукте она давала
      названное число. Годится любой из вариантов.
      (а) Достижимость по графу вызовов из `main` пакета `cmd/notify`, а не по графу импортов:
      сколько вызовов `grpc.NewServer`, `grpcsrv.New…` и `Register…Server` достижимо — 0.
      Печатать число осмотренных функций; пустой граф — красный; инъекция вызова в корень —
      находка.
      (б) Сузить предмет до пакетов модуля kacho под `services/notify/` без `cmd/notify-probe`,
      прямо назвать, что пакеты фундамента (`grpcsrv` через `servicecontract`) в предмет не
      входят и почему. Отдельно утверждать, что корень `cmd/notify` не зовёт конструктор
      сервера фундамента.
      (в) Снять строку и опереться на уже названную в G19 перепись портов пода (слушатель
      один, порт gRPC не объявлен и не открыт) плюс `NoServedServices` в самоотчёте (G15).
      Любой вариант сверить с деревом (corelib 34bc810, kacho 1d42a6728bf) и записать
      команду сверки в §9.

non_blocking:
  - id: N7-1
    kind: PRODUCER
    text: >-
      B20 называет новый вход гейта `outboxobservedgate` «третьим». У гейта на kacho 1d42a6728bf
      уже есть три входа: проводка `drainer.Config`, `CollectorConfig` и перепись колонок
      доставки `sent_at`/`next_attempt_at` по миграциям вместе с оператором-продвигателем
      (outboxobservedgate_test.go:28-31, 776-871, 919). Новый вход будет четвёртым. Кроме того,
      утверждение «без этого входа гейт её не видит» верно только при условии, что в схеме ленты
      нет колонок `sent_at` и `next_attempt_at`. Схема по документу их не называет: B-сценарии
      используют `state`, `outcome_at`, `expires_at`. Это стоит сказать в B20 прямо. Если
      колонка доставки появится, колоночный вход объявит ленту находкой, потому что её
      продвигает `Ack` из corelib, а не прод-код kacho.
  - id: N7-2
    kind: TWIN
    text: >-
      В D04 появилось отрицание «правка применённого файла — красный `notifygen -check`».
      Положительный близнец (без правки `-check` зелёный) следует из основного Then D04 лишь
      косвенно. Лучше назвать его одной строкой, как в D02.

