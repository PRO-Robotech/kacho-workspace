previous_return_checked:
  B2-1: >-
    Закрыто. База стала ревизией git хранилища. Правило названо для каждого случая: тот же набор,
    иной набор, шаблона в базе нет (только ревизия 1), шаблон снят. Неразрешённая база в четырёх
    видах (пустое значение, несуществующий каталог, пустой каталог, `HEAD^1` в клоне глубины 1) даёт
    красный «база не найдена». Её близнец — полная история. База без шаблонов при ревизии 2 даёт
    красный, близнец — ревизия 1. Знаменатель печатается на каждом прогоне. База для каждого события
    CI названа: `HEAD^1`. Вызов держит новый NTF1-D08 — гейт разобранного YAML в kacho и kaname с
    девятью инъекциями, среди них «задания нет», условие на шаге, глубина клона и снятая цель make.
    D08 стоит в §6.1, в §6.2 и в DoD S2 п.10 (kaname) и S3 п.12 (kacho). Вызов `-check` из D02
    закрыт тем же держателем: `-check -base` исполняет всё, что судит `-check`, и об этом есть
    отдельный And D07.
  B2-2: >-
    Закрыто. Команда исправления теперь `make notifications BASE=<ревизия>`, для генератора —
    `go tool notifygen -base`. Исход назван для (а), (б), (в), (г), (е) и для A→B→A. При
    неразрешённой базе генерация не пишет ни одного файла. Для A→B→A добавлены And и близнец.
    Прежняя форма в тексте снята.
  N2-1: "Закрыто: в цене Р7 появился пункт (4) — откат сборки notify; путь «снятие и повторное заведение» назван, держателя у него нет, исход назван."
  N2-2: "Закрыто: строка круга 15 в шапке называет оба имени."
  class_closure: >-
    Автор объявил класс «утверждение о вызове в CI без держателя» закрытым по всему документу.
    Перепись `grep -n '\bCI\b'` повторена, найдено 14 строк. Утверждений, которые держат инвариант и
    не имеют держателя, нет. Остаток — N3-1 ниже: перепись автора его не назвала, но держатель у него
    уже есть.

