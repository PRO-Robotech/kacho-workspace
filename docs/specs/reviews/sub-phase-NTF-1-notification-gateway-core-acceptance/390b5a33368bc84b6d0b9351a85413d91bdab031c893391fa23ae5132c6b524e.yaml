non_blocking:
  - id: N3-1
    kind: PRODUCER
    text: >-
      Строка 1541 (B28, «обход — … corelib и kacho — из CI corelib и kacho») и строка 2411 (§6.1,
      «гейты дерева, вызываемые из CI corelib и kacho») утверждают вызов в CI corelib. Строка §9
      круга 15 говорит «иных утверждений о вызове в CI не найдено», а это место не называет. Держатель
      у вызова есть и сейчас: гейты — это `_test.go` в дереве corelib, а единый рабочий процесс corelib
      исполняет `go test ./... -race -short` (corelib `.github/workflows/ci.yml:170`, триггеры `push`
      и `pull_request`). Поэтому инвариант не повисает. Предлагается в §6.1 назвать этот шаг
      держателем и сказать, что гейты дерева не отключаются при `-short`.
  - id: N3-2
    kind: COVERAGE
    text: >-
      Р7 утверждает: «у `push` в ствол `HEAD^1` — предыдущая голова ветки». Сейчас это верно:
      в kacho и kaname разрешено только слияние коммитом слияния (`allow_rebase_merge=false`,
      `allow_squash_merge=false`), запрос обязателен, в том числе для администраторов. Посев
      подтвердил, что у коммита слияния `HEAD^1` — прежняя голова. Но на настройку хранилища D08 не
      опирается. Если разрешить слияние с перебазированием, `HEAD^1` станет промежуточным коммитом
      запроса, и прогон `push`, который по Р7 судит параллельные правки, может оказаться вакуумным.
      Для `workflow_dispatch` на ветке, которая не ствол, `HEAD^1` — родитель на той же ветке, а не
      ствол. Достаточно одной фразы: либо база для `push` — `github.event.before`, либо «способ
      слияния — только коммит слияния» становится допущением с названной проверкой. Ручной запуск
      вердиктом для ствола не считается.
  - id: N3-3
    kind: COVERAGE
    text: >-
      В обоих рабочих процессах у триггера `pull_request` стоит фильтр `branches: [main]`
      (kacho `ci.yaml`, kaname `ci.yml`). Поэтому запрос волны в ветку эпика `-check -base` не
      проходит, проверка случится только на запросе эпика в main. Если в эпике набор одного шаблона
      менялся двумя волнами, запрос эпика получит красный «ревизия выше стволовой + 1» (D07 (г)) и
      исправляется генерацией против базы. Исход верный, но в Р7 не назван. Одна фраза сняла бы
      ожидание, что волна увидит его раньше.

