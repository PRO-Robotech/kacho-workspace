non_blocking:
  - id: N8-1
    kind: PRODUCER
    text: >-
      G19 судит вызов по типу цели. Косвенный вызов — через значение-функцию или интерфейс,
      полученный из фундамента, — статическим разбором по идентичности не виден. Сегодня у
      фундамента таких путей к `grpcsrv.NewServer` нет: замыкание вызывающих состоит из прямых
      вызовов. Стоит, чтобы проба печатала число вызовов через значение-функцию в пакетах
      notify, — тогда появление такого пути будет заметно. На вердикт не влияет: перепись
      портов пода в той же G19 (gRPC-порт не объявлен и не открыт) держит исход и на этом
      пути.

