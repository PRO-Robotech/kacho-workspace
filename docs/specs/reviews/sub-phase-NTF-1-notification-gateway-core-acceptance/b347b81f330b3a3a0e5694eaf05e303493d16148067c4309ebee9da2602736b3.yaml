previous_items_closed:
  B7-1: >-
    Закрыт. G19 больше не судит импортное замыкание `cmd/notify`. Предмет теперь — вызовы из
    не-тестовых файлов пакетов kacho под `services/notify/` (без `cmd/notify-probe` и пакетов
    только его корня) в `grpc.NewServer`, в точки входа фундамента и в `Register…Server`
    сгенерированных стабов; цель вызова определяется по типам. Перечень точек входа не
    написан по памяти: проба выводит его из пина corelib как замыкание вызывающих
    `grpc.NewServer`. На corelib 34bc810 перечень перемерен и совпал с названным:
    `grpcsrv.NewServer` (server.go:51/55) ← `serverPair` (servicehost/serve.go:171, вызов :205)
    ← `servicehost.Serve` (serve.go:66, вызов :89); других не-тестовых вызывающих
    `grpcsrv.NewServer` нет, `servicehost.ServeSurface` (surface.go:78) в замыкание не входит,
    `authz/interceptor.go:110` — комментарий. Импорт `servicecontract` → `grpcsrv` на исправном
    notify переписью не судится, поэтому держатель зелёный на исправном продукте. Красный —
    пустой обход, пустой перечень и инъекция `grpcsrv.NewServer` в `cmd/notify`; близнец —
    дерево без инъекции.
  N7-1: >-
    Закрыт. B20 называет новый вход четвёртым и перечисляет три существующих входа:
    `drainer.Config`, `CollectorConfig` и перепись колонок доставки. Оба неверных исхода без
    нового входа сказаны. Перемерено на kacho 1d42a6728bf: `deliveryColumnMarks` =
    `sent_at`, `next_attempt_at` (outboxobservedgate_test.go:871); перепись читает
    `CREATE TABLE` миграций службы с учётом снятия колонок и таблиц (:945-1005); продвигатель
    ищется регуляркой `UPDATE … SET … (sent_at|status) =` в прод-коде kacho (:919). Лента
    схемой со `state` колонок доставки не объявляет, а `Claim`/`Ack` живут в corelib —
    утверждение B20 верно для обоих вариантов схемы.
  N7-2: закрыт — D04 называет положительного близнеца отрицания отдельной строкой.
  class_census_new_holders: >-
    Перепись новых держателей, чей предикат читает существующее дерево (§9, круг 7),
    перемерена на тех же ревизиях. A09: не-тестовый импорт `text/template`/`html/template` в
    corelib 34bc810 — один файл, `quota/refusal.go`, и узел теперь определён по файлу формата
    шаблона, а не по вызову шаблонизатора. `notification.yaml` в `*.go` — 0 во всех трёх
    деревьях. B19: `notification_outbox` — 0 во всех трёх. D05: импортёров `corelib/notify/spec`
    — 0 во всех трёх. M10: писателей кортежей `service:` в не-тестовом kaname 734f69fb4 — 0.

