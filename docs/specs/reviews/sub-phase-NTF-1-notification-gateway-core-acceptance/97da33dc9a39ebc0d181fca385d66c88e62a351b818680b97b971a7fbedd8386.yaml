    ключа; `optional`, записанный нулём, даёт `INVALID(attrs_invalid)`. Обязательность входит в
    набор ревизии. Близнец A11 — образец «текст без приглашающего». Перечень «шаблон × атрибут ×
    откуда значение» Д21 относит к замыслу NTF-2, от NTF-1 он не требуется.
  Д22: "Соблюдено: судится только дельта; условия к коду в приёмку не возвращаются."
