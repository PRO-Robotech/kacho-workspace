blocking_findings:
  - id: B17-1
    kind: SCOPE
    anchors: [Р8, "NTF1-B27 (гейт, приёмник `address.Domain`)", §6.2, §4]
    what: >-
      Новый узел гейта B27 объявляет находкой любую ссылку на `address.NormalizeDomain` или тип
      `address.Domain` вне пакета `notify/address`, и допустимых мест у него нет. Инъекция (2) прямо
      называет находкой «вызов `address.NormalizeDomain` в `services/notify/…`». Но одобренная
      приёмка NTF-4 (отпечаток 53f865d8…, коммит b1e19abd9, строки 240–243, 290 и 807) предписывает
      именно этот код: сравнения доменов в notify (Р10 NTF-4 — `From`, возврат, `d=`, выравнивание,
      `rua`, `Final-Recipient`) идут через `address.NormalizeDomain`. NTF-4 там же утверждает, что
      «гейт единственности NTF-1 от кода NTF-4 не краснеет». После посадки NTF-4 гейт NTF-1 станет
      красным на правильном коде. Р8 держит «перечень приёмников закрыт и пуст», хотя приёмка знает
      следующую под-фазу, которая этот перечень наполняет. Кроме того, узел смешивает производителя
      и приёмника: вызов `NormalizeDomain` строит `Domain` из строки, а не принимает нулевое
      значение, так что по Д19 он приёмником не является.
    predicate: >-
      git show b1e19abd9:docs/specs/sub-phase-NTF-4-delivery-feedback-reputation-acceptance.md | grep -n NormalizeDomain
      → 5 вхождений, в том числе 807 «домен — результат `address.NormalizeDomain` NTF-1»; запись
      docs/specs/reviews/sub-phase-NTF-4-delivery-feedback-reputation-acceptance/53f865d8….yaml — verdict: APPROVED
    fix: >-
      Автору нужно выбрать одно, в пределах Д19. (а) Узел судит только приёмников — параметр, поле
      или получателя типа `address.Domain` вне пакета, — а вызов `NormalizeDomain` как производителя
      допускает. Места сравнения доменов NTF-4 тогда названы, и их отказ на нуле держит `Value()` →
      `address.ErrUnset`. (б) Узел остаётся как есть, но места NTF-4 внесены допуском со сценарием
      отказа на нуле. Нужна строка в §4: предмет правки NTF-4 или NTF-1, и в каком порядке. Если
      выбор выходит за Д19, это need_decision диспетчеру, молча выбирать нельзя.
  - id: B17-2
    kind: FORMAT
    anchors: ["NTF1-B31 (а)–(в)", "§6.2 B31"]
    what: >-
      В B31 счётчики «Тогда» не выводятся из Given. Given задаёт «счётчик окна адресата = 3», а
      постановка строки идёт в When (а)–(в). `Put` вклад прибавляет: в B30 (а) Given «0», Then «1».
      Значит, после постановки счётчик 4. Тогда `unclaimed` с возвратом даёт 3, `no_ack` без
      возврата даёт 4. Документ ждёт 2 и 3. Проба, написанная по тексту, на правильном коде
      покраснеет. В B15, B16 и B25 такого нет: строка там уже стоит в Given.
    predicate: "awk '/NTF1-B31 —/,/### C\\./' <приёмка>; сравнить с NTF1-B30 (а) «счётчики окна 0» → «счётчик окна 1»"
    fix: >-
      Годится любой из двух вариантов. Given — «счётчик окна = 2 до постановки», тогда Then
      (а) и (в) = 2, (б) = 3. Или строка ставится в Given так же, как в B15 («счётчик окна = 3
      вместе с этой строкой»).

non_blocking:
  - id: N17-1
    what: >-
      G26 (д, потолок) говорит «те же строка и сборка», но строка (д) уже закрыта
      `EXPIRED(template_skew)`. Строка, которую выдал `Claim`, по Р11 истекла бы с причиной
      `template_skew`, а не `unclaimed`. Нужно указать, что строка новая и `Claim` её ни разу не
      выдавал.
  - id: N17-2
    what: >-
      В перечне Р9 «выключен» нет пункта «уборщик работает». Это сказано только в Р8, а B31 (в)
      опирается на Р9. Нужна одна ссылка из Р9 на Р8.
  - id: N17-3
    what: >-
      G27 (г) `{class=security, reason=recipient_net}` недостижим как путь продукта: по Р11 сетка
      `security` даёт `DROPPED`, а не `DEFER`. Как проба правила по классу он законен, близнец (д)
      отличается одним фактом. Эту недостижимость стоит назвать, чтобы (г) не читался как путь
      продукта.
  - id: N17-4
    what: "В §6.2 строка A10 (к) стоит перед A11 и перед A10 (а)–(и). Порядок строк косметический."

