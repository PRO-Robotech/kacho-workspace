previous_return_checked:
  RA-12: >-
    Закрыто вариантом (а) разбора. Класс вошёл в набор ревизии (Р7). Источник класса для сетки,
    `class_not_allowed` и рендера — сборка notify. Колонка `class` служит только отбору
    `Claim(classes)`. Если при равных ревизиях колонка расходится со сборкой, строка получает
    `INVALID(class_mismatch)`. В D07 добавлены шаги (6) «класс» и (7) «обязательность», оба
    поднимают ревизию, и близнец (8) «limits и текст» — ревизия прежняя. Арифметика 1,1,2,3,4,5,6,6
    сверена. G26 (г) и (д) получили близнецов, в H07 названа цена расхождения `limits`. Попутные
    заказы тоже выполнены. D08 перемерена на пине kaname `734f69fb4`, путь исключения переведён на
    реестр гейта (CX1-43), N3-1 и N3-3 закрыты.
  class_no_terminal_outcome: >-
    Закрыто по существу. Единое правило Р11 «конечный исход»: предел
    `expires_at + LeaseTTL + SweepInterval`, константы `feed` названы, `ttl` ≤ 720h, добавлены
    причины `unclaimed` и `no_ack`, уборщик работает при любом флаге, есть тревога `feed_expired`
    с доводом исключения. Сценарии: B31, G27, H05, H06 (добавлен исход) и G26 (д, потолок). Дефект
    арифметики B31 вынесен в блокирующее B17-2.

