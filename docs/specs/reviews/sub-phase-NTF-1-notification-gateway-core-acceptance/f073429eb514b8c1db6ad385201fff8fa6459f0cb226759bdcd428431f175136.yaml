blocking:
  - id: B1-1
    kind: CONSTRUCTIBILITY
    summary: >-
      Р3 противоречит NTF1-F03: строка, поставленная ДО первой выдачи, по таблице Р3 получает
      REVOKED, а F03 «And» требует её отправки после выдачи.
    evidence: >-
      Р3, таблица исходов: REVOKED = «надгробие … ЛИБО enqueued_at < выдано текущей выдачи»;
      ALLOW требует enqueued_at ≥ выдано. F03: строка поставлена при отсутствии выдачи, затем
      «после появления строки манифеста и посева строка отправлена». Её enqueued_at < выдано ⇒
      по Р3 REVOKED, терминально. Тот же класс в F07: близнец «без Revoke перезапуск даёт ALLOW»
      не фиксирует enqueued_at строки, поэтому не отличает «посев идемпотентен» от «посев при
      каждом старте сдвигает выдано и терминально убивает все письма, поставленные до
      перезапуска».
    fix: >-
      Разделить «выдано впервые» и «восстановлено после надгробия» (правило enqueued_at-отсечки
      действует только от Restore); добавить в F07 близнец со строкой, поставленной ДО
      перезапуска, → ALLOW; назвать идемпотентность посева требованием к записи выдачи.
  - id: B1-2
    kind: CONSTRUCTIBILITY
    summary: >-
      Субъекта service_account, выведенного из проверенного сертификата, в дереве нет —
      Given E01, E02, C03, J03 и Р2 опираются на несуществующий механизм, а документ подаёт его
      как существующий (§1.3, Р2 со ссылкой на sec-forwarded-trust-aware-extract).
    evidence: >-
      corelib grpcsrv/cert_identity.go:331-374 @34bc810 — withTrustedPrincipal берёт принципала
      ТОЛЬКО из пересланных метаданных; комментарий: «deliberately NOT seeded … trust is a
      property of the FORWARDER». При непустом круге пересылающих (principalIsTrusted, :378-397)
      пересылка от notify не доверена ⇒ принципала нет ⇒ listnarrow.SubjectFromContext
      (listnarrow/subject.go) ⇒ PERMISSION_DENIED «subscription requires an authenticated
      caller» (subscription/server.go шаг 1). Утверждение §1.3 про освобождение от acr тоже
      неточно: в kaname пол acr действует только на наборе gateway-fronted
      (internal/authzguard/acr_floor.go:66-80 @734f69fb4), а освобождение ключуется пересланным
      типом принципала.
    fix: >-
      Завести решение (S1, corelib grpcsrv): где и для каких слушателей/методов проверенный
      сертификат становится субъектом service_account, как это соотносится с пересланным
      принципалом и с предикатом владения операций; добавить сценарии: пересылка личности от
      не-пересылающего по-прежнему отбрасывается; субъект из сертификата не становится
      владельцем операций чужих вызовов; прочие внутренние вызовы модулей не меняют исхода.
      Исправить формулировки §1.3.
  - id: B1-3
    kind: NEGATIVE
    summary: >-
      У новых RPC ResolveSend / Revoke / Restore / Claim нет отрицательных сценариев на вход и
      на конкуренцию.
    evidence: >-
      §6 группы C и F: нет INVALID_ARGUMENT на негодный id ленты (с именем поля); нет NOT_FOUND
      на неизвестную ленту для Revoke/Restore и названного исхода ResolveSend на неизвестную
      ленту/шаблон; нет Restore без надгробия и повторного Revoke; нет гонки Revoke∥Restore на
      записи выдачи (инвариант CAS, data-integrity); нет Claim с max вне границ (0, сверх
      предела).
    fix: Добавить сценарии с кодом, reason и близнецом по каждому пункту.
  - id: B1-4
    kind: FORMAT
    summary: >-
      «Тогда» без gRPC-кода: NTF1-H06 («отказ формы, объявленной MAIL-25») и NTF1-F08 («отказ с
      именем типа»).
    evidence: >-
      ID-MAIL-1 MAIL-25 (sub-phase-ID-MAIL-1-mail-delivery-acceptance.md:1939-1947) кода не
      называет и требует неотличимости отказа, что расходится с «с именем исчерпанной оси» в H06.
    fix: Назвать код, reason/details; для H06 решить, какой отказ и почему он не оракул.
  - id: B1-5
    kind: TWIN
    summary: >-
      L03/L04 сравниваются с L02 из другого стенда (newman на зонтике против integration с
      управляемыми часами) — «побайтово равен L02» не исполним; E02 проходит вакуумно, если
      поток второй службы не открыт.
    fix: >-
      Близнец L03/L04 — положительный контроль в том же integration-стенде (notify поднят);
      E02 утверждает, что поток открыт (положительное событие в том же потоке либо явный
      признак открытия), иначе «событий нет» неотличимо от «потока нет».

