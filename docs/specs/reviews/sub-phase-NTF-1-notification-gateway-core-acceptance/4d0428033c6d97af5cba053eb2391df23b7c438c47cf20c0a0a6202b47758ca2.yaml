class_exposure_return_checked:
  RA-10: >-
    Вариант (а) разбора выбран, и в основном выполнен верно. Пять типов значений сделаны
    структурами с неэкспортируемым полем, так что пути преобразования, константы, сложения, среза
    и составного литерала держит компилятор. Это проверяют пробы B27 (форма типа) и B28 (форма
    типа) на go/types с инъекцией строкового типа. Нулевое значение отвергают названные приёмники
    (B27 (нуль), B28 (нуль)). Но редакция добавила новое утверждение: у записи через `unsafe` есть
    держатель, гейт B27/B28 с узлом «выражение этих типов в пакете, импортирующем unsafe». Этот
    держатель закрывает не все пути записи через `unsafe` — замер ниже, блокирующее B11-1. Там же
    назван второй экземпляр класса, который редакция объявила закрытым по всему документу:
    держатель B28 (`Put`) судит набор значений по описанию, которое прислал сам вызывающий.

blocking_count: 1
blocking_kinds_distinct: [PRODUCER]
