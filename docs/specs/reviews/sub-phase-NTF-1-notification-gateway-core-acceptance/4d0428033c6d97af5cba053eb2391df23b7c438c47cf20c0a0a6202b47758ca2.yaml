blocking_findings:
  - id: B11-1
    kind: PRODUCER
    anchors: [Р7, Р8, Р11 строка «прочие атрибуты не по схеме", "NTF1-B27 (гейт)", "NTF1-B28 (гейт)", "NTF1-B28 (`Put`)", "§1.8", "§9 строка 10 «класс … закрыт по всему документу»"]
    text: >-
      Возвращённый класс — «свойство приписано держателю, который закрывает часть путей» — снова
      есть в тексте, который его закрывает. Экземпляров два.
      (1) Р7 и Р8 говорят: «мимо функций пакета остаются два пути, и у каждого свой держатель…
      запись через unsafe — находка гейта». Узел гейта — «в не-тестовом пакете, импортирующем
      unsafe, выражение типа form.Path/… или указателя на них». Путь мимо узла, измерено:
      вспомогательный пакет импортирует `reflect` и `unsafe` и объявляет
      `SetFirstString(dst any, s string)`, внутри —
      `reflect.NewAt(f.Type(), unsafe.Pointer(f.UnsafeAddr())).Elem().SetString(s)`. Выражения типа
      Path в нём нет. Пакет-потребитель не импортирует unsafe и вызывает
      `helper.SetFirstString(&p, "//evil.example")` над `var p form.Path`. Значение вне формы
      получено, и ни одно место гейт не видит: в пакете с unsafe нет выражения типа, а в пакете с
      выражением типа нет unsafe. Второй пробел — объём обхода. В kacho обходится только
      `services/notify/...`. Не-тестовый пакет kacho вне этого каталога, импортируемый notify, с
      прямой записью через unsafe в выражение `form.Path` в обход не входит вовсе.
      (2) Строка Р11 «прочие атрибуты не по схеме» говорит, что вызов `feed.Put` мимо `SendX`
      «держит сам Put». Но Р7 (:594–595) называет описание атрибутов тем, «которое генератор
      вписывает в SendX», то есть его передаёт вызывающий. B28 (`Put`) (б) это подтверждает:
      прямой вызов «с пустым описанием атрибутов». Значит, прямой вызывающий передаёт описание,
      которое расходится с шаблоном: с атрибутом `extra` или с `target` видом `text` вместо
      `path`. Put такую строку примет, и в notify она станет `INVALID(attrs_invalid)`. Получается
      класс RA-09 «проверка стоит только у потребителя» на пути, про который написано, что его
      держит источник. Замысел этого не решил: у разбора он заказан как CX1-35.
    required: >-
      По каждому экземпляру — одно из двух, и выбор записать в Р7/Р8/Р11.
      (1) Узел гейта охватывает все пути записи через unsafe. Пример: не-тестовый файл, который
      импортирует `unsafe` (или вызывает `reflect.NewAt`, `reflect.Value.UnsafeAddr` либо
      `UnsafePointer`), в собственных модулях corelib/kacho/kaname, входящих в импортное
      замыкание пакетов с этими типами. Сгенерированные стабы узнаются по заголовку
      `Code generated … DO NOT EDIT.`. Обход kacho — импортное замыкание `services/notify`, а не
      только его каталог. Прецедент узла «импорт unsafe в файле» уже есть в kaname:
      `internal/check/envelope_composition_root.go`, `envRootUnsafeImports`. Нужна инъекция
      вспомогательного пакета, не знающего типа, и близнец — стабы `.pb.go`. Либо: утверждение
      сужено до пути, который гейт действительно видит, а оставшийся путь назван без держателя.
      (2) У `Put` одно происхождение описания, недоступное вызывающему. Например, `Put` берёт
      описание по (пространство, шаблон) из реестра, который заполняет сгенерированный код. Или
      гейт дерева требует, чтобы `feed.Put` вызывался только из файлов, сгенерированных
      notifygen, — по образцу B19, с инъекцией и близнецом. Либо: утверждение «держит сам Put»
      заменено честным «Put судит по переданному описанию; расхождение описания с шаблоном
      ловит только notify (`INVALID(attrs_invalid)`)» с ценой в таблице Р11.
      Строку §9 «класс закрыт по всему документу» после этого перемерить.
    evidence: >-
      Модуль в scratchpad (go 1.22+): пакет `form` с `type Path struct{ v string }`, `ParsePath` и
      `Value() (string, error)`; пакет `helper` (reflect+unsafe, без упоминания form); `consumer`
      без unsafe. `go run ./consumer` → `//evil.example <nil>`; `grep -l '"unsafe"' -r consumer` →
      пусто. Экземпляр (2) — чтение: строки документа 594–595, 840, 1270.

non_blocking:
  - id: N11-1
    kind: FORMAT
    anchors: ["§1.8", "NTF1-B27 (гейт)"]
    text: >-
      Замер импорта `unsafe` считал строковый литерал импортом. Предикат `git grep -l '"unsafe"'`
      находит в kaname `internal/check/envelope_composition_root.go` из-за выражения
      `p == "unsafe"` на строке 1209. В блоке import этого файла unsafe нет. Реальных импортов
      (спецификации импорта, в том числе `unsafe "unsafe"`) на kaname 734f69fb4 — 41, и все в
      `.pb.go`; на corelib 34bc810 — 8, тоже все в `.pb.go`. Это ban17-gates «поиск по образцу
      вместо разбора» в самом замере. Нужно исправить «42 … и envelope_composition_root.go» в §1.8
      и в B27 (гейт) той же правкой.
  - id: N11-2
    kind: PRODUCER
    anchors: [Р7 «нулевое значение — каждый приёмник трёх типов отвергает", Р8 то же для address]
    text: >-
      «Каждый приёмник» держат пробы перечисленных приёмников: сборщик ссылки, сборщик
      заголовков, ключ окна, ключ сетки. Будущий приёмник, который читает значение методом без
      ошибки, получит пустую строку, и никто этого не увидит. Держатель станет компиляторным, если
      единственный метод чтения поля у пяти типов возвращает `(string, error)` с `ErrUnset` на
      нуле. Эту форму стоит назвать в Р7/Р8 и пробе формы типа. Не блокирует: RA-10 (а) принимал
      перечень приёмников.
  - id: N11-3
    kind: FORMAT
    anchors: [Р8 «Приёмник address.Domain вне notify/address в объёме NTF-1 один — Normalize в самом пакете»]
    text: >-
      Фраза противоречит сама себе: приёмник «вне пакета» — это «Normalize в самом пакете». Смысл
      такой: вне пакета приёмников в NTF-1 нет, а единственный внутренний — Normalize.
  - id: N10-1-carry
    kind: SCOPE
    anchors: [Р1, NTF1-G19, "§4 строка NTF-4"]
    text: >-
      Переходит из круга 10 без изменений. По Д17 форма хоста «только внутренний слушатель»
      действует и для notify NTF-1. Р1 и допустимый набор G19 («gRPC-слушателя нет»,
      `Register…Server` — 0) — состояние на посадку NTF-1, и NTF-4 З9 его меняет. В §4, в строке
      NTF-4, это не сказано. Нужна ссылка: Р1 и G19 после Х5 правит NTF-4 (З9).

