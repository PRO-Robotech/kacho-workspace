blocking_findings:
  - id: B12-1
    kind: PRODUCER
    anchors: [Р7 «Два пути остаются **без держателя** и названы», Р7 «Допустимых мест нет», Р8 «теми же двумя путями без держателя», Р11 «ссылка через `go:linkname` требует `unsafe` — узел Р7», "NTF1-B28 (гейт)", "NTF1-B28 (гейт `Put`)", "§9, строка круга 11 «перемер … класс закрыт»"]
    text: >-
      Ассемблер пишет в непрозрачный тип и не задевает ни одного узла. Замер (go1.26.8, amd64):
      пакет `asm` объявляет в `.go` функцию без тела `func copy16(dst, src any)` и обёртку
      `Copy16`, тело лежит в рукописном `asm_amd64.s` и копирует 16 байт заголовка строки. Потребитель
      вызывает `asm.Copy16(&p, &s)` над `var p form.Path` и `s := "//evil.example"`. `go run`
      печатает `asm: "//evil.example" <nil>`. Ни в одном `.go` пакетов `asm` и потребителя нет ни
      `unsafe`, ни `NewAt`, ни `UnsafePointer`, ни `UnsafeAddr`, ни `linkname`. Гейт судит только
      `.go`-файлы, поэтому узел молчит. Ассемблер, кроме того, может обратиться к символу
      `feed.Put` мимо гейта ссылки на `feed.Put`. Значит, утверждение Р11 «ссылка в обход — только
      через `go:linkname`, а это узел Р7» тоже закрывает не все пути. Это тот же класс, что B11-1:
      перечень путей без держателя объявлен полным, а он неполон. Строка §9 «перепись … класс
      закрыт» снова не выдерживает. cgo (`import "C"`) тоже не назван ни узлом, ни путём без
      держателя. Посевом он не проверялся — отдан на решение автору.
    required: >-
      Выбрать одно. (а) Расширить узел «обход типобезопасности»: рукописный не-тестовый `.s`/`.S`
      файл, объявление функции без тела в `.go`, импорт `"C"`. На пинах corelib 34bc810,
      kaname 734f69fb4, kacho 1d42a6728bf этих узлов 0 (замер ниже), так что цена та же — «запрещено
      целиком». Добавить инъекцию «пакет с функцией без тела и `.s`, потребитель без `unsafe`» и
      близнец — те же деревья без неё. (б) Назвать ассемблер (и cgo) путями без держателя в Р7, Р8,
      Р11 с ценой. После любого варианта перемерить строку §9.
    evidence: >-
      Модуль в scratchpad: `form` (`type Path struct{ v string }`), `asm` (`asm.go` + `asm_amd64.s`),
      `c2/main.go`. `go run ./c2` → `asm: "//evil.example" <nil>`. `grep -rln
      'unsafe|NewAt|UnsafePointer|UnsafeAddr|linkname' asm c2 --include=*.go` → пусто. Счёт на
      пинах: `.s`/`.S` — 0/0/0, `import "C"` в не-тестовых `.go` — 0/0/0.
  - id: B12-2
    kind: PRODUCER
    anchors: ["NTF1-B28 (гейт `Put`) «множество берётся из вывода генератора по дереву»", "Р11 «множество — из вывода `notifygen -check`, а не из заголовка файла»", "NTF1-D01", "NTF1-D02", "§6.2 строка B28 (гейт `Put`)"]
    text: >-
      Гейт ссылки на `feed.Put` различает «файл генератора» и «рукописный файл» по множеству, которое
      печатает `notifygen -check`. Близнец инъекции (2) — файл с заголовком `notifygen`, которого нет
      в выводе генератора, — держится только на этом множестве. Но ни один сценарий не утверждает,
      что генератор выдаёт это множество. D01 говорит «порождены `SendInvite` и эталон». D02 говорит
      «красный с именем файла и расхождения» — это только на красном. Форма вывода на зелёном, его
      полнота и то, что миграции `init` входят или не входят в множество, не заданы. Вход гейта без
      производителя: реализатор придумает форму сам, и первый же расход гейта с генератором станет
      ложной находкой либо, хуже, ложной тишиной.
    required: >-
      Дать множеству производителя сценарием. Например, And в D01: «`notifygen -check -list` (или
      иная названная форма) печатает по одной строке путь каждого порождённого файла `SendX`;
      вывод совпадает с перечнем файлов, изменённых `make notifications` над пустым каталогом».
      Близнец — рукописный файл с заголовком `notifygen` в выводе отсутствует. В B28 (гейт `Put`)
      сослаться на этот сценарий как на производителя входа, в §6.1 назвать держателя.

