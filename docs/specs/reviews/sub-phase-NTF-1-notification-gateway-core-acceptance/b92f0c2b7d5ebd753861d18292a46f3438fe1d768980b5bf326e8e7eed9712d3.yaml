previous_return_checked:
  B11-1 (1): >-
    Закрыто в заявленном объёме. Узел гейта теперь «обход типобезопасности»: импорт `unsafe` или
    ссылка на `reflect.NewAt`, `UnsafePointer`, `UnsafeAddr`. Обход охватывает три дерева целиком,
    а заголовок генератора засчитывается только вместе с каталогом стабов. Замер редакции
    воспроизведён: вспомогательный пакет без импорта `unsafe` через
    `reflect.NewAt(f.Type(), f.Addr().UnsafePointer())` пишет `//evil.example` в `var p Path`, а
    `Field(0).String()` читает поле. Два reflect-пути мимо узла тоже проверены, оба закрыты самим
    `reflect`: `Convert` uintptr → unsafe.Pointer и `Convert` *Path → unsafe.Pointer паникуют. Но
    перечень «два пути остаются без держателя» неполон: третий путь — ассемблер. Это блокирующее
    B12-1.
  B11-1 (2): >-
    Направление принято. `Put` назван второй линией, держателем назначен гейт ссылки на
    `feed.Put`. Однако вход гейта — «множество файлов из вывода `notifygen -check`» — не имеет
    производителя. Это блокирующее B12-2.
  N11-1: "закрыто; числа 8 / 41 / 75 перемерены, и у всех 124 файлов стоит заголовок генератора до `package` в каталоге стабов"
