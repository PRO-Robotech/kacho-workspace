previous_return_checked:
  B1-1: >-
    Закрыто. Старшинство снято, правило одно: строка, чей `schema_rev` не равен ревизии сборки,
    получает `DEFER(template_skew)`, и её значения не судятся (Р7, Р11). Сочетание «иная ревизия и
    нуль» есть: G25 (ревизия, нуль). Близнец — та же строка при `schema_rev = 2` → `INVALID`, он
    отличается одним фактом. Р11 и таблица сторон §-INVALID приведены к тому же правилу.
  B1-2: >-
    Закрыто по сути. Цена названа честно, три вида потерь перечислены, порядок раскатки только
    сужает (3). Производитель — G25 (цена) с близнецом «сборка ревизии 1 → отправлено»; фикстура
    ревизий — в таблице средств построения условий. §7 В5 ссылается на Р7, G25 (цена) и D07.
  B1-3: >-
    Закрыто по форме и порядку. Ревизия — целое ≥ 1, сравнение целых, производитель — генератор
    (`revision.yaml`: номер и отпечаток набора). D07 держит рост ровно со сменой набора, есть
    близнец «правка вне набора». Кроме того, A10 (и), A09 (третий файл формата), B29 (ревизия: сторож
    `Put` и `CHECK`). Остаётся один дефект: утверждение о том, что CI зовёт `-check -base`, без
    держателя — B2-1 ниже.
  N1-1…N1-4: >-
    Закрыты. Р7 сужен до одной стороны, довод приведён. §6.2 A10 — «(а)–(и)». Отметка времени
    получила одно написание, есть G25 (г), (ж), (з). В §6.1 названа `form_test`.

