blocking_findings:
  - id: B2-1
    kind: PRODUCER
    anchors: ["Р7 «ревизия шаблона: производитель, форма, порядок» — «CI каждого дерева с каталогами `notifications` зовёт `-check -base` с деревом ствола; без дерева ствола прогон красный, а не пропущенный»", "NTF1-D07 близнец «шаблона в стволе нет, ревизия 1 — зелёный»", "§6.1 строка D01–D04, D06, D07", "§8 DoD пп. 7, 10, 12"]
    text: >-
      Правило «строка ревизии сборки судится описанием сборки, строка иной ревизии — `template_skew`»
      держится на инварианте «равная ревизия означает равный набор атрибутов». Иначе строка с тем же
      номером и другим набором получает терминальный `INVALID` вместо `template_skew`, и письмо
      теряется без тревоги `template_skew`. `-check` без `-base` этот инвариант не держит. Ему
      не видны ручная правка `revision.yaml` (D07 (а)), откат шаблона (б), рост ревизии без смены
      набора (в) и два параллельных изменения одного шаблона, каждое на «ствол + 1», сведённые правкой
      конфликта. Всё это ловит только `-check -base`. Именно его Р7 объявляет вызываемым в CI каждого
      дерева, но держателя у этого утверждения нет:
      (1) §6.1 для D07 называет только corelib `cmd/notifygen/*_test.go`, а они судят поведение
      генератора, когда его вызвали, а не то, что CI kacho и kaname его вызывает;
      (2) в DoD нет пункта «CI kacho / kaname / corelib зовёт `notifygen -check -base`» (S1 п.7, S2
      п.10, S3 п.12);
      (3) случая «без дерева ствола прогон красный» в D07 нет. Близнец «шаблона в стволе нет,
      ревизия 1 — зелёный» делает отсутствие шаблона в базе законным, поэтому база, указывающая на
      пустой, чужой или несуществующий каталог, читается как «все шаблоны новые». Для каждого шаблона
      ревизии 1 проверка тогда вакуумно зелёная. Исход для шаблона ревизии > 1, которого в базе нет,
      не назван вовсе;
      (4) не сказано, что такое «дерево ствола» для каждого события CI: у запроса на слияние — голова
      целевой ветки или merge-base; у прогона на самом стволе после вливания — родитель. База,
      равная самому проверяемому дереву, вакуумна.
    required: >-
      (а) В D07 добавить отрицания с близнецами: `-check -base` с несуществующим путём → красный
      «дерево ствола не найдено»; `-check -base` с деревом без единого каталога `notifications` при
      непустом проверяемом → красный «в дереве ствола шаблонов 0». Проверка печатает число шаблонов
      базы (знаменатель). Назвать исход для шаблона ревизии > 1, которого в базе нет.
      (б) Назвать базу для каждого события CI (запрос на слияние и прогон ствола).
      (в) Дать держателя вызова: строка §6.1 и пункты DoD — задания CI kacho и kaname (и corelib,
      если там есть фикстурные каталоги) зовут `notifygen -check -base <база>`. Держатель —
      гейт разобранного YAML конвейера либо иной названный, с инъекцией «задания нет → красный».
      Тот же класс касается D02 («в CI источника `notifygen -check`»): у вызова `-check` держателя в
      DoD тоже нет. Закрыть обоих одним держателем.
  - id: B2-2
    kind: FORMAT
    anchors: ["NTF1-D07 And «(б), исправление: `make notifications -base <дерево ствола>`»"]
    text: >-
      Команда исправления в сценарии не выполнится в той форме, в какой записана. Для make
      `-base` — пачка однобуквенных ключей: `make notifications -base /x` завершается кодом 2 с
      сообщением «неверный ключ — «a»» (замер ниже, GNU make). Поэтому у исхода «ревизия 3 с
      отпечатком прежнего набора» нет исполнимого When. Путь исправления не назван и для
      (а), (в) и для случая «набор A → B → A на одной ветке». В последнем `-check -base` красный
      «ревизия поднята без смены набора», а простой `make notifications` файл не меняет: набор равен
      записанному отпечатку.
    required: >-
      Записать исполнимую форму: переменная (`make notifications BASE=<дерево>`) либо вызов
      генератора (`go tool notifygen -base <дерево>`). Назвать исход той же команды для
      (а) и (в), то есть приведение ревизии к «ствол + 1 при изменённом наборе, стволовая — при
      прежнем». Добавить в D07 близнец на A → B → A.

non_blocking:
  - id: N2-1
    kind: COVERAGE
    text: >-
      Цена в Р7 перечисляет потери при раскатке. Потери при откате сборки notify к прежней версии
      (не шаблона) не названы: строки новой ревизии ждут `DEFER(template_skew)` до `expires_at`.
      Это тот же механизм, что (3), но оператор читает О7 как «откат безопасен». Достаточно одной
      фразы в Р7.
  - id: N2-2
    kind: FORMAT
    text: >-
      Шапка редакции 15 и §9 называют круг «14», а запись — «круг 1 прохода редакции 14». Так же было
      в круге 12 (N12-1). Строку этого круга в шапке стоит назвать обоими именами: «круг 15 (в записи
      — круг 2 прохода редакции 14/15)».

routing_note: >-
  PRODUCER блокирует снова. Предмет — новая ветвь «ревизия шаблона», которую ввели в редакции 14
  и доработали в редакции 15. Новый дефект сидит не в значении (оно теперь имеет производителя), а
  в утверждении о конвейере, на котором держится инвариант значения. Это продолжение класса, а не
  его повтор на старом предмете. Решение по §14а — за диспетчером. Предложение для формы задания
  автора: каждое утверждение «CI делает X» — это производитель, и у него должны быть строка §6.1,
  пункт DoD и инъекция «X не вызван → красный». Каждая проверка против базы печатает знаменатель
  базы и краснеет на пустой базе.

