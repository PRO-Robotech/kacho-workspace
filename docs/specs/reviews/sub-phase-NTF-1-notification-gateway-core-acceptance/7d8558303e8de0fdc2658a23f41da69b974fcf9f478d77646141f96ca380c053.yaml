previous_return_checked:
  RA-11: >-
    Закрыто по сути вариантом (а): каждый объявленный атрибут обязателен, признака необязательности
    в формате нет (A10 (а)). Нуль каждого из пяти типов назван и вне формы. `ParseHeaderText("")`
    отвергается (`form.ErrEmpty`), так что пустой темы нет ни на одной стороне. Неизвестный тип —
    `form.ErrUnknownType`, ветки «принять без проверки» нет, что закрывает CX1-38 (б). Сторона
    источника — B29 (шесть нулей через `SendX`, отсутствующий атрибут через `Put`), сторона notify —
    G25. Близнецы есть у каждого нового отрицания. Новая ветвь «ревизия шаблона» (Р7, Р11, G25)
    вносит три дефекта: B1-1…B1-3 ниже.

