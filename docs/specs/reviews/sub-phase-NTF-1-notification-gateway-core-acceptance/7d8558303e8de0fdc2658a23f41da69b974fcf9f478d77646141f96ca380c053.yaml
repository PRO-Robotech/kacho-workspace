blocking_findings:
  - id: B1-1
    kind: COVERAGE
    anchors: [Р7 «ревизия шаблона» — «нулевое значение атрибута в такой строке — по-прежнему INVALID(attrs_invalid)», Р11 клетка DEFER(template_skew), NTF1-G25 (ревизия), "§6.2 строки G25 (ревизия)"]
    text: >-
      Р7 объявляет старшинство исходов. Строка ревизии старше сборки с расходящимся набором
      («такая строка») и нулевым значением атрибута — это INVALID(attrs_invalid), а не
      DEFER(template_skew). Сценария на это нет. В G25 (ревизия) `r1` с `note = ""` несёт полный
      набор из шести атрибутов: набор совпадает со сборкой, и это «не такая строка». Она судится
      описанием сборки, как строка `r2`. Сочетания «набор расходится и значение нулевое» в
      документе нет, поэтому исход зависит от порядка проверок реализации. Если сначала
      проверяется набор, получится DEFER, затем EXPIRED(template_skew). Если сначала значения —
      INVALID. К тому же не сказано, по какому описанию судится нуль в строке, чей набор
      расходится. У атрибута, которого сборка не объявляет, типа нет, а нуль задан через тип.
    required: >-
      Выбрать одно. (а) В G25 (ревизия) добавить случай: строка `r1` без `note` и с
      `subject_name = ""` — INVALID(attrs_invalid). Близнец — та же строка с `subject_name = probe`
      — DEFER(template_skew). В Р7 сказать, что нуль судится по типам описания сборки для атрибутов,
      которые сборка объявляет. (б) Снять из Р7 фразу о нуле в «такой строке» и назвать
      единственный исход расхождения ревизий (DEFER(template_skew)), со сценарием на то же
      сочетание. Правка — Р7, Р11, G25, §6.2.
  - id: B1-2
    kind: PRODUCER
    anchors: [Р7 «Цена» — «Порядок раскатки, при котором таких строк нет, — источник, затем notify», "§7 В5 «неверный порядок раскатки теряет письма»"]
    text: >-
      Утверждение «при порядке источник → notify строк прежней ревизии, истекающих
      EXPIRED(template_skew), нет» неверно, и производителя у него нет. Строки `r1` могут не
      дождаться раскатки notify. Это строки, которые к моменту раскатки ждут в DEFER по иной
      причине Р11: `recipient_net` у `notice`, `platform_unavailable`, `grant_skew`. Сюда же
      относятся строки, забранные во время раскатки реплики новой сборки (реплик ≥ 2, раскатка
      поочерёдная). Новая сборка кладёт такие строки в DEFER(template_skew), старых реплик после
      раскатки нет, и строки истекают. Порядок раскатки этого не устраняет. Цена, которую
      документ называет оператору (О7), занижена, а «порядок без потерь» подан как свойство.
    required: >-
      Переписать «Цену» честно. Какие строки прежней ревизии теряются при любом порядке раскатки:
      ждущие DEFER по иной причине и забранные новой репликой, пока идёт раскатка. Что уменьшает
      порядок источник → notify: сюда попадают только они. Либо завести механизм, при котором
      ни одна строка `r1` не теряется, и сценарий-производитель на него. В обоих случаях строка
      В5 §7 должна ссылаться на выбранный текст.
  - id: B1-3
    kind: PRODUCER
    anchors: [Р7 «ревизия шаблона» (равна / старше / новее), Р11 клетка DEFER(template_skew), NTF1-B01 Then «`schema_rev`», NTF1-G25 Given «ревизия шаблона в сборке — r2» и (ревизия) «r1 (ниже сборки)», NTF1-D01, NTF1-D02]
    text: >-
      У `schema_rev` нет ни производителя, ни формы, ни порядка. В `notification.yaml` поля
      ревизии нет (Р7 перечисляет имя, класс, `ttl`, `limits`, типы, тему). Кто значение порождает
      — генератор, сборка, автор шаблона, — и из чего оно выводится, не сказано. Как notify
      сравнивает «старше» и «новее», тоже не сказано. B01 утверждает лишь, что `schema_rev` в строке
      есть. После редакции 14 от порядка зависят разные исходы. Старше при совпадающем наборе —
      строка судится и отправляется (близнец G25). Новее — DEFER. Старше при расходящемся наборе —
      DEFER. Если ревизия — отпечаток содержимого, порядка у неё нет и близнец G25 не
      конструируется. Если ревизию ведёт автор вручную, правка набора атрибутов без смены ревизии
      даёт «равна сборке, набор расходится», то есть INVALID(attrs_invalid). Это та самая потеря
      писем на раскатке, от которой ветвь `template_skew` защищает, и её ничто не держит (D02
      сверяет файлы генератора с шаблоном, но не ревизию с набором).
    required: >-
      Назвать производителя `schema_rev` и его форму с порядком. Например: генератор выводит
      ревизию из `notification.yaml`, монотонно, и `-check` (D02) краснеет, если набор атрибутов
      изменился, а ревизия нет. Дать сценарий-производитель с близнецом: правка набора без смены
      ревизии → красный `-check`; с новой ревизией → зелёный. G25 и Р11 должны ссылаться на этот
      порядок.

non_blocking:
  - id: N1-1
    kind: PRODUCER
    text: >-
      Р7 говорит, что проба сверяет перечень типов `notify/form` с `notify/spec` «в обе стороны».
      B29 (перечень типов) держит одну сторону: тип `notify/spec`, неизвестный `notify/form`
      (инъекция `duration`). Тип, который знает `notify/form`, но не объявляет `notify/spec`, пробой
      не ловится. Либо сузить слова Р7 до одной стороны, либо дать `notify/form` экспортируемый
      перечень и сверить равенство множеств.
  - id: N1-2
    kind: FORMAT
    text: >-
      §6.2: строка близнеца «A10 (а)–(ж)», а отличий в ней перечислено восемь, включая «нет класса»
      (з). Диапазон должен быть (а)–(з).
  - id: N1-3
    kind: FORMAT
    text: >-
      В G25 (г) «нулевая отметка времени в представлении ленты» не названо конкретно. Представление
      `timestamp` в строке ленты документ не задаёт. Назвать: «значение, которое кодировщик ленты
      пишет для `time.Time{}`», либо само представление. Попутно: у `timestamp`, который не
      разбирается (мусор вместо отметки, запись мимо `SendX`), на стороне notify нет сценария
      (в G24 такого случая нет). Исход по Р11 — INVALID(attrs_invalid), случай в G25 его закрыл бы.
  - id: N1-4
    kind: CONSTRUCTIBILITY
    text: >-
      `notify/spec` импортирует `notify/form`: литерал пути в спеке проверяется функцией формы.
      Значит, проба перечня типов `notify/form/typeset_test.go`, импортирующая `notify/spec`, должна
      лежать во внешнем тестовом пакете `form_test`, иначе будет цикл импорта. Стоит сказать это в
      §6.1, чтобы автор проб не упёрся в цикл.

