blocking:
  - id: B2-1
    kind: FORMAT
    summary: >-
      Перечень исходящих вызовов NTF7-27 «к службе доступа — только `ListEventAudience`, `Resolve{self}`,
      `ResolveSend`» неполон для честной реализации: `notify-sender` в `GL` читает и ленту самой службы
      доступа.
    evidence:
      - >-
        NTF-3 G0 (строка 2630+): «флаг службы доступа `true` (перечень источников `notify` — пять модулей
        kacho и `kaname`, NTF-1 Р9)»; `GL` NTF-7 = `G0` + `GW`.
      - >-
        NTF-1 Р4 (строки 630-640): `Claim` зовётся «при каждом (пере)открытии потока и по таймеру»;
        `Claim`/`Ack` ленты `notification_feed:kaname` обслуживает служба доступа.
      - >-
        СЛ3 записывает «каждый исходящий вызов процесса `notify-sender` за проход приёма и сборки»; окно
        NTF7-27 — 5 минут управляемых часов. Вызовы ленты `kaname` (`Subscribe`/`Claim`/`Ack`) по таймеру
        в это окно попадают и в перечне не названы.
    consequence: >-
      Проба NTF7-27 красная на любой честной реализации, либо её автор сам выберет, какие вызовы «не
      считаются», — тот же класс, что B1-3 круга 1 (предикат пробы не задан документом).
    required: >-
      Записать предикат так, чтобы он не зависел от посторонних лент: либо (1) перечень разрешённых
      вызовов к службе доступа дополнить методами её собственной ленты (`Subscribe`/`Claim`/`Ack`
      ленты `kaname`) и уточнить, что к storage допускаются вызовы ленты по таймеру; либо (2) утверждать
      запрещённое множество с нулём (`VolumeService.*`, `InternalVolumeService.*`, `Check`,
      `Resolve` формы `event`, любое чтение зеркала/состояния объекта у службы доступа — назвать методы)
      и обязательное множество с числом (`ListEventAudience` о `V1`…`V3` с фактами строк, `Resolve{self}`
      о `usr-A`, `ResolveSend` — по одному на письмо). Тот же предикат — в СЛ3 и в строке §9.
important:
  - >-
    §1.5, правило получения последней строки: команда как записана даёт 13 строк, а не 18 —
    `grep ' Get('` не ловит `rpc Get (` с пробелом (vpc: network, security_group, route_table, gateway,
    cidr_group). Измерено @515e017c87; с `grep -E ' Get(\(| )'` — 18. Утверждение по сути верно,
    предикат — нет; исправить команду (`doc-truthfulness`: число, верное для другого предиката).
  - >-
    NTF7-04: модуль, известный каталогу, но без ячейки `(RESOURCE_CHANGE, EMAIL)` (`notify`, `kaname` —
    NTF-3 Р29), сценарием не закрыт. По Р3 п.3 исход детерминирован (`'<t>' is not a kind of module
    'notify'`), но букву с близнецом стоит добавить, чтобы условие Р2 имело держателя.
  - >-
    NTF7-31: «число `ListEventAudience` равно числу у близнеца без единой подписки по меткам» — этот
    базовый прогон не описан как Given; назвать его (или утверждать число страниц, производное от
    строк аудитории).
  - >-
    DoD 10.4 п.6 требует вписать номер задачи «строкой истории ревью этого документа» — это правка
    одобренного содержимого, снимающая вердикт с отпечатка (`change-graph.md` §2). Номер задачи лучше
    нести в trail/записи ревью, а не в шапке документа.
