blocking: []
important:
  - >-
    Изоляция NTF7-32 от прочих сценариев S2 не названа. Revoke(storage, resource-event) меняет общее
    состояние службы доступа обвязки, а Р5 (строка 377) объявляет REVOKED вне NTF7-32 красным: сценарий
    S2, исполняемый одновременно с NTF7-32 на той же службе доступа, получит REVOKED о своей строке и
    покраснеет не по вине продукта. Ошибка видима (ложное красное, а не ложное зелёное), поэтому не
    блокирует; автору проб — исполнять NTF7-32 и его близнецов последовательно относительно прочих
    сценариев S2 (либо на своей службе доступа), а при следующей правке документа сказать это строкой §5.1 К25.
  - >-
    Близнец «Restore после V2» не повторяет числа ListEventAudience (2) и (З) = 0, как основной сценарий;
    по смыслу «судит предикат вызовов Р5» они те же — при следующей правке дописать «(О) ListEventAudience
    2, (П), (З), (Ф) — как выше», как это сделано у близнеца NTF7-27.
