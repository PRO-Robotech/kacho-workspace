prior_round_closure:
  - id: B5-1
    status: closed
    note: >-
      Новый сценарий NTF7-32 (строки 1041-1071): Revoke(storage, resource-event) в Дано, правка V1,
      Restore администратором кластера, отсечка C читается пробой (К27), выдержка полосы, правка V2;
      предусловие enqueued_at(V1) < C + 30s ≤ enqueued_at(V2) сверяется до «Тогда» с исходом «не
      выполнилось» при невыполнении. Тогда — одно письмо «изменён» только по V2, решающих ResolveSend 2
      (REVOKED о V1, ALLOW о V2), Resolve{self} 1. Близнецы по одному факту (момент Restore): до V1 —
      «изменён 2 раза», оба ALLOW; после V2 — писем 0, SMTP-сессий 0, оба REVOKED, Resolve{self} 0.
      Р5 (О) (строки 365-378): REVOKED — решающий только в NTF7-32, вне его — красный; строка (П)
      (399-400) согласована. Р9 (494-498): ветвь REVOKED и «ни одной ALLOW — ни письма, ни вопроса
      адреса» названы с держателем NTF7-32. §4 строка NTF-3 Р13 (555): держатель ветви REVOKED — NTF7-32
      и два близнеца. §5.1 К25-К27, §8 (1138-1139), §9 (1180), DoD 10.2 пп.1-2 (1213-1218) дописаны.
      Семантика исходов сверена с NTF-1 Р5 (таблица исходов, строки 671-673 NTF-1 c19490f9…): REVOKED при
      надгробии шаблона либо enqueued_at < отсечка + полоса — исход V1 не зависит от момента вопроса
      (до Restore — надгробие, после — отсечка), исход V2 — ALLOW по enqueued_at. Координаты К25-К27
      сверены на пине kaname 33010d434767: Revoke/Restore с optional template и required_acr_min "2"
      (internal_notification_grant_service.proto), cutoff_at в kaname.notification_template_grants
      (20261004113000_notification_grants.sql), ключ notifications.cutoff-guard (config/notifications.go).
