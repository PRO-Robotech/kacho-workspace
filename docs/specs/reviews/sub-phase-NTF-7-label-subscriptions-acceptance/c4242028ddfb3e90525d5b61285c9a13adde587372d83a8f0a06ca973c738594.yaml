blocking:
  - id: B5-1
    kind: COVERAGE
    summary: >-
      Ветвь `REVOKED` нового правила Р9 «Письмо из нескольких строк» — строка до отсечки выводится из
      письма, письмо собирается из `ALLOW`-строк, ни одной — письма нет — не имеет ни одного
      сценария; §4 называет её держателем NTF7-27 и его близнеца, а они в `GL` исхода `REVOKED`
      произвести не могут.
    evidence:
      - >-
        Р9 (строки 473-479): «Строка с исходом `REVOKED` получает терминальный `DENIED(revoked)` и в
        письмо не входит; письмо собирается из строк с исходом `ALLOW` … ни одной такой строки — письма
        нет»; довод выбора — «вызов по поздней строке пропустил бы раннюю, поставленную до отсечки
        (fail-open)».
      - >-
        §4 строка 532: «строка `REVOKED` — `DENIED(revoked)` и из письма выводится … держатель — NTF7-27
        и его близнец». Р5 строка 358: «Исход `REVOKED` в `GL` тоже не производится (отзыва и `Restore`
        в `GL` нет): его появление — красное». NTF7-27 и близнец — `Дано GL`, все `ResolveSend` `ALLOW`.
      - >-
        DoD 10.2 п.1 (строка 1153) требует «строка `REVOKED` из письма выводится», п.2 судит только
        пробы NTF7-12…27 и NTF7-31 — ни одна это утверждение не исполняет.
      - >-
        Соседи этого не держат: NTF3-106 (NTF-3 1d7d2ad0…, строки 4459-4464) — путь сводки, не
        мгновенного письма; NTF3-125 (строки 4987-4998) — две строки `volume-error` по разные стороны
        отсечки, каждая своим письмом, без схлопывания.
    consequence: >-
      Реализация, которая зовёт `ResolveSend` о каждой строке (NTF7-27 зелёный), но при `REVOKED` у
      одной строки шлёт письмо целиком либо, наоборот, гасит всё письмо, проходит все сценарии
      документа. Свойство, ради которого выбран вариант (1) — строка до отсечки `Restore` не уходит
      под разрешением соседней, — не держится ничем; это дефект отзыва выдачи, обнаружимый только на
      стенде владельца.
    required: >-
      Завести сценарий (например, NTF7-32) с близнецами по одному факту, построенный тем же способом,
      что NTF3-125 (администратор кластера через внутренний край — `Revoke(storage, resource-event)`,
      затем `Restore`; отсечка C читается пробой; строки `resource-event` одного ресурса в одном окне
      схлопывания ставятся прямой вставкой С8 с заданными `enqueued_at`): строки `V1` с `C + 29s` и
      `V2` с `C + 30s` → одно письмо «изменён 1 раз» только по `V2`, `V1` — `DENIED(revoked)`, решающих
      `ResolveSend` 2 (`REVOKED` о `V1`, `ALLOW` о `V2`); близнец — обе строки после отсечки → «изменён
      2 раза»; второй близнец — обе до отсечки → писем 0, обе `DENIED(revoked)`. В Р5 сказать, что в
      этом сценарии `REVOKED` — решающий ответ (О), а не красное; условие (стенд с отзывом, не `GL`) —
      строкой §5.1; строку §9 и DoD 10.2 п.2 дописать этим ID; в §4 строке 532 держателем ветви
      `REVOKED` назвать новый сценарий, а не NTF7-27.
important:
  - >-
    NTF7-31 близнец утверждает решающих `ResolveSend` 2 с одним ключом (два письма из одной строки):
    это решение «равные `enqueued_at` судит один ответ — только внутри письма, не между письмами».
    Р9 говорит «строки письма с равным `enqueued_at`», Р5 — N(k) по числу писем; чтобы реализация с
    общим ответом на ключ между письмами одного прохода не читалась законной, назвать это в Р9 одной
    фразой («ответ не переиспользуется между письмами»).
  - >-
    §14а: шаг формы задания автора из записей кругов 3 и 4 дополнить: «каждая ветвь нового правила —
    в том числе отказная и fail-closed — названа с держателем, способным её произвести; держатель,
    чьё Дано ветвь не производит, держателем не считается».
