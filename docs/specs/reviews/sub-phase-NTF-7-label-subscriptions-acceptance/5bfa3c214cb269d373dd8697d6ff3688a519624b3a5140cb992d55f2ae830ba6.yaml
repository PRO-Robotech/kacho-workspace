    повторы (барьер поколения, переходный отказ, таймер ленты) и сказать, считаются ли они».
  - >-
    Р5: фраза «вызов, не попавший ни в (О), ни в (З), предикатом не судится» верна, но стоит явно
    сказать, что любой вызов метода из (О) — включая повтор — относится к (О) (или к множеству
    отказов из B3-1), а не к «прочим»: иначе автор пробы прочтёт лишний вызов как неучитываемый.
