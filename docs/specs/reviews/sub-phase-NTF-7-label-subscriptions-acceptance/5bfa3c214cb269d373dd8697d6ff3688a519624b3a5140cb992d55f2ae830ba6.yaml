blocking:
  - id: B3-1
    kind: FORMAT
    summary: >-
      Обязательное множество (О) считает вызовы `ListEventAudience` «ровно по числу страниц», но
      честная реализация законно повторяет вызов после отказа барьера поколения
      `UNAVAILABLE OBJECT_GENERATION_NOT_APPLIED`, а ни NTF7-27, ни NTF7-31 этот отказ не исключают
      построением.
    evidence:
      - >-
        NTF-3 (1d7d2ad0…), строка 1767 и строка 1187: `ListEventAudience` при приёме `resource-event` —
        `UNAVAILABLE` `OBJECT_GENERATION_NOT_APPLIED` → `DEFER(audience_pending)`; строка повторно
        забирается и вопрос задаётся снова тем же `object` и `source_version`.
      - >-
        В NTF7-27 и NTF7-31 применитель намерений не остановлен и не синхронизирован: строка ленты
        модуля доходит до `notify` по сигналу (NTF-1 Р4, строка 634), намерение версии — асинхронным
        применителем (С23 NTF-3 описывает только остановку). Гонка «строка раньше применения
        поколения» — штатный путь, ради которого и существует барьер (NTF7-20 сам его строит).
      - >-
        Определение «строка забрана — принята без отказа `OBJECT_GENERATION_NOT_APPLIED`» (§5, `GL`)
        описывает исход, а не способ его построить; «Каждое «Дано» строится посевом, а не ожиданием»
        (§5) — средства, гарантирующего применение поколения до забора строки, в §5 нет. NTF-3 в
        своих сценариях пишет «поколение применено» шагом When (строки 3387, 3394, 3695) и читает
        «применено» как ответ без отказа (строки 3320-3322).
    consequence: >-
      NTF7-27 «`ListEventAudience` ровно 3» и NTF7-31 «ровно 1» краснеют на честной реализации при
      обычной гонке (вероятно — часто: сигнал ленты быстрее опроса применителя), либо автор пробы сам
      выберет, какие вызовы «не считаются». Это тот же класс, что B1-3 и B2-1: предикат пробы не задан
      документом.
    required: >-
      Одно из двух, и тем же текстом в Р5 (О), СЛ3, NTF7-27, NTF7-31 и строке §9: (1) (О) считает
      вызовы `ListEventAudience` о версии, **ответившие без отказа**, — ровно число страниц; вызовы с
      отказом `OBJECT_GENERATION_NOT_APPLIED` о той же версии выносятся в отдельное множество, которое
      числом не судится (как (Ф)), но каждый такой вызов предшествует успешному; либо (2) построить
      «поколение применено до забора строки» средством (новое СЛ: удержание забора ленты `notify`
      до ответа применителя, либо С23 + запуск применителя + наблюдаемое применение до разблокировки
      ленты) и назвать его в Given обоих сценариев. Проверить тем же взглядом `Resolve{self}` и
      `ResolveSend` «ровно 1»: у `ResolveSend` есть законный повтор после `NOT_YET_GRANTED` →
      `DEFER(grant_skew)` (NTF-1, строки 663-674); в `GL` выдача пространства `storage` есть (`G0`
      NTF-3), поэтому достаточно назвать это условие, но назвать — нужно.
