blocking:
  - id: B1-1
    kind: CONSTRUCTIBILITY
    summary: >-
      Гейт Р4 в формулировке документа красный на дереве как есть, а NTF7-11 требует на дереве зелёного.
    evidence:
      - >-
        Р4: признак сверяется «с двумя производителями: (а) у сообщения вида есть поле `labels`; (б) вид
        входит в набор службы доступа. Расхождение в любую сторону — красный с именем вида».
      - >-
        §1.2 (и замер @515e017c87): у `registry_repository` сообщение `Repository` несёт `labels`, набор
        kaname вида не содержит, признак — «нет». Признак расходится с производителем (а) — по правилу Р4
        это красный `registry_repository`.
    consequence: >-
      NTF7-11 «на дереве — зелёный, осмотрено видов 20, с отбором 18» неконструируем; реализатор либо
      ослабит гейт на свой вкус, либо получит вечный красный.
    required: >-
      Записать предикат гейта формулой: признак ⇔ (а) ∧ (б); расхождение (а) ∧ ¬(б) у вида без признака —
      законно и печатается отдельной строкой (сейчас это ровно `registry_repository`). Назвать отображение
      «вид notify ↔ тип набора kaname (`storage_volume` ↔ `storage.volumes`, `nlb_*` ↔ `loadbalancer.*`)
      ↔ сообщение proto» и его производителя. Добавить инъекцию (г): `registry_repository` получает
      признак при (а) ∧ ¬(б) — красный с именем производителя (б).
  - id: B1-2
    kind: COVERAGE
    summary: >-
      Число вопросов `Resolve{event, via_subscription=true}` на одно событие не ограничено ничем, а Р7
      снимает с создания селектора единственное, что ограничивало круг кандидатов.
    evidence:
      - >-
        Р6 (дословно NTF-3 Р11): каждому совпавшему подписчику вне строк аудитории — один вопрос `Resolve`
        при приёме события. Р7: селектор заводит любой пользователь без права и без вызова службы доступа
        (NTF7-02: `usr-X` без привязок). У подписки на ресурс и на проект NTF-3 круг кандидатов сужен
        проверкой `Check(v_get)` на создании.
      - >-
        Единственный предел в документе — потолок подписок на пользователя (Р8); предела на число
        кандидатов вне аудитории на событие, на число вопросов, их пакетирование или бюджет приёма нет;
        сценария на эту ось нет (grep `Resolve` в документе — 11 строк, все о форме вопроса).
    consequence: >-
      Стоимость приёма одного события модуля растёт с числом пользователей любых аккаунтов, совпавших
      селектором, и ничем не ограничена — это не production-форма (`ban14-production-grade`), и класс
      всплывёт на нагрузке или в ревью безопасности после реализации.
    required: >-
      Решением документа назвать, чем ограничен круг кандидатов вне аудитории на одно событие (например,
      сужение селектора областью, видимой вызывающему на создании; либо один пакетный вопрос на событие с
      пределом; либо иное), и завести сценарий-держатель с числом: N подписчиков без права → ровно K
      вопросов к службе доступа, с близнецом. Если выбор требует решения владельца — вынести вопросом
      владельцу; строка §6 «ось проекта или аккаунта у селектора» должна согласоваться с выбранным.
  - id: B1-3
    kind: FORMAT
    summary: >-
      NTF7-27 «вызовов `notify` к storage и к службе доступа о метках `vol-89` — 0» неизмеримо и
      противоречит самой доставке.
    evidence:
      - >-
        Вопрос об аудитории и `Resolve{event}` несут факты события, в том числе `labels` и
        `previous_labels` (NTF-3 Р7, строки 1054–1060; NTF7-14 утверждает такой вызов). Каждая из трёх
        строк `V1…V3` порождает вопрос к службе доступа с метками; «вызов о метках» от «вызова об
        аудитории» запись вызовов (С7) не отличает.
    consequence: >-
      Проба либо красная на любом честном исполнении, либо её автор выберет свой предикат.
    required: >-
      Утверждать перечнем: вызовов к storage — 0 (любых); к службе доступа — только вопросы об аудитории
      трёх строк с фактами из строк (метки `V3` — `env=dev` и в `labels`, и в `previous_labels`), и ни
      одного чтения состояния объекта или зеркала (назвать метод, которого быть не должно).
  - id: B1-4
    kind: SCOPE
    summary: >-
      Замещение строки таблицы методов NTF-3 Р25 не объявлено: для `Create` там «вызов службы доступа —
      `Check`; недоступна — `UNAVAILABLE`, подписки нет», а Р7 здесь для ветви селектора — 0 вызовов и
      создание при разрыве; Р7 при этом пишет «запись каталога прав метода `Create` (NTF-3 Р25) без
      изменений».
    evidence:
      - NTF-3 Р25, таблица «Методы публичного API…», строка `NotificationSubscriptionService.Create`.
      - NTF-7 §4 перечисляет NTF-3 §6, Р3, Р11, Р13, Р30, Д127 — строки Р25 нет.
    consequence: >-
      Два места об одном предмете расходятся; реализатор, читающий одобренную NTF-3, заведёт `Check` или
      fail-closed на ветви селектора — NTF7-02 красный, переделка.
    required: >-
      Строка §4 для NTF-3 Р25: что в таблице меняется (столбцы «вызов» и «недоступна» по ветви цели) и
      кто правит NTF-3 (тем же изменением, что §6 и Р3, — DoD 10.4 п.3 дополнить).
