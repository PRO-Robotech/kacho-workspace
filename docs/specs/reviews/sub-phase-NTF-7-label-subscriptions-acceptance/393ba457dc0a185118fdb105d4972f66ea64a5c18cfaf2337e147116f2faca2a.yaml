blocking:
  - id: B4-1
    kind: FORMAT
    summary: >-
      Ключ (О) у `ResolveSend` — (`namespace`, `template`, `enqueued_at`) при «ровно один на каждое
      письмо», а письмо NTF7-27 схлопнуто из двух строк (`V1`, `V2`) с разными `enqueued_at`
      (близнец — из трёх); какой `enqueued_at` несёт вызов и сколько вызовов делает честная
      реализация, документ не задаёт.
    evidence:
      - >-
        NTF-7 Р5 (О), строки 331-335: «ключ (`namespace`, `template`, `enqueued_at`); решающий — исход
        `ALLOW`, ровно один на каждое письмо». NTF7-27 (строки 913-916): «решающих `ResolveSend` ... ровно
        1, исход `ALLOW` (одно письмо)»; письмо — «изменён 2 раза», вошли `V1` и `V2`; близнец — «изменён
        3 раза».
      - >-
        NTF-1 Р5 (c19490f9…, строки 663-673): «на каждое письмо notify зовёт `ResolveSend(namespace,
        template, enqueued_at)`»; `ALLOW` — «`enqueued_at ≥ отсечка + полоса` для каждой имеющейся
        отсечки», `REVOKED` — «`enqueued_at < отсечка + полоса`». В NTF-1 письмо = строка.
      - >-
        NTF-3 (1d7d2ad0…): NTF3-96 (строка 4304) — `ResolveSend(storage, resource-event, enqueued_at
        строки)` на письмо из одной строки; сводка — «`ResolveSend` на строку и на сводку» (строки 1503,
        5868); Р13 (строки 1550-1553) и NTF3-97 (строки 4310-4315) схлопывают N строк в одно письмо и не
        говорят, какой `enqueued_at` у его `ResolveSend` и сколько их.
    consequence: >-
      Отсечка судится по `enqueued_at` строки, поэтому реализация, верная семантике отзыва, спросит
      `ResolveSend` о каждой строке письма (иначе строка `V1`, поставленная до отсечки, уйдёт в письме
      под разрешением `V2`): в NTF7-27 решающих вызовов будет 2 с разными ключами, в близнеце 3 — (О)
      «ровно 1» красный на честной реализации, либо автор пробы сам выберет, какой `enqueued_at` ждать.
      Тот же класс, что B1-3, B2-1, B3-1: предикат пробы не задан документом.
    required: >-
      Решением документа назвать, как мгновенное письмо из N строк спрашивает `ResolveSend`, и записать
      это тем же текстом в Р5 (О), NTF7-27 (и его близнеце), строке §9 и DoD 10.2 п.1: либо (1) по
      одному решающему `ALLOW` на каждую строку письма, ключ — `enqueued_at` строки (NTF7-27 — ровно 2:
      `V1`, `V2`; `V3` — 0; близнец — 3), и что делает письмо, если одна из строк `REVOKED`; либо (2)
      один вызов на письмо с названным `enqueued_at` (например, самой ранней строки — fail-closed) и
      довод, почему поздние строки этим покрыты. Поскольку NTF-3 Р13 этого не задаёт, выбранное —
      строкой замещения §4 для NTF-3 Р13 (правка соседа — DoD 10.4 п.3).
important:
  - >-
    (П) уже, чем клетка NTF-3 строки 1189: там `CANCELLED`, `RESOURCE_EXHAUSTED`, `ABORTED`, `INTERNAL`,
    `UNKNOWN`, `DATA_LOSS` тоже → `DEFER(platform_unavailable)` без `misconfigured`. По Р5 такой ответ
    — красный предиката, хотя продукт поступил верно. Сказать, что это сознательная строгость пробы
    (ответ службы доступа вне `UNAVAILABLE`/`DEADLINE_EXCEEDED` на стенде — исход «не выполнилось», а
    не красный продукта) либо расширить (П) до строки 1189.
  - >-
    Р5 (З) запрещает `Resolve` формы `event` «о любом субъекте», а близнец NTF7-31 (строки 943-948)
    его требует (решающих ровно 1, ключ (`subject`, `object`, `source_version`), повторы в (П)). По
    смыслу верно, но предикат Р5 записан один на документ: дописать в Р5, что у подписчика ветви
    `resource`/`project` `Resolve{event}` переходит из (З) в (О) с этим ключом и с (П)-перечнем
    `OBJECT_GENERATION_NOT_APPLIED`, `UNAVAILABLE`, `DEADLINE_EXCEEDED`; в близнеце назвать и числа
    решающих `Resolve{self}` (2) и `ResolveSend` (по решению B4-1) на два письма.
  - >-
    §14а: род FORMAT отверг редакцию четвёртый раз. Шаг формы задания автора из записи круга 3
    («для каждого числа вызовов в Then перечислить законные повторы и сказать, считаются ли они»)
    дополнить: «и для каждого ключа счёта — откуда берётся его значение, когда письмо собрано из
    нескольких строк».
