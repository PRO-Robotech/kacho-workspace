prior_round_closure:
  - id: B3-1
    status: closed
    note: >-
      Р5 (О) судит числом только решающие ответы; новое множество (П) — отложенные ответы закрытого
      перечня, судятся формой (п1) «раньше решающего того же ключа», (п2) «после решающего — ни одного».
      Сверено с NTF-3 1d7d2ad0…: `ListEventAudience` и `Resolve{event}` — `UNAVAILABLE`
      `OBJECT_GENERATION_NOT_APPLIED` → `DEFER(audience_pending)` (строки 1187, 1767); переходные
      `UNAVAILABLE`/`DEADLINE_EXCEEDED` → `DEFER(platform_unavailable)` (строка 1189; NTF-1 Р11 —
      строка 464 NTF-3). `NOT_YET_GRANTED` означает только «записи выдачи нет» (NTF-1 c19490f9…,
      строки 672, 705-706), выдача заведена посевом в `GL` (строки 516-519) — исключение из (П) законно.
      СЛ3 пишет код и тело ответа (строка 507). Тот же текст — NTF7-27, NTF7-31, §9, DoD 10.2 п.1.
important_prior_closure:
