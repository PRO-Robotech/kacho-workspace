  kinds: [COVERAGE, PRODUCER, FORMAT, FORMAT, CONSTRUCTIBILITY]
  items:
    - kind: COVERAGE
      summary: >-
        Добавление RegionService/Create и ZoneService/Create делает их гейтируемыми мутациями
        (servicehost.IsGatedMutation: /Create службы без префикса Internal). Самоистекающая проба
        TestGeoServesNoGatedMutation (services/geo/cmd/kacho-geo/describe_test.go:133) покраснеет,
        а причина изъятия BootGate в describe() (services/geo/cmd/kacho-geo/serve.go:333-364,
        предмет 2 «отвергать нечего») станет ложной. Документ этого не называет ни в §Р7, ни в
        радиусе П19, а предикат перехода S1 («внутренние пробы geo зелёные без правок, кроме двух
        кейсов §Р7») при этом невыполним. Нужно решение: принести гейт либо переписать причину на
        предмет 1 («доставлять нечего») и заменить пробу самоистечения на пробу по нему.
    - kind: PRODUCER
      summary: >-
        Сценарий 01, «Тогда»: `GET /operations/{operationId}` → 200 на внешнем крае для операции geo.
        В разделе «сценарий → производитель» строки нет. Путь — opsproxy (prefix geo) →
        OperationService публичного слушателя geo → corelib operationspb.Handler.Get, видимость
        ограничена владельцем (handler.go:73-80). На внешнем крае это ни разу не утверждалось
        (services/geo/tests/newman/cases/operation.py:14-21: прежняя проба снята как
        «неконтрактная поверхность»). Назвать производителя или снять шаг.
    - kind: FORMAT
      summary: >-
        Сценарий 17: «тот же код и та же форма» вместо конкретного кода. Край отвечает на
        недостаточный уровень подтверждения UNAUTHENTICATED с фиксированным текстом
        (gateway/internal/middleware/auth_stepup.go:208). Назвать код и текст.
    - kind: FORMAT
      summary: >-
        Перекрёстные ссылки сломаны. Р2: «пробой по паре записей каталога (сценарий 16)», а это
        сценарий 15. Р7: «(сценарий 13)», а смена представителя — сценарий 12. Строка 188
        («отказы проверки входа (сценарии 08, 09, 12) — integration-пробой») противоречит DoD п.2
        (integration: 08–11, 14) и п.4 (newman: 09, 12); 09 — отказ хранилища в Operation.error,
        12 — изоляция края, а 11 в перечень не попал.
    - kind: CONSTRUCTIBILITY
      summary: >-
        Сценарий 18: у отрицательного близнеца («пользователь без права на POST») не названа
        фикстура человека-не-администратора консоли. Сценарий 08: близнец «regionId = существующий
        префикс-регион» требует региона adm1g-cp-{{runId}}, а в Given он не заведён.
non_blocking:
  - >-
    П15: предикат печатает и файлы вне geo (registry-redesign.py, registry-repository.py,
    storage image.py с коллекциями). Это утверждения ОТСУТСТВИЯ собственных полей, а не читатели
    инфра-блока geo, так что по существу вывод держится, но фраза «все попадания в services/geo/»
    расходится с выводом названной команды.
  - >-
    Сценарий 11: «message содержит» лучше заменить дословным текстом. Для региона текст уже есть:
    `numericInfraId is immutable after Region.Create` (region.go:240-242).
  - >-
    DoD п.3: «оба экземпляра каталога» — в дереве @ffbe930dbe каталог один
    (gateway/internal/middleware/embed/permission_catalog.json). Назвать второй или убрать слово.
  - >-
    security.md sec-admin-ui-rpc-internal-only всё ещё требует размещать admin-RPC только в
    Internal*-службах; родительская ADM-1 приняла обратное. Расхождение корпуса с одобренной
    приёмкой — к владельцу правила, не к этому документу.
