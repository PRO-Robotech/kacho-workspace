important_findings:
  - id: I-1-1
    kind: CONSTRUCTIBILITY
    where: "Р1, F8S3-19"
    finding: >-
      На 9b14ae7f01c перечень `OPEN_BEFORE_ADDRESS_CONFIRMATION` ВЫВЕДЕН из `CEREMONY_ROUTING`
      фильтром `kind === "screen"` (ceremony-addresses.ts:73–:75). Р1 делает /recovery «экраном
      вне каркаса, как вход и регистрация», то есть естественная правка — `{kind: "screen"}`, и
      /recovery тогда сам войдёт в открытые до подтверждения: пять адресов вместо четырёх,
      вопреки Р1 и F6b Р7. Документ этого вывода не называет. Контракт не дырявый — F8S3-19
      краснеет на такой правке, — но исполнителю нужен явный шаг: отдельный вид либо явное
      исключение в выводе перечня, без второго перечня адресов.
    recommendation: назвать в Р1 правку вывода перечня и её держателя F8S3-19
  - id: I-1-2
    kind: TWIN
    where: "§6.2 строка F8S3-07"
    finding: >-
      Близнецом F8S3-07 назван F8S3-04, но они различаются двумя фактами: адрес засеян (П-п) и
      служба доступна. Близнец с одним изменённым фактом в документе есть — F8S3-05 (незаведённый
      адрес, настоящий `200`). Отрицание различимо от «предмета нет», поэтому не блокирует.
    recommendation: в §6.2 и в заголовке F8S3-07 назвать близнецом F8S3-05
  - id: I-1-3
    kind: FORMAT
    where: "Р8, строка «запросы кода из окна источника»"
    finding: >-
      «F8S3-06 до службы не доходит (отказ формы)» противоречит «Тогда» F8S3-06: ровно один
      POST /iam/v1/auth/recovery уходит в службу и получает её 400. Число 12 при этом верно —
      отказ формы у службы стоит до списания оси (см. twins_checked_by_command).
    recommendation: «отказ формы службы до списания оси»
  - id: I-1-4
    kind: FORMAT
    where: "F8S3-09 «Когда»"
    finding: >-
      «строка, отличная от кода письма» — не конкретное значение. Строка из одних разделителей
      нормализуется в пустую и даёт 400 `Illegal argument code: required` (recovery_complete.go:166–:169),
      а не 401 сценария.
    recommendation: назвать значение — код того же алфавита и длины с одним изменённым знаком

