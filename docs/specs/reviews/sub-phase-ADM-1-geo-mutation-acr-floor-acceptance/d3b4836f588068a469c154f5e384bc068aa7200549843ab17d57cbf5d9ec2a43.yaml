  kinds: [DoD]
  items:
    - kind: DoD
      where: "§6 DoD п.1; §4 строка «ADM-1-GEO-ACR-01, ветвь geo»; §2 Р3"
      claim: >-
        Р3 обещает, что сдвиг ЛЮБОГО из шестнадцати значений — находка с FQN, а сценарий 01
        утверждает равенство "1" и system_admin. DoD п.1 и строка производителя заказывают
        иное: «расширение TestPermissionCatalog_ACR_ComplementNotTwo до двенадцати FQN» и
        инъекцию только вверх ("2"). Эта проба утверждает assert.NotEqual(t, "2", …), поэтому
        сдвиг пола geo ВНИЗ — на "0" или "" (оба законны и означают «пола нет»,
        stepup_gate.go:25,51) — она пропускает молча. DoD выполним при нарушенном Р3, а
        сдвиг вниз — снятие подтверждения с мутации system_admin, то есть ослабление защиты.
      predicate: >-
        sed -n 335,381p gateway/internal/middleware/permission_catalog_acr_invariant_test.go
        → :380 assert.NotEqual(t, "2", e.RequiredACRMin, …); grep -n '"0"' stepup_gate.go
        → :25 «"0" (anonymous) < "1"», :51 «acrlevel.Satisfies treats ""/"0" as no floor»
        @kacho 990861542. Родительская ADM-1-GEO-17 держит "0"-отказ только для двух FQN
        (RegionService/Create, InternalRegionService/Create — geo_public_admin_stepup_test.go:85-86).
      fix: >-
        DoD п.1 и строка §4: проба утверждает РАВЕНСТВО required_acr_min = "1" и
        required_relation = "system_admin" для каждого из двенадцати FQN geo (отдельной
        функцией либо циклом с FQN в сообщении), а не NotEqual "2"; инъекции — обе
        стороны: "2" (вверх) и "0" (вниз) в одну запись geo, каждая роняет пробу с её FQN,
        законный каталог проходит молча. То же — в «Тогда» сценария 01: добавить ветвь
        инъекции вниз.
non_blocking:
  - >-
    Сценарий 02, нативный gRPC: «ни один не отвергнут с UNAUTHENTICATED и текстом
    stepUpDenyMessage» — оракул отрицанием, зелёный и при любом ином отказе. Фикстура
    callUnary на проходе возвращает nil (geo_public_admin_stepup_test.go:92 require.NoError),
    значит утверждать «ошибки нет» — сильнее и производимо.
  - >-
    DoD п.4 «обе вшитые копии каталога побайтово равны»: отслеживаемая копия одна
    (git ls-files | grep permission_catalog.json → 1); вторая — сборочная
    build/permission_catalog.json цели make -C gateway permission-catalog-check
    (gateway/Makefile:115-118). Назвать цель, а не «две вшитые копии».
  - >-
    Вводная ссылается на родителя, а не на 04-roadmap-and-phasing.md §3 — для дельты к
    одобренной ADM-1 приемлемо, scope родителя не расширяется.
  - >-
    Решение Р2 (geo остаётся "1") согласовано с опорой: SEC-acr B5 называет
    geo.Internal{Region,Zone}Service/* рутиной, B4 — GrantAdmin/RevokeAdmin "2"; родитель Р2
    приравнивает публичного близнеца к внутреннему. Вопрос «А против Б» — диспетчеру;
    рецензент возражений против (А) не имеет.
  - >-
    Родительская ADM-1-GEO-17 (75335edd) записала текст отказа
    "insufficient_user_authentication", а край отвечает константой stepUpDenyMessage
    (auth_stepup.go:252) — расхождение в одобренном родителе, этой редакцией не создано;
    закрывать записью ревью родителя либо его новым кругом, не правкой шапки.
