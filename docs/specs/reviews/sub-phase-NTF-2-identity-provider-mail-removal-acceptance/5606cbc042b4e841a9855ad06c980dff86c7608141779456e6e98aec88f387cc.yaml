    `attemptGate.exhausted`, так что напечатанный «0» — то положение, в котором страж не откажет.
    Если число не 0, исход «не выполнилось» с обоими числами: это третий исход, ни зелёный, ни
    красный.
  CX2-106cd_order_and_refusal: >-
    ПРИНЯТО. Вход идёт до предъявления, и это верно: rate.go прямо пишет, что успешный вход попыткой
    не считается и обнуляет счёт по адресу. Предъявление после входа остаётся при нулях.
    `TOO_MANY_ATTEMPTS` — 429 / 8 / `too many attempts; try again later` (auth-lane.mdx:401). Разделение
    «отказ стража kaname — не выполнилось, вызов PoW / RATE_LIMITED / счёт посредника ≠ 1 — красный»
    сохраняет предмет (г): путь вне ограничителя края. Противоречия с «Тогда» (а)–(в) нет.
  N-1_password: >-
