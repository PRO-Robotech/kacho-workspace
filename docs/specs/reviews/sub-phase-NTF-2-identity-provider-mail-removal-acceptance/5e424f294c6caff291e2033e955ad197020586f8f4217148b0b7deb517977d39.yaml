round1_items:
  B1-1: >-
    ЗАКРЫТО. Строка `kaname` несёт форму `address` (Р11) — совпадает с NTF-1 Р6 (строка 743 «форма
    адресата в NTF-1 одна — адрес») и NTF-3 Р27 (строки 1734–1757: `kaname` — `{address}`).
    Справочника у NTF-2 нет; NTF2-88 снят с надгробием; ссылка на держателя NTF3-27 верна (строки
    3832–3842: `PERMISSION_DENIED`, `permission denied`, `ErrorInfo{reason: AUTHZ_DENIED}`, близнец
    NTF3-23). Остатков второго механизма в документе нет: `grep -nE 'DENIED\(recipient\)|account_security_contact|справочник|момент отправки'`
    попадает только в §11 (история) и в надгробие NTF2-88; ссылок на NTF2-88/92/96 из соседних
    приёмок 0.
  B1-2: >-
    ЗАКРЫТО по существу выбранной ветки: адресаты класса S об объектах аккаунта — владельцы,
    назначенный контакт NTF-3 Р20 их не образует; основание (кольцо модулей kaname → kacho) верно;
    NTF2-100 с близнецом заведён. Определение «владельца» при этом стало несущим — см. B2-1.
  I1-1: ЗАКРЫТО вместе с NTF2-88.
blocking:
  - id: B2-1
    kind: CONSTRUCTIBILITY
    summary: >-
      «Владельцы аккаунта» во множественном числе не определены, а в модели службы доступа владелец
      аккаунта один. Given NTF2-96 («второй владелец `O2`») и близнец NTF2-100 («`X` — второй
      владелец `acc`») требуют состояния, которое при прочтении «владелец = `account#owner`» схема
      запрещает. То же понятие NTF-3 трактует как одно лицо.
    evidence:
      - >-
        kaname@0dd03218a613, `internal/migrations/0001_initial.sql:1704`: `owner_user_id text NOT NULL`
        — одна колонка на строку `kaname.accounts`.
      - >-
        kaname@0dd03218a613, `internal/domain/structural_tuple.go:127-131`: кортеж
        `user:<OwnerUserID> owner account:<id>` выводится только из этой колонки; модель
        `fga_model.fga:309` `define owner: [user]`.
      - >-
        NTF-3 Р7 (строка 972): `account_owner{account_id}` — «ответ — адрес владельца аккаунта»;
        NTF3-120 — один `ADDRESS{own@example.test}`. NTF-3 Р20 — «по умолчанию — владелец».
      - >-
        NTF-2 ред. 34: Р3 (таблица) и Р11 — «владельцы аккаунта»; NTF2-96 Given — «фикстурой П11
        второй владелец `O2` аккаунта `acc`»; NTF2-100 близнец — «`X` — второй владелец `acc`
        (фикстура П11, один факт)». П11 (строка 1765) — запись в базу kaname, способ записи
        «второго владельца» не назван. Слово «владельцы» встречалось и в одобренной редакции 32,
        но ни один сценарий не требовал второго; ред. 34 впервые делает его Given.
      - >-
        Роль `owner` (rank 3, `internal/domain/role_catalog.go:27`) выдаётся привязкой на область
        `ACCOUNT` и может быть у нескольких людей, но кортежа `account#owner` она не даёт.
        Второе прочтение («держатели привязки роли `owner` на `ACCOUNT:<acc>`») конструируемо, но в
        документе не записано и расходится с `account_owner` NTF-3.
    consequence: >-
      Реализатор, прочитавший «владелец» как `account#owner` (как NTF-3), не построит Given NTF2-96 и
      близнец NTF2-100. Прочитав как «держатели роли `owner`», он построит их, но тогда у одного понятия
      «владелец аккаунта» два определения в двух приёмках эпика. Письма о ключах SA при этом уйдут
      разным множествам: `sa-key-issued` — держателям роли, напоминание NTF-3 — `owner_user_id`.
      Этот второй механизм владелец как раз запретил.
    required: >-
      В Р11 назвать предикат «владелец аккаунта» на уровне хранилища kaname одной фразой. Ровная
      ветка — `kaname.accounts.owner_user_id` (= `account#owner`, = NTF-3 `account_owner`), тогда
      адресат в единственном числе в Р3 и Р11, а NTF2-96 и близнец NTF2-100 переписываются без
      второго владельца. Пример для NTF2-96: два адресата строки `removed-from-account` (`U` и `O`),
      блокируется `O`. Пример для близнеца NTF2-100: копия П6-k, где `owner_user_id` у `acc` — `X`
      (строка для `X` есть, для `O` нет). Другая ветка — держатели привязки роли `owner` на
      `ACCOUNT:<acc>`. Тогда это записывается явно, П11 называет запись привязки как способ посева, а
      расхождение с NTF-3 `account_owner` уходит владельцу вопросом, а не остаётся молча.
important:
  - id: I2-1
    kind: FORMAT
    summary: >-
      Р11 п.1 (строки 1101–1103): «не ACTIVE … контакту области не переадресуется: переадресуется
      только событие о субъекте из перечня следующего пункта». В перечне следующего пункта есть
      «заблокированный пользователь», а он тоже не ACTIVE. Оговорка разрешает противоречие, но
      держателя у этой ветки нет. Ни один сценарий не утверждает, что при выдаче роли
      заблокированному пользователю строка уходит владельцу. Неподтверждённому, по NTF2-92 (в),
      строк нет никому. Асимметрию стоит либо утвердить буквой NTF2-92 с близнецом, либо снять.
  - id: I2-2
    kind: FORMAT
    summary: >-
      В When NTF2-100 («проба выпускает ключ `sa` клиентом gRPC») личность вызывающего не названа.
      У NTF2-90 так же, поэтому это не новый класс. Но для пробы на П6-k (края нет) нужно указать,
      чьей сессией идёт вызов (`O`).
  - id: I2-3
    kind: SCOPE
    summary: >-
      «Цена (2)» в §11 честно называет два правила адресата писем о ключах SA: выпуск — владельцу,
      истечение — назначенному контакту. Формулировка NTF-3 Р20 («контакт решает, кому уходят письма
      о чужих учётных данных аккаунта») шире того, что теперь верно. Это не правка NTF-2, это вопрос
      владельцу по указанию «логика целевая и ровная».
questions_to_owner:
  - >-
    Письма о ключах сервисного аккаунта сейчас адресуются двумя правилами. Выпуск и отзыв
    (`sa-key-issued`, событие kaname, NTF-2) идут владельцу аккаунта. Напоминание об истечении
    (задание `notify`, NTF-3 Р19/Р20) идёт назначенному контакту, а без него — владельцу. Свести их
    к одному правилу можно только правкой NTF-3 Р27, которая даст `kaname` форму адресата
    `account_owner`/контакт. Оставляем два правила или правим NTF-3?
