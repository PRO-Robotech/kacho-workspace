non_blocking:
  N-1: >-
    Квантор §0/NTF2-30 «в цепочке, объявляющей удостоверение почты, объектов чарта notify со
    ссылкой — ровно 1» не называет случай NTF1-N04: цепочка объявляет удостоверение, а флаг
    `global.kacho.notifications.enabled: false` — notify не рендерится, счёт 0, предикат красный. На
    цепочках stacks.txt этого сочетания нет, поэтому не блокирует; при реализации гейта — назвать
    исход явно (красный как половинное объявление либо квантор «и рендерящей чарт notify»).
  N-2: >-
    DoD п.14 судит `git grep -lE '\bfail\b.*credentialSecret'` — образец одной строки, тогда как
    NTF2-31 (ж) обещает разбор вызова. Отказ, где `credentialSecret` на следующей строке вызова, или
    отказ формой `required "…credentialSecret…"` (на базе таких 0) предикат DoD пропустит. Гейт
    переписи стоит строить разбором вызова и считать обе формы отказа helm (`fail`, `required`);
    предикат DoD — как согласованная с гейтом нижняя граница.
  N-3: >-
    Предикат «вне чарта notify» после NTF-3 не отличит, какое из двух развёртываний чарта держит
    секрет (ровно 1 выполняется и при ссылке у notify-api вместо notify-sender). Это предмет
    NTF3-127 (гейт TestMailSecretIsMountedByTheSenderOnly), и для NTF-2 достаточно; отмечено, чтобы
    держатель NTF-3 не счёл его закрытым предикатом NTF-2.
repeated_kinds_note: >-
  Блокирующих нет. Форма задания автору, предложенная прошлым кругом («вход инъекции называется
