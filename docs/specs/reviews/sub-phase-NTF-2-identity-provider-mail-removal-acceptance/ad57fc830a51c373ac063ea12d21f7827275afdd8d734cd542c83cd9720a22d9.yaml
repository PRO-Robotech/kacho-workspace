blocking:
  - id: B1-1
    kind: CONSTRUCTIBILITY
    summary: >-
      Форма адресата строк ленты пространства `kaname` противоречит двум соседним приёмкам, а
      справочник, который остаётся в NTF-2, — второй механизм рядом с NTF-3 Р7.
    evidence:
      - >-
        NTF-2 Р11 (строки 1086–1092): строка класса S несёт вид адресата `subject` или
        `account_security_contact` и идентификатор пользователя. Адрес `notify` разрешает в момент
        отправки «внутренним методом справочника подтверждённых адресов».
      - >-
        NTF-1 Р6 (c19490f9, строка 743): «форма адресата в NTF-1 одна — адрес … из пространства
        `kaname`».
      - >-
        NTF-3 Р27 (17635b5a, строка 1750): «`kaname` и стендовое пространство — `{address}` (NTF-1
        Р6, без изменения)». Строку с формой, не разрешённой пространству, `notify` отвергает при
        приёме: `INVALID(recipient_form_not_allowed)`, 0 SMTP-сессий. Формы
        `account_security_contact` в закрытом перечне Р27 нет.
      - >-
        NTF-3 Р7 и Р28: справочник — `kaname.cloud.iam.v1.InternalNotificationRecipientService`, в
        перечне звена ровно три метода (`Resolve`, `ListEventAudience`, `ListExpiringCredentials`).
        Право проверяется дверью `Check(service:notify, reader, notification_recipient_directory:root)`,
        «отдельного набора вызывающих у справочника нет». NTF-2 метод не называет, а право описывает
        как «закрытый перечень методов, Д2».
    consequence: >-
      Положительный путь NTF2-90, NTF2-92, NTF2-93, NTF2-96 (письмо адресату-субъекту доставлено)
      при одобренных NTF-1 и NTF-3 построить нельзя: строку отвергнет приём `notify`. When сценария
      NTF2-88 не называет вызов (метод, `namespace`, `audience`). Остаются две возможности, и обе
      плохие: либо это четвёртый метод, и тогда ложно утверждение NTF-3 «три метода», либо это
      `Resolve`, и тогда для `kaname` нужна форма, которую NTF-3 Р27 запрещает.
    required: >-
      Нужна одна форма. Строка `kaname` несёт ту форму, которую разрешает NTF-3 Р27, либо NTF-3
      Р27 и NTF-1 Р6 расширяются под формы NTF-2, но тогда это правка тех приёмок, а не только
      этой. Справочник NTF-2 называется методом NTF-3 Р7 с конкретным запросом. Then NTF2-88
      утверждает форму отказа двери NTF-3 Р7 (`PERMISSION_DENIED` `permission denied`,
      `ErrorInfo{reason: AUTHZ_DENIED}`) парой код + reason.
  - id: B1-2
    kind: OPEN-QUESTION
    summary: >-
      «Контакт безопасности аккаунта» разрешается двумя механизмами, и текст Р11 редакции 33 их
      смешивает.
    evidence:
      - >-
        NTF-2 Р11 (строки 1094–1096): событие о субъекте, который не может быть адресатом
        (сервисный аккаунт и т.п.), уходит «для аккаунта — его владельцам (контакт безопасности
        аккаунта, назначаемый владельцем, заводит NTF-3 Р20 …)». Механизм — снимок владельцев в
        транзакции события kaname.
      - >-
        NTF-3 Р20 (строки 1587–1612): контакт хранится в `notify`
        (`/notify/v1/accounts/{accountId}/contacts`) и «решает, кому уходят письма о чужих учётных
        данных аккаунта (ключи его сервисных аккаунтов)». Его разрешает `notify` через `Resolve`
        с `account_reader`, а запасной вариант — `account_owner`.
    consequence: >-
      Возьмём явно назначенный контакт, который не владелец. Напоминание NTF-3 об истечении ключа
      сервисного аккаунта он получит. Письмо класса S NTF-2 о выпуске или отзыве того же ключа он не
      получит: kaname в своей транзакции контакт из `notify` прочитать не может. Выходит, что одно
      понятие имеет два правила адресата, а это противоречит основанию Р11 «одно правило адресата
      на все каналы». Ни один сценарий этого случая не утверждает.
    required: >-
      Решить, получает ли явно назначенный контакт NTF-3 Р20 письма класса S kaname о субъектах
      области. Если получает — по какому одному механизму. Если не получает — убрать отсылку к Р20
      из Р11 и прямо сказать, что для класса S адресаты — владельцы, а не контакт. Решение
      закрепить сценарием с близнецом.
important:
