return_items_checked:
  B-1: >-
    ЗАКРЫТО. §6б (6): суд записей `helm.values` гейтом заглушек (формула «гасит / без предмета»,
    печать «заглушек N; файлов значений M», инъекция) приписан NTF-1 D1s (Д53). Это сходится со
    строкой D1s маршрута @45d535e1e: там та же формула, та же печать, инъекция «файлов значений 2».
    Дельта D6 перечислена закрыто («три вещи и только они»): запись `edge.yaml` в `helm.values`
    (M головы = M базы + 1), печать выпавших чартов и правило «пустой перечень на `edge.yaml` —
    красный». Предпосылка «гейт читает `helm.values`» печатается на базе полосы. Если строки нет
    или M = 0, это «не выполнилось», а не расширение гейта в D6. Состояние @6edea09c2ee названо
    состоянием до NTF-1. Та же правка есть в §7 NTF2-71 (е) и в DoD п.7. Класс проверен переписью:
    пути маршрута NTF-1 сравнены с упоминаниями в приёмке (S-2). Других утверждений о текущем
    состоянии файла NTF-1, от которого зависит дельта NTF-2, не нашлось.
  N-1: >-
    ЗАКРЫТО. (7): если файла нет или он не разобрался, это красный с именем файла. Второй держатель
    назван: (1) и (2).
  N-2: >-
    ЗАКРЫТО. Ключ берётся из `required` шаблона Deployment края, имя задаёт замысел `issue-2917` З28.
    Литерала в пробе нет.
blocking_count: 0
blocking_kinds_distinct: []
non_blocking:
  N-1: >-
    [FORMAT] (7): «шаблон без `required` на ключе ручки — "не выполнилось"». Здесь тот же довод, что
    в закрытом N-1 круга 1: `required` в шаблоне края — продукт самой D6 (§7 NTF2-71 (е)). Поэтому
    его отсутствие после D6 — дефект, а не несозданное условие. По существу его держит (2): голый
    рендер обязан отказать с именем ручки. Стоит сказать, что (7) этого не держит и держит (2), как
    сделано для отсутствия файла. Смысл документа от этого не меняется.
  N-2: >-
    [FORMAT] §7 NTF2-71 (е), конец ячейки: «D6 гейт не расширяет, а печатает предпосылку». В той же
    ячейке и в §6б (6) в дельту D6 входит печать гейтом чартов, выпавших из осмотра. Это правка
    файла гейта, который завела D1s. Точнее было бы так: «D6 не расширяет гейт на форму
    `helm.values`; правка файла гейта — печать выпавших чартов и правило для `edge.yaml`». Посадке
    это не мешает: D6 начинается после вливания NTF-1 (Р16 п.1), так что одновременной правки
    файла нет.
orders:
  - to: design author (NTF-1)
    what: >-
      Повтор распоряжения круга 1, которое на @45d535e1e не исполнено. Строка D1s маршрута
      (`docs/changes/issue-2915/tasks.md`) и замысел З28 (г), N24, §13 Е12 (12) говорят: «D6 NTF-2
      пишет строку ручки в эти же файлы, второй формы подачи не заводит». Приёмка NTF-2 Р8 говорит
      другое: ключ ручки в корне лежит только в `notify-standalone/edge.yaml`, D6 заводит этот файл
      и его запись в `helm.values`, а `notify-standalone/values.yaml` ключа не несёт (§6б (5) —
      красный). Приёмка выше замысла, поэтому замыслу надо привести формулировки к ней.
  - to: design author (NTF-2, issue-2917)
    what: имя ключа ручки в значениях чарта края — в З28 (вход из §11 редакции 28).
