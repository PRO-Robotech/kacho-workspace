delta_items:
  CX2-100_R16_p8: >-
    ПРИНЯТО. Вместо одного образца через «или» стоят два отдельных счёта, каждый должен быть не 0;
    печатаются оба счёта и отпечаток NTF-1. На одобренной NTF-1 1bffe10d… измерено: путь флага → 3,
    SAN → 4. Это совпадает с замером автора. Дефект прежнего предиката снят: SAN больше не отвечает
    за путь флага.
  CX2-101a_NTF2-69e: >-
    ПРИНЯТО. В Given (е) есть `pending-max > Y`, оба числа печатаются, иначе «не выполнилось».
    Логика верна: отказ по ожидающим наступает при pending ≥ pending-max, а перед запросом Y+1
    висит ровно Y. Условие согласовано с (а)–(д): там `pending-max > account-per-day`. Умолчания Р8
    (200 > 50) его выполняют, так что «не выполнилось» по построению не постоянно. Адресаты разные,
    `<i>` в адресе, их число печатается: ось получателя не мешает.
  CX2-99b_NTF2-60g: >-
    ПРИНЯТО. Отрицание (вход и предъявление кода не режутся при исчерпанном HARD) стоит в паре с
    положительным близнецом (`recovery` того же S1 → RATE_LIMITED). Близнец отличается одним
    фактом, путём, и стоит после проверяемых запросов, так что подтверждает исчерпание на момент
    проверки. Иной ответ близнеца даёт «не выполнилось». Производитель — строка §7 «NTF2-60…63, 74,
    79, 71 (край)». Оба пути входят в состав полосы формы П6 (§5 П6, «Канал глаголов мимо края»:
    `login`, `recovery/complete`). Посредник считает запросы, поэтому утверждение «ответ дал kaname»
    измеримо. Строки §5, §6б Р5 и `…IP_HARD_*` обновлены согласованно.
