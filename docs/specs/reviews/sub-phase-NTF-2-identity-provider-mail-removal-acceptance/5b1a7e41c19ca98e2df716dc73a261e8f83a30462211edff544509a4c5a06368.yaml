non_blocking:
  - id: N-1
    kind: CONSTRUCTIBILITY
    text: >-
      В Given NTF2-60 A — «подтверждённый адрес A (П11)», а (г) входит «с A и его паролем». Пароль
      в Given не назван. Сейчас его выводят из строки П11 («вход … глаголом login»), но в kaname
      есть форма человека без пароля (вход без пароля). При следующей правке написать «человек П11
      с паролем и подтверждённым адресом A». Тогда фикстура П11 не построит A без пароля, и (г) не
      покраснеет на верной работе.
  - id: N-2
    kind: FORMAT
    text: >-
      Р16 п.8: подстановку `<модуль>` → `kaname` счёт не проверяет, он считает шаблон. Ключ модуля
      kaname назван в замысле NTF-1 (design.md issue-2915, ред. 35, CX1-111: `modules.kaname`), а
      в одобренной приёмке NTF-1 1bffe10d его нет: `grep -c 'modules\.kaname'` → 0. Довод «неизвестный
      ключ `--set` молча оставил бы флаг kaname true» ослаблен решением CX1-111: ключ под `modules`,
      которого нет в таблице, — отказ рендера с именем. Блокирующим это не является: неверный ключ
      проявится громко, а не молча. При правке NTF-1 под CX1-111 добавить третий счёт по
      `modules.kaname` или привести довод к новому замыслу.
