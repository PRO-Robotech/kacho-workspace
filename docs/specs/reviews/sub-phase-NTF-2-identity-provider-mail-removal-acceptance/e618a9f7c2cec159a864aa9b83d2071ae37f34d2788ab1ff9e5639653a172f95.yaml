blocking:
  B-1: >-
    [CONSTRUCTIBILITY] NTF2-31 (е)/(е') — единственный новый вход редакции и единственная проба
    решения Д39 «страж один, доведён до условия» — не построен. Given: «объявления профиля, по
    которым ссылка на удостоверение почты досталась бы объекту, отличному от notify-sender; форму
    объявления называет замысел issue-2917 (З22)». (1) В дереве такого объявления нет: удостоверение
    объявлено одним местом `global.kacho.identity.smtp.credentialSecret`
    (values.a8f60d.yaml:119–124 @96e2fa72b3a), а КТО его монтирует — решают шаблоны, не значения;
    страж места С1 — шаблон над `.Values`, чужого рендера он не видит. После NTF-2 (снят монтаж у
    kaname, строка 38 §3а) и kacho#1276 (снят поставщик) значения, которым «досталась бы» ссылка
    другому объекту, может не остаться вовсе — тогда условие стража вакуумно, а (е) не
    конструируем. (2) Отсылка ложна на измеренной ревизии замысла: З22 (docs/changes/issue-2917/
    design.md:1636, ревизия a0ad3a711) называется «Снятие почты поставщика личности (S6)», описывает
    страж листа под `courier` в шаблоне identity-provider-mail-guard.yaml (второй страж, запрещённый
    Д39; тот же путь — в таблице раскладки :2036) и распознаватель гейта рендера; формы значения
    для стража С1 в нём нет. Что сделать: назвать в самой приёмке конкретную форму входа (е) —
    ключ значений и объект, которому он передал бы удостоверение, существующий после NTF-2 и
    kacho#1276, — и её законного близнеца (е'), отличающегося ровно одним фактом; либо, если такой
    формы не остаётся, записать, что правило «секрет только у notify-sender» держит гейт рендера
    NTF2-30/31 (а, б, д), а страж С1 доводится лишь до снятия читателя kaname, и снять (е). Отсылку
    к З22 заменить либо убрать.
  B-2: >-
    [PRODUCER] Объект, на котором стоит весь S7, — развёртывание notify-sender — приписан не тому
    производителю. §7 (строка NTF2-01…94 «доставка») и §0 S7 называют «kacho/services/notify
    (развёртывание notify-sender) — NTF-1 (kacho#2915)». Но NTF-1 развёртывания notify-sender не
    заводит: в одобренной приёмке NTF-1 слов notify-sender и notify-api 0
    (`grep -c 'notify-api' <NTF-1>` → 0), а её замысел пишет прямо: «Раздельные развёртывания
    notify-sender и notify-api … — предмет NTF-3 и NTF-4» (docs/changes/issue-2915/design.md:173–175,
    Д20 — на него же ссылается заголовок S7). Раздвоение заводит NTF-3 Р8 («notify — одна служба,
    два развёртывания», NTF3-127). Условия начала Р16 требуют только NTF-1, и Р16 ставит NTF-2 в
    первую волну вместе с NTF-1. При NTF-1 без NTF-3 объект notify-sender в рендере отсутствует:
    NTF2-30 «в цепочке, объявляющей удостоверение, notify-sender со ссылкой — ровно 1» и §0 п.3
    красны на верной реализации, а проба П1 («объект notify-sender 1») останавливает стенд. Что
    сделать: назвать производителем notify-sender NTF-3 (kacho#2918, Р8) и добавить в Р16 условие
    «раздвоение NTF-3 влито» с командой и замером на 2798, либо сформулировать предикат §0/NTF2-30
    через объект-отправитель, который существует при любом порядке (единственное развёртывание
    notify до NTF-3, notify-sender после), с распознаванием по идентичности объявления.
non_blocking:
  N-1: >-
    §1.3 и §11: номера строк переставлены. `git show origin/367:internal/check/people_address_writers.go
    | grep -n 'глагол смены адреса вносится только вместе'` → :23; на origin/357 → :20. Документ
    пишет «:20 (на origin/357 — :23)» и в §11 «:23 → :20». Утверждение о гейте верно; исправить числа.
  N-2: >-
    §6б, строка «страж секрета почты один»: держатель — только предикат DoD п.14 по образцу имени
    файла `grep -cE 'mail.*guard'`, между посадками — «вниманием». Для запрета Д39 на дельту NTF-2
    этого хватает (запрещённое имя identity-provider-mail-guard.yaml образец ловит), но второй
    страж под другим именем (например, отказы о секрете почты внутри _notifications.tpl, который
    замысел заводит) образец пропустит. Предпочтительно — предикат по содержанию: число шаблонов
    `deploy/helm/umbrella/templates/`, чей `fail` называет удостоверение почты, = 1.
  N-3: >-
    Соседние документы расходятся с Д39 (не предмет этого круга, для диспетчера): одобренная NTF-1
    (строки 1330–1331) приписывает NTF-2 «снятие почты поставщика личности»; замысел issue-2917 З22
    и таблица раскладки (:2036) держат S6 и второй страж.
repeated_kinds_note: >-
  Род CONSTRUCTIBILITY встречался в кругах 1–4 и 1–3 проходов; здесь он относится к новому входу
  (е), внесённому этой редакцией, а не к прежнему классу «Given описан, но не посеян» — перепись
  §6в к стражу С1 не применялась. PRODUCER в последних кругах не встречался. Форму задания автору
  стоит дополнить: «вход инъекции называется ключом значений на измеренной ревизии, а не отсылкой
  к замыслу; производитель объекта предиката сверяется с приёмкой-производителем».
