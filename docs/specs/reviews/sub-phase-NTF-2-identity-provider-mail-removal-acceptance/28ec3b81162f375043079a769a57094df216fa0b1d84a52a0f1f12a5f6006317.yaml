blocking:
  B-1: >-
    [CONSTRUCTIBILITY] П6 описывает край закрыто: «звено ограничителя и ретрансляция полосы формы,
    собранные функциями корня края» (§5, строка П6). Два сценария на П6 идут через край путями,
    которых в этом составе нет. (1) NTF2-63, When: `GET /iam/v1/projects` сессией человека; Then:
    «200». (2) NTF2-69 (е), When: «через край `POST /iam/v1/users:invite`»; Then: `429`, `code` `8`,
    `Retry-After`. Оба пути — маршруты REST-шлюза края, а не полосы формы:
    `gateway/internal/middleware/rest_route_table_gen.go:136` (`/iam/v1/projects` →
    `ProjectService/List`) и `:177` (`/iam/v1/users:invite` → `UserService/Invite`) @6edea09c2ee. В
    перечне полосы формы (`login_lane_paths.go:91–118`) их нет. Чтобы пройти этими путями, нужны
    REST-маршрутизатор, проверка JWT по JWKS kaname, список разрешённого
    (`allowlist/list.go:274`), запись каталога прав `iam.users.invite` со своей проверкой и
    обработчик ошибок шлюза. Обработчик ошибок и есть производитель того, что утверждает (е): перенос
    метаданных `retry-after` в заголовок, полоса E1b (§7, строка NTF2-69 (е)). На П6 в нынешней
    редакции ничего из этого не собирается. Значит, Given (е) не строится, и её «Тогда» на П6 не
    имеет производителя. Редакция 28 этого дефекта не имела: состав края в ней не был ограничен.
    Сужение внесла Д68-правка этой редакции. Как исправить (одно из двух, выбор за автором):
    (а) включить в П6 состав края, обслуживающий эти маршруты (REST-шлюз корня края с цепочкой
    authN/authZ и обработчиком ошибок), и назвать, кто даёт JWKS и проверку прав: процесс kaname
    стенда. Положительный контроль тогда печатает смонтированные маршруты, и маршрута нет — значит
    «не выполнилось» с его именем. (б) перенести (е) на уровень, где край собран целиком.
    Например, E на П1: аккаунт П2, только что заведённый регистрацией, моложе `Ya` по построению,
    а `young-account-per-day` берётся из Р8. Для NTF2-63 перенести на П1 или сузить When до путей
    полосы формы, назвав держателя «`projects` без ограничителя». В обоих случаях поправить §5
    («как читается „Тогда“ на П6-k», последний пункт), таблицу «сценарий → стенд» и DoD п.8. Тем же
    проходом назвать в П6 канал глаголов, которые не идут через край: NTF2-90 (22 глагола, среди
    них `ForceLogout` на внутреннем слушателе, `ResetSecondFactor`, регистрация ключа входа), 91,
    92, 93, 96. У процесса kaname это внешний gRPC-слушатель с сессией от `login` и внутренний с
    сертификатом стенда (N-6). Сверку класса провести по When каждого сценария на П6 против
    состава П6, а не только по Given.
non_blocking:
  N-1: >-
    [FORMAT] §7, строка NTF2-06, последний столбец: «подъём сервера ленты kaname с сертификатом из
    `kaname.spiffe`». Это единственное место вне §11, где остался старый путь. По CX1-106 надо
    `global.kacho.spiffe.kaname`, как в Р1, П4, NTF2-53 и DoD п.3.
  N-2: >-
    [PRODUCER] NTF2-06 на П6: «вызовов `Claim` на сервере ленты kaname 0», «вызовов `ResolveSend` у
    kaname по пространству `kaname` 0». На П6 kaname — внешний процесс, а записывающий посредник
    стоит только на ребре край → kaname. Источник счёта надо назвать: метрики клиента `notify`
    (счётчик вызовов `ResolveSend`, которым NTF1-G22 утверждает «0», и метрики notify из NTF1-L01) и/или аренда
    строки в базе kaname. При исполнении — «не выполнилось», если источник не печатает пространство.
  N-3: >-
    [FORMAT] П6: «ревизия читается из подписи образа». В дереве kaname @a59862664 подписи нет
    (`--provenance=false`, cosign не используется). Есть метка `org.opencontainers.image.revision`,
    файл `/etc/kacho/image-revision` (`Dockerfile:130–132`) и ряд `kaname_build_info`
    (`serve.go:259`). Слово надо заменить на «метка». И ещё: образ публикуется только для `main`,
    тегов и голов линий, которые служат базой запроса (`docker-build.yml`, шаг «гейт … посаженности»).
    Если пин kacho стоит не на опубликованной голове, все сценарии П6 получают «не выполнилось».
    Это стоит назвать условием в Р16, иначе П6 может молча не исполниться ни разу.
  N-4: >-
    [OPEN-QUESTION, дефолтабельный] NTF2-53 (б), Р4 и Р16 п.6 опираются на путь
    `global.kacho.notifications.modules.<м>.enabled`. Одобренная приёмка NTF-1 его ещё не называет:
    в worktree он не встречается ни разу, правку несёт W4a маршрута issue-2915. §11 это признаёт.
    Порядок держится маршрутом: D2 NTF-1 ждёт W4a, NTF-2 начинается после NTF-1 (Р16 п.1). Если
    утверждение тихо разойдётся, рендер это не скроет: неизвестный ключ `--set` даст у kaname `true`,
    и (б) покраснеет. Фиксирую дефолт: путь NTF-2 = путь, который одобрит W4a. Если одобрен другой,
    это возврат в приёмку NTF-2, а не правка пробы. Рекомендую внести это строкой в Р16.
  N-5: >-
    [FORMAT] §3б, строка группы `.github/scripts/, tests/authz-fixtures/, tests/newman/`: наследники
    «NTF2-01, 02, 03, 19, 43 на П1». В таблице файлов ниже наследников шесть, там есть ещё 94.
  N-6: >-
    [COVERAGE] Наследник снятого newman-кейса kaname называется в сообщении коммита. Сообщение
    коммита как держатель слабее, чем строка самого документа. Таблица наследования «кейс → сценарий
    NTF-2» прямо в §3б была бы проверяемой. Канал глаголов П6 — см. хвост B-1.
  N-7: >-
    [FORMAT] NTF2-68: «атрибуты строки ленты ссылки не несут (проба печатает их имена)». Точнее
    было бы сказать через типы NTF-1: в `notifications/mail-throttled/notification.yaml` нет
    атрибута типа `path` или `token`. Кнопка строится только из них (NTF-1, формат тела). Смысл от
    этого не меняется.
