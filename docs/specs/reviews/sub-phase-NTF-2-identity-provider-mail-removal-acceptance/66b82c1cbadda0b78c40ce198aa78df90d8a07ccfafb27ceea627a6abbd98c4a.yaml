prior_findings_closed:
  B-2: >-
    закрыт: исключение «запись ведомости без значения, отказ с именем ручки» снято из Р8 и §6б;
    запись края — `gateway/deploy|-f deploy/testdata/notify-standalone/edge.yaml`; ведомость
    утверждает код со слоем и код голого рендера (самоистечение), имя ручки в тексте отказа — только
    отрицание §6б (2); источник в переписи (1) — `edge.yaml` у каждого рендера. Посев подтвердил все три
    формы записи (см. constructibility (1)).
  N-1: >-
    закрыт: форма ключа одна на файл — `mail-node/` только под `api-gateway`, `edge.yaml` только в
    корне и без других ключей, `notify-standalone/values.yaml` ключа не несёт; держатель — §6б (5) с
    близнецом. Посев: файл формы `mail-node/` на рендере без зонтика → rc=1 с именем ручки.
  class_extension: >-
    автор сверх замечания нашёл второе место того же класса — скан получал бы значение через
    `helm.values`, которого гейт заглушек не судит (`assert-scan-stubs-hide-nothing.py` @`6edea09c2ee`,
    `scan_with` заменяет только `helm.set`, строки 93–96, 116–117 — прочитано); §6б (6) заказывает
    расширение гейта полосой D6 с инъекцией и близнецом. Посылка подтверждена чтением.
decisions_applied:
  D51: соблюдено (без изменений против кругов 1–2).
  D52: >-
    соблюдено: каждый рендер чарта края без зонтика (помощник `helmTemplate`,
    `edge_retired_knobs_render_test.go`, ведомость, сверка томов, два шелл-скрипта, IaC-скан) получает
    значение только слоем файла каталога фикстур NTF-1; без значения — отказ с именем ручки; значения
    в самом вызове нет. Файл `notify-standalone/edge.yaml` — новый файл NTF-2 внутри каталога NTF-1
    (как `ntf2-p7.yaml`, CX2-66), второго каталога фикстур не заводит; выбор файла и формы ключа замысел
    NTF-1 (Е12 (12)) отдаёт D6 NTF-2 — принято как дефолт ревью (defaults.Q1).
defaults:
  Q1: >-
    «второй фикстуры нет» (Д52) читается как «второго каталога и второго источника значения нет»;
    отдельный файл `edge.yaml` в `deploy/testdata/notify-standalone/` ему не противоречит, а
    строка ручки в `notify-standalone/values.yaml` была бы принятой и проигнорированной чартом
    `notify`. Если диспетчер читает Д52 как «ровно существующий файл NTF1-I06», — это вопрос к Д52,
    не дефект приёмки.
