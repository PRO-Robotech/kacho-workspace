return_to_acceptance_closure:
  RA-1: >-
    закрыт по существу, кроме одной посылки (B-1). Р20 называет производителя чтения узла
    global.kacho.identity.smtp чартом notify — NTF-2 (kacho#2917); §7 строки NTF2-24, NTF2-30…32,
    NTF2-34 переписаны; держатель — NTF2-34 с близнецами (а)↔(б), (а)↔(в), (г)↔(г'). Противоречия
    с NTF-1 нет: в одобренной NTF-1 и в её замысле ключа адреса ретранслятора нет вовсе
    (issue-2915/design.md §8 — только notify.smtp.sessionTimeout; NTF1-I06 перечисляет «флаг,
    перечень, spiffe, секрет»), так что путь global.kacho.identity.smtp.* второго узла не создаёт.
    П1 переписан верно: цепочка dev удостоверения не объявляет (values.dev.yaml @96e2fa72b3a —
    credentialSecret нет), прежний признак «ссылок 1» останавливал бы пробу на верной реализации.
    Незакрытая часть: «после kacho#1276 узел и полоса стенда остаются» — утверждение об исходе
    чужой посадки без предиката, при этом DoD п.13 запрещает NTF-2 трогать values.dev.yaml (B-1).
  RA-2: >-
    закрыт по намерению, но предикат DoD п.16 не исполняет сказанное правило (B-2).
