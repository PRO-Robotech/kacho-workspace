blocking:
  B-1: >-
    [CONSTRUCTIBILITY] Given NTF2-34 (а) и посев П1 держатся на полосе стенда в
    helm/umbrella/values.dev.yaml (global.kacho.identity.smtp: connectionURI
    'smtp://{{ .Release.Name }}-mailpit:1025/', trustAnchorSecret kacho-mailpit-tls/ca.crt —
    values.dev.yaml:121–133 @96e2fa72b3a). Этот файл — строка 3 §3а с исходом «за kacho#1276», и
    DoD п.13 требует `git diff --name-only <B> <H> -- <24 пути>` → пусто, то есть NTF-2 файл не
    трогает ни при каком исходе. Р20 и DoD п.13 утверждают «после kacho#1276 узел и полоса стенда
    остаются», но это исход чужой посадки, у которого нет ни предиката на базе старта, ни держателя.
    Полоса чтения узла (NTF2-34) по Р16 п.4 не ждёт kacho#1276 и может сесть до или после него; а
    kacho#1276 судит себя предикатом «0 строк hydra|kratos|oryd/ в values*.yaml, включая
    комментарии» (тело kacho#1276, п.1), и блок узла в values.dev.yaml несёт такие строки
    (:79 «у kratos.deployment», :84 «kacho-umbrella-pg-kratos»). Если kacho#1276 снимет узел вместе
    с блоком, у NTF2-34 (а) и П1 входа не останется, а исправить его NTF-2 запрещено DoD п.13 —
    сценарий неверен на верной реализации. Что сделать: либо добавить в Р16 условие начала для
    полосы чтения узла — команда на <B> вида `git show <B>:deploy/helm/umbrella/values.dev.yaml |
    yq '.global.kacho.identity.smtp | [.connectionURI, .trustAnchorSecret.name, .trustAnchorSecret.key]'`
    (все непусты, адрес — выражение над .Release.Name), с исходом «нет — возврат в приёмку»; либо
    назвать в DoD п.13 исключение: NTF-2 вправе править в values.dev.yaml ровно узел
    global.kacho.identity.smtp (предикат — дифф файла ограничен этим узлом), если kacho#1276 его
    снял.
  B-2: >-
    [DoD] DoD п.16, новое исключение: файл §3а, отсутствующий на <B>, — исход kacho#1276, если
    `git log --diff-filter=D … 96e2fa72b3a..<B> -- deploy/<путь>` «называет коммит, достижимый из
    вливания kacho#1276 в ветку эпика релиза». Достижимость из вливания выполняет любой предок
    вливания, включая коммиты других посадок, влитых раньше kacho#1276 в том же диапазоне; тот же
    пункт требует «файл, снятый другой посадкой, — возврат в приёмку», а предикат этот случай
    пропускает. Замер @96e2fa72b3a: вливание 96e2fa72b3a (#2926) и коммит снятия 5f689f36438
    (#2858, удаление под deploy, влит раньше через 87329e2935c) — `git merge-base --is-ancestor
    5f689f36438 96e2fa72b3a` → да, `git rev-list 96e2fa72b3a^1..96e2fa72b3a | grep -c 5f689f36438`
    → 0. Что сделать: заменить «достижимый из вливания» на «внесённый вливанием»: коммит снятия
    входит в `git rev-list <M>^1..<M>` (M — коммит вливания kacho#1276; при сжатом вливании — сам M),
    и назвать, как находится M (например `git log --first-parent --grep '#1276' <B>`).
non_blocking:
  N-1: >-
    NTF2-34 (г)/(г'): «перепись путей значений, из которых шаблоны чарта notify берут почтовую
    полосу» не говорит, чем гейт узнаёт, что выражение шаблона питает адрес полосы. Строковый
    поиск по .Values.* в шаблонах даст ложные находки (notify.smtp.sessionTimeout законен) и
    пропуски (ключ, собранный в переменной; тот же класс, что CX2-48 (а)). Предпочтительно назвать
    идентичность: подстановка сигнального значения в узел и в каждый иной путь значений и сверка,
    какой путь доезжает до поля адреса полосы в рендере (форма (б), расширенная на все пути).
  N-2: >-
    Р20 не называет исход для цепочки, где чарт notify включён, а узел пуст (values.yaml:572–575 —
    connectionURI "", так в prod-цепочках без слоя учётных данных). Отказы по узлу — только страж,
    а страж на полностью пустой узел не падает (identity-mail-lane-guard.yaml:268 — только при
    включённом приёмнике). В NTF-1 ручки адреса ретранслятора нет (issue-2915/design.md §8), так
    что «notify без полосы» — ни отказ рендера, ни отказ старта по имени ручки. Стоит назвать
    исход одной фразой (чей он: NTF-1 отказ старта notify либо NTF-2 рендер) — иначе это
    «принято-и-проигнорировано» на уровне установки.
  N-3: >-
    NTF2-34 (д): самостоятельная поставка чарта notify не несёт стража (он в зонтике), значит
    правила пары «имя пользователя в адресе ⇔ источник удостоверения» (страж :197, :200) при
    самостоятельной поставке никто не держит. Р20 «отказы по узлу — только страж» верно для
    зонтика; для NTF1-I06 стоит сказать прямо, что правила пары там не проверяются, либо кто их
    проверяет.
repeated_kinds_note: >-
  CONSTRUCTIBILITY встречался в круге 1 редакции 14 (вход (е) без формы); здесь тот же род, но
  другой признак: Given держится на исходе чужой посадки (kacho#1276), без предиката на базе
  старта. Этот признак уже был: RA-1 разбора классов прямо называл «DoD п.13 запрещает править
  values.dev.yaml, где лежит полоса dev», а ответ «правка не нужна» опирается на неизмеренное.
  DoD как род в последних кругах не встречался. В форму задания автору стоит внести: «утверждение
  об исходе соседней посадки (kacho#1276, NTF-1, NTF-3) в Given или DoD несёт команду на <B> и
  исход при её несовпадении; предикат о происхождении коммита выражается диапазоном `M^1..M`,
  а не достижимостью».
