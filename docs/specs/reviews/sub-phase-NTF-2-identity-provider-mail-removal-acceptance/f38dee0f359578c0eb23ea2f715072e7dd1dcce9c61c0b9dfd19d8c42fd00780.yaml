blocking_count: 1
blocking_kinds_distinct: [COVERAGE]
blocking_kinds_by_item:
  - B-1 COVERAGE
blocking:
  B-1:
    kind: COVERAGE
    where: >-
      Р4 («единый отказ corelib `feed.DeliveryNotConfiguredStatus()`… своего текста и своего `reason`
      у kaname нет»); NTF2-51 Then («побайтово тот же отказ, что у фикстурного глагола NTF1-N06:
      производитель один, corelib»); §6б строка Р4; §7 строка NTF2-51
    text: >-
      Правило «производитель отказа флага один — corelib; у kaname своего текста и `reason` нет» — суть
      возврата К2 — не имеет держателя, способного упасть. NTF2-51 утверждает литералы текста и
      `reason`: реализация, где глагол kaname собирает статус сам с теми же строками, NTF2-51 проходит, а
      при следующей правке текста в corelib молча расходится с ним. Добавленная фраза «побайтово тот же
      отказ, что у фикстурного глагола NTF1-N06» исполнена быть не может: NTF1-N06 — другая проба
      другой под-фазы над фикстурным источником и статусом gRPC, NTF2-51 — HTTP-ответ края на стенде
      П6-off; сравнивать нечего и нечем. Такая клауза — утверждение без построения.
    required: >-
      Держатель единственности производителя, способный упасть, например: (1) в NTF2-51 — текст и
      `reason` сравниваются с полями значения `feed.DeliveryNotConfiguredStatus()` из corelib пина
      kaname, проба печатает оба, а не с ответом чужой пробы; (2) гейт дерева kaname (уровень G, П8):
      не-тестовых литералов `email delivery is not configured` и `NOTIFICATION_DELIVERY_NOT_CONFIGURED`
      в kaname — 0, каждый глагол перечня Р4 зовёт `feed.DeliveryNotConfiguredStatus()` — число мест
      печатается, пустой обход — красный; инъекция — копия литерала в глаголе → красный с координатой;
      близнец — дерево как есть → зелёный; строки §6б, §7 и DoD п.6 — дописать. Либо снять из Р4
      утверждение «своего текста у kaname нет» и клаузу о NTF1-N06 — тогда К2 закрыт только
      равенством литералов, и это следует сказать явно.
non_blocking:
  N-1: >-
    NTF2-06 / П4: подмена сертификата сервера ленты kaname не должна задеть путь край → kaname, иначе
    `200 {}` шага When не наступит по причине фикстуры. Край сверяет SAN сервера с `ServerName`
    (`gateway/internal/config/config.go:675`, 969 @6edea09c2ee). Назвать в П4, что меняется только SAN,
    по которому `notify` сверяет запись перечня (SPIFFE-идентификатор из `kaname.spiffe`), а имя,
    которое сверяет край, остаётся; либо что подмена касается только слушателя ленты. Проба печатает
    оба SAN.
  N-2: >-
    Р14 «строки остаются `pending` и живут по своему сроку (NTF2-06)» — NTF2-06 срока не утверждает.
    Либо дописать шаг `expires_at + 1 с` с исходом строки и судьбой вклада окна (по NTF-1 Р10 возврат
    решается причиной последнего `DEFER`; без `Claim` `DEFER` нет), либо снять ссылку на NTF2-06.
  N-3: >-
    Р5 называет три повода `503`, включая «ожидание ключа дольше предела звена»; NTF2-59 строит только
    остановку хранилища. Держатель третьего повода есть в замысле (проба «ожидание блокировки дольше
    `lock_timeout` → `StoreUnavailable`», design.md З8) — назвать его в §6б, чтобы утверждение Р5 не
    осталось без держателя в приёмке.
  N-4: >-
    NTF2-59, близнец: отличается от отрицания двумя фактами — состоянием хранилища и источником
    (`S5` вместо `S4`). При неисправном хранилище счёт `S4` не пишется; если смена источника нужна
    (например, хранилище пробы теряет состояние при остановке), сказать почему. NTF2-58 (б): бюджет
    `Bs` обязан отсчитываться таймером страницы, а не внутри `Worker` — `page.clock` часов `Worker` не
    ведёт; назвать это условием П12.
  N-5: >-
    К1 решён запасным путём Д2 — прочтением «по смыслу» (MRW-1 Р1 запрещает любую служебную запись
    службы доступа). Разбор классов issue-2917 называл выбор прочтения вопросом; одобренная NTF-1
    сделала тот же выбор, так что две приёмки теперь согласны. Замысел issue-2917 (З21, строка К1
    §0.1, Е1 §13) держит основной путь и обязан быть переписан. §1.5 и §4 стоит закрепить отпечаток
    NTF-1, с которым сверено (05828e42…), — в ветке уже редакция 16 NTF-1 (390b5a33…), вердикта на
    неё нет.
  N-6: >-
    Р8 «лимит шаблона `invite` — 50» — единственное число лимита шаблона в приёмке; правило «лимит
    шаблона не меньше наибольшего пропуска окна по границам Р8» для `recovery`, `verification`,
    `registration`, `registration-existing` (иначе лимит шаблона отрезал бы пол) держит только
    замысел (З19, И14). Строка §6б со ссылкой на держатель замысла сделала бы связь видимой.
repeated_kinds_note: >-
  Первый круг на редакции 12. Род COVERAGE встречался в прошлых кругах (правило без держателя);
  B-1 — тот же класс на новом правиле, внесённом правкой К2. Шаг формы задания автору: каждое новое
  утверждение о единственности («производитель один», «своего нет») получает гейт дерева с
  инъекцией-копией, а не сравнение с выводом чужой пробы.
