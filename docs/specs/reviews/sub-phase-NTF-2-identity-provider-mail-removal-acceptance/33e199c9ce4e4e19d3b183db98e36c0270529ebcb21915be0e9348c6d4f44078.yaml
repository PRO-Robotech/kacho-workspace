blocking:
  B2-1:
    kind: CONSTRUCTIBILITY
    where: NTF2-81 Given (П2), §5 П2; также NTF2-75 близнец (занятый адрес `A`)
    text: >-
      П2 строится исходом NTF2-80: `register` на адрес `A` ставит письмо `registration` в окне
      (`A`, `registration`). По Р6 одна строка окна считает письма `registration` и
      `registration-existing`, и сброса окна подтверждением документ не объявляет. NTF2-81 шлёт
      `register` на тот же `A` без ожидания: если с первого письма прошло меньше
      `first-pause` (граница ≥ 30 с, ориентир 60 с; путь П2 — письмо в бюджете до 60 с и
      подтверждение), исход — `cooldown`, письма нет, а «Тогда» требует ровно одно письмо
      `registration-existing`. Сценарий красен на верной реализации в зависимости от
      скорости прогона. Тот же вопрос у близнеца NTF2-75: как построен занятый адрес `A` и
      чист ли его окно `registration` к началу ряда — не названо.
    required: >-
      Назвать построение: либо окно адресата сбрасывается заведением учётной записи (тогда это
      правило Р6/Р9 и ему держатель), либо Given NTF2-81 ждёт `first-pause` от письма П2
      (значение печатается), либо П2 для NTF2-81 строится посевом без `register`. Для NTF2-75
      назвать построение занятого адреса с чистым окном.
  B2-2:
    kind: CONSTRUCTIBILITY
    where: NTF2-90 «Тогда», третье утверждение; When — строка `user.second_factor_reset`
    text: >-
      «Проба печатает число событий таблицы и число доставленных писем; они сходятся с числом
      адресатов таблицы». Предписанный When порождает письма сверх таблицы: повторное
      заведение фактора перед `user.second_factor_reset` — событие
      `user.second_factor_enrolled` из карты Р3 (производитель измерен: kaname @734f69fb4
      `internal/apps/kaname/api/humansession/sf_enroll.go:296`), то есть лишнее письмо
      `second-factor-changed`; входы `U` для собственных глаголов дают `session.issued`
      (`humansession/issue.go`) и по Р12 — письма `new-device-login`; строка
      `user.recovery_completed` через восстановление ставит ещё и письмо `recovery`. На верной
      реализации равенство ложно.
    required: >-
      Сузить счёт до пар (событие строки таблицы, адресат) — «для каждой строки таблицы писем
      её шаблона по её событию ровно столько, сколько адресатов строки», — либо внести в
      таблицу все порождаемые пробой события (включая повторное заведение и входы) и
      пересчитать.
  B2-3:
    kind: CONSTRUCTIBILITY
    where: NTF2-72 близнец; §5 «Состояние, общее для кейсов»
    text: >-
      Близнец требует «источник, не достигший порога» на стенде П1. По §5 счётчики края по
      источнику на П1 общие для всех кейсов прогона, а порог «без проверки» — 3 за 15 мин
      (ориентир Р8); кейсы E (NTF2-43, 80…85, П2 каждого кейса) шлют анонимные почтовые
      запросы с того же источника прогона. Как на П1 получить второй источник либо
      гарантировать, что близнец идёт раньше всех анонимных почтовых запросов окна, документ
      не называет. Положительный близнец не строится — отрицательное утверждение
      (вызов решён прозрачно) неотличимо от «экран всегда шлёт доказательство».
    required: >-
      Назвать конструкцию близнеца: отдельный источник консоли через доверенный прыжок стенда
      (как построен и где объявлен), либо перенос близнеца на уровень I со своим краем, либо
      порядок с печатью счётчика источника перед близнецом и исходом «не выполнилось», если
      порог уже достигнут.
  B2-4:
    kind: FORMAT
    where: NTF2-70 (б); NTF2-78 (в)
    text: >-
      «(б) `200 {}` без строки (исход `capped` либо `floor` по ряду NTF2-65)» и «(в) … строки
      `recovery` нет (исход `capped` либо `floor` …)». Исход `floor` по Р6 и NTF2-65 — это
      поставленная строка; «без строки» и «либо floor» взаимоисключают друг друга, а момент
      запроса относительно пола Given не фиксирует. «Тогда» недетерминировано: реализация,
      поставившая строку пола, красна по первой части и зелена по второй.
    required: >-
      Зафиксировать момент часами пробы (например, `Tc + 1 ч`, строго до `Tc + Fl`) и
      утверждать один исход `capped` без строки.
  B2-5:
    kind: NEGATIVE
    where: Р11 последний пункт; DoD п.11; §6б строка Р11
    text: >-
      Р11 объявляет: справочник подтверждённых адресов и разрешение «владельцы аккаунта» /
      «администраторы облака» — внутренние методы kaname, вызывать их может только
      `service:notify` (закрытый перечень, Д2). Методы отдают подтверждённые адреса людей.
      Ни один сценарий не утверждает отказ вызывающему, отличному от `notify`; §6б (строка Р11)
      называет держателями NTF2-92, 93, 96 — ни один не упадёт, если метод открыт любой службе
      с проверенным сертификатом. DoD п.11 требует свойство без пробы.
    required: >-
      Сценарий уровня I по образцу NTF2-46: вызов справочника адресов и разрешения адресатов
      сертификатом службы, отличной от `notify`, — `PERMISSION_DENIED` (`code` `7`), адреса в
      ответе нет; близнец — тот же вызов сертификатом `notify` возвращает адрес. Строку §6б
      Р11 и DoD п.11 сослать на него.
  B2-6:
    kind: COVERAGE
    where: Р5 п.2 («адрес источника край берёт по числу доверенных прыжков»); §6б строка Р5 «доверенные прыжки»
    text: >-
      Правило ключа источника держит только страж старта NTF2-71 (е) — «число задано». Что
      ключ — адрес, взятый ровно на доверенной глубине, а не заявленный клиентом, не судит ни
      один сценарий: все пробы края П6 сами задают адрес источника через прыжок стенда, и
      NTF2-60/61/74 останутся зелёными на реализации, которая берёт ключ из любой позиции
      заголовка. §6б объявляет класс COVERAGE закрытым, а эта строка держателя, способного
      упасть, не имеет.
    required: >-
      Сценарий уровня I: запросы с одного доверенного прыжка, несущие разные значения в
      недоверенной части цепочки адресов, считаются одним источником (после порога — вызов
      PoW); близнец — разные адреса на доверенной глубине считаются разными источниками.
      Формулировать как требование, без описания обхода (публичный репозиторий).
important:
  I2-1: >-
    Р5 включает `register/confirm` в перечень ограничителя потому, что он «анонимен и
    принимает код»; тот же довод относится к `recovery/complete`, которого в перечне нет, а
    NTF2-63 утверждает, что ограничитель прочих путей не трогает. Либо включить путь, либо
    назвать основание отличия строкой решения.
  I2-2: >-
    Р6/Р8: у потолка неудач адреса (`address-failure-ceiling`) не назван срок действия и
    исход по его истечении для устройства без метки. Если потолок не истекает, он отрезает
    владельца без метки устройства от восстановления — назвать окно и держатель («после окна
    `K` с устройства без метки — `200`»).
  I2-3: >-
    Р9: исход повтора `register` тем же паролем после истечения кода записи (запись с истёкшим
    кодом — «жива» или нет, новый код в той же записи или новая запись) не определён; сценария
    нет. Назвать один исход.
  I2-4: >-
    NTF2-51 (в): порядок проверок при выключенном флаге и негодном пароле (что первым —
    `INVALID_ARGUMENT` о пароле или `MAIL_DELIVERY_DISABLED`) не назван.
  I2-5: >-
    Гигиена круга: записи прежних кругов этого каталога в рабочей копии изменены относительно
    закоммиченных (`git diff --stat` показывает правку `content_commit_note` в 4 записях).
    Записи ревью только дописываются; правку следует откатить тем, кто её внёс. Эта запись их
    не трогала.
