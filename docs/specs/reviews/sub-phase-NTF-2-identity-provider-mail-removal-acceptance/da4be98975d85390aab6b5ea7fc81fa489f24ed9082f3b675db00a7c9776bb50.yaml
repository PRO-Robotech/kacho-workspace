blocking:
  - id: B4-1
    kind: CONSTRUCTIBILITY
    summary: >-
      NTF2-90, строка 22 (`account.deleted`): удаление `acc` отвергается, потому что в `acc` остаются
      сервисный аккаунт `sa` и группа `g` из Given; таблица построения называет условием только «аккаунт
      без проектов» и ни `sa`, ни `g` не снимает.
    evidence:
      - >-
        NTF2-90 Given: «сервисный аккаунт `sa` в `acc`; группа `g` в `acc`». Таблица построения, строка 22:
        «аккаунт без проектов (`account_service.proto`, комментарий `Delete`) · проект снят строкой 21».
        Глаголов снятия `sa` и `g` в таблице и в вспомогательных шагах нет.
      - >-
        internal/repo/kaname/pg/account_repo.go:336-341 (одинаково на 0dd03218a613, cbd729cfa, 33010d434):
        `DELETE FROM accounts a WHERE a.id = $1 AND NOT EXISTS (… projects …) AND NOT EXISTS (SELECT 1 FROM
        service_accounts WHERE account_id = $1) AND NOT EXISTS (SELECT 1 FROM groups WHERE account_id = $1)
        AND NOT EXISTS (… roles …)`; при has_sas → FailedPrecondition «Account %s contains service accounts
        and cannot be deleted», при has_groups — «… contains groups …» (account_repo.go:368-373 @33010d434).
        Комментарий proto говорит только о проектах — построение сверено с комментарием, а не с оператором.
    consequence: >-
      Операция `Delete` строки 22 заканчивается ошибкой; события `account.deleted` нет, строк 0 ≠ 1 —
      проба либо красная, читаемая как дефект продукта, либо («синхронный отказ … — не выполнилось»)
      никогда не утверждает строку 22, и вид `account.deleted` карты Р3 остаётся без держателя.
    required: >-
      Перед строкой 22 снять `sa` и `g` (вспомогательные события, выведенные из счёта, как повторное
      заведение фактора; снятие группы — после строки 5 и с учётом её привязки) либо построить их вне `acc`
      так, чтобы строки 5, 8, 9 сохраняли адресата `O`; назвать в таблице построения условие отказа
      удаления аккаунта по оператору репозитория (проекты, сервисные аккаунты, группы, роли). Попутно —
      проект, на который выдаётся роль в строке 3 и который снимается строкой 21, в Given не назван
      («проект `acc`»): назвать его и его построение (`ProjectService.Create` сессией `O`, П11).
  - id: B4-2
    kind: CONSTRUCTIBILITY
    summary: >-
      NTF2-100, положение «адресата нет» (новое в редакции 38): `C1` блокирует `O` через
      `UserService.Block`, но право `C1` на это (`identity_suspender` на `iam_user:O`) в построении не
      выводится — оно идёт только через указатель `iam_user:O#account`, а `O` в Given не член ни одного
      аккаунта, и `AccountService.Create` такого указателя не пишет.
    evidence:
      - >-
        user_service.proto:384-393 @33010d434: Block — `required_relation = identity_suspender`, объект
        `iam_user` из `user_id`. fga_model.fga:779: `define identity_suspender: super_admin from account`;
        :308 (type account): `define super_admin: any_admin from cluster`. Ветви облака напрямую на
        `iam_user` нет — только через указатель `account`.
      - >-
        Указатель `account:<A>#account@iam_user:<U>` пишут только internal_upsert.go:634 (личный аккаунт
        при первом входе) и invite.go:668-676 (членство); account/create.go пишет указатель лишь на
        `iam_access_binding` (create.go:93, :122), не на `iam_user` владельца.
      - >-
        NTF2-100 Given: `O` и `X` — люди П11 («той же формы, что П10»); П10 личного аккаунта и членства не
        называет; `acc` создан сессией `O`, членства `O` нет. В NTF2-90 строка 20 исполнима, потому что `U`
        — член `acc` (членство пишет указатель), — для `O` в NTF2-100 такого построения нет.
    consequence: >-
      `Block` получает `PERMISSION_DENIED`; по правилу П11 это «не выполнилось», и положение «владелец
      заблокирован — строк 0, разрешитель «адресата нет»» — единственный поведенческий держатель ветви
      «не ACTIVE» разрешителя владельца (Р11, DoD п.11) — на построении не исполняется никогда.
    required: >-
      Назвать построение, дающее `C1` право `identity_suspender` на `iam_user:O` (например, у людей П10/П11
      — личный аккаунт с указателем, либо `O` — член аккаунта, где `C1` — администратор облака по
      указателю `cluster`), с координатой в дереве kaname; перед `Block` — шаг ожидания
      `AuthorizeService.Check` (`identity_suspender`, `iam_user:O`) по П11. Проверить тот же вопрос для
      всех `Block`/`ResetSecondFactor` документа (NTF2-90 строки 15, 20; NTF2-92 (г)) и записать, через
      какой указатель исполним каждый.
