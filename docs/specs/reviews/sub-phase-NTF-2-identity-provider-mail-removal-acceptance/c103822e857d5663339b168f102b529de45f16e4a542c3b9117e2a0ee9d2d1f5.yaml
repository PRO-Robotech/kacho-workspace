blocking:
  B-1: >-
    [CONSTRUCTIBILITY] Контроль Р16 п.6 (2) — «`prod` как есть, без `--set`: код 0, объектов чарта
    `notify` 0 (перечень пуст, NTF-1 отказа не производит)» — ложен в каждой точке, где условие
    обязано исполняться. Редакция 22 сделала п.6 условием «полосы, несущей гейты NTF2-24 и NTF2-34»
    (закрытие N-3) и велит исполнять команды «на базе старта и повторно на базе запроса волны». Эта
    полоса по маршруту — D3 (NTF2-24 в строке D3 `docs/changes/issue-2917/tasks.md:169`), а D3 зависит
    от D1 (там же, колонка «зависит от»: D1, D2). D1 вносит «строку kaname в помощнике флага и таблице
    источников» — ту самую запись kaname в перечне `prod`, которая по признаку 9 делает `prod` с
    пустым узлом отказом рендера. Значит, на базе полосы D3 (или, самое позднее, на базе запроса её
    волны) `prod` как есть на ВЕРНОЙ работе NTF-1 и D1 даёт код не 0 с текстом о
    `global.kacho.identity.smtp.connectionURI`, контроль расходится, и исход «не выполнено — возврат
    в приёмку» наступает на правильной работе. Та же фраза Р16 п.2 «на базе старта (NTF-1 посажена,
    NTF-2 нет)» неверна для этой полосы: её база несёт D1. Это признак 9 §6в, применённый к
    утверждению условия, но не к его контролю — перепись признака 9 строку «Р16 п.6 (2)» закрыла
    исходом «контроль — `prod` как есть, код 0», не сверив момент контроля с порядком полос своего
    маршрута. Что сделать: привязать контроль к наличию записи kaname на базе, а не к названию базы.
    Например: предпосылка печатается командой (число источников kaname в перечне `notify` рендера
    `prod` с П7-узлом: 0 или 1); при 0 — контроль как сейчас (код 0, объектов `notify` 0); при 1 —
    контроль «`prod` как есть → отказ с именем `connectionURI`» (он же NTF2-34 (е)), и положительный
    вариант с `--set notifyProbe.*` становится избыточным, но не ложным. Р16 п.2 — назвать базу
    полосы D3 «NTF-1 и D1 NTF-2 посажены».
non_blocking:
  N-1: >-
    Р16 п.6 ссылается: «маршрут `docs/changes/issue-2917/tasks.md` называет её» (полосу гейтов NTF2-24
    и NTF2-34). Маршрут @a0ad3a711 называет NTF2-24 (D3) и не называет NTF2-34 ни в одной полосе
    (`grep -nE 'NTF2-[0-9, …–-]*\b34\b' docs/changes/issue-2917/tasks.md` → только D3 по «24»; строки
    с 34 нет). Маршрут отстаёт от приёмки (редакция 9 замысла); либо назвать полосу NTF2-34 здесь,
    либо заказать правку маршрута — иначе условие п.6 не приписывается однозначно.
  N-2: >-
    DoD п.16 («файл без строки … — возврат в приёмку») и хвост §3а («гейт, красный потому, что
    рендерит `prod` без узла после записи kaname, — не строка таблицы, адресат — задача NTF-1»)
    называют разные исходы одного красного. Пересверка NTF-1 (3ff4bcf15, CX1-86) измерила, что
    перепись гейтов обхода D2 NTF-1 видит только `deploy/*_test.go` и не видит 10 файлов Go вне
    `deploy/` и 17 шелл-гейтов `deploy/tests/helm`, рендерящих каждую цепочку. Значит, на посеве
    «после NTF-2» такие красные будут; в п.16 назвать исключение §3а прямо (ссылкой), чтобы полоса D3
    не вернула приёмку по букве п.16.
  N-3: >-
    CX1-85 пересверки NTF-1: на живой раскатке `fe3455` адрес узла берётся из неотслеживаемого слоя
    учётных данных `cutover-fe3455.sh` (CRED_PATHS несёт `connectionURI`), а не из узла D2. Р16 п.6 (1)
    и NTF2-34 (а)/NTF2-24 для `fe3455` судят рендер цепочки дерева — это верный предмет NTF-2, но
    стоит одной фразой назвать, что раскатка площадки со слоем — предмет NTF-1 (CX1-85), а не этих
    сценариев. CX1-87 (образец формы `dev` роняет `prod`) П7-узел NTF-2 не задевает: он внешний, без
    якоря, с отправителем — форма, которую CX1-87 измерил как rc 0.
