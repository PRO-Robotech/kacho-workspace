decisions_applied:
  D51: >-
    соблюдено в пределах рендеров зонтика: в `values.yaml` зонтика и значениях чарта края ключа нет;
    поставляемый `prod` без значения — отказ с именем ручки; стенды — `1` файлом профиля; гейты рендера
    `prod` — каталог образцов NTF-1; DoD п.13 исключение для `values.dev.yaml` после `kacho#1276`.
  D52: >-
    НЕ отражено (B-1): документ не говорит, что рендер чарта края без зонтика подчиняется тому же
    правилу, и называет каталог фикстур узко — только `deploy/testdata/mail-node/`.
blocking_count: 1
blocking_kinds_distinct: [COVERAGE]
blocking_kinds_by_item:
  B-1: COVERAGE
blocking:
  B-1: >-
    [COVERAGE] Решение Д52 (граница Д51) не имеет в приёмке ни утверждения, ни держателя. Д52:
    рендер чарта края БЕЗ зонтика подчиняется тому же правилу — без `KACHO_API_GATEWAY_TRUSTED_HOPS`
    отказ рендера; гейты таких рендеров берут значение из каталога фикстур NTF-1 (включая
    `deploy/testdata/notify-standalone`), второй фикстуры нет. В редакции 24: Р8 п. «Ручка доверенных
    прыжков» говорит только о рендере `prod` и цепочек зонтика; «гейты рендера `prod` берут значение
    из одного каталога фикстур — каталога образцов NTF-1 `deploy/testdata/mail-node/`» — каталог назван
    уже, чем в Д52, а рендеры подчарта `gateway/deploy` без зонтика не названы вовсе; §6б строка Р8
    держателя для них не несёт; DoD п.7 их не требует. Рендеры эти существуют (замысел М67: семь
    семейств на `origin/2564` `6edea09c2ee`; перемер этой записью — `git grep -nE 'helmTemplate\('
    origin/2564 -- 'gateway/deploy/*_test.go' | wc -l` → 9 строк, из них одна — определение
    помощника; вызовы `helm` на каталоге края также в `.github/scripts/lint-service-charts.sh`,
    `.github/scripts/check-volume-mounts.py`, `deploy/tests/helm/iam-trusted-forwarder-test.sh`,
    `deploy/tests/helm/edge-keyset-hop-test.sh`). Молчание приёмки оставляет законной форму замысла
    З28 «Рендеры чарта края без зонтика» (б) — «синтетическое число рядом с прочими `--set`» в
    каждом рендере, — которую Д52 запрещает («второй фикстуры нет»). Что сделать: (1) Р8 — пункт
    «рендер чарта края без зонтика без значения ручки — отказ рендера с именем
    `KACHO_API_GATEWAY_TRUSTED_HOPS`; с значением — код 0» (одно незаданное обязательное значение, как
    NTF2-34 (е); близнец — тот же рендер со значением); (2) Р8 — каталог фикстур назван по Д52:
    каталог фикстур NTF-1 (`deploy/testdata/mail-node/` и `deploy/testdata/notify-standalone/`),
    гейты и рендеров `prod`, и рендеров чарта края без зонтика берут значение оттуда, своей фикстуры и
    инлайн-значения в вызове нет; (3) §6б строка Р8 — держатель: перепись рендеров чарта края без
    зонтика по механизму (вызов `helm` на `gateway/deploy`), печать числа осмотренных и источника
    значения у каждого, контроль — семейства М67; инъекция «рендер подаёт значение своим `--set`, мимо
    каталога» — красный, близнец — тот же рендер со слоем каталога — молчит; инъекция «рендер без
    значения» — отказ с именем ручки; (4) DoD п.7 — ссылка на этот держатель; (5) §7 — производитель
    строки ручки в файле каталога для рендеров без зонтика (та же полоса, что делает ручку
    обязательной, либо NTF-1 — по маршруту).
non_blocking:
  N-1: >-
    [PRODUCER] Р5 исключение: «если фиксация в этом окне успела, вызов истрачен: повтор того же
    доказательства получает `429` с новым вызовом, а запрос вошёл в счёт ключа источника». Держатель
    §6б строка Р5 (в) утверждает только `503` и метрику +1; последствие «повтор → `429`, счёт +1»
    никто не держит. На управляемом хранилище оно конструируемо: ответы хранилища теряются весь срок
    выяснения при применённой фиксации → `503`; хранилище восстановлено → повтор того же
    доказательства → `429` `PROOF_OF_WORK_REQUIRED` с новым вызовом; близнец — фиксация не применена →
    повтор пропущен. Рекомендую вариант (г) в строке Р5 §6б (механизм тот же, что NTF2-62 (в), — это
    и снижает до не блокирующего).
  N-2: >-
    [FORMAT] DoD п.22: «мест, называющих каждое из двух значений обязательным для `prod`, ≥ 1 — печать
    счёта по каждому» — без команды счёта. Назвать предикат (файл страницы поставки kacho и образец
    поиска по каждому ключу).
  N-3: >-
    [FORMAT] Р8 и DoD п.13 ссылаются на замер `origin/1276` `23f1e058a35`; ветка сдвинулась
    (`69ab1d3e17d` на момент этой записи). Перемер на новой голове даёт тот же вывод (ниже,
    measurement) — утверждение держится ревизией, правка не обязательна; при следующей редакции
    можно обновить координату.
