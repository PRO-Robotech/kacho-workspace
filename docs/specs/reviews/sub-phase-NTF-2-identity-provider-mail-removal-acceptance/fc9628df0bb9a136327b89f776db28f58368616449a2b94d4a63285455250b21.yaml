blocking_findings:
  - id: B1-1
    kind: CONSTRUCTIBILITY
    title: Стенд П1 (цепочка dev) не может нести ни одного сценария S1 через край
    coordinates:
      doc: "§5 П1, П2, П3; S1 NTF2-01…04, 06; близнец NTF2-10"
      tree:
        - project/kacho/gateway/cmd/api-gateway/main.go:252-262 (ретрансляция полосы формы поднимается только при посадке own)
        - project/kacho/gateway/internal/config/config.go:888 (ручка адреса полосы формы)
    measured: >-
      В рендере цепочки dev посадка личности края — external, ручки адреса полосы формы нет
      (0 вхождений); ручка есть только в цепочке own (1 вхождение). Значит, на П1
      `POST /iam/v1/auth/register`, `verify-email`, `verify-email/confirm` и `recovery` краем не
      ретранслируются, и `GET /iam/v1/auth/me` нашего носителя не читает.
    consequence: >-
      П2 и П3 на П1 не строятся; S1 и близнец NTF2-10 красные на верной реализации. При этом
      единственная цепочка с полосой формы (own) не несёт блока публичной поверхности поставщика
      в раздаче консоли, на который опирается S2. Одним стендом S1 и S2 сегодня не собрать.
    remedy: >-
      Назвать для S1 цепочку с посадкой own (либо сделать условием старта посадку own в dev —
      тогда это решение с основанием), а S2 вести изнутри кластера либо на цепочке, где блок есть.
      Каждое Given — с названной цепочкой.

  - id: B1-2
    kind: SCOPE
    title: Снятие действует во всех 7 цепочках, замена поднята в одной
    coordinates:
      doc: "§0 п.2-3; Р2; Р10 п.3; §4 (восстановление)"
    measured: >-
      Посадка own (и с ней полоса формы: наши глаголы подтверждения и восстановления через край)
      есть в 1 цепочке из 7; в 6 — external. Условие Р10 п.3 проверяет перечень путей в
      login_lane_paths.go, а не то, что полоса поднята в цепочке.
    consequence: >-
      После NTF-2 в шести цепочках нет ни одного пути подтвердить адрес и ни одного пути
      восстановления письмом — ровно то, от чего Р10 обещает защитить («без (1) … снять
      подтверждение адреса вовсе»).
    remedy: >-
      Либо условие старта «в каждой цепочке, где снимается почта поставщика, посадка own»
      (с командой по рендеру), либо явное решение, что в цепочках external эти пути исчезают, с
      основанием в требованиях владельца и строкой в §4.

  - id: B1-3
    kind: NEGATIVE
    title: Снимается контроль подтверждённости на полосе поставщика, а заменяющий контроль на том же пути не утверждён
    coordinates:
      doc: "Р3; NTF2-16 («здесь не переутверждается»); Р10"
      related: "kacho#2792 (OPEN); приёмка kaname Ф6 Р11 п.5 опирается на её посадку"
    measured: >-
      Посевом: после снятия хука неподтверждённая личность получает сессию поставщика (200), на
      базе — отказ (403). В цепочках с посадкой external край носитель поставщика читает;
      задача, снимающая этого читателя, открыта, и в условиях Р10 её нет.
    consequence: >-
      Ни один сценарий не утверждает, что такая сессия дальше экрана подтверждения не пускает.
      Отрицание «неподтверждённому доступа нет» у документа пропадает вместе с хуком.
    remedy: >-
      Добавить отрицательный сценарий (близнец NTF2-16 с одним отличием — отметка kaname) о том,
      что доступ сверх экрана подтверждения не выдаётся, либо сделать посадку kacho#2792
      условием старта с командой. Формулировать на уровне класса, без пошагового пути.

  - id: B1-4
    kind: COVERAGE
    title: Таблица замещения §3 пропускает сценарии ID-MAIL-1, которые NTF-2 опровергает
    coordinates:
      doc: "§3; DoD п.11"
      tree:
        - docs/specs/sub-phase-ID-MAIL-1-mail-delivery-acceptance.md MAIL-03 («неподтверждённый адрес входа не даёт»)
        - там же MAIL-02 (Given — MAIL-01 на полосе поставщика)
    consequence: >-
      После NTF2-16 MAIL-03 становится ложным, но в замещении его нет: два контракта говорят
      противоположное об одном предмете.
    remedy: Внести MAIL-03 (и зависимость MAIL-02) в §3 с исходом и в строку-ссылку DoD п.11.

  - id: B1-5
    kind: PRODUCER
    title: Шаблон письма подтверждения — другое имя и другой производитель, чем у NTF-1
    coordinates:
      doc: "Р1, Р7, П4, NTF2-01, NTF2-08, §7 строки NTF2-01, DoD п.2"
      sibling: "sub-phase-NTF-1-…-acceptance.md: NTF1-H03 `template = verification`; Р14 «в NTF-1 переезжают все три»"
    consequence: >-
      NTF-2 требует строку `email-verification` и каталог `notifications/email-verification/`;
      NTF-1 — `verification`. Один из двух контрактов красный на любой реализации. Условный
      производитель Р7 («NTF-1 либо NTF-2») противоречит NTF-1 Р14, который решение уже принял.
    remedy: >-
      Взять имя и владельца у NTF-1 (или согласовать его правкой NTF-1), убрать ветку Р7 и
      DoD п.2 про заведение шаблона в NTF-2.

  - id: B1-6
    kind: FORMAT
    title: У отказов выключенных потоков нет конкретного кода
    coordinates:
      doc: "NTF2-10, NTF2-11, NTF2-13, NTF2-14 («ответ не 2xx, id нет»)"
    measured: >-
      Посевом на образе поставщика с выключенными потоками: восстановление и подтверждение без
      `Accept: application/json` отвечают 303 на страницу ошибки консоли, с ним — 400 и причиной
      «… is not allowed because it was disabled»; регистрация — 400 с той же формой причины.
    consequence: >-
      Проба, следующая переадресации (поведение по умолчанию сквозного прогонщика), получает
      страницу консоли со статусом 2xx и краснеет на верной реализации; без названного Accept
      исход зависит от оснастки, а не от продукта.
    remedy: >-
      Назвать заголовок Accept, политику переадресации и точный ответ: статус и причину
      отказа (для обоих вариантов, если утверждаются оба).

important_findings:
  - id: I1-1
    kind: COVERAGE
    text: >-
      NTF2-12 (а) и (б) зелёные уже на базе (посев: в потоке входа группы default и password,
      шаг `code` — 400), потому что вход кодом не объявлен. Р6 держит только NTF2-15. Сказать это
      в Р6 либо сделать пробу различающей.
  - id: I1-2
    kind: FORMAT
    text: >-
      Р9 и NTF2-07: «тревога на половине ttl шаблона, 15 мин» расходится с NTF-1 Р8 («половина
      наименьшего ttl шаблонов класса security»; у восстановления ttl 5m). Сослаться на правило
      NTF-1, а не переутверждать другую величину.
  - id: I1-3
    kind: DoD
    text: >-
      Предикат §0 («в каждой цепочке ровно один — notify») строже NTF2-30 («ровно 1 в цепочке,
      объявляющей удостоверение»). Привести к одной формулировке.
  - id: I1-4
    kind: FORMAT
    text: >-
      NTF2-01 (уровень E) утверждает состояние строки ленты (`SENT`, секрет пуст) — назвать канал
      наблюдения либо вынести утверждение на уровень I.
  - id: I1-5
    kind: FORMAT
    text: >-
      NTF2-17: «журнал доступа объекта экрана» — назвать, что объект такой журнал ведёт, либо
      судить по журналу раздачи консоли.
  - id: I1-6
    kind: FORMAT
    text: NTF2-06 «не доставляется никогда» — ограничить сроком ttl строки.

