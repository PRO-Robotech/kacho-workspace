non_blocking:
  - id: I5-1
    kind: FORMAT
    summary: >-
      NTF2-90 Given в редакции 39 получил «группа `g` … членов нет», а NTF2-92 строится «как в NTF2-90» и
      в (б) требует «`g`, в которой состоит `U`» — глагол заведения членства `U` в `g`
      (`GroupService` добавление члена сессией `O`, шаг ожидания П11) в Given NTF2-92 не назван. Без него
      «строк для членов `g`, включая `U`, нет» выполняется пусто. Назвать построение в Given NTF2-92 при
      следующей правке; проба (б) обязана печатать, что `U` в `g` перед выдачей.
  - id: I5-2
    kind: FORMAT
    summary: >-
      `h` создаётся сессией `C1`, а заведение аккаунта списывается с окна темпа личности (триггер
      kacho_admission_rate_count, 0001_initial.sql:565; на стенде admissionsPerWindow = 3 —
      values.dev.yaml:1226, accountsPerIdentity = 5). Документ говорит «одной строкой на копию стенда», то
      есть один `h` на копию, — сказать это прямо и печатать обе величины перед заведением `h`, как
      печатаются потолки приглашений; превышение — «не выполнилось».
  - id: I5-3
    kind: FORMAT
    summary: >-
      Имя `h` уже занято в NTF2-79 и в §8 (глубина доверенных прыжков края, строка 3064, 3937). Разные
      предметы под одним именем в одном документе — переименовать служебный аккаунт при следующей правке.
  - id: I4-2
    kind: CONVENTION
    summary: перенесено — I3-1 (NTF-3 о годности адресата и разрешителе молчит), правка той приёмки.
