blocking:
  B-1:
    kind: CONSTRUCTIBILITY
    where: >-
      Р6 (строки 517–534: «после суточного потолка действует пол…», «Между `Tc` и `Tc + floor-interval`
      исход любого запроса без метки устройства — `capped`», и новый пункт «часовой и суточный
      потолки … в скользящих окнах»); NTF2-65 (г); NTF2-75 и NTF2-76 «граница суток»; NTF2-70 (в);
      §6в строка «суточная граница `t0 + 1 сут` и пол»
    text: >-
      Редакция 10 объявила суточное окно скользящим `(t − 1 сут, t]`, но оставила прежнее правило пола:
      «между `Tc` и `Tc + floor-interval` исход любого запроса без метки — `capped`». NTF2-65 (г) на копии
      П6 с `floor-interval` = 24 ч требует в `t0 + 1 сут` исход `queued`/`resent_same` — а этот момент
      лежит строго внутри `(Tc, Tc + 24 ч)`, потому что `Tc > t0`; Р6 предписывает там `capped`.
      Построение по ориентирам Р8 (60 с · 5 мин · 3/ч · 5/сут): строки `t0`, `t0+60 с`, `t0+6 мин`,
      `t0+1 ч`, `t0+1 ч 5 мин` = `Tc`; `t0 + 1 сут` < `Tc + 24 ч`. Реализация, исполняющая Р6 дословно,
      красна на NTF2-65 (г), NTF2-75 и NTF2-76 (граница суток); реализация по скользящему окну нарушает
      Р6. То же расхождение делает неопределённым `Tc` (Р6: «последнее письмо перед суточным
      потолком») после того, как скользящее окно отпустило строку и суточный потолок наступил снова, —
      на этом стоят базовое построение NTF2-70 (в) («три письма в `t1 + 1 сут − 10 мин`…», «пол в них не
      наступил») и условие NTF2-65 (а, б) при `Fl` у верхней границы Р8 (24 ч): при `Fl` = 24 ч суточное
      окно отпускает `t0` раньше `Tc + Fl`, и исход в `Tc + Fl` по скользящему окну — не `floor`.
      Состояние, которое утверждают сценарии, правилом документа запрещено; одобрение этого не лечит.
    required: >-
      Одно правило пола при скользящих окнах, изложенное в Р6 и §6в: например, «пол действует, пока
      суточное окно исчерпано; `Tc` — последнее письмо прогрессии перед текущим исчерпанием; письмо пола
      — не раньше `Tc + floor-interval` и только пока окно исчерпано; когда окно отпустило строку,
      прогрессия возобновляется» — и снять фразу «между `Tc` и `Tc + floor-interval` исход любого
      запроса — `capped`» либо сузить её тем же условием. Затем: NTF2-65 (а, б) — условие «в `Tc + Fl`
      суточное окно ещё исчерпано» (`t0 + 1 сут > Tc + Fl`, печатается, иначе «не выполнилось»);
      NTF2-65 (г), NTF2-75, NTF2-76 — ожидание, выводимое из этого правила; NTF2-70 (в) — построение,
      в котором `Tc` каждого исчерпания назван. Провести класс по всем сценариям с `Tc` (NTF2-65, 68,
      70, 75, 76, 78).
important:
  I-1: >-
    Р8: окна ручек края (`W_F`, `W_P`, `W_H`, `W_Ps`, `W_Hs`) спрятаны за `_*` и границ стража не имеют
    (граница строки — только число и «HARD ≤ 1000/ч»). NTF2-71 (т) обещает «вариантов столько,
    сколько ключей в таблице Р8», но ключи окон из таблицы не выводятся. Назвать ключи окон явно и их
    границы (Д11: «значения с границами, которые boot-guard проверяет»).
  I-2: >-
    NTF2-69 (в): «затем `C` приглашает аккаунт, чьи свои потолки на `C` не исчерпаны» — субъект и объект
    переставлены; должно быть «аккаунт, чьи потолки на `C` не исчерпаны, приглашает `C`».
  I-3: >-
    NTF2-87 условие `ttl − 1 с ≥ first-pause` — граница Р8 `ttl ≥ first-pause` судится только для
    `recovery` (NTF2-71 (м)); для `verification-code-ttl` и `registration-code-ttl` варианта нет. Добавить
    либо сказать «выборкой».
repeated_kinds_note: >-
  CONSTRUCTIBILITY уже был родом кругов 2 (после смены предмета) и 1 (Д14–Д16); COVERAGE снят. Число
  блокирующих не растёт (6 → 3 → 1 → 1). Новый блокирующий внесён самой правкой класса (скользящие окна
  без согласования с полом). Шаг формы задания для диспетчера (§14а): «вводя или меняя семантику окна
  или срока, перепиши каждое правило Р5–Р8, которое на неё опирается, и сверь ожидания сценариев с
  построением по ориентирам Р8 и по обеим границам Р8».
