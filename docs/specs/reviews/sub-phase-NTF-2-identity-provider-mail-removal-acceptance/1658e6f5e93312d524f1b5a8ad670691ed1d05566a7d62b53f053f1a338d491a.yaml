blocking_findings:
  - id: B2-1
    kind: COVERAGE
    title: Замещение §3 и перечень снимаемых гейтов DoD п.8 пропускают гейты ID-MAIL-1, чей предмет NTF-2 снимает
    coordinates:
      doc: "§3; §9 DoD п.8 (перечень и предикат `grep -cE 'identity_courier_|mail_lane_feeds_both_senders'`); Р3; NTF2-21"
      tree_at: kacho origin/2797 2267b405220
      tree:
        - deploy/identity_verified_address_required_on_both_lanes{,_injection}_test.go — MAIL-52, утверждает хук `require_verified_address` на обеих полосах входа поставщика
        - deploy/identity_verification_mirrors_the_requirement_test.go — MAIL-15/16/17, зеркало требования и потока подтверждения
        - deploy/identity_delivery_flows_declared_once{,_injection}_test.go — MAIL-18, потоки доставки объявлены один раз
        - deploy/identity_bearer_window_ceiling{,_injection}_test.go — MAIL-51, потолок сроков code/recovery/verification (Р21б, который §3 объявляет истекающим)
    measured: >-
      `git grep -lE 'courier|smtpConnectionURI|KANAME_IDENTITY_SMTP_CREDENTIAL|show_verification_ui|require_verified_address|flows\.recovery|flows\.verification|"recovery"|"verification"' -- deploy ':!*.md'`
      без шаблонов и профилей → 22 файла; DoD п.8 называет 6 из них. `grep -oE 'MAIL-[0-9]+' <док> | sort -u`
      → MAIL-01…04, 47, 48, 54; MAIL-14…18, 51, 52 в документе 0 раз.
    consequence: >-
      Р3 и NTF2-21 снимают `require_verified_address`, а гейт MAIL-52 утверждает его наличие: на
      верной реализации он красный, и у исполнителя два пути — ослабить гейт молча или оставить
      хук. MAIL-52 — страж безопасности (требование подтверждённости на входе); его предмет
      обязан явно перейти к NTF2-19, иначе утверждение «неподтверждённый дальше не проходит»
      теряет держателя в дереве. Тот же класс, что B1-4.
    remedy: >-
      Перепись по предикату выше (с объёмом) вместо выборочного перечня: каждому файлу — исход
      (снят вместе с предметом → какому сценарию передан предмет / остаётся с причиной). MAIL-52 →
      NTF2-19 явно; MAIL-51 — вместе с Р21б; MAIL-15…18 — вместе с потоками. Строки в §3 и в
      строку-ссылку DoD п.11; предикат DoD п.8 — по той же переписи.

  - id: B2-2
    kind: CONSTRUCTIBILITY
    title: E-часть NTF2-06 отзывает ленту kaname целиком на общем стенде, без канала, изоляции и восстановления
    coordinates:
      doc: "§5 П4; NTF2-06 (E); §9 DoD п.1"
      sibling: "NTF-1 Р7 (отсечка по последнему Restore), NTF1-F04, NTF1-L01/L02"
    consequence: >-
      Надгробие Revoke(feed) на стенде П1 гасит каждое письмо kaname на время окна: приглашения и
      восстановление (NTF1-L01, L02), письма NTF2-01/04 и код для П3 (NTF2-19 б) параллельных
      кейсов. По правилу отсечки NTF-1 строки, поставленные до Restore, получают REVOKED навсегда.
      В E-части нет ни шага Restore, ни последовательного хвоста прогона, ни названного канала
      к внутреннему слушателю kaname, а прогонщик E ходит через край (ban #6: внутреннее наружу
      не публикуется). Given в названной изоляции не строится.
    remedy: >-
      Вести NTF2-06 только на уровне I (П6) — утверждение «SMTP-сессий 0» там уже есть; либо
      назвать для E последовательный хвост прогона, канал к внутреннему слушателю и шаг Restore
      с проверкой, что соседние кейсы не пересекаются с окном отзыва.

  - id: B2-3
    kind: CONSTRUCTIBILITY
    title: NTF2-24 требует в a8f60d ровно одного читателя приёмника, а полоса a8f60d ведёт к внешнему ретранслятору
    coordinates:
      doc: "NTF2-24 Then («в цепочках с приёмником (сегодня dev, dev-prod, own, prorobotech, a8f60d) — ровно 1, и это notify»); Р8"
      tree: "deploy/helm/umbrella/values.a8f60d.yaml:119-125 @2267b405220 (`global.kacho.identity.smtp.connectionURI` — внешний ретранслятор)"
    measured: >-
      Рендер @2267b405220: объектов приёмника в a8f60d есть (r-mailpit Service и Deployment), а
      ссылок на адрес приёмника `…-mailpit:1025` — 0 (dev, dev-prod, own, prorobotech — по 1).
      Полосу, объявленную декларацией, NTF-1 переводит на notify (NTF-1 З4), т.е. в a8f60d notify
      укажет на внешний ретранслятор.
    consequence: >-
      Утверждение «ровно 1» для a8f60d ложно на верной реализации: сценарий красный либо требует
      перенаправить боевую полосу стенда на приёмник.
    remedy: >-
      Множество цепочек выводить из рендера (цепочки, чья объявленная полоса — приёмник), а не
      перечнем; для прочих — «читателей приёмника, отличных от notify, 0». Решить явно, законен ли
      приёмник без читателя (a8f60d), — со ссылкой на ID-MAIL-1 Р18.

important_findings:
  - id: I2-1
    kind: FORMAT
    text: >-
      §1.4 и §7 (строка NTF2-02…04): `git grep -c '/iam/v1/auth/verify-email' origin/357 --
      internal/handler/loginlanehttp/handler.go` → в документе 3, измерено 2 (@734f69fb4). Исправить
      число в обоих местах.
  - id: I2-2
    kind: FORMAT
    text: >-
      NTF2-03 «Given как NTF2-02» на том же человеке и коде: после NTF2-02 код истрачен и
      `emailVerified: true`, поэтому «/me → emailVerified:false» верно только если NTF2-03 идёт
      раньше. Назвать порядок либо отдельного человека.
  - id: I2-3
    kind: DoD
    text: >-
      DoD п.8: «Если её переносит NTF-1» — NTF-1 З4 уже решил, что декларация
      `global.kacho.identity.smtp.*` остаётся одной и её читатель после NTF-2 — notify. Заменить
      условие фактом.
  - id: I2-4
    kind: NEGATIVE
    text: >-
      NTF2-19 утверждает рубеж kaname (second-factor). Рубеж края для путей платформы
      (gateway/internal/middleware/auth_own_session.go:146 @2267b405220) не утверждён ни здесь, ни
      ссылкой. Добавить близнеца на пути чтения платформы либо сослаться на сценарий приёмки kacho#2900.
  - id: I2-5
    kind: FORMAT
    text: >-
      NTF2-18 близнец: TestOwnPostureRaisesNoForeignIdentityService читает deploy/stacks.txt из
      дерева; «на П7-kratos красный» — назвать, чем подаётся вход (существующая инъекция
      TestOwnPostureForeignIdentityGate_FindsTheInheritedFlag либо копия дерева).

