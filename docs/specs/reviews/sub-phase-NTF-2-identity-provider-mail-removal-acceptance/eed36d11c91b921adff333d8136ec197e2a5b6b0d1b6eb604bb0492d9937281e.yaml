decisions_applied:
  D70: >-
    ОТРАЖЕНО. NTF2-63 перенесён в playwright-пробу NTF2-72 и идёт после её шага 3. Ступень PoW
    строит шаг 2. Близнец (`register` без доказательства) стоит первым и последним запросом. Если
    ступени нет, исход «не выполнилось». NTF2-69 (е) идёт на П1 аккаунтом П5, и это E-уровень.
    Состав края в П6 закрыт. Канал глаголов мимо края назван: внешний слушатель kaname с сессией
    `login`, а `ForceLogout` — на внутреннем слушателе. Сверка класса шла по When (таблица
    «When сценариев П6 → состав П6»), и маршрутов REST-шлюза среди этих When нет. B-1 круга 3
    закрыт.
