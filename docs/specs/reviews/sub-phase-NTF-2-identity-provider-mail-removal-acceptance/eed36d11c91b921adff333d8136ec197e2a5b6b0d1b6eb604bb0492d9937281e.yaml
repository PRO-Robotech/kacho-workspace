defaults_fixed:
  Q1: >-
    Форма запросов полосы формы на уровне E (NTF2-63, а по тому же образцу и 03, 81, 82, 85, 94).
    В When NTF2-63 запросы записаны сокращённо. Если читать буквально, «Тогда» не выполняется на
    kaname @a59862664. `GET /iam/v1/auth/csrf` без `?form=` даёт 400 INVALID_ARGUMENT
    (`loginlanehttp/handler.go:479–482`), а не 200. `login` без `csrfToken` отвергается до глагола
    (`:503`, `judgeForm`). `recovery/complete` без `csrfToken` и `newPassword` отвергается раньше
    сверки кода (`:663–668`), так что 401 `code` 16 не наступает. ФИКСИРУЮ ДЕФОЛТ: каждый запрос
    полосы формы уровня E несёт `csrfToken` своего вида. Токен берётся `GET /iam/v1/auth/csrf?form=<вид>`
    с печеньем контекста формы того же клиента, а тело содержит все обязательные поля формы:
    у `recovery/complete` — годный `newPassword`, у `register/confirm` — `password`. В NTF2-63
    `GET /iam/v1/auth/csrf?form=login` идёт до `login`, а утверждение «`csrf` — 200» относится к
    запросу с годным `form`. Если реализация не может так построить запрос, это возврат в приёмку,
    а не правка пробы. При следующей правке документа стоит записать это одной строкой в абзац
    «Форма запроса и ответа уровня E» (§6).
non_blocking:
  N-1: >-
    [CONSTRUCTIBILITY, дефолтабельный] NTF2-69 (е): для (а)–(д) печатается условие
    `pending-max > account-per-day`, а для (е) условие `invite.pending-max > Y` не печатается. Если
    в рендере `dev` `pending-max ≤ Y`, запрос `Y + 1` встретит `INVITATION_PENDING_LIMIT` (400,
    `code` 9) раньше потолка. Поставляемые значения Р8 (200 против 50; `stand-own.sh:326–328`
    kaname) условие выполняют, а `deploy/` kacho @e201adbf36f ручек приглашений не переопределяет
    (git grep -i 'young|pendingMax' → пусто). Дефолт: проба (е) печатает `pending-max` и `Y`, а
    при `pending-max ≤ Y` даёт исход «не выполнилось».
  N-2: >-
    [FORMAT] DoD п.8 называет NTF2-69 (е) «уровень E на П1 через край», но не говорит, в какой
    коллекции newman лежит кейс. В п.4 коллекция названа: `gateway/tests/newman/cases/`, с записью
    ведомости производителя. Дефолт: (е) идёт в той же коллекции п.4, а если коллекция новая,
    ей нужна запись ведомости производителя.
  N-3: >-
    [FORMAT] П6, «Канал глаголов мимо края»: «сессия … перенесённая так, как её переносит край».
    Это описание конкретно ровно настолько, насколько конкретен край. На П6 шлюза нет, поэтому
    фикстура должна воспроизводить перенос личности сама: заголовок доверенного отправителя под
    сертификатом края (`.claude/rules/security.md` `sec-forwarded-trust-aware-extract`).
    Рекомендую назвать заголовок поимённо при следующей правке. Положительный контроль П6 уже
    печатает оба слушателя, и отказ переноса проявится там как красное на первом же глаголе, а
    не тихо.
