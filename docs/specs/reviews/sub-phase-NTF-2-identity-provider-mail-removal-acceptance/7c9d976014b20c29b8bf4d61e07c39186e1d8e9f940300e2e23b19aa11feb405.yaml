blocking:
  B-1: >-
    [CONSTRUCTIBILITY] Близнец NTF2-34 (е') — «копия цепочки prod с одной добавленной строкой
    global.kacho.identity.smtp.connectionURI = X» — не рендерится: страж зонтика, который NTF-2
    сохраняет и условий которого не меняет (Р19), отвергает узел без адреса и имени отправителя.
    Посев @96e2fa72b3a: `helm template ci . -n kacho -f values.prod.yaml --set
    global.kacho.identity.smtp.connectionURI='smtp://probe-relay.example:587/'` → код 1,
    identity-mail-lane-guard.yaml:85 «адрес отправителя НЕ задан»; с добавленным fromAddress — код 1
    (правило :91 про fromName); с тремя значениями connectionURI, fromAddress, fromName — код 0,
    адрес в рендере 1 раз. (е') как написан красен на верной реализации, и пара (е) ↔ (е') не
    различает «ключ не читается» от «рендер отвергнут». Что сделать: близнец (е') — узел объявлен
    минимально-законно (connectionURI = X, fromAddress = Y, fromName — значение пробы), единственный
    факт — «узел объявлен»; ссылка на правило стража :85–:93 как причину, почему значений три.
  B-2: >-
    [CONSTRUCTIBILITY] «Тогда» (е) и (е') не совпадают с тем, что производит NTF-1 по Д44 (замысел
    редакции 14, @eb2325039). (1) Ключей три, а не один: `notify.smtp.host`, `notify.smtp.port`,
    `notify.smtp.tlsMode` (`KACHO_NOTIFY_SMTP_{HOST,PORT,TLS_MODE}`, design.md З20 :1175, §8
    :1903–1905); ключ, равный URI, у отправителя не существует, и (е') «тот же ключ равен X» (X —
    контрольный адрес, записанный в connectionURI) невыполним: host не равен URI. (2) Пустой узел по
    NTF-1 даёт ОТСУТСТВИЕ ключей: tasks.md полоса D1 — «рендер без них даёт ConfigMap без ключей, и
    старт отвергает страж N13»; (е) требует «ключ … присутствует и пуст» — на верной реализации
    NTF-1 красный. (3) NTF-2 — производитель чтения узла (Р20), но не называет отображение
    connectionURI → host / port / tlsMode: схема `smtp://` приёмника стенда (values.dev.yaml) при
    режиме «ровно starttls / implicit, без TLS значения нет» (З26) — какой режим; `smtps://` a8f60d
    — implicit; имя пользователя в адресе a8f60d (`info%40prorobotech.ru@`) — в какую ручку.
    Без этого NTF2-34 (а) «адрес полосы — имя и порт сервиса приёмника» и (г') «адрес полосы равен
    X» не имеют правила сличения. Смежно: у отправителя теперь два пути значений — узел
    global.kacho.identity.smtp (Р20, Д42 «чарт notify своего не несёт») и ключи notify.smtp.* чарта
    NTF-1; какой из них питает шаблон и какой запрещён, документ не говорит (тот же вывод
    независимо — разбор классов NTF-1, CX1-77, bb98fdadc; здесь перемерено чтением design.md и
    tasks.md @eb2325039). Что сделать: в Р20 — отображение узла на ручки NTF-1 (поле узла → ручка,
    правило схемы → tlsMode, судьба userinfo) и единственность пути значений; в (е) — исход, который
    производит NTF-1 (ключей host/port/tlsMode в конфигурации отправителя нет либо пусты — ровно
    одно из двух, согласованное с D1), в (е') — host и port равны разобранным из X. Если согласовать
    нельзя без правки замысла NTF-1 — это строка «возврат замыслу NTF-1», а не молчаливое «Тогда».
  B-3: >-
    [DoD] DoD п.16, шаг (3): M ищется как слияния с темой `#1276 merge ` на ПЕРВОРОДИТЕЛЬСКОЙ линии
    приёмника (W или <B>). Такие коммиты — вливания полос В ВЕТКУ kacho#1276 (8f879ff7fbd «#1276
    merge #2818», первый родитель 96e2fa72b3a); на первородительскую линию волны они попадают только
    при перемотке волны на ветку задачи. Измеренная форма посадки волны 2798 — неперематывающее
    слияние через сборку: 96e2fa72b3a «#2926 merge: сборка 1 волны 2798», внутри — «#2926 свести
    <полоса>» (`git log --first-parent --merges 96e2fa72b3a^2`). Посев: коммит слияния
    `git commit-tree <tree> -p 96e2fa72b3a -p 8f879ff7fbd -m '#2798 merge #1276'` (ссылки не
    создавались) → шаг (3) на нём даёт 0 коммитов M, хотя снятие 92097320166 в его диапазоне M^1..M
    есть (счёт 1); при перемотке (W = 8f879ff7fbd) — 1. Итог: на обычной посадке множество M пусто,
    и файл, снятый kacho#1276, судится «снят другой посадкой» — возврат в приёмку на верной
    работе. Контроль в документе исполняет только шаг диапазона, шаг поиска M положительного
    контроля не имеет. Что сделать: M — коммит слияния на первородительской линии приёмника, чей
    второй родитель несёт голову ветки kacho#1276 (`git merge-base --is-ancestor <голова 1276> M^2`
    для слияний `git log --first-parent --merges 96e2fa72b3a..L`), либо по теме слияния, названной
    для обеих форм посадки (`#<волна> merge #1276`, `#<сборка> свести 1276`); и положительный
    контроль шага поиска на неперематывающем слиянии.
non_blocking:
  N-1: >-
    §6а и Р20: «команда Р16 п.5 … даёт пустые поля» / «→ ` | ` в обеих». Команда Р16 п.5 выводит
    четыре поля и credentialSecret не читает; над prod и fe3455 её вывод — ` |  |  |
    kacho-mailpit-tls` (@96e2fa72b3a). Сам факт верен (connectionURI, fromAddress, fromName,
    credentialSecret.name пусты в обеих — перемерено), но команда и вывод в тексте не те, которыми
    он получается. Назвать команду с полями connectionURI и credentialSecret.name и её вывод.
  N-2: >-
    Значение `global.kacho.notifications.enabled` в values.yaml зонтика (§3а строка 2 — единственный
    файл цепочек, который NTF-2 правит) не названо. «Флаг true» в (е) для цепочки prod «как есть» и
    флаг П1 на dev следуют только из него; назвать значение в §3а строка 2 или в Р4.
  N-3: >-
    Следствие для стенда fe3455 не названо. После посадки флаг true (N-2) при пустом узле
    отслеживаемых слоёв fe3455 (connectionURI, fromAddress, fromName пусты @96e2fa72b3a) даёт отказ
    старта отправителя на боевой площадке, а слой учётных данных вне git узел объявить не может:
    cutover-fe3455.sh (ORY_CRED_PATHS) пропускает только connectionURI, страж требует с ним
    fromAddress и fromName. Файлы fe3455 — за kacho#1276 (§3а строки 5, 7); «установка либо задаёт
    узел, либо выключает флаг» не называет, кто и в каком изменении делает это для fe3455. Нужна
    строка: чья посадка приводит fe3455 к одному из двух исходов и чем это проверяется перед
    раскаткой.
repeated_kinds_note: >-
  CONSTRUCTIBILITY — третий круг подряд с этим родом (редакции 14, 16, 18); DoD — второй подряд и
  по тому же пункту п.16. Признак общий: утверждение «Тогда» или предикат DoD написан без посева на
  том, что производит соседняя сторона (страж зонтика — B-1; замысел NTF-1 — B-2; форма посадки
  kacho#1276 — B-3). Блокирующих не убыло (2 → 3). По multi-agent-flow-orchestration §14а — в форму
  задания автору: «каждый новый вариант Given и близнец рендерится командой на базе до записи в
  документ, вывод прикладывается в §6а; каждое «Тогда» о ключе соседней задачи сверяется с её
  замыслом по имени ключа и исходу пустого значения; каждая команда поиска в DoD несёт
  положительный контроль на форме, которой посадка реально идёт».
