blocking_findings:
  - id: B3-1
    kind: COVERAGE
    title: Перепись §3а не видит предмета Р6 (метод `code`) — гейт отмеченного перечня методов выпал из таблицы
    coordinates:
      doc: "§3а (предикат слов и таблица из 39 строк); Р6; DoD п.4 последний пункт («его держит существующий гейт перечня»)"
      tree_at: kacho origin/2797 2267b405220
      tree:
        - deploy/identity_method_comment_matches_declaration_test.go
        - 'deploy/identity_method_comment_matches_declaration_injection_test.go (`realClaimLines` — «ВЫКЛЮЧЕНЫ: link, oidc / ВКЛЮЧЕНЫ: code, profile»; инъекции строятся на том, что `code` включён)'
    measured: >-
      Предикат §3а не содержит слова предмета Р6 (`code`, перечень методов); обоих файлов в
      выводе предиката и в документе 0 (`grep -c identity_method_comment <док>` → 0). Посев дерева
      после NTF-2 с перечнем, ПРИВЕДЁННЫМ к объявлению: 6 тестов TestIdentityMethodCommentInjection_*
      красные («отмеченный перечень … не найден в ожидаемой форме»).
    consequence: >-
      На верной реализации инъекционный держатель гейта перечня методов красный, а у исполнителя
      нет исхода для файла: §3а его не знает, и правило «файл без строки — возврат» не срабатывает,
      потому что перемер тем же предикатом его не найдёт. Путь наименьшего сопротивления — оставить
      `code` включённым, что противоречит Р6 и NTF2-21.
    remedy: >-
      Добавить в предикат §3а слова предмета Р6 (метод `code`, отмеченный перечень методов) и
      внести оба файла с исходом «переписан»: новый настоящий вход инъекций — перечень после NTF-2,
      в котором `code` выключен; назвать, что утверждения гейта (перечень = объявление) не
      меняются. Правило §3а о допустимых правках «остаётся» дополнить этими строками либо
      перевести их в «переписан». Проверить класс, а не место: подтвердить исход каждой строки
      прогоном пакета deploy на посеянном дереве после NTF-2.

  - id: B3-2
    kind: COVERAGE
    title: MAIL-54 (строки 21–22) помечен «остаётся, утверждения не меняются», а его пара 1 теряет предмет — гейт зелёный по чужой причине
    coordinates:
      doc: "§3 строка MAIL-54; §3а строки 21–22 и правило для «остаётся»; DoD п.5, п.8"
      tree_at: kacho origin/2797 2267b405220
      tree:
        - "deploy/identity_mail_lane_single_declaration_test.go — пара 1: `len(declarations) != 1` → находка; единственное законное объявление — наш шаблон, рендерящий `courier:`; любой `courier:` в значениях засчитывается как объявление"
        - "deploy/identity_mail_lane_single_declaration_injection_test.go — ось 3: настоящий вход называет разделы `courier` и `serve`"
    measured: >-
      Посев дерева после NTF-2: с ключом DoD п.5 (`kratos:\n  courier:\n    enabled: false`) —
      TestMailLaneIsDeclaredOnce PASS, «объявлений найдено 1», и это ключ выключения в values.yaml;
      без ключа — FAIL «объявлений почтовой полосы 0, а решение Р27 требует РОВНО ОДНО». Инъекция
      оси 3 красная в обоих вариантах (разделов после снятия `courier` 7, вход называет один).
    consequence: >-
      Пара 1 утверждает «раздел `courier` объявлен ровно одним местом — нашим шаблоном». NTF-2
      снимает этот раздел, и гейт становится зелёным только потому, что засчитывает ключ
      выключения почтового процесса как «встроенный блок courier». Правило §3а («остаётся» красный →
      возврат) здесь не срабатывает: главный гейт зелёный. Держатель, объявленный документом за
      MAIL-54, после NTF-2 не утверждает ничего о своём предмете, и DoD п.8 («утверждения не
      менялись, обход непуст») это пропускает.
    remedy: >-
      Строки 21–22 — исход «переписан»: пара 1 после NTF-2 утверждает «разделов `courier` в
      объявлениях 0» (либо снимается с передачей предмета NTF2-21, NTF2-23 — назвать), ключ
      `kratos.courier.enabled` гейт различает от блока настроек; пары 2 и 3 (координата раскатки,
      рукописный перечень) остаются за ручкой `notify`; ось 3 инъекции получает новый настоящий вход.
      Исправить строку MAIL-54 в §3 и строку-ссылку DoD п.11.

important_findings:
  - id: I3-1
    kind: DoD
    text: >-
      DoD п.4 не называет вычисления почтовой полосы в шаблоне, которые после снятия `courier`
      не читает никто: `$mailScheme`, `$mailParts`, `$mailSpliced`, `$mailOut` и обе декларации
      `$mailCredDeclared` (`_kratos-identity.tpl:586-621, 787` @2267b405220), а также абзац о
      ссылке `${KANAME_IDENTITY_SMTP_CREDENTIAL}`. Снять вместе с подпираемым (ban #11) и назвать в п.4.
  - id: I3-2
    kind: DoD
    text: >-
      DoD п.8 предикат `git grep -nE 'courier|statefulSet' <база> -- deploy/helm ':!*.md'` → «только
      ключ … и страж NTF2-23»: объяснительный комментарий при ключе в values.yaml (он нужен по
      Р2) сделает предикат ложным на верной реализации. Назвать допустимые строки точно либо
      исключить комментарии.

