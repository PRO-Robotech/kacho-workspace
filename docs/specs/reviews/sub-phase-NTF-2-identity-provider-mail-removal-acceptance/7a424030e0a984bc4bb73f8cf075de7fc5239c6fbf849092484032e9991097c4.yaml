  B-1: >-
    закрыт. Р16 п.6 (2) ветвится по признаку базы `K` (Р16 п.2), измеряемому командой на той же базе:
    рендер `prod` с П7-узлом, счёт объектов чарта `notify`; код не 0 — «не выполнилось». При ложном
    `K` — прежние «выполнено» (подача `notifyProbe.*`), близнец (+ П7-узел) и контроль (`prod` как есть,
    код 0); при истинном `K` — `prod` как есть даёт отказ с именем `connectionURI` (совпадает с NTF2-34
    (е)), близнец — сам замер `K` (отличие ровно в узле), код 0 — «не выполнено». Ни одна ветвь не
    ложна на верной работе в точке исполнения: база D3 (D1, D2 посажены) — истинный `K`; база старта —
    ложный. `K` перемеряется на базе полосы и на базе запроса волны. Р16 п.2 называет базу D3 «NTF-1,
    D1, D2 посажены». Класс переписан по документу признаком 10 §6в против зависимостей маршрута
    (D1 → D3, D4, X1, X2; T1 через D3) — сверено с tasks.md :167–173.
  N-1: >-
    закрыт. Р16 п.6 и DoD «Условие начала»: NTF2-24 — D3; NTF2-34 маршрутом не отдан
    (`grep -c 'NTF2-34' docs/changes/issue-2917/tasks.md` → 0, воспроизведено), и его полоса обязана
    зависеть от D1. Правка самого маршрута — отдельный заказ (N-2 этой записи).
  N-2: >-
    закрыт. DoD п.16 называет род исключения хвоста §3а (гейт, красный на `prod` без узла при
    истинном `K`), адресат `kacho#2915` и CX1-86; числа 10 файлов Go вне `deploy/` и 17 гейтов и
