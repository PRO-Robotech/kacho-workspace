non_blocking:
  N-1: >-
    Р20 «Значение флага в поставке» (строка ~1261): «Для `prod` исход после посадки NTF-2 — отказ
    рендера …; до неё перечень `prod` пуст» — описание продукта, привязанное к этапу, а не к признаку
    `K`: между посадкой D1 и посадкой NTF-2 целиком перечень уже непуст. Условия и контроли этой
    фразой не пользуются (они читают `K`), поэтому не блокирует; при следующей правке — «после внесения
    записи kaname (полоса D1, признак `K`)».
  N-2: >-
    Маршрут `docs/changes/issue-2917/tasks.md` @a0ad3a711 не отдаёт гейт NTF2-34 ни одной полосе, а
    DoD п.19 требует его зелёным в CI kacho. Приёмка это называет и ставит условие (полоса зависит от
    D1); нужна правка маршрута — строка с NTF2-34 в полосе, зависящей от D1 (естественно — D3).
  N-3: >-
    DoD п.16 выводит гейты-пропуски переписи CX1-86 из вердикта NTF-2 с адресатом `kacho#2915`, но не
    делает их починку предпосылкой вливания волны с D1. Если NTF-1 сядет без закрытия CX1-86, запрос
    волны NTF-2 с D1 покраснит эти гейты в CI. Это порядок посадок, а не контракт NTF-2: диспетчеру —
    держать CX1-86 закрытым до запроса волны, несущей D1.
