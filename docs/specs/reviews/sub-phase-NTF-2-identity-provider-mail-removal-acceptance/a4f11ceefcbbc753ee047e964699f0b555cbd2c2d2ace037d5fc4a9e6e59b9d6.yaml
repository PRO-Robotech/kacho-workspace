blocking:
  B-1:
    kind: COVERAGE
    where: Р4 («одинаковый для любого адреса»), NTF2-51 (в); §6б строка Р4; Д7
    text: >-
      Д7 и Р4 требуют, чтобы отказ `MAIL_DELIVERY_DISABLED` был одинаков для любого адреса —
      без раскрытия существования. NTF2-51 утверждает равенство только для восстановления
      ((а) и (б)); регистрация проверена лишь на свободном адресе `Z` ((в)). Реализация, которая
      при выключенном флаге на занятый адрес отвечает иначе (например `200 {}`, потому что письмо
      `registration-existing` молча пропущено, либо отказом о занятости), проходит NTF2-51 целиком,
      а регистрация при этом отвечает на вопрос «занят ли адрес» — ровно то, что Р9 и S4 запрещают.
      Правило §6б «каждое правило имеет сценарий, который упадёт без него» для этой строки не
      выполнено.
    required: >-
      Добавить в NTF2-51 вариант: `register` на занятый адрес (человек П10/П11) с годным паролем
      при выключенном флаге — побайтово равен (в); писем и строк ленты 0. Близнец на П6 (флаг
      `true`) — оба `200 {}` побайтово равны. Строку Р4 в §6б сослать на него.
  B-2:
    kind: COVERAGE
    where: Р5 (лестница), Р8 строка «край · источник», NTF2-60, NTF2-71 (д); §6б строка Р5 «ось источника (FREE/POW/HARD)»
    text: >-
      Ручка `KACHO_API_GATEWAY_ANON_MAIL_IP_POW_*` объявлена с границей FREE ≤ POW ≤ HARD, а её
      поведение названо только ориентиром Р8 («PoW до 10/ч, дальше растущая сложность»). Текст Р5
      лестницы знает две ступени — порог «без проверки» и жёсткий порог; что меняется на пороге
      POW, решением не сказано. NTF2-60 утверждает только FREE и HARD, NTF2-71 (д) — только
      отказ старта при FREE > POW. Реализация, которая ручку читает стражем и больше нигде
      (сложность вызова не растёт), проходит все сценарии — это «принято и проигнорировано»
      (`.claude/rules/api-conventions.md` §«Принято-и-проигнорировано — ЗАПРЕЩЕНО»), а §6б
      объявляет строку закрытой.
    required: >-
      Назвать в Р5 наблюдаемое правило ступени POW (например, `difficultyBits` вызова выше порога
      POW строго больше, чем между FREE и POW, и растёт монотонно) и утвердить его в NTF2-60:
      печать `difficultyBits` вызовов до и после порога POW; близнец — вызовы между FREE и POW с
      базовой сложностью. Либо снять ручку вместе с предметом, если ступени нет.
  B-3:
    kind: CONSTRUCTIBILITY
    where: NTF2-68 Given и When; Р6 абзац о `mail-throttled`; §6в (признак 4 — переписью не найдено)
    text: >-
      Given «адрес `A` впервые упёрся в потолок в момент `Tc`» не называет, какой потолок
      (часовой или суточный) и каким рядом он построен; символ `Tc` при этом уже определён Р6
      иначе (момент последнего пропущенного письма). When «потолок срабатывает снова в `Tc + 1 ч`»
      не построен: если потолок — часовой, к `Tc + 1 ч` он сброшен, запрос проходит окно, и
      срабатывания нет вовсе, — близнец «новой строки нет» зелёный по чужой причине. Кроме того,
      Р6 говорит «в пределах того же лимита», а сценарий ждёт строку `mail-throttled` в момент,
      когда лимит исчерпан; два прочтения ведут к двум реализациям, одна из которых красна.
      Перепись §6в объявлена полной по признаку 4, но этого места не содержит.
    required: >-
      Построить NTF2-68 от ряда NTF2-64: срабатывание — первый исход `capped` суточного потолка
      в названный момент (своим символом, не `Tc` Р6); повтор в `+1 ч` — запрос при всё ещё
      исчерпанном суточном потолке (исход `capped` печатается); повтор в `+Ti` — после нового
      исчерпания, построенного часами пробы. Решить в Р6 один исход: письмо `mail-throttled`
      идёт сверх исчерпанного окна адреса (и входит ли оно в инвариант NTF2-73), либо не идёт.
      Дополнить §6в строкой и проверить класс по всему §6.
important:
  I-1: >-
    NTF2-52 Given — только «П6-off»: пользователь, получатель роли и владелец токена не названы
    (правило §6в «люди и объекты уровня I — фикстурой П11» требует их в Given). Близнец «по одной
    строке ленты на событие» верен только при выдаче роли пользователю, а не группе — назвать.
  I-2: >-
    Р11: вид адресата `account_security_contact` несёт «аккаунт и владельцев на момент события», а
    `notify` получает адрес «в момент отправки» и использует разрешение «владельцы аккаунта».
    Для `account.deleted` (NTF2-90, последняя строка) разрешение владельцев удалённого аккаунта в
    момент отправки может вернуть пусто. Назвать один исход: строка несёт идентификаторы
    владельцев снимком, а в момент отправки разрешается только адрес.
  I-3: >-
    §5 «Счётчики края на П1»: «проба печатает `V` … из рендера цепочки dev» — `V` рендер не знает;
    назвать, откуда проба берёт `V` (перечень кейсов коллекций прогона).
repeated_kinds_note: >-
  CONSTRUCTIBILITY — четвёртый круг подряд на этом документе (4991…, 33e1…, эта запись), COVERAGE —
  третий. Оба раза автор закрывал класс переписью по чтению (§6б, §6в), и оба раза переписи
  пропустили место. По multi-agent-flow-orchestration §14а решение о переносе класса в форму
  задания — за диспетчером; предлагаемая форма шага: «для каждой ручки Р8 назвать наблюдаемое
  поведение, отличимое от её отсутствия, и сценарий, красный при чтении ручки только стражем;
  для каждого Given с символом времени — ряд, который его строит».
