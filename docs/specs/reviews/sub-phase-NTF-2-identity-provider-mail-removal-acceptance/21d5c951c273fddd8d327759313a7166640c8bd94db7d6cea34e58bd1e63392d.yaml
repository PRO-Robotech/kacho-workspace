blocking:
  B-1: >-
    [CONSTRUCTIBILITY] Отказ рендера `prod` с пустым узлом документ приписывает посадке NTF-1, а NTF-1
    его не производит: по замыслу NTF-1 (редакция 17 @151befdb5 design.md :1806–1809, :1829–1836;
    редакция 18 @e1af41e40 :1840–1843, :1875–1882; tasks.md D1, D2, Е12) выведенный перечень
    источников `prod` в NTF-1 пуст по построению (единственный источник — стендовый notify-probe,
    `notifyProbe.*` в values.yaml = false), notify в `prod` не рендерится, и отказа нет; `required`
    держит только фикстура D1 (`probe-b` включён). Отказ появляется, когда в перечень входит источник,
    развёрнутый в `prod`, — kaname, то есть посадкой самой NTF-2 (NTF2-53; Е12 NTF-1 прямо адресует
    это NTF-2). Следствия: (1) Р16 п.6 (2) — условие начала на базе ДО NTF-2 требует «код не 0, отказ
    называет connectionURI»; на верной NTF-1 рендер `prod` даёт код 0, и близнец с П7-узлом — тоже 0:
    пара не различает, условие не выполняется никогда, исход «возврат в приёмку» на верной работе
    соседа. (2) Р20 «Цепочка prod в гейтах», Р16 п.2, §5 П7-узел, примечание §3а — «после посадки
    NTF-1 цепочка prod с пустым узлом по построению не рендерится» — неверно: это верно после посадки
    NTF-2. (3) §7 NTF2-34 и §6б называют производителем отказа (е) только полосу развёртывания NTF-1;
    без записи kaname в перечне (NTF-2) `required` не исполняется. (4) §6в признак 8, строка «NTF2-34
    (е)», и Р20 утверждают, что «текущий текст замысла NTF-1 редакции 15 — без required … разошлось»;
    `required` есть в замысле с редакции 16 (Д46) — строка цитирует снятую ревизию соседа, тот же класс,
    что признак 8 объявляет закрытым. Что сделать: Р16 п.6 (2) — проверять `required` NTF-1 входом с
    непустым перечнем (цепочка `prod` + включённый стендовый источник, как фикстура D1: код не 0, отказ
    называет global.kacho.identity.smtp.connectionURI; близнец — то же + П7-узел, код 0; контроль —
    `prod` как есть, код 0, notify не отрендерен); в Р20, §6б, §7 назвать отказ (е) совместным
    исходом — `required` NTF-1 × запись kaname в перечне `prod` (NTF-2, NTF2-53), и момент, с которого
    `prod` без узла не рендерится, — посадка NTF-2; строку §6в признака 8 перецитировать по редакции 18
    замысла NTF-1.
  B-2: >-
    [DoD] DoD п.16 — контроль формы (а) поиска M не различает и записан неверно. Документ: без
    перемотки C = commit-tree T -p 96e2fa72b3a -p 8f879ff7fbd «#2926 свести 1276» → M = {C}, счёт 1;
    близнец «#2926 свести 2731» → M пусто, счёт 0 («замер 2026-09-30: 1 и 0»). Посев той же командой
    (обе формы, без --first-parent) @96e2fa72b3a: на C → M = {8f879ff7fbd, C}, счёт 1 у обоих; на
    близнеце → M = {8f879ff7fbd}, счёт 1 — не 0. Второй родитель 8f879ff7fbd сам несёт слияние
    `#1276 merge #2818`, и форма (б) находит его на любом приёмнике; снятие формы (а) целиком контроль
    не покрасит. Что сделать: второй родитель контроля — голова полосы без внутренних слияний 1276
    (dcb6588fefa, второй родитель 8f879ff7fbd): замер этого круга — C' «#2926 свести 1276» → M = {C'},
    счёт 1; близнец «#2926 свести 2731» → M пусто. Записать замер тем, что команда печатает.
non_blocking:
  N-1: >-
    Р20 и §6в признак 8 называют источником отображения «замысел NTF-1 редакции 15, SHA-256 82486131…»;
    действующая редакция — 18 (52b638a3…, e1af41e40). Форма ключа совпадает; перецитировать по
    действующей ревизии (часть этого — B-1 (4)).
  N-2: >-
    Строку `global.kacho.notifications.enabled: true` в values.yaml зонтика объявляет полоса D2 NTF-1
    (design.md З28 таблица флагов; tasks.md Е12: «NTF-2 §3а строка 2 его не повторяет»), а §3а строка
    2 и Р20 «Значение флага в поставке» ставят её в правки NTF-2. У одной строки два производителя;
    назвать одного (NTF-2 — ссылкой на D2).
  N-3: >-
    Р16 п.6 входит в «Условие начала» всей под-фазы (DoD), а выполним только после вливания
    kacho#1276 в 2564 и посадки D2. Этим встают и полосы стороны kaname (S1 и др.), от fe3455 не
    зависящие. Если это намерение Д49 — сказать; иначе сделать п.6 условием полосы, несущей NTF2-24 и
    NTF2-34.
