blocking:
  B-2: >-
    [CONSTRUCTIBILITY] Р8 пункт «рендер чарта края без зонтика»: «Рендер края без зонтика, которому
    по его назначению значение не подаётся (запись края в ведомости отказывающих чартов конвейера),
    утверждает отказ с именем ручки — это отрицание, а не обход правила»; §6б строка Р8 «рендер чарта
    края без зонтика» (1) — источник значения у этой записи «не подаётся», (4) — «запись края в
    ведомости отказывающих чартов конвейера утверждает отказ с именем ручки». Ведомость
    (`.github/scripts/lint-service-charts.sh` @`6edea09c2ee`, строки LEDGER и `sweep`) устроена иначе:
    запись — `<путь чарта>|<аргументы helm>`; гейт рендерит чарт С аргументами записи (код ≠ 0 —
    «не рендерится ДАЖЕ с координатами ведомости»), а самоистечение проверяет лишь, что голый рендер
    отказывает (код, текст отказа не читается). Посев на копии дерева с `required` ручки в шаблоне
    края: запись отсутствует → rc=1 «не рендерится, а координат ведомость ему не даёт»; запись
    `gateway/deploy|` без аргументов → rc=1 то же (пустые аргументы неотличимы от отсутствия
    записи); запись `gateway/deploy|-f deploy/testdata/notify-standalone/edge.yaml` (ключ в корне) →
    rc=0 «координат подано ведомостью». Итого: записи, которой «значение не подаётся», в этом
    механизме не существует — единственная зелёная форма подаёт значение слоем файла; и ни одна
    форма не утверждает имя ручки в отказе. Приёмка тем самым (а) заказывает исключение, буквальное
    исполнение которого красит конвейер, (б) называет у записи производителя утверждения «отказ с
    именем ручки», которого у неё нет, (в) в переписи §6б (1) печатает источником «не подаётся» там,
    где по механизму стоит файл каталога. Что сделать: убрать исключение и отнести ведомость к
    общему правилу — запись края `gateway/deploy|-f <файл каталога фикстур NTF-1>` (источник в
    переписи — этот файл; `--set` с ключом ручки в записи — красный, как у прочих рендеров);
    самоистечение ведомости уже держит «без записи/без слоя — отказ» (кодом); утверждение «текст
    отказа называет ручку» оставить за отрицанием §6б (2) (`helm template <релиз> gateway/deploy` без
    слоя), а не за ведомостью. Если автор хочет, чтобы ведомость читала имя в отказе, — это правка
    скрипта, и её производитель (полоса D6) и близнец называются явно.
non_blocking:
  N-1: >-
    [CONSTRUCTIBILITY] Р8: близнец «тот же рендер со слоем файла каталога (`-f` файла из
    `deploy/testdata/mail-node/` или `deploy/testdata/notify-standalone/`) — код 0» не называет форму
    ключа. Посев: чарт края без зонтика со слоем `trustedHops: 1` (корень) → rc=0, переменная "1";
    со слоем `api-gateway: {trustedHops: 1}` (форма слоя зонтика, в которой ручку несут файлы
    `mail-node/` для рендеров `prod`) → rc=1, отказ с именем ручки; `0` в корне → переменная "0".
    Значит, файл `mail-node/`, поданный рендеру без зонтика, отказывает, если не несёт второй строки
    того же значения в корневой форме, — а «строка ручки лежит в каждом файле каталога» написано в
    единственном числе, и две строки одного значения в одном файле — два места об одном предмете.
    Замысел NTF-1 (`issue-2915` @1690113d8, Е12 (12)) прямо отдаёт выбор файла и формы ключа D6
    NTF-2. Рекомендую назвать в Р8: рендеры без зонтика берут значение из файла с ключом в корне
    (`notify-standalone/`), файл `mail-node/` несёт только форму под сегментом `api-gateway`; одно
    значение — одна строка на файл. Не блокирует: неверный выбор держатель §6б (2) поймает красным
    близнеца. Тот же выбор касается семейства (7) IaC-скана: `--helm-values`/`helm.values` сканера
    ложится на КАЖДЫЙ рендеримый чарт — корневой ключ ручки не должен совпадать с ключом чужого чарта.
