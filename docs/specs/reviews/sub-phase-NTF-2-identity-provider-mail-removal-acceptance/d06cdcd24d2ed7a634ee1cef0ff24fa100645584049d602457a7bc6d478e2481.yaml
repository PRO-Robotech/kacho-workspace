blocking:
  - id: B3-1
    kind: CONSTRUCTIBILITY
    summary: >-
      В NTF2-90 строка `user.backup_codes_regenerated` (перевыпуск резервных кодов `U`) по предписанному
      порядку исполняется после `user.second_factor_reset` — когда фактора у `U` нет. Перевыпуск требует
      предъявить код заведённого фактора, поэтому глагол отвергается, и таблица 22 событий не сходится.
    evidence:
      - >-
        NTF2-90 When (строки 3190–3196): кроме `user.second_factor_enrolled` и `user_token.issued`, вынесенных
        вперёд, и четырёх, вынесенных назад, «прочие строки — в порядке таблицы». В таблице (строки
        3213–3217): `user.second_factor_removed` → `user.second_factor_reset` («фактор `U` перед этим заведён
        снова») → `user.backup_codes_regenerated`.
      - >-
        `UserService.ResetSecondFactor` — снятие фактора администратором (user_service.proto:451-463
        @cbd729cfa). После него фактор `U` снова не заведён.
      - >-
        Перевыпуск: `internal/apps/kaname/api/humansession/sf_backup_codes.go` Execute — `p.prepare(ctx,
        user.ID, in.Factor)`, при `verdict != verdictMatched` отказ (строки 69–78); `sf_present.go:85-94`:
        «Состояние судится РАНЬШЕ кода: при «нет» и `pending` сверка холостая, исход — «не заведён»».
    consequence: >-
      Проба NTF2-90 получает отказ на построении в строке `user.backup_codes_regenerated`; счёт «строк =
      адресатов = доставленных» по этой строке 0 ≠ 1 — красный, читаемый как дефект продукта, а не как
      неверный сценарий.
    required: >-
      Задать исполнимый порядок для глаголов `U`, требующих заведённого фактора: например, перевыпуск
      резервных кодов — до `user.second_factor_removed`, либо после `user.second_factor_reset` — второе
      повторное заведение фактора `U` (вспомогательное событие, выведенное из счёта так же, как первое).
      Пройти так же каждую строку `U` после `removed` и после `reset` (ключ входа, восстановление) на
      требование фактора/уровня 2 и назвать построение для каждой.
  - id: B3-2
    kind: CONSTRUCTIBILITY
    summary: >-
      Держатель NTF2-101 «один разрешитель владельца аккаунта» в текущей формулировке не может быть
      зелёным на дереве как есть, а функция, названная разрешителем, не та, что определяет Р11. Правило
      «любое достижимое чтение `owner_user_id` вне разрешителя — находка» ловит законные не-адресные чтения,
      которые достижимы из пакетов, ставящих строки ленты класса S; и наоборот — второе понятие «ACTIVE и
      подтверждён» гейту и NTF2-100 невидимо.
    evidence:
      - >-
        Р11 (строки 1145–1150): разрешитель «читает `owner_user_id` аккаунта в транзакции вызывающего и
        отдаёт пользователя и подтверждённый адрес, если этот пользователь ACTIVE и его адрес подтверждён;
        иначе — «адресата нет»». NTF2-101 (строка 3423): разрешитель — `RecipientDirectoryRepo.ReadAccountOwner`.
        @cbd729cfa recipientdirectory_repo.go:64-77: `r.pool.QueryRow(… SELECT owner_user_id …)` — пул, а не
        транзакция вызывающего; возвращает `(string, bool, error)` — id владельца, без адреса, без ACTIVE и
        без подтверждения. ACTIVE и подтверждённый адрес решает `ResolveUseCase.Execute`
        (recipientdirectory/resolve.go: `ReadRecipient`, `!rec.Active`, `rec.HasConfirmedAddress`) — другая
        функция.
      - >-
        Писатели аудита класса S живут в пакетах глаголов: `git grep -ln audit_outbox cbd729cfa -- '*.go'
        ':!*_test.go'` → access_binding, account, cluster, group, project, role, sa_keys, service_account, …
        Пакет `sa_keys` (событие NTF2-100 `sa_key.issued`) из `Issue` зовёт
        `OwnerUserForServiceAccount` (sa_keys/usecases.go:383) → `SELECT a.owner_user_id FROM service_accounts
        sa JOIN accounts a …` (repo/kaname/pg/iam_extension_repos.go:205) — не-адресное чтение (штамп
        `created_by`). Пакет `access_binding` зовёт `rd.Accounts().Get` (helpers.go:215,225;
        subject_read_authority.go:347) → `SELECT … owner_user_id …` (account_repo.go:40,51).
      - >-
        NTF2-101 When (строка 3434): «Законное чтение одно — внутри разрешителя; любое другое достижимое
        чтение — находка, где бы оно ни лежало». Предиката «чтение для адресации» нет; required B2-2 просил
        либо транзитивный охват, либо назвать такой предикат и показать «находок 0» на дереве как есть —
        «находок 0» не показано.
    consequence: >-
      Либо близнец NTF2-101 красный на любом честном дереве (чтения из sa_keys и access_binding достижимы),
      и реализатор вынужден ослаблять гейт или переписывать не относящиеся к адресации пути; либо, если
      реализатор сузит охват на свой вкус, второй путь «своё понятие ACTIVE/подтверждения» поверх
      `ReadAccountOwner` в писателе аудита останется невидим: гейт судит только чтение колонки, а NTF2-100
      сравнивает адрес строки с ответом разрешителя лишь в положениях «оба ACTIVE и подтверждены».
    required: >-
      Назвать разрешителем функцию, которая отвечает на вопрос Р11 целиком (owner → пользователь → ACTIVE →
      подтверждённый адрес → «адресата нет»), в транзакции вызывающего, — либо переписать Р11 под
      существующую форму и назвать, кто держит единственность понятия ACTIVE/подтверждения. Начальные точки
      обхода гейта — функции, ставящие строки ленты и отвечающие `Resolve{account_owner}`, а не все функции
      пакетов; назвать судьбу известных не-адресных чтений (`OwnerUserForServiceAccount`,
      `Accounts().Get`) — вне охвата по построению с основанием либо заменяются разрешителем — и показать
      предикатом «находок 0» на ревизии. В NTF2-100 добавить положения, в которых ответ разрешителя —
      «адресата нет» (владелец не ACTIVE; адрес владельца не подтверждён): строк 0 и равенство с ответом
      разрешителя.
