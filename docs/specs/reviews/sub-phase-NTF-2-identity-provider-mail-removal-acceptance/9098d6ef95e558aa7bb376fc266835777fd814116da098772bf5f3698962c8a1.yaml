previous_round_closure:
  B-1: >-
    закрыто по классу. Р6 «пол при скользящих окнах — одно правило»: исчерпание суточного окна
    определено по `(t − 1 сут, t]`; `Tc` — письмо прогрессии текущего исчерпания, `Tw` — самое раннее
    письмо окна плюс 1 сут; пол действует только в `[Tc, Tw)` и только раньше `Tw`; с `Tw` прогрессия
    возобновляется, новое исчерпание — новые `Tc`, `Tw`. Фраза «между `Tc` и `Tc + floor-interval` —
    `capped`» снята (в Р6 и в «старшинстве исходов»). Номер письма прогрессии задан по часовому окну,
    паузы — только от писем прогрессии. Сценарии с `Tc` — NTF2-65, 68, 70, 75, 76, 78 (перемерено:
    выборка `` `Tc `` по §6 даёт ровно их; прочие попадания — таблицы §6б, §6в после последнего
    сценария) — условия `Tc + Fl < Tw` (65, 75, 76), `Tc + Fl ≤ Tw` (68), момент в `[Tc, Tw)` раньше пола
    (70, 78) печатаются, иначе «не выполнилось».
    Пересчёт по ориентирам Р8 (60 с · 5 мин · 3/ч · 5/сут · 6 ч): строки `t0`, `t0+60 с`, `t0+6 мин`,
    `t0+1 ч` (часовое окно — 2, номер 3, вторая пауза прошла), `t0+1 ч 5 мин` (строка `t0+60 с` вышла из
    часового окна в `t0+1 ч 1 мин`; окно — 2) = `Tc`; `Tw = t0 + 1 сут`; пол `t0+7 ч 5 мин`, `+13 ч 5 мин`,
    `+19 ч 5 мин`, следующий `t0+25 ч 5 мин ≥ Tw` — не ставится. Копия `Fl` = 24 ч: `Tc + 24 ч ≥ Tw`, в
    `t0+1 сут − 1 с` — `capped`, в `t0+1 сут` часовое окно пусто (`Tc ≤ t0+23 ч`) — письмо первое по номеру,
    исход `queued`/`resent_same`: ожидания NTF2-65 (г), 75, 76 выводятся из правила. NTF2-70 (в): письма в
    `t1+1 сут − 10 мин` (суточное окно — `t0+1 ч`, `t0+1 ч 5 мин`, итого 3 после письма), `− 9 мин` (4),
    `− 4 мин` (строка `t0+1 ч` вышла в `t0+1 сут+1 ч`; 4); в `t1+1 сут − 1 с` строка `t0+1 ч 5 мин` выходит
    ровно в этот момент — суточное 3 < 5, часовое 3 = `per-hour`: `capped` по часовому, пол не действует —
    сходится с текстом. Производные утверждения Р6 проверены: письма пола разнесены на `Fl` и поперёк
    исчерпаний (письмо пола < `Tw` ≤ следующий `Tc`), отсюда ≤ ⌈24 ч / `Fl`⌉ за любые сутки; письма
    прогрессии за любые сутки ≤ `per-day` (письмо ставится только при неисчерпанном окне). Владелец не
    отрезается дольше `Fl` (Д11).
  I-1: >-
    закрыто — ключи окон края названы (`…IP_{FREE,POW,HARD}_{LIMIT,WINDOW}`,
    `…SUBNET_{V4_24,V6_56,V6_48}_{POW,HARD}_LIMIT`, `…SUBNET_{POW,HARD}_WINDOW`) с границами стража
    (`1 мин ≤ W_F ≤ W_P ≤ W_H ≤ 24 ч`, `1 мин ≤ W_Ps ≤ W_Hs ≤ 24 ч`, отношения счёта к окну). Перечень
    ключей пересчитан по таблице: край 6+2+8+2+1 = 19, kaname 15+3+3+1+8+2 = 32, всего 51 — совпадает с
    объявленным и с числом вариантов NTF2-71 (т); варианты границ окон — (х), (ц); у каждой строки Р8 ≥ 1
    варианта границы (перемерено по буквам (а)–(ш)).
  I-2: закрыто — NTF2-69 (в) «аккаунт, чьи потолки на `C` не исчерпаны, приглашает `C`»
  I-3: закрыто — NTF2-71 (ч) `verification`, (ш) `registration`; §6б строка срока кода называет (м, ч, ш)
