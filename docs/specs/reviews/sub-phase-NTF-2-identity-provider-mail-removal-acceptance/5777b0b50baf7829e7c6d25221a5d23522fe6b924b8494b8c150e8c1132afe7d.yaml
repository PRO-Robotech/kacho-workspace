blocking:
  - id: B1-1
    kind: CONSTRUCTIBILITY
    summary: >-
      Новый П11 запрещает прямую запись строк kaname для иерархии, но членство пользователя в
      аккаунте ни одним глаголом не строит. При этом шесть Given требуют «пользователь в `acc`».
      Единственный глагол членства — поток приглашения, а у него есть почтовая сторона и потолки
      этой же приёмки. Кроме того, шаг ожидания материализации стоит только после последней
      привязки, хотя от прав предыдущего `Create` зависят и промежуточные.
    evidence:
      - >-
        `grep -ciE 'членств|Membership' <док>` → 0. Пользователь «в `acc`» стоит в Given NTF2-51
        (строка 2249), NTF2-90 (3159, `U`), NTF2-89 (3214, `U2`), NTF2-92 (3257, `V`, `W`) и NTF2-96
        (3321, `M`). П11 (строка 1786) перечисляет «пользователи, аккаунты, проекты, группы, сервисные
        аккаунты, привязки и администраторы облака». Людей он сеет «посевом той же формы, что П10»,
        иерархию — «только глаголами `Create`, прямой записи строк kaname нет», а членства в перечне
        нет.
      - >-
        kaname@0dd03218a613 и caf1c95ca: членство создаёт `MembershipService.Create`
        (`proto/kaname/cloud/iam/v1/membership_service.proto:113-114`). Реализует его поток
        приглашения `user.InviteUserUseCase` (`internal/apps/kaname/api/membership/create.go:6-23`).
        Для человека, которого в аккаунте ещё нет, поток вызывает `InsertPending` с
        `InviteStatusPending` (`invite.go:557-562`), а для строки в положении PENDING ставит письмо
        `invite` с окном адресата (`invite.go:704-713`). Глагол подпадает под потолки Р7 этой
        приёмки (`invite.young-account-per-day`, `pending-max`), а `acc`, только что заведённый
        `Create`, по построению молод.
      - >-
        Необязательная пара «проект + роль» того же глагола выдаёт право атомарно с членством
        (`invite.go:575-600`). Отложенный триггер `membership_carrying_rights_is_kept`
        (`remove_from_account.go`, шапка; `internal/migrations/0001_initial.sql`) отвергает
        исключение члена, у которого есть живая выдача. Если `U` введён в `acc` с этой парой, глагол
        `user.removed_from_account` в NTF2-90 и в NTF2-96 получит `FAILED_PRECONDITION`.
      - >-
        Указание владельца требует «явного шага ожидания материализации прав». В П11 он один —
        «после последней привязки». Но `ProjectService.Create`, `Create` группы и сервисного
        аккаунта и `AccessBindingService.Create` сессией `O` опираются на права владельца, которые
        выводит `AccountService.Create`. `AccessBindingService.Create` проверяет полномочие выдачи
        первым шагом (`access_binding/create.go:185-200`, `requireGrantAuthority`). Кортежи
        владельца доходят намерением и сверкой (`account/create.go:49-60`: «when unwired the
        periodic sweep materializes it, just not synchronously»), то есть материализуются в
        конечном счёте. Синхронный `PERMISSION_DENIED` промежуточного `Create` П11 не
        классифицирует: «поллится до `done` без ошибки» относится к операции, а это отказ до неё.
    consequence: >-
      Реализатор пробы не знает, как построить «`U` в `acc`». Без глагола остаётся прямая вставка, а
      её владелец запретил. Через `MembershipService.Create` посев идёт почтовым глаголом с окном
      адресата и потолком молодого аккаунта, а П11 утверждает, что почтовых глаголов к началу
      сценария нет. С парой «проект + роль» Given NTF2-90 и NTF2-96 ломает исключение `U`. Гонка
      материализации между `Create` даёт красный посева там, где должно быть «не выполнилось».
    required: >-
      В П11 назвать глагол членства: `MembershipService.Create` сессией владельца `acc`, без пары
      «проект + роль», с поллом операции. Назвать, что он делает для каждого члена из Given: для
      ACTIVE человека П10 (подтверждён) и человека П3 (`V`, не подтверждён) — заводится ли строка
      PENDING и ставится ли письмо `invite`. Если ставится, посев либо принимает его явно, вместе с
      исключением этих строк из счёта сценария и с проверкой, что потолки Р7 на молодом `acc`
      (`young-account-per-day`, `pending-max`) не меньше числа членов, либо меняет построение. Член,
      которому нужен ACTIVE в `acc` (U, U2, M, W до блокировки), должен быть ACTIVE до When, и путь к
      этому должен быть назван. Шаг ожидания материализации поставить перед каждым `Create`,
      который опирается на права из предыдущего: после `AccountService.Create` — `Check` права
      `O` на `account:acc`. Либо назвать ограниченный повтор `Create` на `PERMISSION_DENIED` в
      бюджете, а при исчерпании — «не выполнилось».
  - id: B1-2
    kind: PRODUCER
    summary: >-
      Р11 утверждает «путь к владельцу аккаунта один (Д131)», а держателя у этого утверждения нет. По
      тексту в kaname остаются две реализации одного вопроса «адрес владельца аккаунта»: ответ
      `Resolve{account_owner}` (NTF-3 Р7) и снимок писателя аудита в транзакции события (NTF-2 Р11).
      Довод «тот же предикат у его владельца» записан словами, а не конструкцией.
    evidence:
      - >-
        Р11, строки 1123–1134: «Адресует владельца аккаунта `notify` только
        `Resolve{account_owner{account_id}}`; строка `kaname` формы `address` уже несёт его адрес,
        взятый kaname в транзакции события из той же колонки, — это тот же предикат у его владельца,
        а не второе определение».
      - >-
        §6б, строка 3697 (Р11, владелец): держатели — NTF2-100 и NTF2-96. Оба судят, кому ушла строка,
        и не сверяют её ни с ответом `Resolve{account_owner}`, ни с общей функцией.
        `grep -n 'Resolve' <док>` → в сценариях и в §6б вызова `Resolve` нет.
      - >-
        NTF-3 (17635b5a) Р7, строка 972: `account_owner{account_id}` — «ответ — адрес владельца
        аккаунта»; строка 1062: `AUDIENCE_DENIED`, если у аккаунта нет владельца-пользователя;
        Д129 (5): адрес выдаётся только после проверки состояния и подтверждения. Те же три условия
        (колонка, ACTIVE, подтверждённый адрес) NTF-2 Р11 требует от снимка писателя аудита.
    consequence: >-
      В одном процессе kaname два читателя `owner_user_id` для адресации, и каждый сам судит
      состояние и подтверждение. Первая же правка одного из них (например, пропуск неподтверждённого
      адреса или иное понятие ACTIVE) разведёт адресатов писем о ключах SA, `account-deleted` и
      `sa-key-issued` от адресатов NTF-3, и ни одна проба этого не заметит. Это и есть второй
      механизм, который запрещают Д131 и указание владельца «без обходных путей».
    required: >-
      Назвать в Р11 одну функцию или порт kaname, который отвечает «адрес владельца аккаунта
      (ACTIVE, подтверждён) или нет». Его зовут и писатель аудита класса S (NTF-2), и обработчик
      `Resolve{account_owner}` (NTF-3 Р7). NTF-2 заводит его первой, NTF-3 переиспользует, и запись
      об этом нужна в §4 или в строке NTF-3. Держатель — проба, способная упасть, со строкой в §6б и
      производителем в §7. Например, структурный гейт дерева kaname: читатель `owner_user_id` для
      адресации ровно один, плюс инъекция второго читателя — красный. Или парная проба на П6-k:
      адрес строки `sa-key-issued` равен ответу той же функции для `acc`, с близнецом
      `owner_user_id` = `X`.
important:
  - id: I1-1
    kind: CONVENTION
    summary: >-
      П11 сеет администраторов облака `C1`, `C2` «состоянием посева стенда той же формы, что П10»,
      то есть записью прав в обход глагола, хотя глагол выдачи есть (`ClusterService` GrantAdmin,
      им пользуется строка NTF2-90 `cluster_admin.granted`). По букве указания владельца («привязок —
      только через Create») ровнее посеять одного администратора облака как данные стенда (bootstrap),
      а второго выдать глаголом с тем же шагом ожидания материализации. Блокирующим не признано:
      право администратора облака — не привязка роли на области, а затравочный администратор стенда
      глаголом не строится.
  - id: I1-2
    kind: FORMAT
    summary: >-
      NTF2-92 (г): не назван вызывающий `UserService.Block` для `W` (в NTF2-96 это `C1`). Событие
      `user.blocked` даёт строки `C1` и `C2`, а счёт сценария идёт по событию выдачи. Это стоит
      написать так же явно, как в NTF2-90.
