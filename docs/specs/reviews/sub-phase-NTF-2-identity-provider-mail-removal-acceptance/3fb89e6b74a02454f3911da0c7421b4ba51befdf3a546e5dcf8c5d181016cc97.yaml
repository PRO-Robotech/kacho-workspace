blocking_findings:
  - id: B4-1
    kind: CONSTRUCTIBILITY
    title: >-
      NTF2-21 «раздела courier в отрендеренной конфигурации — 0» ложно на реализации по DoD п.4:
      процесс поставщика читает второй документ конфигурации — ConfigMap подчарта поставщика
    coordinates:
      doc: "NTF2-21 (Then п.3 и «печатает число документов его конфигурации»); DoD п.4, п.5, п.8 (предикат values.yaml → 1 строка); §3а строка 2"
      tree_at: kacho origin/2797 2267b405220 + посев рецензента
      tree:
        - "deploy/helm/umbrella/charts/kratos-0.62.1.tgz → values.yaml: `kratos.config.courier.smtp: {}` (умолчание подчарта)"
        - "рендер П7-kratos на посеве: ConfigMap `r-kratos-config`, `kratos.yaml` → `courier: {smtp: {}}`"
        - "рендер Deployment `r-kratos`: args `serve all --dev --config /etc/config/kratos.yaml --config /etc/kaname-identity-rendered/kratos.yaml`; том `kratos-config-volume` → `r-kratos-config`"
    measured: >-
      На посеве (все снятия DoD п.4 и ключ п.5) рендер П7-kratos несёт раздел `courier` ровно в
      одном документе конфигурации — `r-kratos-config`, и процесс поставщика этот документ читает
      первым `--config`. Наш шаблон раздела больше не рендерит. На базе тот же документ несёт тот
      же `courier: {smtp: {}}`; документ его не называет нигде (`grep -c 'r-kratos-config\|/etc/config'
      <док>` → 0).
    consequence: >-
      Гейт NTF2-21 в заявленной форме («гейт разбирает … отрендеренную конфигурацию поставщика»,
      раздела `courier` — 0) красный на верной реализации. У исполнителя два пути, оба закрыты
      документом: снять умолчание подчарта строкой `courier: null` под `kratos.kratos.config` —
      тогда DoD п.8 («в values.yaml вне комментария ровно одна строка со словом — ключ
      `courier:` под `kratos:`») ложен; либо сузить гейт до нашей карты настроек — тогда
      утверждение «у объектов поставщика раздела courier нет» ослаблено молча, и эффективная
      конфигурация процесса раздел несёт. Путь наименьшего сопротивления — второй, то есть
      тихое сужение предмета гейта.
    remedy: >-
      Решить и записать один исход: (а) раздел снимается и из документа подчарта — назвать
      строку значений, снимающую умолчание, добавить её в DoD п.4/п.5 и в допустимые строки
      предиката DoD п.8 и NTF2-23 (строка — не объявление полосы), подтвердить NTF2-22, что
      процесс стартует без раздела; либо (б) NTF2-21 называет перечень документов конфигурации,
      которые судит, и отдельно утверждает, что `courier` в документе подчарта не несёт ни
      адреса, ни ссылки (`smtp` пуст), с инъекцией, где `connection_uri` возвращён в этот
      документ, — и называет основание, почему пустой раздел не нарушает В1. Проверить класс, а
      не место: каждое «Тогда» G-сценариев о рендере сверить на посеянном рендере П7-kratos.

