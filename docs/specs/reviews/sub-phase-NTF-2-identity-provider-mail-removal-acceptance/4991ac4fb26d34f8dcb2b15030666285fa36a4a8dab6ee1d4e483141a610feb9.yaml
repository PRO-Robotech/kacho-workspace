blocking:
  B-1:
    kind: CONSTRUCTIBILITY
    where: Р6 п.1 и п.3, Р9, NTF2-84 Given
    text: >-
      Р6 держит ключ окна по назначению `registration` и правило «пока код жив, повторный запрос
      шлёт тот же код»; Given NTF2-84 строит две ожидающие регистрации одного адреса с РАЗНЫМИ
      кодами K1 и K2 «после паузы окна» — в срок первого кода. По правилам документа такое
      состояние не строится: второй `register` в срок K1 обязан прислать K1. Корень —
      контракт не определяет исход повторного `register` на свободный адрес при живой ожидающей
      регистрации: заводится ли вторая ожидающая запись, какой код она получает и к какому
      паролю привязан код, предъявляемый в `register/confirm`.
    required: >-
      Назвать в Р9 один исход (код привязан к паролю того запроса, в ответ на который он
      выпущен; повтор — новая запись с новым кодом либо замена прежней — выбрать и обосновать)
      и согласовать с Р6 (регистрация либо исключается из правила «тот же код», либо правило
      распространяется, и тогда Given NTF2-84 переписывается). Добавить пару сценариев: повтор
      `register` на свободный адрес в срок кода другим паролем — исход подтверждения и близнец
      с тем же паролем.
  B-2:
    kind: COVERAGE
    where: Р3, NTF2-90 (заголовок «каждое событие перечня»), DoD п.11
    text: >-
      Таблица NTF2-90 держит 18 строк, а перечень Р3 называет ещё пять видов событий аудита без
      держателя: `session.force_logout`, `user.second_factor_removed`, `user.second_factor_reset`,
      `access_key.revoked`, `access_key.transferred`. У `access-key-changed` уникальное правило
      адресата «владелец ключа до и после события» — его не держит ни один сценарий. DoD п.11
      судит «каждую строку таблицы NTF2-90», поэтому пять видов выпадают из приёмки молча.
      Виды существуют в аудите kaname (измерено: git grep -hoE '"iam\.[a-z_]+\.[a-z_]+"'
      @734f69fb4, 61 вид, все пять в выдаче).
    required: >-
      Добавить пять строк в таблицу NTF2-90 (для `access_key.transferred` — оба адресата) либо
      отдельный сценарий; число событий и писем в печати пробы пересчитать.
  B-3:
    kind: COVERAGE
    where: Р5 п.3, Р6 п.1, Р8 строки «край · общий поток» и «kaname · адресат (registration)»
    text: >-
      Две объявленные защитные оси не имеют держателя. (а) Общий поток края: «при превышении
      общего потока вызов PoW получают все» (ручка `KACHO_API_GATEWAY_ANON_MAIL_GLOBAL_*`, граница
      > 0) — ни NTF2-60…63, ни страж NTF2-71 её не судят. (б) Окно адресата по назначению
      `registration` (ручки `authn.login.mail-window.registration.*`): NTF2-64/65 судят только
      `recovery`. Для регистрации на свободный адрес Р6 даёт два несовместимых исхода — «ключ —
      нормализованный ввод» и «строка счётчика для адреса, которого нет, не заводится»; какой
      из них действует, документ не решает, и это ровно ось Д11 «защита владельца почты».
    required: >-
      (а) Сценарий I: общий поток выше порога — вызов PoW на запрос с источника ниже своих
      порогов; близнец — поток ниже порога; вариант стража NTF2-71 для ручки общего потока.
      (б) Разрешить противоречие Р6 для регистрации и добавить сценарий ряда `register` на один
      свободный адрес (с разных источников ниже порогов края): письма только в моменты
      прогрессии, ответ побайтово один; близнец — занятый адрес (`registration-existing`).
important:
  I-1: >-
    Р4: «письма аудита (класс S) при выключенном флаге не порождаются, а действия исполняются» —
    толкование Д7 («письма класса security не глотаются», перечень действий в скобках). Пометить
    строкой «толкование Д7: отказ получают действия перечня; действия класса S исполняются без
    письма — основание …», чтобы это не читалось молчаливым отступлением.
  I-2: >-
    NTF2-70 (а): «исход по оси устройства» — закрытого набора `kaname_mail_intents_total` (Р6)
    такого значения нет. Назвать значение и внести его в набор Р6.
  I-3: >-
    NTF2-99: производитель «перечень Р3 — NTF-2» без координаты — где лежит перечень, по которому
    `notifygen -check` отличает обязательный класс `security`; без него инъекция «класс заменён»
    может остаться зелёной.
  I-4: >-
    Р7/Р8: потолки приглашений на адресата от одного аккаунта (`recipient-per-hour`,
    `recipient-per-day`) и `pending-max` не держит ни один сценарий (NTF2-69 судит только
    поперёк аккаунтов).
