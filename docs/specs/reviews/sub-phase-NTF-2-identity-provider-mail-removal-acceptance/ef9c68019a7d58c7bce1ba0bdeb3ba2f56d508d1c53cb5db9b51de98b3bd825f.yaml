    Р15 NTF2-24 утверждает «ровно 1, и это `notify`» — красен на втором читателе. Прочие попадания
    выборки — поведенческие («только после истечения», «письмо ставит только пол») или права доступа
    с держателями NTF2-46, NTF2-47, NTF2-88.
  N-1: >-
    закрыто — П4 меняет URI-SAN одним сегментом служебной учётной записи при том же DNS-SAN, который
