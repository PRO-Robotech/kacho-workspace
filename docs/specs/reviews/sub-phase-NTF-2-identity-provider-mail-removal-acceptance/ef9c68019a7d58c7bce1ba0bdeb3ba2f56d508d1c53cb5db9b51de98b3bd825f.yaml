return_closure:
  B-1: >-
    закрыто. Правило Р4 «отказ флага производит только corelib; своего текста и `reason` у kaname
    нет» получило держателя, красного на второй копии, — NTF2-54 (G, гейт дерева kaname
    `internal/check`): узел (1) — литералы текста и `reason` вне тестов (копии (а), (б) — красные с
    файлом и строкой), узел (2) — ссылка на `feed.DeliveryNotConfiguredStatus` по идентичности из
    проверки типов, узел (3) — достижимость узла (2) из каждого из четырёх методов закрытого перечня
    (копия (в) — красный с именем действия); отсутствующее действие перечня — красный, пустой обход —
    красный; близнецы — дерево как есть и литерал в `_test.go` (г), отличающийся от (б) ровно одним
    фактом. Перечень гейта совпадает с перечнем действий Р4 (восстановление, регистрация,
    приглашение, запрос кода подтверждения). Неисполнимая клауза о NTF1-N06 снята: NTF2-51 берёт
    ожидаемое вызовом функции на пине, печатает его и прямо говорит, что копию не ловит. Граница
    узла (1) (текст из фрагментов) названа, и названо, чем она закрыта. Строки §6а, §6б, §7, DoD п.6
    дописаны.
  B-1_class: >-
    класс закрыт по документу пятой переписью §6б «единственный производитель → держатель» (9
    строк). Перепись перемерена выборкой слов `только|единствен|своего|ровно од` по §2 (строки
    364–902): сверх 9 строк найдены Р12 «признак нового устройства у `session.issued` ставит только
    путь входа» и Р15 «приёмник читает только `notify`». Оба держатся: у Р12 выдавателей сессии в
    kaname ровно три (`IssueSession` зовут `login.go:551`, `recovery_complete.go:309`,
