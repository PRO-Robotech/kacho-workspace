non_blocking:
  N2-1: >-
    NTF2-54 узел (3): «статический граф вызовов» не назван алгоритмом. Если проверка флага стоит за
    портом (вызов через интерфейс), граф без диспетчеризации интерфейсов путь не найдёт и гейт будет
    красен на верном дереве. Назвать алгоритм (с разрешением вызовов через интерфейс — CHA/VTA либо
    равносильный) или записать, что вызов функции стоит в методе действия либо в функции, вызываемой
    напрямую. Гейт и вызовы заводит одна под-фаза (NTF-2), поэтому это согласуется при реализации.
  N2-2: >-
    NTF2-54 (в): достижимость ссылки из метода действия слабее, чем «ветка выключенного флага
    возвращает значение функции» — действие, где ссылка достижима по другой ветке, а отказ собран
    отдельно, узел (3) пропустит. При побайтовом совпадении текста это ловят только (1) и (3) вместе
    и только частично; при расхождении — NTF2-51. Остаточная граница названа не вся; стоит дописать её
    к «границе узла (1)».
  N2-3: >-
    NTF2-51: в одном процессе П6 версия corelib одна — выбранная сборкой модуля пробы; `go.mod`
    kaname может закреплять более раннюю. Условие «пин модуля пробы, отличный от пина kaname, — не
    выполнилось» может держать сценарий в «не выполнилось» постоянно, пока kacho требует более новую
    corelib. Сравнивать с выбранной версией (её kaname в процессе и исполняет) и печатать обе;
    «не выполнилось» оставить только для случая, когда функции на выбранной версии нет.
  N2-4: >-
    NTF2-59 (д): после подъёма хранилища проба не печатает, что его состояние пережило остановку
    (выдача `C` и отметка одноразовости). Если хранилище пробы теряет состояние, (д) либо зелен
    вакуумно, либо красен не по продукту. Напечатать предпосылку (запись `C` на месте) и без неё —
    «не выполнилось».
  N2-5: >-
    Шапка называет NTF-1 редакции 16 одобренной — это верно по записи 390b5a33….yaml, но после неё
    разбор классов RA-12 (коммит 7236d99a0) вернул NTF-1 в приёмку. Задетые им пункты (D08 — триггеры
    CI и др.) не касаются NTF1-F21, G22, N06, `DeliveryNotConfigured`; закрепление отпечатком верно.
    При редакции 17 NTF-1 шапку стоит пересверить той же командой.
