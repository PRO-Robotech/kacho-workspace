premise: >-
  Подтверждена: отпечаток 99845fe4… воспроизведён (`sha256sum`). Р3 и Р11 называют владельца в
  единственном числе (`owner_user_id`). NTF2-96 — адресаты `U` и `O`, блокируется `O`. Близнец
  NTF2-100 — `owner_user_id` = `X`. Фикстуры «второй владелец» нет. Адресация владельца — только
  `Resolve{account_owner}`, путь через `DescribeScope` и `account_reader|project_reader` не заводится.
  Иерархия и привязки строятся только глаголами `Create`, у каждого есть шаг ожидания. Опровергнута
  в части «второго механизма нет — держится»: держатель слеп к слою хранилища (B2-2).
