previous_items:
  B1-1: >-
    ЗАКРЫТО в части членства и материализации. Членство строит `MembershipService.Create` сессией
    владельца без пары «проект + роль». Для известного адреса с активной личностью членство сразу
    `ACTIVE`, письма нет: `membership_service.proto:80-96` («почта ИЗВЕСТНА … сразу ACTIVE»;
    «Активной … личности письмо не уходит») и `user_repo.go:627` (`CASE WHEN i.invite_status =
    'PENDING' …`). Утверждение `state = ACTIVE` после каждого членства, печать потолков и «не
    выполнилось» при превышении есть. Шаг `AuthorizeService.Check` стоит перед каждым зависимым
    глаголом. Новое правило про уровень входа 2 породило B2-1.
  B1-2: >-
    ЗАКРЫТО в части определения. Р11 называет одну функцию — разрешитель владельца аккаунта, двух
    её вызывающих и запись в §4. NTF2-100 сверяет адрес строки с ответом разрешителя в обоих
    положениях `owner_user_id`. Держатель «второго читателя нет», то есть гейт NTF2-101, слеп к
    обходу через слой хранилища — см. B2-2.
  I1-1: ЗАКРЫТО — `C1` посевом, `C2` глаголом `GrantAdmin` сессией `C1` с шагом ожидания.
  I1-2: ЗАКРЫТО — `UserService.Block` для `W` вызывает `C1`; строки `user-blocked` выведены из счёта (г).
blocking:
  - id: B2-1
    kind: CONSTRUCTIBILITY
    summary: >-
      Новое правило П11 об уровне входа 2 перечисляет два глагола, а в дереве их 30. Применённое к
      `U` из NTF2-90, оно делает предписанный порядок When неисполнимым: `U` сам выпускает себе токен
      (уровень 2) раньше, чем строка «заведение фактора U». Фактор заведён посевом — заведение
      отвергается. Фактора нет — отвергается выпуск токена.
    evidence:
      - >-
        П11 (строка 1809): «Человеку, который в посеве или в When зовёт глагол с полом уровня входа 2
        (`required_acr_min = 2`: `MembershipService.Create`, `AccessBindingService.Create`), посев
        той же формы заводит и второй фактор».
      - >-
        kaname@0dd03218a613, предикат: `git grep 'required_acr_min)  *= "2"' -- proto/kaname/cloud/iam/v1/*.proto`
        → 30 RPC. Среди них глаголы When этой приёмки: `SAKeyService.Issue` (NTF2-100, `X`),
        `UserTokenService.Issue` (NTF2-90, `U`), `UserService.Block` (`C1`),
        `UserService.RemoveFromAccount` (NTF2-96, `M`), `InternalClusterService.GrantAdmin` и
        `RevokeAdmin` (`C1`), `ProjectService.Delete` и `AccountService.Delete` (`O`),
        `UserService.ResetSecondFactor` (`C1`), `ServiceAccountService.Disable` (`O`),
        `AccessBindingService.Revoke` и `Delete`.
      - >-
        `user_token_service.proto` у `Issue`: `required_relation = "token_issuer"`,
        `required_acr_min = "2"`. `fga_model.fga:568`: `define token_issuer: subject` — выпустить
        токен `U` может только сам `U`.
      - >-
        NTF2-90 When (строки 3190–3215): «строки в порядке таблицы» кроме четырёх последних.
        `user_token.issued` («выпуск токена U») стоит раньше `user.second_factor_enrolled`
        («заведение фактора U»). `sf_enroll.go:125-127`: при заведённом факторе —
        `ErrSecondFactorAlreadyEnrolled` («second factor is already enrolled»).
    consequence: >-
      Проба NTF2-90 падает красным на построении: либо отказ по уровню входа на выпуске токена, либо
      `SECOND_FACTOR_ALREADY_ENROLLED` на заведении фактора. Таблица 22 событий не сходится, а
      красный читается как дефект продукта. Неполный перечень в скобке П11 к тому же позволяет
      понять правило как «фактор только у тех, кто зовёт два названных глагола». Тогда `X` в NTF2-100,
      `M` в NTF2-96 и `C1` получают отказ по уровню входа в When.
    required: >-
      В П11 заменить перечень в скобке предикатом: глаголы с полом 2 — те, что даёт
      `git grep required_acr_min` на пине. Назвать, у кого из людей фактор заводится посевом. Для
      `U` в NTF2-90 (и в сценариях «как в NTF2-90») построение задать явно. Например: фактор `U`
      посевом не заводится, строка `user.second_factor_enrolled` исполняется первой из глаголов `U`
      с полом 2, сразу за ней сессия `U` повышается церемонией полосы формы, и только потом идёт
      выпуск токена. Порядок `second_factor_removed` → повторное заведение → `ResetSecondFactor`
      согласовать с тем, что после снятия фактора у `U` уровня 2 нет. Либо назвать другое
      построение, при котором обе строки исполнимы.
  - id: B2-2
    kind: PRODUCER
    summary: >-
      Гейт NTF2-101, держатель правила «читатель `owner_user_id` для адресации ровно один», ищет
      чтения только внутри «пакетов-адресователей». Для kaname это слепое место: SQL с
      `owner_user_id` по раскладке живёт в слое хранилища, а не в этих пакетах. Второй читатель в
      самой вероятной форме — новый метод хранилища, который зовёт обработчик `Resolve` или писатель
      аудита, — гейт не видит. Где лежит сам разрешитель, не сказано. Поэтому печать «одно чтение
      внутри разрешителя» на близнеце либо невыполнима, либо требует, чтобы разрешитель стоял в
      пакете-адресователе, а этого текст не задаёт.
    evidence:
      - >-
        NTF2-101 When (строки 3417–3420): «Пакеты-адресователи он выводит из дерева … пакет, который
        ставит строки ленты `kaname`, и пакет, который регистрирует сервер справочника адресатов. В
        каждом таком пакете он разбирает не-тестовые чтения `owner_user_id`». Инъекция (б) кладёт
        второго читателя «в пакете, который регистрирует сервер справочника» — то есть в простой
        случай, который гейт видит.
      - >-
        kaname@0dd03218a613: `git grep -c owner_user_id -- 'internal/repo/kaname/pg/*.go'` →
        account_repo.go 6, user_repo.go 3, iam_extension_repos.go 1, pgmaperr.go 1,
        visibility_repo.go 1. Текст запросов с колонкой — только в `internal/repo/kaname/pg`.
        Писатели аудита разнесены по пакетам глаголов (`git grep -l audit_outbox` → access_binding,
        account, cluster, group, …).
      - >-
        Если пакет-адресователь — `internal/repo/kaname/pg` (строки ленты вставляются в одной
        транзакции с `audit_outbox`), то в нём уже 12 не-адресных чтений `owner_user_id`. Тогда
        близнец «находок 0» невыполним: в тексте нет предиката, отделяющего чтение «для адресации».
      - >-
        NTF-3 на 17635b5a… слова «разрешитель» не содержит (`grep -c разрешител` → 0). Реализатор
        NTF-3 о переиспользовании узнаёт только от гейта NTF-2. Значит, гейт — единственный
        держатель «второго механизма нет» и для NTF-3.
    consequence: >-
      Обработчик `Resolve{account_owner}` (NTF-3) может получить свой метод хранилища: SQL
      `owner_user_id` плюс подтверждённый адрес со своим понятием ACTIVE. Гейт останется зелёным,
      NTF2-100 тоже (он сверяет только писателя аудита с разрешителем). Получается ровно тот второй
      путь, который запрещают Д131 и указание владельца «без обходных путей».
    required: >-
      Определить вселенную гейта так, чтобы обход через слой хранилища был виден. Например:
      транзитивно по графу вызовов от пакетов-адресователей (писатель строк ленты `kaname`,
      сервер справочника) любой путь до чтения `owner_user_id` проходит через разрешитель. Чтение —
      это текст запроса с колонкой или поле аккаунта в домене, в любом пакете дерева. Назвать пакет и
      функцию разрешителя. Добавить инъекцию (г): новый метод в `internal/repo/kaname/pg` с SQL
      `owner_user_id`, вызванный из пакета сервера справочника мимо разрешителя → красный с файлом и
      строкой. Близнец печатает число осмотренных путей и пакетов. Если выбран иной предикат — тот,
      что отделяет адресное чтение от остальных 12, — назвать его и показать на дереве как есть
      «находок 0».
important:
  - id: I3-1
    kind: CONVENTION
    summary: >-
      В §4 записано, что NTF-3 переиспользует разрешитель, а сам NTF-3 (17635b5a…) об этом не
      говорит. Нужна строка в NTF-3 Р7 — это правка соседней приёмки, с новым кругом её ревью. Иначе
      о том же предмете будут два места, и верно из них одно.
  - id: I3-2
    kind: FORMAT
    summary: >-
      П11 называет «заведение второго фактора» событием посева, строки которого не считаются. Но
      фактор заводится «посевом той же формы», то есть состоянием, и события у этого нет. Нужно
      выбрать одно: либо фактор заводится глаголом (и событие есть), либо из перечня событий посева
      его убрать.
