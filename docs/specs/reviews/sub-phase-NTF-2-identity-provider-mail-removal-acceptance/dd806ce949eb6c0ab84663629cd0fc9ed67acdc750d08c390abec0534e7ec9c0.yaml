blocking:
  B-1:
    kind: COVERAGE
    where: >-
      §6б таблица «ручка → поведение», строки `authn.login.mail-throttled-interval` и
      `authn.login.{recovery,verification,registration}-code-ttl`; NTF2-68; NTF2-40/41, NTF2-65,
      NTF2-83; Р6; Д11
    text: >-
      Редакция 9 объявляет правило таблицы: у каждой ручки есть сценарий, красный, если ручку читает
      только страж старта. Для ручек-длительностей держатель утверждает лишь сторону «после срока»,
      а сторону «до срока» — далеко от границы. (1) `mail-throttled-interval` (Д11: «не чаще раза в
      7 дней»; таблица: «новая строка не раньше `Ts + Ti`»): NTF2-68 (а) проверяет отсутствие второй
      строки только в пределах ряда (`Tc + Fl − 1 с`, при ориентирах около 7 ч), (б) — новую строку
      не раньше `Ts + Ti`. Реализация с постоянным интервалом 1 сут (нижняя граница Р8) или «одно
      письмо на сутки» проходит (а) и (б), нарушая Д11. (2) Сроки кода: NTF2-41 и NTF2-83 утверждают
      «срок + 1 с — код не принят», NTF2-65 — истечение через `Fl` часов; живость кода утверждается
      только вскоре после постановки (NTF2-40 — после первой паузы). Реализация с постоянным сроком,
      равным нижней границе 5 мин, проходит все три. Держатель пола (`Tc + Fl − 1 с` / `Tc + Fl`),
      окна перебора (`Tf + W − 1 с` / `Tf + W`), срока метки и приглашения обе стороны уже держит —
      то есть класс выполнен частично, а §6б объявляет его закрытым.
    required: >-
      NTF2-68: добавить момент строго до `Ts + Ti` — часы на `Ts + Ti − 1 ч` (свежие окна), ряд до
      первого `capped` в момент `Tq < Ts + Ti` (печатается) — новой строки `mail-throttled` нет; затем
      запрос с исходом `capped` в момент ≥ `Ts + Ti` — строка есть. Сроки кода: в NTF2-41, NTF2-83 и
      NTF2-65 (или отдельной строкой) — предъявление кода в `срок − 1 с` принято (`200`), в
      `срок + 1 с` — `401`; для `recovery` запрос в `срок − 1 с` шлёт тот же код. Провести класс по
      всем ручкам-длительностям Р8 и в таблице «ручка → поведение» назвать обе стороны для каждой.
important:
  I-1: >-
    NTF2-68 (а) «строк `mail-throttled` ровно одна» верно только при конце ряда (а) раньше `Ts + Ti`.
    Границы Р8 это допускают нарушить (`Ti` ≥ 1 сут, `Fl` до 24 ч, `per-hour` 1 при `per-day` 20).
    Объявить в Given условие «конец ряда < `Ts + Ti`», печатать оба момента, иначе «не выполнилось» —
    как NTF2-60 объявляет `F < P < H`.
  I-2: >-
    §6в: перечень символов времени назван «выборкой из текста §6», но `T_alarm` (NTF2-07) в нём нет и
    NTF2-07 не в числе 13. Построение у `T_alarm` есть; поправить перепись, чтобы число было верным.
  I-3: >-
    NTF2-65: символ `K1` в сценарии не определён (первый код ряда NTF2-64 истекает задолго до `Tc`).
    Назвать: `K1` — код письма в `Tc`.
  I-4: >-
    §6б «Границы и отсутствие каждой ручки судит NTF2-71» — NTF2-71 снимает пять ручек из десятков.
    Либо сказать «выборкой», либо назвать держатель полноты (например, журнал старта печатает все
    ручки Р8 и проба сверяет перечень с таблицей Р8).
  I-5: >-
    П6-age описывает один аккаунт, а NTF2-69 (в) требует `young` и `mature` одновременно. Назвать
    построение: `mature` заведён в `T`, `young` — в `T + 2 сут`, часы на `T + Ya + 1 сут`.
repeated_kinds_note: >-
  COVERAGE — четвёртый круг подряд на документе (4991…, 33e1…, a4f1…, эта запись). Число
  блокирующих убывает (6 → 3 → 1). Класс здесь уже в форме задания («ручка → поведение»), но
  критерий не требует обеих сторон границы для длительностей. Предлагаемая формулировка шага для
  диспетчера (§14а): «у ручки-длительности держатель утверждает `−1 с` и момент срока».
