blocking:
  B-1: >-
    [PRODUCER] У «Тогда» §6б строки Р8 (6) «гейт `assert-scan-stubs-hide-nothing.py` судит записи
    `helm.values`» два производителя. Приёмка (§6б (6), §7 строка NTF2-71 (е)) пишет: «сегодня гейт
    читает только `helm.set` … расширение вносит D6 тем же изменением». Посылка измерена на
    `6edea09c2ee`, но это не база NTF-2. По Р16 п.1 NTF-2 начинается, когда NTF-1 влита. Маршрут NTF-1
    в дереве (`docs/changes/issue-2915/tasks.md`, строка D1, @9b1aded1e) несёт в путях `trivy.yaml` и
    `deploy/scripts/assert-scan-stubs-hide-nothing.py`. Замысел NTF-1 (`design.md` З28 «Новый
    отслеживаемый чарт» (в), (г)) заводит форму `helm.values` в D1 и расширяет гейт заглушек на неё
    своей формулой «гасит / без предмета» и своей инъекцией (чужой чарт). После Д53 это полоса D1s,
    той же волны, что D1. Значит, на базе NTF-2 гейт уже судит `helm.values`, а семантика «без
    предмета», «гасит» и печати объёма у него — NTF-1. Два изменения одного файла из двух полос с
    разной семантикой — это не держатель, а конфликт посадки. Утверждение «файл в `helm.values` им
    не судится» на базе NTF-2 ложно. Что сделать: переписать (6) и §7 от базы NTF-2. Гейт заглушек на
    форме `helm.values` производит NTF-1 D1s (Д53). Дельта D6 — запись `edge.yaml` в
    `helm.values`, печать чартов, выпавших из осмотра без записи, «пустой перечень выпавших на
    `edge.yaml` — красный» и проба (7). Если D6 правит гейт NTF-1, это названо как правка чужого
    гейта с его текущей формулой. Предпосылка печатается на базе полосы: гейт читает `helm.values`,
    иначе «не выполнилось». Условие Р16 п.1 это уже покрывает — нужна строка, а не новое условие.
non_blocking:
  N-1: >-
    [PRODUCER] §6б (7): «файла нет или он не разобрался — "не выполнилось"». После D6 `edge.yaml` —
    продукт полосы, и его отсутствие — дефект, а не несозданное условие. Сейчас это держат (1) (у
    рендера нет источника → красный) и (2) (голый рендер) — стоит сказать, что (7) это не держит, а
    держат (1) и (2). Можно также сделать отсутствие красным.
  N-2: >-
    [FORMAT] Ключ ручки в значениях чарта края в приёмке не назван: названа только переменная
    `KACHO_API_GATEWAY_TRUSTED_HOPS`. Множество (7) `{<ключ ручки>}` получит литерал только из
    замысла. Можно назвать его или записать, что имя задаёт замысел З28.
orders:
  - to: acceptance-author (NTF-2)
    what: "B-1: (6) и §7 NTF2-71 (е) — расширение гейта заглушек на `helm.values` производит NTF-1 D1s (Д53); дельта D6 — запись `edge.yaml`, печать выпавших чартов, (7); посылка — от базы NTF-2, а не от `6edea09c2ee`. N-1, N-2 — по желанию."
  - to: design author (NTF-1)
    what: >-
      Замысел NTF-1 @9b1aded1e противоречит приёмке NTF-2. З28 (г), заметка N24 и §13 Е12 (12)
      говорят: «в корне — только в `notify-standalone/values.yaml`», «D6 нового файла не заводит»,
      «D6 вписывает строку ручки в те же файлы». Приёмка NTF-2 Р8 (одобрена в редакции 26,
      сохранена в редакции 27) устроена наоборот: ключ ручки в корне только в
      `notify-standalone/edge.yaml`, `notify-standalone/values.yaml` ключа не несёт (§6б (5) —
      красный). Приёмка выше замысла — замыслу привести формулировки к ней. Замечено при наличии
      незакоммиченной правки `design.md` (редакция 28, Д53) в той же рабочей копии; сверено с
      закоммиченным 9b1aded1e.
