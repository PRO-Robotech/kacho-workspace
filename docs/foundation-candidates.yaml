# ВЕДОМОСТЬ ВЫНОСА — решения по предметам со ВТОРОЙ ПРОПИСКОЙ.
#
# Держатель нормы `arch-second-home-needs-a-decision`
# (`.claude/rules/architecture.md` §«Переиспользование»). Судят её
# `scripts/foundation-candidates/check-01-*` и `check-02-*`; измеряет
# `scripts/foundation-candidates/list-candidates.py`.
#
# ТРЕБОВАНИЕ ВЛАДЕЛЬЦА 2026-09-20, дословно:
#   «все общие библиотеки, которые могут быть вынесены должны быть вынесены
#    в corelib а не хорониться в проекте»
#
# ВЕДОМОСТЬ САМОИСТЕКАЕТ В ОБЕ СТОРОНЫ, как ведомость пар: кандидат без записи
# — находка, запись без предмета — тоже находка. Запись снимается ТЕМ ЖЕ
# изменением, которым снят её предмет.
#
# СЛОВАРЬ РЕШЕНИЙ ЗАКРЫТ — три:
#   move    вынос состоится; обязана называть задачу (`issue`);
#   keep    отказ от выноса. ДОВОД СУДИТСЯ ПО СУЩЕСТВУ, а не по непустоте:
#           непустота производится дописыванием любого текста, и `why:
#           "по усмотрению"` прежде проходил зелёным. Поэтому запись обязана
#           нести ДВА машинных факта:
#             class:     класс отказа из ЗАКРЫТОГО словаря восьми исключений
#                        (`scripts/foundation-candidates/_core.py` EXCLUSIONS);
#                        девятого нет по `arch-second-home-exclusions-closed`;
#             evidence:  координата `<продукт>:<путь>`, резолвящаяся в `.go`
#                        ИМЕННО ТОГО пакета, о котором запись, в стволе его
#                        продукта — дописать её нельзя, нужен настоящий файл;
#             why:       фраза для человека; несущей она больше НЕ является.
#           Граница названа вслух: ИСТИННОСТЬ класса для названной координаты
#           машинно не проверяется и держится вниманием — приёмкой записи
#           человеком и `check-verifier`;
#   sunset  предмет объявлен ПОД СНЯТИЕ; обязана называть задачу. Это же
#           признак ИСКЛЮЧЕНИЯ 8: живость класса критерий спросить не умеет,
#           и без записи он предписал бы вынос в пакет, который снимается.

