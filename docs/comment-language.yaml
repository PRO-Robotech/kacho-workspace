# она не достигает никогда. Поэтому её несходимость обязана быть видна числом,
# а не ощущением.
#
# ПРЕДИКАТ СНЯТИЯ, УМЕЮЩИЙ ОТВЕТИТЬ «НЕТ»: число, выдаваемое замером, НЕ РАСТЁТ
# от релиза к релизу. Не упало два релиза подряд — назначается волна: первая по
# пробам (единица дешёвая, поведение продукта не меняется), вторая по не-пробам.
# Нормы снимаются, когда число дошло до нуля и держится нулём релиз подряд.

