# Точное множество требуемых держателей изменения kn-296 — посадка эпика
# kaname#296 в `main` службы доступа. Образец формы — `docs/changes/issue-2713/holders.yaml`.
#
# ЗДЕСЬ НЕ ОБЪЯВЛЕН НИ ОДИН ИСХОД. Вердикт по человеческому держателю — внешнее
# событие актора из `docs/changes/policy.yaml` §2 (сейчас pointpu) на отпечаток,
# названный в `change.yaml`. Пред-посадочные записи `reviews/pre-landing/` —
# записи агентов: событием роли не являются и держателя не закрывают.
#
# ЛИНИЯ ДВИЖЕТСЯ: отпечаток `change.yaml` снят 2026-10-14 (origin/296 68d24ae6, финальная голова); после сдвига головы
# каждая запись на прежнем отпечатке новую линию не судит.
schema_version: 1
change_id: kn-296

# ── ПРИМЕНИМОСТЬ РОЛЕЙ: все роли review_authority ───────────────────────────
# Освобождённых нет: у каждой роли предмет в изменении есть, а для полей о
# дереве службы доступа освобождение и не пересчитывалось бы — PRO-Robotech/kaname
# не назван в policy.yaml §1 (`change.yaml`, шапка).
role_applicability:

  acceptance-reviewer:
    status: applicable
    holder: human-acceptance
    reason: >-
      линия добавляет и меняет 27 приёмок в `docs/engineering/acceptance/`
      (`change.yaml`, acceptance_set_predicate).

  class-exposure-analyst:
    status: applicable
    holder: [human-class-exposure-initial, human-class-exposure-revalidation]
    reason: >-
      названы и приёмки, и замысел: первичный разбор — на отпечаток приёмок,
      перепроверка — на отпечаток замысла.

  design-reviewer:
    status: applicable
    holder: human-design
    reason: >-
      линия несёт документ замысла
      `docs/engineering/acceptance/passwordless-login-with-access-key-design.md`;
      вердикт — только событие pointpu на его отпечаток, ничем не заменяется.

  db-architect-reviewer:
    status: applicable
    holder: human-post-diff-db
    reason: >-
      `git diff --name-only 8a84dcff...68d24ae6 -- '*/migrations/*' '*.sql'` = 66
      путей, из них 13 новых миграций `.sql`; предикат `no-migrations-in-change` ложен.

  go-style-reviewer:
    status: applicable
    holder: human-post-diff-go
    reason: дифф несёт 1664 пути `*.go` (8a84dcff...68d24ae6).

  proto-api-reviewer:
    status: applicable
    holder: human-post-diff-proto
    reason: >-
      `proto_files_touched` = 25 (proto/kaname/cloud/iam/v1/); предикат
      `no-proto-in-change` ложен.

  system-design-reviewer:
    status: applicable
    holder: human-post-diff-system
    reason: сессия, отсечка субъекта, отзыв и рёбра к краю платформы.

  wave-reviewer:
    status: applicable
    holder: human-wave
    reason: >-
      линия собрана слияниями волн: `git rev-list --merges --count
      8a84dcff..68d24ae6` = 214; предикат `no-lane-merges-in-change` ложен.

  integration-tester:
    status: applicable
    holder: [prod-ci, prod-newman-e2e]
    reason: >-
      роль — владелец проб и первого прогона; отдельной человеческой записи не
      даёт, держит машинных держателей ниже.

  convergence-reviewer:
    status: applicable
    holder: human-convergence
    reason: единственная роль, выпускающая конечную запись контура.

  landing-reviewer:
    status: applicable
    holder: human-landing
    reason: >-
      применённое содержимое сверяется с одобренным после посадки; до неё исход
      держателя — «не выполнилось».

required_holders:

  # ── машинные ──────────────────────────────────────────────────────────────

  prod-ci:
    kind: machine
    owner: integration-tester
    executable: .github/workflows/ci.yml на запросе эпика kaname#714
    predicate: все задания конвейера службы доступа зелены на голове из `change.yaml`
    evidence_coordinate: evidence/prod-ci/
    producer_exists: >-
      `.github/workflows/ci.yml` отслеживается на origin/main kaname 8a84dcff
      (`git ls-tree --name-only 8a84dcff .github/workflows/`).

  prod-newman-e2e:
    kind: machine
    owner: integration-tester
    executable: .github/workflows/e2e-newman.yml на запросе эпика kaname#714
    predicate: >-
      второй эшелон — сквозные пробы по развёрнутому, отдельно от
      unit/integration (`00-kacho-core.md#ban12-second-echelon`)
    evidence_coordinate: evidence/prod-newman-e2e/
    producer_exists: >-
      `.github/workflows/e2e-newman.yml` отслеживается на origin/main kaname 8a84dcff.

  # ── человеческие ──────────────────────────────────────────────────────────
  # Исхода нет ни у одного: событий актора на отпечаток 5c7b9183… не было; события на прежний 746c6166… — в записях ролей, линию 68d24ae6 они не судят.

  human-acceptance:
    kind: human-external
    owner: acceptance-reviewer
    executable: внешнее review event на отпечаток каждой приёмки набора
    predicate: каждая приёмка набора одобрена на текущем отпечатке
    evidence_coordinate: evidence/human-acceptance/

  human-class-exposure-initial:
    kind: human-external
    owner: class-exposure-analyst
    executable: внешнее review event на отпечаток набора приёмок
    predicate: пункты exposure приёмок разобраны и сопоставлены
    evidence_coordinate: evidence/human-class-exposure-initial/

  human-class-exposure-revalidation:
    kind: human-external
    owner: class-exposure-analyst
    executable: внешнее review event на отпечаток замысла
    predicate: пункты exposure перепроверены против замысла
    evidence_coordinate: evidence/human-class-exposure-revalidation/

  human-design:
    kind: human-external
    owner: design-reviewer
    executable: внешнее review event pointpu на отпечаток замысла (`change.yaml`, design_sha256)
    predicate: замысел одобрен на текущем отпечатке
    evidence_coordinate: evidence/human-design/

  human-post-diff-db:
    kind: human-external
    owner: db-architect-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: применённые миграции не правлены, инварианты на уровне БД, Down у каждой
    evidence_coordinate: reviews/post-diff/db-architect-reviewer/

  human-post-diff-go:
    kind: human-external
    owner: go-style-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: раскладка слоёв цела, мёртвого кода и маркеров отсрочки нет, пробы в том же изменении
    evidence_coordinate: reviews/post-diff/go-style-reviewer/

  human-post-diff-proto:
    kind: human-external
    owner: proto-api-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: контракт совместим (`buf breaking`), конвенции API соблюдены
    evidence_coordinate: reviews/post-diff/proto-api-reviewer/

  human-post-diff-system:
    kind: human-external
    owner: system-design-reviewer
    executable: внешнее review event на точный отпечаток содержимого изменения
    predicate: распределённые свойства целы, отказ соседа фейлится закрыто, лишних рёбер нет
    evidence_coordinate: reviews/post-diff/system-design-reviewer/
    distributed_surface: true

  human-wave:
    kind: human-external
    owner: wave-reviewer
    executable: внешнее review event на отпечаток собранной линии
    predicate: полосы, лежащие рядом, не решают одну задачу дважды и не отменяют правку соседа
    evidence_coordinate: reviews/wave/wave-reviewer/

  human-convergence:
    kind: human-external
    owner: convergence-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: >-
      множество ролей сверено с review_authority в обе стороны, записи — на
      текущем отпечатке, отпечатки базы и головы названы
    evidence_coordinate: evidence/human-convergence/

  human-landing:
    kind: human-external
    owner: landing-reviewer
    executable: внешнее review event на посаженное содержимое
    predicate: >-
      канонический набор диффа посаженного совпадает с объявленным в
      `change.yaml` (canonical_diff_set_sha256)
    evidence_coordinate: evidence/human-landing/

# ── отличия от образца `issue-2713` ─────────────────────────────────────────
#   1. Приёмки и замысел — НАБОРЫ документов в дереве продукта; отпечатки —
#      наборов (`change.yaml`).
#   2. Пред-посадочные записи `reviews/pre-landing/<роль>/` — перенос записей
#      агентов; держателей не закрывают. Здесь лежит только запись
#      db-architect-reviewer; совместные по двум эпикам записи go-style и
#      system-design лежат один раз — в `docs/changes/issue-1266/reviews/pre-landing/`.
#      Записи proto-api-reviewer и security-auditor того же захода в публичное
#      дерево не перенесены (`security-disclosure.md`).
#   3. Каталога `evidence/` пакет не несёт, как и образец.
