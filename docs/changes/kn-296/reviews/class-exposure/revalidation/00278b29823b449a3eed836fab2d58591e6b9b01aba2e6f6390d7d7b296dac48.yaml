numbers:
  - claim: набор замыслов — 2 документа, отпечаток 00278b29…
    measured: design_set_predicate @8a84dcff...edf8c641, единица — путь
    result: 2 пути, 00278b29…; на 68d24ae6 тот же предикат даёт efa1b3d0… (1 путь)
  - claim: отображено 98 из 98, каждый ровно одной строкой
    measured: два предиката — по написанию (id строк таблиц) и по предмету (строка несёт непустые столбцы решения и механизма)
    result: 98 из 98, дубликатов 0
  - claim: каждая названная проба есть в дереве
    measured: >-
      имена Test* из обоих замыслов против `git grep -hoE '^func (Test…)\('`
      в *_test.go @68d24ae6 и @edf8c641; единица — имя функции
    result: 219 имён, отсутствующих 0 на обеих ревизиях; отрицательный контроль находится
  - claim: координаты путь:строка указывают на существующее место
    measured: каждый путь — git cat-file -e @68d24ae6, номер строки — не больше длины файла; содержимое прочитано у 52 мест (все места строк Ф13 §1а и D1…D14, выборка 18 прочих)
    result: 109 координат, нарушений 0; прочитанные строки — названный символ
  - claim: 'D12 — одно объявление проверяющего, два вызывающих'
    measured: git grep -n 'VerifyAssertion(' @68d24ae6 -- internal cmd, без *_test.go
    result: объявлений 1 (verify.go:409), вызывающих 2 — совпало
  - claim: '§3 — чужого кода портом нет'
    measured: git grep -l 'github.com/ory' @68d24ae6 -- '*.go' go.mod go.sum
    result: 0 файлов — совпало
  - claim: 'Р-1 — признак обнаружимости не хранится; проб Ф7-56/57 нет'
    measured: >-
      git grep -niE 'discoverab' @68d24ae6 -- internal/migrations internal/repo → 0;
      второй предикат по предмету — то же слово во всём нетестовом internal → 4 файла,
      все — отказ «не обнаружим» на приёме церемонии, не хранение; страж revoke.go
      judgeLastMethod — условие hasPassword || keys > 1 (строки, не годные);
      git grep -nE 'F7_5[67]|Ф7-5[67]' -- '*_test.go' → 0 (контроль F7_47 → 4)
    result: подтверждено
  - claim: >-
      'Р-2 (§6а замысла Ф13, F13-D9) — у человека с заведённым вторым фактором вход
      ключом без проверки пользователя счёт по адресу не обнуляет'
    measured: >-
      чтение @68d24ae6: internal/assurance/level.go — строка правила «утверждение
      ключа доступа (любое)» даёт «2» при любых флагах; GuaranteedLevels берёт ключ
      в худшем исходе флагов (KeyAssertion(false, true)) и потому не даёт «3» ни
      на одном сочетании; humansession/completed_login.go —
      loginCompletedToEnrolledLevel: требуемый уровень — максимум GuaranteedLevels
      заведённого (пароль, второй фактор, ключ) ≤ «2»; достигнутый уровнем входа
      ключом ≥ «2». Комментарий у GuaranteedLevels говорит то же прямо.
    result: >-
      ОПРОВЕРГНУТО. Вход ключом обнуляет счёт по адресу при любом заведённом
      наборе, как требует Ф13 Р9; не обнуляет лишь при нечитаемом заведённом
      (enrolledKnown = false) — исход, который Ф3 Р10 разрешает как «счёт остаётся».
      Расхождения кода с Р9 нет.
  - claim: 'Р-3 (§6а замысла Ф13, F13-D5-D6) — вход ключом читает строку пароля'
    measured: >-
      access_key_login.go:463 → completed_login.go enrollmentBeforeWrite →
      enrolledForCompletion → second_factor.go enrolledMethods (чтение строки вида
      password) @68d24ae6
    result: >-
      подтверждено. Добавлено измерением: на исход обнуления у полосы ключа строка
      пароля не влияет — при заведённом ключе требуемый уровень «2» даёт сам ключ,
      и пароль его не повышает. Чтение можно снять кодом, не трогая ни Ф13 Р6, ни
      Ф3 Р10.

