axes:
  atomicity_no_dual_write:
    status: closed
    note: >-
      Новых пар «коммит ресурса, затем событие» нет. Вытеснение прежней смены,
      строка принятого запроса, списание окна адресата и намерение письма
      остаются одной транзакцией. Отказ ErrNewEmailIsCurrent возвращается до
      Commit, и отложенный Rollback (email_change.go, defer после
      EmailChangeWriter) снимает уже выполненное SupersedeEmailChangeCodes.
  idempotency:
    status: closed
    note: >-
      Запрос на адрес, ставший текущим, даёт тот же отказ поля
      (RuleMustDiffer), что раннее суждение до транзакции, — наружу это один
      отказ, и повтор его не меняет.
  atomic_and_optimistic_concurrency:
    status: closed
    note: >-
      Check-then-act (адрес прочитан с сессией ДО транзакции, затем запись)
      закрыт ban #10-способом: условие `EXISTS (SELECT 1 FROM users WHERE id=$2
      AND lower(email) <> lower($3))` стоит в ТОМ ЖЕ операторе вставки, что
      темп; решение — число вставленных строк. Под READ COMMITTED снимок
      оператора берётся после того, как транзакция получила FOR UPDATE на
      строке личности (первый оператор EmailChangeWriter), поэтому чужой исход
      смены, зафиксированный за время ожидания замка, оператор видит.
      Объясняющее чтение после отказа (emailChangeAddressIsCurrentSQL) идёт под
      тем же замком и выбирает только имя отказа, а не исход. Сравнение —
      `lower(email)`, тем же выражением, что ключ users_identity_email_uniq.
    concurrent_probe: >-
      internal/apps/kaname/api/internal_iam/email_change_address_under_person_lock_integration_test.go
      (TestIntegration_EmailChangeRequestJudgesTheAddressCommittedDuringIt): исход смены держит
      незафиксированную транзакцию, запрос ждёт её замка (pg_blocking_pids), после фиксации —
      отказ поля и ноль живых строк; близнец отличается одним фактом (другой адрес) и принят.
    lock_order: >-
      Порядок замков kaname#770 не изменён. Новое условие читает users обычным
      SELECT внутри оператора, строку уже держит FOR UPDATE этой транзакции,
      нового захвата нет. Цикла ожидания с писателями двери дельта не вводит.
  change_delivery_polling:
    status: not_applicable
    note: Watch и серверного стрима нет; outbox и подписку дельта не трогает.
  worker_coordination:
    status: not_applicable
    note: Новых воркеров, реконсайлеров и внешних вызовов нет.
  cross_service:
    status: closed
    note: >-
      Новых рёбер нет. Контракт для kacho не тронут:
