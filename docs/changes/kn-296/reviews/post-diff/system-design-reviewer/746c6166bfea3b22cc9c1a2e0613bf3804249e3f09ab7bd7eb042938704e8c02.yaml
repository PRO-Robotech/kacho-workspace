axes:
  atomicity_no_dual_write:
    status: closed
    note: >-
      Новых пар «коммит ресурса, затем событие» нет. Исход смены адреса остаётся
      одной транзакцией (адрес, снятие сессий и кодов, аудит, строка очереди
      смены субъекта); дельта меняет только силу первого замка и добавляет
      чтение уровня до первой записи.
  idempotency:
    status: closed
    note: >-
      IssueChallenge одним оператором INSERT … ON CONFLICT (form_context) WHERE
      consumed_at IS NULL DO UPDATE. Цель конфликта совпадает с частичным
      уникальным индексом access_key_login_challenges_live_context_idx
      (internal/migrations/20261005032942_login_challenge_is_bound_to_the_form_context.sql:74).
      Повторная или одновременная выдача на том же контексте отказа не даёт,
      живым остаётся одно испытание.
  atomic_and_optimistic_concurrency:
    status: closed
    note: >-
      Пара «DELETE живого, затем INSERT» в одной транзакции (под READ COMMITTED
      вторая выдача упиралась в ключ) заменена одним оператором с арбитром.
      Переписанная строка, которую соперник потребил за время ожидания, выходит
      из-под предиката индекса, и оператор вставляет новую. Испытание,
      предъявленное после замещения, уже не находится по прежнему значению
      challenge (PK), то есть однократность сохраняется. Условие уровня у смены
      адреса и у заведения/подтверждения второго фактора решает чтение
      заведённого ВНУТРИ транзакции записи после FOR UPDATE на строке личности.
      Это единственная сила, конфликтующая с FOR KEY SHARE проверки внешнего
      ключа при вставке user_access_keys, поэтому окна check-then-act между
      чтением заведённого и фиксацией глагола нет. Первое чтение вне транзакции
      остаётся ранним отказом и ничего не разрешает: решает второе.
    concurrent_probes:
      - internal/repo/kaname/pg/access_key_login_issue_race_integration_test.go
        (TestF13_03_IssueReplacesALiveChallengeCommittedByAConcurrentTransaction,
        TestF13_03_IssueInsertsAfterAConcurrentTransactionConsumedTheLiveChallenge,
        TestF13_03_ConcurrentIssuesOnOneContextAllSucceedAndLeaveOneLive — 16 выдающих)
      - internal/apps/kaname/api/internal_iam/enrolled_read_under_person_lock_integration_test.go
      - internal/apps/kaname/api/internal_iam/recovery_request_lock_order_integration_test.go
    lock_order: >-
      FOR UPDATE берётся первым оператором (holdPersonAgainstEnrollment
      отказывает, если транзакция уже держит личность, так что подъёма силы
      посреди транзакции нет). Встречный порядок, который даёт FOR UPDATE против
      писателя «ребёнок раньше личности», закрыт переводом запроса кода
      восстановления на PersonWriter (личность раньше recovery_codes). Опись
      писателей строк, которые пишут глаголы двери, лежит в шапке
      lockPersonAgainstEnrollmentSQL. Самостоятельно сверена транзакция
      завершения регистрации ключа: она берёт строку access_key_challenges
      (глаголы двери её не пишут), затем личность проверкой внешнего ключа
      вставки user_access_keys. Цикла ожидания с дверью нет.
  change_delivery_polling:
    status: not_applicable
    note: Watch и серверного стрима дельта не вводит; outbox и подписку не трогает.
  worker_coordination:
    status: not_applicable
    note: Новых воркеров и реконсайлеров нет; новых внешних вызовов нет.
  cross_service:
    status: closed
    note: Новых межсервисных рёбер нет; правка polyrepo.md не требуется.
  replica_state_isolation:
    status: closed
    note: >-
      Моменты выдачи и предела испытания — now() базы, а не часы реплики; кэшей
      в памяти дельта не вводит.
  edge:
    status: closed
    note: >-
      Второй замок пола (PublicCallerPolicy.gatewayFloor) стоит на трёх
      публичных глаголах AccessKeyService (BeginRegistration, FinishRegistration,
      Revoke). Internal*-методов на внешнем крае дельта не добавляет. Пол берётся
      из встроенного каталога (required_acr_min "1" → "2"). Проба
      TestKN747_ServiceHoldsLevelTwoOnKeyVerbsWithoutTheEdge судит НАСТОЯЩИЙ
      каталог (loadRealACRCatalog), так что пол, снятый из каталога, она увидит.
  clean_architecture:
    status: closed
    note: >-
      Порт EnrollmentWriter объявлен в use-case (iface.go), реализация лежит в
      repo/pg. Use-case pgx не импортирует; связывание EnrolledMethodsReader
      проверяет email_change_level_wiring_test.go.

