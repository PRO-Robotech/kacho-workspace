approved:
  error_wrap_and_mapping: >-
    Новый sentinel ErrNewEmailIsCurrent распознаётся через errors.Is (email_change.go:388)
    и отображается в тот же FieldError{RuleMustDiffer}, что и ранний отказ: наружу
    один отказ, текст sentinel'а не уходит. Ошибка чтения после отказа оператора
    идёт через mapErr, отсутствие строки — iamerr.Wrapf(ErrNotFound, литерал с id).
    Сравнений err.Error() со строкой нет.
  db_invariant: >-
    Условие «адрес отличен от текущего» перенесено в тот же условный INSERT … WHERE
    EXISTS, что и темп: решение и запись — один оператор под замком строки человека,
    без check-then-act. Уточняющее чтение после отказа выбирает только имя отказа,
    а не исход. email NOT NULL (0001_initial.sql:3101), поэтому Scan в bool NULL не
    получит.
  context: 'в прод-дельте нет context.Background/TODO; ctx идёт в оба оператора транзакции'
  no_panic: 'panic, Must*, log.Fatal в прод-дельте нет (совпадения Must[A-Z] — только RuleMustDiffer)'
  logging: 'новых вызовов журнала нет; сбой хранилища — через прежний storeFailed по user_id'
