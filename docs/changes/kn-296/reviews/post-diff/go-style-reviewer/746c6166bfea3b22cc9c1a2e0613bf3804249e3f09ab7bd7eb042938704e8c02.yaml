approved:
  error_wrap_and_mapping: >-
    Новые отказы — sentinel'ы и типизированные ошибки (ErrStoreUnavailable,
    *StepUpRequiredError, iamerr.Wrapf(ErrInternal, литерал)). Причина уходит в
    журнал, наружу идёт фиксированный текст iamerr.TextStepUpRequired. На краю
    HTTP отображение идёт через errors.As (handler.go:1373), на gRPC — через
    GRPCStatus с литералом. Сравнений err.Error() со строкой и эха текста
    драйвера наружу в дельте нет. Ошибки репозитория идут через mapErr.
  context: >-
    В прод-дельте нет context.Background/TODO. ctx передаётся в каждое чтение
    заведённого и в каждую транзакцию. Все 16 совпадений context.Background в
    дельте находятся в _test.go.
  no_panic: 'panic, Must*, log.Fatal в прод-дельте нет'
  logging: >-
    Четыре новых вызова — d.Logger.ErrorContext со структурными полями user_id и
    err. Персональных данных (адреса) в ключах нет: коррелируют по user_id.
    fmt.Print, log.Print, Sprintf в журнале в прод-дельте нет.
  thin_handler: >-
    handler.go добавляет только ветку отображения *StepUpRequiredError
    (заголовок и фиксированный текст). Условие уровня живёт в use-case
    (email_change_level.go, sf_enroll_level.go), SQL — в repo/kaname/pg.
  layering: >-
    use-case зовёт хранилище через порты: EnrolledMethodsReader,
    Store.EnrollmentWriter и методы Writer. pgx в humansession не импортируется.
    Связывание — в cmd/kaname/loginlane.go. Конструктор отказывает при
    Methods == nil (email_change.go, complete()).
  naming_ascii: >-
    Новые идентификаторы латиницей (EnrolledMethodsReader, requireEmailChangeLevel,
    guaranteedRank, StepUpRequiredError, holdPersonAgainstEnrollment,
    PublicGatewayFlooredRPCs, isReservedInvalidName). Механический проход по
    объявлениям func/type/var/const добавленных строк дал 0 не-ASCII.
  constants: >-
    Порог уровня не выписан литералом, а выводится правилом (assurance.GuaranteedLevels,
    acrlevel.Rank). Имена методов вынесены в именованные const.
  go_mod: 'go.mod в дельте не тронут; новых рёбер модулей нет (corelib/acrlevel уже был импортирован)'

