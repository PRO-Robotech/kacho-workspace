axes:
  db_level_invariant:
    status: closed
    note: >-
      «Отличен от текущего» перенесён из чтения до транзакции в условие
      INSERT … SELECT … WHERE EXISTS (SELECT 1 FROM users WHERE id=$2 AND
      lower(email) <> lower($3)) AND <темп> (email_change_repo.go,
      insertEmailChangeCodePacedSQL @68d24ae6). Выражение то же, что у ключа
      users_identity_email_uniq (lower(email), 0001_initial.sql:5080). Решение —
      число вставленных строк, check-then-act нет (ban #10). Раннее суждение до
      транзакции осталось только ранним отказом и ничего не разрешает.
  lock_and_isolation:
    status: closed
    note: >-
      Транзакция READ COMMITTED (ceremonyWriterTx, oauth_ceremony_repo.go:524)
      открыта EmailChangeWriter → holdPersonAgainstEnrollment (SELECT … FOR
      UPDATE первым оператором, registration_store.go:87-95,
      human_session_repo.go:644). Исход смены переписывает users.email UPDATE-ом
      строки, конфликтующим с FOR UPDATE: он либо зафиксирован до замка, и снимок
      оператора записи его видит, либо ждёт фиксации запроса. Окна между
      условием и записью нет.
  refusal_classification:
    status: closed
    note: >-
      После отказа оператора причина читается под тем же замком
      (emailChangeAddressIsCurrentSQL): совпавший адрес → ErrNewEmailIsCurrent →
      FieldError{newEmail, RuleMustDiffer} — тот же отказ поля, что ранний;
      иначе — прежняя ветка темпа. users.email NOT NULL (0001_initial.sql:3101,
      последующих ALTER COLUMN email нет), поэтому сравнение не даёт NULL и
      сканирование в bool не падает. ErrNoRows под замком строки недостижимо и
      отображается в NotFound; прочее — mapErr (pgmaperr), текст драйвера наружу
      не выходит.
  rollback_on_refusal:
    status: closed
    note: >-
      Отказ возвращается до записи письма; транзакция снимается defer Rollback
      (email_change.go:353), снятие прежних кодов (Supersede) откатывается вместе
      с ней. Проба утверждает: живых строк смены после отказа ноль.
  concurrent_probe:
    status: closed
    note: >-
      internal/apps/kaname/api/internal_iam/email_change_address_under_person_lock_integration_test.go
      (TestIntegration_EmailChangeRequestJudgesTheAddressCommittedDuringIt):
      незафиксированный исход смены дверью продукта держит строку, запрос ждёт
      замка (pg_blocking_pids), исход фиксируется — запрос на ставший текущим
      адрес получает отказ поля и ничего не пишет; законный близнец отличается
      одним фактом (другой адрес) и принят.
  migrations_hygiene:
