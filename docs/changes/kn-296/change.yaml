      role: package-home
      base_sha: 6f10d7e212b43ddf7cf43ff07a00675df75cdec9
      cutover_is_ancestor_of_base: true    # git merge-base --is-ancestor 1202e3cf… 6f10d7e2 → 0
    - repo: PRO-Robotech/kaname
      role: subject-tree
      branch: '296'
      base_sha: 8a84dcff6eb1ccde68113353ba28d1e1e399f0e6   # origin/main @2026-10-13
