# Пересчёт после сдвига линии. Шаги 1–4 меняют coordinates и hashes этого файла
# (наборы документов — их предикатами выше на новой паре); после правки
# holders.yaml — шаг 5 в hashes.holders_sha256. Запись ревью переносится на новый
# отпечаток только новым событием роли, не переименованием файла.
remeasure:
  - git -C "$KACHO_HOME_KANAME" fetch origin
  - B=$(git -C "$KACHO_HOME_KANAME" rev-parse origin/main); H=$(git -C "$KACHO_HOME_KANAME" rev-parse origin/296); git -C "$KACHO_HOME_KANAME" merge-base "$B" "$H"
  - git -C "$KACHO_HOME_KANAME" diff --full-index "$B"..."$H" | sha256sum
  - git -C "$KACHO_HOME_KANAME" diff --raw --no-abbrev "$B"..."$H" | awk -F'\t' '{split($1,a," "); print "PRO-Robotech/kaname\t" $2 "\t" a[2] "\t" a[4]}' | LC_ALL=C sort | sha256sum
  - sha256sum docs/changes/kn-296/holders.yaml

