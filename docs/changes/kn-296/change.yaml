# Манифест изменения kn-296 — посадка эпика kaname#296 («своя личность в
# службе доступа») из ветки `296` в `main` службы доступа. Эпик — дочерний
# kacho#1266 (пакет `docs/changes/issue-1266`). Имя — по соглашению `kn-<N>`
# соседних пакетов службы доступа (`docs/changes/kn-*`).
#
# Манифест НЕ несёт нормативной прозы (CG_HUMAN_MANIFEST_PROSE): применимость
# ролей и держатели — в `holders.yaml`. Образец формы — `docs/changes/issue-2713/`.
#
# ЛИНИЯ ДВИЖЕТСЯ. Голова и база перемерены 2026-10-14 с origin (после волн
# #779 и #781; #783 на момент замера не влита). Сдвинется голова — ВСЕ
# отпечатки ниже станут отпечатками прежней линии. Пересчёт — командами поля `remeasure`.
#
# РЕПОЗИТОРИЯ PRO-Robotech/kaname НЕТ в `docs/changes/policy.yaml` §1 (cutover
# назван только у kacho-workspace и kacho): освобождение по полю о дереве
# продукта (`migrations_touched`, `proto_files_touched`, `lane_merges_in_change`)
# производитель `applicability.py` для этого пакета не пересчитает — находка
# «§1 не называет cutover-коммит». Здесь ни одно такое освобождение не нужно:
# все три поля больше нуля.
