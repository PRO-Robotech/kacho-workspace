      role: package-home
      base_sha: 1e11702600a5d2168c20cff48261f704f8063241
      cutover_is_ancestor_of_base: true    # git merge-base --is-ancestor 1202e3cf… 1e117026 → 0
    - repo: PRO-Robotech/kaname
      role: subject-tree
      branch: '296'
      base_sha: 8a84dcff6eb1ccde68113353ba28d1e1e399f0e6   # origin/main @2026-10-13
