wiring_injection:
  question: >-
    «Держится ли провязка стража посадки чем-нибудь, кроме одной пробы?»
  holder_census: >-
    ОДИН предикат в ОДНОМ файле: присутствие текста
    `validateIdentityPosture(identityLane)` в `gateway/cmd/api-gateway/main.go`.
    Перепись по дереву (`grep -rn validateIdentityPosture --include=*.go .`):
    объявление + вызов в корне + 5 упоминаний, все в
    `gateway/cmd/api-gateway/identity_posture_validation_test.go`. Из них
    провязку судят ДВА утверждения — строки 112 и 125, — и оба читают
    ТЕКСТ ТОГО ЖЕ файла через общий помощник `compositionRoot(t)`
    (`hop_client_wiring_test.go:47`, `os.ReadFile("main.go")`).
  runs:
    - run: 1
      kind: 'КОНТРОЛЬ — дерево как есть'
      command: 'go test ./gateway/cmd/api-gateway/ -count=1'
      verbatim: 'ok  github.com/PRO-Robotech/kacho/gateway/cmd/api-gateway 2.867s · EXIT=0'
    - run: 2
      kind: 'ДЕФЕКТ — вызов стража снят из main(), больше не тронуто ничего'
      command: 'go test ./gateway/cmd/api-gateway/ -count=1'
      verbatim: |
        --- FAIL: TestCompositionRoot_RefusesToStartOnAnUndeclaredIdentityPosture (0.00s)
            identity_posture_validation_test.go:114: композиционный корень не зовёт стража посадки либо не падает на его отказе — страж, которого никто не зовёт, зеленит свои пробы и ничего не меняет в старте
        --- FAIL: TestCompositionRoot_JudgesThePostureBeforeItWiresByIt (0.00s)
            identity_posture_validation_test.go:127: страж посадки в корне не найден — порядок проверять не на чем
        FAIL  github.com/PRO-Robotech/kacho/gateway/cmd/api-gateway 2.824s · EXIT=1
      counts: 'зелёных 144 · красных 2 (перемерено `grep -c "^--- PASS"` / `"^--- FAIL"` на -v)'
      cascade: >-
        КАСКАДА НЕТ: покраснели ровно два утверждения о предмете. Они НЕ два
        держателя, а одно и то же: корень у обоих — отсутствие той же строки
        текста; второе печатает отказ ПРЕДПОСЫЛКИ («порядок проверять не на
        чем»), что и требуется от пробы порядка.
      guard_own_probes_stayed_green: |
        --- PASS: TestUnsetIdentityPostureRefusesTheStart (0.00s)
        --- PASS: TestUnsetIdentityPostureRefusesUnderEveryEnvLabel (0.00s)
        --- PASS: TestADeclaredIdentityPostureStillBoots (0.00s)
    - run: 3
      kind: >-
        ЗАКОННЫЙ БЛИЗНЕЦ — правка ТОЙ ЖЕ формы в ТОМ ЖЕ месте (снят соседний
        блок строк), отличается от дефекта РОВНО ОДНИМ фактом: вызов стража
        остался позванным корнем
      command: 'go test ./gateway/cmd/api-gateway/ -count=1'
      verbatim: 'ok  github.com/PRO-Robotech/kacho/gateway/cmd/api-gateway 2.717s · EXIT=0'
      reading: 'МОЛЧИТ — предикат судит вызов, а не прозу вокруг него.'
    - run: 4
      kind: >-
        ОСТАТОЧНЫЙ ЗАЗОР — текст вызова В main.go присутствует, но внутри
        функции, в которую main() не заходит; функция упомянута пробой, чтобы
        линтер `unused` молчал
      commands:
        - 'go test ./gateway/cmd/api-gateway/ -count=1'
        - 'golangci-lint run ./gateway/cmd/api-gateway/...'
      verbatim: |
        ok  github.com/PRO-Robotech/kacho/gateway/cmd/api-gateway 2.725s · TEST_EXIT=0
        0 issues. · LINT_EXIT=0
      reading: >-
        ЗЕЛЁНО ОБА. Провязка переживает СНЯТИЕ вызова, но не переживает его
        ПЕРЕНОС: предикат не умеет отличить «позван из main()» от «присутствует
        в тексте main.go». Промежуточная форма — функция, никем не позванная и
        НЕ упомянутая пробой, — ловится линтером (`unused` включён, для
        `_test.go` отключён), проверено отдельным прогоном:
        `main.go:53:6: func deadPostureGuard is unused (unused)`.
  answer: >-
    Провязка держится, но ОДНИМ предикатом в ОДНОМ файле, и предикат
    текстовый. Класс «страж, объявленный и не позванный» возвращается одним
    законно выглядящим шагом рефакторинга при полностью зелёной доске.

# ── критические находки: блокируют посадку ─────────────────────────────────
critical:
  - id: C1
    class: 'NO PER-CALL DEADLINE'
    where: 'gateway/internal/middleware/revocation_local.go:121 · gateway/internal/clients/session_revocations_client.go:148'
    what: >-
      Читатель отзыва на пути запроса зовёт соседа СЫРЫМ контекстом запроса:
      `c.local.IsSessionRevoked(ctx, jti)` → `a.client.IsRevoked(ctx, …)`.
      Своего `context.WithTimeout` нет ни здесь, ни в адаптере; дефолтного
      предела у соединений тоже нет (`mtls_config.go` — ни `WithTimeout`, ни
      `WithDefaultCallOptions`). Этим изменением снята ВТОРАЯ половина читателя
      — та единственная, что несла предел (`IntrospectionCache` с
      `Timeout: cfg.IntrospectionTimeoutMs`), — и полоса осталась без бюджета
      целиком. Соседняя полоса того же соседа по тому же соединению предел
      ставит: `basic_credential_lane.go:214`, `BasicCredentialCallBudget`.
    requirement: >-
      Вывести на этом вызове свой контекст с объявленной величиной бюджета,
      как у полосы базового секрета; величину назвать константой рядом.
    rule: 'architecture §arch-per-call-deadline · запрет роли «внешний вызов без своего дедлайна»'

  - id: C2
    class: 'DOC LIES ABOUT A SECURITY BUDGET'
    where: 'gateway/cmd/api-gateway/main.go:385'
    what: >-
      Журнал старта объявляет `per_call_timeout_ms` = `cfg.IntrospectionTimeoutMs`
      для полосы, у которой предела больше нет (C1). Перепись читателей ручки в
      прод-коде — ТРИ: `main.go:385` (эта строка журнала, величина никуда не
      подаётся), `main.go:412` и `main.go:421` (оба — хоп НАШЕГО авторитета
      отзыва, другая полоса). Строка пережила свой предмет внутри этого же
      диффа: бюджет уехал вместе с половиной читателя, а утверждение о нём
      осталось — и стоит ровно там, куда оператор смотрит.
    requirement: >-
      Либо применить бюджет (C1) и тогда утверждение станет истинным, либо
      снять поле. Третьего исхода у этой строки нет.
    rule: 'architecture §arch-doc-truthfulness'

  - id: C3
    class: 'SECURITY COMMENT CONTRADICTS THE CODE · SILENT FALSE ARM'
    where: 'gateway/cmd/api-gateway/main.go:378-380'
    what: >-
      Комментарий: «Поэтому ветки „а вдруг его нет“ здесь не заводится — она
      была бы веткой, в которой край всё равно не работает». Следующая строка —
      ровно эта ветка: `if iamConn := backends["iamInternal"]; iamConn != nil {`,
      и `else` у неё НЕТ. До этого изменения ветка только УЛУЧШАЛА читателя
      (падением было чтение чужого поставщика), и утверждение было близко к
      истине; теперь ложная ветвь оставляет путь запроса БЕЗ читателя отзыва
      вовсе, молча, а прежний `else` с `logger.Warn` снят этим же диффом.
    requirement: >-
      Привести комментарий к истине И сделать ложную ветвь наблюдаемой
      (отказ старта либо громкий доклад) — либо непредставимой.
    rule: 'security-hardening §hard-misleading-security-comment · §hard-revocation-reader-on-request-path · запрет роли «комментарий о защите, противоречащий коду»'

  - id: C4
    class: 'PII REGRESSION LOCK REMOVED WITH NO REPLACEMENT'
    where: 'снят gateway/internal/middleware/auth_kratos_pii_log_test.go · предмет переехал на gateway/internal/middleware/auth_own_session.go:134'
    what: >-
      Перепись держателей запрета «персональные данные в журнал не пишутся»
      по ВСЕМУ дереву: на базе — 1 (`git grep -l PII 925925ecb94 -- '*_test.go'`
      даёт ровно этот файл), на голове — 0 (та же команда на HEAD даёт пусто).
      Снятая проба утверждала на уровне НАБЛЮДАЕМОГО (буфер журнала не содержит
      почты, но содержит неперсональный идентификатор). Полоса, оставшаяся
      живой, несёт те же персональные данные — `HumanSession.Email`,
      `DisplayName`, — и её строка внедрения личности (`auth_own_session.go:134`,
      сегодня «type»/«id») отстоит от возврата класса на одну правку.
    requirement: >-
      Тем же изменением восстановить замок на НАБЛЮДАЕМОМ уровне для выжившей
      полосы: `tryOwnSession` и маршрут «кто я», успешный путь И путь ошибки.
    rule: 'security-hardening §hard-pii-regression-test · testing §regression-lock-at-observable, §security-fix-test-same-pr, §pii-assert-log-both-paths'

  - id: C5
    class: 'ACCEPTED VALUE WITH NO WIRING BEHIND IT'
    where: 'gateway/cmd/api-gateway/identity_posture_validation.go:54 · проба-замок identity_posture_validation_test.go:88-101 · bootposture.go:51'
    what: >-
      После этого изменения `identityposture.External` не встречается в
      прод-коде края НИ РАЗУ (перемерено: `grep -rn "identityposture.External"
      --include=*.go gateway/ | grep -v _test` → пусто). Корень ветвится по
      посадке только сравнением с `Own` (`main.go:183`, `main.go:1078`), то есть
      под `external` не провязывается ни читатель носителя, ни ответ «кто я», ни
      ретрансляция глаголов формы. При этом страж принимает `external` как
      законное значение, и это ЗАПЕРТО пробой
      `TestADeclaredIdentityPostureStillBoots`, а отчёт посадки
      (`bootposture.go:51`) печатает её как принятую. Перепись стендов на этой
      голове: «стендов осмотрено 7 · на посадке own 1 · на посадке external 6».
      То есть шесть из семи стендов объявляют значение, под которым край
      поднимается готовым и браузерного входа не заводит ни одного — ровно тот
      наблюдаемый исход, ради снятия которого страж и возвращён, только достигнутый
      ОБЪЯВЛЕННЫМ значением вместо унаследованного, и на нём в дереве не краснеет
      ничто. Опасность названа самим диффом
      (`gateway/deploy/values.yaml`: «Он НЕ умеет сказать „задано ПРЕЖНЕЕ, а
      прежнего больше нет“»), но в коде из этого не следует ни одного отказа.
    requirement: >-
      Страж обязан отвергать посадку, под которую у композиционного корня нет
      провязки: либо сузить словарь принимаемого краем до тех значений, которые
      корень исполняет, либо провязка под `external` должна существовать.
      Заодно снять замок в пробе, требующий принимать неисполнимое значение.
    rule: '00-kacho-core §ban14-production-grade · architecture §arch-lean-no-vestigial · api-conventions §«Неисполнимая возможность»'

  - id: C6
    class: 'WIRING JUDGED BY TEXT, NOT BY CALLEDNESS'
    where: 'gateway/cmd/api-gateway/identity_posture_validation_test.go:112 и :125 (общий помощник hop_client_wiring_test.go:47)'
    what: >-
      Провязка стража держится одним текстовым предикатом над `main.go`.
      Измерено инъекцией (раздел `wiring_injection`, прогоны 2-4): снятие вызова
      краснит (144 зелёных / 2 красных, каскада нет), законный близнец молчит,
      а ПЕРЕНОС вызова в функцию, в которую main() не заходит, оставляет
      зелёными и весь пакет, и линтер. Проверка, написанная на стража, по-прежнему
      не знает, зовут ли его; новый держатель ловит грубое снятие и не ловит
      перенос. Тем же приёмом держатся соседние хопы
      (`hop_client_wiring_test.go`), поэтому предмет шире одного стража.
    requirement: >-
      Судить ПОЗВАННОСТЬ, а не присутствие текста: разбор `package main` и обход
      от `main` — либо вынести последовательность стражей старта в функцию,
      возвращающую ошибку, и доказывать провязку ИСХОДОМ, а не строкой исходника.
    rule: 'gate-authoring §«Исход вместо объявления» · security-hardening §hard-control-carries-address-and-credential'

