    requirement: 'Привести разбивку к числу, которое печатает гейт.'

  - id: I3
    class: 'FILE BREAKS ITS OWN STATED RULE'
    where: 'gateway/internal/config/renamed_knobs.go:90'
    what: >-
      Запись `retiredKnobs["KACHO_HYDRA_JWKS_CA_FILE"]` выписывает новое имя
      `KACHO_API_GATEWAY_TOKEN_KEYSET_CA_FILE` ТРЕТЬИМ литералом — через
      абзац после того, как файл это запретил («третья копия имени разошлась бы
