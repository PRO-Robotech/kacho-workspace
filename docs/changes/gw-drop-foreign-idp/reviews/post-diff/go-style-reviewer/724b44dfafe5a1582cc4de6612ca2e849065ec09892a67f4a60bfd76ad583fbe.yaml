    class: 'DEAD WIRING SURFACE'
    where: 'gateway/internal/middleware/session_identity_handler.go:63, 77-81'
    what: >-
      Поле `subjectLookup` и НОВЫЙ экспортированный метод `WithSubjectLookup`
      не имеют ни одного вызывающего и ни одного читателя во всём дереве
      (перемерено `grep -rn WithSubjectLookup --include=*.go .` → только
      объявление; `h.subjectLookup` в файле больше не читается). Единственным
