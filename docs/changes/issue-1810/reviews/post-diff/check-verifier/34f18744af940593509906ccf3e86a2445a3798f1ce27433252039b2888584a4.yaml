#
# Имя файла — и есть content_digest: запись самоидентифицируется отпечатком
# отсуженного содержимого. Прежние записи не правятся; сменился дайджест —
# новый запуск и новый файл (change-graph §2 «вердикт привязан к ОТПЕЧАТКУ»).
#
# ЗАЧЕМ ЭТОТ ФАЙЛ. Вердикт по этой пачке выносился за сессию четыре раза — три
# возврата и одно принятие — и жил ТОЛЬКО в переписке. Вердикт, живущий в
# переписке, после паузы исчезает; ровно на этом посадочный рецензент остановил
# соседнюю пачку. Здесь записан ВЕСЬ путь приёмки, а не последняя галочка.
#
# И вердикт перед записью ПЕРЕМЕРЕН, а не переписан по памяти. Прежний прогон
# дал 15 опытов (число — со слов задания, мной оно не перепроверялось: прогон
# остался в переписке и артефакта не имеет). Опыты НИЖЕ поставлены заново, их
# 22, и каждый из ЧЕТЫРЁХ вердиктов воспроизведён своей командой: дефект,
# за который возвращали, внесён настоящим входом и показан красным на редакции
# ДО починки, закрытие показано на этой.
#
# ЛОВУШКА ОТПЕЧАТКА, И ЗДЕСЬ ОНА ХУЖЕ, ЧЕМ У СОСЕДНЕЙ ПАЧКИ. У issue-2678
# names_digest совпал у ТРЁХ разных содержимых подряд. Здесь под финальным
# names_digest 4d0b70ae… лежат ШЕСТЬ разных content_digest: состав из 22 путей
# не менялся последние шесть коммитов, а содержимое менялось каждым. Сверка
# «перечень имён тот же — значит, судили это» дала бы ложное «отсужено» на
# пяти чужих отпечатках. Перемерено моей командой, вывод — в digest_census.
