    - c4d6817ecd0  # content 5a498ea8a2cc…  (вне круга четырёх вердиктов)
  note: >-
    ШЕСТЬ разных содержимых под ОДНИМ перечнем имён. Состав диффа — 22 пути —
    не менялся последние шесть коммитов: ни одного заведённого, ни одного
