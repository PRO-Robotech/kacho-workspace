# ── что роняет инъекция ────────────────────────────────────────────────────
what_the_injection_drops:
  - subject: форма `pem` чистки
    drops: >-
      РОВНО СЕБЯ и ничего больше: на редакции до починки (опыт 9) соседние
      формы продолжают изымать — счётчик показывает `изъятий pem ×1`, а
      журнальные строки вокруг блока целы и на выходе, и на входе.
  - subject: ручка окружения шва (опыт 12)
    drops: >-
      РОВНО форму, названную в её значении: при `SKIP_FORM=pem` формы `key`,
      `header`, `jwt`, `query` продолжают изыматься — перемерено опытом 7 на
      том же наборе входов.
  - subject: общий предикат исполняемой части (опыт 14)
    drops: >-
      РОВНО две формы записи — литерал в кавычках и тело вложенного
      документа. Закомментированный вызов оставался невидимым и ДО починки
      (False на обеих редакциях), то есть починка не подменяла собой прежнее
      свойство, а добавляла к нему.
  - subject: снятие временного (опыты 16, 18, 19)
    drops: >-
      РОВНО счёт каталогов и копий программы: 43/2 против 0/0 на успехе,
      15 против 0 на каждом из двух перехватываемых сигналов. Число
      ИСПОЛНЕННЫХ случаев не меняется ни на одной редакции — 43 и там и там,
      то есть инъекция роняет оснастку, а не покрытие.

