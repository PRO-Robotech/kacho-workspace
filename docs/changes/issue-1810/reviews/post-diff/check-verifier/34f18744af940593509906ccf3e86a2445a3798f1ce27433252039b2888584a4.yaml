# ── перепись дайджестов (обе суммы, своей командой, по ВСЕМ 18 головам) ────
digest_census:
  command: >-
    for h in $(git rev-list origin/main..HEAD); do
      git diff origin/main...$h | sha256sum;
      git diff --name-only origin/main...$h | sort | sha256sum; done
  surveyed: все 18 голов ветки (единица счёта — коммит)
  distinct_content_digests: 18
  distinct_names_digests: 8
  heads_sharing_the_final_names_digest: 6
