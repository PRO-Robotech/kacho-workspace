    зеленящая вердикт, взаимоисключающие исходы в одном утверждении, вердикт,
    взятый из трубы, третья категория, зачтённая в успех.
  notes:
    - >-
      ВЫЧЕТА ТРЕТЬЕЙ КАТЕГОРИИ НЕТ, и это перемерено с двух сторон: чистка на
      нуле входов даёт код 3 и запрещает публикацию (опыт 11), гейт связи на
      нуле выкладок даёт код 2 и говорит «пустой обход вердиктом не является»,
      перепись третьей категории на пустом обходе — код 2. Ни один из трёх не
      зачитывает «не смотрели» в «чисто».
    - >-
      Ослаблением НЕ является снятие ручки `SCRUB_SELFTEST_SKIP_FORM`: объём
      проверяемого не сократился (43 случая и до, и после — опыты 16 и 17), а
      способ доказательства стал строже — подмена программы вместо ветви в
      программе.
    - >-
      Ослаблением НЕ является и разведение списков форм (осмотр знает `pem`,
      изъятие — нет): оно ДОБАВЛЯЕТ красное, а не снимает. Проверено самой
      самопроверкой: «незакрытый блок закрытого ключа → НАХОДКА, публикация
      запрещена».
    - >-
      Ни одного `skip`, ни одного закомментированного утверждения, ни одной
      пары взаимоисключающих кодов в диффе не найдено.

