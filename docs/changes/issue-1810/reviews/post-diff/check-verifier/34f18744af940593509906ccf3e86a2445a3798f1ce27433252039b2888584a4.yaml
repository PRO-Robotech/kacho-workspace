# ── чего подделка не различает ─────────────────────────────────────────────
# Отдельно от находок: это свойство инструмента, а не дефект работы. Первой —
# МОЯ СОБСТВЕННАЯ подделка, потому что на ней стоит вердикт по возврату 4.
what_the_double_cannot_tell_apart:
  - double: >-
      МОЙ СОБСТВЕННЫЙ прибор — счёт каталогов в своём TMPDIR
      (`find $TMPDIR -mindepth 1 -maxdepth 1 | wc -l`)
    blind_to: >-
      Он не отличает «СНЯЛО за собой» от «НЕ СОЗДАВАЛО вовсе». Ноль каталогов
      после прогона одинаково совместим с исправным снятием и с прогоном,
      который до создания временного не дошёл, — например упал на первом же
      случае или был собран так, что оснастки не заводит.
    how_it_is_closed: >-
      ТРЕМЯ независимыми числами из того же прогона, а не доводом.
      (1) Положительный контроль на редакции ДО починки: тот же счётчик, тот же
      TMPDIR, та же команда — 43 каталога (опыт 16). Значит, видеть каталоги он
      способен, и ноль на HEAD — это не слепота прибора.
      (2) Второй признак того же события: число запускаемых копий программы
      `scrub-mutant.py` — 2 до починки, 0 после. Копия создаётся ДРУГИМ
      создателем временного, чем корни фикстур.
      (3) Перепись исполненного в том же прогоне: «осмотрено случаев 43» на
      ОБЕИХ редакциях. Прогон, который «не создавал», не смог бы объявить 43
      исполненных случая — именно они временное и заводят. «Не создавало»
      опровергнуто числом, а не уверенностью.
  - double: синтетические объявления процессов в самопроверках обоих гейтов
    blind_to: >-
      НАСТОЯЩИЙ прогон GitHub Actions. Гейт связи судит ТЕКСТ объявления и не
      отличает «шаг объявлен и исполнится» от «шаг объявлен, но работа не
      запустится» — условие `if:` он сверяет как строку, а не исполняет. Как
      поведёт себя настоящая выкладка при коде 3 у чистки, этой записью не
      отсужено: фикстура показывает только то, что условие выкладки РАВНО
      условию чистки плюс `outcome == 'success'`.
  - double: мутантная копия программы вместо ручки окружения (то, чем закрыт возврат 3)
    blind_to: >-
      ДРЕЙФ ЯКОРЯ МУТАЦИИ. Копия делается текстовой заменой одного якоря в
      собственном исходнике; уедет якорь — подменять станет нечего.
      Смягчающее и перемеренное: рядом стоит проверка `якорь встречается
      ровно один раз`, иначе `AssertionError`, — то есть исчезновение якоря
      даёт красное, а не молчаливое зелёное. Это ровно та форма, которой
      ручке окружения быть не могло: ручка снимается снаружи, якорь — нет.
  - double: закрытый словарь имён удостоверений в самой чистке
    blind_to: >-
      ВСЁ, ЧЕГО В СЛОВАРЕ НЕТ. Молчание на незнакомой форме неотличимо от
      чистоты — это свойство названо в шапке первым пунктом перечня границ и
      выбрано СОЗНАТЕЛЬНО против «ищем похожее на секрет». Вторая половина
      выбора перемерена мной: файл, который нельзя прочитать и переписать
      доказуемо, публикацию ЗАПРЕЩАЕТ (двоичное с попаданием → находка;
      ноль входов → код 3).
  - double: '`openssl rsa -check` как мера восстановимости'
    blind_to: >-
      Он говорит о ВОССТАНОВИМОСТИ, а не о вреде: ключ, собранный из остатка,
      мог бы быть и не тем ключом, которым что-то подписано. Поэтому рядом
      стоит второе, более сильное утверждение — ПОБАЙТНОЕ равенство
      собранного исходному (опыты 9 и 12), и оно от суждения инструмента не
      зависит.

