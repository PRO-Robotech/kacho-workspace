  surveyed: >-
    Дельта отсуженного дерева (0fb21b3950…) к текущему (10e7555f65…):
    4 файла, +20 / −14 строк. Осмотрено целиком: 931 + 1287 строк Python и
    1260 + 655 строк объявлений процессов.
  classes:
    - class: комментарий YAML вне любого узла
      lines: 10 (пять снято, пять добавлено — в двух объявлениях процессов)
