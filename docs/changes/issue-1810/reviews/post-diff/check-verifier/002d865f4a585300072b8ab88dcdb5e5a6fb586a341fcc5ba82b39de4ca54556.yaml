# ── чего подделка не различает ─────────────────────────────────────────────
what_the_double_cannot_tell_apart:
  measured: >-
    Вердикт этой записи дан НЕ подделкой: прогонялись настоящие программы
    дерева на настоящем входе — закрытый ключ собран `openssl genrsa`, дефекты
    внесены в настоящие объявления процессов.
  the_one_double_in_the_loop: >-
    Единственный дублёр в контуре — подставной сканер в гарнитуре инъекций
    исхода скана. Он не различает ничего из поведения настоящего сканера:
    версию, формат отчёта, состав находок. Он различает РОВНО три кода
    возврата, и ровно это гарнитурой и утверждается.

# ── маски, вычеты, ослабления ──────────────────────────────────────────────
masks_deductions_weakenings:
  found: none
  surveyed: >-
