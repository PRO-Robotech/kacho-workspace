# Приёмка РАБОТЫ-ПРОВЕРКИ опытом — роль check-verifier. ПЕРЕМЕР НА СМЕСТИВШЕМСЯ
# ОТПЕЧАТКЕ.
#
# Имя файла — и есть content_digest: запись самоидентифицируется отпечатком
# отсуженного содержимого. Прежние записи не правятся; сменился дайджест —
# новый запуск и новый файл (change-graph §2 «вердикт привязан к ОТПЕЧАТКУ»).
# Запись `34f18744af94….yaml` осталась нетронутой: она о СВОЁМ отпечатке и
# верна для него.
#
# ЗАЧЕМ ЭТОТ ФАЙЛ. После приёмки на 34f18744af94… по полосе прошли правки
# ПУБЛИЧНОГО ТЕКСТА. Отпечаток сместился, и вердикт о другом отпечатке не
# принимается. Вопрос был поставлен так: переносится приёмка или нет — и чем
# это доказано. Здесь записан ответ и ТО, ЧЕМ он получен.
#
# ОТВЕТ: переносится. Основание — не «дельта косметическая» (это впечатление),
# а ЗАМЕР: разобранный YAML идентичен с обеих сторон, AST без докстрок
# идентичен, co_code модуля идентичен, и вывод ЧЕТЫРЁХ прогонов совпал
# ПОБАЙТОВО на обоих отпечатках. Прочтением здесь не установлено ни одно
# утверждение.
#
# ОДНА ОГОВОРКА, БЕЗ КОТОРОЙ ЗАПИСЬ БЫЛА БЫ ЛОЖЬЮ. Утверждение «дельта трогает
# только комментарии» звучало дважды от двух разных ролей и ТОЧНЫМ НЕ ЯВЛЯЕТСЯ:
# один из четырёх файлов правит ДОКСТРОКУ МОДУЛЯ — вычисляемый строковый
# литерал, часть AST и живой объект `__doc__`, — а не комментарий. Несущесть
# докстроки проверена ПОДМЕНОЙ, а не рассуждением (опыты 7 и 8).
#
# ЛОВУШКА ОТПЕЧАТКА. names_digest НЕ СДВИНУЛСЯ — он тот же, что у отсуженной
# редакции, и это уже СЕДЬМОЕ различное содержимое под одним перечнем имён.
# Сверка «перечень имён тот же — значит, судили это» дала бы здесь ложное
# «отсужено» седьмой раз подряд. Сверять только по content_digest.

