# ── ЧТО ИМЕННО ТРОГАЕТ ДЕЛЬТА, ПО КЛАССАМ СТРОК ────────────────────────────
# Классификация сделана РАЗБОРЩИКОМ, а не глазами: для Python — tokenize+ast,
# для объявлений процессов — разбор YAML со сверкой покрытия скалярных узлов.
# Это ровно тот класс, где интерпретатор и человек расходятся: строка внутри
# объявления может выглядеть комментарием и участвовать в исполнении, а
# докстрока модуля бывает предметом проверки.
