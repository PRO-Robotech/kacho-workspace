# ── находки ────────────────────────────────────────────────────────────────
# Классом и предикатом снятия. Координаты, имена ручек и формы, дающие ложное
# красное, принадлежат задаче, а не публичной записи: читатель этой записи
# публичен. Ни одна находка не блокирует перенос приёмки; все три заводятся
# отдельными задачами.
findings:
  - class: распознаватель не знает всех законных форм записи своего предмета
    what: >-
      Гейт связи сопоставляет ключ адресации ПОДСТРОКОЙ. Законная форма записи
      значения, обычная для оболочки, остаётся неузнанной, и гейт объявляет
      существующий вызов отсутствующим.
    side_of_error: >-
      Безопасная: красное там, где порядок. Сторона ошибки у гейта объявлена в
      шапке, но объявлена УЖЕ, чем есть на деле, — то есть шапка сейчас
      описывает предмет неполно.
    introduced_by_this_delta: >-
      НЕТ. Перемерено на отсуженном отпечатке: вывод побайтово тот же. Дефект
      заведён раньше и прежней приёмкой тоже не пойман.
    removal_predicate: >-
      Инъекция законной формы этого класса молчит, а инъекция настоящего
      отсутствия вызова по-прежнему краснит; обе — случаями самопроверки.
    blocks_transfer: false
  - class: самопроверка объявляет PASS, не назвав числа исполненного
    what: >-
      Самопроверка подъёма стенда печатает итог без переписи: «сколько
      исполнилось» из вывода не следует, хотя обе соседние самопроверки это
      число печатают. «Отказов 0» вердиктом не является, пока не сказано,
      сколько исполнилось.
    introduced_by_this_delta: 'НЕТ — тот же вывод на отсуженном отпечатке.'
    removal_predicate: >-
      Вывод несёт строку переписи с числом осмотренных случаев, и число
      получено тем же обходом, что и сами случаи.
    blocks_transfer: false
  - class: инъекция роняет не только свой предмет
    what: >-
      Снятие одной формы у чистки роняет два случая — саму форму и парную ей
      повторную сверку. Предмет у них общий, поэтому это не «красное от
      соседа»; но пара односторонне не читается и должна быть названа там, где
      объявлена инъекция.
    introduced_by_this_delta: 'НЕТ.'
    removal_predicate: >-
      У инъекции объявлено, какие случаи она роняет, и число совпадает с
      наблюдаемым.
    blocks_transfer: false

# ── названные границы ──────────────────────────────────────────────────────
named_borders:
  - >-
    Перенос обоснован СОВПАДЕНИЕМ ИСХОДОВ, а не доказательством, что текст
    дельты нигде не читается. Проверено, что его не читает ни один гейт дерева
    и что вывод четырёх прогонов и Go-гейтов совпадает; прогон настоящего
    конвейера при этом не ставился.
  - >-
    Классификация строк опирается на разборщики (tokenize/ast и разбор YAML).
    Их собственные слепые зоны этой записью не измерялись: сказано то, что они
    видят, а не то, чего в тексте нет вообще.
  - >-
    Число «седьмое содержимое под одним перечнем имён» — нижняя граница:
    перепись по всем головам новой ветки не повторялась, ряд переписан целиком.
  - >-
    Вердикт посадки этой записью не выносится. `blocks_landing: false`
    означает «мой holder посадку не блокирует», а не «отпечаток к посадке
    готов».

# ── изоляция ───────────────────────────────────────────────────────────────
isolation:
  own_copy: >-
    Отдельный клон в каталоге черновиков сессии, вне обоих репозиториев. Полоса
    читается другой ролью, поэтому worktree в общем каталоге git не заводился:
    объекты подключены к СВОЕЙ копии только на чтение.
  lane_copy_touched: false
  lane_copy_evidence: >-
    В копии полосы исполнялись ТОЛЬКО читающие команды (rev-parse, rev-list,
    log, diff, status, show, merge-base). Ветка не переключалась, временных
    файлов не создавалось, `git stash` не применялся. `git status --porcelain`
    пуст (0 строк) до и после; HEAD полосы за время работы сменился САМ, чужой
    рукой (3c66d3516c7 → b50b762c83e), и это замерено, а не вызвано мной.
  teardown: >-
    Собственный клон и его второй рабочий каталог сняты тем же заходом, которым
    заведены: `git worktree remove --force` и `rm -rf` (278 МБ); последующий
    `ls` по пути даёт «No such file or directory».
  foreign_state: >-
    У общего каталога git продукта 238 рабочих копий, моих среди них 0
    (`worktree list` — ни одной записи в каталоге черновиков). Корневая копия
    воркспейса: те же пять неотслеживаемых путей, что и до работы.
  shared_tree_edits: none
  code_of_the_lane_touched: false

