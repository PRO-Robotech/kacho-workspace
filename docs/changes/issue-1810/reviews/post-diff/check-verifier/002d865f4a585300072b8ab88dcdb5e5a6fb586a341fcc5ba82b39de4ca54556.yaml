      RC=1, FAIL, 23 из 24; упал ровно случай «чистка называет чужой шаг».
  - n: 15
    kind: инъекция одного факта
    what: из перечня форм чистки снята форма блока закрытого ключа
    command: python3 .github/scripts/scrub-publication.py --self-test
    outcome: >-
      RC=1, FAIL, 41 из 43. Упали ДВА случая, а не один: сама форма и парная
      ей повторная сверка. Предмет у них один, но пара названа здесь прямо —
      см. findings, класс 3.
  - n: 16
    kind: пустой обход
    what: гейт связи на наборе, где предмета нет вовсе
    command: python3 .github/scripts/assert-uploads-are-scrubbed.py --root <пустая фикстура>
    outcome: >-
      Три набора — работа без выкладок, пустой каталог объявлений, отсутствие
      каталога вовсе: RC=2 во всех трёх, с текстом «обход пуст, и ноль находок
      здесь ничего не означает». ЗЕЛЁНОГО НЕ ДАЁТ.
  - n: 17
    kind: пустой обход
    what: чистка на нуле входов
    command: python3 .github/scripts/scrub-publication.py … --root <пустая фикстура>
    outcome: RC=3, «Ноль входов — это „не смотрели“. Публикация запрещена.»
  - n: 18
    kind: ведомость
    what: сверка объявленного состава самопроверок с найденным
    command: bash deploy/scripts/run-gate-self-tests.sh --verify-discovery
    outcome: >-
      RC=0, PASS. Расхождение видно в ОБЕ стороны — и «самопроверка есть, в
      списке нет», и «в списке есть, самопроверки нет».
  - n: 19
    kind: не выполнилось
    what: обходчик доказательств инъекцией целиком
    command: bash deploy/scripts/run-injection-proofs.sh
    outcome: >-
      ⟳ НЕ ВЫПОЛНИЛОСЬ: оборван моим пределом времени на 211-й строке вывода.
      Ни зелёным, ни красным не считается и ни из чего не вычитается.

# ── что инъекция роняет ────────────────────────────────────────────────────
what_the_injection_drops:
  measured: >-
    Шесть одно-фактных инъекций (опыты 9, 10, 12, 13, 14, 15). Пять роняют
    ровно свой случай и называют его поимённо; шестая (опыт 15) роняет пару —
    форму и её повторную сверку, — и это названо, а не сглажено.
  three_runs: >-
    По каждой инъекции прогонов три: контроль на законном дереве, прогон с
    внесённым дефектом, прогон после возврата дефекта. Третий всякий раз давал
    вывод, ПОБАЙТОВО равный первому.

# ── на чём законный близнец молчит ─────────────────────────────────────────
what_the_lawful_twin_is_silent_on:
  measured: >-
    Четыре законных близнеца из пяти молчат: возвращённая ручка (11), текст
    докстроки отсуженной редакции (7), бессмысленная докстрока (8), возвращённый
    узел перечня (13, контрольный прогон).
  the_fifth: >-
    Пятый близнец — законная форма записи значения ключа адресации, известная
    оболочке, — ЗАСТАВЛЯЕТ гейт связи покраснеть. Ошибка в безопасную сторону
    (красное там, где порядок), и сторона ошибки у гейта объявлена; но объявлена
    она УЖЕ, чем есть на деле. Перемерено на ОТСУЖЕННОМ отпечатке: вывод
    побайтово тот же, значит свойство заведено раньше, дельтой не внесено и
    переноса приёмки не касается. Класс — в findings; координата и форма в
    публичной записи не приводятся и живут в задаче.

