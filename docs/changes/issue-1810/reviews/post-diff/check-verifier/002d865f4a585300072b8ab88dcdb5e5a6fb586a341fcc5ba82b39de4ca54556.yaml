        Разбор YAML обоих объявлений с обеих сторон: канонизованный документ
        ИДЕНТИЧЕН, суммы разобранного совпадают побайтово. Дополнительно
        построена карта строк, покрытых скалярными узлами: изменённых строк
        ВНУТРИ узлов — 0, то есть ни одна не лежит внутри блочного скаляра и
        ни одна не является комментарием оболочки внутри тела шага.
    - class: комментарий Python
      lines: 11 (пять снято, шесть добавлено — в гейте связи)
      how_established: >-
        tokenize: все изменённые строки несут только токен COMMENT. AST этого
        файла ВКЛЮЧАЯ докстроки идентичен с обеих сторон; co_code модуля
        идентичен.
    - class: ДОКСТРОКА МОДУЛЯ (не комментарий)
      lines: 6 (две снято, четыре добавлено — в чистке; литерал 122 → 124 строки)
      how_established: >-
        ast: изменённые строки лежат внутри первого выражения модуля —
        строкового литерала. AST *с* докстроками с обеих сторон РАЗЛИЧАЕТСЯ,
        AST *без* докстрок идентичен, co_code модуля идентичен.
      why_it_matters: >-
        Это единственное место дельты, которое интерпретатор вычисляет. Назвать
        его комментарием было бы ложью, и вердикт «косметика» здесь пришлось бы
        брать на веру. Поэтому несущесть проверена подменой — опыты 7 и 8.
    - class: исполняемая строка
      lines: 0
      how_established: >-
        Следствие трёх замеров выше: разобранный YAML идентичен, AST без
        докстрок идентичен, co_code идентичен. Ни одна строка, участвующая в
        вердикте хоть одной проверки, дельтой не тронута.
  outside_the_tree: >-
    Сверх дерева переписаны сообщения коммитов — ВСЕ восемнадцать заголовков и
    все тела (455 → 254 строки тел), а не одно сообщение. Сообщение коммита
    исполняемой строкой не является и в content_digest не входит: определение
