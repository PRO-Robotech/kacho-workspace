      (`strings.TrimSpace(e.Measured) != ""`). Значение «w», «неизвестно» или
      «см. отчёт» проходит молча и выглядит как названная ревизия.
    measured: >-
      ПРОЧИТАНО в foreignidpname.go:277 — условие пропуска
      `strings.TrimSpace(e.Measured) != ""`; подстановкой это не мерил, предикат
      виден целиком. В пробе-близнеце значение задано правдоподобным
      («bec320cf47d»), так что разница между правдоподобным и произвольным не
      судится ничем.
    why_it_matters: >-
      Класс тот же, что у ведомости с потолком вместо точного числа: требование,
      удовлетворимое чем угодно, перестаёт быть наблюдением. Не блокирует, потому
      что закрываемый класс (ГОЛОЕ число) закрыт целиком, а дрейф числа ловится
      обходом дерева при каждом прогоне.
    requirement: >-
      Судить ФОРМУ, а не наличие: короткий хеш — не менее семи знаков из
      [0-9a-f]. Разрешимость (`git cat-file -e`) НЕ требовать: она привязала бы
      гейт к глубине клона.
    blocking: false
  - id: V4
    class: ТРЕТЬЯ КАТЕГОРИЯ НАЗВАНА В СЛОВАХ ВОЗВРАТА, НО НЕ В ТЕКСТЕ ИЗМЕНЕНИЯ
    coord: 'сообщение коммита 9624b4d7a2a; internal/repohygiene/foreignidpname_injection_test.go:351-386'
    finding: >-
      Полоса честно говорит, что одна из трёх пар «красное → зелёное» началась не
      с красного, а с несобравшегося дерева. В изменении этого различения нет
      нигде: ни в сообщении коммита, ни в шапках трёх новых проб.
    measured: "`git show 9624b4d7a2a | grep -inE 'не собр|несобр|не выполн|компил|условие не созд|третья категор'` → 0 совпадений."
    why_it_matters: >-
      Вердикт привязан к отпечатку, а не к разговору (change-graph §2):
      переживает изменение то, что в нём написано. «Не выполнилось» ≠ «красное»
      (testing-verdict), и следующий читатель, увидев три пробы и слово
      «инъекция», зачтёт в красное то, что красным не было.
    requirement: >-
      Одна строка в сообщении коммита либо в шапке пробы: какая пара началась с
      несобравшегося дерева и почему это «условие не создано», а не отказ.
    blocking: false

style_non_blocking:
  - id: S1
    coord: 'internal/repohygiene/foreignidpname.go:268-284 · foreignidpname_injection_test.go:360'
    note: >-
      Пропуск провенанса возвращается ФРАЗОЙ (`[]string`), тогда как все прочие
      расхождения этого гейта — `ForeignIDPNameFinding` с File/Line/Kind, и рядом
      стоит собственное основание: «Виды расхождений. Названы константами, чтобы
      инъекция утверждала ВИД, а не подстроку текста» (:232). Новая проба
      утверждает подстроку («gateway/») — ровно то, от чего эта дисциплина
      уводит. Координаты у записи ведомости тоже нет: называется область, а не
      место объявления записи.
  - id: S2
    coord: internal/repohygiene/foreignidpname_test.go:22-23
    note: >-
      Шапка по-прежнему утверждает «Число каждой записи … обязано СОКРАЩАТЬСЯ», а
      запись gateway/ этим же изменением ВЫРОСЛА 99 → 102 с названным основанием.
      Гейт ловит дрейф в обе стороны и такой исход допускает («переутвердить
      новое свойство того же предмета»), но норма в шапке об исключении молчит.
      Одна оговорка — «растёт только вместе с названным в записи основанием» —
      снимает противоречие между нормой и ведомостью, которую норма описывает.

