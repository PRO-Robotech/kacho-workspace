  - Арифметика ведомости сходится с обходом: 102+3+1 = 106 = перепись, находок 0

# ── РАДИУС: ТА ЖЕ ИДИОМА У СОСЕДЕЙ ───────────────────────────────────────────
#
# Вердикта по чужим файлам роль не выносит — ниже только замер и ответ на
# вопрос «стоит ли это предмета».
radius:
  unit: 'файл, несущий ТОЧНОЕ объявленное число, сверяемое с обходом дерева'
  measured_by_the_mechanism_not_by_the_diff: >-
    Обход `internal/repohygiene` по признаку «литеральное число в записи
    ведомости, сверяемое с обойдённым» даёт ЧЕТЫРЕ файла:
      · foreignidpname_test.go — предмет этого круга, ревизию теперь несёт;
      · clusteranchorbeyondgo.go:189-191 — `Count: 1` на docs/architecture/…md;
      · kanamenameresidue.go:1398 — `Count: 2` на шаблон чарта umbrella;
      · poolcloseunbounded_test.go:92-94 — карта `poolCloseDebt{"services/nlb": 24}`.
    Ревизии не несёт НИ ОДНО из трёх последних: `grep -oE '[0-9a-f]{11,40}'` по
    этим файлам — ни одного совпадения. Числа полосы (четыре · три) подтверждены
    в моей же единице.
  is_it_worth_a_subject: >-
    ДА, одним предметом на класс, а не тремя. Все три числа — переписи о
    ОБЛАСТЯХ, которые правят соседние полосы: `poolCloseDebt` держит 24 на всём
    тестовом дереве services/nlb (сдвинет любая полоса, добавившая закрытие пула
    в пробу), две другие — счёт вхождений на конкретном файле (сдвинет любая
    полоса, правящая тот файл). То есть механизм красного сведения у них ТОТ ЖЕ:
    число снято обходом одной головы, судит дерево другой. Отличие одно и в
    пользу срочности: у них нет даже шапки с ревизией, которая у ведомости имён
    поставщика хотя бы была.
    Предикат снятия предмета: у каждой записи ведомости с ТОЧНЫМ числом стоит
    ревизия обхода, и проба предпосылки её требует.
  no_verdict_on_those_files: >-
    Вердикта по ним не выношу: они не в разрезе этого отпечатка, и их живость я
    мерил признаком идиомы, а не прогоном их гейтов.

