the_injection_argument:
  claim: >-
    'автор: переименование метода дублёра `LookupOrUpsertFromKratos` увело бы
    производство на другую ветвь резолва МОЛЧА — обе пробы окна перехода остались
    бы зелёными, перестав наблюдать заведение зеркала, ради которого заведены'
  verdict: ПОДТВЕРЖДЁН ЦЕЛИКОМ, И ЭТО ГЛАВНЫЙ ФАКТ КРУГА
  measured: >-
    ПОДСТАНОВКА в отсоединённой копии головы: в
    gateway/internal/middleware/session_carrier_precedence_test.go:835 метод
    дублёра `upsertingLookup` переименован `LookupOrUpsertFromKratos` →
    `LookupOrUpsertFromProvider`. Результат прогона обеих проб окна перехода:
      · TestTransitionalWindow_ARefusedForeignSessionCreatesNoMirror — PASS
        (до: «заведений зеркала 0 · поисков субъекта 0 · код 401»;
         после: те же 0/0/401 — проба не изменилась ничем);
      · TestTransitionalWindow_AnAdmittedForeignSessionStillResolvesItsSubject — PASS
        (до: «заведений зеркала 1 · поисков субъекта 0 · код 200»;
         после: «заведений зеркала 0 · поисков субъекта 1 · код 200»).
    Обе зелёные, а наблюдаемое подменилось: законный близнец перестал наблюдать
    заведение зеркала и стал наблюдать обычный поиск субъекта. Единственный след
    подмены — строка t.Logf, которую никто не утверждает.
  mechanism_read_from_the_code: >-
    Производство выбирает ветвь ПРИВЕДЕНИЕМ ТИПА:
    gateway/internal/middleware/auth.go:1312 `if kl, ok := a.subjectLookup.(KratosSubjectLookuper); ok`
    и session_identity_handler.go:213 — то же. Компилятор дублёра к порту НЕ
    привязывает: утверждения вида `var _ KratosSubjectLookuper = (*upsertingLookup)(nil)`
    в дереве нет ни одного (`grep KratosSubjectLookuper` — пять координат, ни
    одной проверки присвоением). Отсюда и молчание: дублёр отпадает от порта
    без единой диагностики.
  nine_declaration_sites: >-
    ПОДТВЕРЖДЕНО, единица — МЕСТО ОБЪЯВЛЕНИЯ. Девять: порт auth.go:112 (поле
    интерфейса) · метод clients/iam_subject_client.go:165 · метод дублёра
    session_carrier_precedence_test.go:835 · шесть имён проб
    (iam_subject_client_test.go:148,172,240 · iam_subject_blocked_test.go:27,49 ·
    iam_subject_upsert_noflush_test.go:24). Производственных из них два
    (auth.go:112, iam_subject_client.go:165) — объявленному равно.
  arithmetic_of_the_alternative: >-
    ПОДТВЕРЖДЕНО: на 99 снятием не выйти. 102−2 = 100, 102−4 = 98, 102−7 = 95 —
    99 не получается ни одной законной границей.

