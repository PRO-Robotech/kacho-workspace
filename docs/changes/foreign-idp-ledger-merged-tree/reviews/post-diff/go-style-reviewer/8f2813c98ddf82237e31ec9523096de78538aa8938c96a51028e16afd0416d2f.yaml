    class: TWO FORMS OF ONE ACT
    coord: >-
      internal/repohygiene/gitrevparentargv_test.go:111 (`_ = repohygienePackageWalk(...)`)
      против internal/repohygiene/gatecarrierbase_test.go:479 (`repohygienePackageWalk(...)`)
    subject: >-
