critical:
  - id: C1
    class: GATE DICTIONARY BY POSITION
    coord: internal/repohygiene/gitrevparentargv_test.go:67-75 (gitRevParentWords)
    subject: >-
      Словарь распознавателя берётся у дома ПОЗИЦИЕЙ — `argv[0]` и
      `argv[len(argv)-1]`, — а не предметом. Положение в списке предметом не
      является, и нейтральная дописка к argv дома молча переводит гейт на другую
      пару слов.
    why_critical: >-
      ЭТО ДЕФЕКТ САМОЙ НОВОЙ ПРЕДПОСЫЛКИ, а не соседнего кода. Предпосылка
      `len(atHome) != 1` закрывает ровно один способ разойтись — «дом перестал
      нести слова литералами» — и НЕ закрывает второй: «дом несёт ДРУГИЕ слова
      литералами». Во втором случае предпосылка выполняется, гейт зелен, а
      распознаватель судит уже не тот вопрос.
      Измерено инъекцией, а не предсказано: к телу дома дописан хвостовой `"--"`
      (`git rev-parse --verify --quiet HEAD^ --` — семантически то же самое), и
      в ту же фикстуру gateBaseOriginRepo добавлена та самая вторая запись
      `run("rev-parse", "--verify", "--quiet", "HEAD^")`, ради которой заведён
      весь круг. Исход: PASS, EXIT=0. Перепись при этом честно напечатала, во
      что превратилась: «мест со словами "rev-parse"+"--": в доме 1, мимо дома
      0». Гейт, объявляющий исход зелёным и оставляющий несоответствие ЧИТАТЕЛЮ
      ЛОГА, исходом не судит (gate-authoring: «исход вместо объявления»).
      Класс тот же, что полоса снимает девятый круг подряд: значение взято
      ПОЗИЦИЕЙ, а не предметом. И он подрывает ровно то утверждение, ради
      которого предпосылка заведена, — «молчание гейта что-то значит».
    requirement: >-
      Привязать слова вопроса к дому предикатом, который нейтральную правку argv
      не переживает молча. Решение за автором; требование — чтобы после ЛЮБОЙ
      правки тела дома гейт либо судил тот же предмет, либо ОТКАЗЫВАЛ. Годится
      и «судить весь набор argv дома», и «опознавать объект по свойству, а не по
      индексу», и «сделать словарь явной парой, объявленной У ДОМА и им же
      предъявляемой». Не годится: `argv[0]` + `argv[len-1]` при предпосылке,
      которая довольствуется тем, что оба взятых слова где-то в доме нашлись.
    proof:
      injection: >-
        gitrevcause.go:79 → `[]string{"rev-parse","--verify","--quiet","HEAD^","--"}`
        + gatecarrierbase_test.go:46 → `run("rev-parse","--verify","--quiet","HEAD^")`
      run: go test ./internal/repohygiene/ -run TestGitRevParentQuestionHasASingleArgvHome -count=1
      outcome: PASS — класс, ради которого заведён круг, прошёл молча
      control: >-
        Та же вторая запись БЕЗ дописки к дому даёт FAIL с координатой
        gatecarrierbase_test.go:46 — то есть инъекция действительно создаёт
        условие, и зелёное выше не «фикстура не сработала».
    return_to: автор диффа (pointpu)

important:
  - id: I1
    class: UNIT NOT NAMED
    coord: internal/repohygiene/gitrevparentargv_test.go:40-41
    subject: >-
      Врезка утверждает «20 из 90 вызовов подают аргументы раскрытием
      `args...`». Числитель — число о ПАКЕТЕ, знаменатель — о КАТАЛОГЕ, и
      единица знаменателя не названа. Перепись, печатаемая этим же гейтом
      строкой :217, отдаёт «вызовов `gitenv.Command` 87».
    why: >-
      Оба числа верны порознь (перемерено независимо: 90 в каталоге, 87 в
      пакете, 20 раскрытий — все в пакете), но стоят рядом без единицы, и
      читатель видит «90» во врезке и «87» в логе того же теста. Полоса девять
      кругов судит именно единицу счёта — врезке о ней молчать нельзя
      (doc-truthfulness: «число, верное для другого предиката»).
    requirement: >-
      Назвать единицу у знаменателя: «20 из 87 вызовов ПАКЕТА» (тогда число
      сходится с переписью ниже) либо «20 из 90 вызовов КАТАЛОГА, из них 87 в
      пакете». Числа не менять — менять подпись.
    blocks: false

