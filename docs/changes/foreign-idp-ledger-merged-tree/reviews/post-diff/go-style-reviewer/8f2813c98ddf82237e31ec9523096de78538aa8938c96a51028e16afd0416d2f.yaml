numbers_dispute:
  status: закрыто — НЕПРАВ БЫЛ Я, и неправ способом, названным в правиле заранее
  rule: >-
    testing-verdict §14 «Твой СОБСТВЕННЫЙ разборщик — тоже распознаватель»:
    own-parser-knows-all-forms («твоё число меньше чужого»),
    divergence-check-own-parser-first («проверяй СВОЙ разборщик первым, а не
    чужую работу»), same-method-twice-is-not-evidence. Автор это правило
    исполнил — проверил свой прибор первым и назвал единицу; я в прошлом круге
    не исполнил ни того, ни другого.

  my_unit:
    what: >-
      СТРОКИ ТЕКСТА, а не узлы разбора, и область — каталог ВМЕСТЕ С
      ПОДКАТАЛОГОМ artifactgates, то есть вместе с ЧУЖИМ пакетом из другого
      каталога.
    command_106: grep -rn "gitenv\.Command(" --include=*.go .   # из internal/repohygiene
    value_106: 106  # = 104 строки верхнего уровня + 2 строки в ./artifactgates
    command_21: grep -rn "gitenv\.Command([^)]*\.\.\." --include=*.go .
    value_21: 21   # = 19 строк верхнего уровня + 2 строки в ./artifactgates
    reproduced_now: >-
      Обе команды перемерены дословно на HEAD=e1128d6cafc и отдают ровно 106 и
      21. Значит расхождение — не ошибка прогона и не смена дерева: это единица.

  author_unit:
    what: >-
      УЗЛЫ РАЗБОРА (*ast.CallExpr) в файлах ВЕРХНЕГО УРОВНЯ каталога, с отбором
      по имени пакета; текстовое число приведено отдельно и своей единицей.
    values: >-
      113 текстовых вхождений · 90 AST-вызовов · 20 с раскрытием ·
      87 после отбора пакета repohygiene
    verified: >-
      ПЕРЕМЕРЕНО НЕЗАВИСИМО, СВОИМ РАЗБОРЩИКОМ (go/parser, отдельная программа,
      не код автора), на том же HEAD. Получено побайтово то же:
        файлов .go в каталоге 832
        из них пакета "repohygiene" 813 · пакета "repohygiene_test" 19
        AST-вызовов gitenv.Command: 90 всего = 87 (repohygiene) + 3 (repohygiene_test)
        из них с раскрытием: 20, все в пакете repohygiene
        текстовых вхождений "gitenv.Command" в верхнем уровне каталога: 113
      Ни один файл не остался неразобранным (0 ошибок разбора), поэтому «90» —
      не число о прочитанном подмножестве.

  why_the_two_differ:
    - >-
      ЕДИНИЦА. 113 против 90 — ровно то, что сказал автор: текст против кода.
      Разница живёт в прозе и в синтетике фикстур внутри сырых литералов.
      Проверено адресно: текстовый предикат `...` даёт ДВА совпадения, которых в
      разборе нет — probewriteslivetree_injection_test.go:127 и :218, оба внутри
      сырого строкового литерала (синтетика пробы, не код пакета).
    - >-
      ОБЛАСТЬ. Мои 106 и 21 включали ./artifactgates — отдельный каталог и
      отдельный пакет (artifactgates/helpers_test.go:53,
      artifactgates/newmanvars_test.go:344). Обход автора его не судит, и
      правильно не судит: объявления того пакета этому не видны.
    - >-
      ФОРМА. Текстовый предикат ОТБРАСЫВАЕТ законную форму — многострочный
      вызов. Сверка множеств координат: разбор находит 20 раскрытий, текст — 19,
      и это РАЗНЫЕ множества, а не вложенные. Текст не видит трёх настоящих
      (gatecarrierbase_test.go:64, :317, gatecarrierremoval.go:627 — там
      `args...` стоит на следующей строке) и добавляет двух выдуманных (обе в
      сыром литерале). Совпадение «19 против 20» было близким по чистой
      случайности взаимного погашения.
  bottom_line: >-
    Единица автора верна, прибор автора верен, числа автора верны. Моё «106
    вызовов» было «106 СТРОК ТЕКСТА в каталоге и подкаталоге», и назвать их
    «вызовами» было ошибкой атрибуции единицы, а не спором о дереве. Прежняя
    запись этим не правится (change-graph §2) — расхождение закрывается ЗДЕСЬ.
  side_effect_on_the_gate: >-
    Собственная перепись гейта печатает «вызовов gitenv.Command 87» — число о
    ПАКЕТЕ, и оно сошлось с моим независимым разбором. Комментарий строкой выше
    называет 90 (число о каталоге) — см. важную находку I1.

