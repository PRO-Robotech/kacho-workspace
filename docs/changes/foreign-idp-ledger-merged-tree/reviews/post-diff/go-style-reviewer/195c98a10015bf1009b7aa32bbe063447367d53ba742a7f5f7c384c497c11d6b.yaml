  rationale: >-
    Все четыре находки круга 4 закрыты по существу, а не наличием правки:
    предикат глубины стал единственным в дереве (перемерено), причина снова
    предъявима сигналом по каждому из трёх подслучаев, пара V3 стала
    однофактной и несёт инъекцию, роняющую именно проверяемое, а несущая
    посылка про отсутствие разделителя по коду возврата воспроизведена мной
    дословно на своём стенде. Оба дефекта, найденных автором в себе, реальны,
    названы своим классом и починены созданием условия, а не подгонкой под
    среду; второй перемерен мной прямым замером и прогоном под обоими TMPDIR.
    Три важные находки не блокируют: I1 латентна и недостижима на сегодняшнем
    графе вызовов, I2 — дополнительное утверждение при сохранном несущем, I3 —
    предсуществующая строка вне диффа полосы.
