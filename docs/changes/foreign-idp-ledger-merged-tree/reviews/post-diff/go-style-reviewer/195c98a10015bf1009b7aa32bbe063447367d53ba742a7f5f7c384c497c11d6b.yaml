premise_under_test:
  claim: >-
    «Разделителя по коду возврата `git rev-parse --verify` нет НИ В ОДНОМ
    направлении: 1 схлопывает три входа, 128 — три других; значит различение
    причин не может стоять на коде возврата».
  status: ПОДТВЕРЖДЕНА
  how: >-
    Собран свой стенд в scratchpad: origin с двумя пустыми коммитами,
    `--depth=1` клон, полный клон с checkout на корневой коммит, каталог с
    файлом `.git`, указывающим в никуда. Замер 2026-09-22 воспроизвёл таблицу
    задания ДОСЛОВНО.
  table:
    - 'недовезённая ревизия · мелкий клон  : --verify --quiet = 1   · без --quiet = 128'
    - 'выдуманная ревизия   · ПОЛНЫЙ клон  : --verify --quiet = 1   · без --quiet = 128'
    - 'корневой коммит      · ПОЛНЫЙ клон  : HEAD^ --verify -q = 1  · без --quiet = 128'
    - 'каталог не репозиторий               : --verify --quiet = 128 · без --quiet = 128'
  control_in_the_other_direction: >-
    Довезённая голова в мелком клоне даёт 0 — то есть код 1 действительно
    означает «спросили и получили отрицательный ответ», а не «не спросили». Это и
    есть законный близнец, без которого «1 схлопывает три входа» было бы
    утверждением без контроля.
  code_does_not_stand_on_the_return_code:
    verified: ДА
    census: >-
      `git grep -n 'ExitCode() == 1\|ExitCode() != 1\|ExitCode() == 128\|ExitCode() != 128' -- '*.go'`
      даёт ДВА вхождения во всём дереве:
      foreignidpname_test.go:310 — `ExitCode() == 1` отбирает ГРУППУ «дерево
      спрошено и ответило отрицательно», после чего причина внутри группы
      выбирается отдельным вопросом `gitCloneIsShallow`, а НЕ числом;
      gitrevcause_test.go:173 — `ExitCode() != 128` есть УТВЕРЖДЕНИЕ пробы о
      предъявимости сигнала подслучая, а не классификатор продукта.
      В gatecarrierremoval.go:462 код возврата не читается вовсе — ветвь входит
      по `e != nil || пустой вывод`, и различает причины тем же
      `gitCloneIsShallow`. Ни одно место не строит различение ПРИЧИН на числе.

verdicts_on_round4_findings:
  V1:
    claim: 'два `%w`, три подслучая «дерево не спрошено» различимы сигналом, аннотация исправлена вместе с кодом'
    verdict: ЗАКРЫТО
    evidence: >-
      foreignidpname_test.go:320 — `fmt.Errorf("%w о ревизии %s — … (%w); … %s",
      errForeignIDPTreeNotAsked, rev, err, gitRevRemedyWorkingDir)`. `%w` ДВА:
      сентинелу (классификация) и причине (различение подслучая); go.mod
      объявляет go 1.26.0, множественный `%w` поддержан с 1.20.
      Сигналы разведены и утверждены попарно в
      TestGitRevTreeNotAskedKeepsItsCauseInspectable:
      подслучай «каталога нет» — `errors.As(*fs.PathError)` + `op == "chdir"` +
      `errors.Is(fs.ErrNotExist)`; «не репозиторий» — `errors.As(*exec.ExitError)`
      + `ExitCode() == 128` + отрицание `*fs.PathError`; «инструмента нет вовсе» —
      `errors.Is(exec.ErrNotFound)` + отрицание `*exec.ExitError`.
      Строковых сравнений причин (`err.Error() == "…"`) нет ни одного.
    annotation_fixed: >-
      ДА, и это существенно. Снятая ложь — дословно: «создать это состояние
      пробой нечем, а исход тот же». На её месте (foreignidpname_test.go:284-302)
      стоит врезка, называющая ТРИ подслучая с их сигналами и прямо говорящая
      «третий создаётся подпроцессом с пустым PATH — „создать это состояние
      пробой нечем“ было неверно». Названная там координата
      [TestGitRevTreeNotAskedKeepsItsCauseInspectable] в дереве СУЩЕСТВУЕТ
      (перемерено `go test -list`), то есть аннотация не поменяла одну ложь на
      другую.
    precision_note: >-
      Формулировка задания «по паре на каждый подслучай» перемерена и требует
      уточнения: законный близнец в пробе ОДИН и объявлен общим для всей группы
      (своя ревизия своего дерева разрешается без отказа, gitrevcause_test.go:96),
      а у каждого из трёх подслучаев свой отрицательный конец плюс утверждение
      отделения от соседа. Свойство от этого не страдает — близнец у группы
      честно назван общим, — но «пар» в строгом смысле три отрицательных конца
      при одном общем близнеце, а не три независимые пары. Подслучай «каталога
      нет» единственный не несёт отрицания соседнего сигнала (не утверждает «это
      НЕ ExitError»); на текущем коде это недостижимо, поэтому в находки не идёт.
  V2:
    claim: 'перепись механизма: 3 вхождения в 3 файлах; дефектное одно, близнец не тронут'
    verdict: ЗАКРЫТО, число ПЕРЕМЕРЕНО СВОЕЙ КОМАНДОЙ
    command: "git grep -n -o 'rev-parse\", \"--verify' -- '*.go'"
    measured: '3 вхождения в 3 файлах — совпало с заявленным'
    occurrences:
      - 'internal/repohygiene/foreignidpname_test.go:305 — разрешитель полосы, починен кругами 2-4 и этим'
      - 'internal/repohygiene/gatecarrierremoval.go:462 — ДЕФЕКТНОЕ, починено этим кругом'
      - 'internal/repohygiene/trunkref_test.go:55 — ЗАКОННЫЙ БЛИЗНЕЦ, не тронут'
    why_trunkref_is_a_lawful_twin: >-
      Прочитан целиком (trunkref_test.go:44-90). Он разрешает ИМЯ ССЫЛКИ из
      закрытого списка кандидатов, а не объект-коммит: любой отказ означает «не
      эта ссылка», и цикл идёт к следующей. Классификации причины у него нет by
      construction, различать ему нечего. Отказ он выносит ПОСЛЕ цикла, с
      собственной переписью осмотренного (`for-each-ref`, число и образец) —
      то есть «ноль подходящих» у него отличимо от «ноль ссылок вообще». Ремонт
      он называет своей прозой, и это законно: предмет у него другой (настройка
      клона целиком, а не довезённость одного объекта). Тронут быть не должен.
  V3:
    claim: 'новая пара однофактна'
    verdict: ЗАКРЫТО; уточнение автора к моему диагнозу ПРИНЯТО
    authors_correction_accepted: >-
      Автор прав, и уточнение важно: у прежней пары ревизия на обоих концах была
      `older`, менялось одно дерево — то есть «менялось два факта» в моей
      формулировке круга 4 было НЕТОЧНО. Дефект при этом реален и правка верна:
      прежняя пара стояла на дереве, а не на ревизии, и резолвер, огульно
      отвергающий в мелком дереве ЧТО УГОДНО, проходил её целиком (близнец на
      ПОЛНОМ дереве зелен, отрицательный конец на мелком красен, различение не
      проверено ничем). Мой вердикт «пара не различает» держится; моя
      формулировка причины исправлена автором.
    new_pair_is_one_fact:
      verdict: ДА
      evidence: >-
        foreignidpname_test.go:530-545. Оба конца спрашивают ОДНО дерево —
        `shallow`. Близнец: `foreignIDPRevisionResolverAt(shallow)(newer)` —
        молчит. Отрицательный конец: `…(shallow)(older)` — отказывает. Меняется
        РОВНО ревизия. Полный `origin` перемещён из роли близнеца в роль
        ПРЕДПОСЫЛКИ и так и назван в коде («Предпосылка, а НЕ близнец»), что
        честно: без неё «не довезён» было бы неотличимо от «выдуман».
      independently_measured: >-
        На своём стенде: в `--depth=1` клоне `rev-parse --verify --quiet
        <newer>^{commit}` → 0, `<older>^{commit}` → 1. То есть близнец
        действительно зелёный по существу дерева, а не по снисходительности
        фикстуры, и однофактность пары держится свойством git, а не совпадением.
      injection_present: >-
        ДА, и она роняет ИМЕННО проверяемое: `blanket` (foreignidpname_test.go:571)
        винит глубину во всём подряд; проба сперва убеждается, что инъекция
        воспроизводит свой предмет на отрицательном конце (иначе её молчание на
        близнеце ничего не значило бы), и только потом требует, чтобы близнец её
        поймал. Это ровно тот резолвер, который проходил прежнюю пару.
  V4:
    claim: 'словарь ремонта и вопрос о мелкости сведены в общий источник; второй копии предиката не осталось'
    verdict: ЗАКРЫТО ПО ПРЕДИКАТУ; ПО СЛОВАРЮ — ЗАКРЫТО НЕ ЦЕЛИКОМ (важное 3)
    predicate_single_source:
      verdict: ДА, ПЕРЕМЕРЕНО
      commands:
        - "git grep -n 'foreignIDPShallowClone' -- '*.go'  → ПУСТО (копия снята)"
        - "git grep -n 'is-shallow-repository' -- '*.go'   → 3 строки, из них ВЫЗОВ ровно один: gitrevcause.go:61; две другие — проза комментариев (foreignidpname.go:153, foreignidpname_test.go:411)"
      note: >-
        Второй копии ПРЕДИКАТА в дереве не осталось — заявление автора
        подтверждено собственной командой.
    vocabulary_single_source:
      verdict: ЧАСТИЧНО
      what_holds: >-
        Три формулировки объявлены ровно по разу (gitrevcause.go:73,76,78), и обе
        стороны берут их оттуда: производитель собирает текст через `%s` из
        константы, утверждение спрашивает `gitRevRemedyNamed` — ТУ ЖЕ функцию, что
        и настоящие отказы, а не свою копию. Доказательство в обе стороны в
        TestGitRevRemedyVocabularyHasASingleSource прочитано и держится: своя проза
        с сохранённым словом «ГЛУБИНЫ» мимо источника → распознаватель молчит
        (проба краснеет), причём проба СНАЧАЛА убеждается, что слово в инъекции
        действительно есть; переименование внутри источника двигает обе стороны
        согласованно. Сверх того каждая из трёх настоящих причин проверена на то,
        что она называет СВОЙ ремонт и НЕ называет двух чужих.
      what_does_not: >-
        См. важное 3: третья ветвь той же функции gateCarrierBase
        (gatecarrierremoval.go:514) называет ремонт глубины СВОЕЙ прозой мимо
        константы. Строка полосой не тронута, поэтому находка важная, а не
        критическая, но заявление «словарь сведён в общий источник» на функцию
        целиком не распространяется.

verdicts_on_self_found_defects:
  D1_probe_without_t_parallel:
    claim: 'у TestGitRevCauseToolAbsentChild не было t.Parallel(); гейт дерева поймал пробу только ПОСЛЕ коммита'
    verdict: ЗАКРЫТО; ДРУГИХ ТАКИХ В ДИФФЕ НЕТ
    class_named_correctly: >-
      ДА — класс «гейт судит коммит, работа лежит в индексе». Гейт
      probeparallelism.go берёт состав дерева подпроцессом из git, то есть видит
      только отслеживаемое; неотслеживаемый файл ему невидим, и перепись была
      зелена, ничего о нём не зная. Основание гейта прочитано (probeparallelism.go:19-50):
      бюджет `-timeout` отмеряется тестовому БИНАРЮ, ранер даёт 4 ядра, и проба
      без объявления стоит последовательного времени молча.
    census_by_my_own_command:
      command: 'разбор объявлений `func Test*` и двух следующих строк по каждому файлу диффа'
      top_level_probes_in_lane_diff: 12
      with_t_parallel: 12
      without: 0
      subtests_in_new_files: 3
      subtests_with_t_parallel: 3
      note: >-
        Считаны ВСЕ Test-функции пяти файлов полосы, включая семь нетронутых в
        foreignidpname_test.go, — иначе перепись судила бы только добавленное и
        не увидела бы строки, которой нет.
  D2_probe_inherited_its_input_from_TMPDIR:
    claim: 'голый t.TempDir() под TMPDIR внутри рабочего дерева git даёт код 1, а не 128; подслучай молча уезжал в соседнюю ветвь'
    verdict: ЗАКРЫТО; ПОСЫЛКА ПЕРЕМЕРЕНА МНОЙ И ПОДТВЕРЖДЕНА
    my_measurement: >-
      `TMPDIR=<воркспейс>/tmp/... mktemp -d` → каталог внутри рабочего дерева git
      воркспейса: `git rev-parse --is-inside-work-tree` → true;
      `git rev-parse --verify --quiet '0123456789a^{commit}'` в нём → КОД 1.
      Проба утверждает `ExitCode() == 128`, то есть без барьера подслучай
      действительно уезжал в чужую ветвь «объекта нет», и зелёный был
      обстоятельством среды.
    the_fix_creates_the_condition: >-
      ДА. Барьер — файл `.git` со строкой `gitdir:`, указывающей в никуда
      (gitrevcause_test.go:150-153). Мой контроль: в том же каталоге после
      записи барьера код возврата становится 128. Условие СОЗДАЁТСЯ, а не
      наследуется.
    premise_checked_next_to_the_subject: >-
      ДА, и это правильная форма: gitrevcause_test.go:158 требует, чтобы
      `rev-parse --is-inside-work-tree` по этому пути ОТКАЗАЛ, и падает с
      «условие подслучая не создано» — то есть отсутствие условия объявляется
      отказом ПРЕДПОСЫЛКИ, а не тихим зелёным.
    ran_under_both_tmpdirs:
      note: >-
        Прогон точечный, ради посылки этого дефекта. Исход прогона и линтера —
        не мой предмет: сырой вывод читает landing-reviewer, независимый перемер
        делает check-verifier. Здесь зафиксирован только факт о предмете дефекта.
      default_tmpdir: "TMPDIR=/tmp go test -count=1 -run '^(TestGitRev|TestGateCarrierBase|TestForeignIDPRevision)' ./internal/repohygiene/ → ok, 0.121s"
      hostile_tmpdir: "TMPDIR=<воркспейс>/tmp/tmpcheck (внутри рабочего дерева git) — та же команда → ok, 0.119s"
      what_this_shows: >-
        Предмет перестал зависеть от TMPDIR. Обратное направление доказано не
        прогоном, а прямым замером выше: без барьера код 1 ≠ утверждаемым 128,
        то есть барьер несущий, а не декоративный.

findings:
  critical: []   # блокирующих нет
  important:
    - id: I1
      class: ERROR WRAP / ПРИЧИНА НЕ ПРЕДЪЯВИМА
      coordinate: internal/repohygiene/gatecarrierremoval.go:462-482
      what: >-
        `parent, e := gitenv.Command(root, "rev-parse", "--verify", "--quiet",
        "HEAD^").Output()` — и дальше `e` ОТБРАСЫВАЕТСЯ целиком: ни `%w`, ни
        `%v`, ни в одном из двух отказов. Ветвь входит по `e != nil || пустой
        вывод` и различает причины ТОЛЬКО вопросом о глубине. Это ровно тот
        класс, который V1 закрыл в соседнем разрешителе: если сюда однажды
        доедет третье состояние (повреждённое хранилище объектов — код 128),
        отказ объявит «это корневой коммит» и не оставит ни одного предъявимого
        признака. Лгать о причине здесь дороже обычного: эти же строки полоса в
        этом круге ПЕРЕПИСЫВАЛА и класс в них не закрыла.
      why_not_critical: >-
        Третье состояние на этом пути недостижимо сегодня: до строки 462
        доходят только после успешного `for-each-ref` и успешного `merge-base
        --is-ancestor`, то есть дерево заведомо репозиторий и инструмент
        заведомо есть. Находка о латентной лжи, а не о действующей.
      requirement: >-
        Обернуть `e` в ОБА отказа (`%w`), как это сделано в
        foreignidpname_test.go:320, либо явно назвать в комментарии, каким
        предикатом доказано, что `e` здесь бывает только кодом 1 (и чем этот
        предикат держится при правке порядка вызовов выше).
    - id: I2
      class: УТВЕРЖДЕНИЕ ПО ПРОЗЕ МИМО ОБЩЕГО ИСТОЧНИКА
      coordinate: internal/repohygiene/gatecarrierbase_test.go:152
      what: >-
        `if !strings.Contains(err.Error(), "корневой")` — слово ПРИЧИНЫ
        утверждается подстрокой по свободной прозе продукта
        (gatecarrierremoval.go:481), мимо общего источника. Это ровно тот отказ в
        обе стороны, который V4 снял для словаря РЕМОНТА и оставил для слова
        ПРИЧИНЫ: переименование в продукте («корневой коммит» → «у HEAD нет
        предка») краснит пробу зря, хотя смысл цел. Строка ДОБАВЛЕНА этой
        полосой.
      why_not_critical: >-
        Несущим в этой пробе остаётся источниковое утверждение строкой 149
        (`!gitRevRemedyNamed(err, gitRevRemedyCloneDepth)`) — оно ловит
        настоящий дефект «полному клону велено чинить глубину». Подстрока по
        «корневой» — утверждение ДОПОЛНИТЕЛЬНОЕ, и способность пробы упасть на
        предмете от него не зависит.
      requirement: >-
        Либо завести константу причины рядом с `gitRevRemedy*` в gitrevcause.go
        и собирать текст ветви 481 из неё, либо утверждать не слово, а
        наблюдаемое (ремонт глубины НЕ назван И база пуста).
    - id: I3
      class: РАДИУС ПРАВКИ УЖЕ ЗАЯВЛЕННОГО СВОЙСТВА
      coordinate: internal/repohygiene/gatecarrierremoval.go:514
      what: >-
        Третья ветвь ТОЙ ЖЕ функции `gateCarrierBase` называет ремонт глубины
        своей прозой — «сравнить не с чем; чинится глубиной клона, а не
        терпимостью гейта», — мимо `gitRevRemedyCloneDepth`. Проверено
        подстановкой: `gitRevRemedyNamed(<этот отказ>, gitRevRemedyCloneDepth)`
        ЛОЖЕН. Шапка gitrevcause.go:37-45 предметом называет именно это («пока
        каждое место называет ремонт своей прозой…»), и на одном месте функции
        предмет остался.
      why_not_critical: >-
        Строка предсуществующая: в дифф полосы (ни круга, ни волны) она не
        входит, и ни одна проба на неё не утверждает — то есть зелёного она
        сегодня не обещает. Шапка описывает МЕХАНИЗМ, а не перепись мест, так
        что лжи в документе нет; неполон радиус.
      requirement: >-
        Собрать текст 514 из `gitRevRemedyCloneDepth` тем же приёмом, что 471,
        и назвать место в переписи — иначе «словарь сведён в общий источник»
        будет верно для двух ветвей функции из трёх, и узнать об этом можно
        будет только чтением.
  foundation_candidates: []   # ни одного: правка целиком доменная для гейтов дерева, горизонтального в ней нет
  style:
    - coordinate: internal/repohygiene/gitrevcause_test.go:272
      what: '`_ = newer` — мёртвое присваивание; `origin, older, _ := foreignIDPScratchRepo(t)` сказало бы то же короче.'
    - coordinate: internal/repohygiene/gatecarrierbase_test.go:126
      what: >-
        `!strings.Contains(err.Error(), "нет родителя")` локает формулировку,
        которой в продукте БОЛЬШЕ НЕТ: `git grep 'нет родителя' -- '*.go'`
        находит только саму пробу и два несвязанных комментария. Утверждение
        неспособно покраснеть ни на одной из двух текущих ветвей; корневая ветвь
        говорит «родителя у HEAD нет» — другой порядок слов, подстрокой не
        ловится. Несущим остаётся положительное `gitRevRemedyNamed` строкой 123.
        Не находка (лишнее утверждение не делает пробу слабее), но и не защита.
    - coordinate: internal/repohygiene/gitrevcause.go:19-27
      what: >-
        Строка таблицы «те же два первых входа · БЕЗ --quiet → 128» уже
        реальности: перемерено, что без `--quiet` 128 даёт и ТРЕТИЙ вход
        (корневой коммит, HEAD^). Ложного в шапке нет, и довод «128 достаётся
        сразу трём непохожим состояниям» от этого только крепче; но таблица,
        поданная как замер, перечисляет не всё, что замерено.
    - coordinate: internal/repohygiene/gitrevcause_test.go:173, 189
      what: >-
        Коды 128 и 1 стоят литералами в утверждениях, при том что вся правка —
        о едином источнике словаря. Константа рядом с `gitRevRemedy*` была бы
        тем же приёмом; сейчас числа держатся только прозой шапки.
    - coordinate: единица счёта «проб добавлено 5»
      what: >-
        Число верно как счёт Test-функций (перемерено `go test -count=1 -list`),
        но из пяти одна — TestGitRevCauseToolAbsentChild — есть ТЕЛО ПОДПРОЦЕССА,
        а не самостоятельная проба: вне подпроцесса она не делает ничего. Код
        это честно называет («НЕ пропуск, а вторая половина одной пробы»), и
        t.Skip она не зовёт, так что ведомость пропусков ей не нужна. Честнее
        читать «4 пробы + 1 подпроцессная половина + 3 подпробы».
  approved:
    - 'Обёртка ошибок: `%w` везде, где причина должна остаться предъявимой; `%v` подменой `%w` не встречается ни разу в диффе.'
    - 'Сентинелы — через errors.Is/errors.As; сравнений `err.Error() == "…"` нет. Оставшиеся strings.Contains судят ТЕКСТ РЕМОНТА (что человеку и нужно), и несущие из них идут через общий источник.'
    - 'Паники в рабочем пути нет: `panic(`, `log.Fatal`, `Must*` в диффе — 0.'
    - 'init() с побочными эффектами — 0. Глобальных синглтонов не заведено.'
    - 'Generics не заведены; голых interface{}/any — 0.'
    - 'Именование: кириллицы в объявлениях — 0 (запрет #17). Кириллица встречается только в строковых литералах и именах подпроб t.Run — в пакете это норма, перемерено: 458 из 468 имён t.Run кириллические.'
    - 'Переиспользование: git зовётся через `gitenv` внешнего фундамента, взятого пином (corelib@v1.8.1-0.20260917060744-569eab3964e0); локальной копии обёртки не заведено.'
    - 'Направление зависимостей: правка целиком внутри internal/repohygiene, слоёв продукта (domain/use-case/repo/handler) не касается. Ни pgx, ни gRPC, ни транспорта в диффе нет.'
    - 'Дублирование снято, а не размножено: `foreignIDPShallowClone` удалён, вопрос о глубине зовётся из одного НЕ-тестового дома, доступного и прод-разбору, и пробам. Обоснование выбора «не тестовый файл» в шапке названо и правдиво: gateCarrierBase его действительно зовёт.'
    - 'Диагноз рецензента уточнён автором по существу (V3), и уточнение принято: у прежней пары менялся один факт, а не два. Вердикт «пара не различает» от этого не меняется.'
  fmt_print_note: >-
    `fmt.Printf` в gitrevcause_test.go:44 находкой НЕ является: это канал отчёта
    ПОДПРОЦЕССА родителю с маркерным префиксом, а не журналирование. Запрет на
