# ── ОТВЕТЫ НА ВОПРОСЫ ЗАДАНИЯ ────────────────────────────────────────────────
answers_to_the_task:

  - question: 'Проверь довод о форме проб на текст: «проба, утверждающая формулировку ДОСЛОВНО, краснеет на правке текста и молчит на подмене смысла».'
    verdict: 'ДОВОД ВЕРЕН, и принятая форма лучше прежней — но это не конечная форма, и разницу стоит знать заранее.'
    reasoning: >-
      Обе половины довода истинны и проверяемы. Дословное равенство текста
      краснеет на любой правке формулировки — то есть ломается при работе,
      которая свойства не трогает. И оно молчит при подмене смысла с
      сохранением слов. Принятая форма — «классификация сигналом
      (errors.Is), текст — по НАЗВАННОМУ РЕМОНТУ» — снимает первую половину
      полностью: сигнал переживает любую правку прозы.
    the_half_that_remains: >-
      Вторая половина снята НЕ полностью, и это надо сказать прямо. Проверка
      ремонта осталась подстрокой: `strings.Contains(err.Error(), "ГЛУБИНЫ")`
      (:539), `"РАБОЧЕМ КАТАЛОГЕ"` (:488), `"записи ведомости"` (:491).
      Переименуй слово ремонта — проба краснеет, свойства не тронув; сохрани
      слово и переверни предложение («ремонт НЕ в глубине клона») — проба
      промолчит. То есть форма унаследовала обе болезни в ослабленном виде.
    the_endpoint_named: >-
      Конечная форма — та, что корпус уже применяет у hide-existence:
      ОБЩИЙ ИСТОЧНИК словаря ремонта, импортируемый обеими сторонами, вместо
      чтения чужого текста (testing.md §«shared-source-instead-of-reading-text»,
      TestPostureVocabularyHasASingleSource). Ремонт становится константой,
      проба сверяется с НЕЙ, и переименование правит одно место. Здесь это
      дешево: сентинелы уже объявлены константами рядом (:250-258) — слово
      ремонта просится туда же.
    for_future_text_probes: >-
      Формула для будущих проб на текст: КЛАССИФИКАЦИЯ — сигналом;
      ПРИСУТСТВИЕ РЕМОНТА — сверкой с общим источником, а не подстрокой;
      ДОСЛОВНОЕ равенство — только там, где текст сам есть контракт с чужой
      стороной (как побайтовое совпадение с miss-текстом владельца у
      hide-existence).

  - question: 'Перемерь три пробы того же класса и скажи: покрасят ли они перепрогон, и надо ли чинить их ДО него.'
    verdict_short: 'НЕТ, не покрасят — при двух условиях, оба по умолчанию выполнены и оба дёшево проверяются. Чинить ДО перепрогона НЕ НАДО. Но их не три, и разделяющий факт назван полосой НЕВЕРНО.'
    measured_by_me:
      method: >-
        Пять прогонов всего пакета `go test ./internal/repohygiene/ -count=1`
        под разными условиями; перечень упавших брался из вывода, а не из
        кода возврата.
      control: 'TMPDIR по умолчанию — `ok`, упавших ноль.'
      hostile_workspace_level: >-
        TMPDIR = kacho-workspace/tmp/gsr4-tmpinside (каталог ВНУТРИ репозитория
        воркспейса, но ВНЕ продуктовой копии) — `ok`, упавших ноль.
        Это важный отрицательный результат: «TMPDIR внутри какого-нибудь
        репозитория» условием НЕ является.
      hostile_product_level: >-
        TMPDIR = <копия полосы>/.gsr4-tmpinside (ВНУТРИ продуктового дерева) —
        КРАСНО во всех трёх прогонах, но составом РАЗНЫМ: 6, 2 и 2 упавших.
      union_over_five_hostile_runs: 8
      stable_in_every_hostile_run:
        - 'internal/repohygiene/buildcontextguard_test.go:120 TestBuildContextCarriesNothingOurPipelinesWrite'
        - 'internal/repohygiene/subscriptionnonowners_injection_test.go:221 TestRightsModelTypeCensusReadsDeclarationsOnly'
      intermittent:
        - 'internal/repohygiene/ct2_idcanon_hyphen_minting_test.go:17 TestEveryHyphenMintedPrefixIsInTheCanon'
        - 'internal/repohygiene/ct2_idcanon_hyphen_minting_injection_test.go:186 TestCanonInjection_RealTreeAgainstThePreFixCanon'
        - 'internal/repohygiene/clienttruth_computedoctype_test.go:20 TestClientDocsAnyTypeResolvesInTheContracts'
        - 'internal/repohygiene/ct2_docs_idform_test.go:46 TestDocsIDFormMatchesWhatTheCodeMints'
        - 'internal/repohygiene/clientdocscontractdrift_test.go:163 TestClientDocsDoNotPresentDeprecatedVerbsAsCurrent'
        - 'internal/repohygiene/clientdocsresourceowner_test.go:32 TestClientDocsAttributeResourcesToTheirOwner'
    the_lane_discrimination_is_wrong:
      lane_said: '«каталог-сирота в дереве их не роняет, роняет именно ВРЕМЕННЫЙ каталог внутри дерева» — разведено одно-фактно.'
      my_one_fact_control: >-
        Однофактный контроль, в котором меняется НЕ расположение TMPDIR, а
        ИГНОРИРУЕМОСТЬ файла: создал в дереве полосы один пустой файл
        `.gsr4-orphan2/probe.test` (git check-ignore подтверждает: `.gitignore:2
        *.test`), TMPDIR — ПО УМОЛЧАНИЮ.
        Исход: TestBuildContextCarriesNothingOurPipelinesWrite ПАДАЕТ
        («в контекст сборки едут 1 произведённых (git-ignored) файлов из 13657»),
        TestRightsModelTypeCensusReadsDeclarationsOnly — проходит.
        Тот же каталог-сирота с НЕигнорируемым файлом (.gsr4-orphan/nested/
        artifact.bin) не роняет НИЧЕГО.
      therefore: >-
        Для самой громкой из восьми проб разделяющий факт — не «временный
        каталог», а «git-игнорируемый произведённый файл в рабочей копии».
        Временный каталог внутри дерева — лишь ОДИН способ его туда положить:
        `go test` кладёт туда свой рабочий каталог, и скомпилированный
        `repohygiene.test` попадает под `*.test`. Контроль полосы, судя по
        исходу, менял НЕ ТОТ факт (вероятно, сирота был неигнорируемым — мой
        первый контроль вёл себя так же).
    mechanisms_are_two:
      A: >-
        buildcontextguard_test.go:120 — читает
        `git ls-files --others --ignored --exclude-standard` РАБОЧЕЙ КОПИИ и
        сверяет с .dockerignore. Его вердикт есть свойство РАБОЧЕГО КАТАЛОГА,
        а не коммита, и это заложено предметом (слой `COPY . .` копирует
        рабочий каталог). Детерминирован: один файл — одно красное.
      B: >-
        остальные семь — гонка с временными каталогами СОСЕДНИХ проб, идущих
        параллельно: состав упавших меняется от прогона к прогону (6/2/2).
        Требуют TMPDIR внутри продуктовой копии.
    will_the_rerun_go_red:
      answer: 'Нет — при условиях (i) и (ii), и оба сегодня выполнены.'
      condition_i: >-
        TMPDIR не указывает внутрь ПРОДУКТОВОЙ рабочей копии. Перепись по
        дереву: все семь мест, где TMPDIR вообще упоминается (Makefile:766,
        scripts/ci-local.sh:164, scripts/go-mod-tidy-check-inject.sh:39,
        scripts/release/assert-pin-reachable-inject.sh:65,
        assert-pin-agrees-inject.sh:38, assert-no-module-reciprocity.sh:158,
        assert-no-module-reciprocity-inject.sh:41), пишут `${TMPDIR:-/tmp}` и
        внутрь дерева не указывают. Памятка владельца «место полос —
        kacho-workspace/tmp/» условия НЕ создаёт: прогон с TMPDIR именно там
        я прогнал — зелено.
      condition_ii: >-
        Рабочая копия перепрогона не несёт git-игнорируемых произведённых
        файлов, которые .dockerignore не исключает. В копии полосы сейчас
        игнорируемых путей 7, и все исключены — контрольный прогон это
        подтверждает.
      cheap_predicate_for_the_runner: >-
        Перед перепрогоном: `git ls-files --others --ignored --exclude-standard`
        в СВЕДЁННОЙ копии, либо просто прогнать первой
        TestBuildContextCarriesNothingOurPipelinesWrite — она и есть свой
        предикат, печатающий и числитель, и знаменатель.
      the_real_risk_named: >-
        Он не в этих пробах, а в СВЕДЁННОЙ копии волны: если в ней перед
        перепрогоном что-нибудь собирали (`make`, `go build -o`, распаковка
        чарта), механизм A покраснеет находкой, которая о коммите не говорит
        ничего. Стоит копейки предупредить, дорого — разбирать.
    do_they_need_fixing_first:
      answer: 'НЕТ.'
      why: >-
        Ни один из двух механизмов на перепрогоне не срабатывает при
        умолчаниях, а механизм A в своей области ещё и не дефект: его предмет
        и есть рабочий каталог. Чинить до перепрогона — задержать волну ради
        условия, которое перепрогон не создаёт.
      but: >-
        Класс настоящий и заказ заслуживает: (а) семь проб механизма B имеют
        недетерминированный исход при чужой настройке TMPDIR — это ровно K2
        круга 3, только у соседей; (б) предмет заказа называть МЕХАНИЗМОМ
        («вход пробы наследуется из расположения TMPDIR» и «вердикт есть
        свойство рабочего каталога»), а не числом «три»: числа я намерил 8 в
        объединении и 2 устойчивых, и оно меняется от прогона к прогону.

  - question: 'Верно ли разделение: радиус регистра полоса передала ЗАКАЗОМ, а не правила сама?'
