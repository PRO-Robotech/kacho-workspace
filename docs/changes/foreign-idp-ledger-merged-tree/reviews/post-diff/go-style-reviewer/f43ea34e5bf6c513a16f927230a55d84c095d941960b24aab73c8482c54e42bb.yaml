  - id: V3
    kind: '[POSITIVE TWIN IN THE WRONG TREE] у пробы мелкого клона положительный близнец лежит в ДРУГОМ дереве'
    coordinate: >-
      internal/repohygiene/foreignidpname_test.go:508-542 (проба) ·
      :429 (foreignIDPScratchRepo возвращает `newer`) · :461, :510 (оба
      потребителя отбрасывают его `_`)
    what: >-
      В TestForeignIDPRevisionResolverDoesNotSendAShallowCloneToRewriteTheLedger
      законный близнец (:513) разрешает `older` в ПОЛНОМ origin, а отрицательный
