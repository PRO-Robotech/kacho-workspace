important:
  - id: V1
    kind: '[ERROR WRAP] РЕГРЕССИЯ обёртки: этот коммит заменил %w на %v у вложенной причины'
    coordinate: 'internal/repohygiene/foreignidpname_test.go:314-316'
    what: >-
      Третья ветвь разрешителя возвращает
      `fmt.Errorf("%w о ревизии %s — … (%v); …", errForeignIDPTreeNotAsked, rev, err)`.
      Сентинел обёрнут `%w`, а НАСТОЯЩАЯ причина (`err`) подставлена `%v` — то
      есть цепочка до неё оборвана.
    measured_by_me: >-
      Это именно РЕГРЕССИЯ, а не унаследованное состояние.
      `git show c9085e45510:internal/repohygiene/foreignidpname_test.go` —
      прежняя редакция той же ветви несла `(%w)`:
      «дерево не спрошено о ревизии %s — … не ответила (%w); …», rev, err.
      Коммит f43e9c941d7 добавил %w сентинелу и ОТОБРАЛ его у причины.
    why_it_matters: >-
      Врезка этого же разрешителя (:292-296) разводит внутри «дерево не
      спрошено» ТРИ подслучая — «каталога нет, он не репозиторий, инструмента
      нет вовсе», — и у них разные ремонты. Круг объявил принципом
      «классификация проверяется СИГНАЛАМИ, а текст — по названному ремонту».
      После этой правки ни один из трёх подслучаев сигналом не отличим:
      `errors.As(err, &pathErr)` и `errors.Is(err, exec.ErrNotFound)` по
      возвращённой ошибке НЕ проходят. Осталась только подстрока текста — ровно
      то, от чего круг уходил. Это чек-лист §1 «Обёртка ошибок»: `%w`, не `%v`.
    not_blocking_because: >-
      Ни один потребитель сегодня цепочку не разбирает: судья кладёт текст в
      []string, а пробы классифицируют по сентинелу верхнего уровня. Поведение
      гейта не меняется, вердикт не меняется. Возвращать круг ради этого
      дороже, чем донести правку следующим.
    requirement: >-
      Вернуть причине обёртку: `(%w)` вместо `(%v)` — Go ≥1.20 принимает два
      `%w` в одном Errorf, модуль на go 1.26.0. Тогда «каталога нет» отличимо
      от «инструмента нет вовсе» сигналом, как объявлено врезкой. Кода не
      правил — это ревью.

  - id: V2
    kind: '[RADIUS] класс, закрытый ЭТИМ кругом, по дереву не искан; второе место — в НЕ-тестовом файле'
    coordinate: >-
      internal/repohygiene/gatecarrierremoval.go:462 (дефектное) ·
      internal/repohygiene/trunkref_test.go:55 (законный близнец) ·
      internal/repohygiene/foreignidpname_test.go:299 (починенное этим кругом)
    what: >-
      Механизм, чей дефект круг закрыл, — «исход молчаливого
      `rev-parse --verify --quiet` классифицируется по КОДУ ВОЗВРАТА, без
