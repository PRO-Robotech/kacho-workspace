round3_criticals_closed:
  - id: K1@round3
    was: '[DOC LIES ABOUT THE CODE] мелкий клон отправляли переписывать ПРАВИЛЬНОЕ число'
    now: ЗАКРЫТА
    proven_by_my_own_experiment: >-
      ПОСЫЛКА ПРОВЕРЕНА НЕЗАВИСИМО, и она НЕ гипотеза. Свой стенд: origin с
      двумя пустыми коммитами + `git clone --depth=1 file://origin`.
      `rev-parse --verify --quiet <older>^{commit}` в мелком клоне → КОД 1;
      тот же вход БЕЗ `--quiet` → 128 «fatal: Needed a single revision»;
      выдуманная ревизия в ПОЛНОМ клоне → тоже КОД 1; каталог-не-репозиторий →
      128. То есть разделителя из одного кода возврата действительно не
      существует, и стирает различие именно тихий режим.
    what_the_code_does_now: >-
      internal/repohygiene/foreignidpname_test.go:297-318 — в ветви кода 1
      СПЕРВА задаётся отдельный вопрос `rev-parse --is-shallow-repository`
      (foreignIDPShallowClone, :269-272), и лишь потом ставится диагноз.
      Исходов три, у каждого СВОЙ ремонт и СВОЙ сигнал:
      errForeignIDPRevisionAbsent (ведомость) · errForeignIDPRevisionUndelivered
      (СПЕРВА глубина) · errForeignIDPTreeNotAsked (рабочий каталог).
    executed_not_read: >-
      Прогнал три пробы разрешителя и прочитал напечатанные тексты.
      На нашей (мелкой) копии отсутствующий объект даёт: «объекта-коммита нет, а
      дерево МЕЛКОЕ … Ремонт начинается с ГЛУБИНЫ клона, и только если ревизия
      не найдётся и полным клоном — с записи в ведомости». На синтетическом
      ПОЛНОМ дереве: «дерево не знает объекта-коммита …, и клон ПОЛНЫЙ — ремонт
      в записи ведомости». Тексты разные, ремонты разные, оба названы.
    pre_fix_state_verified: >-
      `git show c9085e45510:…foreignidpname_test.go` — прежняя редакция
      разрешителя вопроса о глубине НЕ задавала и сигналов не имела вовсе
      (возвращала fmt.Errorf без %w-сентинела). Значит все три новые пробы на
      прежнем коде падали бы по построению: инъекция доказана структурно.

  - id: K2@round3
    was: '[PROBE INPUT NOT CREATED BY THE PROBE] «не репозиторий» наследовалось из $TMPDIR'
    now: ЗАКРЫТА
    what_the_code_does_now: >-
      foreignIDPScratchRepo (:429-451) СТРОИТ дерево пробы сам — два пустых
      коммита; «дерева нет» — НЕСУЩЕСТВУЮЩИЙ путь под t.TempDir() (:471).
      Такой путь нельзя ни открыть, ни унаследовать у родителя.
    proven_by_my_own_experiment: >-
      Прогон всего пакета под `TMPDIR=<копия полосы>/.gsr4-tmpinside` (каталог
      ВНУТРИ продуктового дерева — то самое враждебное условие). В выводе видно,
      что проба исполнилась под этим TMPDIR и классифицировала верно:
