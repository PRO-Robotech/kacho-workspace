      в перечень упавших НЕ вошла ни в одном из пяти враждебных прогонов.
      Отказ приходит *fs.PathError, а не *exec.ExitError, — то есть ветвь та же
      при любом расположении TMPDIR.
    legitimate_twin: >-
      Есть: :466-468 — то же построение, тот же путь, дерево на месте, своя
      ревизия разрешается. Прежде у отрицательной ветви близнеца не было.

