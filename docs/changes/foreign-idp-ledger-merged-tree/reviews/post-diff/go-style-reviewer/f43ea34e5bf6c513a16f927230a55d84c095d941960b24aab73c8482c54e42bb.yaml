      одного коммита, и предиката снятия у него нет.
    why_not_worse: >-
      Код от этого факта не зависит: глубина спрашивается в рантайме при каждом
      отказе, и оба исхода обработаны. Утверждение сегодня ИСТИННО — перемерено
      мной в обеих копиях. Это проза, не поведение.
    suggestion: >-
      Либо датировать замер временем/командой, а не ревизией, либо сказать то,
      что не стареет: «глубина спрашивается всегда, потому что мелкий клон
      представим», — довод от представимости не зависит от сегодняшнего стенда.
  - id: S2
    coordinate: 'internal/repohygiene/foreignidpname.go:59-70'
    what: >-
      В тройке «+18209: имя пакета 3435, псевдоним импорта 1764, переменная
      range 13010 — сумма сходится с совместным замером» первое слагаемое равно
      числу РАЗОБРАННЫХ ФАЙЛОВ по построению (одно имя пакета на файл; перепись
      сегодняшнего прогона печатает «разобрано файлов Go 3435»).
    verdict_on_the_selfcheck: >-
      САМОПРОВЕРКА ПОЛОСЫ ЗАКРЫЛАСЬ ПО СУЩЕСТВУ, и в ДЕРЕВЕ формулировка
      осталась точной — это проверено, а не принято со слов. Арифметика сходится
      (3435+1764+13010 = 18209), и врезка утверждает ровно «сумма сходится», не
      выдавая тождество за независимое подтверждение. Довод врезки держится не
      на сумме, а на паре «числитель не изменился при выросшем знаменателе», и
      эта пара — не тождество.
    suggestion: >-
      Можно сказать вслух, что слагаемое «имя пакета» тождественно числу файлов,
      и тогда «сходится» читается как проверка ДВУХ слагаемых из трёх, а не
      трёх. Правки не требует: текст не ложен.
  - id: S3
    coordinate: 'internal/repohygiene/foreignidpname_test.go:471'
    what: >-
      Сегмент пути записан не латиницей: `filepath.Join(t.TempDir(),
      "дерева-тут-нет")`.
    not_a_ban17_violation: >-
      Запрет #17 судит ИДЕНТИФИКАТОР; здесь строковый литерал, и врезка ядра
      прямо оставляет тексты любому языку. Перепись по диффу: кириллицы в
      объявленных именах — ноль.
    why_mentioned: >-
      Проба ремонтировалась ровно ради независимости от окружения, и тут же
      вводит переменную окружения — кодировку файловой системы. Достижимого
      дефекта нет (путь не создаётся, chdir отказывает при любой кодировке),
      поэтому стиль, а не находка.

