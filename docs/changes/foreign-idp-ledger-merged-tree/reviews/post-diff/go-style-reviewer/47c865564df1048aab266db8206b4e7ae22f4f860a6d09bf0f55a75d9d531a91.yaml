critical:
  - id: K1
    kind: '[DOC WEAKENED] ослабление утверждения прозой'
    coordinate: 'internal/repohygiene/foreignidpname.go:60-66'
    what: >-
      Абсолютное число в разборе латентности трёх добранных узлов заменено на
      «СТОЛЬКО ЖЕ до и после, каким бы оно ни было», и добавлена фраза
      «Абсолютная величина здесь не несёт ничего … выписанное число устарело бы
      при первом же изменении дерева». Было: «(103 ИМЕНИ до и после)».
    both_claims_of_the_task_verified_by_me:
      prose: >-
        ПОДТВЕРЖДЕНО по диффу: hunk @@ -58,9 +58,12 @@ снимает «(103 ИМЕНИ до и
        после)» и ставит «СТОЛЬКО ЖЕ до и после, каким бы оно ни было».
      rule_applied_nearby: >-
        ПОДТВЕРЖДЕНО, и ТРИЖДЫ в том же файле, к ТОЙ ЖЕ ревизии @6b8246108e4:
        строка 87 «Свой замер @6b8246108e4 … 327», строка 90 «сверх 103 ИМЁН ТОГО
        ЖЕ ЗАМЕРА @6b8246108e4» (привязано ЭТИМ ЖЕ коммитом), строка 104 «Замер
        @6b8246108e4 … 28 отслеженных путей». Плюс строки 128 и 130 — тем же
        коммитом привязаны @328e1ead5ce и @bec320cf47d. То есть довод «абсолют
        устарел бы» опровергается пятью применениями обратного правила в том же
        файле и в том же коммите: число, названное вместе с ревизией, не устаревает.
    why_it_is_a_weakening: >-
      Несущим здесь является не равенство само по себе, а ПАРА: числитель не
      сдвинулся, пока знаменатель рос. Ни одна из двух редакций знаменателя не
      называет; новая сняла ещё и числитель, то есть стала строго слабее прежней.
      В новой форме утверждение совместимо с вырожденным прочтением «0 до и 0
      после», при котором «латентность» ничем не подпирается. Перемерено мной на
      этом же диффе, ровно тем видом пары, о которой речь: числитель 106 = 106,
      знаменатель 206248 @9624b4d7a2a → 206297 @5d376227375. Такую пару
      утверждение и обязано нести.
    contradicts_the_files_own_norm: >-
      Файл сам объявляет (строки 126-137): «перепись называет единицу при каждом
      числе … И РЕВИЗИЮ — при каждом числе тоже». Норма говорит НАЗВАТЬ число с
      единицей и ревизией, а не снять его. Два места об одном предмете, из
      которых верно одно.
    requirement: >-
      Вернуть число в той форме, которая в этом же файле применена пять раз:
      «<N> ИМЁН @<ревизия того прогона> до и после» — и назвать вторую половину
      пары (знаменатель до и после добора, с той же ревизией), потому что именно
      она доказывает латентность. Фразу «Абсолютная величина здесь не несёт
      ничего» снять: она противоречит соседним строкам того же файла.
      Кода не правил — это ревью.
    not_a_behaviour_defect: >-
      Поведение гейта этим не затронуто: исполняемая часть диффа чистая (см.
      approved). Правка — одна строка прозы, перепрогон группы дешёвый.

