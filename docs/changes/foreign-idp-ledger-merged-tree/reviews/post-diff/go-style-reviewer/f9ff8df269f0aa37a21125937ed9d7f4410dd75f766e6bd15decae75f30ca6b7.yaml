        остаётся узкий вход: продукт по-прежнему даёт ExitError, но с другим
        кодом.
      requirement: >-
        Объявить argv ОДНИМ местом и брать его обеими сторонами — ровно тот
        ремонт, который пакет уже применил дважды (вопрос о глубине →
