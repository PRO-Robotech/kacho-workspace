approved:
  - >-
    C1 КРУГА 6 ЗАКРЫТ ПРЕДИКАТОМ. Обёртка условная: `%w` в ветви `e != nil`
    (:488-490), вторая половина дизъюнкции — объявленным словом (:492-493).
    Довод «e бывает nil оправдывает отказ от БЕЗУСЛОВНОЙ обёртки, а не от
    обёртки вовсе» стоит теперь в коде врезкой (:456-463), а не только в
    возражении рецензента. Утверждение — не о тексте, а о цепи:
    `errors.As(err, new(*exec.ExitError))` на возвращённом отказе, с отрицанием
    на «инструмент не отказал» и на отказе иного рода.
  - >-
    ВХОД ПРОБЫ — НАСТОЯЩИЙ ОТКАЗ, И ЭТО УТВЕРЖДАЕТСЯ. `errors.New` на входе
    предиката был бы ложен by construction; фикстура берёт отказ у дерева с
    одним коммитом и дважды проверяет предпосылку (тип и код 1) через `t.Fatal`,
    то есть на невыполненном условии проба не молчит, а падает.
  - >-
    I1 КРУГА 6 — ОГОВОРКА ОДНА, И ОБЕ ВЕТВИ ОТ НЕЁ ЗАВИСЯТ. Перемерено
    `grep -rn gateCarrierCauseIsInferred internal/repohygiene/`: объявление РОВНО
    ОДНО (:517), потребителя в продукте ДВА (:479 мелкий клон, :485 полный),
    утверждение одно (gatecarrierbase_test.go:263) и стоит ВНУТРИ цикла
    `for _, shallow := range []bool{false, true}` — значит краснеет при снятии из
    ЛЮБОЙ ветви, а не только из той, что вспомнили. Категорическое «родителя у
    HEAD нет» из ветви полного клона снято: теперь «родителя … нет по существу»
    под общей оговоркой. Параллельной прозы во второй ветви не заведено.
  - >-
    I2 КРУГА 6 — ГОЛЫХ ЛИТЕРАЛОВ НЕТ. Перемерено:
    `grep -rn '"<nil>"' internal/repohygiene/*.go` → 0;
    `grep -rn '"корневой"' …` → 0. Вторая половина дизъюнкции названа
    объявленным [gateCarrierToolDidNotRefuse] (:503), утверждение берёт имя
    оттуда же (:241). Появилось сравнение, которого у этой половины не было:
    `silent.Error() == reachable.Error()` (:252-255) — два исхода обязаны
    разойтись текстом, а не только признаком.
  - >-
    I3 КРУГА 6 — ИСКЛЮЧЕНИЕ ПОЛНО В ОБЕ СТОРОНЫ И ВЫВЕДЕНО ИЗ СЛОВАРЯ. Выписанные
    рядом перечни `absent` сняты; обе стороны обходят `gitRevRemedies()` с
    пропуском своей клаузы — и в ведомости (gitrevcause_test.go:332-337), и у
    пары ветвей (gatecarrierbase_test.go:284-289). Четвёртая клауза получила
    строку `want`, которой не существовало нигде.
  - >-
    ДВЕ ПЕРЕПИСИ ВМЕСТО ПАМЯТИ ТАБЛИЦЫ. Первая: строк таблицы столько же, сколько
    объявленных клауз, и у каждой ровно один производитель
    (gitrevcause_test.go:301-317) — пятая клауза без производителя краснеет,
    а не проходит молча. Вторая: перечень и блок констант сверяются РАЗБОРОМ
    файла по узлам объявления (TestGitRevRemedyDictionaryIsCountedFromItsDeclarations,
    gitrevcause_test.go:355-399) — не поиском подстроки, поэтому комментарий,
    называющий имя клаузы, за объявление не проходит. Обход печатает объём
    осмотренного и ПАДАЕТ НА ПУСТОМ (`len(names) == 0` → Fatal), то есть
    молчание «не смотрели» исключено — форма гейта по 00-kacho-core §ban17-gates.
  - >-
    Стиль круга 6 принят обеими правками: `parent []byte` → `out` (по предпосылке
    ветви это не родитель), локальный `root` для отказа снят — в пакете `root`
    значит путь к дереву.
  - >-
    ЗАПРЕТ #11 — свежих маркеров отсрочки 0 по всему диффу волны
    (`git diff 5b20df5c638..HEAD | grep '^+' | grep -E 'TODO:|FIXME|t\.Skip|…'`
    → ни одного вхождения; прежние два вхождения «TBD»/«позже» остаются ВХОДОМ
    гейта и перечнем отвергаемых форм).
  - >-
    ЗАПРЕТ #12 — пробы в том же изменении: ДА, коммит 9bbaa92b2bb несёт продукт
    и пробы вместе (2 прод-файла + 2 тестовых).
  - >-
    Паники в рабочем пути нет; `panic(`, `log.Fatal`, `context.Background`,
    `context.TODO`, `fmt.Println`, `log.Printf`, `MustParse` в добавленных
    строках всего диффа волны — 0.
  - >-
    Запрет #17 — идентификаторы латиницей: gateCarrierCauseIsInferred,
    gateCarrierToolDidNotRefuse, gitRevRemedies, gateBaseRealExitError,
    TestGitRevRemedyDictionaryIsCountedFromItsDeclarations.
  - >-
    Слоёв продукта правка не касается: целиком internal/repohygiene, ни pgx, ни
    gRPC, ни транспорта; go.mod не тронут, git зовётся через gitenv фундамента
    пином.

