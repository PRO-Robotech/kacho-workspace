critical:
  - id: K1
    kind: '[DOC LIES ABOUT THE CODE] разведение причин неверно ровно на том случае, который само называет'
    coordinate: >-
      internal/repohygiene/foreignidpname_test.go:252-263 (врезка о причинах) ·
      :271-277 (разделитель по коду возврата) ·
      :369-374 (врезка новой пробы, повторяющая то же отображение)
    what: >-
      Врезка объявляет отображение: «объекта нет — код возврата 1 при молчаливом
      `--verify --quiet`; ДЕРЕВО НЕ СПРОШЕНО — каталог не репозиторий, КЛОН
      МЕЛКИЙ, инструмента нет вовсе; чинится рабочим каталогом или глубиной
      клона». Код разводит ветви по `exitErr.ExitCode() == 1`.
    measured_by_me: >-
      ЭКСПЕРИМЕНТ. `git clone --depth 1 --branch main file://<project/kacho>` →
      `git rev-list --count HEAD` = 1. В этой копии
      `git rev-parse --verify --quiet 5b20df5c638^{commit}` → КОД ВОЗВРАТА 1
      (ревизия в полном дереве есть). То же для bec320cf47d — код 1.
      Для сравнения: каталог-не-репозиторий даёт 128 (и с `--quiet`, и без);
      тот же мелкий клон БЕЗ `--quiet` даёт 128 «fatal: Needed a single revision».
    why_it_is_critical: >-
      Мелкий клон попадает в ПЕРВУЮ ветвь — «дерево не знает объекта-коммита», —
      чей объявленный ремонт «чинится записью в ведомости». Читающему красное
      велят переписать ПРАВИЛЬНОЕ число ведомости. Это ровно тот класс
      misdiagnosis, ради снятия которого полоса и заведена, заведённый заново
      фиксом по этому классу. Вторая половина симметрична: текст «чинится
      рабочим каталогом либо глубиной клона» печатается только при коде ≠ 1,
      то есть при мелком клоне НЕ печатается НИКОГДА — обещание ремонта, до
      которого его случай не доходит. arch-doc-truthfulness: «описывает
      реальность кода, не намерение».
    mitigation_named_honestly: >-
      Сегодняшний конвейер этот случай не предъявляет: шард `internal`, которым
      гоняются гейты дерева, берёт `fetch-depth: 0` (.github/workflows/ci.yaml:306,
      основание выписано там же). То есть поведенческое следствие ЛАТЕНТНО, а
      ложным является УТВЕРЖДЕНИЕ. Блокирую за утверждение: круг 2 блокировал за
      прозу СЛАБЕЕ истинной, эта — ЛОЖНАЯ и разворачивает ремонт.
    requirement: >-
      Код возврата 1 НЕ различает «объекта нет» и «объект не довезён мелким
      клоном» — это измерено, и разделителя из одного числа не существует.
      Исходов два: (а) текст ветви кода 1 называет ОБЕ возможности и оба ремонта;
      (б) перед классификацией спрашивается `rev-parse --is-shallow-repository`
      (либо `git rev-parse --git-dir` на существование), и мелкий клон уходит во
      вторую формулировку. Врезку 252-263 и 369-374 привести к тому, что код делает:
      «клон мелкий» из перечня второй причины снять либо перенести вместе с
      признаком. Проба `TestForeignIDPRevisionResolverSeparatesItsCauses` этого
      не ловит и обязана ловить. Кода не правил — это ревью.

  - id: K2
    kind: '[PROBE INPUT NOT CREATED BY THE PROBE] «не репозиторий» наследуется из $TMPDIR — красное на исправном дереве'
    coordinate: 'internal/repohygiene/foreignidpname_test.go:380 — `foreignIDPRevisionResolverAt(t.TempDir())(head)`'
    what: >-
      Отрицательная ветвь «дерево не спрошено» моделируется каталогом
      `t.TempDir()`. `t.TempDir()` — это `os.MkdirTemp("")`, то есть `$TMPDIR`;
      git ищет репозиторий ВВЕРХ по родителям. Условие «этот каталог не в
      репозитории» проба не создаёт и не проверяет — она его наследует.
    measured_by_me: >-
      ЭКСПЕРИМЕНТ, воспроизведён. `TMPDIR=<kacho-workspace>/tmp/gsr-r3-tmpdir
      go test ./internal/repohygiene/ -count=1
      -run TestForeignIDPRevisionResolverSeparatesItsCauses -v` →
      `--- FAIL`, строка 390: «неспрошенное дерево названо не своей причиной:
      дерево не знает объекта-коммита c9085e45510». Причина: kacho-workspace
      САМ есть репозиторий (`git rev-parse --show-toplevel` в нём отвечает), его
      `tmp/` внутри, git находит его вверх по дереву, объект kacho там
      отсутствует → код 1 → первая ветвь. С пустым `$TMPDIR` (/tmp — не
      репозиторий) та же проба зелёная.
    why_it_is_critical: >-
      Это ЛОЖНАЯ НАХОДКА на исправном дереве, и запускает её чужая настройка, а
      не предмет пробы: ни ведомость, ни гейт трогать не нужно. Следующий шаг,
      названный заданием, — доливка в волну и ПЕРЕПРОГОН ГРУППЫ ЦЕЛИКОМ; прогон
      с `$TMPDIR` внутри репозитория покрасит группу и уведёт разбор в сторону.
      В этом воркспейсе `$TMPDIR` — живая переменная (память владельца: «Полоса
      получает чужой вердикт — общий кэш линтера и общее имя файла в TMPDIR»;
      «место полос — kacho-workspace/tmp/»), то есть случай не умозрительный.
      gate-authoring §«детерминизм входа», §«производитель входа»: вход пробы
      производится пробой.
    note_on_gitenv: >-
      `gitenv.Command` тут ни при чём и работает верно: он снимает GIT_DIR,
      GIT_WORK_TREE и ещё пять переменных (corelib v1.8.0 gitenv/gitenv.go:66-74,
      прочитано). Подъём git ВВЕРХ ПО КАТАЛОГАМ он не отключает — это и не его
      предмет.
    requirement: >-
      Вход сделать своим: либо каталог, который репозиторием быть не может по
      построению (несуществующий путь под `t.TempDir()` — тогда отказ приходит
      `*fs.PathError`, а не `*exec.ExitError`, и ветвь та же), либо барьер
      подъёма (`GIT_CEILING_DIRECTORIES`, gitenv его не снимает), либо —
      минимум — УТВЕРДИТЬ предпосылку: до отрицательной ветви проверить, что
      выбранный каталог вне репозитория, и падать вслух, если это не так. У
      положительной ветви этой пробы законный близнец есть (голова дерева
      разрешается) — у отрицательной предпосылки нет ни одной.

