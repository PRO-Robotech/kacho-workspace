round2_important:
  - id: V1@round2
    subject: 'граница формы: заглавная и шестизначная'
    status: ЗАКРЫТО, и разведено так, как просил круг 2
    verified_by_me: >-
      (1) ЗАГЛАВНАЯ ДОБРАНА: `foreignIDPRevisionShaped` принимает 'A'-'F'
      (foreignidpname.go:330). Довод перемерен мной:
      `git rev-parse --verify --quiet 5B20DF5C6385AA9BA6271F330F244658A84C58DD^{commit}`
      → 0, и `…5B20DF5C638^{commit}` → 0. Инструмент регистр принимает —
      гейт больше не красит исправную запись.
      (2) НИЖНИЙ ПРЕДЕЛ ОСТАВЛЕН И ОБЪЯВЛЕН ВСЛУХ (foreignidpname.go:339-352),
      по образцу правила `len(fw) > 3`: семь — размен, не свойство системы;
      шестизначная запись инструментом принимается (перемерил: `5b20df` → 0);
      ниже семи поле шестнадцатеричных слов не пусто (`deface`, `decade`,
      `facade`, `added`, `beef`). Следствие названо прямо и ЗАКРЕПЛЕНО ПРОБОЙ:
      `TestForeignIDPNameInjection_TooShortRevisionIsFound` гоняет настоящую
      короткую ревизию `5b20df` вместе с четырьмя словами и требует находки на
      каждом. Неверный комментарий «короче сокращённой ревизии не бывает» снят.
    bonus_the_floor_has_a_SECOND_reason_the_file_does_not_name: >-
      ИЗМЕРЕНО МНОЙ, и это усиливает довод автора, а не опровергает его.
      На этом дереве `git rev-parse --verify --quiet <N знаков>^{commit}`:
        4 знака — НЕ ОТВЕТИЛ за 420 с (код 124);
        5 знаков — НЕ ОТВЕТИЛ за 20 с (код 124);
        6 знаков и длиннее — отвечает за ~108 мс (замерено на шести значениях,
        включая несуществующие `0000000`, `deadbee`, `fffffff`).
      То есть предел «семь» — ЕЩЁ И ПОТОЛОК СТОИМОСТИ вызова: он единственное,
      что держит вызов без срока в ограниченном времени. Это стоит выписать в
      основание константы: оно у неё есть и оно замерено.

