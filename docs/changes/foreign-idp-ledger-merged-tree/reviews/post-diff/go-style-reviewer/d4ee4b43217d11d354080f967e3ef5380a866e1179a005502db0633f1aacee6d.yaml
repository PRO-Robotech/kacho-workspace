      (foreignidpname_test.go:337-373) берёт ЗАКОННЫМ БЛИЗНЕЦОМ голову дерева
      (`foreignIDPHeadRevision` — первые 11 знаков `rev-parse HEAD`), требует её
      разрешимости ПЕРЕД отказом, и дефектом — `0123456789a` ТОЙ ЖЕ ДЛИНЫ, с
      явной проверкой равенства длин («менялся бы не один факт»). Утверждает
      исполнение настоящего адаптера и ТЕКСТ отказа. Форма пары одно-фактная и
      проверяется самой пробой — та же правильная форма, что отмечена кругом 2.

  - id: V3@round2
    subject: 'причин три, формулировок две'
    status: 'ЗАКРЫТО ЧАСТИЧНО — см. K1 и V1 этого круга'
    verified_by_me: >-
      Разведение сделано у РАЗРЕШИТЕЛЯ и закреплено пробой
      `TestForeignIDPRevisionResolverSeparatesItsCauses`, требующей РАЗНЫХ
      текстов (`absent.Error() == notree.Error()` → t.Fatalf). Отнесение
      «инструмента нет вовсе» ко второй формулировке НАМЕРЕННОЕ и названо вслух;
      согласен — состояние пробой не создаётся, исход тот же.
      НО: отображение неверно на «клоне мелком» (K1, измерено), а судья
      остался с прежней одной формулировкой (V1). Класс объявлен закрытым и
      закрыт не до конца.

  - id: V4@round2
    subject: 'предикат снятия остатка — в дереве'
    status: ЗАКРЫТО
    verified_by_me: >-
      Врезка «ЧЕГО НЕ ВИДИТ ПРОВЕНАНС ЧИСЛА» (foreignidpname.go:129-156) стоит
      в файле, а не в сообщении коммита, и разводит два прочтения ЯВНО: обход
      ТЕКУЩЕЙ головы — «снимает сам гейт… исход ЗАПРЕЩЁН»; обход НАЗВАННОЙ —
      «требует отдельной рабочей копии на каждый прогон, цена не замерена».
      Предикат снятия выписан: «ведомость пуста ЛИБО число производится обходом
      названной головы, а стоимость такого обхода замерена и предъявлена».
      Прочтение (б) из круга 2 названо запрещённым дословно. Перемерил довод
      круга 2: обход текущей головы действительно обращает обе половины в
      тождества — вердикт считается `len(got) != e.Names` (foreignidpname.go:706)
      и `ForeignIDPNameStale`, обе от попаданий того же обхода.

  - id: S@round2
    subject: 'четвёртое место с парой чисел без ревизии'
    status: ЗАКРЫТО автором по собственной инициативе
    verified_by_me: >-
      Шапка `ForeignIDPNameCensus.String()` (foreignidpname.go:441-447) теперь
      несёт «103 ИМЕНИ по дереву @328e1ead5ce» и «103 СТРОКИ в пакете
      @bec320cf47d». Обе ревизии в дереве разрешаются (перемерил). Замечание не
      находка: это ВТОРАЯ копия пары, но пара привязана к неподвижным ревизиям и
      дрейфовать не может — запрет файла на вторую копию касается СЕГОДНЯШНЕГО
      числа, которое печатает перепись.

# ── РАСХОЖДЕНИЕ ЧИСЕЛ: РАЗБОР ДИСПЕТЧЕРА ПРОВЕРЕН ────────────────────────────
number_discrepancy:
  dispatcher_reading: >-
    «49 — прирост от коммита к коммиту; 18209 — прирост от гашения трёх видов
    узлов».
  my_verdict: 'РАЗБОР ВЕРЕН. Оба числа истинны, предметы разные, ни одно не заменяет другого.'
  measured_by_me:
    the_49: >-
      ОДИН распознаватель, ДВА дерева. Знаменатель @9624b4d7a2a = 206248,
      @5d376227375 = 206297, разность ровно +49 (мой прибор, отсоединённые
      копии). Поимённо по видам: константа/переменная +6 · переменная +16 ·
      переменная range +3 · поле/параметр +13 · тип +1 · функция +10 = 49.
      Коммит 5d376227375 трогал только три файла полосы — значит все 49 имён
      принесены файлами САМОЙ ПОЛОСЫ. Число круга 2 подтверждено.
    the_18209: >-
      ОДНО дерево, ДВА распознавателя. На @5d376227375 знаменатель со всеми
      девятью видами узлов 206297, без трёх добранных — 188088, разность 18209 =
      3435 + 1764 + 13010. Число автора подтверждено ЗНАК В ЗНАК.
    they_are_not_comparable: >-
      У них разные независимые переменные: у 49 меняется ДЕРЕВО при неизменном
      распознавателе, у 18209 — РАСПОЗНАВАТЕЛЬ при неизменном дереве. Попытка
      воспроизвести одно другим невозможна в принципе, и «не смог воспроизвести»
      у автора — правда о разных предметах, а не промах.
  which_number_the_paragraph_needs: >-
    ВТОРОЕ. Абзац утверждает ЛАТЕНТНОСТЬ КЛАССОВ: «классы были латентными… и
    латентность доказывается парой чисел». Доказывает её выросший ЗНАМЕНАТЕЛЬ
    при неизменном ЧИСЛИТЕЛЕ, то есть «распознаватель стал смотреть на 18209
    имён больше и не нашёл ни одного нового». Прирост от коммита к коммиту (49)
    об этом не говорит ничего: он про рост дерева, а не про расширение взгляда.
    В дереве стоит 18209 — число, отвечающее на вопрос абзаца. Выбор верен.
  the_author_refused_to_launder_someone_elses_number: >-
    И это правильно. `measurement-discipline` §«Атрибуция чужого замера»: чужое
    число, не воспроизведённое своим прибором, в дерево не вписывается. Автор
    сказал прямо, что воспроизвести не смог, поставил своё с командой и
    ревизией и потребовал единицу. Форма образцовая; вопрос снят не ею, а тем,
    что предметы оказались разные.

# ── ОЦЕНКА ПОСТУПКА: САМОПРОВЕРКА ИНСТРУМЕНТА ────────────────────────────────
self_check_assessment:
  the_claim: 'сумма по трём узлам порознь (3435 + 1764 + 13010) сошлась с совместным замером (18209)'
  is_it_chance: 'НЕТ. Совпадением это не является ни в какой мере.'
  is_it_a_strong_check: >-
    НЕТ. Это ТОЖДЕСТВО ПО ПОСТРОЕНИЮ, и потому проверка слабая. Каждый из трёх
    видов узлов увеличивает ОДИН И ТОТ ЖЕ счётчик `census.Idents` ровно на
    единицу за узел (foreignidpname.go, `add` — прочитано). Значит разность
    «прогон со всеми узлами минус прогон без трёх» ОБЯЗАНА равняться сумме трёх
    повидовых счётчиков — при условии, что прогоны различаются только этими
    тремя вызовами `add`.
  what_it_does_catch: >-
    Реальное, но узкое: описку в любом из четырёх чисел и РАСХОЖДЕНИЕ ПАРЫ
    ПРОГОНОВ (второй снят на другом дереве, на другой ревизии, или из него
    выпало что-то сверх трёх вызовов). Это не ничто: круг 2 и круг 3 оба начались
    с чисел, снятых не там, где объявлено.
  what_it_does_NOT_establish: >-
    Что три вида узлов считаются ВЕРНО. Для этого нужен внешний свидетель, и он
    у полосы есть — поузловая инъекция («Каждый узел гоняется инъекцией
    ОТДЕЛЬНО»), которой число 18209 не касается вовсе.
  my_verdict_on_the_act: >-
    ГОДНАЯ ФОРМА, НО СЛАБЕЕ ОБЪЯВЛЕННОЙ. В ДЕРЕВЕ сказано ровно и точно:
    «сумма сходится с совместным замером» — факт, без притязания. В СООБЩЕНИИ
    КОММИТА сказано больше: «чем свой инструмент и проверен» — вот это
    притязание тождество не выдерживает. Находкой не делаю: дерево не лжёт, а
    сообщение коммита предметом этой роли не является. Замечание — автору в
    руки на будущее: замкнутость арифметики своего же прибора проверяет
    арифметику, а не прибор.
  what_a_strong_check_looks_like: >-
    Ровно то, что сделал я: ВТОРОЙ, независимо написанный прибор. Он
    воспроизвёл 206329 @c9085e45510, 206297 @5d376227375, 206248 @9624b4d7a2a и
    — решающее — 204888 @6b8246108e4, число, выписанное в этот файл ЧУЖИМ
    коммитом (d9bd69b2fae) задолго до полосы. Совпадение с чужим замером на
    чужой ревизии и есть проверка прибора.

