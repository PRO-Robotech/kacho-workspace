approved:
  - >-
    I2 КРУГА 7 ЗАКРЫТ ПО СУЩЕСТВУ. Вопрос о родителе HEAD получил единственный
    дом `gitRevParentArgv` (gitrevcause.go:78-80), и обе стороны берут argv
    оттуда: боевая — gatecarrierremoval.go:619, фикстура —
    gatecarrierbase_test.go:313, и она же печатает argv в обоих своих `t.Fatal`
    (:325, :329). Вторая дословная запись строки снята; перемерено
    `grep -rn '"rev-parse", "--verify"'` → в пакете остались trunkref_test.go:55
    (о ссылке линии, другой объект) и foreignidpname_test.go:305 (о `rev^{commit}`,
    другой объект) — законные близнецы, а не вторые записи этого вопроса.
    Выбор ФУНКЦИЕЙ, а не пакетным срезом, обоснован в коде и верен: срез
    изменяем поэлементно, дом остался бы общим лишь формально.
  - >-
    I1 КРУГА 7 ЗАКРЫТ ПО СУЩЕСТВУ. Причина названа ЦЕЛОЙ КЛАУЗОЙ
    (gatecarrierremoval.go:570-571), оговорка приклеивается шаблоном (:583-584),
    и утверждение спрашивает СКЛЕЙКУ, а не слово: целая клауза своей ветви
    (gatecarrierbase_test.go:470), отсутствие чужой (:476), ровно одно вхождение
    фрагмента (:480) и совпадение этого вхождения с тем, что внутри клаузы
    (:485). Названная инъекция 2026-09-22 (категоричность вернули, фрагмент
    оставили при другом существительном) этой связкой ловится. Эталон берётся
    ТЕМ ЖЕ шаблоном (:341-346) — переписанная рядом склейка ловила бы
    переименование и молчала на подмене смысла.
  - >-
    ЕДИНИЦА ОБХОДА ВЫБРАНА ВЕРНО ПО РАССУЖДЕНИЮ. `gitRevRemedy*` есть
    идентификатор пакетного уровня, дерево единицей не является, подкаталог
    artifactgates — отдельный пакет; обход дерева дал бы ложные находки.
    Рассуждение верно; в коде оно исполнено не до конца — см. C1, чья находка
    ровно в том, что тот же довод не применён к чужому пакету ИЗ ТОГО ЖЕ
    КАТАЛОГА.
  - >-
    СТРАЖ ВЫНЕСЕН В КОД ВЫЗЫВАЮЩЕГО, А НЕ В КОПИЮ РЯДОМ.
    `gateCarrierParentUnresolved` (gatecarrierremoval.go:523) зовётся боевым
    путём (:620), таблица истинности покрывает обе половины дизъюнкции и несёт
    положительный конец (gatecarrierbase_test.go:418-424), а перепись зовущих
    отделяет боевых от пробных и краснеет на нуле боевых (:434). Утверждение о
    функции, которой никто не пользуется, исключено.
  - >-
    СЛОВО ОБ ОТВЕТЕ ИНСТРУМЕНТА ВЫБИРАЕТСЯ ПО ВЫВОДУ, И КОНЪЮНКЦИЯ РАЗЪЯТА.
    Два объявленных слова (:541-542) вместо одного; выбор по `answer != ""`
    (:503-506); пара одно-фактна — те же ref, глубина и ошибка, меняется ровно
    вывод (gatecarrierbase_test.go:366-401), и оба конца судятся в обе стороны
    (слово обязано быть и обязано отсутствовать). Сверх того утверждается
    РАЗЛИЧИМОСТЬ текстов (:390-393) — два разных ответа не вправе дать один
    текст.
  - >-
    ПРЕДПОСЫЛКИ ОБОИХ НОВЫХ ОБХОДОВ ОБЪЯВЛЕНЫ И ПАДАЮТ, А НЕ МОЛЧАТ:
    `parsed <= 1` → Fatal (gitrevcause_test.go:388), `commandCalls == 0` → Fatal
    (gitrevparentargv_test.go:162), `len(names) == 0` → Fatal (:439). Форма
    гейта по 00-kacho-core §ban17-gates соблюдена: судится узел разбора, а не
    подстрока; объём осмотренного печатается (замечание к ЗНАЧЕНИЮ этого
    объёма — в C1, к форме — нет).
  - >-
    ЗАПРЕТ #11 — свежих маркеров отсрочки 0 ПО ВСЕМУ ДИФФУ ВОЛНЫ:
    `git diff 5b20df5c638..HEAD | grep '^+' | grep -cE 'TODO:|TODO\(|FIXME|XXX|t\.Skip\(|HACK'`
    → 0.
  - >-
    ЗАПРЕТ #12 — пробы в том же изменении: ДА. Полоса круга 8 несёт 2 боевых
    файла и 3 пробных; по всей волне — 3 боевых и 5 пробных. Первым коммитом
    полосы идёт `8a942adfb12 test(repohygiene): …` — проба впереди правки.
  - >-
    Паники в рабочем пути нет: `panic(`, `log.Fatal`, `context.Background`,
    `context.TODO`, `fmt.Print*`, `log.Printf`, `MustParse` в добавленных
    строках полосы круга 8 — 0 (перемерено по диффу). ORM, pgx, gRPC,
    транспорта правка не касается; go.mod не тронут; `git` зовётся через
    `gitenv` фундамента пином.
  - >-
    Запрет #17 — идентификаторы латиницей: gitRevParentArgv,
    gateCarrierParentUnresolved, gateCarrierInferredCause, gateCarrierCauseHedge,
    gateCarrierCauseUndelivered, gateCarrierCauseRootCommit,
    gateCarrierToolNamedARevision, repohygienePackageWalk, packageCallSites,
    gateCarrierHedgedCause, TestGitRevParentQuestionHasASingleArgvHome. Ни одного
    нелатинского узла-идентификатора в добавленных строках.
  - >-
    Чистая архитектура: слоёв продукта правка не касается вовсе — целиком
    internal/repohygiene (оснастка, судящая дерево). Направление зависимостей,
    тонкость handler'ов, порты и композиционный корень предметом этого диффа не
    являются.
  - >-
    Остаток, названный автором самим (класс А-3 гейтом по дереву не закрыт,
    «утверждение держится фрагментом, а не формулировкой»), ПРОВЕРЕН ПО
    ФОРМУЛИРОВКЕ и признан честным: предикат закрытия назван («распознаватель
    „утверждение о тексте спрашивает объявленную клаузу целиком“»), держатель
    на сегодня назван (ревью и врезка), срок не обещан. Это форма, которую
    00-kacho-core §ban11-three-outcomes допускает третьим исходом. Наличие
    остатка вердикта не меняет; C1 и C2 — не он.

