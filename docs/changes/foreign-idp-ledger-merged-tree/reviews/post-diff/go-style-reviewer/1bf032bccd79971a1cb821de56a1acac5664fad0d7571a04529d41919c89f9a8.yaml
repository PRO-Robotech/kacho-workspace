    Исход прогона и линтера — предмет landing-reviewer, независимый перемер —
    check-verifier. Ни одной команды прогона (`go test`, `ci-local.sh`, линтер)
    не запускал; сданные автором числа (2472 PASS, 0 FAIL, 2 SKIP, 22 проверки,
    EXIT=0 дважды) здесь не подтверждаются и не опровергаются.
  - >-
    `-race` не исполнялся по отсутствию компилятора C — третья категория
    («не выполнилось»), не дефект автора. Не вменяю; чтение этой категории —
    предмет landing-reviewer (testing-verdict).
  - >-
    ПАДУЧЕСТЬ заявленных инъекций (подмена команды фикстуры на `cat-file -e`;
    пятая клауза соседним файлом; категоричность при сохранённом фрагменте)
    здесь судилась ПО ФОРМЕ конструкции, а не прогоном. Способность упасть —
    предмет check-verifier. Замечу для него: инъекция «пятая клауза, объявленная
    в gatecarrierremoval.go» по-прежнему ловится и после ремонта C1
    (gatecarrierremoval.go — файл пакета repohygiene), а вот инъекция той же
    клаузой в файл пакета repohygiene_test сегодня даёт ЛОЖНУЮ находку.
  - >-
    Радиус механизма «обход каталога вместо пакета» за пределами полосы не
    мерился: другие гейты пакета, читающие `os.ReadDir` каталога пакета, могут
    нести тот же род. Это отдельный предмет и отдельная задача, здесь не
    судится.

