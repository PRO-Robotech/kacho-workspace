findings:
  critical:
    - id: C1
      class: ЕДИНИЦА ОБХОДА ШИРЕ ПРЕДМЕТА УТВЕРЖДЕНИЯ — КАТАЛОГ ВМЕСТО ПАКЕТА; НАПЕЧАТАННОЕ ЧИСЛО НОСИТ ЛОЖНЫЙ ЯРЛЫК
      coordinate: internal/repohygiene/gitrevcause_test.go:360 (врезка — :346 и :358; переписи — :444 и gitrevparentargv_test.go:167)
      what: >-
        `repohygienePackageWalk` обходит `os.ReadDir(dir)` и пропускает ровно
        два вида входа: каталоги и файлы не на `.go` (:370-372). Объявления
        пакета он НЕ спрашивает. Каталог internal/repohygiene держит файлы ДВУХ
        пакетов, и это перемерено своей командой:
        `for f in *.go; do awk '/^package /{print $2; exit}' $f; done | sort |
        uniq -c` → 813 `repohygiene` и 19 `repohygiene_test`. Обход разбирает и
        отдаёт в `visit` все 832.
        Внешний тестовый пакет `repohygiene_test` — ЧУЖОЙ пакет: его
        объявления пакету repohygiene не видны, а неэкспортированные имена
        repohygiene не видны ему. То есть врезка обхода утверждает ровно то,
        что код не делает: «одноимённая константа чужого пакета — другой
        предмет. Обход дерева дал бы ЛОЖНЫЕ находки, а не более полный счёт»
        (:353-356) и «Подкаталоги пропускаются по той же причине: …есть
        отдельный пакет, и его объявления этому пакету не видны» (:358-359).
        Чужой пакет ИЗ ТОГО ЖЕ КАТАЛОГА по той же причине не пропускается.
      why_critical: >-
        Три следствия, из них два уже налицо, а не в будущем.
        (1) ЧИСЛО НЕВЕРНО СЕГОДНЯ. Перепись печатает «файлов пакета разобрано
        %d» (:444 и gitrevparentargv_test.go:167) и отдаёт 832, тогда как в
        пакете 813 файлов: ярлык называет пакет, значение считает каталог.
        Туда же и вторая величина: `gitenv.Command` в каталоге 106 вызовов, из
        них 3 живут в чужом пакете (nestedquotasuitereclaim_test.go,
        newmanproofclaim_test.go, responsecodeformparity_test.go) — перемерено
        своей командой. Гейт, печатающий объём осмотренного (00-kacho-core
        §ban17-gates), печатает его под предикатом, которого не исполняет.
        (2) «ЧУЖОГО НЕ ПОПАЛОСЬ» ЕСТЬ СВОЙСТВО СОВПАДЕНИЯ. Перемерено: ни
        `gitRevRemedy*`, ни `gitRevParentArgv` в 19 чужих файлах сегодня нет,
        поэтому обе переписи дают верное число. Это ровно та болезнь, ради
        снятия которой обход и заведён, — его собственная врезка (:348-352)
        называет её дословно: «было бы свойством СОВПАДЕНИЯ, а не построения».
        Прибор заменил одно совпадение другим.
        (3) ТРЕБОВАНИЕ СТАНОВИТСЯ НЕИСПОЛНИМЫМ. `literalAskers`
        (gitrevparentargv_test.go:144) покраснеет на вызове с литералами
        `rev-parse`+`HEAD^`, написанном в файле пакета repohygiene_test, а
        предписанный отказом ремонт — «спрашивай из дома `gitRevParentArgv`» —
        такому файлу НЕДОСТУПЕН: дом неэкспортирован. Находка без выполнимого
        ремонта (api-conventions §«Неисполнимая возможность»). Тем же путём
        одноимённый помощник чужого пакета даст ложное «у одного вопроса два
        дома» (:181).
      requirement: >-
        Сузить единицу обхода до ПАКЕТА: отбрасывать файл, у которого
        `file.Name.Name != "repohygiene"`, и считать `parsed` после отбора —
        тогда напечатанное число и его ярлык называют одно. Норма в пакете уже
        есть и заводить её не надо: containerperpackage_test.go:345
        (`pkg := f.Name.Name`) и subscriptionfloorafterpage.go:351
        (`file.Name != nil && file.Name.Name == subscriptionPackageName`).
        Предпосылку обхода при этом переписать с `parsed <= 1` на осмысленный
        нижний предел либо оставить как есть, назвав, что она судит уже
        отобранное. Врезку :346-359 привести к тому, что делает код: сегодня
        она обещает шире тела — тот же род расхождения, что круг 8 чинил в
        заголовке прежней переписи.

    - id: C2
      class: ПРЕДИКАТ ЗАКРЫВАЕТ ФОРМУ ЗАПИСИ, А НЕ КЛАСС — ВТОРАЯ ЗАПИСЬ ВОПРОСА ПРОХОДИТ ГОСПОДСТВУЮЩЕЙ ИДИОМОЙ ПАКЕТА
      coordinate: internal/repohygiene/gitrevparentargv_test.go:125-146 (слепое место — :126 и :144; живой обход — gatecarrierbase_test.go:35-37, вызовы :41 и :43)
      what: >-
        Признак второй записи снимается ТОЛЬКО с прямых строковых литералов,
        стоящих аргументами самого `gitenv.Command`: в `words` попадает лишь
        `*ast.BasicLit` (:126-131), и находкой объявляется пара
        `rev-parse`+`HEAD^` в этом наборе (:144). Аргумент-идентификатор
        разбор не раскрывает.
        Поэтому вторая запись того же вопроса, написанная через срез или через
        локальный пересылающий помощник, для гейта не существует. Это не
        умозрительная форма: в пакете 106 вызовов `gitenv.Command`, из них 21
        подаёт аргументы как `args...` — перемерено своей командой
        `grep -rn "gitenv\.Command([^)]*\.\.\." --include=*.go .`. Один из этих
        21 стоит В ТОМ ЖЕ ФАЙЛЕ, чью вторую запись круг 8 и снимал:
        gatecarrierbase_test.go:35-37 объявляет
        `run := func(args ...string) { … gitenv.Command(dir, args...) … }`, и
        фикстура уже зовёт его дважды (:41 `run("init", "-q", "-b", "main",
        ".")`, :43). Строка `run("rev-parse", "--verify", "--quiet", "HEAD^")`,
        дописанная в эту же фикстуру, — вторая запись того же вопроса, и обход
        промолчит: у `gitenv.Command` в аргументах ни одного литерала, а вызов
        `run(...)` под признак `sel.Sel.Name != "Command"` (:114) не подпадает.
      why_critical: >-
        Снятый круга 8 дефект был ИМЕННО ЭТОТ — фикстура задала свой вопрос, и
        разойтись с боевым путём она могла молча. Врезка гейта называет класс
        правильно: «вторая запись того же вопроса, а две записи расходятся
        молча — ровно это и было измерено» (:36-38). Закрыта же из класса одна
        форма — та, в которой дефект в прошлый раз попался. Второй дом,
        написанный `[]string{…}` или через `run`, остаётся молчаливым, и
        утверждение «вопрос задаётся В ПАКЕТЕ ОДНИМ НАБОРОМ АРГУМЕНТОВ»
        (заголовок файла, :16-17) шире того, что гейт способен опровергнуть.
        Довод автора о законном близнеце (`log HEAD^`) оправдывает требование
        ОБОИХ слов; он не оправдывает слепоты к тому, как эти слова записаны.
      requirement: >-
        Снимать признак с РАЗВЁРНУТОГО набора слов вызова, а не с прямых
        аргументов: распознавать `*ast.CompositeLit` типа `[]string`, чьи
        элементы несут оба слова, где бы он ни стоял в пакете, и раскрывать
        идентификатор, поданный `...`, до его объявления в той же функции.
        Минимальный честный вариант — судить пару слов по ЛЮБОМУ срезу строк в
        файлах пакета, а не только по аргументам `gitenv.Command`: близнец
        `log HEAD^` по-прежнему не краснеет, потому что второго слова не несёт.
        Если предел решат оставить, он обязан быть НАЗВАН во врезке дословно:
        гейт держит вторую запись, написанную литералами в самом вызове, и не
        держит написанную срезом или через пересылающий помощник, — иначе
        заголовок файла остаётся утверждением шире прибора.

  important:
    - id: I1
      class: ПОЛОВИНА ОБЪЯВЛЕННОГО СВОЙСТВА НЕОПРОВЕРЖИМА BY CONSTRUCTION
      coordinate: internal/repohygiene/gatecarrierbase_test.go:489 (объявление свойства — :455-457; предмет — gatecarrierremoval.go:552 и :583-584)
      what: >-
        Пункт 3 врезки объявляет: «оговорка обособлена С ОБЕИХ сторон — запятая
        слева приходит от вызывающего, справа от шаблона». Судится одна
        сторона: `strings.Contains(text, ", "+mine)` (:489). Правая запятая
        живёт ВНУТРИ `gateCarrierCauseHedge = "скорее всего,"` (:552), а
        `mine` собирается тем же `gateCarrierInferredCause` из той же
        константы (:341-346, :583-584) — значит, снятие хвостовой запятой
        меняет и текст отказа, и эталон, и утверждение остаётся зелёным.
        Односторонним обособление после этого снова станет, а проба смолчит —
        то есть ровно прежняя редакция («родителя скорее всего, нет»), которую
        врезка называет вылеченной.
      why_not_critical: >-
        Класс, ради которого шаблон заводился, — оторванность оговорки от
        предмета — закрыт по-настоящему и измеримо: причина утверждается ЦЕЛОЙ
        клаузой (:470), чужая клауза обязана отсутствовать (:476), фрагмент
        обязан встречаться ровно один раз (:480) и именно внутри клаузы (:485).
        Названная автором инъекция (категоричность вернули причине, фрагмент
        оставили при другом существительном) этой связкой ловится. Не закрыта
        правая сторона обособления — более узкий вход, и на сегодняшнем тексте
        он верен.
      requirement: >-
        Утверждать обособление не производной величиной, а литералом: одно
        утверждение о самой константе (хвостовая запятая у
        `gateCarrierCauseHedge`) либо проверка вхождения литеральной строки
        `", скорее всего, "` в текст отказа. Обе стороны тогда судятся, и ни
        одна не выводится из того же места, что и эталон.

    - id: I2
      class: СТРАЖ ЗАКРЕПЛЁН ЭКЗЕМПЛЯРОМ ЗОВУЩЕГО, А НЕ ЗАПРЕТОМ ВТОРОЙ РУКОПИСНОЙ ДИЗЪЮНКЦИИ
      coordinate: internal/repohygiene/gatecarrierremoval.go:523 (перепись — gatecarrierbase_test.go:431-437)
      what: >-
        Перепись зовущих утверждает ровно одно: боевых зовущих `по имени` не
        ноль (:434). Она не запрещает второй записи САМОГО УСЛОВИЯ: строка
        `if e != nil || strings.TrimSpace(string(parent)) == ""`, написанная у
        нового места разрешения родителя, оставит перепись зелёной (первый
        зовущий на месте), а страж будет обойдён. Это тот же род, что C2, но
        на другом предмете и с меньшим радиусом: сегодня разрешение родителя в
        пакете одно (gatecarrierremoval.go:620), перемерено.
      why_not_critical: >-
        Таблица истинности полна в обе стороны — пять строк, обе половины
        дизъюнкции и положительный конец «ревизия названа, отказа нет» →
        false (gatecarrierbase_test.go:418-424); утверждается ТОТ ЖЕ код, что
        стоит у вызывающего, а не копия рядом, и это проверено переписью.
        Второго места разрешения родителя в дереве сегодня нет.
      requirement: >-
        Либо добавить к переписи признак рукописной дизъюнкции (двоичное `||`,
        чьи стороны — `e != nil` и сравнение `TrimSpace(string(x)) == ""`) в
        файлах пакета мимо тела стража, либо назвать предел во врезке: перепись
        держит «страж не зовут вовсе» и не держит «условие переписали рядом».

  foundation_candidates: []   # ни одного; правка целиком доменная для гейтов дерева

  style:
    - coordinate: internal/repohygiene/gitrevcause_test.go:360 (зовущие — :415, gitrevparentargv_test.go:74 и :103)
      what: >-
        ОТВЕТ НА ВОПРОС ЗАДАНИЯ О ЦЕНЕ. Да, разбор платится трижды: обход
        зовут три раза (перемерено `grep -rn repohygienePackageWalk`), каждый
        раз заводится свой `token.NewFileSet()` и заново разбираются все файлы
        каталога — 3 × 832 разбора за прогон пакета. Дефектом это не является:
        общий кеш при `t.Parallel()` потребовал бы синхронизации, а названная
        автором цена (≈0.6 с на 23-секундный пакет) на порядок ниже предмета.
        Названо ради предикта роста: четвёртый зовущий добавит ещё 832 разбора
        линейно, и тогда дешевле один разбор под `sync.Once`, отдающий
        неизменяемый срез разобранных файлов (после разбора AST только
        читается, параллельным пробам это безопасно). Вторая половина вопроса —
        «не станет ли обход тем, что будут копировать» — отвечена
        КОНСТРУКЦИЕЙ: обход вынесен общим помощником и уже взят тремя местами,
