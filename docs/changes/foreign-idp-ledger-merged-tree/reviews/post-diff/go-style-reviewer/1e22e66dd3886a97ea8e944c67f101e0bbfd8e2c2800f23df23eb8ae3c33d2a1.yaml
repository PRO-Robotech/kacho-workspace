approved:
  - >-
    ЧИСТОТА ФУНКЦИИ (пункт 4 задания) — ПОДТВЕРЖДЕНА. Тело
    gatecarrierremoval.go:454-470 зовёт только fmt.Sprintf, strings.TrimSpace и
    fmt.Errorf, читает две константы (gitRevRemedyCloneDepth /
    gitRevRemedyDeclaredBase, gateCarrierBaseEnv) и четыре аргумента. Ни gitenv,
    ни os, ни exec, ни обращения к дереву, ни пакетного состояния. Вопрос о
    глубине остался НА СТОРОНЕ ВЫЗЫВАЮЩЕГО — `gitCloneIsShallow(root)` считается
    на :505 и приходит булем. Строимость пары этим действительно куплена: новая
    проба зовёт функцию напрямую и битого репозитория не создаёт.
  - >-
    РЕЦИДИВА КЛАССА В САМОМ ВЫНОСЕ — В ЧАСТИ СЛОВАРЯ НЕТ. Рядом с четвёртой
    клаузой новой прозы о ремонте не заведено: ветвь корневого коммита несёт
    клаузу плюс имя ручки (`ручка KACHO_GATE_CARRIER_BASE`), ветвь мелкого
    клона — прежний рецепт, добавленный не этим кругом. Фрагмент `cause` ремонта
    не называет вовсе.
  - >-
    ЗАПРЕТ #11 — свежих маркеров отсрочки 0. Обход по ВСЕМУ диффу волны:
    `git diff 5b20df5c638..HEAD | grep '^+' | grep -E 'TODO|FIXME|XXX|HACK|позже|пока что|t\.Skip'`
    → два вхождения, оба НЕ маркеры: foreignidpname_injection_test.go:403 и :439
    подают «TBD»/«позже» ВХОДОМ гейта (формы, ревизиями не являющиеся), а
    foreignidpname.go:378 перечисляет их в врезке как отвергаемые формы.
  - >-
    ЗАПРЕТ #12 — пробы в том же изменении: ДА. Коммит d6cd581e65a несёт
    gatecarrierremoval.go + gitrevcause.go вместе с gatecarrierbase_test.go +
    gitrevcause_test.go; по всей волне прод-файлов 3, тестовых 4.
  - >-
    Паники в рабочем пути нет; `panic(`, `log.Fatal`, `context.Background`,
    `context.TODO`, `fmt.Println`, `log.Printf`, `MustParse` в добавленных
    строках всего диффа волны — 0 вхождений.
  - >-
    Запрет #17 — идентификаторы латиницей: gateCarrierNoParentRefusal,
    gitRevRemedyDeclaredBase, TestGateCarrierNoParentRefusalCarriesTheToolsAnswer,
    reachable/other/silent/shal/cause. Кириллица — только в комментариях и
    текстах отказов, что разрешено.
  - >-
    Направление зависимостей не затронуто: правка целиком внутри
    internal/repohygiene, слоёв продукта (domain/use-case/repo/handler) не
    касается; pgx, gRPC, транспорта в диффе нет. Композиционных корней не
    трогает, глобальных синглтонов и init() не заводит.
  - >-
    Переиспользование: git зовётся через gitenv внешнего фундамента, взятого
    пином; локальной копии обёртки не заведено, go.mod не тронут.
  - >-
    У новой пробы есть половина НА НАСТОЯЩЕМ ПРОИЗВОДИТЕЛЕ: синтетическая
    (gatecarrierbase_test.go:175) соседствует с
    TestGateCarrierBaseNamesARootCommitAsItIs (:144-160), которая поднимает
    настоящее дерево и спрашивает ту же четвёртую клаузу. Синтетика доказывает
    свойство продукта, а не своей копии.

