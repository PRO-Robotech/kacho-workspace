findings:
  critical:
    - id: C1
      class: ERROR WRAP / ПРИЧИНА НЕ ПРЕДЪЯВИМА (рецидив I1 круга 5, закрытый наполовину)
      coordinate: internal/repohygiene/gatecarrierremoval.go:455 (потребители — :463 и :468)
      what: >-
        `cause := fmt.Sprintf("ответ инструмента — вывод %q, ошибка %v",
        strings.TrimSpace(string(parent)), e)`, и дальше `cause` входит в ОБА
        отказа подстановкой `%s`. Ответ инструмента вынесен наружу ПРОЗОЙ, а
        цепь ошибки оборвана: на возвращённом отказе
        `errors.As(err, new(*exec.ExitError))` и `errors.Is(err, …)` ложны.
        Читающий-человек утверждение о причине опровергнуть может, читающий-код —
        нет.
      why_critical: >-
        Три довода, каждый измерен, а не выведен.
        (1) ПАКЕТ САМ НАЗЫВАЕТ ЭТУ ФОРМУ ДЕФЕКТНОЙ: врезка соседнего
        производителя — foreignidpname_test.go:286-302 — «Прежняя редакция отдала
        `%w` сентинелу и оставила причине `%v`: текст по-прежнему называл три
        подслучая, а код не давал НИ ОДНОГО признака, по которому их различить».
        Там же показана и форма ремонта: два `%w` в одном вызове
        (foreignidpname_test.go:320-322).
        (2) ТРЕБОВАНИЕ КРУГА 5 НАЗЫВАЛО `%w` ИМЕННО ЗДЕСЬ, с одной альтернативой:
        «либо явно назвать в комментарии, каким предикатом доказано, что `e`
        здесь бывает только кодом 1». Круг 6 от этой альтернативы ЯВНО
        отказывается своим же комментарием (:444-446): «Сегодня сюда доходят
        только коды 1 …, но «сегодня недостижимо» есть свойство МАРШРУТА, а не
        кода». Отказавшись от второго исхода, круг обязан был исполнить первый.
        (3) ДОВОД «e БЫВАЕТ nil» ОПРАВДЫВАЕТ НЕ `%v`, А ЛИШЬ ОТКАЗ ОТ
        БЕЗУСЛОВНОГО `%w`. Ветвь входит по дизъюнкции (`e != nil ||` пустой
        вывод), и `%w` на nil дал бы `%!w(<nil>)` без обёртки; но половина
        `e != nil` — ровно та, ради которой предъявимость и нужна, и обернуть её
        условно ничто не мешает. Ни в коде, ни в комментарии этот довод не
        назван: `%v` стоит необъяснённым внутри функции, вся врезка которой — о
        том, что ответ инструмента несётся наружу.
      requirement: >-
        В ветви `e != nil` обернуть причину через `%w` (условно, сохранив текст
        «ошибка <nil>» для второй половины дизъюнкции) — как это сделано у
        соседнего производителя в foreignidpname_test.go:320-322. Утверждение о
        закрытии класса держать предикатом `errors.As(err, new(*exec.ExitError))`
        на входе с отказом иного рода, а не вхождением подстроки.
      returned_to: автор диффа (полоса fix/foreign-idp-ledger-counts-the-merged-tree)

  important:
    - id: I1
      class: УТВЕРЖДЕНИЕ О ПРИЧИНЕ БЕЗ ОГОВОРКИ — АСИММЕТРИЯ ДВУХ ВЕТВЕЙ
      coordinate: internal/repohygiene/gatecarrierremoval.go:466-468
      what: >-
        Ветвь мелкого клона оговорена — «родитель, СКОРЕЕ ВСЕГО, существует у
        источника и просто не довезён» (:460). Ветвь полного клона утверждает
        категорически — «клон ПОЛНЫЙ, и родителя у HEAD НЕТ — это корневой
        коммит», — опираясь ровно на тот же единственный признак `shallow ==
        false`. При отказе иного рода (битый объект, права) предложение остаётся
        ложным, и опровергает его только приписанный рядом `ответ инструмента`.
        Класс, закрываемый этим кругом, в ней уцелел на две трети: улика теперь
        рядом, а ложь в предложении — на месте.
      why_not_critical: >-
        Улика приписана, то есть утверждение стало опровержимым для читающего.
        Вход сегодня недостижим по тому же маршруту, что описан во врезке.
      requirement: >-
        Оговорить симметрично ветви мелкого клона либо поставить категоричность в
        зависимость от ответа инструмента, а не от одного вопроса о глубине.

    - id: I2
      class: ВЗАИМНОЕ ИСКЛЮЧЕНИЕ ЧЕТВЁРТОЙ КЛАУЗЫ НЕПОЛНО В ОДНУ СТОРОНУ
      coordinate: internal/repohygiene/gatecarrierbase_test.go:215-219 (и gitrevcause_test.go:284-286)
      what: >-
        Сторона «три старых знают о новой» — полная: каждая из трёх строк
        ведомости несёт gitRevRemedyDeclaredBase в списке `absent`. Сторона
        «новая знает о трёх» — одна треть: `root` исключает только
        gitRevRemedyCloneDepth, `shal` — только gitRevRemedyDeclaredBase.
        Отсутствия gitRevRemedyLedger и gitRevRemedyWorkingDir в тексте новых
        отказов не утверждает НИКТО. Текст коммита говорит «добавлена во взаимное
        исключение трёх соседних причин» — это верно для направления 3→новая и
        неверно для новая→3.
      why_not_critical: >-
        Пара, которую реально можно спутать, разделена в обе стороны: корневой
        коммит и мелкий клон приходят ОДНИМ кодом возврата, и ровно их
        взаимоисключение проверено симметрично. Ledger и WorkingDir производит
        другой производитель и другим кодом (128 / ошибка ФС).
      requirement: >-
        Дописать отсутствие оставшихся двух клауз в утверждения о `root` и
        `shal`; сверх того — сделать покрытие ведомости
        TestGitRevRemedyVocabularyHasASingleSource ПЕРЕПИСЬЮ по объявленному
        словарю (строк ведомости = объявленных клауз), иначе пятая клауза завтра
        окажется несуженной молча — ведомость слепа к строке, которой нет.

    - id: I3
      class: УТВЕРЖДЕНИЕ ПО ПРОЗЕ МИМО ОБЩЕГО ИСТОЧНИКА — ВТОРОЙ ЭКЗЕМПЛЯР КЛАССА W2
      coordinate: internal/repohygiene/gatecarrierbase_test.go:206
      what: >-
        `if !strings.Contains(silent.Error(), "<nil>")` — вторая половина
        дизъюнкции («инструмент не отказал, но и ревизии не назвал») утверждается
        ГОЛЫМ ЛИТЕРАЛОМ, который нигде не объявлен: в тексте он появляется лишь
        побочно, как вывод `%v` от nil-ошибки. Это та же форма, ради снятия
        которой заводился словарь ремонта, применённая к другому факту. Отдельно:
        отличимость `silent` от отказов держится ТОЛЬКО этим литералом —
        сравнения `silent.Error()` с `reachable.Error()` в пробе нет, хотя пара
        `reachable`/`other` такое сравнение несёт (:199).
      why_not_critical: >-
        Литерал — форматирование stdlib, а не проза продукта, и сам по себе
        устойчив.
      requirement: >-
        Сравнить `silent.Error()` с `reachable.Error()` (однофактная пара, как у
        соседней) и/или объявить маркер «инструмент не отказал» один раз рядом со
        словарём. Связано с C1: условная обёртка `%w` изменит этот текст, и проба
        покраснеет не по своему предмету.

