checked_ok:
  atomicity: >-
    Ветвь ключа повышения: сдвиг счётчика (advanceSignCountTx), предъявление в
    сессии (UPDATE human_sessions … WHERE id AND ended_at IS NULL), сброс счёта
    и журнал повышения — одна транзакция PersonWriter; откат снимает сдвиг вместе
    с предъявлением. Отказ — след попытки и журнал refused одной транзакцией,
    отвязанной от отмены запроса (WithoutCancel + свой WithTimeout 5 с на каждую
    из двух записей). Журнал публикации #829 — тем же tx, что надгробие. Двойной записи нет.
  cas_and_once: >-
    Испытание: одно живое на сессию — частичный UNIQUE + INSERT … ON CONFLICT с
    тем же предикатом; сгорание — один условный UPDATE, кардинальность 1.
    Счётчик: CAS sign_count=$exp AND $new>sign_count; проигрыш → откат без
    сигнала клонирования. Снятие ключа между чтением и сдвигом → 0 строк → отказ.
    Отзыв сессии между resolve и фиксацией → ended_at IS NULL не совпадает →
    отказ. Проверки «прочитал → записал» без механизма базы не найдено.
  lock_order: >-
    Ветвь ключа повышения: личность (FOR KEY SHARE) → строка ключа (NO KEY
    UPDATE сдвига) → запись сессии; снятие ключа: личность → ключи FOR UPDATE —
    тот же порядок, встречного нет. Запрос кода восстановления (#776) поднят до
    FOR NO KEY UPDATE на личности — с ключевым замком повышения совместим.
    Сгорание испытания вне транзакции предъявления (пул) — by design, fail-closed:
    сбой после сгорания требует новой выдачи, лишнего права не даёт.
  concurrent_probes: >-
    наличие прочитано @81fa3e12: TestAccessKeyStepUpRepo_ConcurrentIssuesLeaveOneLive,
    TestAccessKeyStepUpRepo_ConsumeRaceHasOneWinner (горутины, testcontainers),
    TestSUA80_LostCounterRaceIsRefused, TestSUA80_LostAdvanceIsRefusedWithoutTheCloneSignal,
    TestSystemClass_SD8291_OldWriterUnpublishAfterMove. Зелёный — со слов
    задания (ci 12/12, e2e-newman 5/5 на черновике); мной не перепрогнан.
  rollout_old_pods: >-
    20261015140000 добавляет CHECK класса только на чтении; прежний под (до #829)
    класс не пишет вовсе, его user:* на записи отвергает 23514 прежнего
    ограничения — транзакция откатывается целиком (закрыто). Ветвь снятия с
    user:* сворачивается в хранимый класс (SD-829-1 исполнен). Прежний под до
    #827 нового пути не обслуживает: 404 слушателя на этот путь, закрыто.
  cross_product_contract: >-
    Край платформы, спрашивающий Check говорящим user:*, после посадки не
    получает отказа: domain.SpeakerClasses отображает user:* в
    system_class:anonymous (приём закреплён internal/domain/system_class_test.go:51;
    вывод PAR-746-01). Значит, порядок посадки kaname → пин в kacho анонимное
    чтение не роняет. Расхождение текста контракта с этим — находка proto-api-reviewer, не здесь.
  edges: >-
    новых межсервисных рёбер нет: internal/clients меняет только метку исхода
    очереди писем (MailEventTypes); новых RPC и служб нет (git diff base...head
