important:
  - id: SD-746-1
    blocks: false
    class: параллельные полосы одного механизма разошлись (arch-lanes-compare-norm)
    where:
      - internal/repo/kaname/pg/access_key_step_up_repo.go (SweepUnservableStepUpChallenges, DELETE … ctid IN (SELECT … LIMIT) без SKIP LOCKED)
      - internal/repo/kaname/pg/recovery_code_repo.go (#776/#774 перевёл ту же форму уборки на FOR UPDATE SKIP LOCKED)
      - internal/repo/kaname/pg/human_session_repo.go:sweepUnservableSessionsSQL (шапка: «ожиданий на дочерних строках каскада это не снимает»)
    finding: >-
      Испытание повышения — ребёнок записи сессии (FK ON DELETE CASCADE).
      Уборщик сессий снимает истёкшие сессии партией, каскад снимает их
      испытания в порядке сессий; уборщик испытаний берёт те же строки (порог —
      срок испытания) в порядке плана по ctid и занятые ЖДЁТ. Две многострочные
      DELETE одной таблицы в разных порядках дают взаимное ожидание; база снимает
      одну из них 40P01, следующий проход дочищает. Порчи и лишнего права нет —
      поэтому не блокирует; но соседняя полоса той же волны (#774) этот класс у
      кодов восстановления уже закрыла, а #827 завела новую уборку в прежней форме.
    requirement: >-
      Та же форма, что у recovery_code_repo.go: WITH doomed AS (SELECT id … ORDER
      BY id LIMIT $2 FOR UPDATE SKIP LOCKED) DELETE … USING doomed. Предикат:
      проба по образцу human_session_sweep_teardown_integration_test.go —
      держатель строки испытания в открытой транзакции + уборка испытаний
      завершается без ожидания (pg_stat_activity wait_event_type <> 'Lock').
    note: 'в задачу не выносится (gi-find-own-issue): корректность ПО и безопасность не задеты'

