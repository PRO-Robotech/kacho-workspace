# Точное множество требуемых держателей изменения kn-746 — посадка эпика
# kaname#746 в `main` службы доступа (запрос kaname#820). Образец формы —
# `docs/changes/kn-296/holders.yaml`.
#
# ЗДЕСЬ НЕ ОБЪЯВЛЕН НИ ОДИН ИСХОД. Вердикт по человеческому держателю — внешнее
# событие актора из `docs/changes/policy.yaml` §2 (сейчас pointpu) на отпечаток,
# названный в `change.yaml`. Записи агентов в дереве продукта
# (`docs/changes/kn-827/`, `docs/changes/kn-829/`, `docs/specs/reviews/`)
# событием роли не являются и держателя не закрывают.
#
# ЛИНИЯ ЗАМОРОЖЕНА до посадки kaname#820: отпечаток `change.yaml` снят
# 2026-10-16 на origin/746 81fa3e12; после сдвига головы каждая запись на
# прежнем отпечатке новую линию не судит.
#
# Признаки применимости измерены в клоне kaname на паре bbbe3352...81fa3e12:
#   пути диффа        git diff --name-only <B>...<H> | wc -l                         → 279
#   Go                git diff --name-only <B>...<H> | grep -c '\.go$'                → 192
#   миграции и .sql   git diff --name-only <B>...<H> -- '*/migrations/*' '*.sql' | wc -l → 12 (новых .sql — 5)
#   proto             git diff --name-only <B>...<H> -- '*.proto' | wc -l             → 7
#   слияния в линии   git rev-list --merges --count <B>..<H>                         → 27
#   приёмки           acceptance_set_predicate (`change.yaml`)                       → 6
#   замысел           design_set_predicate (`change.yaml`)                           → 1
schema_version: 1
change_id: kn-746

# ── ПРИМЕНИМОСТЬ РОЛЕЙ: все роли review_authority ───────────────────────────
# Освобождённых нет: у каждой из одиннадцати ролей предмет в изменении есть, а
# для полей о дереве службы доступа освобождение и не пересчитывалось бы —
# PRO-Robotech/kaname не назван в policy.yaml §1 (`change.yaml`, шапка).
#
# security-auditor В РЕЕСТРЕ review_authority НЕТ (policy.yaml §2) и строкой
# раздела стоять не может: строка без роли реестра — находка check-04. Периметр
# линии при этом затронут — анонимный субъект как системный класс (kaname#829:
# публикация для анонимного чтения переезжает с `user:*` на
# `system_class:anonymous`, модель `proto/kaname/cloud/iam/v1/fga_model.fga`) и
# второй фактор со входом ключом доступа без пароля (kaname#827,
# `internal/webauthnverify/`, `internal/handler/loginlanehttp/`). Разбор периметра
# — пред-посадочная запись агента, держателя не закрывает; вердикт по
# безопасности в контуре несут `system-design-reviewer` (отказ соседа фейлится
# закрыто) и `go-style-reviewer` (раскладка, authz в слое) событиями pointpu.
role_applicability:

  acceptance-reviewer:
    status: applicable
    holder: human-acceptance
    reason: >-
      линия добавляет и меняет 6 приёмок в `docs/engineering/acceptance/`
      (`change.yaml`, acceptance_set_predicate): 4 новых, 2 изменённых.

  class-exposure-analyst:
    status: applicable
    holder: [human-class-exposure-initial, human-class-exposure-revalidation]
    reason: >-
      названы и приёмки, и замысел: первичный разбор — на отпечаток приёмок,
      перепроверка — на отпечаток замысла.

  design-reviewer:
    status: applicable
    holder: human-design
    reason: >-
      линия несёт документ замысла
      `docs/engineering/acceptance/step-up-with-any-enrolled-method-design.md`;
      вердикт — только событие pointpu на его отпечаток, ничем не заменяется.

  db-architect-reviewer:
    status: applicable
    holder: human-post-diff-db
    reason: >-
      `git diff --name-only bbbe3352...81fa3e12 -- '*/migrations/*' '*.sql'` = 12
      путей, из них 5 новых миграций `.sql` в `internal/migrations/`; предикат
      `no-migrations-in-change` ложен.

  go-style-reviewer:
    status: applicable
    holder: human-post-diff-go
    reason: дифф несёт 192 пути `*.go` (bbbe3352...81fa3e12).

  proto-api-reviewer:
    status: applicable
    holder: human-post-diff-proto
    reason: >-
      `proto_files_touched` = 7 (proto/kaname/cloud/iam/v1/), из них два
      внутренних контракта — `internal_iam_service.proto`,
      `internal_module_service.proto`; предикат `no-proto-in-change` ложен.

  system-design-reviewer:
    status: applicable
    holder: human-post-diff-system
    reason: >-
      распределённая поверхность в диффе есть: журнал проекции в хранилище
      отношений `internal/repo/kaname/pg/fga_outbox/emitter.go` меняет хранимый
      субъект публикации, миграция
      `20261015120000_anonymous_and_authenticated_are_subject_classes.sql`
      переносит выданные кортежи (`access_binding_emitted_tuples`), применитель
      очереди писем `internal/clients/invite_mail.go` меняет метку исхода,
      меняются внутренние межсервисные контракты (`internal_iam_service.proto`,
      `internal_module_service.proto`) и модель `fga_model.fga`.

  wave-reviewer:
    status: applicable
    holder: human-wave
    reason: >-
      линия собрана слияниями волн: `git rev-list --merges --count
      bbbe3352..81fa3e12` = 27; предикат `no-lane-merges-in-change` ложен.

  integration-tester:
    status: applicable
    holder: [prod-ci, prod-newman-e2e]
    reason: >-
      роль — владелец проб и первого прогона; дифф трогает `tests/newman/`
      (кейсы и коллекции); отдельной человеческой записи не даёт, держит
      машинных держателей ниже.

  convergence-reviewer:
    status: applicable
    holder: human-convergence
    reason: единственная роль, выпускающая конечную запись контура.

  landing-reviewer:
    status: applicable
    holder: human-landing
    reason: >-
      применённое содержимое сверяется с одобренным после посадки; до неё исход
      держателя — «не выполнилось».

required_holders:

  # ── машинные ──────────────────────────────────────────────────────────────

  prod-ci:
    kind: machine
    owner: integration-tester
    executable: .github/workflows/ci.yml на запросе эпика kaname#820
    predicate: все задания конвейера службы доступа зелены на голове из `change.yaml`
    evidence_coordinate: evidence/prod-ci/
    producer_exists: >-
      `.github/workflows/ci.yml` отслеживается на origin/main kaname bbbe3352
      (`git ls-tree --name-only bbbe3352 .github/workflows/`).

  prod-newman-e2e:
    kind: machine
    owner: integration-tester
    executable: .github/workflows/e2e-newman.yml на запросе эпика kaname#820
    predicate: >-
      второй эшелон — сквозные пробы по развёрнутому, отдельно от
      unit/integration (`00-kacho-core.md#ban12-second-echelon`)
    evidence_coordinate: evidence/prod-newman-e2e/
    producer_exists: >-
      `.github/workflows/e2e-newman.yml` отслеживается на origin/main kaname bbbe3352.

  # ── человеческие ──────────────────────────────────────────────────────────

  human-acceptance:
    kind: human-external
    owner: acceptance-reviewer
    executable: внешнее review event на отпечаток каждой приёмки набора
    predicate: каждая приёмка набора одобрена на текущем отпечатке
    evidence_coordinate: evidence/human-acceptance/

  human-class-exposure-initial:
    kind: human-external
    owner: class-exposure-analyst
    executable: внешнее review event на отпечаток набора приёмок
    predicate: пункты exposure приёмок разобраны и сопоставлены
    evidence_coordinate: evidence/human-class-exposure-initial/

  human-class-exposure-revalidation:
    kind: human-external
    owner: class-exposure-analyst
    executable: внешнее review event на отпечаток замысла
    predicate: пункты exposure перепроверены против замысла
    evidence_coordinate: evidence/human-class-exposure-revalidation/

  human-design:
    kind: human-external
    owner: design-reviewer
    executable: внешнее review event pointpu на отпечаток замысла (`change.yaml`, design_sha256)
    predicate: замысел одобрен на текущем отпечатке
    evidence_coordinate: evidence/human-design/

  human-post-diff-db:
    kind: human-external
    owner: db-architect-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: применённые миграции не правлены, инварианты на уровне БД, Down у каждой
    evidence_coordinate: reviews/post-diff/db-architect-reviewer/

  human-post-diff-go:
    kind: human-external
    owner: go-style-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: раскладка слоёв цела, мёртвого кода и маркеров отсрочки нет, пробы в том же изменении
    evidence_coordinate: reviews/post-diff/go-style-reviewer/

  human-post-diff-proto:
    kind: human-external
    owner: proto-api-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: контракт совместим (`buf breaking`), конвенции API соблюдены
    evidence_coordinate: reviews/post-diff/proto-api-reviewer/

  human-post-diff-system:
    kind: human-external
    owner: system-design-reviewer
    executable: внешнее review event на точный отпечаток содержимого изменения
    predicate: распределённые свойства целы, отказ соседа фейлится закрыто, лишних рёбер нет
    evidence_coordinate: reviews/post-diff/system-design-reviewer/
    distributed_surface: true

  human-wave:
    kind: human-external
    owner: wave-reviewer
    executable: внешнее review event на отпечаток собранной линии
    predicate: полосы, лежащие рядом, не решают одну задачу дважды и не отменяют правку соседа
    evidence_coordinate: reviews/wave/wave-reviewer/

  human-convergence:
    kind: human-external
    owner: convergence-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: >-
      множество ролей сверено с review_authority в обе стороны, записи — на
      текущем отпечатке, отпечатки базы и головы названы
    evidence_coordinate: evidence/human-convergence/

  human-landing:
    kind: human-external
    owner: landing-reviewer
    executable: внешнее review event на посаженное содержимое
    predicate: >-
      канонический набор диффа посаженного совпадает с объявленным в
      `change.yaml` (canonical_diff_set_sha256)
    evidence_coordinate: evidence/human-landing/

# ── отличия от образца `kn-296` ─────────────────────────────────────────────
#   1. Пакет заведён без записей ролей: каталогов `reviews/` и `evidence/` нет;
#      записи появляются событиями ролей на отпечаток `change.yaml`.
#   2. Записи агентов по под-эпикам лежат в дереве продукта
#      (`docs/changes/kn-827/`, `docs/changes/kn-829/` на голове 81fa3e12) и
#      сюда не переносятся: держателей они не закрывают.
#   3. Родительского пакета нет (`coordinates.parent_package` не назван).
