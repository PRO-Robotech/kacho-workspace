# Манифест изменения kn-746 — посадка эпика kaname#746 («identity-own —
# продолжение: находки имитации клиента и остаток долга») из ветки `746` в
# `main` службы доступа, запрос эпика kaname#820. Внутри линии — анонимный и
# аутентифицированный субъект как системные классы (kaname#829) и второй фактор,
# в том числе подтверждение ключом доступа без пароля (kaname#827). Имя — по
# соглашению `kn-<N>` соседних пакетов службы доступа (`docs/changes/kn-*`).
#
# Манифест НЕ несёт нормативной прозы (CG_HUMAN_MANIFEST_PROSE): применимость
# ролей и держатели — в `holders.yaml`. Образец формы — `docs/changes/kn-296/`.
#
# ЛИНИЯ ЗАМОРОЖЕНА решением диспетчера до посадки kaname#820 (сборка волны 9
# в ветку 746 не вливается). Голова и база перемерены 2026-10-16 с origin.
# Сдвинется голова — ВСЕ отпечатки ниже станут отпечатками прежней линии.
# Пересчёт — командами поля `remeasure`.
#
# РЕПОЗИТОРИЯ PRO-Robotech/kaname НЕТ в `docs/changes/policy.yaml` §1 (cutover
# назван только у kacho-workspace и kacho): освобождение по полю о дереве
# продукта производитель `applicability.py` для этого пакета не пересчитает.
# Здесь ни одно такое освобождение не нужно: все три поля
# (`migrations_touched`, `proto_files_touched`, `lane_merges_in_change`) больше нуля.
schema_version: 1
change_id: kn-746
lifecycle_state: IMPLEMENTING

coordinates:
  issue: https://github.com/PRO-Robotech/kaname/issues/746
  issue_kind: epic            # метки kaname#746: P1 · area:iam · epic · release:identity-own-2
  epic_pr: https://github.com/PRO-Robotech/kaname/pull/820   # черновой запрос эпика 746 → main
  repositories:
    - repo: PRO-Robotech/kacho-workspace
      role: package-home
      base_sha: 635cf54c0cbf9c2f61678b191ffe40ce9e30f9b0
      cutover_is_ancestor_of_base: true    # git merge-base --is-ancestor 1202e3cf… 635cf54c → 0
    - repo: PRO-Robotech/kaname
      role: subject-tree
      branch: '746'
      base_sha: bbbe33524c4ae501d4ea14d2d9747f300d057a99   # origin/main @2026-10-16
      head_sha: 81fa3e1234d04beff1b546aec8056b0c9ec37efc   # origin/746 @2026-10-16, голова kaname#820
      merge_base_equals_base: true         # git merge-base bbbe3352 81fa3e12 → bbbe3352
      commits_in_line: 156                 # git rev-list --count bbbe3352..81fa3e12
      merges_in_line: 27                   # git rev-list --merges --count bbbe3352..81fa3e12
      paths_in_diff: 279                   # git diff --name-only bbbe3352...81fa3e12 | wc -l
      cutover_in_policy: false             # policy.yaml §1 не называет PRO-Robotech/kaname

