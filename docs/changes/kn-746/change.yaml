    | awk -F'\t' '{split($1,a," "); print "PRO-Robotech/kaname\t" $2 "\t" a[2] "\t" a[4]}'
    | LC_ALL=C sort | sha256sum

  holders_sha256: 213c7026944bf9f38e499e91c0c8da0dc0f0c9bba5d0689ba69e93814d5ac994

  # Приёмки и замысел эпика лежат в ДЕРЕВЕ ПРОДУКТА (`docs/engineering/acceptance/`)
