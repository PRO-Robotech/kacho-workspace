  content_digest_sha256: 13fba206eed9cc460f39cfc459f088e38ce353032f81db7be1e52c5174289b9c
  content_digest_predicate: >-
    git diff --full-index bbbe33524c4ae501d4ea14d2d9747f300d057a99...81fa3e1234d04beff1b546aec8056b0c9ec37efc | sha256sum

  canonical_diff_set_sha256: c17e79f09c6b83d01835a609dd94d38c640d1f8d5f80688e1ed953fa9ca86410
  canonical_diff_set_predicate: >-
