style_non_blocking:
  - at: acrlevel/acrlevel.go:35-46
    what: >-
      значения acr "1"/"2"/"3" и ранги — голые литералы (скил evgeniy §7). Форма
      перенесена из grpcsrv дословно; раз это теперь единственная таблица
      платформы, именованные константы ступеней были бы естественны здесь.
      Ветка `case "0", "": return 0` перед `default: return 0` избыточна по
      исполнению и держится только как документация.
  - at: acrlevel/transport_test.go:68,111
    what: >-
      одна карта `seen` хранит и пути пакетов, и строки рёбер «pkg → imp».
      Коллизии нет (в ребре есть « → »), но с двумя картами читалось бы проще.
  - at: acrlevel/transport_test.go:148-156
    what: >-
      sc.Err() не проверяется: ошибка сканера выдаёт себя за «нет строки module».
      Проба и так падает, но причина названа неверно.
  - at: acrlevel/transport_test.go:100-101
    what: 'ошибка filepath.Rel возвращается без контекста (раздел «Обёртка ошибок»); путь практически недостижим'

