    прод-кода с ошибками в диффе нет (две чистые функции). В пробе transport_test.go:101
    `return w, err` без контекста — неблокирующее.
  context: 'не применимо: вызовов IO и внешних вызовов в диффе нет'
  no_panic: 'паники, must* и log.Fatal в диффе нет'
  logging: 'журналирования в диффе нет'
  naming: >-
    acrlevel.Rank / acrlevel.Satisfies — без повтора имени пакета; идентификаторы
    латиницей (не-ASCII только в комментариях и строках); receiver'ов нет.
  init_side_effects: 'init() нет'
  dependency_direction: >-
    acrlevel не импортирует ничего; grpcsrv → acrlevel — ребро от транспорта к
    чистому пакету, обратного нет. Проба замыкания держит это транзитивно.
  one_table: >-
    `git grep 'case "3":' HEAD -- '*.go'` → одно попадание (acrlevel/acrlevel.go:36):
    второй таблицы ранжирования в модуле нет; в дереве нет ни одной ссылки на
    grpcsrv.ACRRank/ACRSatisfies, кроме упоминания снятого адреса в шапке acrlevel.
  doc_truthfulness: >-
    шапка acrlevel и новый абзац WHY HERE в grpcsrv/acr.go описывают код как есть;
    названные ими читатели без транспорта существуют у потребителей
    (kaname internal/apps/kaname/config/lane_requirements.go:458,485;
    kacho gateway/cmd/api-gateway/stepup_validation.go:45 — на origin/main).
  reuse: >-
    treehygiene.AuditImportConfinement судит заключение набора импортов по файлам
    индекса, а не транзитивное замыкание от пакета, так что обход в
    transport_test.go его не повторяет. Дубликата нет.

