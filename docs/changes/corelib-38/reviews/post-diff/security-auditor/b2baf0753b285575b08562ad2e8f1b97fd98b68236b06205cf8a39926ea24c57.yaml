      потребитель, опершийся на шапку («артефакт привязан к издателю»), получает привязку,
      которой нет, а проверка при старте судит значение, не меняющее ничего.
    proof: >-
      инъекция в копии вне дерева: Issuer-настройки движка заменены чужим значением → полный
