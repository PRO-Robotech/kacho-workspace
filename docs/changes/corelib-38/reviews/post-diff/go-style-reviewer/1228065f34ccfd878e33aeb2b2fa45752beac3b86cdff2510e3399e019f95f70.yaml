style:
  - id: S3
    at: oauthceremony/ceremony.go:392
    summary: >-
      Подсказка в отказе «write the address percent-encoded and in lower case» верна только для
      пути и схемы. Хост не-ASCII, записанный экранированно, проходит обратную запись
      (замер: "https://%D1%82%D0%B5%D1%81%D1%82.example/…" rt=true, Hostname "тест.example"),
      хотя для публикации клиентам хост пишется A-меткой (xn--…). Кроме того, «in lower case»
      при буквальном чтении предлагает понизить регистр пути, а путь к регистру чувствителен.
    requirement: >-
      назвать в подсказке, что к чему относится: путь — экранированно, хост не-ASCII — A-меткой,
      схема — в нижнем регистре.

