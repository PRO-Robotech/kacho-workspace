      шапку AuthorizationEndpoint/TokenEndpoint («выводятся из Issuer») переписать о том, что есть.
      Законная альтернатива — читатель издателя на пути церемонии, но это отдельный предмет
      со своей приёмкой, а не довод держать поле «на потом» (ban #11, ban #19).
    predicate: >-
      git grep -n -E 'cfg\.Issuer|Config\.Issuer' <head> -- oauthceremony/ ':!*_test.go' → 0
