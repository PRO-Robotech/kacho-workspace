      Потребителей пакета oauthceremony пока нет (kaname и kacho его не импортируют),
      поэтому снять поле сейчас дешевле всего; после kaname#358 это потребует смены пина.
    requirement: >-
      снять Config.Issuer тем же изменением, вместе с проверками (:333-334, :366-369),
      двумя настройками движка (:214-215), случаями Issuer в пробах (ceremony_test.go:594-595,
