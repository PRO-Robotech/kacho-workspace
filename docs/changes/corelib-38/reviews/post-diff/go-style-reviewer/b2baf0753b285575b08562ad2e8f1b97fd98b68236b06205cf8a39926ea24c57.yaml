critical:
  - id: C1
    tag: HOSTLESS-ENDPOINT-ACCEPTED
    at: oauthceremony/ceremony.go:381
    summary: >-
      validateEndpoint судит `endpoint.Host == ""`, а Host у адреса с портом без
      хоста непустой (":8443"). Адрес без хоста проходит проверку. Это
      противоречит шапке Config (ceremony.go:68, «абсолютным адресом с
      хостом»), тексту отказа «with a scheme and a host» и предикату 2 задачи
      #38. Проба New не содержит такого случая («без хоста» у неё только
      "https:///…").
    requirement: >-
      судить `endpoint.Hostname() == ""`; в TestNewRejectsAnEndpointThatIsNotAnAbsoluteAddress
      добавить негодную форму «порт без хоста» ("https://:8443/iam/v1/endpoint"),
      красную до правки.
    radius: >-
      механизм `Host == ""` в corelib вне internal/oauth2 —
      2 места (git grep -n 'Host == ""' -- '*.go' ':!internal/oauth2'):
      :381 (новое) и :192 (Issuer, в дифф не входит). Issuer "https://:8443"
      New тоже принимает (та же проба-оверлей). См. I1.

important:
  - id: I1
    tag: SAME-CLASS-ISSUER
    at: oauthceremony/ceremony.go:191
    summary: >-
      проверка Issuer на абсолютность осталась в New, а проверки адресов точек
      переехали в validateConfig. После снятия JoinPath переменная `issuer`
      нужна только этой проверке. Дыра у неё та же, что в C1. Выходит два
      места с одним предметом «абсолютный адрес с хостом», и расходятся они
      уже сейчас: у адресов точек отвергаются сведения пользователя, у
      издателя — нет.
    requirement: >-
      перенести проверку Issuer в validateConfig и судить хост через
      Hostname() тем же изменением; если сужение издателя (userinfo, запрос,
      фрагмент) считается отдельным предметом — завести его задачей.
  - id: I2
    tag: UNTRIMMED-VALUE
    at: oauthceremony/ceremony.go:370
    summary: >-
      пустоту судит TrimSpace, а в движок уходит необрезанное значение.
      "https://iam.example.net/iam/v1/token " принимается и становится
      TokenURL и адресом запроса с путём "/iam/v1/token%20" (проверено url.Parse
      в сторонней пробе), то есть адресом, которого служба не публикует.
    requirement: 'отвергать значение, не равное strings.TrimSpace(value), с называнием поля'

