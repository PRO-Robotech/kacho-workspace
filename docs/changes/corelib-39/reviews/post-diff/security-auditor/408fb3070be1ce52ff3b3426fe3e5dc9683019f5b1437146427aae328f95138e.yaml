decision:
  MaxAuthorizationCodeTTL:
    value: '60 секунд (не 10 мин)'
    basis:
      - >-
        продукт это уже решил: замысел LINE-A-1 (E9, полоса L0c — ровно предмет #39) называет
        потолок кода «не выше 60 секунд» и прямо пишет, что это «ограничение посадки, а не
        совет» (стр. 1751-1757, 3860, 4725-4726). Полоса взяла 10 мин и расхождения не назвала.
      - >-
        RFC 6749 §4.1.2 — «MUST expire shortly after it is issued», 10 минут — НАИБОЛЬШИЙ
        рекомендуемый срок, то есть верх рекомендации стандарта, а не решение продукта.
        RFC 9700 (BCP) этого не меняет. Потолок фундамента, равный верху стандарта, ничего
        не сужает.
      - >-
        законная жизнь кода — одно перенаправление и один обмен: код выпускается ПОСЛЕ того,
        как человек опознан и согласие получено (CompleteAuthorization), время человека в
        срок кода не входит. Секунды, узкая семантика берётся намеренно.
      - >-
        практика продукта: действующая посадка уже держит `auth_code: 1m`
        (values.prod.yaml:1955). Потолок 60 с не отвергает ничего из работающего; потолок
        10 мин допускает посадку в 10 раз шире работающей без единого потребителя такой ширины.
    note: >-
      не находка, для посадки: tokenpolicy.ClockSkew = 60 с. Если срок кода судит часы
      процесса, а обмен приходит на другую реплику, посадка РАВНО потолку не имеет запаса
      на объявленный допуск часов. Это доступность (отказ закрыт), а не безопасность;
      решается величиной посадки, не потолком.
  MaxRefreshTokenTTL:
    value: >-
      168 часов (7 суток), и это АБСОЛЮТНЫЙ потолок СЕМЕЙСТВА от первой выдачи, а не окно
      простоя 30 суток. Страж New судит Config.RefreshTokenLifespan по нему же (срок одного
      токена длиннее границы семейства смысла не имеет).
    basis:
      - >-
        продукт это уже решил: замысел LINE-A-1 (E9/L0c, стр. 1752-1767, 2594-2600, 3861,
        4470, 4725-4728) — «срок refresh-семейства не выше 168 часов», «потолок семейства
        АБСОЛЮТЕН, и держит его база, а не страж»; основание там же: 7 суток — верх окна,
        которое оператор переживёт без глагола досрочного завершения семейства. Тело #39
        тоже называет предметом «срок семейства токенов обновления».
      - >-
        потребитель константы требует абсолютной семантики: порог уборки строки семейства
        считается от created_at плюс этот потолок, и замысел прямо пишет, что формула верна
        ТОЛЬКО при абсолютном потолке (стр. 2733-2737); вставка преемника при обороте
        сжимается к created_at + потолок (инв. 41).
      - >-
        RFC 9700 §4.14.2: токены обновления публичного клиента — ротация либо привязка к
        отправителю; ротация ловит похитителя, только когда владелец сам предъявит
        обёрнутый токен. Против похитителя, который оборачивает семейство сам, окно простоя
        не держит ничего — держит только абсолютная граница.
      - >-
        соотношение с SecretCredentialTTLCeiling (90 сут), на которое опирается сама полоса,
        осмысленно только для абсолютной величины: 168 ч ≤ 90 сут.

findings:
  - id: F1
    severity: medium
    key: 'corelib:tokenpolicy/policy.go:refresh-ceiling-is-idle-not-family'
    at: tokenpolicy/policy.go:230-264; tokenpolicy/lifespan_ceiling_test.go:22-28
    sign: >-
      потолок токена обновления объявлен окном простоя одного токена (30 сут), а семейство
      потолком фундамента не ограничено. Движок на каждом обороте назначает преемнику срок
      «сейчас + срок из настроек» (flow_refresh.go:110-112). Сжимает его только граница
      гранта, если служба её назвала (translate.go:388-395); не назвала — семейство без
      границы. Существующая проба это и утверждает: у преемника срок = rotatedAt + срок из
      настроек (lifetime_test.go:88-89, прогон зелёный). При этом комментарий константы
      говорит обратное тому, что делает код: «всё окно срока похититель оборачивает
      семейство… Срок и есть это окно» и «не вправе жить дольше» секрета.
      Проба соотношения сравнивает окно простоя с абсолютным сроком и зелена при любой
      жизни семейства. Предмет задачи и замысла — срок СЕМЕЙСТВА, 168 ч; у полосы
      30 сут и другая семантика, расхождение не названо.
    failure_scenario: >-
      служба, прочитавшая константу, считает от неё порог уборки строки семейства
      (created_at + потолок + …) и сжатие преемника (инв. 41). Одна константа получает два
      смысла: фундамент говорит «окно простоя», потребитель — «абсолютный срок семейства».
      Служба, опершаяся на шапку фундамента и не назвавшая границу гранта, получает
      семейство, которое держатель, оборачивающий его чаще 30 суток, продлевает сам.
      Решённая граница (7 суток) не держится; окно простоя превышает решённое в 4,3 раза.
    proof: >-
      по коду: flow_refresh.go:110-112; translate.go:388-395; ceremony.go:559, 570-578
      (граница только из grant.ExpiresAt); lifetime_test.go:84-89 зелёная на голове.
      Решение: замысел ред. 14 стр. 1752, 1765-1767, 2735-2737.
    fix_direction: >-
      константа потолка СЕМЕЙСТВА = 168 ч, имя называет семейство. New судит
      RefreshTokenLifespan ≤ неё тем же отказом с именем поля и потолка. Комментарий говорит
      правду: страж New границы семейства не держит (движок продлевает на обороте), держатель
      назван — граница гранта (AuthorizationGrant.ExpiresAt[refresh]) и база службы (инв. 41).
      Утверждения «срок и есть это окно» и «не живёт дольше секрета» стоят только о
      величине, которую действительно сравнивают. Проба соотношения сравнивает потолок
      семейства с SecretCredentialTTLCeiling. Не требуется, но допустимо: CompleteAuthorization
      сама подставляет границу «выпуск + потолок», если служба её не назвала, и отвергает
      названную позже.
  - id: F2
    severity: medium
    key: 'corelib:tokenpolicy/policy.go:code-ceiling-diverges-from-decision'
    at: tokenpolicy/policy.go:208-228
    sign: >-
      потолок кода 10 мин. Решение продукта для этой полосы (E9/L0c) — 60 с, «ограничение
      посадки, а не совет». Комментарий называет источником решения стандарт, а не продукт;
      расхождение с решением нигде не названо.
    failure_scenario: >-
      посадка объявляет срок кода 10 мин — New собирает церемонию. Условие замысла
      («страж старта отказывает при значении выше потолка», стр. 3860-3863) не исполнено
      ни на одном значении из (60 с; 10 мин]. Окно, в котором перехваченный код годен к
      обмену, и срок хранения записи кода для различения повтора в 10 раз шире решённого
      и работающего (1m).
    proof: 'замысел ред. 14 стр. 1751-1757, 3860, 4725-4726; values.prod.yaml:1955; policy.go:228.'
    fix_direction: >-
      MaxAuthorizationCodeTTL = 60 с; комментарий называет решение продукта и RFC 6749
      §4.1.2 как верх, под которым оно лежит. Проба полосы (потолок + 1 нс / равно потолку)
      остаётся та же, от константы.

