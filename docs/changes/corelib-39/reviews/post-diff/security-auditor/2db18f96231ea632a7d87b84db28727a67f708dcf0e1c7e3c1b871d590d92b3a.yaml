findings:
  - id: F3
    severity: medium
    key: 'corelib:tokenpolicy/policy.go:code-record-retention-claimed-bounded-by-code-ttl'
    at: tokenpolicy/policy.go:221-225 (шапка MaxAuthorizationCodeTTL, внесена этим диффом)
    sign: >-
      комментарий утверждает, что срок кода «ограничивает запись кода … поэтому запись нужна, пока код
      не истёк», и «без потолка оба окна выбирает посадка». Код церемонии этого не делает: погашенный
      код узнаётся как повтор по записи НЕЗАВИСИМО от срока кода (bridge.go:236-237 → replayedCode,
      сверки срока нет; в движке повтор проверяется до ValidateAuthorizeCode), и повтор отзывает
      семейство. Запись нужна, пока живо семейство, которое повтор обязан отозвать, — это и решено
      замыслом (§4.4а: строка кода — дочерняя строке семейства, порог уборки от created_at + потолок
      семейства + MaxTokenTTL + ClockSkew + RemovalSlack; «копия разошлась бы … в опасную сторону —
      снимает строку, которая ещё держит различение reuse»). Класс hard-misleading-security-comment.
    failure_scenario: >-
      исполнитель уборки строк кода в службе берёт границу хранения из шапки константы фундамента
      (MaxAuthorizationCodeTTL + допуски). Гейт порога обходом реестра такую запись пропускает: она —
      выражение из констант, а не выписанная длительность. Законный клиент, предъявивший уже
      погашенный перехватчиком код позже срока кода, получает invalid_grant, а семейство перехватчика
      остаётся живым до своего потолка — вместо отзыва (оба исхода измерены пробами выше).
    proof: >-
      bridge.go:224-265; flow_authorize_code_token.go:31-60; две overlay-пробы (probe_expired_replay,
      probe_swept_twin); замысел ред. 14 стр. 2712-2746.
    fix_direction: >-
      шапка говорит правду: срок кода — окно годности перехваченного кода к обмену; запись погашенного
      кода читается на повторе и после срока кода и потому хранится, пока может жить семейство, —
      её порог считается от MaxRefreshTokenFamilyTTL (§4.4а), а не от этой константы. Слова «оба окна»
      снять. Закрепить пробой: погашенный код, предъявленный после истечения своего срока, отзывает
      семейство (близнец — TestSequentialCodeReplayRevokesTheFamily в пределах срока).

