        (flow_authorize_code_token.go:97, 101) и у гибридного потока, которого
        церемония не собирает. Замер (experiments.code_expiry_rounding) —
        у записанного срока доля секунды есть. Исход пробы от этого не зависит:
        предпосылка requireCodePastItsLifespan судит записанный срок сама.
      requirement: 'довод запаса назвать верно (запас на планирование и миг сравнения, округления нет) либо снять. Не блокирует.'
