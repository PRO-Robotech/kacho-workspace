findings:
  critical:
    - id: C-1
      class: security-comment-contradicts-code
      where: tokenpolicy/policy.go:197-198
      summary: >-
        Заголовок нового раздела называет MaxTokenTTL потолком срока токена
        доступа и противопоставляет ему «два других артефакта церемонии». Для
        церемонии это неверно: validateConfig судит AccessTokenLifespan только на
        положительность (ceremony.go:319), значения выше MaxTokenTTL New
        принимает (фикстура ceremony_test.go:48). MaxTokenTTL по собственному
        комментарию (policy.go:143-145) — слагаемое арифметики снятия ключа для
        подписанных токенов, а токен доступа церемонии — HMAC (ceremony.go:237).
        Читатель раздела выносит, что все три срока церемонии под потолком.
      requirement: >-
        Привести фразу и код к одному. Либо (а) validateConfig судит
        AccessTokenLifespan названным потолком фундамента тем же отказом
        ErrCeremonyMisuse с именем поля и потолка, проба «потолок + 1 нс» с
        близнецом «равно потолку», фикстуры newTestCeremony и соседние
        (ceremony_test.go:48/570/634, engineconfig_internal_test.go:185) — под
        потолок; либо (б) фраза говорит правду: MaxTokenTTL ограничивает токены,
        подписанные ключами набора, а срок токена доступа церемонии потолком
        фундамента не судится — и решение об этом заводится задачей с
        предикатом снятия, не маркером в коде. Довод раздела («страж, требующий
        срок НАЗВАТЬ, на любом значении зелен») относится к третьему сроку
        дословно — это довод за (а); выбор — за автором и диспетчером.
