ceiling_values_decision:
  MaxAuthorizationCodeTTL:
    decision: 'принять 10 мин'
    basis: >-
      RFC 6749 §4.1.2: код «MUST expire shortly after it is issued», наибольший
      рекомендуемый срок — 10 минут; RFC 9700 (Security BCP) этого не меняет.
      Потолок на верхней границе стандарта, равное потолку допускается —
      «maximum» включителен. Жёстче стандарта потолок был бы решением без
      основания; служба вправе назвать меньше (практика — от одной до десяти
      минут). Умолчание движка (15 мин) выше стандарта и не действует: New
      требует срок явно.
  MaxRefreshTokenTTL:
    decision: 'принять 30 сут как потолок окна простоя'
    basis: >-
      RFC 6749 срока токена обновления не задаёт. RFC 9700 §4.14.2: токен
      обновления публичного клиента обязан быть привязан к отправителю либо
      оборачиваться, и «SHOULD expire if the client has been inactive for some
      time», величина — на усмотрение сервера авторизации. Потолок ровно это
      окно бездействия: срок каждого токена от выпуска, оборот его обновляет.
      Практика — от двух недель до трёх месяцев бездействия; при токене без
      привязки к ключу выбран консервативный край, и соотношение с потолком
      секрета (90 сут) держит проба. Абсолютный срок семейства фундаментом не
      ограничен — его называет служба границей гранта (только сокращает); это
      предмет потребителя (PRO-Robotech/kaname#318), не #39. Текст #39 говорит
      о «сроке семейства», константа — о простое; дифф называет различие прямо
      (policy.go:232-238), расхождения с кодом нет.

