    база, а не страж» (1765-1767). Код: MaxAuthorizationCodeTTL = 60 * time.Second
    (policy.go:236), MaxRefreshTokenFamilyTTL = 168 * time.Hour (policy.go:279),
    MaxTokenTTL = 30 * time.Minute не переопределён (policy.go:146); New отвергает
    каждый из трёх сроков выше потолка текстом с именем поля и потолка
    (ceremony.go:342-357); комментарии прямо говорят, что предел семейства New не
    держит, держат граница гранта и база службы (ceremony.go:100-103, policy.go:245-258).
    Соответствие решению полное.

