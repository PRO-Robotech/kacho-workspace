checked:
  - предмет: секреты стенда notify (Д123)
    итог: держится — четыре объекта заводятся однажды, отказ сервера, отличный от NotFound, — отказ посева, а не перечеканка; величины идут подстановкой процесса и не печатаются; ключ сетки объектом стенда исключает ключ значением (оба — отказ рендера), длину судит страж старта (Д89)
  - предмет: ключ DKIM
    итог: держится — пара выпускается только при отсутствии объекта, закрытый ключ во временном каталоге mktemp -d, снимается после разбора и ловушкой EXIT; сервер зоны закрытого ключа не монтирует; чтение пары из одного поколения тома, тексты отказов фиксированы, ошибка разборщика отбрасывается; RSA ≥ 2048
  - предмет: зона DNS стенда
    итог: держится — включение зоны требует узла почты, равного приёмнику ЭТОГО релиза, дважды (рендер notify.standDNS и страж процесса validateStandDNS); подсаженная зона не может сопровождать отправку на внешний узел; сервер зоны без токена учётки, non-root, RO ФС, добавлена ровно NET_BIND_SERVICE
  - предмет: флаг установки
    итог: держится — одно тело помощника, незаданное и не-булево — отказ с именем ручки; собственный ключ подчарта — отказ стража зонтика
