# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 16 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 14
# (ea14efcf…, запись revalidation/ea14efcf….yaml, коммит bb98fdadc, итог «к замыслу»: CX1-77,
# CX1-78 к замыслу, CX1-79, CX1-80 к коду). На редакцию 15 (82486131…) пересверки нет, поэтому
# дельта — обе редакции: коммиты d253e4897 (ред. 15, отображение CX1-77…80) и bb0923aa1 (ред. 16,
# Д45, Д46). Пункты CX1-01…76 и условия УК1…УК94 эта запись не пересуживает.
#
# Судятся: строки §11 CX1-77…80 (отображение), строки §11 «Д45», «Д46» и §13 Е12, Е13 (новые
# решения — разбираются на классы заново, §7 агента), правки З20, З26, З28, §8, §0 М35, полосы N1,
# N6, N13, D1, D2 tasks.md.
#
# Итог — к замыслу. CX1-77…80 отображены, и отображение выдерживает условия пунктов (CX1-78 (б) —
# с оговоркой N1). Д45 и Д46 по существу отображены: `required` на рендере, пробы с близнецами и
# инъекциями, посадка узла `fe3455`, порядок Е13. Но стык Д45 оставляет NTF-1 без трёх остальных
# полей узла, а NTF-2 стартует только после посадки NTF-1 (NTF-2 Р16 п.1). Это якорь проверки,
# отправитель и удостоверение. Довод, которым сам замысел забирает себе строку `connectionURI`
# («без неё собственные I03, L01 и D6 невыполнимы»), так же верен для якоря: I03 требует «сертификат
# проверен» на сертификате УЦ стенда, а у процесса notify нет ни ручки якоря, ни строки чарта
# (CX1-81). Семантика «секрета почты» (З28, посадка G15, I01, N02, N04) расходится с законным по
# Д45 положением «ни имени, ни удостоверения — сессия без AUTH» (CX1-82). Значения флага по цепочкам
# не названы, хотя Д46 на них опирается (CX1-83). CX1-84 — к коду. Возврата в приёмку нет, но CX1-81
# и CX1-82 называют условие, при котором он наступит.
