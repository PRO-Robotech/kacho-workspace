items:
  - id: CX1-81
    status: unmapped
    decision: "Д45 и стык З20: NTF-1 производит только строку `connectionURI` и пару; якорь (`trustAnchorSecret`), отправитель (`fromAddress`, `fromName`) и ссылку на удостоверение (`credentialSecret`) читает NTF-2"
    class: "code-authoring §«Решение и его следствие разнесены» (решение о посадке в NTF-1, следствие — в полосе, стартующей после неё); §«Контракт, который нельзя выразить» (величина процесса без ручки); api-accepted-ignored (поле узла без читателя)"
    finding: >-
      (1) Замысел берёт строку `connectionURI` себе доводом «без неё собственные I03, L01 и D6
      невыполнимы, а NTF-2 стартует после посадки NTF-1». Тот же довод верен для якоря. I03 требует
      «сертификат проверен» у приёмника с сертификатом УЦ стенда, а в корневых хранилищах образа
      этого якоря нет (`values.dev.yaml` @1d42a67, комментарий у `kratos.deployment`). У процесса
      notify нет ни ручки якоря (§8: строки удостоверения, якоря и отправителя нет), ни строки чарта,
      которая его доставит. NTF-2 называет себя читателем якоря (Р20; NTF2-24: «якорь из узла
      (NTF-2)») и стартует после NTF-1 (Р16 п.1). К посадке NTF-1 I03 и L01 красные по построению:
      проверка сертификата отвергает приёмник, строка уходит в `DEFER`. D6 поднимается, но письма
      не доходят. То же для отправителя: у письма NTF-1 нет источника `From`.
      (2) Удостоверение. Д45 делает NTF-1 производителем проверки пары «в обе стороны», но
      величина «удостоверение задано» у процесса не объявлена: нет имени переменной, нет формы
      (переменная `secretKeyRef` или файл), не сказано, чем «пусто» отличается от «не задано».
      У цепочки `a8f60d` в адресе имя пользователя, удостоверение — `credentialSecret`
      (`values.a8f60d.yaml:120–125` @1d42a67). Если в `a8f60d` notify рендерится до посадки NTF-2,
      страж пары отказывает в старте.
      (3) База. NTF-1 садится на kacho `origin/main` @1d42a67 (change.yaml). Поля `trustAnchorSecret`
      там нет вовсе: `git grep -c trustAnchorSecret 1d42a6728bf -- deploy/helm/umbrella/` → 0
      файлов. На базе NTF-2 (@96e2fa72b3a) его читают чарт kaname и страж. Д46 и D2 велят записать
      в `values.fe3455.yaml` узел «в форме узла `values.dev.yaml` (… якорь — `ca.crt` секрета
      приёмника)», и NTF-2 Р16 п.6 проверяет в `fe3455` якорь = `ca.crt`. На базе NTF-1 у такого
      поля в шаблонах читателя нет: `TestDeclaredKnobHasAReader` краснеет на ключе профиля без
      читателя, а без поля форма узла не та, которую ждёт NTF-2.
    condition_to_design: >-
      (а) §8 и З20 объявляют ручки процесса для удостоверения, якоря и отправителя: имя переменной,
      форма (удостоверение — переменная `secretKeyRef`; якорь — путь к файлу смонтированного ключа),
      граница и отказ. «Удостоверение не задано» — отсутствие переменной, пустая строка — отказ с
      именем поля. Это третий исход, а не синоним отсутствия. Строка пары §11 «Д45» утверждает эту
      форму.
      (б) Производитель строк чарта «`trustAnchorSecret` → якорь процесса», «`fromAddress`,
      `fromName` → отправитель», «`credentialSecret` → переменная удостоверения» к посадке NTF-1
      назван явно. Исходов два. Либо NTF-1 — довод тот же, что у `connectionURI`; тогда это решение
      диспетчера, расширяющее Д45 (заказ). Либо NTF-2 — тогда замысел пишет, что I03, L01 и D6
      исполнимы только после NTF-2, и это расходится с порядком NTF-2 Р16 п.1 и с DoD 15 приёмки
      NTF-1. Такой исход — возврат I03 и L01 в приёмку, а не правка замысла.
      (в) Форма узла `fe3455` в D2 названа для базы NTF-1 (@1d42a67): набор полей, у каждого есть
      читатель в шаблоне на этой базе. Если у поля якоря читатель появляется только с чартом notify
      по (б), D2 зависит от этой строки. Замер М35 и строка «Стенд» З28 называют ревизию, на которой
      узел `values.dev.yaml` несёт якорь.
    held_by: >-
      I03, L01 — есть в приёмке; проба рендера D1 «узел → переменные якоря, отправителя, удостоверения»
      — нужна, её нет (заказ); `TestDeclaredKnobHasAReader` на `values.fe3455.yaml` после D2 — есть в
      дереве
  - id: CX1-82
    status: unmapped
    decision: "«секрет почты»: З28 «рендер notify и секрета почты — при непустом перечне», З20 «Посадка (NTF1-G15) … секрет почты смонтирован», при законном по Д45 положении «ни имени, ни удостоверения — сессия без AUTH»"
    class: "code-authoring §«Умолчание, которое становится утверждением» (обязательная ось посадки против законного отсутствия); §«Контракт, который нельзя выразить» (секрет рендера против ссылки на внешний объект — два написания одного удостоверения)"
    finding: >-
      Редакции 15 и 16 вводят законное положение «узел без имени и без удостоверения (приёмник
      стенда) — сессия без `AUTH`». NTF-2 Р20 добавляет к нему: «ссылки на секрет почты у чарта
      `notify` нет». Это узел цепочек `dev`, `dev-prod`, `own`, `prorobotech` и `fe3455` после D2.
      Но в замысле остаются три прежних утверждения:
      (1) «Рендер notify и секрета почты — при непустом перечне» (З28). Секрет почты подан объектом
      рендера, хотя по Р20 это ссылка `credentialSecret` на внешний объект
      (`kaname-mail-credential` в `a8f60d`). Из каких значений рендерился бы собственный секрет, не
      сказано.
      (2) Строка «Посадка» З20 ставит «секрет почты смонтирован» осью стража старта, по приёмке —
      NTF1-G15 «секрет почты не смонтирован → отказ с именем оси». На `dev-prod` (I03, L01, D6) узел
      без имени: секрета нет, и страж по оси G15 отказывает. Если же ссылка рендерится всегда, под
      ней нет объекта, и под не стартует до стража.
      (3) Гейт раскладки D1 (CX1-80) утверждает «перечень ключей секрета почты = {ключ
      удостоверения}». По рендеру это исполнимо только для объекта рендера; у внешнего объекта
      рендер видит лишь `secretKeyRef.key`.
      Приёмка допускает прочтение, совместимое с Д45: G15 с узлом, несущим имя; фикстуры N02 и N04
      с `credentialSecret`; I01 «ровно notify (там, где он рендерится)» как «не больше notify». Но
      замысел этого прочтения не пишет.
    condition_to_design: >-
      (а) З28: чарт notify объекта секрета почты не рендерит. Удостоверение — ссылка на объект,
      названный `credentialSecret`. Ссылка рендерится ровно при непустом `credentialSecret`, а
      выбор производителя строки — по CX1-81 (б).
      (б) Ось G15 «секрет почты» в З20 названа как половина пары: адрес с именем, удостоверения нет.
      Отказ с именем оси — та же ветка стража, что у пары Д45, а не отдельная безусловная ось.
      Близнец — узел без имени и без удостоверения стартует (строка Д45 его уже несёт).
      (в) Гейт раскладки D1 утверждает по рендеру: ключ `secretKeyRef` удостоверения равен
      `credentialSecret.key`; объектов `Secret` с данными почты в рендере notify 0; переменной
      адреса или URI из секрета нет. Вместо «перечня ключей секрета».
      (г) Прочтение I01, N02, N04 и G15 под Д45 записано строкой §11 со ссылкой на сценарии. Если
      прочтение не держится (например, I01 требует ссылки notify на секрет в каждой цепочке, где
      notify рендерится), это возврат I01 и G15 в приёмку, а не правка замысла.
    held_by: "G15 (после (б)) — есть; I01 — есть; гейт раскладки D1 — после правки по (в)"
  - id: CX1-83
    status: unmapped
    decision: "Д46: «пока выведенный перечень `prod` пуст, notify там не рендерится и отказа нет»; D2 — рендер `fe3455` даёт ключ адреса"
    class: "measurement-discipline §«Живость предмета» / утверждение о дереве без замера; code-authoring §«Решение и его следствие разнесены» (значение флага решает, сработает ли `required`, и не записано)"
    finding: >-
      NTF1-N01: цепочка без `global.kacho.notifications.enabled` — отказ рендера. Значит, после D2
      каждая из 7 цепочек `deploy/stacks.txt` обязана нести значение флага. Замысел нигде не
      называет значения по цепочкам. Пути D2 не включают ни одного файла значений, кроме
      `values.fe3455.yaml`; пути D1 — только `deploy/helm/notify/**`. Из этого следуют три вещи.
      (1) Утверждение «перечень `prod` пуст» ни на что не опирается. Если флаг `prod` — `true`, а
      `notify-probe` в таблице подключаемых, перечень непуст, и `required` отвергает рендер `prod`.
      Тогда каждый гейт обхода `deploy/stacks.txt`, рендерящий `prod`, краснеет в полосе NTF-1, а не
      у NTF-2. NTF-2 ред. 20 (строка 8 таблицы расхождений) описывает `prod` именно так: «пустой
      узел при флаге `true` — отказ рендера».
      (2) `fe3455` накладывается поверх `values.prod.yaml`. Чтобы notify там рендерился (проба D2),
      у `fe3455` перечень обязан быть непустым при пустом перечне `prod`. Этим файлом значений флаг
      не назван.
      (3) Е12 (4) адресует «полоса, делающая перечень `prod` непустым» только NTF-2 (источник
      kaname). Таблицу подключаемых расширяет и NTF-3 (модули kacho), а его замысел о флагах в
      `values.prod.yaml` не говорит.
    condition_to_design: >-
      (а) З28 несёт таблицу «цепочка → глобальный флаг и переопределения → выведенный перечень после
      D2» для всех 7 цепочек, с файлом, где стоит каждое значение. Файлы входят в пути полосы (D2),
      разделённые пути названы в Е13.
      (б) Для `prod` выбран один исход, с доводом. Первый: флаг `false`, и `required` в дереве не
      срабатывает, его держит только фикстура D1. Второй: флаг `true`, и тогда в той же полосе гейты
      обхода рендерят `prod` со слоем узла оператора либо утверждают отказ с именем узла. Молча
      пропустить цепочку нельзя.
      (в) Е12 (4) называет адресатами NTF-2 и NTF-3: любую полосу, расширяющую таблицу подключаемых
      источником, флаг которого включён в `prod`.
    held_by: "NTF1-N01 (перепись с числом цепочек) — есть; перепись «цепочка → перечень» по `deploy/stacks.txt` — нужна, её нет (заказ D2)"

conditions_to_code:
  - id: CX1-84
    decision: "имя пользователя в адресе читает `AUTH`; пара в обе стороны (Д45)"
    class: "code-authoring §«Контракт, который нельзя выразить» — два написания одного значения; отсутствие, представимое отдельно от пустого"
    condition: >-
      Имя для `AUTH` — раскодированное значение userinfo, а не его запись: у цепочки `a8f60d` имя
      записано с `%40` (`values.a8f60d.yaml:120` @1d42a67). «Имя присутствует» у пары судится по
      раскодированному непустому имени. Адрес с пустым userinfo (`smtp://@h:587/`) — отказ с именем
      поля, а не «имени нет». Проба N13 `TestRelayURIParseIsClosed` несёт вариант с `%40`:
      `AUTH` получает имя с `@`. Инъекция — имя берётся без раскодирования → красная.
    held_by: "проба N13 (вариант дописывается к `TestRelayURIParseIsClosed` — заказ автору маршрута)"

notes:
  - id: N1
    blocking: false
    where: "tasks.md D1, «`TestDeclaredKnobHasAReader` — у ключа узла в значениях чарта читатель в шаблоне»; §11 CX1-78"
    text: >-
      Держатель верен по оси (values → шаблон), но о notify не говорит. У
      `global.kacho.identity.smtp.connectionURI` на базе уже есть читатель в шаблоне родителя —
      `deploy/helm/umbrella/templates/identity-mail-lane-guard.yaml` (11 упоминаний @1d42a67). Гейт
      зелен и без строки notify. «Читатель — шаблон ConfigMap notify» держит проба рендера D1
      («ключ равен адресу», инъекция «ключ из пути вне узла»); строке D1 стоит так и написать
  - id: N2
    blocking: false
    where: "tasks.md D2, перепись «стендовая цепочка без узла»"
    text: >-
      Исключение `prod` задано именем цепочки. Новая цепочка оператора без узла будет считаться
      стендовой и покраснеет, а это верный исход только при осознанном решении. Строке стоит
      назвать, что исключение — ровно `prod`, и что добавление цепочки правит перепись тем же
      изменением

