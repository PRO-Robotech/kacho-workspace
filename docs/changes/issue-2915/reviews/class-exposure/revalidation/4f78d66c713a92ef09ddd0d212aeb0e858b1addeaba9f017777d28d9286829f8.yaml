# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 42, маршрут редакции 43.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта редакции 42 против последней пересверенной
# (редакция 41, faf921d9…, запись revalidation/faf921d9….yaml: «к замыслу», CX1-127, CX1-128, N41-1…N41-3).
# Задание называло прошлой dfac7c9c…, но на отпечаток faf921d9… пересверка уже есть, и шапка редакции 42
# сама на неё ссылается. Поэтому дельта меряется от faf921d9…, а dfac7c9c… (R40-*) — через неё.
# Предмет дельты — шапка редакции 42, строки §11 Д96…Д98 и §12а «Объём Основы и режим Д97». Ранее
# чистое не переоткрывается.
#
# Итог — к замыслу. Дельта вводит новый внешний вызов (DNS), новый асинхронный путь (перепроверка) и
# новый страж старта с закрытым отказом. По §4 правила контура каждый из них — новый пункт перечня.
# Новых пунктов пять:
#   CX1-129 — у закрытого отказа по DNS нет переписи профилей. Профиль a8f60d шлёт настоящую почту через
#             внешний ретранслятор с доменом prorobotech.ru, а TXT этого домена 2026-10-03 не содержит
#             ни SPF, ни DMARC. Если посеять туда зону стенда, страж станет обходом. Если не сеять,
#             notify не стартует;
#   CX1-130 — dnsConfig пода перенаправляет ВСЕ запросы имён notify, а не только проверки;
#   CX1-131 — не назван порядок стража в runServe относительно поверхности диагностики. Liveness
#             (~50 с) короче поставляемого срока 2 мин. Процессные пробы и integration-старты
#             теряют резолвер;
#   CX1-132 — механизм взят ссылкой на З14/З15 замысла NTF-4 без отпечатка. NTF-4 будет правиться,
#             а у этой ссылки нет обесценивания;
#   CX1-133 — текст отказа на разборе ключа DKIM может нести байты ключа. Это тот же класс, что CX1-125.
# R41-1 (CX1-127) и R41-2 (CX1-128) редакцией 42 не исполнены, и §12а «Открытое» говорит об этом сам.
