new_items:
  - id: CX1-129
    decision: "Р19/§12а: закрытый отказ старта по DKIM/SPF/DMARC домена From. «Стенд: зона DNS и ключевая пара — посевом подъёма стенда, dnsConfig пода notify — только в профиле стенда»; держатель NTF1-P12 судит values.prod.yaml; D10 — «helm install в боевой посадке доходит до готовности (DoD 22)»"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением»: страж, которого удовлетворяет
      собственный посев, на профиле с настоящей почтой ничего не утверждает. §«Решение и его
      следствие разнесены»: отказ заводится в одном месте, а его следствие ложится на каждый профиль,
      где рендерится notify. measurement-discipline §«Радиус: по имени механизма и по точкам применения»
    exposure: >-
      Измерено @910ccddeadc. deploy/stacks.txt — 7 профилей. Узел почты по файлам values: dev и
      own-stand используют приёмник стенда (smtp://…-mailpit:1025, fromAddress noreply@kacho.cloud);
      prorobotech наследует dev; prod, fe3455 узла в профиле не несут (fe3455 — по Д46/Е13 после D2);
      a8f60d (values.a8f60d.yaml:119-120) — внешний ретранслятор smtps:465 и fromAddress
      info@prorobotech.ru, по Д47 (:4557) notify там с secretKeyRef. Публичный DNS 2026-10-03 с хоста
      анализа: dig TXT prorobotech.ru → NOERROR, ответ пуст (v=spf1 нет); dig TXT _dmarc.prorobotech.ru →
      пусто. Контроль — dig TXT example.com отдаёт "v=spf1 -all". Значит, после S6 и D2 у a8f60d два
      исхода, и оба плохие. (1) Профиль считается «стендом» и получает посев зоны и dnsConfig: проверки
      проходят на зоне, которой у получателей нет, письма уходят без проходящей подписи. Это ровно тот
      обход, который Р19 «Резолвер» запрещает. (2) Профиль не получает посев: notify отказывает в
      старте по spf и dmarc. Сейчас это никто не видит: P12 судит только values.prod.yaml, а понятия
      «профиль стенда» нет ни в замысле, ни в приёмке. D10 требует «helm install в боевой посадке
      доходит до готовности», но в боевой посадке dnsConfig нет (P12), а зоны домена From у кластера CI
      нет. Предикат полосы невыполним в той же точке, что R20-2 (б)
    condition_on_code: >-
      (а) Замысел (§12а или З28) несёт перепись профилей stacks.txt. По каждой строке: приёмник
      (приёмник стенда или внешний ретранслятор), источник зоны (посев стенда + dnsConfig или публичный
      DNS), исход стража. Предикат переписи печатает число профилей (7 @910ccddeadc).
      (б) dnsConfig и посев зоны допустимы только на профиле, чей узел почты — приёмник стенда.
      Держатель P12 судит это на каждом профиле, а не только values.prod.yaml: «dnsConfig есть ⇔
      connectionURI указывает на приёмник стенда». Инъекция — dnsConfig в values.a8f60d.yaml → красный
      с именем профиля. Близнец — dnsConfig в values.dev.yaml → зелёный.
      (в) Для профиля с внешним ретранслятором (a8f60d) выбран и записан исход: опубликованные записи
      DKIM/SPF/DMARC домена From с ключом, равным ключу объекта секрета, как условие старта D2/S6 на
      этом профиле, либо смена fromAddress, либо исключение профиля из рендера notify. Выбор за
      владельцем стенда, вопрос — в «вопросах владельцу».
      (г) Предикат D10 «helm install в боевой посадке до готовности» переписывается вслед за исправлением
      R20-2 (б) в приёмке, а не до него
    held_by: "Держатель P12 в расширенной форме (б) с инъекцией на a8f60d. Гейта нет. Исход (в) держится решением владельца и предикатом старта D2 на a8f60d"
  - id: CX1-130
    decision: "§12а/Р19: стенд направляет DNS пода notify на сервер своей зоны через dnsConfig пода"
    class: >-
      code-authoring §«Решение и его следствие разнесены»: настройка резолвера пода нужна для одной
      зоны, но действует на все имена процесса
    exposure: >-
      Это семантика пода, не замер дерева. При dnsPolicy None список nameservers из dnsConfig заменяет
      DNS кластера целиком. Тогда имена базы notify, kaname, приёмника стенда и источников (…svc.cluster.local)
      резолвит сервер зоны стенда, и при отсутствии пересылки они не резолвятся. При ClusterFirst сервер
      из dnsConfig дописывается после DNS кластера: DNS кластера отвечает первым и отдаёт публичный
      ответ (или NXDOMAIN) по домену From, и посеянная зона не читается. Замысел не называет ни
      dnsPolicy, ни пересылку
    condition_on_code: >-
      (а) Замысел называет форму: dnsPolicy None + сервер зоны стенда авторитетен для домена From и
      пересылает остальное на DNS кластера (адрес и search-домены кластера в dnsConfig), либо иная форма
      с тем же исходом. (б) Сквозная проба стенда (P01, D5) утверждает обе стороны: notify готов — база
      и kaname достигнуты по именам кластера — и признак notify_mail_dns_posture{check} = 1 по всем трём
      проверкам. Инъекция «пересылка снята» → notify не готов, с именем базы или пира
    held_by: "Проба стенда P01 с инъекцией (б). Гейта нет"
  - id: CX1-131
    decision: "Р19/NTF-4 З14: повтор до KACHO_NOTIFY_DNS_BOOT_DEADLINE (поставляется 2 мин), до прохождения /readyz «не готов», затем отказ старта; резолвер — порт конструктора"
    class: >-
      code-authoring §«Порядок операций внутри кода»: место стража в последовательности подъёма не
      названо. §«Умолчание, которое становится утверждением»: порт резолвера при nil
    exposure: >-
      Измерено @910ccddeadc. serve.go:20-21: «Каждая ошибка возвращается наверх и останавливает процесс ДО
      подъёма поверхности», и это сегодняшняя форма runServe. Если страж DNS встанет в этот ряд
      (до диагностики), /healthz не отвечает всё время ожидания. livenessProbe чарта
      (deployment.yaml:146-151): initialDelay 5 с, period 15 с, failureThreshold по умолчанию 3, то есть
      около 50 с до перезапуска. Это меньше поставляемых 2 мин: kubelet перезапускает под раньше, чем
      страж назовёт проверку, и получается цикл перезапусков без отказа с именем. boot_test.go: два запуска
      бинаря `serve` через fixtureEnv. Положительный (:140) утверждает, что посадка доходит до шага
      «пул базы kacho_notify». В подпроцесс порт резолвера не передать, остаётся резолвер хоста. Новые
      обязательные ручки и ключ DKIM без строк в fixtureEnv заставят процесс отказать раньше, по чужой
      причине. По R20-2 то же следствие у каждого integration-старта notify (G, H, K01–K03, L03–L05)
    condition_on_code: >-
      (а) Замысел называет порядок runServe: загрузчик (ручки, ключ, селектор) → дескриптор посадки →
      пул → поверхность диагностики → страж DNS как компонент /readyz → по истечении срока выход с именем
      проверки. Если выбран иной порядок, liveness-бюджет чарта ≥ верхней границы срока (10 мин), и это
      утверждает проба рендера. (б) Конструктор стража требует ненулевой резолвер. nil — отказ
      конструктора, подстановки net.DefaultResolver внутри пакета нет. Корень передаёт
      net.DefaultResolver явно. (в) fixtureEnv процессных проб получает две ручки и ключ, положительный
      близнец сохраняет утверждение «дошёл до шага базы». Если страж стоит до пула, форма пробы
      называется заново. (г) Средство integration-проб — один помощник «резолвер на зону испытания»,
      им пользуется каждый старт notify. Перепись стартов печатается в сдаче N14
    held_by: "Проба N14 порядка подъёма (инъекция: страж перенесён до поверхности → /healthz молчит дольше бюджета → красная); процессные пробы boot_test.go. Гейта нет"
  - id: CX1-132
    decision: "§12а: «Механизм — замысел NTF-4 issue-2919/design.md З14 и З15 в части, которую называет Р19; второго описания здесь не заводится. Отличия NTF-1 — и только они: …»"
    class: >-
      code-authoring §«Контракт, который нельзя выразить» и doc-truthfulness «два места об одном
      предмете». Механизм NTF-1 лежит в чужом документе без отпечатка, и правка того документа не
      обесценивает ни эту пересверку, ни DESIGN_APPROVED NTF-1 (.claude/rules/change-graph.md §4)
    exposure: >-
      Измерено. grep -c df1ce64d design.md tasks.md → 0, 0: ссылка идёт по имени раздела без отпечатка.
      Приёмка NTF-4 в рабочем дереве уже другая (78603409… ≠ change.yaml NTF-4 01b28881…): сценарии 40…52
      и ручки сняты, значит замысел NTF-4 будут править, и З14/З15 изменятся. Перечень отличий §12а
      закрыт не до конца. З14 несёт ещё «Проверка dkim при перечитывании секрета почты — та же функция
      (З4)», «dns_posture = OR (Р12)», «внедрённые часы (З23)», «queryTimeout — постоянная (§8)». Это
      разделы NTF-4, и §12а их не упоминает. Не сказано, перечитывает ли notify NTF-1 секрет почты.
      Если нет, смена ключа DKIM в объекте до процесса не доходит. Объект внешний, аннотации от его
      содержимого у чарта нет (checksum/ в З28 есть только у recipient-key и config). Перепроверка тогда
      сравнивает DNS со старым ключом в памяти
    condition_on_code: >-
      (а) Ссылка на NTF-4 закрепляется отпечатком (df1ce64d… + имена разделов), либо текст З14/З15 в части
      Р19 переносится в этот замысел. Полосы N14/N15 — NTF-1, механизм принадлежит ему. Правка NTF-4
      после закрепления механизм NTF-1 не меняет. (б) Перечень отличий закрывается строками для каждой
      ссылки З14/З15 на раздел NTF-4: З4 (перечитывание секрета), З23 (источник часов в NTF-1), §8 (дом
      постоянной queryTimeout), Р12 (оси нет, уже сказано). (в) Явно названо, как смена ключа DKIM
      доходит до процесса в NTF-1: перезапуск с названным механизмом (кто и чем перекатывает) либо
      перечитывание. Названо и что видит перепроверка в окне между сменой записи DNS и перезапуском
    held_by: "Вниманием автора и design-reviewer. Гейта нет и не будет: сверка ссылок между замыслами — по отпечатку в тексте"
  - id: CX1-133
    decision: "§12а: загрузчик (З20) отказывает в старте на нечитаемом ключе, RSA короче 2048 бит или пустом селекторе; Р19 «отказ … без содержимого ключа»"
    class: >-
      security-hardening hard-no-err-echo; code-authoring §«Чужой ответ: классификация и бюджет».
      Повторение класса CX1-125 (текст отказа ParseConfig нёс хвост пароля DSN): второе независимое
      место, отказ разборщика с секретом на входе
    exposure: >-
      Замысел не говорит, оборачивается ли ошибка разборщика ключа (PEM/PKCS#1/PKCS#8) в текст отказа.
      Текст чужого разборщика не наш контракт, и его содержимое от входа не гарантировано
    condition_on_code: >-
      (а) Отказы загрузки ключа — фиксированные тексты с именем ключа объекта и причиной (не читается /
      не RSA / короче 2048 бит / пустой селектор). Ошибка разборщика не идёт в текст через %w или %v и не
      пишется в журнал. (б) Инъекция: в фикстуре повреждённый ключ с байтами-маркером → текст отказа и
      журнал маркера не содержат. Близнец — исправный ключ 2048 бит, процесс проходит загрузчик.
      (в) Отрицательные сценарии RSA < 2048, нет ключа, нет селектора (non_blocking записи 5abe2336)
      входят в пробы N14
    held_by: "Проба загрузчика N14 с инъекцией (б). Гейта нет. Однофайловый признак есть: fmt.Errorf(…%w…) в ветке разбора ключа — кандидат после второго вхождения в дереве"

