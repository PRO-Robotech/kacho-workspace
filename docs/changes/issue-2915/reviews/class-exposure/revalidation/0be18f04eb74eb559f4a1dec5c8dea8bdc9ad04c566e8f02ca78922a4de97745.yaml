# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 5 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. По Д22 судится ТОЛЬКО дельта редакции 5 против последней разобранной
# (редакция 4, 1674e7a7…, запись revalidation/1674e7a7….yaml). Предмет дельты — `git diff c234cff3f
# b206f816f -- docs/changes/issue-2915/design.md` (+193/−43): отображение CX1-66 (З24 ограда ключа и
# ротация, З28 гейт раскладки и аннотация, §3 И33, §6 `recipient_key_fence`, §8, §13 Е11), CX1-67 (З7
# шаг 5, З27 счётчик, §3 И34, Е9), УК89 (З16 `notify/feed/internal/tablename`, §6), замеры М29, М30.
# Пункты CX1-01…65 и их отображения этой записью не пересуживаются.
# Итог: CX1-66, CX1-67 и УК89 отображены и выдерживают условия; М29 и М30 воспроизведены. Дельта
# внесла новое sentinel-значение `limits.ErrRecipientKeySuperseded` вместе с оградой ключа и выходом
# процесса — по §4 change-graph это новый пункт перечня, CX1-68; строки §11 у него нет, и три его
# условия замыслом не решены (изоляция транзакции резерва, судьба исполнителей в полёте при выходе,
# постоянное имя объекта ключа). Плюс условия к коду УК90 (вызов функции имени ≠ оператор записи) и
# УК91 (детерминизм рендера объекта ключа). Возврата в приёмку дельта не даёт; NTF1-L03 записи
# 9bfa92be в силе (приёмка не менялась, 29cfa368…). Права писать реализацию эта запись не даёт.
