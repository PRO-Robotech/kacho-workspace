conditions_to_code:
  - id: УК90
    item: "CX1-64 (б), УК87, УК89"
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (гейт судит по идентичности того, что утверждает); rule testing-verdict п.14 «Твой СОБСТВЕННЫЙ разборщик — тоже распознаватель»"
    condition: >-
      результат `tablename.Of` не сохраняется: он используется только аргументом выражения, строящего
      текст одного оператора, в той же строке вызова (не присваивается полю, переменной пакета или
      структуры); гейт `AuditFeedTableWrites` красит всякое иное употребление результата — тогда
      «один вызов = один оператор» и ведомость «три оператора окна» считается по вызовам честно. Иная
      форма допустима, только если гейт считает операторы, а не вызовы (например, по форматной строке с
      глаголом записи у места употребления имени)
    held_by: >-
      инъекции к гейту C10: `f.window = tablename.Of(svc, tablename.Window)` в конструкторе и четвёртый
      `fmt.Sprintf("UPDATE %s …", f.window)` → красный с координатой; близнец — три оператора с прямым
      вызовом `Of` → зелёный с числом 3
  - id: УК91
    item: "CX1-66 (б)"
    class: "code-authoring §«Умолчание, которое становится утверждением» (порождённое значение ключа); §«Решение и его следствие разнесены» (аннотация от содержимого делает всякую недетерминированность рендера ротацией)"
    condition: >-
      шаблон объекта ключа сетки не порождает ключ (`rand*`, `genPrivateKey`, `lookup` в нём нет), пустое
      `notify.recipientKey` — отказ рендера (`required`), а не порождённое значение; два рендера с одними
      значениями дают одну аннотацию `checksum/recipient-key`. Иначе каждое обновление установки — ротация
      с названным в З24 следствием (сетка на адресата заново)
    held_by: >-
      проба рендера D1: пустой ключ → ошибка рендера с именем ручки; два рендера одних значений →
      аннотации равны; инъекция — `randAlphaNum 32` в шаблоне → аннотации различны, проба красная

items:
  - id: CX1-68
    decision: >-
      З24 «Ограда ключа сетки»: строка-одиночка `recipient_key_fence` (§6), запись отпечатка при старте
      реплики `INSERT … ON CONFLICT … DO UPDATE … WHERE fingerprint <> EXCLUDED.fingerprint`, чтение
      `FOR SHARE` первым оператором транзакции резерва, новое sentinel-значение
      `limits.ErrRecipientKeySuperseded` и немедленный выход процесса ненулевым кодом
    class: >-
      code-authoring §«Чужой ответ: классификация и бюджет» (новый исход транзакции резерва и его класс);
      §«Порядок операций внутри кода» (порядок снятия ресурса при выходе); §«Решение и его следствие
      разнесены» (источник ключа у реплик и последний записавший ограду)
    exposure: >-
      (1) утверждение З24 «ждёт смены ограды и перечитывает строку — ноль строк» верно только при READ
      COMMITTED: при REPEATABLE READ та же гонка даёт 40001 (М31 (б)), а не ноль строк, и сторож не
      выбирается — исход уходит в класс, которого З24 не называет; уровень изоляции транзакции резерва
      замысел не фиксирует. (2) Исполнители работают параллельно (З21: пачка `Claim` до `notify.workers`,
      строки обрабатываются параллельно); немедленный выход процесса по сторожу одного исполнителя
      обрывает остальных, в том числе тех, чей резерв закоммичен до смены ограды и кто стоит между `DATA`
      и `Ack`. Приёмка это допускает (NTF1-G16, Р14: дубль в окне `DATA → Ack`), но здесь выход —
      выбор, а не авария: каждая ротация добавляет до числа строк в окне `DATA → Ack` на реплику дублей,
      которых остановка приёма без обрыва не дала бы. Замысел этого размена не называет. (3) Ограда
      сходится, только если все реплики читают ключ из ОДНОГО объекта по постоянному имени: если имя
      объекта зависит от содержимого (частая форма «перекатить через новое имя»), реплики старого и нового
      набора читают разные объекты, каждая перезапущенная переписывает ограду своим ключом, и новые
      реплики падают циклом — раскатка не сходится. Гейт раскладки (CX1-66 (а)) постоянство имени не
      утверждает. (4) Запись старта с ложным `WHERE` всё равно запирает строку ограды до своего коммита
      (М31 (в)): оператор внутри долгой стартовой транзакции держит все резервы. (5) Колонка `since`
      пишется, читателя у неё в замысле нет
    condition: >-
      (а) строка §11 CX1-68 → З24, §3 И33, §6; (б) транзакция резерва открывается с явным READ COMMITTED
      (и это утверждает проба), либо 40001 на чтении ограды классифицируется тем же сторожем; 40001/40P01
      иного оператора резерва сторожем не считаются; (в) по сторожу реплика прекращает `Claim` и новые
      резервы, исполнители с закоммиченным резервом доводят SMTP и `Ack` в пределах своего срока (З21),
      затем процесс выходит ненулевым кодом — либо замысел называет немедленный выход и его цену (дубли
      до числа строк в окне `DATA → Ack` на реплику на каждую ротацию) решением; (г) имя объекта ключа
      сетки постоянно и от содержимого не зависит — гейт раскладки D1 утверждает это (инъекция — имя с
      хешем содержимого → красный); (д) запись ограды при старте — отдельный оператор в собственной
      транзакции до первого `Claim`, не часть стартовой транзакции миграций или иного; (е) у `since`
      есть читатель (журнал старта или метрика «ключ действует с») либо колонки нет; (ж) сторож
      отличен по `errors.Is` от исчерпания сетки и потолка — уже в З24, держатель — проба N7
    held_by: >-
      (б) проба N7: транзакция резерва начата, в паузе стартует реплика с другим ключом → сторож, а не
      40001; инъекция — резерв под REPEATABLE READ → проба красная; (в) проба N7: две реплики, у первой
      строка в паузе между `DATA` и `Ack` — после старта второй первая доводит `Ack`, дублей 0, затем
      выходит; близнец — строка до резерва → не отправлена первой; (г) гейт D1 с инъекцией имени от
      содержимого; (д) вниманием и ревью диффа (db-architect-reviewer), гейта нет: форма транзакции
      старта по тексту не видна; (е) ревью замысла

