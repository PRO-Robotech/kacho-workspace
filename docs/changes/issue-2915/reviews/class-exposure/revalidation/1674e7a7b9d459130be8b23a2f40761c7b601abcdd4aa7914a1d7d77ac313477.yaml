mapping_check:
  - id: CX1-64
    design: "З5 «SQL-функции постановки нет», З7 шаг 5, З16 `AuditFeedTableWrites`, §3 И31, §12, §13 Е10, §11а УК87"
    verdict: holds
    note: >-
      (а) исполнено выбором «функции нет»; довод — сторожа `Put` живут в процессе (флаг, IDNA, форма,
      кольцо ключей, порядок замков) — выдерживает: функция базы обходила бы их либо дублировала.
      Приёмке NTF-3 — заказ Е10 с предикатом снятия, её строки 1499, 2067, 4024 на 88ad95c6 подтверждены
      этой записью. (б) перепись — предикат гейта с ведомостью, знаменателем и двумя инъекциями; число
      «три» названо утверждением о будущем дереве, сегодняшнее значение — М28 (воспроизведён: 0 во всех
      трёх деревьях). Распознаватель Go-части слеп к имени таблицы, собранному подстановкой, — условие к
      коду УК89 ниже; на отображение (а) и (б) оно не влияет
  - id: CX1-65
    design: "З7 шаг 5 «Цикл через замки самого вызывающего», З10, §3 И30, §13 Е9, §11а УК88"
    verdict: holds
    note: >-
      И30 и фраза З10 сужены до писателей ленты; условие вызывающим в Е9 с рабочей формой «`Put` с
      лимитами — последний шаг, берущий замки существующих строк и рекомендательные блокировки»;
      держатель у вызывающего и честная строка «гейта у NTF-1 нет и не будет». Рекомендательная
      блокировка добавлена к условию сверх записи 137602c7 — верно: NTF-2 З24 берёт `pg_advisory_xact_lock`
  - id: "УК85"
    design: "З7 шаг 5, §3 И32, §1 М27, §11а УК85"
    verdict: holds
    note: >-
      отметка в точке сохранения `Put`, чтение `coalesce(current_setting(…, true), '') = ''`, откат вместе
      с вкладом. М27 воспроизведён этой записью, плюс случай, которого в М27 нет: откат вызывающего к своей
      точке сохранения, охватывающей `Put`, снимает отметку (результат — пустая строка) — утверждение З7
      строки 427–428 подтверждено. Сужение УК84 до постановок с `limits` выдерживает: постановка без
      `limits` строк окна не пишет, журнал подписки — `RowExclusiveLock` таблицы (замер записи 137602c7).
      Сторож — новое sentinel-значение, пункт CX1-67
  - id: "УК86"
    design: "З5, З7 шаги 2 и 5, З10 (строка 552), §6 (строки 1315, 1324), §11а УК86"
    verdict: holds
    note: >-
      одна функция `feed.LimitLess` у генератора и `Put`; `Put` сам проверяет строгое возрастание —
      порядок держит место, которое берёт замки. Колонки `window_seconds` — `integer` (§6), и уборщик
      сортирует их без `COLLATE` — сравнение числом на обеих сторонах. «Побайтно» сужено до текстовых
      частей
  - id: "Д25"
    design: "§0 (строки 93–96)"
    verdict: holds
    note: "отметки прочитанного в замысле NTF-1 нет (`grep -n 'seen_up_to\\|прочитан' design.md` → 1 строка, 87 — сама ссылка §0 на Д25); предмет — API NTF-3"
  - id: "Д24"
    design: "§0, З7 шаг 5, З16, М28"
    verdict: holds
    note: >-
      перепись писателей таблиц ленты в NTF-1 — предикат с командой и числом @ревизия (М28) и гейт со
      знаменателем. Перепись писателей журнала подписки и пишущих путей под пересланной личностью —
      предмет NTF-3; писатель журнала, который вносит NTF-1 (`Put`, шаг 6, объект `notification_feed:<модуль>`),
      в неё обязан войти — заказ автору NTF-3 ниже

conditions_to_code:
  - id: УК89
    item: "CX1-64 (б)"
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (собственный гейт судит по идентичности, а не по написанию); rule testing-verdict п.14 «Твой СОБСТВЕННЫЙ разборщик — тоже распознаватель»"
    condition: >-
      (а) Go-часть `AuditFeedTableWrites` ловит не только литерал «глагол записи + метка окна или
      суффикс», но и каждое не-тестовое место вне `notify/feed`, где появляется суффикс таблицы ленты
      (`_notification_outbox`, `_notification_window`, `_notification_contrib`) любым литералом, и каждый
      вызов функции, производящей имя таблицы ленты, по идентичности объекта (`go/types`): форма
      `fmt.Sprintf("UPDATE %s …", name)` и сцепление строк литерала с глаголом не содержат; (б) функция
      имени таблицы ленты в `notify/feed` не экспортируется (снаружи имя можно получить только
      литералом суффикса, который (а) видит); (в) SQL-часть судит по подстроке суффикса, а не по полному
      имени таблицы, и кроме тел функций, процедур и триггеров считает блоки `DO` и одиночные операторы
      записи в файлах миграций; область — все `*.sql` дерева, а не только `migrations/` (в kacho вне
      `migrations/` 3 файла посева `deploy/scripts/*.sql`) — либо область сужена с доводом в самом гейте
    held_by: >-
      инъекции к гейту C10: `fmt.Sprintf("UPDATE %s SET count = 0", <функция имени окна>)` в пакете модуля
      kacho → красный с координатой; `"UPDATE " + svc + "_notification_window"` → красный; `DO $$ … UPDATE
      vpc_notification_window …$$` в файле миграции → красный; близнец — три оператора `notify/feed` →
      зелёный с числом 3 и числом осмотренных файлов

items:
  - id: CX1-66
    decision: "З28 «Ключ сетки — отдельный объект секрета» (Д23): `notify.recipientKey` — свой объект секрета, монтирует notify; NTF-4 «меняет содержимое объекта на ключ отпечатка Р15 — раскладка секретов при этом не меняется»"
    class: "code-authoring §«Решение и его следствие разнесены» (смена содержимого секрета и пересчёт ключей сетки у реплик); rule security sec-chart-config-checksum (аннотация есть только у конфига); code-authoring §«Инвариант и оснастка — это тоже прод-код» (раскладка без стража)"
    exposure: >-
      (1) ключ сетки читается при старте (ручка §8: 32 байта, отказ), а аннотация пода — только
      `checksum/config` (З28, строка 1112): смена содержимого объекта перезапуска не вызывает, и реплики
      (их ≥ 2, NTF1-I05), перезапущенные в разное время, держат разные ключи — CAS-строки сетки одного
      адресата расходятся по двум ключам, и лимит на адресата (`security` за сутки, `notice` за час и
      сутки) пропускает до удвоенного числа писем; (2) любая смена содержимого — и замещение ключом Р15,
      которое З28 передаёт NTF-4, — это ротация: строки сетки под старым хешем становятся ничьими, и
      окна до суток начинаются с нуля. Замысел этого следствия не называет (слов «ротация», «смена
      ключа» в файле 0); (3) раскладку «ключ сетки — не поле секрета почты, монтирует только notify»
      не держит ни один гейт: И1 и NTF1-I01 — о кредах почты
    condition: >-
      (а) гейт рендера (семейство I01) утверждает раскладку: ключ сетки — отдельный объект, в секрете
      почты ключа `recipientKey` нет, объект ключа сетки монтирует только notify; (б) шаблон пода notify
      несёт аннотацию от содержимого объекта ключа сетки (или его версии), так что смена содержимого
      перекатывает все реплики, — либо замысел называет иной механизм, исключающий реплики с разными
      ключами; (в) замысел называет следствие смены содержимого — сетка начинается заново на длину
      самого длинного окна — остатком с предикатом или условием, и передаёт его NTF-4 строкой §13 (Д23:
      «ротация и контрольное значение Р11 согласуются на обоих развёртываниях»)
    held_by: >-
      (а) гейт рендера: инъекция — `recipientKey` ключом секрета почты → красный; второй монтирующий
      объекта в NTF-1 → красный; близнец — отдельный объект у notify → зелёный; (б) проба рендера:
      смена значения ключа меняет аннотацию пода, смена несвязанного значения — нет; (в) вниманием
      замысла NTF-4 (заказ через §13), гейта у NTF-1 нет: сколько раз ключ меняют, решает эксплуатация
  - id: CX1-67
    decision: "З7 шаг 5: sentinel `feed.ErrSecondLimitedPut` и транзакционная отметка `kacho_feed.limited_put` (пусто — нет постановки, `'1'` — была)"
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (новый исход без класса у вызывающего); §«Умолчание, которое становится утверждением» (пустая строка и NULL — одно «нет»)"
    exposure: >-
      новый исход `Put` — дефект вызывающего, а не состояние мира, но транзакция после него пригодна к
      коммиту, как после `ErrLimitExhausted` (откат к точке сохранения). Вызывающий, который обрабатывает
      отказы `Put` одной веткой «письмо не поставлено — коммитим мутацию», молча теряет письмо — и именно
      письмо безопасности. Класс у вызывающего замысел не называет; отдельной строки §11 у sentinel нет.
      Отметка: «нет» имеет два написания (NULL в свежем сеансе, пустая строка после первого `set_config`
      сеанса) — замысел это видит и сводит `coalesce` (М27), держатель есть
    condition: >-
      (а) строка §11 CX1-67 → З7 шаг 5, И32, УК85; (б) `ErrSecondLimitedPut` не совпадает по `errors.Is`
      ни с `ErrLimitExhausted`, ни с `ErrAttrsInvalid`; (в) Е9 называет вызывающим его класс: дефект
      программы — отказ глагола `INTERNAL` фиксированным текстом (транзакция вызывающего откатывается), а
      не «письмо не поставлено, мутация коммитится»; (г) отказ считается счётчиком с причиной
      (`second_limited_put`), ноль за всю жизнь — норма, не-ноль — сигнал
