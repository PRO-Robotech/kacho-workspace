# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 4 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. По Д22 судится ТОЛЬКО дельта редакции 4 против последней разобранной
# (редакция 3, 137602c7…, запись revalidation/137602c7….yaml). Предмет дельты — `git diff f6804a818
# c234cff3f -- docs/changes/issue-2915/design.md` (+177/−60): отображение CX1-64 (З5, З7 шаг 5, З16,
# И31, Е10), CX1-65 (З7, З10, И30, Е9), условий УК85 (З7 шаг 5, И32, М27) и УК86 (З5, З7 шаги 2 и 5),
# строки УК87–УК88 §11а, решения Д23–Д25 (§0, З28), замеры М27, М28. Пункты CX1-01…63 и их отображения
# этой записью не пересуживаются.
# Итог: CX1-64, CX1-65, УК85, УК86 отображены и выдерживают условия; М27 и М28 воспроизведены. Дельта
# внесла два новых решения, которые пунктами перечня не заведены: CX1-66 — ключ сетки отдельным объектом
# секрета (Д23), у которого нет ни стража раскладки, ни следствия смены содержимого (реплики со старым и
# новым ключом делят сетку, суточные лимиты на адресата начинаются заново); CX1-67 — новое
# sentinel-значение `feed.ErrSecondLimitedPut` и транзакционная отметка `kacho_feed.limited_put`: у
# сторожа нет строки §11 и нет класса у вызывающего. Плюс условие к коду УК89: распознаватель гейта
# `AuditFeedTableWrites` (Go-часть) слеп к имени таблицы, собранному подстановкой, — а это обычная форма
# записи в трёх деревьях (74 строки). Возврата в приёмку дельта не даёт; NTF1-L03 записи 9bfa92be в
# силе (приёмка не менялась, 29cfa368…). Права писать реализацию эта запись не даёт.
