new_items:
  - id: CX1-120
    decision: "Д80: гейт image-rollout-binding для notify закрывает D1s — аннотация kacho.cloud/image-id в шаблоне пода чарта notify и осмотр через самостоятельный рендер notify с включённым флагом"
    class: >-
      code-authoring §«Инвариант и оснастка — это тоже прод-код»: предмет гейта (SERVICES из
      deploy/Makefile) уже включает notify, а объектов notify у гейта нет. code-authoring §«Умолчание,
      которое становится утверждением»: если «осмотр» молча даст 0 объектов, гейт либо краснеет без
      дефекта, либо его правят исключением notify
    exposure: >-
      Измерено на дереве Д78 @55581ad526d. deploy/Makefile SERVICES = «vpc compute api-gateway nlb geo
      storage registry notify» (notify внесла D1; @e415e59a225 его там нет). Гейт рендерит зонтик с
      values.dev.yaml двумя картами идентификаторов. Итог: «workload'ов в рендере: 30; привязано 7
      (сервисов в SERVICES: 8)», «FAIL: notify: идентификатор … НЕ ДОЕХАЛ до шаблона пода»,
      «утверждений выполнено 2 из 3». Значит, дерево Д78 не станет «целиком зелёным» (Д78), пока D1s
      этот гейт не закроет. Механизм Д80 буквально не исполним на этом дереве. helm template
      deploy/helm/notify -f notify-standalone/values.yaml -f mail-node/operator.yaml --set image.tag=x
      даёт 0 документов kind как без флага, так и с --set global.kacho.notifications.enabled=true:
      флаг упомянут только комментарием _sources.tpl («вносит полоса D2»). Объекты notify на этом дереве
      даёт только копия осмотра З28. При этом путей D1s гейт не содержит (image-rollout-binding — 0
      вхождений в tasks.md). Без условия исполнитель выберет одно из простых решений: снимет notify из
      SERVICES, вычтет его из счёта или заведёт ветку «notify — пропустить до D2». Все три гасят
      предмет гейта, а самопроверка (B) сверяет «привязано … $SERVICES_N»
    condition_on_code: >-
      (а) Строка D1s называет deploy/tests/helm/image-rollout-binding-test.sh в путях и этот гейт в
      предикате. (б) На дереве Д78 предъявителя notify гейт берёт из рендера копии осмотра (обёртка
      render-notify-inspect.sh, те же правила (1)–(4)) обеими картами идентификаторов A и B: слои
      notify-standalone, mail-node/operator, notify-inspect/values, ids-<x>.yaml. Шаблон notify читает
      dig "kachoImageIds" "notify" … .Values.global, поэтому global.kachoImageIds доходит до копии
      верхним слоем. (в) notify остаётся в SERVICES и в счёте. Печать по каждой службе называет
      источник рендера (зонтик или копия осмотра). Итог — «привязано 8 (сервисов в SERVICES: 8)»,
      самопроверка (B) зелёная с тем же числом. (г) Ветка копии в гейте истекает вместе с копией: при
      непустой таблице обёртка отказывает (правило (4)), и D2 тем же изменением переводит гейт на рендер
      зонтика (пути D2 расширены этим файлом). (д) Замысел называет, что «рендер с включённым флагом»
      Д80 на дереве Д78 реализован копией осмотра: у флага до D2 читателя нет, рендер чарта даёт 0 объектов
    held_by: >-
      Нужна инъекция D1s, в замысле её нет. В копии чарта снята строка kacho.cloud/image-id → красный
      «notify: … НЕ ДОЕХАЛ». Близнец — как есть → «привязано 8 из 8», источник notify — копия осмотра.
      Вторая инъекция: dig читает чужой ключ ("vpc") → «предъявили 2 workload'а». Однофайлового признака
      нет
  - id: CX1-121
    decision: "Д79: C13a вносит в corelib authz.RevocationPolicy.Windows запись окна отзыва кеша вердиктов процесса notify-probe (ручка KACHO_NOTIFYPROBE_AUTHZ_CACHE_TTL) по канону соседних записей"
    class: >-
      code-authoring §«Решение и его следствие разнесены»: запись политики лежит в corelib, а закрытый
      словарь ручек, по которому kacho сопоставляет площадку с записью, лежит в kacho, и садятся они
      разными изменениями. code-authoring §«Инвариант и оснастка — это тоже прод-код»: ключ записи
      судится по идентичности (каталог против процесса). security-hardening
      hard-revocation-antidote-cache-fail-closed, hard-short-lived-by-decision
    exposure: >-
      Измерено @55581ad526d (пины corelib 1a37f81d0e94, kaname 0f2395a624f3). Красных гейтов три.
      TestEveryVerdictCacheProcessDeclaresItsOwnKnob: «держателей без ручки=1 … «notify» (окно отдано
      дескриптору)». TestEveryVerdictCacheServiceIsDeclared: «политикой не объявлен: «notify»».
      TestEveryAuthzWindowKnobIsDeclared: «services/notify/cmd/notify-probe/internal/config/config.go:
      ручка "KACHO_NOTIFYPROBE_AUTHZ_CACHE_TTL" … политикой НЕ объявлена… закрытому словарю имён, в
      котором этой ручки нет». TestRevocationWindowIsDeclaredPolicy зелёный: «площадок сопоставлено=11,
      записей политики=11», потому что ручки нет в словаре tools/revocationwindowgate (KnobNames) и
      площадка не сопоставлена. Отсюда два раздельных следствия. (1) Пин corelib с новой записью без
      ручки в словаре kacho → TestRevocationWindowIsDeclaredPolicy красный «запись политики без
      предмета». Ручка в словаре без пина → «окно не объявлено политикой». Две записи в двух модулях
      садятся только вместе. Словаря tools/revocationwindowgate нет ни в одной строке маршрута (0
      вхождений). (2) Ключ. Комментарий corelib называет ключ «<процесс> <ручка>», а гейт kacho
      строит ключ из каталога services/<svc> (verdictCacheHoldersUnder: processes[svc.Name()]), и
      держатель печатается как «notify», а не «notify-probe». Запись «notify-probe KACHO_…» гейт не
      найдёт, и правильная форма — «notify KACHO_NOTIFYPROBE_AUTHZ_CACHE_TTL». При ней withOwnKnob
      помечает «notify» целиком. Когда кеш вердиктов заведёт второй процесс каталога (шлюз cmd/notify,
      Д74), он пройдёт как «со своей ручкой» по записи пробы. Сейчас этого нет: CacheWindow в
      services/notify/cmd — только notify-probe/describe.go:83
    condition_on_code: >-
      (а) Замысел называет ключ записи литералом «notify KACHO_NOTIFYPROBE_AUTHZ_CACHE_TTL» и значение,
      равное значению в исходнике (config.go:98, default "5s"), не выше Ceiling 10s. (б) Ручка вносится в
      словарь tools/revocationwindowgate kacho тем же изменением kacho, что пин corelib на голову C13a
      (полоса N11r или D4 — назвать). На дереве Д78 до этого изменения четыре гейта окна печатают свой
      исход, после него — зелёные. (в) Правило Д74 «гейты, считающие процессы по каталогу, печатают два
      корня services/notify» распространяется на гейты окна отзыва (revocationwindow_test.go): держатель
      печатается корнем процесса (notify-probe), и запись одного корня не помечает другой. Либо замысел
      записывает, что у шлюза notify в NTF-1 кеша вердиктов нет, и предикат снятия: CacheWindow или
      NewCache в services/notify/cmd/notify/** → 0
    held_by: >-
      Сами гейты окна отзыва на дереве Д78 после пина: четыре зелёных с числами из «осмотрено: …».
      Для (в) нужна инъекция D4: фикстурный держатель в cmd/notify (дескриптор с CacheWindow) без своей
      записи при записи пробы → находка с именем корня «notify». Близнец — держатель только в
      notify-probe → молчание. Однофайлового признака нет
  - id: CX1-122
    decision: "Д80: пробы D1 с объектами notify (I01, I02, I05, I06 и прочие) в этой волне законно дают «не выполнилось: перечень пуст»; замысел З28: «при нуле объектов даёт «НЕ ВЫПОЛНИЛОСЬ: перечень пуст»»"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением»: послабление стоит на исходе (0
      объектов), а не на предпосылке (пустая таблица). gate-authoring: самоистечение послаблений
    exposure: >-
      З28 ставит «НЕ ВЫПОЛНИЛОСЬ» на условие «при нуле объектов». После D2 таблица непуста, и 0 объектов
      notify в цепочке, где перечень должен быть непуст, — это тот самый дефект, который пробы ловят
      (NTF1-N03/N04, выведение перечня, флаг). Проба с такой веткой ответит на него «не выполнилось», а
      не красным. У копии осмотра самоистечение есть (правило (4)), у ветки проб D1 его нет: замысел не
      говорит, что D2 её снимает, и не связывает её с пустотой таблицы. «Не выполнилось» не красное, и
      по Д80 хук его пропускает, поэтому после D2 проба станет молчаливым пропуском
    condition_on_code: >-
      (а) Предпосылку ветки проба читает у таблицы модулей (помощник таблицы _sources.tpl, рендер
      kacho.notifications.sources или его JSON), а не у числа объектов рендера. Таблица пуста и объектов
      0 → «НЕ ВЫПОЛНИЛОСЬ: перечень пуст» с печатью предпосылки. Таблица непуста и объектов 0 → красный с
      цепочкой. (б) Либо D2 тем же изменением, что вносит строки таблицы, снимает ветку из каждой
      пробы D1, и пути D2 называют эти файлы. Ни одна проба не должна пережить D2 с веткой «не
      выполнилось». (в) D1 печатает в сдаче вывод хука отправки на дереве Д78 и число исходов «не
      выполнилось» по пробам. Если хук их не пропускает, условие Д80 не выполнено, и это вопрос
      диспетчеру, а не ослабление хука
    held_by: >-
      Нужна инъекция D1 (общая для проб с веткой либо на пробе-представителе): фикстурная таблица с одной
      строкой при выключенном перечне цепочки (объектов 0) → красный, а не «не выполнилось». Близнец —
      пустая таблица → «НЕ ВЫПОЛНИЛОСЬ: перечень пуст». Однофайлового признака нет

