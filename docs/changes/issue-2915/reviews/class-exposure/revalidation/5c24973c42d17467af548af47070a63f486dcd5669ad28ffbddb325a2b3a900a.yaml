notes:
  - id: N38-1
    blocking: false
    where: "deploy/helm/notify/templates/deployment.yaml:39 @55581ad526d (предмет D1, контекст CX1-120)"
    text: >-
      Шаблон notify читает dig "kachoImageIds" "notify" "unset" .Values.global без (.Values.global |
      default dict). У соседей (kacho-geo, kaname, край) и в тексте починки гейта стоит форма с default
      dict. Измерено helm v4.2.4: dig по неопределённому global даёт «error calling dig: interface
      conversion: interface {} is nil». Сейчас это перекрыто: узел почты приходит через global, и без
      него карта отказывает раньше. Но имя отказа здесь задаёт порядок шаблонов, а не решение. Свести к
      форме соседей
    predicate: "git grep -n 'dig \"kachoImageIds\"' -- deploy/helm/notify/ → каждая строка с default dict"

