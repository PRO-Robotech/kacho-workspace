# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 38, маршрут редакции 39.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта редакции 38 против последней пересверенной
# (редакция 37, 8024f0bb…, запись revalidation/8024f0bb….yaml — «к замыслу», CX1-116 в части D1s,
# CX1-118, CX1-119, N37-1…N37-3) и решения диспетчера Д79, Д80 (2026-10-02; Д75…Д78 действуют). Дельта
# не закоммичена: рабочее дерево issue-880 поверх f2696940e (на f2696940e design.md = 8024f0bb…).
#
# Итог — к замыслу. Пункты прошлой пересверки отображены все: CX1-116 (D1s) копией осмотра с
# самоистечением, CX1-118 выбором полосы по form.origin с эталоном, CX1-119 деревом Д78, N37-1…N37-3.
# Решения Д79 и Д80 в замысле не отображены (0 вхождений), и каждое вводит пункт. CX1-120: гейт
# image-rollout-binding на дереве Д78 красный (измерено), а «самостоятельный рендер с включённым флагом»
# на этом дереве даёт 0 объектов, потому что у флага до D2 нет читателя (измерено). CX1-121: запись окна
# отзыва notify-probe требует второй записи в kacho — закрытого словаря ручек гейта — и должна садиться
# с ней атомарно; ключ записи — каталог, а не процесс. CX1-122: ветка «НЕ ВЫПОЛНИЛОСЬ: перечень пуст»
# у проб D1 срабатывает по исходу (0 объектов), а не по предпосылке (пустая таблица), и у неё нет
# самоистечения.
