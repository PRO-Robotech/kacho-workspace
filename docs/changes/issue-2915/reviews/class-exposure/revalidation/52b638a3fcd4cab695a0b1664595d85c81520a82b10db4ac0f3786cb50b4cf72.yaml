# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 18 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 16
# (2003c8e2…, запись revalidation/2003c8e2….yaml, коммит bc8af4e91, итог «к замыслу»: CX1-81…83,
# CX1-84 к коду). На редакцию 17 (9af0703a…, коммит 151befdb5) пересверки нет, поэтому дельта —
# обе редакции: 151befdb5 (отображение CX1-81…84, N1, N2; открытое Е14) и e1af41e40 (Д47, Д48, Д49).
# Пункты CX1-01…80 и условия УК1…УК94 эта запись не пересуживает.
#
# Итог — к замыслу. CX1-81…84, N1 и N2 отображены, и отображение выдерживает условия пунктов.
# Д47 закрывает Е14 без новых механизмов. Новые решения Д48 и Д49 дают четыре пункта; три из них
# подтверждены замером по дереву kacho, четвёртый выведен из текста дерева.
#   CX1-85. Д46 и D2 ставят `fe3455` на приёмник в кластере. Но слой учётных данных площадки
#   `cutover-fe3455.sh` накладывается последним, и ему разрешена ровно одна координата —
#   `global.kacho.identity.smtp.connectionURI`. Если слой её несёт, раскатка `fe3455` после D2
#   отвергается стражем зонтика (7). Замер: рендер цепочки с узлом D2 проходит, с таким слоем
#   поверх — отказ.
#   CX1-86. Перепись гейтов обхода по Д48 считает только `deploy/*_test.go`. Цепочки
#   `deploy/stacks.txt` рендерят ещё 10 файлов Go вне `deploy/`, шелл-гейты через `stacks.sh` и
#   задание CI.
#   CX1-87. Образец узла «в форме узла values.dev.yaml» роняет рендер `prod` стражем зонтика (6);
#   тот же адрес вовне с якорем стенда роняет его стражем (7). Замер: три рендера `prod` на
#   origin/1276.
#   CX1-88. Второе условие предиката старта D2 (Д49) — файл `values.fe3455-identity-posture.yaml`
#   на базе. Изменение `kacho#1276` этот файл удаляет (origin/1276@3af063bd6f3). После вливания
#   `kacho#1276` условие ложно всегда, и D2 не стартует никогда.
# Кроме того, `change.yaml` несёт отпечаток редакции 17, а не предмета. Возврата в приёмку нет.
