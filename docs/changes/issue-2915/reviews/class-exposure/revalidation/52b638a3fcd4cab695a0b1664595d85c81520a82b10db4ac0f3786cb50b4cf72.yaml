items:
  - id: CX1-85
    status: unmapped
    decision: "Д46, Д49, D2: узел `fe3455` — приёмник в кластере с якорем `kacho-mailpit-tls` / `ca.crt` в отслеживаемом `values.fe3455.yaml`; раскатка `fe3455` — `cutover-fe3455.sh`, который накладывает последним неотслеживаемый слой учётных данных площадки"
    class: "code-authoring §«Решение и его следствие разнесены» (решение о узле стенда в профиле дерева, следствие — в слое вне дерева, наложенном позже); §«Контракт, который нельзя выразить» (у одного значения `connectionURI` два источника с разным старшинством)"
    finding: >-
      `cutover-fe3455.sh` (и на origin/2564, и на origin/1276) добавляет неотслеживаемый слой учётных
      данных последним в цепочку `-f`. Слою разрешён закрытый список координат CRED_PATHS, и в нём
      ровно одна: `global.kacho.identity.smtp.connectionURI`. По тексту скрипта это «единственная
      координата, которую слой ещё несёт». Значит, на живой раскатке адрес узла `fe3455` берётся из
      слоя, а не из узла D2. Якорь же D2 кладёт в дерево, и он указывает на секрет приёмника. Страж
      зонтика (7) на такое сочетание (полоса ведёт наружу, якорь — секрет приёмника стенда) отвечает
      отказом рендера. Замер на origin/1276: цепочка `fe3455` с узлом в форме D2 и `mailpit.enabled`
      рендерится (rc 0, 140 объектов). Тот же рендер со слоем, несущим только внешний
      `connectionURI`, — rc 1, отказ стража (7). Проба D2 рендерит цепочку дерева и этого не видит.
      Приёмка NTF-2 ред. 21 (N-3) по-прежнему описывает `fe3455` через слой учётных данных и флаг
      `false`.
    condition_to_design: >-
      (а) Замысел называет судьбу координаты `connectionURI` в CRED_PATHS после D2. Исход по Д46 —
      снять её из CRED_PATHS тем же изменением D2: слой, который её несёт, отвергается раскаткой с
      именем координаты. Путь `deploy/helm/umbrella/cutover-fe3455.sh` входит в пути D2 и в Е13. Гейт
      MAIL-54 (`deploy/identity_mail_lane_single_declaration_test.go`, `TestMailLaneIsDeclaredOnce`)
      правится там же, потому что сверяет CRED_PATHS с объявлением узла.
      (б) Проба D2 рендерит `fe3455` так, как её раскатывает скрипт: цепочка из `stacks.sh --chain
      fe3455` плюс фикстурный слой учётных данных. Для этого есть два близнеца. Слой без координат —
      рендер проходит, адрес приёмника. Слой с `connectionURI` — отказ раскатки на шаге 1a с именем
      координаты. Инъекция — `connectionURI` возвращён в CRED_PATHS — красная.
      (в) Если живой `fe3455` должен и дальше слать почту через ретранслятор оператора, Д46 для
      `fe3455` неверно. Тогда это вопрос диспетчеру, а не правка замысла.
    held_by: "проба D2 со слоем учётных данных — нужна, её нет (заказ); MAIL-54 — есть в дереве, правка нужна"
  - id: CX1-86
    status: unmapped
    decision: "Д48, З28 «Образец узла — в фикстуре гейта», D2: перепись гейтов обхода — `git grep -lE 'deployStacks\\(|stacks\\.txt' -- 'deploy/*_test.go' 'deploy/**/*_test.go'`, равенство «рендерят `prod`» = «со слоем фикстуры»"
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения» (единица переписи — файлы Go одного каталога, а механизм — таблица цепочек с двумя читателями); gate-authoring — «ноль находок» по не прочитанному виду предмета"
    finding: >-
      Шапка `deploy/stacks.txt` называет двух читателей: шелл `tests/helm/stacks.sh` и Go
      `deployStacks(t)`, общий для `deploy` и `gateway/deploy`. Предикат Д48 видит только файлы Go в
      `deploy/`: 54 на 6edea09c2ee, 48 на origin/1276. Вне его остаются файлы Go, называющие
      `deployStacks(`, `stacks.txt` или `stacks.sh` вне `deploy/`: 10 на обеих ревизиях
      (`gateway/deploy` — 5, `services/registry/deploy` — 2, `internal/repohygiene` — 3). Вне его и
      шелл-гейты `deploy/tests/helm/*`, которые подключают `stacks.sh` и рендерят каждую цепочку
      (например, `rendered-documents-well-formed-test.sh`, `networkpolicy-egress-test.sh`), и задание
      CI `ci.yaml`, рендерящее каждую цепочку (`stacks.sh --names` / `--args`). Всего файлов `*.sh`,
      зовущих `stacks.sh`, на origin/1276 — 24, из них гейтов и харнессов в `deploy/tests/helm` — 17.
      Равенство «рендерят `prod` = со слоем» будет зелёным, пока эти читатели рендерят `prod` без
      слоя. Покраснеют они только когда NTF-2 или NTF-3 сделают перечень `prod` непустым, то есть
      ровно там, откуда Д48 хотел это убрать. Второе: те же читатели зовут и рецепты установки —
      `deploy/Makefile` (`STACK_ARGS`), `cutover-fe3455.sh`, `stack-secrets.sh`. Слой фикстуры,
      вставленный в общий читатель, попал бы в настоящую установку `prod`.
    condition_to_design: >-
      (а) Единица переписи — точки применения механизма, а не каталог. Это каждый вызывающий
      `deployStacks(`, `stacks.sh` (`--names`, `--args`, `--chain`) и прямой читатель `stacks.txt`
      во всех языках и каталогах, включая `.github/workflows/*.yaml`. Каждый размечен ролью: гейт
      (рендерит, получает слой) или установка (не получает никогда). Перепись печатает число по
      каждой роли и по каждому языку.
      (б) Слой образца подставляет обёртка, доступная только гейтам: тестовая функция Go и тестовая
      библиотека шелла. Общие читатели `stacks.sh` и `deployStacks` возвращают строку таблицы
      дословно. Держатель — проба «`stacks.sh --args prod` = строка `prod:` таблицы». Инъекция —
      слой в общем читателе — красная.
      (в) Инъекция Д48 «слой снят у одного гейта» проводится и на шелл-гейте, и на задании CI, а не
      только на гейте Go.
    held_by: "перепись D2 — есть в маршруте, объём нужно расширить (заказ); проба «общий читатель без слоя» — нужна, её нет (заказ)"
  - id: CX1-87
    status: unmapped
    decision: "Д48, З28: образец узла для рендера `prod` — «узел целиком в форме узла `values.dev.yaml` (Д47)»; D1: «образец узла … слой из тестовой фикстуры гейта целиком (все пять полей)»"
    class: "code-authoring §«Умолчание, которое становится утверждением» (фикстура, выбранная по удобству, утверждает то, чего оператор не задаёт); gate-authoring — фикстура не снисходительнее продукта и не строже его"
    finding: >-
      Страж зонтика `identity-mail-lane-guard.yaml` безусловен и стоит на обеих базах. Узел «в форме
      `values.dev.yaml`» — это адрес приёмника релиза и якорь его секрета. На `prod` приёмник выключен
      (`mailpit.enabled: false` в `values.yaml`). Замер `helm template` на origin/1276 (зависимости —
      локальные чарты, `helm dependency build --skip-refresh`):
      `prod` без слоя — rc 0, 186 объектов.
      `prod` + образец формы `dev` — rc 1, страж (6) «полоса названа на приёмник, но приёмник
      ВЫКЛЮЧЕН».
      `prod` + внешний адрес с якорем `kacho-mailpit-tls` — rc 1, страж (7) «якорем назван секрет
      приёмника стенда».
      `prod` + внешний адрес без якоря, с отправителем — rc 0, 186 объектов.
      Гейт с образцом по букве замысла красен до первой строки notify. Если «починить» его
      `mailpit.enabled: true` в том же слое, на `prod` появляются стендовые объекты, и I04 («вне
      `prod`») нарушается по построению.
    condition_to_design: >-
      (а) Образец — форма узла ОПЕРАТОРА, а не стенда. Адрес — внешнее имя, не оканчивающееся
      суффиксом приёмника релиза. Якоря нет (корневое хранилище) либо он назван секретом, отличным
      от `mailpit.tlsSecretName`. Пара «имя в адресе ⇔ `credentialSecret`» либо целиком, либо
      отсутствует. `fromAddress`, `fromName` заданы. `mailpit.*` образец не трогает.
      (б) Образец объявлен в ОДНОМ фикстурном файле, общем для всех гейтов обхода (по CX1-86 (б)), а
      не копией в каждом гейте: пять полей в N копиях разойдутся.
      (в) Держатель — проба D2: рендер `prod` + образец проходит через страж зонтика, и число
      объектов вне notify равно рендеру без образца. Близнец-отрицание — образец формы `dev` →
      отказ стража (6) с именем приёмника. Эта инъекция доказывает, что проба судит форму образца.
    held_by: "проба D2 «образец проходит страж зонтика» — нужна, её нет (заказ)"
  - id: CX1-88
    status: unmapped
    decision: "Д49, §11 «Д49», Е13, D2: предикат старта — `gh issue view 1276 … state` → `CLOSED` И `git cat-file -e <база>:deploy/helm/umbrella/values.fe3455-identity-posture.yaml` → 0"
    class: "measurement-discipline §«Чужое измерение и чужое заявление» (посылка «#1276 правит профиль identity-posture» принята на слово); gate-authoring — предикат, не способный ответить «да»"
    finding: >-
      Файл `values.fe3455-identity-posture.yaml` не производится `kacho#1276`. Его ввело
      переименование `#2759` (коммит 689bb77e848) на ветке волны-4 `origin/2798`@96e2fa72b3a.
      Изменение `kacho#1276` (origin/1276@3af063bd6f3, наследник 2798) его УДАЛЯЕТ (−195 строк) и
      снимает его слой со строки `fe3455` в `deploy/stacks.txt`. Строка становится
      `values.prod.yaml,values.fe3455.yaml,values.fe3455-prod.yaml`. Коммит говорит это прямо:
      «профиль его посадки values.fe3455-identity-posture.yaml и его слой в строке fe3455». Задача
      kacho#1276 сейчас OPEN. Конъюнкция «задача закрыта вливанием» ∧ «файл на базе есть» после
      вливания ложна всегда. До вливания ложна первая половина. Полоса D2 не стартует ни при каком
      состоянии дерева. Порядок Д49 при этом верен: `kacho#1276` правит `values.fe3455.yaml` и
      строку `fe3455`, которые правит и D2.
    condition_to_design: >-
      (а) Второе условие предиката — след изменения `kacho#1276` на базе, проверяемый исходом, а не
      именем файла, который оно снимает. Годятся: «строка `fe3455:` в `deploy/stacks.txt` базы не
      называет слоя `*-posture.yaml`, и файлов `values.fe3455-*-posture.yaml` на базе 0» либо
      `git merge-base --is-ancestor <коммит слияния запроса #1276> <база>`. Близнец — база
      origin/1276 → условие истинно. Отрицание — база origin/2798 → ложно.
      (б) Первое условие читает не только `state`, но и `stateReason` = `COMPLETED`: задача, закрытая
      как «не будет сделано», вливания не означает.
      (в) Абзац «Узел стенда» З28, строка §0 «Д49» и Е13 называют профилем `fe3455` то, что есть на
      базе после `kacho#1276`: `values.fe3455.yaml` и `values.fe3455-prod.yaml`. Сейчас они называют
      снимаемый файл.
    held_by: "предикат старта D2 — строка маршрута; проба предиката на двух базах (близнец и отрицание) — нужна, её нет (заказ)"

