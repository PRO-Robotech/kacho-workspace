items:
  - id: CX1-73
    decision: "Д33 — запись реестра: генерируемая функция `resource-event` формы `fanout` над `<svc>_notification_outbox`"
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (формулировка инварианта); doc-truthfulness — два места об одном предмете"
    exposure: >-
      Новая запись оговаривает правило («единственное исключение из … И31, CX1-64 (а), УК87»), но
      само правило об исключении не знает. Без оговорки остались: З5 «SQL-функции постановки нет …
      ни функции, ни процедуры, ни триггера» и довод «функция базы либо обходила бы сторожа, либо
      дублировала» (флаг «база его не знает» — у `fanout` база его знает настройкой
      `kacho_feed.enabled`, З10–З11 NTF-3); З7 шаг 5 «SQL-функций, пишущих таблицы ленты, в миграциях
      0»; И31; УК87 (а) и его держатель в C6; §12 «не заводит SQL-функции постановки»; §13 «выбор
      CX1-64 (а)»; Е10 «такой функции нет и не будет». После полосы NTF-3 гейт печатает «SQL находок 0»
      при N признанных функциях, а И31 «функций нет» ложно. Исполнитель C10 или N10, прочитав И31,
      строит гейт, которому признавать нечего
    condition: >-
      (а) И31, УК87 (а), З7 шаг 5 и З5 формулируют инвариант с оговоркой одной фразой, одинаковой
      во всех местах: «кроме функций, признанных записью реестра З16 (Д33)». Альтернатива —
      ссылка на эту запись. (б) Довод З5 о пяти сторожах для формы `fanout` отвечает по каждому
      сторожу или прямо ссылается на таблицу «Сторожа `Put` и функция базы» З10 NTF-3. Д33-абзац
      сейчас называет три сторожа из пяти (адресат, лимит/замки, секрет); флаг и форма атрибутов
      не названы. (в) Е10 переписан или снят: зависимость «функции постановки нет» заменена исходом
      Д33, предикат снятия выполним на одобренном отпечатке приёмки NTF-3 (NTF3-70 не меняется).
      (г) §12 и §13 говорят, что NTF-1 такой функции не заводит, а форму `fanout` генератору даёт
      NTF-3. (д) C6 «`notifygen init` на эталоне — в миграции нет `CREATE FUNCTION`» оговаривает,
      что эталон NTF-1 шаблона `resource-event` не несёт.
    held_by: >-
      Держится вниманием автора замысла и ревью замысла: гейта на согласованность формулировок
      инварианта в документе нет и не будет. Предикат для ревью —
      `grep -n -E 'SQL-функц|функции постановки|нет и не будет' design.md`: каждая нормативная
      строка несёт оговорку либо ссылку на Д33
  - id: CX1-74
    decision: "Д33 — предикат снятия записи: «число функций `resource-event` в выводе `notifygen -check -list` по дереву kacho; ноль — гейт красный»"
    class: "gate-authoring §«Самоистечение послаблений»; code-authoring §«Инвариант и оснастка — это тоже прод-код»; measurement-discipline §«Форма числа» (единица)"
    exposure: >-
      (1) Область. Реестр живёт в самом гейте в corelib (З16, CX1-43 (а)), а `AuditFeedTableWrites`
      исполняется по трём деревьям: corelib (C10), kacho (N10), kaname (K7). Если гейт исполняет
      предикат по дереву, которое судит, то в corelib и kaname ноль, запись «пуста», гейт красный на
      законном дереве. Если предикат жёстко берёт дерево kacho, то прогон в corelib и kaname зависит
      от чужого дерева. (2) Единица. `-check -list` по NTF1-D01 печатает множество ФАЙЛОВ («путь от
      корня дерева на строку»); функций в нём нет. Предикат, считающий функции по этому выводу,
      либо читает ноль всегда (запись вечно «пуста», гейт красный), либо на деле считает файлы
      миграций. Расширение вывода `-list` — правка формы, которую держит проба D01 («равенство в обе
      стороны» с записанными файлами). (3) Порядок. Запись и форма генератора — правка corelib в
      полосе NTF-3; тег corelib с записью и подъём пина kacho вместе с миграциями функций обязаны
      сойтись одним изменением kacho, иначе самоистечение красит kacho в промежутке.
    condition: >-
      (а) Запись реестра несёт область — дерево (модуль), к которому применяется. В остальных
      деревьях она не признаёт ничего и не краснеет самоистечением. Гейт печатает по каждому
      дереву число применимых записей. (б) Предикат снятия назван в единице, которая есть в выводе
      производителя: либо отдельная строка или флаг генератора, перечисляющий признанные функции
      по журналам (при этом проба D01 «`-list` = записанные файлы» не меняется), либо число
      сгенерированных определений функции, найденное гейтом по идентичности генератора, а не по
      файлу. Второй вариант — через тот же эталон, что CX1-75. (в) В маршруте NTF-3 названо, что
      тег corelib с записью, подъём пина kacho и миграции функций входят в одно изменение kacho.
      (г) Инъекция: запись с областью kacho на дереве kaname → гейт зелёный, применимых записей 0;
      на дереве kacho без функций → красный с именем записи.
    held_by: "нужен гейт — строка C10 (добавить инъекции (г)); строки K7/N10 печатают число применимых записей; порядок (в) — заказ автору NTF-3"
  - id: CX1-75
    decision: "Д33 — признание (а) «тело побайтно равно выводу `notifygen init` для этого журнала» и (в) «на журнал модуля она одна»"
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения во времени; версии); gate-authoring §«Производитель входа и захват реального сообщения»"
    exposure: >-
      (1) Эталон. По NTF1-D03 повторный `init` на службе с лентой даёт «изменений 0», и новую
      миграцию `init` пишет только при смене версии схемы (D04). Поэтому «вывод `notifygen init` для
      журнала» у существующей службы — пустое множество, и сравнивать тело не с чем. (2) Версии.
      Тело функции зависит от `Mapping` модуля (З10 NTF-3, шаг 2 — «сгенерированной таблицей из
      `Mapping`») и от `schema_rev` шаблона, а не от версии схемы ленты. Добавленный вид меняет тело
      без смены версии схемы. Новое тело — новая миграция `CREATE OR REPLACE`. Прежнее тело в
      применённой миграции не правится (ban #5) и побайтно уже не равно текущему выводу: признание
      (а) красит законное дерево. (3) Единица (в). Два определения одной функции в двух миграциях —
      одна функция на журнал, но «одна» по операторам `CREATE` даёт 2 и красный. (4) Правило, когда
      генератор пишет новое тело при смене `Mapping`, в З5 (NTF-1) не записано, а форму отдаёт
      NTF-3.
    condition: >-
      (а) Эталон признания — функция генератора, отображающая `(журнал, Mapping, schema_rev,
      версия формы)` в тело. Ту же функцию зовёт `notifygen -check`; копии шаблона в гейте нет. Тела
      выпущенных версий формы генератор держит так же, как версии схемы ленты (встроенные, по
      отпечатку, D04). (б) Единица (в) — идентичность функции (схема, имя, журнал), а не оператор
      `CREATE`. Действующее определение — последнее по порядку миграций, и оно равно текущему
      выводу генератора. Прежние определения в применённых миграциях равны одной из выпущенных
      версий. Правка байта в любом из них — красный. (в) Когда генератор пишет новую миграцию при
      смене `Mapping` без смены версии схемы — решение полосы NTF-3. NTF-1 З5 называет, что `init`
      и `-check` исполняют его, и D03 «повторно — 0» остаётся верным при неизменном `Mapping`.
      (г) Близнец: две миграции — v1 тела и `CREATE OR REPLACE` после добавления вида — зелёный,
      функций на журнал 1. Инъекции: правка байта в прежнем определении → красный; действующее тело
      отстаёт от `Mapping` → красный `-check` и гейта.
    held_by: "нужен гейт — строка C10 (близнец и инъекции (г)); эталон (а) — проба генератора C6 и полоса NTF-3; правило (в) — заказ автору NTF-3"

