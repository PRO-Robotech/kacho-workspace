# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 11 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта по Д33: судится одна правка редакции 11
# против последней разобранной редакции 10 (bd526f8a…, запись revalidation/bd526f8a….yaml, итог
# «к коду»). Предмет дельты — коммит 979c2f876: design.md +20/−1 (шапка, запись реестра
# исключений З16), tasks.md +1/−1 (строка C10), change.yaml +4/−1. Пункты CX1-01…72 и условия
# УК1…УК94 эта запись не пересуживает; она проверяет, что новая запись реестра с ними сходится.
#
# Итог — к замыслу. Запись реестра по Д33 выбрана верно: довод З10 замысла NTF-3 проходит по
# всем пяти сторожам `Put` (флаг, форма атрибутов, адресат, секрет, окно). Держатель (а)–(в) с
# инъекциями и близнецом годится как основа. Но дельта вносит три новых пункта, и замысел их не
# отображает:
#   CX1-73 — инвариант «SQL-функции постановки нет» остался без оговорки в шести нормативных
#     местах замысла (З5, шаг 5 З7, И31, УК87 (а), §12, §13 с Е10). Е10 утверждает «такой функции
#     нет и не будет», и его предикат снятия после Д33 невыполним.
#   CX1-74 — область записи и единица её предиката снятия. Запись лежит в реестре гейта corelib,
#     а гейт исполняется в трёх деревьях (C10, N10, K7). Предикат при этом назван «по дереву kacho»
#     и считает «функции в выводе `-check -list`», хотя этот вывод по NTF1-D01 — множество ФАЙЛОВ.
#   CX1-75 — эталон побайтного равенства (а) и единица «одна на журнал» (в). По NTF1-D03 повторный
#     `init` даёт 0 изменений, поэтому «вывод `notifygen init` для журнала» у службы с лентой пуст.
#     Тело функции зависит от `Mapping` модуля и меняется без смены версии схемы. Прежнее тело в
#     применённой миграции (ban #5) и определение `CREATE OR REPLACE` в новой при такой
#     формулировке дают красный на законном дереве.
# Новых внешних вызовов, асинхронных путей и sentinel дельта не вводит. Возврата в приёмку NTF-1 не
# даёт. Д34 (NTF-3, позиции `seen_up_to`) предмета в этом замысле не имеет: `seen`, `position`,
# `up_to` в design.md — 0 совпадений.
