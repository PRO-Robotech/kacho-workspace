items:
  - id: CX1-91
    status: unmapped
    decision: "CX1-89 (б), З28 «Шелл-обёртка — читатель состава стендов», §11 CX1-89, tasks.md D9: инъекция теряющей формы — «копия шелл-гейта … в обходе гейта → TestRosterReaderExitCodeIsNotLostByTheConsumingForm красный»"
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения» (у гейта кода отказа два файла, маршрут называет один); gate-authoring — инъекция настоящим входом из дерева в ту же функцию, что судит дерево"
    finding: >-
      `rosterReaderTexts` строит обход из `treecorpus.NewTree(root)`, а та — из `git ls-files`
      (corelib v1.10.0-rc.5, `treecorpus/tree.go:50–65`). Обход пропускает `.go` и `testdata/`. Копия
      шелл-гейта, не внесённая коммитом, в обход не попадает. Внесённая в `testdata/` отсекается.
      Внесённая иначе — краснит ствол. Держатель, названный в §11 и D9, в названном тесте
      неисполним. Инъекции этого гейта живут в
      `internal/repohygiene/rosterreaderexitcode_injection_test.go`: `TestRosterReaderGateRedsOnTheRealPreFixText`
      и `TestRosterReaderGateIsSilentOnTheLegalTwin` подают `AuditRosterReaderExitCodes` отображение
      «путь → текст». Норма файла: вход — настоящий текст из git по прибитому отпечатку, а не
      выписанный от руки. Настоящей теряющей формы с обёрткой в истории нет, её не было ни разу.
      Значит, вход инъекции — настоящий текст файла D9 (`render-chain-wrapper-test.sh` либо
      шелл-гейт, переведённый на обёртку), в котором присваивание переписано в теряющую форму.
      Близнец — тот же текст без правки. Файла инъекций в путях D9 нет.
    condition_to_design: >-
      (а) Путь `internal/repohygiene/rosterreaderexitcode_injection_test.go` — в путях D9 и в §11
      CX1-89. (б) Держатель инъекции — функция этого файла на `AuditRosterReaderExitCodes`, а не
      `TestRosterReaderExitCodeIsNotLostByTheConsumingForm`. Вход — текст файла дерева, зовущего
      обёртку, прочитанный с диска, с присваиванием, переписанным в форму `helm template … $(<обёртка>
      prod)`. Ожидание — находка формы «аргумент helm/kubectl» с именем обёртки в тексте находки. (в)
      Близнец — тот же текст без правки: строк-потреблений > 0, находок 0. Если текста с обёрткой на
      диске нет (путь переименован) — `t.Fatalf` «НЕ ВЫПОЛНИЛОСЬ» с путём, а не молчание.
    held_by: "гейт кода отказа и его файл инъекций — есть в дереве; путь файла инъекций в D9 не назван (заказ)"

notes:
  - id: N9
    blocking: false
    where: "З28 «Шелл-обёртка — читатель состава стендов» (а); tasks.md D9"
    text: >-
      `rosterReaderRe` узнаёт читателя по имени функции либо по форме `stacks.sh --…`. Условие (а)
      вносит только имя функции. Если `render-chain.sh` можно исполнить как скрипт
      (`bash …/lib/render-chain.sh prod`), вызов по пути мимо списка имён пройдёт. Два исхода:
      (1) файл — только библиотека, без точки входа, её подключают через `source`, и проба D9 это
      утверждает; (2) форма пути `render-chain\.sh"?\s` входит в `rosterReaderRe` тем же изменением.
      К коду: решает полоса D9, фиксирует её проба
  - id: N10
    blocking: false
    where: "З28 «Слой учётных данных fe3455»; tasks.md D2 (`cutover-creds-layer.sh`)"
    text: >-
      На origin/1276 комментарий у перечня (`cutover-fe3455.sh:186–208`) и текст отказа проверки
      (`:233`, «CRED_PATHS in this script») называют перечень частью скрипта раскатки, а гейт —
      «падающим, когда этот список…». После переноса в `cutover-creds-layer.sh` и опустошения
      перечня обе фразы станут ложными о своём предмете. К коду (doc-truthfulness): переносятся и
      правятся тем же изменением D2
  - id: N11
    blocking: false
    where: "запись NTF-2 docs/changes/issue-2917/reviews/class-exposure/initial/7a424030e0a984bc4bb73f8cf075de7fc5239c6fbf849092484032e9991097c4.yaml, orders «NTF-1 author»; З28 «Образец узла», D9, перепись D2"
    text: >-
      Заказ опубликован коммитом 93b3d8c32 — после редакции 20 (d46866f50). Его пункты: обёртка D9
      принимает образец параметром, перепись D2 считает гейт со слоем по вызову обёртки (CX2-58 (а),
      (г)); «пустой перечень → 0 объектов notify» пробой с инъекцией (CX2-60 (б)); текст `required`
      называет оба выхода (CX2-57 (в)). Первый пункт меняет решение З28 «один фикстурный файл
      образца». Это предмет сверки параллельных полос одного механизма. В перечень пунктов этого
      замысла он не входит и одобрение c9a81b71 не блокирует. Принять, отклонить с доводом или
      записать исход автор NTF-1 решает в следующей редакции. Если редакция будет, новая пересверка
      обязана проверить, что исход записан

