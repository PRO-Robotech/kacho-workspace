# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 20 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 19
# (2118fbb9…, запись revalidation/2118fbb9….yaml, коммит f8a925e3e, итог «к замыслу»: CX1-89,
# CX1-90; N6–N8 не блокируют). Дельта — коммит d46866f50 (отображение CX1-89, CX1-90, N6–N8;
# М41, М42). Пункты CX1-01…88 и условия УК1…УК94 эта запись не пересуживает.
#
# Итог — к замыслу. CX1-90 и N6–N8 отображены, и отображение выдерживает условия пунктов. М41
# воспроизведён (Helm v4.2.4), М42 сверен с деревом. CX1-89 отображён в (а) и (в), но держатель
# (б) исполнить нельзя — один новый пункт:
#   CX1-91. Инъекция CX1-89 (б) по замыслу — «копия шелл-гейта … в обходе гейта →
#   TestRosterReaderExitCodeIsNotLostByTheConsumingForm красный». Но этот тест читает
#   отслеживаемый индекс (`treecorpus.NewTree` → `git ls-files`) и пропускает `testdata/`.
#   Копия, не внесённая коммитом, в его обход не попадает, а внесённая краснит ствол. Инъекции
#   гейта живут в другом файле — `internal/repohygiene/rosterreaderexitcode_injection_test.go`
#   (`AuditRosterReaderExitCodes` на отображении «путь → текст», вход — настоящий текст из git).
#   В путях D9 этого файла нет. Это тот же класс, что CX1-90: у механизма два файла, а маршрут
#   называет один.
# Заметки: N9 — вызов обёртки по пути скрипта минует список имён (к коду). N10 — комментарии и
# текст отказа у CRED_PATHS называют «этот скрипт» (к коду). N11 — заказ NTF-1 из первичного
# разбора NTF-2 (7a424030, CX2-58, CX2-60, CX2-57 (в)) пришёл после редакции 20 и в ней не
# отображён; одобрение этого отпечатка он не блокирует. Возврата в приёмку нет.
