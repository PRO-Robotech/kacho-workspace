mapping_check:
  - id: CX1-69
    design: "З24 (строки 1168–1225, проба N7 1255–1261), §1 М32, §3 И35, §6 (строки 1632–1637), §8, §11 строка 1778, §13 Е6"
    verdict: holds_except_new_item
    note: >-
      (а) строка §11 есть; (б) собственная короткая транзакция из трёх операторов — `SET LOCAL
      lock_timeout`, `LOCK TABLE recipient_key_fence IN EXCLUSIVE MODE`, запись — и коммит; довод о
      взаимной блокировке верен (транзакция записи до замка ничего не держит, резерв берёт ограду
      первым оператором); право: роль без владения с `SELECT, INSERT, UPDATE` берёт замок, без
      `UPDATE` — `permission denied` (М33, контроль в обе стороны) — исполнено; (в) предел —
      `lock_timeout` из константы, исход `55P03` — откат, ограда прежняя, отказ старта с записью в
      журнал без ключа и отпечатка — исполнено по форме; (г) довод «ожидание короткое» заменён
      замером М32, воспроизведение приложено — исполнено. Не выдерживает довод, которым выбрана
      ВЕЛИЧИНА предела (строки 1190–1193): «транзакция резерва … в замере М32 (в) длится
      миллисекунды. Поэтому предел превышает ожидание законных резервов на порядки и срабатывает
      только при постороннем держателе замка». Резерв М32 — чтение ограды и `pg_sleep(0.02)`, без
      сетки и без потолка потока; резерв З24 обновляет строку `global_daily` одной на сутки, и
      задержка резерва, а с ней ожидание `LOCK TABLE`, растёт с числом одновременных резервов (М33) —
      это пункт CX1-70. Проба N7 для (б) наследует ту же подмену, если её резерв — не транзакция
      резерва З24
  - id: "УК92"
    design: "З10 строки 630–632, 669; З16 строки 872–897, инъекции 914–926; §11а строки 1884, 1886"
    verdict: holds_except_conditions
    note: >-
      (а) результат `Of` — аргумент `Sprintf` с литеральной или константной форматной строкой,
      нелитеральная — находка — исполнено; (б) один вызов `Of` на вид в одном `Sprintf`, повтор —
      `%[n]s`, второй вызов — находка, инъекция есть — исполнено; (в) ведомость — мультимножество
      мест с видами на функцию-владельца, литерал по первому слову не классифицируется, оператор
      возврата З10 — одно место с видами лента, вклад, окно, мест окна три, близнец с `WITH` — исполнено.
      Не выдерживают два места, оба на исправном дереве той формы, которую З10 сам называет:
      (1) владелец места — `*types.Func`, а `retention.Subject.Sweep` — поле-функция
      (`SweepFunc`, corelib `retention/retention.go:76`), и оператор уборки прошедших окон и закрытых
      строк естественно пишется литералом функции внутри `feed.RetentionSubjects`; у литерала объекта
      `*types.Func` нет — гейт либо пропускает место (мест окна 2 при трёх в ведомости или молчаливый
      недобор), либо падает — условие УК93; (2) `retention.Subject.Name` — «совпадает с именем
      таблицы», пустое и повторное отвергает `retention.New` (строки 205–214); образцы corelib кладут
