# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 7 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. По Д22 судится ТОЛЬКО дельта редакции 7 против последней разобранной
# (редакция 6, 06397390…, запись revalidation/06397390….yaml). Предмет дельты — `git diff b746239d5
# b3ba899f4 -- docs/changes/issue-2915/design.md` (+130/−52): отображение CX1-69 (З24 запись ограды
# под табличным замком, предел `limits.FenceLockTimeout`, отказ старта; §1 М32; §3 И35; §6; §8; §11
# строка CX1-69; §13 Е6) и УК92 (З10 две фразы о месте `Sprintf`, З16 единица «место оператора»,
# инъекции C10, §11а УК90 и УК92). Пункты CX1-01…68 и их отображения этой записью не пересуживаются.
# Итог: CX1-69 отображён, (а), (б), (г) выдерживают; УК92 отображён. Не выдерживают три места.
# (1) Предел `FenceLockTimeout = 5s` обоснован доводом «транзакция резерва длится миллисекунды, предел
# превышает ожидание законных резервов на порядки и срабатывает только при постороннем держателе»
# (З24). Довод снят с замера М32 (в), где резерв — только чтение ограды и пауза. Настоящий резерв
# З24 обновляет одну строку `global_daily` на сутки — все резервы всех реплик идут через неё
# последовательно, и замер М33 даёт ожидание `LOCK TABLE`, равное задержке резерва и растущее с числом
# одновременных резервов: 29 мс при 16, 100 мс при 64, 140 мс при 90. Предел срабатывает от законной
# нагрузки, как только одновременных резервов больше, чем «предел × темп коммитов строки
# `global_daily`»; `notify.workers` до 256 на реплику, число реплик не ограничено. Исход по пределу —
# отказ старта, и ротация под нагрузкой снова не сходится, только громко. Новый пункт CX1-70.
# (2) УК92 (в) адресует место функцией-владельцем `*types.Func`, а у литерала функции его нет: уборщик
# `retention.Subject.Sweep` — поле-функция (corelib), и оператор уборки естественно пишется в литерале
# внутри `feed.RetentionSubjects` — условие УК93. (3) `retention.Subject.Name` corelib обязан совпадать
# с именем таблицы и отвергается пустым и повторным; два предмета ленты заполняют его результатом
# `tablename.Of` — это присваивание полю, находка УК90 (а) на исправном дереве, а строковый литерал
# с суффиксом — находка УК89 (а) — условие УК94. Возврата в приёмку дельта не даёт; NTF1-L03 записи
# 9bfa92be в силе (приёмка не менялась, 29cfa368…). Права писать реализацию эта запись не даёт.
