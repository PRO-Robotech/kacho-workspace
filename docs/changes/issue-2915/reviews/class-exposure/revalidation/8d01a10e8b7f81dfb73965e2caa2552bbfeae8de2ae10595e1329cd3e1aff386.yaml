items:
  - id: CX1-70
    decision: >-
      З24, редакция 7: предел ожидания записи ограды `lock_timeout` = константа
      `limits.FenceLockTimeout = 5s`, ручки нет (§8); исход по пределу — отказ старта ненулевым кодом;
      обоснование величины — «транзакция резерва сетевых вызовов не содержит, и в замере М32 (в) она
      длится миллисекунды. Поэтому предел превышает ожидание законных резервов на порядки и
      срабатывает только при постороннем держателе замка» (строки 1190–1193)
    class: >-
      code-authoring §«Умолчание, которое становится утверждением» (константа предела выбрана на
      доводе, снятом с другого режима, и её срабатывание утверждает «посторонний держатель»);
      §«Решение и его следствие разнесены» (темп производителя — число одновременных резервов — и
      темп применения — коммиты одной строки `global_daily` — разведены, а предел судит только
      первое); measurement-discipline §«Чужое измерение и чужое заявление» (замер М32 снят на
      резерве без сетки и потолка)
    exposure: >-
      Транзакция резерва З24 — ограда, сетка `recipient_net` и потолок потока `global_daily`
      (строки 1150–1152, 1207–1208, 1274–1275). Строка `global_daily` одна на сутки, и все резервы
      всех реплик обновляют её по очереди: задержка резерва равна числу одновременных резервов,
      делённому на темп коммитов этой строки. `LOCK TABLE … EXCLUSIVE` ждёт все резервы, держащие
      `ROW SHARE` ограды, в том числе стоящие в очереди к `global_daily`, — ожидание записи равно
      задержке резерва и растёт линейно (М33: 29 мс при 16, 100 мс при 64, 140 мс при 90
      одновременных резервах, темп 560–610 резервов в секунду на локальном диске). Предел 5 с
      достигается законной нагрузкой при одновременных резервах больше «5 с × темп коммитов строки»:
      `notify.workers` до 256 на реплику, реплик не ограничено, а темп коммитов строки — величина
      диска базы (задержка `fsync`). Исход по пределу — отказ старта; реплика перезапускается и
      снова ждёт тот же поток, ротация под нагрузкой не сходится — тот же исход, что закрывал
      CX1-69, только громкий. Журнал «замок не получен за предел» при этом называет причиной
      постороннего держателя, которого нет. Проба N7 этого не видит, если её поток резервов —
      не транзакция резерва З24 (М32 (в) — чтение ограды и пауза)
    condition: >-
