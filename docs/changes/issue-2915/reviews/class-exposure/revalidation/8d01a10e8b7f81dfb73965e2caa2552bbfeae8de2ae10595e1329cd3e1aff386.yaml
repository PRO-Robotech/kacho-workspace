      кладут туда `tablename.Of(…)` — присваивание полю, находка УК90 (а), — либо литерал с суффиксом
      таблицы — находка УК89 (а), — либо расходятся с договором поля corelib — условие УК94
  - id: "УК90"
    design: "§11а строка 1884"
    verdict: holds
    note: "условие переписано последней формой УК92 со ссылкой на обе записи; снятая форма «литерал начинается глаголом» названа снятой — исполнено; противоречие с `Subject.Name` — УК94"

