items:
  - id: CX1-99
    status: unmapped
    decision: "З28 «Узел почты → ключ процесса», абзац «Ожидаемый путь — константа на ногу»: «имя чарта `notify` в `deploy/helm/notify/Chart.yaml`, в зонтике без алиаса»; §1 М46 («подчарта (имя чарта либо алиас зависимости)»); §11 CX1-98 (г); tasks.md D1, D2 (пути)"
    class: >-
      code-authoring §«Контракт, который нельзя выразить» (путь подчарта в зонтике выражается двумя
      способами — именем чарта либо алиасом зависимости, и какой из двух действует, решает файл, у
      которого нет владельца); code-authoring §«Умолчание, которое становится утверждением»
      («без алиаса» — умолчание helm, принятое за решение замысла, но не записанное ни одной полосой);
      .claude/rules/testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить
      проверкой предпосылки» п.7 (у ноги зонтика есть предпосылка «notify в рендере копии», но нет
      записи, которая её создаёт)
    finding: >-
      (1) Нога зонтика и её константа `kacho-umbrella/charts/notify/templates/configmap.yaml` требуют,
      чтобы notify входил в рендер зонтика. Чарт notify лежит в `deploy/helm/notify/`, вне
      `deploy/helm/umbrella/charts/`, поэтому в рендер он попадает только записью в `dependencies`
      файла `deploy/helm/umbrella/Chart.yaml` (`repository: file://../notify`). Шапка этого файла на
      origin/2564 запрещает другой путь — вендоренный каталог в `charts/`, объявленный зависимостью
      (двойная копия, гейт `internal/repohygiene/subchartdup_test.go`). (2) Ни одна полоса tasks.md
      редакции 26 не называет `deploy/helm/umbrella/Chart.yaml` в путях: `grep -c 'Chart' tasks.md` → 0.
      D1 правит `deploy/helm/notify/**`, D2 — шаблоны и файлы значений зонтика. §12 отдаёт `#2915`
      `deploy/helm/umbrella/**` целиком, но полосы внутри не называют. (3) Замер этой записи, helm
      v4.2.4, синтетический зонтик `kacho-umbrella` с зависимостью `file://../notify`: без алиаса —
      `# Source: kacho-umbrella/charts/notify/templates/configmap.yaml`, с `alias: notifyx` —
      `execution error at (kacho-umbrella/charts/notifyx/templates/configmap.yaml:6:8)`. «Без
      алиаса» — посылка константы, а соседние записи зонтика её не подсказывают: у зависимостей `postgresql` алиасы есть (девять на origin/2564), у семи file://-зависимостей нет. (4) На ту же запись опирается
      NTF-2: design.md NTF-2, строка 4 таблицы — «принадлежность объекту чарта `notify` определяет
      одна функция по сегменту имени зависимости из `Chart.yaml`». Запись о зависимости — контракт
      двух изменений, а производителя у неё нет. Громкость есть: без записи опора ноги зонтика не
      рендерит notify, и исход — «НЕ ВЫПОЛНИЛОСЬ», а не ложный зелёный. Но так проба D1 не
      проводится вовсе, и полоса узнаёт о недостающей записи только на прогоне
    condition_to_design: >-
      (а) Полоса-владелец записи `notify` в `deploy/helm/umbrella/Chart.yaml` названа, и путь стоит в
      её путях tasks.md. Естественный владелец — D1: она заводит чарт, и её проба ноги зонтика без
      этой записи не проводится. (б) Форма записи названа в З28: `name: notify`,
      `repository: file://../notify`, версия чарта D1, **без `alias`** и без `condition`. Шаблоны
      notify рендерятся только при непустом перечне (NTF1-N04), поэтому второй включатель был бы
      вторым написанием одного решения. (в) Держатель посылки «без алиаса». Можно так: опора ноги
      зонтика печатает строку `# Source:` объекта `ConfigMap` notify и сверяет её с той же константой
      на равенство. Путь не равен — «НЕ ВЫПОЛНИЛОСЬ» с фактическим путём, инъекция — алиас в
      `Chart.yaml` копии. Тогда посылку держит тот же прибор, что и отрицание, а не отдельная
      проверка. (г) Строка NTF-2 о «сегменте имени зависимости» ссылается на эту запись как на
      производителя (Е12 новым пунктом либо ссылкой в (4)–(6)), чтобы смена имени или появление
      алиаса правили обе стороны одним изменением
    held_by: "нужен гейт — сегодня посылку держит только то, что автор D1 не поставит алиас; громкий исход «НЕ ВЫПОЛНИЛОСЬ» есть, производителя записи нет"

notes:
  - id: N23
    blocking: false
    where: "З28 «Читатели узла вне notify — закрытый перечень исключений» («База полосы — ветка, в которую полоса вливается (ветка эпика `2564`)»); §13 Е12 (10); tasks.md D2"
    text: >-
      Ветка вливания полосы при форме «волна — единица запроса» — это ветка волны: проверки гонятся на
      сведённой ветке, а в `2564` уходит один запрос на всю волну. NTF-2 tasks.md говорит так же —
      «перемеряет … на базе запроса волны». Если D2 NTF-1 и D1 NTF-2 в одной волне, предикат
      «D2 влита в `2564`» ложен у обеих, а сведённая ветка несёт обе. Тогда исход (iii) красит прогон
      сведённой ветки: строки kaname в перечне есть, объектов нет. Громко, держатель есть. К коду и
      к посадке: «ветка вливания» — ветка, на которой гонится проба (сведённая ветка волны либо `2564`),
      а предикат «влита» — `git merge-base --is-ancestor <коммит D2> <эта ветка>`
    predicate: "git merge-base --is-ancestor <коммит D2 NTF-1> <сведённая ветка волны или origin/2564> — на ветке прогона пробы образца"

