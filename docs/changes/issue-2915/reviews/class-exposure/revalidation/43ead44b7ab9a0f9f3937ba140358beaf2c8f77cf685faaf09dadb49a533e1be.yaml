# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 25 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 24
# (954a71a8…, запись revalidation/954a71a8….yaml, коммит 2b9142be1, итог «к замыслу»: CX1-98;
# N21, N22 не блокируют). Дельта — коммит 220b5f9d9: отображение CX1-98, N21, N22, замер М46,
# перемер М45. Пункты CX1-01…97 и условия УК1…УК94 эта запись не пересуживает.
#
# Итог — к замыслу, один новый пункт. CX1-98 (а)–(д), N21 и N22 отображены и выдерживают, N22 — с
# заметкой N23. Новый пункт CX1-99: константа пути ноги зонтика (CX1-98 (г)) собрана из «имени
# подчарта без алиаса». Имя подчарта в пути задаёт запись `notify` в зависимостях
# `deploy/helm/umbrella/Chart.yaml`, а этот файл не назван в путях ни одной полосы tasks.md. Замер
# этой записи (helm v4.2.4): зависимость `file://../notify` с алиасом `notifyx` даёт путь
# `kacho-umbrella/charts/notifyx/templates/configmap.yaml`. Решение «без алиаса» — посылка
# константы, и держать её никто не назначен. На ту же запись опирается NTF-2: её распознаватель
# чарта notify берёт «сегмент имени зависимости из `Chart.yaml`».
# Возврата в приёмку нет.
