    verdict: holds
    evidence: >-
      Опора ноги без зонтика — тот же рендер `deploy/helm/notify` с файлом ноги и образцом целиком: код 0,
      и `KACHO_NOTIFY_SMTP_CONNECTION_URI` равен адресу образца. Она же положительный близнец:
      отрицание отличается от неё только `--set global.kacho.identity.smtp.connectionURI=null`
  - item: "CX1-98 (б)"
    verdict: holds
    evidence: >-
      Предпосылка выписана для ноги дословно: имя образца, файл значений, снятые ключи из аргументов
      `--set …=null`, исход опоры. Утверждение проводится только при «снят один ключ, опора — код 0 и
      ключ равен адресу». Отказ рендера в инъекции «снятый `required`» — «НЕ ВЫПОЛНИЛОСЬ» с путём и
      текстом, а не красный. Так закрыт случай (2) записи 954a71a8: чужой `required` того же шаблона
  - item: "CX1-98 (в)"
    verdict: holds
    evidence: >-
      Файл назван: `deploy/testdata/notify-standalone/values.yaml`, он в путях D1 (tasks.md). Узла почты
      в нём нет, и проба это печатает. Требование строже условия записи 954a71a8, которое допускало
      узел в файле: `--set …=null` снимает ключ из любого слоя (М43). Лишним оно не стало — делает
