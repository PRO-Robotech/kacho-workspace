# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 2 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. По Д22 судится ТОЛЬКО дельта редакции 2 против последней разобранной
# (редакция 1, 9bfa92be…, запись revalidation/9bfa92be….yaml). Предмет дельты — `git diff 01c6ea987
# 15d928ae4 -- docs/changes/issue-2915/design.md`: отображение CX1-58…62, условия УК71–УК74, ответ
# `Claim` длительностями, точка сохранения в `Put`, ключ окна с длиной окна, своя уборка закрытых строк
# и прошедших окон на петле `corelib/retention`, Е2 и Е7, замеры М20–М25. Пункты CX1-01…57 и их
# отображения этой записью не пересуживаются — они выдержаны записью 9bfa92be, и дельта их не трогает,
# кроме дописанных механизмов в строках CX1-10, 14, 16, 26, 27, 53, 57 §11 (судятся ниже).
# Итог: 5 из 5 новых пунктов прошлой записи отображены и выдерживают условие; УК71–УК74 исполнены.
# Дельта открыла один новый пункт — CX1-63: утверждение З7 «взаимной блокировки не дают» верно только
# между двумя `Put`; уборщик истечения берёт замки тех же строк окна в порядке плана и взаимно
# блокируется с `Put` (воспроизведено на PostgreSQL 16, жертва — транзакция вызывающего). Плюс три
# условия к коду на решения дельты (УК80–УК82). Возврата в приёмку дельта не даёт; возврат NTF1-L03
# записи 9bfa92be остаётся в силе (приёмка не менялась, 29cfa368…). Права писать реализацию эта запись
# не даёт.
