conditions_to_code:
  - id: УК80
    item: "CX1-57, УК71"
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного момента: `time.Time` с монотонным показанием и без него)"
    condition: >-
      `t_send`, `t_start` notify и момент возврата оператора на сервере ленты берутся `time.Now()` и не
      проходят через `.UTC()`, `.In()`, `.Local()`, `.Round()`, `.Truncate()` и сериализацию — каждое
      из них снимает монотонное показание, и вычитание молча становится разностью стенных часов (скачок
      NTP входит в срок аренды). Идиома дерева — ровно `time.Now().UTC()` (corelib@34bc8104a — 9
      не-тестовых вхождений, все в `operations/`; kacho@1d42a6728bf — 32). Если часы внедряются (З8
      «кольцо ключей и часы»), интерфейс часов отдаёт длительности (`Since`, `Until`, таймер), а не
      моменты для арифметики сроков
    held_by: >-
      модульная проба notify через управляемые часы: стенные часы прыгают назад на 1 ч между `Claim` и
      проверкой срока, монотонные — нет → крайний момент строки не сдвигается; инъекция — часы на
      `time.Now().UTC()` → проба красная. Без внедряемых часов — держится вниманием ревью диффа
  - id: УК81
    item: "CX1-59"
    class: "code-authoring §«Решение и его следствие разнесены» (срок хранения — у ленты, толкование отсутствия строки — у читателя предиката)"
    condition: >-
      утверждение З10 «срок хранения его [читателя `LimitRefundedPredicate`] не касается» верно только
      при `feed.ClosedRetention` не короче самого длинного окна, которое читатель судит через предикат:
      замысел NTF-2 (CX2-32) считает удалённую строку ленты НЕ возвращённой («момент считается»), и
      строка с возвращённым лимитом после уборки снова тратит лимит, если её окно у читателя ещё не
      прошло. Соотношение объявляется рядом с константой и проверяется: экспорт `feed.ClosedRetention`
      читается стражем старта (или пробой) читателя, сравнивающим его со своим самым длинным окном
    held_by: >-
      проба в kaname (NTF-2): самое длинное окно, судимое через `feed.LimitRefundedPredicate`, ≤
      `feed.ClosedRetention` на пине; инъекция — `ClosedRetention` короче окна → красная. Для текущих
      окон NTF-2 (сутки) против 168 ч условие выполнено; держится пробой, а не совпадением величин
  - id: УК82
    item: "CX1-59"
    class: "code-authoring §«Унификация и стоимость» (стоимость партии принадлежит проходу)"
    condition: >-
      выбор партии закрытых строк упорядочен по колонке частичного индекса: `… WHERE state <> 'pending'
      AND outcome_at < now() − $grace ORDER BY outcome_at, id LIMIT $batch`, а не `ORDER BY id`. Индекс
      `(outcome_at) WHERE state <> 'pending'` порядка по `id` не даёт: каждая партия либо сортирует все
      подходящие строки, либо идёт первичным ключом по всей ленте, включая `pending`, — и так до
      `MaxBatchesPerPass` раз за проход после долгого простоя уборки
    held_by: "интеграционная проба уборки с `EXPLAIN`: план выбора партии использует частичный индекс без узла сортировки по всем подходящим строкам; либо ревью db-architect-reviewer"

items:
  - id: CX1-63
    decision: "З7 шаг 5 «Две постановки одного шаблона берут замки строк окон в одном порядке и взаимной блокировки не дают» (строка 354); З10 возврат `UPDATE <window> w … FROM d`; З10 уборка прошедших окон `DELETE FROM <window> … ORDER BY window_start`"
    class: "code-authoring §«Порядок операций внутри кода» (порядок взятия ресурса); rule data-integrity concurrent-integration-test"
    exposure: >-
      порядок замков объявлен только для `Put` (по `(scope, window_seconds)`). Уборщик истечения
      обновляет те же строки окна в порядке плана: при `HashAggregate` над `d` порядок — порядок хеша
      ключа, не ключа. Если одна строка ленты внесла вклад в окна инициатора и адресата, а `Put` того
      же шаблона держит замок окна инициатора в транзакции вызывающего, уборщик берёт окно адресата и
      ждёт окно инициатора, а `Put` ждёт окно адресата — взаимная блокировка. Замер (postgres 16):
      `Put` двумя операторами в порядке З7, уборщик — оператор З10 редакции 2 дословно при
      `enable_sort=off` (так план выбирает хеш; на больших `d` — сам) → уборщик обновил `recipient`, затем
      `initiator`; у `Put` — `ERROR: deadlock detected`. Жертва — транзакция вызывающего: ждала второй
      и проверку взаимной блокировки провела она. Точка сохранения CX1-61 откатит шаг, но `Put` вернёт
      не классифицированную ошибку SQL, и глагол источника (приглашение, сброс) откажет по чужой для
      него причине. Уборка прошедших окон — третий писатель тех же строк без объявленного порядка
    condition: >-
      (а) все писатели строк окна берут замки в одном полном порядке ключа окна
      `(template, scope, window_seconds, key, window_start)`, совместимом с порядком `Put`: возврат
      уборщика сначала блокирует строки окна `SELECT … FROM <window> w JOIN d … ORDER BY <ключ окна> FOR
      UPDATE OF w` отдельным шагом того же оператора и только потом `UPDATE … FROM`; уборка прошедших
      окон упорядочена по тому же ключу; (б) утверждение З7 переписано на всех писателей окна
      (`Put`, уборщик истечения, уборка окон), а не на «две постановки»; (в) если порядок выбран иначе
      — ошибка 40P01 внутри `Put` классифицирована явно (сторож с именем, а не ошибка SQL наружу), и это
      решение записано в замысле с ценой
    held_by: >-
      интеграционная проба: окна инициатора и адресата одного шаблона, строка ленты с вкладом в оба,
      истёкшая; `Put` держит окно инициатора и после паузы берёт окно адресата; уборщик стартует в паузе
      с планом, выбирающим хеш → `Put` и уборщик оба завершаются, 40P01 нет, окна согласованы; инъекция
      — возврат без шага `FOR UPDATE … ORDER BY` → 40P01 (красная); близнец — строка с вкладом в одно окно

