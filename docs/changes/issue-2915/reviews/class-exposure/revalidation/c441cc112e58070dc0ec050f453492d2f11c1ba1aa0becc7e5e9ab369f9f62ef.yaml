items:
  - id: CX1-100
    status: unmapped
    decision: >-
      D1 (давнее решение: отдельный чарт `deploy/helm/notify/`, вне каталога зонтика) в свете Д52 (З28
      «Каталог — источник значения и для рендеров чарта края без зонтика»: «второй фикстуры нет») и NTF-2
      М67, семейство (7): IaC-скан рендерит каждый чарт без зонтика
    class: >-
      measurement-discipline §«Радиус: по имени механизма и по точкам применения». Новый
      отслеживаемый чарт — точка применения каждой переписи чартов дерева. Замысел их не перечислил:
      `grep -c -F 'iac'` по design.md → 0, `trivy` → 0. Второй класс — code-authoring §«Умолчание,
      которое становится утверждением»: сканер на отказе рендера пропускает чарт молча, и при нуле
      отрендеренных объектов «чисто» неотличимо от «не осмотрено». Третий — .claude/rules/testing.md
      §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки» п.7:
      гейт заглушек судит только одну форму подачи значений
    finding: >-
      (1) Кандидат `assert-iac-scan-covers-every-chart.py` (origin/2564) — отслеживаемый `*Chart.yaml`
      с шаблонами, не вложенный в другой чарт. Вложенность — префикс пути: `d.startswith(p)`.
      `deploy/helm/notify/` префиксом `deploy/helm/umbrella/` не начинается, значит это кандидат, и
      он обязан дать скану не меньше одной цели. Послабление в `EXEMPT` одно — зонтик, его причина
      («локальные сабчарты не вендорятся») к notify неприменима. (2) Синтетика в scratchpad, trivy
      0.70.0, чарт `notify` с `Deployment` под `if .Values.sources` и `required` на
      `global.kacho.identity.smtp.connectionURI`. Пустой перечень — 0 целей и 0 строк `# Source:`.
      Непустой перечень без узла — 0 целей: отказ рендера, сканер молчит. Контроль, перечень и узел
      заданы — 1 цель. Чарт D1 устроен так же: шаблоны при пустом перечне не рендерятся (NTF1-N04),
      узел под `required` (Д44), свои значения ноги лежат в `notify-standalone/values.yaml`, а не в
      умолчаниях. Значит, при нынешнем `trivy.yaml` (заглушки только `zot.auth.password`,
      `db.password`) после D1 гейт покрытия красный с именем `deploy/helm/notify/`. Громко, но полоса
      этого не ждёт, и путей для починки у неё нет: `trivy.yaml` нет в путях ни одной полосы. (3)
      Скан идёт в `security-scan.yml` на запросах в `main` и в ветки `[0-9]+`. Запрос в ветку волны
      с суффиксом этим фильтром не ловится, поэтому красное всплывёт у запроса волны в `2564`, а не
      у полосы. (4) Чем подать значения, Д52 решает наполовину. Заглушка `helm.set
      global.kacho.identity.smtp.connectionURI=…` — вторая фикстура узла почты, её Д48/Д52
      запрещают. Форма «файлы каталога» (`misconfiguration.helm.values`: `notify-standalone/values.yaml`
      с флагом и перечнем плюс образец `mail-node/`) Д52 соответствует, но гейт
      `assert-scan-stubs-hide-nothing.py` читает только `helm.set` (`helm.get("set")`). Файл, поданный
      сканеру, лежит вне его переписи, и «заглушка ничего не гасит» для него молча не судится. А
      файлы значений сканер применяет к КАЖДОМУ рендеримому чарту: корневой ключ файла может совпасть
      с ключом чужого чарта (так же сказано в N-1 записи `f7f510df` приёмки NTF-2). Тот же выбор
      встанет перед D6 NTF-2 с ручкой прыжков края. (5) Прочие переписи чартов по механизму на
      origin/2564. `deploy/chart_name_addresses_exactly_one_chart_test.go` (`ls-files '*Chart.yaml'`)
      тёзку не находит: среди 19 отслеживаемых `Chart.yaml` имени `notify` нет. `deploy/scripts/assert-metrics-surfaces-answer.sh`
      (`git grep -l 'prometheus\.io/scrape' -- 'deploy/helm/**'`, сегмент `deploy/helm/<x>/` → часть
      `<x>`) возьмёт `notify` частью, если чарт D1 объявит сбор величин, а у процесса есть `/metrics`
      (Р1). `deploy/trust_anchor_claim_matches_declaration_test.go` судит `deploy/helm/**` по
      `SSL_CERT_FILE`/`SSL_CERT_DIR`; якорь notify — своя ручка (CX1-81), `SSL_CERT_FILE` в замысле
      только у процесса пробы, так что гейт, по-видимому, молчит. `.github/scripts/lint-service-charts.sh`
      перечисляет `services/*/deploy`, `gateway/deploy`, `ui-future/deploy` — notify вне его перечня.
      Чарта notify нет ни на одной ветке, поэтому исходы последних двух не измерены
    condition_to_design: >-
      (а) D1 называет точки применения «новый отслеживаемый чарт» по механизму: переписи
      `git ls-files '*Chart.yaml'` и `deploy/helm/**`. Полоса печатает число на своей базе, контроль —
      четыре переписи этой записи (IaC-покрытие, тёзки чартов, поверхности величин, якоря доверия).
      Каждой назначен исход: красное на чарте D1 чинится в D1, либо записано, почему перепись
      молчит, с напечатанным её выводом. (б) IaC-покрытие. `deploy/helm/notify/` даёт скану не меньше
      одной цели, и держит это сам гейт покрытия, без новой записи в `EXEMPT`: исключение прятало бы
      манифесты notify. Значения скан берёт из каталога фикстур NTF-1 по Д52 — `helm.values` с
      `deploy/testdata/notify-standalone/values.yaml` и образцом `deploy/testdata/mail-node/` — а не
      заглушкой `helm.set` узла почты. `trivy.yaml` — в путях D1. Если автор выбирает `helm.set`,
      это граница Д52, и нужно решение диспетчера. (в) Гейт
      `assert-scan-stubs-hide-nothing.py` расширяется на форму `helm.values`: каждый файл снимается
      по одному, и «снятие не гасит находок» судится так же, как у `helm.set`. Путь гейта — в путях
      D1. Инъекция: файл, поданный сканеру и гасящий находку чужого чарта (корневой ключ, совпавший
      с ключом другого чарта), → красный. Близнец — файлы каталога как есть → зелёный с печатью
      числа файлов. Иначе файл, поданный сканеру, лежит вне переписи гейта, и тот молчит. (г)
      Порядок с D6 NTF-2: форму `helm.values` в `trivy.yaml` заводит D1, D6 дописывает строку ручки
      в тот же файл каталога и не заводит второй формы подачи (Е12 (12) дополняется ссылкой на
      семейство (7))
    held_by: "покраснеет `assert-iac-scan-covers-every-chart.py` на запросе волны в `2564` — громко, но поздно и вне путей полосы; форму «файлы» (в) держать нечем, пока гейт заглушек не расширен — нужен гейт"

notes:
  - id: N24
    blocking: false
    where: "З28 «Каталог — источник значения и для рендеров чарта края без зонтика» («какой файл каталога … и в какой форме ключа … называет D6 NTF-2»); §13 Е12 (12)"
    text: >-
      Одно значение ручки прыжков имеет две формы ключа: в слое зонтика оно под сегментом
      `api-gateway`, в чарте края без зонтика — в корне (М47). По записи `f7f510df` (N-1,
      acceptance-reviewer, посев на копии origin/2564, этой записью не воспроизведено) слой формы
      зонтика, поданный чарту края без зонтика, даёт отказ с именем ручки. Значит, файл `mail-node/`
