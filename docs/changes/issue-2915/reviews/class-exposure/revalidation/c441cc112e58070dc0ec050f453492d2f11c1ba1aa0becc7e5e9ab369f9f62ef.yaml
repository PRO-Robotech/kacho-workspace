mapping_check:
  - item: "CX1-99 (а)"
    verdict: holds
    evidence: >-
      Строка D1 tasks.md редакции 27 называет в путях `deploy/helm/umbrella/Chart.yaml` («только
      запись зависимости `notify`, CX1-99»). В design.md производитель записи — D1 (З28 «Запись `notify`
      в зависимостях зонтика»). Путь `deploy/helm/umbrella/**` §12 отдан `#2915`, коллизии с другой
      полосой NTF-1 нет
  - item: "CX1-99 (б)"
    verdict: holds
    evidence: >-
      Форма: `name: notify`, `repository: file://../notify`, `version: ">= 0.0.0"`, без `alias` и без
      `condition`. Перемерено yq-разбором `dependencies` на трёх базах. У семи file://-зависимостей
      `version: ">= 0.0.0"` и нет алиасов, алиасы только у `postgresql` (`pg-*`). Без `condition` из
      них одна `api-gateway`, у шести прочих `condition: <имя>.enabled`. Ссылка замысла на край как
      на прецедент верна. Довод «второй включатель — второе написание решения» стоит на NTF1-N04.
      `Chart.lock` зонтика отслеживанием не охвачен (`deploy/.gitignore:49`), а копию проба берёт из
