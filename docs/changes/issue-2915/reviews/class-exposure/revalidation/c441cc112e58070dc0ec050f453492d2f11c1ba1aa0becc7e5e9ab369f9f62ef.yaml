# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 26 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 25
# (43ead44b…, запись revalidation/43ead44b….yaml, коммит 31371c92d, итог «к замыслу»: CX1-99;
# N23 не блокирует). Дельта — коммит 1690113d8: отображение CX1-99 и N23, решение диспетчера Д52,
# замер М47. Пункты CX1-01…98 и условия УК1…УК94 эта запись не пересуживает.
#
# Итог — к замыслу, один новый пункт. CX1-99 (а)–(г) и N23 отображены и выдерживают; М47
# воспроизведён. Д52 делает каталог фикстур NTF-1 входом рендеров чарта БЕЗ зонтика. Одно из семи
# семейств таких рендеров (NTF-2 М67, семейство 7) — IaC-скан `trivy config`. Он рендерит КАЖДЫЙ
# отслеживаемый чарт вне зонтика, а значит и чарт notify, который заводит D1. Отсюда новый пункт
# CX1-100. Кандидат гейта `assert-iac-scan-covers-every-chart.py` — отслеживаемый чарт с шаблонами,
# не вложенный в другой. Путь `deploy/helm/notify/` этому условию отвечает. При умолчаниях чарта
# шаблоны notify не рендерятся (NTF1-N04), при непустом перечне без узла почты отказывает
# `required`. В обоих случаях целей скана ноль (синтетика, trivy 0.70.0), и гейт краснеет. В
# замысле NTF-1 IaC-скан не назван ни разу. Чем подать значения, Д52 решает только наполовину:
# заглушка `helm.set` была бы второй фикстурой узла почты, а форма «файлы каталога» лежит вне
# переписи гейта `assert-scan-stubs-hide-nothing.py` — он читает только `helm.set`.
# Возврата в приёмку нет.
