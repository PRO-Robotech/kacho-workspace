  - id: N25
    blocking: false
    where: "З28 «Запись `notify` в зависимостях зонтика» (опора печатает `# Source:` объекта `ConfigMap` с ключом адреса); «Фикстурная копия D1» («зависимости `Chart.yaml` вида `file://../../../<компонент>/deploy` … после записи D1 — восьмая»)"
    text: >-
      (1) Опора называет исход для «объекта с ключом нет» (число объектов), но не для «таких объектов
      больше одного». Сегодня ключ `KACHO_NOTIFY_SMTP_CONNECTION_URI` несёт только notify, так что
      путь однозначен. Но если объект с тем же ключом появится ещё где-то в рендере, сравнение
      возьмёт один из них. К коду: ровно один объект, иначе «НЕ ВЫПОЛНИЛОСЬ» с числом и путями. (2)
      Абзац о копии называет восьмую зависимость в ряду «вида `file://../../../<компонент>/deploy`»,
      а запись D1 имеет вид `file://../notify`. Копия от этого не страдает: состав задан как
      «зависимости с локальным источником». Но фраза о форме неверна, и полоса, которая копирует по
      образцу `../../../`, notify не скопирует. Не воспроизведено, громко: `helm dependency build`
      копии печатает зависимость `notify` (строка CX1-99 §11)

