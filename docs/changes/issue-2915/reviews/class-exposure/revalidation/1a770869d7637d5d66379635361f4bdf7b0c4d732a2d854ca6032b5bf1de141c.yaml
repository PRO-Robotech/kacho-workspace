# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 29 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта к редакции 28 (a3a57b5c…, запись
# revalidation/a3a57b5c….yaml, коммит f4fa75762, итог «к замыслу»: CX1-101, CX1-102; N26, N27 не
# блокируют). Дельта — один коммит b28480d25. Пункты CX1-01…100 и условия УК1…УК94 запись не
# пересуживает.
#
# Итог — к замыслу, один новый пункт. CX1-101 (б), CX1-102, N26 и N27 отображены и выдерживают.
# Предикат CX1-102 даёт 0 строк на предмете, контроль на 45d535e1e даёт 2 + 1. CX1-101 (а) отображён
# в сути: двойник в путях D1s, фазы по обеим формам. Но команда прогона RG1.1 на ветке полосы
# в замысле и в маршруте взята дословно из условия записи a3a57b5c, и она не создаёт условия
# настоящих полос пробы. TestRG11_01 и полоса real теста TestRG11_03 требуют TRIVY_CACHE_DIR,
# подготовленного прогоном гейта, как в шаге `rg11-scan-preservation`. Без этого они печатают
# «CONDITION NOT CREATED» (замер: голая команда, TestRG11_01 — FAIL за 6,2 с). Исход «не
# выполнилось» предсказуем заранее, а именно полосы real гоняют новые случаи инъекции (М48 (4),
# E′) настоящим trivy. Условие, от которого пошла ошибка, записал этот разбор. Это CX1-103.
# Возврата в приёмку нет.
