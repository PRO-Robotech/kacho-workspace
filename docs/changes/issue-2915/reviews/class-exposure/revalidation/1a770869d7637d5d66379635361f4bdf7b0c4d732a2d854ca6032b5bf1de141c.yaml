mapping_check:
  - item: "CX1-101 (а)"
    verdict: holds_with_new_item
    text: >-
      Двойник `scan_process.py` и, условно, тест RG1.1 вошли в пути D1s (tasks.md строка D1s). Фаза
      определяется по обеим формам, у каждого нового случая своя фаза, вход вне фаз — отказ (З28 (в),
      §11 CX1-101). Прочие потребители названы и исхода не меняют. Не выдерживает только команда прогона:
      она не создаёт условия полос real. Это CX1-103; источник — условие (а) записи a3a57b5c, замысел его
      перенёс дословно
  - item: "CX1-101 (б)"
    verdict: holds
    text: >-
      «Судить нечего» — только при обеих пустых формах. Случай E пустошит обе и ждёт прежний исход, E′ —
      `helm.set = []` при непустом `helm.values` → суд о файлах и печать «заглушек 0; файлов значений 2»;
      близнец — E; держатель раннего выхода — E′. Замечание к коду, не к замыслу: у двойника фаза `empty`
      по обеим формам совпадает с E, а фаза E′ обязана отвечать печатью E′, а не «судить нечего», иначе
      процессная полоса утвердит то, чего гейт не печатает
  - item: "CX1-102"
    verdict: holds
    text: >-
      Предикат условия (четыре формулировки design.md, одна tasks.md) → 0 строк на предмете и маршруте 30;
