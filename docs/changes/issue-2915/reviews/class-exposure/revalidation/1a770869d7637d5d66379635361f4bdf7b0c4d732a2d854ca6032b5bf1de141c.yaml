items:
  - id: CX1-103
    status: unmapped
    decision: >-
      CX1-101 (а), редакция 29: «D1s гонит `go test -tags=rg11trivy ./services/storage/tools -run
      '^(TestRG11_0[1-4]|TestRG11Snapshot|TestRG11ScanExecution)'` на своей ветке сама и печатает исход;
      «НЕ ВЫПОЛНИЛОСЬ» … за зелёное не идёт» (З28 (в), §11 CX1-101, tasks.md строка D1s)
    class: >-
      verdict-and-landing, три категории исхода: предсказуемое «не выполнилось» — это не суждение о
      предмете. Опора — .claude/rules/testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией,
      снабдить проверкой предпосылки» п.7: у пробы есть предпосылка (подготовленный кэш сканера), а
      команда полосы её не создаёт. Форма ошибки — measurement-discipline §«Откуда читается предмет»:
      команду взяли из текста условия, а не из шага, который её реально исполняет
    finding: >-
      В тесте RG1.1 три полосы сканера. Полоса real (TestRG11_01; TestRG11_03, случай `dirty_present_repeat`)
      линкует настоящий trivy и требует `TRIVY_CACHE_DIR` с `policy/metadata.json`. Иначе `t.Fatal("CONDITION
      NOT CREATED: TRIVY_CACHE_DIR must name this run's prepared cache")`. Шаг `rg11-scan-preservation`
      этот кэш готовит до `go test`: заводит каталог, экспортирует `TRIVY_CACHE_DIR` и `TMPDIR`, гонит
      `python3 deploy/scripts/assert-scan-stubs-hide-nothing.py` и проверяет, что `metadata.json` появился.
      Команда замысла этого не делает. Замер: голая команда на TestRG11_01 → FAIL за 6,2 с с этим текстом.
      Значит, исход прогона D1s известен заранее: две полосы real — «не выполнилось». А именно они гоняют
      НАСТОЯЩУЮ инъекцию настоящим trivy, то есть единственные на ветке судят новые случаи (М48 (4), E′)
      не через двойник. Процессная полоса (TestRG11ScanExecution) проверит только классификацию двойника.
      В итоге красное настоящего скана снова впервые появится на запросе волны в `2564`, от чего CX1-101
      (а) и уводил. Команду без подготовки записало условие (а) записи a3a57b5c; ошибка — этого разбора
    condition_to_design: >-
      В З28 (в), в §11 CX1-101 и в строке D1s прогон RG1.1 на ветке полосы — в форме шага
      `rg11-scan-preservation`, а не голой командой. Нужны: тег `rg11trivy`; свежий `TRIVY_CACHE_DIR` и
      `TMPDIR` во временном каталоге полосы; подготовительный прогон `python3
      deploy/scripts/assert-scan-stubs-hide-nothing.py` с печатью кода и проверкой
      `$TRIVY_CACHE_DIR/policy/metadata.json`; затем `go test` с той же `-run`. Печатаются исход по
      каждому тесту и полосе сканера (real, process, absent) и версия trivy. Подготовка, не давшая
      `metadata.json`, — «НЕ ВЫПОЛНИЛОСЬ» с причиной и за зелёное не идёт, как и прежде. Проще всего —
      исполнить тело шага из `security-scan.yml` с `RUNNER_TEMP`, указывающим в каталог полосы, и не
      переписывать его. Проверка текста: `grep -n -F 'TRIVY_CACHE_DIR' design.md tasks.md` → ≥ 1 строки в
      каждом (сейчас 0 и 0)
    held_by: "покраснеет шаг `rg11-scan-preservation` на запросе волны — поздно. На ветке полосы держится вниманием исполнителя D1s: «не выполнилось» полос real видно в печати, но за провал его никто не примет, если форма прогона в замысле неверна"

notes:
  - id: N28
    blocking: false
    where: "З28 (в), случай E′; двойник `scan_process.py` (CX1-101 (а))"
    text: >-
      Двойник не только относит конфиг к фазе, но и печатает за гейт его вывод (`phase, code, output`).
      Инъекция утверждает по печати. У фазы E′ ответ двойника обязан совпадать с тем, что замысел требует
      от гейта: код 0, «заглушек 0; файлов значений 2», без «судить нечего». Если двойник отвечает на E′
      «судить нечего», процессная полоса согласится с поломанной инъекцией, а не с гейтом. К коду: ответ
      фазы E′ двойника берётся из той же строки, которую ждёт `expect` случая E′, и не пишется вторым
      текстом
    predicate: "на голове D1s ожидаемая строка случая E′ в `…-inject.sh` и ответ фазы E′ в `scan_process.py` совпадают побайтно (git grep -F по строке → два файла)"

