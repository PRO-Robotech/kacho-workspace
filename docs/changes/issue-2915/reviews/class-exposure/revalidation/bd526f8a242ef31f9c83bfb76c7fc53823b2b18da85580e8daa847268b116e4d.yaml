orders:
  - to: исполнитель полосы N2 (go-implementer)
    what: >-
      (1) `TestHealthySubscribeStreamOpensOnce`: срок gRPC идёт по реальному времени, а не по
      внедряемым часам. Если «пять тактов» прокрутить поддельными часами, близнец-инъекция
      `WithTimeout(…, claimInterval)` не успеет сработать и останется зелёной. Окно наблюдения
      должно длиться не меньше пяти `claimInterval` реального времени, либо срок и такты должны
      идти от одного источника времени. (2) `sourceCallTimeout` и срок установления передавать в
      функцию цикла параметром, как в held_by записи e7a6ae15: прод-вызов передаёт константу, проба —
      короткое значение. Иначе пробы CX1-72 и второй близнец CX1-71 ждут по 10 с реального времени.
      Близнец «ответ за 9 с при сроке 10 с» оставляет запас 10 % и под `-race` на загруженном
      раннере может дать ложную отмену: пропорцию 90 % сохранить, абсолютные числа уменьшить.
      (3) Такты таймера: `time.Ticker` держит один пропущенный такт в буфере, поэтому после долгого
      вызова следующий `Claim` уходит сразу. Это совпадает с «не копятся» (не больше одного) — в
      коде так и написать
    basis: "gate-authoring §«Детерминизм входа и управляемые часы»; code-authoring §«Инвариант и оснастка — это тоже прод-код»"
  - to: design-reviewer (system-design-reviewer, режим «замысел»)
    what: >-
      Наблюдение вне предмета Д26, в пункт не заведено: дельта его не вносит, клиент к
      источникам и без неё жил без срока потока до редакции 9. После снятия срока с потока (CX1-71)
      установленный поток к источнику, чей узел исчез без RST, notify не распознаёт ничем, кроме
      TCP. Сервер подписки corelib сообщений простоя не шлёт, а keepalive клиента `grpcclient`
      выключен при `KeepAliveTime` = 0. Замысел не называет, с каким `KeepAliveTime` notify
      набирает клиента к источникам. Путь «по событию» в таком случае молча уходит в таймер, а
      `Claim` на том же транспорте упирается в `sourceCallTimeout` на каждом такте. Решить в ревью
      замысла: назвать значение опции (это параметр уже существующего клиента) либо записать
      остаток
    basis: "code-authoring §«Умолчание, которое становится утверждением»; замысел §13 Е6"
  - to: design-reviewer (system-design-reviewer, режим «замысел»), db-architect-reviewer, proto-api-reviewer
    what: "записи ревью на отпечаток bd526f8a; на нём их 0. Заказ db-architect-reviewer из записи e7a6ae15 (`statement_timeout` 10 с против темпа `global_daily` на медленном диске) остаётся в силе"
    basis: "SDD-1 §5; policy.yaml review_authority; замысел §13 Е6"

