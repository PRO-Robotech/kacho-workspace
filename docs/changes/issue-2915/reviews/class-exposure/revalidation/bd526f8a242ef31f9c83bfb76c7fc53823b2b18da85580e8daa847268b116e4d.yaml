mapping_check:
  - id: CX1-71
    design: "З21 (подпункт `Subscribe`), З27 (`notify_source_stream_opens_total{source}`), §11 CX1-71; tasks.md N2"
    verdict: holds
    note: >-
      (а) У контекста потока своего срока нет. Срок `sourceCallTimeout` действует до
      `SubscriptionOpened` и снимается с его приходом, после чего поток живёт под контекстом цикла.
      Отмена цикла закрывает поток. (б) Все три места говорят «до `SubscriptionOpened`»: строка
      SDR-Н2 §11, З21 и N2. Прежней формулы «открытие под `WithTimeout(…, claimInterval)`» в
      замысле не осталось. (в) Счётчик открытий с меткой источника есть в З21 и З27. Проба
      `TestHealthySubscribeStreamOpensOnce`: исправный источник → открытий 1, строка доставлена
      по событию раньше такта. Близнец-инъекция — срок на контексте потока → открытий не меньше 5,
      проба красная. Второй близнец — `SubscriptionOpened` не приходит → поток переоткрыт. Замечание
      к исполнению — в orders (окно наблюдения в реальном времени), это не пункт
  - id: CX1-72
    design: "З21 (подпункты `Claim` и «Остаток — отмена после коммита аренды»), З27 (`notify_claim_call_timeouts_total{source}`), §8 (`sourceCallTimeout = 10s` и довод), §11 CX1-72; tasks.md N2"
    verdict: holds
    note: >-
      (а) Срок — константа §8, отдельная от ручки. Верхняя граница выведена так:
      `LeaseTTL` 300 с − (30 + 120 + 5) = 145 с по верхним границам ручек §8, и 10 с ниже неё в
      14,5 раза. Арифметика проверена по таблице ручек. Нижняя сторона дана доводом — один оператор
      не больше `feed.MaxClaim` = 500 строк, — но числом не замерена. Это допустимо: следствие
      нарушения названо и видно счётчиком. Тактов на вызов больше одного не бывает: цикл
      последователен, такты не копятся. (б) Остаток назван: строки без исполнителя до конца аренды,
      класс `security` включён, дубля нет. (в) Счётчик отмен по сроку отделён от ошибок источника.
      Проба `TestClaimCallTimeoutAfterLeaseCommitIsCounted` — отмена, счётчик +1, строки уходят после
      конца аренды, писем 1. Близнец — ответ за 9 с при интервале 1 с → отмены нет. Инъекция —
      срок = ручке → проба красная. Замечание к исполнению — в orders (предел параметром), это не пункт
  - id: SDR-Н2
    design: "З21, §8, §11 SDR-Н2; tasks.md N2"
    verdict: holds
    note: >-
      Строка переписана под CX1-71 и CX1-72 и сохранила исходное требование ревью: зависший
      источник держит только свой цикл, не дольше `sourceCallTimeout` на вызов. Обе просьбы ревью
      dba7c388 теперь выполнены: константа notify с доводом числа, меньше `LeaseTTL`, и срок только
      на установление потока. Проба `TestStalledSourceDoesNotStopOtherSources` с прежними
      близнецами

