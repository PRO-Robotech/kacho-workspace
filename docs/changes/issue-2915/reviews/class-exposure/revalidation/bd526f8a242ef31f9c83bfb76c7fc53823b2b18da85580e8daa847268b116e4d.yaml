# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 10 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Это заход отображения по Д26, поэтому судятся ТОЛЬКО строки
# отображения CX1-71, CX1-72, переписанная SDR-Н2 и дельта редакции 10 против последней разобранной
# редакции 9 (e7a6ae15…, запись revalidation/e7a6ae15….yaml, коммит ad3c82c83). Предмет дельты —
# коммит d0573311b: design.md +57/−17, tasks.md +4/−3, change.yaml +7/−5. Пункты CX1-01…70 и
# условия УК1…УК94 эта запись не пересуживает.
#
# Итог. CX1-71 и CX1-72 отображены, и отображение выдерживает условия пунктов:
#   CX1-71 — у контекста потока `Subscribe` своего срока нет; срок действует только до
#     `SubscriptionOpened` и снимается с его приходом; открытия считает счётчик с меткой источника;
#     проба с близнецом-инъекцией стоит в N2.
#   CX1-72 — срок `Claim` вынесен из ручки `notify.claimInterval` в константу `sourceCallTimeout = 10s`.
#     Верхняя граница выведена из аренды, арифметика сходится. Остаток «отмена после коммита
#     аренды» назван, отмены по сроку считает отдельный счётчик. Проба с двумя близнецами есть.
# SDR-Н2 переписана под оба пункта. Дельта не вводит нового внешнего вызова, асинхронного пути или
# sentinel. Неотображённых 0. Итог — к коду. Три замечания к исполнению проб N2 записаны в orders
# и пунктами не являются. Одно наблюдение лежит вне предмета Д26 (живость установленного потока
# при полуоткрытом соединении) — это заказ design-reviewer, а не пункт. NTF1-L03 из записи
# 9bfa92be остаётся в силе.
