inspected: >-
  Прочитана вся дельта d0573311b.
  В design.md: шапка («Что изменила редакция 10»), З21 (срок `Claim` и установления `Subscribe`,
  остаток отмены после коммита аренды), З27 (два новых счётчика), §8 (константа `sourceCallTimeout`
  и довод числа), §11 (строки SDR-Н2, CX1-71, CX1-72), §12.
  В tasks.md: шапка и строка N2. В change.yaml — вводные комментарии и hashes.design_sha256.
  Запись пересверки e7a6ae15 прочитана целиком: её condition и held_by по CX1-71 и CX1-72 —
  мерило отображения.
  Вне дельты: З21 целиком (цикл источника, срок строки), §8 границы ручек `notify.claimInterval`
  `[1s..5m]`, `notify.resolveSendTimeout` `[100ms..30s]`, `notify.smtp.sessionTimeout` `[1s..120s]`,
  константы `feed.LeaseTTL = 5m`, `feed.MaxClaim = 500`, `ackMargin = 5s` — по ним проверен довод
  числа. corelib @34bc8104a: в `subscription/server.go` по признакам heartbeat, keepalive, ping и
  idle серверного сообщения простоя не найдено (`IdlePoll` — внутренний перепрос журнала);
  `grpcclient/dial.go` — keepalive клиента включается опцией `KeepAliveTime`, значение 0 его
  отключает. В замысле по признакам grpcclient, KeepAlive и Dial упоминаний клиента к источникам
  нет: два найденных keepalive относятся к TCP keepalive сервера базы (М34).
  Не читались дерево kacho (дельта ничего нового о нём не утверждает) и записки vault.

