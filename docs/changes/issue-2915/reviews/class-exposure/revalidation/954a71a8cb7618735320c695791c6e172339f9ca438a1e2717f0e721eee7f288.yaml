items:
  - id: CX1-98
    status: unmapped
    decision: "З28 «Узел почты → ключ процесса»: нога без зонтика пробы D1 (рендер `deploy/helm/notify/` отдельно, инъекция «снятый `required`») и пробы D2 (текст с обоими выходами); §11 CX1-97 (д); tasks.md D1, D2"
    class: >-
      change-graph «отрицательный кейс меняет ровно один факт против положительного близнеца» (у
      отрицания новой ноги нет названного близнеца на этой же ноге); .claude/rules/testing.md §«Гейт
      на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки» п.7 (у ноги
      нет предпосылки: CX1-94 (б) сформулирован для «рендера цепочки `prod` через обёртку», нога без
      зонтика ни цепочкой, ни обёрткой не является); code-authoring §«Умолчание, которое
      становится утверждением» (один «шаблон ConfigMap notify» на две ноги, у которых путь разный)
    finding: >-
      (1) Отрицание ноги без зонтика — «со слоем того же образца минус адрес → отказ шаблона
      `ConfigMap` notify с именем узла». Инъекция — «снятый `required` → рендер проходит с пустым ключом
      → красный». В design.md и в строке D1 tasks.md у этой ноги нет опоры (тот же рендер с образцом
      целиком → код 0, ключ равен адресу образца), нет печати снятых ключей и нет исхода
      «НЕ ВЫПОЛНИЛОСЬ». Строка D2 отсылает к предпосылке «пробы D1», а та задана для цепочки через
      обёртку. (2) Значения этой ноги — «собственные значения чарта с перечнем из одного источника»
      (форма NTF1-I06) плюс образец. Это не каталог и не обёртка, поэтому обязательные значения чарта
      notify вне узла (перечень, лимиты, ключ сетки) ноге даёт другой источник. Если он неполон, в
      отрицании не задано больше одного значения, а инъекция «снятый `required`» падает на чужом
      `required` того же шаблона. Путь при этом совпадает, имя другое, а исход инъекции в замысле
      для этого случая не назван. (3) Путь отказа на ногах разный — замер этой записи, helm
      v4.2.4, синтетический чарт с `required` на `global.kacho.identity.smtp.connectionURI`: в зонтике
      `execution error at (kacho-umbrella/charts/notify/templates/configmap.yaml:5:8)`, без зонтика
      `(notify/templates/configmap.yaml:5:8)`. Замысел называет ожидаемый путь одинаково — «шаблон
      `ConfigMap` notify». Одна константа на обе ноги даёт одной ноге вечное «НЕ ВЫПОЛНИЛОСЬ».
      Совпадение по суффиксу `notify/templates/…` принимает и копию стража из инъекции CX1-97 (в),
      если её положить подчартом по пути `…/charts/notify/templates/…`
    condition_to_design: >-
      (а) У ноги без зонтика своя опора: рендер `deploy/helm/notify/` с теми же собственными
      значениями и образцом целиком → код 0 и ключ `KACHO_NOTIFY_SMTP_CONNECTION_URI` равен адресу
      образца. Это и есть её положительный близнец; отрицание отличается от него только снятым
      адресом. (б) Предпосылка CX1-94 (б) распространена на эту ногу дословно: печатаются снятые
      ключи (`--set …=null`) и код опоры; снят не один ключ либо опора не рендерится — «НЕ
      ВЫПОЛНИЛОСЬ». Инъекция «снятый `required`» зелёной и красной считается только при коде 0 опоры;
      отказ рендера в ней — «НЕ ВЫПОЛНИЛОСЬ» с путём и текстом. (в) Файл собственных значений ноги
      назван путём, и проба печатает этот путь. Требования «без узла» к нему нет: `--set …=null`
      снимает ключ из любого слоя (М43). (г) Ожидаемый путь назван на каждую ногу полной
      строкой с корнем чарта (`kacho-umbrella/charts/notify/templates/<файл>` и
      `notify/templates/<файл>`) и сравнивается на равенство, а не по суффиксу. Инъекция —
      константа пути одной ноги, поданная другой → «НЕ ВЫПОЛНИЛОСЬ» с напечатанным путём. (д) Строки D1
      и D2 tasks.md называют опору и предпосылку ноги без зонтика и две константы пути
    held_by: "нужен гейт — опора, предпосылка и путь на каждую ногу в пробах D1 и D2; сегодня нога без зонтика держится только тем, что собственные значения чарта окажутся полными"

notes:
  - id: N21
    blocking: false
    where: "§1 М45; З28 «Отказ утверждается при одном незаданном значении» (б); шапка редакции 24 («до трёх»)"
    text: >-
      Ветвей стража зонтика, которые срабатывают на снятый адрес при заданной второй половине, больше
      двух. Кроме :85 (`fromSet`) и :122 (`credDeclared`) есть :271 на 1276 и :274 на 2564 — «якорь
      объявлен (`trustAnchorSecret.name`), узел не задан». Ещё :264/:267 — `mailpit.enabled` без узла,
      но в `prod` он выключен. Образец М38 якоря не несёт, так что сегодня ветвь :271 молчит. Если
      образец в каталоге несёт якорь, отказывающих шаблонов четыре, а не «до трёх». Проба от этого не
      ломается: она утверждает путь, а не перечень. Ложно утверждение М45 о полноте. Правка — дописать
      ветвь якоря и снять слово «до трёх». Перечень держится условием ветви: `if and <половина> (not
      $uriSet)`
    predicate: "git -C project/kacho show origin/2564:deploy/helm/umbrella/templates/identity-mail-lane-guard.yaml | grep -n 'not \\$uriSet'"
  - id: N22
    blocking: false
    where: "З28 «Читатели узла вне notify — закрытый перечень исключений» («состав перечня на базе полосы D2»); §13 Е12 (10) («если D2 NTF-1 к её посадке влита»)"
    text: >-
      Если D2 NTF-1 и D1 NTF-2 идут одновременно, каждая зелёная на своей базе. У той, что садится
      второй, состав перечня определяет база посадки, а не база, от которой писали: после первой
      посадки она перегоняется на новой вершине 2564. Исход (iii) делает это расхождение громким
      красным, а не тихим, так что держатель есть. К коду и к посадке: «база полосы» в обоих местах
      значит вершину ветки, куда полоса вливается, на момент вливания
    predicate: "git merge-base --is-ancestor <коммит D2 NTF-1> origin/2564 — перед вливанием D1 NTF-2, и наоборот"

