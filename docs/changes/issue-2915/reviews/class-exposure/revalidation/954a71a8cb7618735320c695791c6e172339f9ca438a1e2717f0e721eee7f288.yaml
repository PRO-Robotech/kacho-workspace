# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 24 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 23
# (816f16ce…, запись revalidation/816f16ce….yaml, коммиты a59f97156 и 57ddfc8f0, итог «к замыслу»:
# CX1-96, CX1-97; N20). Дельта — коммит 38cfc14dd: отображение CX1-96, CX1-97, N20, замеры М44, М45.
# Пункты CX1-01…95 и условия УК1…УК94 эта запись не пересуживает.
#
# Итог — к замыслу, один новый пункт. CX1-96 и N20 отображены и выдерживают. CX1-97 отображён,
# (а), (в), (г), (д) выдерживают; (б) — с заметкой N21 (перечень отказывающих ветвей стража неполон,
# проба от полноты не зависит). Новый пункт CX1-98: отображение CX1-97 ввело второе отрицание D1 и D2 —
# «ногу без зонтика» (рендер чарта notify отдельно). У этой ноги нет ни опоры, ни предпосылки, ни
# положительного близнеца, а ожидаемый путь отказавшего шаблона на ней другой: замер helm v4.2.4 —
# `execution error at (notify/templates/configmap.yaml…)` без зонтика против
# `(kacho-umbrella/charts/notify/templates/configmap.yaml…)` в зонтике. Одна константа пути на обе
# ноги даёт одной из них вечное «НЕ ВЫПОЛНИЛОСЬ», совпадение по суффиксу отличает хуже равенства.
# Возврата в приёмку нет.
