notes:
  - id: N32
    blocking: false
    where: "tasks.md строка K3r; порядок п.7"
    text: >-
      Сверка копий kaname берёт копию края с ветки kacho по умолчанию без `ref`. Когда эпик сядет в main
      kacho, самоистечение трёх записей даст находку «запись, которой нечего исключать» на каждой ветке
      kaname, и до посадки K3r конвейер kaname будет красным. Так задумано (так же срабатывало 2026-09-17 и
      2026-09-18), но маршрут не называет срока: K3r открывается от головы линии до посадки эпика и садится
      тем же заходом, а красный kaname в этом окне атрибутирован K3r
    predicate: "строка порядка п.7 называет «K3r готова до посадки эпика, садится тем же заходом»"
  - id: N33
