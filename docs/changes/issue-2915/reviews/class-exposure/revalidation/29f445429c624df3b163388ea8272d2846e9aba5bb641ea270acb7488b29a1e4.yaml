# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта редакции 32 против последней пересверенной
# (редакция 31, 7bbe018c…, запись revalidation/7bbe018c….yaml, итог «к замыслу», CX1-104…108, N30, N31).
# Дельта не закоммичена: рабочее дерево issue-880 поверх a3662915b. Пункты CX1-01…103 и УК1…УК94
