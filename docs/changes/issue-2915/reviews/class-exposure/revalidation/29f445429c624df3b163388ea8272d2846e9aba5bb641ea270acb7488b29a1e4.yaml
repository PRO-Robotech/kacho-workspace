new_items:
  - id: CX1-109
    decision: "K5 (CX1-107): проба регистрирует на тестовом слушателе заглушку интерфейса K3c и судит пару «ключа нет → PERMISSION_DENIED, обработчик не вызван» / «согласный ключ → UNIMPLEMENTED из заглушки»; зависимости K5 — K8, K3c"
    class: >-
      gate-authoring: исход вместо объявления — проба утверждает исход, производитель которого на её голове
      не назван и не существует. code-authoring §«Порядок операций внутри кода»: исход определяется тем,
      какое звено цепочки сработало первым, а проба этого не различает
    exposure: >-
      `ResolveSend` проходит два звена: Р2 (служебный субъект из SAN) и звено прав — `DenyDetailUnary` с
      `PERMISSION_DENIED`/`AUTHZ_DENIED` (NTF1-F09). Звено прав пускает `service:notify` только по кортежу
      `service:notify reader notification_feed:<пр>` модели K1, а применитель служебного субъекта даёт K2 и
      исключение надзора — K4. Ни одна из них не в зависимостях K5. Тогда возможны два случая. Цепочка
      боевая: при согласном ключе звено прав отказывает, обе ветви дают PERMISSION_DENIED, близнец
      UNIMPLEMENTED недостижим, проба красна по построению. Цепочка собрана в пробе без звена прав: при
      отсутствии ключа отказать некому, обработчик заглушки вызовется, и PERMISSION_DENIED возьмётся из
      подставного звена. Ни одна форма не судит Р2
    condition_on_code: >-
      (а) Проба K5 собирает слушатель той же функцией корня, что `cmd/kaname/serve.go` (перехватчики и их
      порядок — из одного конструктора, а не перечислены в пробе). Звено прав в ней — фиктивный порт Check,
      который записывает предъявленный субъект и разрешает ровно `service:notify` на `ResolveSend`.
      (б) Пара судит субъект, который дошёл до звена прав, а не только код. Ключа нет: порт видит «субъекта
      нет», ответ — PERMISSION_DENIED от звена прав, обработчик не вызван. Согласный ключ: порт видит
      `service:notify`, ответ — UNIMPLEMENTED заглушки. Печатаются оба субъекта.
      (в) Инъекции: звено без таблицы при согласном ключе → порт видит «субъекта нет» — красный; слушатель
      собран без звена Р2 → то же — красный.
      Либо пара с боевым звеном прав переезжает в полосу, зависящую от K1, K2, K4 (K3 или позже), а K5
      утверждает только (а)–(в) на фиктивном порте
    held_by: "проба K5 (запланирована); форма цепочки и субъект на звене прав в предикате не названы — до правки держится вниманием"

