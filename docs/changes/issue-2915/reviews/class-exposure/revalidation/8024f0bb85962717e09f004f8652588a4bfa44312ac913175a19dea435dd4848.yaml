mapping_check:
  - item: CX1-116
    verdict: mapped_incomplete
    text: >-
      Для D1 условие выполнено целиком. Таблица пуста, перечень `[]`, объектов 0. Печать идёт по каждой
      цепочке и по ноге без зонтика. Второго включателя, строки вне `_sources.tpl` и запасной строки нет.
      Инъекция с близнецом есть. Пробы D1, которым нужны объекты, получают вердикт на сведённой голове
      D1+D2 (З28, строка D1). Но тот же класс задевает полосу D1s, и её строка этого не говорит. База D1s —
      голова D1, где таблица пуста. Её предикаты утверждают отрендеренные объекты notify:
      «`check-volume-mounts.py` … гейт зелёный с печатью workload notify» и «IaC-скан … осмотрен N целей
      `deploy/helm/notify/`, N ≥ 1». Рендер ноги без зонтика на голове D1s даёт 0 объектов. Тогда N ≥ 1
      краснеет без дефекта, а инъекции «из helm.values снят mail-node/operator.yaml → непокрытых 1» и
      «гасит находку чужого чарта» судят пустой рендер, то есть вырождаются в сверку нуля с нулём.
      Перечень З28 (design.md, «Пробы D1, утверждающие объекты рендера notify (I01, I02, I05, I06, …)»)
      гейтов D1s не называет. Строка D1s о Д76 молчит: «Д76», «сведённой», «перечень пуст» — 0 вхождений
  - item: CX1-117
