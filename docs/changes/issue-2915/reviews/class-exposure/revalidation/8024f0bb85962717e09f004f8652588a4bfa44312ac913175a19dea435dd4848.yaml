new_items:
  - id: CX1-118
    decision: "Д77 (в): у доказательства наката четвёртая полоса доставки DSN — `KACHO_MIGRATOR_DSN`, «если манифест службы её называет»"
    class: >-
      code-authoring §«Инвариант и оснастка — это тоже прод-код»: гейт решает полосу по тексту и должен
      судить по идентичности, а не по имени. code-authoring §«Умолчание, которое становится
      утверждением»: если полоса выбрана неверно, доказательство не отказывает, а молча доказывает другое
    exposure: >-
      У прежней проверки полосы `manifestNamesConfigPath` (invocation_test.go:491) область — все манифесты
      под `services/` и `deploy/`, а иголка у каждой службы своя: `KACHO_<SVC>_CONFIG_PATH`. У
      `KACHO_MIGRATOR_DSN` иголка общая для всех служб. Если новую проверку написать по тому же образцу,
      то, как только notify впишет переменную в свой шаблон, проверка «называет ли манифест службы
      переменную» начнёт отвечать «да» каждой службе. Сейчас @e415e59a225 переменная встречается в
      манифестах 0 раз. Пять служб, которые ходят полосой `KACHO_<SVC>_DB_*` (compute, geo, nlb,
      registry, storage), молча переедут на DSN-полосу. Это ровно та полоса, «которой пользуются все
      развёртывания дерева», и ради её доказательства переменная здесь гасится (комментарий :443–445).
      Близнец замысла сверяет «исход и число доказанных форм до и после правки». Накат проходит в любой
      полосе, поэтому оба числа останутся равны, и близнец этого не увидит
    condition_on_code: >-
      (а) Полоса DSN выбирается по манифестам, приписанным этой службе, — тем же serviceOfManifest или
      serviceForForm, что дают форму, — либо по файлу самой формы (`form.origin`). Подстрока по всему
      дереву не годится. (б) Доказательство печатает полосу DSN по каждой прежней службе и утверждает, что
      она не изменилась: до правки vpc — конфигурация (KACHO_VPC_CONFIG_PATH, 1 файл @e415e59a225), прочие
      пять — окружение. Перемерить на базе D4. (в) Для служб вне DSN-полосы `KACHO_MIGRATOR_DSN=`
      по-прежнему гасится
    held_by: >-
      Нужна инъекция D4, в замысле её нет. `KACHO_MIGRATOR_DSN` в шаблоне notify плюс проверка полосы по
      всему дереву → у прежней службы полоса сменилась → красный с именем службы и обеими полосами.
      Близнец — проверка по манифестам службы → полосы шести служб равны прежним (печать). Однофайлового
      признака нет
  - id: CX1-119
    decision: "Д77: форма шлюза — у D1 (`deploy/helm/notify/templates/**`), распознаватель пути и точка наката — у D4; волна D1, D1s, D2, D3, D4"
    class: >-
      code-authoring §«Решение и его следствие разнесены»: форма вызова — в одной полосе, а распознаватель
      её службы и точка — в другой. Без порядка между полосами голова одной из них краснеет на чужом
      предмете
    exposure: >-
      Колонка «зависит от» у D1 — «N1, D9». У D3 есть D4, у D1 его нет. В §3 п.6 перечень идёт «D9, D4,
      D1, …», но это перечень, не зависимость. Перепись форм читает исходный текст шаблонов, а не рендер.
      Поэтому форма `command: ["/usr/local/bin/kacho-migrator", "up"]` в `deploy/helm/notify/templates/**`
      видна ей и при пустой таблице модулей. Если голова D1 нарезана без D4, `manifestForms` падает через
      t.Fatalf `ЧЬЮ — не выводится` (:215). Падают обе пробы `internal/migratorapply`, обе зовут
      manifestForms, и перепись прочих шести служб не печатается вовсе. В строке D1 этот исход не назван.
      Для D4 он назван: «форм 0 (красный) — вердикт на сведённой голове с D3». Если D1 стоит на D4, на
      голове D1 у notify одна форма, и перепись зелёная. Доказательство проходит форму шлюза по строке
      `kacho_notifyprobe`, совпадающие формы схлопывает uniqueForms. Тогда утверждение «перепись
      красная до D3» относится только к голове D4
    condition_on_code: >-
      (а) Строка D1 называет D4 в «зависит от» (база D1 содержит распознаватель D4 и точку). Иначе строка
      D1 называет исход обеих проб `internal/migratorapply` на своей голове. Ослабления пробы, исключения
      notify и формы-заглушки при этом быть не должно. (б) Шапка §3 п.6 говорит прямо: перепись форм на
      голове D4 красная, на голове D4+D1 — зелёная, одна форма notify. На голове волны форм две (D1, D3)
    held_by: >-
      Держится вниманием и гейтом. Полоса D1 печатает вывод `go test ./internal/migratorapply/ -run
      'TestEveryApplyPointHasItsInvocationFormDerived' -v` на своей голове: служба notify, форм 1,
      источник формы — `deploy/helm/notify/templates/…`. Это строка маршрута, отдельной пробы не нужно

