notes:
  - id: N37-1
    blocking: false
    where: "tasks.md §3 п.6 «Волна по Д76 и Д77»; строка N7"
    text: >-
      N7 зависит от D4 (точка наката) и стоит раньше D2 (строка `kacho_notify`). D4 и D2 в одной волне,
      значит N7 не может сесть ни раньше волны, ни после неё — только в ней. В перечне состава волны N7
      нет: там «D1, D1s, D2, D3, D4 … N1 и N11r». Внести N7 в перечень и напечатать состав волны числом
      полос
    predicate: "перечень состава волны в §3 п.6 называет N7"
  - id: N37-2
    blocking: false
    where: "design.md З28 «Тег образа notify — без умолчания»; строка D1"
    text: >-
      Отказ по тегу называет ручку зонтика `notify.image.tag`. На ноге без зонтика
      (`deploy/testdata/notify-standalone/values.yaml`, чарт notify напрямую) оператор ставит `image.tag`.
      Отказ с именем, которого в этом установочном пути нет, ручку не называет. Чтобы ручку называл каждый
      путь, отказ должен печатать оба пути либо путь того слоя, в котором его читают. Близнец — нога без
      зонтика с непустым перечнем и пустым тегом → отказ с `image.tag`
    predicate: "проба тега D1 несёт случай ноги без зонтика"
  - id: N37-3
    blocking: false
    where: "строка D1 «по Д74, Д77»"
    text: >-
      Точка выбирает цепочку по имени базы в DSN. Поэтому имя базы в DSN контейнера `migrate` шлюза — это
      выбор цепочки, а не просто адрес. Строка D3 утверждает рендером «DSN с базой `kacho_notifyprobe`».
      Строка D1 пишет «DSN базы `kacho_notify`» как требование, но пробы с инъекцией под ним нет. Нужен
      рендер на сведённой голове D1+D2: имя базы и sslmode в DSN контейнера `migrate` берутся из тех же
      ручек, что у процесса шлюза. Инъекция — ручка базы контейнера отличается от ручки процесса →
      красный, близнец — общая ручка
    predicate: "строка D1 несёт рендерное утверждение имени базы DSN `migrate` с инъекцией"

