notes:
  - id: N29
    blocking: false
    where: "З28 (в), шаг 1 прогона RG1.1 полосой D1s"
    text: >-
      Фикстура RG1.1 требует, чтобы `t.TempDir()` лежал вне дерева продукта. Иначе
      «CONDITION NOT CREATED: temporary fixture must be outside the product repository» (тест, строки
      182–185), и `TMPDIR` прогона это решает. Замысел пишет `mktemp -d` без шаблона, то есть каталог в
      системном временном каталоге, вне рабочей копии полосы. Условие выполнено. В записи 1a770869
      я предлагал другое: «RUNNER_TEMP, указывающий в каталог полосы». Если каталог полосы — рабочая
      копия kacho, такое предложение давало бы «не выполнилось» по всем вариантам. Замысел его не взял.
      К коду: исполнитель D1s не переносит рабочий каталог прогона внутрь рабочей копии продукта, иначе
      тот же исход
    predicate: "в печати прогона D1s путь `TMPDIR` не начинается с `git rev-parse --show-toplevel` рабочей копии полосы"

