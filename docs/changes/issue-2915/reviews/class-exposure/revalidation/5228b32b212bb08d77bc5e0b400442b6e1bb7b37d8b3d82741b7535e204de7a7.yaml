# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 30 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта к редакции 29 (1a770869…, запись
# revalidation/1a770869….yaml, коммит ce5e61099, итог «к замыслу»: CX1-103; N28 не блокирует).
# Дельта — один коммит 5eee977bf. Пункты CX1-01…102 и условия УК1…УК94 запись не пересуживает.
#
# Итог — к коду. CX1-103 и N28 отображены и выдерживают, новых пунктов нет. Порядок прогона RG1.1
# на ветке D1s (З28 (в), §11 CX1-103, строка D1s) сверен по пунктам с телом шага
# `rg11-scan-preservation` на origin/2564. Совпали сверка тега, свежие TRIVY_CACHE_DIR и TMPDIR,
# печать версий, подготовительный прогон гейта, проверка policy/metadata.json, тот же `-run`,
# `-count=1 -timeout=30m` и перечень `required` с обеими полосами настоящего сканера. Предикат
# CX1-103 даёт 6 и 2 строки, контроль на 1a770869 — 0 и 0. Ответ двойника на E′ сравнивается
# с ожидаемой строкой случая E′ через `cmp`, и это сравнение исполнимо. `expect` инъекции несёт
# третьим аргументом голую строку, двойник печатает голую строку `output`. Заметка N29 не
# блокирует: временный каталог прогона полосы должен лежать вне дерева продукта. Форма замысла
# (`mktemp -d` без шаблона) это выполняет. Моё прежнее предложение «RUNNER_TEMP в каталог полосы»
# не выполняло бы. Возврата в приёмку нет.
