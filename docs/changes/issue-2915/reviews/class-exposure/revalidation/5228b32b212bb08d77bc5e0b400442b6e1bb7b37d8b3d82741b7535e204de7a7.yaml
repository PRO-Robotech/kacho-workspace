mapping_check:
  - item: "CX1-103"
    verdict: holds
    text: >-
      Порядок прогона полосы (З28 (в), шаги 1–4; §11 CX1-103; tasks.md строка D1s) сверен с телом шага
      `rg11-scan-preservation` по пунктам. (1) Сверка `GOFLAGS` и `go env GOFLAGS` на `-tags=rg11trivy`:
      шаг строки 406–412, замысел шаг 1. (2) Свежий каталог и в нём `TRIVY_CACHE_DIR`, `TMPDIR`, оба
      созданы и экспортированы: 413–416 и шаг 1. (3) `go version`, `trivy --version`: 417–418 и шаг 1.
      (4) Подготовительный прогон гейта с печатью вывода; ненулевой код или нет `policy/metadata.json` →
      отказ, `go test` не идёт: 419–425 и шаг 2. (5) Печать `metadata.json`, затем `go test -json` с тем
      же `-run`, `-count=1 -timeout=30m`: 426–428 и шаг 3. (6) Разбор потока: `skip`, `fail` или «no tests
      to run» → непригоден, у каждого варианта `required` должно быть ровно `run`, `pass`: 432–469 и
      шаг 4. Полосы real (`TestRG11_01/real_clean`, `TestRG11_03/dirty_present_repeat`) в `required`
      входят (437–438). Строка D1s требует печатать обе отдельными строками — это закрывает исход CX1-103
      «не выполнилось известно заранее». Новые случаи инъекции (М48 (4), E′) идут внутри уже
      перечисленных вариантов: полоса гоняет весь сценарий инъекции. Перечень `required` при
      расширении не растёт, и то, что `security-scan.yml` не входит в пути D1s, здесь не дыра
  - item: "N28"
    verdict: holds
    text: >-
      Замысел требует, чтобы ответ двойника на фазу E′ был побайтно равен ожидаемой строке случая E′, и
      ставит держатель: `cmp` двух извлечённых строк, инъекция одного байта → красный, близнец → равны.
      Сравнение исполнимо по форме файлов. `expect` в инъекции берёт голую строку третьим аргументом
      (строки 92–137), двойник печатает голую строку `output` (scan_process.py строка 100). Одна
      оговорка к коду: `expect` сверяет вхождение, а не равенство. Поэтому печать гейта на E′ может быть
      шире строки, и `cmp` сравнивает ожидание с ответом двойника, а не с полной печатью гейта. Замысел
      так и формулирует, и на исход это не влияет

