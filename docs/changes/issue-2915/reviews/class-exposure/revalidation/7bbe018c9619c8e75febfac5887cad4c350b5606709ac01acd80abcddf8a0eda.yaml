new_items:
  - id: CX1-104
    decision: "§13 Е15 и строка K3c: «закрытый список расхождений объявлен только для переименований контракта фундамента», поэтому сверка копий будет красной до посадки эпика и нужно решение владельца"
    class: >-
      measurement-discipline §«Чужое измерение и чужое заявление»: посылка взята из комментария
      Makefile, а не из кода, который судит. doc-truthfulness: комментарий пережил свой предмет. Итог —
      ложный блокер маршрута и вопрос владельцу, на который дерево уже ответило
    exposure: >-
      kaname @cbbac984b и @484-notify (a59862664): `internal/check/catalog_copy_parity.go` объявляет ВТОРОЙ
      вид записи — `CatalogPendingEntry`, «ГЛАГОЛ СЛУЖБЫ, КОТОРОГО КРАЙ ЕЩЁ НЕ ВИДЕЛ (kaname#181)». Окно в
      нём описано ровно то же: «край порождает копию из нашего контракта по пину… промежуточного
      состояния, в котором обе копии совпали бы, не существует». Записей 6 (глаголы ключа доступа,
      kacho#1273). `compareCatalogCopiesWith(catalogFoundationRenames, catalogPendingEntries, …)`
      исполняет их. Читатель — `tools/catalogparity/main.go:165`, а его зовёт `make
      check-permission-catalog`. Самоистечение уже срабатывало дважды, 2026-09-17 и 2026-09-18. Копия
      края на kacho origin/main@bea4495e несёт внутренние глаголы kaname
      (`InternalClusterService/*`, `InternalIAMService/*` …), а `InternalNotificationGrantService` — 0
      раз. Значит, предикат снятия «край назвал глагол» наступит посадкой эпика с подъёмом пина.
      Комментарий Makefile 502–505 («ОДНО ИСКЛЮЧЕНИЕ») отстал от кода: N30
    condition_on_code: >-
      (а) Е15 закрыть без вопроса владельцу: K3c тем же изменением дописывает три записи
      `CatalogPendingEntry` в `internal/check/catalog_copy_parity.go` (путь добавить в пути K3c) — по
      записи на `InternalNotificationGrantService/{ResolveSend,Revoke,Restore}`. Why, Removal и Refs
      заполняются по форме соседних записей; Removal — «копия края на стволе kacho несёт `<FQN>`».
      (б) Три строки в `permission_catalog.json` порождены генератором края над контрактом этой ревизии,
      а не написаны рукой. Этого требует шапка вида: содержимое записи ни с чем не сверяется, пока края
      нет. В сообщении коммита — команда генерации.
      (в) Предикат K3c: `make check-permission-catalog EDGE_TREE=<чекаут kacho main>` ЗЕЛЁНЫЙ, перепись
      печатает «ожидающих 9». Красный здесь — дефект полосы, а не ожидаемое состояние. Строку «исход
      напечатан как есть — посадка по Е15» снять, зависимость «Е15 (посадка)» у K3c тоже.
      (г) Порядок снятия: после посадки эпика в kacho main с подъёмом пина сверка kaname даёт находку
      «запись, которой нечего исключать». Тогда три записи снимаются, а копия синхронизируется тем
      изменением, что поднимает пин. Назвать это строкой W-полосы либо §13 как предмет соседнего
      изменения с этим предикатом
    held_by: "сверка копий kaname (`catalog_copy_parity_test.go`, `make check-permission-catalog`) с самоистечением в обе стороны — гейт есть; после (а)–(в) красный на K3c невозможен без дефекта"

  - id: CX1-105
    decision: "З13 «Ручка kaname»: `authn.service-identity` — «только файл конфигурации, переменной нет; переменная с приставкой `KANAME_AUTHN__SERVICE_IDENTITY` — отказ старта с её именем»; поле `AuthNConfig.ServiceIdentity`, `mapstructure:\"service-identity\"`"
    class: >-
      code-authoring §«Контракт, который нельзя выразить»: два написания одного значения. Строгость
      окружения kaname ВЫВОДИТ законные имена из ключей декодера, и новое поле само заводит себе второй
      вход
    exposure: >-
      `strict_env.go` @484-notify: законные имена пространства `__` — это `EnvNameOfKey(k)` для каждого
      ключа `DecoderKeys()`. Обход декодера делает листом список скаляров (`methods`) и список структур
      (`services`): «список при этом остаётся ключом». Поэтому поле с этой формой само добавит
      `KANAME_AUTHN__SERVICE_IDENTITY__METHODS` и `KANAME_AUTHN__SERVICE_IDENTITY__SERVICES` в множество
      законных имён: страж их пропустит, а не отвергнет. `load.go` ставит `SetEnvKeyReplacer(".", "__",
      "-", "_")` и `AutomaticEnv()`. Ключ, который файл сделал известным, viper разрешает из окружения,
      и окружение старше файла. Без явного исключения переменная перекрывает таблицу из `ConfigMap` —
      SAN служебного субъекта задаётся окружением пода. Предикат K5 называет случай «переменная
      `KANAME_AUTHN__SERVICE_IDENTITY…`». Проба на голом префиксе (имя, которого нет в выводе) пройдёт
      и при этом дефекте
    condition_on_code: >-
      (а) В `strict_env.go` — закрытое объявление ключей «только файл» (один перечень, один читатель).
      Его ключи и все их подпути исключены из `NestedEnvNames()`, а имя, выведенное из них, — отказ старта
      с этим именем, до `Unmarshal`.
      (б) Проба K5 ставит ровно выведенные имена `KANAME_AUTHN__SERVICE_IDENTITY__METHODS` и
      `…__SERVICES` (по случаю на каждое), при согласном файле: отказ старта с именем переменной. Близнец
      — тот же файл без переменной: старт, самоотчёт несёт таблицу из файла.
      (в) Инъекция: запись снята из перечня «только файл» → проба (б) красная (переменная принята и
      перекрыла файл).
      (г) Гейт `TestRefusalNamedEnvVarReachesItsField` текстом отказа ручки не задевается: текст
      называет ключ файла, а не переменную. Если тексту понадобится имя переменной, исключение (а)
      предъявляется гейту явно
    held_by: "нужна проба (б) с инъекцией (в), её нет; до неё держится вниманием"

  - id: CX1-106
    decision: "З13 / З28 «Декларации» / строка J2: блок `authn.service-identity` рендерит шаблон `ConfigMap` ПОДЧАРТА kaname; SAN — помощником из декларации `notify.spiffe`; блок рендерится «ровно тогда, когда рендерятся объекты notify (выведенный перечень источников непуст)»"
    class: >-
      code-authoring §«Решение и его следствие разнесены»: решение «notify отрендерен» и SAN принимаются
      в подчарте notify и в помощниках зонтика, а следствие — в подчарте, который этих значений не видит.
      security-hardening «Контроль, у которого нет МЕХАНИЗМА исполниться»: адрес и удостоверение не
      сходятся в одном месте. Вдобавок путь делят писатели двух пакетов без порядка
    exposure: >-
      Замер — helm v4.2.4, синтетический зонтик с `notify.spiffe` в values родителя и помощником
      `u.notifySan` в `templates/` зонтика. Шаблон подчарта `kaname` получает `.Values.notify` = `{}`,
      вызов помощника зонтика в контексте подчарта — пустую строку; видна только `.Values.global`.
      Действующее устройство зонтика (origin/2564) это подтверждает. Подчарт kaname берёт свой домен из
      СВОЕГО `.Values.spiffe` (`kaname.trustDomain`, `charts/kaname/templates/_helpers.tpl:132`), помощник
      зонтика `umbrella.trustDomain` читает `.Values.mtls` зонтика. Перечень источников (З28) выводится
      таблицей `_sources.tpl` ЧАРТА notify, и подчарт kaname его не видит. Путь тот же:
      `charts/kaname/templates/configmap.yaml` и `values.yaml` зонтика правит и полоса D1 NTF-2 (строка
      D1, tasks NTF-2), тоже меняя помощник SAN в подчарте kaname (`kaname.spiffeURI`). В маршрутах обоих
      пакетов порядка J2 ↔ NTF2-D1 нет
    condition_on_code: >-
      (а) Замысел называет путь значений, который подчарт kaname читает, и признак «notify отрендерен»,
      вычислимый там же. Например, декларации и флаги, от которых зависит перечень, — под `global.` —
      либо блок пишется значением зонтика `kaname.config.authn.service-identity` с отдельным держателем
      согласия. Выбор — в З28; гейт J05 судит выбранный путь как единственное объявление.
      (б) Держатель J2 — в ОДНОМ рендере каждой из 7 цепочек: SAN строки таблицы в `ConfigMap` kaname
      РАВЕН `spec.uris` объекта `Certificate` notify; блок есть ⇔ `Deployment` notify есть. Сравнение
      идёт по разобранным объектам рендера, а не по значениям. Инъекции: (1) `notify.spiffe.saName`
      изменён только у одного читателя → красный с именем цепочки; (2) notify есть, а блока нет →
      красный.
      (в) Назвать порядок J2 и D1 NTF-2 (оба правят `charts/kaname/templates/configmap.yaml` и
      `values.yaml` зонтика) и общий помощник SAN, к которому сводятся `kaname.spiffeURI` NTF-2 и
      помощник J2
    held_by: "J05 и проба J2 (запланированы); сравнение объектов (б) в предикате J2 не названо — нужен заказ"

  - id: CX1-107
    decision: "строка K5: близнец «ключа нет → `ResolveSend` с сертификатом notify → PERMISSION_DENIED (fail-closed)»; сервер `InternalNotificationGrantService` регистрирует K3 (`cmd/kaname/grpc_register.go`), K3 ← K5"
    class: >-
      gate-authoring: исход вместо объявления. Отказ, который проба утверждает, обязан производиться
      проверяемым механизмом, а не отсутствием обработчика
    exposure: >-
      На голове K5 сервера `ResolveSend` нет: K3c даёт контракт и строки, K3 регистрирует сервер позже.
      В grpc-go вызов незарегистрированного сервиса до цепочки перехватчиков не доходит (`identityUnary`,
      `cmd/kaname/serve.go:2378`, — перехватчик): ответ `Unimplemented`. Утверждение PERMISSION_DENIED в
      K5 либо не исполнимо, либо будет исполнено на подставном пути. Положительный двойник «согласный
      ключ → вызов проходит Р2» в K5 не наблюдаем вовсе
    condition_on_code: >-
      Проба K5 регистрирует на тестовом слушателе заглушку сгенерированного K3c интерфейса
      (`Unimplemented…Server`) и судит пару, различающую звено: ключа нет → `PERMISSION_DENIED`
      (обработчик не вызван); согласный ключ → `UNIMPLEMENTED` из заглушки (Р2 пропустил). Инъекция:
      звено строится без таблицы → согласный ключ даёт PERMISSION_DENIED → красный. Либо пара переносится
      в K3, и строка K5 её не утверждает
    held_by: "проба K5 (запланирована); различающая пара в предикате не названа — до правки держится вниманием"

  - id: CX1-108
    decision: "§8 строка `authn.service-identity`: производитель значения — только подчарт kaname зонтика (J2)"
    class: >-
      security-hardening `hard-missing-knob-vs-unseeded` и security `sec-chart-carries-guard-knobs`:
      ручки нет в поставке, а не значение не задано
    exposure: >-
      Самостоятельная поставка kaname (`kaname/deploy`, @484-notify) объявляет ручки звена личности
      поимённо: `trustedForwarderSANs` (`values.yaml:499`, `configmap.yaml:226`). Флаг
      `notifications.enabled` вводит S11 NTF-2 (`values.yaml:374–377`). Блока `serviceIdentity` в ней нет
      и ни в одном маршруте не заведено. Установка kaname своим чартом рядом с notify и с флагом `true`
      не может выдать notify `ResolveSend`. Каждое письмо уходит в отсрочку `misconfigured` навсегда, и
      исправить это значением нельзя
    condition_on_code: >-
      §8 называет второго производителя — чарт `kaname/deploy`: блок `serviceIdentity: {methods,
      services}` → `authn.service-identity`; пусто — ключа нет; задана половина — отказ рендера с именем
      ручки. Строку маршрута даёт S11 NTF-2 (CX2-94 пересверки NTF-2 ba5ab10d): заказ NTF-2. Проба рендера
      поставки: согласный блок → ключ в `ConfigMap`; половина → отказ с именем
    held_by: "нужна проба рендера поставки kaname, её нет"

