# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 31 замысла, маршрут редакции 32.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта к редакции 30 (5228b32b…, запись
# revalidation/5228b32b….yaml, итог «к коду»). Дельта не закоммичена: рабочее дерево issue-880 на
# a3662915b, `git diff -- docs/changes/issue-2915/`. Пункты CX1-01…103 и условия УК1…УК94 запись не
# пересуживает.
#
# Итог — к замыслу. Пять новых пунктов. Главное: посылка Е15 опровергнута. Закрытый список
# расхождений копий каталога прав в kaname уже несёт второй вид записи — `CatalogPendingEntry`
# (kaname#181, «глагол службы, которого край ещё не видел»), с предикатом снятия ровно той формы,
# которую Е15 предлагает завести решением владельца. Вид живой: 6 записей на cbbac984b и на
# 484-notify, читатель — tools/catalogparity. Вопрос владельцу не нужен; K3c заводит три записи
# этого вида. Второе: блок `authn.service-identity` в подчарте kaname не может прочитать
# `notify.spiffe` и признак «объекты notify отрендерены» — подчарт не видит значений родителя
# (замер helm v4.2.4). Третье: имена `KANAME_AUTHN__SERVICE_IDENTITY__METHODS` и `…__SERVICES`
# строгий загрузчик kaname выведет законными сам, а replacer viper — прочитает: «переменной нет»
# в замысле держится только явным исключением. Четвёртое: двойник fail-closed в K5
# ненаблюдаем без зарегистрированного сервера. Пятое: в самостоятельной поставке kaname ручки нет.
