new_items:
  - id: CX1-116
    decision: "Д76 (1): в D1 таблица модулей `deploy/helm/notify/templates/_sources.tpl` заводится пустой, строки notifyProbe и kaname вносит D2"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением»: пустая таблица — sentinel, и её смысл
      («никого», а не «не объявлено, значит всех») обязан быть одним на всех читателях.
      code-authoring §«Решение и его следствие разнесены»: в замысле решение «рендерить ли notify» уже
      принимает непустой выведенный перечень (NTF1-N04, зависимость без condition), а пробы D1 (I01, I02,
      I05, I06) требуют объектов notify в рендере
    exposure: >-
      Замысел говорит, что шаблоны notify рендерятся только при непустом перечне (NTF1-N04) и что при пустом
      перечне объектов notify в каждой цепочке 0. Значит, на голове D1 с пустой таблицей у проб D1 нет
      предмета, а исход у них будет «не выполнилось» или ложно-зелёный на нуле объектов. Есть два коротких
      пути «починить» это, и оба — второе написание одного решения: (1) свой включатель notify для D1
      (`notify.enabled`, condition зависимости, ветка «таблица пуста — рендерить всё равно»); (2) строка
      таблицы в фикстуре проб вне `_sources.tpl`. А если D1 не вносит гейт N04 вовсе, у Д76 (2) не будет
      посылки «объектов notify 0»: зависимость без condition рендерит notify в каждой цепочке зонтика, prod
      в том числе
    condition_on_code: >-
      (а) Замысел называет на голове D1, чем решается число объектов notify в каждой цепочке зонтика. Это
      тот же предикат «выведенный перечень непуст», что в D2, без второго включателя. D1 печатает по каждой
      цепочке перечень и число объектов notify (ожидается 0). (б) Замысел называет, чем пробы D1 получают
      объекты notify. Строка в таблице вне `_sources.tpl`, ключ `notify.enabled` и ветка «пусто, но
      рендерить» запрещены. Если иначе нельзя, пробы D1 с объектами переезжают в D2, и маршрут это
      выражает. (в) Пустая таблица → помощник перечня отдаёт `[]`, рендер не падает, источников не
      выдумывает. Запасной строки по умолчанию (например kaname) нет
    held_by: >-
      Нужна проба D1, её нет. Рендер каждой цепочки зонтика на голове D1 → объектов notify 0, перечень
      `[]`, печать числа цепочек; пустой обход — красный. Инъекция: помощник перечня на пустой таблице
      отдаёт строку по умолчанию → объектов > 0 → красный. Близнец: таблица с одной строкой (голова D2) →
      объекты есть. Однофайлового признака нет
  - id: CX1-117
    decision: "Д76 (2): образ kacho-notify пинится без тега, пока notify в профилях выключен; включение без тега — отказ рендера с именем ручки; тег ставится, когда конвейер линии опубликовал образ"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением»: пустой тег — sentinel. Штатная идиома
      чарта `default .Chart.AppVersion .Values.image.tag` превращает его в утверждение «образ этой
      версии существует». code-authoring §«Решение и его следствие разнесены»: выключение notify решает
      одна полоса, публикацию образа — конвейер, тег — третья точка
    exposure: >-
      Из замысла выходит, что notify включается в цепочке зонтика, как только перечень становится непуст.
      Это D2: строки notifyProbe и kaname, флаг `global.kacho.notifications.enabled: true` в values.yaml.
      Окно «выключен, тег пуст» тогда равно голове D1, и только ей. Если тег не проставлен к D2, у D2 два
      пути: рендер, падающий в каждой цепочке, или подстановка тега «чего-нибудь» (AppVersion, `latest`,
      тег соседнего образа). Ни порядок «тег не позже включения», ни событие, которое ставит тег, ни
      предикат его снятия в замысле не названы. По ban #11 пустой тег — предмет с причиной и предикатом
      снятия, а не умолчание
    condition_on_code: >-
      (а) У тега образа notify в чарте нет умолчания: ни AppVersion, ни `latest`, ни `default`. При
      непустом выведенном перечне и пустом теге рендер падает с именем ручки (`notify.image.tag` или как её
      назовёт D1). (б) Замысел называет порядок: тег ставится не позже полосы, которая делает перечень
      непустым в какой-либо цепочке (D2 и стенд fe3455). Пока образа нет, та полоса не садится с исходом
      «не выполнилось», с ревизией и отсутствующим тегом, — как у N11r по Д64. (в) У предмета «тег пуст»
      есть причина и предикат снятия на внешнем факте: команда, которая находит образ линии с этим тегом
      в реестре, плюс ревизия
    held_by: >-
      Нужна проба D1, её нет. Рендер с непустым перечнем и пустым тегом → ошибка с именем ручки. Близнец
      — тег задан → рендер; выключено и пусто → объектов 0. Инъекция — `default .Chart.AppVersion` в
      шаблоне → проба красная. Однофайловый признак есть: `default .Chart.AppVersion` или `| default
      "latest"` в `deploy/helm/notify/templates/**` (см. блок кандидата)

