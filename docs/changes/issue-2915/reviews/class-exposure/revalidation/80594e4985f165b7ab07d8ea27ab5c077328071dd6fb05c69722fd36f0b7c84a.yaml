notes:
  - id: N34-1
    blocking: false
    where: "design.md З32 «Регистрация notify в гейтах дерева» — «запись „не применимо“ … с причиной и предикатом снятия, если ведомость такую форму требует»"
    text: >-
      Не противоречит Д73, но «если требует» оставляет исход на усмотрение полосы. Запись «не применимо»
      без предиката снятия в ведомости, которая её допускает, — то самое умолчание, ставшее утверждением,
      когда notify заведёт List или Operation. Предлагается: предикат снятия — всегда (ban11-three-outcomes)

