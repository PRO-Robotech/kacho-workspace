new_items:
  - id: CX1-114
    decision: "Д74 (редакция 34, З32): одна точка наката `services/notify/cmd/migrator` на две цепочки; цепочка пробы — `services/notify/cmd/notify-probe/internal/migrations`; `internal/migratorapply` «приводит перечисление цепочек к таблице точки»"
    class: >-
      measurement-discipline §«Радиус: по имени механизма и по точкам применения» — гейты, читающие
      цепочки миграций, находят их выводом `services/<svc>/internal/migrations`, и цепочка в ином месте
      им не видна. gate-authoring: «ноль находок неотличимо от ноль прочитанного» на уровне единицы
      обхода. code-authoring §«Контракт, который нельзя выразить»: таблица «имя базы → цепочка» живёт в
      пакете `main` под `services/notify/`, а её второй читатель — корневой пакет, которому правило
      `internal` и `main` импорт запрещают, — значит, второе объявление той же таблицы
    exposure: >-
      (1) Перепись @e415e59a2: 20 файлов выводят каталог цепочки из имени службы
      (`"internal", "migrations"` / `"/internal/migrations"` после имени службы), среди них общие обходчики
      `internal/migratorapply/apply_test.go` (`migrationsDirOf`: одна точка → одна цепочка
      `services/<svc>/internal/migrations`), `dropguard*_test.go`, `migrationsqltext_test.go`,
      `schemaversionreader_test.go`, `subscriptionjournalretention_test.go`, `outbox*_test.go`.
      Цепочка `services/notify/cmd/notify-probe/internal/migrations` им не видна по построению, а у пробы
      по З29 есть лента и журнал подписки — ровно предмет `subscriptionjournalretention` и outbox-гейтов.
      Гейты останутся зелёными, осмотрев `services/notify/internal/migrations` (цепочку шлюза), и
      «notify осмотрен» прочтётся как полнота. (2) `migratorapply` на голове D4 (до N7) выведет каталог
      `services/notify/internal/migrations`, которого ещё нет: эталон длины 0 и накат 0 — сверка «0 = 0»
      зелёная при ненакаченной цепочке пробы. (3) «Перечисление цепочек по таблице точки» исполнимо
      только вторым литералом в `migratorapply` или собственным разбором исходника точки — таблица живёт в
      `package main` под `services/notify/cmd/migrator`, импорт её корнем невозможен (doc.go migratorapply
      сам фиксирует запрет импорта `services/<svc>/internal/...`)
    condition_on_code: >-
      (а) Таблица «имя базы → каталог цепочки» объявлена ОДИН раз в форме, читаемой и точкой наката, и
      корневыми гейтами без импорта `main`/`internal` (файл данных рядом с точкой либо экспортируемый
      пакет вне `internal`), либо замысел называет иное размещение цепочки пробы, которое существующие
      обходчики видят без правки. Второго литерала таблицы в `migratorapply` нет. (б) Каждый гейт дерева
      kacho, выводящий каталог цепочки из имени службы, переходит на перечень цепочек (обход
      `services/**/internal/migrations` или таблица (а)) — тем же изменением, что вводит вторую цепочку
      (D4); перепись таких гейтов — в строке D4 поимённо с числом осмотренных. (в) `migratorapply` и
      гейты, читающие цепочки, печатают число осмотренных цепочек по `services/notify` (2 после N7, 1 на
      голове D4) и красные на нуле
    held_by: >-
      Нужен гейт, его нет. Инъекции на голове D4: (1) нарушение формы SQL (предмет
      `migrationsqltext`) в файле цепочки пробы → красный с путём; близнец — то же в цепочке шлюза →
      красный (видимость обеих). (2) Строка таблицы `kacho_notifyprobe` снята → `migratorapply` красный с
      именем базы, а не «0 = 0». (3) Журнал подписки в цепочке пробы без правила хранения →
      `subscriptionjournalretention` красный. Однофайлового признака нет (вывод пути разнесён по
      файлам), в class-guard не годится

