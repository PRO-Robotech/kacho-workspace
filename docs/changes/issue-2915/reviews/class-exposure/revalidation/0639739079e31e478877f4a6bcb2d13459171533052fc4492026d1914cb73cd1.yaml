mapping_check:
  - id: CX1-68
    design: "З24 (строки 1123–1193), З27 (строка 1270), З28 (строки 1302–1312), §3 И35, §6, §8, §12, §13 Е6, Е11, §11 строка 1704"
    verdict: holds_except_new_item
    note: >-
      (а) строка §11 есть; (б) явный `pgx.TxOptions{IsoLevel: pgx.ReadCommitted}`, сторож — только ноль
      строк чтения ограды, 40001/40P01/иная ошибка — не сторож и не клетка 9, строка — путём «без Ack»
      клетки 8 до конца аренды, отказ видим счётчиком; инъекция REPEATABLE READ в N7 — исполнено;
      (в) выбран вариант «остановка приёма»: новых `Claim` и резервов нет, закоммиченные резервы
      доводятся до `Ack`, затем выход; инъекция «выход сразу» → двойная отправка → красная; решение
      названо в §12 и §13 — исполнено; (г) имя `<установка>-recipient-key`, `secretKeyRef.name` то же,
      гейт D1 двумя рендерами с разными ключами и инъекцией имени от `sha256sum` — исполнено; (д) запись
      ограды — один оператор в автокоммите после миграций и до первого `Claim` — исполнено, держится
      вниманием и db-architect-reviewer, как и назначено; (е) колонка `since` снята (§6), журнал старта
      назван — исполнено; (ж) `errors.Is` попарно в N7 — исполнено. Не выдерживает довод, на который
      опирается (д): «ждёт он только резервы в полёте … ожидание короткое» (строки 1137–1138). Замер
      М32: строчный замок `FOR SHARE`, взятый поверх уже держащих его, не встаёт в очередь за ждущим
      писателем, и при перекрывающихся резервах запись старта ждёт весь поток — это пункт CX1-69
  - id: "УК90"
    design: "З16 строки 855–863, инъекция C10 строки 886–889, §11а строка 1810"
    verdict: does_not_hold
    note: >-
      Форма З16: результат `tablename.Of` — аргумент `fmt.Sprintf`, «чья форматная строка — литерал,
      начинающийся глаголом SQL (INSERT INTO, UPDATE, DELETE FROM, SELECT; CREATE/ALTER для schema)», и
      «один вызов — один оператор». Оператор возврата вклада З10 (строки 583–611) — один из трёх
      операторов окна ведомости — начинается с `WITH x AS (`, а таблицу окна называет дважды (`FROM
      <window> w JOIN d` в шаге `l`, строка 601, и `UPDATE <window> w`, строка 607); ленту `<t>` — тоже
      дважды (строки 584, 589). По правилу З16 он либо находка (литерал начинается не глаголом из
      перечня) — близнец «три оператора окна → зелёный с числом 3» тогда красный на исправном дереве,
      — либо даёт два вызова `Of(…, Window)` на один оператор, и «число писателей окна (corelib — 3)»
      не равно числу вызовов. То же у уборки закрытых строк (`DELETE FROM <t> … IN (SELECT id FROM <t>`,
      строка 648). Условие УК90 (сохранённое имя не прячет оператор) при этом верно; неверна единица,
      которой З16 его исполняет — условие к коду УК92
  - id: "УК91"
    design: "З28 строки 1307–1312, §8 строка `notify.recipientKey`, §11а строка УК91"
    verdict: holds
    note: "шаблон без `rand*`, `genPrivateKey`, `lookup`; пустое значение — `required` с именем ручки; проба D1 с двумя рендерами и инъекцией `randAlphaNum 32` — исполнено дословно"
  - id: "Д23"
    design: "§13 Е11"
    verdict: holds
    note: "Е11 дополнена: одна ограда на базу notify у развёртываний с одним объектом ключа, постоянное имя у обоих — заказ записи 0be18f04 NTF-4 передан"

conditions_to_code:
  - id: УК92
    item: "УК90 (CX1-64 (б), УК87, УК89)"
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (гейт судит по идентичности того, что утверждает); rule testing-verdict п.14 «Твой СОБСТВЕННЫЙ разборщик — тоже распознаватель»"
    condition: >-
      единица ведомости `AuditFeedTableWrites` — ВЫЗОВ `fmt.Sprintf` (оператор), а не вызов
      `tablename.Of` и не первый глагол литерала: (а) результат `Of` употребляется только аргументом
      `fmt.Sprintf` с литеральной форматной строкой в том же выражении (запрет сохранения из УК90 в
      силе); (б) один и тот же вид таблицы в одном операторе называется одним вызовом `Of` и
      индексированным глаголом `%[n]s`, второй вызов `Of` того же вида в одном `Sprintf` — находка;
      (в) ведомость перечисляет места `Sprintf` по идентичности (функция-владелец) с видами таблиц,
      которые оператор называет, и гейт сверяет каждое место с ведомостью, не классифицируя литерал по
      его первому слову; «писатель окна» — место ведомости с видом `Window`, их три, и оператор возврата
      З10 (`WITH x AS (UPDATE <t> …) … UPDATE <window> …`) — одно место с видами `outbox`, `contrib`,
      `window`. Либо З16 называет иную единицу, при которой оператор возврата З10 и уборка закрытых
      строк проходят гейт на исправном дереве, а сохранённое имя остаётся находкой
    held_by: >-
      гейт C10: близнец — три оператора окна в форме §З7/З10, включая оператор возврата вклада с `WITH`
      и двумя упоминаниями окна через `%[n]s` → зелёный с числом писателей окна 3; инъекции — второй
      вызов `Of(…, Window)` в одном `Sprintf` → красный; сохранённое имя в поле конструктора и
      четвёртый оператор (УК90) → красный с координатой присваивания; `Sprintf` вне ведомости с
      вызовом `Of` → красный

items:
  - id: CX1-69
    decision: >-
      З24 «запись ограды при старте — отдельный оператор в собственной транзакции»: `INSERT … ON
      CONFLICT (singleton) DO UPDATE … WHERE fingerprint <> EXCLUDED.fingerprint` против чтения ограды
      `FOR SHARE` первым оператором каждой транзакции резерва; довод «ждёт он только резервы в полёте …
      ожидание короткое» (строки 1137–1138)
    class: >-
      code-authoring §«Порядок операций внутри кода» (порядок взятия замков писателем и читателями
      одной строки); §«Решение и его следствие разнесены» (решение «новый ключ действует» принято
      репликой, а следствие — остановка старых — наступает только после записи, которая может не
      наступить)
    exposure: >-
      Строчный замок PostgreSQL не выстраивает очередь для совместимых запросов: транзакция, берущая
      `FOR SHARE` на строке, которую уже держат `FOR SHARE`, получает замок сразу, минуя ждущего
      писателя. Пока резервы перекрываются во времени (две и больше реплики или исполнителя
      резервируют одновременно — `notify.workers` до 256 на реплику, З21), строка ограды не бывает
      свободной, и запись старта ждёт весь поток (М32: 7,0 с при 4 параллельных резервах, 12,0 с при
      16 — ровно до конца нагрузки; при 1 — 6 мс). Старые реплики ограды не видят (она не сменилась)
      и продолжают резервировать под старым ключом, новая реплика до записи в `Claim` не входит —
      ротация под нагрузкой не сходится, а при пробе живости пода новая реплика перезапускается
      циклом. Проба N7 этого не видит: у неё резерв первой реплики один и стоит в паузе, перекрытия
      нет
    condition: >-
      (а) строка §11 CX1-69 → З24, §3 И35; (б) запись ограды при старте не может голодать под потоком
      резервов: её транзакция первым оператором берёт табличный замок, конфликтующий с замком чтения
      ограды (`LOCK TABLE recipient_key_fence IN EXCLUSIVE MODE` против `ROW SHARE`, который берёт
      `FOR SHARE`), — табличные замки выстраивают очередь, и новые резервы ждут за записью (М32 (в):
      22 мс при 16 параллельных резервах), — затем тот же оператор записи и коммит; транзакция по-прежнему
      собственная и короткая (CX1-68 (д)). Либо З24 называет иную форму с тем же свойством (ожидание
      записи ограничено резервами, начатыми до неё); (в) у ожидания записи есть предел
      (`lock_timeout` транзакции записи) и исход по пределу — отказ старта с записью в журнал, а не
      бесконечное ожидание; (г) довод «ожидание короткое» в З24 заменён утверждением о форме замка с
      замером
    held_by: >-
      (б) проба ограды N7: поток перекрывающихся резервов первой реплики (не меньше 4 параллельно,
      не прекращается) и старт второй → запись ограды завершается, пока поток идёт, следующий резерв
      первой — сторож; инъекция — запись без табличного замка → запись не завершается за время
      потока, проба красная; близнец — один резерв без перекрытия → запись завершается и без замка;
      (в) проба N7: табличный замок держит посторонняя транзакция дольше предела → старт отказывает с
      записью в журнал; (г) ревью замысла

