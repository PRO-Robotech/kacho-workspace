# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 6 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. По Д22 судится ТОЛЬКО дельта редакции 6 против последней разобранной
# (редакция 5, 0be18f04…, запись revalidation/0be18f04….yaml). Предмет дельты — `git diff b206f816f
# b746239d5 -- docs/changes/issue-2915/design.md` (+141/−50): отображение CX1-68 (З24 запись ограды,
# изоляция резерва, ошибка базы не сторож, остановка приёма; З27 счётчик; З28 постоянное имя объекта
# ключа; §3 И35; §6 без `since`; §8; §11 строка CX1-68; §12; §13 Е6, Е11), УК90 (З16), УК91 (З28, §8),
# замер М31 в §1. Пункты CX1-01…67 и их отображения этой записью не пересуживаются.
# Итог: CX1-68 отображён, (а)–(в), (г), (е), (ж) выдерживают условия; УК91 исполнено. Не выдерживают
# два места. (1) Утверждение З24 «запись ограды ждёт только резервы в полёте — ожидание короткое»
# опровергнуто замером М32: при двух и более одновременных резервах под `FOR SHARE` запись старта
# ждёт, пока идёт поток резервов (7,0 с и 12,0 с — до конца нагрузки; при одном резерве — 6 мс);
# старые реплики ограды не видят и продолжают резервировать, новая реплика в `Claim` не входит —
# ротация под нагрузкой не сходится. Это новый пункт перечня CX1-69. (2) УК90 в форме З16 противоречит
# оператору возврата вклада З10: его текст начинается с `WITH`, а не с глагола из перечня, и называет
# таблицу окна дважды — по правилу З16 один из трёх операторов ведомости становится находкой либо
# даёт два вызова на один оператор; условие к коду УК92. Возврата в приёмку дельта не даёт; NTF1-L03
# записи 9bfa92be в силе (приёмка не менялась, 29cfa368…). Права писать реализацию эта запись не даёт.
