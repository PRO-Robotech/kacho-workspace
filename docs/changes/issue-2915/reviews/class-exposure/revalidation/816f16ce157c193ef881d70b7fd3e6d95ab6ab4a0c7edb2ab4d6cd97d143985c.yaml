# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 23 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 22
# (efff0ee7…, запись revalidation/efff0ee7….yaml, коммит 72929148b, итог «к замыслу»: CX1-94,
# CX1-95; N16–N19). Дельта — коммит b03b11845: отображение CX1-94, CX1-95, N16–N19, замер М43.
# Пункты CX1-01…93 и условия УК1…УК94 эта запись не пересуживает.
#
# Итог — к замыслу. N16–N19 отображены и выдерживают. CX1-94 отображён, но в одном месте
# отображение не выдерживает условия пункта, — это CX1-97. CX1-95 отображён новой опорой, а
# утверждение этой опоры в дереве ложно по построению, — это CX1-96. Оба пункта измерены на
# настоящем зонтике origin/1276@23f1e058a35, helm v4.2.4:
#   CX1-96. Узел `global.kacho.identity.smtp` читает не только notify. Подчарт kaname (он в рендере
#   `prod` всегда) выводит из адреса `invite-mail.relay` в своём ConfigMap, а хеш конфигурации идёт в
#   аннотацию его Deployment. Замер «образец / тот же образец с `alt-<хост>`» дал 186 объектов в обоих
#   рендерах и две различающиеся строки вне notify: `relay` и `kacho.cloud/config-checksum` у kaname.
#   Значит, утверждение «объекты вне notify побайтно равны» краснеет на каждом образце. Нога (1) на
#   фикстурной копии идёт «всегда» с посадки D2, а читатель kaname снимает только NTF-2 D1. Близнец
#   инъекции «адрес только в notify → молчание» при этом не бывает молчаливым.
#   CX1-97. Снять ровно один ключ не значит получить ровно один отказ. Операторский образец (адрес с
#   именем, `credentialSecret`, отправитель) с `--set …connectionURI=null` отвергает страж зонтика
#   `identity-mail-lane-guard.yaml:85` («отправитель объявлен, узел не задан»), а по коду есть и :122.
#   С `required` notify (модель подчарта в настоящем зонтике) трижды подряд выходит отказ notify:
#   helm обходит шаблоны по глубине пути. Имя ключа есть в обоих текстах, поэтому проба D1 держится.
#   Текст с флагом (D2, N11 · CX2-57 (в)) есть только у notify, и держится он порядком обхода. Фраза
#   З28 «имя в отказе не зависит от порядка шаблонов» верна для имени и неверна для отказывающего.
# Возврата в приёмку нет.
