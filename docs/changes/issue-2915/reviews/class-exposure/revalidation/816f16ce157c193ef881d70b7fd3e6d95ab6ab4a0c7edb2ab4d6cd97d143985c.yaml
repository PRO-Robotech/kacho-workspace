mapping_check:
  - item: "CX1-94 (а)"
    verdict: holds
    evidence: >-
      Утверждаемый отказ получается на цепочке `prod` через обёртку, со слоем образца минус ровно
      проверяемый ключ; снятие — `--set <ключ>=null`. Замер этой записи на настоящем зонтике
      подтверждает М43: `--set global.kacho.identity.smtp.connectionURI=null` поверх образца снимает
      узел, rc 1. Формулировки «с именем узла и ручки» и «голый `-f values.prod.yaml`» исходами не
      считаются
  - item: "CX1-94 (б), (в)"
    verdict: holds_with_note
    evidence: >-
      Пробы D1 и D2 (Д46, N11 · CX2-57 (в)) переведены на обёртку и образец минус адрес. Предпосылка
      «снят один ключ, опора рендерится с rc 0» печатается, при нарушении исход «НЕ ВЫПОЛНИЛОСЬ».
      Инъекция «сняты два ключа» с близнецом названа. Она судит число ключей, а не их
      обязательность, и от этого корректна: М43 (5) — `fromAddress` необязателен. Но предпосылка
      гарантирует не больше одного незаданного ЗНАЧЕНИЯ, а не не больше одного ОТКАЗЫВАЮЩЕГО
      шаблона — CX1-97
  - item: "CX1-94 (г)"
    verdict: holds
    evidence: "Инъекция Д48 «слой снят целиком» утверждает только rc ≠ 0 и имя цепочки, имени значения не утверждает (строка §11 Д48)"
  - item: "CX1-94 · фикстурная копия D1"
    verdict: holds_with_note
    evidence: >-
      Состав назван: зонтик, `charts/`, зависимости `Chart.yaml` с локальным источником, каталог
      образцов — всё в прежнем взаимном положении. Каждый элемент цепочки проверяется до рендера. На
      origin/1276 и origin/2564 по семь зависимостей вида `file://../../../<компонент>/deploy`, то
      есть вне зонтика, и их `.tgz` не отслеживаются. Удалённые зависимости лежат в `charts/*.tgz` и
      отслеживаются, на 2564 — вместе с `kratos` и `hydra`. Значит, копия рендерится только после
      `helm dependency build --skip-refresh`, как в М38. К коду: проба печатает этот шаг и его rc,
      отказ — «НЕ ВЫПОЛНИЛОСЬ» (N20)
  - item: "CX1-95 (а)"
    verdict: fails
    evidence: >-
      Опора — `alt-<хост>` аргументом `--set` после цепочки; она рендерится при любом состоянии
      перечня (замер: rc 0, 186 объектов). Но утверждение «объекты вне notify побайтно равны»
      неверно, пока узел читает kaname — CX1-96
  - item: "CX1-95 (б)"
    verdict: holds
    evidence: >-
      Состояние перечня и число объектов notify печатаются по каждому образцу. Нога (1) идёт на
      копии всегда, с предпосылкой «перечень непуст, notify > 0», иначе «НЕ ВЫПОЛНИЛОСЬ». Нога (2)
      при пустом перечне печатает «не проводится» и в зелёные не входит. Число ног печатается.
      Сравнение и печать вносит D2 — изменение, с которым notify входит в рендер; путь пробы образца
      есть в путях D2
  - item: "CX1-95 (в)"
    verdict: holds_with_note
    evidence: "Инъекция «ConfigMap края в копии читает адрес» названа. Близнец «адрес только в notify → молчание» при читателе kaname молчать не может — CX1-96"
  - item: N16
    verdict: holds
    evidence: "Прежняя форма — `render_chain_args prod <образец>`, она отказывает; близнец — новая форма, строка цепочки. Совпадает с Е12 (8)"
  - item: N17
    verdict: holds
    evidence: >-
      Строка Е13, порядок яруса 6 tasks.md «D9 до D6 NTF-2», предикат старта D6
      `git ls-tree --name-only origin/2564 deploy/testdata/mail-node/` называет `operator.yaml`.
      Предикат умеет ответить «нет»: сегодня каталога на 2564 нет
  - item: N18
    verdict: holds
    evidence: "Каждая строка рендера `prod` в `prod-profile-fail-closed-test.sh`, включая `render_only … --show-only`, идёт через обёртку; помощник берёт аргументы цепочки целиком; инъекция — один `render_only` с прямым `-f`"
  - item: N19
    verdict: holds
    evidence: "Е12 (9): держатель NTF-2 рендерит образец минус ключ ручки через обёртку с предпосылкой. К нему относится и CX1-97 — заказ ниже"

items:
  - id: CX1-96
    status: unmapped
    decision: "З28 «Проба образца» → «Опора сравнения — второй законный адрес» (утверждение «объекты вне notify в двух рендерах побайтно равны»), «Сравнение — там, где узел попадает в рендер» (нога (1) на фикстурной копии D1 — «всегда»), «Инъекция» (близнец «адрес только в notify → молчание»); §11 CX1-95, Д51"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением» (опора молча считает notify
      единственным читателем узла); .claude/rules/testing.md §«Гейт на класс: измерить по дереву,
      доказать инъекцией, снабдить проверкой предпосылки» п.1 (утверждение о дереве не измерено по
      дереву); .claude/rules/architecture.md §«Параллельные полосы одного механизма обязаны сверяться
      МЕЖДУ СОБОЙ» (читателя kaname снимает NTF-2 D1, а сравнение вводит NTF-1 D2)
    finding: >-
      (1) Узел `global.kacho.identity.smtp` на origin/1276, origin/2564 и origin/main читают три
      шаблона вне notify: `charts/kaname/templates/configmap.yaml` (строки 612–657:
      `invite-mail.relay` = хост:порт адреса, `from`, `from-name`, `tls-mode`),
      `charts/kaname/templates/deployment.yaml` (пара удостоверения, том якоря) и страж зонтика. Хеш
      ConfigMap kaname идёт в аннотацию `kacho.cloud/config-checksum` его Deployment (М30). Подчарт
      kaname входит в рендер `prod` без условия. (2) Замер на origin/1276, `prod` плюс образец формы
      оператора, опора `--set …connectionURI=smtps://relay-user@alt-smtp.example.org:465/`. Оба
      рендера — rc 0, по 186 объектов; `diff` — две строки, обе вне notify: `relay:
      "smtp.example.org:465"` против `"alt-smtp.example.org:465"` и `kacho.cloud/config-checksum`
      kaname. Значит, «объекты вне notify побайтно равны» краснеет на каждом образце, пока в дереве
      есть читатель kaname. (3) Читателя снимает полоса D1 NTF-2 (tasks.md NTF-2: «`configmap` kaname
      без `invite-mail`», «`deployment.yaml` без `KANAME_INVITE_MAIL_*` и тома якоря»). Сравнение же
      вводит D2 NTF-1, и нога (1) идёт «всегда». Её копия собрана из отслеживаемых файлов базы, где
      kaname узел читает. Нога (1) краснеет с посадки D2 до посадки D1 NTF-2, и причина — не предмет
      пробы. (4) Близнец инъекции CX1-95 (в) «адрес только в notify → молчание» в этом окне тоже
      красный, так что инъекция ничего не отличает. (5) Прежнее утверждение редакции 22 «число
      объектов вне notify равно» здесь было бы зелёным (186 = 186). Более сильное утверждение
      оказалось верным ровно настолько, насколько верна посылка «вне notify узел никто не читает», а
      её не измеряли
    condition_to_design: >-
      (а) В З28 записан замер: вне notify узел читают шаблоны kaname, `configmap.yaml` и
      `deployment.yaml` (ключ, строка, ревизия); читателя снимает D1 NTF-2. (б) Утверждение сравнения
      переписано так. Объекты вне notify побайтно равны, КРОМЕ закрытого перечня объявленных
      читателей узла вне notify. Перечень записан в пробе по объекту (вид, имя, чарт), и различие в
      каждом его объекте утверждается дословно: строка `relay` и аннотация хеша kaname. Перечень
      истекает сам: объект из перечня, у которого различия нет, — красный «исключение без
      исключаемого» с именем объекта. Так после D1 NTF-2 перечень обязан опустеть, иначе проба
      краснеет. Удалённая альтернатива — нога (1) не проводится, пока в копии есть читатель kaname —
      хуже: она оставляет CX1-95 без держателя на всё окно NTF-1. (в) Инъекция CX1-95 (в) остаётся:
      ConfigMap края, которого в перечне нет, читает адрес → красный с именем объекта. Близнец —
      адрес только в notify и в объектах перечня → молчание. Вторая инъекция — объект перечня без
      различия → красный «исключение без исключаемого». (г) Е12 получает строку для NTF-2: полоса D1
      NTF-2, снимающая читателя kaname, тем же изменением опустошает перечень пробы образца. Путь
      пробы — в путях D1 NTF-2
    held_by: "нужен гейт — перечень исключений пробы образца с самоистечением; сегодня утверждение держится ничем и на дереве красное"

  - id: CX1-97
    status: unmapped
    decision: "З28 «Отказ утверждается при одном незаданном значении» (б) («тогда незаданное обязательное значение в отрицании не больше одного, и имя в отказе не зависит от порядка шаблонов»); З28 «Узел почты → ключ процесса» проба D2 «текст с обоими выходами»; §11 N11 · CX2-57 (в), CX1-94; NTF-2 Е12 (9)"
    class: >-
      code-authoring §«Инвариант и оснастка — это тоже прод-код» (утверждение пробы держится порядком
      обхода шаблонов helm, а не своей конструкцией); change-graph «отрицательный кейс меняет ровно
      один факт против положительного близнеца» (один снятый ключ включает два отказывающих
      шаблона); .claude/rules/testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией,
      снабдить проверкой предпосылки» п.7 (предпосылка судит не то, от чего зависит исход)
    finding: >-
      (1) Замер на origin/1276: `prod` плюс операторский образец (адрес с именем, `credentialSecret`,
      `fromAddress`, `fromName`) и `--set global.kacho.identity.smtp.connectionURI=null` → rc 1,
      отказ `identity-mail-lane-guard.yaml:85` «адрес отправителя объявлен…, но узел почтовой полосы
      НЕ задан (global.kacho.identity.smtp.connectionURI пуст)». В этом же страже на снятый узел
      отказывает и строка 122 (`credentialSecret` без узла). (2) В настоящий зонтик положена модель
      подчарта `charts/notify` с `required` на том же ключе и текстом с флагом. Три прогона подряд
      дали отказ `kacho-umbrella/charts/notify/templates/configmap.yaml`, а не стража. Образец без
      удостоверения дал то же. Helm обходит шаблоны от более глубокого пути к менее глубокому, и
      подчарт идёт раньше шаблонов зонтика. (3) Значит, при предпосылке CX1-94 (б), выполненной
      («снят один ключ, опора rc 0»), отказывающих шаблонов два, а не один. Проба D1 утверждает имя
      ключа, и оно есть в обоих текстах, так что D1 держится своей конструкцией. Проба D2 утверждает
      текст с флагом `global.kacho.notifications.enabled`, а он есть только у notify, так что D2
      держится порядком обхода. Это тот самый класс, который закрывал CX1-94. (4) Фраза З28
      «имя в отказе не зависит от порядка шаблонов» верна для имени, а для отказывающего шаблона и
      его текста неверна. Исполнитель прочтёт её как разрешение не утверждать, кто отказал. (5) Та же
      форма у NTF-2 Е12 (9): снятие ключа ручки прыжков. Какие шаблоны края отказывают на него, не
      измерено — D6 NTF-2 не написан
    condition_to_design: >-
      (а) Предпосылка CX1-94 (б) дополнена: проба утверждает не только имя ключа, но и ОТКАЗЫВАЮЩИЙ
      шаблон — путь из `execution error at (<путь>:<строка>)` вывода helm. Для D1 и D2 это шаблон
      ConfigMap notify. Отказал другой шаблон — «НЕ ВЫПОЛНИЛОСЬ» с его путём и текстом, а не зелёный
      и не красный. (б) В З28 записан перечень шаблонов, отказывающих на снятие адреса узла, измеренный
      по дереву: страж `identity-mail-lane-guard.yaml` строки 85, 122 и `required` notify. Там же
      сказано, что при этом перечне порядок обхода helm — предпосылка, а не гарантия. Проба печатает
      путь отказавшего шаблона. (в) Инъекция: образец, в котором отказ стража наступает раньше
      notify (фикстурная копия со стражем, перенесённым в подчарт с более глубоким путём, либо любое
      другое построение, дающее отказ стража первым) → «НЕ ВЫПОЛНИЛОСЬ» с путём стража. Близнец —
      копия как есть → отказ notify, текст с обоими выходами. (г) Фраза «имя в отказе не зависит от
      порядка шаблонов» заменена на «имя ключа есть в тексте каждого отказывающего шаблона; кто
      отказал — утверждается путём». (д) Е12 (9) получает ту же форму для держателя ручки NTF-2:
      утверждается путь отказывающего шаблона края
    held_by: "нужен гейт — утверждение пути отказывающего шаблона в пробах D1, D2 и в держателе NTF-2 Е12 (9); сегодня D2 держится порядком обхода helm (глубина пути)"

notes:
  - id: N20
    blocking: false
    where: "З28 «Фикстурная копия D1»"
    text: >-
      На origin/1276 и origin/2564 у зонтика по семь зависимостей вида
      `file://../../../<компонент>/deploy` (`services/{vpc,compute,nlb,registry,storage}`, `gateway`,
      `ui-future`). Их `.tgz` в `charts/` не отслеживаются. Отслеживаются `kacho-geo/`, `kaname/`,
      `kratos-selfservice-ui/` (2564) и `.tgz` удалённых зависимостей. Копия «из отслеживаемых файлов»
      без `helm dependency build --skip-refresh` не рендерится. Шаг сборки обходится без сети: удалённые
      `.tgz` на месте, а file://-зависимости упаковываются из копии. Для этого каталоги
      file://-зависимостей вне `deploy/` копируются в том же взаимном положении. Формулировка
      «зависимости `Chart.yaml` с локальным источником» это покрывает, если её читать как каталоги вне
      зонтика. К коду: проба D1 печатает шаг сборки и его rc, отказ — «НЕ ВЫПОЛНИЛОСЬ»
    predicate: "git -C project/kacho show origin/2564:deploy/helm/umbrella/Chart.yaml | grep -c 'repository: file://'; git -C project/kacho ls-tree --name-only origin/2564 deploy/helm/umbrella/charts/"

