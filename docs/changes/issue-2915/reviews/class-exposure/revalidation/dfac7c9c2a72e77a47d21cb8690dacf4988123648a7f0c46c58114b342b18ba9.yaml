new_items:
  - id: CX1-124
    decision: "Д85: живой гейт поверхностей метрик при пустой таблице notify выходит кодом 2 («НЕ ВЫПОЛНИЛОСЬ: перечень пуст») вместо 0; замысел: «стенда в волне нет, production-posture.yml — только workflow_dispatch», решение о рецепте dev-prod-up — вопрос диспетчеру"
    class: >-
      code-authoring §«Решение и его следствие разнесены»: код выхода меняется в гейте, а читает его
      рецепт под `set -e` и классификатор подъёма в конвейере. measurement-discipline §«Чужое измерение
      и чужое заявление»: посылка о триггерах конвейера не измерена
    exposure: >-
      Измерено @2fdbc6b523a. production-posture.yml `on:` — workflow_dispatch, pull_request (branches:
      main, '[0-9]+', '[0-9]+-*'), schedule. Ветка эпика 2914-notify подходит под '[0-9]+-*'. Запрос волны
      #2991 (база 2914-notify) прогнал production-posture на 2fdbc6b523a, исход success, событие
      pull_request (gh run list). Шаг stand зовёт `stand-up.sh -- make dev-prod-up`. Рецепт
      (deploy/Makefile:926-933) под `set -e` зовёт assert-metrics-surfaces-answer раньше
      assert-outbox-autovacuum. stand-up.sh: при ненулевом коде без отметки чужой причины —
      «категория: КРАСНОЕ — подъём сорвался» и `::error`. Третья категория возможна только по отметке
      чужой причины, и она же выставляет STAND_PRECONDITION_UNMET, который пропускает все шаги ниже. Значит,
      после D1s каждый запрос в 2914-notify до D2 получает красный production-posture (в
      required-contexts его нет, слияние не заблокировано). assert-outbox-autovacuum на этих прогонах не
      исполняется, и снаружи это не видно. D2 ждёт kacho#1276 (Д80), так что окно длится
      несколько волн. Посылка замысла «стенд в волне не поднимается» верна для полосы D1s и неверна для
      конвейера запроса волны
    condition_on_code: >-
      (а) Абзац З32 (г) называет измеренные триггеры production-posture.yml и исход конвейера на запросе
      волны после D1s. Ссылка на «только workflow_dispatch» снимается. (б) Выбирается одно, и выбор
      записывается в замысле: либо диспетчер принимает красный production-posture на запросах в
      2914-notify до D2 (решение с предикатом снятия «D2 влита»), либо рецепт dev-prod-up исполняет все
      гейты и выходит худшей категорией, а код 2 одного гейта не прячет красный и не пропускает
      остальные. Во втором случае stand-up.sh различает «гейт после подъёма — НЕ ВЫПОЛНИЛОСЬ» и «подъём
      сорвался», и у этого есть самопроба. Какая форма — решает диспетчер. Замысел не вправе молча оставить
      рецепт с `set -e`, опираясь на неверную посылку. (в) При второй форме — инъекция «assert-metrics
      выходит 2» → assert-outbox-autovacuum исполнен и напечатан, итог 2. Близнец — все 0 → итог 0.
      Инъекция «один гейт 1, другой 2» → итог 1
    held_by: >-
      Сейчас — ничем: конвейер покраснеет на первом запросе после D1s. При второй форме — самопроба
      stand-up.sh и рецепта. Однофайлового признака нет
  - id: CX1-125
    decision: "Д83 (б): текст отказа разбора DSN — фиксированный, без DSN и его кусков в обеих формах; держатель — отказ точки на DSN с паролем-маркером в обеих формах, stderr без подстрок маркера длиной ≥ 4"
    class: >-
      code-authoring §«Инвариант и оснастка — это тоже прод-код»: держатель обязан задевать ветку, которую
      держит. gate-authoring: инъекция настоящим входом
    exposure: >-
      Измерено ParseConfig (pgx v5.10.0). Ключевая форма с пробелом в пароле и `dbname=` после него
      ПРИНИМАЕТСЯ: db "", пароль обрезан до первого слова. Отказ точки идёт веткой «DSN не называет
      базу», ветку отказа разбора она не задевает. Та же форма, где за паролем ничего нет, даёт отказ
      ParseConfig «failed to parse as keyword/value», и его текст несёт `password=xxxxx <хвост пароля>`.
      Редакция pgconn скрывает только первое слово пароля, поэтому посылка замысла «ParseConfig печатает с
      паролем xxxxxx» верна для формы URL и неверна для ключевой. Пробу из замысла («маркер в обеих
      формах») можно собрать так, что ключевая форма пройдёт веткой пустой базы. Тогда обёртка `%w`
      вокруг ошибки ParseConfig останется зелёной. Скобка замысла «(`%w` её текста не несёт)» неверна:
      `fmt.Errorf("…: %w", err).Error()` текст err несёт
    condition_on_code: >-
      (а) Проба D4 по ключевой форме берёт DSN, который ParseConfig ОТВЕРГАЕТ (маркер — хвост пароля после
      пробела, за ним ни одной пары), и печатает, какой веткой прошёл отказ. Отдельный случай — DSN,
      который ParseConfig принимает с пустой базой, тоже без маркера в stderr. (б) Ошибка ParseConfig не
      входит в возвращаемую цепочку ни `%w`, ни `%v`. Наружу — значение без Unwrap к ней. (в) Инъекция —
      отказ разбора обёрнут `fmt.Errorf("…: %w", err)` → проба красная по ключевой форме. Близнец — как
      требуется → зелёная. Скобку «(`%w` её текста не несёт)» замысел исправляет на «не оборачивается ни
      `%w`, ни `%v`»
    held_by: "Проба D4 с инъекцией (в). Однофайлового признака нет"
  - id: CX1-126
    decision: "Д84 (б), (в): форма без строки своей базы (kacho_notify до N7) и строка без формы (kacho_notifyprobe до D3) — «НЕ ВЫПОЛНИЛОСЬ» по самоистекающим записям; в замысле — «подтест — пропуск с этим текстом, за зелёное не идёт» в internal/migratorapply/invocation_test.go"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением»: третья категория выражена средством,
      которое у потребителя значит другое. code-authoring §«Решение и его следствие разнесены»: исход
      решается в тесте, а судит его классификатор полосы
    exposure: >-
