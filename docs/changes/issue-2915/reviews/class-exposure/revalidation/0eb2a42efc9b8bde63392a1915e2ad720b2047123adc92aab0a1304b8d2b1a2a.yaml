mapping_check:
  - item: CX1-111
    verdict: holds
    text: >-
      (а) Таблица модулей: строка несёт ключ `modules.<ключ>` и путь собственного ключа флага от корня
      значений зонтика: `kaname.config.notifications.enabled` и `notifyProbe.notifications.enabled`. Три
      отказа строятся по таблице. Страж зонтика `notifications-flag-guard.yaml` помещён в шаблон зонтика:
      только там видно `.Values.<подчарт>` (замер разбора 1bffe10d). (б) Если ключ отсутствует в
      таблице, рендер отказывает с его именем и перечнем ключей таблицы. (в) ConfigMap kaname берёт флаг
      только через enabledFor. Умолчание подчарта и ключи профилей снимаются тем же изменением D2, что
      переводит читателя. Окна «принят и не прочитан» нет. Инъекция (3) с фикстурой
      `probeB.config.notifications.enabled` доказывает, что отказ построен по таблице, а не по образцу.
      Сверх условия, верно
  - item: CX1-112
    verdict: holds
    text: >-
      Узлы `global.kacho.{notifications,spiffe}` объявлены только в зонтике. Гейт согласия
      `identity_global_defaults_agree_test.go` переходит на перечень узлов: для identity сверяет
      согласие, для notifications и spiffe ждёт 0 объявлений. N01, N02, J05 обходят все файлы значений,
      печатают число файлов и краснеют на пустом обходе. Инъекции (1) и (2) заведены с близнецами
  - item: CX1-113
    verdict: holds
    text: >-
      Место выбрано верно: чарт notify входит в рендер зонтика (зависимость без condition) и в ногу без
      зонтика, а зонтик в ногу не входит. Помощники разнесены по файлам `_flag.tpl`, `_sources.tpl`,
      `_spiffe.tpl`, на каждое имя один define. Гейт `notify_helpers_single_define_test.go` печатает
      число 1 на имя. Вход nil-безопасен: `kindIs "map"` проверяется по шагу, отказ называет ручку.
      Одиночный рендер kaname идёт обёрткой: копия файлов помощников во временном каталоге, узлы global
      выписываются yq из values.yaml зонтика. В отслеживаемом дереве тело по-прежнему одно. Пропущенный
      при переводе одиночный рендер упадёт громко («no template»), молчать он не будет. Число переписи
      «22» не воспроизводится, см. N35-2
  - item: CX1-114
    verdict: mapped_with_new_exposure
    text: >-
      Посылка о правиле internal верна: импорт `services/notify/cmd/notify-probe/internal/…` из
      `services/notify/cmd/migrator` запрещён, `services/notify/internal/…` разрешён (корень правила —
      `services/notify`). (а) chains.yaml читается один раз, точка берёт его через go:embed, гейты —
      по пути. Страж старта сверяет множества каталогов таблицы и встроенных FS, второго литерала нет.
      (б) 13 гейтов переводятся поимённо, 7 оставлены с причиной. Предикаты сегмента пути (4 и 42) D4
      перемеряет. (в) Число цепочек печатается, ноль — красный. Инъекции (1)–(3) заведены.
      Отображение вводит sentinel `Database = ""`, отсюда CX1-115
  - item: N34-1
    verdict: holds
    text: "З32: «не применимо» — всегда с причиной и предикатом снятия (событие и команда); ведомость без поля — комментарий строки"
  - item: "Д64"
    verdict: holds
    text: >-
      Порядок K8r → N11r выражен, голова C13 = 1a37f81 подтверждена (`#77 platformmodules: служба notify
      (#82)`). Тег `kaname.image.tag` объявлен в одном месте, `values.yaml` зонтика (`484-notify-a5986266`).
      `values.fe3455.yaml` и `values.prorobotech.yaml` его не повторяют, `values.digests.example.yaml` —
      пример с заглушкой дайджеста. Пин модуля и тег образа одной ревизии считаются одним фактом. Если
      образа нет, исход «не выполнилось», с прежним тегом полоса не садится. Голова линии kaname
      сдвинулась на bd8413637 (K7), цель N11r названа «голова линии после K8r», а не фиксированным sha:
      верно
  - item: "Д75"
    verdict: holds
    text: >-
      Условие диспетчера выполнено. Прецедент синхронных глаголов Internal* есть: 28 (замер
      подтверждает). Замысел Operation у Send не требует: одна транзакция feed.Put, ответ после
      коммита. Держатель формы — proto-api-reviewer на D4. Его отказ переводит глагол в форму Operation с
      done=true по коммиту, асинхронного пути при этом нет, и к замыслу возвращаться не нужно. Число
      «против 2 с Operation» не воспроизводится, см. N35-1

new_items:
  - id: CX1-115
    decision: "CX1-114 (редакция 35, З32): `migrationchains.Chain{Service, Point, Database, Dir}`; у точки без chains.yaml — `Database` пусто («точка одна на цепочку и по имени базы не выбирает»); `migratorapply` гоняет точку «по каждой строке таблицы»"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением»: пустая строка — sentinel «не
      выбирает», и потребитель, которому нужно имя базы, получит его не из записи, а из догадки.
      code-authoring §«Решение и его следствие разнесены»: решение о цепочке точка принимает по имени
      базы в DSN, а доказательство наката выдаёт базу, имя которой это решение не учитывает
    exposure: >-
      Доказательство наката `TestEveryMigratorAppliesItsChainToALiveDatabase` @e415e59a2 даёт каждой
      точке `pgtest.NewEmptyDB(t)`. corelib @8a9eb14 называет такую базу `kacho_<cfg>_tNNNN`, контейнер
      один на процесс. Точка notify выбирает цепочку по имени базы из закрытой таблицы
      `{kacho_notifyprobe, kacho_notify}`, и на любом ином имени отказывает. Значит, строки notify
      требуют базу с ровно тем именем, что записано в таблице. Как её получает `migratorapply`, замысел
      не говорит: «по каждой строке таблицы» назван без способа. Отказ здесь громкий, проба покраснеет,
      и чтобы её «починить», у исполнителя два коротких пути. (1) Запасной путь в точке: незнакомое имя
      при одной законной строке, или флаг выбора цепочки для проб. Оба прямо запрещены замыслом («иное
      имя — отказ»; «выбор по конфигурации был бы третьим местом решения о цепочке»). (2) Вывод имени
      базы для пустого `Database` из имени службы (`kacho_<svc>`). Это второй источник истины об имени
      базы, которое объявляет чарт. Ни один потребитель пустого значения в замысле не назван
    condition_on_code: >-
      (а) Замысел называет потребителей `Chain.Database` и их ветку на пустом значении: `migratorapply`
      при пустом берёт `NewEmptyDB` (как сейчас), при непустом создаёт в контейнере пробы базу ровно с
      этим именем (`CREATE DATABASE` + `replaceDBName` либо помощник pgtest для именованной базы).
      Имени из имени службы не выводит никто. (б) В точке наката нет ни запасной ветки на незнакомое
      имя, ни флага или ручки выбора цепочки для проб. Это проверяется по диффу D4. (в) `migratorapply`
      печатает на строку: точку, `Database` (или «не выбирает»), имя базы в DSN, применено/объявлено.
      Строк notify — 1 на голове D4 и 2 после N7
    held_by: >-
      Нужен держатель в D4, его нет. Инъекция: строке `kacho_notifyprobe` подать `NewEmptyDB` (имя
      `kacho_*_tNNNN`). Точка отказывает с именем базы, `migratorapply` красный с именем точки и базы.
      Близнец: имя из таблицы → накат, применено = объявлено. Однофайлового признака нет

items: []
notes:
  - id: N35-1
    blocking: false
    where: "design.md З29 «Глагол `InternalNotifyProbeService/Send` — синхронный ответ», §11 строка Д75"
    text: >-
      «28 глаголов с ответом не Operation против 2 с Operation» по названному предикату (rpc в
      `internal*.proto` без Get*/List*) @e415e59a2 даёт 28 против 11. Девять из одиннадцати —
      Internal Create/Update/Delete трёх служб, два остальных — TriggerGarbageCollection и
      CreateOwnedAddress. «2» получается, только если исключить и стандартные мутации, а этого в
      предикате нет. Вывод «прецедент есть» стоит. Но для proto-api-reviewer ближайший аналог Send —
      Internal Create: он ставит строку и возвращает Operation. Значит, контрпрецедент тоже 9, и
      замыслу стоит назвать оба числа с предикатом каждого
    predicate: "число в З29 воспроизводится командой, записанной рядом с ним"
  - id: N35-2
    blocking: false
    where: "design.md З28 «Помощники — по одному телу, в чарте notify» — «грубый счёт … 22 файла (верхняя граница)»"
    text: >-
      Названный предикат `git grep -lE 'charts/kaname' -- ':!*.md' ':!*.yaml' ':!*.tpl'` @e415e59a2
      находит 43 файла. «С образцом вызова helm» без записанного образца не воспроизводится: `helm` —
      40, `helm ` — 19, `helm (template|lint)` — 11. Верхняя граница не может быть меньше результата
      своего предиката. Полоса D2, начавшая разбор с 22, может закончить раньше времени. Знаменатель
      разбора по референту — 43 (на базе полосы — перемер), печать: переведено + отброшено с причиной = 43
    predicate: "знаменатель переписи в З28 — результат записанной команды"

