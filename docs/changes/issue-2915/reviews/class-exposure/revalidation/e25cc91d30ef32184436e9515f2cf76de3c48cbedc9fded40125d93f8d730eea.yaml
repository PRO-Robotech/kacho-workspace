notes:
  - id: N44-1
    blocking: false
    where: "§12а «Резолвер и срок запроса»: «в наименьший KACHO_NOTIFY_DNS_BOOT_DEADLINE (10 с) входят две попытки»"
    text: >-
      Проверок три, срок запроса 5 с, нижняя граница срока старта 10 с. Как идут проверки внутри одной попытки
      стража, не сказано: последовательно или параллельно. Если последовательно и зона молчит, за 10 с
      исполняются dkim и spf, а dmarc не запрашивается ни разу. Тогда отказ «исчерпан срок, проверка <check>»
      называет ту проверку, на которой кончилось время, а не ту, что молчит. Нужно одной строкой: проверки
      одной попытки идут параллельно, каждая под своим queryTimeout, либо фраза «две попытки» читается как
      «две попытки каждой проверки», и тогда нижняя граница срока ≥ 3 × 2 × 5 с
    predicate: "§12а называет форму попытки (параллельно | последовательно) и пересчитывает нижнюю границу срока старта под неё"
  - id: N22-1, N22-2
    blocking: false
    where: "initial/c19490f9 notes"
    text: >-
      Не отображены: grep 'организационн|OrgDomain' → 0; про исход перезапуска при паре B без записи B текста
      нет. Остаются заметками первичного разбора, одобрение не блокируют

