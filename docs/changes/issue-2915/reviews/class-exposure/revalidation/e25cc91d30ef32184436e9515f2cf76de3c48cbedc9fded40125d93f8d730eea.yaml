      функция чтения пары для старта и перепроверки, строка в таблице отличий. CX1-135: чарт отказывает в
      рендере при standDNS.enabled и узле, который не приёмник стенда, либо прямо сказано, что P12 держит
      только профили дерева. CX1-136: источник serviceIP по профилю без наследования между кластерами либо
      названная форма без закреплённого адреса. CX1-137: части тела — QP или base64, 7bit, строки ≤ 998. CX1-138:
      закрытые таблицы разбора SPF/DMARC/DKIM, валидатор селектора, абсолютные имена запросов. CX1-139:
      зона выводится из ключа существующего объекта, после посева сверка согласия. Плюс N44-1: форма попытки
      стража. Строки в §11 и §11а
