# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 44 (e25cc91d…).
#
# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта редакций 43 и 44 против последней пересверенной
# (редакция 42, 4f78d66c…, «к замыслу», не отображены CX1-127…CX1-133). На редакцию 43 пересверки нет;
# она судится здесь вместе с 44. Перечень к отображению: CX1-127…CX1-133 (4f78d66c…) плюс CX1-134…CX1-139
# первичного разбора на одобренную приёмку редакции 22 (initial/c19490f9….yaml).
#
# Итог — к замыслу. Редакции 43 и 44 отобразили все семь прежних пунктов (CX1-127…CX1-133), условия
# 4f78d66c исполнены текстом §12а. Шесть пунктов первичного разбора c19490f9 (CX1-134…CX1-139) в замысле не
# отображены. По имени: 0 вхождений. По содержанию: признаков их условий нет (measurements). Первичный разбор
# записан на тот же отпечаток e25cc91d, что эта пересверка (его inspected), поэтому редакция их и не
# могла исполнить. По Д97 блокирующие, то есть корректность или безопасность с предикатом: CX1-134,
# CX1-135, CX1-137, CX1-138. Не блокирующие, это доступность стенда: CX1-136, CX1-139. По §4 контура
# одобрение замысла запрещает любой неотображённый пункт, и CX1-136 и CX1-139 тоже: Д97 задаёт режим
# ревью кода волны, а отображение пунктов он не отменяет.
