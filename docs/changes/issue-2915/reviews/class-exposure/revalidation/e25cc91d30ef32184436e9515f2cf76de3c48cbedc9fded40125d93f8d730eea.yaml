    subject: "Завести задачу трекера о двух прод-местах vpc с url.Parse(dsn), это корректность (§12а N41-3: services/vpc/cmd/vpc/main.go:1487, services/vpc/internal/apps/kacho/config/load.go:155 @910ccddeadc)"
