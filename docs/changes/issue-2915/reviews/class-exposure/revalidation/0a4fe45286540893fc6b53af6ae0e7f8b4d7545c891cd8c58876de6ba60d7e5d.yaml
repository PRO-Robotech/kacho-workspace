      честно пишет «первичного разбора классов на 1bffe10d… нет»

new_items:
  - id: CX1-110
    decision: "CX1-109 в редакции 33: звено прав пробы K5 — фиктивный порт в `deps` функции `internalUnaryChain`; инъекция «цепочка без звена Р2 (в `deps`)»; боевая пара K3 «ключа нет → `PERMISSION_DENIED`, обработчик `ResolveSend` не вызван»"
    class: >-
      code-authoring §«Решение и его следствие разнесены»: решение о праве вызова живёт в обработчике
      (З18), а проба K5 ищет его в цепочке, где его нет. Без поправки получится второе место решения о
      праве — или проба утвердит конструкцию, которой нет в бою. code-authoring §«Умолчание, которое
      становится утверждением»: `deps`, из которого можно собрать цепочку без звена Р2, — это боевой путь
      сборки без звена личности
    exposure: >-
      (1) Перехватчика с портом проверки прав во внутренней цепочке kaname нет. Порт, внесённый ради
      пробы, либо становится перехватчиком решения о `ResolveSend` рядом с `CheckRelation` обработчика
      (два места одного решения, разные тексты отказа и `reason`), либо остаётся только в пробе (проба
      судит не боевой состав). (2) Инъекция «цепочка без звена Р2 через `deps`» требует, чтобы
      боевой конструктор принимал такой `deps`. Это ручка, при которой сервер поднимается без
      извлечения служебного субъекта, причём молча: отсутствие зависимости читается как «звена нет».
      (3) В K3 «ключа нет → обработчик `ResolveSend` не вызван» противоречит З18: отказ производит
      сам обработчик, первым стейтментом после формы. Проба либо краснеет на законной реализации, либо
      её подгонят — вынесут проверку в перехватчик, и это опять (1)
    condition_on_code: >-
      (а) Решение о праве `ResolveSend` — одно место, обработчик K3 (З18); перехватчика проверки прав для
      `ResolveSend` в цепочке нет. `internalUnaryChain(deps)` собирает существующие звенья: личность,
      политику вызывающего, адресный гейт, пол чтения, пол acr и `DenyDetailUnary`. Порта проверки прав
      в `deps` нет.
      (б) K5: заглушка интерфейса K3c — обработчик пробы, который первым стейтментом зовёт ту же функцию,
      что З18, — `authz.CallerSubject(ctx)` из corelib (`(Caller, bool)`). Он записывает результат и
      отвечает `UNIMPLEMENTED`. Пара: ключа нет → записано `(—, false)`; согласный ключ → записано
      `service:notify`, `true`. Печатаются оба. Цепочка — из `internalUnaryChain` с боевым `deps`.
      (в) Инъекция одна — «звено Р2 строится без таблицы при согласном ключе» (вход конфигурации, а не
      форма `deps`) → записано `(—, false)` — красный. Инъекцию «цепочка без звена Р2» как форму `deps`
      не заводить. `internalUnaryChain` не принимает `deps`, из которого звено личности выпадает: nil
      или пустая зависимость звена — ошибка сборки с именем звена, а не пропуск. Это проверяется пробой
      конструктора с близнецом.
      (г) K3: ключа нет → `PERMISSION_DENIED` `AUTHZ_DENIED`, `CheckRelation` вызван с отсутствующим
      субъектом либо не вызван (по З18 — какое из двух), чтения записи выдачи нет (счётчик вызовов
      репозитория — 0). «Обработчик не вызван» из K3 снять. Близнецы прежние: согласный ключ и кортеж →
      решение; согласный ключ без кортежа → `PERMISSION_DENIED`
    held_by: "проба K5 и проба конструктора (запланированы); до правки держится вниманием"

