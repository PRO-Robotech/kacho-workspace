mapping_check:
  - item: CX1-109
    verdict: mapped_premise_refuted
    text: >-
      Отображение дословное: З13 (а)–(в), «боевая пара — в K3», строки K5 и K3, УК100, порядок п.3. Но
      посылка условия (а) неверна, и ошибка — этой роли в записи 29f44542, а не автора. Там «звено прав»
      названо `DenyDetailUnary`. На самом деле `DenyDetailUnary` — декоратор отказа: он добавляет `reason`
      к статусу, который вернул кто-то ниже. Решения о праве он не принимает. По З18 право вызова
      `ResolveSend` решает обработчик: `authz.CallerSubject`, затем `AuthorizeService.CheckRelation`.
      Перехватчика с портом проверки в цепочке внутреннего слушателя нет. Цепочку составляют
      `identityUnary`, `internalCallerPolicy`, `addressGate`, `internalSystemViewerFloor` и
      `internalACRFloor`. Метода `ResolveSend` нет ни в `GatewayFrontedInternalRPCs`, ни в `ReadFloorRPCs`.
      Поэтому «фиктивный порт проверки в `deps`» либо заводит в боевую цепочку второе место решения о
      праве `ResolveSend` (рядом с обработчиком З18), либо существует только в пробе — и тогда (а)
      «состав цепочки в пробе не перечисляется» не выполнен. Что верно в пункте и остаётся в силе: цепочка
      собирается одной функцией корня, а пара судит субъект, а не код. Исправленное условие — CX1-110
  - item: N32
    verdict: holds
    text: "строка K3r и порядок п.7 называют «готова от головы линии `kaname#484` до посадки эпика, садится тем же заходом», красный kaname в окне атрибутирован K3r"
  - item: N33
