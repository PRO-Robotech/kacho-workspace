# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 33, маршрут редакции 34.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта редакции 33 против последней пересверенной
# (редакция 32, 29f44542…, запись revalidation/29f44542….yaml — «к замыслу», CX1-109, N32, N33).
# Дельта не закоммичена: рабочее дерево issue-880 поверх c61a112cd (на c61a112cd design.md = 29f44542…,
# tasks.md = 0e13b664… — ровно пересверенные). Пункты CX1-01…108 и УК1…УК99 запись не пересуживает.
#
# Итог — к замыслу. N32 и N33 отображены и выдерживают условие. CX1-109 отображён дословно, но его
# условие (а) стояло на неверной посылке ПРОШЛОЙ записи этой роли: «звено прав — `DenyDetailUnary`».
# Код судит иначе. `DenyDetailUnary` только дописывает `reason` к отказу, который решил кто-то другой
# (`internal/authzguard/deny_details.go`: «the machine-readable reason on a refusal iam decides itself»).
# Решение о праве вызова `ResolveSend` по З18 замысла принимает ОБРАБОТЧИК: «первый стейтмент после
# проверки формы — `authz.CallerSubject`, затем `AuthorizeService.CheckRelation`». В цепочке внутреннего
# слушателя kaname (`serve.go` 1085–1108 @a5986266) порта проверки прав нет. Отсюда новый пункт CX1-110:
# фиктивный порт «звена прав в `deps`» не имеет боевого двойника, а боевая пара K3 утверждает
# «обработчик не вызван», хотя по З18 отказ производит сам обработчик.
