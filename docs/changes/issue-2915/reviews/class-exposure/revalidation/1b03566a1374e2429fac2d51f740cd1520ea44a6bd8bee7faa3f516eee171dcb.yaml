new_items:
  - id: CX1-140
    decision: "редакция 45: dkimkey.ReadPair — Readlink(<каталог>/..data) один раз, чтение файлов из <каталог>/<поколение>/<имя>"
    class: >-
      code-authoring §«Порядок операций внутри кода» (порядок снятия ресурса: читатель держит имя того, что
      писатель после переключения удаляет). code-authoring §«Чужой ответ: классификация и бюджет»: у отказа
      «файла нет в разрешённом поколении» исхода нет. gate-authoring «фикстура не снисходительнее продукта»:
      крючок пробы только переключает `..data`, а прежнее поколение не удаляет
    exposure: >-
      Запись kubelet AtomicWriter (atomic_writer.go:95-138 @k8s v1.31.0). Шаг 9 — атомарное переименование
      `..data_tmp` → `..data`, шаг 12 — «The previous timestamped directory is removed» (`os.RemoveAll(oldTsPath)`,
      :260-261). ReadPair, разрешивший поколение A до шага 9, читает файлы из `..A` после шага 12 и получает
      ENOENT. Окно узкое, но попадание в него при смене ключа — ровно тот случай, ради которого механизм заведён.
      Замысел называет исход только для «ссылки `..data` нет или она не читается»: на старте отказ P14 «не
      читается», на перепроверке пара прежняя, WARN, признак не меняется. Для «поколение разрешено, файл в нём
      исчез» исхода нет. Реализация решит молча. Если исход будет как у ошибки чтения ключа, старт на
      исправной смене откажет по P14. Если исход будет как у «пара сменилась и не прошла», перепроверка
      поставит dkim = 0 и напишет ложную WARN: тот же дефект, который закрывает CX1-134, только другим путём
    condition_on_code: >-
      (а) ReadPair различает «файла нет в разрешённом поколении». В этом случае он разрешает `..data` заново,
      ограниченно: повтор один или постоянная кода с именем в §8. Если поколение сменилось, пара читается
      целиком из нового. Отказ «не читается» — только когда файла нет при неизменном поколении либо исчерпан
      повтор. (б) Тот же исход на старте и на перепроверке (функция одна, CX1-134 (б)): на перепроверке
      исчерпанный повтор = «поколение не читается» — пара прежняя, признак не меняется, одна WARN. (в) Порт
      pairFS умеет удалить каталог поколения, а крючок пробы моделирует шаги 9 и 12 kubelet, а не только шаг 9
    held_by: >-
      Нужна проба, её нет. Заказ к N14 (P17), тот же крючок «между чтениями»: `..data` переключён на B, и `..A`
      удалён. Ожидание: ReadPair отдаёт пару B целиком, отказа старта нет, на перепроверке переход на B без
      ложной WARN. Инъекция «повтора разрешения нет» → отказ P14 на старте либо WARN/dkim = 0 на перепроверке
      → красный. Близнец — переключение без удаления (сегодняшний крючок) → пара A целиком
    blocking_by_D97: "да (корректность: ложный отказ старта либо dkim = 0 на исправной смене; предикат — проба выше)"
  - id: CX1-141
    decision: "Д104 / CX1-135 (а): пара «узел ⇔ приёмник поднят» передана существующему стражу зонтика"
    class: >-
      security-hardening «Отношение, выполнимое подстановочным знаком, не сужает НИЧЕГО» в форме ручки (тот же,
      что CX1-135): контроль, который судит только перепись дерева, на установке вне дерева не действует.
      doc-truthfulness: текст «держит существующий страж» неверен для слоя, о котором класс
    exposure: >-
      TestNamedMailNodeIsRaisedByTheDelivery (deploy/mail_receiver_core_test.go:317 @ba01514b98b) — Go-тест над
      профилями дерева (umbrellaProfiles, readProfile). Слой оператора поверх цепочки `prod` с
      `standDNS.enabled: true`, хостом узла `<релиз>-mailpit` и `mailpit.enabled` выключенным (имя хоста
      оператор дал своей службе, например ExternalName на внешний ретранслятор) проходит помощник
      notify.standDNS: хост совпал. Ручка старта тоже согласна. Под notify ходит в зону стенда, а письма уходят
      на внешний узел — обход Р19 вне дерева, тот случай, который закрывает CX1-135. Помощник notify этой пары
      видеть не может (подчарт видит только global), зато шаблон зонтика stand-dns.yaml видит `mailpit.enabled`
      и рендерится при `enabled: true` при любом перечне подключаемых (§12а)
    condition_on_code: >-
      (а) stand-dns.yaml (или помощник зонтика, которого он зовёт) отказывает в рендере при
      `global.kacho.standDNS.enabled: true` и `mailpit.enabled` ≠ true. Текст называет оба ключа. Либо (б)
      §12а прямо говорит, что пару «узел ⇔ приёмник поднят» держит только перепись дерева, и называет, чем она
      держится на установке оператора (вопрос владельцу, CX1-135 (в)). Фраза «помощник её не дублирует» при
      (а) остаётся верной: решает зонтик, а не второй помощник notify
    held_by: >-
      Нужен гейт, его нет. Заказ к P12 (д): второй фикстурный слой поверх `prod` — `standDNS.enabled: true`,
      connectionURI на `<релиз>-mailpit`, `mailpit.enabled: false` → отказ рендера с `mailpit.enabled`.
      Близнец — `dev` как есть → рендер
    blocking_by_D97: "да (безопасность, класс CX1-135; предикат — фикстурный рендер выше). Отдельно §4 контура: неотображённая часть пункта запрещает одобрение"

notes:
  - id: N45-1
    blocking: false
    where: "tasks.md §4 «Догон kacho для волны ядра» (Д105); design.md «Перемер редакции 45» строки Д105"
    text: >-
      Предикат Д105 судит ветку полосы `2915-d4-notify-probe` (локально e1da5fb21ab: origin/main внутри,
      6c420acff45 внутри, пины f8aa88d1998d / 06966a081c7a, тег образа kaname `484-notify-06966a08`). А
      утверждение Д105 — о запросе #2991, голова которого `2914-wave-ntf1-core-1@910ccddeadc` (headRefOid). В
      этой голове нет ни origin/main, ни полосы, пины прежние (corelib fe0dccf1794e, kaname 57f1841789bd).
      Origin-ветка полосы (44e3cf381b3) догона тоже не несёт: 159 коммитов только локально. Предикат, чтобы
      отвечать за «#2991 приносит и волну, и догон», судит headRefOid #2991: `git merge-base --is-ancestor
      origin/main <headRefOid>` и `git show <headRefOid>:go.mod`. Вердикт волны (Д97) берётся на этой
      сведённой голове. Механика посадки, не корректность продукта — по Д97 не блокирует
    predicate: "gh pr view 2991 --json headRefOid → merge-base --is-ancestor origin/main <oid> = да; go.mod <oid> несёт оба пина"
  - id: N45-2
    blocking: false
    where: "§12а «Форма попытки», близнец срока «попыток ровно две»"
    text: >-
      Срок запроса (queryTimeout) идёт по реальному времени сетевого стека, а срок старта и пауза — по
      внедрённым часам. Утверждение «зона молчит, срок 10 с → попыток ровно две» верно, только если в пробе
      часы идут вместе с реальным временем запросов. Пробе N14 стоит назвать, как связаны часы (реальные часы
      в этой пробе либо продвижение внедрённых на время ожидания запроса). Иначе число попыток зависит от
      расписания. Это конструкция пробы, а не замысел
    predicate: "проба N14 печатает вид часов и число попыток; три прогона подряд → то же число"

