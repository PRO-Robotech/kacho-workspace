# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 45 (1b03566a…).
#
# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта против последней пересверки (редакция 44, e25cc91d…,
# «к замыслу», не отображены CX1-134…CX1-139 первичного разбора initial/c19490f9…) и решения Д104, Д105.
#
# Итог — к замыслу. Шесть пунктов CX1-134…CX1-139 отображены (§12а, таблица «Условия CX1-134…CX1-139»), и
# условия CX1-136…CX1-139 исполнены текстом полностью. Не закрыто два места. (1) CX1-140, новый пункт.
# Механизм, который вводит редакция 45 (`dkimkey.ReadPair`: `Readlink(..data)` один раз, затем чтение из
# каталога поколения), не называет исход, когда kubelet удалил прежний каталог поколения между Readlink и
# чтением. Крючок пробы этот случай не моделирует. (2) CX1-141: часть (а) условия CX1-135 («…или
# приёмник не включён») передана стражу дерева TestNamedMailNodeIsRaisedByTheDelivery. Этот страж читает
# только профили дерева, а класс CX1-135 — именно установка вне дерева. Д105 предикатом не держится:
# предикат судит ветку полосы, а голова запроса #2991 ни догона, ни полосы не несёт (N45-1, не блокирует).
