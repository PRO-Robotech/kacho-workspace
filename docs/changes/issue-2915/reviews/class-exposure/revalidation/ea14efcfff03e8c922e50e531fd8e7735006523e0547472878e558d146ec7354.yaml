  - item: Д44
    verdict: holds_with_items
    evidence: >-
      Решение отображено: З20 абзац «Узел почты», З26, §8 (три строки с границами), §11 строка Д44,
      полоса N13 с пробой `TestNotifyStartRefusedWithoutRelayAddress`. У пробы есть отрицание (адрес
