      режимы starttls и implicit). Инъекция «умолчание localhost» делает пробу красной по варианту
      «переменная не задана». Отклонение от буквы Д44 названо и обосновано: страж не спрашивает флаг,
      потому что notify рендерится только при непустом перечне, то есть при включённом флаге хотя бы
