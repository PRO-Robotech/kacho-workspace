# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 14 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Судятся строка §11 «Д44» и дельта редакции 14
# против последней разобранной редакции 13 (c018895f…, запись revalidation/c018895f….yaml, коммит
# e27d83376, итог «к коду»). Предмет дельты — коммит 0fefbced9: design.md +28/−1 (шапка, Д44 в перечне
# решений, З20 абзац «Узел почты», З26 строка узла и режима, §8 три строки ручек, §11 строка Д44),
# tasks.md (шапка, N13, D1, порядок), change.yaml (отпечаток). Пункты CX1-01…76 и условия УК1…УК94
# эта запись не пересуживает.
#
# Д44 — не заход отображения по Д26: он вносит новое решение (ручки и страж старта). Поэтому по §7
# агента дельта разбирается на решения и классы заново, а не только сверяется строкой отображения.
#
# Итог — к замыслу. Решение «страж старта notify на пустом адресе ретранслятора» по существу верно и
# отображено (полоса N13, проба с близнецом). Но у ручек два источника значения: замысел заводит
# собственные ключи values `notify.smtp.{host,port,tlsMode}` и провязывает их чартом (D1), а приёмка
# NTF-2 той же волны Д44 (редакция 18, eb2325039) берёт адрес полосы отправителя notify из узла
# `global.kacho.identity.smtp.connectionURI` и объявляет «второго пути значений полосы нет». Её
# NTF2-34 (г) краснеет на шаблоне notify, который читает адрес из ключа вне этого узла. Замысел NTF-1
# этот узел не называет ни разу (CX1-77). Кроме того, два держателя строки Д44 названы по чужому
# референту (CX1-78). CX1-79 и CX1-80 — к коду. Возврата в приёмку NTF-1 нет.
