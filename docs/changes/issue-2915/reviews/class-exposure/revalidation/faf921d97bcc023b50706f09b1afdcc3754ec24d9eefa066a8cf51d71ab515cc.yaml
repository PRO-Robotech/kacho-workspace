new_items:
  - id: CX1-127
    decision: "Д93: «свой разбор DSN нигде не заводится — ни в коде, ни в тестах»; перепись замысла по диффу волны — «одно место: dsnField»"
    class: >-
      measurement-discipline §«Предикат — только с контролем»: регулярное выражение переписи
      (strings.Fields|Split|Cut с dsn) не ищет url.Parse и не проверено живым положительным случаем этого
      вида. code-authoring §«Контракт, который нельзя выразить»: второй разбор одного значения
    exposure: >-
      Измерено @5f195517e81. Дифф e415e59a225..HEAD — 170 файлов, из них 121 .go. Широкий предикат
      (url.Parse | Contains/Index/Split/Fields/Cut по dsn | dbname= | ParseConfig) находит в диффе ещё одно
      место: services/notify/cmd/notify-probe/harness_test.go:266-279 dbEnv. Это url.Parse(dsn), а
      KACHO_NOTIFYPROBE_DB_{HOST,PORT,USER,PASSWORD,NAME} берутся из u.Hostname(), u.Port(), u.User и
      u.Path[1:]. Файла нет в e415e59a225, его завела волна (f3289c2fe47). Разбор только для формы URL:
      ключевую форму он молча отдаёт с пустыми полями, а на пустом пути u.Path[1:] паникует. Во всём дереве
      url.Parse(<dsn>) — 6 вхождений в 5 файлах. Пять из них были до волны: vpc cmd/vpc/main.go,
      vpc config/load.go, registry config_test.go (2), internal/migratorapply/apply_test.go:217
      replaceDBName (есть в e415e59a225:150). Контроль — предикат находит harness_test.go (1)
    condition_on_code: >-
      (а) Строка «Перемер редакции 41 — свой разбор DSN в диффе волны» исправляется на два места:
      dsnField и dbEnv. Предикат переписи включает url.Parse и печатает число осмотренных файлов.
      (б) Условие D4: dbEnv берёт поля у pgconn.ParseConfig (или у DatabaseOf/pgx.ParseConfig для имени), а
      не у url.Parse. cfg.Host, cfg.Port, cfg.User, cfg.Password, cfg.Database. (в) Инъекция — DSN pgtest в
      ключевой форме → проба с url.Parse отдаёт пустые переменные и красная. Близнец с ParseConfig —
      зелёная. Если инъекция в pgtest невыразима, условие держит перепись (а) с контролем.
      (г) Судьба replaceDBName в internal/migratorapply/apply_test.go — его правит полоса D4 — решается
      явно: вопрос N41-3
    held_by: "Перепись (а) с контролем на harness_test.go. Гейта нет. Однофайловый признак есть: url.Parse от переменной с dsn в имени, кандидат в предикат — заметка N41-3"
  - id: CX1-128
    decision: "Д91 · CX1-126 (б): пара формы и строки (internal/migratorapply) получает факт «не рендерит» «рендером того же чарта ногами проб D1 (renderNotify / standaloneLeg)»; «ноль объектов чарта — ноль в каждом профиле», потому что у зависимости нет condition/alias"
    class: >-
      code-authoring §«Унификация и стоимость» и §«Решение и его следствие разнесены»: носитель
      рендера не назван в достижимой форме, и второй вызов рендера с собственными ногами — два места об
      одном предмете. measurement-discipline §«Живость предмета»: посылка верна на сегодня и истекает
      в D2
    exposure: >-
      Измерено @5f195517e81. (1) renderNotify (:184), mustRenderNotify (:199) и standaloneLeg (:213) объявлены
      в deploy/notify_secret_layout_test.go, а это _test.go пакета deploy. Из internal/migratorapply их
      не импортировать. Исполнитель либо скопирует вызов helm и перечень ног, и тогда у «профиля» станет два
      источника, либо вынесет помощник. Замысел формы не называет. (2) notify.renders
      (_helpers.tpl:37-39) — len(notify.sourceRoster(dict "global" .Values.global)) > 0. Сегодня таблица —
      `list | toJson`, ответ от значений не зависит, и «ноль в каждом профиле» верно. Шапка _sources.tpl
      говорит, что D2 вносит флаг global.kacho.notifications.enabled и помощник enabledFor. После D2 ответ
      зависит от global профиля. Ноги фикстуры (deploy/testdata/notify-standalone/values.yaml) — не профиль
      стенда. Проба пары может сказать «вне опроса» при профиле, который notify рендерит, и тогда это зелёный
      по объёму, которого стенд не имеет. Может и наоборот. Посылка теряет силу ровно на D2, когда пара
      начинает требовать строку kacho_notify
    condition_on_code: >-
      (а) Замысел называет единственный носитель рендера для пробы пары и для проб D1. Это импортируемый
      не-_test помощник (пакет и путь названы) либо вызов обёртки копии осмотра render-notify-inspect.sh.
      Второго перечня ног и второго вызова helm нет. Инъекция — ноги меняются в одном месте → меняются оба
      исхода. (б) «Профиль» пробы пары — объявленные профили стендов. Источник — таблица стендов
      (deploy/stacks.txt) или перечень, названный в замысле. «Вне опроса» печатается, только если объектов
      0 в каждом профиле, и печать называет профиль и число объектов на профиль. Хотя бы один профиль
      рендерит notify — пара обязательна. (в) Фраза «ноль объектов чарта — ноль в каждом профиле»
      получает срок: «верно, пока notify.pluggableSources — пустой литерал; D2 снимает». Предикат —
      git grep -n 'list | toJson' -- deploy/helm/notify/templates/_sources.tpl. (г) Инъекция на копии:
      таблица непуста под флагом global, профиль A флаг ставит, ноги фикстуры — нет, строки в таблице
