# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 41, маршрут редакции 42.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта редакции 41 против последней пересверенной
# (редакция 40, dfac7c9c…, запись revalidation/dfac7c9c….yaml: «к замыслу», CX1-124…126, N40-1, N40-2),
# решения диспетчера Д91…Д95 (2026-10-03; Д75…Д84, Д86…Д90 действуют, Д85 для живых гейтов заменён Д91)
# и возвраты ревью кода волны fde0f0c3…. Дельта не закоммичена: рабочее дерево issue-880 поверх 842a3eb8b.
#
# Итог — к замыслу. CX1-124, CX1-125, CX1-126, N40-1, N40-2, Д91…Д95 и возвраты fde0f0c3… отображены.
# Два новых пункта, оба измерены на голове волны 5f195517e81:
#   CX1-127 — перепись «свой разбор DSN в диффе волны» (Д93) нашла одно место, а их два. Предикат замысла
#             не ищет url.Parse. Волна завела services/notify/cmd/notify-probe/harness_test.go:268 dbEnv —
#             url.Parse(dsn), из него берутся узел, порт, пользователь, пароль и база (u.Path[1:]);
#   CX1-128 — пара формы и строки (CX1-126 по Д91) получает факт «не рендерит» «рендером ногами проб D1
#             (renderNotify / standaloneLeg)». Эти помощники лежат в _test.go пакета deploy, и из
#             internal/migratorapply они недоступны. Кроме того, «ноль объектов — ноль в каждом
#             профиле» верно, пока таблица литерально пуста. Перечень читает .Values.global, и с D2
#             (флаг global.kacho.notifications.enabled) рендер ног фикстуры и рендер профиля стенда
#             расходятся.
