# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 21 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 20
# (c9a81b71…, запись revalidation/c9a81b71….yaml, коммит d89bd2281, итог «к замыслу»: CX1-91;
# N9–N11 не блокируют). Дельта — коммит 15e875957: отображение CX1-91, N9–N11, в том числе
# принятый заказ NTF-2 7a424030 (CX2-58, CX2-60 (б), CX2-57 (в), CX2-47 (в)). Пункты
# CX1-01…90 и условия УК1…УК94 эта запись не пересуживает.
#
# Итог — к замыслу. CX1-91, N9, N10 и пункты заказа NTF-2 отображены. Отображение CX1-91
# выдерживает условие: судящая функция на переписанной строке даёт находку формы «аргумент
# helm/kubectl», на близнеце находок 0 — сверено с выражениями гейта на origin/1276. Новое решение
# редакции 21 — «образец — параметр обёртки, точка подстановки одна». Оно открывает два пункта:
#   CX1-92. Контракт шелл-обёртки `render_chain_args <цепочка> [<образец>]` не несёт оси каталога,
#   которую несёт общий читатель `stacks_args <имя> [КАТАЛОГ]`: 14 из 16 вызовов в шелле и CI
#   передают каталог, 6 из 8 точек, рендерящих `prod`, — тоже. Вторым позиционным у обёртки стоит
#   образец, у общего читателя — каталог. Форма, в которой образец попадает в цепочку, не названа
#   ни для Go, ни для шелла относительно той базы, от которой её разрешают вызывающие. Кроме того,
#   у двух обёрток разный контракт на цепочках не `prod`: Go принимает образец и дописывает его
#   только к `prod`, а шелл такой вызов отвергает. Шесть точек в шелле и CI обходят все цепочки,
#   и каждой пришлось бы вписать имя `prod` у себя.
#   CX1-93. Единица переписи D2 — вызывающие читателей таблицы цепочек. Рендер `prod` по имени
#   профиля, мимо таблицы, в неё не входит. Таких мест в шелле 4 (origin/1276). Когда перечень
#   `prod` станет непустым (Е12 (4)), они покраснеют вне путей любой полосы, а перепись их не
#   видит.
# Заметки к коду: N12 (пустое имя образца в Go-обёртке указывает на каталог), N13 (режим 100644:
# исполнение по пути даёт 126, а не 2), N14 (предикат N10 с `grep -c` по двум файлам печатает две
# строки), N15 (`scripts/ci-local.sh` — точка роли «гейт», в путях D2 её нет). Возврата в приёмку нет.
