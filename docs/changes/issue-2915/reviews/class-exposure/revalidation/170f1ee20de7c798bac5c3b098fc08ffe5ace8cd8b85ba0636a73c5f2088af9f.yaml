items:
  - id: CX1-92
    status: unmapped
    decision: "З28 «Один каталог образцов, одна точка подстановки» (редакция 21, N11 · CX2-58 (а)): Go — `deployStacksForRender(t, sample)` отдаёт все цепочки с образцом, дописанным к `prod`; шелл — `render_chain_args <цепочка> [<образец>]`, образец для цепочки не `prod` → отказ, `prod` без образца → отказ; tasks.md D9"
    class: >-
      .claude/rules/architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ
      СОБОЙ» (две обёртки одного механизма с разным контрактом); code-authoring §«Контракт, который
      нельзя выразить» (ось, которую несёт общий читатель, у обёртки не выразима); measurement-discipline
      §«Радиус: по имени механизма и по точкам применения» (контракт обёртки выведен без переписи её
      будущих вызывающих)
    finding: >-
      (1) Ось каталога. Общий читатель — `stacks_args <имя> [КАТАЛОГ]`
      (`deploy/tests/helm/stacks.sh:119–134` @23f1e058a35); он приписывает `$dir/` каждому профилю.
      Вызовов `stacks_args` / `stacks.sh --args` в шелле, CI и `scripts/` без комментариев — 16, и 14
      из них передают каталог (`"$UMBRELLA"` либо `./helm/umbrella`). Без каталога — только
      `.github/workflows/ci.yaml:2566` и `scripts/ci-local.sh:975`, которые делают `cd` в зонтик.
      Точек, рендерящих `prod` через таблицу, 8: явный `prod` — `identity-guards-on-our-own-posture-test.sh:81`,
      `seed-secrets-refuse-unknown-state-test.sh:121`; обход всех цепочек —
      `ceremony-coordinates-reach-the-edge-test.sh`, `console-serves-identity-flows-test.sh`,
      `networkpolicy-egress-test.sh`, `servername-checked-against-the-peer-test.sh`, `ci.yaml`,
      `ci-local.sh`. Шесть из восьми передают каталог. У `render_chain_args <цепочка> [<образец>]`
      оси каталога нет, а вторая позиция занята образцом. Механическая замена `stacks_args prod
      "$UMBRELLA"` на `render_chain_args prod "$UMBRELLA"` даёт громкий отказ «имя вне каталога». Но
      вызов без каталога отдаёт `-f values.prod.yaml`, а такой путь верен только из каталога зонтика.
      (2) Форма элемента образца в цепочке. Go-вызывающие получают имена профилей относительно
      `umbrellaDir` (`deployStacks` сверяет `os.Stat(filepath.Join(umbrellaDir, p))`, вызывающих —
      44 файла). Шелл-вызывающие получают `-f $dir/<профиль>`. Образец лежит вне зонтика
      (`deploy/testdata/mail-node/`), и его форму в цепочке замысел не называет ни для одной обёртки.
      Если элемент записан относительно корня `deploy/` либо репозитория, при соединении с базой
      вызывающего он укажет в несуществующий путь. (3) Контракт на цепочках не `prod`. Go-обёртка
      принимает образец для всех цепочек и дописывает его только к `prod`, а шелл-обёртка тот же
      образец для цепочки не `prod` отвергает. Шесть шелл- и CI-точек обходят все цепочки. При
      шелл-контракте каждая из них вписывает ветку `[ "$stack" = prod ]`, то есть знание «какой
      цепочке нужен слой» переезжает из одной точки подстановки в шесть вызывающих. Это второе
      написание того же решения, против которого и заведена одна точка подстановки
    condition_to_design: >-
      (а) Контракт шелл-обёртки несёт ось каталога общего читателя, например `render_chain_args
      <цепочка> <каталог> [<образец>]`. Решение названо в З28 и в D9. Вызов без каталога либо
      разрешён явно, с тем же смыслом, что у `stacks_args`, либо отвергнут. (б) Форма элемента образца
      в цепочке названа для обеих обёрток: Go — путь, который `filepath.Join(umbrellaDir, p)`
      разрешает в файл каталога; шелл — путь, верный из каталога вызывающего при любом значении
      аргумента каталога. Проба D9 — каждый элемент цепочки `prod`, отданной обёрткой, существует
      через ту же операцию соединения, что у вызывающих: Go — `os.Stat(filepath.Join(umbrellaDir,
      p))`, шелл — `[ -f ]` из каталога, отличного от зонтика. Инъекция: элемент образца относительно
      корня репозитория → красный с именем элемента. (в) Один контракт на цепочках не `prod` у обеих
      обёрток. Либо обе принимают образец на любой цепочке и дописывают его только к `prod` — тогда
      обходчику ветка не нужна, а проба утверждает, что строка цепочки не `prod` равна общему
      читателю. Либо обе отвергают, и тогда у Go-обёртки есть форма на одну цепочку. Выбор записан
      в З28, и проба D9 утверждает его на обеих обёртках одним набором случаев
    held_by: "нужен гейт — проба D9 (б), (в); сейчас держится вниманием, пути проб уже в D9"

  - id: CX1-93
    status: unmapped
    decision: "З28 «Перепись — по точкам применения» (единица — вызывающий `deployStacks(`, `stacks.sh`, прямой читатель `stacks.txt`) вместе с решением редакции 21 «одна точка подстановки» и переписью «по вызову обёртки» (CX2-58 (г)); Е12 (4) — полоса, делающая перечень `prod` непустым, обязует «гейты обхода `deploy/stacks.txt`»"
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения» (механизм — «рендер зонтика с `values.prod.yaml`», а не «чтение таблицы цепочек»); code-authoring §«Решение и его следствие разнесены» (слой нужен каждому рендеру `prod`, а перепись и обязательство считают только читателей таблицы)"
    finding: >-
      На origin/1276@23f1e058a35 зонтик с `values.prod.yaml` мимо таблицы цепочек рендерят 4 шелл-файла:
      `deploy/tests/helm/prod-profile-fail-closed-test.sh:104` (`helm_try kacho-umbrella "$UMBRELLA"
      -f "$PROD"`), `edge-keyset-hop-test.sh:190` (`-f "$UMBRELLA/values.prod.yaml" --show-only …`),
      `networkpolicy-egress-test.sh:227` (`render "контроль 0 …" -f "$UMBRELLA/values.prod.yaml"`) и
      `machine-credential-posture-test.sh:109` (`render_only "$PROD" …` → `helm_try kacho-umbrella
      "$UMBRELLA" -f "$1" --show-only`). Ещё три файла (`iam-metrics-mtls`, `iam-trusted-forwarder`,
      `registry-trusted-forwarder`) читают `$PROD` через yq или awk и зонтик с ним не рендерят. В Go
      по предикату «файл называет `values.prod.yaml` и зовёт `template`, `deployStacks(` не зовёт»
      нашёлся один файл, `gateway/deploy/login_lane_prereq_test.go`, и он рендерит чарт kaname, а не
      зонтик. Ни один из четырёх шелл-файлов не входит в единицу переписи D2. Пока перечень `prod`
      пуст (NTF-1), они проходят. Когда перечень станет непустым (NTF-2, NTF-3; Е12 (4)), каждый
      получит отказ `required` с именем узла. Это красный на полосе, в путях которой их нет. Перепись
      «рендерящих `prod` = со слоем» тогда зелёная, но вывод из неё ложный: она не видит рендеров, у
      которых нет слоя. А «исправление» такого гейта прямым `-f deploy/testdata/mail-node/…` перепись
      CX2-58 (г) тоже не увидит: гейт стоит вне её единицы
    condition_to_design: >-
      (а) Единица переписи D2 расширена. Точкой применения считается и рендер зонтика, называющий
      `values.prod.yaml` (либо любой профиль, с которого начинается цепочка `prod` или `own`) по
      имени, а не через таблицу, — на всех языках, с той же разметкой ролей. Перепись печатает их
      число отдельной строкой. (б) Исход такой точки назван в З28 одним из двух: перевод на обёртку
      (цепочка `prod` из таблицы + образец) либо утверждение отказа с именем узла. Прямой `-f`
      профиля `prod` в гейте роли «гейт» после D2 — красный переписи с координатой. (в) Пути четырёх
      файлов (либо «перечень печатает перепись» с этим признаком) внесены в D2 наравне с
      существующими точками роли «гейт». (г) Инъекция: фикстурная копия с включённым `probe-b`
      (перечень `prod` непуст) и шелл-гейтом, рендерящим `-f values.prod.yaml` напрямую → красный
      переписи с именем файла; близнец — тот же гейт через обёртку → молчание
    held_by: "нужен гейт — перепись D2 с расширенной единицей; сегодня не держится ничем (NTF-1 зелёна при пустом перечне `prod`)"

notes:
  - id: N12
    blocking: false
    where: "З28 «Один каталог образцов, одна точка подстановки» — «Обёртка принимает только имя файла каталога»; D9 `deployStacksForRender(t, sample)`"
    text: >-
      `filepath.Join(dir, "")` и `filepath.Join(dir, ".")` дают сам каталог, и `os.Stat` на нём
      успешен. Проверка «существует» пропустит пустое имя, а в цепочку `prod` уйдёт `-f <каталог>`.
      Решение «только имя файла каталога» это исключает, но исполнение с проверкой через `os.Stat`
      его не выдержит. К коду: принадлежность проверяется по перечню обычных файлов каталога
      (`os.ReadDir`, `!IsDir()`, точное совпадение имени). Отрицания пробы — `""`, `.`,
      `../mail-node/operator.yaml`, имя подкаталога; близнец — `operator.yaml`. То же в шелле:
      `[ -f ]` плюс проверка, что в имени нет `/`
  - id: N13
    blocking: false
    where: "З28 «Шелл-обёртка — только библиотека» (N9); D9"
    text: >-
      При режиме `100644` запуск `deploy/tests/helm/lib/render-chain.sh prod` отказывает до первой
      строки файла: оболочка возвращает 126 (Permission denied), а не 2. Код 2 с текстом «библиотека,
      подключайте source» возможен только при `bash <путь>`. К коду: проба D9 исполняет `bash
      <путь> prod` → 2 и текст, а прямой запуск по пути утверждает отдельно → 126. Иначе проба,
      ожидающая 2 от прямого запуска, красная на верном файле, либо её «чинят» режимом `100755` — а
      это противоречит решению
  - id: N14
    blocking: false
    where: "З28 «Комментарий и текст отказа переезжают с перечнем» (N10); §11 N10; D2"
    text: >-
      `grep -c 'in this script' deploy/helm/umbrella/cutover-*.sh` на двух файлах печатает две строки
      вида `<путь>:<N>`, а не `0`. Ожидание «→ 0» в такой форме не сравнимо. К коду: `cat
      deploy/helm/umbrella/cutover-*.sh | grep -c 'in this script'` → `0`, либо `grep -h … | wc -l`
      → `0`, плюс печать числа файлов, попавших под маску (2), чтобы пустая маска не дала «0»
  - id: N15
    blocking: false
    where: "tasks.md D2 (пути: существующие точки роли «гейт» … `.github/workflows/ci.yaml`)"
    text: >-
      `scripts/ci-local.sh:975` — локальное зеркало задания CI `ci.yaml:2566`. Оно обходит каждую
      цепочку, включая `prod`, через `bash ../../tests/helm/stacks.sh --args "$stack"`, то есть это
      точка роли «гейт». В путях D2 его нет, но перепись по имени читателя его найдёт: форма
      `stacks.sh --args` — в единице переписи. К коду: D2 правит его тем же изменением, что `ci.yaml`.
      Раз обёртка — только библиотека (N9), задание подключает её `source` внутри `bash -c` и вызывает
      функцию

