notes:
  - id: N1
    blocking: false
    where: "tasks.md C10; design.md §11 строка CX1-76 (столбец держателя)"
    text: >-
      Инъекция записана как «прежнее тело с добавленной вручную строкой таблицы видов, которой шаблон
      не порождает». З16 уточняет: «строкой таблицы видов В ФОРМЕ, которой шаблон не порождает». Без
      слов «в форме» исполнитель может построить инъекцию так: строка с новым видом в форме шаблона.
      Такое тело — ровно остаток (в): извлечение его примет, вывод совпадёт, и инъекция позеленеет.
      Расхождение не молчаливое — остаток назван в том же абзаце З16. Но C10 — задание полосы, и
      формулировку стоит привести к З16 при следующей правке
  - id: N2
    blocking: false
    where: "tasks.md C10, близнец"
    text: >-
      «прежнее тело из `Mapping` до добавления вида, которого в дереве нет» — «которого» грамматически
      относится к «вида». По смыслу речь о прежнем Mapping: З16 говорит «причём прежнего `Mapping` в
      дереве нет», строка CX1-76 — «прежнего `Mapping`, которого в дереве нет». Смысл восстанавливается
      по З16, но формулировку C10 стоит выровнять

