mapping_check:
  - item: CX1-76
    verdict: holds
    evidence: >-
      (а) З16 (а): в генератор встроены выпущенные версии ШАБЛОНА формы по отпечатку, как версии
      схемы D04. Тела не встроены, и довод дан: граф модулей corelib←kaname←kacho, прежний Mapping в
      дереве отсутствует. Прежнее определение сверяется побайтно с выводом шаблона своей версии на
      входах, извлечённых из тела: таблица видов и действий, schema_rev, отпечаток версии.
      Извлечение и вывод — функции того же пакета генератора, копии в гейте нет. Тело без
      извлекаемых входов и тело с отпечатком вне встроенных версий — находка с координатой. Прежние
      определения генератор не переписывает (ban #5). Ведомость отпечатков тел не заводится. (б)
      Действующее определение сверяется с выводом эталона по текущему Mapping; то же в строке
      CX1-75 (б) и в C10. (в) Остаток назван в З16 и строке CX1-76 (в): правка прежнего тела,
      которая оставляет его выводом выпущенного шаблона на иных входах. Сверкой она неотличима от
      законного тела, действующим определением не становится; держатель — ревью диффа применённой
      миграции (ban #5). Близнец C10 — дерево модуля без прежнего Mapping — есть в З16 и в C10. (г)
      Три инъекции есть в З16, в строке CX1-76 и в C10: правка байта в прежнем теле; прежнее тело со
      строкой таблицы видов, которой шаблон не порождает; отпечаток вне выпущенных. Каждая —
      красный с координатой. (д) Словарь «выпущенная версия шаблона формы» единый в З16, строке
      CX1-75, C6 («выпущенные версии шаблона формы (не тела)»), C10 и Е10 (1). Строка CX1-76
      цитирует старую формулировку как неисполнимую. Заказ Е10 (1) требует от шаблона NTF-3 тела с
      однозначно извлекаемыми отпечатком и входами. Там же — проба round-trip по каждой выпущенной
      версии, а в абзаце заказов §13 — адресат

