mapping_check:
  - id: SDR-К1
    design: "З24 (серверный предел; пять операторов записи ограды), §1 М34, §3 И33 и И35, §6, §8 (10 с и 2 с с доводом), §11 SDR-К1; tasks.md N7"
    verdict: holds
    note: >-
      (1) `SET LOCAL statement_timeout` и `SET LOCAL idle_in_transaction_session_timeout` стоят
      первыми операторами транзакций резерва, освобождения и записи ограды. «Первый оператор» И33,
      И35 и З24 уточнён: это первый оператор, берущий замок, поэтому прежние условия CX1-66 и
      CX1-68 о чтении ограды первым не ослаблены. (2) Константы стоят в §8 рядом с
      `FenceLockTimeout`, довод чисел есть: 2,5 с + 5 с < 10 с; `lock_timeout` 5 с меньше
      `statement_timeout` 10 с, поэтому исход записи ограды по пределу остаётся 55P03. (3) Условие
      ревью внесено в И35. (4) Проба `TestReserveHolderVanishedDoesNotStallFleet` стоит в N7,
      близнец-инъекция снимает оба `SET LOCAL`, положительный близнец есть. Новых исходов нет.
      Два замечания к исполнению — ниже в orders, они не пункты. Первое: как значение константы
      попадает в текст `SET LOCAL`. Второе: режим медленного диска относительно 10 с решает
      db-architect-reviewer, это граница величины CX1-70 (в)
  - id: SDR-Н1
    design: "З21 (контекст `Ack`), З24 (контекст освобождения), §11 SDR-Н1; tasks.md N3, N7"
    verdict: holds
    note: >-
      `Ack` выполняется под `WithDeadline(WithoutCancel(<строка>), t_send + lease_remaining)` по
      монотонным часам и повторяется только на `UNAVAILABLE` и `DEADLINE_EXCEEDED` до этого срока.
      Повтор идемпотентен по З9. Освобождение выполняется под
      `WithTimeout(WithoutCancel(<строка>), TxStatementTimeout)`, его неудача — остаток до конца
      окна. На оба случая есть пробы с близнецами-инъекциями: `Ack` и освобождение под контекстом
      строки → проба красная
  - id: SDR-Н2
    design: "З21 (срок `Claim` и `Subscribe`), §11 SDR-Н2; tasks.md N2"
    verdict: does_not_hold
    note: >-
      Ревью просило две вещи: «константа notify с доводом числа, меньше `claimInterval` и меньше
      `LeaseTTL`» и «открытие потока подписки ограничено сроком установления». Дельта взяла в
      качестве срока саму ручку `claimInterval` `[1s..5m]` без довода и поставила её на контекст
      потока. Отсюда два пункта: CX1-71 (срок на жизнь потока, а не на установление) и CX1-72
      (срок вызова `Claim` без довода, отмена после коммита аренды у источника не названа).
      Проба `TestStalledSourceDoesNotStopOtherSources` ни того, ни другого не видит: её
      положительный близнец зелен и тогда, когда поток рвётся каждый такт, потому что строки
      доставляет `Claim` по таймеру
  - id: SDR-Н3
    design: "З24 (ключи и порядок освобождения), §11 SDR-Н3; tasks.md N7"
    verdict: holds
    note: >-
      Ключи `(key, class, window, window_start)` и `day` берутся из записи, сделанной при резерве, и
      заново не вычисляются. Порядок замков: строки сетки по первичному ключу, затем `global_daily`,
      одинаково у резерва и освобождения. Есть пробы на встречный резерв и освобождение (40P01 = 0,
      близнец — обратный порядок) и на границу суток при управляемых часах. Одно замечание к
      исполнению — в orders: как порядок выражается в SQL
  - id: SDR-М1
    design: "§9"
    verdict: holds
    note: >-
      §9 ссылается на `poly-edge-notify-sources`, `poly-edge-notify-kaname` и
      `poly-edge-notify-acyclic`; на ветке issue-880 строки 59, 60 и 62 совпадают с этими
      именами. Задаче #881 оставлен `docs/specs/01`. Номера строк рядом с именами — лишняя
      координата: она уедет, а имена несут всё нужное. Это не пункт

conditions_to_code: []

items:
  - id: CX1-71
    decision: >-
      З21, редакция 9, строка SDR-Н2: «каждое (пере)открытие потока `Subscribe` — под
      `context.WithTimeout(<контекст цикла источника>, notify.claimInterval)`»
    class: >-
      code-authoring §«Решение и его следствие разнесены»: решено ограничить установление, а
      следствием стал предел на жизнь потока, потому что в gRPC контекст вызова server-stream —
      это контекст всего потока. Также §«Умолчание, которое становится утверждением»: оборванный
      поток читается как «событий нет», а строки всё равно доставляет таймер
    exposure: >-
      В gRPC поток живёт, пока жив контекст, переданный в `Subscribe`. Если этот контекст получил
      `WithTimeout(…, claimInterval)`, поток завершается `DEADLINE_EXCEEDED` через `claimInterval`
      после открытия (от 1 с по §8) при любом исправном источнике. Цикл по З21 переоткрывает
      поток и зовёт `Claim` на каждом открытии. В итоге источник получает переподключение потока
      каждые `claimInterval`, а каждое открытие у сервера corelib — это `settle`, выбор позиции и
      LISTEN. Доставка по событию (NTF1-E01) выпадает на отрезках между обрывом и переоткрытием.
      Что строки всё равно доходят, делает таймер, поэтому снаружи дефект не виден. Установление
      в corelib определено: первое сообщение потока — `SubscriptionOpened`
      (`subscription/server.go:382` @34bc8104a), и его приход — единственная граница, до которой
      срок осмыслен
    condition: >-
      (а) Контекст потока `Subscribe` — контекст цикла источника без собственного срока. Срок
      установления действует только до прихода `SubscriptionOpened`: отдельный таймер отменяет
      вызов, если сообщение не пришло, и снимается, как только оно пришло. Отмена контекста цикла
      при остановке по-прежнему закрывает поток. (б) Строка SDR-Н2 §11, строка З21 и полоса N2
      говорят «до `SubscriptionOpened`», а не «открытие под `WithTimeout`». (в) Число открытий
      потока к источнику видно счётчиком с меткой источника: переподключение каждый такт
      становится заметным
    held_by: >-
      Проба полосы N2 — дополнение к `TestStalledSourceDoesNotStopOtherSources`. Исправный
      фикстурный источник, `claimInterval` = 1 с, наблюдение 5 с → источник принял открытий
      потока ровно 1, событие, записанное на 4-й секунде, доставлено по потоку раньше следующего
      такта (таймер отключён в пробе через внедряемые часы). Близнец-инъекция —
      `WithTimeout(…, claimInterval)` на контексте потока → открытий 5 и больше, проба красная.
      Вариант «источник не шлёт `SubscriptionOpened`» остаётся за существующей пробой
  - id: CX1-72
    decision: >-
      З21, редакция 9, строка SDR-Н2: «каждый вызов `Claim` — под
      `context.WithTimeout(<контекст цикла источника>, notify.claimInterval)`»; ручка
      `notify.claimInterval` `[1s..5m]`, умолчания нет (§8); довода величины нет
    class: >-
      code-authoring §«Чужой ответ: классификация и бюджет» (бюджет вызова — довод, а не
      константа; отказ «по сроку» у notify не означает отказа у источника). Также §«Решение и
      его следствие разнесены»: источник коммитит аренду, а notify отказывается от ответа
    exposure: >-
      `Claim` — мутация у источника: это один оператор с `FOR UPDATE SKIP LOCKED`, который
      выставляет аренду `LeaseTTL` = 5 мин. Когда notify отменяет вызов по сроку, источник мог
      уже закоммитить аренду. Строки такой пачки остаются без исполнителя до конца аренды,
      включая класс `security`. Раньше это случалось только при потере ответа. Теперь это
      систематический путь при любом `Claim` дольше `claimInterval`: при ручке 1 с и источнике,
      который жив, но отвечает 1,2 с, каждый вызов арендует до `notify.workers` строк и бросает
      их. Доставка у этого источника падает до нуля, пока он жив, и на каждом круге всё
      повторяется. Замысел это следствие не называет. Метрика `notify_lease_budget_short_total`
      его тоже не показывает: ответа нет, сравнивать нечего. Ревью требовало срок меньше
      `claimInterval` и меньше `LeaseTTL` с доводом числа. Ручка со значением 5 м равна
      `LeaseTTL`, и довода нет
    condition: >-
      (а) Срок вызова `Claim` — константа notify, отдельная от `claimInterval`, в §8 с доводом
      числа. Верхняя граница: `LeaseTTL − (resolveSendTimeout + smtpSessionTimeout + ackMargin)`,
      то есть ответ, пришедший в срок, ещё оставляет строке бюджет по З21. Нижняя граница выведена
      из законной задержки `Claim` (один оператор ≤ `feed.MaxClaim` строк) с запасом. Если срок
      не превосходит `claimInterval`, тактов на вызов не больше одного. (б) З21 называет следствие
      отмены после коммита у источника: строки вызова возвращаются к следующему `Claim` только
      по концу аренды, это остаток того же рода, что уход реплики. (в) Отмена `Claim` по сроку
      видна счётчиком с меткой источника, отдельным от ошибок источника
    held_by: >-
      Проба полосы N2. Фикстурный источник коммитит аренду и отвечает позже срока вызова,
      исправный источник B работает рядом → счётчик отмен +1; строки A доставлены после
      конца аренды фикстуры (аренда в пробе короткая) и не раньше; строки B не задержаны.
      Положительный близнец: источник A отвечает на 80 % срока → отмен 0, строки доставлены в
      этом круге. Предел в пробе задаётся параметром функции цикла, прод-вызов передаёт
      константу. Довод числа (а) — строкой §8, проверяется по диффу

