# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 9 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Это заход отображения по Д26, поэтому судятся ТОЛЬКО строки
# отображения и дельта редакции 9 против последней разобранной редакции 8 (dba7c388…, запись
# revalidation/dba7c388….yaml). Предмет дельты — `git diff 6464ba4aa bcffa6532 -- docs/changes/issue-2915/`:
# design.md +96/−18, tasks.md +6/−5, change.yaml +5/−3. Пункты CX1-01…70 и условия УК1…УК94 эта
# запись не пересуживает.
#
# Итог. SDR-К1, SDR-Н1, SDR-Н3 и SDR-М1 отображены, отображение выдерживает условие ревью. Строка
# SDR-Н2 записана, но в той форме, в какой её написала дельта, она сама вносит два класса.
#   CX1-71. Срок `claimInterval` ставится на контекст потока `Subscribe` и потому ограничивает всю
#     жизнь потока, а не только его установление. Поток рвётся каждые `claimInterval` (от 1 с),
#     и путь «по событию» молча вырождается в опрос по таймеру. Проба этого не видит.
#   CX1-72. Срок вызова `Claim` равен ручке `claimInterval` (от 1 с), и довода числа нет. Если
#     источник жив, но медленный, notify отменяет вызов, а источник уже закоммитил аренду. Строки
#     остаются без исполнителя до конца аренды (5 мин). Следствие не названо, счётчика нет.
# Оба пункта не отображены, итог — к замыслу. Оба закрываются условием к коду без нового механизма.
# Возврата в приёмку дельта не даёт. NTF1-L03 из записи 9bfa92be остаётся в силе.
