conditions_to_code:
  - id: УК71
    item: "CX1-57, CX1-27"
    class: "rule architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» (одна величина, двое часов)"
    condition: >-
      крайний момент строки в notify вычисляется по часам notify от момента ОТПРАВКИ запроса Claim:
      `t_send + (lease_until − source_now)`, где `source_now` — момент базы источника, которым
      выставлена аренда (ответ Claim несёт его рядом с `lease_until`, либо несёт остаток аренды
      длительностью). Разность `lease_until − now_notify` в вычислении срока не встречается. Иначе —
      расхождение часов, съедающее `ackMargin` (5 с), названо ценой в замысле с тревогой на
      расхождение
    held_by: >-
      проба notify: фикстурный сервер ленты отдаёт `lease_until` по часам, сдвинутым на +10 с
      относительно часов notify, при аренде 20 с и SMTP-узле, отвечающем на DATA через 25 с →
      SMTP-сессий по строке не больше одной, Ack не опаздывает; близнец без сдвига — то же
  - id: УК72
    item: CX1-14
    class: "rule api-conventions api-accepted-ignored; api-outcome-reject"
    condition: "`defer_for`, заданный в Ack при виде ≠ DEFER, — синхронный INVALID_ARGUMENT с именем поля до SQL, а не молча проигнорированное поле"
    held_by: "модульная проба сервера ленты: Ack(SENT, defer_for = 1m) → INVALID_ARGUMENT `defer_for`; близнец Ack(SENT) без поля — успех"
  - id: УК73
    item: CX1-26
    class: "code-authoring §«Порядок операций внутри кода»; rule api-conventions api-gotcha-malformed"
    condition: >-
      `lease_token` разбирается как UUID до SQL: непустой токен не по форме — INVALID_ARGUMENT с именем
      поля, а не ошибка приведения 22P02 из оператора `lease_token = $T` (она уходит в INTERNAL)
    held_by: "модульная проба Ack и Claim-повтора: токен «x» → INVALID_ARGUMENT `lease_token`; близнец — UUID чужой аренды → LEASE_LOST"
  - id: УК74
    item: CX1-60
    class: "doc-truthfulness §«Два места об одном предмете»"
    condition: "таблица вклада описана одним местом: З6 (`notification_id, window_key, window_start`) и §6 (`notification_id, template, scope, key, window_start`, PK `(notification_id, scope)`) — разные формы одной таблицы; остаётся одна, та, что исполняет CX1-60 (а)"
    held_by: "ревью замысла"

items:
  - id: CX1-58
    decision: "§6 `not_before … DEFAULT '-infinity'`; З23"
    class: "code-authoring §«Умолчание, которое становится утверждением» (sentinel внутри домена значения); §«Контракт, который нельзя выразить» (два написания «отсрочки не было»)"
    exposure: >-
      «отсрочки не было» записано значением в домене времени. Отбор Claim (`not_before <= now()`) с ним
      работает (замер: `'-infinity'::timestamptz <= now()` → t), но каждый читатель колонки в Go
      сканирует её в `time.Time`, а pgx v5.10.0 на этом значении возвращает ошибку «cannot scan
      -Infinity into *time.Time» (builtin_wrappers.go:455). Читатели названы самим замыслом: четвёртый
      вход `outboxobservedgate` (B20) и возраст отсроченных; метрика «сколько ждёт до not_before»
      получит бесконечность. Ошибка сканирования на пути наблюдения — пустая метрика, неотличимая от
      «отсрочек нет»
    condition: >-
      (а) «отсрочки не было» — `NULL`, отбор Claim — `(not_before IS NULL OR not_before <= now())`,
      частичный индекс по `pending` это условие покрывает; либо (б) колонка остаётся `NOT NULL`, но
      умолчание — момент вставки (`now()`), и «отсрочки не было» тогда значит «не раньше постановки» —
      без значения вне домена; ни один читатель колонки не получает бесконечность
    held_by: "интеграционная проба ленты: строка без DEFER читается сервером ленты и наблюдателем без ошибки сканирования; близнец — строка после DEFER"
  - id: CX1-59
    decision: "§6 строка 1028 «уборка закрытых строк — `outbox.NewQueueSweeper` по сроку хранения»"
    class: "measurement-discipline §«Чужое измерение и чужое заявление» (приёмка §1.8 и Р8: «годятся»); code-authoring §«Унификация и стоимость» (сведение к чужой реализации берёт её семантику)"
    exposure: >-
      новый асинхронный путь. `outbox.NewQueueSweeper` (corelib@34bc8104a outbox/retention.go:144)
      зашит на колонку `sent_at`: снимает строки `sent_at IS NOT NULL AND sent_at < now() − grace`,
      требует `PartitionColumn` (без него — отказ сборки) и щадит доставленную строку, у которой в
      партиции есть недоставленный предшественник. В схеме ленты (§6) колонки `sent_at` нет, ключ
      партиции не назван. Как записано, уборщик либо не собирается, либо каждый проход — ошибка 42703;
      если добавить `sent_at`, но ставить её только на SENT, строки `expired`, `invalid`, `denied`,
      `dropped`, `recipient_rejected` не снимаются никогда; если назвать партицию по шаблону или
      модулю, одна строка `pending` с `ttl` до 720 ч держит все более поздние закрытые строки своей
      партиции. Приёмка (§1.8, Р8) называет уборщик «годным» без замера этой формы — по Д22 это не
      возврат: наблюдаемого исхода уборки приёмка не утверждает
    condition: >-
      замысел выбирает одно: (а) лента несёт отметку закрытия, которую ставит КАЖДЫЙ переход в
      терминальное состояние (Ack терминального вида, уборщик истечения, закрытие Claim
      `sealed_mismatch`/`key_unavailable`) — под именем `sent_at` либо обёрткой corelib над
      `queueSweepSQL` с именованной колонкой; ключ партиции — `id` (каждая строка — своя партиция,
      предикат «щадить защищающую» пуст, довод записан), срок хранения — `outbox.DeliveredRetention`
      либо своя константа с читателем; либо (б) своя уборка `feed` с тем же набором свойств (партия,
      пощада `pending`, терминальные виды перечнем словаря Р11), и строка 1028 снята
    held_by: "интеграционная проба ленты: по одной закрытой строке каждого терминального вида старше срока хранения → снята; строка `pending` старше срока хранения — не снята; близнец — закрытая строка моложе срока — не снята"
  - id: CX1-60
    decision: "§6 `<svc>_notification_window` PK `(template, scope, key, window_start)`, `<svc>_notification_contrib` PK `(notification_id, scope)`; З5 `X<Scope>Per<Window>`"
    class: "code-authoring §«Контракт, который нельзя выразить» (два разных лимита — одна строка); §«Умолчание, которое становится утверждением»"
    exposure: >-
      длина окна в ключе окна не участвует. Формат допускает два лимита одной области с разными окнами
      (имена констант замысла `X<Scope>Per<Window>`; notify у себя держит час и сутки на адресата
      отдельной колонкой `window` — §6, recipient_net). Выровненные `date_bin` начала часового и
      суточного окон совпадают в полночь: оба лимита считают одну строку, и меньший лимит исчерпывает
      больший; строка вклада второго лимита той же области нарушает PK `(notification_id, scope)` —
      23505 внутри `Put`, транзакция вызывающего в aborted, что прямо противоречит И9. Третье: без
      длины окна в строке уборка устаревших строк окна невыразима, а уборки строк окна у источника в
      замысле нет вовсе — таблица растёт на строку в окно на ключ
    condition: >-
      (а) ключ окна и ключ вклада содержат тождество лимита (область И длину окна, либо имя лимита из
      описания): PK окна `(template, scope, window, key, window_start)`, PK вклада `(notification_id,
      scope, window)`; либо валидатор `notify/spec` отвергает второй лимит той же области находкой (это
      наблюдаемый исход формата — тогда он идёт в приёмку по Д22); (б) описание вклада — одно место
      (УК74); (в) строки окна, чей `window_start + window` старше `now()`, снимает уборка источника
      тем же путём, что CX1-59
    held_by: "модульная проба `notify/spec` либо интеграционная проба Put: шаблон с лимитами на адресата «1 в час» и «3 в сутки», четыре постановки на один адрес в разные часы → строк 3, четвёртая — ErrLimitExhausted; близнец — один лимит"
  - id: CX1-61
    decision: "З7 шаг 5 «для каждого `limits` — один оператор»"
    class: "code-authoring §«Решение и его следствие разнесены» («списать» частично до отказа); §«Порядок операций внутри кода»"
    exposure: >-
      у шаблона с несколькими лимитами (A01: адресат и инициатор) операторы шага 5 идут по очереди.
      Если первый прошёл, а второй вернул ноль строк, `Put` возвращает `ErrLimitExhausted`, но вклад
      первого остаётся в транзакции вызывающего, а Р10 прямо разрешает вызывающему её закоммитить
      («откатывать ли её, решает глагол источника»). Итог — вклад в окно без строки ленты: фантомный
      счёт, который тратит лимит адресата до конца окна и не возвращается уборщиком (вклада без строки
      он не видит). В notify та же форма решена откатом транзакции двух окон (З24) — у источника нет
    condition: >-
      вклад во все окна шаблона — всё или ничего внутри `Put`: шаг 5 идёт под точкой сохранения
      (`tx.Begin` вложенной транзакции pgx), и ноль строк любого лимита откатывает к ней до возврата
      `ErrLimitExhausted`; транзакция вызывающего после этого пригодна к коммиту (CX1-10) и не несёт
      ни одного вклада
    held_by: "интеграционная проба Put: шаблон с лимитами на адресата (L) и на инициатора (1), окно инициатора исчерпано → ErrLimitExhausted, вызывающий коммитит, счётчик окна адресата не изменился; близнец — оба окна свободны → оба +1"
  - id: CX1-62
    decision: "З10 оператор уборщика `WITH x AS (UPDATE … RETURNING) UPDATE <window> w SET count = w.count - 1 FROM <contrib> c JOIN x …`"
    class: "code-authoring §«Порядок операций внутри кода» (кратность соединения в UPDATE … FROM); rule data-integrity concurrent-integration-test"
    exposure: >-
      в PostgreSQL `UPDATE … FROM` меняет целевую строку не больше одного раза, сколько бы строк
      соединения на неё ни пришлось. Две строки одного адресата и одного окна, истёкшие `unclaimed` в
      одном проходе, возвращают вклад один раз вместо двух. Замер (postgres:16-alpine): окно 5, две
      строки ленты с вкладом в него, оператор З10 → строк EXPIRED 2, окно 4 (ожидалось 3). Именно
      этот случай — массовый: остановленный notify (L03, L04) истекает пачкой строк одного адресата
      в одном окне. Недосчёт необратим: вклад остаётся до конца окна, получатель упирается в лимит,
      которого не исчерпал
    condition: >-
      возврат суммирует вклад по окну до обновления:
      `UPDATE w SET count = w.count - d.n FROM (SELECT <ключ окна>, count(*) AS n FROM contrib c JOIN x … WHERE x.outcome_reason = ANY($refund) GROUP BY <ключ окна>) d WHERE w.<ключ> = d.<ключ>`;
      свойство «ровно раз при двух уборщиках» (CX1-55 (б)) сохраняется, потому что `x` — строки этого
      оператора
    held_by: "интеграционная проба уборщика: две строки `unclaimed` одного адресата в одном окне, счётчик 5 → после прохода 3; близнец — строки в разных окнах, по −1 каждому; вместе с пробой двух уборщиков (CX1-55)"

