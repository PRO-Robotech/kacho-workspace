# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 1 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. Первичные разборы (initial/b347b81f…, 530e2296…, d524e7bd…,
# 05828e42…, 390b5a33…, 29cfa368…) свидетельствуют о своих редакциях приёмки и здесь не
# переписываются. Это первая пересверка изменения, дельты против прежней пересверки нет: судится
# замысел целиком — (1) отображение каждого из 57 пунктов CX1-01…57 и то, выдерживает ли решение
# условие пункта; (2) новые внешние вызовы, (3) новые асинхронные пути, (4) новые sentinel-значения,
# которые вносит сам замысел; (5) маркеры отсрочки и открытые решения; (6) применимые ревью замысла —
# отдельно. Утверждения замысла о деревьях (М1–М21) перемерены на тех же ревизиях. SQL уборщика
# (З10) исполнен на PostgreSQL 16. Итог: 57 из 57 отображены; новых пунктов пять (CX1-58…62), все
# открыты решениями самого замысла и в нём не отображены; одно противоречие приёмки (L03 против
# Р11 и B31 (а)), которое замысел назвал зависимостью Е2, возвращается в приёмку. Права писать
# реализацию эта запись не даёт.
