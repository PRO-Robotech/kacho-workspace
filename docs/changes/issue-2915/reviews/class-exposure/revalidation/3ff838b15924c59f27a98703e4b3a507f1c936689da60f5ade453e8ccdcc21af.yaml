      не виноват: её записала пересверка 87ea333c. Заведён CX1-76

items:
  - id: CX1-76
    decision: "З16, запись реестра (а); строка CX1-75 §11; C10 — «тела выпущенных версий формы генератор держит так же, как версии схемы `notify/feed/schema` (встроенные, по отпечатку, NTF1-D04) … прежние определения в применённых миграциях побайтно равны одной из выпущенных версий»; инъекция «правка байта в прежнем определении → красный»"
    class: "code-authoring §«Контракт, который нельзя выразить» (одно значение во времени: версия шаблона и версия тела — разные предметы); gate-authoring §«Производитель входа и захват реального сообщения»; rule-00-kacho-core core-kaname-separate (граф модулей corelib←kaname←kacho)"
    exposure: >-
      (1) Предмет версии. Версии схемы ленты у D04 одинаковы для всех модулей: генератор в corelib
      держит их байты, и сверка применённого файла с ними исполнима. Тело функции `resource-event`
      зависит от `Mapping` модуля kacho (З10 NTF-3 шаг 2: «сгенерированной таблицей из `Mapping`»;
      строка 279: «дескриптор таблицы из `Mapping` модуля»). После смены `Mapping` прежнее тело
      построено из описания, которого в дереве уже нет. corelib по графу модулей не видит kacho,
      поэтому встроить в генератор «выпущенные тела» kacho нельзя. Встроить можно только версии
      шаблона формы. (2) Держателя другого нет. D04 прямо говорит, что гейт монотонности
      (`TestNewMigrationOutranksEveryAppliedOne`) правки содержимого не видит: он судит только номер
      добавленного файла. Значит, ban #5 для прежнего определения функции держит только это
      признание. (3) Исход. После первой смены `Mapping` в kacho лежат две миграции: тело из старого
      `Mapping` и `CREATE OR REPLACE`. Буквальный исполнитель N10 сверяет первое тело с набором,
      встроенным в corelib, и не находит его — красный на законном дереве. Исполнитель, который
      ослабит сверку до «прежнее — любое», пропустит ручную правку прежнего тела. Близнец C10
      синтетический и зеленеет в обоих прочтениях, поэтому различия не покажет
    condition: >-
      (а) Замысел называет, против ЧЕГО сверяется прежнее определение, и этот предмет существует в
      дереве, где гейт исполняется. Вариант, который не заводит второй записи: генератор извлекает
      входы из самого прежнего тела — таблицу вида и действия, `schema_rev`, версию формы
      (отпечаток шаблона). Затем он требует побайтного равенства тела и `render(шаблон версии N,
      извлечённые входы)`. Встроены в генератор только ШАБЛОНЫ выпущенных версий формы, по отпечатку,
      как у D04. Альтернатива — ведомость отпечатков тел в дереве модуля, которую пишет `init`. Тогда
      надо назвать, чем держится неизменность самой ведомости. (б) Действующее определение сверяется,
      как сейчас: с выводом эталона по текущему `Mapping`. (в) Близнец C10 строится как дерево
      модуля. В нём `Mapping` уже сменён, прежнее тело построено из старого `Mapping`, которого в
      дереве нет. Итог — зелёный, функций на журнал 1. (г) Инъекции: правка байта в прежнем теле →
      красный. Прежнее тело с добавленной вручную строкой таблицы вида, которой шаблон не порождает
      (извлечённые входы перерисовываются иначе), → красный. Прежнее тело с отпечатком шаблона, не
      входящим в выпущенные, → красный. (д) Формулировки З16 (а), строки CX1-75 §11, C10 и заказа
      Е10 (1) приводятся к (а) одним словарём: «выпущенная версия ШАБЛОНА формы», а не «выпущенное
      тело»
    held_by: "нужен гейт — C10 (близнец (в) и инъекции (г)). Эталон и встроенные шаблоны — проба генератора в полосе NTF-3, дающей форму `fanout` (заказ, Е10 (1)). N10 на пинах NTF-1 записей не имеет, и до NTF-3 этот путь не исполняется"

