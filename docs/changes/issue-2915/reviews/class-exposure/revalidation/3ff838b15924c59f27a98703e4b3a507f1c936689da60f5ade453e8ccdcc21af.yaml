# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 12 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта по Д26: судятся строки отображения
# CX1-73, CX1-74, CX1-75 и дельта редакции 12 против последней разобранной редакции 11 (87ea333c…,
# запись revalidation/87ea333c….yaml, коммит 64392ea5a, итог «к замыслу»). Предмет дельты —
# коммит fee2bfdcd: design.md +84/−30, tasks.md +10/−6, change.yaml +7/−5. Пункты CX1-01…72 и
# условия УК1…УК94 эта запись не пересуживает.
#
# Итог — к замыслу. CX1-73 и CX1-74 отображены полностью и выдерживают свои условия. CX1-75
# отображён дословно, но одна часть его условия, записанная прежней пересверкой (87ea333c,
# CX1-75 (а)), неисполнима. Замысел перенёс её в З16, строку §11 и C10. Неисполнимая часть —
# «тела выпущенных версий формы генератор держит так же, как версии схемы (встроенные, по
# отпечатку, NTF1-D04); прежние определения побайтно равны одной из выпущенных версий». Тело
# функции зависит от `Mapping` модуля kacho. Генератор в corelib может держать версии ШАБЛОНА формы,
# но не тела: прежнее тело построено из `Mapping`, которого в дереве уже нет. corelib по графу
# модулей kacho не знает. Дефект — в формулировке этого разбора, а не в отображении. Он заведён
# новым пунктом CX1-76.
#
# Новых внешних вызовов, асинхронных путей и sentinel дельта не вводит. Возврата в приёмку NTF-1
# нет. Д33 не менялся. У Д34 (приёмка NTF-3, Р10, NTF3-161, позиции ленты числом) предмета в этом
# замысле нет: `seen`, `position`, `up_to`, `NTF3-161` в design.md — 0 совпадений.
