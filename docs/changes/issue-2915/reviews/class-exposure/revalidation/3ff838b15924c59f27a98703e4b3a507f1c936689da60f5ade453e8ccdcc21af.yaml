    verdict: holds
    evidence: >-
      (а) Оговорка «кроме функций, признанных записью реестра З16 (Д33)» одной фразой стоит в З5
      (404, 407), З7 шаг 5 (520), И31 (1671), CX1-64 (1991) и УК87 (а) и (б) (2114). Строка 114 —
      история редакции 4, строка 230 — замер М28, строка 1023 — сама запись: в них оговорка не
      нужна. (б) Довод З5 (407–416) и запись реестра (1019–1023) называют все пять сторожей:
      флаг, форму атрибутов, адресата, секрет, лимит и окно. (в) Е10 переписан, предикат выполним.
      (г) §12 (2161–2163) и §13 (2182) исправлены. (д) C6 и УК87 оговаривают, что эталон NTF-1
      шаблона `resource-event` не несёт
  - item: CX1-74
    verdict: holds
    evidence: >-
      (а) Область — дерево (модуль) kacho. В corelib и kaname запись инертна. Гейт печатает число
      применимых записей: З16 (990–992), C10, K7 (печатает 0), N10 (0 на пинах NTF-1). (б)
      Предикат снятия считает определения по идентичности и сверяет их с эталоном; `-list` он не
      читает, D01 без правки. (в) Порядок «тег corelib, пин kacho и миграции — одно изменение kacho»
      передан заказом в Е10 (2). (г) Обе инъекции есть в З16 и в C10
  - item: CX1-75
    verdict: holds_with_new_item
    evidence: >-
      Отображён дословно. Эталон `(журнал, Mapping, schema_rev, версия формы)` → тело без копии в
