mapping_check:
  - item: "CX1-92 (а)"
    verdict: holds_with_note
    evidence: >-
      Контракт — `render_chain_args <цепочка> <каталог> [<образец>]`, каталог обязателен, смысл тот же,
      что у `stacks_args` (`-f <каталог>/<профиль>`). Пустой каталог или не каталог — отказ. Две
      точки без каталога (`ci.yaml`, `ci-local.sh`) передают `.`. На origin/1276 задание CI идёт с
      `working-directory: deploy/helm/umbrella`, так что `.` там верен. Прежний вызов с образцом на
      второй позиции громко отказывает. Абзац называет прежнюю форму неверно — N16
  - item: "CX1-92 (б)"
    verdict: holds
    evidence: >-
      Go: элемент образца — `filepath.Rel(umbrellaDir, …)`, строкой не записан. Все 44 файла,
      зовущие `deployStacks(t`, лежат в `deploy/` (origin/1276), значит у Go-вызывающих одна база.
      Шелл: абсолютный путь от `${BASH_SOURCE[0]}` библиотеки, он верен при любом каталоге вызова.
      Проба соединением вызывающего на обеих сторонах и инъекция «элемент относительно корня
      репозитория» названы
  - item: "CX1-92 (в)"
