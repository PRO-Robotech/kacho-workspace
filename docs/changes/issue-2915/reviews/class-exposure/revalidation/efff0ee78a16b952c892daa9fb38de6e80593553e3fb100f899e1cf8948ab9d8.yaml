# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 22 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 21
# (170f1ee2…, запись revalidation/170f1ee2….yaml, коммит 22ba695d9, итог «к замыслу»: CX1-92,
# CX1-93; N12–N15 к коду). Дельта — коммит 3f19e31ea: отображение CX1-92, CX1-93, N12, N15 и
# решение диспетчера Д51 (NTF-2 Е16 (а)), принятое как заказ NTF-2 Е17. Пункты CX1-01…91 и условия
# УК1…УК94 эта запись не пересуживает.
#
# Итог — к замыслу. CX1-92 (а)–(в) и CX1-93 (а)–(г) отображены и выдерживают условия пунктов; N12 и
# N15 внесены. Д51 вносит в рендер `prod` ВТОРОЕ обязательное значение (ручку прыжков края) рядом с
# узлом почты. Это открывает два пункта:
#   CX1-94. Отказ рендера при двух незаданных `required` называет ОДНО имя. helm 4.2.4 останавливается
#   на первой ошибке; какое имя выйдет, решает внутренний порядок шаблонов (замер: при обоих пустых
#   на модели зонтика выходит узел notify, не край). `--show-only` не изолирует: `required` чужого
#   шаблона всё равно срабатывает. Замысел пишет исход «утверждение отказа с именем узла (и, после
#   NTF-2 D6, ручки прыжков)», и такое утверждение невыполнимо. Проба D1 «`prod` на фикстурной копии,
#   узел пуст → отказ с именем узла» и её близнец «адрес задан → ключ равен адресу» после D6 NTF-2
#   меняют больше одного факта. Близнец краснеет на полосе NTF-2, в путях которой его нет. Отказ
#   «с именем узла» остаётся зелёным лишь по случайности порядка.
#   CX1-95. Опора сравнения пробы образца — «тот же образец без узла почты». Она рендерится, только
#   пока перечень `prod` пуст. Когда NTF-2 делает перечень непустым (Е12 (4)), этот рендер
#   отвергается с именем узла (Д46). Проба образца краснеет или не выполняется на полосе NTF-2, а
#   замысел утверждает, что образец NTF-2 «проба проводит без правки». Заказ NTF-2 Е17 (б) отображён
#   только при пустом перечне.
# Заметки к коду: N16 (абзац CX1-92 (а) называет «прежней» формой новую), N17 (путь каталога образцов
# правит NTF-2 D6, а в Е13 его нет), N18 (при переводе `prod-profile-fail-closed` слой нужен и каждому
# `render_only … --show-only`). Возврата в приёмку нет.
