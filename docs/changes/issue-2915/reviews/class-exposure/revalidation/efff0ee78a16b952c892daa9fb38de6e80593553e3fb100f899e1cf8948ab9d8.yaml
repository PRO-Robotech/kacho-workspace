items:
  - id: CX1-94
    status: unmapped
    decision: "§0 Д51 и З28 «Каталог несёт и ручку прыжков края» (второе `required` в рендере `prod`) вместе с З28 «Рендер профиля `prod` по имени — тоже точка применения», исход «утверждение отказа с именем узла (и, после NTF-2 D6, ручки прыжков)»; в контексте — З28 «Узел почты → ключ процесса», проба D1 на фикстурной копии и её близнецы, проба D2 «отказ рендера `prod` с пустым узлом — текст с обоими выходами»"
    class: >-
      code-authoring §«Инвариант и оснастка — это тоже прод-код» (утверждение отказа, которое
      исполнитель выполнить не может); change-graph «отрицательный кейс меняет ровно один факт против
      положительного близнеца» (после D6 NTF-2 у пары «узел пуст / узел задан» различаются два
      факта); .claude/rules/architecture.md §«Параллельные полосы одного механизма обязаны сверяться
      МЕЖДУ СОБОЙ» (NTF-1 и NTF-2 ставят по `required` в один рендер)
    finding: >-
      (1) Замер, helm v4.2.4. На чарте с двумя шаблонами, в каждом по `required`, при обоих
      незаданных `helm template` печатает одну ошибку — `N_NODE missing`, а `A_HOPS` не называет
      вовсе. На модели зонтика (`charts/api-gateway` с ручкой прыжков, `charts/notify` с узлом)
      трижды подряд печатается `NODE missing`. Задан узел — `HOPS missing`, задана ручка — `NODE
      missing`. С `--show-only` другого шаблона падает всё равно, отказом чужого `required`. Значит,
      при двух пустых значениях отказ называет одно имя. Какое — решает порядок обхода шаблонов в helm,
      а не гейт. (2) Исход «утверждение отказа с именем узла (и ручки прыжков)» поэтому невыполним,
      если оба значения пусты, а исполнитель, прочитавший «и», напишет утверждение, которое не
      сойдётся. (3) Проба D1: «цепочка `prod` на фикстурной копии чарта с таблицей N02 и включённым
      `probe-b`, узел пуст → отказ с именем узла; близнец — адрес задан → ключ равен адресу». Если
      копия — зонтик вместе с краем, то после D6 NTF-2 в близнеце пуста ручка прыжков, и он получает
      отказ `HOPS`. Это красный на полосе NTF-2, в путях которой D1 нет. Отрицание при этом остаётся
      зелёным: по замеру (1) helm называет узел раньше ручки. Но держится это на порядке обхода
      шаблонов, а не на конструкции пробы. Тот же разбор относится к пробе D2 «отказ `prod` с пустым
      узлом — текст с обоими выходами» и ко всякой будущей точке с исходом «утверждение отказа».
      (4) С другой стороны то же видно в NTF-2 Е16 «рендер `prod` без значения отказывает с именем
      ручки». При непустом перечне `prod` голый рендер назовёт узел, а не ручку (замер (1)). Это
      предмет замысла NTF-2 — заказ ниже
    condition_to_design: >-
      (а) Исход «утверждение отказа» в З28 переписан так: отказ, который утверждает гейт, возникает при
      рендере, где отсутствует ровно одно обязательное значение `prod`. Этот рендер — цепочка `prod`
      через обёртку с образцом каталога, из которого снят ровно проверяемый ключ (узел, либо после D6
      NTF-2 — ручка). Утверждается имя ровно этого ключа. Формулировка «с именем узла и ручки» снята.
      (б) Проба D1 (отказ `required` и оба близнеца) и проба D2 (текст с обоими выходами) рендерят
      `prod` со слоем образца каталога. Отрицание — тот же образец без узла. Близнец — образец целиком.
      Если фикстурная копия — копия зонтика, в ней действует та же обёртка. В З28 записано, что
      несущий значение слой для прочих `required` берётся из каталога, а не из самой пробы. (в)
      Предпосылка каждой такой пробы печатается: перечень незаданных обязательных значений опоры равен
      одному имени. Если он больше одного — проба «НЕ ВЫПОЛНИЛОСЬ» с перечнем, а не красный или
      зелёный. (г) Инъекция: у образца сняты сразу два ключа (узел и ручка) → предпосылка отказывает
      с двумя именами. Близнец — снят один ключ → отказ с его именем
    held_by: "нужен гейт — предпосылка «одно незаданное значение» в пробах D1, D2 и в переписи D2 для исхода «утверждение отказа»; сегодня держится вниманием и порядком обхода шаблонов в helm"

  - id: CX1-95
    status: unmapped
    decision: "З28 «Проба образца» редакции 22: «число объектов вне notify равно рендеру с тем же образцом, из которого снят узел почты»; отображение NTF-2 Е17 (б); утверждение «образец NTF-2, положенный в каталог, проба проводит без правки»"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением» (опора сравнения молча предполагает
      пустой перечень `prod`); change-graph «честный красный против несозданного условия» (при непустом
      перечне опора не рендерится, и проба образца ломается не о предмет); .claude/rules/testing.md
      §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки» п.7
      (предпосылки нет)
    finding: >-
      По Д46 шаблон `ConfigMap` notify рендерится при непустом перечне, а пустой узел даёт `required`.
      Значит, «образец без узла почты» рендерится, только пока перечень `prod` пуст. В NTF-1 он пуст
      (N11 · CX2-60 (б): `prod` — 0 объектов notify). По Е12 (4) перечень делает непустым NTF-2
      (источник kaname в `prod`), а за ним NTF-3. С этой посадки опора пробы образца отказывает с
      именем узла на каждом файле каталога, и проба D9 краснеет или не выполняется на полосе NTF-2. Её
      путей в NTF-2 нет. Это расходится с утверждением «проба проводит образец NTF-2 без правки» и с
      Е17 (б) «проба выполнима, когда рендер `prod` без образца отказывает». Есть и второе: пока
      перечень пуст, узел в рендер `prod` не попадает вовсе (0 объектов notify). Тогда сравнение
      «с узлом / без узла» совпадает при любом содержимом узла и ничего не доказывает. Отрицание
      «адрес формы dev → отказ стража (6)» судит страж зонтика, а не сравнение
    condition_to_design: >-
      (а) Опору сравнения выбрать так, чтобы она рендерилась при любом состоянии перечня `prod`.
      Например, тот же образец, где узел заменён вторым законным адресом формы оператора (другой хост,
      тот же вид удостоверения). Тогда объекты вне notify побайтно равны, а объекты notify различаются
      ровно адресом. Сказано, что это утверждение сильнее «числа объектов». (б) Проба печатает состояние
      перечня `prod` (пуст / непуст, число источников) для каждого образца. При пустом перечне
      сравнение объявлено непроводимым — «НЕ ВЫПОЛНИЛОСЬ», а не зелёным. Либо проба на время NTF-1
      включает `probe-b` в фикстурной копии, чтобы перечень был непуст и узел попадал в рендер.
      Выбор записан в З28. (в) Инъекция: второй адрес образца протекает в объект вне notify (фикстурная
      копия шаблона) → красный с именем объекта. Близнец — адрес только в notify → молчание
    held_by: "нужен гейт — проба D9 с опорой, рендеримой при непустом перечне, и печатью предпосылки; сегодня держится тем, что перечень `prod` в NTF-1 пуст"

notes:
  - id: N16
    blocking: false
    where: "З28 «Контракт шелл-обёртки несёт ось каталога» (CX1-92 (а)), design.md строки 2025–2026"
    text: >-
      «Прежняя форма вызова `render_chain_args prod <каталог> <образец>` поэтому громко отказывает» —
      это НОВАЯ форма. Прежняя — `render_chain_args prod <образец>`, так она и записана в Е12 (8). Это
      два места об одном предмете, и одно из них неверно. Исполнитель, которому этот абзац служит
      заданием на отрицание пробы, получит отрицание на законный вызов. К замыслу при следующей
      правке (одно слово); к коду: отрицание пробы D9 — `render_chain_args prod <образец>` → отказ
      «`<образец>` — не каталог», близнец — `render_chain_args prod <каталог> <образец>` → строка
    predicate: "grep -n 'Прежняя форма вызова' docs/changes/issue-2915/design.md"
  - id: N17
    blocking: false
    where: "Д51, З28 «Каталог несёт и ручку прыжков»; §13 Е13"
    text: >-
      Каталог `deploy/testdata/mail-node/` заводит D9 NTF-1, а строку ручки в каждый его файл вписывает
      D6 NTF-2. Путь правят два изменения, но в Е13, где собраны разделённые пути, его нет. Порядок D9
      → D6 не записан. Если D6 сядет раньше D9, обход «каждого файла» пройдёт по пустому каталогу, и
      D9 затем внесёт `operator.yaml` без строки ручки. Молча это не пройдёт: проба образца D9
      покраснеет с именем ручки. Но красный будет на полосе NTF-1 и о чужой ручке. К замыслу: строка
      Е13 «путь каталога разделён с NTF-2 D6, порядок — D9 первым» и предикат старта D6 «D9 влита в
      2564»
  - id: N18
    blocking: false
    where: "З28 «Рендер профиля `prod` по имени — тоже точка применения», исход «перевод на обёртку»; D2, `deploy/tests/helm/prod-profile-fail-closed-test.sh`"
    text: >-
      Файл рендерит `prod` дважды: полный `helm_try … -f "$PROD"` (строка 104) и помощником
      `render_only "$PROD" <шаблон>` с `--show-only`, в котором `-f` один. Замер показал, что
      `--show-only` не изолирует чужой `required`. Поэтому слой нужен и каждому вызову
      `render_only`. Сигнатуру помощника меняют так, чтобы он брал аргументы цепочки целиком: одной
      правкой строки 104 перевод не исчерпывается. К коду: перепись D2 судит каждую строку рендера
      `prod` в файле, а не первую
  - id: N19
    blocking: false
    where: "NTF-2 З28 «Ручка прыжков — не из базы», держатель «рендер `prod` без значения отказывает с именем ручки»"
    text: >-
      Это сторона NTF-2, к сведению. При непустом перечне `prod` голый рендер назовёт узел почты, а
      не ручку (замер CX1-94 (1)). Держатель должен рендерить образец без строки ручки, а не голый
      `prod`

