items:
  - id: CX1-89
    status: unmapped
    decision: "D9, З28 «Слой подставляет только тестовая обёртка»: шелл-обёртка `deploy/tests/helm/lib/render-chain.sh` берёт строку общего читателя (`stacks.sh --args`/`stacks_args`) и для `prod` дописывает фикстурный файл; шелл-гейты берут цепочки через неё"
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (новая оснастка обязана встать под действующие стражи оснастки); measurement-discipline §«Радиус: по имени механизма и по точкам применения» (радиус обёртки — гейты, судящие читателей состава, а не только их вызывающие)"
    finding: >-
      Гейт `internal/repohygiene/rosterreaderexitcode_test.go` ловит теряющие код формы
      (`for … in $(…)`, `<(…)`, `<<< $(…)`, `helm|render|kubectl … $(…)`) только у читателей из
      закрытого списка `rosterReaderNames`: `stacks_table`, `stacks_names`, `stacks_chain`,
      `stacks_args`, `product_service_dirs`, `newman_*`, плюс форма `stacks.sh --…`. В шапке гейта
      сказано, что список — транзитивное замыкание, «производные включены». Обёртка D9 —
      производный читатель: её отказ — это отказ `stacks_args`. Под новым именем её в списке не
      будет. Тогда шелл-гейт, переведённый D2 на `helm template … $(<обёртка> prod)`, теряет код
      отказа таблицы, а гейт молчит. Это ровно тот класс, из которого гейт вырос: пустая цепочка
      при коде 0 — `helm` без профиля. Каталога `deploy/tests/helm/lib/` на origin/1276 нет, файл
      новый. Сейчас теряющих форм с `stacks_args`/`stacks.sh --args` в `*.sh` — 0.
    condition_to_design: >-
      (а) Путь `internal/repohygiene/rosterreaderexitcode_test.go` — в путях D9. Имя функции обёртки
      входит в `rosterReaderNames` тем же изменением, что заводит обёртку. (б) Инъекция в пробах
      D9: копия шелл-гейта с `helm template … $(<обёртка> prod)` → гейт кода отказа красный с
      именем обёртки. Близнец — `args="$(<обёртка> prod)" || exit` → молчание. (в) Сама обёртка
      читает код `stacks_args` (присваивание с проверкой), а не передаёт подстановку дальше.
      Отрицание — таблицы нет → обёртка отдаёт ненулевой код, а не пустую цепочку с кодом 0
    held_by: "гейт кода отказа читателей состава — есть в дереве, нужна запись имени обёртки (заказ D9); инъекция (б) — нужна, её нет (заказ)"
  - id: CX1-90
    status: unmapped
    decision: "CX1-85 (а), З28 «Гейт MAIL-54»: D2 переносит CRED_PATHS в `cutover-creds-layer.sh`, снимает из него `global.kacho.identity.smtp.connectionURI`; пара 2 MAIL-54 утверждает «почтовых координат 0»"
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения» (у механизма MAIL-54 два файла, маршрут называет один); gate-authoring — инъекция, чей вход исчезает вместе с предметом"
    finding: >-
      `deploy/identity_mail_lane_single_declaration_injection_test.go`
      (`TestMailLaneGateFailsOnAReturnedDefect`) правит копию скрипта по пути
      `filepath.Base(cutoverScript)`. Инъекция оси 2 заменяет литерал
      `global.kacho.identity.smtp.connectionURI` на координату поставщика. Близнец оси 2 дописывает
      после этого литерала непочтовую координату и ждёт молчания. Помощник `edit` при нуле вхождений
      якоря делает `t.Fatalf` («инъекция не нашла своего входа»). После D2 литерала в перечне нет, и
      обе проверки оси 2 падают. В путях D2 назван только сам гейт
      (`identity_mail_lane_single_declaration_test.go`), а инъекция в новой форме («координата
      возвращена в перечень → красный») описана как правка гейта, а не этого файла. Смысл близнеца
      тоже меняется: при пустом перечне «непочтовая координата — молчание» остаётся верным, но
      вставлять её надо по якорю блока CRED_PATHS нового файла. Других читателей CRED_PATHS в дереве
      нет: `git grep CRED_PATHS` — только скрипт; `cutoverScript` ещё читают
      `rollout_preflight_covers_required_secrets_test.go`, `stack_rollout_test.go`,
      `helm_deps_single_owner_test.go`, но шаг 1a им не нужен.
    condition_to_design: >-
      (а) Путь `deploy/identity_mail_lane_single_declaration_injection_test.go` — в путях D2 и в
      перечне правок MAIL-54 З28. (б) Путь копии в фикстуре инъекций — `cutover-creds-layer.sh`, а не
      `cutover-fe3455.sh`. Константа пути одна на гейт и инъекции. (в) Ось 2 после D2: инъекция —
      почтовая координата (наша и координата поставщика — два подслучая) вписана в блок CRED_PATHS
      → находка с именем координаты. Близнец — непочтовая координата в блоке → молчание. Якорь обоих
      — ограничитель блока CRED_PATHS, найденный ровно один раз
    held_by: "MAIL-54 и его инъекции — есть в дереве; путь инъекций в D2 не назван (заказ)"

notes:
  - id: N6
    blocking: false
    where: "З28 «Флаг и выведенный перечень» (таблица по цепочкам), «Проба на a8f60d»; tasks.md D2 (пути)"
    text: >-
      Цепочка `a8f60d` — `values.dev.yaml,values.dev-prod.yaml,values.a8f60d.yaml`. Таблица З28
      объявляет по цепочкам флаг и ключи пробы, но не `notify.standProbeNamespace`. Если стендам с
      приёмником ручку задаёт `values.dev.yaml`, `a8f60d` её наследует. Тогда нужно переопределение
      в `values.a8f60d.yaml`, а этого пути у D2 нет. Если ручку не задаёт ни одна цепочка, так и
      стоит сказать. Нужна колонка `standProbeNamespace` с файлом каждого значения. Перепись D2
      поймает расхождение красным, но решение о месте значения — замысла, а не полосы
  - id: N7
    blocking: false
    where: "З28 «Слой подставляет только тестовая обёртка» — «общие читатели … stacks.sh и функция Go deployStacks(t)»"
    text: >-
      На origin/1276 у `deploy/stacks.txt` пять читателей Go в четырёх пакетах: `deployStacks`
      (`deploy`, пакет `deploy_test`), `deployedStacks` (`deploy/helm/umbrella`, `umbrella_test`),
      `readStackTable`/`deployableStacks` и `readLanePrereqStacks` (`gateway/deploy`),
      `deployStackChains` (`services/registry/deploy`). `deployStacksForRender(t)` из
      `deploy_test` достижима только внутри своего пакета. Сейчас ни один читатель вне `deploy_test`
      не рендерит зонтик целиком по цепочке. `edge_public_listener_mtls_test.go` рендерит подчарт
      края, `login_lane_prereq_test.go` — чарт kaname, прочие читают значения. Поэтому сегодня
      пробела нет. Условие переписи D2: точка роли «гейт» вне пакета обёртки — красный «обёртки в
      пакете нет», а не новая копия слоя
  - id: N8
    blocking: false
    where: "tasks.md D2 — проба `deploy/fe3455_cutover_render_test.go`"
    text: >-
      Проверка слоя требует python3 с PyYAML (`cutover-fe3455.sh:213`, «need python3 with
      PyYAML»). Проба D2 зовёт ту же функцию, поэтому отсутствие PyYAML на машине прогона обязано
      дать «не выполнилось» с названной предпосылкой, а не зелёный и не пропуск. К коду

