# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 19 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 18
# (52b638a3…, запись revalidation/52b638a3….yaml, коммит 3ff4bcf15, итог «к замыслу»:
# CX1-85…88, N3 блокирует). Дельта — коммит 1717615a1 (отображение CX1-85…88, N3–N5; М37–М40;
# полоса D9). Пункты CX1-01…84 и условия УК1…УК94 эта запись не пересуживает.
#
# Итог — к замыслу. CX1-85…88 и N3 отображены, и отображение выдерживает условия пунктов.
# М37 и М38 воспроизведены. Но два новых механизма редакции 19 задевают гейты, которых маршрут
# не называет, — два новых пункта:
#   CX1-89. Шелл-обёртка D9 `render-chain.sh` становится ещё одним читателем состава стендов.
#   Гейт кода отказа читателей (`internal/repohygiene/rosterreaderexitcode_test.go`) знает
#   читателей по закрытому списку имён. Имени обёртки в нём не будет, и тогда вызов обёртки в
#   теряющей код форме гейт не увидит. Путь гейта в D9 не назван.
#   CX1-90. D2 снимает `connectionURI` из перечня слоя. Инъекции MAIL-54 в
#   `deploy/identity_mail_lane_single_declaration_injection_test.go` цепляются за эту строку
#   (ось 2: инъекция и близнец). После правки они отказывают «инъекция не нашла своего входа»,
#   а файла в путях D2 нет. Отказ громкий, так что это пропуск в маршруте, а не тихая дыра.
# Заметки: N6 — где задан `notify.standProbeNamespace` по цепочкам, не объявлено (N5 держится
# условно). N7 — у таблицы цепочек пять читателей Go в четырёх пакетах, а обёртка Go
# достижима только из одного. Возврата в приёмку нет.
