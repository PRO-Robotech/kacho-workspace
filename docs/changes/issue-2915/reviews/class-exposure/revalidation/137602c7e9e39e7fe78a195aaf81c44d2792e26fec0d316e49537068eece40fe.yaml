# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 3 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. По Д22 судится ТОЛЬКО дельта редакции 3 против последней разобранной
# (редакция 2, 774e8562…, запись revalidation/774e8562….yaml). Предмет дельты — `git diff 15d928ae4
# f6804a818 -- docs/changes/issue-2915/design.md` (+111/−40): отображение CX1-63 (З7 шаг 5, З10, §11),
# строки УК80–УК84 §11а, И30, Е9, константа `feed.SweepBatch`, замер М26. Пункты CX1-01…62 и их
# отображения этой записью не пересуживаются: их выдержали записи 9bfa92be и 774e8562, и дельта их не
# трогает.
# Итог: CX1-63 отображён и выдерживает условие (М26 воспроизведён этой записью: 0 взаимных блокировок из
# 4); УК80–УК82 исполнены. Дельта открыла два новых пункта на своих же утверждениях: CX1-64 — перепись
# писателей строк окна («их три») закрыта перечислением автора, а приёмка NTF-3 ждёт от `notifygen init`
# SQL-функцию постановки, которой в NTF-1 нет ни словом; CX1-65 — И30 «транзакция вызывающего `Put`
# жертвой взаимной блокировки не становится» верно только между писателями ленты, цикл через замки
# самого вызывающего им не покрыт. Плюс два условия к коду (УК85, УК86): второе воспроизведено —
# порядок лимитов, при котором окна одной области идут не по числу секунд, даёт взаимную блокировку с
# уборщиком редакции 3 в 2 случаях из 2. Возврата в приёмку дельта не даёт; NTF1-L03 записи 9bfa92be в
# силе (приёмка не менялась, 29cfa368…). Права писать реализацию эта запись не даёт.
