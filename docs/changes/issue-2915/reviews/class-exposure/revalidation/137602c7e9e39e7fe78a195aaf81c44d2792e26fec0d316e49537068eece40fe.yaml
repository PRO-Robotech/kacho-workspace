conditions_to_code:
  - id: УК85
    item: "CX1-63, УК84"
    class: "code-authoring §«Решение и его следствие разнесены» (инвариант порядка замков — у ленты, исполнение «одна постановка на транзакцию» — у вызывающих)"
    condition: >-
      `Put` сам отвергает вторую постановку в той же транзакции вызывающего именованным сторожем (например
      `feed.ErrSecondPutInTransaction`) ДО первого оператора окна: транзакционная отметка внутри точки
      сохранения (`set_config(<имя>, …, true)`, прочитанная первым шагом) либо равносильный механизм.
      Отметка откатывается вместе с точкой сохранения, поэтому `Put`, вернувший `ErrLimitExhausted`,
      следующую постановку не запрещает — его замки окон сняты тем же откатом. Если автор оставляет
      УК84 только заказом, замысел пишет, почему: нарушение УК84 проявляется взаимной блокировкой под
      нагрузкой, а не отказом в пробе вызывающего, и вниманием двух чужих замыслов держится то, что
      лента может держать сама
    held_by: >-
      интеграционная проба `Put`: две постановки в одной транзакции → вторая — именованный сторож, окна и
      лента не изменились второй; близнец — первая `ErrLimitExhausted`, вторая проходит; инъекция —
      отметка не ставится → вторая постановка проходит, проба красная
  - id: УК86
    item: "CX1-63"
    class: "code-authoring §«Контракт, который нельзя выразить» (один порядок — одно написание сравнения); §«Порядок операций внутри кода»"
    condition: >-
      (а) сравнение лимитов у генератора — `scope` побайтно, затем `window_seconds` ЦЕЛЫМ числом секунд, а
      не строкой длительности или десятичной записью: слово «побайтно» в З7 и УК83 применимо только к
      текстовым частям ключа. Порядок, при котором две длины одной области идут не по числу, даёт взаимную
      блокировку с уборщиком ред. 3 (замер ниже: 2 из 2); (б) порядок держит место, которое берёт замки:
      `Put` проверяет, что `limits` описания строго возрастают по `(scope, window_seconds)` в том же
      сравнении, и иначе отвечает `feed.ErrAttrsInvalid` с именем шаблона (либо упорядочивает сам) — а не
      полагается на генератор
    held_by: >-
      проба генератора (C6): пары, где десятичная и строковая записи расходятся с числом (600 и 3600;
      «30m» и «24h»), выходят по числу секунд; проба `Put` (C4): описание с убывающим `window_seconds`
      одной области → `ErrAttrsInvalid` (или замки по возрастанию); интеграционная проба УК83 дополняется
      близнецом «одна область, две длины окна»

items:
  - id: CX1-64
    decision: "З7 шаг 5 «Писателей строк окна три: `Put`, уборщик истечения и уборка прошедших окон (З10)»; §3 И30 «писатели строк окна не образуют цикла ожидания»"
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения» (перепись писателей по таблице, а не по списку автора); code-authoring §«Инвариант и оснастка — это тоже прод-код» (инвариант без переписи, которая может покраснеть)"
    exposure: >-
      перепись закрыта перечислением, а не предикатом, и расходится с соседним документом: приёмка NTF-3
      (88ad95c6…) ждёт от `notifygen init` «миграцию ленты, функцию постановки, эталон структуры» (строки
      1499, 4024), а «каждая функция базы ставит строку ленты той же транзакцией (функция `notifygen`)»
      (строка 2067) — это SQL-путь постановки, вызываемый триггерами функций журнала vpc, nlb, registry,
      storage. В замысле и приёмке NTF-1 SQL-функции постановки нет ни одним упоминанием (0 и 0). Та же
      приёмка NTF-3 заводит лимиты модулей с новой областью «проект» (строки 1105–1110). Если функция
      постановки пишет строки окна, это четвёртый писатель вне полного порядка, а вызов из триггера на
      каждую строку оператора делает несколько постановок в одной транзакции — УК84 нарушен устройством,
      а не небрежностью вызывающего
    condition: >-
      (а) замысел называет, есть ли у `notifygen` SQL-функция постановки: нет — тогда заказ автору NTF-3
      (его приёмка утверждает о чужом генераторе то, чего тот не делает); есть — тогда она либо отвергает
      шаблоны с `limits` и строк окна не пишет, либо названа писателем окна с тем же полным порядком и
      тем же условием «одна постановка на транзакцию» (и тогда триггер по строке этому условию не
      удовлетворяет); (б) перепись писателей окна держит гейт дерева: не-тестовые операторы, пишущие
      `*_notification_window` (Go и функции SQL в миграциях), — ровно три, в `notify/feed`, со
      знаменателем осмотренного
    held_by: >-
      гейт дерева corelib (`treehygiene`) и kacho (`repohygiene` по миграциям модулей): печатает число
      писателей окна и их координаты; инъекция — `UPDATE <svc>_notification_window` в функции миграции
      модуля → красный с координатой; близнец — те же три оператора `notify/feed` → зелёный
  - id: CX1-65
    decision: "§3 И30 «транзакция вызывающего `Put` жертвой взаимной блокировки не становится»; З10 «Жертвой взаимной блокировки транзакция вызывающего `Put` поэтому не становится»"
    class: "code-authoring §«Порядок операций внутри кода» (порядок взятия ресурса — во всей транзакции, а не в своей части)"
    exposure: >-
      полный порядок доказан только между писателями ленты. Транзакция вызывающего держит и свои замки:
      T1 — `Put` (окно W), затем `UPDATE` своей строки V; T2 — `UPDATE` V, затем `Put` (ждёт W у T1),
      а T1 ждёт V у T2 — цикл, жертвой которого становится транзакция вызывающего. УК84 этого не
      запрещает: в каждой транзакции постановка одна. У NTF-2 порядок согласован (З24: строка аккаунта
      `FOR UPDATE` → рекомендательная блокировка → счёт → письмо → момент с новым `feed_id`), у NTF-3
      замысла ещё нет — проверить нечего
    condition: >-
      (а) И30 и фраза З10 сужены до «между писателями ленты»; (б) условие вызывающим в Е9 (рядом с УК84)
      дополнено: после `Put` транзакция вызывающего не берёт замок существующей строки, который другая
      транзакция того же вызывающего берёт до своего `Put` (рабочая форма — `Put` последний шаг,
      берущий замки существующих строк; вставки строк с новым id допустимы); глагол, который так не
      может, называет свой порядок в своём замысле
    held_by: >-
      вниманием замыслов вызывающих, и гейта у NTF-1 нет и не будет: какие замки держит транзакция
      вызывающего, лента не видит. Держатель у вызывающего — его интеграционная проба двух глаголов
      встречным порядком (заказ через Е9)

