new_items:
  - id: CX1-123
    decision: "Д82: notify вносится в таблицы assert-ban6-external-isolation.py, assert-shard-coverage.py, assert-metrics-surfaces-answer.sh полосой D1s, в этой волне; по замыслу на каждый гейт инъекция «строка notify снята → красный» и близнец «как есть → зелёный с числом»"
    class: >-
      code-authoring §«Инвариант и оснастка — это тоже прод-код»: строку правят в скрипте гейта, а
      данные гейта лежат в манифесте. code-authoring §«Решение и его следствие разнесены»: регистрация
      в живом гейте проходит в D1s, а предмет гейта (объекты notify на стенде) появляется только в D2.
      code-authoring §«Умолчание, которое становится утверждением»: «зелёный с числом» живого гейта
      на стенде без notify
    exposure: >-
      Измерено @1192e5e48c0. (1) assert-shard-coverage.py: «НАХОДКА: домен 'notify' несёт
      Internal*-контракт, ПРОВЯЗАННЫЙ прод-кодом, но ban #6 для него не измеряет НИ ОДИН шард», «FAIL:
      находок 1». Перепись e2e-ban6-domains.py: served включает notify, hosts notify = [notify]. Строк
      о доменах у скрипта нет (grep -c notify → 0). Охват берётся из deploy/e2e-shards.json
      (core_ban6_domains = [geo], gate_ban6_domains, gate_images, gates). Этого файла нет ни в замысле,
      ни в маршруте (0/0), а пути D1s называют скрипт. (2) Форм регистрации домена в манифесте две.
      Переключаемый компонент gates выключается «--set <gate>.enabled=false» (шапка манифеста), а это
      второй включатель notify, который Д76 запрещает (строка D1: «второго включателя (notify.enabled,
      condition) … нет»). Образ ядра core_images ставит notify на каждый шард. В обоих случаях живая
      проба ban #6 спрашивает Internal*-метод notify на стенде, где рендер зонтика на дереве Д78 даёт 0
      объектов notify (Д76, замер пересверки 5c24973c). Встречный контроль пробы уронит прогон как
      «невыполненное измерение» (п.8 скрипта). Это не изоляция и не зелёный. (3) assert-metrics-surfaces-answer.sh
      и assert-ban6-external-isolation.py — живые, опрашивают поды. Для notify на стенде этой волны у
      них нет предмета, поэтому близнец замысла «как есть → зелёный с числом» на дереве Д78
      неисполним. Без условия исполнитель выберет одно из простых решений: заведёт notify.enabled,
      внесёт notify в ядро с красными шардами или вычеркнет notify из переписи served. Все три
      запрещены (Д76; ban #6; самоистечение у переписи выведено из дерева)
    condition_on_code: >-
      (а) Пути D1s называют deploy/e2e-shards.json и, если меняются веса, deploy/E2E-SHARDS.md, а
      предикат D1s — зелёный assert-shard-coverage.py на дереве Д78 с печатью notify. Слова «строки
      notify в assert-shard-coverage.py» заменены координатой данных. (б) Замысел решает, чем notify
      представлен в манифесте до D2, не нарушая Д76, и называет исход живых гейтов для notify на
      стенде волны. Допустимая форма — та же, что у CX1-122: предпосылка — пустая таблица модулей.
      Тогда живая проба ban #6 и проба поверхностей метрик по домену notify дают «НЕ ВЫПОЛНИЛОСЬ:
      перечень пуст» с печатью предпосылки, а не зелёный и не красный. Таблица непуста и подов notify
      0 → красный. Ветку снимает D2, предикат git grep → 0. Перепись served в assert-shard-coverage
      notify не вычёркивает. Если такая форма противоречит решению Д82 («в этой волне»), это вопрос
      диспетчеру, а не заведение notify.enabled. (в) Инъекции живых гейтов, утверждающие «зелёный с
      числом» по notify, переносятся на сведённую голову D1 и D2 либо на стенд после D2. На дереве Д78
      утверждается только статический гейт покрытия шардов. Инъекция: запись notify снята из манифеста →
      красный «НИ ОДИН шард». Близнец — запись есть → зелёный с числом доменов
    held_by: >-
      Статическая часть — assert-shard-coverage.py на дереве Д78 и инъекция (в). Живая часть до D2 —
      нужна ветка «не выполнилось» по предпосылке таблицы с инъекцией CX1-122 (таблица непуста, подов
      0 → красный). Однофайлового признака нет

