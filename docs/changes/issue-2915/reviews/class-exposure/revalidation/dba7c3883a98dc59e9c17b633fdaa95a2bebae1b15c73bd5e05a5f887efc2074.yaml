mapping_check:
  - id: CX1-70
    design: "З24 абзац «предел ожидания и исход по нему» (строки 1225–1245), проба N7 (1313–1319), §1 М33, §8, §11 строка CX1-70, §13 Е6; tasks.md N7"
    verdict: holds
    note: >-
      (а) строка §11 есть, полоса N7 названа. (б) довод «длится миллисекунды … на порядки … только при
      постороннем держателе» снят; ожидание = задержка самого долгого резерва в полёте = «одновременные
      транзакции строки `global_daily` / темп её коммитов» со ссылкой на М33 — исполнено; М33 назван
      замером записи 8d01a10e и честно помечен «этим замыслом не воспроизведён». (в) выбран вариант
      «исход прежний — отказ старта»: верхняя граница одновременных транзакций строки названа
      («реплики × `notify.workers`», у исполнителя одна транзакция; `notify.workers` ≤ 256 по §8),
      граница величины выведена с запасом 2 («реплики × workers» ≤ `FenceLockTimeout` × темп / 2,
      ≈1400 при темпе М33; арифметика сверена: 5 × 560 / 2 = 1400, 512 / 560 ≈ 0,9 с); темп коммита
      не утверждается, а печатается пробой — это соответствует условию, поскольку следствие выше
      границы названо («предел срабатывает от законного потока, и исход тот же»). Запись по пределу
      несёт время ожидания и причины не утверждает — исполнено. (г) время ожидания числом пишет и
      успешная запись ограды — исполнено. Держатель — проба N7 на полном резерве З24 с близнецом-
      контролем. Замечание к исполнимости (не пункт): `limits.FenceLockTimeout` — константа без ручки
      (§8), а близнец-контроль ставит пределу 1 мс; константу Go проба не переставит, поэтому функция
      записи ограды должна принимать предел параметром (прод-вызов передаёт константу — §8 при этом
      верен), а не превращать константу в пакетную переменную или ручку конфигурации — заказ N7
  - id: "УК93"
    design: "З10 (строки 688–692), З16 владелец места (899–904), близнецы (962–964), §11а строка УК93; tasks.md C10"
    verdict: holds
    note: >-
      текст З16 повторяет условие: владелец — ближайшее объемлющее `*ast.FuncDecl` и его объект из
      `types.Info.Defs`; литерал функции владельцем не бывает; место в инициализаторе пакетной
      переменной — находка с координатой; `init` различаются координатой. З10 называет `Sweep`
      литералом функции с местами за `RetentionSubjects`. Счёт мест окна согласован: три — окно `Put`
      (З7), оператор возврата и уборка прошедших окон (З10); близнец УК93 даёт 3, а не 4. Проба с
      близнецом и двумя инъекциями — строкой полосы C10
  - id: "УК94"
    design: "З10 (688–690), З16 допущенное употребление (920–925) и второй остаток (936–938), §11а строка УК94; tasks.md C10"
    verdict: holds
    note: >-
      выбран первый вариант условия — `Name` равно имени таблицы по договору corelib, из
      `tablename.Of`; исключение из запрета сохранения УК90 одно и узкое: значение поля `Name`
      составного литерала `retention.Subject`, поле по объекту `*types.Var`, только в
      `feed.RetentionSubjects`, употребления в ведомости с видами; прочее — находка; остаток
      «имя из `Name` как текст оператора» назван в З16 и держится ревью диффа. Проба с близнецом
      (2 употребления) и тремя инъекциями — строкой полосы C10

