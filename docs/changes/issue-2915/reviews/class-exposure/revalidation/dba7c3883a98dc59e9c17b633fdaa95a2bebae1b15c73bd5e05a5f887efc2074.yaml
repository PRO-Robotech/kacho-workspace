# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 8 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. Заход отображения по Д26: судятся ТОЛЬКО строки отображения и дельта
# редакции 8 против последней разобранной (редакция 7, 8d01a10e…, запись revalidation/8d01a10e….yaml).
# Предмет дельты — `git diff b3ba899f4 6464ba4aa -- docs/changes/issue-2915/design.md` (+95/−33) и та же
# дельта `tasks.md` (+5/−4, полосы N7 и C10) и `change.yaml` (+8/−5). Пункты CX1-01…69 и условия
# УК1…УК92 этой записью не пересуживаются.
# Итог: CX1-70 отображён строкой §11 и полосой N7, условия (а)–(г) пункта исполнены; УК93 и УК94
# отображены строками §11а и полосой C10, текст З10 и З16 совпадает с условием дословно по смыслу.
# Новых механизмов, решений, сторожей, внешних вызовов и асинхронных путей дельта не вводит.
# Неотображённых пунктов нет. Одно замечание к исполнимости близнеца-контроля пробы CX1-70 (предел —
# константа, а близнец ставит 1 мс) — не пункт и не условие замысла, заказом исполнителю N7.
# Возврата в приёмку дельта не даёт; NTF1-L03 записи 9bfa92be в силе (приёмка не менялась, 29cfa368…).
# Права писать реализацию эта запись не даёт: нужны ревью замысла трёх ролей (Е6).
