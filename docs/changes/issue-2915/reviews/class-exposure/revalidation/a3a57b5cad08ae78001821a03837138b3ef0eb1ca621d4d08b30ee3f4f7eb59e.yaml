# Экспозиция классов — пересверка (revalidation) замысла NTF-1, редакция 28 замысла.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Режим — дельта. Последняя разобранная редакция — 26
# (c441cc11…, запись revalidation/c441cc11….yaml, коммит 9417dcb4b, итог «к замыслу»: CX1-100;
# N24, N25 не блокируют). Редакция 27 (bec8c936…, коммит 9b1aded1e) отдельной пересверки не
# получала, поэтому дельта — два коммита 9b1aded1e и 45d535e1e: отображение CX1-100, N24, N25,
# решение диспетчера Д53, замеры М48–М50. Пункты CX1-01…99 и условия УК1…УК94 эта запись не
# пересуживает.
#
# Итог — к замыслу, два новых пункта. CX1-100 (а)–(г), N24, N25 и Д53 отображены и в сути
# выдерживают; предикат М49 воспроизведён (85 файлов, база не сдвинулась). Первый новый пункт —
# CX1-101. Расширение гейта заглушек на `helm.values` (CX1-100 (в), полоса D1s) меняет механизм,
# у которого есть потребители вне путей D1s. Во-первых, двойник процесса скана пробы RG1.1
# (`services/storage/tools/testdata/rg11/scan_process.py`): он различает фазы только по
# `helm.set`. Во-вторых, случай E собственной инъекции гейта («заглушек нет — судить нечего»):
# при непустом `helm.values` он перестаёт быть пустым входом. Оба краснеют на запросе волны в
# `2564`, а не на ветке полосы. Второй новый пункт — CX1-102. Решение Д53 перенесло работу в
# D1s, но в трёх местах пакета она по-прежнему названа за D1, и одно из них — строка
# исполнителя D1s в маршруте. Заметки N26, N27 идут к коду и к замыслу и не блокируют.
# Возврата в приёмку нет.
