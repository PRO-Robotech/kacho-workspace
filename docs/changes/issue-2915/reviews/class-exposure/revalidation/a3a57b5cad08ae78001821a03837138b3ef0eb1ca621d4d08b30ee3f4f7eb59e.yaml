mapping_check:
  - item: "CX1-100 (а)"
    verdict: holds_with_note
    evidence: >-
      Перепись переписей передана D1s. Предикат М49 на `origin/2564@6edea09c2ee` воспроизведён: 85
      файлов; с базы редакции он не сдвинулся, дельта базы пуста. Контроль назван: семь переписей М49 и
      одиннадцать (А) М50. Недостающая перепись — красный пробы, а не зелёный. Выборочно перечитаны два
      исхода М50 из восемнадцати. (13): `gated_deps` берёт только `condition: <имя>.enabled`, поэтому
      notify без `condition` в него не входит. (16): `leafScanRoots` — зонтик, `services`,
      `gateway/deploy`, корня `deploy/helm/notify` там нет. Оба исхода совпадают с М50. Гейт томов
      краснеет на записи D1 предсказуемо, и чинится это записью `notify` в `CHARTS`. Замечание к форме
      этой записи — N26. Ни `scripts/ci-local.sh`, ни хуки `scripts/hooks/*` не вызывают ни гейт томов,
      ни гейты скана (`git grep` по `scripts/` дал ноль вызовов). Поэтому предсказанное красное D1 не
      роняет полный локальный прогон полосы D1, а в CI проявляется только на запросе волны. Исход (16)
      поставлен условием на содержимое D1 — см. N27. В трёх местах перепись всё ещё названа за D1 —
      см. CX1-102
  - item: "CX1-100 (б)"
    verdict: holds
    evidence: >-
      Покрытие без записи в `EXEMPT`. Значения подаются `misconfiguration.helm.values` из двух файлов
      каталога NTF-1, `helm.set` узла почты не выбирается (Д48, Д52). Пути отсчитываются от корня (М48
      (2)). Ненайденный файл выбивает все чарты молча (М48 (3)), и замысел закрывает это громким
      красным гейта покрытия плюс инъекцией «путь испорчен». Шапка `trivy.yaml` переписывается тем же
      изменением. Гейт покрытия гонит сама D1s, потому что ветка полосы вне триггеров
      `security-scan.yml`. М48 синтетикой не перемерялся — атрибутирован замыслу
  - item: "CX1-100 (в)"
    verdict: holds_with_new_item
    evidence: >-
      Форма расширения выдерживает. Элементы `helm.values` снимаются по одному, «гасит» и «без
      предмета» судятся той же формулой, число файлов печатается отдельно. Инъекция по форме М48 (4)
      дополнена близнецом. У снятия каждого из двух файлов предмет есть: без
      `notify-standalone/values.yaml` у notify нет целей, без `mail-node/operator.yaml` отказывает
      рендер. Значит, «без предмета» на законных файлах не краснеет. Но потребители механизма гейта
      вне путей D1s не названы — это CX1-101
  - item: "CX1-100 (г)"
    verdict: holds
    evidence: >-
      Е12 (12) дополнена: форма подачи сканеру одна, её заводит D1s, D6 NTF-2 не заводит ни `helm.set`,
      ни третьего файла. Запись ревью NTF-2 (коммит 30d6baf7b) называет производителем расширения гейта
      D1s NTF-1 по Д53, стороны сходятся. В тексте Е12 (12) полоса по-прежнему названа D1
      («гейт заглушек D1», строка 3351), см. CX1-102
  - item: N24
    verdict: holds
    evidence: >-
      Граница формы ключа закреплена со стороны NTF-1 в З28, Е12 (12) и строках D1 и D9 маршрута. У
      обеих проб есть инъекция и близнец. Посылка стоит на посеве записи `f7f510df` — атрибутирована и
      названа невоспроизведённой
  - item: N25
    verdict: holds
    evidence: >-
      (1) Опора требует ровно один `ConfigMap`. На ноль и на «больше одного» — «НЕ ВЫПОЛНИЛОСЬ» с числом
      и путями, и сравнение не проводится. Инъекция — вторая копия шаблона. (2) Состав копии задан
      разбором `dependencies`, а не формой пути. Восьмая зависимость названа своей формой
      `file://../notify`. Недостающий каталог — «НЕ ВЫПОЛНИЛОСЬ» с именем зависимости
  - item: "Д53"
    verdict: holds_with_new_item
    evidence: >-
      Раздел сделан без потери: пути `trivy.yaml`, гейта заглушек, его инъекции и
      `check-volume-mounts.py` ушли из D1 в D1s (строка D1 маршрута их больше не несёт). База D1s —
      голова D1. Запроса волны с D1 без D1s нет. Сдача D1 печатает оба красных с пометкой «чинит D1s» и
      зелёными их не называет. Решение и его следствие разнесены по полосам честно, со связкой через
      волну. Остаток — три места со старым владельцем (CX1-102)

items:
  - id: CX1-101
    status: unmapped
    decision: >-
      CX1-100 (в), полоса D1s: гейт `deploy/scripts/assert-scan-stubs-hide-nothing.py` и его инъекция
      `deploy/scripts/assert-scan-stubs-hide-nothing-inject.sh` судят вторую форму подачи значений
      `helm.values`, а `trivy.yaml` её несёт
    class: >-
      measurement-discipline §«Радиус: по имени механизма и по точкам применения»: радиус правки гейта
      взят по его пути, а не по его потребителям. Второй класс — code-authoring §«Умолчание, которое
      становится утверждением»: «пустой вход» гейта определён по одной форме, а форм становится две.
      Третий — .claude/rules/testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией,
      снабдить проверкой предпосылки» п.7: двойник процесса судит одну форму входа
    finding: >-
      (1) Проба RG1.1 (`services/storage/tools/release_gates_rg11_scan_test.go`, тег `rg11trivy`, шаг
      `rg11-scan-preservation` в `.github/workflows/security-scan.yml`) гоняет НАСТОЯЩУЮ инъекцию
      `assert-scan-stubs-hide-nothing-inject.sh` в клоне дерева с рабочими байтами. Процессы гейтов в
      ней подменены двойником `services/storage/tools/testdata/rg11/scan_process.py`. Двойник
      относит конфиг к фазе только по `misconfiguration.helm.set`: `original`, `suppressed` (+
      `image.repository=…`), `no_subject` (`trivyStubsProbe=true`), `empty` (`[]`). На прочее он
      бросает «unexpected actual scan input». Кроме того, гейт покрытия он принимает только в фазе
      `suppressed`, иначе «coverage probe did not receive the suppressing injection». Новый случай
      инъекции по форме М48 (4) меняет `helm.values` и оставляет `helm.set` как есть. Двойник ответит
      фазой `original`, кодом 0 и «погашено 0», а случай ждёт красного. Если случай зовёт и гейт
      покрытия, двойник упадёт на `RuntimeError`. Ни двойника, ни теста RG1.1 в путях D1s нет. Шаг
      RG1.1 идёт на запросах в ветки из цифр, то есть на запросе волны в `2564`, а не на ветке полосы.
      (2) Случай E той же инъекции («Идеал не превращён в поломку: заглушек нет вовсе») ставит
      `helm.set = []` и ждёт код 0 и «судить нечего». Гейт печатает «судить нечего» при `not stubs`
      (:118). После расширения пустой `helm.set` при двух файлах `helm.values` — уже не пустой вход:
      замысел требует судить файлы. Одно из двух ломается. Либо случай E краснеет, потому что гейт
      судит файлы и «судить нечего» не печатает. Либо гейт сохраняет ранний выход по `not stubs` и
      молча не судит `helm.values`, если заглушек нет, — это ровно дыра, которую закрывает CX1-100 (в).
      Замысел случай E не называет. (3) Прочие потребители имени механизма исхода не меняют:
      `deploy/scripts/run-injection-proofs.sh:160–165` — строка «нужен trivy» в таблице пропусков;
      `security-scan.yml:393, :420, :488` — вызовы без аргументов
    condition_to_design: >-
      (а) В пути D1s входят `services/storage/tools/testdata/rg11/scan_process.py` и, если меняется
      ожидаемый набор событий, `services/storage/tools/release_gates_rg11_scan_test.go`. Двойник
      относит конфиг к фазе по обеим формам, `helm.set` и `helm.values`. Каждому новому случаю инъекции
      D1s соответствует своя фаза. Вход, не отнесённый ни к одной фазе, по-прежнему вызывает
      «unexpected actual scan input». D1s гонит `go test -tags=rg11trivy ./services/storage/tools -run
      '^(TestRG11_0[1-4]|TestRG11Snapshot|TestRG11ScanExecution)'` на своей ветке и печатает исход,
      либо печатает «НЕ ВЫПОЛНИЛОСЬ» с причиной. «Не выполнилось» за зелёное не идёт. (б) «Пустой
      вход» гейта заглушек определён по обеим формам: «судить нечего» — только когда пусты и
      `helm.set`, и `helm.values`. Случай E инъекции пустошит обе формы. Добавляется случай E′:
      `helm.set = []` при непустом `helm.values` → гейт судит файлы (печать «заглушек 0; файлов
      значений 2») и «судить нечего» не печатает. Близнец — случай E. Иначе ранний выход по одной форме
      молча выключает суждение о второй
    held_by: "покраснеет шаг `rg11-scan-preservation` на запросе волны в `2564` — громко, но поздно и вне путей полосы; случай E (б) — покраснеет сама инъекция гейта, если D1s её прогонит; ранний выход по одной форме ничего не красит — нужен случай E′"

  - id: CX1-102
    status: unmapped
    decision: >-
      Д53: перепись переписей чартов, `trivy.yaml` с шапкой и расширение гейта заглушек передаются из
      D1 в D1s. «Красное на чарте D1 чинится в D1s» (З28 (а))
    class: >-
      code-authoring §«Контракт, который нельзя выразить»: одно решение («какая полоса чинит») записано
      в пакете двумя способами, и один из них неверен. Опора — doc-truthfulness, «два места об одном
      предмете, где одно верно»
    finding: >-
      Действующая редакция в трёх местах всё ещё называет владельцем D1. (1) design.md §11, строка
      CX1-100 (строка 3149), колонка решения: «(а) Перепись переписей чартов по механизму — в D1»,
      «контроль — семь переписей М49» (а действует семь М49 плюс одиннадцать М50, строка «М49-остаток»
      ниже), «`trivy.yaml` и его шапка — в D1». Префикс той же ячейки «редакция 28 по Д53 — полоса D1s»
      это противоречие не снимает: ниже по тексту ячейка его опровергает. (2) design.md §13 Е12 (12)
      (строка 3351): «судит расширенный гейт заглушек D1». Е12 — заказ стороне NTF-2, и она будет искать
      производителя в D1. (3) tasks.md, строка D1s (строка 295), — строка самого исполнителя:
      «исход (красное чинится в D1 либо записано, почему молчит …)». З28 (а) говорит «чинится в D1s».
      Полоса D1s стартует от головы D1, поэтому «чинится в D1» для неё значит вернуть работу в уже
      сданную полосу. Это прямо противоречит З28 (д)
    condition_to_design: >-
      В строке CX1-100 §11, в Е12 (12) и в строке D1s маршрута полоса-исполнитель переписи, `trivy.yaml`
      и гейта заглушек — D1s. Контроль переписи — «семь М49 и одиннадцать (А) М50». В строке D1s —
      «красное чинится в D1s». Проверка: `grep -n -F -e 'гейт заглушек D1 ' -e 'шапка — в D1.' -e
      'механизму — в D1:' -e 'контроль — семь переписей М49;' design.md` и `grep -n -F 'чинится в D1
      либо' tasks.md` → 0 строк. Контроль предиката — на a3a57b5c и 80c9ff28 он даёт по одной строке на
      каждое из пяти мест
    held_by: "держится вниманием: полноту отображения судит семейство `cg.class`, текст одной ячейки против другой оно не сравнивает; предикат выше — разовая проверка автора, гейта не будет, потому что формулировки у каждой правки свои"

notes:
  - id: N26
    blocking: false
    where: "З28 «Новый отслеживаемый чарт …» (а), предсказанные исходы (таблица гейта томов); tasks.md строка D1s (запись `Chart(\"notify\", …, [\"-f\", \"deploy/testdata/…\"], …)`)"
    text: >-
      Гейт `.github/scripts/check-volume-mounts.py` сам по себе от текущего каталога не зависит. Чарт
      он рендерит по `str(REPO / chart.path)` (:313), где `REPO` — родитель скрипта (:61). В таблице
      `CHARTS` сегодня нет ни одного `-f`, только `--set`. Запись notify в той форме, в какой её дают
      замысел и маршрут (`"-f", "deploy/testdata/…"`), вводит в гейт первый путь, отсчитанный от
      текущего каталога. Через точку входа `check-volume-mounts.sh` это работает: она переходит в
      корень (:24). Прямой вызов `python3 …/check-volume-mounts.py` из другого каталога даёт отказ
      рендера notify с диагнозом «нет файла», а не «нет тома». Класс тот же, что М48 (2). К коду: пути
      `-f` в записи строятся от `REPO` (`str(REPO / "deploy/testdata/…")`), как путь самого чарта
    predicate: "в `CHARTS` у каждого аргумента после `-f` — абсолютный путь от `REPO`; проба: запуск гейта из `/tmp` даёт тот же исход, что из корня"
  - id: N27
    blocking: false
    where: "З28 (а), исход (16) М50; tasks.md строка D1s (путь `deploy/client_identity_leaf_test.go` «условно»)"
    text: >-
      Корень `deploy/helm/notify` попадает в `leafScanRoots` только при условии, что чарт notify
      объявляет клиентскую личность mTLS. Иначе печатается «объявлений 0». Напечатанный ноль — разовое
      утверждение о содержимом D1. Если позже в чарт notify добавят `_MTLS_CERTFILE`, гейт
      `client_identity_leaf` его молча не рассудит. Шапка гейта требует обратного: «корни выводятся из
      раскладки … новый чарт попадает под проверку сам» (:213–214). Корень без объявлений гейт не
      роняет: обход добавляет файлы и пропускает те, в которых объявлений нет (:502–540). Значит,
      добавить корень безусловно ничего не стоит. К замыслу, рекомендовано: корень `deploy/helm/notify`
      (или `deploy/helm` целиком, если это не удваивает обход зонтика) добавляется в D1s безусловно.
      Печать «объявлений N» остаётся как объём осмотренного
    predicate: "`git grep -n 'deploy/helm/notify\\|\"notify\"' -- deploy/client_identity_leaf_test.go` на голове D1s → одна строка в `leafScanRoots`"

