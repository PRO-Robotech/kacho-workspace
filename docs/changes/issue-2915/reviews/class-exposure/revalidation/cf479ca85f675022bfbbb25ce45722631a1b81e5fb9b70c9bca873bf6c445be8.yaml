notes:
  - id: N46-1
    blocking: false
    where: "шапка, п. (2) (design.md:22-23); строка CX1-141 таблицы «Условия…» (:5589) против P12 (д) (:5507)"
    text: >-
      В шапке написано: «шаблон зонтика stand-dns.yaml отказывает в рендере». По телу («Приёмник поднят»)
      проверки в stand-dns.yaml нет, отказывает блок (6) identity-mail-lane-guard.yaml. Это два места об
      одном предмете, и верно одно из них. Исполнитель D10, прочитав шапку, заведёт вторую проверку — тот
      самый исход, который тело запрещает. Предикат места тоже записан двумя формами: в таблице
      `git grep -n 'mailpit' -- …/stand-dns.yaml` → 0, в P12 (д) — `'mailpit).enabled\|mailpit.enabled'` →
      0. Широкая форма краснеет на поясняющем комментарии в stand-dns.yaml («почему здесь нет проверки
      приёмника»), и этот красный не дефект. Нужно: шапку (2) переписать на «блок (6) стража почтовой полосы,
      текст называет оба ключа»; в таблице оставить узкую форму. Отдельно: Д106 (а) диспетчера дословно
      называет stand-dns.yaml, автор исполнил его иначе и оставил ветку «если диспетчер настаивает».
      Принять исполнение должен диспетчер, это строка «вопросы владельцу»; класс исполнение закрывает
    predicate: "grep -n 'stand-dns.yaml' design.md: в шапке нет утверждения об отказе stand-dns.yaml; одна форма предиката места"
  - id: N46-2
    blocking: false
    where: "таблица «Условия…», строка CX1-140, столбец «предикат» (design.md:5588)"
    text: >-
      Предикат `git grep -n -E 'Remove(All)?\(' -- services/notify/internal/dkimkey ':!*_test.go'` → 0 судит и
      подпакет dkimkey/dkimtest. Замысел велит держать RemoveGeneration (os.RemoveAll) именно там. dkimtest —
      импортируемый помощник: его зовут boot.env/fixtureEnv в cmd/notify и integration-пробы других пакетов.
      Поэтому его файлы не могут быть `_test.go`: пакет из одних `_test.go` не импортируется. На коде, написанном
      точно по замыслу, предикат даёт ≥ 1 — ложный красный. Нужна граница
      `':!services/notify/internal/dkimkey/dkimtest'`, и тогда предикат умеет и упасть (Remove в ReadPair), и
      промолчать (Remove только в помощнике)
    predicate: "предикат CX1-140 исключает dkimtest; контроль — Remove в dkimtest не находится, Remove в dkimkey/*.go находится"
  - id: N46-3
    blocking: false
    where: "§12а «Держатель P12» (д), второй фикстурный слой receiver-off.yaml (design.md:5502-5507)"
    text: >-
      Слой, как он описан (поверх одной цепочки prod: standDNS, connectionURI на `<релиз>-mailpit`,
      mailpit.enabled: false), откажет раньше блока (6). Цепочка prod не задаёт
      global.kacho.identity.smtp.fromAddress, и первым срабатывает отказ (1) :82 «адрес отправителя НЕ задан»
      (измерено ниже). Утверждение текста держит пробу от ложного зелёного, но инъекция «блок (6) снят» станет
      красной по чужой причине, а положительный случай упадёт вместе с ней. Слой обязан пройти блоки (1)–(4б)
      стража: нести fromAddress и fromName либо лечь поверх слоя образца узла D9, как первый слой (д)
    predicate: "рендер prod + receiver-off.yaml падает на identity-mail-lane-guard.yaml:225, а не на :82"
  - id: N46-4
    blocking: false
    where: "tasks.md §4 «Голова запроса волны…» («база … не защищена, вердикт — ручной прогон ci.yaml»); design.md «Перемер редакции 46», строка «база волны не защищена — вердикт даёт ручной прогон»"
    text: >-
      Сам шаг каскада прочитан верно: у #2915 дочерних 0, метки epic нет, значит «не уровень каскада», и путь
      идёт к проверкам. Правка скрипта не нужна, это подтверждено. Неверно названо, что судит дальше. Путь
      ручного прогона в merge-readiness.sh @ad4e28c88 включается только для kacho-workspace
      (`manual_workflow="ci.yaml"` внутри `if REPO == kacho-workspace`). Для kacho при незащищённой базе-линии
      скрипт берёт обязательные контексты защиты ствола main (их 42) и сверяет их со statusCheckRollup запроса.
      Контексты на запросе в 2914-notify поднимает событие pull_request: фильтр ci.yaml — main, '[0-9]+',
      '[0-9]+-*'. Ручной прогон контекстов не заменяет и вердиктом не служит. Нужно: в tasks.md §4 и в строке
      перемера назвать источник «42 обязательных контекста ствола на statusCheckRollup запроса волны»
    predicate: "scripts/merge-readiness.sh PRO-Robotech/kacho <запрос> печатает набор «ствола 'main' — у ветки линии '2914-notify' собственного нет», а не «источник вердикта: ручной прогон»"
  - id: N46-5
    blocking: false
    where: "§12а «Значения prorobotech — обязательные, без умолчания» (design.md:5454-5464)"
    text: >-
      Механизм исхода «null снимает наследованное» подтверждён: null в позднем слое -f даёт отказ стража по
      пустому ключу (измерено на соседнем ключе). Но null — не выход для посадки, а остановка. Перепись: 9
      go-тестов в deploy/ читают stacks.txt и рендерят профили через `helm template`; prorobotech стоит в
      stacks.txt:50. При null они упадут на prorobotech, а не только P12. Замысел говорит «D10 не снимается»,
      это согласно. Стоит назвать, что при null краснеет и чужой набор, чтобы красный этих 9 не разбирали как
      дефект их предмета
    predicate: "— (текстовое уточнение)"

