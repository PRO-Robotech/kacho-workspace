# рендер, и на слое вне дерева тоже») я перемерил рендером: подтверждена. Новых классов дельта не вносит.
# Неотображённых пунктов нет. Пять замечаний, ни одно по Д97 не блокирует (не корректность и не
# безопасность продукта): N46-1 — шапка и предикат CX1-141 расходятся с телом; N46-2 — предикат CX1-140
# краснеет на коде, написанном по замыслу; N46-3 — фикстура P12 (д) отказывает по чужой причине; N46-4 —
# неверно назван источник вердикта merge-readiness для kacho; N46-5 — радиус исхода `null` у Д106 (б).
