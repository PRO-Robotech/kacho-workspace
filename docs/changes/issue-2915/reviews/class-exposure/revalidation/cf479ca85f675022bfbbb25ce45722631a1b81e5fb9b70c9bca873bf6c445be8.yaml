# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта против прошлой пересверки (редакция 45, 1b03566a…,
# «к замыслу»: CX1-140 новый, CX1-141 не отображён) и решение Д106 (а)–(д).
#
# Итог — чистая. CX1-140 отображён полностью: (а)–(в) исполнены текстом, у условия есть предикат и
# держатель. CX1-141 отображён исходом (а) Д106. Место отказа — существующий блок (6) стража зонтика
