      без объявленного атрибута. При этом Р7 одновременно делает пустое значение темы законным по
      форме (длина не ограничена снизу) и требует, чтобы сборщик заголовков отвергал нулевой
      form.HeaderText. Реализация с признаком нуля «пустое поле» даст успех SendX и
      INVALID(attrs_invalid) в notify — класс RA-09. Нужно одно из двух. (а) Каждый объявленный
      атрибут обязателен: нулевое значение любого типа — сторож feed.ErrAttrsInvalid с именем
