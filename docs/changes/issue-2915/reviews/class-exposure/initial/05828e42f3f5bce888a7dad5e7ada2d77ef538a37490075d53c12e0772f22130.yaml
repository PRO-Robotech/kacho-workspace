  # --- классы, открытые редакциями 11–13 ---

  - id: CX1-38
    decision: D7, D11
    class: "code-authoring §«Умолчание, которое становится утверждением» (1.3 нулевое значение; коллизия нуля с законным значением); §«Контракт, который нельзя выразить» (проверка стоит на стороне потребителя, производитель получает успех)"
    exposure: >-
      (1) Р7 задаёт форму атрибута, входящего в тему, одним условием: «без CR, LF и иных
      управляющих символов». Нижней границы длины нет, так что пустая строка — законное значение
      формы. Та же редакция делает form.HeaderText структурой, у которой нулевое значение
      (`form.HeaderText{}`) даёт ErrUnset, и требует, чтобы сборщик заголовков нуль отвергал
      (B28 (нуль)). Если признак нуля в коде — пустое поле, законное значение «» и нуль
      неразличимы: источник кладёт строку (Put форму пропустил), а notify отвечает
      INVALID(attrs_invalid). Это та самая молчаливая потеря при успешном ответе, которую закрыла
      RA-09. (2) Шире: атрибуты типов text, secret и timestamp форма не проверяет вовсе. Поля XAttrs
      «с типами из notification.yaml» (D01) можно не указать в составном литерале, и компилятор это
      пропустит. Что при этом видно снаружи, приёмка не говорит: ответ SendX; что уходит в письмо
      (пустой секрет в письме `security`, нулевая дата); что делает notify со строкой, в которой нет
      объявленного атрибута (строка записана мимо SendX). Ни в B28, ни в B28 (`Put`), ни в G24 нет
      случая «объявленный атрибут пуст или отсутствует» (grep — measurements)
    condition: >-
      (а) нуль и законное пустое значение различимы: у типа признак присутствия отдельно от строки
      (`struct{ v string; set bool }` либо эквивалент), и ParseHeaderText("") даёт значение, у
      которого Value() = ("", nil); либо, по решению приёмки (RA-11), пустое значение темы
      запрещено формой на обеих сторонах; (б) сгенерированный SendX и feed.Put разбирают каждый
      объявленный атрибут одним исчерпывающим switch по закрытому типу (text, secret, path, token,
      timestamp) без ветки default, и исход для нулевого значения каждого типа — тот, что задаст
      RA-11; (в) notify на строке, где нет объявленного атрибута, не рендерит пустое место — исход
      тоже по RA-11
    held_by: "—: сценария нет, возврат RA-11"

  - id: CX1-39
    decision: D7, D8, D11
    class: "rule architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; rule 00-kacho-core ban20-copy-ban"
    exposure: >-
      §6.1 редакции 13 запускает три гейта дерева — B27 (гейт), B28 (гейт), B28 (гейт `Put`) — из
      CI corelib и kacho. По дереву kaname те же гейты запускает CI kaname, из файлов
      `internal/check/addressnormalizesingular_test.go` и `internal/check/notifytypesafety_test.go`.
      Реализация одна или их две, приёмка не говорит. В kaname `internal/check/` уже лежат
      собственные реализации гейтов рядом с вызовами corelib `treehygiene` (measurements). Перечни
      семи видов и расширений вида (7), правило пропуска стабов и допустимые места — всё это
      данные, и копия в kaname разойдётся с corelib при первой правке. Особенно при исключении,
      которое по Р7 вносится «в сам гейт»
    condition: >-
      (а) все три гейта — функции одного пакета corelib (по образцу `treehygiene.AuditDeferredWork`
      и `ScanNonASCIIIdents`), тест kaname и тест kacho — тонкие вызывающие с корнем дерева;
