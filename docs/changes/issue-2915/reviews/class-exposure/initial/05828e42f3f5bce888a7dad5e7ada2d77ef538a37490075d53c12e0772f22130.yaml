  - id: CX1-33
    decision: D1, D17
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения); rule architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
    status: >-
      экспозиция подтверждена соседней приёмкой. Строка Х5 NTF-4 (6bb389f81621…, круг 16 —
      возврат) заводит форму хоста как ОТДЕЛЬНОЕ поле дескриптора: нулевое значение означает пару,
      форма с причиной. Строки 1249 и 2283 NTF-4 оставляют NoServedServices NTF-1 отдельным элементом,
      который после Х5 «ложен». Двух полей о числе и виде gRPC-слушателей больше не избежать
      решением одной NTF-1, поэтому условие (а) записи d524e7bd… («нулевое значение оси —
      отказ») заменено ниже на условие, совместимое с Х5
    condition: >-
      (а) NoServedServices — не независимое логическое поле. Это значение, производное от
      единственного источника, либо значение того же поля формы, которое вводит Х5. Если в
      corelib#77 поле формы ещё не существует, NTF-1 заводит его сама — с нулём «пара» (как в Х5) и
      значением «gRPC-слушателей нет»; Х5 добавляет третье значение, второго поля не заводит;
      (б) если полей всё же окажется два, конструктор дескриптора отвергает с именами обоих полей
      сочетания «NoServedServices + непустая форма Х5», «NoServedServices + любой адрес или транспорт
      слушателя», «NoServedServices + OwnContour»; (в) самоотчёт и assert-production-posture.sh
      оценивают вывод из этого источника, а не каждое поле по отдельности; (г) разбор формы — switch
      без ветки default
    held_by: "NTF1-G15 (исправная посадка); отказы на сочетания — заказ автору проб corelib#77; сведение с Х5 — заказ автору NTF-4"
  - {id: CX1-34, decision: "D2, D17", status: "без изменений; NTF-4 Х5 (одна функция сборки сервера одного слушателя, пара зовёт её дважды) условие (б) выполняет на уровне приёмки, но сравнения состава цепочки формы Х5 с внутренней половиной пары в ней нет — заказ остаётся", condition_ref: "d524e7bd… CX1-34"}
