# Экспозиция классов — первичный разбор (initial), под-фаза NTF-1, редакция 13.
#
# Разбор делается ДО кода и привязан к отпечатку одобренной приёмки. Записи о прежних редакциях
# (b347b81f…, 530e2296…, d524e7bd…) остаются свидетельствами о своих редакциях и не правятся.
# Пункты CX1-01…CX1-37 перенесены с состоянием на редакции 13. Если пункт не менялся, условие на
# код не переписано, а дано ссылкой `condition_ref` на запись d524e7bd…: она append-only, и её
# текст не уедет. CX1-38…CX1-43 — классы, открытые решениями редакций 11–13: непрозрачные типы
# формы и адреса, метод Value() с ErrUnset, узел «обход типобезопасности» из семи видов по трём
# деревьям, гейт ссылки на feed.Put со входом `notifygen -check -list`, запрет видов (1)–(7)
# целиком и путь исключения из него. Д17 разобран в d524e7bd… (CX1-33, CX1-34); здесь его
# следствия сверены с соседней приёмкой NTF-4 (Х5). Пункты, уже отображённые в приёмке
# (RA-01…RA-10), повторно не возвращаются. Когда появится design.md, каждому пункту нужно точное
# отображение в решение замысла и пересверка на отпечаток замысла. Права писать реализацию эта
# запись не даёт.
