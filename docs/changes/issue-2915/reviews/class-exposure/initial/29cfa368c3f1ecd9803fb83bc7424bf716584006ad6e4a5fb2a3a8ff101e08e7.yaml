  # --- классы, открытые редакциями 17–18 ---

  - id: CX1-50
    decision: "D22, D18"
    class: "code-authoring §«Умолчание, которое становится утверждением» (нуль поля — «не задан»); §«Контракт, который нельзя выразить» (два написания отсутствия, два места, решающих «нуль ли это»); §«Порядок операций внутри кода»"
    exposure: >-
      Д21 делает нулевое значение поля `optional` в сгенерированном `XAttrs` утверждением «не
      задан», а тот же нуль, переданный в `feed.Put` напрямую, — сторожем. Значит, решение «нуль
      ли это» принимается в двух местах: в сгенерированном `SendX` (опустить ключ до `Put`) и в
      `notify/form` (отвергнуть нуль в `Put` и в notify). Если генератор выписывает проверку нуля
      литералом по типу (`v != ""`, `!t.IsZero()`), признак разойдётся с `notify/form` на первом
      же типе, у которого нуль — не пустая строка. Для `timestamp` это уже измерено (390b5a33…
      CX1-44): `time.Time{}` + 0,5 с проходит `IsZero` до усечения и после усечения записывается
      как `0001-01-01T00:00:00Z`. Порядок «решить, задан ли, → нормализовать → записать» даёт
      строку с ключом `optional` в нулевом написании: у источника успех, в notify —
      `INVALID(attrs_invalid)` (G26 (б)). Это класс RA-09: успех у источника, терминальный отказ в
      notify. B30 проверяет только `text` и `path`
    condition: >-
      (а) «задан ли `optional`» и «нуль ли `required`» решает одна функция `notify/form` по типу
      (исчерпывающий switch без default, как CX1-38), и сгенерированный `SendX` зовёт её, а не
      несёт литерал сравнения по типу; (б) решение принимается по нормализованному значению —
      нормализовать (UTC, усечение) → решить «задан ли» → записать; ключ `optional` в строку в
      нулевом написании своего типа не пишется ни при каком входе `SendX`; (в) «не задан» у
      источника выражается отсутствием ключа в одном месте — перед `Put`; сам `Put` опусканием
      не занимается и нуль `optional` отвергает (B30 (`Put`))
    held_by: "NTF1-B30 (а)–(в), (`Put`) для `text` и `path`; `timestamp`, `token`, `secret` в роли `optional` не держит ничто — заказ автору проб corelib#77: B30 по перечню типов из `notify/spec` (как B29 перечень типов), случай `timestamp` = `time.Time{}` + 0,5 с → строка без ключа либо сторож, но не ключ `0001-01-01T00:00:00Z`; близнец — `2026-09-30T00:00:00.9Z` → ключ `…T00:00:00Z`"

  - id: CX1-51
    decision: D22
    class: "code-authoring §«Контракт, который нельзя выразить» (правило `when` судится по местам ссылки, которые перечисляет валидатор); rule architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» (валидатор и рендер)"
    exposure: >-
      правило A11 (б) «атрибут `optional` — только в блоке с `when`» исполнимо, только если
      валидатор видит КАЖДОЕ место ссылки на атрибут в блоке. У восьми видов блоков места ссылок
      разные: `{{ }}` в тексте `heading`, `p`, `warning`, `code`; поле `path:` и `token:` у
      `button`; элементы `list`; пары `kv`. A11 (б) проверяет один вид — `p`. Если валидатор
      собирает ссылки своим обходом, а рендер подставляет значения своим, `optional`, на который
      ссылается элемент `kv` или поле `path:` кнопки без `when`, пройдёт валидатор и в письме без
      атрибута даст пустое место или ссылку на origin без пути. Второе место той же пары — рендер
      решает «блок попадает в письмо» по наличию ключа в сыром отображении строки, а не по
      результату проверки формы
    condition: >-
      (а) места ссылок каждого вида блока перечисляет одна функция `notify/spec` (исчерпывающий
      switch по закрытому набору блоков без default); её зовут и валидатор (A11), и рендер notify;
      (б) рендер решает судьбу блока с `when` по набору атрибутов, прошедшему `notify/form`
      (после G26 (б), (в)), а не по ключам сырой строки
    held_by: "A11 (б) — только блок `p`; G26 (а) и близнец — `p` и `button`. Заказ автору проб corelib#77: A11 (б) по каждому из восьми видов блока, где `optional` без `when` стоит в месте ссылки этого вида, — находка; перечень видов берётся из `notify/spec`, вид без строки таблицы пробы — проба красная"

  - id: CX1-52
    decision: "D23, D10, D11"
    class: "code-authoring §«Решение и его следствие разнесены» (одно значение с двумя источниками); §«Порядок операций внутри кода» (ревизия раньше класса)"
    exposure: >-
      после RA-12 у класса строки два носителя: колонка `class` (пишет `SendX`, читает отбор
      `Claim(classes)`) и описание шаблона в сборке notify (решает сетку, `class_not_allowed`,
      рендер). Приёмка задаёт, что колонка читается только отбором и сравнением `class_mismatch`.
      В коде notify колонка приезжает в той же записи строки, что и прочие поля. Любое чтение
      `row.Class` в сетке или в `class_not_allowed` молча возвращает RA-12: при равной ревизии
      это невидимо (там `class_mismatch`), но для строки чужой ревизии оно даёт
      `DROPPED(recipient_net)` или `INVALID(class_not_allowed)` там, где приёмка требует
      `DEFER(template_skew)` без суждения о классе (G26 (д))
    condition: >-
      (а) описание строки в notify строится одной функцией: сначала выбор шаблона сборки по
      ревизии (иначе — `template_skew`, дальше ничего не судится), затем сравнение колонки
      `class` с классом сборки (`class_mismatch`); результат — тип, в котором колонки `class` нет,
      и сетка, `class_not_allowed` и рендер получают только его; (б) место `class_mismatch` в
      объявленном порядке клеток (CX1-47 (а)) — сразу после решения о ревизии, до `ResolveSend` и
      до резерва сетки
    held_by: "NTF1-G26 (г), (д) и близнецы; «колонку `class` читают только отбор и сравнение» — вниманием; заказ автору проб notify: строка чужой ревизии с колонкой `security` у шаблона `notice` сборки при исчерпанной сетке `security` → `DEFER(template_skew)`, резервов сетки 0"

  - id: CX1-53
    decision: "D24, D10"
    class: "code-authoring §«Решение и его следствие разнесены» (причина истечения и возврат вклада); §«Умолчание, которое становится утверждением» (признак «выдавалась ли» выведен из изменяемого состояния аренды); rule data-integrity db-cas"
    exposure: >-
      причины `unclaimed` и `no_ack` различаются фактом «строку выдавал хотя бы один `Claim`», и
      от него зависит возврат вклада в окно. Это деньги лимита: ошибочный `unclaimed` у выданной
      строки возвращает вклад письма, которое могло уйти (окно Р14), и пропускает лишнее письмо
      сверх лимита на адресата. Если признак выводится из колонок аренды (`lease_until IS NULL`),
      а аренда по истечении или на `DEFER` сбрасывается, выданная и брошенная строка читается как
      невыданная. Второй путь того же класса — причина и возврат вклада, вычисленные уборщиком
      разными операторами, так что между ними строку меняет `Ack` или второй уборщик
    condition: >-
      (а) признак «выдавалась» — монотонный факт строки, который ставит тот же условный `UPDATE`
      `Claim`, что берёт аренду, и который никакой переход не снимает (отметка первой выдачи или
      счётчик выдач); не вывод из колонок аренды; (б) уборщик одним условным `UPDATE … RETURNING`
      переводит строку в `EXPIRED` с причиной, вычисленной в том же операторе (последний `DEFER`,
      иначе по признаку (а)), и в той же транзакции возвращает вклад, только если причина —
      `platform_unavailable` или `unclaimed`; (в) множество причин возврата объявлено одним
      перечнем рядом со словарём причин, а не условием в ветке уборщика
    held_by: "NTF1-B31 (а), (б), B15, B16; сценарий «выдана, аренда истекла, затем строка ни разу не выдана до срока (потолок)» → `no_ack`, вклад не возвращён — нет, заказ автору проб corelib#77"

  - id: CX1-54
    decision: "D24"
    class: "rule security-hardening hard-zero-refusals-visible; rule architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» (словарь причин в corelib, правило тревоги в чарте kacho); gate-authoring §«Отрицание только в паре с положительным»"
    exposure: >-
      тревога `feed_expired` — правило в чарте notify над счётчиком, который порождает corelib у
      каждого источника (kaname и модули) с метками класса и причины. Исключение одно — пара
      (`notice`, `recipient_net`). Если правило написано перечнем причин, для которых тревога
      есть, новая причина (NTF-5 заводит класс `obligation`, у словаря будут новые значения)
      истекает без тревоги — ноль сработок, неотличимый от нормы. Если значения меток — свободная
      строка (текст ошибки), правило и проба G27 перестают сходиться с кодом. G27 подаёт
      синтетические ряды литералами пробы
    condition: >-
      (а) правило выражено исключением ровно одной пары (класс и причина), а не перечнем причин с
      тревогой; (б) значения меток `reason` и `class` — закрытые перечни corelib `notify/feed`
      (словарь Р11), счётчик не принимает значение вне перечня; (в) проба G27 берёт перечни
      причин и классов из corelib, а не литералами, и для каждой пары, кроме исключённой,
      утверждает тревогу
    held_by: "NTF1-G27 (а)–(д) и близнец — литералами; сверка с перечнем corelib — заказ автору проб notify (чарт) и corelib#77 (экспорт перечня)"

  - id: CX1-55
    decision: "D24, D9, D8"
    class: "rule architecture §«Concurrency / lifecycle / читаемость» (жизненный цикл уборщика); rule data-integrity concurrent-integration-test (однократный возврат)"
    exposure: >-
      Р9 при выключенном флаге снимает регистрацию сервера ленты, объявление вида и опрос; Р8
      требует, чтобы уборщик работал при любом флаге. Если уборщик заводится вместе с сервером
      ленты (естественное место — тот же конструктор), B31 (в) краснеет, а в продукте строки,
      поставленные до выключения, остаются `pending` навсегда — путь (1) «конечного исхода»
      открыт. Второе: у источника ≥ 2 реплики (Р18), уборщик идёт в каждой. B31 судит один
      процесс; два уборщика над одной строкой и один счётчик окна приёмка не проверяет
    condition: >-
      (а) уборщик запускается в композиционном корне источника рядом со схемой ленты, которая от
      флага не зависит, а не в ветке регистрации сервера ленты; вопрос о флаге (CX1-21) уборщика
      не касается; (б) возврат вклада — следствие условного `UPDATE` уборщика с проверкой числа
      строк (CX1-53 (б)): при двух уборщиках вклад возвращается ровно один раз
    held_by: "NTF1-B31 (в) — (а); (б) — заказ автору проб corelib#77: два уборщика параллельно над одной истёкшей строкой `unclaimed` → счётчик окна уменьшен на 1, строк `EXPIRED` 1"

  - id: CX1-56
    decision: "D25"
    class: "gate-authoring §«Инъекция настоящим входом из дерева с законным близнецом» (узел перечислен синтаксическими видами, а не судимым свойством); rule testing-verdict п.14 (собственный разборщик — распознаватель)"
    exposure: >-
      редакция 18 сузила узел: вызов `NormalizeDomain` с ошибкой под именем — производитель, узел
      — виды (1)–(3). Значение-функция `NormalizeDomain` в перечень не вошла, хотя соседний узел
      того же гейта (IDNA, B27 (гейт)) значение-функцию судит явно. Опыт `go/types`
      (measurements): `f := address.NormalizeDomain; d, _ := f(s)` вне пакета даёт ссылок на тип
      `Domain` 0, прямых вызовов `NormalizeDomain` 0 — ни один из видов (1)–(3) не срабатывает, а
      `d` — нулевой `address.Domain` с отброшенной ошибкой, ровно то, что вид (3) запрещает.
      Утверждение Р8 «перечень приёмников закрыт и пуст» узлом тогда не держится
    condition: >-
      узел судит по проверке типов: (а) всякое использование объекта `address.NormalizeDomain` вне
      пакета, кроме позиции вызываемого в прямом вызове, — узел (значение-функция, аргумент,
      поле); (б) либо, равносильно, узел — каждое выражение типа `address.Domain` вне пакета,
      происхождение которого не прямой вызов `NormalizeDomain` с ошибкой под именем; замысел
      выбирает одну форму и пишет её в шапке гейта. Близнецы редакции 18 при обеих формах молчат
    held_by: "B27 (гейт, приёмник) держит виды (1)–(3); значение-функцию — заказ автору проб corelib#77: инъекция (4) `f := address.NormalizeDomain; d, _ := f(s)` в `services/notify/…` → находка с видом; близнец — прямой вызов с ошибкой под именем → узлов 0"

  - id: CX1-57
    decision: "D24, D14"
    class: "rule architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» (одна величина исполняется двумя процессами на разных пинах); code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      `feed.LeaseTTL` — константа corelib без ручки. Аренду ведёт источник на своём пине corelib
      (kaname, каждый модуль kacho), а укладываться в неё обязана обработка в notify (CX1-27:
      срок `ResolveSend` + SMTP-сессия + запас на `Ack` меньше остатка аренды) — другой процесс
      на своём пине. Приёмка не говорит, несёт ли ответ `Claim` срок аренды (строка 1495 называет
      только открытый текст секрета). Если notify берёт срок из своей копии константы, смена
      константы в новой версии corelib при раскатке «источник, затем notify» даёт notify, который
      считает аренду длиннее настоящей: запоздалый `Ack` — `LEASE_LOST`, а письмо ушло — дубль
      вне окна Р14, которое приёмка называет единственным
    condition: >-
      (а) ответ `Claim` несёт конец аренды каждой строки (абсолютный момент по часам источника или
      остаток), и notify ограничивает срок обработки строки этим значением, а не `feed.LeaseTTL`
      своей сборки; (б) страж старта notify по CX1-27 сверяет свои сроки с нижней границей аренды,
      а не с константой как с истиной
    held_by: "держится вниманием до замысла; заказ автору проб notify: фикстурный сервер ленты отдаёт аренду короче `feed.LeaseTTL` сборки notify → notify не доводит строку до MAIL FROM либо прерывает до конца аренды, SMTP-сессий по строке не больше одной"

