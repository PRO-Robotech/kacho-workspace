# Экспозиция классов — первичный разбор (initial), под-фаза NTF-1, редакция 18.
#
# Разбор делается ДО кода и привязан к отпечатку одобренной приёмки. По решению диспетчера Д22
# судится ТОЛЬКО дельта новой редакции против последней разобранной — 390b5a33… (редакция 16,
# 9636eb28f); дельта — `git diff 9636eb28f dbe97c78c` по файлу приёмки (редакции 17 и 18 вместе).
# Записи о прежних редакциях (b347b81f…, 530e2296…, d524e7bd…, 05828e42…, 390b5a33…) остаются
# свидетельствами о своих редакциях и не правятся. Пункты CX1-01…CX1-49 перенесены: неизменённый
# пункт дан ссылкой `condition_ref` на append-only запись, где записано его условие; пункт, который
# дельта задела, несёт новое состояние. CX1-50…CX1-57 — классы, открытые решениями редакций 17–18:
# обязательность атрибута (Д21), класс в наборе ревизии и `class_mismatch`, конечный исход строки
# (`unclaimed`, `no_ack`, константы аренды и уборщика, `feed_expired`), узел «приёмник
# `address.Domain`» (Д19). По Д22 условия к коду идут в замысел, а не в приёмку. Когда появится
# design.md, каждому пункту нужно точное отображение в решение замысла и пересверка на отпечаток
# замысла. Права писать реализацию эта запись не даёт.
