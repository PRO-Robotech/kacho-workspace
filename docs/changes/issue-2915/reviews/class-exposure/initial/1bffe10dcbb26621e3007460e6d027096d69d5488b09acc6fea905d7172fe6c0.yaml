  - {id: "CX1-25…CX1-57", status: "без изменений на редакции 19", condition_ref: "29cfa368… (CX1-27, CX1-43, CX1-45, CX1-46, CX1-50…CX1-57 — там же; прочие — d524e7bd…, 05828e42…, 390b5a33…)"}

  # --- новые пункты: классы, открытые редакцией 19 ---
  - id: CX1-111
    decision: "D29, D31"
    class: >-
      code-authoring §«Контракт, который нельзя выразить» — у одного значения два написания, и
      отказ ловит только одно из них. rule polyrepo warning «Ключ домена и имя каталога — РАЗНЫЕ
      словари»: имя модуля в ключе `modules.<модуль>`, ключ его подчарта, имя источника, переменная
      процесса и пространство — пять словарей. rule api-conventions api-accepted-ignored: значение
      принято и никем не прочитано
    exposure: >-
      Р9 и N02 называют форму «ключ флага модуля под ключом его подчарта» образцом
      `<модуль>.notifications.enabled` (N02: `notifyProbe.notifications.enabled`). У kaname ключ флага
      другой — `config.notifications.enabled`, и на ветке эпика e415e59a2 он уже живёт в трёх местах:
      умолчание `true` в `charts/kaname/values.yaml` (e0e0204114f, решение Д64), `kaname.config.notifications`
      в `values.dev.yaml` и в `values.prod.yaml`. Читатель — `charts/kaname/templates/configmap.yaml`
      (`.Values.config.notifications`, ConfigMap kaname), а не `global`. Замер helm v4.2.4: шаблон
      зонтика видит умолчания подчарта в `.Values.<подчарт>` (`kid.config.notifications.enabled=true`
      при пустых значениях зонтика). Отсюда две ловушки. (1) Отказ по образцу
      `<модуль>.notifications.enabled` ключа kaname не видит. Тогда kaname берёт флаг из своего
      ключа, а notify строит перечень из `global`, и они расходятся без ошибки рендера, хотя Р9
      именно это и запрещает. (2) Если расширить отказ до `kaname.config.notifications.enabled`, он
      сработает на каждом рендере из-за умолчания подчарта. Третий случай: опечатка в имени модуля
      (`modules.notifyprobe`, `modules.notify-probe`) принимается и не читается никем — флаг модуля
      не выключен, а оператор считает, что выключил
    condition_on_code: >-
      (а) Закрытая таблица подключаемых источников (`_sources.tpl`, NTF1-N03) несёт на каждый модуль
      ключ `modules.<ключ>` И путь собственного ключа флага модуля в его подчарте (kaname —
      `config.notifications.enabled`, notifyProbe — `notifications.enabled`). Отказ «ключ вне
      `global`» строится по этой таблице, а не одним образцом. (б) В рендере зонтика значение
      `notifications.enabled` в ConfigMap kaname берётся только через `kacho.notifications.enabledFor`
      над `.Values.global`. Ключ `kaname.config.notifications.enabled` в любом слое зонтика —
      отказ рендера с именем ключа. Умолчание `true` в `charts/kaname/values.yaml` снимается (оно же —
      умолчание, которое Р9 и NTF-2 Р4 запрещают). Одиночный рендер kaname получает ключ из слоя
      значений пробы. Профили `values.dev.yaml` и `values.prod.yaml` теряют
      `kaname.config.notifications` тем же изменением. (в) Ключ под
      `global.kacho.notifications.modules`, которого нет в таблице, — отказ рендера с именем ключа
    held_by: >-
      Нужен гейт, его нет. N02 утверждает отказ только для формы notifyProbe. Заказ — инъекции к N02
      (полоса D2): (1) `kaname.config.notifications.enabled: false` при глобальном `true` → отказ с
      именем ключа; близнец — `global.kacho.notifications.modules.kaname.enabled: false` → перечень
      без kaname, ConfigMap kaname `false`. (2) `global.kacho.notifications.modules.notifyprobe.enabled:
      false` → отказ с именем ключа; близнец — `modules.notifyProbe` → перечень `{probe-b}`. (3)
      Согласие значений по цепочкам: в одном рендере `notifications.enabled` ConfigMap kaname равен
      «kaname в перечне notify» (NTF2-53 (а) с той же стороны)

  - id: CX1-112
    decision: "D29, D30"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением»; rule architecture
      §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ». Посылка Е16 «под
      `global` все подчарты видят одно значение» верна только для значений зонтика
    exposure: >-
      Замер helm v4.2.4: умолчание `global.kacho.notifications.enabled: true` в `values.yaml`
      подчарта видно лишь этому подчарту. Соседний подчарт и сам зонтик видят «нет ключа». Значение
      зонтика перекрывает умолчание подчарта во всех. Значит, `global.kacho.notifications.modules.kaname.enabled:
      false` в `charts/kaname/values.yaml` при молчащем зонтике выключит kaname, а перечень notify
      kaname сохранит, и рендер пройдёт. Тот же механизм у `global.kacho.spiffe.*`: поле, которое
      зонтик не задал, подчарт возьмёт из своего умолчания. Это не гипотеза. В дереве уже есть такое
      устройство: `charts/kaname/values.yaml` объявляет второй `global.kacho.identity` ради одиночного
      рендера подчарта. Согласие двух объявлений держит `deploy/identity_global_defaults_agree_test.go`,
      но его узел — константа `{"global","kacho","identity"}`, и узлов `global.kacho.notifications` и
      `global.kacho.spiffe` он не видит. Этот же класс делает добавочную форму инъекции J05 молчащей
      (N19-2 записи вердикта): рендер код 0, находит только сверка путей значений
    condition_on_code: >-
      (а) Ни один `values.yaml` подчарта (kaname, notifyProbe, `deploy/helm/notify/values.yaml`) не
      объявляет `global.kacho.notifications.*` и `global.kacho.spiffe.*`. Одиночные рендеры подчартов
      получают эти узлы из слоя значений своей пробы. Если второе объявление неизбежно, гейт
      согласия ведёт ПЕРЕЧЕНЬ узлов, а не один (identity, notifications, spiffe). `modules.*` в
      подчарте не объявляется ни при каком исходе. (б) Гейты N01, N02 и J05 читают пути значений
      всех файлов значений (зонтик, профили, `charts/*/values.yaml`, `deploy/helm/notify/values.yaml`),
      а не только рендер, и печатают число осмотренных файлов. Пустой обход — красный
    held_by: >-
      Частично: `identity_global_defaults_agree_test.go` держит класс для одного узла. Для новых
      узлов нужен гейт, его нет. Заказ — J05 (полоса J2) и N01/N02 (полоса D2). Инъекция (1):
      `global.kacho.notifications.modules.kaname.enabled: false` в `charts/kaname/values.yaml` при
      молчащем зонтике → красный с путём файла; близнец — тот же ключ в `values.yaml` зонтика →
      согласный рендер. Инъекция (2): `global.kacho.spiffe.notify.saName` другим значением в
      `charts/kaname/values.yaml` → красный с путём; близнец — без ключа

  - id: CX1-113
    decision: "D29, D30"
    class: >-
      code-authoring §«Инвариант и оснастка — это тоже прод-код»: одно имя с двумя телами, и победитель
      выбирается молча. code-authoring §«Решение и его следствие разнесены»: помощник живёт в одном
      чарте, а вызывают его в другом
    exposure: >-
      Замер helm v4.2.4. (1) Именованные шаблоны общие на весь релиз. Одноимённый `define` в двух
      подчартах ошибки не даёт, побеждает один из них. Победитель зависит от набора включённых
      подчартов: при выключенном `kid` побеждает `sib`. (2) Подчарт видит `define` зонтика. Значит,
      помощник `kacho.spiffe.uri` (`deploy/helm/umbrella/templates/_spiffe.tpl`) и помощник перечня из
      `deploy/helm/notify/templates/_sources.tpl` подчарт kaname в рендере зонтика вызвать может. (3)
      Без зонтика у подчарта `.Values.global` = nil. `dig` над ним падает с текстом «interface
      conversion: interface {} is nil», и имени ручки в этом тексте нет. Помощника зонтика или
      notify в таком рендере нет вовсе. Одиночный рендер `charts/kaname` в дереве нужен: так говорит
      шапка `identity_global_defaults_agree_test.go` (самопроверка гейта сетевых политик); сам вызов
      не перемерялся. Замысел назначает трём помощникам по одному телу, но место
      `kacho.notifications.enabledFor` не названо. Запрета второго тела и исхода одиночного рендера
      kaname в замысле нет
    condition_on_code: >-
      (а) Имена `kacho.notifications.enabledFor`, помощника перечня и `kacho.spiffe.uri` определены по
      одному разу во всём `deploy/helm/**`. `kaname.spiffeURI` — вызов `kacho.spiffe.uri`, а не
      переопределение. Место `kacho.notifications.enabledFor` названо в замысле, и это чарт,
      который входит в каждый рендер, где помощник вызывают. (б) Вход помощников безопасен для nil:
      если `global` или узла нет, отказ называет ручку (`global.kacho.notifications.enabled`,
      `global.kacho.spiffe.<служба>`), а не падает внутри `dig`. (в) Для одиночного рендера
      `charts/kaname` исход назван явно: вызов помощника зонтика или notify ограждён, либо проба
      одиночного рендера подаёт слой значений и помощник. В обоих случаях одиночный рендер не
      меняет вердикт гейта, который на нём стоит
    held_by: >-
      Нужен гейт, его нет. Заказ: перепись `define "kacho.notifications.enabledFor"`,
      `define "kacho.spiffe.uri"` и имени помощника перечня по `deploy/helm/**` с числом 1 на имя и
      печатью числа осмотренных файлов. Инъекция — второй `define` того же имени в
      `charts/kaname/templates/_helpers.tpl` → красный с обоими путями; близнец — вызов `include`.
      Для (б): рендер подчарта без `global` → отказ с именем ручки. Однофайлового признака у класса
      нет (сравниваются файлы между собой), поэтому в class-guard он не годится

