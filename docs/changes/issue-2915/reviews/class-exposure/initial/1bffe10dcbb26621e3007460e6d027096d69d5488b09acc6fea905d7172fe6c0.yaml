items:
  # --- перенос CX1-01…CX1-57: состояние на редакции 19 ---
  - {id: "CX1-01…CX1-19", status: без изменений, condition_ref: "29cfa368… (там же — ссылки на d524e7bd…, 05828e42…)"}
  - id: CX1-20
    decision: "D9, D29"
    status: >-
      Условие d524e7bd… CX1-20 («значение модуля — через hasKey/kindIs "bool", не default/or») стоит.
      Изменился путь: переопределение теперь `global.kacho.notifications.modules.<модуль>.enabled`.
      Замысел З28 отображает условие одним помощником `kacho.notifications.enabledFor` над
      `.Values.global`. Чего это условие не покрывает, сказано в CX1-111, CX1-112, CX1-113
    condition_ref: "d524e7bd… CX1-20"
  - {id: CX1-21, decision: D9, status: без изменений, condition_ref: "d524e7bd… CX1-21"}
