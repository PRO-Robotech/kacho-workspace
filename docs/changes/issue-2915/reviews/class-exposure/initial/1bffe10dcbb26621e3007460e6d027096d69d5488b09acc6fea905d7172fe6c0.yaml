# Экспозиция классов — первичный разбор (initial), под-фаза NTF-1, редакция 19.
#
# Разбор делается ДО кода и привязан к отпечатку одобренной приёмки. Судится только дельта
# редакции 19 против последней разобранной редакции 18 (29cfa368…, dbe97c78c). Дельта —
# `git diff dbe97c78c fd3470cb6` по файлу приёмки, предмет — полоса W4a: путь флага модуля
# `global.kacho.notifications.modules.<модуль>.enabled`, путь деклараций SAN
# `global.kacho.spiffe.<служба>`, два новых отрицания (N02 и J05: ключ вне `global`).
# Записи о прежних редакциях остаются свидетельствами о своих редакциях и не правятся. Пункты
# CX1-01…CX1-57 перенесены ссылкой; пункты, которые задела дельта, несут новое состояние.
# CX1-111…CX1-113 — классы, открытые решениями редакции 19. Номера CX1-58…CX1-110 заняты
# записями пересверки. Права писать реализацию эта запись не даёт.
