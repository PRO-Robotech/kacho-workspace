return_to_acceptance:
  - id: RA-12
    items: [CX1-46]
    anchors: [Р7, Р10, Р11, NTF1-D07, NTF1-B24, NTF1-G20, NTF1-G25, NTF1-H07]
    what: >-
      ревизия шаблона — единственный признак, по которому notify считает описание строки своим, а
      класс строки (`security` | `notice`) в набор ревизии не входит (Р7), хотя решает исход: отбор
      `Claim(classes)` при потолке потока и паузе источника (Р10, B24), выбор сетки (DROPPED против
      DEFER), `class_not_allowed` (G20). При правке класса шаблона во время раскатки строка и сборка
      notify расходятся в классе при равных ревизиях, и наблюдаемый исход такой строки не задан.
      Нужно одно из двух. (а) Класс входит в набор: смена класса поднимает ревизию, и строка
      иной ревизии получает DEFER(template_skew) по действующему правилу; D07 получает шаг
      «смена класса — ревизия +1» с близнецом «правка ttl — ревизия прежняя». (б) notify сверяет
      класс строки с классом шаблона сборки, и расхождение — DEFER(template_skew) до ResolveSend и
      до резерва сетки; сценарий G25 (класс) с близнецом «класс совпал — отправлено». Попутно,
      одной фразой: инвариант H07 считается по limits сборки notify, а окно исполняет источник по
      своей сборке. Либо назвать это ценой расхождения сборок, либо назвать держателя
