  # --- классы, открытые редакциями 14–16 ---

  - id: CX1-44
    decision: D18
    class: "code-authoring §«Порядок операций внутри кода» (нормализация и проверка разведены); §«Контракт, который нельзя выразить» (источник записывает то, что notify не разберёт)"
    exposure: >-
      Р7 задаёт: «`feed.Put` приводит значение к UTC и усекает до секунды», нуль у источника —
      `IsZero`, в ленте — только RFC 3339 UTC, `form.ParseTimestamp` в notify принимает только это
      написание. Порядок «проверить → нормализовать → записать» даёт две строки, которые источник
      ставит с успехом, а notify закрывает INVALID(attrs_invalid). Это ровно класс RA-09: успех
      у источника, терминальный отказ в notify. Опыт `go run` (measurements): отметка
      `time.Time{}` + 0,5 с проходит `IsZero` (false), а после усечения записывается как
      `0001-01-01T00:00:00Z` — нуль в написании ленты. Год 10000 и отрицательный год `Format`
      записывает строкой (`10000-01-01T00:00:00Z`, `-0001-01-01T00:00:00Z`), и `time.Parse(RFC3339)`
      её не разбирает. В B29 (е) случай один — `time.Time{}`
    condition: >-
      (а) у источника проверка идёт по нормализованному значению: UTC → усечение → проверка нуля
      → запись; (б) проверка у источника — та же функция notify/form, что в notify: значение
      форматируется в написание ленты и разбирается `form.ParseTimestamp`, результат равен
      нормализованному значению; иначе feed.ErrAttrsInvalid с именем атрибута. Отдельной проверки
      диапазона лет рядом с ней нет; (в) написание ленты порождает одна функция notify/form, а не
      `Format` в `feed.Put` и отдельный разбор в notify
    held_by: "частично NTF1-B29 (е) и G25 (г), (ж), (з); случаи «нуль + доля секунды» и «год вне [0000..9999]» у источника — заказ автору проб corelib#77 (сторож, строк 0; близнец — `2026-09-30T00:00:00.9Z` → строка `…T00:00:00Z`)"

  - id: CX1-45
    decision: D19
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения — отпечаток набора); §«Инвариант и оснастка — это тоже прод-код» (писатель и читатель формата — две реализации)"
    exposure: >-
      ревизия растёт «ровно со сменой набора», а смена набора определяется сравнением отпечатков.
      Приёмка называет состав набора (имя, тип, вхождение в тему), но не его каноническую форму.
      Отпечаток по порядку ключей в файле, по сериализации YAML или с учётом комментариев поднимает
      ревизию на правке, которая набор не меняет (перестановка атрибутов, кавычки). Цена такого
      подъёма по Р7 — потеря писем прежней ревизии. Второй путь того же класса — смена алгоритма
      отпечатка в новой версии генератора. Если `-check -base` сравнивает записанные строки
      отпечатков, после подъёма пина corelib каждый шаблон трёх деревьев читается как «набор
      изменён». Генерация против базы тогда поднимает все ревизии разом, и при раскатке это массовое
      EXPIRED(template_skew). Наконец, A09 требует единственного ЧИТАТЕЛЯ `revision.yaml`
      (notify/spec), а файл пишет генератор. Побайтовое равенство «при том же наборе» (D07 шаг 2)
      держится только тогда, когда писатель и читатель — одна реализация формы
    condition: >-
      (а) отпечаток считает одна функция notify/spec по канонической форме: атрибуты упорядочены
      по имени, каждое поле закодировано явно; перестановка атрибутов, кавычки, комментарии и
      пробелы отпечаток не меняют; (б) отпечаток несёт версию алгоритма. `-check -base` определяет
      «набор тот же» пересчётом отпечатка базового `notification.yaml` текущей функцией, а не
      сравнением записанных строк. Смена алгоритма при неизменном наборе ревизию не поднимает, а
      генерация переписывает отпечаток при той же ревизии; (в) набор из базы извлекается узким
      чтением (имя, тип, вхождение в тему), которое не судит базу правилами формата текущей версии:
      формат, ужесточённый после базы, не делает базу «ненайденной»; (г) сериализацию
      `revision.yaml` держит notify/spec рядом с разбором — генератор своей не заводит
    held_by: "D07 шаг (2) держит только правку текста и ttl; перестановку атрибутов, смену алгоритма и базу старого формата не держит ничто — заказ автору проб corelib#77 (близнецы D07: перестановка атрибутов → файл побайтово тот же; отпечаток старой версии алгоритма при том же наборе → `-check -base` зелёный, генерация ревизию не поднимает)"

  - id: CX1-46
    decision: "D19, D10, D6"
    class: "code-authoring §«Решение и его следствие разнесены» (значение, решающее исход, вне ключа согласования); rule architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
    exposure: >-
      равенство ревизий по Р7 — единственный признак, по которому notify считает описание строки
      своим. При этом в набор, а значит и в ревизию, не входят класс, ttl и limits. Класс
      записывается в строку (`SendX` из `notification.yaml`) и решает исход сам по себе: по нему
      фильтрует `Claim(classes)` (B24; при потолке потока и паузе источника notify забирает только
      `security`, Р10), выбирается сетка — терминальный DROPPED(recipient_net) у `security` и
      DEFER у прочего, — и проверяется `class_not_allowed` (G20). Правка `notice` ↔ `security` не
      поднимает ревизию. Во время раскатки строка несёт один класс, а шаблон в сборке notify —
      другой, при равных ревизиях. Исход для такой строки приёмка не задаёт: какой класс решает
      сетку, отбор при паузе и рендер. Тот же разрыв у limits. Инвариант H07 (сетка ≥ 1,25 × сумма
      суточных limits шаблонов `security`) считается по сборке notify, а окно исполняет источник
      по своей сборке. Пока limits источника выше, «пол владельца» не гарантирован, и сигнала об
      этом нет
    condition: >-
      после решения RA-12: (а) при варианте «класс в наборе» — отпечаток (CX1-45) включает класс,
      и D07 получает шаг «смена класса — ревизия +1»; при варианте «сверка в notify» — notify
      сравнивает класс строки с классом шаблона сборки до резерва сетки и до ResolveSend, и
      расхождение — DEFER(template_skew); (б) у сетки, `Claim(classes)` и рендера в коде один
      источник класса — тот, что назовёт приёмка
    held_by: "—: исхода нет, возврат RA-12"

  - id: CX1-47
    decision: "D20, D10, D5"
    class: "code-authoring §«Порядок операций внутри кода» (старшинство исходов задаёт порядок проверок); §«Решение и его следствие разнесены» (внешний вызов и резерв для строки, которую нельзя отправить)"
    exposure: >-
      редакция 15 сняла старшинство «нуль против template_skew» с доводом: «старшинство двух
      исходов зависело бы от порядка проверок в коде». Для остальных пар строк Р11 этот довод
      остался неисполненным. Строка чужой ревизии может одновременно попасть в клетку REVOKED
      (DENIED, терминально), в `recipient_invalid` (адрес — не атрибут, и «значения не судятся» его
      не покрывает), в исчерпанную сетку `security` (DROPPED, терминально) и в `class_not_allowed`.
      Исход, счётчик клеток G14 и судьба строки при откате (Р7 цена (4): новые строки ждут
      обратной раскатки) тогда зависят от того, в каком порядке код проверяет условия. Кроме того,
      если template_skew решается после ResolveSend и резерва сетки, notify ходит в kaname и
      занимает резерв ради строки, которую не может отправить
    condition: >-
      (а) исход строки выбирает одна функция, и порядок в ней объявлен списком клеток, а не
      разнесён по цепочке ветвей в разных слоях; (б) решение о ревизии и наличии шаблона принимается
      до ResolveSend и до резерва сетки; (в) замысел называет место template_skew относительно
      `recipient_invalid`, `class_not_allowed` и REVOKED. Выбор, при котором терминальный исход
      перебивает DEFER(template_skew), уничтожает строку, которую откат (цена (4)) ещё мог бы
      отправить, — это надо назвать в замысле
    held_by: "держится вниманием до замысла; после — заказ автору проб notify: пары «строка чужой ревизии + REVOKED», «+ адрес вне формы», «+ исчерпанная сетка security» с исходом, который назовёт замысел, и счётчик вызовов ResolveSend = 0 для строки чужой ревизии"

  - id: CX1-48
    decision: D21
    class: "rule security-hardening hard-zero-refusals-visible (сигнал, различающий норму и сбой); code-authoring §«Умолчание, которое становится утверждением» (тревога, истинная на каждой исправной раскатке, перестаёт что-либо утверждать)"
    exposure: >-
      G25 и NTF3-20 требуют тревогу template_skew «сразу», на первой строке, в обе стороны. При
      порядке «источник, затем notify», который Р7 сам называет сужающим, каждая исправная раскатка
      со сменой набора даёт строки новее сборки. Тревога срабатывает на каждой правке набора,
      которая идёт по предписанию. Путь потери — строки СТАРШЕ сборки (цена (1)–(3)) и откат (4) —
      сливается с шумом нормы
    condition: >-
      метрика template_skew несёт признак направления: строка старше сборки, новее сборки, шаблона
      нет в сборке. Тревога приёмки «сразу» сохраняется, а правило и панель различают направления.
      Направление берётся из сравнения целых ревизий — того же сравнения, которым выбран исход, без
      второго вычисления
    held_by: "держится вниманием: сценария на признак нет; правка G25 не требуется, это к-замыслу (метки метрики — предмет Р18)"

  - id: CX1-49
    decision: "D19 (D08), D7"
    class: "rule architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» (второй экземпляр CX1-39); rule testing-verdict п.14 (собственный разборщик — распознаватель)"
    exposure: >-
      NTF1-D08 заводит гейт вызова двумя файлами: kacho `internal/repohygiene/notifywiring_test.go`
      и kaname `internal/check/notify_wiring_test.go` «в форме существующих гейтов вызова kaname».
      Ведомость обязательных вызовов (две записи), правило «тело — ровно слова записи», перечень
      запретов (`if:`, `continue-on-error`, `fetch-depth`) и разбор слов оболочки — данные, копия
      которых разойдётся при первой правке ведомости. Это тот же класс, что CX1-39, во втором
      независимом месте. Замеры (measurements): юниты kacho исполняются с `-short` (`make test-unit`
      в шардах); у kaname на пине `pull_request` срабатывает на `main` и ветки эпиков `[0-9]+`, а
      `push` — только на `main`, так что две параллельные правки одного шаблона внутри ветки эпика
      прогон `push` не судит, пока эпик не придёт запросом в `main`. База `HEAD^1` на `push` равна
      прежней голове только при посадке по одному коммиту: 40 из 40 коммитов первого родителя
      ствола kacho имеют свой прогон `push`, и оба репозитория разрешают только коммит слияния.
      Сегодня расхождения нет, но правило держится практикой посадки, а не формой
    condition: >-
      (а) ведомость, разбор YAML и слов оболочки и перечень запретов — одна функция corelib (рядом
      с гейтами дерева CX1-39); тесты kacho и kaname — тонкие вызывающие с путём рабочего процесса;
      (б) гейт не пропускается при `testing.Short()`; (в) гейт печатает версию corelib и число
      записей ведомости
    held_by: "NTF1-D08 держит наличие и форму шага в каждом дереве; единственность реализации ведомости — вниманием, заказ автору проб corelib#77 (проба: ведомость объявлена один раз)"

