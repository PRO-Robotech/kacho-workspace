# Экспозиция классов — первичный разбор (initial), под-фаза NTF-1, редакция 16.
#
# Разбор делается ДО кода и привязан к отпечатку одобренной приёмки. Записи о прежних редакциях
# (b347b81f…, 530e2296…, d524e7bd…, 05828e42…) остаются свидетельствами о своих редакциях и не
# правятся. Пункты CX1-01…CX1-43 перенесены с состоянием на редакции 16; неизменённый пункт дан
# ссылкой `condition_ref` на append-only запись, где его условие записано. CX1-44…CX1-49 — классы,
# открытые решениями редакций 14–16: обязательность каждого атрибута и одно написание отметки
# времени, ревизия шаблона с отпечатком набора, исход строки по ревизии, цена правки набора, база
# `-check -base` по событию CI и гейт вызова NTF1-D08. Пункты, уже отображённые в приёмке
# (RA-01…RA-11), повторно не возвращаются. Когда появится design.md, каждому пункту нужно точное
# отображение в решение замысла и пересверка на отпечаток замысла. Права писать реализацию эта
# запись не даёт.
