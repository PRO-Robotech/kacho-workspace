  - id: CX1-26
    decision: D8
    class: "code-authoring §«Порядок операций внутри кода»; §«Умолчание, которое становится утверждением» (sentinel «токена нет»); §«Решение и его следствие разнесены»"
    exposure: >-
      Р8 вводит правило повтора: строка хранит токен, которым записан последний исход, и сам исход;
      тот же токен и исход — успех без изменения, другой исход — OUTCOME_ALREADY_RECORDED, прочее —
      LEASE_LOST. Исход DEFER не терминален: строка возвращается в pending и может быть выдана
      другим токеном. Три места, где короткая реализация нарушает правило: (1) записывающий CAS
      по (id, lease_token = T), не снимающий аренду при DEFER, примет повторный DEFER как первый и
      сдвинет «не раньше» (CX1-14) повторно; (2) проверка «аренда истекла» раньше проверки повтора
      превратит законный повтор B26 (в), пришедший после конца аренды, в LEASE_LOST, и notify не
      узнает, что SENT записан; (3) побочные следствия записи исхода — стирание секрета, возврат
      вклада, счётчик исходов по клеткам Р11 (G14), возврат резерва сетки (CX1-15) — исполненные на
      ветке «повтор принят», удвоятся.
    condition: >-
      (а) записывающий оператор Ack — один условный UPDATE по (id, lease_token = T, аренда
      действует), снимающий токен и срок аренды в том же операторе для КАЖДОГО исхода, включая
      DEFER; (б) ноль строк → одно чтение, классификация в порядке: outcome_token = T и исход равен
      X → успех; outcome_token = T и исход иной → OUTCOME_ALREADY_RECORDED; иначе LEASE_LOST;
      проверка срока аренды в классификацию не входит; (в) равенство исходов сравнивает пару
      (вид, причина): DEFER(grant_skew) против записанного DEFER(platform_unavailable) —
      OUTCOME_ALREADY_RECORDED (причина решает возврат вклада, Р10); (г) пустой токен — отказ
      INVALID_ARGUMENT до SQL; исход уборщика пишет outcome_token = NULL, и NULL ни с каким
      предъявленным токеном не равен; (д) стирание секрета и возврат вклада — только в ветке,
      где записывающий оператор изменил строку; notify на успешный повтор не увеличивает счётчик
      исходов и не возвращает резерв сетки второй раз.
    held_by: >-
      NTF1-B26 (а)–(в), B13; нужны случаи — их нет, заказ: повтор Ack(id, T, DEFER) после того,
      как строка выдана токеном T2, — успех, строка и момент «не раньше» не изменились; повтор с
      DEFER другой причины — OUTCOME_ALREADY_RECORDED; в B26 (в) счётчик исходов клетки SENT = 1

  - id: CX1-27
    decision: D14
    class: "code-authoring §«Решение и его следствие разнесены» (две величины, связанные инвариантом, объявлены раздельно)"
    exposure: >-
      Р14 утверждает: дубль возможен только если реплика упала между приёмом DATA и Ack. Но
      длительность аренды ни ручкой, ни числом в приёмке не названа, а срок SMTP-сессии с ней не
      связан. Медленная сессия без всякого падения переживает аренду: строка выдаётся другой
      реплике (B13), та отправляет второй раз, запоздалый Ack первой получает LEASE_LOST. B25
      редакции 9 усиливает зависимость: «notify, начавший DATA до expires_at, записывает SENT»
      верно только пока DATA кончается раньше аренды.
    condition: >-
      длительность аренды — объявленная величина (ручка с границами под стражем старта или
      константа, названная в замысле); вся обработка строки в notify — ResolveSend, резерв сетки,
      SMTP-сессия до ответа на DATA — идёт под сроком контекста, строго меньшим остатка аренды за
      вычетом запаса на Ack; строку, у которой остаток меньше этого срока, notify до MAIL FROM не
      доводит; отношение «аренда > срок ResolveSend + срок сессии + запас» проверяет страж старта
      notify с именами обеих ручек.
    held_by: "нужна проба: тестовый узел задерживает ответ на DATA дольше аренды → по строке ровно одна SMTP-сессия (notify прерывает до окончания аренды либо не начинает) — её нет, заказ; до пробы Р14 держится вниманием"

  - id: CX1-28
    decision: D11
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (бюджет повторов); §«Решение и его следствие разнесены» (темп)"
    exposure: >-
      клетка G23: отказ ResolveSend → DEFER(platform_unavailable), попытка не тратится, строка ждёт
      в пределах срока. Без отсрочки (CX1-14) notify переспрашивает отказ с темпом Claim. Двери
      прав несут бюджет отказов на принципала (corelib authz/interceptor.go, шаг 6; kaname
      own_door.go DenyRateLimitPerSec — 0 значит «выключен»): если бюджет на пути ResolveSend
      включён, отказы одного неисправного пространства тратят корзину service:notify, и следующий
      ответ — RESOURCE_EXHAUSTED на ВСЕ пространства, включая identityNamespaces. По таблице Р11
      этот код попадает в род «отказ» с сигналом misconfigured: письма security всех источников
      стоят, а тревога указывает на настройку, а не на троттлинг.
    condition: >-
      (а) после отказа ResolveSend строке ставится «не раньше» той же политикой, что после
      NOT_YET_GRANTED; (б) замысел называет, включён ли бюджет отказов на двери, через которую идёт
      ResolveSend, и если включён — чем отказы одного пространства не отнимают ответы у другого
      (отдельная корзина на пару принципал × пространство либо исключение служебного субъекта с
      доводом); (в) метрика отказов ResolveSend несёт код ответа, так что RESOURCE_EXHAUSTED
      отличим от PERMISSION_DENIED без чтения логов.
    held_by: "нужна проба: пространство A отвечает PERMISSION_DENIED непрерывно, пространство kaname — ALLOW → строки kaname отправлены в пределах срока, число вызовов ResolveSend по A ограничено шагом отсрочки — её нет, заказ"

  - id: CX1-29
    decision: D8
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения — адрес, второй дом)"
    exposure: >-
      Р8: «второй нормализации адреса нет ни у источника, ни в notify». kaname — источник
      (identityNamespaces), и приёмка NTF-2 (Р6, Р7) заводит у неё ключ окон на адресата —
      «нормализованный ввод: нижний регистр, локальная часть без +метки, домен в A-label нижнего
      регистра». Это вторая нормализация у источника, с другой семантикой локальной части, чем
      address.Normalize (локальная часть без изменений, Р15 NTF-4). Гейт единственности B27 обходит
      только corelib/notify и services/notify и kaname не видит — утверждение шире гейта.
    condition: "решение приёмки — см. RA-08; в коде: доменная часть обеих нормализаций — одна функция corelib (address.Normalize либо её доменная половина), ключ kaname строится поверх неё"
    held_by: "—"

  - id: CX1-30
    decision: D8
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения — IDNA)"
    exposure: >-
      «ASCII-форма IDNA» — не одна функция: профили UTS 46 расходятся (переходная обработка
      отображает ß в ss, непереходная — нет), и «домен в нижнем регистре, затем ToASCII» и
      «ToASCII с отображением» дают разные ключи для одних и тех же доменов. B27 проверяет только
      регистр ASCII-домена, и два профиля её одинаково проходят. Смена профиля между версиями
      corelib молча перекладывает ключи окон и сетки.
    condition: >-
      address.Normalize фиксирует профиль IDNA одним именованным значением в коде (непереходная
      обработка UTS 46 с проверками поиска); ошибка преобразования — feed.ErrRecipientInvalid;
      нормализация стоит в Put до первого оператора SQL, так что сторож ErrRecipientInvalid, как и
      ErrLimitExhausted, оставляет транзакцию вызывающего пригодной к коммиту (CX1-10); смена
      профиля — ломающее изменение ключа, объявляемое вместе с перекладкой счётчиков.
    held_by: "NTF1-B27 (регистр); нужны случаи — их нет, заказ: Unicode-домен и его A-label делят одно окно; домен, отличающийся ß/ss, — два окна (фиксирует непереходный профиль); ErrRecipientInvalid внутри открытой транзакции — транзакция коммитится"

  - id: CX1-31
    decision: D7
    class: "code-authoring §«Контракт, который нельзя выразить» (проверка стоит на стороне потребителя, производитель получает успех)"
    exposure: >-
      форма path и token проверяется только в notify, и её нарушение терминально —
      INVALID(attrs_invalid), секрет стёрт. SendX на такие значения отвечает успехом: у адреса есть
      сторож производителя (feed.ErrRecipientInvalid), у path и token — нет. Ошибка генерации
      токена или пути в модуле, в том числе в kaname (приглашение, восстановление), превращается в
      письмо, которое молча не уходит, при успешном ответе глагола. Это та же асимметрия, которую
      RA-02 закрыла для адреса.
    condition: "решение приёмки — см. RA-09; в коде: проверка формы на обеих сторонах — одна функция corelib notify/spec, сгенерированный SendX зовёт её до Put"
    held_by: "—"

  - id: CX1-32
    decision: D11
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (ратификация, цена которой названа неполно)"
    exposure: >-
      ратификация Р11 называет цену так: письмо security «получатель запрашивает повторно после
      исправления (глаголы security инициирует сам получатель)». Для приглашения — глагола
      security того же перечня (Р9: восстановление, приглашение, подтверждение) — это неверно:
      его инициирует приглашающий, адресат о приглашении не знает и запросить его не может, а
      приглашающий об исходе RECIPIENT_REJECTED не узнаёт (у kaname есть повторная отправка
      приглашения, resend_invite.go, но её запускает только человек, знающий о потере). Письма
      класса S из аудита kaname (Д9: вход с нового устройства, смена пароля и второго фактора) тоже
      не запрашиваются получателем, повторного пути у них нет вовсе.
    condition: "решение приёмки — см. RA-07"
    held_by: "—"

