outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-07
    items: [CX1-32, CX1-17]
    anchors: [Р11, Р9, NTF1-G14]
    what: >-
      довод ратификации «5xx на RCPT класса 5.7 терминален» опирается на утверждение «глаголы
      security инициирует сам получатель», которое неверно для приглашения (инициирует
      приглашающий, о RECIPIENT_REJECTED он не узнаёт) и для писем класса S, которые получатель не
      запрашивает вовсе. Нужно одно из двух: (а) цена названа полностью — приглашение и письма S,
      закрытые терминально, пока ретранслятор отвергает по политике, теряются без повторного пути,
      кроме повторной отправки приглашения человеком, знающим о потере; (б) иное решение для
      identityNamespaces — например, 5.7.x на RCPT при классе security — DEFER(platform_unavailable)
      + misconfigured, со сценарием и близнецом G14 и с правкой NTF4-07 в той же волне.
  - id: RA-08
    items: [CX1-29, CX1-12]
    anchors: [Р8, NTF1-B27, "NTF-2 Р6, Р7"]
    what: >-
      утверждение Р8 «второй нормализации адреса нет ни у источника, ни в notify» противоречит
      NTF-2 (ключ окон kaname — своя нормализация, локальная часть без +метки), а гейт B27 обходит
      только corelib/notify и services/notify. Нужно: сузить утверждение до обходимых пакетов и
      назвать ключ окон kaname отдельным ключом с отдельным назначением (антиспам-потолки Д11),
      доменная часть которого берётся из address.Normalize; либо расширить гейт на kaname и
      привести NTF-2 к одной функции. Второй вариант правит NTF-2 — работа её автора.
  - id: RA-09
    items: [CX1-31, CX1-18]
    anchors: [Р7, Р8, NTF1-G24, NTF1-A01]
    what: >-
      форма path и token проверяется только в notify, и её нарушение терминально, а SendX отвечает
      на такие значения успехом (у адреса сторож производителя есть — feed.ErrRecipientInvalid).
      Нужно одно из двух: (а) сгенерированный SendX проверяет форму той же функцией corelib и
      возвращает сторож (например feed.ErrAttrsInvalid) без строки, сценарий с близнецом G24 у
      источника — значение (а) G24 через SendX → сторож, строк 0; близнец — значение по форме →
      строка; (б) ратификация проверки только в notify с названной ценой: приглашение или
      восстановление с неверной формой токена молча не уходит при успешном ответе глагола.
      Попутно текст Р7 должен решить три границы, которые словами не решены: «/» без сегментов,
      хвостовая «/», пустой сегмент.

