# Экспозиция классов — первичный разбор (initial), под-фаза NTF-1, редакция 10.
#
# Разбор ДО кода. Привязан к отпечатку одобренной приёмки. Записи о прежних редакциях
# (b347b81f…, 530e2296…) остаются свидетельствами о них и не правятся. Эта запись самодостаточна:
# перечень CX1-01…CX1-32 перенесён с состоянием на редакции 10; CX1-33…CX1-37 — классы, которые
# открыли решения редакции 10 (notify/form, типы-носители формы и нормализации, сторож
# feed.ErrAttrsInvalid, цена по письмам security) и решение диспетчера Д17 (форма хоста «только
# внутренний слушатель», Х5 NTF-4; один строитель хоста собирает цепочку прав и идентичности).
# Пункты, уже отображённые в приёмке (RA-07…RA-09), повторно не возвращаются. После появления
# design.md каждый пункт обязан получить точное отображение в решение замысла и пересверку на
# отпечаток замысла (class-exposure/revalidation/<design-sha256>.yaml). Разрешения писать
# реализацию эта запись не даёт.
