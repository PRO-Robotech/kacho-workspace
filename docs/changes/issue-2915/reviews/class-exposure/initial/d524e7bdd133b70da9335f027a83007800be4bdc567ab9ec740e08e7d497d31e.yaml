return_to_acceptance:
  - id: RA-10
    items: [CX1-36, CX1-12, CX1-18]
    anchors: [Р7, Р8, NTF1-B27, NTF1-B28]
    what: >-
      Р7 и Р8 утверждают, что значения типов form.Path, form.Token, form.HeaderText,
      address.Normalized, address.Domain дерево не позволяет получить иначе, чем из функций своего
      пакета, а держатель — узел «преобразование типа» гейтов B27 (гейт) и B28 (гейт) — видит лишь
      один из пяти путей: для типа над string значение вне формы получается также нетипизированной
      константой, конкатенацией, срезом и нулевым значением, без узла преобразования. Нужно одно из
      двух: (а) типы непрозрачны — структура с неэкспортируемым полем: преобразование, константа,
      конкатенация и срез вне пакета не компилируются, и держит компилятор; нулевое значение
      отвергают сборщик ссылки и заголовка и ключ окна/сетки; узел гейта — составной литерал или
      объявление без инициализации значения этих типов вне пакета; инъекции B27 (гейт) и B28 (гейт)
      переписываются под этот узел, близнец — значение из ParsePath/Normalize; (б) типы остаются над
      string, узлы гейтов расширены до всех пяти путей (выражение вне пакета, чей тип по go/types —
      один из пяти, и которое есть константа, бинарная операция, срез, преобразование либо нулевое
      значение) с инъекцией на каждый путь и близнецом; утверждение «по построению» в Р7 заменено
      на «держит гейт».
