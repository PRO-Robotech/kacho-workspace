outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-01
    items: [CX1-11, CX1-16]
    anchors: [Р10, Р8, Р11, NTF1-B15, NTF1-B16]
    what: >-
      Р10 ставит возврат вклада в окно в зависимость от «ответа ретранслятора на RCPT», а контракт
      Ack и сценарии B15/B16 — от причины последнего DEFER; 4xx на RCPT по Р11 даёт тот же
      DEFER(platform_unavailable). Нужно одно из двух: (а) Ack несёт признак «ретранслятор ответил
      на RCPT», и сценарий-близнец B15 «DEFER(platform_unavailable) после 4xx на RCPT → вклад не
      возвращён»; (б) условие Р10 заменено правилом «по причине последнего DEFER» явно.
  - id: RA-02
    items: [CX1-12]
    anchors: [Р8, Р10, NTF1-B08, NTF1-B09, "NTF-4 Р15, З11"]
    what: >-
      окно лимита у источника ключуется адресом без названной нормализации. Нужны: решение
      (одна функция нормализации в corelib с семантикой NTF-4 Р15) и сценарий с близнецом —
      L постановок на адрес в двух написаниях одного ящика (регистр домена) → строк L, (L+1)-я —
      ErrLimitExhausted; близнец — два разных ящика, у каждого своё окно; адрес, который
      нормализация не разбирает, — отказ SendX без строки.
  - id: RA-03
    items: [CX1-13]
    anchors: [Р8, Р14, NTF1-B12, NTF1-B13]
    what: >-
      исход повторного Ack(id, T, SENT) после закоммиченного SENT не назван. Нужен сценарий с
      близнецом B13: повтор с тем же токеном и тем же исходом — успех без изменения строки
      (outcome_at прежний); с тем же токеном и ДРУГИМ исходом — FAILED_PRECONDITION с названной
      причиной; утверждение, что notify на успешный повтор письмо не переотправляет.
  - id: RA-04
    items: [CX1-07]
    anchors: [Р11, Р5, NTF1-F09, NTF1-J03]
    what: >-
      в закрытом словаре Р11 нет клетки для ОТКАЗА ResolveSend (PERMISSION_DENIED — у notify нет
      reader этой ленты либо таблица SAN kaname не согласна; INVALID_ARGUMENT). F09 и J03
      утверждают ответ вызывающему, но не исход строки. Нужны клетка (ожидаемо DEFER с сигналом
      misconfigured, попытка не тратится) и сценарий: строка забрана, ResolveSend отвечает
      PERMISSION_DENIED → исход строки и тревога; близнец — F01.
  - id: RA-05
    items: [CX1-17]
    anchors: [Р11, NTF1-G10, NTF1-G14, "NTF-4 Р4"]
    what: >-
      Р11 делает любой 5xx на RCPT терминальным RECIPIENT_REJECTED. Отказ по политике
      ретранслятора (5.7.x) на каждом адресате — неисправность настройки, и она по Р11 терминально
      закрывает письма security. Нужно явное решение: либо клетка «5xx на RCPT с расширенным кодом
      класса 5.7 → DEFER(platform_unavailable) + misconfigured» со сценарием и близнецом G10 (550
      5.1.1 → RECIPIENT_REJECTED), либо ратификация терминального исхода с названной ценой.
  - id: RA-06
    items: [CX1-18]
    anchors: [Р7, Р11, NTF1-A03, NTF1-G03]
    what: >-
      форма атрибутов типов path и token не определена, а клетка «атрибуты не по схеме → INVALID»
      не имеет сценария. Нужны: определение формы (path — абсолютный путь с одной ведущей косой,
      без схемы и узла; token — закрытый алфавит) и сценарий с близнецом G03 — строка со значением
      path, начинающимся с двух косых или со схемы, → INVALID(attrs_invalid), SMTP-сессий 0;
      близнец — обычный путь, кнопка ведёт на origin установки.

