items:
  - id: CX1-01
    decision: D2
    class: "code-authoring §«Умолчание, которое становится утверждением» (запасная личность; запасной путь, фабрикующий утверждение)"
    exposure: >-
      в обоих деревьях уже живут функции, которые НЕИЗВЕСТНЫЙ тип субъекта молча превращают в
      user: corelib FormatSubject (authz/types.go, ветка default) и kaname FGASubjectRef
      (internal/domain/subject.go, ветка default, «defensive»). Применитель манифестов модулей
      kaname строит субъекта кортежа именно через FGASubjectRef (module_seed_writer.go). Р2 и Р5
      вводят новый тип service: самый короткий путь реализации — прогнать «service», «notify»
      через существующий применитель — даст кортеж user:notify вместо service:notify, а самый
      короткий путь в corelib — дописать case "service" в FormatSubject — сделает субъектом
      service любой пересланный принципал с таким типом, то есть второй носитель перестанет быть
      единственным производителем.
    condition: >-
      (а) строку субъекта вида service:<имя> производит ровно одна функция corelib — читатель
      второго носителя (Р2 п.3); ветки switch FormatSubject и TenantSubject словом service не
      расширяются; пересланный принципал любого типа вне словаря тенантов служебного субъекта не
      даёт (fail-closed, как сегодня у listnarrow); (б) применитель строки notifications: в kaname
      строит service:<модуль> и service:notify своим конструктором с закрытым типом, а не через
      FGASubjectRef; неизвестный тип в этом конструкторе — ошибка, а не user; (в) FGASubjectRef и
      его 4 вызывающих не меняют поведения (радиус измерен ниже).
    held_by: >-
      (б) — покраснеют NTF1-F01 (Check(service:notify, reader, …) = true) и F03 при записи
      user:notify; писатель кортежей service: — гейт M10; (а) — нужна проба: доверенный край
      пересылает принципала с типом service и id notify на методе перечня, сертификат пира вне
      таблицы → субъекта нет, PERMISSION_DENIED (близнец M05/C06) — её нет, заказ.

  - id: CX1-02
    decision: D2
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    exposure: >-
      левая сторона сравнения SAN — строка, пересобранная из разобранного URI сертификата
      (CertIdentity берёт u.String()), правая — литерал декларации <служба>.spiffe. Разбор и
      пересборка меняют написание (регистр схемы нормализуется; хвостовой «/», порт, «./»,
      процентное кодирование сохраняются — измерено), поэтому «побайтовое равенство полного URI»
      Р2 п.2 сравнивает две формы, полученные разными путями. Второй источник неоднозначности —
      сертификат с несколькими URI-SAN под доменом доверия: CertIdentity отдаёт первый
      подходящий.
    condition: >-
      (а) ключ таблицы при старте приводится к той же форме, что и левая сторона (разбор +
      пересборка), и если форма ключа отличается от литерала декларации — отказ старта с именем
      ручки и значением (стражи Р2 п.6); (б) сертификат, несущий больше одного URI-SAN под доменом
      доверия, служебного субъекта не даёт; (в) сравнение — после приведения обеих сторон одной
      функцией, без разбора на сегменты.
    held_by: >-
      NTF1-M03 (варианты домена, пространства, учётки, продления); (а) и (б) — нужны случаи M09
      («ключ не в канонической форме») и M03 («два URI-SAN») — их нет, заказ.

  - id: CX1-03
    decision: D2
    class: "code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей неполон)"
    exposure: >-
      извлекатель субъекта authz.Interceptor отдаёт тройку (субъект, principalID, ok); principalID
      служит ключом корзины бюджета отказов на принципала и сравнивается в ветке
      AllowSystemPrincipal. В kaname чтение личности для 17 мест (authzguard.PrincipalSubject,
      15 файлов) идёт через operations.PrincipalFromContext; среди них authorizeCaller, чья ветка
      «принципала нет» — это ветка вызова модуля по сертификату. Если второй носитель станет
      виден этим читателям, у вызова модуля сменится ветка авторизации.
    condition: >-
      (а) для служебного субъекта principalID — строка с типом (service:<имя>), не пустая и не
      голое имя: корзина бюджета и кэш вердиктов не делятся с пользователем того же id;
      (б) в kaname второй носитель читает только страж ResolveSend (перечень Р2 = {ResolveSend});
      authzguard.PrincipalSubject и operations.PrincipalFromContext его не видят (Р2 п.3);
      (в) звено Р2 в authz.Interceptor ставится в одном месте — там, где corelib servicehost
      конструирует перехватчик (2 вызова NewInterceptor в servicehost/serve.go), а не в корне
      каждой службы.
    held_by: >-
      (б) — NTF1-M07 (корпус до/после Р2) — только для методов корпуса; вне корпуса держится
      вниманием; (а) — нужна проба бюджета отказов с субъектом service и пользователем того же id
      — её нет, заказ; (в) — NTF1-M08.

  - id: CX1-04
    decision: D4
    class: "code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей неполон)"
    exposure: >-
      Claim(max, classes) и Ack(id, token, outcome) не несут поля, называющего ленту, а право на них
      — Check(субъект, reader, notification_feed:<модуль>) (C03, M08). Генератор каталога прав
      corelib знает две формы объекта: поле запроса (from_request_field) либо «*»; для типа,
      отличного от cluster, «*» передаётся в модель как есть и даёт отказ всегда. Нужной формы
      «объект = собственная лента сервера» в генераторе нет.
    condition: >-
      идентификатор объекта в проверке прав Claim/Ack — имя модуля, переданное серверу ленты при
      конструировании (то же значение, что ObjectID строки журнала подписки), а не поле запроса и
      не «*»; форма выражена аннотацией, которую выводит генератор каталога, так что строки
      каталога C07 перегенерируются без ручной правки. Если замысел выберет поле запроса,
      понадобится строка отказа «лента не этого сервера» — это возврат в приёмку, а не решение
      замысла.
    held_by: "NTF1-C03, M08 (Check с notification_feed:notify-probe); C07 — строки каталога"

  - id: CX1-05
    decision: D5
    class: "code-authoring §«Унификация и стоимость» (намеренная узость становится контрактом абстракции); §«Порядок операций внутри кода»"
    exposure: >-
      BatchCheck сводит пункты с меткой «вопроса нет» в прогон по ключу (субъект, причина отказа)
      — тип объекта в ключ прогона надзора НЕ входит (runKeyOf), и решение надзора принимается
      одним вопросом на весь прогон (resolveRun, место Д-4). Исключение типов Р5 из надзора,
      вставленное в resolveRun, судило бы прогон целиком: пункт notification_feed/* и пункт
      iam_user/* одного субъекта в одном вызове получили бы общий ответ.
    condition: >-
      (а) исключение применяется ПОПУНКТНО на этапе плана (planCheck): пункт типа из перечня
      метки «вопроса нет» не получает и идёт отказом, либо тип объекта входит в ключ прогона
      надзора; (б) предикат перечня — одна функция над типом объекта, разобранным тем же разбором,
      что кормит модель (не над строкой ресурса и не по префиксу); (в) во всех семи местах Д-1…Д-7
      зовётся она же.
    held_by: >-
      NTF1-F12 (в) и гейт F12; смешанный батч в ОДНОМ вызове (notification_feed/* и iam_user/* от
      U_ca → false и true) — нужна проба, её нет, заказ.

  - id: CX1-06
    decision: D5
    class: "code-authoring §«Решение и его следствие разнесены» (включатель, объявленный независимым от конвейера)"
    exposure: >-
      одно и то же «пространство может слать» живёт в двух местах: запись выдачи (надгробие,
      отсечка) и кортеж sender. Журнал намерений kaname проецируется в прямой факт триггером в той
      же транзакции (внешнего движка нет — измерено), так что окно расхождения закрыто, но
      читатель, решающий по кортежу, не видит отсечки и шаблонной оси.
    condition: >-
      (а) ResolveSend решает только по записи выдачи и записи шаблона, прочитанным одним
      оператором; кортеж sender на пути решения о письме не читается нигде (ни в kaname, ни в
      notify); (б) notify не кэширует ответ ResolveSend — вопрос на каждое письмо (Р5).
    held_by: "NTF1-F05 и F06 после ALLOW F01 в том же процессе (кэш сделал бы их красными), F07, F19, F18"

  - id: CX1-07
    decision: D5
    class: "code-authoring §«Третий исход — «не смог спросить» — слит с «делать было нечего»»"
    exposure: >-
      NOT_YET_GRANTED — это «записи нет». Ошибка чтения базы kaname, возвращённая как «нет строки»,
      станет NOT_YET_GRANTED: notify отложит письмо как законное ожидание выдачи, и тревога будет
      grant_skew вместо недоступности. У notify то же с другой стороны: отказы ResolveSend
      (PERMISSION_DENIED, INVALID_ARGUMENT) в словаре Р11 клетки не имеют.
    condition: >-
      (а) чтение записи выдачи возвращает (запись, найдено, ошибка); ошибка → UNAVAILABLE, а не
      NOT_YET_GRANTED; (б) классификатор notify разводит ответ ResolveSend типом: три исхода,
      недоступность, отказ — без ветки «прочее».
    held_by: "(а) — нужна проба с инъекцией сбоя чтения записи выдачи (близнец F04) — её нет, заказ; (б) — см. RA-04"

  - id: CX1-08
    decision: D5
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения — точность времени)"
    exposure: >-
      полоса отсечки сравнивает enqueued_at (часы базы источника, приезжает в notify ответом
      Claim) с отсечкой (часы kaname). Правило api-timestamp-truncate усекает время на проводе до
      секунды; если усечь и отсечку при чтении записи выдачи, строка, поставленная до Restore в
      пределах секунды, пройдёт — полоса съедается на величину усечения. F20 проверяет только
      целые секунды и этого не различает.
    condition: >-
      точность enqueued_at на проводе названа в контракте; сравнение — enqueued_at ≥ отсечка +
      полоса, где отсечка берётся с полной точностью базы kaname и не усекается; notify передаёт
      enqueued_at строки, а не время Claim.
    held_by: "NTF1-F20 — только целые секунды; нужна проба с дробной отсечкой (строка c − 0,5 с → REVOKED) — её нет, заказ"

  - id: CX1-09
    decision: D5
    class: "rule data-integrity §«Within-service инварианты — ТОЛЬКО на DB-уровне» (cas-attach-template)"
    exposure: "переходы записи выдачи и записи шаблона — соблазн «прочитать состояние → решить → записать»"
    condition: >-
      Revoke/Restore — один условный UPDATE … WHERE … AND отозвано IS [NOT] NULL RETURNING; запись
      шаблона — вставка с отказом от конфликта одним оператором; классификация отказа по нулю строк
      — чтением ПОСЛЕ неудачной записи; снятие и возврат кортежа — в той же транзакции.
    held_by: "NTF1-F18 (8 горутин, гейт «нет чтения с последующей безусловной записью»), F15–F17"

  - id: CX1-10
    decision: D8
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (отказ, переводящий транзакцию в aborted)"
    exposure: >-
      B09: сверх лимита «их транзакции откатились». Если сторож лимита реализован SQL-ошибкой
      (ограничение, RAISE), транзакция вызывающего в Postgres становится aborted, и NTF-3
      (NTF3-14: сверх лимита письма нет, переход коммитится) неисполним той же реализацией Put.
    condition: >-
      Put сигнализирует исчерпание нулём строк условного UPDATE счётчика, без SQL-ошибки; после
      feed.ErrLimitExhausted транзакция вызывающего пригодна к коммиту; откат в B09 — решение
      фикстурного вызывающего, а не свойство Put.
    held_by: "NTF1-B09 и NTF3-14 обязаны зеленеть на одной реализации feed.Put (то же — CX3-06 разбора NTF-3)"

  - id: CX1-11
    decision: D8
    class: "code-authoring §«Контракт, который нельзя выразить» (условие, которое контракт не может выразить)"
    exposure: >-
      Р10: уборщик возвращает вклад строки в окно, «только если строка ни разу не получила ответа
      ретранслятора на RCPT». Ack несёт (id, token, outcome), а 4xx на RCPT по Р11 — это
      DEFER(platform_unavailable), то есть «ответ на RCPT был» и «ответа не было» приезжают
      источнику одним исходом. B15/B16 решают по причине последнего DEFER, Р10 — по факту ответа
      на RCPT: реализация не может выполнить оба.
    condition: "решение приёмки — см. RA-01"
    held_by: "—"

  - id: CX1-12
    decision: D8
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения — адрес)"
    exposure: >-
      окно лимита у источника (feed.Put, limits на адресата) и сетка notify ключуются адресом;
      нормализация адреса в NTF-1 не названа. NTF-4 (Р15, З11) вводит одну функцию отпечатка —
      домен в нижнем регистре и в ASCII-форме IDNA, локальная часть без изменений — но только для
      таблиц notify и только с посадкой NTF-4; ключ окна у источника живёт в corelib и NTF-4 его не
      касается. Два написания одного ящика дают два окна.
    condition: >-
      одна функция нормализации адреса — в corelib (её зовут и feed.Put, и отпечаток notify),
      семантика — Р15 NTF-4 уже с NTF-1, так что З11 NTF-4 становится пустой правкой; адрес,
      который она не разбирает, окна не получает и строка не ставится.
    held_by: "нужен сценарий у источника — см. RA-02"

  - id: CX1-13
    decision: D8
    class: "code-authoring §«Третий исход — «не смог спросить»» (повтор после потерянного ответа)"
    exposure: >-
      notify подтверждает SENT после того, как ретранслятор принял DATA. Если ответ Ack потерян в
      сети, notify повторяет тот же Ack(id, T, SENT); строка уже sent, токен совпадает. Исход
      повтора приёмкой не назван: LEASE_LOST или NOT_FOUND на повторе заставят notify выбирать
      между «переотправить» (дубль вне окна Р14) и «забыть» без основания.
    condition: "решение приёмки — см. RA-03; в коде: Ack — условный UPDATE по (id, token, state='pending'), ноль строк → одно чтение для классификации"
    held_by: "—"

  - id: CX1-14
    decision: D8
    class: "code-authoring §«Решение и его следствие разнесены» (темп производителя против темпа применения)"
    exposure: >-
      DEFER «попытку не тратит» (grant_skew, template_skew, platform_unavailable, recipient_net), а
      когда строка снова станет доступна Claim, контракт не говорит. Без отметки «не раньше»
      строка возвращается следующим же Claim: цикл Claim → ResolveSend → Ack DEFER крутится со
      скоростью notify, нагружая kaname и базу источника на всё время жизни строки.
    condition: >-
      Ack(DEFER) ставит строке момент «не раньше» по объявленной политике отсрочки (ручка с
      границами, без умолчания, под стражем старта); Claim не выдаёт строк с моментом в будущем;
      число отсрочек видно метрикой. Если колонка отсрочки называется next_attempt_at, четвёртый
      вход outboxobservedgate (B20) засчитывает ленту движимой — иначе перепись колонок доставки
      объявит её находкой.
    held_by: "нужна проба: строка в NOT_YET_GRANTED на отрезке T → вызовов ResolveSend не больше T / шаг отсрочки + 1 (управляемые часы) — её нет, заказ; B20"

  - id: CX1-15
    decision: D10
    class: "code-authoring §«Решение и его следствие разнесены» («спросить» и «списать» — раздельно)"
    exposure: >-
      сетка на адресата должна быть точной поперёк двух реплик (H03: ровно S), значит списание
      идёт до DATA. Списанное на попытке, закончившейся DEFER, либо съедает законное письмо
      позже, либо (если списывать только на SENT) две реплики проходят сетку вдвоём.
    condition: >-
      резерв — один CAS-оператор в kacho_notify до MAIL FROM, отдельного «есть ли место» нет;
      на исходе не-SENT резерв возвращается тем же шагом обработки строки; резерв, оставшийся от
      упавшей реплики, живёт не дольше окна — это остаток, названный в замысле, а не ошибка.
    held_by: "NTF1-H03 (точность); возврат резерва после DEFER — нужна проба (близнец H01: DEFER после резерва, затем письмо проходит при S−1) — её нет, заказ"

  - id: CX1-16
    decision: D8
    class: "code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      уборщик источника закрывает строку EXPIRED и возвращает лимит; notify в это время может
      держать аренду и быть посреди DATA («перед DATA notify сверяет срок», но DATA идёт не
      мгновенно). Письмо уйдёт, строка станет EXPIRED с возвратом вклада — окно лимита
      недосчитает отправленное.
    condition: >-
      уборщик закрывает только строки без действующей аренды (условие аренды в том же CAS, что и
      перевод в EXPIRED); Ack после такого закрытия — LEASE_LOST, строка не меняется; возврат
      вклада — по правилу, которое выберет RA-01.
    held_by: "нужна проба: строка арендована, срок проходит, уборщик — строка остаётся pending до конца аренды (близнец B15) — её нет, заказ"

  - id: CX1-17
    decision: D11
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (default-ветка классификатора выбирает ПОЛИТИКУ)"
    exposure: >-
      Р11: «5xx на RCPT → RECIPIENT_REJECTED, терминально» — без различия расширенного кода.
      Отказ по политике ретранслятора (класс 5.7.x, отказ пересылки) на RCPT приходит на КАЖДОГО
      адресата, это неисправность настройки, а не адресата; по Р11 он терминально закрывает все
      письма, включая security, и G10 держит misconfigured нулевым. NTF-4 (Р4) относит 5.7.* к
      permanent_other только в части подавления; исход строки остаётся за NTF-1.
    condition: "решение приёмки — см. RA-05"
    held_by: "—"

  - id: CX1-18
    decision: D7
    class: "code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей неполон)"
    exposure: >-
      A03 отвергает полную ссылку в ЛИТЕРАЛЕ шаблона, но значения атрибутов типов path и token
      приходят данными строки ленты, и форма этих типов в Р7 не определена. Клетка Р11 «атрибуты
      не по схеме → INVALID» не имеет ни одного сценария. Сборка ссылки разрешением
      относительного адреса (а не сложением строк) превращает значение пути, начинающееся с
      двух косых, в ссылку на другой узел.
    condition: >-
      ссылка — сложение origin из конфигурации и пути; path — абсолютный путь с одной ведущей
      косой, без схемы, без обратной косой, с закрытым набором символов; token — в закрытом
      алфавите, вставляется с экранированием параметра запроса; нарушение — INVALID(attrs_invalid)
      по клетке Р11; разрешения относительного адреса на пути сборки ссылки нет.
    held_by: "нужен сценарий — см. RA-06"

  - id: CX1-19
    decision: D13
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    exposure: >-
      AAD = таблица ‖ id строки ‖ имя шаблона — склейка без разделителя допускает две раскладки
      одной байтовой строки; B04 переносит шифротекст между строками (меняется id), но перенос
      внутри строки со сменой имени шаблона (секрет, отрисованный другим шаблоном) не проверяется.
    condition: >-
      AAD кодируется с длиной каждой части; шифротекст несёт идентификатор ключа кольца (без
      перебора ключей); смена template у строки при том же шифротексте — INVALID(sealed_mismatch).
    held_by: "NTF1-B04; смена шаблона в той же строке — нужна проба (близнец B04) — её нет, заказ"

  - id: CX1-20
    decision: D9
    class: "code-authoring §«Умолчание, которое становится утверждением» (sentinel-коллизия: «не задано» и законное значение)"
    exposure: >-
      в шаблонах Helm «не задано» и false неразличимы для if и default: default подменяет false
      глобальным значением, то есть переопределение модуля false тихо превращается в true. У
      переменной процесса то же с пустой строкой.
    condition: >-
      действующее значение модуля выводится через hasKey/kindIs "bool", а не default/or; незаданный
      глобальный — fail с именем ручки; переменная процесса принимает ровно true/false, пустая
      строка — отказ старта, как незаданная.
    held_by: "NTF1-N01 (не задан), N02 (переопределение false при глобальном true); пустая строка — нужен случай N08 — его нет, заказ"

  - id: CX1-21
    decision: D9
    class: "code-authoring §«Порядок операций внутри кода»"
    exposure: "глагол security при выключенном флаге обязан отказать одинаково для любого адреса; поиск адреса до вопроса о флаге делает ответ зависимым от существования адреса"
    condition: "вопрос о флаге — первым оператором глагола, до любого чтения адреса; сторож ErrDeliveryNotConfigured проверяется до Put, а не выводится из его ошибки"
    held_by: "NTF1-N06 (побайтовое равенство, гейт порядка вызовов)"

  - id: CX1-22
    decision: D4
    class: "gate-authoring §«Детерминизм входа и управляемые часы» (фикстура не снисходительнее продукта)"
    exposure: >-
      перехватчик прав кэширует ПОЛОЖИТЕЛЬНЫЕ вердикты (шаг 5). C05 «кортеж reader снят → отказ»
      после разрешённого Claim в том же процессе зелен или красен в зависимости от порядка
      случаев; в работе снятие reader действует через окно кэша.
    condition: >-
      Given C05 строится без предшествующего разрешения в кэше (новый процесс либо управляемые
      часы за пределом окна); окно кэша у источника — объявленная ручка (закрыто
      TestEveryVerdictCacheProcessDeclaresItsOwnKnob).
    held_by: "NTF1-C05; TestEveryVerdictCacheProcessDeclaresItsOwnKnob"

  - id: CX1-23
    decision: D1
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (инвариант, замкнутый по одной стороне)"
    exposure: >-
      G19 утверждает «у notify gRPC-слушателя нет, вызовов точек входа 0», а NTF-4 (З9) заводит у
      notify внутренний gRPC-слушатель. Гейт, у которого «0» зашит в код, NTF-4 будет вынуждена
      переписать, а не пополнить.
    condition: "перепись G19 сверяет найденное с объявленным множеством обслуживаемых сервисов notify (в NTF-1 — пустым), а не с константой; NTF-4 меняет объявление, не логику гейта"
    held_by: "держится вниманием: гейт G19 ещё не написан"

  - id: CX1-24
    decision: D3
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (страж сверяет ИМЯ, а не идентичность)"
    exposure: "исключение authorization: certificate судится именем записи «kaname», а подлинность сервера ленты — SAN из kaname.spiffe; одно без другого делает исключение именным"
    condition: "страж старта notify принимает certificate только у записи с именем kaname И SAN из kaname.spiffe (тот же читатель декларации, что J05); отличный SAN у сервера ленты — отказ подключения"
    held_by: "NTF1-G22, J05"

  - id: CX1-25
    decision: D8
    class: "code-authoring §«Стоимость страницы принадлежит запросу, а не строке»; rule data-integrity (db-skip-locked)"
    exposure: "Claim — аренда пачки до 500 строк с расшифровкой; соблазн расшифровывать внутри транзакции аренды"
    condition: "аренда — одна короткая транзакция FOR UPDATE SKIP LOCKED + UPDATE аренды RETURNING; расшифровка и ответ — после коммита; сетевых вызовов в транзакции нет"
    held_by: "NTF1-B10, B18"

