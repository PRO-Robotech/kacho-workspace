  и «содержание не ослаблено». CX1-135 — под P12 «ручки адреса резолвера нет»: без (а) это утверждение на установке
  оператора держится только словом. CX1-137 — под P02. CX1-138 — под P04…P07, P14…P16, P19. CX1-139 — под средством
  «зона DNS и ключевая пара стенда». CX1-136 — под DoD 22. По Д97 блокирующими для ревью волны годятся CX1-134
  (корректность: ложная WARN и dkim = 0 на исправной смене), CX1-135 (безопасность: обход стража вне дерева),
  CX1-137 (корректность доставки) и CX1-138 (корректность стража); у каждого есть предикат-проба выше. CX1-136 и
  CX1-139 — доступность стенда, не блокируют
