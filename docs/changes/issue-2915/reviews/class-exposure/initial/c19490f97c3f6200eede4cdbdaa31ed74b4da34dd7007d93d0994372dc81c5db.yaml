  # --- новые пункты: классы, открытые редакциями 20–22 ---
  - id: CX1-134
    decision: "D34, D32"
    class: >-
      code-authoring §«Контракт, который нельзя выразить»: одно значение (пара «селектор, ключ») читается двумя
      чтениями, и между ними оно может смениться. code-authoring §«Унификация и стоимость»: при переносе
      взята не самая узкая семантика источника. Условие источника потеряно при переносе
    exposure: >-
      Р19 требует перечитывать ключ и селектор из объекта на каждой перепроверке. Объект смонтирован томом без
      subPath, и kubelet подменяет его содержимое переключением каталога `..data`. Два отдельных чтения
      (`KACHO_NOTIFY_DKIM_KEY_FILE`, `KACHO_NOTIFY_DKIM_SELECTOR_FILE`) могут попасть по разные стороны
      переключения и дать смешанную пару: ключ B и селектор A. Проверка dkim такой пары по записи A не проходит,
      и срабатывает ветка P18: dkim = 0 и WARN на исправной смене, ровно на один интервал (по умолчанию 1 ч).
      Обратный порядок даёт селектор B и ключ A. Если запись B уже опубликована, а в объекте осталась пара A
      (оператор поменял только селектор), смешанная пара тоже ловится, но причина в журнале ложная. Источник
      переноса это знает: замысел NTF-4 df1ce64d… З4 (строки 415–456) — «поколение разрешается один раз:
      os.Readlink(<каталог>/..data), все файлы читаются из этого пути», CX4S-18, проба УК4-16 «смешанное
      поколение». Замысел NTF-1 e25cc91d… §12а «Смена ключа DKIM» говорит «перечитывает два файла тома» и
      откладывает общий тип на NTF-4 З4 (Е18). Условие поколения в перенесённый текст не попало, хотя Р19
      утверждает «содержание не ослаблено»
    condition_on_code: >-
      (а) Перечитывание разрешает поколение один раз: `os.Readlink(<каталог тома>/..data)`, затем ключ и
      селектор читаются из этого пути. Смена пары определяется по содержимому обоих файлов этого поколения. (б)
      Загрузчик при старте читает так же: одна функция для старта и для перепроверки, второго пути чтения
      пары нет. (в) Если общий тип NTF-4 З4 позже заменит эту функцию, замена не ослабляет (а): это строка
      таблицы отличий §12а. (г) В пробе один файл — значение, а не путь к файлу вне тома
    held_by: >-
      Нужен гейт, его нет. Заказ к пробе N14/N15 (P17): каталог тома в форме kubelet (`..data` → поколение);
      между чтением ключа и чтением селектора `..data` переключается на поколение B → пара собрана из одного
      поколения, ложной WARN нет. Инъекция «каждый файл читается через `..data`» → смешанная пара, красный.
      Близнец — без переключения → обычная перепроверка
  - id: CX1-135
    decision: "D38, D39"
    class: >-
      security-hardening «Отношение, выполнимое подстановочным знаком, не сужает НИЧЕГО» в форме ручки: контроль,
      который судит одна только перепись дерева, на установке вне дерева не действует. rule security
      sec-no-silent-default-for-guarded-knob, hard-no-derived-security-address. code-authoring §«Решение и его
      следствие разнесены»: запрет записан в тесте дерева, а исполняет его чарт
    exposure: >-
      P12 утверждает: «нет ни одной ручки, чьё значение пропускает проверку Р19, и нет ручки адреса резолвера»,
      и одновременно стенд направляет DNS пода notify на сервер своей зоны. Замысел выражает это значением
      зонтика `global.kacho.standDNS {enabled, serviceIP, clusterDomain}` (§8, §12а «Зона стенда»). Для пода notify
      это ручка адреса резолвера. Держатель P12 судит её только на семи профилях дерева: (в) «включено ⇒ признак
      stand». Слой значений установки вне git (как `values.fe3455-ory.yaml`, deploy/stacks.txt — «вне git и вне
      машины CI») этим держателем не читается. Значит, утверждение «ручки нет ни в одном профиле» держится только
      для профилей дерева. Рендер чарта сочетание «зона стенда включена, узел почты — не приёмник стенда» не
      отвергает (§12а: отказ рендера только на пустых serviceIP/clusterDomain)
    condition_on_code: >-
      (а) Чарт сам отказывает в рендере при `global.kacho.standDNS.enabled: true`, если узел почты слитых значений
      — не приёмник стенда этого релиза (адрес узла ≠ служба приёмника релиза или приёмник не включён). Текст
      отказа называет ключ `global.kacho.standDNS.enabled` и узел. Это та же связь, что P12 (б)/(в), но
      исполняется в рендере, а не только в тесте дерева. (б) Тот же помощник рендера, который ставит
      `dnsConfig` пода notify, читает это условие. Второго места, где решается «включена ли зона», нет. (в)
      Если (а) не выбрано, замысел говорит прямо, что P12 «ручки нет» держится только для профилей дерева,
      и называет, чем держится на установке оператора. Тогда это вопрос владельцу, а не молчание
    held_by: >-
      Нужен гейт, его нет. Заказ к держателю P12 (D10): инъекция в слой значений вне перечня профилей (фикстурный
      файл поверх цепочки `prod`) — `standDNS.enabled: true` при узле оператора → отказ рендера с именем ключа.
      Близнец — тот же файл поверх `dev` (узел — приёмник стенда) → рендер с `dnsConfig`. Сегодняшние инъекции
      P12 (в `values.a8f60d.yaml`, `values.prod.yaml`) класс не закрывают: они правят файлы, которые держатель
      и так читает
  - id: CX1-136
    decision: "D38, D41"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением»: факт окружения (диапазон адресов служб и
      домен кластера) записан литералом в слое, который наследуют профили разных кластеров.
      hard-no-derived-security-address
    exposure: >-
      Поле `dnsConfig.nameservers` пода принимает только IP-адрес, поэтому замысел закрепляет адрес сервера зоны
      значением `global.kacho.standDNS.serviceIP` (Service с `clusterIP`). Там же лежит `clusterDomain`. Адрес
      должен лежать в диапазоне служб того кластера, где стоит релиз, и быть свободным. Объявление замысел кладёт
      в `values.dev.yaml` и `values.fe3455.yaml` (§12а «Профили»). Цепочку `values.dev.yaml` наследуют `dev`,
      `dev-prod`, `prorobotech`, `a8f60d` (deploy/stacks.txt @910ccddeadc). Шапка `values.prorobotech.yaml`
      описывает развёртывание «on a managed cluster», то есть кластер не kind. `deploy/kind/kind-config.yaml`
      `serviceSubnet` не объявляет, значит, у стенда kind действует умолчание kind. В дереве диапазон не
      записан ни для одного кластера. Литерал, подобранный под kind, наследует профиль управляемого кластера.
      Там он либо вне диапазона (создание Service отвергается, `helm upgrade` падает), либо совпадает с уже
      занятым адресом. Отказ громкий, тихой ошибки нет, но подъём стенда prorobotech ломается при S6
    condition_on_code: >-
      (а) `serviceIP` и `clusterDomain` объявляет файл профиля своего кластера, и наследования между кластерами
      нет. Держатель P12 печатает по каждому профилю со `standDNS.enabled: true`, из какого файла пришли
      `serviceIP` и `clusterDomain`. Значение, пришедшее из файла другого кластера, — красный с именем профиля.
      Либо, вместо (а), выбрана форма без закреплённого адреса, и тогда это названо. (б) Рецепт подъёма
      проверяет до `helm upgrade`, что адрес лежит в диапазоне служб кластера (из ответа API о Service)
    held_by: >-
      Нужен гейт, его нет. По Д97 класс не блокирующий: это доступность стенда, а не корректность и не
      безопасность продукта. Заказ — D10 (перепись источника `serviceIP` по профилям) и рецепт подъёма
  - id: CX1-137
    decision: "D32"
    class: >-
      code-authoring §«Порядок операций внутри кода»: преобразование после подписи. Подпись DKIM верна только для
      байтов, которые получатель увидит. code-authoring §«Решение и его следствие разнесены»: кодировка тела
      выбирается в сборщике З25, а ломается от неё подпись З15
    exposure: >-
      До S6 кодировка тела письма на доставку не влияла. После S6 она влияет. Письма notify несут кириллицу
      (`html/template`, multipart/alternative, З25). Замысел e25cc91d… называет кодировку заголовков
      (`mime.QEncoding`), но не кодировку частей тела. Поиск `Content-Transfer-Encoding|quoted-printable|8bit|
      8BITMIME` по design.md даёт 0 вхождений. Если часть уходит 8bit, ретранслятор без 8BITMIME или
      промежуточный узел перекодирует её в 7bit, и подпись `bh=` перестаёт сходиться. P02 этого не поймает:
      приёмник стенда принимает 8bit, а тело `probe-hello` может быть ASCII. Проблема проявится на внешнем
      ретрансляторе (a8f60d после возврата notify, установки операторов)
    condition_on_code: >-
      (а) Каждая текстовая часть письма с не-ASCII содержимым уходит quoted-printable или base64. Окончательные
      байты, которые подписываются, — 7bit: каждая строка ASCII и не длиннее 998 октетов. (б) Подпись
      считается над этими байтами (З15 «последний шаг» уже это говорит)
    held_by: >-
      Нужна проба, её нет. Заказ к N15: unit-проба сборщика — письмо с кириллицей в теле, все октеты < 0x80, все
      строки ≤ 998. Инъекция «часть отдаётся 8bit» → красный. Близнец — ASCII-письмо. Сквозная P02 должна нести
      не-ASCII тело, чтобы `pass` что-то утверждал о реальных письмах
  - id: CX1-138
    decision: "D36, D33"
    class: >-
      code-authoring §«Чужой ответ: классификация и бюджет»: разбор чужой записи без корзины «прочее». Таблица
      рода ответа (classifyErr) у замысла есть, а таблицы содержимого записи нет. code-authoring §«Унификация и
      стоимость»: валидатор «формы имени DNS» для селектора не назван
    exposure: >-
      Р19 фиксирует исходы словами («завершающий механизм — -all или ~all», «p=quarantine или p=reject», «ключ
      записи совпадает с выведенным»). Замыслы NTF-1 e25cc91d… и NTF-4 df1ce64d… разбора содержимого не
      называют: поиск `redirect|?all|+all|квалификатор|SubjectPublicKeyInfo|PKCS#1` даёт 0. Без таблицы
      остаются открытыми случаи, на которых реализация решит молча. SPF: `all` без квалификатора (это `+all`),
      `?all`, запись с `redirect=` и без `all`, модификаторы после `all` (`exp=`), регистр (`-ALL`), `v=spf10`
      как не-SPF. DMARC: `v=DMARC1` не первым тегом, `p=` в другом регистре. DKIM: `p=` в форме
      SubjectPublicKeyInfo или PKCS#1 (сравнивать по модулю и экспоненте, а не по байтам), пустой `p=` (ключ
      отозван), `k=` не rsa. Селектор P14 «вне формы имени DNS» — по RFC 6376 селектор может содержать точки.
      Если взять общий валидатор имени ресурса (один DNS label, api-name-one-form), законный многоуровневый
      селектор будет отвергнут
    condition_on_code: >-
      (а) В пакете dnscheck закрытые таблицы разбора: SPF — квалификатор завершающего `all`, `+`/пусто/`?` —
      нарушение, `redirect=` без `all` — нарушение своей строкой, модификаторы после `all` допустимы, сравнение
      без учёта регистра; DMARC — `v=DMARC1` первым тегом, иначе это не запись DMARC; DKIM — ключ записи
      разбирается и сравнивается по (N, E), пустой `p=` и `k≠rsa` — нарушение со своей причиной. Строк «прочее
      → ok» нет. (б) Валидатор селектора назван. Если это один DNS label, в §12а записано, что это сужение
      против RFC 6376, и почему. (в) Имена проверок запрашиваются абсолютными (с завершающей точкой), чтобы
      поиск `ndots: 5` из dnsConfig/ClusterFirst не подставлял домены кластера
    held_by: >-
      Нужна проба, её нет. Заказ к N14: табличная unit-проба разбора по строке на случай (а). Инъекция «`all` без
      квалификатора читается как `-all`» → красный. Близнец — `-all`, `~all`. Запись DKIM в форме PKCS#1 и в
      форме SPKI → обе ok
  - id: CX1-139
    decision: "D41"
    class: >-
      rule data-integrity seed-guard-occupancy и seed-verbatim-identity: два объекта посева выведены из одного
      значения (ключевая пара), но ограждены по отдельности. code-authoring §«Решение и его следствие
      разнесены»
    exposure: >-
      Средство «зона DNS и ключевая пара стенда»: ключевую пару выпускает посев при подъёме, селектор и ключ
      кладутся в объект ключа DKIM, записи зоны должны «отвечать ключевой паре». Замысел e25cc91d… §12а
      «Посев»: «существующий объект не трогается… выпускает пару RSA 2048 и создаёт объект ключа DKIM. Отдельно
      он создаёт объект зоны». Если подъём оборвётся между двумя созданиями или объект зоны удалят, следующий
      прогон оставит старый объект ключа и создаст зону из новой пары. Итог: dkim = 0, notify на стенде не
      готов, хотя посев отчитался успехом
    condition_on_code: >-
      (а) Источник один: объект ключа DKIM. Пара выпускается, только если этого объекта нет. Записи зоны (DKIM
      p=, селектор) каждый прогон заново выводятся из открытого ключа существующего объекта, и объект зоны
      перезаписывается. (б) Посев после себя проверяет согласие: открытый ключ из объекта = ключ в TXT зоны
    held_by: >-
      Нужна проба, её нет. Заказ к D10: прогон посева дважды с удалённым объектом зоны между прогонами → записи
      зоны равны ключу объекта. Инъекция «зона из новой пары» → красный. Близнец — два прогона подряд → объекты
      не меняются

notes:
  - id: N22-1
    blocking: false
    where: "Р19 «Проверки» п.3, NTF1-P16"
    text: >-
      DMARC проверяется ровно на `_dmarc.<домен From>`. Если домен From — поддомен (`mail.example.com`), а
      политика опубликована на организационном домене с `sp=`, получатели применяют её, а notify откажет в
      старте (P16). Это строже получателей и fail-closed, то есть безопасно. Решение стоит записать, а не
      оставить следствием: в приёмке при следующей правке либо в замысле строкой «организационный домен в NTF-1
      не используется; функция OrgDomain — NTF-4». Стенд не задет: домен From стенда организационный
    predicate: "grep -n 'организационн' <приёмка NTF-1> design.md — строка с решением есть"
  - id: N22-2
    blocking: false
    where: "NTF1-P18, DoD 23"
    text: >-
      Одно и то же состояние (в объекте пара B, записи B нет) даёт два исхода. Работающий процесс подписывает A и
      держит dkim = 0. Перезапущенный под отказывает в старте (P15). Приёмка это допускает. Строке WARN P18 и
      странице DoD 23 стоит сказать, что перезапуск в этом состоянии остановит отправку
    predicate: "текст WARN P18 и страница DoD 23 называют исход перезапуска"

