# Экспозиция классов — первичный разбор (initial), под-фаза NTF-1, редакция 22 приёмки.
#
# Запись привязана к отпечатку одобренной приёмки. Судится только дельта редакции 22 против последней
# разобранной редакции 19 (1bffe10d…, запись initial/1bffe10d….yaml). Редакций 20 и 21 в дереве нет, поэтому
# дельта взята накопительно: `git diff HEAD -- <приёмка>` (HEAD = 1bffe10d…). Её предмет — группа P (подпись
# DKIM, DNS установки при старте, перепроверка, смена ключа), Р19, стадия S6, DoD 20–23, средства построения
# условий (зоны DNS), I01 (объект ключа DKIM), I06 (зона испытания отдельной установки), §4 (строка NTF-4),
# О17, В21. Пункты CX1-01…CX1-113 перенесены ссылкой. Классы группы P впервые завела пересверка замысла
# 4f78d66c… (CX1-129…CX1-133) раньше, чем приёмка их несла; здесь они получают привязку к сценариям.
# Новые пункты — CX1-134…CX1-139. Права писать реализацию эта запись не даёт.
