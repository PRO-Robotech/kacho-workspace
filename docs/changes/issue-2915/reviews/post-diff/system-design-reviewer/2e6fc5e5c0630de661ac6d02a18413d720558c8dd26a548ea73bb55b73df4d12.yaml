  evidence: put.go:120 (critical выше); прочие операторы Put — на ctx вызывающего, его предел действует.
idempotency:
  result: held
  evidence: Put — ровно один раз относительно коммита вызывающего; откат вызывающего уносит строку, вклад и журнал (B02).
next: go-implementer — ограничить откат точки сохранения пределом (put.go:120) с пробой; затем повтор этой роли на новом дайджесте.
