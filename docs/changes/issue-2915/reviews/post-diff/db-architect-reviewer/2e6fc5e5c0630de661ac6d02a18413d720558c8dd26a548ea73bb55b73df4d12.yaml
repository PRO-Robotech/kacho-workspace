mechanisms:
  - invariant: «не больше max писем на ключ области за окно»
    mechanism: условный upsert строки окна (CAS по count под замком строки), CHECK (count >= 0)
  - invariant: «одно окно на (template, scope, window_seconds, key, window_start)»
    mechanism: PRIMARY KEY окна
  - invariant: «один вклад на пару строка ленты × лимит»
    mechanism: PRIMARY KEY contrib; повтор пары отсекает Validate до SQL (LimitLess строго)
  - invariant: «отметка закрытия ровно у закрытой строки; закрытая без секрета; пара вид × причина»
    mechanism: CHECK outcome_matches_state, closed_carries_no_secret, outcome_pair
