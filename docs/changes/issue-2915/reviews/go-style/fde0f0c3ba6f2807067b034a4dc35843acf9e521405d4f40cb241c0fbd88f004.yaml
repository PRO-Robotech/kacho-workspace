critical:
  - id: GS-C2
    kind: external-call-without-deadline
    at: services/notify/cmd/migrator/main.go:118-121,238-240
    finding: >-
      Новая сверка Д83 читает SELECT current_database() контекстом context.Background() без
      собственного дедлайна. Бюджет есть только у барьера готовности внутри migratorcli.OpenDB
      (dbready.Wait); сам запрос — без предела. Сервер, принявший соединение и замерший
      (failover, зависший пулер), держит init-контейнер в Init бесконечно — отказа нет, есть
      зависание; подсказка «сверить не удалось = отказ» (комментарий confirmDatabase) на этом
      исходе не исполняется.
    require: >-
      В confirmDatabase — context.WithTimeout(ctx, <именованная константа>) вокруг current(ctx),
      defer cancel(); истечение — отказ с тем же текстом «сверка не пройдена — наката нет».
      Проба в main_test.go: current, ждущий ctx.Done(), даёт отказ за предел; близнец — ответ
      в пределе принят.
    return_to: автор D4/Д83
  - id: GS-C3
    kind: security-comment-contradicts-code / two-parsers-one-dsn
    at: internal/migrationchains/dsn.go:15-17,34
    finding: >-
      Комментарий утверждает, что DatabaseOf разбирает DSN «ТЕМ ЖЕ» разбором, что накат
      (migratorcli.OpenDB → pgx.ParseConfig). Это не так: pgx.ParseConfig = pgconn.ParseConfig
      плюс три своих ключа (statement_cache_capacity, description_cache_capacity,
      default_query_exec_mode; pgx v5.10.0 conn.go:173-206). Измерено временной пробой
      @5f195517e81 (удалена, дерево чистое): DSN
      'postgres://u:s3cr%40t@h:5432/kacho_notifyprobe?statement_cache_capacity=zz' и ключевая
      форма с default_query_exec_mode=zz — DatabaseOf принимает (kacho_notifyprobe, nil), а
      pgx.ParseConfig отказывает текстом «cannot parse `postgres://u:xxxxx@h:5432/kacho_notifyprobe?...`».
      Этот текст доходит до журнала init-контейнера через confirmDatabase(%w)→fail(): узел,
      пользователь и база — куски DSN, которые Д83 из текста отказа исключает (пароль маскирован).
    require: >-
      DatabaseOf — на pgx.ParseConfig (ровно разбор OpenDB; pgx/v5 уже в графе), тогда любой DSN,
      прошедший DatabaseOf, проходит разбор OpenDB, и отказ разбора остаётся только у DatabaseOf.
      Проба в migrationchains_test.go: DSN с statement_cache_capacity=zz — отказ DatabaseOf без
      кусков строки (узел/пользователь/база не в тексте); близнец — тот же DSN с =10 принят.
    return_to: автор D4/Д83

