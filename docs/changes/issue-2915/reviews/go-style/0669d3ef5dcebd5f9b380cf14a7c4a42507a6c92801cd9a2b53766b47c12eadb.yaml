important:
  - id: GS-I5
    at: services/notify/cmd/migrator/main.go:257-259
    finding: >-
      Текст отказа сверки «имя базы соединения не прочитано за 10s» печатается на ЛЮБОЙ ошибке
      чтения (отказ прав, обрыв соединения, ошибка Scan), а не только на истечении предела:
      оператор init-контейнера читает таймаут там, где его не было. Отказ fail-closed — исход
      верный, лжёт только формулировка; не блокирует.
    require: "различить errors.Is(err, context.DeadlineExceeded) («не прочитано за %s») и прочее («не прочитано: %w»); проба на ветку не-таймаута."
  - id: GS-I6
    at: internal/migrationchains/dsn.go:40-44
    finding: >-
      pgx.ParseConfig отказывает не только на содержимом строки: он читает файлы sslrootcert/
      sslcert/sslkey и passfile при разборе. Под production-posture (sslmode=require/verify-full)
      несмонтированный сертификат теперь даёт в журнале init-контейнера «DSN не разобран
      драйвером» — причина (файл) скрыта целиком. Подавление текста драйвера оправдано (SEC-W1-01),
      но вид отказа «файл материала TLS не прочитан» от него неотделим. Диагностика, не
      корректность; не блокирует.
    require: "классифицировать отказ разбора хотя бы на «строка» vs «файл материала» (errors.As на *fs.PathError / os.ErrNotExist в цепочке) и назвать во втором случае имя ключа (sslrootcert и т.п.) без значения."

