critical:
  - id: DSN-DB-DIVERGENCE
    where: internal/migrationchains/dsn.go:DatabaseOf; services/notify/cmd/migrator/main.go:selectChain
    defect: >
      Цепочка выбирается по имени базы, которое разбирает DatabaseOf, а соединяется
      драйвер по своему разбору; они расходятся. Измерено pgconn.ParseConfig
      (pgx/v5, на дереве head):
      "postgres://u@h/kacho_notifyprobe?dbname=kacho_notify" -> DatabaseOf=kacho_notifyprobe, pgx=kacho_notify;
      "dbname=kacho_notifyprobe database=kacho_notify" -> DatabaseOf=kacho_notifyprobe, pgx=kacho_notify.
      Точка накатывает цепочку пробы в ЧУЖУЮ базу без отказа — утверждение
      «имя вне таблицы — отказ без наката» ложно для этих записей DSN.
    requirement: >
      Решение о цепочке судит базу, к которой точка соединится: либо имя из
      разбора драйвера при пустом окружении PG*, плюс отказ на любом втором
      источнике имени (query-параметр dbname/database в URL, ключ database в
      ключевой форме); либо после соединения сверка `SELECT current_database()`
      со строкой таблицы до первого оператора goose — отказ при неравенстве.
      Пробу TestDatabaseOfReadsBothDSNForms дополнить обоими DSN выше (красные
      сейчас) с близнецом без второго источника.
    return_to: автор D4 (точка наката / migrationchains)
important:
  - id: ORPHAN-CHAIN-BLIND
    where: internal/migrationchains/migrationchains.go:FromTree (hasSQL по "services/<svc>/internal/migrations")
    defect: >
      «Цепочка без точки наката» ищется только под каноническим именем каталога.
      Снятие строки kacho_notifyprobe из chains.yaml вместе с ключом embedded
      (sameSets остаётся равным) оставляет services/notify/internal/probemigrations
      с двумя .sql вне всех гейтов — ровно класс, ради которого пакет заведён.
    requirement: >
      Признак сироты — любой .sql под services/<svc>/internal/** вне каталогов
      перечня; инъекция «строка и FS сняты» -> красный.
  - id: OWN-ROW-SEQSCAN
    where: services/notify/cmd/notify-probe/internal/send/send.go:ownRowQuery
    defect: >
      `SELECT id FROM …_notification_outbox WHERE age(xmin) <= 0` без индексируемого
      предиката — последовательный проход всей ленты (pending + закрытые до уборки)
      на каждый Send. Корректность по снимку REPEATABLE READ разобрана и держится
      пробой TestParallelSendsGetTheirOwnIDs (48x4); стоимость растёт с таблицей.
    requirement: >
      Механизм — id из самой вставки (feed.Put/порождённый Send… возвращает id,
      INSERT … RETURNING id) — заказ в corelib; до того ограничение принято только
      для пробы со стендовым трафиком.
  - id: RR-SERIALIZATION-LATENT
    where: services/notify/cmd/notify-probe/internal/send/send.go:repeatableRead
    defect: >
      На REPEATABLE READ upsert окна feed (window.go: ON CONFLICT DO UPDATE)
      при конкурирующей постановке даёт 40001, а Send отдаёт его как INTERNAL без
      повтора. Сегодня не срабатывает: у probe-hello нет limits (notification.yaml),
      окно не трогается. Появление limits у шаблона — ложные отказы под параллелью.
    requirement: >
      Либо повтор транзакции на 40001, либо запрет limits у шаблона пробы проверкой;
      снимается вместе с OWN-ROW-SEQSCAN (id из вставки -> RR не нужен).
