accepted:
  D4_feed_id: "corelib@21c784a9b1dc feed.PutID: id выдаётся до INSERT (ids.NewHyphenID) и возвращается из той же точки сохранения; Queued{id,queued} — отсутствие типом; send.go больше не читает ленту, REPEATABLE READ и FeedOutbox сняты; порождённый SendProbeHello зовёт PutID. Пины согласованы: kaname@a3c0158af93e требует corelib@21c784a9b1dc"
  N7_net_ceiling: "резерв — одна RC-транзакция без сетевых вызовов: FOR SHARE ограды, CAS окон по порядку PK, CAS потолка; 0 строк -> сторож, откат всего резерва; освобождение однократно (mutex+released), по ключам резерва, своим сроком WithoutCancel+TxStatementTimeout; порядок замков резерв=освобождение; SET LOCAL statement/idle timeout"
  N7_fence: "LOCK TABLE EXCLUSIVE конфликтует с ROW SHARE от FOR SHARE; lock_timeout 5s -> 55P03 -> отказ старта; superseded — однократный перевод реплики в отказ"
  N7_retention: "уборка — DELETE … FOR UPDATE SKIP LOCKED партиями, порог LeaseTTL сверх конца окна; несколько реплик безопасны"
  N2_claim_loop: "цикл на источник; Claim под своим сроком 10s; выдачу между репликами разводит аренда сервера ленты (SKIP LOCKED); событие подписки — только пробуждение (wake ёмк. 1), состояние не применяется; срок потока только на установление; соединение открывает потребитель (notify)"
  N4_resolve_send: "каждый вызов под своим CallTimeout; классификатор закрыт таблицей кодов; недоступен/отказ/без решения -> DEFER, не ALLOW (fail-closed); REVOKED -> DENIED; кэша нет"
  N6_smtp: "сессия под SessionTimeout, AfterFunc рвёт I/O на отмене; нет TLS -> письмо не уходит; классификатор без default"
  edge: "notify -> источники (kaname, notify-probe): Claim/Subscribe/ResolveSend; обратных вызовов источник->notify нет — ацикличен"
