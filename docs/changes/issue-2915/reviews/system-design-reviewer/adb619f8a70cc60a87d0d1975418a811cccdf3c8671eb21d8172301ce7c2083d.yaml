accepted:
  seed_idempotent: "installation-mail-dns.sh seed — get → NotFound → create; AlreadyExists при гонке двух запусков переиспользует объект, иной отказ сервера — код 2 (не «нет объекта»). Пара выпускается только при отсутствии объекта; существующий не перезаписывается — create-if-absent решает сервер API, а не проверка скрипта. Тот же образец, что seed-stand-dkim.sh @928857dd:deploy/scripts/seed-stand-dkim.sh:142-155"
  secret_not_helm_owned: "kacho-notify-dkim заводится вне helm и чартом не создаётся (git grep @928857dd: только values.dev.yaml:138 secretName и два посева) — конфликта владения при helm install нет"
  values_single_source: "домен From, объект ключа и returnDomain берутся из COMPUTED VALUES цепочки профиля, а не вторым написанием; DKIM выводится из открытого ключа объекта; SPF/DMARC — одна строка профиля, покрытие relay-профилей держит TestStacksMailDNSCoversExactlyTheRelayProfiles"
  return_domain: "notify.returnDomain=prorobotech.ru в values.a8f60d.yaml = домен fromAddress info@prorobotech.ru (values.a8f60d.yaml:120) → KACHO_NOTIFY_RETURN_DOMAIN (deploy/helm/notify/templates/configmap.yaml:54); выравнивание держит TestNotifyReturnDomainIsAlignedWithTheSenderDomain"
  verify_tristate: "verify различает ok/red/silent: нет ответа DNS — код 2, расхождение — код 1; dig ограничен +time=5 +tries=2"
  no_new_edge: "межсервисных рёбер нет; notify в рендер a8f60d не возвращается этим диффом (Д102)"
important:
  - id: kubectl-no-request-timeout
    where: deploy/scripts/installation-mail-dns.sh:153,155,162,182
    note: >
      вызовы kubectl (get namespace, get secret, create secret) идут без --request-timeout:
      на неотвечающем сервере API ручной шаг повиснет, а не выйдет кодом 2 «кластер не ответил»,
      как обещает шапка. Не блок: шаг ручной, оператор в переднем плане, порчи состояния нет.
      Предикат: grep -c -- '--request-timeout' deploy/scripts/installation-mail-dns.sh → 0; правка —
      общий KUBECTL="kubectl --request-timeout=20s" на все четыре вызова (и тот же класс в seed-stand-dkim.sh).
