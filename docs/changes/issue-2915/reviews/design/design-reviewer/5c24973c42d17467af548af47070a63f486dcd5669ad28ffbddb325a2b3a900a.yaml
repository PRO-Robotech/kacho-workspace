critical:
  - id: R38-1
    where: "tasks.md строка D1s; design.md З28 «Копия осмотра…», §11"
    finding: "CX1-120 (Д80) не отображён (0/0/0): гейт image-rollout-binding на дереве Д78 красный (7 из 8, «notify: НЕ ДОЕХАЛ»), а рендер ноги без зонтика даёт 0 объектов с флагом и без."
    requirement: >-
      Гейт image-rollout-binding — в пути и предикат D1s; объект notify берётся из рендера копии осмотра
      (карты A и B), notify остаётся в SERVICES, итог 8 из 8; ветка истекает вместе с D2; замысел прямо
      говорит, что флаг Д80 до D2 никто не читает. Инъекция D1s: в копии снята аннотация
      kacho.cloud/image-id → красный с именем notify; близнец → 8 из 8.
  - id: R38-2
    where: "tasks.md строки C13a и N11r (или D4); design.md З32 / §11"
    finding: "CX1-121 (Д79) не отображён (0/0/0): запись окна отзыва notify-probe в RevocationPolicy.Windows не названа, парной записи словаря tools/revocationwindowgate kacho нет."
    requirement: >-
      C13a несёт ключ буквально "notify KACHO_NOTIFYPROBE_AUTHZ_CACHE_TTL" со значением 5s; ручка вносится в
      словарь tools/revocationwindowgate тем же изменением kacho, что пин на голову C13a (N11r); гейты окна
      печатают корни процессов (notify и notify-probe раздельно) либо замысел несёт предикат «у шлюза notify
      кеша вердиктов нет». Держат сами гейты окна после пина и инъекция D4: держатель ручки в cmd/notify
      без записи → красный.
  - id: R38-3
    where: "design.md З28 «Пустая таблица модулей на голове D1 — закрытый исход»; tasks.md строка D1"
    finding: "CX1-122 (Д80) не отображён (0/0/0): ветка «не выполнилось: перечень пуст» без условия включения по предпосылке и без самоистечения."
    requirement: >-
      Ветку включает пустая таблица модулей, а не ноль объектов; таблица непуста и объектов 0 → красный;
      D2 снимает ветку; сдача D1 печатает вердикт хука отправки на этом исходе. Инъекция D1: строка в
      таблице и 0 объектов → красный; близнец — пустая таблица → «не выполнилось: перечень пуст».

