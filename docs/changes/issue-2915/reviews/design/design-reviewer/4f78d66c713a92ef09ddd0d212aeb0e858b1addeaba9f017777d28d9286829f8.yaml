critical:
  - id: B1
    maps: "условие «применимое ревью есть»; R20-1, R20-2 записи 5abe2336"
    where: "design.md §12а :4889 «стадия S6 приёмки, Р19» → приёмка 5abe2336 (ред. 20)"
    finding: "Замысел исполняет приёмку, которая не одобрена. Р19 и группа P есть только в редакции 20 (CHANGES_REQUESTED). Первичного разбора классов на её отпечаток нет. Это ban #1: механизма без APPROVED-приёмки не бывает."
    requirement: "Приёмка редакции N ≥ 20 получает APPROVED. На её отпечаток заводится initial-разбор. Замысел ссылается на этот отпечаток."
    predicate: "grep '^verdict: APPROVED' docs/specs/reviews/sub-phase-NTF-1-…/<sha приёмки в дереве>.yaml && test -f reviews/class-exposure/initial/<тот же sha>.yaml"
    return_to: "acceptance-author NTF-1"
  - id: B2
    maps: CX1-129
    where: "§12а :4910-4911 «dnsConfig пода notify — только в профиле стенда; P12 судит values всех профилей»; kacho values.a8f60d.yaml:119-120"
    finding: >-
      Понятие «профиль стенда» не определено. У a8f60d почта уходит через внешний ретранслятор smtps://…:465 с
      From info@prorobotech.ru. По замеру пересверки, на 2026-10-03 у этого домена нет ни SPF, ни DMARC.
      Возможны два исхода. Если профилю посеять зону стенда, страж станет обходом и подпись проверится на
      зоне, которой нет у получателей (безопасность). Если не сеять, notify не стартует (корректность).
    requirement: >-
      (а) Перепись 7 профилей stacks.txt: приёмник, источник зоны, исход стража; печатает число профилей.
      (б) P12: «dnsConfig есть ⇔ connectionURI указывает на приёмник стенда» на каждом профиле. Инъекция —
      dnsConfig в values.a8f60d.yaml даёт красный с именем профиля. Близнец — values.dev.yaml, зелёный.
      (в) Исход для a8f60d выбирает владелец и записывает в замысел.
    predicate: "проба P12 красная на инъекции в a8f60d и зелёная на dev; строка a8f60d в переписи §12а с выбранным исходом"
  - id: B3
    maps: CX1-131
    where: "§12а (порядок стража в runServe не назван); kacho serve.go:20-21, notify deployment.yaml:146-151"
    finding: >-
      Сегодня runServe отдаёт ошибки до подъёма поверхности диагностики. Liveness чарта — 5 с + 15 с × 3,
      около 50 с, а поставляемый срок KACHO_NOTIFY_DNS_BOOT_DEADLINE — 2 мин. Если страж встанет до
      диагностики, kubelet убьёт под раньше, чем появится отказ с именем проверки. Получится цикл
      перезапусков без причины.
    requirement: >-
      Назвать порядок: загрузчик → дескриптор посадки → пул → диагностика → страж DNS как компонент /readyz →
      по сроку выход с именем проверки. Другой порядок допустим, если бюджет liveness не меньше верхней
      границы срока, и это утверждает проба рендера. Конструктор стража отказывает на nil-резолвере,
      корень явно передаёт net.DefaultResolver. fixtureEnv в boot_test.go получает новые ручки и ключ.
    predicate: "проба N14: страж перенесён до поверхности → /healthz молчит дольше бюджета → красная; близнец в названном порядке — зелёная"
  - id: B4
    maps: CX1-132
    where: "§12а :4889-4892 «Механизм — замысел NTF-4 З14, З15 … второго описания здесь не заводится»"
    finding: >-
      Механизм «Основы» лежит в чужом документе без отпечатка (grep df1ce64d → 0). Приёмка NTF-4 в дереве уже
      изменилась (78603409 ≠ 01b28881), значит З14/З15 будут править, а одобрение NTF-1 при этом не
      обесценится. Перечень отличий не закрыт: в нём нет З4 (перечитывание секрета), З23 (часы), §8
      (queryTimeout). Не сказано, как смена ключа DKIM доходит до процесса. Объект секрета внешний,
      checksum/ на него нет, поэтому после ротации notify подписывает старым ключом, а перепроверка
      сверяет DNS со старым ключом. Отказ подписи у получателей (корректность).
    requirement: >-
      (а) Закрепить ссылку отпечатком df1ce64d… с именами разделов либо перенести текст в замысел NTF-1.
      (б) Перечень отличий дополнить строками З4, З23, §8. (в) Назвать путь смены ключа: перечитывание или
      перезапуск с названным механизмом. Назвать, что видит перепроверка в окне между сменой DNS и
      перезапуском.
    predicate: "grep -c 'df1ce64d' design.md ≥ 1 (или grep З14 в design.md → 0 и текст механизма в §12а); строки З4/З23/§8 в перечне; проба N15 «ключ в объекте сменён → следующее письмо подписано новым селектором/ключом»"
  - id: B5
    maps: CX1-133
    where: "§12а :4898-4900 «отказ старта на нечитаемом ключе, RSA короче 2048 бит или пустом селекторе»"
    finding: "Не сказано, попадает ли текст ошибки разборщика PEM/PKCS в отказ или журнал. Класс уже был: CX1-125, хвост пароля DSN в тексте ParseConfig. Ключ DKIM — секрет."
    requirement: "Тексты отказа фиксированы: имя ключа объекта и причина. Ошибка разборщика не уходит ни через %w/%v, ни в журнал."
    predicate: "инъекция N14: повреждённый ключ с байтами-маркером → текст отказа и журнал маркера не содержат; близнец — исправный RSA 2048 проходит загрузчик"
  - id: B6
    maps: CX1-130
    where: "§12а :4910 «dnsConfig пода notify»; grep -E 'dnsPolicy|ClusterFirst' design.md → 0"
    finding: >-
      Форма резолвера пода не названа. При dnsPolicy None DNS кластера пропадает, и база, kaname и mailpit
      по именам кластера не резолвятся: notify не готов. При ClusterFirst DNS кластера отвечает первым, и
      посеянная зона не читается: страж отказывает в старте. В обоих случаях notify на стенде не работает.
    requirement: "Назвать форму: dnsPolicy None + сервер зоны авторитетен для домена From и пересылает остальное на DNS кластера (search-домены кластера в dnsConfig), либо иную форму с тем же исходом."
    predicate: "P01: notify готов (база и kaname по именам кластера) и notify_mail_dns_posture{check}=1 по трём проверкам; инъекция «пересылка снята» → не готов с именем пира"

