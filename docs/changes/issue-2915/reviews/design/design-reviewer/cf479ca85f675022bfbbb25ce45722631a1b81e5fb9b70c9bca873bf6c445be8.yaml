    maps: "N46-1"
    text: >-
      Шапка (2) (:22-23) утверждает «шаблон зонтика stand-dns.yaml отказывает в рендере», тело («Приёмник
      поднят») и таблица — блок (6) стража почтовой полосы, а в stand-dns.yaml проверки нет. Два места об
      одном предмете, верно одно; исполнитель D10 по шапке завёл бы второе место. Переписать шапку (2) на
      «блок (6) стража почтовой полосы; текст называет оба ключа» и оставить одну, узкую форму предиката
      места (таблица `git grep -n 'mailpit' …stand-dns.yaml` против P12 (д) `'mailpit).enabled\|mailpit.enabled'`).
      Отступление от буквы Д106 (а) принимает диспетчер — вопрос ниже. Не блокирует: свойство обеспечено.
  - id: R46-2
    maps: "N46-3"
    text: >-
      Слой receiver-off.yaml в описании P12 (д) поверх одной цепочки prod падает раньше блока (6) — на :82
      «адрес отправителя НЕ задан» (перемерено). Слой обязан нести fromAddress и fromName (или лечь поверх
      слоя образца узла D9), иначе инъекция «блок (6) снят» краснеет по чужой причине. Проба при этом не
      ложно-зелёная (текст обязан назвать mailpit.enabled), поэтому к исполнителю D10, не блокирует.
  - id: R46-3
    maps: "N46-2"
    text: "Предикат CX1-140 `git grep … Remove(All)?\\( -- services/notify/internal/dkimkey ':!*_test.go'` → 0 ловит сам dkimtest (не _test.go, импортируемый). Добавить границу ':!services/notify/internal/dkimkey/dkimtest'. Предикат гейта, к исполнителю N14."
  - id: R46-4
