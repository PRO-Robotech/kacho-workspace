critical:
  - id: R34-1
    where: "design.md З32 и §11 (строк отображения CX1-111…114 нет); tasks.md D4, N7, N1"
    finding: >-
      Пересверка 80594e49 возвращает к замыслу четыре пункта, ни один не отображён (вхождений 0 и 0).
      CX1-114 по распределённой оси: одна точка наката на две цепочки при двух процессах одного каталога —
      обходчики дерева (migrationsDirOf и ещё не менее 16 файлов по моему предикату, 20 по предикату
      пересверки) выводят одну цепочку на службу; цепочка пробы с журналом подписки не судится ни гейтом
      хранения журнала, ни outbox-гейтами, а «notify осмотрен» читается как полнота. На голове D4 (до N7)
      сверка наката — 0 = 0 при ненакаченной цепочке. Таблица «имя базы → цепочка» в package main точки
      не читается корнем — второй литерал неизбежен, если форма не названа.
    requirement: >-
      Отобразить CX1-111, CX1-112, CX1-113 (initial/1bffe10d) и CX1-114 (а)–(в) с держателями: одна
      таблица «имя базы → каталог цепочки», читаемая точкой и корневыми гейтами без импорта main/internal,
      либо размещение цепочки пробы, видимое существующим обходчикам; перевод обходчиков на перечень
      цепочек тем же изменением D4 поимённо с числом осмотренных; печать числа цепочек по services/notify
      (1 на голове D4, 2 после N7), красный на нуле; инъекции (1)–(3) пересверки.

