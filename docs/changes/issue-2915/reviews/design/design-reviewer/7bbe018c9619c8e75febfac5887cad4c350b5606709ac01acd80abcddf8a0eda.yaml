  delivery_model: >-
    закрыта. Отказ ResolveSend при отсутствии ключа (PERMISSION_DENIED) попадает в род «отказ»
    классификатора З23. Строка уходит в DEFER(platform_unavailable)+misconfigured с ограничением
    notify.deferFor и expires_at. Письмо не теряется и не уходит без права. Строки ленты kaname
    авторизуются сертификатом и ResolveSend не зовут (клетка 7), поэтому отказ звена их не задевает.
  mixed_version_window: >-
    закрыта. Пока K3 не зарегистрировала сервер, notify получает от kaname UNIMPLEMENTED. Исчерпывающий
    switch З23 относит этот код к роду «отказ», то есть к той же отсрочке, а не к решению о письме.
  edges_acyclicity: >-
    закрыта. Новых рёбер нет: notify → kaname ResolveSend было и раньше (З18). Граф маршрута после
    выделения K3c ацикличен (K3c ← K8; K5 ← K8, K3c; K3 ← K2, K3c, K5).
  public_vs_internal_edge: >-
    закрыта. InternalNotificationGrantService без google.api.http (предикат K3c). Строки реестра прав —
    каталог, а не маршрутизация края.
  config_rollout: >-
    закрыта при условии CX1-106. Смена блока authn.service-identity меняет рендер ConfigMap, а
    kacho.cloud/config-checksum перезапускает kaname. Пока идёт раскатка, реплики со старой таблицей
    отвечают PERMISSION_DENIED, и строка ждёт в отсрочке, то есть отказ закрытый и проходит сам.
  service_identity_handle: "возврат: CX1-105, CX1-106, CX1-108 (ниже)."
  replica_state_isolation: "дельта не трогает; таблица — конфигурация процесса, одинаковая у реплик одного рендера."

critical:
  - id: R31-1
    where: "design.md §13 Е15; tasks.md строки K3c (зависимость «Е15 (посадка)»), Е15, порядок п.3"
    finding: >-
      Е15 открыт как вопрос владельцу, а его посылка опровергнута. Закрытый список расхождений копий
      каталога прав в kaname уже несёт вид CatalogPendingEntry (kaname#181, 6 записей, читатель —
      tools/catalogparity), и это ровно то окно «край ещё не видел глагол». Вопрос висит, хотя дерево
      на него уже ответило. Пока он висит, условие «нет нерешённого вопроса» красное, и посадка K3c,
      K5, K3 гейтится ложным блокером.
    requirement: >-
      Отобразить CX1-104 (а)–(г): K3c дописывает три записи CatalogPendingEntry (путь
      internal/check/catalog_copy_parity.go — в путях K3c), строки реестра — из генератора края.
      Предикат K3c — make check-permission-catalog зелёный с печатью «ожидающих 9». Е15 снять из §13 и из
      зависимостей K3c, порядок снятия записей назвать.
  - id: R31-2
    where: "design.md З13 «Ручка kaname» (форма одна, переменной нет); tasks.md K5"
    finding: >-
      «Переменной нет» не держится механизмом (CX1-105). Строгий загрузчик выводит законными
      KANAME_AUTHN__SERVICE_IDENTITY__METHODS и …__SERVICES, а AutomaticEnv их читает, и окружение
      старше файла. Получается второй путь к таблице SAN служебного субъекта, причём мимо рендера J2 и
      гейта J05. Это ось изоляции конфигурации реплик: поды одного рендера могут нести разные таблицы.
    requirement: "Отобразить CX1-105 (а)–(в): закрытый перечень ключей «только файл», проба на ровно выведенных именах с инъекцией."
  - id: R31-3
    where: "design.md З13, З28 «Декларации»; tasks.md J2"
    finding: >-
      Решение и следствие разнесены по контекстам helm (CX1-106). Подчарт kaname не видит ни
      notify.spiffe, ни признака «объекты notify отрендерены»: helm v4.2.4 даёт .Values.notify = {},
      помощник зонтика — пустую строку. Блок либо не рендерится никогда, и тогда весь путь ResolveSend
      уходит в бессрочную отсрочку misconfigured, либо рендерится с пустым SAN, и тогда старт
      отказывает. Согласие SAN таблицы и spec.uris сертификата notify в одном рендере предикат J2 не
      судит. Порядок J2 ↔ D1 NTF-2 на общем пути charts/kaname/templates/configmap.yaml не назван.
    requirement: "Отобразить CX1-106 (а)–(в): путь значений через global. (или значение зонтика с держателем), сравнение разобранных объектов рендера в J2, порядок J2 ↔ NTF2-D1."
  - id: R31-4
    where: "design.md §8 строка authn.service-identity"
    finding: >-
      Производитель ручки один — подчарт зонтика (CX1-108). Если kaname ставится своим чартом рядом с
      notify, задать таблицу нечем. Тогда каждое письмо источника на ResolveSend навсегда уходит в
      misconfigured, и значением это не исправить.
    requirement: "Отобразить CX1-108: второй производитель — чарт kaname/deploy (строка S11 NTF-2, CX2-94), проба рендера поставки."

important:
  - id: R31-5
    where: "tasks.md K5"
    finding: >-
      Близнец «ключа нет → PERMISSION_DENIED» на голове K5 не наблюдаем (CX1-107): сервера нет, grpc-go
      ответит UNIMPLEMENTED до перехватчика. Свойство fail-closed звена будет утверждено на подставном
      пути.
    requirement: "Отобразить CX1-107: заглушка Unimplemented…Server на тестовом слушателе и различающая пара PERMISSION_DENIED / UNIMPLEMENTED с инъекцией, либо перенос пары в K3."

