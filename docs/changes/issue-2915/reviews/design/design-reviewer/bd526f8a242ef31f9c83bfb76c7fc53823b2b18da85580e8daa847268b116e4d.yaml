minor:
  - id: М1
    lane: N7
    coordinate: design.md З24 (строки 1253–1255); tasks.md N7
    finding: >-
      «Строки сетки по первичному ключу» — это порядок, который резерв и освобождение получают
      независимо. Если резерв запирает оба окна notice одним оператором INSERT … ON CONFLICT по
      нескольким строкам, а освобождение — поштучными UPDATE, то порядок строк у первого задаёт
      план, а не сортировка. Проба с инъекцией «обратный порядок» ловит только явное обращение.
    requirement: >-
      Условие к коду N7: резерв и освобождение получают список ключей строк сетки одной функцией
      limits (единственный дом сортировки) и запирают строки поштучно в этом порядке. Не блокирует:
      нарушение даёт 40P01 — ошибку базы с существующим исходом, инвариант счётчиков не портится.
  - id: М2
    lane: N3
    coordinate: design.md З21 (строки 1155–1161); §11 SDR-Н1; tasks.md N3
    finding: >-
      Повтор Ack на DEADLINE_EXCEEDED вызова имеет смысл, только если у одной попытки есть свой
      срок короче общего t_send + lease_remaining. Без него одна зависшая попытка съедает весь
      остаток аренды, повтора не будет, строка уйдёт следующему Claim.
    requirement: >-
      Условие к коду N3: срок одной попытки Ack — sourceCallTimeout или меньший, ограниченный общим
      сроком; вариант пробы TestAckAfterRowDeadlineStillLands — первая попытка зависает дольше срока
      попытки → повтор записан до конца аренды, писем 1. Не блокирует: исход — дубль в окне DATA → Ack,
      ратифицированный Р14, ограниченный арендой.
  - id: М3
    lane: N2
    coordinate: design.md З21 (строки 1140–1147); corelib @34bc8104a subscription/server.go:363
    finding: >-
      После SubscriptionOpened у потока нет ни срока, ни сердцебиения: в corelib subscription нет
      heartbeat, а клиент notify keepalive не называет. Если поток становится полуоткрытым (источник
      отрезан без RST), доставка по событию молча переходит на такт claimInterval, и
      notify_source_stream_opens_total этого не показывает. Живость сохраняется за счёт Claim по
      такту под sourceCallTimeout, поэтому это не останов.
    requirement: >-
      В форме Д26 без нового механизма: назвать в З21 остаток «полуоткрытый поток после
      SubscriptionOpened — доставка по такту claimInterval до ошибки транспорта». Выбор keepalive
      клиента, если он понадобится, — отдельный предмет, не этот заход. Не блокирует.

