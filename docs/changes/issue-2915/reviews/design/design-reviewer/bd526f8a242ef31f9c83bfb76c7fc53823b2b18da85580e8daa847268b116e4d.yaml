prior_conditions:
  - id: К1
    status: исполнено
    evidence: >-
      З24 (строки 1260–1272): первые операторы транзакций резерва, освобождения и записи ограды —
      SET LOCAL statement_timeout и SET LOCAL idle_in_transaction_session_timeout; «первый оператор»
      И33, И35 и З24 переопределён как первый, берущий замок; запись ограды — пять операторов.
      §8: TxStatementTimeout = 10 с, TxIdleTimeout = 2 с с доводом чисел. Довод держится:
      lock_timeout записи ограды 5 с < statement_timeout 10 с, поэтому исход по пределу записи
      остаётся 55P03; наибольшее ожидание одного оператора резерва — очередь за LOCK TABLE, не
      больше FenceLockTimeout = 5 с < 10 с; между операторами транзакций нет ни сети, кроме базы,
      ни ввода-вывода — проверено по З24 (резерв коммитится до MAIL FROM, освобождение ограду не
      читает). Ожидание соседа при ушедшем держателе ≈ TxIdleTimeout (2 с) < его statement_timeout,
      поэтому сосед сам по пределу не падает. Исходы по пределу — только существующие. И35
      дополнен формулировкой инварианта. Держатель TestReserveHolderVanishedDoesNotStallFleet с
      близнецом-инъекцией (оба SET LOCAL сняты) и положительным близнецом — в §11 SDR-К1 и N7.
  - id: Н1
    status: исполнено
    evidence: >-
      З21 (строки 1155–1161) и З24 (строки 1256–1259): Ack под WithDeadline(WithoutCancel(строка),
      t_send + lease_remaining) по монотонным часам с повтором UNAVAILABLE и DEADLINE_EXCEEDED
      (идемпотентен по З9); освобождение под WithTimeout(WithoutCancel(строка), TxStatementTimeout),
      неудача — остаток до конца окна. Пробы TestAckAfterRowDeadlineStillLands (N3) и
      TestReleaseAfterRowDeadlineReturnsReserve (N7) с инъекциями. Уточнение — М2.
  - id: Н2
    status: исполнено
    evidence: >-
      З21 (строки 1133–1154): Claim под WithTimeout(цикл, sourceCallTimeout = 10 с) — константа, не
      ручка claimInterval; у потока Subscribe своего срока нет, срок только до SubscriptionOpened
      (CX1-71); остаток «отмена после коммита аренды» назван, ограничен LeaseTTL, дубля не даёт,
      виден notify_claim_call_timeouts_total (CX1-72). Довод числа §8: 300 − 10 = 290 с ≥ 155 с
      суммы сроков строки. Один цикл на источник — зависший источник держит только свой цикл.
      Пробы N2 с инъекциями. Уточнение — М3.
  - id: Н3
    status: исполнено
    evidence: >-
      З24 (строки 1249–1256): ключи окна и day хранятся с резерва, освобождение их не вычисляет;
      порядок замков — строки сетки по первичному ключу, затем global_daily, одинаковый у резерва и
      освобождения. Резерв дополнительно берёт ограду FOR SHARE первым; освобождение ограду не
      читает, а LOCK TABLE записи ограды конфликтует только с ROW SHARE, поэтому цикла через ограду
      нет. Пробы TestReleaseConcurrentWithReserveNoDeadlock и TestReleaseAcrossMidnightUsesReserveKeys
      с инъекциями — N7. Уточнение — М1.
  - id: М1
    status: исполнено
    evidence: §9 ссылается на записанные рёбра polyrepo.md по именам; задаче #881 оставлена docs/specs/01.

delta_no_new_mechanism: >-
  Дельта вносит три константы (TxStatementTimeout, TxIdleTimeout, sourceCallTimeout), два счётчика
  и срок установления потока. Всё это — параметры и наблюдаемость уже существующих вызовов и
  транзакций, которых требовали запись dba7c388 и пересверка e7a6ae15. Новых механизмов, решений,
  сторожей, асинхронных путей и внешних вызовов нет — Д26 соблюдён.

axes:
  atomicity_no_dual_write: >-
    Закрыта, дельтой не затронута. Резерв и освобождение — по одной транзакции базы notify,
    SET LOCAL живёт в той же транзакции и уходит с её откатом.
  idempotency: >-
    Закрыта. Повтор Ack на UNAVAILABLE и DEADLINE_EXCEEDED идемпотентен по З9 (outcome_token и
    пара). Освобождение ровно один раз по признаку в записи обработки строки. Отмена Claim после
    коммита аренды дубля не даёт: письма по строкам не было, их выдаст следующий Claim после
    LeaseTTL.
  cas_and_locking: >-
    Закрыта. Порядок замков резерва и освобождения один: ограда (только резерв), строки сетки по
    первичному ключу, global_daily. Серверный предел держит замки горячей строки и ограды не дольше
    бюджета при любом состоянии процесса-держателя. Пробы с конкурирующими горутинами названы (N7).
  delivery_model: >-
    Закрыта. Watch RPC нет. Поток Subscribe — только сигнал перечитать; срок на жизни потока
    не ставится, чтобы доставка по событию не выродилась в опрос (CX1-71). Остаток полуоткрытого
    потока — М3.
  worker_and_replica_coordination: >-
    Закрыта. Один цикл на источник, вызов Claim последователен, такты не копятся. Ack и
    освобождение отвязаны от отмены контекста строки, но ограничены сроком — WithoutCancel без
    срока нигде не введён.
  deadlines: >-
    Закрыта. Свой срок теперь есть у каждого внешнего вызова и у каждой транзакции горячей строки:
    Claim и установление Subscribe — sourceCallTimeout; Ack — конец аренды; освобождение —
    TxStatementTimeout на клиенте и серверный предел в базе; резерв и запись ограды — серверный
    предел плюс lock_timeout записи. Замечание о сроке одной попытки Ack — М2.
  edges_acyclicity: >-
    Закрыта. Новых рёбер нет. §9 ссылается на poly-edge-notify-sources, poly-edge-notify-kaname,
    poly-edge-notify-acyclic.
  public_vs_internal_edge: Закрыта, дельтой не затронута.
  clean_architecture: >-
    Закрыта, дельтой не затронута. Константы живут в limits и notify, проводка — через корень.
  tasks_correspondence: >-
    Соответствует. Каждая строка отображения (SDR-К1, SDR-Н1–Н3, CX1-71, CX1-72) названа условием
    к коду и пробой-держателем с близнецом в полосах N2, N3, N7 tasks.md. Новой полосы нет,
    пересечения путей нет.

