critical:
  - id: R35-1
    where: "design.md З32 «Накат схемы kacho_notifyprobe» (3182–3184, 3212–3215); tasks.md строка D4"
    finding: >-
      Пустое `Chain.Database` — новое sentinel-значение без названного потребителя. Точка notify
      принимает только имена из `chains.yaml` и на ином отказывает; `migratorapply` @e415e59a225 даёт
      каждой точке `pgtest.NewEmptyDB(t)` с именем `kacho_<cfg>_tNNNN`. «По каждой строке таблицы» назван
      без способа получить базу с именем строки — на голове D4 доказательство наката для notify красное
      по построению, а короткие пути его «починить» (запасная ветка на незнакомое имя, флаг выбора
      цепочки, вывод имени из имени службы) замысел сам запрещает, но держателя запрета нет.
    requirement: >-
      Отобразить CX1-115 в З32 и строке D4: (а) назвать потребителей `Chain.Database` и ветку на пустом —
      при пустом `NewEmptyDB`, при непустом база ровно с именем строки (CREATE DATABASE + replaceDBName
      либо помощник pgtest именованной базы); имени из имени службы не выводит никто; (б) в точке нет
      запасной ветки и флага выбора цепочки — проверяется по диффу D4; (в) печать на строку: точка,
      Database (или «не выбирает»), имя базы в DSN, применено/объявлено; строк notify 1 на голове D4, 2
      после N7; (г) инъекция: строке kacho_notifyprobe подать NewEmptyDB → красный с именем точки и
      базы; близнец — имя из таблицы → применено = объявлено.

