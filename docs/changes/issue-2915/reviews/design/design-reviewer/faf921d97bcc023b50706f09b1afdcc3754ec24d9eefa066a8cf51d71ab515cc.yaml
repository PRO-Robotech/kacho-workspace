critical:
  - id: R41-1
    maps: CX1-127
    where: "design.md:3859-3862 и строка таблицы «Перемер редакции 41» :4148 «свой разбор DSN в диффе волны — одно место»; kacho services/notify/cmd/notify-probe/harness_test.go:266-279 dbEnv"
    finding: >-
      Перепись Д93 ложна: предикат не ищет url.Parse и не имеет контроля. Волна завела dbEnv — url.Parse(dsn),
      из которого берутся узел, порт, пользователь, пароль и u.Path[1:]; ключевая форма даёт пустые поля,
      пустой путь — панику. Это второй разбор одного значения, который Д93 запрещает и в тестах.
    requirement: >-
      Строку переписи исправить: два места (dsnField, dbEnv), предикат включает url.Parse, печатает число
      осмотренных файлов, контроль — harness_test.go → 1. Условие D4: dbEnv берёт cfg.Host/Port/User/Password/
      Database у pgconn.ParseConfig. Инъекция — DSN в ключевой форме → вариант с url.Parse красный, близнец с
      ParseConfig зелёный; если инъекция в pgtest невыразима — держит перепись с контролем. Судьба
      replaceDBName (internal/migratorapply/apply_test.go:217, полоса D4) — решена явно либо вопросом N41-3.
  - id: R41-2
    maps: CX1-128
    where: "design.md:3986-3988 «Пара формы и строки» (б): «рендером того же чарта ногами проб D1 (renderNotify / standaloneLeg) … ноль объектов чарта — ноль в каждом профиле»"
    finding: >-
      renderNotify (:184), mustRenderNotify (:199), standaloneLeg (:213) — в deploy/notify_secret_layout_test.go,
      _test.go пакета deploy; из internal/migratorapply недоступны, форма носителя не названа, и исполнитель
      заведёт второй вызов helm со вторым перечнем ног. notify.renders читает .Values.global
      (_helpers.tpl:37-39); сегодня таблица — литерал `list | toJson` (_sources.tpl:27), но D2 вносит флаг
      global.kacho.notifications.enabled, и ноги фикстуры перестают совпадать с профилем стенда ровно тогда,
      когда пара начинает требовать строку kacho_notify.
    requirement: >-
      Назвать единственный носитель рендера для пробы пары и проб D1 (импортируемый не-_test помощник с
      пакетом и путём либо обёртка render-notify-inspect.sh); второго перечня ног и вызова helm нет; инъекция —
      ноги меняются в одном месте → меняются оба исхода. «Профиль» пробы пары — объявленные профили стендов
      (источник назван); «вне опроса» — только при 0 объектов в каждом, с печатью профиля и числа объектов.
      Фразе «ноль в каждом профиле» дать срок «пока pluggableSources — пустой литерал; D2 снимает» с
      предикатом git grep -n 'list | toJson' -- deploy/helm/notify/templates/_sources.tpl. Инъекция на копии:
      флаг global в профиле A, не в ногах фикстуры, строки нет → красный с именем профиля; близнец — флаг
      нигде → «вне опроса».

