delta_no_new_mechanism: >-
  Новых асинхронных путей, воркеров, очередей, CAS, замков и сторожей базы дельта не вводит.
  Новое во времени исполнения — только разбор адреса ретранслятора, три ручки узла почты и их
  страж старта. Новое внешнее ребро по сути не новое: notify → ретранслятор (SMTP) уже в §9; на
  стендах ретранслятор — приёмник в кластере, то же ребро.

axes:
  atomicity_no_dual_write: Закрыта, дельтой не затронута (лента, ограда, резерв — редакции ≤ 13).
  idempotency: Закрыта, дельтой не затронута.
  cas_and_locking: >-
    Закрыта, дельтой не затронута. Ограда ключа сетки и имя объекта ключа постоянны (З28, CX1-68
    (г)) — прежняя редакция, в дельте не менялись.
  delivery_model: Закрыта. Watch RPC нет; доставка — опрос `Claim` (З21).
  worker_and_replica_coordination: >-
    Закрыта. Узел почты читается процессом один раз на старте, общая настройка всех реплик
    приходит одной `ConfigMap` с `checksum/config` — расхождения реплик по адресу на законном
    потоке нет.
  deadlines: >-
    Закрыта. SMTP-сессия ограничена `notify.smtp.sessionTimeout` `[1s..120s]` без умолчания;
    сумма сроков сверяется с `feed.LeaseTTL` стражем старта (З20 «Сверка сроков», §8).
  edges_acyclicity: >-
    Закрыта. Рёбра §9 без изменения, записаны в polyrepo.md (poly-edge-notify-*); ретранслятор —
    внешний узел, notify он не зовёт.
  public_vs_internal_edge: Закрыта, дельтой не затронута.
  security: >-
    Закрыта. (1) TLS обязателен: закрытая таблица схемы `smtp`→STARTTLS / `smtps`→неявный TLS без
    строки `default`; параметры запроса, путь и пароль в адресе — отказ старта, поэтому ручки
    «снять шифрование или проверку» нет (инъекция `?disable_starttls=true` в CX1-77). Отсутствие
    TLS у узла — `DEFER`, письмо не уходит (приёмка G07), недоверенный сертификат — G08.
    (2) `ServerName` — узел того же адреса. (3) Якорь сужает, а не расширяет: при заданном файле
    корневое хранилище в набор не входит, инъекция «корневое ∪ файл» красная (CX1-81 (а)).
    (4) Удостоверение — только `secretKeyRef` на объект установки, объект чарт не рендерит,
    пароля в карте настроек нет; три состояния переменной различаются `os.LookupEnv`. (5) Ключ
    сетки — отдельный объект, один монтирующий, гейт раскладки с инъекциями. (6) Посадка G15:
    mTLS к источникам и kaname, authMode=production, sslmode=require.
  invariants: >-
    Закрыта. Новых инвариантов §3 дельта не вводит; стражи старта — fail-closed с именем ручки
    (ban16-boot-guard, sec-no-silent-default-for-guarded-knob).
  clean_architecture: Закрыта, дельтой не затронута.
  tasks_correspondence: >-
    Соответствует. Держатели узла почты — полоса N13 (разбор, пара, три состояния удостоверения,
    якорь, отправитель, режим читается набором соединения) и D1 (строки чарта); порядок D9 → D4 →
    D1 → D1s → D2 (tasks.md строка 340).

