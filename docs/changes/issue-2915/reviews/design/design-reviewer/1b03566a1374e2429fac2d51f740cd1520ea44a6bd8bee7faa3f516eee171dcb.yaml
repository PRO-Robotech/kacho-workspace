critical:
  - id: R45-1
    maps: CX1-140
    where: "design.md §12а :5166-5175 (ReadPair: Readlink один раз, чтение из <каталог>/<поколение>/<имя>; исход назван только для «..data нет / не читается»); grep -n -i -E 'RemoveAll|ENOENT|файла нет в' design.md → 0 в разделах DKIM"
    finding: >-
      kubelet AtomicWriter после переключения ..data удаляет прежний каталог поколения (atomic_writer.go:138
      «12. The previous timestamped directory is removed», :261 os.RemoveAll(oldTsPath) @k8s v1.31.0).
      ReadPair, разрешивший поколение A до переключения, читает ..A/<имя> после удаления и получает ENOENT.
      Исход этого случая в замысле не назван: реализация отнесёт его либо к P14 «не читается» (ложный закрытый
      отказ старта на исправной смене ключа), либо к «пара сменилась и не прошла» (dkim = 0, ложная WARN) —
      тот самый дефект, который закрывает CX1-134, другим путём. Окно попадания — именно смена ключа. Корректность.
    requirement: >-
      (а) ReadPair различает «файла нет в разрешённом поколении» и в этом случае разрешает ..data заново
      ограниченно (один повтор либо постоянная в §8); сменившееся поколение читается целиком; «не читается» —
      только при неизменном поколении или исчерпанном повторе. (б) Один исход на старте и перепроверке; на
      перепроверке исчерпанный повтор = «поколение не читается» (пара прежняя, признак не меняется, одна WARN).
      (в) Порт pairFS умеет удалить каталог поколения; крючок пробы моделирует шаги 9 и 12 kubelet. Строка
      CX1-140 в таблице «Условия…».
    predicate: "проба N14 (P17): крючок между чтениями переключает ..data на B и удаляет ..A → ReadPair отдаёт пару B целиком, отказа старта нет, на перепроверке переход на B без WARN; инъекция «повтора разрешения нет» → отказ P14 либо dkim = 0 → красный; близнец — переключение без удаления → пара A целиком"
  - id: R45-2
    maps: CX1-141
    where: "design.md §12а :5326-5328 «Пару узел ⇔ приёмник поднят … держит существующий страж зонтика (TestNamedMailNodeIsRaisedByTheDelivery), помощник её не дублирует»; страж — Go-тест по umbrellaProfiles/readProfile (deploy/mail_receiver_core_test.go:317-345 @ba01514b98b)"
    finding: >-
      Класс CX1-135 — установка со слоем значений вне дерева; страж, на который замысел передаёт половину
      условия, судит только профили дерева. Слой оператора поверх prod: standDNS.enabled: true, узел
      <релиз>-mailpit (служба оператора, например ExternalName на внешний ретранслятор), mailpit.enabled
      выключен — помощник notify.standDNS (хост совпал) и ручка старта согласны; под notify сверяет
      DKIM/SPF/DMARC с подсаженной зоной стенда, а письма уходят наружу. Утверждение «ручки, пропускающей
      проверку, нет» на такой установке ложно. Безопасность; пункт пересверки не отображён (§4 контура).
    requirement: >-
      (а) Шаблон зонтика stand-dns.yaml (или зовомый им помощник зонтика — он видит mailpit.enabled)
      отказывает в рендере при global.kacho.standDNS.enabled: true и mailpit.enabled ≠ true; текст называет
      оба ключа. Либо (б) §12а прямо записывает, что пару держит только перепись дерева, и чем она держится на
      установке оператора — тогда это вопрос владельцу. Строка CX1-141 в таблице «Условия…».
    predicate: "P12 (д): фикстурный слой поверх prod — standDNS.enabled: true, connectionURI на <релиз>-mailpit, mailpit.enabled: false → helm template отказывает с именем mailpit.enabled; близнец dev как есть → рендер с dnsConfig"

