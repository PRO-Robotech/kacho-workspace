critical:
  - id: R37-1
    where: "tasks.md строка D1s; design.md З28 (перечень проб с вердиктом на сведённой голове, 2284)"
    finding: >-
      CX1-116 для D1s не отображён: база D1s — голова D1 с пустой таблицей (объектов notify 0), а её
      предикаты утверждают «печать workload notify» и «N ≥ 1 целей IaC-скана», инъекции по ним вырождаются
      в сверку нуля с нулём.
    requirement: >-
      Вердикт гейтов D1s, утверждающих объекты notify, — на сведённой голове с D2; на голове D1s —
      «НЕ ВЫПОЛНИЛОСЬ: перечень пуст» с печатью предпосылки; гейты D1s внести в перечень З28.
  - id: R37-2
    where: "tasks.md строка D4; design.md §11 строка Д77 (3853)"
    finding: >-
      CX1-118 не отображён (0/0/0): предикат «манифест службы называет KACHO_MIGRATOR_DSN» без области;
      иголка общая, при появлении её в шаблоне notify проверка по всему дереву ответит «да» каждой службе.
    requirement: >-
      Полоса DSN — по манифестам, приписанным службе (serviceOfManifest/serviceForForm) или по файлу формы;
      доказательство печатает полосу DSN каждой прежней службы и утверждает, что она не изменилась (vpc —
      конфигурация, пять — окружение, перемерить на базе D4); для служб вне полосы KACHO_MIGRATOR_DSN=
      гасится. Инъекция D4: переменная в шаблоне notify + проверка по всему дереву → красный с именем
      службы и обеими полосами; близнец — проверка по манифестам службы → полосы шести служб прежние.
  - id: R37-3
    where: "tasks.md строка D1, колонка «зависит от»; §3 п.6"
    finding: >-
      CX1-119 не отображён (0/0/0): форма `deploy/helm/notify/templates/**` видна переписи по исходному
      тексту и при пустой таблице; без D4 в базе голова D1 падает t.Fatalf «ЧЬЮ — не выводится» (:215).
    requirement: >-
      D4 в «зависит от» строки D1 либо строка D1 называет исход обеих проб internal/migratorapply на своей
      голове без ослабления пробы, исключения notify и формы-заглушки; §3 п.6: перепись на голове D4 —
      красная, на D4+D1 — зелёная (форма notify 1), на голове волны — 2. Печать в сдаче D1 — вывод
      TestEveryApplyPointHasItsInvocationFormDerived -v.

