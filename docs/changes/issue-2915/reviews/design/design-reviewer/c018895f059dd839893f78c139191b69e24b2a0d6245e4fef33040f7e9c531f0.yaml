delta_no_new_mechanism: >-
  Дельта не вводит асинхронного пути, внешнего вызова, воркера или нового ребра. Новое — признание
  гейтом дерева одной формы функции базы и способ сверки её определений (встроенные выпущенные
  версии шаблона формы, извлечение входов из тела). Это механизм гейта, а не времени исполнения;
  исполняемую функцию заводит NTF-3.

axes:
  atomicity_no_dual_write: >-
    Закрыта. Признанная функция — триггер AFTER INSERT на журнале модуля: строка ленты и строка
    сигнала пишутся внутри оператора вставки журнала, той же транзакцией, что мутация (З10 NTF-3,
    п. 4–5). Двойной записи нет by construction; паритет «журнал ↔ лента» держится построением.
  idempotency: >-
    Закрыта. Строка ленты — на строку журнала, без ключа схлопывания (З10 NTF-3 «Идентичность»);
    повтор глагола, не дающий строки журнала, не даёт и строки ленты (NTF3-162). Повтор `init` при
    неизменных версии схемы и `Mapping` — 0 изменений (D03, CX1-75 (в)).
  cas_and_locking: >-
    Закрыта. Запись реестра требует, чтобы признанная функция называла из таблиц ленты только
    `_notification_outbox` (б): замков строк окна и `contrib` нет, поэтому И30 (один порядок замков
    между писателями ленты) и И32 (одна постановка с limits на транзакцию) не затронуты. Функция
    только вставляет строки с новым `id` — это допустимо и после `Put` с лимитами (УК88). Строка
    сигнала исключена из срабатывания условием `WHEN (… <> 'notification')`, рекурсии триггера нет.
  delivery_model: >-
    Закрыта. Watch RPC нет. Строку сигнала `notification_feed:<модуль>` Go и SQL выводят из одного
    источника — заказ Е10 (4) NTF-3; доставка остаётся опросом `Claim` с пробуждением сигналом.
  worker_and_replica_coordination: Закрыта, дельтой не затронута.
  deadlines: Закрыта, дельтой не затронута (внешних вызовов у функции нет — З10 NTF-3 «не зовёт сеть»).
  edges_acyclicity: >-
    Закрыта. Новых runtime-рёбер нет. Довод CX1-76 держится графом модулей corelib←kaname←kacho:
    тело зависит от `Mapping` kacho, поэтому в corelib встроены только версии шаблона — обратного
    ребра не заводится.
  public_vs_internal_edge: Закрыта, дельтой не затронута.
  clean_architecture: Закрыта, дельтой не затронута.
  tasks_correspondence: >-
    Соответствует. CX1-73…CX1-76 названы условиями к коду и держателями в C6, C10, K7, N10;
    порядок посадки (тег corelib с записью, подъём пина, миграции функций — одно изменение kacho)
    — заказ Е10 (2), поэтому гейт не краснеет «записи нечего исключать» между шагами. Новой
    полосы нет.

findings:
  critical: []
  important: []
  minor:
    - id: М1
      where: design.md §13 Е10 (заказ NTF-3); довод — З10 NTF-3 п. 1–2 (закоммиченная редакция d923fc2c3)
      claim: >-
        Признанная функция отказывает (исключение в триггере → откат мутации) при отсутствии
        настройки `kacho_feed.enabled` и при виде/действии вне сгенерированной таблицы. Это верно
        по fail-closed, но делает её чувствительной к перекосу версий реплик на выкатке: миграция
        `CREATE OR REPLACE` с сузившимся `Mapping` (вид снят) или первое появление функции до
        выкатки кода, выставляющего настройку, валит мутации ещё работающих реплик прежней
        версии. Предмет — не NTF-1: Е10 перечисляет, что нужно этому замыслу для гейта, а не
        доступность модулей на выкатке.
      requirement: >-
        Не условие к NTF-1. Передать ревью замысла NTF-3: назвать порядок expand→migrate→contract
        для функции (снятие вида из таблицы — только после выкатки кода без этого вида; появление
        функции — после выкатки помощника, выставляющего настройку, либо под тем же
        изменением, что З2) и держатель на это.
      return_to: автор замысла NTF-3 (через диспетчера), ревью замысла NTF-3
    - id: М2
      where: design.md З16, запись реестра (а); CX1-76 (а)
      claim: >-
        Прежние определения сверяются с «одной из встроенных выпущенных версий шаблона». Чтобы
        подъём пина corelib не делал красными уже применённые миграции kacho, набор встроенных
        версий обязан только расти — как версии схемы D04. Текст говорит «так же, как версии
        схемы (NTF1-D04)», но монотонность набора прямо не названа.
      requirement: >-
        При следующей правке З16 (не отдельным заходом) назвать: выпущенная версия шаблона формы
        из генератора не удаляется; держатель — та же проба генератора, что для версий схемы.
      return_to: автор замысла NTF-1 — при следующей редакции, не блокирует

