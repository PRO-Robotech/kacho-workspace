critical:
  - id: R44-1
    maps: CX1-134
    where: "design.md §12а :5059 «страж перечитывает два файла тома»; grep -c -E 'Readlink|\\.\\.data|поколени' design.md tasks.md → 0, 0"
    finding: >-
      Пара «ключ, селектор» читается двумя чтениями тома, который kubelet подменяет переключением ..data.
      Чтения по разные стороны переключения дают смешанную пару: исправная смена ключа даёт dkim = 0 и WARN на
      целый интервал (по умолчанию 1 ч), либо ложную причину в журнале. Источник переноса (NTF-4 df1ce64d… З4,
      :415-456) это условие несёт, перенос его потерял, хотя Р19 утверждает «содержание не ослаблено». Корректность.
    requirement: >-
      (а) Поколение разрешается один раз os.Readlink(<том>/..data), оба файла читаются из него. (б) Одна функция
      чтения пары для старта (загрузчик З20) и для перепроверки. (в) Строка в таблице отличий: замена на тип
      NTF-4 З4 не ослабляет (а).
    predicate: "проба N14/N15 (P17): ..data переключается между чтением ключа и селектора → пара из одного поколения, WARN нет; инъекция «каждый файл через ..data» → красный; близнец без переключения — зелёный"
  - id: R44-2
    maps: CX1-135
    where: "§12а :5138-5168 «Зона стенда», P12 (в) «enabled ⇒ stand» судит только профили дерева"
    finding: >-
      global.kacho.standDNS для пода notify — ручка адреса резолвера. Запрет «зона стенда только у приёмника
      стенда» исполняет тест дерева, а не чарт. Установка со слоем значений вне git (как values.fe3455-ory.yaml)
      включает standDNS при боевом узле почты, и страж сверяет DKIM/SPF/DMARC с подсаженной зоной, а не с той,
      что видят получатели. Р19/P12 «ручки, пропускающей проверку, нет» на такой установке ложно. Безопасность.
    requirement: >-
      Выбрать: (а) чарт отказывает в рендере при standDNS.enabled и узле почты, который не приёмник стенда этого
      релиза; текст называет ключ и узел; решение «включена ли зона» в одном помощнике рендера. Либо (в) прямо
      записать, что P12 держит только профили дерева, и почему это допустимо для Основы.
    predicate: "helm template с внешним -f standDNS.enabled=true и узлом ≠ приёмник стенда → отказ рендера с именем ключа; близнец dev — рендер проходит (при выборе (а))"
  - id: R44-3
    maps: CX1-137
    where: "§12а подпись (З15 перенесён); grep -c -E 'Content-Transfer|quoted-printable|8bit|8BITMIME|7bit|998' design.md tasks.md → 0, 0"
    finding: >-
      Кодировка частей тела не названа. Письмо с 8bit-частями (кириллица) ретранслятор или приёмник вправе
      перекодировать, и хэш тела DKIM у получателя не сходится — подпись не проходит. Это ровно предмет Основы. Корректность.
    requirement: "Части с не-ASCII — quoted-printable или base64; подписываемые байты — 7bit, строки ≤ 998 октетов; подпись — над этими байтами."
    predicate: "проба подписи: письмо с кириллицей в теле → все части 7bit, строк > 998 нет, проверка подписи независимой реализацией — pass; инъекция «часть 8bit» → красный"
  - id: R44-4
    maps: CX1-138
    where: "§12а «Проверки»: таблица рода ответа есть, таблиц содержимого нет; grep 'redirect|?all|квалификатор|SPKI' → 0"
    finding: >-
      Разбор содержимого SPF/DMARC/DKIM оставлен реализации. Без закрытых таблиц страж может принять `?all`,
      голый `all` или `redirect=` как исправный SPF, или запись без v=DMARC1 первым тегом, и признак posture=1
      на незащищённом домене. Селектор: валидатор не назван (один label против RFC 6376). Имена запросов при
      ndots 5 и search из dnsConfig не абсолютные — запрос может уйти в search-домены кластера. Безопасность.
    requirement: >-
      Закрытые таблицы в dnscheck без строки «прочее → ok»: SPF — квалификатор all (+/пусто/? — нарушение),
      redirect без all — нарушение; DMARC — v=DMARC1 первым тегом; DKIM — сравнение по (N, E), пустой p= и k≠rsa
      — своя причина. Валидатор селектора назван. Имена запросов абсолютные (завершающая точка).
    predicate: "табличная проба dnscheck: `?all`, `all`, `redirect=` без all, DMARC без v= первым, p= пустой → нарушение каждое своей причиной; контроль `-all` → ok; проба запроса — имя с завершающей точкой"

