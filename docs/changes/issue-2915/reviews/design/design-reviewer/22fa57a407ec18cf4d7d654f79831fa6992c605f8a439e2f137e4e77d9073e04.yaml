critical:
  - id: R36-1
    where: "design.md З28 (запись notify в зависимостях зонтика, NTF1-N04), §11; tasks.md строки D1, D2"
    finding: >-
      Д76 (2026-10-02) не отображён: CX1-116 и CX1-117 пересверки 22fa57a4 — 0 вхождений. На голове D1
      пустая `_sources.tpl` даёт пустой перечень → объектов notify 0 (NTF1-N04), пробам D1 (I01, I02, I05,
      I06) нечего проверять; короткие пути — второй включатель или строка таблицы в фикстуре. Пустой тег
      kacho-notify без порядка «тег не позже полосы, делающей перечень непустым» оставляет D2 выбор между
      падающим рендером и подстановкой умолчания (AppVersion, latest).
    requirement: >-
      Отобразить в З28, §11 и строках D1, D2: (CX1-116) на голове D1 — печать по каждой цепочке перечня и
      числа объектов notify (ожидается 0), пустая таблица → `[]`, рендер не падает, запасной строки нет;
      назвать, чем пробы D1 получают объекты, без `notify.enabled`, condition и строки вне `_sources.tpl` —
      либо перенести эти пробы в D2 маршрутом; проба с инъекцией (помощник отдаёт строку по умолчанию →
      красный) и близнецом (одна строка → объекты есть). (CX1-117) у тега notify нет умолчания; непустой
      перечень и пустой тег → отказ рендера с именем ручки; порядок «тег не позже D2 и стенда»; полоса без
      образа — «не выполнилось» с ревизией; предикат снятия — команда, находящая образ линии в реестре;
      проба с инъекцией `default .Chart.AppVersion` и близнецом.

