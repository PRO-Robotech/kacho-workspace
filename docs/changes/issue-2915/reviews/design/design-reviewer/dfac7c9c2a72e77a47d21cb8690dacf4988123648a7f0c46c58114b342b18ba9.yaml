critical:
  - id: R40-1
    maps: CX1-124
    where: "design.md:3565-3578 З32 (г), фраза «`production-posture.yml` — только `workflow_dispatch`»"
    finding: >-
      Посылка опровергнута: конвейер идёт на pull_request в ветки '[0-9]+-*', включая 2914-notify, и уже шёл
      на запросе волны #2991. После D1s код 2 гейта поверхностей метрик под set -e в dev-prod-up станет
      «КРАСНОЕ — подъём сорвался» на каждом запросе в ветку эпика до D2, а assert-outbox-autovacuum молча не
      исполнится (в required-contexts проверки нет — слияние не заперто, но и не судится).
    requirement: >-
      Записать измеренные триггеры и исход конвейера после D1s; снять «только workflow_dispatch». Выбор формы —
      вопросом диспетчеру с записью решения в замысле: (1) красный production-posture на запросах в 2914-notify
      до D2 с предикатом снятия «D2 влита»; либо (2) рецепт исполняет все гейты и выходит худшей категорией,
      stand-up.sh различает «гейт после подъёма — НЕ ВЫПОЛНИЛОСЬ» и «подъём сорвался», самопроба: инъекция
      «metrics → 2» → autovacuum исполнен, итог 2; «1 и 2» → 1; близнец все 0 → 0.
  - id: R40-2
    maps: CX1-125
    where: "design.md З32 «Имя базы точки наката…» (б), скобка «(`%w` её текста не несёт)»; tasks.md D4"
    finding: >-
      Проба «маркер в обеих формах» по ключевой форме может пройти веткой пустой базы (ParseConfig принимает
      `password=abc MARKERTAIL dbname=…` с db ""), не задев ветку отказа разбора; при отказе текст ParseConfig
      несёт хвост пароля после xxxxx, а `%w` этот текст несёт — скобка ложна.
    requirement: >-
      Проба D4 по ключевой форме берёт DSN, который ParseConfig отвергает (хвост пароля последним), и печатает
      ветку отказа; отдельный случай — принятый с пустой базой, тоже без маркера. Ошибка ParseConfig не входит
      в возвращаемую цепочку ни %w, ни %v. Инъекция — обёртка %w → проба красная; близнец — зелёная. Скобку
      исправить на «не оборачивается ни %w, ни %v».
  - id: R40-3
    maps: CX1-126
    where: "design.md З32 «Пара формы и строки» / Д84 (б), (в); internal/migratorapply/invocation_test.go (носитель «подтест — пропуск»)"
    finding: >-
      internal/migratorapply исполняется шагом test-pg-outside-selection (shortgatedselection_test.go:265), а
      там classify-pg-outside-selection.sh считает пропуск отказом (код 1). t.Skip как носитель «НЕ
      ВЫПОЛНИЛОСЬ» красит полосу на голове D4 до N7/D3; в юнит-прогоне тот же пропуск неотличим от зелёного.
    requirement: >-
      Носитель — суд записи (как ban6_undeployed_carriers): предмет, причина, предикат снятия, истечение; печать
      «НЕ ВЫПОЛНИЛОСЬ: строки kacho_notify нет (N7), запись жива» и «пар форма-строка: N», сумма = формы +
      строки без формы; без подтеста-пропуска. Красное — запись истекла, база вне таблицы и записи, пар 0 при
      пустых записях. Близнец полосы: make test-pg-outside-selection на голове D4 → код 0, «пропущено 0».
      Иная форма — вопрос диспетчеру, не правка классификатора в этой волне.

