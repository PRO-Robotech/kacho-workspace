critical:
  - id: R33-1
    where: "design.md З13 «Звено наблюдаемо на голове K5» (а)–(в) и «боевая пара — в K3» (строки 1222–1244); §11а УК100 (3523); tasks.md K5, K3, шапка строки 15–16"
    finding: >-
      Замысел помещает решение о праве вызова ResolveSend в перехватчик («звено прав в deps — порт
      проверки», «DenyDetailUnary с отказом PERMISSION_DENIED/AUTHZ_DENIED»). Код и собственный З18
      замысла говорят иначе: DenyDetailUnary только дописывает reason к отказу, решённому ниже
      (deny_details.go:6), порта проверки прав во внутренней цепочке kaname нет (serve.go:1085–1108), а
      право решает обработчик первым стейтментом (authz.CallerSubject, затем CheckRelation; З18, 1541).
      Последствия по распределённой оси. (1) Порт прав в deps — либо второе место решения о праве рядом с
      обработчиком (два текста отказа, два reason, расхождение при правке одного), либо конструкция только
      пробы, и тогда проба K5 судит не боевой состав. (2) Инъекция «цепочка без звена Р2 через deps»
      требует боевого конструктора, принимающего deps без звена личности, — молчаливая сборка сервера
      без извлечения служебного субъекта. (3) K3 «обработчик ResolveSend не вызван» противоречит З18:
      проба краснеет на законной реализации либо толкает проверку в перехватчик, то есть в (1).
    requirement: >-
      Отобразить CX1-110 (а)–(г): решение о праве ResolveSend — одно место, обработчик K3, перехватчика
      проверки прав нет; internalUnaryChain(deps) собирает существующие звенья, порта прав в deps нет, nil
      или пустая зависимость звена — ошибка сборки с именем звена (проба конструктора с близнецом); K5 —
      заглушка K3c записывает authz.CallerSubject(ctx) и отвечает UNIMPLEMENTED, пара «(—,false)» /
      «service:notify,true», одна инъекция через вход конфигурации; K3 — «обработчик не вызван» снять,
      судить вызов CheckRelation и 0 чтений записи выдачи; в З18 назвать ветку «субъекта нет». Строку
      1223 («звено прав (DenyDetailUnary …)») исправить: она утверждает о коде то, чего в нём нет.

