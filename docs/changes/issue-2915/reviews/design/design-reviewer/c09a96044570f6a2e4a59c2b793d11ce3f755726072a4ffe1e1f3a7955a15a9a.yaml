critical:
  - id: R39-1
    where: "design.md З32 «Регистрация notify в deploy-гейтах — D1s»; tasks.md строка D1s (пути и предикат); §11 строка Д82"
    finding: >-
      CX1-123 (Д82) не отображён (0/0). (а) Регистрация домена для гейта покрытия делается в
      deploy/e2e-shards.json (core_ban6_domains, gate_ban6_domains, gates, core_images, gate_images), а не
      в assert-shard-coverage.py (grep -c notify → 0 в скрипте и в манифесте); пути D1s его не называют.
      (б) Обе формы регистрации — переключаемый компонент (выключение «--set <gate>.enabled=false») или
      ядро — ведут либо ко второму включателю notify (запрет Д76), либо к живой пробе ban #6 и метрик по
      notify на стенде, где объектов notify до D2 нет. (в) Обещанный близнец «как есть → зелёный с
      числом» для живых гейтов на дереве Д78 неисполним.
    requirement: >-
      По условию CX1-123 пересверки: пути и предикат D1s — deploy/e2e-shards.json (и E2E-SHARDS.md при
      смене весов), предикат — зелёный assert-shard-coverage.py с печатью notify; замысел решает форму
      notify в манифесте до D2 без notify.enabled; исход живых гейтов по notify на стенде волны —
      «НЕ ВЫПОЛНИЛОСЬ: перечень пуст» по пустой таблице модулей (таблица непуста и подов 0 → красный),
      снятие в D2 с предикатом git grep → 0; перепись served notify не вычёркивает; инъекции живых гейтов
      «зелёный с числом» — на сведённую голову D1+D2. Если это противоречит Д82 «в этой волне» — вопрос
      диспетчеру, не notify.enabled.

