measurements:
  - id: М-SDR1
    claim: >-
      Параметр `SET LOCAL idle_in_transaction_session_timeout` внутри транзакции снимает замок
      горячей строки, если держатель замолчал. Без этого параметра замок держится, пока держатель
      не вернётся.
    command: >-
      docker run postgres:16-alpine (16.15); global_daily(day PK, count CHECK >= 0), одна строка.
      Держатель: BEGIN READ COMMITTED; [SET LOCAL idle_in_transaction_session_timeout = '1500ms'];
      UPDATE строки; \! sleep 4 (сеанс простаивает в транзакции); COMMIT. Через 0,7 с второй
      сеанс с lock_timeout = 3s делает UPDATE той же строки.
    result: >-
      С параметром второй сеанс получил UPDATE 1 после 860 мс ожидания. Держатель получил FATAL
      «terminating connection due to idle-in-transaction timeout». Без параметра второй сеанс
      получил «canceling statement due to lock timeout» через 3059 мс, держатель потом
      закоммитил. Прогон по одному на форму, вывод держится на исходе, а не на миллисекундах.

axes:
  atomicity_no_dual_write: >-
    Закрыта. `Put` пишет строку ленты, `contrib`, окно и строку журнала подписки в транзакции
    вызывающего под точкой сохранения (З7, шаги 5–6). Откат вызывающего уносит всё вместе
    (NTF1-B02). Пробуждение идёт через LISTEN после коммита, это механика corelib/subscription.
    kaname: переходы Revoke/Restore — CAS, намерение снятия кортежа `sender` пишется в журнал той
    же транзакцией (З18). Путь решения кортеж не читает, поэтому eventual-материализация исхода
    не меняет. Двойной записи нет.
  idempotency: >-
    Закрыта. Повтор `Ack` классифицируется по `outcome_token` и паре `(kind, reason)` без срока
    аренды, следствия пишутся только в ветке, где строка изменилась (З9). Посев kaname — ON
    CONFLICT DO NOTHING, вставка шаблона — ON CONFLICT … WHERE (З18). Уборщик возвращает вклад по
    строкам, которые перевёл сам этот оператор, поэтому два уборщика возвращают ровно один раз
    (З10). Дубль письма допускается только в окне DATA → Ack, это ратифицировано приёмкой (Р14).
    Условие, при котором это окно не шире названного, — Н1.
  cas_and_locking: >-
    Закрыта по механизму. Окно: INSERT … ON CONFLICT DO UPDATE WHERE count < max, ноль строк
    откатывает к точке сохранения. Полный порядок замков строк окна у трёх писателей: `Put`,
    уборщик истечения через `l AS MATERIALIZED … ORDER BY … FOR UPDATE`, уборка окон через SKIP
    LOCKED (замер М26). `Claim` — один оператор с FOR UPDATE SKIP LOCKED. `Ack` — CAS по
    `lease_token` и `lease_until > now()`. Сетка и `global_daily` — CAS count < limit. Ограда —
    FOR SHARE под явным READ COMMITTED против LOCK TABLE EXCLUSIVE (замеры М31–М33). Не закрыты
    ограничение сервера на транзакцию, держащую единственную строку `global_daily` (К1), и
    порядок и ключ замков при освобождении резерва (Н3). Пробы с конкурирующими горутинами на
    окне, уборщике и ограде названы (C5, N7).
  delivery_model: >-
    Закрыта. Watch RPC нет. notify сам открывает Subscribe к источнику, событие служит только
    сигналом перечитать (`sub-refetch-not-apply`), состояние берётся `Claim` (З21). Публичного
    контракта наблюдения нет.
  worker_and_replica_coordination: >-
    Закрыта по механизму, замечания — ниже. У источника: аренда через SKIP LOCKED, уборщик на
    каждой реплике с возвратом ровно один раз, StartSweeper поднимается в корне вне флага. У
    notify: сетка и потолок живут в базе, ограда ключа — в базе. Ведро источника в памяти
    реплики ратифицировано приёмкой (строка 1131, H04). После сбоя строка возвращается к
    следующему `Claim` по концу аренды.
  deadlines: >-
    НЕ закрыта. Транзакции резерва и освобождения notify проходят через единственную строку
    `global_daily` и через ограду, и ограничения со стороны сервера у них нет (К1). Для `Ack` и
    освобождения, которые выполняются после крайнего момента строки, контекст не назван (Н1). У
    вызовов `Claim` и `Subscribe` нет своего срока (Н2). Сроки `ResolveSend`, резерва и SMTP
    заданы (З21), `lock_timeout` записи ограды тоже (З24).
  edges_acyclicity: >-
    Закрыта. Рёбра notify → источник и notify → kaname записаны в .claude/rules/polyrepo.md:57–62
    (poly-edge-notify-sources, poly-edge-notify-kaname, poly-edge-notify-acyclic). Ни kaname, ни
    источник notify не зовут. В NTF-1 у notify нет gRPC-слушателя (З15). §9 замысла ссылается на
    задачу вместо записанного правила — М1.
  public_vs_internal_edge: >-
    Закрыта. `InternalNotificationFeedService` и `InternalNotificationGrantService` не имеют
    google.api.http и работают только на внутреннем слушателе (§5, З29 — строка INTERNAL_ENDPOINTS).
    У notify форма `HostNoGRPC` (З15). `Claim` и `Ack` — внутренний протокол аренды, а не мутация
    ресурса, поэтому синхронный ответ ban #9 не нарушает. Revoke и Restore возвращают Operation.
  clean_architecture: >-
    Закрыта. Граф импорта notify/* разведён (З1). Гейты вынесены в treehygiene, а не в рантайм
    (З16). notify не импортирует kaname, ребро сетевое. Проводка идёт через корень и дескриптор
    (З13–З15).
  tasks_correspondence: >-
    Соответствует. Все требования ниже ложатся в существующие полосы: К1, Н1 и Н3 — в N7 и N3,
    Н2 — в N2, М1 — в §9. Новой полосы не нужно, пересечения путей не возникает.

critical:
  - id: К1
    coordinate: >-
      design.md З24 (строки 1188–1197 — резерв и освобождение; 1228–1251 — предел записи ограды;
      1256–1264 — транзакция резерва; 1329–1330 — global_daily), §6 (строки 1678–1692), §8
      (строки 1734–1739), И22 и И35 (строки 1527, 1540); tasks.md N7 (строка 117)
    finding: >-
      Через транзакцию резерва проходит единственная строка `global_daily`, одна на сутки для
      всей установки (замысел говорит об этом сам: «все резервы и освобождения всех реплик
      обновляют её по очереди»). Та же транзакция держит FOR SHARE ограды. Ограничены только
      контекст клиента (срок строки, З21) и `lock_timeout` записи ограды. Ни `statement_timeout`,
      ни `idle_in_transaction_session_timeout` не заданы, у notify они не названы, а в дереве
      kacho второго параметра нет совсем.
      Отказ выглядит так. Реплика notify исчезает или отрезается сетью без RST, когда её
      транзакция уже обновила `global_daily` и не закоммитилась. Контекст клиента на сервер не
      действует: отменять запрос уже некому. База держит сеанс «idle in transaction» и замок
      строки, пока не сработает TCP keepalive сервера, а это порядка часов. Все это время:
      (1) каждый резерв каждой реплики ждёт строку, падает по своему сроку ошибкой базы, и по
      З24 это не сторож — письма нет, `Ack` нет, строку снова выдаёт следующий `Claim`, и она
      снова падает; вся установка перестаёт отправлять почту, включая класс `security`;
      (2) FOR SHARE ограды тоже остаётся взятым, поэтому запись ограды новой реплики ждёт этот
      замок, упирается в `FenceLockTimeout` и отказывает в старте. Перезапуск notify
      восстановлению не помогает, и выхода нет до истечения keepalive.
      Замер М-SDR1 показывает, что серверное ограничение снимает такой замок за заданный бюджет,
      а без него замок живёт, пока держатель не вернётся. Это тот же класс, что К1 у issue-2917
      (6fc3cae2…): единственная точка сериализации без серверного предела, у которой зависание
      одного держателя становится отказом всего флота. Нарушено arch-per-call-deadline: у вызова
      базы нет предела, независимого от жизни процесса.
    requirement: >-
      Требование выражается в форме Д26 — строкой §11 и условием к коду полосы N7. Нового
      механизма, сторожа, асинхронного пути или внешнего вызова не нужно: это параметры
      транзакций, которые уже есть.
      (1) В транзакциях резерва и освобождения (З24), а также в транзакции записи ограды
      операторы `SET LOCAL statement_timeout` и `SET LOCAL idle_in_transaction_session_timeout`
      идут первыми, до чтения ограды и до `LOCK TABLE`. Значение — константа `limits` рядом с
      `FenceLockTimeout` в §8, с доводом числа: не меньше задержки резерва М33 с запасом и не
      больше остатка срока строки. Исход по пределу у резерва уже есть — ошибка базы, не сторож,
      `Ack` нет, `notify_reserve_db_errors_total` (З24). Нового исхода не появляется.
      (2) Внести в И22 или И35: «транзакция, держащая строку `global_daily` или ограду, держит
      замки не дольше бюджета при любом состоянии своего процесса».
      (3) Держатель — integration-проба N7, имя например
      `TestReserveHolderVanishedDoesNotStallFleet`. Соседнее соединение открывает транзакцию
      резерва в форме З24, обновляет `global_daily` и замолкает, не коммитит и не закрывается.
      Резерв второй реплики в пределах бюджета получает ошибку базы — не сторож и без `Ack`.
      Резерв после бюджета проходит, а старт третьей реплики успевает записать ограду в
      `FenceLockTimeout`. Проба печатает код завершения держателя 25P03. Близнец-инъекция меняет
      один факт — снят SET LOCAL idle_in_transaction_session_timeout. Тогда резерв после
      бюджета снова падает и старт отказывает, проба красная.
      (4) Дописать этот предикат строкой в полосу N7 tasks.md.

important:
  - id: Н1
    coordinate: >-
      design.md З21 (строки 1081–1103 — крайний момент и контекст), З24 (строки 1193–1197,
      1279–1281 — освобождение), З9 (строки 574–604); приёмка Р14 (строки 1261–1264); tasks.md N3,
      N7
    finding: >-
      Контекст «с этим сроком» охватывает `ResolveSend`, резерв и SMTP до ответа на DATA. Срок
      кончается в `t_send + lease_remaining − ackMargin`. Сразу за ним должны пройти `Ack` и
      освобождение резерва: на пути, где SMTP упёрся в срок, это DEFER и освобождение. В каком
      контексте они выполняются, замысел не говорит. Если в контексте строки, то оба вызова
      падают сразу с DeadlineExceeded. В итоге `Ack` не записан, строка после конца аренды уходит
      другой реплике, и если DATA уже был принят, получается дубль. Причина дубля здесь не
      названа в Р14: там «реплика упала», а процесс жив. Освобождение тоже не выполнено, и
      резерв сетки и `global_daily` остаётся до конца окна, а в `security` это может выбрать
      DROPPED(recipient_net) для законного письма. `ackMargin = 5 с` в сумме сроков заложен
      именно под `Ack`, но контекст для него не назван.
    requirement: >-
      Условие к коду в полосах N3 и N7. (а) `Ack` выполняется в своём контексте:
      `context.WithoutCancel` от контекста строки (наблюдаемость наследуется, отмена нет) и срок
      `t_send + lease_remaining` по монотонным часам. Транзиентный отказ (UNAVAILABLE,
      DEADLINE_EXCEEDED одного вызова) повторяется в пределах этого срока, повтор идемпотентен по
      З9. (б) Освобождение выполняется в своём `context.WithTimeout` от `WithoutCancel`, а не в
      истёкшем контексте строки. Его отказ — названный исход: резерв остаётся до конца окна, в
      строгую сторону, счётчик `notify_reserve_db_errors_total` с меткой стадии. (в) Проба N3/N7:
      SMTP-узел отвечает на DATA ровно на крайнем моменте с 4xx → `Ack DEFER` записан и резерв
      возвращён. Близнец-инъекция — `Ack` и освобождение в контексте строки → `Ack` не записан,
      резерв не возвращён, проба красная. Не блокирует: дефект выражается при медленном
      ретрансляторе и лечится условием к коду без нового механизма.
  - id: Н2
    coordinate: design.md З21 (строки 1067–1080), §8 (строка 1719); tasks.md N2 (строка 112)
    finding: >-
      У вызова `Claim` и у (пере)открытия `Subscribe` к источнику своего срока нет: замысел
      задаёт сроки только внутри обработки строки. Источник, который принял соединение и завис
      (замок, пул, пауза), останавливает цикл этого источника без предела. arch-per-call-deadline
      требует свой WithTimeout на каждом peer-вызове.
    requirement: >-
      Условие к коду полосы N2. `Claim` выполняется под `context.WithTimeout` с константой notify
      и доводом числа (меньше `claimInterval` и меньше `LeaseTTL`). Открытие потока подписки
      ограничено сроком установления. Проба N2: фикстурный источник A отвечает на `Claim` после
      срока → цикл A повторяет по таймеру, а цикл источника B за это время отдаёт свои строки.
      Близнец — A отвечает в срок. Не блокирует.
  - id: Н3
    coordinate: design.md З24 (строки 1190–1197, 1329–1330); §6 (строки 1678–1680); tasks.md N7
    finding: >-
      Для освобождения резерва замысел говорит только «тем же шагом» и «по тем же правилам».
      Две вещи не названы. (а) Ключ. Резерв, сделанный в 23:59:59, освобождается после полуночи.
      Если ключ (`day`, `window_start`) вычислить заново в момент освобождения, уменьшится строка
      нового дня: она либо уйдёт в 23514 по `CHECK count >= 0`, либо отнимет чужой вклад, а
      строка резерва останется завышенной. (б) Порядок замков. Резерв берёт ограду, строки сетки
      адресата (у notice — час и сутки), затем `global_daily`. Если освобождение возьмёт
      `global_daily` раньше строк сетки, то резерв и освобождение одного адресата у двух
      исполнителей образуют цикл и получат 40P01. Инвариант не портится (40P01 у резерва — не
      сторож, у освобождения — остаток в строгую сторону), но ошибок становится больше, и их
      причину никто не назвал.
    requirement: >-
      Условие к коду N7: освобождение адресует те строки, ключи которых получены при резерве и
      хранятся в записи обработки строки у исполнителя; замки берутся в порядке резерва — сетка
      по ключу окна, затем `global_daily`. Проба N7 с конкурирующими горутинами: не меньше 4
      исполнителей резервируют и освобождают для одного адресата встречно → 40P01 = 0, счётчики
      сходятся. Второй случай — резерв на границе суток при управляемых часах, освобождение после
      неё → уменьшена строка прежнего дня, строка нового дня не тронута. Близнец-инъекция —
      ключ вычисляется при освобождении → красная. Не блокирует.

