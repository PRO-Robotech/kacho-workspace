observations_below_bar:
  - ключевая форма DSN чарта notify (`password=$(…)` без кавычек): пароль с пробелом драйвер разбирает так, что хвост пароля становится именем стартового параметра (pgconn.ParseConfig → RuntimeParams{"<хвост> dbname": …}). В порядке полей чарта (password → dbname → sslmode) имя базы поглощается, и точка отказывает «DSN не называет базу» без маркера (измерено). Если порядок полей шаблона сменится (dbname до password), хвост уйдёт серверу стартовым параметром, а отказ сервера — в журнал соединения. Пароль задаёт оператор; кавычение значения в шаблоне сняло бы класс целиком.
  - assert-shard-coverage launches(): распознаёт запуск первым элементом command/args литералом или последним сегментом литерального образа; шаблонное значение (`image: {{ include … }}`, `command: {{ toJson … }}`) не распознаётся — на дереве так записан запуск самого kacho-notify (launches(deployment.yaml, "kacho-notify") = False, измерено). Для записи kacho-notify-probe форма безопасна по Dockerfile (общий образ с ENTRYPOINT kacho-notify ⇒ шаблон пробы обязан назвать kacho-notify-probe командой), но шаблонная команда в D3 оставила бы запись неистёкшей при живом носителе, и ban #6 по notify не мерился бы. Вопрос к полосе D3, не к этой волне.
  - ветка Д85 в assert-ban6-external-isolation.py ключуется таблицей чарта notify, а Internal*-носитель домена notify — процесс пробы (D3). При развёрнутой пробе и пустой таблице домен notify получит «НЕ ВЫПОЛНИЛОСЬ» (код 2) — ложного зелёного нет (шаг конвейера не зеленеет на 2), но и меры нет; порядок D2/D3 снимает.

