findings:
  - id: SEC-W1-01
    severity: medium
    status: подтверждена (воспроизведена командой)
    key: kacho:internal/migrationchains/dsn.go:dsn-parse-error-echoes-password
    where: internal/migrationchains/dsn.go:28 (форма URL), :69 (ключевая форма); печать — services/notify/cmd/migrator/main.go:175 fail → stderr init-контейнера migrate
    sign: >
      Отказ разбора DSN в DatabaseOf несёт содержимое строки соединения. Форма URL —
      обёртка ошибки url.Parse, а она печатает исходную строку целиком, с паролем.
      Ключевая форма — имя «ключа» берётся из непокавыченного значения, поэтому
      хвост пароля с пробелом печатается как имя ключа. Соседние точки наката
      (corelib migratorrun → pgconn) тот же вход печатают с паролем, заменённым на xxxxxx.
    failure_scenario: >
      Оператор задаёт пароль базы kacho_notifyprobe/kacho_notify со знаком '%' без двух hex
      после него (URL-форма) либо с пробелом (ключевая форма — её и собирает чарт notify:
      `password=$(KACHO_NOTIFY_DB_PASSWORD)` без кавычек). Точка наката отказывает до
      соединения, и пароль (целиком либо хвостом) попадает в журнал init-контейнера — его
      читает каждый, у кого есть pods/log, без права читать Secret.
    evidence:
      - cmd: KACHO_MIGRATOR_DSN='postgres://notifyprobe:Sup3r%Secret@db:5432/kacho_notifyprobe?sslmode=require' kmig up
        out: 'Error: точка наката services/notify/cmd/migrator: DSN не разобран как URL: parse "postgres://notifyprobe:Sup3r%Secret@db:5432/…": invalid URL escape "%Se"'
      - cmd: KACHO_MIGRATOR_DSN="host=db port=5432 user=notify password=Tail0f Secret dbname=kacho_notifyprobe sslmode=require" kmig up
        out: 'Error: точка наката …: DSN не разобран: у ключа "Secret" нет `=`'
      - twin: тот же URL-вход в services/storage/cmd/migrator → "cannot parse `postgres://storage:xxxxxx@db:5432/…`"
      - build: go build -o kmig ./services/notify/cmd/migrator @2fdbc6b523a
    fix_direction: >
      Ошибка DatabaseOf не несёт ни строки DSN, ни её фрагментов (только вид отказа);
      либо имя базы берётся из разбора pgconn.ParseConfig, который маскирует пароль и
      знает обе формы. Regression-lock на уровне наблюдаемого: отказ точки наката на
      DSN с паролем-маркером в обеих формах → stderr не содержит маркера ни целиком, ни
      частью; близнец — годный DSN → цепочка выбрана.
    owner: go-implementer (internal/migrationchains, полоса D4)

