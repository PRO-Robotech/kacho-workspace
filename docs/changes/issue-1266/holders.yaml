# Точное множество требуемых держателей изменения issue-1266 — посадка эпика
# kacho#1266 в `main` продукта. Образец формы — `docs/changes/issue-2713/holders.yaml`.
#
# ЗДЕСЬ НЕ ОБЪЯВЛЕН НИ ОДИН ИСХОД. Файл называет, ЧЕМ изменение держится;
# вердикт по человеческому держателю — внешнее событие актора из
# `docs/changes/policy.yaml` §2 (сейчас pointpu) на отпечаток, названный в
# `change.yaml`. Пред-посадочные записи `reviews/pre-landing/` — записи агентов:
# они нужны автору линии, но событием роли не являются и держателя не закрывают.
#
# ЛИНИЯ ДВИЖЕТСЯ: отпечаток `change.yaml` снят 2026-10-14 (origin/1266 4c7ab49d, финальная голова); после сдвига головы
# каждая запись на прежнем отпечатке новую линию не судит (пересчёт — поле
# `remeasure` манифеста).
schema_version: 1
change_id: issue-1266

# ── ПРИМЕНИМОСТЬ РОЛЕЙ: все роли review_authority ───────────────────────────
# Перечень выведен из `review_authority` политики и сверяется в обе стороны
# `scripts/change-graph-gate/check-04-package-releases-reproduce.sh`; он же
# пересчитывает каждое освобождение на коммите, который судит.
role_applicability:

  # ── освобождены: предмета роли в изменении нет ────────────────────────────

  design-reviewer:
    status: not-applicable
    predicate_id: no-design-document-in-change
    evidence_field: design_documents_referenced
    evidence_value: 0
    evidence_command: >-
      python3 scripts/change-graph-gate/applicability.py field
      design_documents_referenced --package docs/changes/issue-1266 --rev HEAD
    why: >-
      Документа замысла изменение не называет: `design.md` в корне пакета нет,
      `hashes.design_sha256` null, а предикат набора документов эпика
      (`change.yaml`, acceptance_set_predicate) по `docs/specs/*-design.md`
      находит 0 из 7 отслеживаемых на 96695925. Граница этого числа — та же,
      что у набора приёмок: замысел, не называющий kacho#1266 и линии
      identity-own, предикату не виден. Появится замысел — поле станет 1, роль
      применима, и её вердикт даёт только событие pointpu на его отпечаток.

  db-architect-reviewer:
    status: not-applicable
    predicate_id: no-migrations-in-change
    evidence_field: migrations_touched
    evidence_value: 0
    evidence_command: >-
      python3 scripts/change-graph-gate/applicability.py field
      migrations_touched --package docs/changes/issue-1266 --rev HEAD
    why: >-
      В диффе kacho 0 путей `*/migrations/*` и `*.sql` из 715. Совместная
      пред-посадочная запись роли по двум эпикам лежит в пакете `kn-296`, где
      предмет роли есть (миграции службы доступа), и о kacho говорит то же:
      предмета нет.

  # ── применимы: предмет есть, вердикт обязателен ───────────────────────────

  acceptance-reviewer:
    status: applicable
    holder: human-acceptance
    reason: >-
      изменение называет набор из 7 приёмок (`change.yaml`, acceptance_set);
      одобрение каждой — событие роли на её отпечаток.

  class-exposure-analyst:
    status: applicable
    holder: human-class-exposure-initial
    reason: >-
      приёмки названы — первичный разбор привязан к их отпечатку. Перепроверки
      по замыслу нет: замысла изменение не называет.

  go-style-reviewer:
    status: applicable
    holder: human-post-diff-go
    reason: дифф несёт Go (сервисы, край, оснастка продукта).

  proto-api-reviewer:
    status: applicable
    holder: human-post-diff-proto
    reason: >-
      `proto_files_touched` = 3 (proto/kacho/cloud/geo/v1/ — internal_catalog_service,
      region_service, zone_service); предикат `no-proto-in-change` ложен.

  system-design-reviewer:
    status: applicable
    holder: human-post-diff-system
    reason: межсервисные рёбра края и службы доступа, сессия, отказы соседей.

  wave-reviewer:
    status: applicable
    holder: human-wave
    reason: >-
      линия собрана слияниями волн: `git rev-list --merges --count
      bac26316..4c7ab49d` = 145; предикат `no-lane-merges-in-change` ложен.

  integration-tester:
    status: applicable
    holder: [prod-required-verdict, prod-newman-e2e]
    reason: >-
      роль — владелец проб и первого прогона; отдельной человеческой записи не
      даёт, держит машинных держателей ниже.

  convergence-reviewer:
    status: applicable
    holder: human-convergence
    reason: единственная роль, выпускающая конечную запись контура.

  landing-reviewer:
    status: applicable
    holder: human-landing
    reason: >-
      применённое содержимое сверяется с одобренным после посадки; до неё исход
      держателя — «не выполнилось».

required_holders:

  # ── машинные ──────────────────────────────────────────────────────────────

  prod-required-verdict:
    kind: machine
    owner: integration-tester
    executable: >-
      CI-контекст «сводный вердикт (все проверки завершились и зелены)»
      (.github/workflows/required-verdict.yml) на запросе эпика kacho#3158
    predicate: >-
      сводный вердикт читает завершение ВСЕХ проверок запроса эпика на голове
      из `change.yaml`, а не подмножество
    evidence_coordinate: evidence/prod-required-verdict/
    producer_exists: >-
      `.github/workflows/required-verdict.yml` отслеживается на origin/main
      kacho bac26316 (`git ls-tree --name-only bac26316 .github/workflows/`).

  prod-newman-e2e:
    kind: machine
    owner: integration-tester
    executable: .github/workflows/e2e-newman.yml на запросе эпика kacho#3158
    predicate: >-
      второй эшелон — сквозные пробы края по развёрнутому, отдельно от
      unit/integration (`00-kacho-core.md#ban12-second-echelon`)
    evidence_coordinate: evidence/prod-newman-e2e/
    producer_exists: >-
      `.github/workflows/e2e-newman.yml` отслеживается на origin/main kacho bac26316.

  # ── человеческие ──────────────────────────────────────────────────────────
  # Вердикт выпускает внешнее событие актора из policy.yaml §2, подтверждённое
  # через API. События ролей на отпечаток 786cd30e… (и набора приёмок d58f0183…) опубликованы 2026-10-14 — блоки event записей ролей; исход держателя даёт гейт, не эта строка.

  human-acceptance:
    kind: human-external
    owner: acceptance-reviewer
    executable: внешнее review event на отпечаток каждой приёмки набора
    predicate: каждая приёмка набора `change.yaml` acceptance_set одобрена на текущем отпечатке
    evidence_coordinate: evidence/human-acceptance/

  human-class-exposure-initial:
    kind: human-external
    owner: class-exposure-analyst
    executable: внешнее review event на отпечаток набора приёмок
    predicate: пункты exposure приёмок разобраны и сопоставлены
    evidence_coordinate: evidence/human-class-exposure-initial/

  human-post-diff-go:
    kind: human-external
    owner: go-style-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: раскладка слоёв цела, мёртвого кода и маркеров отсрочки нет, пробы в том же изменении
    evidence_coordinate: reviews/post-diff/go-style-reviewer/

  human-post-diff-proto:
    kind: human-external
    owner: proto-api-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: контракт совместим (`buf breaking`), конвенции API соблюдены
    evidence_coordinate: reviews/post-diff/proto-api-reviewer/

  human-post-diff-system:
    kind: human-external
    owner: system-design-reviewer
    executable: внешнее review event на точный отпечаток содержимого изменения
    predicate: распределённые свойства целы, отказ соседа фейлится закрыто, лишних рёбер нет
    evidence_coordinate: reviews/post-diff/system-design-reviewer/
    distributed_surface: true

  human-wave:
    kind: human-external
    owner: wave-reviewer
    executable: внешнее review event на отпечаток собранной линии
    predicate: полосы, лежащие рядом, не решают одну задачу дважды и не отменяют правку соседа
    evidence_coordinate: reviews/wave/wave-reviewer/

  human-convergence:
    kind: human-external
    owner: convergence-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: >-
      множество ролей сверено с review_authority в обе стороны, освобождения
      опираются на зарегистрированные предикаты, записи — на текущем отпечатке
    evidence_coordinate: evidence/human-convergence/

  human-landing:
    kind: human-external
    owner: landing-reviewer
    executable: внешнее review event на посаженное содержимое
    predicate: >-
      канонический набор диффа посаженного совпадает с объявленным в
      `change.yaml` (canonical_diff_set_sha256)
    evidence_coordinate: evidence/human-landing/

# ── отличия от образца `issue-2713` ─────────────────────────────────────────
#   1. Приёмки — НАБОР документов вне корня пакета; отпечаток — набора
#      (`change.yaml`, acceptance_set_predicate).
#   2. Пред-посадочные записи `reviews/pre-landing/<роль>/` — перенос записей
#      агентов; держателей не закрывают. Запись ui-reviewer (роль вне
#      review_authority) лежит как материал, без держателя. Записи
#      proto-api-reviewer и security-auditor того же захода в публичное дерево
#      НЕ перенесены: они несут разбор незакрытых находок безопасности
#      (`security-disclosure.md`); вердикт proto-api-reviewer по посадке даёт
#      только событие роли (human-post-diff-proto).
#   3. Каталога `evidence/` пакет не несёт, как и образец: файлы кладёт тот, кто
#      снимет исход.
