approved:
  - 'Форма: ресурсы Region/Zone плоские и в линии не менялись. Новые RPC Create/Update/Delete возвращают corelib.operation.Operation (запрет #9 соблюдён), у Update есть FieldMask update_mask. Пути — /geo/v1/regions и /geo/v1/zones, {id} для Update/Delete. Upsert и Watch нет.'
  - 'Две проекции (security.md §«Инфра-чувствительные данные — ТОЛЬКО в Internal*-API»): CreatePublic*/UpdatePublic* — отдельные сообщения без infra°. GetInternal и запись infra° остаются только в Internal*-службах. На публичных сообщениях нет инфра-полей.'
  - 'Публичные мутации Region/Zone выведены по одобренной приёмке docs/specs/sub-phase-ADM-1-geo-placement-catalog-admin-acceptance.md. Её текущий отпечаток 75335edd… получил APPROVED (запись ревью приёмки 75335edd….yaml). Родительская приёмка ADM-1 admin-surface одобрена в круге 4. Расширение поверхности названо в приёмке (ban #18, вопрос безопасности).'
  - 'Права: у публичных глаголов те же permission (geo.{regions,zones}.{create,update,delete}), relation system_admin @ cluster и required_acr_min "1", что у Internal*-близнецов. Пол не дешевле. Отношение system_admin определено как [user, service_account] (kaname@3d5b02ed fga_model.fga:203), подстановочным знаком не выполняется. Записи каталога прав для обоих путей есть (gateway/internal/middleware/embed/permission_catalog.json:405–575).'
  - 'Internal*-службы остались на /geo/v1/internal/… и наружу не выведены. Новых Internal-методов линия не заводит.'
  - 'Совместимость: изменения только добавляющие (новые RPC и сообщения), снятых и перенумерованных полей нет. buf breaking против main — код 0.'
  - 'Метаданные операций (Create/Update/DeleteRegionMetadata и …Zone…) общие для обоих путей, форма одна (api-operation-shape).'

notes:
  - >-
    Пункт чек-листа роли «Admin-only ресурсы (AddressPool, мутации Region/Zone) — только в
    Internal*» и строка sec-admin-ui-rpc-internal-only в security.md устарели относительно
    одобренной приёмки ADM-1: мутации каталога теперь законно стоят на публичной поверхности
    под system_admin. Это вопрос правдивости текста оснастки и корректности ПО не
    касается, поэтому задачей не становится, а остаётся здесь (gi-find-own-issue).
    Привести формулировку к виду: «admin-глаголы на публичной поверхности — только по
    одобренной приёмке ADM-*, с тем же permission и полом, что у Internal-близнеца, без
    infra°-полей».
  - >-
    Проза комментариев в .proto английская. Предмет ban #22 — только Go. Не находка.
  - >-
    Регистрацию публичных глаголов на крае судит api-gateway-registrar и роль волны,
    а не эта запись.

