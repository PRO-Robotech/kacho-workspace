# СЛОВАРЬ ВЕРДИКТА. Событие 6156556726 несёт слово TO-CODE. Его нет ни в одном словаре:
#   - scripts/change-graph-gate/cglib/families/life.py — закрытая метка одобрения
#     APPROVED_VERDICT = "APPROVED"; «незнакомое слово одинаково не даёт опоры» (шапка модуля);
#   - cglib/families/auth.py — правило auth.verdict-mirrors-event сверяет verdict записи
#     и события ДОСЛОВНО (CG_REVIEW_VERDICT_MISMATCH);
#   - kaname .github/scripts/review-event-silence.py — санкцию несёт verdict == "APPROVED",
#     CHANGES_REQUESTED санкции не выдаёт; прочее — вне словаря.
# Поэтому verdict здесь — APPROVED, а итог роли (к-коду) — отдельное поле outcome.
