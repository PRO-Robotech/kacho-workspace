experiments:
  harness: >-
    Своё окружение для опыта, фикстуру автора не брал. Голый remote.git (-b main)
    и рабочая копия. В неё закоммичены настоящие pre-push, prepush-range.sh,
    prepush-groups.sh и install.sh выбранной ревизии, а также заглушка
    scripts/ci-local.sh. Заглушка пишет факт вызова в файл ВНЕ дерева
    (CV_CALLS) и краснеет (итог «отказов 1», код 1), если в CONTENT её дерева
    стоит DEFECT. Провязка: настоящий `bash scripts/hooks/install.sh` (rc=0),
    переходник .git/hooks/pre-push. gh подменён заглушкой exit 1. Ветки
    done-a, done-b, gone, gone2, gone3 несут по невлитому коммиту и отправлены
    до провязки. Ветки bad (CONTENT=DEFECT), good-b и good-c — локальные.
  rows:
    # ── новый хук @9b720570e604 ──
    - id: a1
      command: '(копия на красной bad) git push origin --delete done-a'
      outcome: 'rc=0 · вызовов прогонщика 0 · done-a на сервере: НЕТ · печать «отправка несёт только удаление ссылок (done-a)… проверки содержимого НЕ выполнялись» и «git ls-remote origin refs/heads/done-a   # ожидается пустой вывод»'
    - id: a2
      command: '(копия на bad) git push origin --delete done-b gone3'
      outcome: 'rc=0 · вызовов 0 · done-b: НЕТ · gone3: НЕТ · постусловие по обеим ссылкам'
    - id: b
      command: '(копия на здоровой main) git push origin :refs/heads/gone bad:refs/heads/bad'
      outcome: 'rc=1 · вызовов 1 (content=DEFECT — судилась отправляемая вершина c666ee2a, не копия) · «pre-push ОТКАЗ: локальные проверки красные» · на сервере gone остался, bad: НЕТ'
    - id: b-twin
      command: '(копия на main) git push origin :refs/heads/gone good-b:refs/heads/good-b'
      outcome: 'rc=0 · вызовов 1 (content=ok-b) · gone: НЕТ · good-b == отправленной sha · постусловие называет обе ссылки'
    - id: c
      command: '(копия на main) git push origin bad:refs/heads/bad'
      outcome: 'rc=1 · вызовов 1 (content=DEFECT) · отказ · bad на сервере: НЕТ'
    - id: c-twin
      command: '(копия на main) git push origin good-c:refs/heads/good-c'
      outcome: 'rc=0 · вызовов 1 (content=ok-c) · good-c == отправленной sha'
    - id: e-uptodate
      command: '(копия на bad) git push origin main:refs/heads/main   # main на сервере уже равен локальному'
      outcome: 'rc=1 · вызовов 1 (content=DEFECT) · «вердикт — о рабочей копии: она и есть отправляемая ревизия». git подал хуку ПУСТОЙ вход, иначе судилась бы вершина main (content=ok)'
    - id: e-manual
      command: '(копия на bad) bash scripts/hooks/pre-push origin < /dev/null'
      outcome: 'rc=1 · вызовов 1 · отказ — судится рабочая копия, как и объявляет шапка subject_tree_for_push'
    # ── база @113f3b8b591 (честный красный предмета) ──
    - id: old-a1
      command: 'тот же a1 на хуке базы'
      outcome: 'rc=1 · вызовов 1 (content=DEFECT, группы «proto go») · done-a остался на сервере — признак #2825 воспроизведён'
    - id: old-a2
      command: 'тот же a2 на хуке базы'
      outcome: 'rc=1 · вызовов 1 · done-b и gone3 остались на сервере'
    - id: old-rest
      command: 'b, b-twin, c, c-twin, e-uptodate, e-manual на хуке базы'
      outcome: 'исходы совпали с новым хуком (1/0/1/0/1/1 по rc, по 1 вызову): поведение смешанной отправки, обновления и пустого входа работа не меняет'
    # ── инъекция I1 (см. injections) под настоящим git push ──
    - id: I1-e-uptodate
      command: 'e-uptodate на хуке с I1'
      outcome: 'rc=0 · вызовов 0 · «отправка несёт только удаление ссылок () — ревизии в ней нет»: ложное утверждение'
    - id: I1-e-manual
      command: 'e-manual на хуке с I1'
      outcome: 'rc=0 · вызовов 0 · та же ложная строка; рабочая копия не судится'

injections:
  runner: 'cd <каталог ревизии> && TMPDIR=<свой> bash scripts/hooks/prepush-range-inject.sh; код — напрямую'
  rows:
    - id: own-revision
      defect: 'нет (хук и проба @9b720570e604)'
      outcome: 'rc=0 · [настоящий] ok 48 · FAIL 0 · раздел «одни удаления» ok 12'
    - id: cross-base
      defect: 'хук базы 113f3b8b591 под пробой @9b720570e604 (единственное отличие — scripts/hooks/pre-push)'
      outcome: 'rc=1 · раздел «одни удаления»: FAIL 7 · причины названы предметом: «ждали rc=0, получили rc=1», «прогонщик вызван (записей вызова 1)», «постусловия удаления… в выводе нет». Красный честный: фикстура не ломалась'
    - id: author-runs
      defect: 'автора: `if push_is_deletion_only` → `if false`'
      outcome: 'FAIL 6 — число автора воспроизведено'
    - id: author-wide
      defect: 'автора: условие «все — удаления» → «хотя бы одно удаление»'
      outcome: 'FAIL 4 (законный близнец — смешанная отправка) — число автора воспроизведено'
    - id: I2
      defect: 'моя: строка постусловия «# ожидается пустой вывод» → `:` (1 строка)'
      outcome: 'rc=1 · FAIL 2 · «постусловия удаления… в выводе нет», «постусловие смешанной отправки не называет обе ссылки»'
    - id: I3
      defect: 'моя: из печати ветви снято «проверки содержимого НЕ выполнялись» (1 строка)'
      outcome: 'rc=1 · FAIL 1 · «не сказал, что проверок не было»'
    - id: I4
      defect: 'моя: `exit 0` ветви одних удалений → `exit 1` (1 строка)'
      outcome: 'rc=1 · FAIL 2 · «ждали rc=0, получили rc=1»'
    - id: I5
      defect: 'моя: `exit 0` сразу после `set -uo pipefail` — хук, который зеленеет всегда'
      outcome: 'rc=1 · [настоящий] FAIL 31, из них в разделе «одни удаления» 8. Положительный контроль у пробы непустой: заглушка записывает вызов, и смешанная отправка требует ровно 1 вызов'
    - id: I1
      defect: 'моя: в push_is_deletion_only снят конъюнкт `[ "$push_refs_total" -gt 0 ] &&` (строка 180, 1 строка)'
      outcome: 'rc=0 · [настоящий] ok 48 из 48 · FAIL 0 · раздел «одни удаления» ok 12. Инъекция НЕ КРАСНИТ'
      why_blind: >-
        Ни один кейс пробы не подаёт хуку пустой вход. subj_run во всех
        вызовах раздела «черновик по входу» и «одни удаления» получает хотя бы
        одну строку. Настоящий хук в дереве исполняют только
        scripts/hooks/prepush-range-inject.sh:166 и :455
        (`git grep -n 'hooks/pre-push' 9b720570e604`). install-inject.sh:105
        исполняет переходник со своим хуком-меткой, а не настоящий. Держателя
        у этого конъюнкта нет нигде.

what_the_injection_drops: >-
  Каждая инъекция меняет одну строку scripts/hooks/pre-push. Число строк
  отличия проверено `diff` (по 2 строки `<`/`>` на I1–I4, одна добавленная на
  I5). Проба в инъекциях не правилась.

what_the_lawful_twin_is_silent_on: >-
  Близнец автора — «удаление плюс ненулевая вершина». Он отличает ветвь от
  дефекта «пропуск на любой строке удаления» (FAIL 4). Близнеца с другой
  стороны нет: «строк входа ноль» отличается от «одна строка удаления» ровно
  одним фактом (change-graph §6), и хук на нём обязан судить рабочую копию.
  Так объявляет правленная этой же работой шапка subject_tree_for_push: «Вершины
  нет: вход пуст (хук позван руками)… — судится рабочая копия». Опыт e-manual
  показывает, что объявленное сейчас выполняется. Держится оно только тем, что
  конъюнкт не сняли.

