what_the_double_cannot_tell_apart: >-
  Вердикт даёт заглушка прогонщика, а не scripts/ci-local.sh. Она не различает
  группы (принимает любые, в опыте всегда «proto go») и не знает третьей
  категории исхода. Для этого предмета это законно: утверждается ФАКТ вызова и
  код хука, а не исход проверок. Факт вызова заглушка пишет вне дерева, поэтому
  «не звали» не держится на печати хука. Удалённый — голый локальный
  репозиторий: сетевой обрыв и серверная защита ссылок в опыте не представлены.

masks_deductions_weakenings: >-
  Не найдено. Осмотрено: diff обоих файлов целиком. Ни одно прежнее
  утверждение пробы не снято и не ослаблено: 36 прежних плюс 12 новых дают 48,
  а сводка отказов пополнена тремя новыми условиями. Обхода, маски и вычета
  в хуке нет: KACHO_SKIP_PREPUSH и --no-verify не тронуты. Смешанная отправка
  судится по вершине (опыты b, b-twin).

guard_single_instance: >-
  Пункт (г) задания — не заявлен, опыт не ставился. Стража влитости удаляемой
  головы в хуке нет. `grep -nE 'is-ancestor|merge-tree|merge-base'` по коду
  scripts/hooks/* находит одно вхождение, prepush-range.sh:79, и это выбор базы
  диапазона. `_remote_sha` в цикле входа отбрасывается. Решение не стеречь
  записано в шапке ветви (pre-push:168–175) с доводом. #2825 оставляет его
  исполнителю: «Вводить ли её, решает исполнитель, но в дереве остаётся один
  ответ». Опыт a1 удаляет невлитую голову (done-a с собственным коммитом),
  rc=0 — это следствие решения, наблюдается как объявлено.

premise:
  statement: 'отправка одних удалений запускала прогонщик над рабочей копией и отвергалась на красной копии'
  status: подтверждена
  command: 'old-a1 / old-a2 выше: rc=1, вызовов 1, content=DEFECT, ссылки остались на сервере'

adjacent_observation: >-
  Не предмет #2825 и не основание возврата. Отправка без изменений (e-uptodate)
  на базе и на новом хуке судит рабочую копию и отвергается на красной копии.
  Хук при этом печатает «вердикт — о рабочей копии: она и есть отправляемая
  ревизия», хотя отправляемой ревизии нет. Класс тот же, что у #2825: отправка
  без ревизии судится копией.

return_demand: >-
  Повторить опыт I1 и показать красное. В пробу добавить близнеца «пустой
  вход» — subj_run из копии на красной ревизии со входом "", ожидается: прогонщик
  вызван 1 раз, rc=1, строки «только удаление ссылок» нет. Добавить третий
  воссоздаваемый дефект со снятым конъюнктом `[ "$push_refs_total" -gt 0 ]`,
  который обязан дать хотя бы один провал, а в сводке ОТКАЗ на «н/д» и на ноль,
  как у двух дефектов автора. Если автор решит, что пустой вход тоже выходит
  нулём (так закрылось бы и adjacent_observation), в дереве всё равно остаётся
  один ответ. Шапка subject_tree_for_push правится тем же изменением, а ответ
  держится пробой с инъекцией в обе стороны.

