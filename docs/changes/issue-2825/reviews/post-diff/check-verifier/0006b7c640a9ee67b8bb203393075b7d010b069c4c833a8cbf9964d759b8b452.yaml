verdict_basis: >-
  Всё, что требовалось заданием, выполнено и показано настоящим `git push` в
  одноразовый голый удалённый репозиторий: (а) одни удаления проходят без
  проверок содержимого, (б) удаление вместе с вершиной, несущей дефект,
  отвергается, (в) обновление с дефектом без удаления отвергается. Числа автора
  воспроизведены все. Пять из шести моих одно-фактных дефектов проба
  краснит. Возврат дан по шестому: снятие конъюнкта
  `[ "$push_refs_total" -gt 0 ]` в push_is_deletion_only проба не видит —
  rc=0, 48 ok из 48, 0 FAIL. Этот конъюнкт — единственное, что отличает
  «все строки входа — удаления» от «строк нет» (утверждение «для всех» на
  пустом множестве истинно). Внесён он той же работой, а держит его только
  внимание. Хук с этим дефектом на пустом входе отвечает «только удаление
  ссылок ()», rc=0, прогонщик не зовёт. Пустой вход — не только ручной вызов:
  git сам подаёт хуку пустой вход, когда отправка ничего не меняет (опыт
  e-uptodate ниже).
