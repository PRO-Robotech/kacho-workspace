what_the_lawful_twin_is_silent_on: >-
  Близнецов два, с обеих сторон ветви. Первый: «удаление плюс ненулевая вершина»,
  его ловит дефект «глотает смешанную» (4). Второй, новый: «строк входа ноль», его
  ловит дефект «пустого» (5) и I7 (4). У настоящего хука молчат оба (18/0). Законная
  перестановка формы условия у настоящего хука тоже молчит (54/0). Её видит только
  самопроверка воссоздания, и видит громко: «н/д» и ОТКАЗ.

what_the_double_cannot_tell_apart: >-
  Вердикт даёт заглушка прогонщика, а не scripts/ci-local.sh. Она не различает
  групп и не знает третьей категории исхода. Для предмета это законно: утверждаются
  факт вызова, записанный вне дерева, и код хука. Фикстура пробы не различает
  пустой вход в ноль байт и вход из одного перевода строки (F-nl): хук их
  нормализует. Поэтому то, что git действительно подаёт ноль байт, держится замером
  stdin-bytes, а не пробой. Удалённый репозиторий — голый локальный: сетевой обрыв
  и серверная защита ссылок не представлены.

