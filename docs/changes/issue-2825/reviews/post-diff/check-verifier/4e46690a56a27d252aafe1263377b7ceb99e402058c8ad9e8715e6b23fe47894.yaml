git_push_experiments:
  harness: >-
    Своё окружение, фикстура автора не бралась. Голый remote.git (-b main) и клон.
    GIT_CONFIG_GLOBAL=/dev/null, GIT_CONFIG_NOSYSTEM=1, gh подменён заглушкой с exit 1.
    Закоммичены настоящие pre-push, prepush-range.sh, prepush-groups.sh и install.sh
    ревизии и заглушка scripts/ci-local.sh. Заглушка пишет факт вызова в файл ВНЕ
    дерева и краснеет, если services/CONTENT содержит DEFECT. Провязка настоящим
    `bash scripts/hooks/install.sh` (rc=0 во всех трёх прогонах). done-a, done-b, gone,
    gone2 и gone3 несут по невлитому коммиту и отправлены до провязки. bad
    (CONTENT=DEFECT), good-b и good-c — локальные ветки.
  rows:
    - id: new@9c3b89d7c2a
      outcome: >-
