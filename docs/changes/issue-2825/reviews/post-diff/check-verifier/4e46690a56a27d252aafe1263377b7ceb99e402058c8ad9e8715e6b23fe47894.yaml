        НЕ выполнялись» и «git ls-remote origin refs/heads/done-a   # ожидается пустой вывод».
        a2 rc=0 · 0 вызовов · done-b и gone3 сняты.
        b rc=1 · 1 вызов, content=DEFECT (судилась вершина) · gone остался, bad нет.
        b-twin rc=0 · 1 вызов, content=ok-b · gone снят, good-b совпадает с отправленной sha.
        c rc=1 · 1 вызов · bad нет.
        c-twin rc=0 · 1 вызов · good-c совпадает с отправленной sha.
        e-uptodate (из копии на bad: git push origin main:refs/heads/main) rc=1 · 1 вызов, content=DEFECT · печать «вердикт — о рабочей копии как есть: вход git не назвал ни одной вершины, отправляемой ревизии хук не видел».
        e-manual (bash scripts/hooks/pre-push origin < /dev/null) rc=1 · 1 вызов · та же печать.
    - id: base@113f3b8b591
