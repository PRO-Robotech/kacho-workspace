  предметом; это подавление линтера, а не ослабление пробы).

verdict: accepted            # ✅ принято
blocks_landing: false
verdict_basis: >-
  Опыты кругов 1 и 2 дают требуемый исход. (а), (а') и (а'') краснеют, законный
  близнец молчит. 200 прогонов под посторонним дали 0 красных при 2,14 млн
  запросов и 0 ответов. Пустой обход не зеленит, инъекции в оснастку краснеют,
  маски и вычета нет. E1 D+S теперь краснеет 10/10. На всех 81 месте класса
  в 58 файлах посторонний, знающий только порт (HTTP, TLS, h2c, повтор, обход
  методов gRPC), не соединился ни разу, вердикты равны контролю. В состоянии до
  правки тот же посторонний доходит до 79 мест из 80 и красит 29 файлов.
  Сводка по требованиям круга 2 (repeat_to_accept): (1) оба места переведены,
  E1 — выше; (2) перепись знает форму close, числа совпали с моей переписью;
  (3) 17 сырых дублёров переведены на Listen; (4) doc-комментарий исправлен.
