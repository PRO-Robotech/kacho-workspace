unit_of_count: >-
  Прогон — один процесс тестового бинаря пакета (go test -c, CGO_ENABLED=0,
  -test.short -test.count=1 -test.v). Красный прогон — код выхода ≠ 0. Подпроверки
  считаются по строкам '=== RUN' и '--- PASS|FAIL|SKIP'. Место класса — вызов
  конструктора в *_test.go, имя — файл:строка. «Дошёл» значит, что слушатель
  принял соединение, чей адрес источника совпал с адресом соединения постороннего.

experiments:
  - name: контроль @7a5ca5dd, 24 пакета (23 пакета мест класса и privateloopback)
    outcome: >-
      rc=0 у 23 пакетов. deploy даёт 8 FAIL и в контейнере, и на хосте;
      причина — окружение контейнера: там нет helm, а git отвечает
      «error obtaining VCS status: exit status 128». На хосте deploy — rc=0,
      861/861 PASS. jwks — 173/173, privateloopback — 6/6.
  - name: (а) необъявленный издатель оплачивается GET по ОБЪЯВЛЕННОМУ адресу записи
    outcome: >-
      КРАСНЕЕТ: rc=1, 11 FAIL. :135 ×8 «Should be zero, but was 1 / издатель без
      объявленной записи не оплачивается обращением к источнику», плюс :96 и :219.
  - name: (а') тот же дефект, GET к хосту источника по выведенному адресу (origin + /.well-known/jwks.json)
    outcome: КРАСНЕЕТ, 11 FAIL на тех же строках.
  - name: (а'') тот же дефект, путь из iss на хосте источника
    outcome: >-
      КРАСНЕЕТ, 9 FAIL (:135 ×6, :96, :219). Две подпробы («разметка» и «пробелы»)
      не упали, потому что моя форма дефекта пропускает iss, который не разбирается
      как URL.
  - name: (б) законный близнец под (а')
    outcome: >-
      МОЛЧИТ. PASS: «положительный контроль: издатель из перечня резолвится»,
      четыре законных сочетания F1_42, TestKeySetCountsEveryArrivalAtItsAddress…,
      положительный контроль DegenerateRecord. Красные — только три пробы F1_46.
  - name: инъекция в оснастку — свой адрес = 127.0.0.1
    outcome: >-
      jwks: 1 FAIL, предпосылка f1_harness_attribution_test.go:39. privateloopback:
      6/6 FAIL (:105 ×3, :196, а также новая проба Listen на :142).
  - name: инъекция в оснастку — счёт сужен по пути «/»
    outcome: КРАСНЕЕТ, 1 FAIL на f1_harness_attribution_test.go:63.
  - name: пустой обход — ks.fetches.Add снят
    outcome: НЕ зеленит, 4 FAIL (attribution :63, f1_refetch_test.go :35, :64, :85).
  - name: (в) 200 прогонов jwks @7a5ca5dd под посторонним, знающим только порт
    command: >-
      load.sh: 50 раундов × 4 параллельных прогона. Шум cvnoise -mode port:
      4 потока по всем LISTEN из /proc/net/tcp{,6} на 127.0.0.1:<порт>, http и
      https, пути «/», «/keys-stale», «/.well-known/jwks.json».
    outcome: >-
      200 из 200 rc=0. 34600 PASS (200 × 173), 0 FAIL, 0 SKIP. Шум отправил
      2139366 запросов, ответов 0.
  - name: положительные контроли шума
    outcome: >-
      113f3b8b, тот же шум по порту: 20 из 20 красные (:135 ×152, f1_keyid_test.go:58
      ×158), ответов 13616. 7a5ca5dd, шум по адресу целиком: 20 из 20 красные
      (:135 ×174), ответов 13872.
  - name: E1 — jwt_verifier_fetch_lock_test.go:28, по 10 прогонов
    outcome: >-
      Без инъекций — 10 PASS. D (запись под c.mu держится через httpClient.Do) —
      10 FAIL (:63 «FetchedAt() blocked during an in-flight JWKS fetch»). S
      (посторонний по 127.0.0.1:<порт> спрашивает «/» раньше продукта) — 10 PASS.
      D+S — 10 FAIL (на 86429336 было 10 PASS). D+S, если посторонний знает адрес
      целиком, — 10 PASS. D+S в состоянии общего адреса — 10 PASS.
  - name: место класса — посторонний по порту на КАЖДОМ месте @7a5ca5dd (наложение на privateloopback.Listen)
    command: >-
      Посторонний с каждого места стучит по 127.0.0.1:<порт>: синхронно до
      возврата Listen, затем в фоне каждые 2 мс. Формы: GET/POST «/», TLS GET,
      преамбула h2c. Кроме того, повтор запроса продукта байт в байт; для h2c
      повтор синхронный, до передачи запроса продукту.
    outcome: >-
      Покрыто 81 место из 81 в 58 файлах. 80 мест — в контейнере, пять раундов:
      609 экземпляров слушателя за раунд, 73401–75588 наборов номера,
      соединилось 0, дошло 0. Вердикты совпадают с контролем во всех раундах,
      набор 8 FAIL у deploy тот же. Место revoke_e2e_test.go:165 — на хосте:
      20 наборов, соединилось 0, PASS.
  - name: место класса — тот же посторонний по адресу целиком (положительный контроль)
    outcome: >-
      Дошёл до 75 мест из 76 обойдённых: 316427 прибытий. Красные: 10 пакетов
      (e2e 8, handler 6, middleware 29, jwks 42, zot 4, nlb vpc 2, terraform client 2,
      api-gateway 2, deploy +1). terraform/provider — rc=2, в дублёре
      «concurrent map writes». revoke_e2e:165 — FAIL «expected: 3, actual: 17».
  - name: место класса — состояние до правки (сервер на 127.0.0.1), посторонний по порту, по одному файлу
    outcome: >-
      Без постороннего все пакеты зелёные, кроме предпосылки attribution :39 —
      это ожидаемо. С посторонним на местах одного файла краснеет 29 файлов из 57
      сверх контроля, из них terraform datasources — падением. 28 файлов мои
      формы постороннего не сдвигают.
  - name: место класса — посторонний, говорящий gRPC, на 17 местах Listen (15 файлов)
    command: >-
      Посторонний с адреса 127.0.0.2 вызывает КАЖДЫЙ унарный метод из реестра
      дескрипторов бинаря пустым сообщением. Соединения продукта придерживаются,
      пока обход не кончится. Затем живые методы вызываются в фоне.
    outcome: >-
      До правки краснеют 4 файла: iam_authorize_client ×3 «expected 1 actual 2»,
      authz_e2e ×2, cancel_authorizes_before_mutating ×3 («backend Cancel must not
      be invoked … got 1 call(s)»), nlb vpc ×13. @7a5ca5dd: 17 мест, 168
      экземпляров, соединилось 0, дошло 0, все 15 файлов зелёные.
  - name: оставшиеся на общем адресе серверы httptest (наложение на GOROOT net/http/httptest)
    outcome: >-
      Обойдено 46 мест из 47. Сорок седьмое — близнец privateloopback_test.go:72,
      его пакет исключён намеренно. Посторонний дошёл до 43 мест, 22705 прибытий.
      Вердикт не сдвинулся ни в одном из 17 пакетов.
  - name: -race в контейнере
    outcome: >-
      go test -race -short: ok у privateloopback, jwks, gateway/middleware,
      opsproxy, gateway/clients, nlb/clients/vpc.
  - name: подавление #nosec G112 (privateloopback.go:92)
    outcome: >-
      С -track-suppressions gosec показывает G112 на :92 подавленной, с
      justification «сервер пробы, литерал httptest», то есть у подавления живой
      предмет. Со снятой строкой #nosec — находка G112 MEDIUM на :92, rc=1.
      gosec здесь — локальная сборка dev, а пин конвейера — v2.28.0.
  - name: (г) маска, вычет, ослабление
    outcome: >-
      Дифф 113f3b8b..7a5ca5dd. Снятых строк-утверждений 17, и все они — проверки
      ошибки net.Listen: снято 17 net.Listen, добавлено 17 privateloopback.Listen,
      а Listen сам зовёт tb.Fatalf. Добавлено утверждений 36. t.Skip,
      testing.Short и t.Parallel в добавленных строках не встречаются. httptest.New*
      снято 64, privateloopback.New* добавлено 64. Счёт полон, поле foreign не
      вернулось. Вне *_test.go privateloopback не импортирует никто.

