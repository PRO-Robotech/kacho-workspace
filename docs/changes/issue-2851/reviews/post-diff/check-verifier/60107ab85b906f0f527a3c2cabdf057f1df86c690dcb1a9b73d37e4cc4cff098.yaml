fake_does_not_distinguish: >-
  Сервер на своём адресе петли не отличает постороннего, знающего адрес целиком,
  от проверяемого: в режиме адреса целиком красных 10 пакетов, а E1 D+S даёт
  10/10 PASS, то есть ложное зелёное. Вне Linux при откате на 127.0.0.1
  прежнее неразличение возвращается в обе стороны; doc-комментарий теперь говорит
  об этом прямо. 19 сырых слушателей на общем адресе постороннего от меня не
  получали: наложение на пакет net недоступно из-за кольца импорта. Их судят
  перепись автора (BLIND 12, silent 5, dynamic 2) и моё чтение двух из них
  (nlb/clients/compute testsupport_test.go:26, opsproxy/proxy_test.go:49: дублёры
  без записи вызовов).

