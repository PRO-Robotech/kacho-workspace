subject: >-
  #2851: серверы проб, которые считают прибытия, переведены с общего 127.0.0.1 на
  собственный случайный адрес петли (internal/privateloopback). Круг 3 добавил
  17 сырых слушателей (gRPC-дублёры) на privateloopback.Listen, ещё 5 серверов
  httptest (в том числе jwt_verifier_fetch_lock_test.go и blob_scope_internal_test.go)
  на privateloopback.NewServer. NewUnstartedServer больше не занимает порт на общем
  адресе. Появилась проба TestStrangerKnowingOnlyThePortIsNotAcceptedByListen.
  Doc-комментарий об откате вне Linux исправлен. В литерале http.Server стоит
  подавление #nosec G112.
