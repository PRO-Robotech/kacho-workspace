experiments:
  - name: контроль на коммите и на родителе, тихо
    command: post.test / pre.test -test.short -test.count=1 -test.v
    outcome: >-
      2413184a: rc=0, 173 RUN · 173 PASS · 0 FAIL · 0 SKIP;
      113f3b8b: rc=0, 172/172. Разница множеств имён — ровно +1
      TestKeySetCountsOnlyArrivalsAtItsDeclaredAddress; ни одна проба не снята.
  - name: (а) одно-фактный дефект — необъявленный издатель оплачивается обращением по ОБЪЯВЛЕННОМУ адресу источника
    injection: >-
      verifier.go, ветка !ok после v.records[claims.Iss]: GET r.url по каждой
      записи, затем прежний отказ
    outcome: >-
      КРАСНЕЕТ на обоих коммитах: rc=1, 11 FAIL — DeclaredIssuerIsAnUntrustedInput
      (:135 ×8, «Should be zero, but was 1 / издатель без объявленной записи не
      оплачивается обращением к источнику»), IssuerWithoutADeclaredRecord (:96),
      RecordIsChosenByExact (:219).
  - name: (а') тот же дефект, обращение к ХОСТУ источника по выведенному адресу (origin записи + /.well-known/jwks.json)
    outcome: >-
      113f3b8b: КРАСНЕЕТ (11 FAIL, :135 ×8, :96, :219).
      2413184a: МОЛЧИТ — rc=0, 173/173 PASS. Обращения продукта дошли до
      источников и списаны в foreign: 18 прибытий в журнале, из них 2 — свои
      запросы пробы атрибуции, 16 — обращения продукта.
  - name: (а'') тот же дефект, путь из объявленного издателя становится частью адреса на хосте источника
    outcome: >-
      113f3b8b: КРАСНЕЕТ (11 FAIL). 2413184a: МОЛЧИТ — rc=0, 173/173,
      те же 16 обращений продукта списаны в foreign. Заголовок
      DeclaredIssuerIsAnUntrustedInput обещает «ни частью адреса», заголовок
      RecordIsChosenByExact — «обращение по выведенному адресу»; после правки
      оба свойства на хосте источника не наблюдаются.
  - name: (б) законный близнец — объявленный издатель, под дефектом (а)
    outcome: >-
      МОЛЧИТ: «положительный контроль: издатель из перечня резолвится» PASS,
      F1_42 законные сочетания PASS, TestKeySetCounts… PASS; красные — только
      три пробы F1_46.
  - name: инъекция в оснастку — постороннее прибытие пишется ещё и в счёт проверяющего
    outcome: >-
      TestKeySetCountsOnlyArrivalsAtItsDeclaredAddress КРАСНЕЕТ на
