fake_does_not_distinguish: >-
  keySet после правки не различает «обращение ПРОДУКТА к хосту источника по
  адресу, отличному от объявленного» и «прибытие постороннего на тот же порт»:
  оба уходят в foreign, который не утверждается. До правки первое считалось.
  Прежнее и не изменённое: обращение к хосту, не являющемуся источником пробы,
  серверным счётчиком не видно вовсе.

