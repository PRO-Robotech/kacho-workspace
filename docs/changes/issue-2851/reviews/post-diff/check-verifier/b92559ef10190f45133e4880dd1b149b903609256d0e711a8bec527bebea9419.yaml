fake_does_not_distinguish: >-
  Сервер на собственном адресе петли не отличает постороннего, знающего адрес
  целиком, от проверяемого: такой звонящий засчитывается (опыт с общим шумом —
  40/40 красных). Практически такого звонящего нет: адрес случайный в 127/8 и не
  совпадает с 127.0/16. На не-Linux откат на 127.0.0.1 возвращает прежнее
  неразличение. Вопреки doc-комментарию пакета («только в сторону лишнего
  красного») оно даёт и ложное зелёное: опыт E1 в состоянии общего адреса
  зеленит D+S.

