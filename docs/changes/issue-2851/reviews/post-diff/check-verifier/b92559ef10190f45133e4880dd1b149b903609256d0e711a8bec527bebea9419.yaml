verdict_basis: >-
  Опыты круга 1 теперь дают нужное: (а), (а') и (а'') краснеют, законный близнец
  молчит, 200 прогонов под посторонним — 0 красных, пустой обход не зеленит, маски
  и вычета нет. На 40 файлах правки посторонний не дошёл ни до одного сервера.
  Возврат — из-за заявления о классе «осталось 2». Перепись автора не знает формы
  close(ch). На месте jwt_verifier_fetch_lock_test.go:27 тот же посторонний, что и
  в #2851, делает пробу зелёной на неисправном продукте (E1: D+S 10/10 PASS, D
  10/10 FAIL). Doc-комментарий privateloopback утверждает, что откат ошибается
  только в сторону лишнего красного; E1 это опровергает.
repeat_to_accept: >-
  На следующем коммите: (1) перевести jwt_verifier_fetch_lock_test.go:27 и
  blob_scope_internal_test.go:147 на privateloopback. (2) Добавить в перепись
  форму close(ch) и назвать число. (3) Про 32 места net.Listen на 127.0.0.1:0
  одно из двух: перевести дублёры с точным счётчиком на privateloopback.Listen или
  завести предмет с причиной и предикатом снятия. (4) Исправить doc-комментарий об
  откате. Повторить те же опыты: E1 D+S обязан краснеть, (а)/(а')/(а'') —
  краснеть, близнец — молчать, 200 прогонов под посторонним — 0 красных, стук
  постороннего по 40+ файлам — 0 ответов.
