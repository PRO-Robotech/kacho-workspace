  - id: C1-residual
    class: fix-class-not-instance / recognizer-knows-all-lawful-forms (testing.md)
    what: >
      The census only knows the httptest.New*Server constructor. Loopback servers built on a raw
      net.Listen("tcp", "127.0.0.1:0") plus grpc Serve are outside what it observes. Their fakes
      count calls or keep the last arrival, and asserts sit on those values. The commit message
      says "Серверов петли, наблюдающих прибытия на общем адресе ... осталось 2". The measured
      number is higher.
    measured: >
      Raw listeners in *_test.go @86429336: 35 (33 on the literal 127.0.0.1:0, 2 via freeAddr).
      At least 11 of them, in 10 files, host a fake that observes arrivals and is asserted. This
      count is a lower bound from reading, not a full AST count.
      gateway/internal/e2e/authz_e2e_test.go:100 (calls: Zero :253 :271 :289, Equal :341);
      gateway/internal/clients/iam_authorize_client_test.go:68 (Equal :116 :173) and :185 (Equal :209);
      gateway/internal/opsproxy/cancel_authorizes_before_mutating_test.go:53 (cancelCalls !=0 :90 :112, !=1 :138);
      gateway/internal/opsproxy/cancel_by_non_creator_lane_test.go:171 (!=0 :225, !=1 :252);
      gateway/internal/opsproxy/timeout_test.go:60 (getHadDL/cancelHadDL capture);
      gateway/internal/e2e/f1b_two_issuer_e2e_test.go:248 (grpcPrincipal last-arrival, read :557 :559;
      the REST half of the same stand at :238 was moved to privateloopback, the gRPC half was not);
      services/compute/cmd/compute/principal_extract_integration_test.go:64 (observedPrinc/handlerInvoked);
      services/compute/internal/check/check_client_propagation_test.go:50 (lastReq/lastMD);
      services/vpc/internal/check/check_client_propagation_test.go:55 (lastReq/lastMD);
      services/registry/internal/clients/iam/iam_client_test.go:61 (lastReq).
    experiment: >
      go test -overlay, lane tree unchanged (status --porcelain 0). The stub is the tree's
      startStubServer (iam_authorize_client_test.go:66). A gRPC client that knows only
      127.0.0.1:<port> calls Check. Result: "Should be zero, but was 1". Twin: the same stub on
      privateloopback.Listen(t). The stranger does not reach it, and a lawful caller at the full
      address is counted (Equal 1). Probe:
      /home/dk/.cache/go-style-2851-r2/ovl/stranger_grpc_probe_test.go
    requirement: >
      Extend the census to the raw-listener constructor form, i.e. net.Listen / tls.Listen on
