style:
  - internal/privateloopback/privateloopback_test.go:83-92. The factory closures capture the parent t. On failure, Fatalf goes to the parent from the subtest goroutine (FailNow from another goroutine). Take func(testing.TB, http.Handler) and pass the subtest's t.
  - 'internal/privateloopback/privateloopback.go:73-76. httptest.NewUnstartedServer binds 127.0.0.1:0 and the listener is closed right away. Build &httptest.Server{Listener: l, Config: &http.Server{Handler: h}} directly, without taking a shared port.'
  - 'internal/privateloopback/privateloopback.go:50-53,123-143. The retry on EADDRNOTAVAIL never changes the outcome: when the platform does not hand out a 127.x address, it does not hand out any of them. The comment "на случай, который сам по себе редок" names no case. Either name the case or remove the loop (arch-lean-no-vestigial).'
  - internal/privateloopback/privateloopback.go:77-82. A certificate (ECDSA keygen) is issued for every server, including the 57 plain Start() ones. Issuing it lazily is not possible without a StartTLS wrapper. Non-blocking.

