critical:
  - id: C1-residual-front
    class: fix-class-not-instance. The observing server is behind a front, and the front is on the shared address.
    where: gateway/internal/e2e/authz_e2e_test.go:170
    what: >
      buildE2E moved the counting AuthorizeService stub (authzStub.calls, :75) to privateloopback.Listen
      (:100). The front that calls it is still ts := httptest.NewServer(handler) on 127.0.0.1. A client that
      knows only the port reaches the front, the middleware calls Check, and the stub counts that call as if
      it came from the probe. This is the same "one half of the stand" shape as f1b_two_issuer_e2e_test.go,
      where both halves (REST front :237 and gRPC :247) were moved. Here only the gRPC half was moved.
      Asserts on the counter reachable this way: :196 GreaterOrEqual 1 (can false-green), :252, :270, :288
      Zero, :318 LessOrEqual 1, :340 Equal 2. buildE2E has 12 callers, all in that file.
    measured: >
      go test -overlay, lane tree unchanged (status --porcelain 0). The probe is
      /home/dk/.cache/go-style-2851-r3/ovl/front_stranger_probe_test.go. A stranger sends
      GET 127.0.0.1:<ts port>/vpc/v1/networks/enp_x in the probe's own request shape, and the result is
      "Should be zero, but was 1". Twin: the same handler and stub behind privateloopback.NewServer. There
      the stranger is not counted and the lawful caller at the full address is (Equal 1, PASS).
    claim_false: >
      The dabad7fb message says "стало: на общем адресе наблюдает 1 — законный близнец пробы помощника".
      The measured count is two lawful twins (privateloopback_test.go:72 and :132) plus this front.
    requirement: >
      Put the front on privateloopback.NewServer(t, handler) at authz_e2e_test.go:170. In the new commit,
      state the corrected number and how fronts were enumerated. Arrivals at a front reach the observer over
      a network hop, which an AST cannot follow. I enumerated fronts by reading every shared-address server
      that sits in the same test composition as an observing privateloopback server: 53 co-located sites,
      and only one of them is a front.

