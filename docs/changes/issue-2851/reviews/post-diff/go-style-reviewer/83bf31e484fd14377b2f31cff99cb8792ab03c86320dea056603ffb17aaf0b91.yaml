premise: >-
  Подтверждена экспериментом. Механизм, который назван в коммите, существует:
  до правки счётчик засчитывал любое прибытие на порт. Проба свойства способна
  покраснеть: при инъекции «постороннее прибытие засчитывается как обращение»
  (через go test -overlay, дерево не тронуто) она падает на
  f1_harness_attribution_test.go:53 с «Should be zero, but was 2», а предпосылка
  :51 при этом держится. Законный близнец (обращение по объявленному адресу)
  засчитывается.

critical:
  - id: C1
    class: fix-class-not-instance (testing.md §«Гейт на класс»; measurement-discipline §4 «Радиус»)
    coordinates:
      - services/registry/internal/clients/jwks/f1_revocation_test.go:44   # authority.asked: Zero на :286, Equal на :224 :230 :237 :293
      - services/registry/internal/clients/jwks/verifier_test.go:87         # jwksServer.fetch: точные Equal на :363 :379 :391 :407 :417 :433 :452 :472 :523 :553
      - services/registry/internal/clients/jwks/f1_keyid_fuzz_test.go:44    # fetches: «grew > 1» на :106
      - gateway/internal/middleware/f1b_harness_test.go:56                  # ks.Requests++ (неатомарно): «!= 0» на f1b_issuer_binding_test.go:100 :118
    finding: >-
      Механизм, из-за которого F1_46 давала ложный красный, починен в одной
      оснастке, а по дереву он остаётся. Это счётчик на сервере петли, который
      засчитывает каждое прибытие и на котором стоит утверждение «ноль» или
      точное число. В том же пакете так устроены authority, jwksServer и сервер
      фаззинга. Двойник в gateway, f1b_harness_test.go, держит то же свойство
      привязки к издателю, что и F1_46. Эксперимент через overlay: прибытие на
      корень порта увеличивает authority.asked и jwksServer.fetch на 1. Число
      вхождений ни в коммите, ни в возврате не названо, коммит говорит только
      «F1-46 и соседние». Пакет прогоняется в хуке отправки целиком, поэтому
      следующее постороннее прибытие на порт authority опять покрасит тот же
      шаг, а повторять отправку до зелёного запрещено.
    requirement: >-
      Прочесать дерево по механизму: сервер httptest, счётчик прибытий, а на нём
      Zero, точный Equal или «рост > N». Перечислить законные формы записи:
      HandlerFunc, именованный обработчик, mux, TLS. Число назвать до правки и
      починить все вхождения, на которых стоит утверждение, чувствительное к
      лишнему прибытию. Утверждения вида Positive и GreaterOrEqual к лишнему
      прибытию невосприимчивы: их назвать и оставить. Счёт этой записи дан одним
      выражением (grep -A3 по `httptest.New*Server(http.HandlerFunc` вместе с
      `.Add(1)|++`): 18 файлов, из них 4 в пакете jwks сверх исправленного. Это
      нижняя граница, а не перепись. Правка каждого вхождения должна нести
      свою инъекцию, как её несёт проба атрибуции.

important:
  - id: I1
    coordinate: services/registry/internal/clients/jwks/f1_harness_test.go:87
    finding: >-
      Атрибуция сделана по точному равенству пути (`r.URL.Path != ks.path`).
      Поэтому обращение по пути, производному от объявленного, записывается в
      foreign, а не в fetches. Эксперимент: GET ks.url()+"/our-1" даёт
      fetches=0, foreign=1. Утверждения «обращений ноль» (f1_keyid_test.go:58,
      f1_token_checks_test.go:119, f1_issuer_binding_test.go:96 :97 :135 :219)
      такое обращение больше не видят, а foreign только печатается в журнал.
      Охват узкий: если производный путь строится всегда, это ловят
      положительные контроли, потому что набор по чужому пути отдаёт 404. Но
      оснастка стала снисходительнее, чем была.
    requirement: >-
      Засчитывать проверяющему каждое прибытие, в пути которого есть
      объявленный случайный маркер (префикс ks.path; маркер фиксированной длины,
      и совпадение с чужим невозможно), и отвечать 404 на любой путь, кроме
      точного. В foreign считать только прибытия без маркера. В
      TestKeySetCountsOnlyArrivalsAtItsDeclaredAddress добавить третий случай:
      прибытие по пути, производному от объявленного, засчитывается проверяющему.
      То же различение применить в C1.

