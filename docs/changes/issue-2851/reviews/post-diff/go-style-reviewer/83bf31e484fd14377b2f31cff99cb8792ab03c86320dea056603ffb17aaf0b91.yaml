style:
  - id: S1
    coordinate: services/registry/internal/clients/jwks/f1_harness_test.go:115
    note: >-
      t.Cleanup выполняется в обратном порядке, поэтому журнал foreign
      печатается ДО ks.srv.Close, а прибытия между ними в счёт не попадают.
      Регистрировать журнал раньше Close: Close дожидается обработчиков в полёте.
  - id: S2
    coordinate: services/registry/internal/clients/jwks/f1_harness_attribution_test.go:43
    note: >-
      Лучше t.Context() (в go.mod стоит go 1.26.0) и ks.srv.Client() вместо
      context.Background() и http.DefaultClient. У DefaultClient нет предела и
      есть прокси из окружения. Сейчас это совпадает с формой пакета, посадку
      не блокирует.

