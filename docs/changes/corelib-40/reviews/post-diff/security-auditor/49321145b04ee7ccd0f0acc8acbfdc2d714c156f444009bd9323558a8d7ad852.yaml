surface_answers:
  pkce_mandatory: >-
    Держится тремя независимыми линиями церемонии, движок идёт четвёртой.
    (1) requireProofKey в Authorize, до согласия, и в CompleteAuthorization, до выпуска кода
    (ceremony.go:571, :615). Судья один, bindingDefect: вызов обязателен, метод только S256,
    вызов 43 знака base64url, каждое поле ровно один раз. (2) codeRecordFromRequester при
    записи: негодная привязка в хранилище не уезжает (translate.go:295-304). (3) bindingDefect
    на выборке живого кода, иначе ErrPortContract (bridge.go:244-246). В движок привязка
    приходит только из ProofKey записи (requesterFromCode, translate.go:311-321), так что
    ветка validateNoPKCE движка на подключённом пути недостижима. GetPKCERequestSession по
    невыбранному коду отвечает misuse, а не ErrNotFound (bridge.go:548-553).
  plain_downgrade: >-
    Закрыт на обоих входах. От клиента его отвергает proofKeyBindingOf. Из хранилища его
    отвергает bindingDefect. Вызов из пробы TestCodeRecordWithoutAnS256ProofKeyIsAContractBreach,
    случай «метод plain».
  replay_and_consumption: >-
    Код гасится при предъявлении (DeletePKCERequestSession → consumeCode, bridge.go:565, :288), до сверки
    доказательства, ровно один раз за операцию. Код, предъявленный с неверным доказательством
    или без доказательства, второй раз предъявить уже нельзя: это повтор. Форма та же, что у
    базы: там при предъявлении снималась запись PKCE, и у кода с PKCE это было повтором.
    Отсюда отказ в обслуживании: перехвативший код может его сжечь. Это свойство
    одноразового кода (RFC 6749 §4.1.2), дифф его не вносит.
  concurrent_replay_ordering: >-
    Гипотезу проверил, она ОПРОВЕРГНУТА как дефект этого диффа. Гипотеза: погашение ушло из
    единицы работы выдачи, поэтому отзыв проигравшего может лечь раньше, чем победитель
    положит пару. Ответ контракта: GrantRevoker (ports.go:328-341) требует отметку отзыва у
    семейства. Токены отозванного гранта не годны, когда бы их ни положили; фейк это
    соблюдает (fakes_test.go:385). Теперь это единственный механизм порядка на полосе кода,
    поэтому он вынесен условием стороне службы (cross_repo_conditions).
  error_text: >-
    Отказы с привязкой кладут подробности только в Debug, а Debug на провод не идёт
    (errors.go:40-43). Значение метода от клиента попадает туда через strconv.Quote.
    Размер этой строки ограничивает край службы. Проблема низкая, в планку не входит.
  knobs: >-
    RequireProofKey* сняты вместе с правилом, которое они выбирали. Молчаливого умолчания у
    ручки не осталось: значение в New прибито, true/true/false. Перепись по дереву @81b0f5e
    (779 отслеживаемых файлов): ProofKeyVault, ProofKeys, RequireProofKey, proofBound,
    *ProofKeyRequest, «запись PKCE» дают по 0 совпадений. Положительный контроль: ProofKeyVault
    @bc580b9 встречается в 3 файлах, ProofKeyBinding @81b0f5e — в 4.
