    file: oauthceremony/bridge.go
    line: 236
    summary: >-
      Новое различение «погашен этой операцией / другой» на первой выборке кода закреплено
      только положительной стороной. Если на первой выборке любой погашенный код считать своим,
      дерево остаётся зелёным. Причина: обычный повтор ловит ещё и ноль строк погашения при
