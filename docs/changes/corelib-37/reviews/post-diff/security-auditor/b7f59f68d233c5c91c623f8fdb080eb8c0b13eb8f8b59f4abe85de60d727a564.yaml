closure_of_previous:
  - id: F1
    key: 'corelib:oauthceremony/bridge.go:proof-port-failure-code-becomes-op-verdict'
    status: closed
    how: >-
      отказ обоих портов доказательства переводится closedPortFailure в закрытый перечень:
      PortDeadline, PortCanceled, PortContract, ServerError. Ни один из них не входит в
      «безобидные» случаи Revoke (UnhandledRequest, GrantNotFound, NotFound,
      RefreshTokenRotated) и Introspect (InactiveToken, RefreshTokenRotated). Наш случай из
      такого порта — нарушение контракта. Порт в цепочку не кладётся, текст порта на
      провод не уезжает. Единственный объявленный случай справочника, «клиента нет»,
      разбирается раньше своей веткой. То же правило стоит на месте вопроса справочнику,
      которого прошлая запись не называла: сборка запроса по записи гранта, grantClient, пять
      вызывающих. Регрессия закреплена на уровне обсервабла, как заказано: все объявленные
      случаи × 2 формы × оба порта × каждая операция × каждое доказательство (812), с
      близнецами «порт исправен» (у отзыва токен после него негоден) и «простая ошибка» →
      server_error.

new_delta:
  findings: []
  checked: >-
    (1) Перестановка записи повтора ДО сборки: ведомость принимает первую запись.
    Грант без идентификатора отсекается раньше повтора на обоих путях, так что нарушение
    контракта повтор не заслоняет. Отзыв семейства (Exchange, Revoke) читает
    replayedFamily, а не ведомость, и от порядка не зависит. (2) grantClient пишет
    server_error там, где движок сжимал сбой справочника в «токен негоден» или «временно
    недоступно»: исход стал закрытым и громким. Отзыв при успехе второго способа поиска
    снимает найденный артефакт — это верно. (3) Провод отказа порта постоянен: текст —
    константа на случай, подсказка только у нарушения контракта, Debug на провод не
    идёт (errors.go:40-43). Проба portFailureWires требует одну форму провода на случай.
    (4) Для неизвестного клиента матрица судит порт сверки тем же исходом, что для
    известного: со стороны церемонии прибора перебора нет.
