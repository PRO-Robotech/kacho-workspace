        errors.As кладёт nil-указатель, и чтение Code разыменовывает nil. Класс старше
        дельты: он есть в fromPort на базе. Дельта добавляет к нему три места того же вида:
        CodeOf в GetClient и grantClient, closedPortFailure. Вход даёт только код службы,
        внешний вызывающий его не выбирает. Не блокирует; планку решает владелец.
      measured: >-
        временная внутренняя проба на копии архива (снята): CodeOf, fromPort и
        closedPortFailure на типизированном nil — все три паникуют (recover → true).

