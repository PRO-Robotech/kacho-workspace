findings:
  - id: F1
    severity: medium
    key: 'corelib:oauthceremony/bridge.go:proof-port-failure-code-becomes-op-verdict'
    at: >-
      oauthceremony/bridge.go:273-274 (verifyClientSecret, отказ порта сверки через fromPort) и
      :200 (GetClient, ветка отказа справочника, коммит 36a3bf0a); читатели кода —
      ceremony.go:1023 (Revoke) и :961 (Introspect); обещание, которое нарушается —
      ports.go:604 и шапка verifyClientSecret.
    sign: >-
      fromPort сохраняет КОД отказа, если порт вернул нашу ошибку (обёрнутый часовой
      пакета). Отказ записывается в ведомость и становится ответом операции
      (preferRecorded). Отзыв и интроспекция часть кодов читают как исход протокола, а не
      как отказ. Так несостоявшаяся сверка становится вердиктом, вопреки контракту порта:
      «отказ порта — отказ операции».
    failure_scenario: >-
      реализация порта сверки у службы читает проверочное значение тем же помощником
      хранилища, что отвечает часовым «записи нет» (документированный сигнал портов
      хранения того же пакета), и возвращает его как ошибку. Клиент, у которого значения в
      этот момент нет (сброс, оборот), отзывает токен обновления при выходе. Операция
      отвечает успехом, а токен остаётся живым. То же с двумя другими часовыми «нечего
      снимать». На интроспекции неаутентифицированный вызывающий при таком отказе порта
      получает ответ «неактивен», а не отказ. У справочника (коммит 2) тот же класс:
      до коммита 2 два из трёх таких кодов давали invalid_client, после коммита — успех отзыва.
    proof: >-
      аудиторские пробы в снятом worktree @36a3bf0a (файл вне дерева полосы). Известный
      клиент, верный секрет, порт сверки отвечает ошибкой, обёрнутой в ErrGrantNotFound /
      ErrNotFound / ErrUnhandledRequest: Revoke → nil, токен обновления после отзыва
      active=true. Близнец — простая ошибка: server_error. Справочник с ErrNotFound /
      ErrUnhandledRequest / ErrRefreshTokenRotated: Revoke → nil, токен жив; простая ошибка —
      server_error. Та же проба на 4ac5dfbd: для справочника ErrNotFound / ErrUnhandledRequest
      дают invalid_client, ErrRefreshTokenRotated — nil (поведение базы). Интроспекция
      неизвестным клиентом при ошибке порта с ErrInactiveToken / ErrRefreshTokenRotated →
      active=false, err=nil; простая ошибка — server_error. Обмен ни при одном коде не
      выдаёт токенов: отказ, но с кодом порта.
    fix_direction: >-
      признак для исполнителя, диагноз он вправе опровергнуть. Отказ обоих портов
      доказательства в операции, доказывающей клиента, получает закрытую классификацию.
      Срок и отмена сохраняют свои коды, нарушение контракта — своё, всё прочее —
      server_error. У порта сверки в контракте нет ни одного исхода-ошибки с протокольным
      кодом, поэтому наш часовой из него — это нарушение контракта. У справочника
      единственный протокольный сигнал — ErrGrantNotFound, и он уже разобран своей веткой.
      Вариант исполнителя: отзыв и интроспекция не толкуют «безобидными» записанный отказ
      порта, а толкуют только вердикт движка. Выбор за ним, предмет один. Закрепить пробой
      на уровне обсервабла по трём операциям. Входы: каждый часовой пакета из закрытого
      перечня (allSentinels, внутренняя проба) × оба порта. Ожидается: операция отказывает,
      CodeOf ∈ {server_error, port_contract, port_deadline, port_canceled}, Revoke не
      возвращает nil, Introspect не возвращает ответ без ошибки. Близнецы: исправный порт —
      отзыв исполнен, токен мёртв; простая ошибка — server_error.

below_bar:
  - id: N1
    severity: low
    key: 'corelib:oauthceremony/bridge.go:public-client-vs-unknown'
    note: >-
      зарегистрированный публичный клиент на обмене и отзыве проходит доказательство без
      сверки (ранний выход движка по IsPublic), а неизвестный получает отказ. Точка
      авторизации отличает неизвестного клиента по построению (RFC 6749 §4.1.2.1). Для
      публичного клиента нет отказа «неверный секрет», поэтому утверждение doc.go о
      неразличимости верно. Идентификатор клиента — не секрет (RFC 6749 §2.2). Не блокирует.
  - id: N2
    severity: low
    key: 'corelib:oauthceremony/ceremony.go:assertion-type-not-reserved'
    note: >-
      client_assertion_type и client_assertion не входят в tokenReservedNames. Служба,
      пробрасывающая Additional от клиента, доводит запрос до ветки утверждения клиента. Для
      известного и неизвестного клиента исход одинаков: представление не
      OpenIDConnectClient, порт не зовётся. Находки нет, только наблюдение: закрыть
      перечнем было бы дешевле, чем держать равенство исходов вниманием.

cross_repo:
  - repo: PRO-Robotech/kaname
    subject: >-
      при подъёме пина на ревизию с #37 служба реализует ClientSecretVerifier. Страж цены
      [10, 15] снят из corelib вместе с Config.SecretHashCost. Функция и цена проверочного
      значения теперь у службы, и её собственный boot-guard ограничивает цену с обеих
      сторон. Сравнение постоянного времени — по значениям фиксированной длины, а не по
      сырым секретам. Приманка того же класса — для неизвестного клиента И для
      зарегистрированного без проверочного значения: публичный клиент доходит до порта
      через интроспекцию. Нынешнее и прежнее значение на время оборота — в одном вызове.
      Reveal — только в сравнении. Для клиента, которого нет, — SecretMismatched, а не
      ошибка с часовым пакета; пока F1 не исправлена, это держит отзыв. LookupClient
      отвечает ровно ErrGrantNotFound. Проба сквозь обе стороны: неизвестный клиент против
      неверного секрета — одно число вызовов (держит corelib) и одна цена сверки (держит
      служба).

