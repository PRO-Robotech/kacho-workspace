outside_diff:
  - >-
    Радиус механизма LookupClient (measurement-discipline §«Радиус»): мест
    вызова два — GetClient (bridge.go:190, правлено) и requesterFromGrant
    (translate.go:376-378, четыре вызывающих в bridge.go, не правлено).
    Во втором отказ справочника уходит движку сырым: без fromPort (без имени
    вызова) и без записи в ведомость. Измерено E2: справочник отказывает на
    второй выборке — интроспекция отвечает active=false без ошибки, то есть
    сбой справочника выдан за «токен неактивен». Исход закрытый (отказ, не
    допуск), дифф этот код не трогает, поэтому посадку не блокирует; правило,
    которое дифф вводит в GetClient («справочник, который не ответил, — не
    „клиента нет“»), там не исполняется. Решение — отдельной задачей либо в
    этом же изменении по выбору автора.
  - >-
    Вне роли (форма коммита — landing-reviewer / git-operator): первые строки
    обоих коммитов — по 70 знаков, тела — 10 и 7 строк, трейлеров нет.

