findings:
  critical:
    - id: CRIT-1
      where: oauthceremony/bridge.go:179-183 (doc GetClient, раздел «Отказ справочника — отказ операции»)
      summary: >-
        Комментарий называет ложный механизм: «движок сжимает всякий отказ
        этого вызова в отказ доказательства (на интроспекции — не оборачивая)».
        На интроспекции движок отказ справочника ОБОРАЧИВАЕТ
        (internal/oauth2/introspection_request_handler.go:142-145, WithWrap(err)),
        измерено E1 на 36a3bf0a. Оговорка скопирована с verifyClientSecret, где
        она верна (там же :147-149 — без WithWrap). Настоящая причина, по которой
        отказ пишется в ведомость, в комментарии не названа: fromEngine
        (translate.go:132-135) поднимает вложенный наш отказ только для кодов
        coarsenable, а CodeServerError в перечень не входит, поэтому обёртка на
        обоих путях не помогает. Названный механизм — несущий: читатель,
        поверивший, что на точке токена движок оборачивает, а дело в
        интроспекции, вправе сузить запись до одного пути и вернуть дефект на
        обоих.
      requirement: >-
        Снять оговорку «(на интроспекции — не оборачивая)» и назвать механизм,
        который держит правило: движок оборачивает отказ справочника на обоих
        путях, но fromEngine поднимает из цепочки только коды coarsenable, и
        отказ сервера без записи в ведомость стал бы отказом доказательства.
        Проба не нужна — поведение уже заперто I1; нужен правдивый текст.
      predicate: >-
        временная печать errors.As(engineErr, *ProtocolError) в Introspect на
        TestClientDirectoryFailureFailsTheOperation/интроспекция/справочник_не_отвечает
        печатает «wraps ours»; ревизия 36a3bf0a
  important:
    - id: IMP-1
      where: oauthceremony/bridge.go:268 (verifyClientSecret) · пробы client_secret_port_test.go
      summary: >-
        Срок вызова порта сверки (Config.PortTimeout, обещан в doc
        ClientSecretVerifier) в коде стоит, но не заперт: I3 заменил
        b.deadline на WithCancel — весь пакет зелёный. Подставка
        VerifyClientSecret контекст не читает.
      requirement: >-
        проба уровня TestGrantIDHookCallCarriesThePortDeadline
        (grant_id_test.go:58): порт видит ctx.Deadline() не дальше PortTimeout;
        инъекция I3 обязана её краснить.
    - id: IMP-2
      where: >-
        client_secret_port_test.go — TestClientSecretVerifierFailureFailsTheOperation,
        TestClientDirectoryFailureFailsTheOperation
      summary: >-
        Обе пробы отказа порта утверждают только FailureCode. Текст провода
        сейчас постоянный (textPortFailed / textPortDeadline), причина уходит
        в Debug — но ни одна новая проба этого не запирает
        (security-hardening, hard-regression-asserts-message).
      requirement: >-
        утверждать wireForm отказа побайтно (Description постоянный, Hint
        пуст) и NotContains(Description+Hint, текст причины подставки),
        по всем операциям обеих проб.
  foundation_candidates: []     # изменение и есть фундамент (corelib)
  style:
    - id: S-1
      where: oauthceremony/client_secret_port_test.go:207, 219-221
      summary: >-
        Глагол "%T %v" подаётся с одним аргументом: %v получает %!v(MISSING)
        и судит ничего, так что в переписи «глаголов 9» один из них — только %T.
      requirement: 'fmt.Sprintf("%T %v", presented, presented) либо снять запись из перечня.'
  security_comments_contradicting_code:
    - 'oauthceremony/bridge.go:181-182 — CRIT-1 (ложный механизм обёртки на интроспекции)'

