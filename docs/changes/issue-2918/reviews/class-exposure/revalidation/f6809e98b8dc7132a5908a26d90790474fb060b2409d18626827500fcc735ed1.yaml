not_measurable:
  - >-
    Окно CX3L-01 на стенде при перегрузке (очередь admission и одновременный проход Reconciler) здесь
    не воспроизводилось: реализации нет. Вывод держится на тексте замысла (design.md:862) и на коде
    сегодняшнего claim, где условие живости стоит под тем же замком (reconciler.go:190-192). Проба —
    заказ УК3-58.
  - >-
    Соотношение ResolveTimeout (10 с по умолчанию) и idle_in_transaction_session_timeout пулов модулей
    не мерялось. Транзакция кандидата простаивает не дольше одного резолва, как и сегодняшний claim с
    keepClaimAlive. Дельта это соотношение не меняет.

facts_for_dispatcher:
  - >-
    CX3L-01 — последствия, а не формы. Если реализация повторит текст замысла дословно, возвращается
    фантомный ресурс при операции в ERROR, который corelib уже однажды закрыл (executionClaimer,
    «r9b»). Исправление — одно условие во взятии, но его нужно внести в замысел: иначе исполнитель
    напишет предикат ровно по З16.
  - >-
    Окна тегов X1 и X2 NTF-3 друг против друга ничем не упорядочены: оба тега выпускаются после S3-C2
    NTF-4. Д41 этого не требует. Если правило Д37 «одно окно одновременно» понимать буквально и
    внутри предмета, нужно ребро «тег X2 — после подъёма пина на X1».

