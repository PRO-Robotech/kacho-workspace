mapping_check:
  summary: "88 из 88 пунктов CX3 выдерживают; из 7 строк ДР- не выдерживает одна, ДР-К1 (б)"
  holds_now:
    - id: "CX3B-25"
      reason: >-
        Третий вызывающий AsComponent находится в corelib operations, вне дерева пяти модулей. Его
        единственность держит `git grep -n 'AsComponent(' -- operations ':!*_test.go'` → 1 и УК3-53.
        Гейт УК3-27 (д) по-прежнему судит только дерево модулей. Ребро импорта operations → journaltx
        новое. Кольцо journaltx → operations отверг бы компилятор, поэтому отдельный держатель не нужен.
    - id: "CX3H-02"
      reason: >-
        В дереве compute вызова AsComponent нет. Принципал пары `(compute, operations)` ставит corelib
        только на транзакцию терминальной записи. Резолвер compute читает лишь свой репозиторий на пуле
        (`operationresolver.Readers{Instance: repo.NewInstanceRepo(pool)}`, main.go:378), межмодульных
        вызовов у него нет. Утверждение «пересылаемая личность прохода не меняется» верно на
        1d42a6728bf. На будущее условие закреплено пунктом CX3L-05.
    - id: "CX3J-01 (б)"
      reason: >-
        Ребро «тег X3 — после посадки S2-B1» есть в строке X3 tasks.md. S2-B1 от X3 не зависит
        (S2-B1: Е1, Е6, X2-F, S1-A1…A4), так что цикла нет. Окна X1 и X2 закрываются до выпуска X2-F:
        у выпуска X2-F есть рёбра «S1-A1…A4» и «X5 (тег X2)». X3 против окна TW держится вниманием
        при выпуске, причина названа. Д41 требует рёбер только против (1)–(2), и они есть.
    - id: "ДР-К1 (а)"
      reason: >-
        Путь исполнителя сверен с кодом. terminalWrite строит контекст от context.Background на каждой
        попытке (worker.go:558 @34bc8104a). В Background нет принципала, поэтому AsComponent идёт
        первым исходом. Два условия к коду остаются открытыми: источник opts journaltx (CX3L-02) и
        проверка пары конструктором (CX3L-03).
    - id: "ДР-К1 (в), ДР-М1"
      reason: >-
        Классификатор расписан строкой на каждый исход, корзины «прочее» нет. Строка ErrLimitExhausted
        одинакова на обоих путях.
    - id: "ДР-К2"
      reason: >-
        Коды DEADLINE_EXCEEDED и CANCELLED стоят в строке «не дала ответа» таблицы Р7 приёмки
        (строка 978). Ошибку, которая не является статусом, status.FromError отдаёт как UNKNOWN, а
        UNKNOWN стоит в той же строке (grpc v1.83.2 в go.mod kacho). Отказ настройки поэтому не
        возникает. Открытие окна фиксируется до Resolve, начало окна не сдвигается, повторный проход
        читает победившую запись. Если две реплики пришли к одному адресату, вторая транзакция
        откатывается на уникальности закрытия `(адресат, начало)`, и её Put откатывается вместе с ней.
        Сетевых вызовов в транзакции адресата нет.
    - id: "ДР-В1"
      reason: >-
        Сегодня AttachToInstance — один UPDATE без prev (network_interface.go:327-345 @1d42a6728bf).
        Форма З15 с `prev … FOR UPDATE` меняет только одно: откуда берётся old_used_by. Разобраны оба
        порядка гонки. (1) Detach соседа зафиксирован после снимка оператора: UPDATE видит в снимке
        занятую строку и получает 0 строк, как сегодня. (2) Attach другого инстанса зафиксирован после
        снимка: повторная проверка (EPQ) отвергает строку, 0 строк. Если конкурент — тот же инстанс,
        EPQ строку пропускает, но old_used_by = $2, и строки журнала нет. Журнал пишет ровно один
        из двух.
    - id: "ДР-В2"
      reason: >-
        Сегодня SetReference — два оператора (address.go:1008-1035). В форме CTE `upd` ставит
        used = true и тогда, когда `ref` пуст (ссылка чужая), — сегодня так же. Откат транзакции
        вызывающего на FAILED_PRECONDITION назван. `upd` и `ref` меняют разные таблицы, поэтому
        двойной правки одной строки в одном операторе нет.
    - id: "ДР-В3"
      reason: >-
        Позиции растут в порядке фиксации: замок строки inbox_clock держится до коммита. Потребителей
        соседства позиций нет. В приёмке `:countUnread` не принят (строка 1692), а слово «подряд»
        встречается только в Given обвязки (строка 2776), и его защищает CX3I-04 (в).
    - id: "ДР-В4"
      reason: "См. CX3J-01 (б)."
  not_holding:
    - id: "ДР-К1 (б)"
      reason: >-
        Взятие кандидата в замысле: `SELECT … WHERE id = $1 AND done = false FOR UPDATE SKIP LOCKED`
        (design.md:862, строка ДР-К1 (б), строка X3 tasks.md). Условие живости `modified_at < $порог`
        из взятия выпало. Сегодня оно стоит под замком того же оператора (reconciler.go:190-192
        @34bc8104a), и защита от фантома в worker.go держится именно на нём. См. CX3L-01.
  unmapped: []

new_items:
  - id: CX3L-01
    decision: "Reconciler: чтение кандидатов без замка, затем взятие каждого своей транзакцией (З16, ДР-К1 (б))"
    class: "code-authoring §«Решение и его следствие разнесены»; §«Порядок операций внутри кода»"
    exposure: >-
      Кандидата выбирают по условию «сирота»: done = false AND modified_at < порог. Взятие через
      несколько секунд проверяет только done = false. Если между чтением и взятием исполнитель
      подтвердил живость (ClaimForExecution, repo.go:597: `UPDATE … SET modified_at = now WHERE id AND
      done = false`), Reconciler всё равно возьмёт строку. Ответ резолвера будет OutcomeInterrupted,
      потому что ресурса ещё нет, и Reconciler запишет терминальную ошибку. После этого fn
      исполнителя создаст ресурс поверх операции в ERROR. Это ровно тот фантом, который закрывают
      executionClaimer и worker.go:472-500. Сегодня его не бывает: условие живости стоит под замком
      того же оператора (reconciler.go:190-192). Окно задаётся последовательным разбором пачки и
      длится до SweepBudget (30 с по умолчанию, reconciler.go:106-107). Кандидатами становятся как
      раз операции из admission backlog при перегрузке, то есть те, для которых проверка живости и
      существует.
    code_condition: >-
      Взятие кандидата повторяет условие сироты целиком тем же порогом, что и чтение:
      `WHERE id = $1 AND done = false AND modified_at < $threshold FOR UPDATE SKIP LOCKED`. Порог
      вычисляется один раз на проход. Строка, которую исполнитель подтвердил после чтения, даёт 0
      строк взятия и уходит в пропуск. Замысел должен исправить это в трёх местах: З16 (строка
      «взятие строки»), ДР-К1 (б), строка X3 tasks.md.
    held_by: "нужна проба, её нет — заказ integration-tester (УК3-58)"
    outcome: к-замыслу
  - id: CX3L-02
    decision: "новый вызывающий journaltx.Begin — corelib operations (З4 (1), З16, §8)"
    class: "code-authoring §«Умолчание, которое становится утверждением»; §«Контракт, который нельзя выразить»"
    exposure: >-
      Первым оператором Begin(ctx, pool, opts) выставляет `kacho_feed.enabled` из opts (З4). Значение
      берётся из ручки модуля, которую читают один раз. По З11 у ручки «три читателя»: корень, Mapping
      и journaltx модуля. Редакция 10 добавляет открытие Begin внутри corelib operations. Корень модуля
      передаёт туда отправителя и службу, а opts замысел не называет. При нулевом значении opts
      транзакция терминальной записи выставит флаг false, и корень модуля об этом не узнает. Кроме
      того, один бит «модуль подключён» выражен тремя значениями — наличие отправителя, наличие пары
      и флаг в opts. Конструктор отвергает только расхождение первых двух.
    code_condition: >-
      Замысел называет источник opts для Begin внутри operations. Условие к коду: отправитель, служба
      и opts journaltx приходят в operations одним значением. Корень собирает его из того же
      единственного чтения ручки, что и журнал модуля; нулевых opts операции получить не могут. З11
      переписан на четырёх потребителей либо называет, что operations получает помощник модуля.
      Проба УК3-55 утверждает, что флаг в транзакции терминальной записи равен значению ручки модуля.
    held_by: "УК3-55 после дописки; до неё — вниманием по диффу корня"
    outcome: к-замыслу
  - id: CX3L-03
    decision: "пара `(<служба>, operations)`, где служба — значение от корня модуля (З16, §8)"
    class: "code-authoring §«Умолчание, которое становится утверждением»"
    exposure: >-
      Конструктор отвергает только отправителя без пары и пару без отправителя. Если служба не проходит
      форму `CHECK` (пустая, заглавные буквы), ошибка всплывёт только при первой терминальной записи:
      AsComponent или InitiatorOf откажет. По классификатору это «ошибка программы, счётчик,
      следующий». На пути исполнителя повтора нет, строку передают Reconciler, а тот отказывает так
      же на каждом проходе. Все асинхронные операции модуля навсегда остаются done=false, и заметен
      этот отказ только по счётчику.
    code_condition: >-
      Конструктор отправителя с парой при сборке вызывает те же SystemPrincipalFor и InitiatorOf, что
      и путь записи. При отказе корень модуля не стартует и называет службу (fail-closed). На
      неэкспортированную функцию пары в рантайме остаётся только исход, который по построению
      недостижим.
    held_by: "УК3-55, близнец дописать: служба '' и 'Storage' → отказ сборки корня"
    outcome: к-коду
  - id: CX3L-04
    decision: "Sweep: взятие ноль строк — пропуск; исходы кандидата без отката соседей (З16)"
    class: "code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      RecoverAll вызывает Sweep, пока тот не вернёт 0 (reconciler.go:305-318), и работает до приёма
      трафика в шести модулях (recovery.go). Если после перестройки Sweep начнёт считать прочитанных
      или взятых кандидатов, а не разрешённых, то кандидат, которого держит другая реплика или который
      стабильно откатывается (ErrSecondLimitedPut, отказ Begin), даёт n > 0 на каждом проходе. Старт
      тогда зацикливается до приёма трафика.
    code_condition: >-
      Sweep возвращает число кандидатов, у которых CAS по done применён и транзакция зафиксирована.
      Пропуск взятия, ErrAlreadyDone, откат и отказ Begin в это число не входят.
    held_by: "УК3-54, дописать близнеца: кандидат, взятый другой транзакцией, → RecoverAll возвращается, n = 0"
    outcome: к-коду
  - id: CX3L-05
    decision: "контекст пары на транзакции кандидата Reconciler, резолв внутри этой транзакции (З16)"
    class: "code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      Замысел утверждает: «контекст с этим принципалом несёт только транзакцию терминальной записи,
      межмодульных вызовов под ним нет» (З4 (1)). При этом резолв идёт внутри транзакции, открытой под
      контекстом пары. Если резолверу передать тот же ctx, личность `system:<служба>-operations`
      попадёт в чтения резолвера. Сегодня все резолверы читают свой репозиторий на пуле (измерено:
      compute, storage, nlb), так что вреда пока нет. Но утверждение З4 (1) начинает зависеть от
      того, как устроен резолвер.
    code_condition: >-
      resolver.Resolve получает контекст прохода с ResolveTimeout, без принципала пары. Контекст пары
      передаётся только в journaltx.Begin и в операторы транзакции.
    held_by: "держится вниманием по диффу X3: однофайлового признака нет, а пробу на межмодульный вызов резолвера сегодня не на чем поставить"
    outcome: к-коду

