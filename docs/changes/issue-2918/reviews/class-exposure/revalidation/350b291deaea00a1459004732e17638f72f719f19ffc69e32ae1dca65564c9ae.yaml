# Экспозиция классов — пересверка (revalidation, дельта) замысла NTF-3, редакция 14.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и прежние пересверки (89d1f0ad, 3730bca2,
# 374789b5, 3dbb8b23, b34a411e, 97c51264, f6809e98, 7bc43f21, 5400c528, 6cf94b11) относятся к своим
# отпечаткам и здесь не переписываются. По Д22 это дельта: редакция 14 проверена диффом
# 4b11228f5 → 2504b159e (design.md +220/−115, tasks.md +18/−7). Редакция 14 — то же исключение из Д26,
# что редакция 13: новый механизм разрешён только для К1 и К2 ревью замысла 97c51264. Проверено:
#   (1) отображение CX3O-01…04 пересверки 6cf94b11 и выдерживание условий этих пунктов;
#   (2) новое место механизма К1 (интерфейс operations.FailedNotify, FailTerminalCAS, TerminalQuerier,
#       подпакет operations/opsnotify) — по коду corelib @34bc8104a и графу импортов;
#   (3) выбор «два клиента» по CX3O-02 — против замысла NTF-5 (issue-2924) в той же рабочей копии;
#   (4) новые внешние вызовы, асинхронные пути и sentinel-значения редакции 14.
# Разрешения писать реализацию эта запись не даёт.
