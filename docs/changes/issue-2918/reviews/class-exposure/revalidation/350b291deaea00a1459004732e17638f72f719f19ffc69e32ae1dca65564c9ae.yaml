new_class_proposal: >-
  Кандидат, не заводится. «Экспорт ради подпакета расширяет вход для всех импортёров» (CX3P-01, CX3P-02) —
  разрыв цикла импортов переносом кода в подпакет вынуждает экспортировать то, что было внутренним, и
  инвариант «строит только X» перестаёт быть выразимым типом. Это один экземпляр в одном замысле, цена
  не измерена. Порог §9 не пройден, это находка. При второй независимой встрече владелец по
  противоядию — code-authoring (§«Контракт, который нельзя выразить»: перепись новых экспортированных
  имён при разрыве цикла).
