new_items:
  - id: CX3P-01
    decision: "operations экспортирует FailTerminalCAS(ctx, q TerminalQuerier, table, id, st) — терминальную запись ошибки, которая письма не ставит (З16 «Что объявляет operations»)"
    class: "code-authoring §«Решение и его следствие разнесены»; code-authoring §«Контракт, который нельзя выразить»"
    exposure: >-
      До редакции 14 CAS терминальной ошибки был неэкспортированным (markErrorCAS). Снаружи до него
      доходили только через MarkError и через ставящий pgRepo.FailTerminal. Теперь это экспортированный
      вход пакета. Причина экспорта одна: подпакету opsnotify нужно звать CAS в своей транзакции. Но
      вызвать его может любой импортёр operations, в том числе модуль, чей репозиторий построен
      NewNotifyingRepo. Такой вызов разрешает операцию, а письма не ставит. Исход письма тогда зависит
      от того, какой вход выбрал автор модуля, а И11 («строку ставит только opsnotify.FailTerminal»)
      этого не видит: FailTerminalCAS строку и не должен ставить. Кроме того, table подставляется в
      текст оператора (fmt.Sprintf, repo.go:244-254). Сегодня это поле pgRepo, после экспорта —
      аргумент от вызывающего.
    code_condition: >-
      (а) В не-тестовом дереве вызывающие operations.FailTerminalCAS есть только в пакетах corelib
      operations и operations/opsnotify. В kacho и kaname их 0. (б) Комментарий FailTerminalCAS
      говорит, что это не вход для модулей: письмо не ставится, путь модуля — репозиторий операций.
      Там же сказано, что table — доверенный идентификатор из репозитория, а не значение запроса.
      (в) opsnotify получает table только аргументом RunTerminal от pgRepo и сам его не строит.
    held_by: >-
      Гейта нет. (а) — предикат полосы X3 и S3-C3 с числом: `git grep -n 'FailTerminalCAS(' -- ':!*_test.go'`
      в corelib → совпадения только под operations/, в kacho @ревизия подъёма → 0, в kaname → 0.
      Контроль в обе стороны: в corelib совпадений ≥ 2 (markErrorCAS и opsnotify). (б), (в) держатся
      вниманием по диффу X3.
    outcome: к-коду
  - id: CX3P-02
    decision: "значение подключения приходит в NewNotifyingRepo интерфейсом operations.FailedNotify (Ready, RunTerminal), а не типом, который строит только opsnotify.New (З16, CX3L-02 (б), И28)"
    class: "code-authoring §«Контракт, который нельзя выразить»; code-authoring §«Умолчание, которое становится утверждением»"
    exposure: >-
      Строки CX3L-02 (б) и И28 утверждают: отправитель, служба пары и opts лежат в одном значении, его
      строит только opsnotify.New, поэтому расхождения не построить. Для *opsnotify.Notifier это так,
      и Ready отвергает nil, типизированный nil и &Notifier{}. Но NewNotifyingRepo принимает любой тип
      с методами Ready и RunTerminal. Интерфейс с неэкспортированным методом тут не поможет: реализовать
      его может только тип из пакета operations, то есть opsnotify не сможет. Поэтому ограничение
      «только New» конструктор выразить не может. Своя реализация в корне модуля — например, заглушка,
      перенесённая из пробы, или обёртка, «упрощающая» подключение, — проходит мимо проверки пары
      (CX3L-03), мимо отказа на нулевых Options (CX3M-02 (а)) и мимо классификатора З16. УК3-59 судит
      только имя вызываемого конструктора, а не происхождение его третьего аргумента.
    code_condition: >-
      (а) В не-тестовом дереве реализация FailedNotify одна — *opsnotify.Notifier. В kacho и kaname
      реализаций 0. (б) Третий аргумент NewNotifyingRepo в каждом из пяти корней — значение, которое
      вернул opsnotify.New в той же функции корня. Замысел выбирает, держит ли это УК3-59 (по узлу
      вызова: аргумент — идентификатор, присвоенный из opsnotify.New, инъекция — свой тип в корне
      registry → красный) или предикат (а). (в) Текст CX3L-02 (б) и И28 уточнён: «только New»
      держится не типом, а предикатом или гейтом.
    held_by: >-
      Гейта нет. (а) — предикат с числом: `git grep -nE 'func \([^)]*\) RunTerminal\(' -- ':!*_test.go'` в
      corelib → 1 (operations/opsnotify), в kacho и kaname → 0. Предикат ищет по имени метода, разбора
      нет, поэтому обёртка с другим получателем и тем же именем найдётся, а метод, выраженный через
      встраивание, — нет. Этот пробел держится вниманием, либо (б) через УК3-59.
    outcome: к-коду
  - id: CX3P-03
    decision: "пробы X3, которые строят NewNotifyingRepo значением opsnotify.New (УК3-53, УК3-54, УК3-60, УК3-64), — при opsnotify, импортирующем operations"
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код»; gate-authoring §«Фикстура не снисходительнее продукта»"
    exposure: >-
      opsnotify импортирует operations. Тестовый файл во внутреннем пакете operations (package
      operations), импортирующий opsnotify, Go не собирает: «import cycle not allowed in test». Путь
      наименьшего сопротивления для пробы, которой нужны неэкспортированные части operations
      (fakeRepo, инъекция «pgRepo без FailTerminal»), — поддельный FailedNotify во внутреннем пакете.
      Такая проба уже не идёт через настоящий RunTerminal. Классификатор З16, пара (<служба>,
      operations) и строка operation-failed остаются без держателя, хотя УК3-53 и УК3-64 утверждают
      именно их. CX3G-04 (в) требует, чтобы проба звала настоящий вход. @34bc8104a из 29 тестовых файлов
      operations 24 во внешнем пакете operations_test, 5 во внутреннем, и пробы ClaimForExecution — во
      внешнем. Площадка есть, выбор не вынужденный, но его никто не назвал.
    code_condition: >-
      (а) УК3-53, УК3-54, УК3-60 и УК3-64 лежат в operations_test или в тестах пакета opsnotify и строят
      значение настоящим opsnotify.New. (б) Поддельный FailedNotify допустим только в пробах, которые не
      утверждают ни строки operation-failed, ни инициатора журнала, ни строки классификатора. (в)
      Инъекция «pgRepo без FailTerminal» (проба предпосылки УК3-53) делается правкой исходника, а не
      заменой значения подключения.
    held_by: >-
      Цикл громко ловит компилятор. Подмену на подделку держит внимание по диффу X3. Предикат для сдачи:
      в файлах УК3-53, УК3-64 `grep -c 'opsnotify.New('` ≥ 1, а `grep -c '^package operations$'` → 0.
    outcome: к-коду

