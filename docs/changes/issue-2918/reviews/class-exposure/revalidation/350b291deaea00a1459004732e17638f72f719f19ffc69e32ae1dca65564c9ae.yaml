      reason: >-
        По З16 редакции 14 operations объявляет только TerminalQuerier, FailedRow, FailTerminalCAS и
        FailedNotify, а их сигнатуры не упоминают ни journaltx, ни auth. Всё, чему эти пакеты нужны
        (AsComponent, Begin, SystemPrincipalFor, InitiatorOf, Put), назначено подпакету
        operations/opsnotify. Граф: operations ← auth ← journaltx ← opsnotify и operations ← opsnotify.
        Цикла нет: auth импортирует operations (auth/propagate.go @34bc8104a и @851ee57), opsnotify
        новый, и его никто из них не импортирует. Держатели названы: компилятор X3 и УК3-63.
    - id: "CX3O-01 (б) обёртки нет"
      reason: >-
        NewNotifyingRepo отдаёт сам *pgRepo. executionClaimer и terminalFailer остаются при нём, и
        УК3-53 проверяет ClaimForExecution через значение конструктора.
    - id: "CX3O-01 (в) тип транзакции"
      reason: >-
        В экспортированных сигнатурах operations тип транзакции — TerminalQuerier, экспортированная
