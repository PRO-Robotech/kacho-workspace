      484-notify после K8r» — буквально сейчас это d93b69712 (12 файлов не компилируются); K8r2
      (57f184178) уже в 33010d434, так что требование N11r выполнимо на текущем пине, но текст этого не
      говорит. Прецедент: kacho 42610f73cb (#2924, 2026-10-08) — «kaname на голову 484-notify». Для
      corelib цена тише: подъём до C1 соседом мимо FM0 компилируется и даёт ErrNoAuthzRevision только при
      флаге true. Е10 «ничего не гейтит», окно corelib открывается вливанием Ф-C1.
    condition_on_route: >-
      Вливание Ф-C1 в 77-notify — после одного из двух: (а) Е10 исполнена (plan-precheck/landing-precheck
      отвергают подъём пина в окне без полосы repin); (б) рёбра окна стоят в маршрутах NTF-1 (N11r — пин
      kaname 33010d434767 до вливания В-2), NTF-2 (D1), NTF-5 (C3, C4), NTF-7. Строка Е10 в §2 —
      «гейтит вливание Ф-C1», а не «ничего». Окно kaname открыто уже: до (а)/(б) диспетчер передаёт
      команду §1 git-operator'у каждой волны kacho любого маршрута эпика.
    held_by: "нужен гейт, его нет — Е10 (tooling-maintainer); до него — вниманием git-operator"
  - id: CX3T-02
    severity: to_code
    class: "Радиус по точкам применения, а не по имени механизма (measurement-discipline); пропущенный путь токена"
    decision: "УК3-79: ведомость journaltx-sites.yaml — строка на точку вызова journaltx.Begin (файл, объемлющая функция)"
    finding: >-
      Из 25 точек пять — обёртки, через которые открывают журнальную транзакцию многие вызывающие: vpc
      Repository.Writer (вызовов .Writer(ctx вне тестов — 68 в 51 файле), nlb Repository.Writer (20 в 15),
      storage inJournalTx (15), storage reconciler inComponentTx (4), registry runConfigTx (4). Отметка
      «token» у обёртки с одной пробой зелёная, даже если другой вызывающий токена не берёт. Измерено:
      nlb jobs/target_drain_runner.go:180 — фоновый проход через r.repo.Writer(ctx) пишет журнал
      (снятие целей → событие), в перечне фоновых точек маршрута (free_ip_runner, reconciler/store.go,
      journal_tx.go, «compute фоновые проходы») его нет, и УК3-79 его не видит (это не точка Begin).
      Также через Writer идут nlb quota/guard.go и vpc shared/quota/guard.go.
    condition_on_code: >-
      Выбор «токен / WithoutJournal» выражается там, где он принимается: обёртка принимает его
      параметром (например, Writer(ctx, mark) с mark — *AuthzRevision либо отметка без журнала), так что
      компилятор не пропустит вызывающего; либо УК3-79 судит строку ведомости на каждого вызывающего
      обёртки (функция пакета, чьё тело зовёт Begin и которая принимает ctx, — обёртка; её вызовы —
      точки), с той же печатью объёма. FM-n в перечень фоновых точек добавляет target_drain_runner
      (интеграционная проба с флагом true).
    held_by: "нужен гейт — расширение УК3-79 (go-implementer в FM0) либо тип параметра обёртки (FM-v, FM-n, FM-s, FM-r)"
