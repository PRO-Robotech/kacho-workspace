mapping_check:
  summary: "78 из 78 отображены; 75 выдерживают (у части есть условия к коду ниже); CX3G-02 (в) и CX3B-20 — нет; CX3E-05 — нет; у CX3D-01 (б) держатель назван неверно"
  failures:
    - id: CX3G-02
      part: "(в); и CX3B-20 (CX3-20)"
      design: "З15 «Инициатор записи»; §7 п.3 «journaltx (своя либо вызывающего)»"
      verdict: does_not_hold
      why: >-
        Условие: функции записи перехода принимают транзакцию вызывающего и без неё открывают свою,
        и «в обоих случаях инициатор ставится внутри». CX3B-20: инициатор записи перехода — константа
        компонента внутри функций перехода. Замысел ставит `system:storage-reconciler` только на
        ветке без транзакции (`journaltx.AsComponent`). На ветке с `*journaltx.Tx` инициатора
        выставил тот, кто её открыл (`journaltx.Begin` — первым оператором, З4), и функция его не
        ставит и не сверяет. Вторую установку внутри замысел не допускает (И2), сверки нет. Значит,
        строка журнала о переходе в ERROR несёт личность того, кто открыл транзакцию: сегодня это
        проба NTF3-12, завтра любой вызывающий, в том числе с `user:` в контексте. При этом NTF3-58
        и NTF3-10 зелены: они гоняют ветку без транзакции.
      required: >-
        Выбрать и записать в З15 одно из двух. (1) `journaltx.Tx` отдаёт инициатора своей
        транзакции, и функция перехода с транзакцией вызывающего отказывает до оператора, если он не
        равен `system:storage-reconciler`; отказ проверяется пробой с близнецом (транзакция,
        открытая `AsComponent(ctx, "storage-reconciler")`, проходит, открытая под `user:usr-A` —
        отказ, строк журнала 0). (2) Ветка с транзакцией вызывающего не экспортируется, и NTF3-12
        строит откат иначе. В строке §11 CX3G-02 и CX3B-20 назвать выбранное и держателя.
    - id: CX3E-05
      part: "(б), затем (в)"
      design: "З23, оператор upsert `seen_up_to`"
      verdict: does_not_hold
      why: >-
        Условие (б): исход «применено / не изменено / за границей» возвращается оператором явно и
        не выводится из «0 строк». В операторе З23 внешний `SELECT (SELECT pos FROM b) AS boundary,
        ins.* FROM ins` на пустом `ins` даёт пустой результат, и `boundary` в нём нет. Замысел
        называет исходом «за границей» «пустой результат при непустой границе». Но узнать, что
        граница непуста, можно только отдельным чтением, а его тот же пункт (г) запрещает. Выходит,
        «за границей» выводится из нуля строк, и тот же ноль даёт отсутствие строки `inbox_clock`
        (CX3H-01).
      required: >-
        Оператор возвращает строку при любом исходе: граница читается внешним `FROM b LEFT JOIN ins
        ON true` (или равносильно), «за границей» = граница есть и `ins` пуст, «строки часов нет» =
        строк 0 — отдельный отказ (CX3H-01), не «за границей». Проба УК3-34 получает близнеца
        «значение больше границы → исход "за границей" с числом границы».
  holder_correction:
    - id: CX3D-01
      part: "(б); заказ gate-author записи 97afc066 (hard-async-carries-initiator)"
      design: "З13 «Пересылаемая системная личность»; §11а УК3-31 и абзац об УК3-36"
      verdict: holds_decision_holder_misnamed
      why: >-
        Само решение условие выдерживает: отправители на фоновых путях ставят
        `auth.SystemPrincipalFor`, в том числе compute. Держатель назван неверно. Заказ 97afc066
        просил гейт на две половины: вход достигает клиента с `PropagateOutgoing` (1) без явного
        принципала или (2) с `operations.SystemPrincipal()`, и назвал два положительных близнеца
        (nlb `free_ip_runner.go:465`; compute `stuck_delete_finisher.go` → `releaseAndDelete`).
        УК3-31 в §11а — только половина (2) с одним близнецом nlb. У compute сегодня нет ни одного
        `WithPrincipal`/`SystemPrincipal` в не-тестовом дереве. `PropagateOutgoing` при отсутствии
        принципала сама пересылает `{system, bootstrap}` (corelib `auth/propagate.go:70-74`; и SystemPrincipalFor с пустой службой или ролью — тоже, :110).
        Поэтому УК3-31 в описанной форме молчит на compute и до правки, и после неё, если правку
        забудут. Утверждение §11а «УК3-36 … исполняется УК3-31» ложно.
      required: >-
        УК3-31 судит обе половины и держит два близнеца дерева до правки (nlb :465 и compute
        `FinishStuckDeletes`). Либо УК3-36 возвращается отдельной строкой. В З13 назвать место
        установки личности compute: цикл `FinishStuckDeletes` до вызова `releaseAndDelete`, не
        внутри него (CX3G-06 (а)).
  text_correction:
    - id: CX3G-05
      design: "З13 «Отказ владельца»"
      what: >-
        Сказано, что классификатор ответа владельца «у nlb и compute относит оба кода к одному
        исходу (терминальный отказ по праву)». Для nlb это так: `peer.Classify` относит
        PermissionDenied и Unauthenticated к `OutcomeDenied` (corelib `peer/outcome.go:378-379`),
        `mapReleaseLeaseErr` даёт ErrFailedPrecondition, `handleReleaseErr` изолирует строку.
        Для compute — нет. `mapNicErr` пропускает PermissionDenied как есть и сводит Unauthenticated
        в `codes.Internal`. `FinishStuckDeletes` на любой ошибке прерывает проход, а следующий проход
        повторяет (instance.go:1033-1060). Терминального исхода у compute нет. Условие (б)
        выдерживается и так: исход до и после одинаков (проход прерван, строка в DELETING). Текст
        нужно исправить. УК3-39 утверждает именно «проход прерван тем же образом», а не
        «терминальный отказ».
  code_conditions:
    - id: CX3G-05
      text: >-
        (1) Исход «до и после одинаков» держится, только пока у `user:system.nlb-free-ip-runner` и
        `user:system.compute-stuck-delete-finisher` нет привязок. `ReleaseOwnedAddress` требует
        `editor` на `project` (permission_catalog.json, запись `…/ReleaseOwnedAddress`),
        `AllowSystemPrincipal` в kacho не выставлен ни одним сервисом. Сегодня отказ — и после
        под-фазы отказ. Под-фаза не заводит привязок, ролей и tuple для личностей компонентов:
        привязка сменила бы исход с отказа на успех, а это решение `#2934` (hard-machine-gets-grant,
        hard-ask-which-tuples-satisfy). (2) Строка журнала compute `Instance DELETED` из
        `FinishStuckDeletes` получает инициатора из контекста, выставленного в цикле, потому что
        `repo.Delete` общий с публичным `Delete`.
    - id: CX3B-25
      text: >-
        `journaltx.AsComponent` — второй источник инициатора рядом с принципалом контекста. В коде:
        (1) вызывающих ровно четыре, по константам §8 (`storage-reconciler`, `nlb-free-ip-runner`,
        `compute-stuck-delete-finisher`, `stand-seed` — последний в SQL посева). Обработчик запроса
        его не зовёт. Держится вниманием по диффу, если гейт помощника З4 не печатает вызывающих
        `AsComponent`. (2) В контексте одновременно метка компонента и принципал, дающий иного
        инициатора, — отказ `Begin`, а не выбор одного. (3) Форму `system:<компонент>` строит
        `auth.InitiatorOf` (через `SystemPrincipalFor`), а не второе сложение строки
        (CX3B-26 (а), CX3E-02 (в)).
    - id: CX3G-04
      text: >-
        В `FailTerminal` отказ `auth.InitiatorOf` (`ErrNoInitiator` для `{system, bootstrap}` —
        умолчания строки операции) означает «адресата нет»: CAS коммитится, строки нет. Это не
        ошибка терминальной записи. Иначе операции без принципала никогда не получат `done = true`,
        и `Reconciler` будет повторять их без конца. Близнец к УК3-10: операция с `{system,
        bootstrap}` → `done = true`, строк `operation-failed` 0.
  holds_with_note:
    - {id: CX3G-01, note: "CTE `prev … FOR UPDATE` → `upd … FROM prev` в READ COMMITTED отдаёт прежнее состояние последней зафиксированной версии после ожидания замка: второй из двух параллельных MarkError видит `old_state = 'ERROR'`, и письмо одно (NTF3-07)"}
    - {id: CX3G-03, note: "исходы названы (З15), `loop.go:376` — счётчик и журнал процесса; вето побочного следствия применено к MarkError и Confirm; держатель УК3-40"}
    - {id: CX3G-06, note: "личность `releaseAndDelete` — исполнителя, своей установки нет; `releaseAndDelete` одна функция (З12)"}
    - {id: CX3F-07, note: "(б) — З12, И18, вниманием по диффу"}

new_items:
  - id: CX3H-01
    decision: "З19, З21, З23 — строка-одиночка `inbox_clock` (выбор варианта (а) CX3E-06)"
    class: "code-authoring §«Умолчание, которое становится утверждением» (отсутствие строки неотличимо от исхода); §«Чужой ответ: классификация и бюджет» (ноль строк без классификации)"
    exposure: >-
      Три оператора зависят от одной строки `inbox_clock`: `UPDATE … SET pos = pos + 1 … RETURNING`
      приёма, `UPDATE … SET t = greatest(t, $E)` сводки и `WITH b AS (SELECT pos FROM inbox_clock)`
      отметки. `pos bigint NOT NULL` без умолчания. Кто вставляет строку, замысел не говорит (§6,
      §10; `grep -c inbox_clock` — 15 строк в design.md и 2 в tasks.md, вставки нет). Без строки приём
      получает 0 строк и не имеет позиции, поднятие `t` проходит без эффекта, и сводка закрывает
      окно без гарантии «все T ≤ E видимы». Отметка просмотра отвечает «за границей» на любое
      значение (CX3E-05).
    condition: >-
      (а) Строку создаёт миграция схемы `kacho_notify` (строка обязана существовать у любого
      арендатора, развернувшего продукт; это структура продукта, а не посев стенда), значение
      `pos = 0`, `t` — время миграции. (б) Каждый из трёх операторов различает «строки нет» и свой
      штатный исход: приём и сводка на нуле строк отказывают с именем инварианта (транзакция
      откатывается, `Ack` нет, окно не закрывается), отметка — по CX3E-05 выше. Классификации
      «0 строк → штатно» нет. (в) Уборщик и любые миграции строку не удаляют; `CHECK (singleton)`
      уже не даёт второй.
    held_by: "нужна проба (заказ integration-tester): строка удалена → приём отказывает, `Ack` не отправлен; сводка окно не закрывает; отметка отвечает отказом «строки часов нет», а не «за границей»; близнец — строка на месте"

