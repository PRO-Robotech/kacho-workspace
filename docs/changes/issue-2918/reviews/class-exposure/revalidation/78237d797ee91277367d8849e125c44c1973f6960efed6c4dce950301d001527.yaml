new_class_proposal: >-
  Кандидат, порог не набран (один экземпляр): «одноразовое значение, расходуемое операцией, судится
  гейтом по функции, где оно появилось, — повтор операции ниже функции расходует его дважды». Цена
  измерена (16 циклов, 4 на пути запроса), место одно. Второе наблюдение — в реестр; противоядие
  (кратность «одно значение — одна операция на пути») — gate-authoring.
