new_items:
  - id: CX3V-01
    severity: to_design
    blocking: true
    basis: корректность
    class: >-
      Решение и его следствие разнесены (code-authoring §«Решение и его следствие разнесены»): одноразовый
      токен (М1 (в): Begin расходует его, вторая Begin тем же значением — ErrAuthzRevisionSpent; повтор
      транзакции берёт новый токен на каждую попытку) судится гейтом, единица которого — функция, а не Begin
    decision: >-
      З34 М1 (г) правило 2 (признак token — наличие WithAuthzRevision и Current в теле) и правило 5
      (отмечающая функция — одна строка, «сколькими бы путями её ни достигали»; проходные, в том числе
      методы репозитория, отметок не несут); tasks.md FM0, общий блок FM-*
    finding: >-
      Правила 1–6 ничего не говорят о кратности Begin под одной отметкой. Проходная функция с циклом
      повтора вокруг Begin-достигающего вызова по правилу 3 отметки не несёт, гейт поднимается выше
      цикла, и отметка token над циклом даёт зелёный гейт. Интеграционная проба с флагом true (правило 5)
      проходит одну итерацию и тоже зелёная. На проде вторая попытка получает ErrAuthzRevisionSpent:
      мутация, которую код сегодня повторяет и доводит, падает. Разборщик по правилам 3–4 на e6075f09c2
      находит 16 функций, у которых Begin-достигающий вызов стоит внутри for/range; из них на пути запроса:
      vpc networkinterface CreateNetworkInterfaceUseCase.doCreate (create.go:320 — u.repo.Writer в цикле
      повтора при коллизии MAC), vpc nicinternal Service.Attach (service.go:116 — повтор на занятом слоте
      при автоиндексе), storage pg VolumeRepo.Attach (volume_repo.go:769 — повтор attachOnce при коллизии
      имени устройства; метод репозитория — по правилу 3 проходная), nlb CreateLoadBalancerUseCase.doCreate
      (create.go:509 — persistVIP на каждое семейство, два прохода при dualstack); прочие — фоновые циклы
      (FinishStuckDeletes, FreeIPRunner, TargetDrainRunner, storage Reconciler, registry
      SweepOrphanedRepositories). Без цикла: функций, у которых два и больше Begin-достигающих вызовов,
      165 (включая разные ветви); пример — nlb doCreate (insertHandle, persistVIP, finalizeCreate) —
      там проба с флагом true краснеет сама, а с циклом повтора и с dualstack — нет.
    predicate: >-
      Разборщик go/packages с типами по kacho вне *_test.go: множество функций, достигающих journaltx.Begin
      подъёмом по правилам 3–4; из них — функции, у которых место вызова, достигающее Begin, лежит внутри
      *ast.ForStmt или *ast.RangeStmt тела. На e6075f09c2: 16 (вывод: kacho-workspace/tmp/cea-ntf3-r24, режим
      loop). Контроль в обе стороны — те же места руками: create.go:313–320 (for attempt … Writer),
      volume_repo.go:761–769 (for attempt … attachOnce).
    condition_on_design: >-
      В правила З34 М1 (г) и УК3-79 — кратность: от одной отметки token до Begin на каждом пути ровно одна
      Begin. Красное: Begin-достигающий вызов внутри цикла (в отмечающей функции или в проходной ниже неё),
      в теле которого нет своего WithAuthzRevision, и два Begin-достигающих вызова, идущих после одного
      WithAuthzRevision. Следствие для формы кода: функция с циклом повтора над транзакцией (в том числе
      метод репозитория vpc, nicinternal, storage) — отмечающая, токен берётся в теле цикла, либо цикл
      поднимается в use-case. Пятая инъекция FM0 с близнецом: цикл повтора над Writer с токеном вне цикла →
      красное с координатой цикла; токен в теле цикла → зелёное. Печать — число таких циклов по модулю.
      Проба: интеграционная проба повтора (vpc NIC с принудительной коллизией MAC либо storage Attach с
      занятым именем устройства) при флаге true — вторая попытка проходит, ErrAuthzRevisionSpent нет.
    held_by: "нужен гейт — УК3-79 с правилом кратности (go-implementer, FM0); проба повтора — FM-v/FM-s"
  - id: CX3V-02
    severity: to_code
    blocking: false
    class: >-
      Распознаватель с избытком (testing-verdict п.14): сопоставление по реализации ставит в пути Begin
      реализацию, которой в этом месте нет
    decision: "З34 М1 (г) правило 4"
    finding: >-
      vpc attachNICAddresses и detachNICAddresses зовут AddressRepo.SetReference/ClearReference у писателя
      уже открытой транзакции (w.Addresses()); правило 4 сопоставляет вызов и с
      cqrsadapter.AddressAdapter.SetReference (cqrsadapter.go:172), который открывает свою транзакцию. Путь
      «к Begin» ложный: гейт потребует отметку там, где транзакции нет. Отказа на проде это не даёт —
      лишняя отметка безвредна или краснота ложная; поэтому неблокирующее.
    condition_on_code: >-
      Печать УК3-79 у каждого ребра через интерфейс называет реализацию, давшую сопоставление, чтобы перепись
      шага (1) FM-* видела ложный путь; подавление ложного ребра — только строкой ведомости с причиной, не
      отметкой.
    held_by: "печать гейта УК3-79; иначе вниманием переписи FM-*"
  - id: CX3V-03
    severity: to_code
    blocking: false
    class: >-
      Признак в теле функции — наличие вызова, а не поток значения (gate-authoring «исход вместо
      объявления»)
    decision: "З34 М1 (г) правило 2"
    finding: >-
      Отмечающая функция может вызвать WithAuthzRevision/WithoutJournal и передать вниз исходный ctx.
      Гейт зелёный; на проде — ErrNoAuthzRevision при флаге true. Отказ громкий и именованный,
      у строк token его ловит проба правила 5, у without_journal пробы нет — поэтому неблокирующее.
    condition_on_code: >-
      Признак засчитывается, когда результат WithAuthzRevision/WithoutJournal (или производный от него
      контекст) — аргумент ctx Begin-достигающего вызова; инъекция-близнец: вызов есть, вниз уходит
      исходный ctx → красное.
    held_by: "гейт УК3-79 (go-implementer, FM0)"

