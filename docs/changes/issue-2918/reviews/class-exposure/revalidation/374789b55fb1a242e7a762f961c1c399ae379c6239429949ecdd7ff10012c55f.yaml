new_items:
  - id: CX3J-01
    decision: >-
      Д33 и замысел NTF-1 ред. 12 (3ff838b1): функция `resource-event` формы `fanout` признаётся записью
      реестра `AuditFeedTableWrites` в `corelib/treehygiene`; «запись входит в реестр той же полосой
      NTF-3, которая даёт генератору эту форму, а тег corelib с записью, подъём пина kacho и миграции
      функций — одно изменение kacho»; Е10 NTF-1 заказывает замыслу NTF-3 четыре предмета (1)–(4)
    class: >-
      code-authoring §«Контракт, который нельзя выразить» (тело функции базы — производное генератора, у
      применённой миграции тело заморожено, у генератора — нет: без правила версий «тело равно выводу»
      при смене Mapping либо требует правки применённой миграции, либо краснеет навсегда);
      §«Решение и его следствие разнесены» (запись реестра — в corelib, функции — в миграциях kacho,
      признание — в гейте, который исполняется в трёх деревьях: посадка по частям даёт окно, где гейт
      красный либо запись пуста); §«Умолчание, которое становится утверждением» (атрибут `name` у вида
      без имени: '' из SQL-писателя против отсутствия ключа у Go-писателя — два написания «имени нет»)
    exposure: >-
      До Д33 функция базы была открытым решением, и замысел NTF-3 честно не называл, как она живёт у
      гейта NTF-1. Д33 решил, а NTF-1 ред. 12 превратил решение в запись реестра с тремя условиями
      признания ((а) побайтное равенство действующего тела выводу эталона, прежние тела — выпущенным
      версиям; (б) только `_notification_outbox`, строка `resource-event` формы `fanout`; (в) одна
      функция на журнал по идентичности, `CREATE OR REPLACE` — та же функция) и отдал NTF-3 четыре
      предмета. В замысле NTF-3 ред. 3 их нет: `treehygiene`, `AuditFeedTableWrites`, `OR REPLACE`,
      порядка посадки — 0 вхождений; S2-B1 в tasks.md не называет пути реестра; об атрибуте `name`
      сказано только «из полезной нагрузки строки DELETED по объявлению NameForm» (З10 п.3), исход у
      вида без имени не назван. Без (1) первая же правка `Mapping` (новый вид журнала) ставит автора
      перед выбором «править применённую миграцию» (ban #5) или «гейт красный»; без (2) полоса,
      садящая миграции раньше тега corelib с записью, красит УК87 на стволе kacho, а тег без миграций —
      красит самоистечение записи (ноль функций в области kacho → красный с именем записи).
    condition: >-
      (а) З10 называет правило версий тела: смена `Mapping` или `schema_rev` при той же версии схемы
      ленты — новая миграция `CREATE OR REPLACE FUNCTION` той же функции (та же идентичность
      `(схема, имя, журнал)`), выпускаемая `notifygen`; прежнее тело становится выпущенной версией
      генератора; правки применённой миграции нет; держатель — близнец NTF-1 CX1-75 (г) (две миграции:
      v1 и `CREATE OR REPLACE` после добавления вида → зелёный, функций на журнал 1) и инъекция
      «действующее тело отстаёт от Mapping → красный `-check` и гейта», исполняемые на дереве kacho
      полосой S2-B1. (б) Порядок посадки назван: тег corelib с формой генератора и записью реестра →
      подъём пина kacho → миграции функций пяти модулей — одним изменением kacho; S2-B1 в tasks.md
      несёт путь реестра `treehygiene` (дерево corelib) и зависимость от тега; окна, в котором на стволе
      kacho есть функция без записи или запись без функции, нет. (в) Атрибут `name` у строки, где
      имени нет, функция базы опускает ключом, как Go-писатель, а не пишет `''`; одно написание
      «имени нет» на оба писателя; держатель — сверка `notifygen -check` обеих половин плюс проба
      NTF3-160 на виде без `NameForm` (ключа `name` нет в атрибутах строки ленты). (г) Строку сигнала
      `notification_feed:<модуль>` генератор выводит для Go (`feed.Put` шаг 6) и для SQL из одного
      источника; З10 п.5 говорит это прямо, а не «тем же оператором». (д) З9, З10 и §13 Е1 переписаны
      по Д33: Е1 — не открытое решение, а зависимость «запись реестра на одобренном отпечатке замысла
      NTF-1»; фраза «Замысел NTF-1 требует обратного» снята; шапка — Д1–Д34.
    held_by: >-
      (а) — близнец и инъекции NTF-1 З16, исполняемые полосой S2-B1 на дереве kacho (заказ
      integration-tester/gate-author по записи NTF-1); (б) — вниманием по маршруту tasks.md и по
      составу изменения kacho; гейта «посадка одним изменением» нет и не будет — это свойство
      запроса на слияние, а не дерева; (в) — `notifygen -check` + проба на виде без имени (нужна, её
      нет: заказ integration-tester); (г), (д) — вниманием по тексту замысла.
    note: >-
      Пункт выведен из ЗАКОММИЧЕННОЙ ред. 12 NTF-1 (3ff838b1), у которой нет ни ревью, ни пересверки.
      Если следующая редакция NTF-1 изменит условия записи реестра или состав Е10, CX3J-01 пересверяется
      на ней; условия (а)–(в) при этом остаются классами, не зависящими от формулировки NTF-1.

