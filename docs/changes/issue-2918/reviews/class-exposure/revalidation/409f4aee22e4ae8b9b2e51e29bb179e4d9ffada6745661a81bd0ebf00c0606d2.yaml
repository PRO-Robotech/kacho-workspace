  summary: "CX3Q-01 отображён и выдерживает; новых пунктов нет"
  holds_now:
    - id: "CX3Q-01 (а) форма вне рабочего дерева git"
      reason: >-
        §11а УК3-65 и УК3-66 называют `grep -rn --include='*.go' --exclude='*_test.go'` по `$d` и
        равнозначную `git grep --no-index`; `git grep` без `--no-index` прямо назван неисполнимым. М29
        повторён: в каталоге пина `git grep` → «fatal: не найден git репозиторий» (rc 128), `--no-index`
        → 3, `grep -r` → 3 на одном имени `markErrorCAS(`.
    - id: "CX3Q-01 (б) предпосылки до подсчёта, провал — «не выполнилось»"
      reason: >-
        Предпосылки названы в порядке: код `go list` 0, `$d` непусто, `test -d "$d"`, объявление имени
        (`func FailTerminalCAS(` в `$d/operations` → 1; для УК3-66 — `test -d "$d/operations/opsnotify"`).
        Форма прогнана: пин v1.8.0 → «не выполнилось: объявлений 0» (это и есть «пин ниже тега X3»);
        `$d` пусто → «не выполнилось»; несуществующий каталог → «не выполнилось»; каталог-близнец с
        объявлением, двумя вызывающими вне тестов и вызовом в `_test.go` → контроль 2 (тестовый файл
        исключён, объявление вычтено). Предпосылка «$d непусто» не декоративна: на холодном кэше модулей
        `go list -m -f '{{.Dir}}'` выходит с кодом 0 и печатает пустую строку (замер с пустым GOMODCACHE),
        без неё подсчёт по пустому пути дал бы 0 — ровно дефект CX3Q-01. Порядок строк X5 и S3-C3
        (`go build ./...` до проб) кэш заполняет, поэтому на полосе предпосылка выполняется; на холодном
        прогоне вне полосы исход «не выполнилось» честный, не красный.
    - id: "CX3Q-01 (в) форма записана в §11а и в строках полос"
      reason: "tasks.md X5 и S3-C3 ссылаются на «форму УК3-65 замысла (CX3Q-01)» и повторяют `d=$(go list -m …)`; Е4 — на редакцию 16."
    - id: "прочие 114 строк §11"
      reason: "дельта их не трогает; сверено по диффу (изменён только абзац счёта строк)"
