#       отсутствие цикла между маршрутами;
#   (3) держатели тегов из перечня Д41, которых рёбра (1)–(2) не упорядочивают с окнами (3)–(4);
#   (4) новые внешние вызовы, асинхронные пути и sentinel-значения редакций 8–9.
# Разрешения писать реализацию эта запись не даёт.
