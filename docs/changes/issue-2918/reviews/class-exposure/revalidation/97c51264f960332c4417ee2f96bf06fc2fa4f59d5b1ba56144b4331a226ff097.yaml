# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и прежние пересверки (89d1f0ad, 3730bca2,
# 374789b5, 3dbb8b23, b34a411e) относятся к своим отпечаткам и здесь не переписываются.
# По Д22 это дельта: редакции 8 (ceca4a07) и 9 (97c51264) проверены одним диффом 51aa2c77d → e00befcee.
# Отдельной пересверки на редакцию 8 нет. Проверено:
