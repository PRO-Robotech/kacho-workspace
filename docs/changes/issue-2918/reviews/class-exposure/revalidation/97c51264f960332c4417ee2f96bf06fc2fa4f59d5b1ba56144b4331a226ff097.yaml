    Цена порядка Д41 — критический путь эпика 1790 → 2420 мин — названа автором замысла по его
    инструменту и в §13 Е6 объявлена верхней границей. Здесь это число не перемерялось: вывод записи
    от него не зависит, порядок — решение диспетчера (Д41). Атрибуция — design.md §13 Е6, ред. 9.
  - >-
    Подъёмы пина corelib в kacho изменениями вне эпика NTF (NTF-2, волны identity-own после v1.10.0)
    внутри окна X2-F. З10 п.4 запрещает «любое иное изменение kacho», это держится вниманием. Тегов
    X2-F и v1.10.0 нет, поэтому пересечение пока не измерить.

facts_for_dispatcher:
  - >-
    Окно тега T1 NTF-5 по определению Д37 длится от выпуска тега до посадки полосы, поднимающей на него
    пин kacho. Отдельно на T1 пин kacho не поднимается, его поднимает N5 на TW. Поэтому окно T1, если
    C3 выпущен до посадки S2-B1 NTF-3, по букве покрывает окна (3) и (4). Д41 требует рёбрами исключить
    пересечение только с (1)–(2), и это исполнено (C3 ← S3-C2 NTF-4). Для CX3J-01 (б) пересечение
    безвредно. Если «каждый тег» в Д41 понимается буквально и для (3)–(4), нужно ребро «C3 после посадки
    S2-B1 NTF-3». Цена этого ребра не измерена.
  - >-
    Окна тегов X1…X3 NTF-3 и T1 NTF-5 открываются после посадки S3-C2 NTF-4. Между собой их не
    упорядочивает ни Д41, ни маршруты. Для условия этого предмета это безвредно.
  - >-
    Маршрут NTF-4, §0: «Х1 — окно до посадки S1-A1». Но в путях S1-A1 `go.mod` нет (только
    `services/notify/internal/migrations/**`), хотя приёмка NTF-4 §10 п. S1 требует: «kacho поднимает
    пин corelib». Если пин на Х1 поднимает не S1-A1, окно Х1 длится до S2-B1 NTF-4 и пересекает окно Х3.
    Всё это внутри (2), на условие NTF-3 не влияет. Это находка к маршруту NTF-4.

