mapping_check:
  summary: "88 из 88 пунктов имеют строку, и все 88 выдерживают условие"
  holds_now:
    - id: "CX3J-01 (б)"
      reason: >-
        Условие пункта: на стволе kacho нет окна, в котором запись реестра есть, а функции нет. Запись
        попадает в kacho только с тегом corelib ≥ X2-F, потому что теги линейны (М21). Подъёмы пина на
        такой тег по источникам:
        (1) NTF-1: единственный подъём пина corelib в kacho — N11, и тег X2-F зависит от посадки N11;
        (2) NTF-4: теги corelib — Х1, Х3, Х5 (у X2, X4 — kaname), подъёмы — S2-B1 и S3-C2 «пины одним
        изменением»; тег X2-F выпускается после посадки S3-C2, после неё полос с `go.mod` в маршруте нет,
        поэтому тег NTF-4 внутри окна X2-F невозможен ребром;
        (3) NTF-5: пин kacho поднимает только N5 (единственная полоса NTF-5 с `go.mod` в путях до S2), N5
        зависит от C4 (TW), а C4 — от посадки S2-B1 NTF-3; T1, T2 отдельно в kacho не поднимаются;
        (4) сам NTF-3: X5 запрещено поднимать на тег ≥ X2-F до S2-B1, в том числе через kaname (X4); это
        держится вниманием по составу изменения kacho, как п.3 З10, и строка X5 это прямо говорит.
        Цикла рёбра не замыкают. Межмаршрутные рёбра полос идут только в одну сторону: NTF-4 → NTF-1,
        NTF-3 → NTF-1 и NTF-4, NTF-5 → NTF-3 и NTF-4. Обратных нет: полосы маршрутов NTF-1 и NTF-4 не
        ссылаются на NTF-3 и NTF-5, полосы NTF-3 не ссылаются на NTF-5. Е3 NTF-4 — ссылка на замысел
        NTF-3, а не на посадку полосы.
