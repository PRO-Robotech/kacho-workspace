  Кандидат, не заводится. «Радиус сигнатурной правки измерен на ревизии замера, а правка происходит на
  ревизии после посадки соседнего окна, которое добавляет вызывающих» (CX3N-01). Родственное
  наблюдение — М21 этого же замысла: подъёмы пина другими эпиками, тоже межзамысловое упорядочение. Но
  это тот же замысел и тот же эпик, то есть не независимое место. Цена прогоном не измерена (сборка
  упала бы громко). Порог §9 не пройден, это находка. Если вторая независимая встреча случится,
  владелец по противоядию — measurement-discipline (радиус берётся на ревизии применения).
