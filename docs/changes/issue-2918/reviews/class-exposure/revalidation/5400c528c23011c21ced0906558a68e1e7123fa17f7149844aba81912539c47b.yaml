not_measurable:
  - >-
    Зовёт ли корень notify-api NewReconciler на ревизии подъёма, решит посадка NTF-4. Замысел NTF-4
    (df1ce64d…, шаг 4 Р18, tasks S3-C2) говорит «да». Замысел NTF-5 (c33e4a82…, З4, CX5-35 (в))
    утверждает «ни notify-api, ни notify-sender не зовут operations.NewReconciler». Число 6 или 7 здесь
    не измерить: корня ещё нет в дереве. Условие CX3N-01 (а) сформулировано так, чтобы от этого не
    зависеть.
  - >-
    Сколько конструкторов use-case в пяти модулях получат *Worker (CX3N-04), зависит от раскладки,
    которую выберет реализация. Сегодня Worker никуда не передаётся. Нижняя граница — число файлов с
    вызовом Run; её я не считал, потому что вывод от неё не меняется.

facts_for_dispatcher:
  - >-
    CX3N-01. По Д41 тег X3 поднимается в kacho после посадки S3-C2 issue-2919, а та заводит корень
    notify-api с operations.NewReconciler (замысел NTF-4). Поэтому смена сигнатуры NewReconciler ломает
    сборку notify-api, которого нет ни в путях X5, ни в предикате «→ 6».
  - >-
    Замыслы NTF-4 (issue-2919, шаг 4 Р18: «сверщик операций operations.NewReconciler в корне
    notify-api») и NTF-5 (issue-2924, З4: «ни notify-api, ни notify-sender не зовут
    operations.NewReconciler») противоречат друг другу в одном факте о корне notify-api. Предмет не этой
    записи, но от него зависит радиус X5 NTF-3.
  - >-
    CX3N-02. Перевод 54 вызовов на RunWithWorker уронит действующий гейт
    TestEveryServiceWithAsyncMutationsResolvesOrphanedOperations: он опознаёт асинхронный сервис только
    по пакетному Run. Гейта нет в путях S3-C3. Падение громкое, риск в том, как его «починят».

