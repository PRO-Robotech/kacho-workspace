new_items:
  - id: CX3N-01
    decision: "смена сигнатуры operations.NewReconciler тегом X3; правка вызывающих подъёмом X5 (З16, X5, М24)"
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения»; code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей)"
    exposure: >-
      Радиус сигнатурной правки измерен на ревизии замера, а применяется на ревизии подъёма пина, между
      которыми по Д41 садятся окна (1)–(2). Одно из них (S3-C2 issue-2919) добавляет вызывающего. Исходы
      на реализации: подъём X5 не собирается (notify-api), либо полоса X5 правит седьмого вызывающего вне
      своих путей, либо под давлением «→ 6» кто-то правит предикат. К тому же у notify-api нет решения,
      какое значение FailedNotify он получает. notify — не подключённый модуль, и по смыслу ему положен
      NoFailedSender, но замысел этого не говорит.
    code_condition: >-
      (а) X5 правит ВСЕХ вызывающих NewReconciler в kacho на ревизии подъёма на тег X3. Предикат — не
      константа, а равенство двух чисел на этой ревизии: число вызовов `operations.NewReconciler(` вне
      тестов = число тех, что несут явный `operations.NoFailedSender` либо `NewFailedNotify(…)` и
      проверку ошибки. Значение на 1d42a6728bf (6) остаётся справкой. (б) В пути X5 включён корень
      notify-api (`services/notify/cmd/notify-api/**` либо корень, который назовёт NTF-4 по
      `notify_api_root`). Решено поимённо: notify-api получает `operations.NoFailedSender`, потому что
      notify в список пяти подключённых модулей не входит. (в) Если на ревизии подъёма корень notify-api
      NewReconciler не зовёт (см. противоречие NTF-4 и NTF-5 в facts_for_dispatcher), (а) даёт верный
      исход без правки замысла, так что условие не зависит от того, чей текст победит.
    held_by: >-
      Сборка kacho на ревизии подъёма (`go build ./...` X5) ловит пропуск вызывающего сама, громко.
      Предикат (а) ловит вызывающего, собранного без явного значения. Гейт не нужен, но нужна правка
      предиката и путей X5.
    outcome: к-замыслу
  - id: CX3N-02
    decision: "54 вызова пакетного operations.Run пяти модулей → RunWithWorker (З16, S3-C3)"
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код»; measurement-discipline §«Радиус: по имени механизма и по точкам применения»"
    exposure: >-
      Действующий гейт TestEveryServiceWithAsyncMutationsResolvesOrphanedOperations
      (internal/repohygiene/lroreconciler_test.go) опознаёт «сервис с асинхронными мутациями» ровно по
      вызову пакетного `Run` в services/<svc>/internal: callsOperationsFunc(…, "Run"), строка 97. После
      S3-C3 такой вызов не делает ни один модуль, asyncServices пуст, и гейт падает на строке 133 («ни
      один сервис не зовёт operations.Run — предпосылка распознавания сломана»). Падение громкое, но
      файла гейта нет ни в путях S3-C3, ни в §4 замысла. Полоса упрётся в красный на чужом гейте, и
      самый короткий «ремонт» — заменить «Run» на «RunWithWorker» либо ослабить предпосылку — не
      разобран. Промежуточное состояние (часть модулей уже на RunWithWorker) тише: мигрировавшие модули
      молча выпадают из требования «есть NewReconciler», пока хоть один модуль зовёт Run.
    code_condition: >-
      (а) S3-C3 включает internal/repohygiene/lroreconciler_test.go в пути. Распознаватель асинхронного
      запуска — набор {Run, RunWithWorker}, а не замена одного имени другим: модуль, вернувшийся на
      пакетный Run, остаётся асинхронным для этого гейта, даже когда его уже поймал УК3-59. Печать
      объёма называет, каким именем опознан каждый сервис. (б) Инъекция — снять NewReconciler в корне
      registry при RunWithWorker в use-case → красный с именем registry; близнец — на месте → зелёный.
      (в) Предпосылка «ни одного асинхронного сервиса → Fatal» сохраняется без ослабления.
    held_by: "сам гейт lroreconciler (краснеет громко); после правки (а) — его же инъекция (б). Заказ integration-tester на (б)."
    outcome: к-замыслу
  - id: CX3N-03
    decision: "гейт УК3-59 — запрет пакетного API operations в пяти модулях по узлу вызова с селектором пакета operations"
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (судить по идентичности, а не по имени)"
    exposure: >-
      В дереве пяти модулей пакет corelib/operations импортируется и под своим именем: `opmetrics` в
      4 файлах (compute, nlb, vpc — internal/observability/metrics/metrics.go; ещё один у geo). Селектор
      с буквальным именем «operations» не видит `opmetrics.Run(…)`, и гейт молча недосчитывает, а его
      запрет — ровно то место, где молчание дороже всего (CX3M-01: модуль на пакетном реестре молча не
      подключён). Действующий соседний гейт (lroreconciler_test.go) эту ловушку уже решил: имя пакета
      он берёт из объявления импорта.
    code_condition: >-
      УК3-59 определяет локальное имя пакета по объявлению импорта (оба суффикса пути — как
      operationsImportSuffixes соседнего гейта; лучше общий помощник, а не копия). Инъекция: файл
      use-case с `ops "github.com/PRO-Robotech/corelib/operations"` и `ops.Run(…)` → красный с
      координатой. Близнец — тот же импорт и `ops.RunWithWorker(w, …)` → зелёный. Точечный импорт
      (`. ".../operations"`) — находка сам по себе.
    held_by: "инъекция в УК3-59 — заказ integration-tester"
    outcome: к-коду
  - id: CX3N-04
    decision: "Worker корня передаётся в use-case; RunWithWorker(w, …) (З16, S3-C3)"
    class: "code-authoring §«Умолчание, которое становится утверждением»"
    exposure: >-
      RunWithWorker разыменовывает w без проверки (worker.go:628–630 → runOn:331). nil *Worker в
      use-case — паника на первом асинхронном RPC на пути запроса, а не отказ старта. Её ловит
      recover-перехватчик gRPC, если он есть, и клиент видит INTERNAL без созданной операции либо с
      осиротевшей строкой. Замысел ставит отказ в «конструктор набора use-case модуля». Но у модулей
      асинхронные use-case раскиданы по ресурсам (54 вызова в десятках файлов), и «набор» — не одно
      место. Держателя у отказа на nil нет: УК3-60 проверяет нулевое FailedNotify, а не nil Worker.
    code_condition: >-
      (а) *operations.Worker приходит в use-case одним значением зависимостей модуля, которое корень
      собирает один раз и проверяет на nil один раз, до приёма трафика. Каждый конструктор, берущий Worker
      не из этого значения, проверяет nil сам и отказывает с именем use-case. (б) Тестовые фикстуры
      модулей получают Worker тем же путём (NewWorker(NoFailedSender)), а не nil «для простоты».
    held_by: >-
      Близнец УК3-60 — корень модуля с nil Worker в зависимостях → отказ старта с именем службы. Для
      (б) — вниманием по диффу: однофайлового признака без разбора потока значений нет.
    outcome: к-коду
  - id: CX3N-05
    decision: "пакетный реестр снимается с пяти модулей (З16, И28)"
    class: "doc-truthfulness §«Утверждение, пережившее свой предмет» (скилл doc-truthfulness)"
    exposure: >-
      В пяти модулях 45 строк прозы описывают пакетный реестр как текущее устройство: 30 в не-Go файлах
      (docs/content/*/operations.mdx, docs/engineering/ARCHITECTURE.md, 09-go-skills-applied.md:99
      «operations.Run использует pkg-level registry», observability.mdx:251, newman
      PRODUCT-REQUIREMENTS.md) и 15 в Go-комментариях (например, nlb listener/*.go, vpc network/create.go:187).
      После S3-C3 они становятся ложью о модуле, и ни S3-C3, ни S3-C5 их не называет. Гейт УК3-59 по
      замыслу комментарии и документацию намеренно не судит.
    code_condition: >-
      S3-C3 (комментарии Go тем же изменением, что код) и S3-C5 (страницы и инженерные документы)
      переписывают упоминания пакетного API пяти модулей на Worker корня и RunWithWorker. Предикат
      полосы: `git grep -nE '\boperations\.(Run|ConfigureDefault|Start|Wait|Active|Ready)\b' --
      services/{compute,nlb,registry,storage,vpc} ':!*_test.go'` → 0 либо каждое оставшееся — с причиной
      (например, исторический раздел known-divergences, прямо названный историческим). Help-строки
      метрик «(operations.Active())» — тоже упоминание.
    held_by: "предикат полосы S3-C3/S3-C5; гейта нет и не будет — проза не судится разбором Go; держится вниманием при сдаче полосы с напечатанным числом"
    outcome: к-коду

