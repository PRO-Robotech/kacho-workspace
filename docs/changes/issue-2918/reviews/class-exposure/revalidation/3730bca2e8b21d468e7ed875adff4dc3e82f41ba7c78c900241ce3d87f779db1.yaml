new_items:
  - id: CX3H-02
    decision: "З13 «Место установки» — compute ставит `AsComponent(ctx, \"compute\", \"stuck-delete-finisher\")` в цикле FinishStuckDeletes до releaseAndDelete; эта личность пересылается владельцам"
    class: >-
      code-authoring §«Умолчание, которое становится утверждением» (пустой ответ сужающего чтения
      неотличим от «привязок нет», и по нему действуют разрушительно); §«Решение и его следствие
      разнесены» (личность выбрана ради строки журнала, а следствие — исход чужого чтения); gate-authoring
      §«Пустой вход как всеразрешение» (УК3-39 зелена ровно на дефекте)
    exposure: >-
      releaseAndDelete сначала читает привязки у владельцев: vpc InternalNetworkInterfaceService/ListByInstance
      и storage InternalVolumeService/ListAttachments. Оба чтения авторизуются на уровне данных
      (ScopeFiltered, listnarrow). Сегодня проход идёт без принципала, и PropagateOutgoing пересылает
      запасную `{system, bootstrap}`. `listnarrow.SubjectFromContext` не называет её субъектом
      (`TenantSubject` принимает только `user` и `service_account`) и отказывает `Unauthenticated`.
      compute получает ошибку, проход прерывается, строка остаётся в DELETING, привязки у владельцев целы.
      После редакции 2 пересылается `{user, system.compute-stuck-delete-finisher}`. Это названный
      субъект: `validSubjectID` точку пропускает, а по З13 аутентификацию у владельца он проходит.
      Модель спрашивают про идентификаторы страницы. Привязок у личности нет, и по CX3G-05 (1) под-фаза их
      не заводит. `listnarrow.Page` поэтому возвращает пустой набор БЕЗ ошибки, а storage при
      пустом `visibleInstances` возвращает `nil, nil`. Цикл отцепления не делает ни одного Detach,
      `repo.Delete` удаляет строку машины, и в журнал compute пишется `Instance DELETED`. Интерфейсы
      и тома остаются занятыми у владельцев навсегда: строка машины была единственной зацепкой к ним
      (комментарий releaseAndDelete: «строка последней — не стиль»). Storage уже прошёл этот класс:
      комментарий ListAttachments называет отменённое сужение по тому, при котором «том оставался занят
      навсегда». Исход меняется с самоисцеляемого повтора на необратимую утечку. Это нарушает И17 и
      CX3G-05 (б) и решает за kacho#2934 (Д31), чем становится доделыватель. У nlb класса нет:
      releaseFamily зовёт один пишущий глагол ReleaseOwnedAddress, исход читается из поля ответа, а
      отказ по праву классифицируется OutcomeDenied (как до правки). УК3-39 в редакции 2
      утверждает «строка Instance DELETED с инициатором system:compute-stuck-delete-finisher, отказа базы нет»,
      то есть ровно наблюдаемое следствие дефекта. Проба на машине без привязок зелена и на дефекте.
    condition: >-
      (а) Личность, которую проход compute пересылает владельцам, в под-фазе НЕ меняется. Ни
      `AsComponent`, ни иной `WithPrincipal` в цикле FinishStuckDeletes и выше него по стеку не ставится.
      Исход чтений ListByInstance и ListAttachments на проходе остаётся отказом, а не суженным пустым
      набором. Выбор пересылаемой личности доделывателя — предмет kacho#2934 (Д31, CX3E-04).
      (б) Строка журнала `Instance DELETED` из прохода, если до неё дошло, получает инициатора только из
      принципала контекста (З4, один источник). Раз принципала нет, `journaltx.Begin` в `repo.Delete`
      отказывает до оператора (CX3C-02 (б)), и проход прерывается тем же образом, что сегодня прерывается
      на чтении. Второго источника инициатора ради этой строки замысел не заводит (CX3B-25).
      (в) Близнец compute в УК3-31 снимается. Вход FinishStuckDeletes заносится в ведомость гейта
      строкой-исключением с причиной «пересылаемая личность доделывателя — kacho#2934; смена личности
      превращает отказ сужающего чтения в пустой успех (CX3H-02)» и предикатом снятия на внешнем факте:
      kacho#2934 закрыт, и в kaname на его ревизии есть привязка, выполняющая `viewer` на
      `compute_instance` и `viewer ∪ v_list` на `vpc_network_interface` для личности доделывателя, ЛИБО
      проход различает «сужено» и «пусто». Исключение печатается в объёме гейта, и гейт красный, если
      предикат снятия выполнен, а строка ещё стоит. Близнец nlb остаётся.
      (г) И17, строки §11 CX3D-01, CX3G-05, CX3B-25 (перечень вызывающих `AsComponent` сужается до двух:
      storage и nlb), §8 (пара `(compute, stuck-delete-finisher)` снимается вместе с единственным
      потребителем) и таблица фоновых путей З13 правятся тем же изменением.
      (д) Утверждение об исходе — сравнение с базой, а не абсолютное утверждение о жизненном цикле
      доделывателя (Д31): УК3-39 гоняет проход на машине С привязкой интерфейса и тома у владельцев под
      боевой посадкой фильтра (модель провязана, у личности привязок нет) и утверждает одно и то же на
      базовой ревизии и после правки: строка машины на месте, привязки у владельцев не сняты, строк
      журнала compute о машине 0. Прежнее положительное утверждение «Instance DELETED с инициатором
      system:compute-stuck-delete-finisher» из УК3-39 снимается.
    held_by: >-
      (а), (г) — вниманием по диффу и гейтом УК3-27 (д) (перечень вызывающих `AsComponent` — два); (в) — УК3-31
      со строкой-исключением и её предикатом снятия; (д) — проба УК3-39 в новой форме (заказ
      integration-tester). Выбор между (а) и иным исходом, сохраняющим исход прохода, остаётся за автором
      замысла. Только грант личности запрещён CX3G-05 (1).
    note_on_previous_record: >-
      Запись 89d1f0ad (holder_correction CX3D-01 (б), required) сама потребовала близнеца compute в
      УК3-31 и места установки «цикл FinishStuckDeletes до releaseAndDelete». Она проверила
      только пишущие вызовы (Detach) и не проверила читающие, которые releaseAndDelete делает до них.
      Редакция 2 исполнила это требование дословно. Ошибка — в требовании, не в исполнении.

code_conditions:
  - id: CX3B-25
    part: "(4)"
    text: >-
      У `AsComponent` три исхода на входе, а не два. Принципала нет — ставится принципал компонента.
      Принципал есть, и `InitiatorOf` даёт инициатора компонента — повтор, не отказ. Принципал есть, и
      `InitiatorOf` даёт ИНОГО инициатора ЛИБО сам отказывает (например, `{system, bootstrap}`) —
      `ErrComponentOverPrincipal`. Третий подслучай в З4 сейчас не назван: сравнение «инициатор не равен»
      не определено, когда инициатора нет. Отказ `AsComponent` у вызывающего — ошибка программы, не
      отказ среды. nlb: `reconcileOne` возвращает ошибку до `Begin`, тик прерывается и пишет строку
      журнала процесса. storage: функция перехода отказывает без оператора (как
      `ErrForeignTransitionInitiator`). Держатель — проба `journaltx` X1: близнец `{system, bootstrap}`
      в контексте → отказ.
  - id: CX3H-01
    part: "(г)"
    text: >-
      Отказ приёма `ingest.ErrInboxClockMissing` без `Ack` возвращает ту же строку ленты повторной выдачей
      после каждого срока аренды, пока строки часов нет. Отказ обязан расти читаемым счётчиком, как у
      сводки (hard-zero-refusals-visible), а не только строкой журнала процесса. Держатель — УК3-45:
      добавить утверждение о счётчике приёма.

