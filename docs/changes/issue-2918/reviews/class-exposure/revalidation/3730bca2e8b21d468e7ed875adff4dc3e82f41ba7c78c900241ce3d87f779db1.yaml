new_class_proposal: >-
  Предложение записи класса (не вписано, возвращается диспетчеру для tooling-maintainer). Класс: «смена
  личности, которую фоновый путь пересылает владельцу, превращает ОТКАЗ сужающего чтения в ПУСТОЙ
  УСПЕХ, и путь по нему действует разрушительно». Порог пройден: два независимых экземпляра с названной
  ценой. Первый — отменённое сужение по тому в storage ListAttachments (комментарий в дереве @1d42a6728bf:
  «том оставался занят навсегда»). Второй — CX3H-02 здесь (необратимая утечка привязок интерфейса и тома).
  Владелец по противоядию — code-authoring: «перед сменой пересылаемой личности перечисли сужающие
  (ScopeFiltered) чтения, достижимые со входа, и для каждого установи, что новая личность даёт тот же
  класс исхода (отказ либо полный набор), а не суженный пустой». Держится пробой на входе с непустым
  набором у владельца. Предикат снятия (внешний): в дереве нет ни одного ScopeFiltered-метода, чей
  потребитель действует по пустому ответу разрушительно, либо listnarrow различает в ответе «сужено до
  пустого» и «пусто».
