mapping_check:
  summary: "88 из 88 пунктов имеют строку; 87 выдерживают; CX3J-01 (б) не выдерживает в части окон NTF-4"
  not_holding:
    - id: "CX3J-01 (б)"
      reason: >-
        Условие — «окна, в котором на стволе kacho есть запись реестра без функции, нет». Окно X2-F
        отделено ребром от окна NTF-1 (тег X2-F после посадки N11 NTF-1; у NTF-1 один тег C12 и одна
        посадка пина N11) и от окна TW NTF-5 (C4 после посадки S2-B1). От окон NTF-4 ребра нет;
        держатель — правило Д37 вниманием диспетчера, и оно предписывает NTF-4 идти после TW. Этот
        порядок маршруты не исполнят: (1) C4 NTF-5 — «тег TW выпущен после T1, Х5, Х1» (issue-2924
        :109), а Х5 — тег NTF-4 (X5 issue-2919 :95), поднимаемый в kacho полосой S3-C2 NTF-4 — окно
        (4) открывается раньше окна (3); (2) стадия S1 NTF-5 гейтится Е4 — край NTF-4 (S3-C4 ← S3-C1 ←
        S2), а S2 NTF-4 — это S2-B1 NTF-4, «пины одним изменением» на теги X3, X4: окно (4) обязано
        закрыться раньше окна (3). При «одном окне за раз» окна NTF-4 (по крайней мере S2-B1 и Х5)
        стоят ДО окна TW. Значит, они встанут либо до выпуска тега X2-F, либо между посадкой S2-B1
        NTF-3 и выпуском TW. Замысел этого выбора не называет и называет держателем внимание «при
        выпуске тега X2-F». Такое внимание ловит окно NTF-4, открытое раньше, но не тег NTF-4,
        выпущенный внутри окна X2-F. Тег NTF-4 после X2-F несёт запись (теги линейны, М21), и его
        подъём до S2-B1 красит ствол kacho самоистечением. Довод замысла «ребро (3) → (4) замкнуло бы
        цикл» верен, но он доказывает, что неверен сам порядок Д37, а не что окна NTF-4 не нужно
        упорядочивать с окном X2-F. Автор замысла этого не исправит: Д37 запрещает прочие правки
        маршрутов.
  unmapped: []

