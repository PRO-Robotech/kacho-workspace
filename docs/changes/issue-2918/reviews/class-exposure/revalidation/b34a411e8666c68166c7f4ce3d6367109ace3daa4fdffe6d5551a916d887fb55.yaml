facts_for_dispatcher:
  - >-
    Перечень окон Д37 не называет окна тегов NTF-3 X1, X3, X4 (подъём — X5 «по мере выпуска»). X1
    зависит ни от чего («—»), X3 — от X1, поэтому их окна могут пересечься с окном NTF-1 (C12 → N11).
    Окно X2 отделено от NTF-1 через Е3, а от X2-F — зависимостью «тег X2 поднят». Для CX3J-01 (б) это
    безвредно: ранние теги записи не несут, и замысел верно говорит, что подъём на тег раньше X2-F
    ограничением не затронут. Но правило «одно окно за раз» такие окна нарушают. То же с тегами T1, T2
    NTF-5.
  - "tasks.md NTF-3 Е4 называет «открыта на редакцию 5» — после редакций 6, 7 это устарело (маршрут, не предмет записи)."

