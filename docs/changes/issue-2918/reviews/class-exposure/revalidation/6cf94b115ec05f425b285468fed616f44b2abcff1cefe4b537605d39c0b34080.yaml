    Сборку X3 с механизмом редакции 13 не прогнать: journaltx и NewNotifyingRepo ещё нет в дереве.
    Цикл доказан графом импортов действующего дерева (auth → operations) и назначением функций в
    замысле (operations → journaltx, operations → auth), а не прогоном компилятора.
  - >-
    Чем станет kaname_client.go NTF-5 относительно directory (CX3O-02), решают замыслы, а не дерево:
    в kacho @1d42a6728bf нет ни services/notify, ни одного из двух клиентов.

facts_for_dispatcher:
  - >-
    CX3O-01. Механизм К1 назначен в пакет corelib/operations, но требует импорта journaltx и auth.
    А auth уже импортирует operations (auth/propagate.go:50), и journaltx по З4 читает принципал из
    operations. Выходит цикл импортов, X3 не соберётся. Корень цикла — редакция 11 (CX3L-02,
    CX3L-03), и две прежние пересверки его пропустили. Исправление задевает только место механизма
    К1, а не его смысл, поэтому оно помещается в то же исключение из Д26.
  - >-
    CX3O-02. Два клиента одного сервиса справочника в notify-sender (directory NTF-3 и
    kaname_client.go NTF-5) — межзамысловый предмет. Выбор «один клиент» потребует правки замысла
    NTF-5.

