new_items:
  - id: CX3O-01
    decision: "механизм К1 в пакете corelib/operations: NewFailedNotify (auth), FailedNotify{journaltx.Options}, pgRepo.FailTerminal → journaltx.Begin/AsComponent (З4 (1), З16, §4, И25)"
    class: "code-authoring §«Контракт, который нельзя выразить»; measurement-discipline §«Радиус: по имени механизма и по точкам применения» (граф импортов как точка применения)"
    exposure: >-
      Механизм невыразим там, где он назначен. Цикл импортов в Go громкий: X3 не соберётся. Опасен
      обход, который реализация выберет сама, без разбора. (1) Обёртка вокруг FullRepo в
      подпакете, чтобы разорвать цикл. Она теряет необязательные интерфейсы pgRepo (executionClaimer
      — это заново открывает phantom-ресурс под перегрузкой, worker.go:470-500), а terminalFailer она
      либо теряет, либо переизобретает. (2) Перенос InitiatorOf или AsComponent в operations: второй
      дом нормализации субъекта, против CX3B-26 (а) и CX3E-02 (в). (3) Инициатор из строки вместо
      принципала. Цикл заложен с редакции 11: journaltx.Options вошёл в FailedNotify через CX3L-02,
      auth.SystemPrincipalFor — в NewFailedNotify через CX3L-03. Пересверки 7bc43f21 и 5400c528 его
      не заметили. Редакция 13 делает его несущим: Begin и AsComponent теперь зовутся из operations.
    code_condition: >-
      (а) Пакет corelib/operations не импортирует ни corelib/journaltx, ни corelib/auth, ни пакеты,
      которые от них зависят. Открытие транзакции под парой и построение FailedNotify попадают в
      operations значением интерфейса, который объявлен в operations (например, «открыть терминальную
      транзакцию» и отдать pgx.Tx либо интерфейс, объявленный в operations). Строит его пакет, которому
      разрешено импортировать и operations, и journaltx, и auth: journaltx или отдельный подпакет. Там
      же живёт проверка пары (CX3L-03) и отказ на нулевых Options (CX3M-02 (а)). Замысел называет этот
      пакет и имя конструктора. (б) Обёртки вокруг pgRepo для разрыва цикла нет. Если она всё же
      выбрана, замысел называет, как сохраняются executionClaimer, MetadataFinalizer, TerminalSweeper,
      OwnedOperationRepo и terminalFailer, и чем держится их сохранность. (в) Тип транзакции в
      экспортированной operations.FailTerminal(ctx, tx, …) назван, и он не *journaltx.Tx. (г) З4 (1),
      З16, §4 и И25 правятся тем же заходом: «одна неэкспортированная функция пакета operations» — это
      сейчас именно то место, которое не собирается.
    held_by: >-
      Компилятор на полосе X3 ловит цикл сам и громко. Выбор обхода держит предикат графа:
      `go list -deps ./operations | grep -E 'corelib/(journaltx|auth)$'` в corelib → пусто. Нужна проба
      предпосылки: предикат краснеет на ветке, где operations импортирует journaltx. Если выбрана
      обёртка — проба «ClaimForExecution достижим через репозиторий, который получает use-case».
    outcome: к-замыслу
  - id: CX3O-02
    decision: "клиент справочника отвергает вызов без срока — «свойство держит одна точка» (З27, И26)"
    class: "architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; doc-truthfulness §«Два места об одном предмете, где одно верно»"
    exposure: >-
      У InternalNotificationRecipientService службы доступа в notify-sender два клиента. Первый —
      services/notify/internal/directory этого замысла (Resolve, ListProjectAudience,
      ListExpiringCredentials, полоса S2-B9). Второй — services/notify/internal/clients/kaname_client.go
      замысла NTF-5 (DescribeScope, ListAccounts, Resolve; issue-2924/design.md строки 26, 298, 1843).
      Resolve одного сервиса зовётся через оба. Отказ без срока стоит только в первом. Утверждение З27
      «свойство "у каждого вызова справочника есть срок" держит одна точка» и И26 «каждый вызов
      notify-sender → справочник» верны для одного клиента из двух. Какой из двух — «клиент
      справочника», замысел не говорит, а имени kaname_client.go в замысле нет вовсе.
    code_condition: >-
      Замысел выбирает и называет одно из двух. (а) directory — единственный клиент
      InternalNotificationRecipientService в notify-sender, kaname_client.go NTF-5 его использует или
      становится им. Тогда предикат S2-B9 судит оба пути, а NTF-5 получает заказ. (б) Два клиента
      остаются. Тогда З27 и И26 сужают утверждение до пакета directory и называют второй клиент с его
      держателем: предикат NTF-5 «клиент своего срока не ставит» и его модульная проба на молчащую
      службу. В этом случае нужна строка сверки двух полос (один и тот же Resolve, один словарь исходов
      Р7 — resolvecell.Of).
    held_by: "вниманием до выбора; после (а) — предикат S2-B9 на обоих путях; после (б) — предикаты двух замыслов по отдельности, сверку двух полос держит внимание"
    outcome: к-замыслу
  - id: CX3O-03
    decision: "sentinel directory.ErrCallWithoutDeadline и его исход у вызывающего (З27, S2-B5, S3-C4)"
    class: "code-authoring §«Чужой ответ: классификация и бюджет»; code-authoring §«Умолчание, которое становится утверждением»"
    exposure: >-
      (1) Это не gRPC-статус. Если вызывающий пропустит ошибку через status.FromError → resolvecell.Of,
      получится codes.Unknown, а в таблице Р7 эта строка ведёт к DEFER/contactUnknown. Ошибка программы
      тихо станет «служба недоступна», хотя З27 обещает «resolvecell.Of его не видит». (2) Замысел
      увеличивает на отказе тот же счётчик отказа прохода, что и молчание страницы. Дефект программы и
      отказ среды в метрике неразличимы. (3) Отказ проверяет наличие срока, а не его размер. Вызов под
      унаследованным сроком прохода (тик) проходит отказ и висит до конца тика. Константу места вызова
      держат только УК3-56 и УК3-57 — для digest и reminder, а не «одна точка».
    code_condition: >-
      (а) У каждого вызывающего errors.Is(err, directory.ErrCallWithoutDeadline) проверяется до
      классификации статуса. Ветки, где ошибка без статуса доходит до resolvecell.Of, нет. (б) У счётчика
      отказа прохода своя метка для этого исхода (например, cause="no_deadline"), и она отлична от метки
      отказа страницы. (в) Текст З27 про «одну точку» сужен до «наличия срока». Размер срока — константа
      места вызова, её держат УК3-56 и УК3-57.
    held_by: >-
      Близнец УК3-56: заглушка вызывающего отдаёт ErrCallWithoutDeadline → проход прекращён, метка
      no_deadline +1, исхода DEFER/contactUnknown нет. То же — для УК3-57. (в) — правка текста, держится
      вниманием.
    outcome: к-коду
  - id: CX3O-04
    decision: "классификатор исходов pgRepo.FailTerminal (З16) и проза модулей о NewRepo (S3-C3)"
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (строка на исход); doc-truthfulness §«Утверждение, пережившее свой предмет»"
    exposure: >-
      (1) markErrorCAS различает три исхода: nil, ErrAlreadyDone, ErrNotFound (repo.go:259-266).
      terminalWrite обрабатывает ErrNotFound отдельно, без повторов (worker.go:575-579). Строки
      ErrNotFound в таблице З16 нет. Если pgRepo.FailTerminal обернёт его без %w либо запасная запись
      вернёт своё, строка уйдёт в «отказ среды» и будет повторяться весь бюджет. (2) Три комментария в
      пяти модулях называют operations.NewRepo как действующий конструктор репозитория корня:
      compute cmd/compute/recovery.go:38, compute internal/repo/quota.go:150, nlb
      cmd/kacho-loadbalancer/recovery.go:43. После S3-C3 они станут ложью. УК3-59 судит узел вызова, а
      комментарии — нет.
    code_condition: >-
      (а) В таблице З16 есть строка ErrNotFound: откат, запасной записи нет, ошибка возвращается с %w,
      terminalWrite не повторяет — как сегодня. Запасная запись возвращает свой исход тоже с %w. (б)
      S3-C3 переписывает три комментария тем же изменением, что и корни.
    held_by: >-
      (а) — проба X3: FailTerminal на отсутствующем id → errors.Is(err, ErrNotFound), строк 0,
      IncTerminalWriteRetries не вырос. (б) — предикат полосы S3-C3:
      `git grep -n 'operations.NewRepo(' -- services/{compute,nlb,registry,storage,vpc}` → 0. Гейта нет:
      прозу разбор Go не судит, держится вниманием при сдаче с напечатанным числом.
    outcome: к-коду

