mapping_check:
  summary: "85 из 85 пунктов имеют строку; 84 выдерживают; CX3J-01 (б) не выдерживает; новые CX3K-01, CX3K-02 без отображения; CX3K-03 — условие к коду"
  not_holding:
    - id: "CX3J-01 (б)"
      reason: >-
        Условие пункта — «окна, в котором на стволе kacho есть функция без записи или запись без
        функции, нет». Замысел закрывает его порядком, который связывает только полосы NTF-3: X5
        NTF-3 не поднимает kacho на тег ≥ X2-F, подъём входит в S2-B1. Но (1) X2-F зависит только от
        X2 и Е1 (tasks.md), а S2-B1 — ещё от S1-A1…A4: тег с записью может выйти за целую стадию до
        S2-B1; (2) теги corelib линейны — каждый следующий тег несёт запись; (3) пин corelib в kacho
        поднимают и другие изменения: NTF-4 S3-C2 поднимает пин на тег с Х5 (tasks.md NTF-4 :125,
        «пины одним изменением»), подъёмы пина за 2026-09-12…09-23 — 4 (замер ниже). Любой такой
        подъём на тег ≥ X2-F до посадки S2-B1 даёт в дереве kacho запись и ноль функций, а запись
        NTF-1 (:1024 и далее) говорит прямо: «Ноль в дереве области — записи нечего исключать, гейт
        красный с именем записи». Держатель «вниманием по составу изменения kacho» видит только
        изменение S2-B1, а не подъёмы соседей.
  unmapped:
    - {id: CX3K-01, reason: "новый пункт этой записи — следствие выбора CX3I-03 (б)"}
    - {id: CX3K-02, reason: "новый пункт этой записи — следствие выбора CX3I-01 (г) и довода М20"}

new_items:
  - id: CX3K-01
    decision: >-
      З23 (ред. 4): пустое и "0" в seen_up_to — отказ формы INVALID_ARGUMENT seen_up_to; правка с пустой
      маской — полная правка, seen_up_to из тела разбирается той же функцией; порядок в Update —
      «маска → разбор seen_up_to → оператор»
    class: >-
      code-authoring §«Порядок операций внутри кода» (порядок проверок полей одного запроса решает,
      какое нарушение увидит клиент); §«Умолчание, которое становится утверждением» (значение, которое
      чтение выдаёт, правка того же ресурса отвергает)
    exposure: >-
      NTF3-82 (м) — `PATCH /notify/v1/preferences` с `digestPeriod: "WEEK"`, маска не названа, Given —
      G0, у usr-A seenUpTo пуст; Then — 400 с полем `digest_period`. Если проба шлёт (м) с пустой
      маской, у usr-A в теле seenUpTo = "" — и по З23 разбор seen_up_to стоит сразу после маски, а
      место проверки digest_period в порядке не названо: отказ может прийти с полем `seen_up_to`, и
      NTF3-82 (м) красный на исправном продукте либо зелёный по случайному порядку. Второе: из текста
      не следует, что seen_up_to НЕ разбирается, когда его нет в маске, — правка маской `digest_period`
      телом, снятым с GET (seenUpTo = ""), у пользователя без отметки была бы отвергнута, хотя
      замысел сам называет маску `digest_period` путём для этого пользователя.
    condition: >-
      (а) З23 называет: seen_up_to разбирается, только если поле входит в действующую маску (названную
      либо пустую = полная правка); при маске `digest_period` значение seen_up_to в теле не читается;
      (б) порядок проверок при пустой маске назван полностью, с местом digest_period — либо отказ несёт
      оба нарушения полей, либо digest_period проверяется до seen_up_to; выбор согласован с NTF3-82 (м)
      так, что при любой форме маски, которую допускает текст (м), нарушение несёт поле `digest_period`;
      (в) проба NTF3-82 (м) называет свою маску, а если шлёт пустую — утверждает поле `digest_period`
      у пользователя с пустой отметкой.
    held_by: >-
      (а), (б) — нужна проба, её нет: PATCH маской `digest_period` телом с seenUpTo = "" у пользователя
      без отметки → done, digestPeriod изменён; PATCH с пустой маской, digestPeriod = "WEEK",
      seenUpTo = "" → 400 с полем `digest_period` (заказ integration-tester); (в) — NTF3-82 (м).
  - id: CX3K-02
    decision: >-
      §5, З23, М20 (ред. 4): позиция на проводе — поле `string`; `int64` отвергнут доводом М20, в том
      числе «значение не той формы отвергал бы разбор тела краем, до сервиса, без нарушения с полем
      seen_up_to (против NTF3-86)»; 23514 оператора → INTERNAL
    class: >-
      code-authoring §«Контракт, который нельзя выразить» (у значения на проводе два слоя разбора —
      край и сервис, и контракт называет только второй); measurement-discipline §«Предикат — только с
      контролем» (довод выбора проверен на одном варианте)
    exposure: >-
      Довод М20 верен для int64 и так же верен для string: край разбирает тело protojson до сервиса
      (сгенерированный *.pb.gw.go: `marshaler.NewDecoder(req.Body).Decode` → `status.Errorf(codes.
      InvalidArgument, "%v", err)`, без field_violations), а protojson принимает для строкового поля
      только JSON-строку (decode.go:330–333). JSON-число `10`, `true`, объект в `seenUpTo` отвергнет
      край текстом разборщика и без поля `seen_up_to` — ровно то, чем замысел дисквалифицировал int64.
      Выбор `string` от этого не ломается (он держится ещё двумя доводами: 0 → "" и одно написание),
      но (1) замысел утверждает о дереве асимметрию, которой нет; (2) NTF3-86 «значение не по форме
      позиции — 400 с полем seen_up_to» и литералы NTF3-161 (г) (`seenUpTo = 10`) в приёмке JSON-тип
      не называют — проба, пославшая число, получит отказ края на исправном продукте. Потребитель NTF-6
      шлёт строку (e05384ce: `seen_up_to: string`, `position: string`) — с выбором согласован. Третье:
      INTERNAL для 23514 этого оператора в дереве держит гейт единственного дома SQLSTATE
      (`TestIntegritySQLStateIsDecidedInOnePlace`): литерал "23514" в коде notify — находка, решение
      должно идти от классифицированного вида отказа, который выдаёт дом.
    condition: >-
      (а) З23 и §5 называют: значение позиции на проводе — JSON-строка; JSON-значение иного типа
      отвергает разбор тела краем (INVALID_ARGUMENT, текст разборщика, без нарушения поля) — это
      вне NTF3-86, который судит строковое значение; довод М20 против int64 переписан без ложной
      асимметрии (остаются 0 → "0" и множественность написаний); (б) пробы NTF3-86 (не по форме),
      NTF3-161 (г), УК3-47, УК3-48 шлют позицию JSON-строкой — это сказано в обвязке; (в) исход
      INTERNAL для 23514 этого оператора берётся из вида отказа, классифицированного единственным домом
      SQLSTATE, без литерала "23514" в notify; текст — фиксированный.
    held_by: >-
      (а) — вниманием по тексту замысла; (б) — Given/When проб (вниманием по диффу обвязки); (в) —
      `TestIntegritySQLStateIsDecidedInOnePlace` и `TestErrorMappersTailReturnsAFixedText` (kacho
      internal/repohygiene), покраснеют на литерале вне дома и на эхо ошибки.

