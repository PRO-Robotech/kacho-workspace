new_items:
  - id: CX3R-01
    decision: "З34 «Токен R_E — до транзакции записи»: значение передаётся «в journaltx.Options транзакции»"
    class: "code-authoring §«Решение и его следствие разнесены»; §«Умолчание, которое становится утверждением»"
    measured: >-
      corelib @1177490 journaltx/journaltx.go:81–97: Options — значение корня (`NewOptions(feedEnabled)`,
      Validate), не транзакции. kacho @515e017c87: `journaltx.Begin(` вне тестов — 24 вызова в 12
      файлах (compute 11, registry 6, storage 3, nlb 2, vpc 1, notify-probe 1). Каждый вызов стоит в
      слое репозитория и берёт Options из поля структуры (`r.journal`), заданного корнем. Сценарий
      использования до этого значения не дотягивается. vpc и nlb (`Repository.Writer`) и storage
      (`inJournalTx`) открывают journaltx на КАЖДУЮ запись, а не только на пишущие журнал.
    condition_on_code: >-
      (а) Замысел называет носитель токена на одну транзакцию: параметр Begin либо значение в контексте
      рядом с инициатором. Поле корневого Options носителем не является. (б) Отсутствие токена
      представлено отдельно от значения: при FeedEnabled Begin без токена, с нулём или отрицательным
      токеном отказывает именованной ошибкой до обращения к базе. Транзакция не открывается — близнец
      auth.ErrNoInitiator. Пустая настройка в базе — второй рубеж (УК3-68), а не первый.
      (в) Токен служит одной транзакции. Две Begin в одном контексте с одним токеном — вторая отказывает
      либо требует нового значения: «токен не кэшируется» выражено в коде, а не в прозе.
      (г) Радиус назван: каждая пишущая транзакция vpc, nlb, storage при включённом флаге зовёт
      CurrentAuthzRevision, потому что общий Writer не знает, будет ли строка журнала. Либо замысел
      выбирает отдельную форму открытия для транзакций без журнала с отказом базы на строке журнала.
      Транзакции, журнала не пишущие (opsnotify/FailTerminal, notify-probe), передают явное «журнала
      нет», а не пустой токен.
    holds_by: "нужна проба, её нет — УК3-72 (заказ ниже)"
  - id: CX3R-02
    decision: "З34 «Факты строит одна функция модуля на вид — та же, что набор намерения» и «Поколение — один производитель»"
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения); §«Унификация и стоимость»"
    measured: >-
      kacho @515e017c87: журнал storage целиком пишут функции базы (`storage_outbox_emit`,
      `_attachment`, `_source`, `_lineage`; миграции 20260828153423, 20260830041500, 20260830120000).
      vpc `subnets_outbox_emit_route_table_change` и nlb `lb_status_recompute` пишут часть журнала
      функциями базы. Намерения всех пяти модулей строит Go: storage — `internal/fgaregister`
      (`StorageVolume`, `VolumeItem`…).
    condition_on_code: >-
      (а) Для каждого вида события, строку журнала которого пишет функция базы, замысел называет
      ОДНОГО писателя четвёрки: строка журнала, факты, g_E, строка намерения. Либо функция базы пишет и
      намерение тем же значением поколения из своей переменной, либо Go берёт g_E и передаёт его
      функции. Два вызова next_object_generation на одно событие запрещены. Формулировка «одна функция
      модуля на вид» верна только для видов, у которых журнал пишет Go. (б) Если факты и набор у вида с
      функцией базы строит SQL, «второго вычисления нет» верно только при едином источнике (SQL-функция
      фактов вида, которую зовут и триггер, и Go). Иначе нужна сверка двух половин гейтом. (в) Проба:
      у события, порождённого функцией базы (storage Volume CREATED, vpc Subnet UPDATED при смене
      таблицы маршрутов, nlb LoadBalancer UPDATED по статусу), journal.generation равно
      intent.generation, факты строки журнала равны полям намерения.
    holds_by: "NTF3-175 и NTF3-187 (в) ловят второе место вычисления поколения; равенство пары не ловит никто — УК3-73"
  - id: CX3R-03
    decision: "З34 «Аккаунт берётся из того же источника, что сегодня parent_account_id намерения»"
    class: "measurement-discipline §«Чужое измерение и чужое заявление»; code-authoring §«Умолчание, которое становится утверждением»"
    measured: >-
      `git grep -ciE 'parent_account_id|ParentAccountID|parentAccount' origin/2914-notify --
      'services/<svc>/*.go' ':!*_test.go'`: compute 6 (3 файла), nlb 7 (3 файла), vpc 0, registry 0,
      storage 0. Контроль: в эмиттерах намерений vpc, registry, storage слова account нет. Есть оно
      только в клиенте registry iam_client.go — 8 раз, вне построения намерения.
    condition_on_code: >-
      Заявление замысла верно для двух модулей из пяти. Для vpc, registry, storage замысел выбирает одно
      из двух. (1) Новый источник в модуле — это новый внешний вызов: срок, fail-closed до транзакции,
      классификация отказа, пункт §9. (2) account_id вычисляет служба доступа по проекту. Тогда модуль
      его не шлёт, и перечень фактов Р3 приёмки меняется — вернуть в приёмку. Пустая строка в
      account_id факта как «не знаем» запрещена: служба доступа примет её за факт «аккаунта нет».
    holds_by: "держателя нет: NTF3-165 (охват аккаунта) красен только у модуля, чей посев проверяет аккаунт — нужен близнец по каждому из пяти модулей"
  - id: CX3R-04
    decision: "З34 «Намерение: одна строка на событие одного объекта, один вызов», поколение в строке"
    class: "code-authoring §«Чужой ответ: классификация и бюджет»; data-integrity partition-head-claim"
    measured: >-
      Сливы намерений пяти модулей держат голову партиции по `resource_id` с порядком по id строки:
      compute cmd/compute/main.go:1289, vpc cmd/vpc/main.go:1043, registry serve.go:445, storage
      register_drainer.go:67, nlb wiring.go:363. Комментарий compute main.go:1263–1288 называет и
      причину: порядок claim — (attempt_count, id).
    condition_on_code: >-
      (а) Внутри партиции объекта порядок выдачи равен порядку поколений. Замысел называет, чем это
      держится: claim сравнивает generation, либо id строки намерения выдаётся после захвата строки
      счётчика той же транзакцией. Тогда замок счётчика упорядочивает id, и это сказано с координатой.
      (б) REJECTED_STALE — строка закрытого классификатора слива: подтверждение без повтора, счётчик
      с меткой причины. Не transient (иначе poison до MaxAttempts), не «прочее». (в) Публикация
      registry (SetPublicReadPublication) и регистрация того же объекта стоят в ОДНОЙ партиции, если
      служба доступа сравнивает object_generation публикации с головой регистрации. Иначе замысел
      говорит, почему порядок между ними не важен. (г) Переименование registry — две партиции (два id),
      и это названо.
    holds_by: "NTF3-188 (в) — параллельные события одного объекта; кросс-батчевой пробы на перестановку (поколение n+2 выдано раньше n+1) нет — УК3-74"
  - id: CX3R-05
    decision: "З34 факты UPDATED: previous_labels, previous_parent_chain"
    class: "code-authoring §«Порядок операций внутри кода»; data-integrity db-select-for-update"
    condition_on_code: >-
      Прежние метки и цепь у событий, которые пишет Go, берутся из строки под замком той же транзакции:
      UPDATE с CTE, возвращающим прежнее значение, либо SELECT … FOR UPDATE до UPDATE. Чтение вне
      транзакции записи или без замка запрещено. Две параллельные правки меток одного объекта:
      previous_labels второй равны labels первой. У функций базы источник — OLD, и это сказано.
    holds_by: "NTF3-167 — одиночная правка; на гонку пробы нет — УК3-75"
  - id: CX3R-06
    decision: "З34 «Отказ пути токена (недоступна, срок истёк, отказ метода) — мутация UNAVAILABLE PEER_UNAVAILABLE»"
    class: "code-authoring §«Чужой ответ: классификация и бюджет»; security-hardening hard-misconfig-is-not-outage, hard-control-carries-address-and-credential"
    condition_on_code: >-
      (а) Классификатор ответа CurrentAuthzRevision закрыт. Сбой (UNAVAILABLE, DEADLINE_EXCEEDED) и
      неверная настройка (PERMISSION_DENIED — модуль вне круга; UNIMPLEMENTED — старый пин;
      UNAUTHENTICATED) различаются меткой счётчика и уровнем журнала процесса. Клиенту по NTF3-179 (а)
      ответ один — UNAVAILABLE. Ответ с нулевым токеном — нарушение контракта, отказ до Begin.
      (б) Срок вызова — константа пакета в месте вызова, имя константы в §8. (в) Флаг ленты включён —
      адрес службы доступа и удостоверение к ней у модуля объявлены, иначе отказ старта. Адрес из
      базового URL соседа не выводится. Если используется уже объявленный клиент регистрации
      намерений, это сказано с координатой.
    holds_by: "NTF3-179 (а) — только недоступность; близнеца «неверная настройка» нет — УК3-76"
  - id: CX3R-07
    decision: "З34 приём: ListEventAudience всех страниц до транзакции, одна транзакция «запись + строки аудитории + INGESTED»"
    class: "code-authoring §«Унификация и стоимость» (стоимость страницы принадлежит запросу); §«Решение и его следствие разнесены»"
    condition_on_code: >-
      (а) Строки аудитории пишутся только тогда, когда запись ленты вставлена в этой транзакции
      (`INSERT … ON CONFLICT DO NOTHING RETURNING`, 0 строк — аудитория не пишется). Повторная выдача
      после утраты аренды не сливает две выборки аудитории. Уникальность (запись, субъект) — в схеме.
      (б) Срок — один контекст на весь обход страниц, а не на каждую страницу. Константа меньше срока
      аренды строки NTF-1, и это сравнение проверяется при старте или гейтом. (в) «Прочитал аудиторию,
      аренду потерял, коммит» — отказ транзакции на сверке аренды либо пустая вставка по (а), без
      второй аудитории.
    holds_by: "УК3-71 — срок и 0 сетевых вызовов; близнеца повторной выдачи нет — УК3-77"
  - id: CX3R-08
    decision: "З34 «Объект права события снят»: выдача ленты по строкам аудитории вызывающего без вопроса службе доступа"
    class: "security-hardening hard-authorize-at-data-scopefiltered, hard-empty-subject-rejected; doc-truthfulness (два места об одном)"
    measured: >-
      design.md строка 1574 («Изъятия осей дескриптора») утверждает, что `NotificationInboxService.List`
      судится `listauthz` постранично, и снимает изъятие Narrowers по этой причине. З34 строка 1746
      говорит обратное.
    condition_on_code: >-
      (а) Пустой субъект вызывающего отвергается до запроса. В таблице аудитории CHECK (subject <> '').
      (б) Ось дескриптора notify-api для List описывает сужение на уровне данных (строки аудитории) и
      помечена так, как требует TestScopeFilteredRowsBelongToADomainThatEnforcesThem. Абзац строки 1574
      переписан под З34.
    holds_by: "NTF3-172 (выдача без вызова службы доступа); TestScopeFilteredRowsBelongToADomainThatEnforcesThem на ревизии посадки"
  - id: CX3R-09
    decision: "заметка редакции 17: «Прежние решения, не названные здесь, приёмкой редакции 42 не затронуты»"
    class: "doc-truthfulness — утверждение, пережившее предмет"
    measured: >-
      Опровергнуто по разделам. §6 «Схема БД» — нет таблицы аудитории в kacho_notify, колонок
      generation/facts журнала, таблицы object_generation. §7 п.1 — мутация без вызова токена; п.2 —
      приём без чтения аудитории. §8 — нет срока пакета ingest и срока вызова токена модуля. §9 —
      нет рёбер «модуль → kaname CurrentAuthzRevision» и «notify-sender → kaname ListEventAudience»,
      осталось «notify-api → kaname Check, BatchCheck» для ленты. §3 И26 — только digest и reminder.
      §11 строка CX3B-46 — З20 (снят) отображена в S2-B4 с держателями NTF3-73, 74. §11а УК3-62 —
      перечень методов клиента с ListProjectAudience. Строка ДР-К2 — ListProjectAudience в digest.
      Строка 1574 (CX3R-08). З22 без пометки, хотя З34 меняет адресатов мгновенного письма. З21 без
      пометки в заголовке.
    condition_on_code: "каждое из перечисленных мест переписано под З34 либо помечено «заменено З34» с указанием, что действует"
    holds_by: "вниманием; гейта полноты отображения замысла на приёмку нет (семейство cg.class видит только пункты разбора)"
  - id: CX3R-10
    decision: "З34 «Посев стенда vpc — с токеном»: рецепт берёт токен вызовом с сертификатом модуля vpc"
    class: "security-hardening hard-machine-gets-grant (личность берётся взаймы)"
    condition_on_code: >-
      Рецепт посева исполняется заданием стенда с примонтированным удостоверением vpc. Ключ не
      копируется на диск вне пода и не попадает в журнал процесса. Инициатор транзакции посева
      остаётся `system:stand-seed`, а токен — значение, не личность. Замысел говорит, почему посев не
      получает своего места в круге CurrentAuthzRevision (круг — модули-владельцы, NTF3-179).
    holds_by: "NTF3-162 — исход посева; источник удостоверения — вниманием по диффу полосы FM-v"
  - id: CX3R-11
    decision: "маршрут S2-B7L — подписка с отбором по меткам (решение владельца 2026-10-08 (2)); Е9"
    class: "вернуть в приёмку; code-authoring §«Умолчание, которое становится утверждением» (отбор по изменяемому признаку)"
    condition_on_code: >-
      Приёмка редакции 42 держит предмет вне объёма (§6, Д129 (7)), а решение владельца ставит его в
      релиз. Нужна дельта приёмки, затем решение замысла. До этого у S2-B7L нет путей и размера, и
      это открытое решение, а не полоса. В дельте приёмки сказано: (а) подписка уведомлений —
      объект notify, а не поток corelib.subscription (там отбор по меткам запрещён:
      api-sub-no-name-filter, sub-no-label-filter); (б) «вышел из выборки» отличается от «удалён» —
      по previous_labels (CX3R-05); (в) право на событие подписчика по меткам — та же ограда
      Resolve{event, via_subscription}, не отдельный путь.
    holds_by: "Е9 — одобренная дельта приёмки"

