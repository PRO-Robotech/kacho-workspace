new_items:
  - id: CX3Q-01
    decision: >-
      УК3-65 и УК3-66 (редакция 15): контроль в обратную сторону для kacho и kaname — «тот же предикат
      (`git grep …`) по каталогу закреплённой версии corelib (`go list -m -f '{{.Dir}}'` модуля corelib)»
    class: "gate-authoring §«Исход вместо объявления»; measurement-discipline §«Предикат — только с контролем»"
    exposure: >-
      Каталог модуля в кэше Go — не рабочее дерево git. Замер в kacho @1d42a6728bf: Dir =
      ~/go/pkg/mod/github.com/!p!r!o-!robotech/corelib@v1.8.0; `git -C <Dir> grep …` и `cd <Dir> && git grep
      …` → «fatal: не найден git репозиторий», `git grep … -- <Dir>/operations` из kacho → «is outside
      repository». Stdout пуст, поэтому форма «`… | wc -l`» печатает 0, а контроль ждёт ≥ 2 (УК3-65) и 1
      (УК3-66). Контроль в написанной форме красный всегда, на любом дереве: он не отличает «предикат не
      видит имени» от «предикат не запустился». Полоса либо не сдаётся, либо переписывает контроль на
      ходу без записи — и тогда ослабление контроля неотличимо от починки. Замер той же строки рабочей
      формой: `cd <Dir> && git grep --no-index -n 'markErrorCAS(' -- ':!*_test.go' | wc -l` → 3, равно
      `git -C corelib grep … 34bc8104a` → 3; `grep -rn --include='*.go' --exclude='*_test.go'` → 3.
    code_condition: >-
      (а) Контроль УК3-65 и УК3-66 по каталогу закреплённой corelib исполняется формой, которая работает
      вне рабочего дерева git: `git grep --no-index` с каталогом модуля текущим, либо `grep -rn
      --include='*.go' --exclude='*_test.go'`. (б) Отказ самой команды (fatal, пустой Dir у `go list -m`,
      модуль corelib не в графе) — исход «не выполнилось», а не 0: проба проверяет, что Dir непуст и
      существует, до подсчёта. (в) Текст §11а УК3-65, УК3-66 и строк X5, S3-C3 tasks.md назван этой формой,
      чтобы полоса не выбирала её сама.
    held_by: >-
      Гейта нет, предмет — сам текст предиката. (а), (в) — правкой §11а тем же заходом отображения;
      (б) — строкой пробы полосы; исполнение видно только прогоном — заказ integration-tester.
    outcome: к-замыслу

