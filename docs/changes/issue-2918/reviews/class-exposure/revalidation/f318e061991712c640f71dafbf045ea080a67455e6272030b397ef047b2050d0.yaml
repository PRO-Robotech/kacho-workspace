new_items:
  - id: CX3U-01
    severity: to_design
    blocking: true
    class: >-
      Два места об одном предмете (doc-truthfulness) и перечень по памяти вместо предиката
      (flow-acceleration fa-b5): определение обёртки УК3-79 и перечень обёрток в той же строке расходятся
    decision: "УК3-79, М1 (г), FM0: «обёртка — функция пакета вне тестов, принимающая ctx и зовущая Begin в своём теле (vpc и nlb Repository.Writer, storage inJournalTx, inComponentTx, registry runConfigTx)»; печать «25 точек Begin»"
    finding: >-
      По этому определению на e6075f09c2 обёртками являются 24 из 25 объемлющих функций Begin, а не 5:
      compute 11 (InstanceRepo Insert/Update/SetStatusCAS/MarkDeleting/Delete, GuestAccessKey и
      PlacementGroup Insert/Update/Delete), registry 6 (Insert, Update, MarkDeleting, Delete,
      emitRepoIntent, runConfigTx), storage 3 (Register, inJournalTx, inComponentTx), nlb 2 (Writer,
      reconcileOne), vpc 1 (Writer), notify-probe 1 (put); не обёртка — только pkg/feedjournal/feedjournaltest
      (нет параметра ctx). Следствия. (1) notify-probe: Send зовёт put(ctx, addr) (send.go:90), а Begin
      стоит в put (send.go:106); WithoutJournal(ctx) — отметка через контекст. Если точка — вызов обёртки,
      признак without_journal требует вызова WithoutJournal в Send, а инъекция FM0 «снятая отметка у
      notify-probe → красное, близнец → зелёное» про место отметки не говорит. Если точка Begin внутри
      обёртки тоже остаётся строкой, у неё нет единственной верной отметки: у обёртки со смешанными
      вызывающими (токен у одних, без журнала у других) любая отметка ложна для части из них. Текст не
      говорит, заменяет ли вызов обёртки точку Begin внутри неё или добавляется к ней. (2) Карточки
      FM-c, FM-r (кроме runConfigTx), FM-s (Register), FM-n (reconcileOne) строк на вызовы этих обёрток
      не заказывают. (3) Замер «vpc .Writer(ctx — 68 в 51 файле»: из 68 строк git grep 14 — комментарии,
      объявления методов интерфейсов и само определение; вызовов 54.
    condition_on_design: >-
      УК3-79 говорит одно: точка Begin, объемлющая функция которой — обёртка, строкой ведомости НЕ
      является; точками становятся её вызовы (по каждому уровню, где функция с ctx лишь передаёт
      контекст дальше). Перечни и числа обёрток в М1 (г), УК3-79 и FM0 заменить предикатом и выводом гейта
      («обёрток 24, вызовов 117 на e6075f09c2» — пример замера, а не ведомость); отметка notify-probe —
      в Send; карточкам FM-c, FM-r, FM-s, FM-n — строки на вызовы своих обёрток.
    held_by: "гейт УК3-79 (FM0) после правки текста; до неё — рецензент замысла"
  - id: CX3U-02
    severity: to_design
    blocking: true
    class: >-
      Распознаватель по идентичности молча теряет вызов через порт-интерфейс (gate-authoring
      «производитель входа»; testing-verdict п.14 «собственный разборщик — тоже распознаватель»)
    decision: "УК3-79: «обёртку гейт находит разбором; её точка — каждый вызов обёртки вне тестов»"
    finding: >-
      Вызов обёртки, сопоставленный по объекту функции (types.Info.Uses → *types.Func), находит на
      e6075f09c2 27 вызовов: reconcileOne 1, put 1, emitRepoIntent 2, runConfigTx 4, inComponentTx 4,
      inJournalTx 15. Остальные 90 из 117 идут через методы интерфейсов-портов use-case-слоя и
      сопоставляются с обёрткой только по реализации интерфейса: vpc Repository.Writer 54, nlb
      Repository.Writer 20, compute 11, registry 4, storage Register 1. Те две обёртки, ради которых
      заведён CX3T-02 (vpc и nlb Writer), прямых вызовов не имеют вовсе — гейт по объекту функции
      напечатает им 0 и будет зелёным. Сопоставление по имени метода даёт обратную ошибку: в дереве
      есть Writer, Insert и Delete других типов.
    condition_on_design: >-
      УК3-79 сопоставляет вызов метода интерфейса с обёрткой по реализации (тип-получатель обёртки или
      указатель на него реализует интерфейс вызова), а не по имени и не только по объекту функции;
      печатает число вызовов каждой обёртки; обёртка без найденных вызовов — красное с координатой
      (проверка предпосылки, иначе 0 у vpc Writer неотличим от зелёного); третья инъекция — вызов
      Writer у порта use-case-слоя vpc без строки ведомости → красное с координатой вызывающего,
      близнец — со строкой → зелёное.
    held_by: "нужен гейт — УК3-79 в этой форме (go-implementer, FM0)"
  - id: CX3U-03
    severity: to_code
    blocking: false
    class: >-
      Решение и его следствие разнесены (code-authoring): у отметки token нет признака в объемлющей
      функции, у without_journal он есть
    decision: "УК3-79: token — интеграционная проба с флагом true; without_journal — вызов WithoutJournal в объемлющей функции"
    finding: >-
      Токен едет в контексте (WithAuthzRevision), поэтому поставить его может любой уровень выше точки.
      Пример на e6075f09c2: compute Start/Stop/Restart → lifecycle (instance.go:750, 756, 762) →
      repo.SetStatusCAS (instance.go:772) → Begin. Точка — вызов в lifecycle, одна строка, одна проба
      (например, Start с флагом true); если токен берут в Start и не берут в Stop, строка зелёная,
      а Stop при флаге true получит ErrNoAuthzRevision только на проде. Без признака в функции
      токен-отметка — объявление, проверенное одной пробой из N входов.
    condition_on_code: >-
      Признак token — вызов порта токена (authzrev.Source) с journaltx.WithAuthzRevision в объемлющей
      функции точки, симметрично without_journal; проба с флагом true остаётся вторым признаком.
      Тогда токен ставится там же, где открывается транзакция или вызывается обёртка, и вход выше
      пропустить его не может.
    held_by: "гейт УК3-79 (признак отметки) — go-implementer, FM0"
  - id: CX3U-04
    severity: route
    blocking: false
    class: "Сосед — одобренная редакция с отпечатком; опора сменилась (fa-b7)"
    decision: "§2 Е9 и замысел §13 Е9: «последняя запись c4242028 (редакция 5, круг 5, RETURNED); текст не закоммичен»"
    finding: >-
      После предмета в issue-880 коммиты c5e050f3a (запись ревью NTF-7 редакции 6 — APPROVED, круг 6)
      и 705010432 (текст NTF-7 редакции 6, da7de8d7…, закоммичен). Шаги Е9 стали исполнимыми: правка
      NTF-3 по NTF-7 DoD 10.4 п.3 (автор приёмки NTF-3, до посадки S1 NTF-7) и пакет изменения NTF-7 с
      рёбрами окна В-5.
    condition_on_route: "Е9 — NTF-7 da7de8d7… APPROVED (круг 6); производители правки NTF-3 и маршрута NTF-7 запущены"
    held_by: "docs-gate check-01 на тексте NTF-7; остальное — вниманием"

