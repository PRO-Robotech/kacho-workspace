new_items:
  - id: CX3W-01
    severity: to_code
    blocking: false
    basis: корректность
    class: >-
      Распознаватель с недостачей (testing-verdict п.14): go/cfg строит граф одной функции и не упорядочивает
      тело литерала функции и отложенный вызов — правило 7 молчит, как с ними быть, а правило 1 делает тело
      литерала частью объемлющей
    decision: "З34 М1 (г) правила 1 и 7; §11а УК3-79"
    finding: >-
      Пакетная документация go/cfg (tools v0.50.0): граф «statements and expressions within a single
      function»; литерал — выражение, его тело своими блоками в граф объемлющей не входит; DeferStmt стоит
      узлом в месте регистрации, исполнение на выходе не моделируется. Следствия: (1) цикл внутри литерала
      (go func(){ for { … } }()) и литерал, вызываемый помощником или переменной многократно, в графе
      объемлющей не видны — отметка token в объемлющей функции даст зелёный гейт, вторая итерация получит
      ErrAuthzRevisionSpent; (2) отложенный вызов судится в точке регистрации, а не после последующих Begin.
      Мест в дереве на пути token сегодня нет: Begin-достигающих мест вызова в телах литералов 296, из них
      в цикле внутри литерала 1 — registry startOrphanSweepBackstop (orphan_sweep_backstop.go:59, проход
      сверки прав — журнала модуля, по тексту файла, не пишет, ожидаемая отметка without_journal);
      operations.Run (48) и RunSync (22) зовут fn ровно один раз (corelib worker.go:513, :664); отложенный
      Begin-достигающий вызов на пути token — 1: nlb doCreate defer → compensateCreate → deleteHandle
      (create.go:500, :802) после insertHandle (:490); при наивном обходе узлов гейт краснеет на нём сам
      (insertHandle → узел defer), при пропуске литералов — молчит, а на проде снос handle после сорвавшегося
      создания падает Spent и оставляется free_ip_runner (лог «will reconcile») — деградация, не потеря.
      Поэтому неблокирующее.
    predicate: >-
      Разборщик прошлого круга (kacho-workspace/tmp/cea-ntf3-r25/tool, режим lit) по kacho @e6075f09c2:
      место вызова, достигающее Begin, у которого в стеке узлов есть *ast.FuncLit, с родителем литерала →
      296 (assign 106 — сгенерированные обработчики gRPC через сопоставление по интерфейсу, mux.Handle 105,
      operations.Run 48, RunSync 22, lro.RunOp 11, go 2, немедленный вызов 1, составной литерал 1); с
      ForStmt/RangeStmt внутри литерала — 1. Контроль руками: orphan_sweep_backstop.go:51–62,
      loadbalancer/create.go:495–501.
    condition_on_code: >-
      Гейт УК3-79 по правилу 7: тело каждого литерала функции — свой граф управления (cfg.New по
      FuncLit.Body), к которому (а) применяется как к проходной; Begin-достигающий вызов в литерале,
      исполняемом не один раз (литерал аргументом вызова, кроме перечня известных однократных исполнителей с
      координатой; go внутри цикла; переменная, вызываемая в цикле), без перевыдачи в теле литерала —
      красное; отложенный вызов упорядочен после каждого Begin-достигающего вызова, предшествующего выходу.
      Печать — число осмотренных литералов и отложенных вызовов. Инъекция-близнец: go-литерал с циклом над
      Begin-достигающим вызовом, перевыдача снаружи → красное; перевыдача в итерации внутри литерала → зелёное.
    held_by: "гейт УК3-79 (go-implementer, FM0); заказ ORD-13"
  - id: CX3W-02
    severity: to_code
    blocking: false
    basis: корректность
    class: >-
      Умолчание, которое становится утверждением (code-authoring §«Умолчание, которое становится
      утверждением»): контекст, унаследованный шагом, несёт токен, которого шаг не просил
    decision: "З34 М1 (г) правило 7, абзац «Исправление одно»; tasks.md FM-n"
    finding: >-
      Исправление предписывает шагу без журнала отметку WithoutJournal «в функции самого шага». Если
      отмечающая функция до этого переприсвоила свой ctx результатом перевыдачи (ctx, _ =
      WithAuthzRevision(ctx, …)), шаг получает контекст с токеном, и WithoutJournal на нём даёт в Begin
      ErrJournalMarkerConflict (М1 (б) «токен и отметка вместе»). Статически правило 2 не видит конфликта
      (в теле шага один признак). На FM-n (persistVIP по семействам) отказ громкий — пробу отметки dualstack
      с флагом true он покраснит, поэтому неблокирующее.
    predicate: >-
      Текст дельты: sed -n '/7. Кратность отметки/,/УК3-80\./p' design.md @1a0fc6a8b — о том, какой
      контекст получает шаг с WithoutJournal, ничего нет; M1 (б): «Токен и отметка вместе —
      ErrJournalMarkerConflict».
    condition_on_code: >-
      Результат перевыдачи — новая переменная, передаваемая только в вызов, перед которым она стоит
      (не переприсвоение ctx отмечающей функции); шаг с WithoutJournal получает контекст без токена. Гейт:
      поток значения перевыдачи — аргумент ctx ровно одного Begin-достигающего вызова (тот же разбор, что
      перевыдача правила 7); инъекция-близнец: ctx = WithAuthzRevision(ctx, …) и затем вызов шага с
      WithoutJournal → красное; новая переменная → зелёное.
    held_by: "гейт УК3-79 (FM0); проба отметки FM-n dualstack с флагом true — второй рубеж"

