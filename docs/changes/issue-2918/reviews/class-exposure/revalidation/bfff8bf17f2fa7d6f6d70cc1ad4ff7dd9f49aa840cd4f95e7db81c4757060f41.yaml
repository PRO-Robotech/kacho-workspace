    severity: blocking
    class: "Радиус по имени механизма, а не по полосам (measurement-discipline §«Радиус: по имени механизма и по точкам применения»); «Решение и его следствие разнесены» (code-authoring)"
    decision: "FM0 поднимает пин corelib в kacho на C1, где journaltx.Begin при включённом флаге требует токен или отметку WithoutJournal (М1 (б))"
    finding: >-
      Вызовов journaltx.Begin вне *_test.go в kacho @515e017c87 — 25 в 13 файлах (compute 11/3,
      registry 6/2, storage 3/3, nlb 2/2, vpc 1/1, services/notify/cmd/notify-probe/internal/send/send.go
      1, pkg/feedjournal/feedjournaltest/resourceevent.go 1). FM-c…FM-s покрывают 11 файлов модулей.
      Два оставшихся не лежат в путях ни одной полосы: notify-probe (Send открывает
      journaltx.Begin с NewOptions(source.Enabled()) — при включённом флаге после FM0 отвечает INTERNAL)
      и общий тестовый помощник feedjournaltest (Begin с NewOptions(true); им пользуются интеграционные
      пробы resource-event compute и registry). Замысел М1 (г) называет notify-probe → WithoutJournal,
      а feedjournaltest не называет (замер записи 12 файлов). Решение владельца 2026-10-08 (1) держит
      Send рабочим путём newman D5.
    condition_on_route: >-
      FM0 (нулевой шаг В-2, одно изменение с пином) правит оба файла: notify-probe —
      journaltx.WithoutJournal на транзакции постановки; feedjournaltest — токен (тестовый источник) либо
      WithoutJournal по факту «пишет ли транзакция строку журнала». Пути FM0 дополняются
      `services/notify/cmd/notify-probe/internal/send/**` и `pkg/feedjournal/feedjournaltest/**`;
      предикат FM0 — проба Send пробы с флагом true зелёная на голове FM0 и
      `git grep -c 'journaltx.Begin(' -- '*.go' ':!*_test.go'` по дереву = число мест с токеном + число
