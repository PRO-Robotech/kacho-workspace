# Экспозиция классов — пересверка (revalidation) замысла NTF-3 редакции 18 и маршрута tasks.md
# редакции 21 на ветке issue-880 @1a47de71c.
#
# Запись привязана к отпечатку ЗАМЫСЛА (координата §4 роли); предмет задания — маршрут, поэтому его
# отпечаток назван в subject.route. Первичные разборы и прежние пересверки относятся к своим
# отпечаткам и здесь не переписываются. Проверено:
#   (1) отображение живых сценариев приёмки редакции 42 и заказов УК3 в полосы маршрута;
#   (2) полосы без предпосылок и разорванные цепочки (after, пути, порядок волн);
#   (3) каскады пинов corelib и kaname между линиями и между маршрутами эпика;
#   (4) устаревшие условия §0–§3 маршрута против голов веток эпиков на момент снимка;
#   (5) классы дефектов ограды (З34 М1–М10) по радиусу, который полосы обязаны покрыть;
#   (6) отображение пересверки e63e3fb0 (CX3R-01…11) в замысел редакции 18.
# Разрешения писать реализацию эта запись не даёт.
