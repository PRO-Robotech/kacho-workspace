facts_for_dispatcher:
  - >-
    CX3M-01 касается не формы, а последствий. Замысел обещает отказ старта корня при нулевом FailedNotify,
    но Worker, которым модули исполняют асинхронные операции, корень не строит. У registry он и вовсе не
    настраивается, а стартует лениво на первом Run. Если реализация повторит текст замысла дословно,
    registry, подключённый ручкой, на пути исполнителя промолчит об ошибке операции, и старт это не
    остановит.

