mapping_check:
  summary: "93 из 93 пунктов CX3 имеют строку; CX3L-02 (б) выдерживает только для Reconciler; 7 из 7 строк ДР- выдерживают"
  holds_now:
    - id: "ДР-К1 (б), CX3L-01"
      reason: >-
        Взятие `WHERE id = $1 AND done = false AND modified_at < $threshold FOR UPDATE SKIP LOCKED`, порог
        один на проход. Разобраны три порядка гонки с ClaimForExecution (repo.go:597). (1) Подтверждение
        зафиксировано до взятия: снимок взятия видит новое modified_at, строк 0. (2) Подтверждение
        держит замок строки: SKIP LOCKED даёт 0 строк. (3) Взятие первым: UPDATE исполнителя ждёт замок,
        после коммита done = true получает 0 строк, fn не исполняется, как сегодня. Порог считается часами
        процесса (time.Now().UTC()), и ClaimForExecution пишет modified_at тоже часами процесса — так же,
        как сегодня (reconciler.go threshold, repo.go:597), поэтому новой зависимости от часов не
        появляется.
    - id: "CX3L-02 (а), (в)"
      reason: >-
        Options строит только NewOptions, нулевое значение Begin отвергает до первого оператора. Корень
        строит одно значение из единственного чтения ручки, и З11 переписан на четырёх потребителей.
    - id: "CX3L-02 (б) — Reconciler"
      reason: >-
        Reconciler строит корень модуля: 6 вызовов operations.NewReconciler в cmd/*/recovery.go (compute,
        geo, nlb, registry, storage, vpc), вне тестов. Значит, у FailedNotify есть корень, куда его передать.
        Однако NewReconciler сегодня ошибку не возвращает (reconciler.go:152) — условие к коду CX3M-01 (б).
    - id: "CX3L-03"
      reason: "NewFailedNotify проверяет пару при сборке; отказ — отказ старта с именем службы. Строка классификатора недостижима по построению."
    - id: "CX3L-04"
      reason: >-
        Sweep считает только разрешённых. Пропуск взятия в счёт не входит, поэтому RecoverAll не
        зацикливается на кандидате чужой реплики. Потери разделения между репликами тоже нет: реплика
        держит замок одной строки за раз, а взятие соседа с SKIP LOCKED переходит к следующей строке.
    - id: "CX3L-05"
      reason: "Resolve получает контекст прохода без пары; держится вниманием, причина названа."
    - id: "ДР-К1 (а), (в), ДР-К2, ДР-В1…В4, ДР-М1"
      reason: "Дельта их не меняет, кроме ДР-К1 (б) — см. выше."
  not_holding:
    - id: "CX3L-02 (б) — Worker"
      reason: >-
        Замысел (З16 «Одно значение подключения», строка CX3L-02 (б)): «приходят в Worker и Reconciler одним
        значением FailedNotify… Нулевое FailedNotify{} конструкторы Worker и Reconciler отвергают, как nil».
        Прежний текст З16 «отправитель без пары и пара без отправителя конструктором отвергаются» — та же
        посылка. В дереве kacho вызовов operations.NewWorker вне тестов 0. Асинхронные операции модулей
        идут через пакетный operations.Run (worker.go:622) на `defaultRegistry = NewWorker()`
        (worker.go:83), то есть на Worker, построенном инициализацией пакета без аргументов. Корень влияет
        на него только функциональными опциями ConfigureDefault (worker.go:699), и этот вызов
        необязателен. ConfigureDefault зовут compute, nlb, storage и vpc; registry не зовёт ни
        ConfigureDefault, ни Start, и его Worker стартует лениво на первом Run («Backward-compat»,
        worker.go:692-698). Конструктора, который мог бы отвергнуть нулевое FailedNotify с именем службы
        при старте корня, у рабочего Worker нет. См. CX3M-01.
  unmapped: [CX3M-01]

new_items:
  - id: CX3M-01
    decision: "FailedNotify доставляется в Worker и Reconciler; нулевое значение отвергают «конструкторы» (З16, CX3L-02 (б))"
    class: "code-authoring §«Умолчание, которое становится утверждением»; §«Решение и его следствие разнесены»"
    exposure: >-
      Решение «модуль подключён» принимает корень (ручка, FailedNotify). Исполняет его Worker пакетного
      реестра, который построен до корня и без него. Точка отказа, которую называет замысел, в этом
      пути не существует. Если реализация добавит FailedNotify параметром NewWorker, его не вызовет ни
      один корень. Если добавит опцией ConfigureDefault, её отсутствие молча даст нулевое значение, а
      registry ConfigureDefault не зовёт вовсе. Тогда подключённый модуль (ручка true, Reconciler с
      парой) на пути исполнителя ведёт себя одним из двух способов. Либо как неподключённый: строки
      operation-failed нет, ошибки нет, — ровно то расхождение трёх признаков, которое CX3L-02 обещал
      сделать невыразимым. Либо отказывает при первой терминальной записи: операция остаётся done=false до
      OrphanGrace, и её разрешит Reconciler. Оба исхода видны только по счётчику, а не отказом старта.
    code_condition: >-
      (а) Замысел называет путь FailedNotify в Worker, на котором исполняются асинхронные операции модулей
      (пакетный defaultRegistry), и точку отказа корня. Например: опция ConfigureDefault обязательна, а
      Start пакетного реестра и ленивый старт на первом Run отказывают, пока FailedNotify не задан (явный
      NoFailedSender допустим). Корень зовёт ConfigureDefault и Start до приёма трафика, и отказ — отказ
      старта с именем службы. Либо модули переходят на корневой Worker и RunWithWorker (worker.go:628), и
      тогда пакетный Run в модулях запрещается. Выбор за автором. Непременно одно: нулевое значение не
      может молча стать ни NoFailedSender, ни отказом в рантайме. (б) NewReconciler принимает FailedNotify
      обязательным позиционным аргументом (не опцией) и возвращает ошибку. Все 6 вызывающих в cmd/*/recovery.go
      (включая geo с явным NoFailedSender) правятся тем же подъёмом пина (строка X5 / S3-C3). (в) Корни
      registry и geo, которые сегодня ConfigureDefault не зовут, названы в S3-C3 и S1-A4 поимённо.
    held_by: >-
      УК3-55 ловит исход рантаймом: у registry строк operation-failed 0 при ожидаемой 1 — красный. Но
      ловит его только при прогоне через пакетный Run, а не через NewWorker. Нужен близнец: корень модуля
      без FailedNotify у Worker → отказ старта с именем службы; и проба, что ленивый первый Run без
      конфигурации отказывает. Заказ integration-tester.
    outcome: к-замыслу
  - id: CX3M-02
    decision: "новое sentinel-значение journaltx.ErrOptionsUnset — отказ Begin на нулевых Options (З4)"
    class: "code-authoring §«Умолчание, которое становится утверждением»"
    exposure: >-
      Проверка стоит в Begin, то есть на первой пишущей транзакции, а не при старте. Писатель журнала
      модуля, которому корень не передал Options, соберётся и поднимет готовность, а откажет на каждой
      мутации. Для operations это закрывает NewFailedNotify при сборке. Для писателей модуля замысел
      точки отказа при сборке не называет. Кроме того, это первый отказ journaltx на пути запроса
      пользователя, так что его ответ клиенту должен быть определён.
    code_condition: >-
      (а) Каждый держатель Options (конструктор писателя журнала модуля, NewFailedNotify) отвергает
      нулевые Options при сборке корня. Отказ Begin остаётся страховкой, а не первой точкой обнаружения.
      (б) На пути запроса ErrOptionsUnset уходит клиенту фиксированным INTERNAL без текста ошибки
      (hard-no-err-echo); на пути terminalWrite и Reconciler это строка классификатора «отказ
      journaltx.Begin» (З16), которую (а) делает недостижимой. (в) errors.Is отличает ErrOptionsUnset от
      отказа InitiatorOf — это разные строки счётчика.
    held_by: >-
      Проба journaltx X1 (нулевые Options → ErrOptionsUnset, операторов 0; близнец NewOptions(false)) —
      есть в замысле. Для (а) нужен близнец УК3-12 или NTF3-64…67: корень без Options у писателя → отказ
      старта. Для (б) — TestErrorMappersTailReturnsAFixedText на дереве модулей.
    outcome: к-коду

