decisions:
  DI1: "Р10 (ред. 33) — «наибольшее из хранимого и присланного» и сверка с последней выданной позицией судятся числовым порядком позиций приёма; сравнение как строк — дефект; текстовая запись позиции на проводе порядка не задаёт"
  DI2: "NTF3-161 (г) — позиции наблюдаются на проводе как 9 и 10 (GET /notify/v1/inbox) и присылаются литералом seenUpTo = 10 / 9; наблюдаемое GET preferences — seenUpTo = 10"
  DI3: "NTF3-161 (г), Given — «свежая лента обвязки, десять записей подряд» даёт двум последним позиции ровно 9 и 10; 10 — последняя выданная позиция установки"

items:
  - id: CX3I-01
    decision: [DI1, DI2]
    class: "code-authoring §«Контракт, который нельзя выразить» (форма значения на проводе не объявлена — «непрозрачна», а порядок над ней утверждается); §«Порядок операций внутри кода» (приведение типа при сравнении)"
    exposure: >-
      Замысел §5 объявляет seen_up_to на проводе «непрозрачной строкой позиции» — по образцу
      позиции подписки, чей контракт прямо запрещает клиенту арифметику над токеном
      (subscription.proto:233–240). Д34 и NTF3-161 (г) делают обратное: позиция читается в выдаче
      ленты как 9 и 10, присылается литералом, а её порядок — числовой; потребитель NTF-6 обязан
      сравнивать позицию записи с seenUpTo. Непрозрачная форма либо делает Given (г) непостроимым
      (закодированная позиция не читается как 9), либо оставляет клиенту сравнение строк — тот
      самый дефект Е2. Второе: форма позиции не объявлена ни в приёмке, ни в замысле, а у двух
      очевидных реализаций разные множества написаний. Если в контракте int64 — protojson пишет
      его JSON-строкой "10" и принимает 10, "10", 1e1, "1e1", -5 (замер ниже); если string со
      своим разбором — «09», «+9», « 9» зависят от разбора. Отрицательное значение, пропущенное
      разбором, доходит до оператора З23: на вставке его отвергает CHECK (seen_up_to >= 0) кодом
      23514, на правке greatest его молча глотает — один вход, два исхода.
    condition: >-
      (а) замысел заменяет «непрозрачная строка позиции» объявленной формой: позиция записи ленты
      (элемент выдачи GET /notify/v1/inbox) и seen_up_to — одно и то же целое, на проводе — его
      десятичная запись; комментарий обоих полей контракта говорит «сравнивать как число»; выбранный
      тип поля (int64 либо string) назван; (б) одна функция пишет позицию на провод из int64 и одна
      разбирает провод в int64; обе зовут выдача ленты и правка/чтение настроек; (в) разбор стоит
      до оператора З23 и отвергает отрицательное значение и переполнение int64 как
      INVALID_ARGUMENT с полем seen_up_to (NTF3-86) — до оператора не доходит ни одно значение,
      которое CHECK схемы отверг бы; 23514 из этого оператора не маппится в ответ клиенту, его
      появление — дефект разбора; (г) если тип int64 — замысел называет принятые protojson
      написания одного значения (число, строка, экспонента) допустимыми, потому что сравнение
      идёт по значению; если string — разбор принимает ровно [1-9][0-9]* (или названную
      замыслом форму с одним написанием на значение); (д) внутри notify позиция от разбора до SQL
      — int64 (или его именованный тип); сравнения позиций строками в Go и SQL нет.
    held_by: >-
      (а), (б) — NTF3-161 (г) с близнецом (9 и 10 на проводе, числовой порядок); NTF3-86 (значение не
      по форме — 400). (в) — нужна проба, её нет: seenUpTo = -1 и seenUpTo = 9223372036854775808 →
      INVALID_ARGUMENT seen_up_to, у пользователя без строки настроек и со строкой (две ветки
      оператора), близнец — законная позиция → done (заказ integration-tester). (г), (д) — вниманием
      по диффу.
  - id: CX3I-02
    decision: [DI1]
    class: "code-authoring §«Контракт, который нельзя выразить» (два понятия под одним словом — непрозрачная позиция подписки и упорядоченная позиция ленты в одном сервисе)"
    exposure: >-
      В notify живут две «позиции»: позиция журнала модуля, с которой notify-sender возобновляет
      подписку (string, непрозрачна, возвращается дословно, сравнивать запрещено), и позиция
      приёма ленты (bigint из inbox_clock, упорядочена числом). Обе на проводе строковые. Общий
      помощник «позиция», общий тип или перекладка одной в другую дадут либо сравнение
      непрозрачного токена (нарушение контракта подписки), либо отказ от порядка там, где его
      утверждает Р10.
    condition: >-
      (а) в Go-коде notify позиция подписки и позиция ленты — разные типы (позиция подписки
      передаётся как есть, позиция ленты — именованный целый тип); функции преобразования между
      ними нет; (б) упорядоченное сравнение определено только над типом позиции ленты; (в) поле
      позиции подписки в хранилище notify-sender не участвует ни в одном ORDER BY и ни в одном
      сравнении.
    held_by: "вниманием по диффу notify (сервиса в дереве нет, замер ниже); гейта нет и не будет — однофайлового признака у смешения двух типов нет"
  - id: CX3I-03
    decision: [DI1, DI2]
    class: "code-authoring §«Умолчание, которое становится утверждением» (0 в базе — «ничего не просмотрено», пусто на проводе)"
    exposure: >-
      Схема замысла хранит отсутствие отметки как seen_up_to = 0 (DEFAULT 0), приёмка показывает его
      как «seenUpTo пуст» (NTF3-80, чтение (а)/(б) группы настроек). После Д34 значение на проводе —
      десятичное целое, и у «ничего» появляются два написания — пустая строка и "0"; у int64 в
      контракте пустое поле и 0 неразличимы вовсе. Если чтение выведет 0 как "0", консоль получит
      позицию, которой нет ни у одной записи ленты (позиции начинаются с 1, З19). Если правка примет
      пустое значение как «сбросить», это путь назад, запрещённый CX3E-10 (б).
    condition: >-
      (а) чтение настроек выдаёт хранимое 0 как пустое seenUpTo, ни в одном ответе не "0"; (б) исход
      PATCH с маской seen_up_to и пустым значением, и исход "0" — названы замыслом и одинаковы по
      смыслу: либо отказ формы INVALID_ARGUMENT seen_up_to, либо «≤ хранимого — done без изменения»;
      ни один не записывает значение меньше хранимого; (в) наименьшая выданная позиция — 1
      (inbox_clock стартует с pos = 0, приём первым оператором делает pos + 1), поэтому 0 не
      совпадает ни с одной позицией записи ленты — это свойство названо у поля.
    held_by: >-
      (а) — NTF3-80 и чтение группы настроек («seenUpTo пуст») при условии, что проба утверждает
      отсутствие значения, а не «ложное»; (б) — нужна проба, её нет: PATCH seen_up_to с пустым
      значением и с "0" при хранимом P1 — исход по решению замысла, GET — seenUpTo = P1 (заказ
      integration-tester); (в) — вниманием по диффу миграции
  - id: CX3I-04
    decision: [DI3]
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (Given опирается на свойство генератора позиций, которого ничто, кроме замысла, не держит)"
    exposure: >-
      Given (г) требует, чтобы десять записей свежей ленты получили позиции 1…10 без пропусков.
      Это верно для генератора З19 (UPDATE inbox_clock SET pos = pos + 1 под замком: откат
      возвращает номер) и неверно для последовательности или identity-колонки, где откат приёма и
      кэш сессии оставляют дыры. Замена генератора «ради производительности» не покраснит ни
      одного утверждения о продукте, но сделает (г) «условием не созданным» — а обвязка,
      подгоняющая позиции прямой записью (setval, запись в inbox_clock), утвердит (г) на состоянии,
      которого публичный путь не производит.
    condition: >-
      (а) позиция приёма выдаётся только оператором строки inbox_clock (З19); последовательности или
      identity для позиции ленты нет; (б) обвязка (г) стартует со схемы в состоянии миграции
      (pos = 0) и строит десять записей приёмом, без прямой записи в inbox_clock или inbox_event;
      позиции 9 и 10 утверждаются чтением выдачи до When (как требует Given); (в) несовпадение
      позиций в Given обвязка печатает как «условие не создано», а не как красное по
      NTF3-161 (г).
    held_by: "(а) — УК3-35 держит порядок видимости, а не отсутствие дыр: вниманием по диффу миграции; (б), (в) — сам Given (г) (утверждение позиций до When) при соблюдении (б)"

