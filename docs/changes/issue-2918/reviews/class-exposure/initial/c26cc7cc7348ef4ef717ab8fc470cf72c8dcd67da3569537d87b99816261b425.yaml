    condition: "стоимость на событие журнала — одна вставка строки ленты в той же транзакции, без чтений и без сетевых вызовов; число строк ленты на событие журнала = 1 печатает гейт NTF3-70"
    held_by: "NTF3-68, NTF3-70"
  - id: CX3B-48
    decision: [D18]
    class: "code-authoring §«Контракт, который нельзя выразить» (курсор вторым кодеком)"
    exposure: "у двух списков справочника курсоры не по конвенции ((id пользователя) и (expires_at, id)); соблазн второго разборщика page_token рядом с общим"
    condition: "курсоры обоих списков кодирует и разбирает одна функция фундамента (форма позиции — параметр), путь проверки и путь чтения зовут её"
    held_by: "NTF3-117, NTF3-122; TestPageCursorFormIsDeclaredOnce, если гейт видит службу доступа — иначе вниманием"

measurements:
