    result: "NTF-1: строка выдаётся повторно после утраты аренды (B13, B25); NTF-3: о повторной выдаче и идемпотентности INGESTED — 0 упоминаний"
  - claim: "CX3-11 закрыт"
    command: "sed -n 702,708p docs/specs/sub-phase-NTF-3-kacho-modules-notifications-acceptance.md"
    result: "16 кодов кроме OK — каждый ровно в одной строке; OK с неизвестным исходом — отдельная строка"

