    command: >-
      git -C project/kacho grep -nE 'INSERT INTO [a-z_.]*(vpc_outbox|nlb_outbox)' 1d42a6728bf -- 'services/*/internal/migrations/*.sql';
      git grep -nE 'EXECUTE FUNCTION kacho_(vpc|nlb)\.(subnets_outbox_emit_route_table_change|lb_status_recompute)' 1d42a6728bf -- 'services/*/internal/migrations/*.sql'
    result: >-
      опровергнуто: функции базы пишут журнал ещё у vpc (триггер 0001_initial.sql:646, не снят;
      тело 20260828130000:74,141) и у nlb (триггеры listeners и attached_target_groups; тело
      20260830120000:86,204, вставки :165,257); таблицы журнала — Table из subscriptionjournal:
      compute_outbox, kacho_vpc.vpc_outbox, kacho_nlb.nlb_outbox, kacho_registry.registry_resource_journal,
      kacho_storage.storage_outbox
  - claim: "Р3: одна точка — функция фундамента"
    command: "git grep -nE 'Outbox\\(\\)\\.Emit\\(' 1d42a6728bf -- services ':!*_test.go' | cut -d/ -f2 | sort | uniq -c; чтение compute repo/outbox.go, vpc helpers/outbox.go, nlb pg/outbox_emitter.go, nlb jobs/free_ip_runner.go:470-500"
    result: "Go-семейств три: corelib outbox.EmitAnchored (compute, 6 мест emitCompute), corelib outbox через helpers.EmitVPC (vpc, 77 вызовов Emit), своя вставка nlb (31 вызов Emit) + прямая вставка free_ip_runner.go:487"
  - claim: "форма служебного субъекта"
    command: "git -C project/corelib show 34bc8104a:auth/propagate.go | sed -n 105,140p; git -C project/kacho show 1d42a6728bf:services/vpc/internal/apps/kacho/shared/pbconv/pbconv.go | sed -n 25,55p"
    result: "{user, system.<служба>-<роль>}; служебные вызовы между модулями несут его; тип system — ярлык анонимности, не служебного вызова"
  - claim: "Р27: форма subject по corevalidate.ResourceID"
    command: "git -C project/corelib show 34bc8104a:validate/validate.go | sed -n 468,487p"
    result: "family-agnostic: сегмент до дефиса ∈ каталог или первые 3 символа ∈ каталог; пустая строка → nil; семейство не сверяется. Проверка семейства есть — ids.IsValid(id, prefix) (ids.go:220)"
  - claim: "Р18: писатели терминальной ошибки операции"
    command: "git -C project/corelib grep -nE '\\bMarkError\\(|markErrorCAS\\(' 34bc8104a -- ':!*_test.go'; git -C project/kacho grep -nE 'Mark(Error|Failed)\\(' 1d42a6728bf -- services ':!*_test.go'"
    result: "corelib worker.go:528 (асинхронный), worker.go:674 (в запросе), reconciler.go:252 (tx), repo.go:586 (пул); kacho — geo syncop.go:101 и два MarkError ресурса storage"
  - claim: "Д21 × operation-failed: откуда resource_type и resource_id"
    command: "git -C project/corelib show 34bc8104a:migrations/common/0001_operations.sql"
    result: "resource_id TEXT без NOT NULL; колонки resource_type нет; description NOT NULL"
  - claim: "Р2 радиус настройки инициатора у триггерных журналов"
