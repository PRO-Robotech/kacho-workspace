      git grep -cE '(INSERT INTO|UPDATE|DELETE FROM) +(kacho_storage\\.)?(volumes|snapshots|images|volume_attachments)\\b' 1d42a6728bf -- services/storage ':!*_test.go' ':!*/migrations/*';
      git grep -nE '(INSERT INTO|UPDATE|DELETE FROM) +%s\\.(registries|repositories)' 1d42a6728bf -- services/registry ':!*_test.go' ':!*/migrations/*';
      git grep -nE '(UPDATE|INSERT INTO|DELETE FROM)\\s+[a-z_.%]*(listeners|attached_target_groups|subnets)\\b' 1d42a6728bf -- services/nlb services/vpc ':!*_test.go' ':!*/migrations/*' | wc -l
    result: "storage: 4 оператора сверщика + 15 в репозиториях; registry: 4 (registry.go:204,284,311,353); nlb+vpc: 14 по трём таблицам. Нижняя граница: имена таблиц, собранные иначе, предикатом не видны"
