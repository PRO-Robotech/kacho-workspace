  # --- новые решения редакций 5–16 ---
  - id: CX3B-24
    decision: [D14, D15]
    class: "code-authoring §«Унификация и стоимость» (сводятся N реализаций); §«Инвариант и оснастка — это тоже прод-код» (гейт, не читающий целый вид предмета)"
    exposure: >-
      Р3 обещает «одну точку — функцию фундамента, которая дописывает строку журнала», но в
      дереве писателей журнала несколько семейств (измерено): на Go — corelib outbox.Emit /
      EmitAnchored у compute (6 мест) и vpc (через helpers.EmitVPC, 77 вызовов Outbox().Emit),
      собственная вставка SQL у nlb (outbox_emitter.go, 31 вызов Outbox().Emit) и прямая вставка в
      журнал nlb мимо эмиттера (jobs/free_ip_runner.go:487); на стороне базы — триггерные функции
      журнала у storage и registry, а ТАКЖЕ у vpc (subnets_outbox_emit_route_table_change,
      триггер 0001_initial.sql:646, тело заменено 20260828130000) и у nlb (lb_status_recompute на
      listeners и attached_target_groups, тело 20260830120000_lb_journal_state_envelope.sql:165,257).
      Приёмка называет модулями с триггерным журналом только storage и registry. Унификация по
      модулю оставит без строки ленты события пересчёта статуса балансировщика и смены таблицы
      маршрутов подсети — тихо.
    condition: >-
      (а) одна Go-функция журнала в corelib, ставящая строку ленты; эмиттер nlb и прямая вставка
      free_ip_runner переведены на неё; corelib outbox.Emit общего назначения строку ленты НЕ
      ставит (иначе лента появится у не-журнальных очередей); (б) одна генерируемая функция базы,
      которую зовёт КАЖДАЯ триггерная функция журнала всех четырёх модулей; (в) гейт NTF3-70
      перечисляет писателей по ИМЕНИ ТАБЛИЦЫ журнала (Table из subscriptionjournal каждого модуля) в
      Go и SQL, а не по перечню модулей; печатает число мест по семействам; инъекция — прямая
      вставка в журнал nlb мимо функции.
    held_by: "NTF3-70 — объём гейта в приёмке назван неверно → вернуть в приёмку (RA-01)"
    return_to_acceptance: true
  - id: CX3B-25
    decision: [D14]
    class: "code-authoring §«Решение и его следствие разнесены» (инициатор решён в процессе, записывается триггером); §«Умолчание, которое становится утверждением»"
    exposure: >-
      у триггерного журнала инициатор неоткуда взять, кроме настройки транзакции, которую
      выставляет процесс (NTF3-62 это подтверждает: «мутация без установленного инициатора
      откатывается»). Каждый писатель журналируемой таблицы обязан её выставить, включая фоновые:
      сверщик storage (4 оператора reconciler/store.go:193,240,255,271), репозитории storage (15
      операторов вставки/правки/удаления), реестры registry (4: registry.go:204,284,311,353),
      писатели listeners/attached_target_groups/subnets в nlb и vpc (14 операторов), задание
      освобождения адреса nlb, резолвер операций registry. Пропущенный писатель — не «событие без
      инициатора», а отказ его транзакции: фоновое задание встаёт.
    condition: >-
      (а) инициатор выставляется одной функцией-помощником транзакции (тем же, что открывает
      транзакцию писателя), фоновые задания передают system:<компонент>, обработчики запросов —
      проверенный субъект (CX3B-26); (б) функция базы при невыставленной настройке поднимает
      отказ с именем настройки, а не подставляет значение; (в) перепись писателей журналируемых
      таблиц — по имени таблицы, включая fmt-сборку имени, с объёмом; каждый фоновый путь —
      интеграционной пробой, проходящей его настоящим оператором.
    held_by: "NTF3-62, NTF3-58 (сверщик); по фоновым путям nlb, vpc, registry — заказ"
