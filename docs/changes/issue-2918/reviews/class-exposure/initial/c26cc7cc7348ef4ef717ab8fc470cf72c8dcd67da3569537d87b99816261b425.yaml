outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-01
    item: CX3B-24
    anchors: [Р3, NTF3-62, NTF3-70, "§3 шаги (2), (11)", "DoD 12.1"]
    what: >-
      Утверждение документа о дереве неверно и задаёт объём держателя. Р3 и NTF3-62 называют
      модулями с журналом на функции базы только storage и registry; NTF3-70 печатает «число
      триггеров журнала в миграциях storage и registry». В дереве @1d42a6728bf журнал пишут
      функции базы ещё у vpc (смена таблицы маршрутов подсети) и nlb (пересчёт статуса
      балансировщика), и у nlb есть прямая вставка в журнал мимо эмиттера (задание освобождения
      адреса). Гейт по тексту приёмки зелёный при событиях этих путей без строки ленты и без
      проверки инициатора. Нужно: перечень писателей журнала — по таблице журнала каждого модуля
      (Go и SQL) с командой; NTF3-70 — объём и инъекция по всем четырём модулям с функциями базы;
      NTF3-62 — утверждение об отказе без инициатора для всех функций базы; наблюдаемое «событие
      пересчёта статуса nlb и смены таблицы маршрутов подсети несёт инициатора и даёт одну строку
      resource-event» — сценарием или буквой с близнецом.

