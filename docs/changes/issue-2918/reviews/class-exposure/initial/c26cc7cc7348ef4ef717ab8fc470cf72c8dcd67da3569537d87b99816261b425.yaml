decisions:
  D1:  "без изменений против записи на 0478263a (D1–D12); текст решений — там; перенос — пункты CX3B-01…23"
  D13: "Р1 — подключаются compute, vpc, nlb, registry, storage; geo и край не источники"
  D14: "Р2 — SubscriptionEvent получает initiator (user: | service_account: | system:<компонент>) и occurred_at (время транзакции, до секунды), DELETED — снимок имени; колонки NOT NULL + CHECK в журнале каждого модуля; 4 новых вида; строки AddressPoolNetworkDefault снимаются"
  D15: "Р3 — строка ленты resource-event той же транзакцией и тем же вызовом фундамента, что строка журнала; у модулей с журналом на триггере — функция базы, генерируемая notifygen; форма адресата fanout, исход INGESTED"
  D16: "Р4 — флаг KACHO_<MODULE>_NOTIFICATIONS_ENABLED без умолчания; false — ни строки ленты, ни сервера ленты, ни вида notification_feed"
  D17: "Р5, Р6 — аудитория по классу события, прямая роль, «о своём действии письма нет», адресат только ACTIVE с подтверждённым адресом; право как у Get в момент отправки, DELETED — по якорю"
  D18: "Р7 (расширение) — ListProjectAudience, ListExpiringCredentials, пагинация по конвенции, одно прочтение при отказе страницы"
  D19: "Р8 — два развёртывания: notify-sender (секрет, подписка, SMTP, без gRPC) и notify-api (внутренний слушатель Х5, без секрета); граница ban06 — краем"
  D20: "Р9 — лента консоли: одна запись на событие в kacho_notify, курсор по позиции приёма DESC, пакетная проверка страницы listauthz, уборщик по сроку"
  D21: "Р10 — настройки: ячейки (модуль, вид, канал), :setEntries всё-или-ничего, upsert под блокировкой строки настроек"
  D22: "Р11, Р11а — подписки: цель ресурс/проект, channel, Check о вызывающем, потолок CAS, уникальность; формат чужих id — записанное исключение B4"
  D23: "Р12 — сводка: такт, сетка UTC, окно у каждого адресата, запись открытия, запись закрытия уникальная по (адресат, начало) той же транзакцией, догон одним письмом"
  D24: "Р13 — мгновенное письмо: схлопывание, всплеск, потолок на пару, сетка notice до отправки → в сводку; счётчики CAS в kacho_notify"
  D25: "Р16 (изменение) — эпизод: письмо о сбое на CREATING→ERROR и о восстановлении на ERROR→READY (Confirm, П7), прежнее состояние тем же оператором"
  D26: "Р18 — сбой операции: строка operation-failed той же транзакцией, что терминальная запись ошибки операции; адресат — принципал, если principal_type = user"
  D27: "Р19 — напоминания: задание notify по ListExpiringCredentials, однократность (вид, id, expires_at, L) той же транзакцией, собственная лента notify, класс security, подстановка владельца аккаунта при постановке"
  D28: "Р20 — контакт безопасности на аккаунте: Check о назначаемом, fail-closed при недоступности службы доступа"
  D29: "Р24, Р27 — исходы Ack дописаны; формы адресата subject | fanout | account_owner, разрешение по пространству — постоянная сборки"
  D30: "Р25 — публичные методы по конвенциям, операции nop с done = true; таблица права и исхода при недоступности"
  D31: "Р28 — тип notification_recipient_directory, строка манифеста только у notify, три метода в перечне звена, без надзора администратора облака"
  D32: "Р29 — канал и вид — закрытые перечисления, вид шаблона по таблице сборки по имени, каталог 18 ячеек, политика ячейки из класса"

