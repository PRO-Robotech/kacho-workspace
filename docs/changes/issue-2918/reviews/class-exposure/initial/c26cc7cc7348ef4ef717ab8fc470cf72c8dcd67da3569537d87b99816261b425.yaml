# Экспозиция классов — первичный разбор (initial) под-фазы NTF-3 на редакцию 16.
#
# Разбор сделан ДО кода и привязан к отпечатку одобренной приёмки (круг 2 прохода Д20).
# По Д22 судится только ДЕЛЬТА против последней разобранной редакции. Последняя разобранная —
# редакция 3 (0478263a…, запись рядом, append-only), и дельта к ней — почти весь документ:
# с редакции 5 предмет расширен Д1–Д13 (все модули, лента консоли, сводка, настройки, подписки,
# контакты, флаг, журнал с инициатором, сбой операции, напоминания, два развёртывания notify),
# затем Д14–Д21. Поэтому новые решения разобраны целиком (D13…D32, пункты CX3B-24…48).
# Пункты CX3-01…23 перенесены ССЫЛКОЙ как CX3B-01…23: текст условия — дословно пункт CX3-NN
# записи на 0478263a; здесь только дельта и чем пункт держится теперь.
# Когда появится design.md, каждый пункт CX3B-* должен получить точное отображение в решение
# замысла, а затем отдельную пересверку на отпечаток замысла
# (class-exposure/revalidation/<design-sha256>.yaml). Разрешения писать реализацию эта запись
# не даёт.
