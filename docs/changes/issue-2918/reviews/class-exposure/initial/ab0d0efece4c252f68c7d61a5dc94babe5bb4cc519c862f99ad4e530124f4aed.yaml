outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-06
    item: CX3F-01
    anchors: ["§7 «Фоновое задание освобождения», «Проход доведения снятия compute»", "§8 С18, С19", "NTF3-163 Given и (г)", "NTF3-164 Given", "Р2 (исход (2))", "§10 NTF3-163 (в), NTF3-164 (в)"]
    what: >-
      Утверждение документа о дереве опровергнуто замером @1d42a6728bf: у застрявшего снятия строка
      операции не «недоведённая». Рабочий путь, оставивший ресурс в DELETING, завершает операцию
      ошибкой сразу (nlb delete.go — release-сбой; compute releaseAndDelete); при крахе разрешитель
      осиротевших операций (grace 5m, RecoverAll до запуска доделывателей) переводит Delete при живом
      ресурсе в Interrupted, Create — в Done; порог доделывателей тоже 5m. Given NTF3-163 и NTF3-164
      строят только done=false (С18, С19; для сироты Create специально переведена в done=false),
      то есть утверждают поведение на состоянии, которого продукт у застрявшего ресурса не
      производит. Наблюдаемое, которое документ обязан утверждать: (а) начавший берётся из строки
      операции, завершённой ошибкой рабочего пути и завершённой разрешителем (Interrupted у Delete,
      Done у Create сироты) — строки ленты и журналов с user:<начавший>, как (а) NTF3-163, NTF3-164;
      посев С18, С19 сеет эти две формы (близнец — done=false, если документ его сохраняет); (б)
      исход ресурса, чья строка операции убрана уборкой срока хранения (7 d, corelib
      OperationRetention): по тексту Р2 это исход (2) навсегда — адрес пула, том и интерфейс заняты
      без срока; документ либо утверждает это с его ценой и наблюдаемым сигналом, либо меняет
      источник начавшего так, чтобы он жил не короче застрявшего ресурса (например, начавший
      записывается в строку ресурса на переходе в DELETING/CREATING), и тогда буквы (в) NTF3-163,
      NTF3-164 переписываются.

