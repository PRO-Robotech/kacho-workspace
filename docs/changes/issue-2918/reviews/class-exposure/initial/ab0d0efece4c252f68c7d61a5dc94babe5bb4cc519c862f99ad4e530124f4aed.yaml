new_class_proposal: >-
  Кандидат, не запись: «вход фонового доделывателя хранится в записи, которую завершает или
  убирает другой механизм раньше, чем доделыватель её прочтёт» (строка операции против
  разрешителя осиротевших и уборки срока хранения). Наблюдался один раз, в одном документе, на двух
  модулях с одним механизмом (corelib operations) — один экземпляр по порогу code-authoring
  §«Механизм накопления опыта»; цена (утечка адресов пула без срока) не измерена на стенде.
  Находка идёт возвратом RA-06, в скилл не заводится.
