  - "полнота переписи пересылаемых пишущих путей: предикат видит вызовы клиента с PropagateOutgoing, а не вызовы, где принципал кладётся другим способом (например, metadata вручную); нижняя граница 7 методов, полноту даёт разбор по графу вызовов (CX3D-02 (а))"

outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-03
    item: CX3D-02
    anchors: ["Р2 (абзац о пересланном инициаторе)", "§1.13 следствия", "§7 строка «Привязка диска» (последнее предложение)", NTF3-160, "§10", "§11 строка NTF3-160"]
    what: >-
      Перепись пересылаемых путей, пишущих журнал, неполна, и неполнота выводит из утверждений
      публично конструируемый путь. Документ говорит «такой путь один — привязка диска; вызовы nlb
      в vpc — чтения» (со слов комментария профиля). @1d42a6728bf nlb пересылает личность
      начавшего в vpc CreateOwnedAddress (Address CREATED в журнале vpc, create.go:640) при
      публичном NetworkLoadBalancerService.Create с выделяемым адресом и в ReleaseOwnedAddress
      (Address DELETED, release.go:150) при публичном Delete. Наблюдаемое, которое документ обязан
      утверждать: событие Address CREATED по адресу, выделенному балансировщику, несёт
      initiator = user:<начавший создание балансировщика> и даёт ровно одну строку resource-event в
      ленте vpc; то же для DELETED при снятии; близнец — тот же вызов другим пользователем.
      Нужно: исправить перепись в Р2, §1.13, §7 командой замера по вызовам клиента (не по
      комментарию профиля); буква NTF3-160 о пути nlb → vpc с близнецом; строки §10 и §11.
      Пути задания освобождения nlb (system) наблюдаемого утверждения не требуют — это условие
      к замыслу (CX3D-01 (б)).

orders:
  - to: design-author
    what: "отобразить CX3D-01…05 вместе с CX3B-* и CX3C-* (кроме закрытых CX3B-11, CX3B-24, CX3C-03); CX3D-02 (б), (в) — после RA-03"
    basis: ".claude/rules/change-graph.md §4; Д22"
  - to: acceptance-author
    what: "RA-03"
    basis: ".claude/rules/change-graph.md §2; Д22"
  - to: gate-author
    what: "предикат «межмодульный вызов, пишущий журнал, несёт системную личность без имени компонента» (operations.SystemPrincipal() рядом с PropagateOutgoing к пишущему методу) — CX3D-01 (б)"
    basis: ".claude/rules/testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки» п. 1"
  - to: integration-tester
    what: "проба повтора Attach/Detach после зафиксированной записи (обрыв ответа storage) — ноль лишних строк журнала и ленты (CX3D-05 (б))"
    basis: "code-authoring §«Контракт, который нельзя выразить»; gate-authoring §«Отрицание только в паре с положительным»"

candidate_predicates:
  - name: system-principal-without-component-on-forwarded-write
    single_file_sign: "в одной функции не-тестового Go — operations.WithPrincipal(ctx, operations.SystemPrincipal()) и вызов клиента, пересылающего личность в пишущий метод"
    note: "живой положительный близнец в дереве есть (nlb free_ip_runner.go:465); отрицательный близнец — вызов с auth.SystemPrincipalFor — нужно найти в дереве до заведения (.claude/hooks/class-guard/README.md §«Как добавить предикат»); предложение, не запись"
new_class_proposal: >-
  кандидат: «перепись поверхности по комментарию конфигурации, а не по вызовам» — наблюдался дважды
  в этой приёмке (RA-02: субъект привязки диска объявлен служебным; RA-03: вызовы nlb в vpc объявлены
  чтениями по комментарию профиля), но оба — в одном документе и одном предмете, то есть один
  экземпляр по порогу code-authoring §«Механизм накопления опыта». Не заводится; при втором
  независимом месте — запись в measurement-discipline §«Радиус: по имени механизма и по точкам
  применения» через tooling-maintainer.
