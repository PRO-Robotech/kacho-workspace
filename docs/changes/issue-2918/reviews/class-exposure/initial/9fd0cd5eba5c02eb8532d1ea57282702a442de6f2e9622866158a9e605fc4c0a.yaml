  DX6: "§7 — шаг доведения снятия nlb: инициатор system:<компонент>; привязка диска (storage_outbox_emit_attachment) объявлена путём со служебным субъектом без буквы NTF3-160"

items:
  - id: CX3C-01
    decision: [DX3]
    class: "code-authoring §«Умолчание, которое становится утверждением» (пустое значение настройки читается как значение); §«Решение и его следствие разнесены» (инициатор решён процессом, прочитан функцией базы)"
    exposure: >-
      функции базы берут инициатора из настройки транзакции. Измерено на PostgreSQL 16: на свежем
      соединении current_setting('<имя>', true) даёт NULL, а на соединении, где в ПРЕДЫДУЩЕЙ
      транзакции настройка была выставлена локально, — пустую строку, не NULL. Соединения в пуле
      переиспользуются, поэтому «инициатор не выставлен» на боевом пути приходит пустой строкой:
      NOT NULL её не отвергает, исход NTF3-62 (23502 с именем колонки) держится только на свежем
      соединении. Выставление не локально к транзакции (SET вместо SET LOCAL / set_config(…, false))
      переносит инициатора прошлой транзакции на следующую на том же соединении — событие получает
      чужого инициатора. Условие CX3B-25 (б) («функция поднимает отказ с именем настройки») приёмкой
      редакции 17 уточнено до 23502 с именем колонки — оно заменяется этим пунктом.
    condition: >-
      (а) инициатор выставляется ТОЛЬКО локально к транзакции (set_config(…, true) / SET LOCAL) одной
      функцией-помощником открытия транзакции; нелокальная установка в дереве — 0; (б) каждая функция
      базы читает настройку через NULLIF(current_setting(…, true), '') — пустая строка есть отсутствие,
      и отказ одинаков (23502, колонка инициатора) на свежем и на переиспользованном соединении;
      (в) CHECK формы колонки инициатора отвергает пустую строку независимо от (б).
    held_by: >-
      NTF3-62 (функция базы) держит только если проба гоняется на соединении, где до неё прошла
      транзакция с выставленным инициатором; на свежем соединении проба зелёная и без (б). Нужна такая
      форма пробы — заказ; (а) — вниманием, пока нет гейта «нелокальная установка настройки
      инициатора» (кандидат в предикат, см. candidate_predicates).
  - id: CX3C-02
    decision: [DX3]
    class: "code-authoring §«Решение и его следствие разнесены» (оператор без транзакции, в которой можно выставить инициатора); уточняет радиус CX3B-25"
    exposure: >-
      локальная к транзакции настройка требует транзакции, которую открыл помощник. Автокоммитные
      записи в журналируемые таблицы её не имеют: сверщик storage правит и снимает строки томов,
      снимков и образов через pool.Exec с именем таблицы, собранным fmt (reconciler/store.go:201,241,
      258,272), снятие привязки диска — pool.Exec DELETE FROM volume_attachments (volume_repo.go:897),
      достижимо публичным InstanceService.DetachDisk. После под-фазы такой оператор либо
      откатывается (функция срабатывает, инициатора нет), либо, при CX3C-01 без (б), пишет строку с
      пустым инициатором. Снятие таблицы маршрутов в vpc меняет subnets внешним ключом (ON DELETE SET
      NULL) внутри той же транзакции — инициатор обязан быть выставлен до первого оператора, а не
      при вызове эмиттера.
    condition: >-
      (а) любая запись в таблицу с триггером журнала (§1.13: subnets, listeners, registries, volumes,
      snapshots, images, volume_attachments) идёт через помощник, открывающий транзакцию и первым
      оператором выставляющий инициатора из ctx; автокоммитных записей в эти таблицы — 0;
      (б) помощник отказывает до первого оператора, если принципала в ctx нет (фоновые пути кладут
      system:<компонент> явно); (в) перепись по разбору (не по регулярке: имя таблицы у сверщика
      собирается fmt) печатает число записей в журналируемые таблицы по модулям и число автокоммитных.
    held_by: "NTF3-62 — только на тех изменениях, что перечислены в сценарии; для сверщика storage и DetachDisk — нужна проба и гейт (в) — заказ"
  - id: CX3C-03
    decision: [DX6]
    class: "code-authoring §«Умолчание, которое становится утверждением» (чей субъект — инициатор события); security-hardening hard-async-carries-initiator"
    exposure: >-
      §7 (строка «Привязка диска») утверждает, что субъект внутреннего вызова storage из compute —
      служебный, и выводит путь из букв NTF3-160. Измерено: путь конструируется публичным API
      (InstanceService.AttachDisk / DetachDisk, instance_service.proto:173,192) — операция compute
      (lro.RunOp, instance.go:810-820) зовёт storage с пересылкой личности (auth.PropagateOutgoing,
      storage_client.go:69), и круг пересылающих storage в боевом профиле включает compute ровно для
      этого: «volume attach/detach runs under the identity of whoever initiated it» (values.prod.yaml:
      1081-1086). Субъект — пользователь, начавший привязку. Инициатор события Volume UPDATED по
      привязке виден арендатору в ленте; документ его значение не утверждает, а держатели NTF3-62 и
      NTF3-70 значения не различают (любая непустая форма их проходит). Замысел, следующий тексту §7,
      выставит инициатора по сертификату пира — лента покажет служебную учётную запись compute.
    condition: >-
      (а) storage выставляет инициатора транзакции из принципала, извлечённого trust-aware парой (CertIdentityExtract →
      TrustedPrincipalExtract), а не из сертификата пира; (б) у compute операция привязки несёт
      принципал инициатора операции (восстановленный из строки операции), а не системный.
    held_by: "нет наблюдаемого утверждения — вернуть в приёмку (RA-02)"
    return_to_acceptance: true
  - id: CX3C-04
    decision: [DX2]
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения; миграция с обратным заполнением); §«Унификация и стоимость»"
    exposure: >-
      журнал nlb говорит на своём словаре: столбцы resource_type / action (функция фундамента пишет
      resource_kind / event_type, emit.go:126-131 corelib), значения вида 'nlb_load_balancer' |
      'nlb_listener' | 'nlb_target_group' и действия CREATED | UPDATED | DELETED | MOVED | FAILED под
      CHECK (0001_initial.sql:510-513); перевод MOVED и FAILED в UPDATED и вида в Kind лежит в Mapping
      (journal.go:323-324). Лента замкнута на CREATED | UPDATED | DELETED и Kind (Р3; NTF3-160 (б)
      ждёт kind=NetworkLoadBalancer). Перевод эмиттера на функцию фундамента требует либо смены
      столбцов и значений таблицы журнала nlb (окно удержания держит строки прежней формы —
      journal.go:30-34; при раскатке старые поды пишут старые столбцы), либо параметризации функции
      фундамента по дескриптору таблицы. Функция базы lb_status_recompute пишет тот же словарь на
      SQL — второй перевод вида и действия в SQL станет вторым источником Mapping.
    condition: >-
      (а) перевод (вид журнала, действие) → (Kind, change) ленты имеет один источник — Mapping модуля;
      SQL-функция notifygen получает его сгенерированным из того же объявления, гейт сверяет;
      (б) сведение столбцов — одним из двух путей, названным в замысле: expand → migrate → contract
      (новые столбцы, двойная запись на раскатке, перезапись строк окна удержания, снятие старых
      столбцов и CHECK отдельной миграцией после раскатки) либо функция фундамента с дескриптором
      столбцов таблицы без смены схемы nlb; в обоих путях Mapping nlb читает каждую строку окна
      удержания; (в) MOVED в ленте — UPDATED по Mapping, строки ленты с change вне закрытого набора
      не пишутся (отказ, а не подстановка).
    held_by: "NTF3-160 (б) — kind и change строки ленты nlb; NTF3-70 (в) — счёт; сохранность строк окна при сведении — нужна проба — заказ"
  - id: CX3C-05
    decision: [DX3]
    class: "code-authoring §«Унификация и стоимость» (сведение шести рукописных функций к генерируемой)"
    exposure: >-
      шесть функций базы несут разную логику, которая и есть их контракт: lb_status_recompute выбирает
      строку журнала из того, что вернул его CAS («событие есть ⟺ пересчёт применился»);
      storage_outbox_emit_attachment не пишет, если том снят в той же транзакции; родословная storage
      зовёт storage_outbox_emit_source; нагрузка — to_jsonb строки с конвертом состояния, согласие
      форм держит TestLoadBalancerStateIsTheSameFromTheTriggerAndFromGo. Генератор, пересобирающий
      тела функций, унифицирует по самой широкой семантике и теряет эти ветви тихо.
    condition: >-
      (а) новые версии функций — новыми миграциями (ban05); notifygen не пересобирает тело, а
      добавляет к существующему ровно две вещи — чтение инициатора (CX3C-01 (б)) и постановку строки
      ленты при каждой вставке журнала; либо, как вариант того же Р3, одна генерируемая функция базы
      AFTER INSERT на самой таблице журнала модуля, ставящая строку ленты на каждую строку журнала —
      тогда паритет «журнал ↔ лента» держится построением для писателей на Go и на SQL сразу, а шесть
      функций правятся только чтением инициатора; выбор — в замысле, с обоснованием против Р3;
      (б) существующие пробы согласия форм и ветвей функций остаются зелёными без правки.
    held_by: "TestLoadBalancerStateIsTheSameFromTheTriggerAndFromGo и пробы storage/registry журнала — зелёными без правки; NTF3-160 близнецы (а), (в)"
  - id: CX3C-06
    decision: [DX1, DX4]
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (второй распознаватель одного предмета; суждение по форме вместо идентичности)"
    exposure: >-
      в дереве уже есть перепись точек записи журнала по формам — internal/repohygiene/journalwriteforms.go
      (с инъекциями). Её шапка записывает урок #1573: предикат по литеральному имени таблицы дал ноль
      писателей при живом, потому что имя таблицы приходит аргументом; и границу 3: «форму триггера
      судить по ТЕКСТУ миграций нельзя решить … Живое тело знает только база» (то же — nlb
      journal.go, раздел «Чем держится согласие двух форм»). Приёмка на неё не ссылается (0 упоминаний);
      §1.13 считает регуляркой по литеральному имени, NTF3-70 (б) требует красного по тексту новой
      миграции с файлом и строкой. Второй гейт о том же предмете разойдётся с первым, а текстовый
      разбор функций базы противоречит записанной в дереве границе.
    condition: >-
      (а) гейт NTF3-70 строится на распознавателе journalwriteforms (формы имени таблицы: литерал,
      константа, аргумент, fmt), а не второй регуляркой; (б) функции базы судятся живым телом: либо
      миграции применяются к настоящей базе и читается тело из каталога, а файл и строка — последней
      определяющей миграции; либо текстовый разбор в порядке версий goose только по разделам Up с
      правилом «последнее определение»; в обоих случаях граница 3 journalwriteforms.go и абзац nlb
      journal.go правятся тем же изменением, чтобы в дереве не осталось двух утверждений о решаемости;
      (в) печатается объём по каждой форме и по каждому модулю, пустой обход — красный.
    held_by: "NTF3-70 с инъекциями (а)–(в); journalwriteforms_injection_test.go — зелёный после правки"
  - id: CX3C-07
    decision: [DX5]
    class: "code-authoring §«Контракт, который нельзя выразить» (идентичность строки ленты)"
    exposure: >-
      NTF3-160 (б) требует двух строк журнала NetworkLoadBalancer UPDATED nlb-1 в одной транзакции с
      одинаковым инициатором и одинаковым occurred_at (время транзакции до секунды, Р2) — пять полей
      строки ленты у них совпадают. Уникальность или схлопывание строки ленты по этим полям сольёт
      их в одну либо откатит создание приёмника отказом 23505.
    condition: "строка ленты идентифицируется позицией строки журнала (модуль, позиция), уникальность — по ней; ключа, уникального по (kind, resource_id, change, initiator, occurred_at), в ленте нет; схлопывание писем (Р13) действует на доставке, а не на постановке"
    held_by: "NTF3-160 (б) — «ровно две»"
  - id: CX3C-08
    decision: [DX6]
    class: "code-authoring §«Умолчание, которое становится утверждением» (имя компонента)"
    exposure: >-
      шаг доведения снятия nlb (emitReconcileFinalize) пишет DELETED под system:<компонент>; сегодня
      тот же шаг ходит к vpc под operations.SystemPrincipal() (free_ip_runner.go:465) — третье написание
      системного субъекта рядом с двумя из CX3B-26.
    condition: "имя компонента — одна объявленная константа модуля в форме DNS-метки, проходящая CHECK Р2; инициатор выставляет помощник транзакции задания, а не литерал в SQL; нормализация субъекта — функцией CX3B-26 (а)"
    held_by: "NTF3-62 (строка без инициатора не пишется); значение — вниманием, наблюдаемого утверждения документ не делает (публично не конструируется, §7)"

