  - claim: "§7: субъект внутреннего вызова привязки диска — служебный; путь публичным API не утверждается"
    command: >-
      git -C project/kacho show 1d42a6728bf:services/compute/internal/apps/kacho/api/instance/instance.go | sed -n 805,830p;
      git -C project/kacho grep -n 'PropagateOutgoing' 1d42a6728bf -- services/compute/internal/clients/storage_client.go;
      git -C project/kacho grep -nE 'rpc (Attach|Detach)Disk' 1d42a6728bf -- proto/kacho/cloud/compute;
      git -C project/kacho show 1d42a6728bf:deploy/helm/umbrella/values.prod.yaml | sed -n 1075,1087p
    result: "опровергнуто: AttachDisk/DetachDisk публичны (instance_service.proto:173,192); вызов storage несёт пересланную личность инициатора (storage_client.go:69); compute в круге пересылающих storage «volume attach/detach runs under the identity of whoever initiated it» (values.prod.yaml:1081-1086)"
  - claim: "радиус настройки инициатора: автокоммитные записи в журналируемые таблицы"
    command: >-
      git -C project/kacho grep -nE 'pool\.(Exec)\(' 1d42a6728bf -- 'services/storage/internal/**/*.go' 'services/nlb/internal/**/*.go' 'services/registry/internal/**/*.go' 'services/vpc/internal/**/*.go' ':!**/*_test.go';
      чтение reconciler/store.go:185-275, volume_repo.go:890-905
    result: >-
      pool.Exec по четырём модулям — 15 мест; из них в журналируемые таблицы: сверщик storage 4
      (store.go:201,241,258,272 — таблица fmt-подстановкой) и снятие привязки 1 (volume_repo.go:897).
      Нижняя граница: QueryRow/Query с UPDATE … RETURNING и иные пулы предикатом не отобраны
    control: "та же команда по compute (без функций базы) — не нужна для вывода; точки открытия транзакции (Begin/BeginFunc): vpc 3, nlb 6, registry 5, storage 12, compute 11 — vpc открывает транзакции помощником, предикат его не видит"
  - claim: "Р3/§1.13: столбцы журнала nlb расходятся с функцией фундамента — «предмет замысла»"
    command: >-
      git -C project/corelib show 34bc8104a:outbox/emit.go | sed -n 120,135p;
      git -C project/kacho grep -nE 'nlb_outbox_(resource_type|action)_check' -A1 1d42a6728bf -- services/nlb/internal/migrations/0001_initial.sql;
      git -C project/kacho grep -nE 'OutboxAction(Moved|Failed)' 1d42a6728bf -- services/nlb ':!*_test.go'
    result: "подтверждено и расширено: расходятся и значения (вид snake_case, действия MOVED/FAILED под CHECK), перевод — в Mapping journal.go:323-324 (CX3C-04)"
  - claim: "NTF3-70: гейт журнала заводится новым"
