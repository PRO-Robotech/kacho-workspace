outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-02
    item: CX3C-03
    anchors: ["§7 строка «Привязка диска»", NTF3-160, "§10", "§11 строка NTF3-160"]
    what: >-
      Утверждение документа о дереве неверно и выводит из утверждений публично конструируемый путь.
      §7 говорит, что storage_outbox_emit_attachment вызывается с субъектом служебным и буквы NTF3-160
      о ней нет. @1d42a6728bf: привязку и снятие привязки делает публичный InstanceService.AttachDisk /
      DetachDisk; storage исполняет их под пересланной личностью пользователя, начавшего операцию
      (круг пересылающих storage включает compute именно для этого). Наблюдаемое, которое документ
      обязан утверждать: событие Volume UPDATED по привязке несёт initiator = user:<начавший>
      и даёт ровно одну строку resource-event; близнец — снятие привязки (или привязка другим
      пользователем), отличающийся одним фактом. Нужно: исправить строку §7 с командой замера;
      буква NTF3-160 (г) с близнецом и строка §10; §11 — функция в перечне NTF3-160.

