items:
  - id: CX3G-01
    decision: [DZ1]
    class: "code-authoring §«Порядок операций внутри кода» (прежнее состояние — тем же оператором записи); §«Умолчание, которое становится утверждением» (различение «компонент, а не глагол пользователя» по строке инициатора — sentinel)"
    exposure: >-
      Предикат постановки сменился с «прежнее = CREATING» на «прежнее ≠ ERROR». Ни MarkError, ни
      Confirm прежнего состояния сегодня не возвращают: MarkError — одно безусловное по состоянию
      UPDATE … WHERE state <> 'DELETING', Confirm — UPDATE … WHERE state IN ('CREATING','ERROR') с
      исходом «применилось / нет» (store.go:192-200, 254-257), где CREATING → READY и ERROR → READY
      неразличимы. Замысел, читающий прежнее состояние отдельным SELECT до UPDATE, даёт два письма
      на две параллельные записи (NTF3-07). Замысел, унаследовавший предикат редакций 5–30
      (OLD = 'CREATING'), молча не пошлёт письмо на READY → ERROR, которое теперь утверждает
      NTF3-53. Добавка Р16 «записал её компонент, а не глагол пользователя» зовёт к проверке
      строки инициатора транзакции внутри постановки — второе место о том, кто пишет ERROR.
    condition: >-
      (а) решение о постановке берётся из OLD/NEW той же строки в том же операторе: триггер AFTER
      UPDATE (storage_outbox_emit уже читает OLD и NEW) либо CTE с FOR UPDATE внутри одного
      оператора; предшествующего SELECT состояния нет; (б) предикаты дословно
      OLD.state <> 'ERROR' AND NEW.state = 'ERROR' (сбой) и OLD.state = 'ERROR' AND
      NEW.state = 'READY' (восстановление); сравнения с 'CREATING' в постановке нет; (в)
      «компонент, а не глагол пользователя» держится составом писателей: единственный не-тестовый
      писатель state = 'ERROR' — MarkError (замер ниже); строку инициатора постановка не разбирает;
      если появится второй писатель ERROR, его письмо — предмет новой приёмки.
    held_by: >-
      (а), (б) — NTF3-53 (READY → ERROR: одно письмо), NTF3-07 (ERROR → ERROR: 0; две параллельные
      записи: 1), NTF3-130 (CREATING → READY: 0), NTF3-129 (ERROR → READY: 1); (в) — нужен гейт, его
      нет: перепись писателей state = 'ERROR' в не-тестовом дереве storage вне функции перехода = 0
      (заказ gate-author)
  - id: CX3G-02
    decision: [DZ2, DZ3]
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (посадка обвязки не заводит ручку в прод-коде); gate-authoring §«Фикстура не снисходительнее продукта» (инициатор ставит проба, а не функция)"
    exposure: >-
      С21 требует посадки «вставка оставляет CREATING, цикл сверщика не запущен». В композиционном
      корне это одно решение: dataPlane := cfg.BlockBackendKind != "" задаёт и readyOnCommit, и
      запуск сверщика (serve.go:337-340, 478-490); комментарий прямо запрещает их разводить.
      Обвязка, собранная через корень, либо запускает сверщик (и счёт строк ленты плывёт), либо
      зовёт новую ручку «без сверщика» в прод-коде. Второе: С21 говорит «от имени компонента
      system:storage-reconciler», но не говорит, КТО ставит инициатора. Если его ставит проба в
      своей транзакции, NTF3-58 и NTF3-10 зелены, а путь сверщика (loop.go:265, 298, 312, 376 зовут
      те же методы Store без транзакции и без инициатора) пишет строку без инициатора — и
      отказ базы NTF3-62 роняет его запись перехода.
    condition: >-
      (а) в не-тестовом дереве нет ручки, флага или ветки, разводящей readyOnCommit и запуск
      сверщика; обвязка С21/С22 собирает репозитории с WithReadyOnCommit(false) и
      reconciler.NewStore напрямую в тестовом дереве, мимо serve.go; (б) инициатор
      system:storage-reconciler ставят сами функции записи перехода Store (одна точка на оба
      вызывающих — цикл сверщика и пробу); проба инициатора не ставит и зовёт ровно те
      экспортированные методы, что зовёт loop.go; (в) функции принимают транзакцию вызывающего
      (NTF3-12) и без неё открывают свою — в обоих случаях инициатор ставится внутри.
    held_by: >-
      (б) — NTF3-58 и NTF3-10 держат, только если проба инициатора не ставит: вниманием по диффу
      обвязки; (а) — вниманием по диффу serve.go и конфигурации storage; (в) — NTF3-12 (откат)
  - id: CX3G-03
    decision: [DZ1, DZ2]
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (новый исход отказа функции глотается вызывающим); security-hardening hard-zero-refusals-visible"
    exposure: >-
      Постановка письма в той же транзакции, что MarkError, даёт MarkError новый исход отказа:
      откат по нулевому required-атрибуту (Д21, CX3B-33) или отказ функции фундамента. Вызов
      loop.go:376 отбрасывает ошибку (`_ = r.store.MarkError(...)`). После под-фазы откат постановки
      оставит строку в CREATING без записи ERROR, без строки журнала и без следа в логе — сбой,
      о котором письмо обязано уйти, исчезает целиком. Путь сверщика вне объёма приёмки, но
      отказ создаёт функция, которую правит эта под-фаза.
    condition: >-
      (а) замысел называет, какие отказы функции записи перехода возможны после под-фазы и как их
      видит вызывающий; (б) отказ MarkError на loop.go:376 не отбрасывается молча — счётчик по
      исходу и строка лога с видом и id ресурса; (в) решение CX3B-33 (вето побочного следствия над
      первичной записью) применено к MarkError и Confirm явно.
    held_by: "вниманием по диффу: сверщик вне объёма приёмки (Д31), пробы на отказ постановки на пути сверщика в приёмке нет и быть не должно; проба замысла — заказ integration-tester"
  - id: CX3G-04
    decision: [DZ4]
    class: "code-authoring §«Решение и его следствие разнесены» (одна «терминальная запись ошибки», а писателей done = true с ошибкой больше); §«Умолчание, которое становится утверждением» (Cancel как третий исход, не названный Р18)"
    exposure: >-
      Р18 теперь ставит строку на «терминальной записи ошибки фундамента — кто бы её ни вызвал» и
      в §1.5 называет её markErrorCAS. Писателей done = true с ошибкой в corelib больше: кроме
      markErrorCAS (repo.go:242-247), Cancel и CancelOwned пишут done = true, error_code = 1,
      'operation cancelled' своим SQL (repo.go:618, :673). CX3B-32 насчитал четыре места
      записи ошибки и отмену не учёл. Замысел, переносящий постановку в общий «переход в done с
      ошибкой», пошлёт письмо «операция не удалась» арендатору, который сам её отменил; замысел,
      ставящий постановку в MarkError-обёртку пула (repo.go:587), а не в markErrorCAS, пропустит
      путь Reconciler (reconciler.go:252 зовёт markErrorCAS в своей транзакции). Пробы группы S
      «зовут запись напрямую» — если это тестовый помощник, а не вход исполнителя, они зелёны при
      постановке не в той функции.
    condition: >-
      (а) постановка operation-failed живёт в одной функции, через которую идут асинхронный путь
      исполнителя и Reconciler (как требует CX3B-32 (а)); путь исполнения в запросе её не зовёт;
      (б) Cancel и CancelOwned строку не ставят — исход виден вызывающему в ответе Cancel;
      замысел называет это решение; если замысел решит слать письмо об отмене — это новое
      наблюдаемое и предмет приёмки, а не кода; (в) пробы NTF3-133…137 зовут экспортированный вход,
      которым пользуется исполнитель, а не тестовый помощник.
    held_by: "(а) — NTF3-133, 135, 136, 137 при соблюдении (в); (б) — нет: нужна проба «Cancel операции done=false — строк operation-failed 0» (заказ integration-tester); (в) — вниманием по диффу"
  - id: CX3G-05
    decision: [DZ5]
    class: "code-authoring §«Решение и его следствие разнесены» (новое ограничение базы против писателя, чей вход не решён); §«Умолчание, которое становится утверждением» (запасная личность {system, bootstrap})"
    exposure: >-
      Д31 снял решение «доделыватели несут начавшего» (DY1), но оставил на фоновых путях NTF3-62
      (строки без инициатора база не пишет) и NTF3-70 (прямых вставок мимо функции фундамента 0).
      Значит, под-фаза ОБЯЗАНА переписать литеральную вставку nlb emitReconcileFinalize
      (free_ip_runner.go:487, §1.13) через функцию фундамента — а какого инициатора та получит,
      документ больше не говорит. Контекст задания nlb несёт operations.SystemPrincipal()
      {system, bootstrap}; у прохода compute WithPrincipal 0 (замер записи ab0d0efe). Если
      нормализация (CX3E-02) не даёт этой личности законной формы, отказ базы роняет транзакцию
      доведения снятия — балансировщик остаётся в DELETING навсегда, а у compute — строка Instance
      DELETED. Это регрессия фонового пути, созданная под-фазой, а не предмет #2934.
    condition: >-
      (а) замысел перечисляет писателей журнала на фоновых путях (nlb emitReconcileFinalize; vpc
      ReleaseOwnedAddress из releaseFamily; compute FinishStuckDeletes → Instance DELETED;
      storage и vpc Detach из releaseAndDelete) и для каждого называет инициатора после
      под-фазы — законного по форме NTF3-09/NTF3-62; (б) исход каждого фонового пути до и после
      под-фазы одинаков: под-фаза не добавляет отказа ни базы, ни владельца; (в) нормализация
      {system, bootstrap} (CX3E-02 (а)) на этих путях снова в силе и решается одной функцией;
      решения «кто начавший» замысел не принимает — это #2934.
    held_by: >-
      nlb — существующие интеграционные пробы на базе TestFreeIP_ReconcileStuckDeleting,
      TestFreeIP_CreateOrphanReconciled (free_ip_runner_integration_test.go) покраснеют, если
      финализацию отвергнет база, — при условии, что их утверждения не правят; compute —
      delete_finisher_test.go собран на фейках и базы не касается: нужна проба (заказ
      integration-tester)
  - id: CX3G-06
    decision: [DZ6]
    class: "gate-authoring §«Пустой вход как всеразрешение» (утверждение «каждая строка несёт X» зелено при нуле строк)"
    exposure: >-
      NTF3-160 (з) теперь утверждает «каждая строка, которую записал Delete, несёт user:usr-A;
      строк service:/system: 0» и прямо признаёт (§10), что остаётся зелёной, если Delete не
      записал ни одной. Это решение Д31, в приёмку не возвращается. Для кода следствие одно: путь
      снятия привязок в Delete (releaseAndDelete → storage и vpc Detach) ничем, кроме (з), не
      держится на личности — (г) и (ж) держат тот же метод клиента, но из ДРУГОЙ объемлющей
      функции. Если замысел поставит личность в releaseAndDelete иначе, чем в AttachDisk /
      DetachDisk, и владелец отвергнет вызов, (з) останется зелёной.
    condition: >-
      (а) личность на снятии привязок в публичном Delete — та же, что у исполнителя операции
      (контекст исполнителя — WithoutCancel контекста запроса, замер записи 88ad95c6); отдельной
      установки личности в releaseAndDelete замысел не вводит; (б) CX3F-07 (б) в силе: дифф не
      меняет сужение ListByInstance у vpc.
    held_by: "(а) — вниманием по диффу; (з) держит только чужого инициатора, предпосылку «Delete пишет строки» держит #2934 (Д31); (б) — вниманием по диффу"

