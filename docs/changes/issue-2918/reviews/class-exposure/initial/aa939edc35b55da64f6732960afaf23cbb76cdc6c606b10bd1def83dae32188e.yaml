  DZ1: "Р16 (ред. 31) — письмо о сбое ставится, когда запись изменила состояние строки тома, снимка или образа на ERROR с любого не-ERROR и записал её компонент; письмо о восстановлении — ERROR → READY; прежнее «только CREATING → ERROR» снято; NTF3-53 меняет знак (READY → ERROR — одно письмо)"
  DZ2: "§8 С21, §7 группа B — пробы строят условие прямым вызовом функции записи перехода storage (MarkError / Confirm) на строке, вставленной публичным глаголом, от имени system:storage-reconciler; посадка обвязки storage — вставка оставляет CREATING, цикл сверщика не запущен"
  DZ3: "§8 С22 (ред. 32) — готовность источника (том, снимок, образ) строится записью выхода Confirm; Get утверждает AVAILABLE/READY до зависящего глагола; строки ленты подготовки названы счётом"
