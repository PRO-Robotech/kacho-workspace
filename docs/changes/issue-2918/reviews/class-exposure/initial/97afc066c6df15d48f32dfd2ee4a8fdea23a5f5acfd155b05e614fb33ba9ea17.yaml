items:
  - id: CX3E-01
    decision: [DZ1]
    class: "code-authoring §«Решение и его следствие разнесены» (решение «видимое состояние изменилось» выводится из числа затронутых строк, которое повтор даёт то же); §«Контракт, который нельзя выразить»"
    exposure: >-
      Оба новых писателя строки UPDATED стоят на операторах, которые на повторе отвечают так же,
      как на изменении. Привязка интерфейса — CAS `WHERE (ni.used_by_id = '' OR ni.used_by_id = $2)`
      (network_interface.go:318-345): повтор той же привязки проходит и возвращает строку RETURNING.
      SetReference — безусловный `UPDATE addresses SET used = true` (address.go:1009) и upsert
      `ON CONFLICT … DO UPDATE … WHERE referrer_id = EXCLUDED.referrer_id` (:1016-1026, ещё и
      attached_at = now()): повтор той же ссылки возвращает строку. Повтор здесь штатный, а не
      редкий: compute зовёт Attach в retry.OnUnavailable (vpc_nic_client.go:58), nlb —
      SetAddressReference в retry.OnUnavailable (internal_address_client.go:753), то есть ответ,
      потерянный после коммита, даёт второй вызов. Замысел, эмитирующий «при успехе оператора»
      (или построчным триггером без сравнения старого и нового), даст вторую строку UPDATED на
      повторе — против утверждения Р2 и близнеца NTF3-160 (ж). Кроме того, SetReference
      исполняется в собственной writer-TX адаптера (cqrsadapter.go:172-185), чей комментарий
      прямо говорит «Outbox НЕ emit'ит — referrer-tracking не публичное событие».
    condition: >-
      (а) каждый из четырёх писателей (vpc nicinternal Attach, Detach; addressref SetAddressReference;
      ReleaseOwnedAddress исходом DETACHED) решает «видимое состояние изменилось» в ТОМ ЖЕ операторе,
      что меняет строку, по прежнему значению (Attach — прежний used_by_id был пуст; SetReference —
      прежний used = false либо ссылка вставлена, а не обновлена; Detach — затронута 1 строка;
      ReleaseOwnedAddress — исход DETACHED, а не ALREADY_DETACHED), и эмитирует только тогда;
      «успех оператора» и «строк затронуто > 0» признаком изменения не служат;
      (б) строка журнала пишется в той же writer-TX, что изменение (для SetReference — в транзакции
      адаптера), и несёт состояние, прочитанное после изменения в этой же транзакции;
      (в) комментарий cqrsadapter.go:169-171 переписывается тем же изменением;
      (г) если журнал пишет триггер базы, а не Go, у триггера условие WHEN сравнивает видимые
      столбцы OLD и NEW (used_by_id, status; used), а не срабатывает на любой UPDATE.
    held_by: >-
      NTF3-160 (ж) — «повтор привязки строки не дал» (интерфейс); повтор SetAddressReference и
      повтор после потерянного ответа (обрыв после коммита) — нужна проба (заказ integration-tester)
  - id: CX3E-02
    decision: [DZ3]
    class: "code-authoring §«Контракт, который нельзя выразить» (у системной личности два написания на проводе); security sec-forwarded-trust-aware-extract"
    exposure: >-
      Р2 требует инициатора `system:nlb-free-ip-runner`, но на проводе системной личности вида
      `system:…` у законного отправителя нет: auth.SystemPrincipalFor (corelib auth/propagate.go:125)
      производит Principal{Type: "user", ID: "system.nlb-free-ip-runner"}, а тип "system" vpc считает
      ярлыком анонимности (authn_interceptor.go:85, pbconv.go:50). Нормализация «type:id» даст в
      журнале `user:system.nlb-free-ip-runner` — строку, которую лента покажет арендатору как
      пользователя; нормализация «по типу» не узнает системную личность вовсе.
    condition: >-
      (а) одна функция нормализации (та же, что CX3B-26 (а)) переводит {user, system.<служба>-<роль>}
      в `system:<служба>-<роль>`, а {system, *} (anonymous, bootstrap) отвергает, а не пишет
      `system:bootstrap`; (б) признак «system.» проверяется только у типа user, и форма id
      пользователей и сервисных аккаунтов (ids.NewID, префикс + crockford) его нести не может —
      сказано в комментарии функции; (в) nlb пишет свою строку NetworkLoadBalancer DELETED через ту
      же функцию, а не своим литералом инициатора.
    held_by: "NTF3-163 — «строк с инициатором вида user: … — 0» и «компонент иной, чем nlb-free-ip-runner — 0»"
  - id: CX3E-03
    decision: [DZ3, DZ9]
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения» (перепись по месту вызова, а не по входам объемлющей функции); security-hardening hard-async-carries-initiator"
    exposure: >-
      §1.14 приписывает вызовы compute instance.go:965 (vpc NIC Detach) и :976 (storage Detach)
      одному входу — InstanceService.Delete. Обе строки стоят в releaseAndDelete, у которой входов
      два: операция Delete (instance.go:940) и фоновый проход FinishStuckDeletes (:1050), который
      поднимает cmd/compute/stuck_delete_finisher.go:75 без установки принципала (WithPrincipal в
      не-тестовом коде compute — 0). Контекст прохода несёт запасное SystemPrincipal() =
      {system, bootstrap}, и PropagateOutgoing его пересылает (propagate.go:83-95). Значит, путей,
      где пишущий метод зовут под системной личностью, два, а не один: этот проход пишет Volume
      UPDATED (storage), NetworkInterface UPDATED (vpc, после под-фазы) и Instance DELETED (журнал
      compute, instance_repo.go:610). Их инициатор документ не утверждает, а фраза §1.14 «системной
      личностью пишущий метод зовёт один путь — фоновое задание nlb» и решение Р2 «строки журнала с
      общей системной личностью без имени компонента не бывает» на этом пути ничем не держатся.
      По чтению кода проход в посадке с authMode=production сегодня получает отказ vpc
      (authn_interceptor.go:85 отвергает тип system) и оставляет инстанс в DELETING — на стенде не
      измерено.
    condition: >-
      (а) замысел перечисляет пути под системной личностью по входам объемлющих функций (кто зовёт
      функцию, содержащую вызов клиента), а не по местам вызова; (б) проход compute несёт личность,
      выбранную RA-05 (инициатор снятия, захваченный при запросе, либо именованная личность
      компонента с грантом), а не запасную; (в) нормализация — CX3E-02.
    held_by: "нет наблюдаемого утверждения — вернуть в приёмку (RA-04)"
    return_to_acceptance: true
  - id: CX3E-04
    decision: [DZ3, DZ4]
    class: "security-hardening hard-async-carries-initiator, hard-machine-gets-grant; gate-authoring §«Фикстура не снисходительнее продукта»"
    exposure: >-
      NTF3-163 утверждает, что проход задания nlb освобождает адрес (A3 → NOT_FOUND, Address DELETED в
      журнале vpc) под личностью system:nlb-free-ip-runner. Владелец принимает этот вызов только
      через проверку прав: ReleaseOwnedAddress несёт permission vpc.addresses.releaseOwned,
      required_relation "editor" на project (internal_address_service.proto:236-243). Грант на
      проекте арендатора у личности задания не объявлен нигде: вызовов SystemPrincipalFor в дереве
      kacho 0, в G0 (С1) привязок у такой личности нет, модель прав о системных личностях компонентов
      не говорит. В обвязке G0 со службой доступа и проверкой прав vpc Given NTF3-163 не строится
      (отказ → nlb классифицирует его как терминальный, internal_address_client.go:568-572, и
      изолирует строку, free_ip_runner.go:404-425); в обвязке без проверки прав проба зелёная, а в
      посадке задание по-прежнему не работает — сегодня оно пересылает {system, bootstrap}, которое
      vpc в production-посадке отвергает (authn_interceptor.go:85). Одновременно выбор «задание
      пишет под своей учётной записью» противоречит hard-async-carries-initiator: задание доделывает
      снятие, которое начал пользователь, и норма требует нести его личность, захваченную при
      запросе (у операции она хранится — principal_type/principal_id, corelib
      0002_operations_principal.sql:17-19).
    condition: >-
      (а) решение о личности фоновых доделывателей (nlb free-ip-runner, compute stuck-delete) —
      одно на оба и записано в приёмке (RA-05); (б) если выбрана личность компонента — у неё узкий
      грант на один глагол владельца (hard-machine-gets-grant), материализованный моделью прав, а
      не обход проверки в vpc; если выбран инициатор — он берётся из операции снятия, а отказ
      владельца после отзыва прав у инициатора классифицирован явно; (в) обвязка NTF3-163 и
      аналога для compute поднимает vpc с authN production и проверкой прав той же посадки, что
      стенд.
    held_by: "нет наблюдаемого утверждения о проверке прав владельца на этом пути — вернуть в приёмку (RA-05)"
    return_to_acceptance: true
  - id: CX3E-05
    decision: [DZ6]
    class: "code-authoring §«Порядок операций внутри кода» (приведение типа при сравнении позиций); §«Умолчание, которое становится утверждением» (0 строк оператора — «за границей» или «записи нет»)"
    exposure: >-
      «Наибольшее из хранимого и присланного одним оператором» и «сверка с последней выданной
      позицией в том же операторе» сводят три исхода к одному оператору: применено, не изменено
      (≤ хранимого), отвергнуто (за границей). Позиция в контракте непрозрачна (форма позиции,
      page_token), и если отметка хранится строкой, GREATEST сравнит лексикографически ('9' > '10').
      Строка настроек может отсутствовать («отсутствие записи = DAY», Р10), и UPDATE … WHERE
      <граница> вернёт 0 строк и при отсутствии записи, и при нарушении границы — отличить их по
      числу строк нельзя. Граница «наибольшая позиция приёма всей ленты» не монотонна: уборщик
      срока хранения (Р9) может снять все записи, и тогда граница пуста.
    condition: >-
      (а) seen_up_to хранится тем же числовым типом, что позиция приёма, и сравнивается числом;
      разбор формы — на входе RPC, до оператора; (б) запись — upsert по пользователю, отсутствие
      строки настроек даёт вставку, а не отказ; исход (применено / не изменено / за границей)
      возвращается оператором явно (RETURNING флагов), а не выводится из «0 строк»; (в) порядок
      проверок назван в коде: форма → «≤ хранимого — done» → граница → запись; значение ≤
      хранимого не отвергается при пустой ленте; (г) граница не читается отдельным SELECT до
      оператора.
    held_by: >-
      NTF3-161 (а), (в) с близнецами (из пустого, равно границе, за границей); сравнение числом —
      нужна проба с позициями разной длины записи (9 → 10) и проба «лента пуста после уборщика,
      отметка ≤ хранимого» (заказ integration-tester)
  - id: CX3E-06
    decision: [DZ6]
    class: "code-authoring §«Решение и его следствие разнесены» (позиция выдаётся последовательностью при вставке, видимой становится при коммите)"
    exposure: >-
      Р9 определяет позицию приёма как «монотонную последовательность базы notify». Последовательность
      монотонна по выдаче, но не по видимости: при двух одновременных транзакциях приёма позиция P4
      может стать видимой позже P5. Консоль, прочитавшая P5 первой страницей, отметит seen_up_to = P5,
      и запись P4, закоммиченная следом, окажется под отметкой, не показанная пользователю. До Д25
      отметку можно было вернуть; с монотонной отметкой (DZ6) это необратимо. Решение Д25 дельты
      делает этот класс невосстановимым, поэтому он разобран здесь, хотя Р9 не менялось.
    condition: >-
      (а) позиция приёма назначается в порядке фиксации: один писатель приёма на базу с
      последовательными транзакциями либо позиция берётся под блокировкой, удерживаемой до коммита;
      выбор назван в замысле; (б) если ни то ни другое, граница сверки seen_up_to — наибольшая позиция,
      ниже которой нет транзакций в полёте, а не max(position).
    held_by: "нет пробы — нужна (заказ integration-tester): две параллельные транзакции приёма, меньшая позиция фиксируется второй; отметка по большей не скрывает меньшую"
  - id: CX3E-07
    decision: [DZ5]
    class: "code-authoring §«Контракт, который нельзя выразить» (одна строка журнала — два производителя формы: Go и литерал SQL посева); §«Умолчание, которое становится утверждением»"
    exposure: >-
      Сегодня посев стенда (vpc-address-pool-baseline.sql:172-188) пишет строку AddressPool CREATED
      своим jsonb-литералом с ключами 'ID', 'Name', … и собственным ключом 'actor' в полезной
      нагрузке, тогда как Go-писатель того же события зовёт helpers.AddressPoolDomainPayload с
      helpers.NoProjectAnchor (addresspool/create.go:184-185). После под-фазы AddressPool
      публикуется (Р2), и состояние события посева дойдёт до подписчика и ленты. Второй производитель
      формы разойдётся с первым при первой правке домена; ключ 'actor' — второе место об
      инициаторе рядом со столбцом initiator. Идемпотентность посева держится тем, что строка
      журнала привязана к RETURNING вставки пула в одном операторе; перенос записи журнала в
      отдельный оператор или функцию вне этого CTE даст строку на повторном исполнении.
    condition: >-
      (а) строка журнала и строка ленты посева привязаны к RETURNING вставки пула в том же
      операторе (повтор — 0 строк); (б) инициатор system:stand-seed ставится тем же механизмом, что
      у функций базы, в транзакции посева, а ключ 'actor' из полезной нагрузки снимается тем же
      изменением; (в) форма состояния AddressPool одна: посев зовёт функцию базы, строящую
      состояние, либо паритет ключей посева и AddressPoolDomainPayload держится гейтом (как
      seedaddressplanparity_test.go); якорь проекта тот же, что NoProjectAnchor; (г) рецепт dev-up
      исполняет посев после миграций vpc этой под-фазы.
    held_by: "NTF3-162 и близнец — (а), (б); (в) — нет, нужен гейт паритета формы (заказ gate-author); (г) — подъём стенда"
  - id: CX3E-08
    decision: [DZ5]
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код»; rule 00-kacho-core ban17-gates"
    exposure: >-
      Объём гейта NTF3-70 расширен до «всего ствола вне миграций и тестов». Текстовый предикат по
      стволу встречает прозу: упоминаний вставки в таблицы журналов в .md/.mdx — 16 строк в 6 файлах
      @1d42a6728bf (схемы потоков, описания). Гейт, судящий текст, либо покраснеет на документации,
      либо её исключат глобом — и тем же глобом из обхода выпадет следующий посев в новом каталоге.
    condition: >-
      (а) гейт судит узел по виду файла: вызов и строковый литерал SQL в Go (разбор AST), оператор в
      *.sql и SQL внутри *.sh (разбор), и объявляет перечень видов файлов; (б) печатает объём по
      каждому виду и краснеет на пустом обходе любого вида; (в) документация исключается видом файла
      с числом исключённых в выводе, а не каталогом.
    held_by: "NTF3-70 — инъекция (г) с близнецом и «на пустом обходе гейт красный»"
  - id: CX3E-09
    decision: [DZ8]
    class: "code-authoring §«Решение и его следствие разнесены» (ротация одного ключа у двух потребителей)"
    exposure: >-
      Ключ отпечатка адреса читают два развёртывания. Ротация объекта секрета без перезапуска одного
      из них даёт два ключа одновременно: notify-api ищет контакт по отпечатку новым ключом,
      notify-sender хранит отпечатки старым, и совпадений нет. Гейт NTF3-127, отличающий «секрет
      почты» от «секрета ключа» по имени объекта, пропустит ключ почты, положенный в объект ключа.
    condition: >-
      (а) оба развёртывания несут в шаблоне пода контрольную сумму объекта секрета ключа, так что
      его правка перекатывает оба (форма sec-chart-config-checksum); (б) гейт NTF3-127 определяет
      секрет почты по объявленному набору ключей (SMTP, POP3, DKIM, кольцо токена), а не по
      подстроке имени; (в) объект ключа несёт только ключ отпечатка.
    held_by: "(б), (в) — NTF3-127 с близнецом (ключ почты в объекте ключа — красный); (а) — NTF-4 Р11 (согласование ротации), в NTF-3 — вниманием"
  - id: CX3E-10
    decision: [DZ7]
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (посев в обход правила, которое утверждает проба)"
    exposure: >-
      С17 двигает отметку назад прямой записью — единственный способ повторить NTF3-161 (б).
      Если ради обвязки в прод-коде появится путь «сбросить отметку» (метод, ручка, ветка по
      признаку теста), монотонность Р10 перестанет быть свойством продукта.
    condition: >-
      (а) посев С17 — только в тестовом дереве обвязки notify-api, одним оператором с проверкой
      «изменена ровно 1 строка»; (б) в прод-коде notify нет ни метода, ни ручки, ни ветки, двигающей
      seen_up_to вниз.
    held_by: "NTF3-161 (а) — публичная правка назад отметку не двигает; (б) — вниманием по диффу"

