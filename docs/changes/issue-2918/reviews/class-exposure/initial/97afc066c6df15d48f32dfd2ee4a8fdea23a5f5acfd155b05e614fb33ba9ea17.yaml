new_class_proposal: >-
  Не заводится. «Фоновый доделыватель пересылает личность, которую владелец отвергает» наблюдался в
  двух независимых местах (nlb free_ip_runner, compute stuck_delete_finisher), но класс уже есть —
  security-hardening hard-async-carries-initiator, у него нет гейта (ЗАВЕСТИ); заказ gate-author
  выше. «Перепись по месту вызова, а не по входам объемлющей функции» — четвёртый возврат этой
  приёмки по переписи (RA-01…RA-04), все в одном документе и одном предмете, то есть один экземпляр
  по порогу code-authoring §«Механизм накопления опыта».
