return_to_acceptance:
  - id: RA-04
    item: CX3E-03
    anchors: ["§1.14 (итог, фраза «системной личностью пишущий метод зовёт один путь»)", "§1.14 таблица, строки storage Detach и vpc InternalNetworkInterfaceService.Detach", "Р2 (абзац о пересланной системной личности)", "§7", "§8", "§10", "§11"]
    what: >-
      Перепись путей под системной личностью неполна. @1d42a6728bf вызовы compute instance.go:965
      (vpc NIC Detach) и :976 (storage Detach) стоят в releaseAndDelete, у которой два входа: операция
      Delete (:940) и фоновый проход FinishStuckDeletes (:1050, cmd/compute/stuck_delete_finisher.go:75),
      идущий без принципала (WithPrincipal в compute — 0), то есть под запасной {system, bootstrap}.
      Проход пишет Volume UPDATED, NetworkInterface UPDATED (после под-фазы) и Instance DELETED.
      Наблюдаемое, которое документ обязан утверждать: строки журналов storage, vpc и compute,
      записанные проходом по застрявшему снятию инстанса, несут инициатора по решению RA-05 (не
      запасную личность), по строке ленты на строку журнала; близнец — то же снятие публичным Delete
      без застревания даёт user:<начавший>. Условие строится как С18: посев статуса DELETING и
      deleting_since старше порога прохода, один проход в обвязке. Исправить фразу §1.14 командой по
      входам объемлющей функции.
  - id: RA-05
    item: CX3E-04
    anchors: ["Р2 (system:<компонент> у пересланной системной личности)", "NTF3-163 Given и Then", "§7 «Фоновое задание освобождения»", "§8 С18", "§11 NTF3-163", "G0"]
    what: >-
      Given NTF3-163 не строится в посадке, где vpc проверяет права, а решение о личности фонового
      задания расходится с нормой. Задание зовёт ReleaseOwnedAddress, который требует editor на
      проекте арендатора (internal_address_service.proto:236-243); у личности компонента гранта нет
      ни в G0, ни в модели (вызовов SystemPrincipalFor в kacho 0), отказ nlb считает терминальным и
      изолирует строку. Сегодня задание пересылает {system, bootstrap}, которое vpc в
      production-посадке отвергает (authn_interceptor.go:85), — по коду задание в боевой посадке не
      освобождает ничего. Норма hard-async-carries-initiator требует у асинхронного пути личность
      инициатора, захваченную при запросе, а не учётную запись воркера. Нужно решение в приёмке, одно
      для задания nlb и прохода compute (RA-04): (а) инициатор — начавший снятие, из операции снятия,
      и что происходит, если его права отозваны до прохода; либо (б) личность компонента — с узким
      грантом на один глагол владельца, объявленным моделью прав, и с отказом той же личности на
      другом глаголе (близнец). Сценарий утверждает освобождение адреса при vpc с authN production и
      проверкой прав той же посадки, что стенд; G0 называет посадку обвязки для этих букв.

