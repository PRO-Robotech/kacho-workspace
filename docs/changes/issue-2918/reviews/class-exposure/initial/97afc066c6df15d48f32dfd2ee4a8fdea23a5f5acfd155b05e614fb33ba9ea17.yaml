#
# Разбор сделан ДО кода и привязан к отпечатку одобренной приёмки (круг 3 прохода RA-03).
# По Д22 судится только ДЕЛЬТА против последней разобранной редакции — редакции 20
# (88ad95c6…, запись рядом, append-only). Дельта — редакции 21, 22 и 23: §1.13 (обход ствола
# вне миграций, посев стенда), новый §1.14 (пишущие пути под пересланной личностью), Р2
# (строка журнала на каждое изменение видимого состояния по пересланному вызову, инициатор
# system:<компонент>), Р3 (посев стенда), Р8 и NTF3-127 (Д23), Р10 (Д25), §7, §8 С16–С18,
# NTF3-70 инъекция (г), NTF3-160 (д)–(з), новые NTF3-161, 162, 163, §10, §11, DoD. Команды §1,
# перемеренные редакциями 22–23 без смены выводов, дельтой решений не несут и заново не
# разбираются (их воспроизвёл acceptance-reviewer в круге 3). Пункты записей на c26cc7cc
# (CX3B-*), 9fd0cd5e (CX3C-*) и 88ad95c6 (CX3D-*) остаются в силе без переноса.
# Когда появится design.md, каждый пункт CX3B-*, CX3C-*, CX3D-* и CX3E-* должен получить точное
# отображение в решение замысла, а затем отдельную пересверку на отпечаток замысла
# (class-exposure/revalidation/<design-sha256>.yaml). Разрешения писать реализацию эта запись
# не даёт.
