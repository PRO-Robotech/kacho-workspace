decisions:
  D1: перепись модулей — ведомость services/notify/sources.yaml и гейт сверки с деревом (Р17, §3, NTF3-01..05)
  D2: сборка шаблонов шагом bundle / bundle-check — ведомость дайджестов, содержимое из домашних каталогов и из модуля службы доступа на пине (Р17, NTF3-34, 35, 37)
  D3: набор локалей {ru, en}, ручка KACHO_NOTIFY_DEFAULT_LOCALE без умолчания, en у всех владельцев (Р12)
  D4: колонка intent_initiator NOT NULL + CHECK в трёх таблицах, пишется только при вставке шестью глаголами, без умолчания и обратного заполнения (Р9-а, Р13)
  D5: функция перехода CREATING → ERROR ставит строку ленты в той же транзакции, прежнее состояние — тем же оператором записи (Р15)
  D6: лимиты 20/ч на получателя и 200/ч на проект; ключ окна «проект» и счётчик подавления — новые, в corelib (Р14)
  D7: три шаблона, закрытые атрибуты, reason из словаря, кнопка — путь, origin из конфигурации (Р16)
  D8: справочник Resolve в службе доступа — порядок условий, закрытый набор отношений, тип из пространства имён, точный SAN + reader, без HTTP-привязки (Р10, Р11)
  D9: правило применителя манифестов — выдача reader на справочник только из манифеста notify (Р11, NTF3-50)
  D10: исходы Resolve в notify — клетки словаря NTF-1 Р9, ответ не кэшируется (Р10, DoD 11.2 п.2)
  D11: initiator_ref строки ленты — сверщик как действующий (NTF3-10)
  D12: рёбра notify→storage и notify→kaname в таблице спеки, утверждение ацикличности (DoD 11.2 п.5в)

items:
  - id: CX3-01
    decision: D4
    class: "code-authoring §«Умолчание, которое становится утверждением»"
    exposure: >-
      Источник субъекта в фундаменте имеет молчаливый запасной путь: чтение без признака присутствия
      отдаёт системного субъекта вместо «субъекта нет»; субъект рабочих процессов фундамента имеет тип
      user с id вида system.<служба>-<роль>. CHECK «тип из двух, id непустой» пропустит второе, а первое
      превратит в отказ базы 23514, который общий маппер отдаёт клиенту как INVALID_ARGUMENT.
    condition: >-
      (а) субъект для intent_initiator берётся только чтением с признаком присутствия
      (operations.PrincipalFromContextOK); нет субъекта или тип вне {user, service_account} — отказ ДО
      вставки фиксированным текстом, не через SQLSTATE; (б) CHECK связывает тип с префиксом id по канону
      ids (user ↔ usr-, service_account ↔ sva-), так что id рабочего процесса фундамента не проходит.
    held_by: >-
      NTF3-09 держит NOT NULL/CHECK; близнец «id рабочего процесса фундамента отвергнут» и проба
      use-case «контекст без субъекта → отказ до вставки» — нужны, их нет (заказ).
  - id: CX3-02
    decision: D4
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    exposure: >-
      значение хранится строкой «тип:id», а в процессе живёт парой полей; шесть мест вставки и одно
      место чтения могут собрать и разобрать его по-разному.
    condition: >-
      один конструктор/разборщик формы в домене storage; все шесть вставок (volume 1, snapshot 2,
      image 3 — измерено) и функция перехода пользуются им; строкового сложения формы вне него нет.
    held_by: "интеграционная проба на каждый глагол таблицы Р13 (§10 приёмки); единственность конструктора — вниманием, гейта нет"
  - id: CX3-03
    decision: D4
    class: "code-authoring §«Контракт, который нельзя выразить» (миграция без обратного заполнения)"
    exposure: >-
      колонка без умолчания ломает все прямые вставки в три таблицы в тестовом дереве storage
      (17 строк в 7 файлах — измерено); соблазн «починить» их умолчанием на колонке снимает сам инвариант.
    condition: >-
      у колонки нет DEFAULT ни в какой миграции; тестовые вставки получают значение явно (общий
      помощник тестового дерева); миграция новая, применённые не правятся (ban05) и цитирует приёмку.
    held_by: "NTF3-09 (23502 без колонки); TestNewMigrationOutranksEveryAppliedOne; TestNewMigrationCitesAnApprovedAcceptance"
  - id: CX3-04
    decision: D4
    class: "code-authoring §«Контракт, который нельзя выразить» (перечень выходных поверхностей)"
    exposure: >-
      нагрузка журнала подписки storage строится из строки целиком ВЫЧИТАНИЕМ закрытого перечня
      служебных колонок (7 колонок), поэтому новая колонка по умолчанию попадает в хранимую нагрузку
      журнала. До арендатора по проводу она сегодня не доходит (разбор нагрузки идёт в доменную
      структуру без этого поля), но журнал — ещё одна проекция строки, и NTF3-51 её не перечисляет.
    condition: >-
      новая миграция переопределяет функцию нагрузки журнала, вычитая intent_initiator; проба NTF3-51
      дополнительно утверждает отсутствие ключа в строке журнала после вставки и после перехода в ERROR.
    held_by: "нужна проба (расширение NTF3-51 на журнал), её нет — заказ"
  - id: CX3-05
    decision: D5
    class: "code-authoring §«Решение и его следствие разнесены»; §«Порядок операций внутри кода»"
    exposure: >-
      сегодня запись ERROR идёт на голом пуле без транзакции и без знания прежнего состояния
      (условие только «не DELETING»); на пути терминального отказа ошибка записи отбрасывается
      присваиванием в пустой идентификатор. Если постановка письма ляжет в эту запись как есть —
      прежнее состояние придётся читать отдельно (check-then-act), а сбой постановки пропадёт молча.
    condition: >-
      (а) функция перехода принимает транзакцию вызывающего; (б) переход CREATING → ERROR —
      условный UPDATE с условием state='CREATING' и RETURNING нужных для письма полей
      (intent_initiator, project_id, name); ровно одна строка ⇒ SendXError в той же транзакции; ноль
      строк ⇒ прежняя запись «не DELETING» без постановки; чтения состояния перед записью нет;
      (в) intent_initiator берётся из RETURNING, а не из снимка рабочего списка; (г) ошибка перехода
      не отбрасывается ни на одном из двух вызывающих: счётчик Failed и журнал с id строки.
    held_by: "NTF3-07 (две горутины), NTF3-12 (откат), NTF3-53 (READY → ERROR без письма); п.(г) — нужна проба с инъекцией сбоя постановки, её нет — заказ"
  - id: CX3-06
    decision: D6
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (отказ, переводящий транзакцию в aborted)"
    exposure: >-
      NTF3-14 требует: сверх лимита строка не ставится, а переход КОММИТИТСЯ. NTF1-B09 описывает
      исход сторожа feed.ErrLimitExhausted словами «его транзакция откатывается». Если сторож
      реализован SQL-ошибкой (ограничение, RAISE), транзакция в Postgres переходит в aborted и
      коммит перехода невозможен — NTF3-14 неисполним той же реализацией Put.
    condition: >-
      Put сигнализирует исчерпание нулём затронутых строк условного UPDATE счётчика (без SQL-ошибки)
      либо изолирует попытку точкой сохранения; после ErrLimitExhausted транзакция вызывающего
      пригодна к коммиту; откат в B09 — решение вызывающего, а не свойство Put.
    held_by: "NTF3-14 и NTF1-B09 обязаны зеленеть на ОДНОЙ реализации corelib notify/feed.Put"
  - id: CX3-07
    decision: D6
    class: "code-authoring §«Решение и его следствие разнесены» (счётчик вне транзакции)"
    exposure: >-
      notify_suppressed_total растёт в процессе источника, а транзакция перехода может откатиться
      после Put; счётчик тогда утверждает подавление, которого не было.
    condition: "счётчик подавления увеличивается после коммита транзакции вызывающего (хук после коммита), а не в момент ответа Put"
    held_by: "нужна проба: лимит исчерпан → транзакция откачена → счётчик не изменился (близнец NTF3-12); её нет — заказ"
  - id: CX3-08
    decision: D6
    class: "code-authoring §«Унификация и стоимость»"
    exposure: "ключ окна «проект» добавляется в общий Put: соблазн добыть проект вызовом или вторым чтением внутри транзакции перехода"
    condition: "project_id берётся из RETURNING того же оператора перехода (CX3-05); окно проекта — тот же CAS-счётчик, что окно получателя; сетевых вызовов в транзакции перехода ноль"
    held_by: "NTF3-49; гейт NTF-1 «нет чтения счётчика с последующей записью» обязан печатать оба ключа окна в объёме осмотренного"
  - id: CX3-09
    decision: D7
    class: "code-authoring §«Контракт, который нельзя выразить» (один словарь в двух местах)"
    exposure: >-
      словарь причин живёт в домене storage (6 непустых значений; проверка допустимости принимает и
      пустую причину); перечисление reason в шаблоне с текстом на двух локалях — второе место того же
      словаря. На путь письма попадают 4 причины из ветки терминального отказа
      (BACKEND_CAPACITY_EXHAUSTED, BACKEND_REJECTED, PRECONDITION_FAILED, INTERNAL_ERROR) и
      PRECONDITION_FAILED из ветки неисправного объекта; сценарии утверждают только две.
    condition: >-
      атрибут reason генерируемой SendX типизирован доменным типом; пустая причина отвергается до
      Put; перечисление шаблона сверяется гейтом с доменным словарём в обе стороны; эталон .eml на
      каждую достижимую причину и каждую локаль.
    held_by: "нужен гейт сверки словарей — его нет (заказ); эталоны .eml — DoD 11.1 п.5"
  - id: CX3-10
    decision: D7
    class: "code-authoring §«Контракт, который нельзя выразить» (путь страницы консоли вторым местом)"
    exposure: "путь кнопки в шаблоне — второе место маршрута страницы ресурса в консоли; переименование маршрута оставит ссылку битой при зелёной сборке"
    condition: "путь кнопки берётся из одного объявления либо сверяется гейтом с таблицей маршрутов консоли"
    held_by: "нужен гейт — его нет; маршрут консоли этим разбором не измерен (заказ)"
  - id: CX3-11
    decision: D10
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (корзина «прочее»)"
    exposure: >-
      NTF-1 Р9 объявляет словарь исходов закрытым, без корзины «прочее». Р10 этой приёмки отображает
      бизнес-исходы справочника и его недоступность, но не отображает отказы вызова справочника по
      коду: PERMISSION_DENIED / UNAUTHENTICATED (у notify нет выдачи либо сверка SAN не прошла —
      неисправность настройки), INVALID_ARGUMENT (аудитория шаблона не прошла проверку типа или
      отношения), INTERNAL. Исполнитель вынужден изобрести клетку; терминальное отображение
      PERMISSION_DENIED молча убьёт все письма арендаторам при сломанной выдаче notify.
    condition: >-
      приёмка называет клетку для каждого кода ответа справочника; ожидаемая форма по соседним
      строкам Р9: отказ прав/аутентификации — DEFER с сигналом misconfigured, не терминально,
      тревога без окна; INVALID_ARGUMENT — INVALID терминально; INTERNAL — DEFER(platform_unavailable).
    held_by: "ВЕРНУТЬ В ПРИЁМКУ: сценария и клетки нет"
    return_to_acceptance: true
  - id: CX3-12
    decision: D8
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (судить по идентичности, не по подстроке)"
    exposure: "проверка «тип ресурса принадлежит пространству имён» естественно пишется сравнением префикса строки, и тогда тип соседа с общим началом имени проходит"
    condition: "служба доступа проверяет точное членство типа в множестве типов, объявленных модулем пространства имён (модель/манифест), без строкового префикса; namespace запроса — из закрытого перечня модулей установки"
    held_by: "NTF3-28 (тип с другим префиксом); нужен близнец «тип с общим началом имени без разделителя» — заказ"
  - id: CX3-13
    decision: D8
    class: "code-authoring §«Контракт, который нельзя выразить» (закрытый набор в двух репозиториях)"
    exposure: "закрытый набор отношений аудитории проверяют две стороны: валидатор notify/spec при сборке и Resolve в службе доступа; два объявления расходятся молча"
    condition: "набор объявлен один раз в corelib notify/spec и импортируется службой доступа (направление corelib←kaname разрешено)"
    held_by: "NTF3-29 (обе половины); единственность объявления — вниманием, гейта нет"
  - id: CX3-14
    decision: D8
    class: "code-authoring §«Порядок операций внутри кода»"
    exposure: "адрес и признак подтверждения могут быть прочитаны до Check и попасть в журнал или ответ ошибки"
    condition: "Check выполняется до чтения адреса в той же функции; ответ-отказ не несёт ни адреса, ни признака подтверждения; журнал — только id строки и исход"
    held_by: "NTF3-24, 25, 26, 36"
  - id: CX3-15
    decision: D9
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (идентичность по объявленному имени)"
    exposure: >-
      применитель манифестов службы доступа определяет модуль по имени, которое документ объявляет
      сам; столкновение имён ловится только когда оба документа пришли в одном обходе. Правило «выдача
      на справочник — только из манифеста notify», сформулированное по объявленному имени, судит имя,
      а не происхождение.
    condition: "правило связывает объявленное имя модуля с происхождением доставки документа (ключ/путь доставки) и отвергает выдачу на справочник при любом расхождении, в том числе когда настоящий манифест notify не доставлен"
    held_by: "NTF3-50; близнец «имя notify объявлено документом иной доставки при отсутствии настоящего» — нужен, его нет (заказ)"
  - id: CX3-16
    decision: D8
    class: "security-hardening §«Отношение, выполнимое подстановочным знаком, не сужает НИЧЕГО»; security §«AuthN+AuthZ ВЕЗДЕ»"
    exposure: "новый внутренний метод без записи каталога либо с отношением, выполнимым подстановкой, открыт каждому аутентифицированному; перечень SAN из второго источника расходится с декларацией"
    condition: "запись каталога прав на метод с прямым reader на объекте справочника; перечень вызывающих — из единственной декларации notify.spiffe (NTF-1 Р10); пустой перечень — отказ старта"
    held_by: "NTF3-27, NTF3-30; гейты каталога и подстановки службы доступа обязаны печатать метод в объёме; гейт рендера NTF1-J05"
  - id: CX3-17
    decision: D3
    class: "code-authoring §«Умолчание, которое становится утверждением»"
    exposure: "ручка локали, получившая умолчание в загрузчике, делает страж старта мёртвым"
    condition: "у ручки нет умолчания в загрузчике; страж идёт через общий дескриптор посадки; значение задано во всех профилях чарта"
    held_by: "NTF3-40; TestSpecWiringRedOnAQuietConstantInEveryPostureField; TestDeclaredKnobHasAReader"
  - id: CX3-18
    decision: D2
    class: "measurement-discipline §«Откуда читается предмет» (провенанс входа сборки)"
    exposure: "шаблоны службы доступа можно прочесть из соседней рабочей копии вместо модуля на пине — ведомость сойдётся с тем, чего в образе нет"
    condition: "bundle и bundle-check читают шаблоны службы доступа только из каталога модуля на версии пина (разрешение модулем и go.sum), одной функцией дайджеста; каталог шаблонов лежит внутри корня модуля службы доступа (без вложенного go.mod)"
    held_by: "NTF3-34 (K ≠ 0, красный при K = 0), NTF3-35"
  - id: CX3-19
    decision: D1
    class: "code-authoring §«Контракт, который нельзя выразить» (один факт в нескольких местах)"
    exposure: >-
