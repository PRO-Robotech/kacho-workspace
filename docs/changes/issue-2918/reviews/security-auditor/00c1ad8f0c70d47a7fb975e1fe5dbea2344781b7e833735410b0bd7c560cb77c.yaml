injections_restore: "git checkout после каждой инъекции; git status --porcelain = 0 строк"
blocking:
  - id: SA-673-01
    класс: страж права записи без регрессионной пробы на наблюдаемом уровне (hard-regression-observable-level; ban12-tdd; gate-authoring «проверка, способная упасть»)
    тяжесть: средняя
    признак: >
      Проверка владения типом объекта на снятии (validateObjectWithdrawal, новая функция
      этого PR) и правило проксируемой записи на КАЖДЫЙ кортеж набора регистрации (новый
      цикл этого PR) не закреплены ни одной пробой: выключение любой из них оставляет все
      пакеты зелёными (инъекции M2, M3). Соседний страж того же PR — владение типом у
      SetPublicReadPublication — закреплён (M1 красный), то есть асимметрия внутри одного
      изменения.
    почему_блокирует: >
      Снятие в этом PR стало адресоваться объектом и уносит ВСЕ проксируемые кортежи,
      зеркало, публикацию и ставит надгробие поколения. Регресс, снявший проверку владения,
      дал бы модулю с fga_writer снять чужие объекты целиком — а надгробие с большим
      поколением блокирует их повторную регистрацию; ни один прогон этого не заметил бы.
      Защита в глубину против бокового движения — инвариант (sec-internal-trusted-assumption-banned).
    сценарий_отказа: >
      Правка, упрощающая UnregisterResource (validateObjectWithdrawal → nil), проходит CI;
      служебная личность модуля A снимает объект типа модуля B с поколением выше головы —
      ответ OK, кортежи владельца объекта B сняты, повторная регистрация B с меньшим
      поколением отвергается как устаревшая.
    предикат: >
      Инъекции M2 и M3 обязаны дать красный хотя бы в одной пробе. Проба — на уровне
      обработчика (как 186d): регистрация и снятие объектом чужого модуля → PERMISSION_DENIED
      фиксированным текстом и ничего не записано (голова, зеркало, журнал не изменились);
      положительный близнец — свой тип принят. Для набора — элемент с запрещённым
      отношением или чужим типом среди законных → отказ всего набора.
    адресат: go-implementer (PRO-Robotech/kaname, ветка полосы K2)
non_blocking:
  - id: SA-673-N1
    предмет: >
      Сообщение коммита ec0a5eb72 и шапка миграции 20261008020109 описывают прежний дефект
      проекции (запоздалая запись восстанавливала снятое право) вместе с механизмом.
      Воспользоваться этим извне нельзя: порядок доставки журнала внутренний, прода нет
      (Д12). Записано как наблюдение по disc-recoverability-predicate, правки не требует.
  - id: SA-673-N2
    предмет: >
      Аудитория события строится по фактам, присланным вызывающим (цепь, метки, у UPDATED —
      прежние). Это решение приёмки (Р30, Р3): круг вызывающих сужен до service:notify и
      reader на справочнике, а сами факты — из журнала модуля-владельца. Расширение круга
      вызывающих этого метода потребует пересмотра.
  - id: SA-673-N3
    предмет: >
      Владение типом в proxytuple при пустом домене вызывающего не проверяется; пустой домен
      возможен только в dev-режиме двери (prodMode=false). Боевая посадка закрыта отказом
      двери; унаследовано, этим PR не менялось.
