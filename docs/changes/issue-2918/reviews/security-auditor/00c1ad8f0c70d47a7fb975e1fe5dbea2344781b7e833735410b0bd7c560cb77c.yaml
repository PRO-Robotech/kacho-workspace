surface:
  new_rpc:
    - "InternalIAMService/SetPublicReadPublication: внутренний слушатель, без google.api.http; каталог — exempt INTERNAL_LISTENER; таблица адресного стража — GateOutsideCircle с доводом; дверь — та же, что у RegisterResource (сертификат → служебная учётка → fga_writer на cluster_root), плюс владение типом объекта; тип обязан быть в закрытом списке публикуемых (сегодня registry_repository). Отказ по правам — фиксированный текст с ErrorInfo AUTHZ_DENIED."
    - "InternalNotificationRecipientService/ListEventAudience (замена ListProjectAudience): reader на notification_recipient_directory, acr>=1, в перечне служебной личности; отдаёт идентификаторы субъектов, не адреса."
  model_and_data:
    - "Аудитория версии события (fenced.go): только субъекты user:*, кроме подстановочного; условные факты аудитории не дают; кластерный уровень — только по подписке; ограда токена пропускает строку, только если её authz_rev виден в снимке токена, — старый токен может лишь сузить ответ, не расширить; токен из будущего — INVALID_ARGUMENT."
    - "Публикация: порядок — версия владельца; ложится только на текущее воплощение по голове объекта (FOR SHARE на голове сериализует с регистрацией/снятием); снятие объекта уносит строку; регистрация, начавшая новое воплощение, снимает публикацию прежнего."
    - "Снятие факта оставляет надгробие (relation_fact_removal); запоздалая запись не новее снятия право не восстанавливает; метка журнала — clock_timestamp() под блокировкой головы."
    - "Новых SECURITY DEFINER, GRANT, смены search_path в миграциях нет."
