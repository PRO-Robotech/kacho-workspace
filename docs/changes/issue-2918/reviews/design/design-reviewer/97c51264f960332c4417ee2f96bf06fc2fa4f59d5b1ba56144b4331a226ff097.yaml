axes:
  atomicity_no_dual_write: >-
    закрыто. Строка ленты resource-event — триггером AFTER INSERT на журнале в том же операторе и той
    же транзакции (З10); переход storage и письмо — одна транзакция (З15); CAS строки операции и
    operation-failed — одна транзакция (З16); счётчик подавления — хуком после коммита (З4); приём —
    запись ленты консоли, затем Ack после коммита (at-least-once + UNIQUE, З19).
  idempotency: >-
    закрыто, кроме В3. Приём — UNIQUE (module, source_row_id) + ON CONFLICT DO NOTHING; открытие и
    закрытие окна сводки — уникальные ключи; однократность напоминания — PK; повторы Attach/Detach и
    SetAddressReference без лишних строк журнала — УК3-32, УК3-33.
  atomic_and_optimistic_concurrency: >-
    ВОПРОС → В1, В2. Переход storage — CTE FOR UPDATE + UPDATE одним оператором; позиция ленты — под
    замком строки inbox_clock до коммита; отметка просмотра — один upsert с границей в том же
    операторе; сетка мгновенных писем, потолок подписок — CAS. Пробы с конкурирующими горутинами
    заказаны: УК3-17, 18, 19, 20, 21, 35, 42; NTF3-07 (две параллельные записи перехода).
  change_delivery_polling: >-
    закрыто. Watch/стрима публичного нет; мутации notify — Operation nop done=true; изъятие
    StreamBudget сохранено (З28).
  workers_and_reconcilers: >-
    ВОЗВРАТ → К1, К2. Терминальная запись ошибки операции на обоих фоновых путях (исполнитель,
    Reconciler) не может открыть транзакцию, пишущую журнал, в той форме, что назначает замысел, а
    пачка Reconciler ставит больше одного письма с лимитами в одну транзакцию; у вызовов notify-sender
    к справочнику срока нет.
  inter_service_edges: >-
    закрыто. notify-sender → модули (Subscribe/Claim/Ack), notify-sender → kaname, notify-api → kaname,
    gateway → notify-api; модули и kaname notify не зовут; новых рёбер между модулями kacho нет (§9,
    З31). Рёбра notify записаны в правиле (.claude/rules/polyrepo.md, строки notify).
  replica_state_isolation: >-
    закрыто. Позиция и время приёма — строка базы inbox_clock; окна сводки — строки базы; кэша-источника
    истины в памяти реплики нет.
  edge_ban6: >-
    закрыто. Пять сервисов NTF-3 — класс public по контракту (Р25), InternalNotificationRecipientService
    kaname — без HTTP-привязки; маршрут, перечень и каталог края — одним генератором (З28).
  clean_architecture: >-
    закрыто. Граница импорта cmd/notify-api (УК3-26); journaltx и auth/initiator не импортируют
    notify/*; corelib не знает имён модулей (З1).
  pin_windows_d41: >-
    закрыто для рёбер, которые Д41 требует (окна (1)–(2)): X1, X2, X3, X2-F этого предмета — после
    S3-C2 issue-2919 (4 строки), T1/T2 и C4 NTF-5 — (2 строки), Х1 NTF-4 после N11 (1), C12 NTF-1 после
    v1.10.0 (1), X2-F после N11 (1), C4 TW после S2-B1 (1). Остаток про окна (3)–(4) — В4 (не блокирует).

