critical:
  - id: К1
    lane: X3, S3-C3
    coordinate: >-
      design.md З16 (строки 789–796), §7 п.4 (1384–1385), З18 (851–852, 856–858); corelib @34bc8104a
      operations/worker.go:558, operations/reconciler.go:179, :193, :252; замысел NTF-1
      issue-2915/design.md:539–543 (УК84/85), :558–572 (CX1-67), :585 (шаг 6 — строка журнала подписки)
    finding: >-
      Терминальная запись ошибки операции на обоих путях, которые замысел проводит через FailTerminal,
      в назначенной форме не завершается. (1) Путь исполнителя: pgRepo.MarkError «открывает транзакцию
      помощником модуля» (З16), а помощник берёт инициатора только из принципала контекста и без него
      транзакции не открывает (З4). terminalWrite исполнителя зовёт запись под
      context.WithTimeout(context.Background(), terminalWriteTime) (worker.go:558) — принципала в этом
      контексте нет ни у одной операции, поэтому journaltx.Begin отказывает всегда, запись уходит в
      повторы и остаётся done=false до Reconciler («reconciler backstop»). Это новый отказ пути без
      человека, против условия З13 «под-фаза не добавляет фоновому пути отказа». (2) Путь Reconciler:
      Sweep открывает одну транзакцию rc.pool.Begin на пачку до BatchSize (по умолчанию 100) операций
      (reconciler.go:179, :193) и зовёт терминальную запись каждой в ней (:252). Транзакция открыта не
      помощником — kacho_journal.initiator не выставлен, а Put шагом 6 пишет строку журнала подписки
      модуля, колонка initiator которой NOT NULL (З2) → 23502. Кроме того, operation-failed — письмо с
      limits (З18: FailTerminal — «одно» письмо с лимитами), и вторая операция пачки с адресатом user:
      даёт ErrSecondLimitedPut; по З18 для пути без человека это откат всей транзакции вызывающего —
      откатываются и уже применённые CAS пачки. Следующий Sweep берёт ту же пачку (ORDER BY
      modified_at ASC) — Reconciler не продвигается никогда, операции с человеческим инициатором не
      получают done=true. Держатели не ловят: NTF3-133…137, УК3-46 и УК3-38 зовут экспортированный
      FailTerminal напрямую (З16 «Вход пробы»), проводку исполнителя и Sweep не проходит ни одна проба;
      гейт З4 (а) обходит только дерево пяти модулей и corelib Reconciler не видит.
    requirement: >-
      Условие к коду в форме Д26 (строки §11 и полосы X3, S3-C3), выбрать и назвать: (а) источник
      инициатора транзакции терминальной записи на обоих путях — либо terminalWrite исполнителя несёт
      принципал контекста исполнителя (WithoutCancel, а не Background), либо у терминальной записи своя
      личность компонента — тогда §8, З4 (1) «вызывающих AsComponent ровно два» и УК3-27 (д)
      правятся тем же изменением; строку операции без человеческого принципала это не должно
      останавливать (И22 распространить на открытие транзакции, а не только на адресата); (б) на
      пути Reconciler — не больше одного Put с лимитами на транзакцию: терминальная запись с
      постановкой — своей транзакцией на операцию (claim-замок пачки при этом не теряет exactly-once:
      CAS по done), либо иная форма, названная с доводом против УК84; (в) классификатор исходов
      терминальной записи на Reconciler — строкой на исход, без отката пачки из-за одной операции.
      Держатели — интеграционные пробы через настоящие входы: исполнитель, fn операции usr-A падает →
      done=true в пределах terminalWrite (не после OrphanGrace), строк operation-failed 1; близнец —
      операция {system, bootstrap} → done=true, строк 0; Sweep с двумя прерванными операциями usr-A и
      usr-B в одной пачке → обе done=true, строк 2, повторный Sweep ничего не берёт; близнец — одна
      операция в пачке.

  - id: К2
    lane: S2-B5, S3-C4 (и S2-B4, если приём зовёт справочник)
    coordinate: >-
      design.md З21 (919–934), З26 (1083–1093), З27 (1095–1115), §7 п.5–6 (1386–1389), §8 (1393–1401);
      tasks.md: срок вызова назван только у notify-api (S2-B10); замысел NTF-5 issue-2924/design.md:1833–1860
    finding: >-
      У вызовов notify-sender к справочнику службы доступа — страницы ListProjectAudience и Resolve строк
      сводки (З21), страницы ListExpiringCredentials и Resolve проверки контакта (З26) — срок не назван
      ни замыслом, ни ручкой приёмки (в Р26 ручки срока справочника у notify-sender нет). Общий клиент
      kaname_client.go своего срока не ставит по построению (NTF-5, предикат «клиент своего срока не
      ставит» → 0), срок ставится в месте вызова пакета — у пакетов NTF-5 он есть, у пакетов digest,
      reminder, directory этой под-фазы нет. Служба доступа, принявшая соединение и замолчавшая,
      останавливает проход сводки и проход напоминаний без отказа: окна не созревают, счётчик отказа
      прохода не растёт, клетка «срок вызова» таблицы Р7 (исход, который приёмка ожидает) не
      производится. §7 п.5 ставит Resolve строк между открытием окна и Put — если это одна
      транзакция, вторая реплика ждёт на незафиксированной вставке открытия того же адресата.
      Правило arch-per-call-deadline; прецедент — К1 ревью замысла NTF-4 и Н1 ревью замысла NTF-5.
    requirement: >-
      Условие к коду без новой ручки: каждый вызов notify-sender → kaname этой под-фазы — под
      context.WithTimeout с константой-сроком своего пакета (одна на пакет, в месте вызова, как у NTF-5;
      клиент срока не ставит); DEADLINE_EXCEEDED классифицируется клеткой «срок вызова» Р7 (отложить
      адресата / contactUnknown), а не отказом настройки; назвать, что вызовы справочника в проходе
      сводки идут вне транзакции адресата (либо назвать сумму сроков меньше
      idle_in_transaction_session_timeout пула kacho_notify). Держатель — модульная проба: заглушка
      справочника молчит → вызов возвращается в пределах срока, проход завершён, счётчик отказа прохода
      +1, окно адресата не закрыто; близнец — ответ внутри срока. Строки §11 для З21, З26.

important:
  - id: В1
    coordinate: design.md З12 таблица, строка «vpc InternalNetworkInterfaceService.Attach» (595); kacho vpc network_interface.go:327-345
    finding: >-
      Замысел заменяет действующий один CAS AttachToInstance (`used_by_id = '' OR used_by_id = $2`, с
      проверкой когерентности размещения и слота в том же операторе) на CAS `WHERE used_by_id = ''` и
      «второй оператор» для повтора. Форма второго оператора не названа. Если он повторяет широкий
      предикат, то между операторами соседняя транзакция может освободить интерфейс, и второй оператор
      привяжет его без строки журнала (видимое изменение без события). Если он узкий (`= $inst`), повтор
      при параллельном Detach получит ложный отказ.
    requirement: >-
      Сохранить один оператор (cas-attach-template) и признак «изменилось» брать из прежнего значения,
      прочитанного под замком в том же операторе (CTE `SELECT used_by_id … FOR UPDATE` + UPDATE, как у
      перехода storage З15); либо назвать форму второго оператора и исход гонки с Detach. Не блокирует.
  - id: В2
    coordinate: design.md З12 таблица, строка «vpc InternalAddressService.SetAddressReference» (599); kacho vpc address.go:1008-1035
    finding: >-
      «RETURNING (xmax = 0) AS inserted, <прежнее used> из одного оператора upsert» невыразимо как
      написано: used живёт в addresses, upsert — в address_references, а сегодня это два оператора;
      RETURNING OLD в Postgres 16 нет. Реализация выведет «прежнее used» чтением до записи — тем
      признаком, который CX3E-01 (а) запрещает.
    requirement: >-
      Назвать форму, выполнимую на Postgres 16 одним оператором: CTE с `SELECT used FROM addresses …
      FOR UPDATE`, затем UPDATE addresses и upsert address_references, RETURNING прежнего used и
      признака вставки. Пересечение со схемой. Не блокирует.
  - id: В3
    coordinate: design.md З19 (874–878, 888–892), И23
    finding: >-
      «Позиции выдаются подряд без пропусков» неверно на пути повторной выдачи: транзакция приёма
      первым оператором поднимает inbox_clock.pos, затем вставка inbox_event уходит в ON CONFLICT DO
      NOTHING (УК3-16: Ack утрачен, та же строка пришла снова, в том числе параллельно с другой
      репликой) — транзакция фиксируется с выданной позицией без записи. Граница отметки от этого не
      ломается, NTF3-161 (г) на свежей схеме тоже, но утверждение о дырах ложно.
    requirement: >-
      Либо снять утверждение «без пропусков» (З19, CX3I-04) и назвать дыру на повторе, либо сделать так,
      чтобы повтор позицию не тратил: сначала вставка ключа приёма с ON CONFLICT DO NOTHING RETURNING,
      часы — только при вставке. Не блокирует.
  - id: В4
    coordinate: design.md З10 «Посадка» держатели (559–565), §13 Е6 (1611); tasks.md X3 (127), X5 (129)
    finding: >-
      Окно по Д37 открывается выпуском тега, а не подъёмом. Строка X5 правит подъёмы и поэтому не
      держит окна X1…X3 против окон (3)–(4): у тега X3 ребро только «после S3-C2 issue-2919», и выпуск
      X3 между выпуском X2-F и посадкой S2-B1 (или внутри окна TW) открывает второе окно. Д41 требует
      рёбер только против окон (1)–(2) — они на месте.
    requirement: >-
      Дать тегу X3 ребро «после посадки S2-B1» (S3-C3 и так ждёт X3 и S2-B1) и назвать его место
      относительно TW, либо записать, что окна X1…X3 против (3)–(4) держатся вниманием при ВЫПУСКЕ
      тега, а не строкой X5. Не блокирует.

