    coordinate: design.md §12 (строки 2090–2093) против З16 таблицы классификатора (строка «отказ среды», 1133)
    finding: >-
      §12 называет цену механизма К1 одним случаем — «исполнитель пропал вместе с процессом». Таблица З16
      даёт второй путь к тому же исходу: отказ среды исчерпал бюджет terminalWrite, строка остаётся
      done=false, её разрешает Reconciler без письма. Цена та же и в объёме приёмки (строка 1918:
      разрешитель вне объёма), но §12 перечисляет её неполно.
    requirement: >-
      Одна фраза в §12: письма нет и у операции, чья терминальная запись исчерпала бюджет terminalWrite
      отказами среды. Не блокирует; можно тем же заходом, что следующая правка, или в handoff X3.

