axes:
  atomicity_no_dual_write: >-
    закрыто. Терминальная запись с письмом — одна транзакция journaltx.Begin под парой
    (<служба>, operations): FailTerminalCAS и Put operation-failed тем же tx, Commit один (З16). Запасная
    запись на недостижимых исходах — только CAS без письма, второй записи нет. Прочее — как в 97c51264.
  idempotency: >-
    закрыто. Повтор terminalWrite после отказа среды не дублирует письмо: CAS по done в той же транзакции,
    что Put; неоднозначный Commit (зафиксирован, ответ потерян) → повтор получает ErrAlreadyDone,
    письмо ровно одно. В3 исполнен (утверждение «без пропусков» снято, ДР-В3).
  atomic_and_optimistic_concurrency: >-
    закрыто. В1 — один оператор WITH prev … FOR UPDATE + UPDATE с сегодняшним предикатом
    `used_by_id = '' OR = $inst`; В2 — изменяющие CTE одним оператором, RETURNING прежнего used и
    (xmax = 0), выполнимо на Postgres 16. Гонка Worker ↔ Reconciler на одной строке — CAS по done,
    проигравший получает ErrAlreadyDone и откатывается без письма. Порядок замков: транзакция
    терминальной записи держит одну строку операции и пишет журнал модуля; транзакция пачки Reconciler
    журнала не пишет — цикла ожиданий нет.
  change_delivery_polling: закрыто (без изменений против 97c51264).
  workers_and_reconcilers: >-
    закрыто (К1 исполнен механизмом). Инициатор транзакции — личность компонента из opsnotify, принципала
    контекста не требует, поэтому контекст terminalWrite от Background не мешает; операции без
    человеческого принципала получают done=true в первой попытке (И22 на открытии транзакции). Reconciler
    не меняется и Put не зовёт: ни 23502, ни второго Put с лимитами, ни отката пачки — по построению.
    Классификатор RunTerminal — строка на исход, корзины нет; ErrAlreadyDone и ErrNotFound возвращаются
    с %w, terminalWrite различает их как сегодня. Держатели через настоящие входы — УК3-53 (Worker,
    пакетный operations.Run), УК3-54 (Sweep, сравнение с базой 34bc8104a), УК3-55 (корни), УК3-59
    (гейт корней), УК3-67 (подделка FailedNotify). Срок терминальной записи — terminalWriteTime.
  per_call_deadline: >-
    закрыто (К2 исполнен). Каждый вызов справочника из digest и reminder — под context.WithTimeout
    константой пакета в месте вызова; клиент internal/directory отвергает контекст без срока sentinel
    ErrCallWithoutDeadline до соединения, вызывающий проверяет его errors.Is до resolvecell.Of (метка
    no_deadline); DEADLINE_EXCEEDED — клетка Р7 (DEFER / contactUnknown). Resolve сводки — вне
    транзакции адресата; в транзакции адресата сетевых вызовов 0; гонка двух реплик на закрытии окна —
    UNIQUE (адресат, начало), проигравший откатывает и Put. Второй клиент (NTF-5) — держит замысел NTF-5.
  inter_service_edges: >-
    закрыто. Новых рёбер механизм не вводит: opsnotify — пакет corelib внутри процесса модуля; граф
    импортов operations ← auth ← journaltx ← opsnotify и operations ← opsnotify ацикличен (УК3-63).
  replica_state_isolation: закрыто (без изменений).
  edge_ban6: закрыто (без изменений).
  clean_architecture: >-
    закрыто. operations не импортирует journaltx, auth, notify/*; значение подключения строится в корне
    (opsnotify.New), доходит до исполнителя тем же аргументом repo; обёртки над *pgRepo нет, поэтому
    executionClaimer не теряется.
  security: >-
    закрыто. FailTerminalCAS подставляет table в текст запроса — условие к коду: только доверенный
    идентификатор из конструктора репозитория или Reconciler, вызовов из kacho и kaname 0 (УК3-65);
    вход для модулей — не он.
  pin_windows_d41: >-
    закрыто (В4 исполнен: тег X3 — после посадки S2-B1, окно TW — правилом Д37 при выпуске).

