# Манифест изменения issue-2918 (NTF-3) — координаты, состояние, отпечатки, ссылки.
#
# Манифест НЕ несёт нормативной прозы (CG_HUMAN_MANIFEST_PROSE): наблюдаемое
# поведение — в приёмке, чем изменение держится — в `holders.yaml`.
#
# ПРИЁМКА ЛЕЖИТ ВНЕ КАТАЛОГА ПАКЕТА, и это не пропуск: её дом — `docs/specs/`
# (кросс-репозиторный предмет, polyrepo.md note «У приёмки домов ДВА»), и там
# её читает docs-gate check-01. Копия `acceptance.md` здесь была бы вторым
# местом об одном предмете. Документ назван отпечатком `hashes.acceptance_sha256`
# и ссылкой `links.acceptance`. Записи ревью приёмки лежат по координате
# `links.acceptance_reviews` (docs/specs/reviews/<имя приёмки>/<sha256>.yaml),
# а не в `reviews/acceptance/` пакета, как раскладывает SDD-1 §3: записи
# append-only и цитируются шапкой приёмки, перенос сменил бы её отпечаток.
#
# СОСТОЯНИЕ CLASS_EXPOSURE_RECORDED — приёмка на отпечатке `hashes.acceptance_sha256`
# (редакция 32, суженная по Д31) одобрена кругом 2 (запись docs/specs/reviews/sub-phase-NTF-3-kacho-modules-notifications-acceptance/aa939edc35b55da64f6732960afaf23cbb76cdc6c606b10bd1def83dae32188e.yaml,
# APPROVED), первичный разбор классов на тот же отпечаток записан
# (reviews/class-exposure/initial/aa939edc….yaml, исход «к-замыслу»).
# Замысел — `design.md` редакции 3 (2026-09-30; редакция 1 — первый заход в форме захода отображения
# Д26, предмет сужен Д31; редакция 2 исполняет пересверку классов на редакцию 1 `89d1f0ad…`; редакция 3 —
# пересверку на редакцию 2 `3730bca2…`, исход «к-замыслу»: CX3H-02, CX3B-25 (4), CX3H-01 (г)),
# отпечаток — `hashes.design_sha256`; маршрут — `tasks.md` рядом, редакция 3. Вердикта и
# пересверки на отпечаток редакции 3 нет. Открытое решение замысла — Е1 (§13): функция базы
# `resource-event` против запрета замысла NTF-1 (Е10 NTF-1), решение за диспетчером.
