premise:
  status: confirmed
  how: >-
    перепись мест, где движок назначает идентификатор запросу:
    `command grep -rn 'SetID(' internal/oauth2 oauthceremony` без _test и
    заглушек → 4 места: церемония ceremony.go:601 (выдача кода) и движок
    flow_authorize_code_token.go:94, flow_refresh.go:87, flow_refresh.go:142 —
    все три движковые копируют идентификатор из записи, выданной мостом.
    Request.GetID (request.go:40) чеканит свой только на пустом ID; все
    читатели записи отдают запрос с ID из записи и отказывают на пустом.
    Вид гранта, где запрос токена рождается без записи (client_credentials,
    implicit, PAR, OIDC), в сборке отсутствует. «Движок своего идентификатора
    не чеканит ни на одном пути церемонии» (doc.go) на голове верно.

