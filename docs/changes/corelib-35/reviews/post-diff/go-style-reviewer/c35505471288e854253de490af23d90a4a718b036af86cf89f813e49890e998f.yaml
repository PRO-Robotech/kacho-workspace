premise:
  status: confirmed
  claim: 'движок своего ID не чеканит ни на одном пути церемонии; крючок зовётся ровно раз на грант'
  how: >-
    Request.GetID чеканит uuid только на пустом ID (internal/oauth2/request.go:40-45).
    Перепись `grep -rn '\.GetID()'` по internal/oauth2 без *_test.go (кроме ID клиента):
    каждый запрос, чей ID читается, либо собран requesterFromGrant из записи
    (теперь с отказом на пустом GrantID), либо получил SetID от такого запроса
    (flow_authorize_code_token.go:94, flow_refresh.go:87/142), либо — единственный
    новый — получил SetID(grantID) от крючка перед NewAuthorizeResponse
    (ceremony.go:601). Пути повтора кода/оборота уже отвергали пустой GrantID до
    сборки (bridge.go:225, 368). Грант без записи (client_credentials) не собран.

