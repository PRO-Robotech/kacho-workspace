  - 'Наше печенье выдаётся без Domain на каждой цепочке, где оно выдаётся. Рендер 7 цепочек deploy/stacks.txt: identity-provider own только у цепочки own, и там login.cookie-domain: none. На prod и fe3455 none тоже объявлен, но под external не читается; у dev-цепочек и a8f60d ключа нет.'
