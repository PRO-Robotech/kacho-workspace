  - '«Эта ветка живёт лишь в состоянии „оба“» (auth.go:1292-1295): ветка исполняется при !transitionalWindowAdmits, а он при нулевом окне пропускает всё (auth.go:1118-1121). Окно обязательно ровно при own,external и запрещено вне его (session_carrier_validation.go:177-187).'
  - 'Предикат снятия: S3, kacho#1276 — gh issue view 1276 → OPEN, «deploy: снятие компонента — чарты, база, 17 гейтов, 14 спек».'
