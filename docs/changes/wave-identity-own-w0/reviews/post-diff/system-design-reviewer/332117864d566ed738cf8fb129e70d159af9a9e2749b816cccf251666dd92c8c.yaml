    субъекта на обеих полосах (auth.go:1298, session_identity_handler.go:196).
    Держит это TestTransitionalWindow_ARefusedForeignSessionCreatesNoMirror (PASS).
  cas_occ: 'не применимо: SQL нет. Проба с конкурирующими горутинами не требуется.'
  change_delivery: 'не применимо.'
  worker_coordination: 'не применимо: воркеров и реконсайлеров нет.'
  per_call_deadline: >-
    Kratos whoami: http.Client{Timeout: 5s}, kratos_session.go:96. Ретрансляция
    формы: настраиваемый timeout. IAMSubjectClient: callTimeout на каждом методе.
    Resolve и SessionCutoffOf идут по сырому контексту запроса без предела, и
    это было в базе (см. I8).
  revocation: >-
    Держится на обеих полосах. Чужая сессия проходит, только если она новее нашей
    отсечки (sessionCutoffCheck, включающе) и старше момента открытия окна
    (transitionalWindowAdmits, строго). Нулевой момент аутентификации при
    открытом окне даёт отказ. «Кто я» спрашивает тот же предикат своим читателем
    (session_identity_handler.go:140-145, 321-346). Обе полосы сверяет
    TestBrowserSessionLanesAgree_OnTheTransitionalWindowAxis (PASS). Выход нашей
    формой пишет отсечку «первая наша аутентификация минус 1 мкс»
    (kaname@cbbac984 humansession/logout.go:124-141). Поэтому чужие сессии,
    заведённые до первого нашего входа, выход тоже снимает, даже если их печенье
    осталось в браузере (см. I7).
  unavailable_session_service: >-
    Держится, отказ закрытый. Если kaname не ответил о сессии либо об отсечке,
    полоса отвечает 401 (F4d-23) и носитель остаётся. Исключение — глаголы формы
    с relayWhenUnanswered: их исход судит служба. «Кто я» отвечает анонимом.
    UNIMPLEMENTED об отсечке — проход с громким журналом (окно раската). Это
    решение приёмки Ф1-56/F4d-29 из базы, волна его не трогала. Если kratos
    недоступен, результат Active=false: полоса не выставляет личность и
    запрос уходит дальше анонимным.
  precedence_single_predicate: >-
    Держится. Владение запросом определяется до полос
    (ownSessionOwnsRequest: наш читатель провязан и наш носитель предъявлен).
    Предикат носителя на обе полосы один (ourSessionCarrierOf). Чужой стороне
    уходит ровно её печенье (ProviderSessionCarrierHeader), поэтому ключ кэша
    whoami больше не содержит нашего носителя. Всё это держат
    TestBothCarriers*, TestForeignLane_NeverCarriesOurBearerToTheForeignSide и
    TestProviderCarrierPredicate_* (PASS).
  service_graph: >-
    Новых рёбер нет. Край→kaname :9091 (Resolve, SessionCutoffOf), край→kratos
    public (whoami) и край→слушатель формы kaname были в базе при разных
    посадках. В состоянии own,external живы оба первых сразу, направление
    прежнее. Kaname и kratos край не зовут, граф ацикличен.
  replica_isolation: >-
    Множество и момент окна — величины чарта, одинаковые для всех реплик.
    Страж старта сверяет момент с часами СВОЕЙ реплики (Now: time.Now(),
    main.go). Счётчики полосы atomic и считаются на процесс. После старта
    интерцептор не меняется: With* вызываются только в композиционном корне.
  edge_ban6: >-
    Internal* не тронуты. Resolve и SessionCutoffOf ходят на внутренний слушатель
    kaname по mTLS (backends["iamInternal"]). Новых маршрутов на публичном mux
    нет: /iam/v1/auth/me и глаголы формы были в базе.
  clean_arch: >-
    Держится. Разбор ручки находится в config, страж пары — в корне,
    предикаты и полосы — в middleware. Доступ к kaname идёт через адаптер
    clients (порт HumanSessionReader).

