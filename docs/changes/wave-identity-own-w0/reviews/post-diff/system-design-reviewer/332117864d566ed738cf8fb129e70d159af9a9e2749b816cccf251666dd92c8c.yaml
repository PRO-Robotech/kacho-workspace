# ── ЗАМЕЧАНИЯ БЕЗ ТРЕБОВАНИЯ ─────────────────────────────────────────────────
notes:
  - >-
    Раскат в own,external неатомарен по репликам. Пока старые реплики
    (только чужой, окна нет) живут рядом с новыми, чужая сессия, заведённая
    после момента окна, получает то 200, то 401 в зависимости от реплики.
    Состояние сходится само. Это свойство профиля, а не кода.
  - >-
    Страж отвергает момент окна «в будущем» относительно часов реплики. Если
    момент равен моменту раската, реплика с отстающими часами уходит в
    CrashLoop, пока часы его не догонят. Отказ закрытый и именованный.
  - >-
    Готовность консоли к переходному состоянию предметом этой роли не является,
    но выяснилась по дороге. Своих экранов входа у консоли 0, это подтверждает
    ui-future/shared/src/pages/auth/README.md. Её вход и выход идут через чужого
    издателя (AuthContext.tsx:137, 140-156). В окне сессии, заведённые после его
    момента, край отвергает, поэтому войти заново через консоль нельзя.
    Предпосылка включения own,external на стенде с консолью.

