    class: 'решение и его следствие разнесены по двум службам (code-authoring); проба снисходительнее продукта (gate-authoring)'
    claim: >-
      Край гасит ory_kratos_session печеньем host-only без Domain. Чужой
      издатель выпускает это печенье с Domain=<cookieDomain> на 6 цепочках из 7.
      Браузер хранит host-only и доменное печенье как разные записи (RFC 6265
      §5.3 п.11: ключ — имя, домен и путь), поэтому гашение край чужое печенье не
      находит. Консоль отдаёт /iam/v1/ краю со своего хоста (console.<domain>,
      app.<domain>), а это другой хост, чем домен печенья.
    predicate: >-
      Google Chrome 152 headless, HTTPS-заглушка, *.kacho.test → 127.0.0.1.
      Гасящие печенья выпускает продуктовая функция
      middleware.EndSessionCarriers (собрано из дерева b579b9eec9c). Пять вариантов:
        (1) доменное печенье, гашения нет → печенье видно на консольном хосте. Это контроль видимости;
        (2) доменное печенье, гашение края → печенье ЖИВО. Это находка;
        (3) host-only печенье на консольном хосте, гашения нет → видно;
        (4) то же и гашение края → удалено. Это законный близнец: проба гашение видит;
        (5) доменное печенье, гашение с Domain=kacho.test → удалено. Это форма починки.
    consequence: >-
      На этой голове путь недостижим ни на одном стенде (measured.transitional_state_reach).
      Корень был в базе: форма гашения не менялась с bec320cf47d, где было 4
      вызывающих (отсечка на чужой полосе, /oauth/logout и 2 на нашей полосе).
      Волна добавила 2 вызывающих на латентном пути. После объявления own,external
      на цепочке с cookieDomain будет так:
        (а) «выйти» формой края при одной чужой сессии: служба не пишет отсечку,
            потому что нашего носителя нет, чужое печенье не гасится, окно его
            пропускает, и человек остаётся вошедшим. Ровно этот случай
            login_lane_relay.go называет закрытым;
        (б) отказ окна становится СТОЯЩИМ, а не разовым. Клетка window_closed
            растёт на каждом запросе одного браузера, и её смысл «чужая форма
            входа достижима» теряется;
        (в) выход консоли идёт через собственный выход чужого издателя, он
            гасит печенье с верными атрибутами и снимает сессию на сервере. Этот
            путь находкой не затронут.
      Обещание configuration.mdx «ВЫХОД гасит ОБА имени во всех трёх
      состояниях» на 6 цепочках из 7 ложно для чужого имени.
    why_not_blocking: >-
      Предмет латентен: ноль стендов объявляют ручку. Корень в базе. Выход, которым
      пользуется консоль, находкой не затронут. Починка естественно входит в
      предпосылку включения переходного состояния.
    requirement: >-
      До того как own,external объявят на любой цепочке с cookieDomain, нужно
