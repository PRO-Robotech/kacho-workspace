  - id: I2
    coordinate: 'deploy/scripts/dev-prod-secrets.sh:87-92; deploy/scripts/stack-secrets.sh:182, 224-246'
    class: 'проверка-затем-запись + корзина «прочее» в разрешающую сторону'
    claim: >-
      «Есть ли секрет» решается кодом возврата `kubectl get secret`; любой отказ
