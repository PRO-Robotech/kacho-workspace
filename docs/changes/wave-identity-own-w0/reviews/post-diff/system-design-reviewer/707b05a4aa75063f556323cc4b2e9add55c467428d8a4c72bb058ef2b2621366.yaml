      kubectl-заглушка: первый `get secret kaname-second-factor-enc-key` → exit 1
      «TLS handshake timeout», объект в «кластере» есть со значением OLD. `bash
      deploy/scripts/dev-prod-secrets.sh` → exit 0, «provisioned … generated ONCE»,
      значение после — новое (da5d3fe5…). Близнец без сбоя → OLD сохранён.
      Модель, а не живой кластер: семантика apply-перезаписи — свойство kubectl.
    consequence: >-
      Только путь локального стенда kind (на управляемом скрипт лишь судит).
