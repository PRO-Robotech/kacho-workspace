claims:
  - text: 'config.go:293-301 и :46-50, deployment.yaml:180-186 — читает ли край адрес поставщика, решает множество, а не посадка'
    verdict: верно
    evidence: >-
      Прочитано на голове. Адрес читается одной строкой, main.go:189
      (kratosURL := cfg.KratosPublicURL). Уходит в стража (main.go:193) и в две
      ветки `sessionCarriers.ReadsProvider()`: интерцептор, main.go:229-231, и
      «кто я», main.go:1209-1210. Других производственных читателей в gateway
      нет: git grep 'KratosPublicURL|KRATOS_PUBLIC_URL' без _test.go и доков
      находит только эти места.
  - text: 'config.go — ручка не объявлена: множество из посадки, под own адрес не читается, задан он или нет'
    verdict: верно
    evidence: >-
      Прочитано в sessioncarriers.go:129-130 и 146-148: c.SessionCarriers == ""
      → из посадки, Own → {own}. Измерено пробой через настоящий загрузчик
      (corecfg.Load → envconfig.Process, v1.4.0): случаи absent и present-empty
      дают set=own, declared=false, readsProvider=false. Проба стража: под own
      при carriers="" с адресом "" или "disabled" отказа нет.
  - text: 'config.go, deployment.yaml — объявленное множество с external, в том числе own,external под own: адрес обязателен, пустой или disabled страж отвергает'
    verdict: верно
    evidence: >-
      Прочитано в session_carrier_validation.go:190-199 (Declared && ReadsProvider,
      TrimSpace, "" или "disabled" → отказ). Измерено пробой: own,external под own
      с "disabled" → отказ, с "" → отказ, с http://kratos:80 → проход. В чарте
      пустого адреса не бывает (`default (printf …)`), поэтому deployment.yaml
      называет только disabled, и это корректно.
  - text: 'deployment.yaml:177-179 — disabled выключает чтение сессии поставщика и не касается нашей'
    verdict: верно
    evidence: >-
      main.go:230 и 1209: disabled проверяется только внутри веток ReadsProvider.
      Ветки ReadsOwn (main.go:245-249 и 1217-1218) от адреса поставщика не
      зависят.
  - text: 'deployment.yaml:230-238, session_carrier_knobs_test.go:27-31 и 81-83 — процесс читает пустую переменную как «не задано»; отказ получает непустое значение из пробелов или разделителей'
    verdict: верно
    evidence: >-
      Измерено пробой через Load(). present-empty для SESSION_CARRIERS даёт
      declared=false. Для WINDOW_OPENED_AT пустое даёт нулевой момент без ошибки
      (sessioncarriers.go:236-238). «   » и «,» дают отказ разбора «declares no
      carrier element», и main.go:176-181 превращает его в log.Fatalf. Рендер с
      authn.sessionCarriers из пробелов эмитит переменную (`with` пропускает
      непустое).
  - text: 'own_lane_readers_wiring_test.go:156-159 — вердикт о читателе выносит session_carrier_wiring_test.go по решению множества, посадка лишь называется в тексте находки'
    verdict: верно
    evidence: >-
      session_carrier_wiring_test.go:357-384: засчитывается decision == want
      (ReadsProvider/ReadsOwn), s.posture идёт только в счётчик byPosture и в
      текст t.Errorf. Шапка распознавателя (own_lane_readers_wiring_test.go:30-32)
      говорит то же.
  - text: 'own_session_lane_test.go:71-73, 186-187 — при own,external читатель поставщика провязан; при множестве own его нет'
    verdict: верно
    evidence: 'Страж пропускает own + {own,external} (проба: проход с адресом). main.go заводит WithKratos по ReadsProvider независимо от посадки.'
  - text: 'session_lanes_agree_test.go:42-46 — при own,external заведены оба читателя, чужая сессия читается с моментом открытия окна; ось судит TestBrowserSessionLanesAgree_OnTheTransitionalWindowAxis'
    verdict: верно
    evidence: >-
      main.go:217-220 и 241: момент ненулевой только при IsTransitionalWindow и
      подаётся обеим полосам (main.go:1215). Проба существует
      (session_lanes_agree_test.go:366).
  - text: 'session_carrier_names_gate_test.go:25-28 — читателя носителя поставщика заводит множество, называющее external'
    verdict: верно
    evidence: 'То же, что в первом пункте: main.go:229, 1209.'

