critical:
  - id: C1
    class: комментарий о защите противоречит коду; довод взят у соседнего артефакта, которого больше нет
    where: gateway/deploy/login_console_test.go:47-53, :67-68, :325-326
    finding: >-
      Комментарий утверждает, что под посадкой `own` читатель печенья поставщика
      «не заводится ВОВСЕ», и ссылается на перепись
      TestOwnLane_F3_12_NoProviderCarrierReaderIsWiredUnderOwn («мест 2 · заведено
      под own 0»). На голове волны такого теста нет (`git grep -n 'func TestOwnLane_F3_12'
      0e0a85f936e` → 0; на bec320cf47d он есть, own_lane_readers_wiring_test.go:115).
      Его сняла соседняя полоса ЭТОЙ ЖЕ волны, 5fe644eb3b3 «читателей носителя
      заводит множество, а не посадка», а c9b4a082d51 процитировал его на той же
      базе. По коду читателей выбирает множество: gateway/internal/config/sessioncarriers.go:41
      объявляет `own,external` законным переходным состоянием, gateway/cmd/api-gateway/main.go:229
      заводит читателя поставщика по `sessionCarriers.ReadsProvider()`, от посадки
      не зависит. Под `own` с `own,external` чужое печенье ЧИТАЕТСЯ, так что
      «он там не читается» (:68) и «под `own` его никто не читает» (:325) ложны.
      Решение гейта верное — под `own` спрашиваются обе половины собственной полосы, —
      неверно обоснование, и касается оно того, какое печенье становится личностью.
    requirement: >-
      Переписать три места под то, что делает код: читателей определяет множество
      носителей (config.ResolvedSessionCarriers, пару с посадкой держит страж
      старта session_carrier_validation.go); гейт консоли спрашивает под `own` обе
      половины собственной полосы НЕЗАВИСИМО от того, читается ли ещё чужое
      печенье. Ссылку на снятый тест и число «мест 2 · заведено под own 0» убрать;
      держателя называть по имени символа, а не пересказанным числом. Тем же
      изменением — values.own.yaml:98-110 (радиус ниже).
    radius: >-
      `git grep -nE 'TestOwnLane_F3_12|не заводится ВОВСЕ|выбирает ПОСАДКА|заведено под own'
      0e0a85f936e` по 6691 отслеживаемому файлу → 2 файла: gateway/deploy/login_console_test.go
      (:49, :51) и deploy/helm/umbrella/values.own.yaml (:99, :100, :103, :106). Второй
      файл не Go и в мой предмет не входит — он указан в находках по дороге.

important:
  - id: I1
    class: снятие комментариев объявлено защитой счёта скобок, но снимает только ЦЕЛЫЕ строки
    where: deploy/identity_flow_path_is_served_test.go:162 (nginxCommentLineRe), :206 (flowSegmentsFrom)
    finding: >-
      Хвостовой комментарий со скобкой после кода на той же строке снова даёт
      ложное зелёное, ради которого пункт 2 шапки и заведён. Проверено вызовом
      flowSegmentsFrom в отсоединённой копии: у близнеца `set $x "y";` результат
      map[consent], у входа `set $x "y"; # было: if ($slow) {` — map[consent login].
      Необслуживаемый сегмент прочитан как обслуживаемый. В живой раздаче
      (ui-future/deploy/templates/configmap-nginx.yaml) хвостового комментария со
      скобкой нет (`grep -nE '[;{}]\s*#'` → 0), поэтому дыра латентна.
    requirement: >-
      Снимать `#…` до конца строки, когда `#` стоит вне кавычек (так комментарий
      понимает nginx), и добавить в TestFlowBandIsADeclarationNotAMentionOfOne
      случай с хвостовым комментарием и его законного близнеца. Рендерный гейт
      console-serves-identity-flows-test.sh, по шапке, несёт тот же признак полосы —
      радиус указан в находках по дороге.
  - id: I2
    class: два места об одном предмете, одно ложно
    where: gateway/deploy/f1c_issuer_set_reaches_every_stand_test.go:9-14
    finding: >-
      Шапка пишет, что сосед «ПЕЧАТАЕТ величину «остаются на прежнем скалярном пине N»».
      Эту печать сняла та же волна: f1b_token_acceptance_declared_test.go:174-183
      печатает «не объявляют сами N — … судит F1c», и комментарий там прямо говорит
      «ЗДЕСЬ СТОЯЛО».
    requirement: 'Шапку F1c переписать под нынешнюю печать соседа либо говорить о ней в прошедшем времени.'
  - id: I3
    class: перепись печатает объявленное, а не посчитанное
    where: gateway/deploy/f1c_issuer_set_reaches_every_stand_test.go:445
    finding: '`t.Logf(… "(дефектных %d)", donor, len(cases), 3)` — число дефектных половин записано литералом 3; добавленный случай оставит печать прежней.'
    requirement: 'Считать случаи с `expect == false` в цикле и печатать счётчик.'
  - id: I4
    class: неверная координата в комментарии
    where: services/registry/internal/clients/jwks/verifier_test.go:169
    finding: '«legacyClaims из f1_harness_test.go» — функция объявлена в f1_issuer_binding_test.go:22; в f1_harness_test.go:208 лежит platformClaims, на которой она построена.'
    requirement: 'Назвать верный файл или оставить только имя символа.'
  - id: I5
    class: комментарий утверждает источник числа, которого код не использует; ссылка номером строки
    where: services/registry/internal/clients/jwks/verifier_test.go:625-628
    finding: >-
      «Число взято … у нашего объявления: tokenpolicy.MinRSAModulusBits, см.
      verifier.go:719», а на :628 стоит литерал `rsa.GenerateKey(rand.Reader, 2048)`.
      verifier.go:719 сегодня совпадает, но координата номером строки устареет от
      первой правки выше неё.
    requirement: 'Генерировать ключ длиной tokenpolicy.MinRSAModulusBits либо снять утверждение; ссылаться на символ, а не на строку.'

