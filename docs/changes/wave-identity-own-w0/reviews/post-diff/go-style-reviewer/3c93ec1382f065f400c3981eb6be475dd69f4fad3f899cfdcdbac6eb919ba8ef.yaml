      текст делает волна: она же вписала `kratosPublicUrl: disabled` в цепочку own
      (values.own.yaml:77; на базе ключа нет), и на этом стенде наша сессия
      читается (main.go:245, :1217). Не блокирует: направление ошибки безопасное
      (текст обещает выключение, которого нет), а предмет — вне дельты и вне Go.
    requirement: 'задача: переписать тем же смыслом, что deployment.yaml:177-179.'
  - id: A2
    where: gateway/deploy/session_carrier_knobs_test.go:85-86 (Go, строка вне дельты, соседняя с правленой)
    finding: >-
      Текст отказа пробы не тронут и противоречит комментарию дельты тремя
      строками выше (:81-83): «пустое значение доедет переменной, и «не задано»
      станет неотличимо от «задано пустым»». Опыт показывает, что процесс этих
      состояний не различает ни при какой форме эмиссии, а в профиле они и так
      одно (values.yaml:317 `sessionCarriers: ""`). Коммит fe777cbebf8 заявляет,
      что поправил и шапку, и пробу: комментарий исправлен, сообщение нет. Не
      блокирует: сообщение выводится только на красном и защиту не описывает.
    requirement: 'задача: текст отказа назвать следствием формы — без `with` переменная с пустым значением появляется в поде на каждом стенде.'

