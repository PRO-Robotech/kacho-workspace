# Точное множество требуемых держателей изменения wave-identity-own-w0 —
# волна 0 линии release:identity-own в продукте (запрос PRO-Robotech/kacho#2787,
# ветка wave/identity-own-w0-kacho, семь полос, сведённых в одну голову).
#
# Форма ключей — решение автора, образец — `docs/changes/issue-2713/holders.yaml`;
# отличия от него названы в конце.
#
# МНОЖЕСТВО ТОЧНОЕ: держатель, не названный здесь, вердикта по изменению не даёт,
# а названный и не отдавший исхода даёт «не выполнилось» — не «наверное прошло».
#
# ЗДЕСЬ НЕ ОБЪЯВЛЕН НИ ОДИН ИСХОД. Файл называет, ЧЕМ изменение держится, и где
# лежат (или должны лечь) записи. Поля записей, приведённые ниже, — цитаты из
# самих записей с номером строки, а не исход держателя. Запись схождения
# выпускает `convergence-reviewer`; автор этого файла её не выпускает.
#
# Редакция 3 (2026-09-22): голова 945b851ed52 → b579b9eec9c, отпечаток
# c5ae0889…fa77 → 33211786…8c8c. Все числа ниже сняты заново автором этого
# файла своей командой на новой голове; прежние значения не переносились.
# Команды над диффом исполняются в рабочей копии продукта (`project/kacho`,
# над ревизиями; дерево чистое: `git status --porcelain | wc -l` → 0);
# команды над пакетом — в копии `tmp/wave0-change-package` на ветке, несущей
# этот файл. Каждое число о дереве снято двумя предикатами — по написанию пути
# и по содержимому.
#
# Сменилось против редакции 2 не только числами: освобождения заявляются ТОЛЬКО
# по предикатам реестра СТВОЛА воркспейса (origin/main 42549d58). Двух
# предикатов из прежней редакции там нет, и две роли переведены из
# `not-applicable` в `unresolved` (ниже).
schema_version: 1
change_id: wave-identity-own-w0

# ── ПРИМЕНИМОСТЬ РОЛЕЙ: все ДЕСЯТЬ из review_authority ──────────────────────
#
# Перечень выведен из `review_authority` в `docs/changes/policy.yaml` СТВОЛА и
# сверяется В ОБЕ СТОРОНЫ. Предикат сверки:
#   python3 -c "import yaml,subprocess;\
#   d=yaml.safe_load(subprocess.check_output(['git','show','origin/main:docs/changes/policy.yaml']));\
#   h=yaml.safe_load(open('docs/changes/wave-identity-own-w0/holders.yaml'));\
#   print(len(d['review_authority']),sorted(set(d['review_authority'])^set(h['role_applicability'])))"
#   # → 10 []
role_applicability:

  # ── освобождены: предмета РОЛИ в изменении нет ────────────────────────────
  #
  # РЕЕСТР — СТВОЛА, А НЕ БАЗЫ ПАКЕТА. Освобождение законно только по id из
  # `applicability_predicates` реестра и с удовлетворяющим его свидетельством
