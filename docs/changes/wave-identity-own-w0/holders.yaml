# ── чем этот файл отличается от образца `issue-2713/holders.yaml` ─────────────
#
#   1. У каждого освобождения есть `evidence_repo`. Команды над диффом идут в
#      продукте, над пакетом — в воркспейсе. Без этого поля та же строка
#      команды давала бы 0 в чужом дереве и тем покупала освобождение.
#   2. У отборов по диффу есть ПОЛОЖИТЕЛЬНЫЙ контроль на коммите, заведомо
#      несущем предмет, и второй предикат по содержимому.
#   3. `record_on_current_digest` — отображение с веткой, коммитом, `status` и
#      `authority`, а не голое имя файла. Значения `status`: present ·
#      absent-role-not-invoked; `authority`: confirmed · unconfirmed.
#   4. `lane_records` — записи полос на под-отпечатках, с координатой, где они
#      лежат.
#   5. Машинный держатель один — сводный вердикт конвейера.
#   6. `prior_records` называют прежние круги координатами, чтобы их вердикт не
#      читался ни снятым, ни перенесённым на новый отпечаток.
#   7. Освобождения заявлены только по id реестра СТВОЛА (`predicate_in_trunk`).
#      Роль без предмета и без зарегистрированного id получает `unresolved`.
#   8. `records_outside_review_authority` — записи ролей, которых нет в
#      `review_authority`.
