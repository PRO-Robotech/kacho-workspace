# ── чем этот файл отличается от образца `issue-2713/holders.yaml` ─────────────
#
#   1. У каждого освобождения поле `evidence_repo`: команды над диффом идут в
#      продукте, над пакетом — в воркспейсе; без поля одна и та же строка
#      команды давала бы 0 в чужом дереве и покупала освобождение.
#   2. У двух отборов по диффу (миграции, proto) — ПОЛОЖИТЕЛЬНЫЙ контроль того
#      же отбора на коммите, заведомо несущем предмет, и второй предикат по
#      содержимому: ноль отбора, не способного ничего найти, освобождения не
#      даёт.
#   3. `record_on_current_digest` — отображение с координатами копии, ветки,
#      коммита, `status` и `authority`, а не имя файла: имя без состояния
#      читалось бы как лежащая запись. Значения `status`: present ·
#      absent-role-not-invoked; `authority`: confirmed · unconfirmed.
#   4. `lane_records` — записи полос на под-отпечатках, с веткой и коммитом,
#      где они лежат: ни ствол воркспейса, ни база этого пакета (5058bf2d) их
#      не несут.
#   5. Машинный держатель один — сводный вердикт конвейера; держателей без
#      проверенного производителя не заведено.
#   6. `prior_record` / `prior_records`: прежние круги названы координатами,
#      чтобы их вердикт не читался ни снятым, ни перенесённым на новый
#      отпечаток.
#   7. (редакция 3) Освобождения — только по id реестра СТВОЛА (`predicate_in_trunk`);
#      роль без субъекта и без зарегистрированного id получает `status:
#      unresolved` с `resolution_blocked_by` и `candidate_predicate_id`, а не
#      `not-applicable`. Свидетельство над пакетом читает коммит под
#      `pipefail`, а не индекс.
#   8. (редакция 3) `records_outside_review_authority` — записи ролей, которых
#      нет в `review_authority`, на текущем отпечатке; множество держателей
#      они не пополняют.
