  # ветки реестра не менялся: `git diff origin/main 5058bf2d --
  # docs/changes/policy.yaml` только добавляет два новых.
  #
  # СВИДЕТЕЛЬСТВО ПАКЕТА ПРИВЯЗАНО К РЕВИЗИИ И НЕ ТЕРЯЕТ КОД. Команды над пакетом
  # читают коммит (`git ls-tree … HEAD`), а не индекс, и исполняются под
