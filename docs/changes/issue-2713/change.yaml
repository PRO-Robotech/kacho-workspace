# Манифест изменения issue-2713 — координаты, состояние, отпечатки, ссылки.
#
# Манифест НЕ несёт нормативной прозы: требование, внесённое сюда абзацем, —
# нарушение (CG_HUMAN_MANIFEST_PROSE). Всё, что объясняет применимость ролей и
# чем изменение держится, живёт в `holders.yaml`; наблюдаемое поведение описали
# бы `acceptance.md` и `design.md`, которых это изменение не несёт — и их
# отсутствие ЗАЯВЛЕНО ниже предикатами, а не изображено пустыми полями.
#
# Форму ключей не задаёт ни приёмка SDD-1, ни испытуемый контура — она выбрана
# автором по образцу `docs/changes/standalone-iam/change.yaml`.
schema_version: 1
change_id: issue-2713
lifecycle_state: IMPLEMENTING

# ПОЧЕМУ IMPLEMENTING, А НЕ CONVERGED. Реализация написана, обе применимые
# пост-дифф роли высказались по текущему отпечатку, но конечной записи контура
# нет: её выпускает `convergence-reviewer`, и он высказывается после автора
# этого файла. Состояния ACCEPTANCE_APPROVED · CLASS_EXPOSURE_RECORDED ·
# DESIGN_APPROVED пройдены не вердиктами, а ОСВОБОЖДЕНИЯМИ по
# зарегистрированным предикатам (`holders.yaml`, role_applicability): у ролей,
# держащих эти переходы, в данном изменении нет предмета.

# --- Координаты ------------------------------------------------------------
#
# Поля route и epoch ОТСУТСТВУЮТ намеренно: route принадлежит реестру наследия и
# свойством изменения не является, а эпоха ВЫВОДИТСЯ из ancestry базы и вторым
# источником быть не может.
coordinates:
  issue: https://github.com/PRO-Robotech/kacho/issues/2713
  issue_kind: bug            # метки #2713: bug · P1 · size:M · area:iam · release:identity-own
  repositories:
    - repo: PRO-Robotech/kacho-workspace
      role: package-home
      base_sha: 6e5b9a60c9f592a9d26ea5a320193b75a03f0278
      cutover_is_ancestor_of_base: true    # git merge-base --is-ancestor 1202e3cf… HEAD → 0
    - repo: PRO-Robotech/kacho
      role: subject-tree
      branch: release/edge-call-deadline
      base_sha: ac33f733962577688958fe9fbba35d715822c8b9
      head_sha: 53b3930461d775838c1f042537e05589bbce8680
      commits_in_line: 6                   # git rev-list --count ac33f733..53b3930
      cutover_is_ancestor_of_base: true    # git merge-base --is-ancestor c2d57365… ac33f733 → 0
      trunk_sha_at_measurement: bec320cf47d668173bf27f60ebaf6cbe413a4903
      base_is_ancestor_of_trunk: true      # git merge-base --is-ancestor ac33f733 bec320cf47d → 0

# --- Отпечатки -------------------------------------------------------------
#
# Ими же ключуются записи ревью: вердикт относится к СОДЕРЖИМОМУ, а не к имени
# файла. Все числа ниже перемерены автором этого файла своей командой в рабочем
# дереве линии; рабочее дерево при замере чистое (`git status --short` пусто).
hashes:
  # Дайджест полного диффа линии. Совпал в ОБЕИХ формах — двухточечной и
  # трёхточечной, — что и ожидается: база является общим предком головы
  # (`git merge-base ac33f733 53b3930` → ac33f733).
  content_digest_sha256: ea0fd6d3482f4d04347f8153ce84264c6f3ce4fb5529376b316e8bf9773df42f
  content_digest_predicate: >-
    git diff ac33f733962577688958fe9fbba35d715822c8b9...53b3930461d775838c1f042537e05589bbce8680 | sha256sum

  # Канонический набор диффа — единица «repo · path · mode · blob», по одной
  # строке на путь, поля разделены табуляцией, строки отсортированы LC_ALL=C.
  # Он, а не дайджест текста диффа, доказывает сохранность работы при посадке:
  # текст диффа зависит от базы и от формы схлопывания, набор — нет.
  canonical_diff_set_sha256: 7c298e3b00f9aa6cfb2f84e684c6895d77737c1859bcd7dcf1129f27526a2246
  canonical_diff_set_predicate: >-
    git diff --raw --no-abbrev <base>...<head>
    | awk -F'\t' '{split($1,a," "); print "PRO-Robotech/kacho\t" $2 "\t" a[2] "\t" a[4]}'
    | LC_ALL=C sort | sha256sum
  canonical_diff_set_survives_collapse: true
  canonical_diff_set_collapse_check: >-
    перемерено на СУХОМ слиянии с ТЕКУЩИМ стволом, а не на паре база-голова:
    `git merge-tree --write-tree bec320cf47d 53b3930` → дерево
    d36c728822a52a1ee0ca9c8272dd0566916071e6; тот же предикат над
    `git diff --raw --no-abbrev bec320cf47d d36c7288` даёт тот же набор
    ПОСТРОЧНО и тот же sha256. Значит набор не зависит ни от базы, ни от формы
    схлопывания.

  holders_sha256: 7c527fd87fa79cf1959d1392554ebfeb471e2f82536b711586ba785641329c05

  # Документов замысла изменение не несёт. Отсутствие ЗАЯВЛЕНО предикатом — той
  # же формой, какой реестр наследия заявляет отсутствие приёмки: пустая строка
  # в поле отпечатка была бы изображением отсутствия, а не его заявлением.
  acceptance_sha256: null
  acceptance_absence_predicate: no-acceptance-document-in-change
  design_sha256: null
  design_absence_predicate: no-design-document-in-change
  exposure_subject_absence_predicate: no-exposure-subject-document-in-change

