# Точное множество требуемых держателей изменения issue-2713 («предел края на
# КАЖДОМ внешнем вызове»).
#
# Форма ключей — решение автора. Её не задаёт ни приёмка SDD-1 (называет предметы
# и состав фактов, но не ключи), ни испытуемый контура (называет координаты мира
# КЕЙСА — свой словарь, а не схему файла пакета). Образец —
# `docs/changes/standalone-iam/holders.yaml`; отличия от него названы в конце.
#
# ПОЧЕМУ ЭТОТ ФАЙЛ ПОЯВИЛСЯ ПОЗЖЕ ДИФФА И ПОЗЖЕ РЕВЮ. До 2026-09-22 реестр
# освобождений `docs/changes/policy.yaml` нёс ТРИ предиката на ДЕСЯТЬ ролей, и
# двух ДОСОБЫТИЙНЫХ среди них не было: для изменения без документов замысла роли
# `class-exposure-analyst` и `design-reviewer` нельзя было ни удовлетворить
# (предмета нет), ни освободить (идентификатора нет) — множество держателей было
# недостижимо ПО ПОСТРОЕНИЮ, и завести его честно было невозможно. Механизм
# починен той же правкой, что завела этот файл; освобождения ниже опираются на
# заведённые идентификаторы, а не на умолчание.
#
# МНОЖЕСТВО ТОЧНОЕ: держатель, не названный здесь, вердикта по изменению не даёт,
# а названный и не отдавший исхода даёт «не выполнилось» — не «наверное прошло».
# Третий исход из вердикта не вычитается.
#
# ЗДЕСЬ НЕ ОБЪЯВЛЕН НИ ОДИН ИСХОД. Файл называет, ЧЕМ изменение держится, и не
# выносит вердикта ни по одному держателю: снятые исходы живут в свидетельствах,
# запись схождения выпускает `convergence-reviewer`, приёмку самих работ-проверок
# делает `check-verifier`. Автор этого файла ни того, ни другого не выпускает.
schema_version: 1
change_id: issue-2713

# ── ПРИМЕНИМОСТЬ РОЛЕЙ: все ДЕСЯТЬ из review_authority ──────────────────────
#
# Перечень выведен из `review_authority` в `docs/changes/policy.yaml`, а не
# переписан по памяти, и сверяется В ОБЕ СТОРОНЫ: роль реестра без строки здесь
# и строка здесь без роли реестра — обе находки. Предикат сверки:
#   python3 -c "import yaml;d=yaml.safe_load(open('docs/changes/policy.yaml'));\
#   h=yaml.safe_load(open('docs/changes/issue-2713/holders.yaml'));\
#   print(sorted(set(d['review_authority'])^set(h['role_applicability'])))"  # → []
#
# Роль — КООРДИНАТА, а не доказательство личности: вердикт даёт внешнее событие,
# подтверждённое через API. Освобождение от вердикта полномочия не заменяет.
role_applicability:

  # ── освобождены: предмета РОЛИ в изменении нет ────────────────────────────
  # У каждого освобождения — идентификатор из versioned applicability registry
  # и число, произведённое командой. Свободный текст «неприменимо» здесь не
  # считается ничем.

  acceptance-reviewer:
    status: not-applicable
    predicate_id: no-acceptance-document-in-change
    evidence_field: acceptance_documents_referenced
    evidence_value: 0
    evidence_command: git ls-files docs/changes/issue-2713/acceptance.md | wc -l
    census: >-
      корень пакета `docs/changes/issue-2713/` СУЩЕСТВУЕТ и несёт 6
      отслеживаемых записей ревью — значит ноль есть ноль НАХОДОК, а не
      непрочитанное дерево. Второй обход: `grep -rl 2713 docs/specs/` пуст —
      приёмки на это изменение нет и вне каталога пакета.
    why: >-
      Предмет — задача класса «дефект» (#2713 несёт метку bug/P1 и форму признак ·
      предмет · предикат снятия в теле, а не Given-When-Then). Приёмки изменение
      не несёт, и отсутствие ЗАЯВЛЕНО предикатом, а не изображено пустой строкой.

  class-exposure-analyst:
    status: not-applicable
    predicate_id: no-exposure-subject-document-in-change
    evidence_field: exposure_subject_documents_referenced
    evidence_value: 0
    evidence_command: >-
      git ls-files docs/changes/issue-2713/acceptance.md
      docs/changes/issue-2713/design.md | wc -l
    census: тот же корень пакета, 6 отслеживаемых записей — обход не пуст.
    why: >-
      У роли ДВА держателя, и оба привязаны к отпечаткам документов: первичный
      разбор — к приёмке, перепроверка — к замыслу. Изменение не несёт НИ
      ОДНОГО из них, поэтому предмета нет ни у одного держателя. Роль
      освобождается потому, что судить нечего, а не потому, что разбор классов
      необязателен.

  design-reviewer:
    status: not-applicable
    predicate_id: no-design-document-in-change
    evidence_field: design_documents_referenced
    evidence_value: 0
    evidence_command: git ls-files docs/changes/issue-2713/design.md | wc -l
    census: тот же корень пакета, 6 отслеживаемых записей — обход не пуст.
    why: >-
      Единственный держатель роли есть внешнее событие на ОТПЕЧАТОК `design.md`.
      Документа нет — нет и отпечатка, к которому вердикт привязался бы.

  db-architect-reviewer:
    status: not-applicable
    predicate_id: no-migrations-in-change
    evidence_field: migrations_touched
    evidence_value: 0
    evidence_command: >-
      git diff --name-only ac33f733962577688958fe9fbba35d715822c8b9...53b3930461d775838c1f042537e05589bbce8680
      -- '*/migrations/*' '*.sql' | wc -l
    census: >-
      знаменатель обхода — 6 путей полного диффа линии, все перечислены в
      `change.yaml` (`implementation_diff_set`). Ноль получен ПРИ непустом
      знаменателе.
    why: >-
      В диффе нет SQL, миграции, CAS и xmin; изменение целиком транспортное.
      Это же независимо зафиксировано записью `system-design-reviewer`
      (`schema_review_intersection.intersects: false`).

  proto-api-reviewer:
    status: not-applicable
    predicate_id: no-proto-in-change
    evidence_field: proto_files_touched
    evidence_value: 0
    evidence_command: >-
      git diff --name-only ac33f733962577688958fe9fbba35d715822c8b9...53b3930461d775838c1f042537e05589bbce8680
      -- '*.proto' | wc -l
    census: тот же знаменатель — 6 путей полного диффа линии.
    why: >-
      Контракт не тронут: маршрутизация и объявления служб диффом не задеты,
      меняются только dial-опции, перехватчики предела и контекст адаптера.

  # ── применимы: предмет есть, вердикт обязателен ───────────────────────────

  go-style-reviewer:
    status: applicable
    holder: human-post-diff-go
    reason: >-
      дифф целиком Go (6 файлов, 2 прод + 4 пробы) — предмет роли налицо.

  system-design-reviewer:
    status: applicable
    holder: human-post-diff-system
    reason: >-
      поверхность распределённая (межсервисные рёбра, воркер, жизненный цикл
      горутины перехватчика), поэтому роль обязана высказаться ПОВТОРНО на
      ТОЧНЫЙ отпечаток содержимого, а не только на замысел.

  integration-tester:
    status: applicable
    holder: [prod-edge-deadline-probes, prod-ci-local-go, prod-unit-race]
    reason: >-
      роль — владелец проб и первого прогона; здесь она НЕ даёт отдельной
      человеческой записи, а держит три машинных держателя ниже (та же форма,
      что в `standalone-iam`).

  convergence-reviewer:
    status: applicable
    holder: human-convergence
    reason: >-
      единственная роль, выпускающая конечную запись контура. Автор этого файла
      её не выпускает и вердикта по ней не имеет.

  landing-reviewer:
    status: applicable
    holder: human-landing
    reason: >-
      применённое содержимое обязано быть сверено с одобренным ПОСЛЕ посадки;
      до посадки исход держателя — «не выполнилось».

required_holders:

  # ── машинные ──────────────────────────────────────────────────────────────
  # У каждого назван ПРОИЗВОДИТЕЛЬ, и каждый производитель проверен на
  # существование, а не объявлен: держатель без производителя давал бы «не
  # выполнилось» НАВСЕГДА и вернул бы ту же недостижимость по построению, ради
  # снятия которой этот пакет и заводится.

  prod-edge-deadline-probes:
    kind: machine
    owner: integration-tester
    executable: >-
      go test ./internal/clients/ ./internal/restmux/
      -run 'SessionRevocationsAdapter|RestBridge' -count=1   # рабочий каталог gateway/
    predicate: >-
      каждый из пяти глаголов адаптера сессии и оба перехватчика REST-моста
      доносят до соседа СВОЙ предел; медленный сосед даёт отказ по пределу и не
      зависает; законный близнец в пределе проходит; горутина стрим-перехватчика
      завершается и на конце потока, и на ошибке его создания
    evidence_coordinate: evidence/prod-edge-deadline-probes/
    producer_exists: >-
      проверено, а не объявлено: `go test … -list 'SessionRevocationsAdapter|RestBridge'`
      печатает 11 имён проб — ровно столько, сколько называют обе записи ревью.
      Пустой отбор дал бы «ok» на нуле исполненного, и это читалось бы зелёным.
    note: >-
      Исход здесь НЕ объявлен намеренно. Прогон этой пробы автором пакета
      означал бы, что автор работы-проверки сам её и принимает; вердикт выносят
      `landing-reviewer` и `check-verifier`.

  prod-ci-local-go:
    kind: machine
    owner: integration-tester
    executable: scripts/ci-local.sh go
    predicate: >-
      дерево собирается (`go build`), `go vet` чист, короткие пробы проходят
      (`go test -short`), и инъекции оснастки группы способны упасть
    evidence_coordinate: evidence/prod-ci-local-go/
    producer_exists: >-
      `scripts/ci-local.sh` присутствует в дереве линии и исполняем; ветвь `go`
      разбирается (`go) go_group ;;`), внутри — 25 шагов, среди них `go build`,
      `go vet`, `go test -short`.
    note: >-
      Прогонщик различает третий исход отдельно: прогон, оборванный исчерпанием
      ресурса, недействителен и не читается ни как красный, ни как зелёный
      (`scripts/ci-local.sh --exhaustion-signatures`).

  prod-unit-race:
    kind: machine
    owner: integration-tester
    executable: >-
      CI-контекст «сводный вердикт (все проверки завершились и зелены)»
      (.github/workflows/required-verdict.yml), внутри — шарды
      `go test ./... -race -short -count=1`
    predicate: >-
      гонок под детектором нет ни в одном шарде, и сводный вердикт читает
      завершение ВСЕХ проверок, а не подмножество
    evidence_coordinate: evidence/prod-unit-race/
    producer_exists: >-
      задание в дереве линии есть (`unit-plan`/`unit-shard`/`unit-verdict` в
      `.github/workflows/ci.yaml`, сводный контекст — в `required-verdict.yml`).
    note: >-
      На машине автора этот держатель дать исход НЕ МОЖЕТ, и это измерено, а не
      предположено: `go env CGO_ENABLED` → 0, `command -v gcc` → пусто, то есть
      `-race` здесь не собирается. Локально исход держателя — «не выполнилось»;
      это ТРЕТИЙ исход, он не вычитается из вердикта и не читается как красный.
      Производитель при этом существует и достижим — держатель отличается от
      снятого `ws-adapter-gate` пакета `standalone-iam` именно этим.
      Изменение вводит горутину в стрим-перехватчике, поэтому держатель к
      предмету относится прямо, а не «за компанию с lc7».

  # ── человеческие ──────────────────────────────────────────────────────────
  # Вердикт выпускает внешнее событие, подтверждённое через API; самообъявленная
  # роль полномочия не даёт. Освобождение (выше) снимает обязанность ИМЕТЬ
  # вердикт и полномочия не касается.

  human-post-diff-go:
    kind: human-external
    owner: go-style-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: >-
      раскладка слоёв цела, транспорт не протёк в use-case, мёртвого кода и
      маркеров отсрочки не заведено, пробы лежат в том же изменении
    evidence_coordinate: reviews/post-diff/go-style-reviewer/
    record_on_current_digest: >-
      ea0fd6d3482f4d04347f8153ce84264c6f3ce4fb5529376b316e8bf9773df42f.yaml
    note: >-
      Записи 41148c31… и e248514c… стоят на ПОД-отпечатках частей линии и этот
      дифф не судят: вердикт привязан к отпечатку, а не к имени файла.

  human-post-diff-system:
    kind: human-external
    owner: system-design-reviewer
    executable: внешнее review event на ТОЧНЫЙ отпечаток содержимого изменения
    predicate: >-
      распределённые свойства целы: предел стоит на КАЖДОМ внешнем вызове обеих
      граней, отказ соседа фейлится закрыто, воркер не зависает, предел входящего
      запроса не РАСШИРЯЕТСЯ, нового межсервисного ребра не заведено
    evidence_coordinate: reviews/post-diff/system-design-reviewer/
    record_on_current_digest: >-
      ea0fd6d3482f4d04347f8153ce84264c6f3ce4fb5529376b316e8bf9773df42f.yaml
    distributed_surface: true
    note: >-
      Обязательность ПОВТОРНОЙ записи этой роли на текущий отпечаток возникает из
      СВОЙСТВА изменения, а не из чьей-то отметки «применимо».

  human-convergence:
    kind: human-external
    owner: convergence-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: >-
      множество применимых ролей сверено с `review_authority` в ОБЕ стороны,
      каждое освобождение опирается на зарегистрированный предикат с
      удовлетворяющим его свидетельством, записи ревью лежат по ТЕКУЩЕМУ
      отпечатку, отпечатки базы и головы названы по каждому репозиторию
    evidence_coordinate: evidence/human-convergence/
    note: >-
      Исхода НЕТ, и это не пропуск: производитель записи — другая роль, и она
      высказывается ПОСЛЕ автора этого файла. До её вердикта исход держателя —
      «не выполнилось».

  human-landing:
    kind: human-external
    owner: landing-reviewer
    executable: внешнее review event на ПОСАЖЕННОЕ содержимое
    predicate: >-
      применённое содержимое совпадает с одобренным; сохранность работы доказана
      СОДЕРЖИМЫМ (канонический набор диффа), а не тождеством коммита
    evidence_coordinate: evidence/human-landing/
    note: >-
      Канонический набор `repo · path · mode · blob` тем и выбран, что переживает
      схлопывание линии: у посаженного содержимого он обязан совпасть с
      объявленным в `change.yaml`, каким бы ни был SHA посадки.

# ── чем этот файл отличается от образца `standalone-iam/holders.yaml` ────────
#
# ВЗЯТО: форма записи держателя (kind · owner · executable · predicate ·
# evidence_coordinate · note), разделение на машинных и человеческих, роль как
# координата, точность множества, запрет записи без предмета, владение
# машинными держателями у `integration-tester`.
#
# ОТОШЛО, и по каждому — почему:
#   1. Заведён раздел `role_applicability` на ВСЕ десять ролей реестра. У образца
#      применимость объявлена абзацем комментария («применимы ВСЕ роли ниже»),
#      потому что там не освобождена ни одна. Здесь освобождены ПЯТЬ, и
#      абзац сделал бы сверку в обе стороны делом внимания, а не предиката.
#   2. У каждого машинного держателя добавлено поле `producer_exists` с тем, ЧЕМ
#      существование производителя проверено. В образце эту роль играли note у
#      двух держателей без производителя; предмет правки ровно в том, что
#      держатель без производителя делает множество недостижимым.
#   3. Каталога `evidence/` этот пакет пока не несёт: планы свидетельств —
#      запись о НАМЕРЕНИИ, а не наблюдение, и заводить их вместо снятых исходов
#      значило бы выдать одно за другое. Координаты названы; файлы кладёт тот,
#      кто снимет исход.
#   4. Нет `sev-*` держателей «заводятся этим переходом»: этот пакет не вводит
#      ни одного свойства, у которого не было бы производителя.
