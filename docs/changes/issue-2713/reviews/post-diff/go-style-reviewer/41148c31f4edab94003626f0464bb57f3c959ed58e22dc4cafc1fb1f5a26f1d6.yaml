# ── что проверено и на чём основано ────────────────────────────────────────
approved:
  per_call_deadline_every_sibling: >-
    ядро фикса. Все ПЯТЬ глаголов адаптера (ResolveHumanSession, IsBasicCredentialLive,
    Revoke, IsSessionRevoked, SessionCutoffOf) несут собственный
    context.WithTimeout(ctx, a.callTimeout) с defer cancel() сразу после создания.
    Единообразно, из одного поля callTimeout — per architecture.md «все sibling-методы
    клиента обязаны применять один и тот же configured-timeout». Это точный класс
    §Concurrency architecture.md и §Hardening security-hardening.md: без предела
    неотвечающий сосед держал бы горутину края навсегда → накопление → исчерпание.
  radius_complete: >-
    единственное место в gateway, конструирующее клиентов внутреннего слушателя службы
    о сессии (NewInternalSessionRevocationsServiceClient / NewInternalHumanSessionServiceClient),
    — этот адаптер (grep по прод-дереву). Соседи того же слушателя (iam_subject, opsproxy)
    предел уже несли. Радиус механизма «край к службе о сессии без предела» закрыт целиком.
  ctx_propagation: >-
    ctx — первый аргумент всех методов, прокидывается во все gRPC-вызовы; ctx в структуре
    не хранится (хранится только callTimeout time.Duration). context.Background — только во
    входе проб (намеренно бессрочный вход, предел ставит край). context.TODO нет.
  deadline_min_semantics: >-
    WithTimeout берёт минимум с родительским дедлайном — per-call 5s есть верхняя граница,
    более короткий родительский ctx не удлиняется. Fail-closed сохранён: DeadlineExceeded
    течёт по существующим ветвям возврата ошибки как «спросить не удалось», не подменяя
    типизированные признаки (Unimplemented) и не читаясь как «отозван»/«живо».
  no_panic_in_prod_path: 'panic/MustParse/log.Fatal в диффе нет; defer cancel() паники не несёт'
  thin_adapter: >-
    слой clients/ тонкий: parse → gRPC-вызов → перевод кода. Дифф оставляет его тонким,
    добавляя только предел; бизнес-логики, ветвлений по состоянию домена, pgx — нет.
  layering: >-
    файл слоя adapter (internal/clients/), реализует порт handler.SessionRevocationsClient;
    импортирует grpc-stubs + middleware/streamrevocation. pgx/transport не протекли —
    направление зависимостей цело.
  naming_ascii: >-
    новые идентификаторы латиницей (sessionRevocationsCallTimeout, callTimeout) — ban #17
    цел; ресивер короткий (a *SessionRevocationsAdapter); магического числа нет — 5s есть
    именованная const. Комментарии на русском — законны.
  no_dead_code: >-
    добавленное поле callTimeout читается всеми пятью глаголами; const используется
    конструктором; мёртвого кода/веток дифф не вносит.
  cross_module_clean: >-
    go.mod не тронут; corelib (v1.8.0) и kaname (пин) уже зависимости; новых рёбер модулей
    дифф не заводит — rule-polyrepo триггер не срабатывает.
  probes_observable_lock: >-
    регресс-лок на УРОВНЕ ОБСЕРВАБЛА (testing.md §Regression-lock): негатив утверждает
    codes.DeadlineExceeded (наблюдаемое поведение), не только «есть таймаут»; concurrency-
    проба детерминирована — блокирующий дублёр держит вызов до отмены ctx, горутина под
    сторожевым time.After(2s), без time.Sleep на счастливом пути; законный близнец (сосед
    в пределе) проходит — пара по gate-authoring, не одиночное молчание.

