# ── оценка переиспользования (checklist §10) ───────────────────────────────
reuse_assessment: >-
  кандидата в фундамент нет. Применённый образец — идиоматичное per-call
  context.WithTimeout(ctx,…)+defer cancel() на месте вызова, предписанное самим
  architecture.md как inline-инвариант; каждый клиент (iam_subject, opsproxy) держит свой
  callTimeout полем так же. Вынос обёртки над двухстрочной stdlib-идиомой в corelib был бы
  over-engineering (LEAN), а величина 5s — локальное политическое решение на клиента, не
  горизонтальный контракт. Дифф верно следует установленному локальному образцу, а не
  заводит новую абстракцию.

