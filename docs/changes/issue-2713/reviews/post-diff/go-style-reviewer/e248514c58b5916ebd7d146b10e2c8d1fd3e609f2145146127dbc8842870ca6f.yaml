# ── что проверено и на чём основано ────────────────────────────────────────
approved:
  per_call_deadline_every_edge: >-
    ядро фикса. restBridgeDialOpts добавляет к dial-опциям КАЖДОГО backend'а
    моста WithChainUnaryInterceptor + WithChainStreamInterceptor с общим пределом
    restBridgeCallTimeout. Верное решение класса «per-call deadline на КАЖДОМ
    внешнем вызове» (architecture.md §Concurrency, security-hardening.md): у моста
    нет своей call-site (хендлеры генерит grpc-gateway), поэтому предел ставится
    на СОЕДИНЕНИИ перехватчиком — это и объяснено в шапке функции. Покрыты все
    грани: optsFor зовётся для vpc/compute/storage/geo/iam/loadbalancer/registry
    и их Internal-слушателей — все идут через restBridgeDialOpts.
  deadline_min_semantics: >-
    unary-перехватчик: context.WithTimeout(ctx, d) + defer cancel(). Утверждение
    комментария «берёт МИНИМУМ из уже стоящего дедлайна и now+d, никогда не
    РАСШИРЯЕТ более ранний дедлайн входящего» — верно по семантике
    context.WithDeadline (родитель с более ранним дедлайном эквивалентен parent).
    Прямо просилось к суду задания — подтверждено.
  no_context_leak_unary: 'defer cancel() сразу после WithTimeout — течи контекста нет'
  no_context_leak_stream: >-
    стрим-перехватчик: cancel на ошибке создания потока немедленно; на успехе —
    горутина ждёт stream.Context().Done() и зовёт cancel. Контекст потока — дитя
    WithTimeout(d), поэтому по истечении d он сам завершится → горутина всегда
    терминируется в пределах d, течи горутины нет. Канонический образец grpc-go.
    (Корректность by construction; пробой не закреплена — см. important.)
  error_passthrough: >-
    оба перехватчика возвращают ошибку invoker/streamer БЕЗ обёртки fmt.Errorf
    %w — верно для клиентского перехватчика: обёртка сломала бы status.FromError
    downstream. gRPC-статус проходит насквозь, как и положено.
  no_panic_in_prod_path: 'panic/MustParse/log.Fatal в диффе нет; defer cancel() паники не несёт'
  thin_transport: >-
    backend_call_deadline.go — сборка dial-опций и два перехватчика предела;
    бизнес-логики, ветвлений по состоянию домена, pgx, SQL нет. Транспорт остаётся
    тонким. mux.go: optsFor теперь делегирует в restBridgeDialOpts — та же тонкость.
  layering: >-
    файл в gateway/internal/restmux/ (слой REST-моста/транспорта). Импортирует
    только grpc + grpc/credentials/insecure — уместно для сборки dial-опций.
    Направление зависимостей цело: домен/use-case не задеты.
  naming_ascii: >-
    новые идентификаторы латиницей (restBridgeCallTimeout, restBridgeDialOpts,
    backendCallDeadlineUnaryInterceptor, backendCallDeadlineStreamInterceptor,
    backendKey, dialOpts) — ban #17 цел; receiver'ов нет (свободные функции);
    магического числа нет — 5s есть именованная const restBridgeCallTimeout.
    Комментарии на русском — законны.
  seam_no_dead_code: >-
    после выноса optsFor: тело переехало в package-level restBridgeDialOpts,
    optsFor делегирует. Импорт credentials/insecure удалён из mux.go (остались
    ТОЛЬКО текстовые вхождения слова insecure в комментариях строк 331/334/341/342,
    вызовов insecure. нет — импорт верно снят) и добавлен в backend_call_deadline.go
    (там используется insecure.NewCredentials()). restBridgeDialOpts используется
    optsFor (mux.go:418) и пробой (test:73); optsFor используется ~60 раз всеми
    Register…HandlerFromEndpoint. Мёртвого кода/висящего импорта дифф не оставил.
  seam_semantics_preserved: >-
    restBridgeDialOpts возвращает те же транспорт+round-robin service-config, что
    старый optsFor, плюс два перехватчика. Поведение insecure-fallback при
    отсутствии ключа в dialOpts сохранено (dev backward-compat). Шов оправдан:
    закрытие captur'ит dialOpts, функция принимает его аргументом — dial-опции
    моста стали испытуемы пробой над реальным транспортом (bufconn), не через
    полный NewMux.

