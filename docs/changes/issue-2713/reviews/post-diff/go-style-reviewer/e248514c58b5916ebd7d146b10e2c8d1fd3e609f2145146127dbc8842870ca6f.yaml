# ── оценка переиспользования (checklist §10) ───────────────────────────────
reuse_assessment: >-
  кандидата в фундамент нет. Перехватчики предела на СОЕДИНЕНИИ — ответ на
  локальную особенность именно REST-моста: у него нет call-site, тогда как соседи
  (iam_subject, opsproxy) ставят per-call context.WithTimeout в СВОЁМ коде на месте
  вызова. То есть образец здесь другой, чем у соседей, и специфичен для одного
  потребителя (мост). Вынос двухстрочных grpc-идиом (WithTimeout-перехватчик) в
  corelib при единственном потребителе — over-engineering (LEAN). Величина 5s —
  локальное политическое решение на грань, не горизонтальный контракт. Если второй
  край когда-нибудь тоже лишится call-site и потребует connection-level предел —
  тогда это станет кандидатом; сегодня потребитель один → остаётся своим.

