# ── что проверено и на чём основано ────────────────────────────────────────
approved:
  per_call_deadline_every_sibling_session: >-
    адаптер сессии: все ПЯТЬ глаголов (ResolveHumanSession, IsBasicCredentialLive,
    Revoke, IsSessionRevoked, SessionCutoffOf) открываются
    ctx, cancel := context.WithTimeout(ctx, a.callTimeout); defer cancel().
    Единый источник — поле callTimeout, конструктор всегда ставит его в
    sessionRevocationsCallTimeout (5s), ноль означал бы мгновенное истечение —
    от этого поле защищает by construction. «Один и тот же configured-timeout на
    все sibling-глаголы» (architecture.md) выполнен: часть-да-часть-нет нет.
    Дедлайн производится от ПЕРЕДАННОГО ctx (не context.Background) — проброс
    контекста цел.
  per_call_deadline_every_edge_bridge: >-
    REST-мост: restBridgeDialOpts добавляет к dial-опциям КАЖДОГО backend'а
    WithChainUnaryInterceptor + WithChainStreamInterceptor с общим пределом
    restBridgeCallTimeout (5s). Верное решение класса «per-call deadline на
    КАЖДОМ внешнем вызове»: у моста нет своей call-site (хендлеры генерит
    grpc-gateway), поэтому предел ставится на СОЕДИНЕНИИ перехватчиком — объяснено
    в шапке функции. optsFor зовётся для vpc/compute/storage/geo/iam/loadbalancer/
    registry и их Internal-слушателей — все идут через restBridgeDialOpts.
  deadline_min_semantics: >-
    оба перехватчика и адаптер используют context.WithTimeout(ctx, d). Утверждение
    комментария «берёт МИНИМУМ из уже стоящего дедлайна и now+d, никогда не
    РАСШИРЯЕТ более ранний дедлайн входящего» — верно по семантике stdlib
    context.WithDeadline (родитель с более ранним дедлайном семантически
    эквивалентен parent). Прямо просилось к суду задания — подтверждено.
  no_context_leak: >-
    unary-перехватчик и все глаголы адаптера: defer cancel() сразу после
    WithTimeout — течи нет. Стрим-перехватчик: cancel на ошибке создания потока
    немедленно; на успехе — горутина ждёт stream.Context().Done() и зовёт cancel.
    Контекст потока — дитя WithTimeout(d), по истечении d он сам завершится →
    горутина всегда терминируется. Канонический образец grpc-go; на сведённом
    содержимом обе ветки ЗАКРЕПЛЕНЫ пробами (Goroutine/StreamerError).
  error_passthrough: >-
    перехватчики и глаголы адаптера возвращают ошибку invoker/streamer/gRPC-вызова
    БЕЗ обёртки fmt.Errorf %w — верно для клиента: обёртка сломала бы
    status.FromError/status.Code downstream. Ветвление адаптера по кодам
    (Unimplemented в ResolveHumanSession/SessionCutoffOf, codes.NotFound в
    IsBasicCredentialLive) не задето добавлением WithTimeout — обёртка стоит выше
    тела, defer cancel() срабатывает по return, реальный gRPC-статус приходит до
    5s и код различается штатно.
  no_panic_in_prod_path: 'panic/MustParse/log.Fatal в сведённом диффе нет; defer cancel() паники не несёт'
  thin_transport: >-
    backend_call_deadline.go — сборка dial-опций и два перехватчика предела;
    бизнес-логики, ветвлений по состоянию домена, pgx, SQL нет. mux.go: optsFor
    делегирует в restBridgeDialOpts — та же тонкость. Адаптер сессии — слой
    clients (адаптер порта), WithTimeout — уместный инфра-концерн этого слоя, не
    use-case и не handler.
  layering: >-
    правка в gateway/internal/restmux/ (транспорт REST-моста) и
    gateway/internal/clients/ (адаптер). Направление зависимостей цело:
    домен/use-case не задеты, pgx/gRPC-стабы в них не втекают. backend_call_deadline.go
    импортирует только grpc + grpc/credentials/insecure — уместно для dial-опций.
  naming_ascii: >-
    новые идентификаторы латиницей (sessionRevocationsCallTimeout, callTimeout,
    restBridgeCallTimeout, restBridgeDialOpts, backendCallDeadlineUnaryInterceptor,
    backendCallDeadlineStreamInterceptor, backendKey, dialOpts; в пробах
    deadlineWitness, blockingSessionServer, deadlineObs, backendObservingDeadline,
    fakeClientStream) — ban #17 цел, кириллица только в комментариях/литералах
    сообщений (законно). Магического числа нет: 5s — именованные const
    sessionRevocationsCallTimeout и restBridgeCallTimeout; receiver адаптера
    короткий (a *SessionRevocationsAdapter).
  seam_no_dead_code: >-
    вынос optsFor: тело переехало в package-level restBridgeDialOpts, optsFor
    делегирует. Импорт credentials/insecure снят из mux.go (grep даёт ТОЛЬКО
    текстовые вхождения слова insecure в комментариях строк 331/334/341/342,
    вызовов insecure. нет) и добавлен в backend_call_deadline.go (используется
    insecure.NewCredentials()). restBridgeDialOpts используется optsFor и пробами;
    optsFor — всеми Register…HandlerFromEndpoint. Мёртвого кода/висящего импорта
    свод не оставил. В адаптере: import "time" используется (const + поле), поле
    callTimeout читается всеми пятью глаголами и конструктором.
  seam_semantics_preserved: >-
    restBridgeDialOpts возвращает те же транспорт+round-robin service-config, что
    старый optsFor, плюс два перехватчика. insecure-fallback при отсутствии ключа
    в dialOpts сохранён (dev backward-compat). Шов оправдан: закрытие captur'ит
    dialOpts, функция принимает его аргументом — dial-опции моста стали испытуемы
    пробой над реальным транспортом (bufconn), не через полный NewMux, куда
    bufconn-диалер не внести.
  test_seam_honesty: >-
    RED-способность закреплена, а не заявлена: session_deadline_test.go подаёт
    context.Background (без дедлайна) — без фикса сервер увидел бы контекст без
    дедлайна и carried()==false; behaviour-пробы и стрим-fail-fast стоят под
    сторожевым таймером (2s < сон соседа) — без предела вызов завис бы и сторож
    уронил бы пробу. Стрим-ветки Goroutine/StreamerError проверены детерминированно
    через fakeClientStream (без опоры на runtime.NumGoroutine). У каждого негатива
    назван позитивный близнец (одно-фактная дельта: block=true/false, сон>предел/
    сразу) — инъекция в обе стороны. Дублёры отвечают без ошибки намеренно, чтобы
    красное приходило РОВНО от отсутствия предела, а не от сломанной подпорки.
  regression_lock_observable: >-
    фикс класса concurrency/lifecycle (зависание горутины на неотвечающем соседе)
    залочен на уровне ОБСЕРВАБЛА (testing.md §Regression-lock): «медленный сосед →
    DeadlineExceeded и без зависания», «дедлайн виден серверу на проводе», «горутина
    завершается по концу потока», а не только код возврата.

