verified_facts:
  - 'единообразие 5s: sessionRevocationsCallTimeout=5s и restBridgeCallTimeout=5s совпадают с соседями — iam_subject_client.go:106 callTimeout: 5*time.Second (тот же паттерн: поле + WithTimeout на каждый RPC); opsproxy/proxy.go:78 const backendCallTimeout = 5*time.Second; iam_authorize_client.go:236 WithTimeout(ctx, c.timeout). Комментарии const верны.'
  - 'адаптер сессии следует установленному паттерну соседей и УЛУЧШАЕТ его: iam_subject держит 5s инлайн-литералом, здесь величина названа package-const sessionRevocationsCallTimeout (checklist §9 «магических чисел нет»).'
  - 'комментарий стрим-перехватчика «стриминговых Internal-служб мост сегодня не проксирует (они gRPC-direct)» — верно: subscription (corelib) и InternalResourceLifecycleService.Subscribe без google.api.http → grpc-gateway REST не регистрирует (mux.go:84,316,928); подписной стрим живёт в gateway/internal/subscriptionstream/, не в restBridgeDialOpts.'
  - 'семантика WithTimeout=минимум — верна по контракту context.WithDeadline stdlib.'
  - 'go.mod НЕ тронут (git diff --name-only — только 6 файлов в gateway/internal/{clients,restmux}); rule-polyrepo module-edge триггер не срабатывает. Новый импорт corelib/api/corelib/operation в session_deadline_test.go — по разрешённому ребру kacho→corelib, лишь в пробе.'
  - 'импорт credentials/insecure снят из mux.go корректно: grep insecure в mux.go даёт только комментарии (331,334,341,342), ни одного вызова insecure.; добавлен и используется в backend_call_deadline.go.'
  - 'коллизий имён тестовых хелперов нет: ни в restmux (backendObservingDeadline/backendSleeping/dialWith*/streamDesc/fakeClientStream/deadlineObs), ни в clients (dialWitness/dialBlocking/note/carried/deadlineWitness/blockingSessionServer) — grep по прочим *_test.go в обоих пакетах чист.'
  - 'все пять веток адаптера обёрнуты (session_revocations_client.go:91,136,156,177,203 — WithTimeout(ctx, a.callTimeout)); ни одна не осталась без предела.'

# ── оценка переиспользования (checklist §10) ───────────────────────────────
reuse_assessment: >-
  кандидата в фундамент нет. Две грани решают ДВА образца одного класса, и оба
  специфичны потребителю: адаптер сессии ставит per-call WithTimeout в СВОЁМ коде
  на месте вызова (как iam_subject/opsproxy — паттерн уже живёт в платформе);
  REST-мост ставит предел на СОЕДИНЕНИИ перехватчиком именно потому, что у него
  нет call-site (хендлеры генерит grpc-gateway) — образец уникален для моста.
  Вынос двухстрочных grpc-идиом (WithTimeout-перехватчик) в corelib при
  единственном потребителе — over-engineering (LEAN). Величина 5s — локальное
  политическое решение на грань, не горизонтальный контракт. Второй край лишится
  call-site — тогда станет кандидатом; сегодня потребитель один → остаётся своим.

