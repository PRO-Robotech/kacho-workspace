# ── находки ────────────────────────────────────────────────────────────────
critical: []                 # блокирующих находок распределённого свойства нет
important:
  - id: SDR-2713R-O1
    axis: наблюдение (не находка)
    coord: gateway/internal/restmux/backend_call_deadline.go:44-45
    finding: >-
      Перехватчик стоит на СОЕДИНЕНИИ (dial-опция ClientConn), не на call-site.
      Это не «предел на всё соединение разом»: WithChainUnaryInterceptor даёт
      замыкание, которое исполняется на КАЖДЫЙ invoke и ставит свежий
      context.WithTimeout(ctx, 5s) для этого вызова. Семантика — per-call, как
      требует architecture.md §Concurrency; координата постановки (соединение)
      вынуждена тем, что call-site'ы генерит grpc-gateway. Корректно.
    blocking: false
  - id: SDR-2713R-O2
    axis: наблюдение (не находка)
    coord: gateway/internal/restmux/backend_call_deadline.go:75-95
    finding: >-
      Стрим-перехватчик: на ошибке создания потока — немедленный cancel (нет
      утечки контекста); на успехе — горутина ждёт <-stream.Context().Done() и
      зовёт cancel (идемпотентно). stream.Context() производен от ctx с пределом,
      поэтому жизнь горутины ограничена 5s даже у брошенного потока — всегда
      завершается, cancel всегда вызывается. Стриминговых служб мост сегодня не
      проксирует (subscription/InternalResourceLifecycle — gRPC-direct, не через
      HandlerFromEndpoint), поэтому это единообразное покрытие грани, а не горячий
      путь. Утечки горутины/контекста нет.
    blocking: false

foundation_candidates: []    # величина 5s осознанно дублируется per-client/per-edge
                             # константой (restBridge/iam_subject/opsproxy) — не предмет corelib

# ── оси, которые судит эта роль ────────────────────────────────────────────
axes:
  per_call_deadline_on_every_external_call:
    status: closed
    evidence: >-
      Все 59 Register*HandlerFromEndpoint передают optsFor(<key>) → optsFor
      делегирует в restBridgeDialOpts (mux.go:417-419) → та добавляет
      WithChainUnaryInterceptor(backendCallDeadlineUnaryInterceptor(5s)) и
      WithChainStreamInterceptor(...) (backend_call_deadline.go:44-45). Перемер:
      `grep -c HandlerFromEndpoint mux.go` = 59; из них НИ ОДНА не собирает
      dial-опции в обход optsFor (единственная строка без optsFor — комментарий
      :95). Инвариант architecture.md «все sibling-вызовы применяют один и тот же
      configured-timeout, не часть — да, часть — нет» выполнен by construction:
      источник dial-опций один.
  min_semantics_no_deadline_extension:
    status: closed
    evidence: >-
      context.WithTimeout(ctx, d) == WithDeadline(ctx, now+d); по документированной
      семантике stdlib, если у родителя дедлайн уже раньше — возвращается
      эффективный МИНИМУМ, предел не расширяется. Значит входящий запрос с более
      тесным дедлайном сохраняет его; мост лишь ВНОСИТ потолок, когда дедлайна нет
      или он свободнее. Комментарий-обоснование (backend_call_deadline.go:50-52)
      правдив. Отмена входящего запроса тоже пробрасывается (ctx производен).
  fail_fast_under_neighbor_overload:
    status: closed
    evidence: >-
      TestRestBridgeDeadline_SlowNeighborFailsFast: сосед со сном 2s, предел 100ms
      → status.Code == DeadlineExceeded, возврат около предела (сторож elapsed >
      1s роняет «завис»). Прогнано своей командой (`go test ./internal/restmux/
      -run TestRestBridge -count=1 -v`): PASS, SlowNeighbor 0.10s — предмет ЖИВ,
      не только объявлен. Это ровно лекарство класса architecture.md §Concurrency
      «неотвечающий peer вешает горутину навсегда → исчерпание процесса».
  deadline_does_not_sever_correct_long_path:
    status: closed
    evidence: >-
      Через мост идут только control-plane RPC: мутации возвращают Operation сразу
      (ban #9, async), чтения ограничены statement_timeout БД. Легитимного
      синхронного backend-вызова >5s через мост нет. Единственный долгоживущий
      путь — подписка (server-stream) — идёт gRPC-direct, НЕ через мост (перемер:
      ни одна Subscribe/ResourceLifecycle не регистрируется через
      HandlerFromEndpoint). 5s совпадает с соседями внутр. слушателя (перемерено:
      iam_subject_client.go:106 = 5s, opsproxy/proxy.go:78 = 5s). Замечание
      (не находка): List page_size=1000 + listauthz batch — бюджет СТОРОНЫ backend'а
      (security.md: параллелить проверки в срок), а не грани моста; потолок моста
      единообразен с выбранным платформой per-call бюджетом.
  public_vs_internal_edge_separation:
    status: closed
    evidence: >-
      Дифф меняет ТОЛЬКО dial-опции, не маршрутизацию. Дедлайн ставится
      единообразно и на external-mux (optsFor("iam"), "vpc", …), и на internal-mux
      (optsFor("iamInternal"), "vpcInternal", "storageInternal", …) — обеим граням
      потолок нужен. Ban #6 не задет: разделение Internal* от external держит
      резолвер HasInternalSuffix (server.go/shimproxy.go), диффом не тронутый.
      Корректность регистрации моста — предмет api-gateway-registrar; этот дифф её
      не изменяет.
  no_new_cross_domain_edge:
    status: closed
    evidence: >-
      Рёбра gateway → каждый backend уже существуют (§Runtime cross-domain edges);
      дифф лишь навешивает per-call потолок на существующие рёбра. Нового
      runtime-ребра нет; запись в polyrepo.md не требуется.
  no_double_write_idempotency:
    status: closed
    evidence: >-
      Мост — чистый форвардер: ни записи в БД, ни CAS, ни outbox, ни pg_notify не
      вводит. DeadlineExceeded на чтении безопасен для повтора; мутации возвращают
      Operation. Класса двойной записи и «проверка-затем-запись» в диффе нет.

# ── пробы под перегрузкой: уже есть и способны краснеть ─────────────────────
overload_probe:
  ordered_integration_tester: false
  reason: >-
    Проба медленного соседа + сторож уже в диффе, красна-способна и прогнана
    зелёной. Конкурентно-горутинная CAS-проба НЕПРИМЕНИМА: в диффе нет CAS,
    разделяемого мутируемого состояния и спорного пути «ровно одна транзакция
    выигрывает» — предмет распределённого свойства здесь тайминг под перегрузкой,
    а не гонка за строку. Заказ integration-tester не нужен.
  present_probes:
    - name: TestRestBridgeBackendCallCarriesDeadline
      file: gateway/internal/restmux/backend_call_deadline_test.go
      kind: чёрный ящик над restBridgeDialOpts поверх настоящего gRPC (bufconn)
      asserts: >-
        подан context.Background() (БЕЗ дедлайна); сервер-свидетель
        (UnknownServiceHandler — как дозванивается мост) фиксирует наличие дедлайна
        и остаток в окне (0, restBridgeCallTimeout]. RED до фикса: нет перехватчика
        → has=false. Фикстура отвечает без ошибки → красное приходит РОВНО от
        отсутствия предела, не от сломанной подпорки.
    - name: TestRestBridgeDeadline_SlowNeighborFailsFast
      file: gateway/internal/restmux/backend_call_deadline_test.go
      kind: медленный сосед (сон 2s) + сторож (elapsed > 1s роняет «завис»)
      asserts: negatiв — DeadlineExceeded около предела, без зависания.
    - name: TestRestBridgeDeadline_NeighborWithinLimitPasses
      file: gateway/internal/restmux/backend_call_deadline_test.go
      kind: законный близнец — сосед в пределе
      asserts: проходит без отказа.
  own_run:
    command: >-
      go test ./internal/restmux/ -run TestRestBridge -count=1 -v (в gateway/)
    outcome: >-
      зелёных 3 из 3 · красных 0 · не выполнилось 0. SlowNeighbor 0.10s. Прогон
      этой ролью — свидетельство живости предмета; область зелёного и независимый
      перемер полного прогона — landing-reviewer/check-verifier.

