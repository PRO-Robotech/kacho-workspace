# ── оси, которые судит эта роль ────────────────────────────────────────────
axes:
  per_call_deadline_on_every_external_call:
    status: closed
    evidence: >-
      (A) Адаптер сессии: все пять sibling-глаголов
      (ResolveHumanSession/IsBasicCredentialLive/Revoke/IsSessionRevoked/
      SessionCutoffOf) получают в диффе ctx, cancel := context.WithTimeout(ctx,
      a.callTimeout); defer cancel(). callTimeout выставляется конструктором в
      sessionRevocationsCallTimeout=5s (ноль означал бы мгновенное истечение —
      комментарий это фиксирует). (B) REST-мост: все 59
      Register*HandlerFromEndpoint передают optsFor(<key>) → restBridgeDialOpts,
      которая добавляет оба перехватчика (5s). Перемер: `grep -c
      HandlerFromEndpoint mux.go`=59; ни одна dial-опция не собирается в обход
      optsFor (строки 327/347 — объявление карты и параметр, не dial).
      Инвариант architecture.md «все sibling-вызовы применяют один и тот же
      configured-timeout, не часть — да, часть — нет» выполнен by construction:
      источник дедлайна один у каждой грани. Sibling-величины перемерены:
      iam_subject_client.go:106=5s, opsproxy/proxy.go:78=5s.
  fail_closed_under_neighbor_overload:
    status: closed
    evidence: >-
      Все session/authz-пути под перегрузкой соседа (DeadlineExceeded) фейлятся
      закрыто: (1) воркер sweeper.ask — любой err (кроме двух Unsupported-sentinel
      раската) → verdictUnanswered → unanswered++ → lastGood НЕ обновляется →
      после StaleAfter failClosed() закрывает ВСЕ потоки; (2) revocation_local:
      err → возврат ошибки «источник отзыва не ответил» (не revoked=false) →
      introspection отказывает; (3) auth_session_cutoff: err →
      sessionCutoffUnanswered (комментарий прямо: мягкий проход = «отзываем и свой
      отзыв не исполняем»); (4) auth_own_session: err → writeHTTPUnauthorized;
      (5) /me: err → {"user":null} — безопасное направление (не выдаёт личность).
      Диспозиция pre-existing, диффом не тронута; введение DeadlineExceeded вместо
      зависания её не ослабляет, а активирует (раньше сосед вешал горутину — ни
      открыто, ни закрыто, а исчерпание процесса).
  no_hang_in_worker:
    status: closed
    evidence: >-
      sweeper.Run(ctx) блокирует до отмены СВОЕГО контекста (процессный, не
      request-scoped — не наследует дедлайн/отмену запроса; наблюдаемость через
      логгер cfg сохранена). Каждый ask ходит к соседу через адаптер, теперь
      ограниченный 5s: WithTimeout(worker-ctx, 5s) = now+5s (worker-ctx
      долгоживущий). До фикса неотвечающий сосед подвесил бы Sweep на всю итерацию
      — теперь возврат по пределу. Проба
      TestSessionRevocationsAdapter_SlowPeerIsBoundedByDeadline (сосед блокирует
      до отмены, callTimeout=100ms, сторож 2s) зелёная — предмет ЖИВ.
  min_semantics_no_deadline_extension:
    status: closed
    evidence: >-
      context.WithTimeout(ctx, d) == WithDeadline(ctx, now+d); по документированной
      семантике stdlib возвращается эффективный МИНИМУМ, если у родителя дедлайн
      уже раньше — предел не расширяется. Значит входящий запрос с более тесным
      дедлайном сохраняет его; край лишь ВНОСИТ потолок, когда дедлайна нет либо
      он свободнее. Отмена входящего тоже пробрасывается (ctx производен).
      Корректный длинный путь НЕ рвётся: через мост идут только control-plane RPC
      (мутации → Operation сразу, ban #9; чтения ≤ statement_timeout), а
      единственный долгоживущий путь — подписка (server-stream) — идёт
      gRPC-direct, НЕ через мост. Перемер: subscription Subscribe без
      google.api.http → не регистрируется HandlerFromEndpoint; subscription_stream.go
      не использует restBridgeDialOpts. Стрим-перехватчик моста — единообразное
      покрытие грани (стриминговых Internal-служб мост сегодня не проксирует), а
      не механизм, режущий живой длинный стрим.
  public_vs_internal_edge_separation:
    status: closed
    evidence: >-
      Дифф меняет ТОЛЬКО dial-опции (клиентская сторона) и адаптерный контекст —
      не маршрутизацию. Ни одна Internal*-служба не выносится на external mux; ни
      один новый route не регистрируется. Дедлайн ставится единообразно на обе
      грани REST-моста: external (optsFor("iam"),"vpc",…) и internal
      (optsFor("iamInternal"),"vpcInternal","storageInternal",…) — обеим потолок
      нужен. Ban #6 не задет: разделитель Internal* диффом не тронут. Адаптер
      сессии дозванивается до kaname:9091 (внутренний слушатель) — ребро
      pre-existing.
  idempotency_of_retry_on_deadline_exceeded:
    status: closed
    evidence: >-
      Автоматического повтора дифф не вводит: у адаптера и перехватчиков retry
      нет, gRPC built-in retry выключен, DeadlineExceeded ≠ Unavailable (retry.
      OnUnavailable, где он есть на других рёбрах, его не ловит). Единственная
      мутация на этих рёбрах — Revoke: идемпотентна по природе (отзыв уже
      отозванного — no-op над множеством), а logout собирает её ошибку не фатально
      (revocErrs, пользователь всё равно видит успешный logout) — цикла повтора
      нет. Чтения (Resolve/IsRevoked/SessionCutoffOf/IsBasicCredentialLive)
      идемпотентны by nature. Двойной записи класс отсутствует.
  no_new_cross_domain_edge:
    status: closed
    evidence: >-
      Ребро gateway → kaname:9091 (адаптер сессии) существует на базе:
      `git show ac33f733:gateway/internal/clients/session_revocations_client.go`
      резолвится (файл МОДИФИЦИРОВАН, не добавлен). Рёбра gateway → каждый backend
      REST-моста уже в §Runtime cross-domain edges. Дифф лишь навешивает per-call
      потолок на существующие рёбра. Нового runtime-ребра нет; запись в
      polyrepo.md не требуется. Заказа tooling-maintainer нет.
  no_double_write:
    status: closed
    evidence: >-
      Изменение целиком транспортное (dial-опции + перехватчики + адаптерный
      WithTimeout). Ни записи в БД, ни CAS, ни outbox, ни pg_notify не вводит.
      Класса «двойная запись» и «проверка-затем-запись» (ban #10) в диффе нет.

# ── проба под перегрузкой: конкурентно-горутинная НЕ применима ──────────────
overload_probe:
  ordered_integration_tester: false
  concurrent_goroutine_probe_applicable: false
  reason: >-
    Классическая конкурентно-горутинная CAS-проба («ровно одна транзакция
    выигрывает спорную строку») НЕПРИМЕНИМА: в сведённом диффе НЕТ мутации, CAS,
    xmin, advisory-lock, разделяемого мутируемого состояния и спорного пути за
    строку. Предмет распределённого свойства здесь — тайминг под перегрузкой
    соседа и жизненный цикл горутины стрим-перехватчика, а не гонка за запись.
    Присутствующая конкуренция (per-stream горутина cancel; вызовы под сторожевым
    таймером в горутинах; общая карта свидетеля под mutex) уже покрыта пробами
    диффа. Заказ integration-tester не нужен.
  present_probes:
    - name: TestSessionRevocationsAdapter_EveryCallCarriesItsOwnDeadline
      file: gateway/internal/clients/session_deadline_test.go
      kind: чёрный ящик над настоящим адаптером поверх gRPC (bufconn), свидетель-дублёр
      asserts: >-
        подан context.Background() (БЕЗ дедлайна); все ПЯТЬ глаголов доносят до
        сервера контекст С дедлайном. Фикстура цела (отвечает без ошибки) →
        красное приходит РОВНО от отсутствия предела.
    - name: TestSessionRevocationsAdapter_SlowPeerIsBoundedByDeadline
      file: gateway/internal/clients/session_deadline_behaviour_test.go
      kind: медленный сосед (держит до отмены) + сторож 2s, callTimeout=100ms
      asserts: negativ — DeadlineExceeded, вызов не зависает; обе полосы (Resolve, SessionCutoffOf).
    - name: TestSessionRevocationsAdapter_PeerWithinDeadlinePasses
      file: gateway/internal/clients/session_deadline_behaviour_test.go
      kind: законный близнец — сосед в пределе
      asserts: проходит без отказа.
    - name: TestRestBridgeBackendCallCarriesDeadline / …StreamBackendCallCarriesDeadline
      file: gateway/internal/restmux/backend_call_deadline_test.go
      kind: чёрный ящик над restBridgeDialOpts (прод-обвязка) поверх gRPC (bufconn)
      asserts: >-
        подан context.Background(); сервер-свидетель фиксирует дедлайн в окне
        (0, restBridgeCallTimeout]. Стрим-близнец ловит МОНТАЖ
        WithChainStreamInterceptor на реальном соединении (без него грань была
        замаскирована отсутствием) — это и есть дельта, добавленная сведением.
    - name: TestRestBridgeDeadline_SlowNeighborFailsFast / …StreamDeadline_SlowNeighborFailsFast
      file: gateway/internal/restmux/backend_call_deadline_test.go
      kind: медленный сосед (2s/5s) + сторож; стрим-негатив показан ИНЪЕКЦИЕЙ no-op
      asserts: DeadlineExceeded около предела, без зависания (unary и stream).
    - name: TestRestBridgeStreamDeadline_GoroutineExitsOnStreamEnd / …CancelsOnStreamerError
      file: gateway/internal/restmux/backend_call_deadline_test.go
      kind: управляемый fakeClientStream — ветки успеха и ошибки создания
      asserts: горутина завершается по концу потока; cancel немедленный на ошибке — течи нет.
  own_run:
    command: >-
      go test ./internal/restmux/ ./internal/clients/ -run 'RestBridge|SessionRevocationsAdapter'
      -count=1 -v (в gateway/)
    outcome: >-
      зелёных 11 из 11 · красных 0 · не выполнилось 0. -race не исполнилось (в
      среде нет cgo/gcc — «не выполнилось», НЕ красное; гонки не перемерены этой
      ролью). Прогон этой ролью — свидетельство живости предмета
      (measurement-discipline §Живость); область зелёного и независимый перемер
      полного прогона (в т.ч. -race) — landing-reviewer/check-verifier.

