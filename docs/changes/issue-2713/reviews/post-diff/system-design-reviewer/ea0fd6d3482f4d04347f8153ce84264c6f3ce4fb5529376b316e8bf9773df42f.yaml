critical: []                 # блокирующих находок распределённого свойства нет
important:
  - id: SDR-2713F-O1
    axis: наблюдение (не находка)
    coord: gateway/internal/restmux/backend_call_deadline.go:44-45
    finding: >-
      Перехватчики стоят на СОЕДИНЕНИИ (dial-опция ClientConn), не на call-site.
      Это не «предел на всё соединение разом»: WithChainUnaryInterceptor даёт
      замыкание, исполняемое на КАЖДЫЙ invoke и ставящее свежий
      context.WithTimeout(ctx, 5s) для этого вызова. Семантика — per-call, как
      требует architecture.md §Concurrency; координата постановки (соединение)
      вынуждена тем, что call-site'ы генерит grpc-gateway (у моста нет своей
      точки для per-call WithTimeout, как у соседей iam_subject/opsproxy).
      Корректно.
    blocking: false
  - id: SDR-2713F-O2
    axis: наблюдение (не находка)
    coord: gateway/internal/restmux/backend_call_deadline.go:75-95
    finding: >-
      Стрим-перехватчик: на ошибке создания потока — немедленный cancel (нет
      утечки контекста); на успехе — горутина ждёт <-stream.Context().Done() и
      зовёт cancel (идемпотентно, defer в успешной ветке отсутствует осознанно —
      иначе поток убился бы по возврату). stream.Context() производен от ctx с
      пределом, поэтому жизнь горутины ограничена 5s даже у брошенного потока —
      всегда завершается, cancel всегда вызывается. Течи горутины/контекста нет
      (прямые пробы _GoroutineExitsOnStreamEnd и _CancelsOnStreamerError).
    blocking: false
  - id: SDR-2713F-O3
    axis: наблюдение (не находка)
    coord: gateway/internal/handler/logout_handler.go:181
    finding: >-
      logout_handler уже оборачивает Revoke собственным
      context.WithTimeout(r.Context(), 5s); адаптер оборачивает ЕЩЁ раз своим 5s.
      Двойная обёртка безвредна by construction (min-семантика WithTimeout:
      эффективный дедлайн = min(5s,5s)≈5s). Обёртка адаптера при этом несущая:
      она — единственный потолок для воркера sweeper, который своей обёртки не
      делает. «Часть — да, часть — нет» не возникает: адаптер закрывает ВСЕ пять
      глаголов единообразно у ВСЕХ вызывающих.
    blocking: false

