# ── оси, которые судит эта роль ────────────────────────────────────────────
axes:
  per_call_deadline_on_every_external_call:
    status: closed
    evidence: >-
      Все ПЯТЬ глаголов адаптера, делающих gRPC-вызов, оборачивают ctx в
      context.WithTimeout(ctx, a.callTimeout): ResolveHumanSession (:91),
      IsBasicCredentialLive (:136), Revoke (:156), IsSessionRevoked (:177),
      SessionCutoffOf (:203). Это полный набор внешних вызовов адаптера (поля
      client/iam/human, других вызывающих методов нет). Инвариант architecture.md
      «все sibling-методы применяют один и тот же configured-timeout (не часть —
      да, часть — нет)» выполнен.
  no_hang_in_worker:
    status: closed
    evidence: >-
      sweeper.go: Run(ctx)→Sweep(ctx)→ask(ctx) — ctx это lifecycle-контекст
      воркера (НЕ request-ctx), запрос отменён давно. До фикса неотвечающий сосед
      (GC/перегрузка/полуоткрытый TCP) вешал горутину бессрочно — ровно класс
      architecture.md §Concurrency «горутины копятся → исчерпание процесса».
      Дифф и есть это лекарство: WithTimeout(min c родительским дедлайном)
      ограничивает вызов 5s и снимается на остановке воркера.
  fail_closed_under_neighbor_overload:
    status: closed
    evidence: >-
      DeadlineExceeded от перегруженного соседа доезжает до СУЩЕСТВУЮЩИХ deny-веток
      каждого потребителя, а не до мягкого прохода: sweeper.ask err!=nil →
      verdictUnanswered → Sweep → s.failClosed(); revocation_local.Introspect
      err!=nil → возвращает ошибку «источник отзыва не ответил», НЕ «активен»;
      auth_session_cutoff err!=nil → sessionCutoffUnanswered → auth_own_session →
      writeHTTPUnauthorized; ResolveHumanSession err!=nil → writeHTTPUnauthorized.
      Единственный проход-под-ошибкой — намеренно решённая полоса входа
      relayOnUnavailable (F4d-23 / Ф12 Р4), диффом не тронута. Диспозиция
      потребителей ПРЕДСУЩАЯ; дифф лишь делает ошибочный путь надёжно достижимым
      вместо зависания.
  idempotency_retry_on_deadline_exceeded:
    status: closed
    evidence: >-
      Четыре из пяти глаголов — чтения (Resolve/IsRevoked/SessionCutoffOf/
      CheckBasicCredentialLive), идемпотентны, повтор безопасен. Revoke —
      идемпотентный повторный отзыв (терминальное состояние), а вызывающий
      logout_handler собирает ошибку как НЕфатальное предупреждение (revocErrs),
      автоповтора-шторма нет. Двойной записи в этом сервисе нет — запись владеет
      сосед, адаптер лишь форвардит один вызов.
  deadline_does_not_sever_correct_long_path:
    status: closed
    evidence: >-
      Все глаголы — точечные чтения / async-мутация с возвратом Operation (ban #9);
      легитимной длительности >5s ни у одного нет. 5s совпадает с соседними
      клиентами внутреннего слушателя — перемерено: iam_subject_client.go
      callTimeout=5*time.Second; opsproxy/proxy.go backendCallTimeout=5*time.Second.
      Комментарий-обоснование константы (стр. 25-33) правдив.
  public_vs_internal_edge_separation:
    status: closed
    evidence: >-
      Адаптер — КЛИЕНТ к внутреннему слушателю kaname:9091 через Internal*-стабы
      (InternalSessionRevocationsService / InternalIAMService /
      InternalHumanSessionService). Серверной поверхности не заводит, mux/routing
      не трогает (restmux вне scope по заданию — предмет api-gateway-registrar).
      Ban #6 не задет.
  no_new_cross_domain_edge:
    status: closed
    evidence: >-
      Изменён существующий клиент существующего ребра kacho-api-gateway → kaname
      (iam, session/revocation). Нового runtime-ребра нет; запись в polyrepo.md
      не требуется.
  zero_value_construction_guard:
    status: closed
    evidence: >-
      callTimeout выставляется только в NewSessionRevocationsAdapter (:72);
      единственный struct-литерал — внутри самого конструктора (:68). Все 8
      прод-точек сборки идут через конструктор (subscription_stream.go:273,
      main.go x7). Нулевого callTimeout (мгновенное истечение) в проде нет.
      Белоящичная проба переопределяет поле осознанно, в пакете clients.

# ── пробы под перегрузкой: уже есть и способны краснеть ─────────────────────
overload_probe:
  ordered_integration_tester: false
  reason: >-
    Проба медленного соседа уже в диффе и красна-способна — заказ integration-tester
    не нужен. Конкурентно-горутинная CAS-проба неприменима: в диффе нет CAS,
    разделяемого состояния и спорного пути «ровно одна транзакция выигрывает».
  present_probes:
    - name: TestSessionRevocationsAdapter_EveryCallCarriesItsOwnDeadline
      file: gateway/internal/clients/session_deadline_test.go
      kind: чёрный ящик над настоящим адаптером поверх настоящего gRPC (bufconn)
      asserts: >-
        подан бессрочный ctx; сервер-свидетель для всех ПЯТИ глаголов фиксирует
        наличие дедлайна в контексте; фикстура отвечает без ошибки, значит красное
        приходит РОВНО от отсутствия предела, а не от сломанной подпорки.
    - name: TestSessionRevocationsAdapter_SlowPeerIsBoundedByDeadline
      file: gateway/internal/clients/session_deadline_behaviour_test.go
      kind: медленный сосед (блокирует до отмены ctx) + сторожевой таймер
      asserts: >-
        негатив — медленный сосед даёт DeadlineExceeded и не подвешивает (сторож
        2s роняет пробу «завис»); законный близнец — сосед в пределе проходит.
  optional_not_blocking: >-
    Сквозная fail-closed-проба через middleware под медленным соседом была бы
    приятным дополнением, но не блокирует: диспозиция потребителей неизменна и
    читается как fail-closed, а достижимость ошибочного пути доказана на границе
    адаптера.

# ── пересечение с ревью схемы ──────────────────────────────────────────────
schema_review_intersection:
