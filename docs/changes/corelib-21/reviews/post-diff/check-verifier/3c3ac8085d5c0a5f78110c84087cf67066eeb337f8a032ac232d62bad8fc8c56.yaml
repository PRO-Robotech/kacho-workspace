findings:
  - id: F1
    blocks_landing: true
    claim: 'проверка «go test -short» зеленеет на пустом обходе проб'
    measured: >-
      см. experiments.empty_walk: ни одной исполненной пробы (проб нет вовсе либо
      все пропущены под -short) — c_test отдаёт 0, проверка идёт в «исполнено»,
      хук 0, отправка уходит. Отличие от зелёного с пробами — только в печатном
      числе. Та же работа для gofmt делает пустой обход красным (c_gofmt: «ноль
      неотформатированных было бы ноль прочитанного»), а шапка хука обосновывает
      прогонщик тем, что «ok» голого go test не отличает прошедшие пробы от
      отсутствующих; по коду исхода прогонщик их тоже не отличает.
    rule: 'testing.md ban17-gates / census-separate-from-findings / positive-control-needs-nonempty; критерий задания «отсутствие проверок не даёт зелёного»'
    predicate_of_fix: >-
      тот же опыт: модуль без проб и модуль, где все пробы пропущены под -short, —
      хук НЕ 0 (красное либо третья категория, в «исполнено» не входит), ссылка
      не доезжает; близнец с одной исполненной пробой — 0. Пара — в inject.sh.
  - id: F2
    blocks_landing: true
    claim: 'проба хука (inject.sh) не различает охват и аргументы проверок: подставной линтер принимает любые аргументы, фикстура — один корневой пакет'
    measured: >-
      см. probe_of_probe.silent_6_of_20: снятый --config, линтер по ./gitenv/...,
      общий на машину кэш линтера, vet и build только корневого пакета, gofmt по
      одному файлу — inject.sh 64 из 64. Настоящий хук сейчас этих дефектов не
      несёт: опыты real_tree_one_fact_defects с дефектом во вложенном пакете
      красные. Но шаг ci.yml заявляет, что хук «судится здесь, а не вниманием»,
      а состав «тот же, что в ci.yml» и перенос кэша линтера в каталог git
      (исправление из 75af8e1) держатся вниманием. Подставной линтер глотает
      вход, на котором настоящий отказывает (неверный путь конфига).
    rule: 'testing.md double-must-honor-real-contract, fake-structurally-unable-to-be-green; test-title-wider-than-body (заголовок шага шире тела пробы); ban12-tdd для кэша линтера'
    predicate_of_fix: >-
      те же шесть инъекций (P16, P20, P21, P22, P24, P25) — каждая даёт в
      inject.sh ≥1 «разошлось», называющее свой предмет; близнец T0 — 64 из 64
      (или новое число) без расхождений. Например, подставной линтер пишет свой
      argv и GOLANGCI_LINT_CACHE, проба сверяет их с пином; дефекты
      build/vet/gofmt кладутся во вложенный пакет фикстуры.

