# ── судимые предметы ───────────────────────────────────────────────────────
judged:
  constraint:
    finding: none
    notes: >-
      Закрытый словарь выражен CHECK базы, а не проверкой в коде (ban10). Имя
      ограничения сохранено, а это координата отката 20260917160000:130. Накат
      только расширяет множество, операторов данных в нём 0 (Р4). Снятие и
      заведение идут одной транзакцией goose: маркера `-- +goose NO TRANSACTION`
      нет. Упоминание «NO TRANSACTION» на :27 стоит внутри комментария, это не
      аннотация. ALTER вместо inline CHECK вынужден: применённую миграцию не
      правят. Перечень домена и ограничение сверяются в обе стороны пробой
      KN-SER-07 (N = 4, M = 4).
  rollback_with_lock:
    finding: none
    notes: >-
      :77 LOCK ACCESS EXCLUSIVE стоит первым, :79 переводит без правки ended_at,
      :81-85 возвращают словарь из трёх. Захватывается одна таблица, поэтому
      цикла с порядком «личность → строки сессии» нет: UPDATE неключевой колонки
      RI-проверку не запускает, триггеров на таблице нет. Необходимость захвата
      Я ИЗМЕРИЛ на postgres:16-alpine (одноразовый контейнер kn334-dbarch-pg,
      после замера снят; таблица сокращена до id/ended_at/ended_reason
      с тем же ограничением).
      Сцена 1, без захвата: писатель зафиксировал admin-force-logout между
      переводом и переустановкой. Откат упал целиком: `check constraint
      "human_sessions_ended_reason_check" … is violated by some row`, словарь
      остался из четырёх. Сцена 2, с захватом: писатель ждал 2,07 с, затем
      получил 23514 `new row … violates check constraint`. Строка осталась
      живой, откат прошёл, словарь из трёх. Оба утверждения комментария :67-71
      подтверждены.
  error_mapping:
    finding: none-blocking
    notes: >-
      Отказ снятия на пути принудительного выхода ведёт к частичному исходу
      (warrantsPartialOutcome → true). Вызывающему уходит фиксированный
      UNAVAILABLE `could not end the login session` (force_logout.go:857), текст
      драйвера наружу не выходит. В журнал идёт текст sentinel после перевода.
      Detail строки не читается (pgmaperr.go:158-161). Свободная причина запроса
      до колонки не доходит (Р2, KN-SER-02).
  migration_probes:
    finding: none
    notes: >-
      KN-SER-06 проверяет приём нового слова и отказ `sneeze`. KN-SER-08
      проверяет, что накат не переписывает лежащие строки и версия новая.
      KN-SER-09 проверяет откат до предшествующей версии: A → logout с прежним
      ended_at, B не тронута, C жива, отказ после отката, приём после повторного
      наката. KN-SER-07 — паритет домена и базы; инъекции паритета тоже есть.
      Испытуемого проба ищет по содержимому, а не по номеру.

