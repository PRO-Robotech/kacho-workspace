findings:
  - id: SEC-E2-1
    severity: medium
    kind: correctness/security — счёт окна ограничителя
    verdict: CONFIRMED
    where:
      - gateway/internal/middleware/anonmail/gate.go:104
      - gateway/internal/middleware/anonmail/store.go:119-148
      - gateway/internal/middleware/anonmail/store_pg.go:120
      - gateway/internal/middleware/anonmail/store_memory.go:251
    sign: >-
      Момент решения берётся до сериализации по ключу, а окно счёта закрыто сверху этим моментом.
      Пропуски, записанные соседними решениями того же ключа с более поздним моментом, в счёт
      не входят. Неделимость «решение и счёт — одна операция» (З8, CX2-11) держится только
      при совпадающих моментах; проба гонки нового ключа гоняется на управляемых часах с одним
      моментом на всех и этого не видит. Между репликами флота то же расхождение даёт разность часов.
    measured: >-
      Временная проба на хранилище memory (файл снят, дерево чистое): три пропуска с моментами
      позже, затем решение с более ранним моментом — Pass вместо Challenge. Пачка одновременных
      решений одного источника на настоящих часах — число пропусков выше порога FREE.
    direction: >-
      Счёт ключа не должен зависеть от того, в каком порядке моменты решений пришли к
      сериализации: момент решения выводится после взятия блокировок ключей либо окно не
      ограничивается сверху моментом решения. Проба — на различающихся моментах, с близнецом.

  - id: SEC-E2-2
    severity: medium
    kind: availability — общая точка сериализации флота
    verdict: PLAUSIBLE
    where:
      - gateway/internal/middleware/anonmail/store.go:137
      - gateway/internal/middleware/anonmail/store_pg.go:114
    sign: >-
      Строка ведра общего потока берётся FOR UPDATE каждым решением, в том числе тем, чей исход
      от ведра не зависит (жёсткий отказ, вызов по ступени, предъявленное доказательство), и
      держится до конца транзакции, включая чтения для Retry-After. Пропускная способность звена
      флота — одна строка; нагрузочный прогон полосы печатает её порядок. Других ограничителей
      темпа на крае нет. Поток сверх неё кончается 503 у всех анонимных глаголов почты.
    direction: >-
      Вопрос к замыслу и исполнителю: брать ведро только когда исход от него зависит и/или
      отсекать уже отвергнутые ключи до хранилища; назвать допустимую цену отказа в
      обслуживании решением, если оставить как есть.

