critical: []

important:
  - id: GS-1
    kind: correctness-fragility
    where: cmd/kaname/wiring.go:398, cmd/kaname/serve.go:537
    finding: >-
      serve.go проверяет объявленность invite.ttl через config.Declared и ВЫБРАСЫВАЕТ значение, а wiring.go
      разыменовывает *cfg.Invite.TTL в другой функции. Защита держится на порядке вызовов в одном месте; второй
      вызывающий buildServices получит панику на старте вместо отказа с именем ключа.
    requirement: >-
      передать в buildServices значение, полученное из config.Declared (как сделано в loginlane.go:533-541),
      а не разыменовывать указатель повторно.
  - id: GS-2
    kind: doc-truthfulness
    where: internal/apps/kaname/config/mail_bounds.go:41-46
    finding: >-
      комментарий о непокрытой границе recipient-per-day-all ≤ 50 называет владельцем «полосу шаблонов (F4)»;
      по tasks.md вариант NTF2-71 (щ) стоит в строке S5 и гейтится Е8 (в) (экспорт лимита шаблона). Метка плана
      воркспейса в публичном дереве продукта без координаты задачи стареет вместе с планом.
    requirement: >-
      назвать задачу трекера (kaname#…), а не метку полосы, и верного владельца (S5 / Е8 (в)); либо снять абзац
      вместе с приходом границы.
  - id: GS-3
    kind: latent-false-refusal
    where: internal/apps/kaname/config/strict_env.go:165-193; strict_env_injection_test.go:292-299
    finding: >-
      обход ключей декодера считает поле-отображение листом («map»), а суждение о файле отвергнет его подключи
      (`map.a` не известен и не является секцией известного ключа) — хотя mapstructure их принимает. Проба обхода
      утверждает «знает все формы поля», включая map, но суждения о файле на этой форме не прогоняет. В Config
      сегодня полей-отображений нет (перемерено), поэтому дефект скрыт.
    requirement: >-
      либо принимать подключи поля-отображения (префикс листа вида map), либо запретить поле-отображение в Config
      пробой; в обоих случаях — кейс unknownFileKeys на форме map.
  - id: GS-4
    kind: accepted-and-ignored-scope
    where: internal/apps/kaname/config/mail_bounds.go:139-204; deploy/own_lane_knobs_declared_test.go:113-117
    finding: >-
      32 из 35 строк таблицы обязательны к объявлению, но на 36d923bc4 поведения не задают (потребители — в
      полосах S*/G1 той же волны/эпика). Проба «ручка без читателя» теперь считает строку таблицы читателем и этого
      класса не увидит ни сейчас, ни после эпика.
    requirement: >-
      не блокирует эту полосу (F3 по плану — конфигурация и страж); landing-reviewer сверяет, что запрос эпика в
      main не уходит раньше потребителей. Предмета задачи не заводит.

