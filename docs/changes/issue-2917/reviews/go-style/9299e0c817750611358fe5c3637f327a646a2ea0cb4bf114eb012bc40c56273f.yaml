findings:
  critical:
    GS-E2-1:
      kind: "проглоченная ошибка: неправильная настройка неотличима от сбоя"
      where:
        - gateway/internal/middleware/anonmail/store.go:110   # begin
        - gateway/internal/middleware/anonmail/store.go:119   # lock
        - gateway/internal/middleware/anonmail/store.go:126   # markSpent
        - gateway/internal/middleware/anonmail/store.go:138   # bucket
        - gateway/internal/middleware/anonmail/store.go:143   # counts источника
        - gateway/internal/middleware/anonmail/store.go:149   # counts подсети
        - gateway/internal/middleware/anonmail/store.go:160   # retryAfter
        - gateway/internal/middleware/anonmail/store.go:175   # recordPass
        - gateway/internal/middleware/anonmail/store.go:92    # поле store.log ни разу не читается
      defect: >-
        store.Decide на всех восьми путях отбрасывает err и возвращает unavailable(). Ошибку не оборачивают,
        не журналируют и не классифицируют. Поле store.log передаётся в newStore (store_pg.go:176) и нигде не
        читается. Счётчик kacho_api_gateway_anon_mail_store_unavailable_total покажет 503, но не причину.
        Отсутствующая таблица (42P01), отказ прав (42501) и ошибка строки пределов выглядят так же, как
        таймаут блокировки. Это класс hard-misconfig-is-not-outage: неправильная настройка должна звучать
        громко, а здесь она проходит молча. Отчёт автора это подтверждает: прогон до миграции дал
        «24 из 24 ответов 503, таблиц нет», и в журнале по этому поводу не было ни одной строки.
      requirement: >-
        Обернуть ошибку каждого шага именем шага (fmt.Errorf("anonmail: <шаг>: %w", err)), в Decide записать
        её через s.log.*Context(ctx, …, "step", …, "err", err). Ошибку настройки (SQLSTATE класса 42, 28, 3D,
        3F) писать на уровне Error, сбой (таймаут, 55P03, 57014, соединение) — на уровне Warn. В журнал не
        писать ключи запроса: в них лежит клиентский адрес (hard-no-pii-in-logs). Нужна проба на захваченном
        журнале: при фиктивном backend с ошибкой 42P01 строка уровня ERROR называет шаг, а NotContains
        подтверждает, что адреса источника в журнале нет. Близнец пробы — таймаут блокировки, он даёт WARN.
    GS-E2-2:
      kind: "context.Background() вместо переданного ctx в рабочем коде"
      where:
        - gateway/internal/middleware/anonmail/store_pg.go:428
        - gateway/internal/middleware/anonmail/store.go:75    # интерфейс decisionTx.rollback() без ctx
      defect: >-
        pgTx.rollback строит срок от context.Background(). Метод вызывают из Decide (store.go:116) и из
        beginDecision (store_pg.go:309), и в обоих местах ctx запроса доступен. Соседний commit того же типа
        делает правильно: берёт context.WithoutCancel(ctx) (store.go:181). Откат теряет значения контекста
        (трассировку, корреляцию), и форма отличается от фиксации без причины. Запрет агента: «НЕ одобрять
        context.Background() вместо переданного ctx».
      requirement: >-
        Сигнатура rollback(ctx context.Context) у decisionTx, pgTx и memTx. Внутри pgTx брать
        context.WithTimeout(context.WithoutCancel(ctx), anonMailStoreWait), как у commit.
  important:
    GS-E2-3:
      kind: "return err без обёртки"
      where: gateway/internal/middleware/anonmail/store_pg.go:300,305,310,325,337,346,360,368,374,378,387,392,399
      requirement: "Обёртка «anonmail: <оператор>: %w». Закрывается вместе с GS-E2-1."
    GS-E2-4:
      kind: "slog без Context при доступном ctx"
      where:
        - gateway/internal/middleware/anonmail/gate.go:100    # r.Context()
        - gateway/internal/middleware/anonmail/gate.go:119
        - gateway/internal/middleware/anonmail/store_pg.go:523   # ctx resolveCommit
        - gateway/internal/idempotencypg/anon_mail.go:107,109,112   # s.baseCtx / ctx
      requirement: "WarnContext/ErrorContext/InfoContext с переданным ctx."
    GS-E2-5:
      kind: "поле провязки, которое проверяется, но не судит"
      where:
        - gateway/internal/middleware/anonmail/gate.go:43
        - gateway/internal/middleware/anonmail/gate.go:80
        - gateway/internal/middleware/anonmail/store.go:91
      defect: >-
        Пределы GateConfig.Limits звено проверяет в NewGate и дальше не читает. Решение берёт пределы из
        копии, которую хранит store (store.go:141). Звено можно собрать с пределами A и хранилищем,
        построенным на пределах B, и страж NewGate проверит не те пределы, по которым идёт решение
        (arch-lean-no-vestigial, arch-doc-truthfulness).
      requirement: >-
        Снять Limits с GateConfig и перенести проверку «пределы разрешены» в конструкторы хранилищ
        (NewMemoryStore/NewPostgresStore). Другой вариант: звено берёт пределы у хранилища, второго источника
        нет.
  style:
    GS-E2-6: "gateway/internal/idempotencypg/anon_mail.go:107 — ключ \"error\", а в том же диффе \"err\" (gate.go:119); привести к одному."
    GS-E2-7: "gateway/internal/middleware/anonmail/store_pg.go:376-390 — rows.Close() вручную на двух путях; defer rows.Close() сразу после Query."

