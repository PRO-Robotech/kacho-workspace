approved:
  - Тонкий край. Звено стоит перед ретрансляцией, ретранслятор не строится, если признак anonMail есть, а звена нет (login_lane_relay.go:860-871).
  - Провязка только в cmd/api-gateway (main.go, anon_mail_store.go). Глобальных синглтонов и init() нет.
  - На каждом внешнем вызове свой срок. Acquire ограничен anonMailStoreWait, решение — anonMailDecisionBudget, COMMIT — anonMailCommitWait на WithoutCancel, каждый опрос resolveCommit — своим сроком, прогрев пула — limiterWarmUpBudget.
  - "Исход закрыт: Outcome начинается с iota+1, у нуля нет значения исхода. Ветки «не смог спросить → пропустить» нет."
  - Ошибки по errors.Is/As (pgx.ErrNoRows, *pgconn.PgError 22023). Сравнения строк ошибок нет.
  - Магических чисел нет, константы названы и объяснены. Идентификаторы латиницей. ORM нет, SQL рукописный на pgx.
  - Ключ подписи не печатается (AnonMailPoWKey.String/LogValue). Клиентский адрес не журналируется.
  - "Пробы в том же PR: модульные, на memory и на настоящем Postgres, векторы PoW."
