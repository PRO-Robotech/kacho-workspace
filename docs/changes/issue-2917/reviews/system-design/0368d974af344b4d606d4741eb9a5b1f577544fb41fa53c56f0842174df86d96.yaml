  # store_pg.go:519-557 resolveCommit: ошибка COMMIT не сводится к 503 — опрос pg_xact_status с шагом
  # anonMailStoreWait до конца исходной транзакции, затем отдельным оператором чтение строки момента по
  # decision_id (store_pg.go:148-150). Классы опроса закрыты (classifyPoll :481-502): 22023 после
  # переключения — читать сразу; NULL — конец; иное — повтор. Остаток окна — 503 + WARN с decision_id.
  # Срок разрешения 2×anonMailDecisionBudget покрывает idle_in_transaction_session_timeout исходной
  # транзакции (COMMIT потерян — сервер снимает её не позже срока решения). COMMIT и откат — на
  # context.WithoutCancel (store.go:277, :212). Пробы CX2_46a/b, UK64, остаток — зелёные.
  idempotency_one_shot: closed
  # pow_spent PK + INSERT … ON CONFLICT DO NOTHING RETURNING expires_at > clock_timestamp() (store_pg.go:121-122):
