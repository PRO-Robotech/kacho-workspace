critical:
  - id: CRIT-1
    where: gateway/internal/observability/metrics/anon_mail.go:17-35; gateway/deploy/templates/prometheusrule.yaml:49-60; gateway/internal/middleware/anonmail/gate.go:54-62
    finding: >-
      Условие Д66 к коду E2 (design.md:52-57, :1414-1439; tasks.md:360 предикат E2) — серия насыщения
      kacho_api_gateway_anon_mail_bucket_hold_seconds_total (время удержания строки ведра, доля 0…1 по флоту)
      и правило AnonMailBucketSaturation (warning, опережающий сигнал до первых 503) — НЕ реализовано:
      grep 'hold_seconds|HoldSeconds' по не-тестовому дереву gateway — 0 попаданий; Stats несёт только
      StoreUnavailable и BucketWaitTimeouts. Поставлены два ЗАПАЗДЫВАЮЩИХ правила (оба горят только после
      того, как 503 уже отданы), без меток уровня (warning/critical по Д69 нет ни у одного). Отказ от
      условия в сообщениях коммитов не назван. Принятая цена Д66 (fail-closed 503 на насыщении общей
      строки флота) держится на том, что приближение к насыщению видно ДО отказов — этого сигнала нет.
    requirement: >-
      Ввести счётчик удержания строки ведра (от получения строки до COMMIT/ROLLBACK; у memory — до
      отпускания семафора) на обоих хранилищах, зарегистрировать с нулём; правило насыщения по
      sum(rate(…_bucket_hold_seconds_total[5m])) с уровнем warning и правило исчерпания с уровнем
      critical, сверка со страницей observability.mdx в обе стороны; модульная проба «ведро свободно →
      hold_seconds > 0, wait_timeouts +0». Либо — вернуть условие Д66 в замысел явным решением; молчаливое
      расхождение кода с условием не принимается.

important:
  - id: I-1
    where: gateway/internal/middleware/anonmail/store.go:233-271
    finding: >-
      Строка ведра (единственная точка сериализации флота) берётся FOR UPDATE на КАЖДОМ решении — и на
      Reject (RungHard), и на Challenge при required>0, и на Pass по свежему доказательству, где жетон не
      нужен (ladder.go:172-193: жетон читается только при proofAbsent && required==0). Счёт ключей
      (1 + число подсетей операторов) и nthMoment исполняются уже под строкой ведра. Следствие: трафик
      атакующего, который и так отвергается по своим ключам, занимает общую строку и доводит её до
      насыщения Д66 — 503 получают законные анонимные запросы со всего флота. Порядок «ключи → пометка →
      счёт → лестница → строка ведра ТОЛЬКО при политике с жетоном» не вводит check-then-act (ведро
      читается и пишется под FOR UPDATE в той же транзакции, счёт стабилен под блокировками ключей) и
      сокращает удержание строки до одного оператора.
    requirement: вернуть порядок шагов З8 в замысел (design-reviewer) с этим доводом; на коде E2 не блокирует — порядок взят из замысла.
  - id: I-2
    where: gateway/cmd/api-gateway/main.go (GateConfig.Now = time.Now); store_pg.go:129-140, :398-401; ladder.go:198-204
    finding: >-
      Моменты пропуска, границы окон и момент ведра судят часы реплики; часы базы — только срок вызова
      (I1 закрыт). Расхождение часов реплики с базой ничем не ограничено и не наблюдаемо: реплика, ушедшая
      вперёд на d, пишет моменты в будущее — окно открыто сверху (SEC-E2-1), их считают все реплики d
      времени, уборка их не берёт; та же реплика сдвигает at ведра вперёд — пополнение флота замирает на
      d (все анонимные без доказательства получают PoW). Реплика, отстающая на d, недосчитывает на
      границе окна (лишние пропуски ≤ темп×d). Направление отказа — закрытое, кроме недосчёта; величина
      — неограниченная при сбое NTP.
    requirement: >-
      Сигнал расхождения: тем же оператором решения получать clock_timestamp() базы и при |r.Now − db| >
      порога — WARN и счётчик; либо момент ведра ограничить часами базы. Порог и форма — решение замысла
      (часы пробы — требование стенда П6, Д68).
  - id: I-3
    where: gateway/deploy/templates/prometheusrule.yaml:34-41; deploy/helm/umbrella/values.{a8f60d,fe3455,prorobotech}.yaml
    finding: >-
      Порог «первый отказ за 10 минут» помечен в шаблоне «ВРЕМЕННО… ПЕРЕМЕРИТЬ» без задачи и предиката
      снятия (ban11-three-outcomes); нагрузочный прогон E2 с флотом 2 (tasks.md:360) не выполнен —
      пропускная способность строки ведра не измерена. Правила выключены на трёх площадочных цепочках
      с причиной «не измерено» — там цена Д66 не сигналит вовсе. Ключ выключателя — .Values.alertRules,
      а не global.kacho.alertRules (CX2-92 (а)).

