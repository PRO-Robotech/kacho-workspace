findings:
  critical: []
  important:
    - id: I1
      coord: internal/apps/kaname/mail/enqueue.go:70
      summary: "классификация ErrLimitExhausted через errors.Is на errors.Join: фундамент при неудачном ROLLBACK TO SAVEPOINT (put.go: errors.Join(err, rbErr)) либо при отказе регистрации хука подавления (errors.Join(err, hookErr)) отдаёт ошибку, которая всё равно матчится ErrLimitExhausted, и Enqueue возвращает OutcomeCapped, nil — отказ хранилища попадает в разрешающую сторону (code-authoring §«Чужой ответ: классификация и бюджет»)"
      why_not_blocking: "атомарность не нарушается: сломанная точка сохранения оставляет tx непригодной, и COMMIT вызывающего отказывает (ErrTxCommitRollback / закрытое соединение) — событие не фиксируется частично; теряется лишь точность причины и метрика подавления"
      requirement: "до первого места вызова (полоса подключения глаголов): Capped — только когда цепочка ошибки НЕ несёт иного отказа (сравнить с exhaustedError без примеси rbErr/hookErr), иначе ошибка с именем шаблона; проба-инъекция: подменённый put, отдающий errors.Join(feed.ErrLimitExhausted, errX) → ошибка, близнец feed.ErrLimitExhausted → Capped"
      return_to: "автор полосы G1 (pointpu)"
    - id: I2
      coord: internal/apps/kaname/mail/mail.go:38
      summary: "два независимо разобранных флага одного ключа notifications.enabled: mail.EnabledFrom(*bool) и feed.ParseEnabled; расхождение ловится только в момент постановки (ErrFlagMismatch / ErrDeliveryNotConfigured → откат глагола), а не при старте"
      why_not_blocking: "в диффе корня нет (NewEnqueuer/FeedSignal без прод-импортёров); отказ громкий, в разрешающую сторону не уходит"
      requirement: "в полосе подключения корня — один разбор ключа и производный второй флаг (либо проба отказа старта на расхождении), чтобы мутации не откатывались из-за сборки"
      return_to: "автор полосы подключения корня"
  notes:
    - "Enqueuer, FeedSignal, FeedJournal пока без прод-вызывателей (git grep @52ba60b56: только пробы) — поверхность подготовлена под следующие полосы NTF-2; распределённые свойства мест вызова (глагол открывает tx через journalwrite.Begin) судятся на их диффе"

