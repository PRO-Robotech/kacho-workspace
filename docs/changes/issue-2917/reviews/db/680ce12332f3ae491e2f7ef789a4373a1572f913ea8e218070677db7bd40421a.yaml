closure:
  I1:
    status: закрыт
    where: design.md:1545-1585 (З8, «расхождение часов реплики с часами базы — наблюдаемо»); журнал 30-31; УК94 (4136); таблица находок 4204
    reasoning:
      - >-
        Скобка: t0 = GateConfig.Now() непосредственно перед отправкой оператора счёта, t1 — сразу после
        ответа, skew = (t0+t1)/2 − clock_timestamp(). clock_timestamp() исполняется сервером в момент
        внутри [t0, t1] (в истинном времени), поэтому |ошибка середины| ≤ (t1−t0)/2 — граница верна
        безусловно, при любой асимметрии сети; ожидания Acquire, блокировок ключей и pow_spent лежат ДО t0
        и в значение не входят.
      - >-
        countsSQL (ветка @56080205e21, store_pg.go:138-143) — агрегат без GROUP BY: ровно одна строка на
        каждый вызов, clock_timestamp() есть всегда, пустого значения не бывает.
      - >-
        Момент решения для окон и ведра не меняется — исход решения от часов базы по-прежнему не зависит;
        на П6 обе отметки с часов пробы (Д68).
      - >-
        Проба различает спутывание: часы сверены, внешняя транзакция держит рекомендательную блокировку
        ключа источника 200 мс → |gauge| < 100 мс и exceeded +0; близнец-инъекция «skew от момента решения»
        → ≈ −200 мс — красный (знак верен: момент решения раньше часов базы на величину ожидания).
        Это и есть проба O2 записи d5dfafcf.
      - >-
        Предел 1 с и правило `> 1` for 5m теперь обоснованы: без ожиданий в значении ложной тревоги под
        конкуренцией нет (снимает довод n1 записи b9db5dd1 о пороге 2 с).
