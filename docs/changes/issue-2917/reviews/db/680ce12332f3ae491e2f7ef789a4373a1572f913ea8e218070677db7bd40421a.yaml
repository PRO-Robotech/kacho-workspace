  minor:
    - id: m4
      tag: BRACKET-WHICH-STATEMENT
      where: design.md:1549-1553
      summary: >-
        Операторов счёта на решение несколько (countsSQL — по одному на ключ: 2 у IPv4, 3 у IPv6), а
        замысел говорит «оператор счёта» в единственном. Граница верна для скобки вокруг ЛЮБОГО одного
        оператора, но скобка от первого t0 до последнего t1 расширила бы погрешность на число операторов.
        Записью: «скобка — вокруг первого оператора счёта решения; его clock_timestamp() и берётся».
        Не блокирует: и в широкой скобке ожиданий блокировок нет.
    - id: m5
      tag: NO-LOCK-WORDING
      where: design.md:1558 («Оператор счёта блокировок не берёт»)
      summary: >-
        Строго — берёт AccessShareLock на anon_mail_passes; конфликтует он только с ACCESS EXCLUSIVE
        (DDL, VACUUM FULL), атакой недостижим. Граница (t1−t0)/2 от этого не ломается (она безусловна),
        страдает лишь её малость в окно DDL. Записью: «строчных и рекомендательных блокировок не берёт».

