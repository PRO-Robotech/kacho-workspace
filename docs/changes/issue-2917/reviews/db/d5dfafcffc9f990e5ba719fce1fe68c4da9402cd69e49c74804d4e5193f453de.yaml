answers:
  I-1:
    question: "FOR UPDATE ведра только под жетон — сохраняется ли неделимость «решение и счёт»?"
    answer: ДА
    reasoning:
      - >-
        Счёт ключей: каждый писатель момента ключа держит pg_advisory_xact_lock этого ключа до конца своей
        транзакции; оператор счёта (READ COMMITTED, свой снимок) исполняется ПОСЛЕ взятия блокировок и видит
        все зафиксированные моменты ключа; до COMMIT решения новых моментов по этим ключам нет.
      - >-
        Ведро: читается и пишется под SELECT … FOR UPDATE той же транзакции; FOR UPDATE перечитывает последнюю
        версию строки после ожидания; CHECK (tokens >= 0) в миграции 20261001180000 — второй механизм базы.
        Check-then-act нет.
      - >-
        Порядок блокировок: рекомендательные (отсортированные) → вставка pow_spent (ожидание чужой
        незафиксированной вставки того же id) → строка ведра. Ни один шаг не возвращается к более раннему
        виду блокировки; держатель строки ведра больше ничего не ждёт — цикла нет. Перенос ведра ПОСЛЕ счёта
        порядка блокировок не меняет: счёт блокировок не берёт.
      - >-
        Исходы без жетона (Reject HARD, вызов при required>0, Pass по свежему доказательству) ведро не читают
        и не пишут; Retry-After (nthMoment) — под блокировками ключей. Код ветки @56080205 (store.go Decide:
        lock → markSpent → counts → Ladder → decideWithoutBucket → bucket только при needsBucket) этому следует.
    consequence: >-
      Снимается избыточность M4 записи 0368d974: строка ведра больше НЕ сериализует счёт (счёт теперь ДО неё),
      ось ключа держит ТОЛЬКО рекомендательная блокировка — и на пути жетона, и на пути доказательства.
      Это верно, но держатель обязан это различать (заказ O1).
  I-2:
    question: "Смещение часов реплики от часов базы"
    answer: "механизм сигнала верен по месту (тот же оператор счёта, исход решения не меняется); довод погрешности ложен"
  CX2-93:
    question: "Счётчик исчерпания по оператору строки ведра; ожидание memory ограничено сроком"
    answer: "механизм верен; текст замысла расходится с кодом и опускает необходимое условие (m2)"

findings:
  critical: []
  important:
    - id: I1
      tag: SKEW-CONFLATED-WITH-WAIT
      where: design.md:1481 («погрешность — длительность оператора (единицы мс против предела)»); 1500 (integration-проба)
      summary: >-
        skew = now реплики − clock_timestamp() базы, где now реплики — момент решения (GateConfig.Now в
        gate.go:127), взятый ДО захвата соединения, блокировок ключей и пометки доказательства, а
        clock_timestamp() — момент исполнения оператора счёта ПОСЛЕ них. Погрешность — не длительность
        оператора, а все ожидания до него: Acquire (≤250 мс) + блокировки ключей (IPv6 — 3×≤250 мс) +
        вставка pow_spent (≤250 мс) — до ≈1,25 с, больше предела 1 с. Код ветки сам это признаёт
        (store.go:72-75: «смещено вниз не больше чем на срок решения» = 1,5 с).
      failure_scenario: >-
        Часы реплики и базы сверены точно; атака на /24 держит рекомендательные блокировки подсети занятыми →
        решения ждут ~1–1,25 с до оператора счёта → gauge ≈ −1,1 с, …_clock_skew_exceeded_total растёт, WARN
        раз в минуту; при длящейся атаке AnonMailReplicaClockSkew (max(abs) > 1 for 5m) горит и уводит
        оператора к NTP ровно в момент насыщения. Обратно: реальный уход вперёд (опасное направление —
        моменты в будущее, заморозка пополнения ведра) занижается на величину ожидания.
      requirement: >-
        Мерить смещение по скобке вокруг САМОГО оператора, а не по моменту решения: t0 = GateConfig.Now()
        непосредственно перед отправкой countsSQL, t1 — сразу после ответа; skew = (t0+t1)/2 − clock_timestamp(),
        погрешность ≤ (t1−t0)/2 (RTT, без ожиданий блокировок — оператор счёта блокировок не берёт). Момент
        решения r.Now для окон и ведра не меняется. На П6 обе отметки — с часов пробы, как и сейчас. Довод
        «погрешность» в З8 переписать на эту границу.
      probe_required: >-
        integration на postgres: часы сверены (GateConfig.Now = time.Now), внешняя транзакция держит
        рекомендательную блокировку ключа источника 200 мс → |gauge| < 100 мс; близнец-инъекция «skew от
        r.Now» → gauge ≈ −200 мс — красный. Действующая проба (design.md:1500, «сдвиг ±100 мс после первого
        решения») ожиданий не создаёт и спутывание не различает.
  minor:
    - id: m1
      tag: DOC-HOLD-CLAIM
      where: design.md:1462
      summary: >-
        «удержание строки сводится к одному оператору чтения-записи ведра» — неверно: от FOR UPDATE до конца
        транзакции строку держат SELECT … FOR UPDATE, вставка моментов, UPDATE ведра (recordPass) и COMMIT
        (до anonMailCommitWait); на вызове без жетона — SELECT и ROLLBACK. Записью: переформулировать
        («удержание — хвост транзакции после счёта: чтение ведра, запись момента и ведра, фиксация»).
    - id: m2
      tag: DOC-VS-TREE-CLASSIFIER
      where: design.md:1449 («Классификатора «по SQLSTATE» у счётчика нет»)
      summary: >-
        Код (store.go:229-243, 205-221) растит счётчик при шаг == ведро И класс == ожидание (55P03, 57014,
        срок контекста) — и это правильно: обрыв соединения на операторе ведра — не исчерпание, и по одному
        оператору он звонил бы AnonMailBucketExhausted (critical). Замысел пишет «только по оператору» и
        отрицает классификатор, то есть опускает необходимое второе условие. Переписать: «шаг строки ведра
        И класс ожидания»; в пробы CX2-93 добавить близнеца «ошибка соединения на шаге ведра → +1
        store_unavailable, +0 bucket_wait_timeouts».
    - id: m3
      tag: SKETCH-BEHIND-SCHEMA
      where: design.md:3593 (§6, край)
      summary: >-
        Набросок таблиц края без NOT NULL и без CHECK (tokens >= 0), CHECK (key <> ''), octet_length(id)=16,
        которые несут миграции 20261001180000/190000; CHECK (tokens >= 0) — механизм базы, на котором стоит
        проба O2. Замысел владеет инвариантами — дописать их в набросок.

