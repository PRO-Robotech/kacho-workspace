findings:
  critical: []
  important:
    - id: I1
      tag: ONE-TIME-HOLE-BY-TWO-CLOCKS
      where: gateway/internal/idempotencypg/anon_mail.go (reap pow_spent `expires_at <= now()`) против gateway/internal/middleware/anonmail/pow.go:129 (`p.now().Before(exp)`)
      summary: >-
        Одноразовость доказательства держит первичный ключ pow_spent лишь пока строка жива.
        Строку снимают по часам БАЗЫ, срок доказательства проверяют по часам РЕПЛИКИ. Если часы
        реплики отстают на d, в промежутке d строки уже нет, а доказательство ещё принимается:
        повтор проходит markSpent как свежий. Флот с несверенными часами — посылка самого
        замысла (SEC-E2-1).
      requirement: >-
        снимать pow_spent с запасом, покрывающим расхождение часов (например,
        `expires_at <= now() - <предел расхождения>`, одно названное число), либо проверять срок
        в той же транзакции по часам базы; плюс проба: строка истекла по базе, реплика с отстающими часами
        предъявляет тот же вызов -> не Pass.
  minor:
    - id: M1
      tag: CHECK
      where: 20261001180000_anon_mail_limiter.sql, anon_mail_passes.key
      summary: "у `key TEXT NOT NULL` нет `CHECK (key <> '')`: пустой ключ схема примет"
    - id: M2
      tag: OFFSET-NOT-PAGINATION
      where: store_pg.go:126 nthMomentSQL
      summary: >-
        OFFSET здесь не пагинация: выбор n-го момента в окне для Retry-After, ограничен порогом HARD,
        идёт по индексу (key, at). Принято, не нарушение.

orders:
  - id: O1
    to: integration-tester
    invariant: pow_spent PRIMARY KEY (одноразовость вызова)
    probe: >-
      одно и то же доказательство одновременно с ДВУХ разных источников (разные рекомендательные
      блокировки, две реплики) -> ровно один Pass, прочие не Pass; pow_spent — одна строка.
      Сейчас конкурирующих проб на этот ключ нет: последовательные есть, а гонка разных ключей не проверена.
  - id: O2
    to: integration-tester
    invariant: anon_mail_bucket FOR UPDATE + CHECK (tokens >= 0) (ведро общего потока)
    probe: >-
      N одновременных решений с РАЗНЫХ источников ниже их порога при BURST=B на двух репликах ->
      пропусков с жетоном ровно B, tokens в строке ведра не ниже 0. Сейчас глобальное ведро
      проверено только на memory-хранилище/гейте (TestGate_NTF2_74), не гонкой на Postgres.
  - id: O3
    to: integration-tester
    invariant: блокировка ключа подсети (ось подсети)
    probe: >-
      одновременные запросы РАЗНЫХ адресов одной подсети на пороге подсети, две реплики -> ровно
      порог пропусков. Конкурирующие пробы сейчас только по ключу источника (CX2-11, SECE2-1).

