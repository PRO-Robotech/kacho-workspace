critical:
  - id: R31-1
    where: "design.md §11 строка CX2-106 (4178), З8 «Второй страж…», З15; tasks.md строки E2, S3"
    finding: >-
      CX2-107 и CX2-108 первичного разбора initial/5606cbc0 не отображены (0 вхождений). Строка CX2-106
      держит ось адреса ключом `AddressKey(A)`, который снимает S3 этого же изменения; ключ источника —
      литерал S1, а не значение, которое край переслал kaname; контроля в обе стороны нет; страж,
      судящий recovery/complete после S3, не назван.
    requirement: >-
      Отобразить в §11, З8, З15 и строках E2, S3: (CX2-107) ключ источника — значение X-Forwarded-For,
      увиденное посредником пробы в запросе края к kaname (больше одного — «не выполнилось»); A в
      канонической форме с проверкой; окно по `now()` базы в том же запросе; ошибка чтения или отсутствие
      таблицы/столбца — «не выполнилось» с текстом, не 0; контроль после (г) — ровно 1 след по каждой оси
      у судившего стража; соль попытки в выводе A и S1, печатается; инъекция — A с заглавной → контроль
      0 → «не выполнилось», близнец — каноническая A → 1/1. (CX2-108) замысел решает, остаётся ли
      `gate.check` на recovery/complete после S3 или его заменяет AttemptGuard; гейт «вызывающих стража»
      печатает это; E2 печатает ручки и числа следов каждого стража, судящего вход и предъявление на
      ревизии kaname стенда (ревизия печатается); инъекция — неудачи пары (A, S1) в хранилище
      AttemptGuard → «не выполнилось», близнец — чистая пара → (г) зелёный.

