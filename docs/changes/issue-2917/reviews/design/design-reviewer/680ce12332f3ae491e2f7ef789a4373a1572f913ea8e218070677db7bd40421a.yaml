critical:
  - id: R28-1
    where: "design.md З8 «причина классифицируется по шагу решения и классу ожидания» (1496–1510); УК99; tasks.md E2"
    finding: >-
      Счётчик …_bucket_wait_timeouts_total и critical AnonMailBucketExhausted считают «истёкший срок
      контекста решения» на шаге ведра исчерпанием ведра без условия на остаток бюджета (CX2-98). Бюджет
      решения общий (6 × 250 мс): захват соединения, до трёх блокировок ключей (IPv6) и пометка
      доказательства каждая может ждать почти 250 мс, не давая 55P03. Под атакой, держащей блокировки
      подсети, решение входит в шаг ведра с остатком в миллисекунды, и срок истекает на свободной строке
      ведра. Итог — critical-тревога о насыщении общей строки флота, которого нет; ровно тот ложный
      сигнал, который m2 снимал для обрыва соединения. Причина (ключи) и место проявления (ведро)
      слиты.
    requirement: >-
      Отобразить CX2-98 (а)–(б): срок контекста — исчерпание ведра только при остатке на входе шага
      ведра ≥ anonMailStoreWait (или шаг ведра на своём контексте min(остаток, anonMailStoreWait) и
      классификация по тому, чей срок истёк); меньший остаток — только …_store_unavailable_total.
      Держатель в E2: близнец «блокировки ключей подсети съели бюджет, строка ведра свободна» → +0 / +1
      store_unavailable; положительный «строку держат дольше anonMailStoreWait при полном остатке» → +1;
      инъекция «срок контекста без условия остатка» → близнец +1 — красный; остаток печатается.

