prior_findings:
  - id: К1
    status: исполнено
    where: "З8 «Одна ручка прыжков»; З28 «Ручка прыжков — не из базы» (Д51, вариант (а)); §8; §11 CX2-12, CX2-69; §12; §13 Е16 (снята одобрением приёмки ред. 28), Е17; tasks D6, E1, D1 («кроме TRUSTED_HOPS — полоса D6»)"
    note: >-
      Противоречие Р8 × DoD п.13 вернули в приёмку зависимостью Е16. Решение Д51 выбрало форму (а).
      Текст приёмки внесён редакцией 24 и одобрен в редакции 28 (29b09f14). Умолчания нет нигде: ни в
      процессе (обязательный TrustedHops в конструкторе, нулевое значение отвергается), ни в шаблоне
      (`required … | quote`, без with/default, поэтому `0` законен), ни в values.yaml зонтика, ни в
      значениях чарта края, ни в поставляемом prod. Рендер prod без ручки отказывает с её именем. Стенды
      объявляют `1` своим файлом профиля — поведение, которое М66 измерил как сегодняшнее. Держатель —
      проба D6: она печатает значение и файл-источник по каждой цепочке и несёт инъекции «значение в
      values.yaml» и «строка снята из файла стенда». Направление ошибки в З28 названо верно: объявленное
      число больше настоящего позволяет обойти окна подменой заголовка, меньшее сводит всех клиентов к
      адресу балансировщика. Рендеры чарта края без зонтика (семь семейств, М67) получают значение
      только тестовым слоем deploy/testdata/notify-standalone/edge.yaml (Д52). Умолчание в
      gateway/deploy/values.yaml запрещено явно, значит база на уровень подчарта не возвращается.
      Слой лежит в testdata, его читают пробы и IaC-скан; в поставку он не входит.
  - id: В3
    status: исполнено
    where: "З8 (2), И6, И37, §8 строки «срок решения ограничителя» и «срок разрешения исхода фиксации»"
    note: >-
      Точка отсчёта теперь названа у каждой границы. 2,1 с считаются от начала транзакции, при живом
      держателе и доставленной отмене. 3 с — от прихода на сервер последнего оператора держателя. От
      начала транзакции при потерянной отмене — ≈ 2 × budget у живого держателя и ≈ 3 × budget
      (4,5 с) у исчезнувшего. Довод срока разрешения записан от отправки COMMIT. Повторно проверено:
      если COMMIT задержан в сети, транзакция всё равно кончается в пределах 2 × budget от отправки.
      Предыдущий оператор кончился не позже отправки, поэтому idle_in_transaction снимает транзакцию не
      позже чем через budget после неё. Если COMMIT успеет прийти раньше, он исполняется и транзакцию
      завершает.
  - id: М3
    status: исполнено
    where: "З8 «Исход фиксации», И40, §7 П9, §11а УК57"
    note: >-
      Добавлен отдельный класс «in progress до конца anonMailResolveBudget». Он даёт остаток: строка
      не читается, ответ 503, WARN и счётчик +1. Довод «чтение „записи нет“ опередило бы фиксацию»
      записан. Проба — вариант модульной пробы resolveCommit (E2).

