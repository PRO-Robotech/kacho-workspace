critical:
  - id: К1
    coordinate: >-
      design.md §8 строка 2656 (KACHO_API_GATEWAY_TRUSTED_HOPS), З28 строки 2158–2163; tasks.md D1
      (строка 218: «TRUSTED_HOPS: 1 … в values.yaml зонтика … не в values.dev.yaml/values.prod.yaml»);
      против приёмки редакции 23, Р8, строка 829, и §11 CX2-12 (строка 2748)
    finding: >-
      Редакция 9 держала требование приёмки буквально: «целое ≥ 0, без умолчания; задано в каждом
      профиле». Редакция 11 заменила его на «объявлено 1 в values.yaml зонтика и наследуется
      каждой цепочкой». Причина — граница с kacho#1276: values.dev.yaml и values.prod.yaml NTF-2 не
      правит (DoD п.13). Возврата в приёмку замысел при этом не завёл.
      Ручка задаёт, какой элемент X-Forwarded-For край считает адресом клиента (ClientIP, И5), а
      этот адрес — ключ окон источника и подсети анонимного почтового потока. Значение базы
      получает каждая установка, которая ручку не задала, в том числе операторская установка prod
      с другой топологией балансировщиков. Прыжков на самом деле меньше, чем 1 — адресом
      источника становится элемент, который прислал клиент, и окна по источнику обходятся
      подменой заголовка. Прыжков больше — все клиенты сводятся к адресу балансировщика, и один
      арендатор выбирает общее окно за всех.
      CX2-12 утверждает «умолчание 1 снято», а форма редакции 11 переносит это умолчание на
      уровень выше, в значения чарта. Для оператора оно такое же молчаливое: процесс без умолчания
      получает значение, которого никто не выбирал для этой установки
      (sec-no-silent-default-for-guarded-knob по существу). Защита З28 «D1 печатает значения по
      цепочкам и останавливается на расхождении» этого не ловит: то, что цепочке нужно другое
      число, из рендера не выводится, а зависит от топологии установки.
      Противоречие лежит внутри приёмки: Р8 «задано явно в каждом профиле» против DoD п.13 «файлы
      за kacho#1276 не правятся». Разрешать его замысел в пользу ослабления на
      безопасностно-значимой ручке не вправе.
    requirement: >-
      Не выбирать форму «значение в базе, наследуется» молча. Завести зависимость §13 (Е16) и
      вернуть в приёмку противоречие Р8 × DoD п.13 для этой ручки, с ценой каждой формы. Формы
      такие: (а) значения нет ни в базе, ни в поставляемом prod; рендер prod без ручки отвечает
      отказом с её именем, как узел почты по Д46/Д48; явное значение стоит в каждом профиле стенда,
      а строки values.dev.yaml и values.prod.yaml — исключение DoD п.13 либо правка тем же
      kacho#1276; (б) приёмка сознательно принимает значение базы — тогда таблица Р8 говорит
      «объявлено в базе» и называет, кто и где объявляет топологию каждой цепочки, а CX2-12 и §8
      перестают утверждать, что умолчания нет. До решения §8 и CX2-12 не должны расходиться с
      Р8. Строку D1 и её предикат привести к выбранной форме. Держатель выбранной формы —
      проба рендера по каждой цепочке из stacks.txt, которая печатает значение ручки и его источник
      (файл цепочки), с инъекцией «ручка снята из профиля → отказ рендера» для формы (а).
    blocks: true

important:
  - id: В3
    coordinate: "design.md З8 (2) строки 797–803, И6 (строка 2318), §8 строка 2678 «срок решения ограничителя» («при любом числе отмен и любом состоянии держателя ≤ 3 с»)"
    finding: >-
      Граница «транзакцию снимает сервер не позже 2 × anonMailDecisionBudget = 3 с при любом
      числе отмен и любом состоянии держателя» верна, если мерить от исчезновения держателя или от
      начала последнего оператора. Именно так её формулирует И37. И6 и §8 читаются как граница от
      начала транзакции, рядом с «живой держатель — 2,1 с», а от начала она не держится.
      Сценарий: последний оператор до COMMIT отправлен в момент T0 + budget − ε, в пределах срока
      контекста. Затем сеть разделяется без RST, и запрос отмены не доходит. Сервер исполняет
      оператор до statement_timeout (≈ T0 + 2·budget), потом простаивает в прерванной транзакции до
      idle_in_transaction_session_timeout (≈ T0 + 3·budget = 4,5 с). При живом держателе с
      потерянной отменой строка держится до ≈ T0 + 2·budget: клиент закрывает сокет, но сервер
      замечает это только после конца оператора. В прежней записи aaaff659 эта роль назвала
      границу «≤ 3 с при любом состоянии» верной, и эта запись её оценку уточняет.
      Механизм от этого не страдает. Флот ограничен сервером, срок разрешения
      (anonMailResolveBudget = 2·budget) держится, потому что меряется от отправки COMMIT: после
      COMMIT транзакции нет, и оператор ограничен statement_timeout. Проба «долгий оператор»
      берёт pg_sleep сразу после ведра, поэтому остаётся верной.
    requirement: >-
      В И6 и §8 назвать точку отсчёта. «≤ 2 × budget после исчезновения держателя (И37)» и
      «от начала транзакции — ≤ 3 × budget при потерянной отмене и разделённой сети» либо
      сформулировать границу от начала последнего оператора. Довод срока разрешения записать от
      отправки COMMIT, а не от начала транзакции. Не блокирует.

minor:
  - id: М3
    coordinate: "design.md З8 «Исход фиксации», перечень УК57 (строки 868–875)"
    finding: >-
      Перечень не называет исход для случая, когда ответ in progress держится до конца
      anonMailResolveBudget. Читать строку после этого нельзя: исходная транзакция, возможно, ещё
      не кончилась, а после переключения это может быть чужой xid. Верный исход — остаток «не
      разрешено» → 503, WARN и счётчик. Фраза «WARN — только когда за весь срок не удалось прочесть
      строку» этот случай покрывает лишь косвенно.
    requirement: "Строкой перечня: «in progress до конца срока → остаток, строку не читать»; вариант модульной пробы УК57."

