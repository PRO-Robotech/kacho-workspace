axes:
  atomicity_no_dual_write: >-
    закрыта. Дельта не разводит решение и его запись: пометка, ведро, Admit и момент с
    decision_id — одна транзакция, фиксируемая только при Pass. COMMIT вынесен из срока решения
    на WithoutCancel со своим пределом — это не вторая запись, а отказ обрывать уже отправленную
    фиксацию.
  idempotency: >-
    закрыта. Одноразовость вызова сохраняет commitUnknown → resolveCommit: ответ даётся только
    после конца исходной транзакции на сервере (pg_xact_status ≠ in progress) и чтения своей
    строки по decision_id отдельным оператором со снимком после её конца. Истина — строка, а не
    статус; при переключении базы строка описывает то, что в ней есть. Неразрешимый остаток
    («COMMIT отправлен, база не ответила всё окно разрешения») неустраним по построению —
    исход фиксации знать нечем; замысел его не прячет, называет цену (один лишний вызов) и
    отдаёт «Тогда» Р5 приёмке. Как распределённое свойство это верно: альтернатива «пропустить»
    была бы веткой «не смог спросить → пропустить», её нет.
  cas_and_locking: >-
    закрыта по механизму; замечание В1 — о тексте довода, а не об исходе. Порядок «аккаунт FOR
    UPDATE → приглашающий FOR SHARE → ключ адресата» один у invite и resend; FOR SHARE выбран
    верно (FOR KEY SHARE не держит смену адреса). Встречный порядок с удалением человека назван,
    исход жертвы — 40P01 → единственный mapErr → ABORTED.
  delivery_model: "закрыта; дельта модель доставки не трогает (Watch RPC нет, лента — Claim/Ack на внутреннем слушателе)."
  worker_and_replica_coordination: >-
    закрыта. Работа диспетчера наследует наблюдаемость, но не отмену и срок; цена потери при
    аварийном завершении названа; срок гашения пода объявлен и сверяется гейтом. Пул
    ограничителя: прогрев одновременным взятием, срок жизни с разбросом, три окна холодного пула
    названы и закрыты (503, счётчик).
  deadlines: >-
    закрыта. Свой срок у каждого обращения к базе на пути решения: захват и операторы —
    anonMailDecisionBudget; COMMIT — anonMailCommitWait на WithoutCancel; Rollback —
    anonMailStoreWait на WithoutCancel; разрешение — anonMailResolveBudget на WithoutCancel;
    плюс серверные пределы, не зависящие от жизни процесса. Обработчик отмены пула задан явно.
  edges_acyclicity: "закрыта; новых рёбер нет, notify → kaname записано (М1)."
  public_vs_internal_edge: >-
    закрыта; дельта поверхности не меняет. Д23: ключ отпечатка адреса — отдельный объект у
    notify-api и notify-sender; предикат единственного держателя секрета почты сохранён
    распознавателем по идентичности объекта (З22, И13) с тремя инъекциями (D3).
  replica_state_isolation: "закрыта; состояние ограничителя у флота, memory законно только при флоте 1 (гейт пары) — без изменений."
  invariants_and_holders: "И37–И41 новые, у каждого держатель с близнецом; И6 уточнён под commitUnknown."
  tasks_correspondence: >-
    соответствует: E2 несёт beginDecision, 25P03, посредник, resolveCommit, УК52–УК54; S5 —
    FOR SHARE и пробу встречного порядка; S12 — Н1; D4 — неравенство; S11 и D1 — объявление 60 с;
    D3 — распознаватель секрета.

critical: []

important:
  - id: В1
    coordinate: "design.md З24 «Строка приглашающего в порядке блокировок» (строки 1744–1760), §1 М54, И41"
    finding: >-
      Довод о встречном порядке описывает механизм неверно. Замысел пишет, что проверка
      accounts_owner_fk «при фиксации берёт строку аккаунта» и что «отложенную проверку внешнего
      ключа переставить нельзя». Но у ON DELETE RESTRICT проверка не откладывается никогда,
      даже при DEFERRABLE INITIALLY DEFERRED: PostgreSQL 16 создаёт триггер действия RESTRICT
      с deferrable = false (tablecmds.c:12074–12077). Поэтому RI_FKey_restrict_del берёт строку
      аккаунта FOR KEY SHARE в конце оператора DELETE, а не на COMMIT, и 40P01 жертвы-удаления
      приходит на QueryRow в userWriter.Delete (user_repo.go ~785), а не на writeTx.Commit.
      Исход не меняется: и этот путь идёт в тот же единственный mapErr (maperr.go:22 →
      pgmaperr, SerializationConflict → ErrAborted → ABORTED). Встречный порядок «человек →
      аккаунт» тоже сохраняется. Второе следствие для близнеца пробы: пока приглашающий владеет
      аккаунтом, его удаление всегда отвергается RESTRICT (23503 → FailedPrecondition).
      Поэтому исход «удаление исполнено после» в последовательном близнеце УК55 недостижим.
    requirement: >-
      В З24 и М54 заменить «при фиксации» и «отложенную» на «в конце оператора DELETE
      (RESTRICT не откладывается, tablecmds.c)». Перестановку по-прежнему не выбирать: RI-триггер
      переставить нельзя, это верно. В пробе УК55 не привязывать жертву к Commit: утверждать
      ABORTED на любом из двух путей. Последовательный близнец — «приглашение исполнено,
      удаление → FAILED_PRECONDITION внешним ключом». Замечание не блокирует: исход и
      классификация верны, держит их integration-проба по исходу.
  - id: В2
    coordinate: "design.md З8 (2) (строки 665–670), «Исход фиксации» цена по времени (строка 738), §8 (строки срока решения и разрешения)"
    finding: >-
      Формулы границ не включают фиксированный сон драйвера 100 мс. Он идёт после каждой
      отмены на CancelRequestContextWatcherHandler: pgx pgconn.go:3004, УК58 пересверки на этот
      же отпечаток. Rollback после отмены уходит не раньше этого сна, поэтому строка ведра при
      живом держателе удерживается дольше, чем «≤ 2 с». Худший ответ тоже больше «≈ 5,25 с».
      На свойство флота это не влияет: после отмены сессия простаивает в прерванной транзакции,
      и серверный предел простоя всё равно снимает её не позже 2 × anonMailDecisionBudget.
      Граница «≤ 3 с при любом состоянии держателя» верна.
    requirement: >-
      Исполнить УК58 следующей редакцией: пересчитать «живой держатель» и «худший ответ» со
      слагаемым 100 мс на каждую отмену и приписать цену сну драйвера, а не соединению отмены.
      Не блокирует.

