axes:
  atomicity_no_dual_write: >-
    закрыта. Строка ленты и строка журнала подписки — в tx события (З1, З17); класс S — аудит,
    ledger, feed.Put в одной tx (З16, П5); работа окна — якорь → Decide → код → запись →
    feed.Put → момент одной tx (З13); момент без строки ленты невыразим (feed_id NOT NULL,
    И21); решение ограничителя, пометка PoW и момент — одна tx, фиксируемая только при Pass
    (З8, CX2-43). Двойной записи нет.
  idempotency: >-
    закрыта. security_notice_ledger PK + ON CONFLICT DO NOTHING (И11); один живой код —
    partial UNIQUE (И8); чеканка кода регистрации — UNIQUE (address_digest, code_digest) с
    повтором через точку сохранения; повторный confirm — 23505 на уникальности учётки → 401;
    пометка PoW — INSERT ON CONFLICT DO NOTHING RETURNING.
  cas_and_locking: >-
    закрыта по механизму. Якорь: INSERT ON CONFLICT DO NOTHING → FOR UPDATE ровно одной строки,
    иначе повтор (≤3), READ COMMITTED объявлен явно типом WindowTx (И24); уборка якоря — SKIP
    LOCKED + DELETE WHERE NOT EXISTS под блокировкой, FK RESTRICT страхует; register —
    предрешение без блокировки, повторное решение под якорем (оптимистично с перепроверкой);
    ограничитель — advisory-lock формы с двумя int4 по отсортированным свёрткам, ведро
    последним (порядок один → взаимной блокировки нет; разобрано и на ожидании вставки
    pow_spent: вставка идёт до ведра, цикла нет); приглашения — строка аккаунта FOR UPDATE →
    advisory-lock ключа адресата, порядок один у invite и resend. Пробы с конкурирующими
    горутинами названы на каждом спорном пути (З8, З11, З13, З14, З24).
  delivery_model: >-
    закрыта. Watch RPC не вводится; notify сам открывает подписку и Claim/Ack ленты kaname на
    внутреннем слушателе (потребитель открывает соединение); публичного контракта наблюдения
