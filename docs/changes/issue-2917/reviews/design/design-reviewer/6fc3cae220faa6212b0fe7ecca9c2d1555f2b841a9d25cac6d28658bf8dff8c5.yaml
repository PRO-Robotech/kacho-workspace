critical:
  - id: К1
    coordinate: design.md З8 (строки 536–558, 564–591), §7 П9 (строки 1881–1886), И6 (строка 1584), §8 константы (строки 1920–1921)
    finding: >-
      У транзакции решения ограничителя края нет ни общего срока, ни ограничения со стороны
      сервера базы. Ограничены только два ожидания: захват соединения (срок pool.Acquire) и
      ожидание блокировки (SET LOCAL lock_timeout = 250 мс). Сами операторы и время, пока
      транзакция держит блокировки, ничем не ограничены. В этой транзакции строка ведра
      anon_mail_bucket — ОДНА на всю установку — берётся FOR UPDATE, и через неё проходят все
      анонимные почтовые запросы флота (так в самом замысле). Представим, что держатель
      строки ведра завис: узел реплики исчез или сеть разделилась без RST, и соединение на
      стороне базы осталось открытым с незавершённой транзакцией. Тогда каждый запрос
      recovery/register на любой реплике получает 503 по lock_timeout, и так до тех пор,
      пока сервер базы не заметит мёртвое соединение. По умолчанию это TCP keepalive
      сервера, порядка часов. Ни statement_timeout, ни idle_in_transaction_session_timeout,
      ни tcp_keepalives в дереве края нет: перемер `git grep` @6edea09c2ee дал 0. Отказ при
      этом остаётся закрытым, но восстановление доступа и регистрация недоступны во всей
      установке на время, которое не ограничено и которое замысел не называет. Это нарушает
      arch-per-call-deadline: у вызова базы нет своего предела. Единственная глобальная
      точка сериализации превращает зависание одного держателя в отказ всего флота.
    requirement: >-
      (1) Вся транзакция решения — под context.WithTimeout от запроса со сроком-константой
      звена (например, anonMailDecisionBudget) с доводом числа. Срок не меньше
      anonMailStoreWait и покрывает несколько операторов. Превышение срока —
      StoreUnavailable → 503, этот исход уже есть в закрытом наборе.
      (2) Ограничение на стороне сервера, которое не зависит от жизни процесса-держателя.
      Первыми операторами транзакции идут `SET LOCAL statement_timeout` и
      `SET LOCAL idle_in_transaction_session_timeout` на тот же бюджет. Тогда сессию, чья
      реплика исчезла, сервер сам завершает в пределах бюджета и снимает блокировку ведра
      и рекомендательные блокировки ключей. Годность SET LOCAL для второго параметра
      подтверждает проба, а не довод.
      (3) Добавить в И6: «транзакция решения держит блокировки не дольше бюджета при любом
      состоянии держателя». Внести бюджет в §8 «Константы кода».
      (4) Держатель — integration-проба на postgres. Соседнее соединение открывает
      транзакцию решения, берёт строку ведра и замолкает: не фиксирует и не закрывает
      соединение, так моделируется исчезнувшая реплика. Запрос внутри бюджета получает 503.
      Запрос после бюджета проходит: сервер завершил сессию держателя, проба печатает её
      код завершения 25P03. Близнец-инъекция меняет один факт — SET LOCAL
      idle_in_transaction_session_timeout снят. Тогда запрос после бюджета снова получает
      503, и это красный. (5) Предикат полосы E2 в tasks.md дополнить этой пробой.

important:
  - id: Н1
    coordinate: design.md З13 (строки 835–869); kaname @734f69fb4 internal/apps/kaname/api/humansession/dispatch.go:84–88
    finding: >-
      Работа диспетчера строится из `context.Background()` с таймаутом, а контекст запроса
      отбрасывается целиком: `Dispatch(_ context.Context, …)`. Отмену запроса работа не
      наследует, и это верно. Но вместе с отменой теряются трассировка, идентификатор
      запроса и логгер. Замысел добавляет через этот диспетчер новый класс работ
      (`register`: ожидание доли, выводы, транзакция) и новые исходы (`dropped_overload`
      по сроку ожидания). Без наследования наблюдаемости их не связать с запросом, который
      их породил.
    requirement: >-
      В З13 записать: работа получает `context.WithTimeout(context.WithoutCancel(reqCtx),
      timeout)` — отмену и срок запроса не наследует, наблюдаемость наследует. Держатель —
      модульная проба: значение, положенное в контекст запроса, видно в работе, а отмена
      запроса работу не отменяет. Не блокирует.
  - id: Н2
    coordinate: design.md З13 (строки 835–846, 861–869), З14 (строки 979–985)
    finding: >-
      Работа, которую принял ответ `200 {}`, живёт только в памяти процесса. Если процесс
      падает (OOM, SIGKILL по истечении terminationGracePeriodSeconds), работы в полёте
      теряются без следа в метрике. Время гашения ограничено сверху сроком работы (30 с)
      после остановки слушателей. Замысел называет цену отброса по ёмкости
      (`dropped_overload`, «повтор законен»), но не называет цену потери при падении и не
      сверяет срок гашения с terminationGracePeriodSeconds подчарта kaname.
    requirement: >-
      Назвать в З13 цену: принятая работа теряется при аварийном завершении, исход тот же,
      что `dropped_overload`, восстановление — повтор пользователем. Добавить держатель
      неравенства «terminationGracePeriodSeconds kaname > срок работы + гашение слушателей»:
      строку в гейте рендера двух поставок З23 либо довод, почему неравенство держится
      иначе. Не блокирует.
  - id: Н3
    coordinate: design.md З24 (строки 1405–1412)
    finding: >-
      У транзакции приглашения строка аккаунта берётся FOR UPDATE. Срок транзакции
      ограничен statement_timeout пула kaname (30 с) только по операторам. Время простоя
      транзакции между операторами при исчезнувшей реплике не ограничено. Радиус — один
      аккаунт: блокируются приглашения и прочие глаголы, которые берут эту строку.
    requirement: >-
      Применить к транзакциям, которые берут строку аккаунта, то же серверное ограничение
      простоя, что в К1 (п.2), либо назвать цену в З24. Не блокирует.

