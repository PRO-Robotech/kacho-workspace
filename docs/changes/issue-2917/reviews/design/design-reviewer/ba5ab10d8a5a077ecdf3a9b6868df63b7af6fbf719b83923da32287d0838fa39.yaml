axes:
  atomicity_no_dual_write: "дельта не трогает; Admit и момент — одна транзакция (прежние записи)."
  idempotency: "дельта не трогает."
  cas_and_locking: >-
    закрыта по существу Д66. Порядок захвата не меняется (ключи формы, затем строка ведра последней),
    поэтому дедлок невозможен. Время удержания строки ограничено сроком решения, а не ожиданием, и
    ретрансляция в kaname идёт после фиксации, так что внешний вызов строку не держит. hold_seconds
    по флоту даёт верную долю занятости, потому что держатель строки в каждый момент один. Остаток —
    CX2-93: счётчик исчерпания по коду 55P03 не различает строку ведра, ключ формы и пул.
  fail_closed_503: >-
    принято как решение Д66. Ветки «пропустить без ведра» нет, исход совпадает с StoreUnavailable Р5,
    наблюдаемое поведение не меняется. Цена видна при условиях CX2-92 (поставка правил) и CX2-93.
  observability_delivery: "возврат: CX2-92 (первый PrometheusRule в kacho без выключателя)."
  deployment_compatibility: "возврат: R25-1 (окно S8 → S11), CX2-90."
  stand_provenance: "возврат: CX2-91 (пин kaname без notifications; E1a не зависит от D1)."
  edges_acyclicity: >-
    закрыта для продукта. Е19 (а) («стенд kaname поднимает notify») заводит ребро CI kaname → артефакт
    kacho. Кольца модулей это не даёт, но ребро обязано быть объявлено и решено по polyrepo.md, а не
    молча. Сверка копий каталога уже читает ствол kacho, так что прецедент есть, хотя и другого вида.
  public_vs_internal_edge: "дельта не трогает."
  deadlines: "дельта не трогает; anonMailStoreWait, anonMailDecisionBudget без изменений."
  replica_state_isolation: "закрыта; ведро — строка базы, памяти между репликами нет (у memory — одна реплика по построению)."

critical:
  - id: R25-1
    where: "tasks.md шапка редакции 25 п.(1), строки S8, S11, порядок п.4"
    finding: >-
      Перестановка «S11 после S8» закрывает одно окно и открывает обратное. S8 снимает ключи
      invite-mail.* (и прочие ручки З6) из декодера, а декодер kaname — UnmarshalExact (load.go:39).
      Между посадкой S8 и S11 накладка stand-chart.sh всё ещё задаёт inviteMail.relay, чарт рендерит
      invite-mail (configmap.yaml:764–766), stand-own.sh экспортирует KANAME_INVITE_MAIL__*. На голове
      S8 kaname отказывает в старте на обоих стендах e2e-newman, и это красный, а не «не выполнилось».
      CX2-90 (а) называет это только для stand-own.sh. Производитель ключа (чарт, накладка, окружение
      стенда) и потребитель ключа (декодер) меняют совместимость в разных полосах без условия совместной
      посадки.
    requirement: >-
      Снятие ключа из декодера (S8) и снятие всех его производителей (узел чарта, накладка stand-chart.sh,
      экспорт stand-own.sh, пробы deploy/*_test.go с предиката S11) — одно изменение либо одна единица
      посадки, а проверки идут на сведённой голове. Маршрут называет это строкой порядка, а предикат
      печатает исход stand-chart.sh up и stand-own.sh up на голове S8: отказ старта по ключу — красный
      с именем ключа.
  - id: R25-2
    where: "design.md §13; tasks.md Е19, Е20"
    finding: >-
      Е19 и Е20 открыты. Е20 подтверждён замером (экспортируемого хоста kaname нет, notify —
      internal дерева kacho), то есть это возврат в приёмку строки П6. Е19 по сути тоже возврат в
      приёмку: §3б одобренной приёмки назначает группе стендов kaname исход «читает письма из
      приёмника notify» (CX2-90 (в)).
    requirement: "Е20 — в приёмку (acceptance-author). Е19 переписать как возврат в приёмку §3б с выбором владельца; при (а) объявить ребро CI kaname → образ kacho по polyrepo.md."
  - id: R25-3
    where: "design.md, tasks.md — CX2-89…94"
    finding: >-
      Пункты пересверок не отображены. CX2-89 (с прошлой пересверки) — 0 упоминаний. CX2-90 — радиус
      группы стендов. CX2-91 — стенд E1a на пине без notifications и посредник, считающий соединения, а
      не запросы. CX2-92 — PrometheusRule без выключателя валит установку без CRD. CX2-93 — счётчик
      исчерпания по коду, а не по оператору, и мьютекс memory без срока. CX2-94 — ручка служебной
      личности в поставке kaname.
    requirement: "Отобразить каждый пункт с его условием к коду."

