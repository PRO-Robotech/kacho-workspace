    probe: TestPurgeAnonMail_RemovesOnlyWhatOutlivedItsTerm
  - subject: код ошибки базы → ответ
    verdict: ok — classifyStoreErr (55P03/57014 → ожидание, 42/28/3D/3F → конфигурация, прочее → сбой) только выбирает уровень журнала; наружу фиксированный 503 StoreUnavailable, текст драйвера только в журнал
  - subject: ссылки через границу сервиса
    verdict: ok — внешних ключей нет; таблицы в kacho_gateway, база хранилища однократности края
  - subject: гигиена
    verdict: ok — goose Up/Down в обеих; индексы обоснованы запросами (key,at — countsSQL/nthMomentSQL/momentRecordedSQL; at — уборка; expires_at — уборка); ORM нет
  - subject: строка-якорь ведра в миграции
    verdict: ok — справочник продукта, не посев стенда: строка обязана существовать у любой установки (seed-predicate), ON CONFLICT DO NOTHING без цели

notes_nonblocking:
  - id: N1
    where: gateway/internal/idempotencypg/migrations/20261001190000_anon_mail_passes_key_not_empty.sql:1
    text: >-
      CHECK (key <> '') вынесен post-hoc ALTER, хотя обе миграции новые в одном неслитом диффе — конвенция
      «CHECK inline с CREATE TABLE». Довод файла («применённую не правим») держится, если 20261001180000 уже
      накатана на стенде; правка её теперь была бы хуже. Корректности не касается.
  - id: N2
    where: gateway/internal/middleware/anonmail/store_pg.go (nthMomentSQL)
    text: >-
      OFFSET в nthMomentSQL — выбор N-го момента окна для Retry-After, а не пагинация API; запрет OFFSET-пагинации
      сюда не относится. Стоимость ограничена порогом окна (offset = счёт − порог), индекс (key, at).
  - id: N3
    where: config.AnonMailPassRetention / уборщик
    text: >-
      Граница окна считается часами реплики, уборка — часами базы; запас 1 ч покрывает смещение меньше часа.
      Смещение меряется (ревью system-design I-2) — предмет system-design-reviewer, не схемы.

