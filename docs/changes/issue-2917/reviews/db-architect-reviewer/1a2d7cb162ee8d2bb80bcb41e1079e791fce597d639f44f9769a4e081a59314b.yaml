checked:
  - invariant: вызов PoW расходуется ровно один раз
    mechanism: pow_spent.id PRIMARY KEY + INSERT … ON CONFLICT (id) DO NOTHING RETURNING expires_at > clock_timestamp()
    verdict: ok — одноразовость держит оператор базы; срок судят часы базы в том же операторе, что и уборщик (expires_at <= now()); удаление уборщиком в полёте — вставка ждёт его фиксации, затем RETURNING даёт false
    probe: TestPg_O1_OneProofFromTwoSourcesAcrossTwoReplicasPassesExactlyOnce (с близнецом «pow_spent без первичного ключа»)
  - invariant: ведро общего потока не уходит в минус и не пропускает больше BURST
    mechanism: anon_mail_bucket — одна строка CHECK (id = 1), CHECK (tokens >= 0), SELECT … FOR UPDATE последней после ключей
    verdict: ok
    probe: TestPg_O2_BucketRaceAcrossTwoReplicasPassesExactlyBurst, TestPg_O2_BucketCheckKeepsTokensNonNegative (близнец без CHECK)
  - invariant: счёт окна ключа/подсети не превышает порог при гонке реплик
    mechanism: pg_advisory_xact_lock(int4,int4) по отсортированным парам ключей (порядок — без взаимной блокировки), затем счёт под READ COMMITTED свежим снимком оператора; окно сверху открыто (SEC-E2-1)
    verdict: ok — сериализуется ключ, а не строка; коллизия пары int4 только сужает параллелизм, корректности не меняет
    probe: TestPg_CX2_11_RaceOnANewKeyAcrossTwoReplicasPassesExactlyOne, TestPg_O3_SubnetThresholdRaceAcrossTwoReplicasPassesExactlyOne, TestPg_CX2_11_KeySpaceOfTheLockDoesNotMeetTheSchemaLock
