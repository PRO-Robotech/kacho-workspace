findings_nonblocking:
  - id: DB628-n1
    where: internal/repo/kaname/pg/recovery_code_repo.go:126-128 (ConsumeRecoveryCode, не в диффе)
    summary: >-
      Схема вводит состояние «вытеснен», оператор применения его не знает: WHERE consumed_at IS NULL без
      AND superseded_at IS NULL. Предъявление вытесненного кода → UPDATE нарушает recovery_codes_one_end_check
      → 23514 → ErrStoreUnavailable (наблюдатель StoreFailed) вместо «код отвергнут» с учётом попытки.
    why_not_blocking: >-
      Отказ fail-closed (доступа не даёт), строки «вытеснен» в этой фазе появляются только переносом —
      после исторической гонки двух запросов на стендах (прода нет, замысел §6); прежний код при следующей
      выдаче их удаляет. Предикат: строка с superseded_at, UPDATE consumed_at по ней → 23514 (та же форма
      утверждена пробой OneLiveCodePerPerson, последний шаг).
    order: "полоса кода восстановления (перевод вытеснения DELETE→UPDATE superseded_at) — добавить AND superseded_at IS NULL в оператор применения тем же изменением, что начнёт писать superseded_at; проба: вытесненный код → CodeRejected"
  - id: DB628-n2
    where: internal/apps/kaname/api/humansession/recovery_request.go:185-189
    summary: >-
      Прежний путь DELETE-затем-INSERT под новым частичным UNIQUE: при гонке двух запросов второй получает
      23505 → лог «code and letter not recorded» + StoreFailed, письма нет. Инвариант З12 держит база (верно);
      ответ вызывающему не меняется (постановка вне пути ответа) — оракула нет. Ложная классификация метрики.
    order: "та же полоса — вытеснение UPDATE под блокировкой якоря (recovery, key) по З11 сериализует запросы, гонка уходит"
  - id: DB628-n3
    summary: >-
      Замысел §6 снимает invite_mail_outbox / invite_mail_windows / source_request_windows той же миграцией;
      здесь — фаза расширения, снятие отложено в фазу сужения (живой код их читает). Это expand→contract, не обход;
      DROP и запись retired.json — обязанность полосы сужения (S8), NTF2-44 «таблицы очереди нет» до неё не зелёный.
  - id: DB628-n4
    summary: >-
      keeps-записи статистики для key_digest/address_digest держатся на утверждении «свёртка адреса С КЛЮЧОМ службы».
      Писателей этих колонок в диффе нет; при свёртке без ключа запись стала бы ложной (pg_stats понесёт
      словарно-обратимые свёртки адресов).
    order: "полоса, пишущая key_digest/address_digest, — проба, что свёртка ключевая (HMAC), иначе SET STATISTICS 0"

