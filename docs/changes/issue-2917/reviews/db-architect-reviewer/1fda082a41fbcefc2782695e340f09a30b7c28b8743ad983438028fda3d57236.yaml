approved:
  - "Перепись проверок охватывает 6 новых таблиц миграции 20261006151313 (invite_acts, mail_windows, mail_window_letters, pending_registrations, security_notice_ledger, trusted_devices) записью «пишет служба целиком» (nil). Сверено с DDL: все CHECK этих таблиц судят значения, которые чеканит служба (свёртки длиной 32, идентификаторы, закрытые словари вида и назначения, сроки, связка lettered↔feed_id). Присланное вызывающим в эти таблицы не попадает. Значит, 23514 на них — ошибка службы и фиксированный INTERNAL, а не InvalidArgument. Отображение соответствует sqlstate-to-grpc"
  - "Таблицы ленты распознаются предикатом corelib feed.TablesOf(\"kaname.kaname\").Has, литерала их имени нет (NTF1-B19). Негодный префикс отвергается сразу (проба TestCheckValueCensus_FeedPrefixIsAServiceName), законный близнец invite_mail_outbox лентой не признан. Проверки следующей версии схемы ленты попадают в полосу службы тем же предикатом"
  - "Решение о классе отказа остаётся в одном доме (checkValueLaneOf и writtenWhollyByService); адаптеры его не дублируют"
  - "Пробы кодов восстановления приведены к инварианту З12 (частичный UNIQUE recovery_codes_one_live_per_user): вторая выдача идёт порядком варианта использования (вытеснение, затем вставка в одной транзакции), а не обходом индекса. Индекс и прод-SQL не ослаблены"
  - "Миграции 20261006145953 и 20261006151313 в дельте не тронуты. Суждение прежних записей о них в силе: CHECK inline, FK внутри схемы, частичный UNIQUE с названным предметом, Up/Down"

blocking: []

non_blocking:
  - "Слияние PR #628 в 484-notify конфликтует по пину corelib (go.mod/go.sum/THIRD-PARTY-NOTICES). Схемы конфликт не касается. Его разрешает автор волны перед посадкой, после чего нужен перепрогон на новой голове. При разрешении в пользу 67ba344 база получает corelib со схемой ленты V3 (schema.Current()=V3), а миграция kaname остаётся V1. Перепись проверок при этом устойчива (isFeedTable). Пишет ли kaname исходы V2/V3 (SUPPRESSED/superseded/obligation) в таблицу V1 — предмет system-design-reviewer, не этой роли"
  - "isFeedTable при каждом вызове заново строит feed.TablesOf (судит префикс). Вызывается только на пути отказа 23514, так что на корректность это не влияет"

concurrent_probe:
