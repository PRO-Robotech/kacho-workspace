# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 28, маршрут
# редакции 27.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта редакции 28 против последней пересверенной
# (редакция 27, d5dfafcf…, запись revalidation/d5dfafcf….yaml — «к замыслу», CX2-95…97). Дельта не
# закоммичена: рабочее дерево issue-880 поверх c61a112cd (на c61a112cd design.md = d5dfafcf…, tasks.md =
# 43c1aae0… — ровно пересверенные).
#
# Итог — к замыслу. CX2-95, CX2-96, CX2-97 и правки консультации схемы (I1, m1, m3, O1) отображены и
# выдерживают условие. По CX2-97 автор отступил от буквы прошлой записи, и довод автора верен: буква
# записи была ошибкой этой роли (подробно в mapping_check). Новый пункт CX2-98 — в m2. Класс ожидания
# «истёкший срок контекста решения» на шаге ведра считает исчерпанием ведра и тот случай, когда общий
# бюджет решения (1,5 с = 6 × 250 мс) съели предыдущие шаги — блокировки ключей. Под атакой, которая
# держит блокировки подсети, это `critical` `AnonMailBucketExhausted` без насыщения ведра, то есть тот
# самый ложный сигнал, ради которого m2 и заводился.
