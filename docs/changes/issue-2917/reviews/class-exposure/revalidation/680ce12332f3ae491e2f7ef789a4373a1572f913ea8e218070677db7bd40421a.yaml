mapping_check:
  - item: CX2-95
    verdict: holds
    text: >-
      (1) Строка E2 несёт УК93, УК94, УК95, УК99 и O1; зависимость «посадка — Е21»; Е21 — строка §1
      маршрута, «открыта», гейтит посадку, а не старт. (2) NTF2-63 — только X2 и шапка; NTF2-69 (е) — X1
      (зависимость E1b, S5), строки S5 и E1b называют «уровень E на П1, X1». X1a зависит от E1a, D1, G3,
      S4, S5, S9 — E1b снята. (3) «подпись образа» в tasks.md → 0; в design.md осталось 2 вхождения, оба
      в истории (шапка и строка §11 CX2-95). Строка CX2-91 и УК87 пишут «метка образа». (4) Сигнал часов
      (`clock_skew`, `AnonMailReplicaClockSkew`, `clock_timestamp`) есть в строке E2
  - item: CX2-96
    verdict: holds
    text: >-
      (а) Ручка, форма файла, поле (`feed.ServerConfig.Keyring` и `Sealer`), стражи NTF1-B05, ось
      самоотчёта, отсутствие умолчания — З2 и §8. API corelib, названный замыслом, существует на
      @8a9eb14c: `LoadKeyring(knob, lookup, readFile)` отказывает с именем ручки, текст разбора — без
      материала (ошибка декодера заменена фиксированной строкой), `Report` печатает только
      идентификаторы. (б) Строка маршрута есть у каждого производителя: F3, S9, S11, D1, S8d, E1a, S9a.
      S9 получает поле через G1 ← F3. (в) Пробы в F3: `true` без ключа → отказ, близнец → старт;
      `false` → `NotApplicable`. Имя ручки расходится по форме с NTF-1 З11 (`KACHO_<SVC>_NOTIFICATIONS_FEED_KEYRING`)
      так же, как флаг kaname `notifications.enabled` с `KACHO_<SVC>_NOTIFICATIONS_ENABLED`: это конвенция
      kaname, а не второе имя одной ручки. Гейт `AuditNotifyWiring` судит рабочие процессы и Makefile, а
      не имена ручек. Остаток — форма предиката одного разбора (N-CX2-98a)
  - item: CX2-97
    verdict: holds
    text: >-
      Буква прошлой записи — «предпосылка: часы пробы раньше часов базы → не выполнилось» — была ошибкой
      этой роли. Управляемые часы стоят, база идёт, поэтому строгое отставание есть на каждом стенде, и
      условие запрещало бы все сценарии. Автор вывел предпосылку из того, что судит I1. При часах пробы,
      стоящих между выдачей вызова и предъявлением, `expiresAt = часы_пробы + срок вызова`, и база
      принимает доказательство тогда и только тогда, когда отставание плюс задержка оператора меньше
      срока вызова. Задержку ограничивает `anonMailDecisionBudget`, значит «отставание + бюджет < срок»
      — достаточное условие. Если сценарий двигает часы пробы вперёд (NTF2-62 (б), истёкший вызов), то
      отставание уменьшается или становится отрицательным, и это законно: I1 на П6 не испытывается, его
      держит integration-проба E2. Рост отставания за время прогона ограничен тем, что «каждая проба
      поднимает свой стенд» (строка E1a, design.md 1807). Сдвиг назад — «не выполнилось»
  - item: "I1 консультации схемы"
    verdict: holds
    text: >-
      Скобка `(t0+t1)/2` вокруг оператора счёта, который блокировок не берёт. Погрешность —
      полуоборот. Инъекция «skew от момента решения» при удержанной блокировке ключа 200 мс даёт
      ≈ −200 мс при пороге 100 мс — различима. Знак согласован с `skew = now реплики − база`
  - item: "m1, m3, O1"
    verdict: holds
    text: >-
      m1 — текст. m3 — набросок §6 несёт `NOT NULL`/`CHECK`, держатель — миграции E2 (не читались). O1 —
      порча одной `lockKeySQL` краснит пробу гонки и её вариант по доказательству, оба в строке E2
  - item: "m2 консультации схемы"
    verdict: mapped_with_new_exposure
    text: "шаг И класс введены, близнец «обрыв соединения» есть; класс «срок контекста решения» открывает CX2-98"

new_items:
  - id: CX2-98
    decision: "m2 (редакция 28): `…_bucket_wait_timeouts_total` растёт, когда ошибку вернул шаг строки ведра и класс — ожидание: `55P03`, `57014` либо истёкший срок контекста решения"
    class: >-
      code-authoring §«Чужой ответ: классификация и бюджет»: срок контекста — общий бюджет всех шагов
      решения, и его истечение на шаге ведра не говорит, что ждали ведро.
      code-authoring §«Решение и его следствие разнесены»: причину (бюджет съели блокировки ключей) и
      место, где она проявилась (шаг ведра), счётчик сливает
    exposure: >-
      Бюджет решения — 1,5 с = 6 × `anonMailStoreWait` (250 мс), по одному ожиданию на захват. На шаг
      ведра приходит остаток после захвата соединения, блокировок ключей (до трёх у IPv6) и пометки
      доказательства. Каждое из этих ожиданий ограничено `lock_timeout` порознь и может длиться почти
      250 мс, не давая `55P03`. Поэтому под атакой, которая держит блокировки подсети, решение доходит до
      шага ведра с остатком в единицы миллисекунд. Срок контекста истекает на операторе ведра, даже
      если строка ведра свободна. По m2 это «шаг ведра + класс ожидания»: `…_bucket_wait_timeouts_total`
      +1 и `AnonMailBucketExhausted` (`critical`) — о насыщении, которого нет. Именно такой ложный
      сигнал m2 должен был снять для обрыва соединения
    condition_on_code: >-
      (а) Срок контекста считается исчерпанием ведра только если оператор ведра отправлен с остатком
      бюджета не меньше `anonMailStoreWait`. Тогда истечение срока на нём означает, что ведро ждали не
      меньше предела одного ожидания. Остаток на входе шага функция решения знает (`ctx.Deadline()`).
      Меньший остаток — исход «бюджет исчерпан до шага ведра»: только `…_store_unavailable_total`.
      Вариант формы: шаг ведра идёт на своём контексте со сроком `min(остаток, anonMailStoreWait)`, а
      классификация — по тому, чей срок истёк. Перечень классов ожидания остаётся одним объявлением.
      (б) Близнец в E2: внешняя транзакция держит блокировки ключей подсети так, что решение входит в
      шаг ведра с остатком меньше `anonMailStoreWait`, строка ведра свободна → `…_bucket_wait_timeouts_total`
      +0, `…_store_unavailable_total` +1. Положительный: строку ведра держат дольше `anonMailStoreWait`
      при полном остатке → +1. Инъекция «срок контекста — ожидание без условия остатка» → близнец даёт
      +1 — красный. Остаток на входе шага печатается
    held_by: "проба E2 (запланирована); до правки держится вниманием"

