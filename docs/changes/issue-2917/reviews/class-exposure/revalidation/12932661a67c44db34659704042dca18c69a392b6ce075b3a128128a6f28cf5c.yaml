new_items:
  - id: CX2-82
    decision: >-
      З28 (а) «Таблица баз»: «распознаватель других правил не знает»; выражение, не совпавшее ни с одной
      строкой, — «не выполнилось». Б2 разрешает аргумент — строковый литерал либо `filepath.Join` литералов
      (одна косвенность: переменная пакета). Б6 разрешает `<имя> / <литерал>`. З28 (б) (1): слой в
      `helmTemplate` «одной строкой внутри помощника». (4): слой «в перечне аргументов записи
      `Chart("api-gateway", …)`»
    class: >-
      testing-verdict п.14 «Твой СОБСТВЕННЫЙ разборщик — тоже распознаватель»: множество форм, которые
      разбор принимает, объявлено, но не покрывает рабочих написаний двух семейств. code-authoring
      §«Контракт, который нельзя выразить»: закрытая таблица не выражает связь «элемент носителя → вызов».
      gate-authoring §«исход вместо объявления»: ни одна проба не прогоняет рабочее написание семейств
      (1) и (4) через таблицу с печатью строки
    exposure: >-
      На 2564 `helmTemplate` собирает аргументы так: `args := []string{"template", "."}` (строка 36),
      `args = append(args, "--set", s)` в цикле по параметру (38), `exec.Command("helm", args...)` (40).
      Слой «одной строкой внутри помощника» попадёт в литерал среза или в `append`. В самом вызове
      `exec.Command` аргумента `-f` не будет, будет `args...`. Срез при этом смешанный: рядом стоят
      элементы-параметры `s`. В `check-volume-mounts.py` слой кладётся в список `required` записи
      `Chart("api-gateway", "gateway/deploy", [...], …)` (116–117). Дальше он идёт в
      `renders()` → `sets = list(self.required)` (95), затем `render` → `subprocess.run([... str(REPO /
      chart.path)] + sets)` (313). Вызов helm видит `+ sets`. Ни Б2, ни Б6 не говорят, как элемент
      носителя (локальный срез с `append`; поле записи через метод) связывается с вызовом. По
      объявленному правилу «других правил не знает» открыты два исхода. (1) Рабочее написание 8 вызовов
      `helmTemplate` и записи `api-gateway` даёт «не выполнилось», перепись D6 не зеленеет никогда, и
      возвращается ветка (1) CX2-81 с соблазном ослабить исход. (2) Исполнитель молча дописывает
      распознавателю поиск `"-f"` по всему файлу. Правило тогда не объявлено, и `-f`, который до вызова не
      доходит (другой срез, мёртвая запись), считается слоем вызова. Близнецы «литерал `../../deploy/…`
      (Б1 + Б2) → молчит» в §11 CX2-81 и D6 предполагают исход (2), но таблица его не даёт
    condition_on_code: >-
      (а) В таблице баз есть строки носителя аргумента для каждого семейства, где `-f` не стоит в самом
      вызове. Go: `exec.Command("helm", <v>...)`, где `<v>` — локальная переменная той же функции,
      присвоенная литералом среза и расширяемая только `<v> = append(<v>, …)`. Элемент, следующий за
      `"-f"` в литерале или в `append`, разрешается по Б2. Параметр, вызов функции или иное присваивание
      `<v>` дают «не выполнилось». Python: элемент, следующий за `"-f"` в списке `required` литерала
      `Chart(…)`, если путь `required → renders() → render(…) + sets` в том же файле. Он разрешается по
      Б6. Иной путь списка к `subprocess.run` даёт «не выполнилось». Либо (б) в замысле выбрано написание,
      при котором `-f` и путь стоят в самом вызове, и эта строка таблицы не нужна. Для `helmTemplate` это
      противоречит «одной строке внутри помощника» с `args...`, поэтому выбор за автором замысла. (в) Проба:
      рабочее написание `helmTemplate` и записи `api-gateway` проходит перепись и печатает строку таблицы
      носителя. Инъекция «элемент после `"-f"` — переменная» или «`<v>` присвоен результатом функции» даёт
      «не выполнилось» с координатой, близнец-литерал молчит. Строка «`-f` в срезе, не доходящем до
      `exec.Command`» (второй локальный срез в той же функции) даёт «не выполнилось», а не зелёный
    held_by: >-
      Нужна проба (в) в строке D6, её нет. До отображения держится вниманием. Громкий исход (1) тих только
      в том смысле, что толкает ослабить таблицу. Тихий исход — (2)
  - id: CX2-83
    decision: >-
      §11 CX2-81, проба самоистечения: «строка таблицы, чьё выражение снято из всех семейств (инъекция:
      строка Б6 при `REPO` через иной вызов в копии) → красный с именем строки, близнец — таблица дерева →
      молчит». УК77 и D6 формулируют ту же пробу без способа инъекции
    class: >-
      change-graph «отрицательный кейс меняет ровно один факт против положительного близнеца».
      testing-verdict «не выполнилось ≠ красное»: правило сложения двух исходов одного прогона не объявлено
    exposure: >-
      `REPO` через иной вызов в копии `check-volume-mounts.py` меняет сразу два факта. Строка Б6 перестаёт
      встречаться в семействах, и это красный самоистечения. База вызова семейства (4) перестаёт
      устанавливаться: выражения нет в таблице, и это «не выполнилось» по З28 (а). Замысел не говорит,
      какой исход у прогона, где есть оба. Если «не выполнилось» поглощает прогон (прогон
      недействителен), ожидаемого пробой «красного с именем строки» нет, и проба падает на верной
      реализации. Если поглощает красный, исполнитель сам выбирает правило сложения, и это исход, не
      объявленный замыслом
    condition_on_code: >-
      (а) Инъекция самоистечения меняет один факт: в копию таблицы добавлена строка с выражением, которого
      нет ни в одном семействе, семейства не тронуты. Результат — красный с именем строки и без «не
      выполнилось». Близнец — таблица дерева, молчит. Либо (б) инъекция Б6 сохранена, но в З28 (а)
      объявлено правило сложения: самоистечение печатается и судится независимо от баз вызовов, итог
      прогона с обоими исходами назван, проба утверждает оба
    held_by: "правкой одной строки §11 CX2-81 (УК77 и D6 уже нейтральны); до неё держится вниманием"

