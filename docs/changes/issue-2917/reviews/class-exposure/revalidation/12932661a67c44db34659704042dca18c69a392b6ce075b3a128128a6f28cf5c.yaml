# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 18.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки прежних редакций относятся к своим
# редакциям и здесь не переписываются. Судится дельта редакции 18 против последней пересверенной
# (редакция 17, c98dd9d3): git diff 4dfded83a 3b0c50501 -- docs/changes/issue-2917/{design,tasks,change}.*.
# Итог: к-замыслу. CX2-81 отображён: таблица баз Б1–Б8 (З28 (а), М72), вариант «корень, вычисленный
# помощником» снят, пробы (в) названы в §11, УК77 и строке D6. Замечание о единственной точке переписи
# `-f` в `sweep` исполнено. Новых решений механизма нет. Новых пунктов два, оба выросли из самого
# отображения:
#   CX2-82 — таблица объявлена закрытой («распознаватель других правил не знает»), но у двух семейств
#            аргумент `-f` в вызов helm приходит не выражением вызова, а данными: в `helmTemplate` через
#            локальный срез с `append` и `args...`, в `check-volume-mounts.py` через поле записи `Chart`.
#            Строки, связывающей элемент такого носителя с вызовом, в таблице нет. По объявленному правилу
#            рабочее написание семейств (1) и (4) даёт «не выполнилось», а это ветка (1) CX2-81.
#   CX2-83 — проба самоистечения таблицы в §11 CX2-81 («строка Б6 при `REPO` через иной вызов в копии»)
#            меняет два факта: строка Б6 перестаёт встречаться, и база семейства (4) перестаёт
#            устанавливаться. Ожидаемый красный совпадает с «не выполнилось», правила их сложения нет.
