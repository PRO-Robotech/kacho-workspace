items:
  - id: CX2-36
    source: >-
      З14 «Ёмкость выводов» (ожидание места доли register в сроке работы 30 с, доля = 1), З13
      (mailDispatchInFlight = 16, общий для recovery и register), приёмка Р8 строка «край · общий
      поток» (20 rps, всплеск 100 — выше вызов PoW, а не отказ)
    kind: decision
    class: >-
      code-authoring §«Решение и его следствие разнесены» (темп производителя выше темпа
      применения, общий счётчик мест); §«Чужой ответ: классификация и бюджет» (бюджет ожидания,
      тратящий чужой ресурс)
    exposure: >-
      работа register занимает место диспетчера до того, как ждёт место доли, и держит его всё
      ожидание — до 30 с. Пропускная способность доли — одна работа на два вывода argon2id
      (64 МиБ, 3 прохода) за раз. Поток пропущенных register на разные свободные адреса окно
      адресата не ограничивает (оно считает по адресу, а не число адресов); его верх — край:
      общий поток сверх 20 rps переходит на вызов PoW, а не на отказ. Когда поток выше
      пропускной способности доли, все 16 мест диспетчера занимают ожидающие register, и работа
      recovery получает dropped_overload у диспетчера: письмо восстановления владельцу адреса
      не уходит из-за чужих регистраций. До редакции 3 этого не было: без ожидания работа
      register освобождала место сразу. Та же непокрытость у входа: на профиле с ёмкостью
      проверяющего 1 доля при таком потоке занята непрерывно, и вход паролем получает отказ по
      ёмкости всё время потока; замысел называет цену «два вывода на пропущенное письмо» — на
      одно письмо, а не долю времени при потоке на верхней границе края.
    condition: >-
      (а) ожидание доли register не держит место диспетчера, общее с recovery: у register своя
      часть мест диспетчера (не больше k из 16, recovery сохраняет не меньше 16 − k — k с
      доводом), либо register ждёт долю до занятия места диспетчера и при переполнении своей
      очереди кончается своим исходом; (б) цена для входа названа потоком: доля времени, когда
      место проверяющего занято выводами register при потоке на границе Р8, — и для профиля с
      ёмкостью 1 либо выводы register ограничены темпом (ведро на доле, оставляющее входу
      объявленную долю времени), либо цена принята решением с этим числом; (в) recovery не
      отбрасывается диспетчером из-за ожидающих register — это утверждает проба, а не довод.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: >-
      нет: нужна проба «16 работ register ждут долю, приходит recovery → recovery исполнена, не
      dropped_overload» с близнецом без разделения мест (красный) и проба входа на ёмкости 1 при
      непрерывном потоке register — заказ

