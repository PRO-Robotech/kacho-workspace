  - id: CX2-35
    design: "З11, З18, З26, §6"
    verdict: holds
    note: >-
      условие к коду пересверки c3e37381 вписано решением: транзакцию работы окна открывает одна
      mail_window_repo.BeginWindowWork с pgx.TxOptions{IsoLevel: pgx.ReadCommitted}, возвращает тип
      WindowTx; LockAnchor и прочие операторы работы окна принимают только WindowTx, нулевой
      WindowTx — ошибка до первого оператора (тот же приём, что address.Normalized: непустое
      значение строит одна функция). Все три работы окна — recovery, register (через диспетчер) и
      verify-email (на пути запроса, П4) — зовут LockAnchor и поэтому проходят через
      BeginWindowWork. Держатели: проба current_setting('transaction_isolation') внутри WindowTx →
      read committed с близнецом RepeatableRead (проба различает); проба (в) через
      BeginWindowWork с близнецом-инъекцией RepeatableRead → ошибка сериализации вместо повтора —
      красный. Маршрут: полоса G2.
  - id: CX2-36
    design: "З13, З14"
    verdict: holds
    note: >-
      (а) места разделены: recovery 12, register 4, сумма 16; класс, чьи места заняты, —
      dropped_overload своего глагола, чужих мест не берёт; k = 4 с доводом (доля = 1, пятая
      ожидающая не получила бы вывода раньше повтора). Посылка М33 подтверждена: у GoDispatcher
      одно поле inFlight и один cap, отказ при inFlight >= cap (dispatch.go:94), единственный
      прод-вызов Dispatch — recovery_request.go:147, так что третьего класса, оставшегося без
      мест, нет. (б) пауза доли = время, которое выводы держали место проверяющего: место занято
      выводами register не больше 2d из каждых 4d, то есть ≤ 1/2 времени при любом потоке —
      арифметика верна, включая порог насыщения 20 rps > 1/(4d) ⇔ d > 12,5 мс. Цена для входа
      названа потоком (доля времени) и принята решением диспетчера (registerSharePause = 1) —
      ровно исход «цена принята решением с этим числом» условия (б). (в) recovery не
      отбрасывается ожидающими register — утверждает проба классов с близнецом «один счётчик на
      16» (красный), а не довод; проба доли времени на управляемых часах при c = 1 с близнецом
      registerSharePause = 0. Маршрут: полоса S12.
      Условие к коду (к-коду, не отказ отображения): гашение дожидается работ ОБОИХ классов.
      Сегодня loginLane держит один *GoDispatcher и drain зовёт его Wait (loginlane.go:144,
      serve.go:1720 — после остановки слушателей). Если классы будут сделаны двумя экземплярами
      диспетчера, а не классами внутри одного, drain обязан ждать оба; иначе работы второго
      класса обрываются гашением молча. Держит проба «работа каждого класса в полёте → drain
      возвращается только после обеих» — заказ полосе S12. Синхронный путь «после остановки
      работа на месте» (dispatch.go) при этом недостижим для нового запроса: drain стоит после
      stopGRPCBounded и stopSurfaces, новых запросов нет — оракула времени на пути ответа
      register при гашении не возникает.

