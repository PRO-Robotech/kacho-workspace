# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 27, маршрут
# редакции 26.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта редакций 26 и 27 против последней пересверенной
# (редакция 25, ba5ab10d…, запись revalidation/ba5ab10d….yaml — «к замыслу», CX2-89…94). На редакцию 26
# (84da9b7e…) пересверки не было. Дельта не закоммичена: рабочее дерево issue-880 поверх a3662915b.
#
# Итог — к замыслу. CX2-89…94 и сторона NTF-2 пунктов CX1-106, CX1-108 отображены в замысле. Новые пункты:
# (1) CX2-95. Маршрут (tasks.md) остался на редакции 26 и не отображает решений редакции 27 (Д70, Д71):
# в маршруте ноль упоминаний I-1…I-3, Е21, правила `AnonMailReplicaClockSkew`, метрики расхождения часов.
# E2 по-прежнему гонит NTF2-63 на П6, X1a и S5 — NTF2-69 (е) на П6, хотя приёмка редакции 30 и З8 перенесли
# оба на П1. E1a читает ревизию kaname «из подписи образа», а З8 — «из метки, подписи нет»; строка CX2-91
# в §11 замысла тоже говорит «подписи». (2) CX2-96. Ручки ключа ленты kaname нет нигде в документах
# NTF-2. Источник с флагом `true` в боевой посадке без кольца ключей не стартует (NTF1-B05,
# `corelib notify/feed/seal.go`), а Д67 включает флаг на стендах kaname, D1 — в зонтике, E1a — на П6.
# (3) CX2-97. Срок доказательства судят часы базы (I1), часы ограничителя на П6 — часы пробы, которые
# расходятся с базой по построению, и начальный момент этих часов не назван. Сценарии с доказательством
# на П6 зависят от знака расхождения.
