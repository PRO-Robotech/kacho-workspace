new_items:
  - id: CX2-95
    decision: "редакция 27 замысла (Д70, Д71) при маршруте редакции 26"
    class: >-
      doc-truthfulness: два места об одном предмете, и верно одно из них. change-graph §4: решение замысла
      без строки маршрута не исполняется никем
    exposure: >-
      (а) Д71 в маршруте не отражён. В tasks.md упоминаний 0: `clock_skew`, `AnonMailReplicaClockSkew`,
      «только под жетон», I-1, I-2, I-3, Е21, Д70, Д71. В строке E2 нет держателей УК93 (шаг ведра не
      вызван при `Reject`, ступени ключа и свежем доказательстве), УК94 (gauge, счётчик, WARN, третье
      правило в объекте, на странице и в сверке) и УК95 (проба «число до замера без номера задачи»,
      проба значений по цепочкам). Нет и зависимости E2 от Е21. (б) Д70 тоже не отражён. Строка E2: «NTF2-…
      62, 63, 74, 79 на П6 зелёные». X1a: «NTF2-90…93, 95, 96, NTF2-69 (е)» на П6 и зависимость E1b. S5:
      «NTF2-69 (е) — X1a на П6». Приёмка редакции 30 ставит NTF2-63 уровнем E в пробу NTF2-72 на П1, а
      NTF2-69 (е) — уровнем E (newman) на П1. Строка X2 NTF2-63 не называет, полосы newman для NTF2-69 (е)
      на П1 нет. (в) Шапка tasks.md — «Редакция 26, маршрут под редакцию 26 замысла»; маршрут
      редакции 27 не написан. (г) E1a в маршруте и строка CX2-91 в §11 замысла пишут «подпись образа», а З8
      (Д70) — «метка, подписи у образа kaname нет (`--provenance=false`)»
    condition_on_code: >-
      Маршрут редакции 27. (1) E2 несёт держателей УК93…УК95 дословно по З8: модульная проба (а)–(г) и
      integration-проба удержанной строки; пробы 0,5 / 1,5 / −1,5 с, gauge ±100 мс, третье правило в
      объекте, на странице и в сверке; проба «число до замера без номера» с близнецом; инъекция
      «`false` по причине “не измерено”» в цепочке с видом `PrometheusRule`. Зависимость — Е21 (посадка).
      (2) NTF2-63 — в строке X2 (проба NTF2-72 после шага 3), NTF2-69 (е) — в полосе newman на П1 с
      зависимостью E1b и S5; из E2, X1a и S5 оба сняты. (3) «подпись» → «метка» в E1a и в §11 (CX2-91),
      печать «метка = самоотчёт = пин»
    held_by: "ревью маршрута; гейта полноты «решение замысла → строка маршрута» нет — держится вниманием"

  - id: CX2-96
    decision: "Д67: стенды дерева kaname поднимают kaname с `notifications.enabled: true` без читателя ленты (S8d «флаг стендов — true»); D1 — флаг kaname `true` в зонтике; E1a — процесс kaname из образа с флагом `true`; S11 — поставка kaname с флагом; S9a — kaname на П6-k"
    class: >-
      security-hardening `hard-missing-knob-vs-unseeded`: нужной ручки нет в продукте, и посевом её не
      завести. code-authoring §«Умолчание, которое становится утверждением»: стенд с флагом `true`
      утверждает, что kaname запечатывает секреты ленты, а ключом печати его никто не снабдил
    exposure: >-
      Строки ленты kaname несут секретный атрибут (код `recovery`, приглашение — приёмка NTF-2,
      «секретный атрибут пуст» после `Ack`). Источник запечатывает его кольцом ключей ленты: `Keyring`
      `{активный, прежний}` в `corelib notify/feed/seal.go` @77-notify, порт `put_source.go`. В NTF-1 З11
      ключ — ручка источника, «без неё боевая посадка с флагом `true` не стартует» (NTF1-B05). В
      документах NTF-2 ручки ключа ленты kaname нет: в design.md, tasks.md и приёмке совпадений
      `keyring|ключ ленты|FEED_KEY` — 0. Ключи `authn.secrets.*` (F3) — другие: ключ окна и ключ метки
      устройства. Без этой ручки (а) kaname с флагом `true` в боевой посадке либо не стартует — тогда
      красные `stand-own.sh up`, `stand-chart.sh up`, `e2e-newman` kaname (S8d), подъём зонтика (D1) и
      E1a, — либо запечатывает ключом, который приходит неизвестно откуда; (б) у поставки kaname (S11)
      нет блока значений под этот ключ, и «установка kaname своим чартом рядом с notify» повторяет
      CX2-94 с другой ручкой
    condition_on_code: >-
      (а) Замысел (З2 или З18) называет ручку ключа ленты kaname по конвенции kaname (ключ файла и/или
      переменная пространства `__`), её форму («путь к секрету», активный и прежний) и поле
      `feed.Config`, куда она идёт. Стражи старта — NTF1-B05: флаг `true` в боевой посадке без ключа —
      отказ старта с именем ручки, самоотчёт называет ось ключа. Строка §8.
      (б) Каждому производителю — строка маршрута: F3 (поле и страж), D1 (секрет в подчарте kaname
      зонтика), S11 (блок поставки и проба рендера), S8d (ключ на `stand-own.sh` и `stand-chart.sh`), E1a
      (процесс kaname на П6), S9a (П6-k).
      (в) Пробы: старт kaname с флагом `true` без ключа — отказ с именем, близнец с ключом — старт.
      `stand-own.sh up` на голове S8d печатает ось ключа в самоотчёте kaname
    held_by: "NTF2-50 и стражи F3 ключа ленты не судят; гейта нет — нужен (а)"

  - id: CX2-97
    decision: "I1 (З9): оператор пометки вставляет строку `pow_spent` только при `$expiresAt > now()` по часам базы; Д68/E1a: на П6 часы пробы — у ограничителя, «расходятся с базой по построению» (Д71 I-2)"
    class: >-
      code-authoring §«Решение и его следствие разнесены»: решение «срок судят часы базы» принято в З9, а
      его следствие наступает на стенде П6, где часы ограничителя по построению не часы базы.
      measurement-discipline §«Откуда читается предмет»: условие стенда (начальный момент часов) не
      названо и не напечатано
    exposure: >-
      `$expiresAt` вычисляют часы реплики, на П6 — часы пробы. Если они отстают от часов базы testcontainers
      больше срока доказательства (например, часы стартуют с фиксированного момента ради детерминизма), то
      `$expiresAt > now()` ложно для каждого доказательства. Тогда каждое предъявление получает `Reject` с
      новым вызовом, и NTF2-59…62, 74, 79 на П6 краснеют с причиной «ограничитель отверг», а не «стенд не
      создан». Если часы пробы опережают базу, проверка I1 на П6 не срабатывает никогда. Её утверждает
      только integration-проба E2 (сдвиг −10 с), и это законно, но П6 тогда I1 не испытывает. В З8 и E1a
      начальный момент часов пробы не назван: в design.md «часы пробы» встречаются 7 раз, начальный
      момент — 0
    condition_on_code: >-
      (а) Часы пробы на П6 стартуют с `clock_timestamp()` базы ограничителя, прочитанного при подъёме
      стенда, и только идут вперёд. Положительный контроль печатает начальный момент и расхождение.
      (б) Предпосылка стенда: часы пробы раньше часов базы — «не выполнилось» с обоими моментами, до
      сценариев. Инъекция «начальный момент = база − (срок + 1 с)» → «не выполнилось», а не красный
      сценария. (в) Сценарий П6, который сдвигает часы пробы назад, стенд отклоняет как «не выполнилось»
      с причиной (тем же правилом, что «Тогда» на часах kaname/notify)
    held_by: "положительный контроль E1a (запланирован); начальный момент и предпосылка не названы — до правки держится вниманием"

remarks:
  - >-
    Д71 I-2: gauge `…_clock_skew_seconds` хранит последнее измерение реплики. Реплика без решений держит
    старое значение, и правило по `max(abs(…))` может звонить по устаревшему замеру. Звено решений
    анонимное и частое, поэтому пункта нет. Если правило будут судить на тихом флоте, нужна отметка
    момента измерения
  - >-
    E1b: сопоставитель `retry-after` → `Retry-After` действует для всех служб за краем. Закрытый ключ
    и отсутствие своего обработчика ошибок край держит пробой мультиплексора. Пункта нет

