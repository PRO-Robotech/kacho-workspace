items:
  - id: CX2-28
    source: "З8, З9 (Admit и одноразовость вызова ходят в хранилище края на пути анонимного запроса)"
    kind: external_call
    class: "code-authoring §«Чужой ответ: классификация и бюджет»; §«Умолчание, которое становится утверждением» (третий исход «не смог спросить»)"
    exposure: >-
      при postgres-хранилище каждый запрос recovery/register зовёт базу края дважды (решение окна и
      одноразовость вызова). Исход «хранилище не ответило / блокировка не получена в срок» замысел не
      называет, поэтому реализация выберет его сама — «пропустить» делает ограничитель выключенным
      при сбое базы. Ведро общего потока — одна строка под той же блокировкой, то есть все
      анонимные почтовые запросы флота сериализуются на одной строке.
    condition: >-
      (а) у Admit и проверки одноразовости закрытый тип исходов, в котором отказ хранилища — свой
      исход, отвечающий отказом (не пропуском) с фиксированным текстом и счётчиком; (б) время
      ожидания блокировки ограничено величиной с доводом, превышение — тот же исход; (в) строка ведра
      берётся последней в фиксированном порядке и держится только на время решения.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "нет: нужна модульная проба «хранилище недоступно → отказ, до kaname не дошло, счётчик +1» и близнец «хранилище исправно → пропуск» — заказ"
  - id: CX2-29
    source: "З14, §6 (уборка pending_registrations, mail_window_letters, security_notice_ledger, anon_mail_passes, pow_spent)"
    kind: async_path
    class: "code-authoring §«Решение и его следствие разнесены» (срок хранения короче окна, которое его читает); §«Контракт, который нельзя выразить» (граница в двух местах)"
    exposure: >-
      моменты mail_window_letters удаляются через at + 25 ч с доводом «окна длиннее суток нет, Р8».
      Опровергнуто таблицей Р8: authn.login.mail-throttled-interval — ориентир 7 сут, граница 1–30
      сут, и строки вида throttled лежат в той же таблице. Через 25 ч след письма о торможении
      исчезает, и следующее ставится раньше интервала: NTF2-68 (б) (в Ts + Ti − 1 с новой строки
      нет) красен на верной приёмке. Срок хранения моментов края (at + 24 ч) и граница окон края
      (≤ 24 ч) — два литерала одной величины.
    condition: >-
      срок хранения каждой таблицы моментов выводится из верхней границы окон, которые её читают,
      взятой из той же таблицы границ, что судит страж (З23), а не литералом: для throttled — не
      меньше 30 сут (либо свои строки с таким сроком), для прочих видов kaname и для края — не
      меньше наибольшего окна, строго больше границы.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF2-68 (б) покраснеет только на П6 с управляемыми часами и уборкой, сдвинутой на срок; нужна модульная проба «срок хранения ≥ верхней границы каждого читающего окна» над таблицей границ — заказ"
  - id: CX2-30
    source: "З10 (решатель вызова в выделенном Worker консоли, собственная SHA-256)"
    kind: async_path
    class: "code-authoring §«Решение и его следствие разнесены» (отмена, не доходящая до исполнителя); §«Контракт, который нельзя выразить» (две реализации одной функции)"
    exposure: >-
      поиск nonce идёт вне потока формы без названного срока жизни: уход со страницы или повторная
      отправка оставляют прежний Worker работающим; решение, найденное после expiresAt, край
      отвергнет новым вызовом, и консоль по правилу «второй вызов подряд — отказ» покажет отказ
      законному пользователю. Хеш считается двумя реализациями (Go у края, своя на TS в консоли).
    condition: >-
      (а) Worker завершается при размонтировании и при новой отправке; (б) поиск прекращается до
      expiresAt с запасом, и истёкший поиск — свой исход, отличимый от «второго вызова»; (в)
      реализация SHA-256 консоли и проверка края судятся общими векторами (одни входы → одни
      ответы), расхождение — красный.
    mapped_in_design: false
    outcome: к-коду
    held_by: "пробы З10 названы (решатель, submit), но не покрывают (а)–(в) — заказ веток"
  - id: CX2-31
    source: "§5 (GetVerifiedAddressResponse: Eligibility с нулевым ELIGIBILITY_UNSPECIFIED; address пуст «иначе»)"
    kind: sentinel
    class: "code-authoring §«Умолчание, которое становится утверждением»"
    exposure: >-
      нулевое значение перечисления и пустая строка — законные состояния провода, неотличимые от
      «поле не заполнено». Читатель, ветвящийся «ELIGIBLE → шлём, иначе DENIED(recipient)», примет
      сбой сериализации за неподходящего адресата; читатель «адрес непуст → шлём» — наоборот.
    condition: >-
      сервер никогда не отдаёт UNSPECIFIED; ELIGIBLE ⇔ адрес непуст — утверждается сервером; notify
      трактует UNSPECIFIED и ELIGIBLE с пустым адресом как ошибку протокола (строка не закрывается
      DENIED(recipient)); пробы на оба нарушения.
    mapped_in_design: false
    outcome: к-коду
    held_by: "NTF2-92, 96 утверждают только NOT_ELIGIBLE; нужна проба читателя на UNSPECIFIED — заказ (читатель — notify, NTF-1)"
  - id: CX2-32
    source: "З11 («окно считает момент, только если строка ленты не закрыта EXPIRED(platform_unavailable)»; feed_id NULL — «считается отправленной»)"
    kind: sentinel
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения); §«Умолчание, которое становится утверждением»"
    exposure: >-
      запрос окна kaname читает исход строки таблицы, чью схему владеет генератор NTF-1, литералом
      исхода и причины — второе написание перечисления corelib. NULL в feed_id означает «строку
      удалила уборка», но колонка допускает NULL и при вставке, так что «не связано» и «удалено»
      неотличимы.
    condition: >-
      (а) предикат «строка вернула лимит» — экспорт corelib notify/feed (функция или фрагмент
      запроса), а не литерал в kaname; (б) момент окна пишется после feed.Put с непустым feed_id,
      и вставка с NULL — ошибка кода, судимая пробой.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF2-07 держит возврат лимита на П6; расхождение литерала с corelib не держит никто — заказ"
  - id: CX2-33
    source: "З14 (register/confirm сверяет пароль с каждой живой ожидающей записью адреса; ретрансляция confirm без ограничителя края, П3)"
    kind: decision
    class: "code-authoring §«Унификация и стоимость» (стоимость на строку на анонимном пути); security-hardening.md hard-authn-failures-byte-identical"
    exposure: >-
      свёртка пароля kaname — argon2id (64 МиБ, 3 прохода; passwordverify). Сверка по каждой живой
      записи делает цену и время ответа confirm пропорциональными числу записей адреса (до per-day +
      ⌈24 ч / floor-interval⌉ = 44 на границах Р8), а время ответа — зависящим от того, есть ли у
      адреса ожидающие записи.
    condition: >-
      на confirm ровно одна сверка пароля при любом числе записей: код сравнивается постоянным
      временем со всеми живыми записями, пароль — только с записью совпавшего кода, при отсутствии
      совпадения — сверка с фиктивной свёрткой той же цены.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "нет: нужна проба «число вызовов сверки пароля на confirm = 1 при 0, 1 и 44 записях» — заказ"

measurements:
  - claim: "§0 замысла: приёмка NTF-1 — 530e2296"
    command: "sha256sum docs/specs/sub-phase-NTF-1-notification-gateway-core-acceptance.md; ls docs/specs/reviews/sub-phase-NTF-1-notification-gateway-core-acceptance/ | grep -E '^(530e|d524)'"
    result: "устарело: действующее одобрение — редакция 10 d524e7bd…; в ветке уже редакция 11 4d042803… (89250d24e) без вердикта; 530e2296 — прежняя одобренная"
  - claim: "К1, К2 — расхождения NTF-1 и NTF-2 не сняты"
    command: "grep -c NOTIFICATION_DELIVERY_NOT_CONFIGURED …NTF-1….md; grep -c MAIL_DELIVERY_DISABLED …NTF-1….md; grep -n 'service:kaname' …NTF-1….md"
    result: "подтверждено на d524e7bd и на 4d042803: 2 и 0; Р3 «service:kaname не заводится» (строка 404 и 424 соответственно), NTF1-F21 — исключение службы доступа без namespace"
  - claim: "М15: TestMRW07 судит только seed.serviceAccounts и seed.joins"
    command: "git -C project/kaname show 734f69fb4:internal/servicemanifest/seed_form_test.go | sed -n 88,101p; … manifest.embedded.yaml | sed -n 66,67p"
    result: "подтверждено машинно; сообщение теста и комментарий манифеста называют основанием решение «своей служебной записи у службы доступа не бывает» — спор о смысле, не о коде (вопрос владельцу)"
  - claim: "З5: плоские имена окружения kaname объявлены одним перечнем flatEnvKnobs"
    command: "git -C project/kaname grep -hoE '\"KANAME_[A-Z0-9_]+\"' 734f69fb4 -- '*.go' ':!*_test.go' | tr -d '\"' | grep -v __ | sort -u (42) против литералов flatEnvKnobs (service_link_collision.go:146-170, 12); git … grep -n envconfig internal/apps/kaname/config/mtls.go"
    result: "опровергнуто: вне перечня 30 имён; третий механизм — envconfig с приставкой (mtls.go) (CX2-03)"
  - claim: "З16: пять форм записи audit_outbox — все"
    command: "git -C project/kaname grep -liE 'insert\\s+into\\s+(kaname\\.)?audit_outbox' 734f69fb4 -- 'internal/migrations/*.sql' | wc -l; … show …:internal/migrations/grant_removal_trace.go | sed -n 1,40p"
    result: "опровергнуто: ещё 3 миграции; гейт TestMigrationRemovingGrantsLeavesATrace требует SQL-след в audit_outbox (CX2-05)"
  - claim: "З11: в kaname нет нормализации ящика, кроме Normalize"
    command: "git -C project/kaname grep -n 'AddressKey(' 734f69fb4 -- ':!*_test.go'"
    result: "опровергнуто: func AddressKey в humansession/rate.go:56, 12 вызовов в 10 файлах (CX2-20)"
  - claim: "З24: строки приглашений — моменты писем"
    command: "git -C project/kaname show 734f69fb4:internal/migrations/0001_initial.sql | awk '/CREATE TABLE kaname.users \\(/,/\\);/'; … ls-tree internal/apps/kaname/api/user/ | grep -iE 'invite|delete'; … show …:api/user/resend_invite.go | grep -n mailLimit"
    result: "опровергнуто: приглашение — строка users (PENDING), есть delete.go и resend_invite.go (письмо без строки, сегодня под invite.mail-rate-limit) (CX2-21)"
  - claim: "§6: окна длиннее суток нет — моменты хранятся at + 25 ч"
    command: "sed -n 637p docs/specs/sub-phase-NTF-2-identity-provider-mail-removal-acceptance.md"
    result: "опровергнуто: mail-throttled-interval 7 сут, граница 1–30 сут (CX2-29)"
  - claim: "З8: край и модель прав читают адрес одним оператором"
    command: "git -C project/kacho grep -nE 'NewContextExtractor\\(|newClientAddressOperator' 6edea09c2ee -- gateway ':!*_test.go'"
    result: "подтверждено: одна функция-конструктор, два вызова (main.go:185, :1580); в конструкторе умолчание trustedProxyCount = 1 (CX2-12)"
  - claim: "З7: снятие оси источника kaname не оставляет полосу формы без ограничителя"
    command: "git -C project/kaname show 734f69fb4:deploy/values.yaml | sed -n 218,237p"
    result: "подтверждено: полоса формы — взаимный TLS, вызывающий — ровно край по SAN; других путей к register/recovery нет"
  - claim: "З13: ёмкость 16 меньше пула базы kaname"
    command: "git -C project/kacho grep -n maxConns 6edea09c2ee -- deploy/helm/umbrella/charts/kaname/values.yaml deploy/helm/umbrella/values.dev.yaml; git -C project/kaname show 734f69fb4:internal/apps/kaname/config/defaults.go | grep -n max-conns"
    result: "80 и 40 на профилях; умолчание процесса 0 (умолчание драйвера) — отношение не держится ничем (CX2-17)"
  - claim: "CX2-33: цена сверки пароля"
    command: "git -C project/kaname grep -nE 'argon2\\.IDKey' 734f69fb4 -- ':!*_test.go'; … show …:internal/domain/password_cost_class.go | sed -n 59p"
    result: "argon2id memory=65536 iterations=3 parallelism=4"
  - claim: "change.yaml отражает приёмку, на которой стоит замысел"
    command: "grep -n 'acceptance_sha256\\|lifecycle_state' docs/changes/issue-2917/change.yaml"
    result: "нет: acceptance_sha256 = 33e199c9…, ISSUE_READY; замысел стоит на 9098d6ef (манифест сам это называет)"

