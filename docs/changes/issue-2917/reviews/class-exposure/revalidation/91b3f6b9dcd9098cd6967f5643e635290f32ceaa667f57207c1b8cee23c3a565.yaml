dispatcher_decisions_check:
  Д47: >-
    Держится. З29 «Кто производит» отдаёт NTF-1 строки чтения всех пяти полей, required и пару; ни
    одна полоса маршрута NTF-2 шаблонов чарта notify не пишет. D1 вносит строку kaname в таблицу
    источников NTF-1 и вывод флага её помощником, D5 — гейт. Приёмка редакции 21 (132cb5ec5)
    уже внесла Д47 в Р20 и NTF2-34, и замысел на ней стоит.
  Д48: >-
    По существу держится: образца в поставляемом prod нет, гейты берут образец из тестовой фикстуры.
    Расхождение в месте фикстуры вынесено в CX2-66. Формулировка Д48 «из СВОЕЙ тестовой фикстуры» и
    строки приёмки 2951, 3020 «из фикстуры гейта» читаются как «тестовая фикстура, а не поставляемый
    профиль». NTF-1 редакции 21 прямо требует: «кладёт в тот же каталог полоса NTF-2, а не в
    фикстуру своего гейта». Тогда-исход (рендер prod с П7-узлом) от места файла не зависит, возврата
    в приёмку это не даёт.
  Д49: >-
    Держится. NTF-2 файлов fe3455 не правит (З28, DoD п.13). Зависимость полосы узла fe3455 от
    вливания kacho#1276 в 2564 записана в маршруте NTF-1 (tasks.md Е13, строка порядка 6: «D2 после
    вливания kacho#1276 в 2564, Д49»). В маршруте NTF-2 Е12 гейтит D2 и через неё D3 — это другое
    ребро (страж), оно не противоречит Д49.

