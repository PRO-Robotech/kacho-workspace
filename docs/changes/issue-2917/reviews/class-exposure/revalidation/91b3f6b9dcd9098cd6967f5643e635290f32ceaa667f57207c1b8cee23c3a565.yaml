# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 10.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы (initial/9098d6ef…, ef9c6801…, 229a4379…,
# 7a424030…) и пересверки на редакции 1, 2, 3, 5, 6, 7, 8 и 9 (f21384ed…, 2886b89f…, c3e37381…,
# cc7bdad1…, cc42ace6…, 6fc3cae2…, 2a329728…, aaaff659…) относятся к своим редакциям и здесь не
# переписываются. Судится дельта редакции 10 против последней разобранной (редакция 9, aaaff659;
# Д22): git diff a0ad3a711 80e33f3b4 -- docs/changes/issue-2917/design.md (648 строк диффа) и
# маршрут tasks.md той же пары ревизий. Дополнительно — решения диспетчера Д47, Д48, Д49 из задания.
# Что проверено:
#   (1) отображение CX2-47…65 (initial/229a4379, initial/7a424030) в §11 и З28–З30;
#   (2) исполнение того, что вернула пересверка aaaff659 (УК57, УК58, возврат Р5, CX2-47 commitUnknown)
#       и ревью замысла aaaff659 (В1, В2, М1, М2);
#   (3) Д47 (все пять строк узла — NTF-1), Д48 (образца узла в поставляемом prod нет, гейты — из
#       тестовой фикстуры), Д49 (fe3455 — после вливания kacho#1276) против текста замысла и маршрута;
#   (4) сверка с параллельной полосой — замысел NTF-1 редакции 21 (170f1ee2), написанный раньше этой
#       редакции (коммит 15e875957 предшествует 80e33f3b4).
# Итог: CX2-47…65 отображены. Не отображено то, что вернула запись aaaff659: УК57, УК58, второй
# пункт с номером CX2-47, замечания ревью В1, В2, М1, М2. Возврат Р5 не исполнен ни приёмкой, ни
# замыслом. Новые пункты: CX2-66 — каталог образца узла разошёлся с NTF-1 редакции 21; CX2-67 —
# контракт шелл-обёртки NTF-1 для пробы D0.
