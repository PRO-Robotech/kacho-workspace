      Пересверка aaaff659 завела новый пункт под номером CX2-47, а первичный разбор 229a4379 завёл
      свой CX2-47 (узел почты). §11 редакции 10 несёт одну строку CX2-47 — про узел. Пункт
      commitUnknown строки не имеет. Сводная строка «65 из 65 (CX2-01…65)» считает 65 номеров, а
      различных пунктов 66. По существу commitUnknown держится З8 (1а) и «Исход фиксации» — так
      вынесла запись aaaff659 (mapped: true). Но отображение по номеру неоднозначно, и сверка cg.class
      по номеру отнесёт обе записи к одной строке.
    required: >-
      отдельная строка §11 для пункта пересверки aaaff659 с ключом, различающим запись
      (например «CX2-47 · aaaff659»), и сводная строка, выведенная из числа строк таблицы (М1 ревью
      aaaff659)
