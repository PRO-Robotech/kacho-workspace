return_to_acceptance:
  - rule: "Р5 (приёмка 7a424030, строка 3184): «`503` не истрачивает вызов — NTF2-59 (д)»"
    status: не исполнен — перенесён из revalidation/aaaff659
    why: >-
      Возврат пересверки aaaff659 никем не принят. Строки Р5 и NTF2-59 не менялись с редакции 13 по
      редакцию 23 (замер ниже). Ни одна запись ревью приёмки и сама приёмка не называют aaaff659 —
      0 файлов. Первичный разбор 7a424030 судил только дифф 15 → 23 и этот возврат не перенёс. Замысел
      редакции 10 оставил в З8 «Исход фиксации» прежний текст: «Решает ли это „Тогда“ Р5, судит ревью
      приёмки (вопрос в возврате пакета)». Остаток «COMMIT отправлен, база не отвечала всё окно
      разрешения → 503, вызов мог быть истрачен» по построению не закрывается, и буквальный Р5 его
      не допускает.
    scenarios: [NTF2-59]

new_items:
  - id: CX2-66
    decision: "D43 (Д48): файл образца П7-узел — deploy/testdata/ntf2-minimal-mail-node.yaml (З29, строка 2160; tasks D0, пути)"
    classes:
      - "architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
      - "measurement-discipline §«Чужое измерение и чужое заявление» (срок годности опоры)"
    exposure: >-
      Замысел NTF-1 редакции 21 (170f1ee2) принял заказ NTF-2 N11 в такой форме. Образцы лежат в
      каталоге deploy/testdata/mail-node/. Обёртка принимает только имя файла этого каталога: имя вне
      каталога — отказ с перечнем (Go t.Fatalf, шелл — ненулевой код). Проба образца D9 обходит
      только этот каталог. Замысел NTF-2 кладёт П7-узел в deploy/testdata/ntf2-minimal-mail-node.yaml:
      в каталоге deploy/testdata/, но вне mail-node/. В design.md и tasks.md NTF-2 — 0 вхождений
      mail-node. Следствий два. (1) Каждый гейт NTF-2 обхода prod (D0, D3, D5) на верной работе
      получает отказ обёртки. (2) П7-узел не попадает в пробу образца D9. CX2-58 (б) «оба образца
      через одну пробу» тогда молча не исполняется, хотя при файле в каталоге проба провела бы его
      без правки. Опора устарела: §0 и §13 Е14 ссылаются на замысел NTF-1 редакции 20 (c9a81b71).
      Редакция 21 закоммичена раньше редакции 10 NTF-2 (15e875957 → 80e33f3b4); в design.md NTF-2
      0 вхождений 170f1ee2. Вызов Go-обёртки у NTF-2 — deployStacksForRender(t), у NTF-1 —
      deployStacksForRender(t, sample).
    condition: >-
      (а) файл П7-узла лежит в deploy/testdata/mail-node/ (имя — файл каталога), пути D0 и текст З29
      правлены; (б) гейты NTF-2 передают обёртке имя файла каталога; вызов Go — deployStacksForRender(t,
      <образец>); (в) §0 и §13 Е14 опираются на замысел NTF-1 редакции 21 (170f1ee2) и называют, какие
      части Е14 приняты ((а)–(г)) и какая нет ((д)); (г) проба образца D9 на базе полос D3 и D5
      печатает П7-узел в перечне образцов — это вход их условия старта.
    held_by: "покраснеет обёртка NTF1-D9 (отказ «имя вне каталога») на первом прогоне гейта NTF-2 — но на верной по замыслу работе, то есть поздно; полноту (г) держит проба образца D9 печатью имён"
    mapped: false
  - id: CX2-67
    decision: "D43: проба условий начала D0 — шелл-скрипт, рендерящий prod обёрткой NTF1-D9, а dev и fe3455 — через stacks.sh --chain (З29, tasks D0)"
    classes:
      - "code-authoring §«Чужой ответ: классификация и бюджет» (код отказа читателя цепочек)"
      - "code-authoring §«Контракт, который нельзя выразить» (разный контракт двух обёрток на цепочках не prod)"
    exposure: >-
      NTF-1 редакции 21 задаёт шелл-обёртке контракт. Это библиотека для source без точки входа.
      Функция render_chain_args <цепочка> [<образец>] отказывает на образце для цепочки не prod и на
      prod без образца. Код отказа теряется, если вызов подставлен аргументом helm; эту форму ищет
      гейт rosterreaderexitcode_test по списку имён. Проба D0 NTF-2 — шелл, и замысел не говорит,
      как она зовёт обёртку. Вызов по пути, аргументом helm или с образцом на dev/fe3455 даст либо
      отказ, либо пустую цепочку при коде 0: тогда K «ложен» при отказе рендера.
    condition: >-
      (а) D0 подключает render-chain.sh через source и берёт цепочку prod присваиванием с проверкой
      кода; при отказе — «не выполнилось» с текстом причины, а не K; (б) образец передаётся только для
      prod; dev и fe3455 — stacks.sh --chain без образца; (в) проба D0 печатает строку цепочки prod с
      именем образца последним.
    held_by: "покраснеет rosterreaderexitcode_test (NTF1-D9) на форме «аргумент helm»; (б), (в) — отказ обёртки NTF-1; условие к коду, замысел не меняет"
    mapped: "условие к коду — в §11а (не блокирует одобрение само по себе)"

