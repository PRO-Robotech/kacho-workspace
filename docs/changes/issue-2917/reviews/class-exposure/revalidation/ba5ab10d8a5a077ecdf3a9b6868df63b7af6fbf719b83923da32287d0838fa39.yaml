# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 25, маршрут
# редакции 25.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Судится дельта редакции 25 против последней пересверенной
# (редакция 24, cd516d1f…, запись revalidation/cd516d1f….yaml — «к замыслу», новый CX2-89). Дельта не
# закоммичена: рабочее дерево issue-880 @a3662915b.
#
# Итог — к замыслу и вернуть в приёмку. (1) CX2-89 прошлой пересверки не отображён: в design.md и в
# tasks.md упоминаний 0. Одно это запрещает одобрение. (2) Е20 подтверждён замером, это возврат в
# приёмку строки П6. (3) S11 отображает одну строку группы §3б из шести (`stand-chart.sh`).
# `stand-own.sh` экспортирует четыре `KANAME_INVITE_MAIL__*`, и после S8 строгий загрузчик откажет kaname
# в старте — задание `e2e-newman` own будет красным, а не «не выполнилось». Предикат S11 красен по
# построению. (4) Стенд E1a: kaname из образа ревизии пина go.mod kacho на сегодняшнем пине
# (4af7fd4fafb4) не знает ключа `notifications` и не стартует. E1a не зависит от D1, которая поднимает
# пин. (5) Правила тревоги Д66 — первый `PrometheusRule` в дереве kacho, без выключателя: установка
# упадёт там, где оператора Prometheus нет. (6) Счётчик исчерпания различает причину только при
# классификации по оператору. (7) Ручки службы в самостоятельной поставке kaname нет.
