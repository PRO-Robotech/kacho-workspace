new_items:
  - id: CX2-90
    decision: "S11: правит узел `inviteMail` только в `.github/scripts/stand-chart.sh`; предикат `git grep -nE 'inviteMail|invite-mail|KANAME_INVITE_MAIL_' -- deploy .github/scripts` → пусто; Е19 — вопрос владельцу о посеве стенда kaname"
    class: >-
      measurement-discipline §«Радиус: по имени механизма и по точкам применения»: радиус взят по одной
      точке применения. verdict-and-landing: «не выполнилось» против красного — стенд, который откажет в
      старте, даст находку (код 1), а не несозданное условие
    exposure: >-
      Перепись §1.1 приёмки по группе §3б «`.github/scripts/`, `tests/authz-fixtures/`, `tests/newman/` —
      6» на 484-notify — тоже 6 файлов: `stand-chart.sh`, `stand-own.sh`, `review-event-silence.py`,
      `tests/authz-fixtures/{seed_login_lane,seed_own_stand}.py`,
      `tests/newman/cases/kaname-address-verification.py`. В маршруте назван 1 (`stand-chart.sh`, S11);
      `seed_login_lane.py` упомянут только в Е19, остальные 4 — 0 раз в design.md и tasks.md.
      `stand-own.sh:282–285` экспортирует `KANAME_INVITE_MAIL__{RELAY,FROM,TLS_MODE,CA_BUNDLE_FILE}`. Это
      имена пространства `__`: после того как S8 снимет ключи `invite-mail.*` из декодера, строгий
      загрузчик (`strict_env.go`, NTF2-48) откажет в старте с их именами. Шаг `e2e-newman.yml:442`
      (`stand-own.sh up`) различает исходы: 1 — «служба отказалась стартовать по своей проверке посадки»,
      75 — «условие не создано». Будет 1, то есть красный. Предикат S11 на 484-notify находит ещё
      `stand-own.sh` и три пробы вне путей S11: `deploy/outbound_lane_has_an_operator_knob{,_injection}_test.go`,
      `deploy/prod_profile_injection_test.go`. Предикат красен по построению. Е19: одобренная приёмка §3б
      уже назначает группе исход «стенд читает письма из приёмника, куда пишет `notify`; посевы П3 и
      П10». Вариант (б) Е19 противоречит первой половине исхода, вариант (а) заводит ребро стенда kaname
      → образ kacho (обратное направлению `corelib←kaname←kacho`)
    condition_on_code: >-
      (а) Каждый из 6 файлов группы получает полосу и исход в маршруте. `stand-own.sh` снимает
      `KANAME_INVITE_MAIL__*` той же полосой, что S8 снимает ключи из декодера (или раньше), иначе
      между ними ствол линии красен. Пробы `deploy/*_test.go` из предиката — в путях S11 или в полосе,
      снимающей их предмет.
      (б) Предикат S11 печатает перепись на голове полосы и число осмотренных файлов: 0 строк по
      `deploy` и `.github/scripts`. Контроль — та же команда на базе: 7 файлов.
      (в) Е19 переписать как возврат в приёмку строки §3б группы стендов kaname, с выбором владельца
      между (а) и (б). При (б) исход группы — посев П10 без письма, сценарии с письмом — на П1 kacho.
      При (а) — решение о ребре стенда kaname → образ kacho по `polyrepo.md`. Отвечает
      `tests/newman/cases/kaname-address-verification.py`, который сейчас читает письмо kaname: при (б)
      он снимается или переписывается на П10 той же полосой
    held_by: "предикат S11 с контролем (есть, но неполон по радиусу); прогон `e2e-newman` own — сегодня даст красный, а не «не выполнилось»"

  - id: CX2-91
    decision: "E1a: kaname — «процесс стенда из образа ревизии, которую пинит go.mod kacho»; E1a ← E1, Е5; «компонент не поднялся → не выполнилось»; «полоса не вызвана» судится числом записей записывающего посредника край → kaname"
    class: >-
      measurement-discipline §«Откуда читается предмет» (провенанс стенда); verdict-and-landing (третий
      исход, известный заранее, и красный под видом «не выполнилось»); measurement-discipline §«Форма
      числа» (единица записи посредника)
    exposure: >-
      (1) Пин kaname в kacho @origin/2564 — `v0.4.1-0.20260929105655-4af7fd4fafb4` (`go.mod:126`). Это
      предок 484-notify, но `git grep -c notifications 4af7fd4fafb4 -- internal/apps/kaname/config/config.go`
      → 0. Файл стенда с `notifications.enabled` строгий декодер отвергнет («ключ, которого не знает
      декодер, — отказ старта»), kaname не стартует. Пин поднимает D1 NTF-2 («пин kaname на линию
      kaname#484»), но в зависимостях E1a D1 нет. Положительный контроль E1a (письмо `recovery` через
      notify) до D1 неисполним, а исход «процесс упал до готовности → не выполнилось» скроет отказ
      конфигурации под видом инфраструктуры. (2) Образы kaname публикуются с тегом `<slug>-<sha8>` и только
      для головы ствола и веток линии при посадке (`docker-build.yml:95–97, 177, 242`). Ревизия по тегу —
      заявление; коммит, не бывший головой отправки, образа не имеет. (3) Ретрансляция край → kaname идёт
      по TLS через пул соединений. Посредник уровня TCP считает соединения, и повторно использованное
      соединение несёт вызов без новой записи: «полоса не вызвана» был бы ложным зелёным. Посредник,
      завершающий TLS, предъявляет kaname свой сертификат, а kaname сужает отправителей по SAN
      (`trusted-forwarder-sans`)
    condition_on_code: >-
      (а) E1a зависит от D1 (пин kacho достигает коммита S9 линии). На старте печатается
      `git merge-base --is-ancestor <коммит S9> <ревизия пина>` → 0, иначе «не выполнилось» с этим
      предикатом, ещё до подъёма. (б) Ревизия kaname на стенде читается из подписи образа
      `org.opencontainers.image.revision` и из самоотчёта процесса (build info), сравнивается с пином и
      печатается с дайджестом образа; тег — только способ найти образ. (в) Исходы подъёма различаются:
      образа нет или docker недоступен — «не выполнилось»; процесс вышел с отказом стража старта (текст
      отказа в журнале) — красный с текстом. Инъекция: стенд с ключом вне декодера → красный, а не «не
      выполнилось». (г) Посредник записывает ЗАПРОСЫ (HTTP-запрос или поток HTTP/2) с методом и путём, а
      не соединения. kaname он предъявляет сертификат с SAN края от УЦ стенда, и стенд это печатает.
      Близнец: два запроса подряд по одному соединению → 2 записи
    held_by: "положительный контроль E1a и трёхкратный вердикт (запланированы); (а)–(г) в предикате не названы"

  - id: CX2-92
    decision: "Д66: правила тревоги `AnonMailBucketSaturation`, `AnonMailBucketExhausted` — объектом `gateway/deploy/templates/prometheusrule.yaml`; проба рендера правил против реестра метрик"
    class: >-
      security-hardening «Контроль, у которого нет МЕХАНИЗМА исполниться»; security
      `sec-values-prod-must-boot` (чарт обязан ставиться); doc-truthfulness (два места об одном правиле)
    exposure: >-
      В kacho @origin/2564 `kind: PrometheusRule` — 0 файлов, `- alert:` в чартах — 0. Сбор объявляется
      аннотацией пода, а `ServiceMonitor`/`PodMonitor` — находка гейта
      `internal/repohygiene/scrapedeclaration_test.go:472` («второй механизм»). E2 заводит в kacho первый
      объект вида чужого оператора. В kaname тот же предмет уже решён (`deploy/templates/prometheusrule.yaml`
      @484-notify): «ВЫКЛЮЧАТЕЛЬ ОБЯЗАТЕЛЕН… где оператора Prometheus нет, объект отвергнет схема
      кластера, и отвергнет она ВСЮ установку». Там же сверка объекта со страницей документации в обе
      стороны (`TestDeliveredAlertRulesMatchThePublishedPage`) и запрет третьего места
      (`TestAlertRulesAreDeclaredByOneProducer`). Чарт края ставится зонтиком на стенды kind
      (production-posture), где оператора Prometheus нет
    condition_on_code: >-
      (а) Объект правил под выключателем чарта края с названным умолчанием и значением по каждой цепочке
      `deploy/stacks.txt`. Отказ из-за отсутствия CRD — предмет пробы: рендер и установка зонтика на
      стенде без CRD проходят. (б) Правила описаны на странице документации края, сверка объекта со
      страницей в обе стороны — в форме kaname. (в) Проба рендера правил: имена метрик берутся из
      реестра (это уже в предикате E2), и включённый выключатель даёт оба правила. Инъекция «выключатель
      `false` в цепочке, объявленной включённой» → красный с именем цепочки. (г) Строка NTF-2 D1 о
      правиле `unaddressed` (CX2-07) поставляется тем же механизмом — один механизм поставки тревог на
      дерево kacho
    held_by: "проба рендера правил E2 (запланирована); выключатель и сверка со страницей не названы"

  - id: CX2-93
    decision: "Д66: `kacho_api_gateway_anon_mail_bucket_wait_timeouts_total` — «решения, не получившие строку ведра за `anonMailStoreWait`»; один предел ожидания `anonMailStoreWait` для `lock_timeout` и `pool.Acquire`; у `memory` — «за мьютексом ведра»"
    class: >-
      code-authoring §«Чужой ответ: классификация и бюджет»: один код ошибки (`55P03`, истёкший
      `Acquire`) имеет несколько причин, и счётчик причины верен, только если классифицирует оператор, а
      не код
    exposure: >-
      В транзакции решения строке ведра предшествуют рекомендательные блокировки ключей формы с двумя
      `int4` (строка ведра последней, E2). `lock_timeout` даёт один и тот же `55P03` и на блокировке
      ключа, и на `SELECT … FOR UPDATE` строки ведра. Исчерпанный пул ограничителя (CX2-44) тоже кончается
      `StoreUnavailable`. Без привязки к оператору счётчик насыщения растёт от горячего ключа или
      исчерпания пула, и правило `AnonMailBucketExhausted` (`critical`) звонит о насыщении, которого нет.
      `sync.Mutex` в Go срока ожидания не имеет: если «мьютекс ведра» у `memory` — он, то ожидание
      неограниченно, и проба E2 «на обоих хранилищах: ведро удержано дольше `anonMailStoreWait` → 503»
      на `memory` неисполнима
    condition_on_code: >-
      (а) `…_bucket_wait_timeouts_total` растёт только на истёкшем ожидании оператора строки ведра (на
      `postgres` — ошибка именно этого оператора, на `memory` — истёкшее ожидание ведра). Ожидание
      блокировки ключа и `pool.Acquire` растят только `…_store_unavailable_total`.
      (б) У `memory` ожидание ведра ограничено сроком (семафор-канал с контекстом), а не `sync.Mutex`.
      (в) Пробы E2: ключ удержан соседним соединением → 503, `store_unavailable` +1,
      `bucket_wait_timeouts` +0; пул исчерпан → то же +0; строка ведра удержана → +1 и +1. Инъекция
      «счётчик по коду `55P03`» → первая проба красная
    held_by: "пробы E2 на насыщение (запланированы); различающих близнецов (в) нет"

  - id: CX2-94
    decision: "S11: самостоятельная поставка kaname (NTF2-33) с флагом `notifications.enabled`"
    class: "security-hardening `hard-missing-knob-vs-unseeded`; заказ CX1-108 пересверки NTF-1 7bbe018c"
    exposure: >-
      NTF-1 редакции 31 заводит ручку kaname `authn.service-identity`, без которой `ResolveSend` от
      notify отказан, и называет производителем только подчарт зонтика. Поставка `kaname/deploy`
      (@484-notify) объявляет ручки звена личности поимённо (`trustedForwarderSANs`, `values.yaml:499`), а
      блока службы в ней нет и в S11 не заведено
    condition_on_code: >-
      S11 заводит блок `serviceIdentity: {methods, services}` → ключ `authn.service-identity` в
      `deploy/templates/configmap.yaml`: пусто — ключа нет; задана половина — отказ рендера с именем
      ручки. Проба рендера поставки — согласный блок, половина и пусто, по случаю на каждый
    held_by: "нужна проба рендера поставки, её нет"

remarks:
  - >-
    Порог `0.8` Д66 замысел честно называет ориентиром до замера, а порог ставит ниже доли из ОДНОГО
    нагрузочного прогона E2 на машине полосы. Доля занятости в момент первого 503 зависит от времени
    удержания строки, а оно — от задержки базы. Комментарий в шаблоне должен назвать ревизию, профиль
    флота и машину прогона (атрибуция и срок годности числа), отдельный пункт для этого не нужен
  - >-
    `hold_seconds_total` прибавляется после отпускания строки, поэтому при исчезнувшем держателе
    метрика отстаёт на срок удержания. Срок ограничен `anonMailDecisionBudget` (`idle_in_transaction`,
    `statement_timeout`), и на окне `[5m]` правила отставание несущественно. Пункта нет

