      красный), либо замысел дописывает к Е11 пункт «описание шаблона, порождённое notifygen,
      экспортирует presence каждого атрибута читаемым идентификатором» с предикатом снятия: ни один
      сценарий редакции 17 NTF-1 этот экспорт не утверждает (тот же вид, что Е8 (в) у CX2-41).
    held_by: "две инъекции гейта (лишний optional, снятый optional) — на выбранном источнике"
  - id: УК52
    item: CX2-44
    class: "code-authoring §«Порядок операций внутри кода»; §«Унификация и стоимость»"
    condition: >-
      прогрев пула ограничителя держится не только до первого запроса: (1) прогрев берёт
      anonMailPoolConns соединений ОДНОВРЕМЕННО и только затем отпускает — последовательное
      «взять-отпустить» прогревает одно; (2) MaxConnLifetime и MaxConnLifetimeJitter (> 0) заданы
      явно — на pgx v5.10.0 умолчания 1 ч и 0, соединения одного возраста истекают разом и
      уничтожаются на Acquire/Release (pool.go 624, conn.go 43), новое строится внутри Acquire со
      сроком 250 мс; (3) этот остаток — «ротация срока жизни» — назван рядом с «перезапуском базы».
    held_by: >-
      проба прогрева (З8) проверяет число открытых соединений после старта; ротация — модульная
      проба конфигурации пула (jitter > 0, срок задан) либо вниманием с названной ценой.

