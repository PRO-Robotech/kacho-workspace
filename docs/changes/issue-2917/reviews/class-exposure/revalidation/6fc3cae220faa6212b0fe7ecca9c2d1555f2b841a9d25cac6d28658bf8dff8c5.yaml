      процесс жив. Проба, ждущая отказа старта, на этой инъекции останется зелёной.
    held_by: "integration-проба посева с настоящим писателем аудита (З27) — исправленный близнец"
  - id: УК51
    item: CX2-45
    class: "measurement-discipline §«Чужое измерение и чужое заявление»; code-authoring §«Инвариант и оснастка — это тоже прод-код»"
    condition: >-
      гейт optional_attributes_ledger читает признак presence из notification.yaml каталога kaname
