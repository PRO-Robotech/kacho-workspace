  - id: CX2-39
    design: З3
    verdict: holds
    note: >-
      GRPCStatus() без изменения статуса; проба обработчика Invite с близнецом без GRPCStatus().
      Довод «обёртка %w унесла бы свой текст в message» подтверждён исходником grpc v1.83.2:
      status.FromError на обёрнутой ошибке берёт статус через errors.As и подменяет p.Message =
      err.Error(), details сохраняет.
