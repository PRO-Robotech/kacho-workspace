  - {id: CX2-41, design: "З19, Е8 (в)", verdict: holds, note: "поправка внесена: экспорт лимита — зависимость NTF-1 с предикатом снятия; S5 гейтится"}
  - {id: CX2-42, design: "З7, М40", verdict: holds, note: "число контроля 46 — совпадает с замером cc42ace6 (46 строк, 7 файлов)"}
  - {id: CX2-43, design: "З9", verdict: holds, note: "фикстура NTF2-62 (в) строится пропуском 200"}
  - id: CX2-44
    design: З8
    verdict: holds
    note: >-
      условия (1) порядок подъёма — типом входа buildAnonMailStore(idem, cfg); (2) закрытие после
      HTTP-сервера в перечне Closer; (3) прогрев MinConns = anonMailPoolConns с отказом старта, остаток
      «перезапуск базы» назван. Выдерживает с условием к коду УК52: на pgx v5.10.0 прогретый пул
      остывает сам по сроку жизни соединения (умолчание MaxConnLifetime 1 ч, jitter 0) — остаток
      цены, не названный замыслом.
  - id: CX2-45
    design: "З27, З1, О6, И34, И35, §7 П5"
    verdict: holds
    note: >-
      (а)–(в) условия пункта выдержаны (см. approval_conditions). Сверено по дереву: М41 (invite.go
      421, 429 — HumanUserID), М42 (admission.ID: `!person || verified`), М43 (serve.go:2009,
      insertAuditEventTx — полезная нагрузка map, TenantAccountID только непустым). Условия к коду —
      УК47–УК51. Замечания к тексту З27, вывода не меняющие: (г) путь В у `invite` в дереве не
      существует — Invite и ResendInvite есть только в публичной UserService (grpc_register.go:41);
      внутренние InternalUserService {UpsertFromIdentity, Get, OnRecoveryCompleted}, InternalIAMService,
      InternalClusterService приглашений не несут; правило «по тому же правилу» от этого не ломается;
      (д) у `recovery-completed` второй источник события — хук поставщика личности
      (internal_on_recovery.go:283, воркер Operation по hooks_mux.go / InternalUserService.
      OnRecoveryCompleted), в перечне путей его нет; вывод держится правилом класса S (атрибут — поле
      субъекта события, primary.ID непуст), а не перечнем путей; (е) у посева пользователь
      «найденный или заведённый» — на базе посев пользователя НЕ заводит: берёт ACTIVE строку с
      подтверждённым адресом (bootstrap_admin.go 172–202), иначе пропускает (BootstrapSkipNotVerified
      и др.); user_id непуст и так; (ж) близнец посева «старт отказывает» неосуществим — УК50.
      Поправка собственной записи cc42ace6: фраза экспозиции CX2-45 «откат посева — отказ старта»
      неверна — посев исполняет реконсайлер, «non-fatal by contract» (serve.go 1998–2030); замысел
      перенял её в держатель.

conditions_to_code:
  - id: УК47
    item: CX2-45
    class: "code-authoring §«Умолчание, которое становится утверждением» (третий исход «не смог спросить»)"
    condition: >-
      выбор `mail.Present` | `mail.Absent()` для `invite.inviter_address` решается по ВИДУ
      принципала, присутствие которого проверено, а не по пустоте authzguard.HumanUserID: та
      возвращает "" и для сервисной учётки, и для контекста без принципала, и для анонима
      (principal.go:45–53). Вид `user` → чтение адреса → Present; вид `service_account` → Absent;
      принципала нет, аноним, системный или иной вид → ошибка акта, а не Absent.
    held_by: >-
      модульная проба глагола invite: контекст без принципала → ошибка, строки ленты нет; близнецы —
      сервисная учётка → строка без атрибута, человек → строка с адресом. Без неё держится вниманием.
  - id: УК48
    item: CX2-45
    class: "code-authoring §«Умолчание, которое становится утверждением»; §«Контракт, который нельзя выразить» (два написания отсутствия)"
    condition: >-
      нулевое значение закрытого типа присутствия (литерал типа без Present/Absent) не является ни
      Present, ни Absent: конструктор Letter отвергает его ошибкой с именем атрибута. Absent —
      отдельное явное состояние; иначе забытый аргумент молча становится «приглашающего нет».
    held_by: >-
      модульная проба конструкторов Letter (З1, И34): нулевой литерал типа → ошибка с именем
      атрибута; близнец `mail.Absent()` → Send* вызван.
  - id: УК49
    item: CX2-45
    class: "code-authoring §«Чужой ответ: классификация и бюджет»; §«Порядок операций внутри кода»"
    condition: >-
      «человек, чей подтверждённый адрес в транзакции акта не найден» (адрес сменён между рубежом
      положения и актом) исходит тем же отказом, что рубеж положения подтверждения (тот же код и
      reason, authzguard/address_gate.go), а не INTERNAL; адрес читается тем же предикатом, что
      admission (email_verified_at IS NOT NULL) под блокировкой строки человека в транзакции акта.
    held_by: >-
      integration-проба: отметка подтверждения снята между рубежом и актом → отказ равен отказу
      рубежа, строки ленты нет, акт не зафиксирован; близнец — адрес подтверждён → строка с адресом.
  - id: УК50
    item: CX2-45
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (держатель, утверждающий несуществующий исход)"
    condition: >-
      близнец-инъекция пробы посева («актор — required атрибут») утверждает наблюдаемый исход
      реконсайлера, а не отказ старта: грант cluster_admin_grants не зафиксирован, строки ленты
