# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 24.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки прежних редакций относятся к своим
# редакциям и здесь не переписываются. Судится дельта редакции 24 против последней пересверенной
# (редакция 23, c2b5cf2d): git diff a3d081476 8d52c5e42 -- docs/changes/issue-2917/{design,tasks}.md.
# Итог: к-замыслу. CX2-88 отображён: вхождение — поле-идентификатор разбора, роли у всех 9 вхождений,
# пробы (6) и (7), проба (4) в функции, УК84, D6. М4 ревью исполнен. Сводка §11 перемерена (89 строк).
# Новый CX2-89. Правило «вызов доступа по имени — нарушение» не отличает от более слабой реализации ни
# одна проба: (6) и (7) ловятся правилом идентификатора и константы и без него. Правило записано двумя
# несогласными словами, и `__dict__`, который Б10 называет формой записи, им не покрыт.
