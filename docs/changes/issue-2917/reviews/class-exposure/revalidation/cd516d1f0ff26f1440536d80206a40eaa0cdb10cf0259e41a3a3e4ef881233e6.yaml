new_items:
  - id: CX2-89
    decision: >-
      З28 (а) Б10 «Носители» и перечень «не выполнилось» (CX2-88, УК84): «любой вызов `globals`, `locals`,
      `vars`, `exec`, `eval`, `__import__` и `setattr`/`getattr`/`delattr` с неконстантным именем —
      нарушение, так как имя по разбору не доказуемо». Перечень «не выполнилось» говорит иначе: «вызов
      доступа по неконстантному имени (`globals`, …, `setattr`/`getattr`/`delattr`)». Пробы правила
      носителей — (1)–(7)
    class: >-
      gate-authoring: заявленное свойство обязано иметь пробу, которую более слабая реализация не
      проходит. Здесь правило доступа по имени не отличает от его отсутствия ни одна проба.
      code-authoring §«Инвариант и оснастка — это тоже прод-код»: страж судит по свойству, а не по
      перечню. doc-truthfulness: два места об одном правиле, которые читаются по-разному.
      Продолжение цепочки CX2-84…88 (ложный зелёный переписи, класс CX2-84)
    exposure: >-
      Измерено на копии check-volume-mounts.py (2564@6edea09c2ee), инъекции сразу после литерала `CHARTS`.
      Сравнивались три распознавателя: (I) только идентификаторы и константы; (II) то же плюс любой вызов
      из перечня; (III) то же, но «с неконстантным именем» отнесено ко всему перечню.
      Первое: пробы (6) и (7) правило доступа по имени не испытывают. (6) даёт (I) +1. (7) тоже даёт (I) +1:
      константа `"CHARTS"` — вхождение. Распознаватель (I) без правила проходит пробы (1)–(7).
      Инъекция `def _ov(chart, k): setattr(chart, k, [])` — запись в носитель через цикл «переопределений»,
      правдоподобная безвинная правка — даёт (I) +0, (II) +1, (III) +1. Распознаватель (I) печатает на ней
      «Б10 (0)–(iii) + Б6», то есть ложный зелёный.
      Второе: две записи правила расходятся. При чтении (III) строка `exec('CHARTS = []')` даёт +0 у
      (I) и у (III): аргумент константный, но имени носителя не равен. При чтении (II) она даёт +1.
      Третье: Б10 называет `__dict__` формой записи, а правило его не покрывает. Инъекции
      `chart.__dict__[k] = []` и `object.__setattr__(c, k, [])` дают +0 у всех трёх вариантов.
      На дереве вызовов из перечня (и `compile`) 0, обращений к атрибуту с dunder-именем (`Attribute.attr`
      вида `__x__`) 0. Есть dunder-имена `__future__` (alias), `__file__` и `__name__` (Name) и
      `__init__` (def), но атрибутами они не являются. Строже записанное правило не задело бы ни одного
      вхождения дерева
    condition_on_code: >-
      (а) Правило доступа по имени — одной записью в Б10, в перечне «не выполнилось» и в УК84, без условия
      «с неконстантным именем». Любой вызов `globals`, `locals`, `vars`, `exec`, `eval`, `compile`,
      `__import__`, `setattr`, `getattr`, `delattr` — нарушение с координатой вызова и именем `Б10 (ii)`,
      какие бы аргументы у него ни были. Константный случай уже ловит правило константы, а на дереве
      таких вызовов 0.
      (б) Любое обращение к атрибуту с dunder-именем (`Attribute.attr` вида `__x__`: `__dict__`,
      `__setattr__`, `__delattr__`, `__getattribute__`, `__class__` и любые другие) — нарушение с
      координатой и именем `Б10 (ii)`. Правило задаётся свойством имени, а не перечнем; на дереве таких
      обращений 0.
      (в) К пробам (1)–(7) добавить пробы, которые распознаватель без правил (а) и (б) не проходит. Близнец
      каждой — файл дерева: (8) после литерала `def _ov(chart, k):` / `setattr(chart, k, [])` →
      «не выполнилось» `Б10 (ii)` с координатой вызова; (9) после литерала `def _d(chart, k):` /
      `chart.__dict__[k] = []` → «не выполнилось» `Б10 (ii)` с координатой обращения. Ни в одной — красного
      самоистечения и зелёного «Б10 + Б6». Назвать (8) и (9) в §11, §11а и D6
    held_by: >-
      Пробы (8) и (9) нужны, их нет. До отображения держится вниманием. Опасный исход тихий: распознаватель
      без правила доступа по имени проходит пробы (1)–(7) и печатает ложный зелёный на записи через
      `setattr` с переменным именем

remarks:
  - >-
    Цепочка CX2-84…89 шесть пересверок подряд закрывает формы, которые не отличает очередной перечень.
    Условие CX2-89 (а), (б) нарочно задано свойством, а не перечнем. Вызов из закрытого множества
    рефлексивных встроенных функций и любое обращение к dunder-атрибуту — нарушения безусловно. Оба
    множества на дереве пусты, поэтому отказ в закрытую сторону ничего законного не задевает. Остаётся
    имя, собранное из частей и переданное в функцию вне файла: стороннего модуля в импортах файла нет
    (`__future__`, `pathlib`, `subprocess`, `sys`, `yaml`), а новый импорт пишется в той же правке.
    Модель угрозы — безвинная правка автора, не злонамеренная, поэтому этот остаток держится вниманием и
    отдельным пунктом не выносится. Если отображение CX2-89 введёт новый перечень вместо свойства, это
    повод вернуться
  - >-
    `operator.attrgetter("required")` правило константы ловит. С переменным именем это только чтение
    носителя, и цепочку к helm оно не меняет, поэтому сверх (а), (б) не нужно

