new_items:
  - id: CX2-71
    decision: >-
      З28 «Держатель», tasks D6: «Проба печатает предпосылку: перечень незаданных обязательных значений
      опоры — ровно одно имя, и имя снятого ключа; инъекция «сняты оба ключа (узел и ручка)» — исход
      «не выполнилось: предпосылка» с двумя именами»
    class: >-
      gate-authoring — предпосылка обязана быть измеримой и отличать «не выполнилось» от красного;
      change-graph — отрицательный кейс меняет ровно один факт против положительного близнеца;
      architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» (одна форма
      отрицания у NTF-1 D1/D2 и NTF-2 D6)
    finding: >-
      Предпосылка сформулирована по величине, которую проба прочесть не может. Слово «опора» тоже неверно:
      в NTF-1 «опора» — рендер образца целиком, у него незаданных значений ноль, а одно — у отрицания.
      Перечень незаданных `required` helm не выдаёт: при двух незаданных он печатает одну ошибку (М68).
      Проба, которая берёт перечень из вывода helm, увидит одно имя и на инъекции «сняты оба» тоже.
      Предпосылка там пройдёт, и выйдет ровно запрещённый CX2-70 исход — красный с чужим именем
      или зелёный. NTF-1 З28 (б) (редакция 23, CX1-94 (в)) выводит предпосылку из собственных входов
      пробы: снятые ключи — это ключи аргументов `--set …=null`, их ровно один, и рендер опоры (тот же
      образец целиком) даёт код 0. Если опора не рендерится, исход «НЕ ВЫПОЛНИЛОСЬ» с текстом её отказа.
      Замысел NTF-2 пишет «форма согласована с NTF-1 CX1-94 (а)–(г)», но собственной формулировкой
      расходится: источника предпосылки нет, ветки «опора не рендерится» нет. При этом отпечаток судит
      текст NTF-2, а D6 исполняет deploy-engineer по tasks.md NTF-2.
    condition_on_code: >-
      Проба D6 вычисляет предпосылку отрицания рендера `prod` из своих аргументов, а не из вывода helm:
      (1) перечень снятых ключей — это ключи аргументов `--set <ключ>=null` рендера отрицания, в нём
      ровно один элемент, и это ключ ручки; (2) рендер опоры — та же цепочка `prod` через обёртку NTF1-D9
      с тем же образцом без снятия, то есть положительный близнец, — завершается с кодом 0. Утверждение
      «отказ с именем KACHO_API_GATEWAY_TRUSTED_HOPS» проводится только при (1) и (2). Снято больше
      одного ключа — «НЕ ВЫПОЛНИЛОСЬ» с перечнем снятых. Опора не рендерится — «НЕ ВЫПОЛНИЛОСЬ» с текстом
      её отказа. Текст З28 «Держатель», строки §11 CX2-70, §11а УК62 и tasks D6 называют предпосылку так,
      а слова «перечень незаданных обязательных значений опоры» из замысла уходят.
    held_by: >-
      Проба D6 держит условие двумя инъекциями. «Сняты оба ключа» даёт «не выполнилось» с двумя
      именами из аргументов. «Опора без узла почты» (образец, у которого снят узел, ручка на месте, снимается
      ручка) даёт «не выполнилось: опора отказала» с текстом отказа, а не красный с именем узла. Близнец:
      снят один ключ, опора с кодом 0 → отказ с именем ручки. Гейта формы нет: пока текст не правлен,
      условие держится вниманием

remarks:
  - subject: "ключ ручки в values подчарта обязан быть уникален среди чартов дерева"
    text: >-
      Два пути подачи синтетического значения из CX2-68 (б) не знают, какой чарт рендерят. Заглушка
      `helm.set` в trivy.yaml применяется ко всем чартам сразу: у `--helm-set` нет области чарта, это
      называет docstring assert-scan-stubs-hide-nothing.py. `peer_san` в iam-trusted-forwarder-test.sh —
      одна строка рендера на все чарты двух циклов, `--set db.password=x` там уже стоит так же. Если ключ
      ручки совпадёт с ключом, который читает другой чарт, заглушка молча подменит там величину. Гейт
      заглушек ловит только погашенную находку, а не подмену. Сегодня имён вида trustedHops, TRUSTED_HOPS,
      trustedProxy, proxyCount в *.yaml и *.tpl дерева 0 на 2564 и 0 на 1276. Отдельного пункта это не
      даёт: условие «имя ключа ручки при выборе в D6 сверено с деревом — 0 совпадений» держится вниманием.
  - subject: "запись края в ведомости lint-service-charts.sh держит «чарт отказывает без аргументов записи», а не «без ручки»"
    text: >-
      Шаг 3 самоистечения рендерит чарт без аргументов записи целиком
      (`helm template zz-lint <чарт>` без $args). Пока обязательное значение у края одно, эти формулировки
      совпадают. Появится у края второе `required`, и запись останется зелёной на снятом `required`
      ручки. Слова З28 «запись сама держит «чарт края без ручки отказывает»» точны только при одном
      обязательном значении. Держатель отсутствия умолчания в подчарте — инъекция «строка снята из
      values.own.yaml». Она названа обязательной, так что вывод держится.

