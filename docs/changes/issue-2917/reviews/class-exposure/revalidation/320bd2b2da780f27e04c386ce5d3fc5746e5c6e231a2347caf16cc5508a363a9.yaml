#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки прежних редакций относятся к своим
# редакциям и здесь не переписываются. Судится дельта редакции 14 против последней разобранной
# (редакция 13, 695a1e95). Промежуточный отпечаток a21f1d64 (коммит e1e3628d5) пересверки не имеет, его
# дельта входит сюда: git diff 091e18b4c 38ef03f18 -- docs/changes/issue-2917/{design,tasks,change}.*.
# Итог: CX2-68, CX2-69 и CX2-70 отображены (З28, М67, М68, §11, §11а УК60–УК62, tasks D6). Замечание
# «Е17 (б) — только при пустом перечне prod» тоже отображено (§13 Е17 (б), (д), опора — NTF-1 редакции 23).
# Контроль М67 перемерен: семь семейств на 2564 и на 1276, новых рендеров чарта края без зонтика нет.
# Новый пункт один:
#   CX2-71 — предпосылку отрицания D6 текст называет «перечень незаданных обязательных значений опоры —
#            ровно одно имя». У опоры незаданных ноль. Читать перечень из вывода helm нельзя: он
#            всегда называет одно имя (М68). NTF-1 З28 (б) выводит предпосылку из аргументов `--set …=null`
#            и кода 0 опоры, а у NTF-2 этого нет. Замысел ссылается на форму NTF-1, но сам формулирует её иначе.
# Возврат Р5 (Е15) и Р8 / DoD пп. 13, 22 (Е16) не исполнен: приёмка та же (7a424030).
