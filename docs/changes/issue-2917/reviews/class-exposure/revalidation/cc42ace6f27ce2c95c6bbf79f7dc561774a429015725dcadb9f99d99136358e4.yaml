      (с SubjectSourceRequestWindows и исключением retired.json) на 734f69fb4 печатает 46 строк, а не
      44 — 44 печатает команда М38 без SubjectSourceRequestWindows (+2 строки registry.go:126, 250).
      Контроль «в обе стороны» на числе 44 для команды замысла красен на базе — исправить число в З7
      на 46 либо свести команду держателя к команде М38 (и тогда сказать, что константа предмета
      ловится по source_request_windows).
  - id: CX2-43
    design: "З8, З9"
    verdict: holds
    note: >-
      пометка, Admit и момент — одна транзакция, фиксируемая только при Pass; memory — одна
      критическая секция; проба с близнецом «пометка отдельной транзакцией». Решение шире условия:
      пометка откатывается и на Challenge/Reject — вызов остаётся неистраченным до срока, что
      согласуется с Р5 («одноразовый» = один пропуск). Условие к коду: фикстура NTF2-62 (в)
      («доказательство, уже использованное один раз») строится пропуском 200, а не отказом —
      иначе на этой реализации сценарий красен ложно.
  - id: CX2-44
    design: З8
    verdict: holds
    note: >-
      свой pgxpool (MaxConns 4) по тому же DSN, ожидание соединения и блокировки — один предел
      anonMailStoreWait; цена 4N названа; проба с близнецом «общий пул». Условия к коду (порядок
      операций и снятия): (1) пул ограничителя строится после возврата idempotencypg.New — цепочку
      миграций (в том числе таблиц ограничителя и строки ведра) накатывает ensureSchema внутри New
      (store.go, ensureSchema под pg_advisory_lock); запрос, пришедший раньше, получил бы 503
      «отношения нет» — отказ закрытый, но ложный; (2) пул закрывается после остановки
      HTTP-сервера края, в том же перечне закрываемых, что хранилище однократности; (3) холодное
      соединение: срок pool.Acquire 250 мс включает установку TLS-соединения к базе, когда пул ниже
      предела, — первый запрос после простоя или масштабирования получит 503; MinConns =
      anonMailPoolConns (пул прогрет) либо цена холодного соединения названа в замысле.
  - id: CX2-45
    design: "З1, О6, И34"
    verdict: does_not_hold
    note: >-
      см. items ниже — перечня атрибутов с производителем значения нет; законный путь с нулевым
      значением в дереве найден

items:
  - id: CX2-45
    decision: >-
      О6 / З1 / И34 (редакция 6): каждый объявленный атрибут шаблона — параметр конструктора Letter;
      нулевое значение конструктор отвергает до Send*; сторож feed.ErrAttrsInvalid из Send* — ошибка,
      транзакция события откатывается (как ошибка хранилища, З16)
    class: >-
      code-authoring §«Умолчание, которое становится утверждением» (нулевое значение атрибута —
      «нет значения» или «законно пусто»); §«Решение и его следствие разнесены» (отказ сборки
      письма откатывает бизнес-действие); §«Чужой ответ: классификация и бюджет» (новый сторож
      поставщика)
    exposure: >-
      NTF-1 (390b5a33, Р7 строки 712–727, NTF1-B29 строка 1545) делает каждый объявленный атрибут
      обязательным. Замысел отвечает конструктором, отвергающим нуль, и откатом транзакции события.
      Но какие атрибуты несут 24 шаблона kaname и откуда берётся значение каждого — в замысле не
      перечислено (0 строк «шаблон × атрибут × производитель»). Законный нуль в дереве есть:
      приглашение от сервисной учётки — invitedBy пуст по решению (api/user/invite.go:414–430
      @734f69fb4: «A service account is a legitimate inviter … there is no inviting user to record»);
      шаблон invite в примере NTF-1 (A01, строка 1279) объявляет inviter_name. Если шаблон invite
      kaname объявит атрибут приглашающего, приглашение от сервисной учётки получит ошибку
      конструктора, транзакция откатится, законный вызывающий получит отказ INTERNAL — регресс
      действующего поведения. Тот же вид — события класса S, производимые без человека или без
      клиентского контекста (посев администратора облака зовётся из serve.go:2009 и пишет аудит в
      своей транзакции, М32): откат посева — отказ старта. Сегодняшняя форма письма kaname
      (internal/clients/invite_mail.go MailEvent) держит необязательные поля (omitempty) — их
      перенос в «все атрибуты обязательны» и есть непроверенное место.
    condition: >-
      (а) замысел несёт перечень: 24 шаблона × объявленные атрибуты × производитель значения на
      каждом пути вызова (человек, сервисная учётка, посев, внутренний слушатель без клиентского
      адреса) и довод, почему значение на этом пути непусто; (б) атрибут, источник которого на
      законном пути отсутствует, шаблоном не объявляется (разделение шаблона или снятие атрибута),
      а не заполняется подстановкой («unknown», «system», id вместо имени) — подстановка была бы
      умолчанием, выдающим себя за факт; (в) на каждый такой путь — проба действия: источник
      атрибута отсутствует законно → действие исполнено и письмо поставлено (или шаблон атрибута не
      несёт); близнец — конструктор на нуле → ошибка с именем атрибута (уже есть в И34).
    held_by: >-
      модульная проба конструкторов (И34) держит только «нуль отвергнут»; недостижимость нуля на
      законных путях — нет держателя. Нужна проба «приглашение от сервисной учётки при флаге true →
      Operation успешна, строка ленты invite есть» и перепись путей по (а) — заказ; до перечня (а)
      отображение не выдерживает.

