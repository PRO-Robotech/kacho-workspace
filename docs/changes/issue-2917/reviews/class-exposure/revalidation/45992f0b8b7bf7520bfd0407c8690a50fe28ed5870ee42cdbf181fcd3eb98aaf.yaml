remarks:
  - subject: "УК57, класс ответа после переключения базы"
    text: >-
      Не пункт перечня: исход закрытого набора и ответ клиенту от этого не меняются. После
      переключения с потерей хвоста журнала новый первичный узел может выдать тот же xid8 другой
      транзакции. Тогда committed или aborted — ответ о чужой транзакции. Вывод это не ломает:
      истину даёт чтение строки по decision_id, а строки нет, значит ответ 503, и он верен.
      in progress чужой транзакции доведёт опрос до конца anonMailResolveBudget: ответ снова 503 и
      верен, но WARN «исход фиксации не разрешён» запишется, хотя база отвечала. Условие к коду без
      правки замысла: комментарий перечня в resolveCommit называет, что ответ опроса после
      переключения может касаться чужой транзакции и что истина — только чтение строки.
    held_by: "вниманием: гейта нет и не будет — случай требует переключения базы с потерей журнала; проба E2 на одном узле его не воспроизводит"

return_to_acceptance:
  - rule: "Р5 (приёмка 7a424030): «`503` не истрачивает вызов — NTF2-59 (д)»"
    status: не исполнен — перенесён из revalidation/aaaff659 и revalidation/91b3f6b9
    why: >-
      Отпечаток приёмки прежний (7a424030); буквальная строка Р5 на месте (grep -c → 1). Замысел
      редакции 11 возврат больше не называет «вопросом ревью приёмки». Он заведён зависимостью §13 Е15
      с предикатом снятия («на одобренном отпечатке приёмки Р5 называет исключение с ценой») и гейтит
      полосу E2 (tasks.md, E2 — «E1, Е15»; порядок — пункт 1). Со стороны замысла это полное
      отображение. Но пока правки приёмки нет, «Тогда» Р5 допускает меньше, чем механизм способен
      исполнить.
    scenarios: [NTF2-59]

