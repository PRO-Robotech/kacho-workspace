# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 21.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки прежних редакций относятся к своим
# редакциям и здесь не переписываются. Судится дельта редакции 21 против последней пересверенной
# (редакция 20, 83965048): git diff eb7863957 7e8b8298f -- docs/changes/issue-2917/{design,tasks}.md.
# Итог: к-замыслу. CX2-85 отображён ЧАСТИЧНО. Звено (0), исход его разрыва, М74 (10 строк) и пробы на месте.
# Но условие «иных записей в атрибут нет» сужено до «иных присваиваний `self.required` нет», и контроль
# М74 (`self\.required\s*=`) видит только эту форму. Запись в атрибут через имя экземпляра
# (`chart.required = []` в цикле `main`), `setattr` или изменение списка на месте (`.required.clear()`,
# `.required[:] = …`) звено (0) не разрывает. Звенья (i)–(iii) при этом тоже на месте, и перепись печатает
# зелёный «Б10 + Б6». Новый CX2-86 — то же свойство на имени `CHARTS`: якорь — литерал `CHARTS`, звено
# (ii) обходит имя `CHARTS`, а то, что имя связано ровно один раз, звеном не объявлено. Одно условие
# закрывает оба: у каждого носителя цепочки запись в файле ровно та, что названа звеном.
