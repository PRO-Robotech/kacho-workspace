mapped_from_previous:
  - id: CX2-85
    source: revalidation/83965048
    where: "М74; З28 (а) Б10, абзац о носителях, перечень «не выполнилось», (б) (4); §11 CX2-85 (+ CX2-82, CX2-84 печать «(0)–(iii)»); §11а УК81 (+ УК78, УК80); tasks D6 «звено (0) Б10»"
    held: partial
    check: >-
      Отображено: (а) звено (0) добавлено в выражение Б10 — параметр `Chart.__init__` на позиции якоря
      (третий позиционный без `self`) присвоен `self.required` без изменения, сверяется фактом. «Ровно
      (i)–(iii)» заменено на «(0)–(iii)» везде, где стояло: абзац о носителях, перечень, (б) (4), CX2-82,
      CX2-84, УК78, УК80, D6. (б) Исход разрыва — «не выполнилось» `Б10 (0)`, самоистечение молчит,
      зелёного нет. (в) М74 расширен: `\.required\b|required\s*=|__init__`. Счёт — 10 строк, перемерено
      (совпадает дословно). Проба `self.required = []` с близнецом-файлом дерева есть в §11, УК81 и D6.
      Замечания 83965048 (позиция распаковки (ii), ключевой `required=`) внесены в Б10 и получили пробы.
      НЕ отображено: условие (а) 83965048 требовало, чтобы иных записей в атрибут `required` не было ни в
      какой форме — «`self.required = …`, `<ч>.required = …`, `setattr`». Замысел объявляет только «иных
      присваиваний `self.required` в файле нет». Контроль М74 — `grep -cE 'self\.required\s*='` — на
      `chart.required = []` даёт 0 (проверено, см. measurements). Остаток перенесён в CX2-86

new_items:
  - id: CX2-86
    decision: >-
      З28 (а) Б10: якорь — «третий позиционный аргумент записи `Chart(…)` в литерале списка `CHARTS`»;
      звено (0) — «иных присваиваний `self.required` в файле нет»; звено (ii) — «цикл `for <ч> in CHARTS:`».
      М74, контроль — `grep -cE 'self\.required\s*='`
    class: >-
      code-authoring §«Умолчание, которое становится утверждением»: что носитель между звеньями не
      переписан, принято по умолчанию. Звенья объявляют чтения и одно присваивание, но не объявляют, что
      других записей в тот же носитель нет. measurement-discipline §«Предикат — только с контролем»:
      контроль М74 видит одну форму записи из нескольких, и в обратную сторону он не проверен. Это
      продолжение CX2-84/CX2-85: перечень фактов цепочки не закрыт по записям в её носители
    exposure: >-
      Носителей между якорем и helm на 2564 два, и оба пишутся в файле ровно один раз: атрибут `required`
      (89; чтение — 95) и имя модуля `CHARTS` (103; чтения — 298, 327, 357, 510). Замысел закрывает только
      одну форму записи, `self.required =`. Каждый случай ниже рвёт путь `-f` края к helm, а все
      объявленные звенья (0)–(iii) остаются сверенными, и перепись печатает зелёный «Б10 + Б6»:
      (1) в `main` перед `chart.renders()` стоит `chart.required = []` (либо
      `setattr(chart, "required", [])`); (2) изменение на месте — `self.required.clear()`,
      `chart.required[:] = []`, `del CHARTS[3].required[-2:]`, `.remove("-f")`; (3) после литерала имя
      перевязано: `CHARTS = [c for c in CHARTS if c.name != "api-gateway"]` или
      `CHARTS[3] = Chart("api-gateway", "gateway/deploy", [], [])`. Якорь при этом — всё ещё литерал в
      первом связывании `CHARTS`, а звено (ii) обходит уже другой список. Это исход (2) CX2-82 — ложный
      зелёный переписи, от которого CX2-84 (б) обещает «зелёного при разорванном звене нет»
    condition_on_code: >-
      (а) Распознаватель проверяет замкнутость носителей цепочки Б10 общим правилом, не перечнем форм.
      У атрибута `required` запись в файле ровно одна — звено (0). Записью считается любое присваивание
      атрибута `required` любого объекта (`<выр>.required = …`, `+=`, цель распаковки), `setattr(…, "required", …)`,
      `del`, присваивание по индексу или срезу `<выр>.required[…] = …` и вызов изменяющего метода списка на
      `<выр>.required` (`append`, `extend`, `insert`, `remove`, `pop`, `clear`, `sort`, `reverse`).
      У имени `CHARTS` связывание в модуле ровно одно — литерал якоря. Ни перевязки (`CHARTS = …`,
      `global CHARTS`, цель `for`/`with`/распаковки), ни записи по индексу или срезу, ни изменяющего
      метода на `CHARTS` нет. Нарушение правила — «не выполнилось» с координатой и именем звена
      (`Б10 (0)` для `required`, `Б10 (ii)` для `CHARTS`), самоистечение молчит, зелёного «Б10 + Б6» нет —
      исход CX2-84 (б). (б) Контроль М74 заменяется таким, который видит все формы: на 2564
      `grep -nE '\.required\b'` → 2 строки (89 запись, 95 чтение), `grep -nE '\bCHARTS\b'` → 5 строк
      (103 связывание, 298/327/357/510 чтения). Проверка контроля в обратную сторону:
      на `chart.required = []` он даёт находку, а у прежнего `self\.required\s*=` находки нет.
      (в) Пробы по одной, у каждой близнец — файл дерева (молчит): `chart.required = []` в цикле `main` →
      «не выполнилось» `Б10 (0)`; `self.required.clear()` в `renders` до `list(...)` → «не выполнилось»
      `Б10 (0)`; `CHARTS = [c for c in CHARTS if c.name != "api-gateway"]` после литерала →
      «не выполнилось» `Б10 (ii)`. Ни в одной из проб не должно быть красного самоистечения или зелёного «Б10 + Б6»
    held_by: >-
      Нужны пробы (в) в §11 (строка CX2-86), §11а и строке D6 — их нет. До отображения держится вниманием.
      Опасный исход тихий: ложный зелёный переписи. Сам скрипт краснеет отдельно, потому что чарт края
      без слоя отказывает в рендере, но по иной причине, и перепись слой уже засчитала. Случай (3) с
      фильтром записи края тише: чарт края не рендерится вовсе, и `coverage_findings` его не заметит,
      потому что `covered` (298) считается по тому же, уже перевязанному `CHARTS`

remarks:
  - >-
    Третий пропуск подряд в одной цепочке (CX2-84 — звенья, CX2-85 — звено конструктора, CX2-86 — записи
    в носители) говорит о том, что перечень звеньев сам себя не закрывает. Условие (а) CX2-86 поэтому
    сформулировано правилом «носитель пишется ровно там, где названо звено», а не очередной формой. Если
    автор отобразит его перечнем форм, следующая пересверка найдёт следующую форму
  - >-
    `sets` в звене (i) — копия (`list(self.required)`). Её изменение на месте в `renders` покрыто
    формулировкой (i): «изменяется только `sets += <литерал списка>`». Отдельно не выношу

