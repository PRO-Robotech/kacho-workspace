    command: "git show e476ac546:docs/changes/issue-2917/design.md | sha256sum; git show HEAD:… | sha256sum; git diff --quiet e476ac546 HEAD -- docs/changes/issue-2917/"
    result: "подтверждено: 2a329728 в обоих местах; дифф пакета пуст"
  - claim: "М45: своих серверных пределов у края 0; у kaname 6 строк; пин corelib v1.10.0-rc.5 в обоих деревьях; NewPool ставит 30000 и 60000"
    command: "git -C project/kacho grep -nE 'statement_timeout|idle_in_transaction|tcp_keepalives|idle_session_timeout' 6edea09c2ee -- gateway ':!*_test.go' | wc -l; то же по kaname с ':!*.md'; sed -n 30,95p …/corelib@v1.10.0-rc.5/db/pool.go"
    result: >-
      подтверждено: 0 и 6. Вызовы: kaname serve.go:142, 193; край idempotencypg/store.go:385.
      Сверх М45: NewPool ставит ещё CancelRequestContextWatcherHandler (CancelRequestDelay 0,
      DeadlineDelay 500 мс). Пул ограничителя, собранный ParseConfig, этого не получает —
      основание УК54 и CX2-46 (3).
  - claim: "срыв срока контекста в pgx v5.10.0 на пуле без своего обработчика закрывает соединение"
    command: "grep -n 'DeadlineContextWatcherHandler{' …/pgconn/config.go; sed -n 2955,2961p …/pgconn/pgconn.go; sed -n 1400,1414p …/pgconn/pgconn.go; sed -n 180,203p …/tx.go"
    result: >-
      подтверждено. Умолчание — DeadlineContextWatcherHandler{Conn} с нулевой задержкой
      (config.go:374). Ошибка чтения ведёт к asyncClose (pgconn.go:1412), Commit — это Exec на
      контексте вызывающего (tx.go:190). Исход COMMIT при срыве срока клиенту неизвестен.
  - claim: "довод числа: 1 с = захват и не больше трёх ожиданий"
    command: "sed -n 544,548p docs/changes/issue-2917/design.md (ключи); sed -n 630,640p (пометка до ведра)"
    result: >-
      опровергнуто. Ожиданий не меньше 5 для IPv4 и не меньше 6 для IPv6: захват; ключи 2 или 3;
      пометка; ведро. Каждое до 250 мс, итого до 1,25–1,5 с против бюджета 1 с.
  - claim: "М46: Dispatch отбрасывает контекст запроса"
    command: "git -C project/kaname show 734f69fb4:internal/apps/kaname/api/humansession/dispatch.go | sed -n 78,87p"
    result: >-
      подтверждено. Попутно: context.WithValue в не-тестовом дереве kaname встречается 5 раз,
      из них 3 кладут в контекст транзакцию (oauth_ceremony_vaults.go 220, 265, 272, полоса
      обмена OAuth). Вызывающий Dispatch один (recovery_request.go:147), с полосой обмена он
      не пересекается. Наследование значений через WithoutCancel ресурса чужого запроса не
      переносит; пункта нет.
  - claim: "М47: худшее гашение 50 с; terminationGracePeriodSeconds не объявлен"
    command: "git -C project/kaname show 734f69fb4:cmd/kaname/serve.go | sed -n 1690,1721p; … | grep -n gracefulTimeout; git -C project/kacho show 6edea09c2ee:deploy/helm/umbrella/charts/kaname/values.yaml | sed -n 496,499p; git -C project/kaname show 734f69fb4:deploy/values.yaml | sed -n 203,206p; git -C project/kacho grep -l terminationGracePeriodSeconds 6edea09c2ee -- deploy | wc -l; git -C project/kaname grep -l terminationGracePeriodSeconds 734f69fb4 | wc -l; loginlane.go 78–83"
    result: >-
      подтверждено. stopGRPCBounded ×2 (1709, 1710), stopSurfaces (1717), lane.drain (1720);
      gracefulShutdown 10s в обеих поставках; recoveryDispatchTimeout = 30 с (loginlane.go:81);
      объявлений 0 и 0; preStop в подчарте и в deploy/ kaname — 0 и 0.
  - claim: "М48: Invite и ResendInvite — только публичная служба"
    command: "git -C project/kaname grep -nE 'rpc (Invite|ResendInvite)\\b' 734f69fb4 -- 'proto/*.proto'"
    result: "подтверждено: 2 строки, user_service.proto:69 и 118"
  - claim: "М49: recovery_completed рождается двумя путями, 14 файлов"
