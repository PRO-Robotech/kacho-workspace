new_items:
  - id: CX2-46
    decision: "З8, К1 — срок `anonMailDecisionBudget` на захват соединения и ВСЮ транзакцию, включая COMMIT; §7 П9; И6"
    classes:
      - "code-authoring §«Чужой ответ: классификация и бюджет» — ответ «не знаю» классифицирован как «нет»"
      - "code-authoring §«Умолчание, которое становится утверждением» — «ошибка ⇒ откат, пометки нет» как утверждение о состоянии базы"
      - "code-authoring §«Унификация и стоимость» — пул собран в обход общего конструктора и молча теряет его обработчик отмены"
    exposure: >-
      В П9 редакции 8 сказано: «ошибка … срока решения anonMailDecisionBudget на любом шаге →
      откат всей транзакции (пометки нет) → 503». На шаге COMMIT это неверно.
      (1) Срок контекста покрывает Commit (pgx tx.go:190: Commit — это Exec на том же
      контексте). Пул ограничителя строится `pgxpool.ParseConfig` (З8 (3)), а не
      `corelib db.NewPool`, поэтому у него обработчик отмены pgx по умолчанию,
      DeadlineContextWatcherHandler с нулевой задержкой (pgconn.go:2955). Срок ставит сокету
      дедлайн в прошлом, чтение ошибается, и соединение закрывается клиентом (asyncClose,
      pgconn.go:1412). Если COMMIT уже дошёл до сервера, транзакция зафиксирована: пометка
      вызова и момент записаны, а клиент получает `503`. Повтор того же доказательства тогда
      даёт `Replayed`, а не `Fresh`. Это нарушает И6 («не истраченный вызов») и правило Р5
      приёмки («`503` не истрачивает вызов»). NTF2-59 (д) этого не увидит: там хранилище
      остановлено и до COMMIT не доходит.
      (2) Срок срывается не только редко, но и под обычной нагрузкой. Довод числа
      «1 с = 4 × anonMailStoreWait — захват и не больше трёх ожиданий» не сходится с решением
      о ключах того же З8. Каждая попытка взять блокировку ограничена `lock_timeout` отдельно,
      а ожиданий на пути больше трёх:
      - захват соединения;
      - блокировки ключей: IPv4 — не меньше 2 (/32, /24), IPv6 — не меньше 3 (/64, /56, /48);
      - ожидание вставки пометки на конфликте того же доказательства;
      - строка ведра.
      Итого для IPv4 не меньше 5 ожиданий, для IPv6 не меньше 6, то есть до 1,5 с против
      бюджета 1 с. Под конкуренцией предел наступает в хвосте транзакции, там, где стоит COMMIT.
      (3) Каждый срыв срока с обработчиком по умолчанию уничтожает прогретое соединение. Это
      третье окно холодного пула (к CX2-44). Общий конструктор corelib держит противоядие и
      называет его цену (db/pool.go: CancelRequestContextWatcherHandler, DeadlineDelay 500 мс,
      около 100 мс на отмену). Замысел отказался от этого конструктора из-за 30 с и 60 с,
      которые `SET LOCAL` перекрывает и так, а про обработчик не сказал ни слова.
    condition_for_mapping: >-
      Отображение выдерживает, когда в З8, П9 и И6 решены три вещи.
      (а) Как срок решения доходит до соединения. Нужен явный выбор обработчика отмены пула
      ограничителя: CancelRequest, как в corelib (сервер получает отмену, клиент читает
      настоящий исход COMMIT, соединение возвращается в пул; цена — запасной дедлайн и около
      100 мс на отмену), либо умолчание pgx с названной ценой (исход COMMIT неизвестен,
      соединение уничтожено).
      (б) Какой исход у ошибки COMMIT. Ошибка COMMIT — это «исход неизвестен», а не
      `StoreUnavailable`. Сначала исход разрешается чтением пометки или момента на отдельном
      коротком сроке: запись найдена — решение было `Pass` и запрос идёт дальше, записи нет —
      `503`. Второй вариант — COMMIT выводится из бюджета и получает свой предел, а остаток
      (обрыв сети на COMMIT) разрешается тем же чтением. Если замысел выберет не разрешать
      исход, а назвать цену, это меняет правило Р5 — вернуть в приёмку.
      (в) Довод числа `anonMailDecisionBudget` пересчитан по фактическому числу ожиданий для
      IPv4 и IPv6 и по доле COMMIT. Либо бюджет не меньше суммы, либо прямо сказано, что под
      конкуренцией действующий предел — срок решения, а не `lock_timeout`.
    held_by_candidate: >-
      integration-проба на postgres «срок решения истекает на COMMIT». Пробу замедления
      фиксации строит её автор. Утверждается: после ответа `503` повтор того же доказательства
      получает `Fresh`, а если транзакция зафиксирована — запрос уже пропущен, и `503` не было.
      Близнец-инъекция: ошибка COMMIT сведена к `StoreUnavailable` без разрешения исхода →
      `503`, а повтор получает `Replayed` — красный.
    mapped: false

conditions_to_code:
  - id: УК53
    item: "К1 (З8 (2), И37)"
    class: "code-authoring §«Контракт, который нельзя выразить» — два написания одного значения"
    condition: >-
      Строка `SET LOCAL` в `beginDecision` получает оба предела и `lock_timeout` из тех же
      констант Go (`anonMailDecisionBudget`, `anonMailStoreWait`) через Duration → миллисекунды
      в одном месте. Второго литерала «1000» или «1s» в пакете нет. Параметров у строки нет:
      pgx на Exec без аргументов переходит на простой протокол (conn.go:515–518), поэтому три
      оператора одной строкой исполнимы.
    held_by: >-
      модульная проба: строка `SET LOCAL` равна выводу из констант; инъекция другого значения
      константы меняет строку. К ней — строка «одна дверь» гейта формы (И37).
  - id: УК54
    item: "CX2-44, К1"
    class: "code-authoring §«Унификация и стоимость»; §«Порядок операций внутри кода»"
    condition: >-
      Пул ограничителя, собранный `pgxpool.ParseConfig`, задаёт `BuildContextWatcherHandler`
      явно, и окно «срыв срока решения» названо рядом с окнами «перезапуск базы» и «ротация»
      (З8 (3)). Если выбран CancelRequest — допуск модульной пробы срока включает запасной
      дедлайн обработчика.
    held_by: >-
      integration-проба: после срыва срока решения число открытых соединений пула равно
      anonMailPoolConns (при CancelRequest) либо цена названа и проба прогрева повторяется
      после срыва. Модульная проба конфигурации печатает тип обработчика.
  - id: УК55
    item: "CX2-45 (УК49), З24"
    class: "code-authoring §«Порядок операций внутри кода» (порядок блокировок); §«Чужой ответ: классификация и бюджет»"
    condition: >-
      Блокировка строки приглашающего (УК49) названа по режиму и месту в порядке З24. Годится
      `FOR SHARE`: смену адреса она удерживает, а `FOR KEY SHARE` не удерживает. Место — после
      строки аккаунта и до рекомендательной блокировки адресата, одинаково у invite и resend.
      Встречный порядок в дереве есть: `accounts_owner_fk … REFERENCES kaname.users ON DELETE
      RESTRICT DEFERRABLE INITIALLY DEFERRED` (0001_initial.sql:5402). Удаление человека
      берёт его строку, а при фиксации проверка ключа берёт строку аккаунта. Invite берёт
      строку аккаунта, затем строку человека. Ответ 40P01 глагола классифицирован как
      повторяемый отказ, а не как INTERNAL. Цена встречного порядка в модуле уже измерялась:
      6 взаимных блокировок из 6 прогонов (human_session_repo.go:690–699).
    held_by: >-
      integration-проба «invite от владельца аккаунта × удаление этого человека» параллельными
      горутинами: одна транзакция зафиксирована, вторая получает классифицированный отказ, а
      не INTERNAL.
  - id: УК56
    item: "Д23, И13 (З22)"
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» — распознаватель по идентичности, а не по имени"
    condition: >-
      Замысел утверждает, что Д23 предикат единственного держателя не меняет. Это верно только
      при условии, которого замысел не записал: гейт NTF2-30…32 узнаёт секрет почты по
      идентичности объекта, заведённого единственным объявлением чарта, а не по образцу имени
      (`notify-*`, `mail`) и не по именам ключей. «Объект notify» в гейте — это развёртывание
      notify-sender, названное явно: после Д23 и Р8 развёртываний notify два, и оба монтируют
      секреты.
    held_by: >-
      две инъекции гейта. Секрет ключа отпечатка смонтирован в notify-api — гейт молчит
      (близнец). Секрет почты смонтирован в notify-api — красный с именем объекта.

measurements:
