    result: "подтверждено: 14 файлов; recovery_complete.go 4, internal_on_recovery.go 18, hooks_mux.go 3"
  - claim: "М50: посев находит пользователя и не заводит его"
    command: "git -C project/kaname show 734f69fb4:internal/apps/kaname/seed/bootstrap_admin.go | grep -nE 'INSERT INTO|BootstrapSkipNot[A-Za-z]+ '"
