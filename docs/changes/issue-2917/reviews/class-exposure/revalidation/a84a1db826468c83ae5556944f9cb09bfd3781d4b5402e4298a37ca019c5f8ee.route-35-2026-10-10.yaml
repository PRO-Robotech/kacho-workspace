  - id: N35-1
    blocking: false
    decision: "S6, держатель CX2-110: «проба зелёная на базе `d93b69712`»"
    finding: >-
      Названная база не совпадает с базой старта полосы. Колонка зависимостей той же строки S6
      (tasks.md:431) говорит, что S6 стартует на голове `484-notify` после вливания волны NTF-5 2924-K2,
      а с NTF-3 2918-X4e — после той из двух, что влита первой. Обе трогают `recipientdirectory/**`.
      Сейчас голова одна: `git -C project/kaname rev-parse origin/484-notify` → d93b69712. Если K2 или
      X4e изменят порядок исходов Resolve, проба покраснеет уже на базе полосы, до кода S6. Это
      правильный сигнал, а не дефект держателя. Исполнителю нужно читать фразу как «зелёная на базе
      полосы (голове 484-notify при старте)» и печатать эту ревизию. Блокирующим не является, новую
      правку маршрута ради этого не открывать (г).
    predicate: >-
      `git -C project/kaname diff d93b69712 <база полосы> -- internal/apps/kaname/api/recipientdirectory/resolve.go`
      пуст. Если не пуст — проба CX2-110 прогоняется на базе полосы до кода, и её исход печатается.

