closure_of_previous:
  CX2-110:
    status: закрыто в маршруте; условие к коду в замысел ещё не перенесено (заказ ниже, не блокирует)
    evidence: >-
      Строка S6 (tasks.md:431) теперь называет модульную пробу обработчика Resolve до кода:
      audience=event, субъект ACTIVE с `EmailVerified: false` вне аудитории события → AUDIENCE_DENIED
      без адреса. Близнец отличается одним фактом: тот же субъект в аудитории → NO_CONFIRMED_ADDRESS.
      Инъекция «причина „адрес не подтверждён“ до ветки аудитории» → красная. Условие к коду записано
      там же: обработчик сразу отвечает только на «нет пользователя» и «не ACTIVE», а причину
      «адрес не подтверждён» применяет после ветки аудитории. Это совпадает с code_condition пункта в
      записи route-34.
    verification: >-
      (1) Проба зелёная на базе. В resolve.go @d93b69712 SUBJECT_NOT_FOUND стоит на :126, SUBJECT_INACTIVE —
      на :128, AUDIENCE_DENIED для event — на :134–135, и только потом HasConfirmedAddress → NO_CONFIRMED_ADDRESS
      на :151–152. outcome() (:195) адреса не несёт, значит «без адреса» выполнимо.
      (2) Пробу можно собрать на существующем подлоге. fakeStore.users задаёт запись с EmailVerified:false,
      fakeStore.audience задаёт состав аудитории (:58, :92), а base() даёт audience=event (:140). Новой
      оснастки не нужно.
      (3) Инъекция исполнима и даёт красный: возврат NO_CONFIRMED_ADDRESS перед switch (:132) меняет
      исход пробы. Близнец при этом остаётся зелёным.
      (4) Условие покрывает и остальные аудитории. Для account_reader прежний порядок сохраняется:
      дверь notAdmitted → NO_CONFIRMED_ADDRESS (:143–144), иначе AUDIENCE_DENIED. У account_owner, self
      и unset ветки аудитории нет, и там исход от порядка не зависит.

