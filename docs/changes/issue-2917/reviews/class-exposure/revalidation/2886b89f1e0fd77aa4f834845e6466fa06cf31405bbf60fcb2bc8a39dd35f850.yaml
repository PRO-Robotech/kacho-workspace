items:
  - id: CX2-34
    source: "З14 («сверки пароля register — через тот же ограниченный проверяющий, что вход»), З13 (ёмкость диспетчера 16)"
    kind: async_path
    class: >-
      code-authoring §«Решение и его следствие разнесены» (фоновый производитель расходует ресурс
      пути запроса); §«Чужой ответ: классификация и бюджет» (исход «ёмкость исчерпана» без
      классификации); §«Унификация и стоимость» (стоимость на строку под блокировкой)
    exposure: >-
      проверяющий пароля занимает место без ожидания: capacity.acquire — select с default, при
      нехватке Verify сразу отдаёт OutcomeCapacityExhausted (passwordverify/verifier.go:147-151,
      capacity.go:53-65). Ёмкость на профилях — 1 (values.a8f60d.yaml:433), 2 (values.dev.yaml:1925),
      8 (values.prod.yaml:756); ёмкость диспетчера постановки — 16 на любом профиле. Анонимный
      register, пропущенный краем и окном адресата, запускает в фоне до 44 последовательных
      свёрток argon2id (64 МиБ, 3 прохода) — и до 16 таких работ одновременно: фон может занять
      всю ёмкость, и вход паролем получает отказ ёмкости, хотя пользователь входа не
      превышал ничего. Обратное тоже не решено: исход CapacityExhausted внутри работы register
      замысел не классифицирует — прочтение «не совпал» заводит новую запись и новый код (ещё
      одна свёртка в будущем), прочтение «ошибка» роняет работу молча. Сверки идут внутри
      транзакции работы, под блокировкой якоря и с соединением пула на всё время N свёрток.
    condition: >-
      (а) у работы register исход «ёмкость исчерпана» — свой: работа не заводит записи, не пишет
      момента окна и не ставит письма, исход dropped_overload (или свой) метрики З11, а не
      «пароль не совпал»; (б) фоновые сверки не расходуют ёмкость входа: либо работа register
      берёт место из доли, объявленной меньше ёмкости (вход сохраняет ≥ 1 место при любом
      профиле, страж старта сравнивает), либо сверки register ждут место с ограниченным сроком
      (acquireWait) и не больше одной работы register держит место одновременно; (в) число
      свёрток на работу ограничено константой с доводом либо сверка вынесена до захвата якоря
      (сравнение по предварительно прочитанным записям с перепроверкой под блокировкой), и цена
      «до N свёрток под FOR UPDATE якоря» названа числом.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: >-
      нет: нужна проба «16 работ register по 44 записи при verifier-capacity = 2 → вход паролем
      во время работ получает matched, не capacity-exhausted» и проба «CapacityExhausted в работе
      register → записей +0, моментов +0, метрика +1» — заказ
  - id: CX2-35
    source: "§6, З11, З18, З26 (якорь mail_windows; trusted_devices; перечень сроков хранения З26)"
    kind: decision
    class: >-
      code-authoring §«Решение и его следствие разнесены» (ресурс, заводимый анонимным входом, без
      уборки); §«Порядок операций внутри кода» (порядок снятия ресурса против протокола
      блокировки)
    exposure: >-
      строка-якорь mail_windows (purpose, key_digest) заводится на каждый новый ключ, в том числе
      анонимным register на произвольный адрес, а срока хранения у неё нет: З26 перечисляет
      моменты, акты, ожидающие регистрации, вызовы и ledger, но не якорь; число строк растёт с
      числом адресов, когда-либо названных анонимно. То же у trusted_devices: строка на каждый
      вход паролем без метки, метка истекает по issued_at + ttl, строка остаётся (каскад только от
      users). Если уборку якоря добавить наивно, она ломает протокол CX2-14: работа сделала
      INSERT … ON CONFLICT DO NOTHING (строка была), уборка удалила якорь, SELECT … FOR UPDATE
      вернул 0 строк — работа идёт без сериализации, и гонка первых запросов возвращается.
    condition: >-
      (а) у якоря mail_windows и у trusted_devices срок хранения назван решением: якорь снимается,
      когда у ключа нет ни моментов, ни ожидающих записей (одним DELETE … WHERE NOT EXISTS под
      блокировкой строки), метка — после issued_at + ttl; (б) работа окна требует, чтобы
      SELECT … FOR UPDATE якоря вернул ровно одну строку, иначе повторяет вставку (ограниченное
      число раз, затем ошибка хранилища) — «0 строк» не читается как «заблокировано»;
      (в) integration-проба «уборка якоря между вставкой и FOR UPDATE → работа повторила вставку,
      одна строка ленты».
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "нет: проба (в) и проба уборки «якорь без моментов снят, с моментом — нет» — заказ"

