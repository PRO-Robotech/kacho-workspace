mapping_check:
  - item: CX2-107
    verdict: mapped_with_new_exposure
    text: >-
      (б)–(е) выполнены. `A` каноническая, проверка `A == lower(A)` и ASCII, отсюда `Account(A) = A`. Окно
      считается по `now()` базы в том же запросе. Ошибка или отсутствие таблицы или столбца дают «не
      выполнилось», а не 0. Контроль после (г) — 1/1 по `address_source` и `address_ceiling`. Соль попытки
      печатается. Инъекция — заглавная буква с близнецом. (а) отображён с дефектом порядка, см. CX2-109
  - item: CX2-108
    verdict: holds
    text: >-
      Решение принято: `gate.check` с `recovery_complete.go` снимается (сейчас :176 @0f2395a624f),
      предъявление судит только `AttemptGuard`. Это совпадает с приёмкой: «Перебор кода держат оси
      kaname, одинаковые на всех путях предъявления» — две оси «адрес + источник» и потолок по адресу.
      Гейт вызывающих печатает 3 / 6 / 0 и несёт инъекцию с близнецом. Хранилище — существующая
      `login_failures` (scope, key, failed_at), её CHECK `scope` сейчас допускает `address` и `source`
      (миграция 20260916190000:120). Расширяет его новая миграция S3, применённая не правится. E2
      печатает ревизию kaname и `pg_constraint`, без `address_source` — «не выполнилось»
  - item: N31-1
