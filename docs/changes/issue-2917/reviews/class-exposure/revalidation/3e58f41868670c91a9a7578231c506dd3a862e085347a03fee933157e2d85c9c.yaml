notes:
  - id: N32-1
    blocking: false
    where: "design.md §6 абзац «Страж попыток (З15)»; строка S3"
    text: >-
      Миграция S3 расширяет CHECK `scope` снятием и созданием ограничения. У сужения, то есть у `-- +goose
      Down`, на таблице со строками `address_source` и `address_ceiling` есть два исхода: отказ отката либо
      молчаливая потеря строк. Сейчас ни один не назван. Надо назвать, что делает Down: удаляет строки
      новых осей до сужения (`DELETE … WHERE scope IN ('address_source','address_ceiling')`) или
      откатывается отказом с причиной. Integration-проба S3 делает Down и Up на таблице со строкой новой оси
    predicate: "строка S3 называет поведение Down при строках новых осей и пробу Down/Up"

