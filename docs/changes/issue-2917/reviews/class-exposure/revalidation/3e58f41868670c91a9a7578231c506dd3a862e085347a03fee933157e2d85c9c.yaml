new_items:
  - id: CX2-109
    decision: "CX2-107 (а) в редакции 32: ключ источника — значение `X-Forwarded-For`, «увиденное посредником край → kaname в запросах (г)»; перед (г) — чтение следов по осям `source` и `address_source` этим ключом и инъекция «неудачи пары (A, S1) в хранилище AttemptGuard до (г)»"
    class: >-
      code-authoring §«Порядок операций внутри кода»: значение читается раньше, чем появляется.
      measurement-discipline §«Предикат — только с контролем»: ноль, прочитанный по ключу, которого ещё
      нет, означает «не умею сказать», а не «следов нет»
    exposure: >-
      В строке E2 и в З8 стоят рядом два шага. Первый — «перед (г) … следы по осям `address`, `source`,
      `address_source` (ключ `<длина S>:<S><A>`), `address_ceiling` — все 0». Второй — «ключ источника —
      значение `X-Forwarded-For`, увиденное посредником … в запросах (г)». Пока (г) не прошла, посредник
      её запросов не видел, и ключа для двух осей из четырёх нет. Исполнитель решит это одним из двух
      способов, и оба плохие: подставит литерал `S1` (второе написание ключа, ровно то, что снимал
      CX2-107) или пропустит чтение до (г), и ноль окажется напечатан без предмета. Инъекция «неудачи
      пары (`A`, `S1`) … до (г)» тоже нуждается в ключе пары до (г). Контроль 1/1 после (г) ловит неверный
      ключ только у `AttemptGuard`. Ось `source` у `attemptGate` после (г) печатается без утверждения
      («печатаются без утверждения»), и её чтение до (г) по неверному ключу останется ложным нулём.
      Источник есть уже в сценарии. По приёмке, NTF2-60 When (а), с `S1` идут запросы `POST
      /iam/v1/auth/recovery`, и `H` из них звено пропускает до kaname. Значит, посредник видит значение
      источника ещё до (г)
    condition_on_code: >-
      (а) Ключ источника для чтения до (г) и для инъекции берётся из запросов (а) этого же прогона: тех,
      что посредник пропустил к kaname. Если таких запросов 0 — «не выполнилось». Печатаются значение и
      число запросов. (б) Значение `X-Forwarded-For` в запросах (г) обязано совпасть с ним. Расхождение
      или больше одного значения — «не выполнилось» с обоими. (в) К значению применяется то же
      преобразование, что у полосы формы kaname (`strings.TrimSpace`), — одной функцией. Своего
      написания ключа проба не заводит
    held_by: >-
      Нужна инъекция E2, её нет. Посредник подаёт в (г) значение источника, отличное от значения в (а) →
      «не выполнилось» с обоими значениями, а не зелёный и не красный. Близнец — значения равны → чтение
      до (г) по этому ключу, 0 по четырём осям, после (г) 1/1. Однофайлового признака нет

