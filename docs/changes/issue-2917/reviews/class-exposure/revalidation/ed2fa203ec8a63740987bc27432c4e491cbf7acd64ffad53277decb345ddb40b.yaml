new_items:
  - id: CX2-80
    decision: >-
      Д52 в З28 (б) и tasks D6: «Слой — `-f deploy/testdata/notify-standalone/edge.yaml`, путь от корня
      репозитория… (1) помощник `helmTemplate` добавляет слой одной строкой внутри помощника». Там же
      перепись D6 (а): «по каждому рендеру — координату вызова и файл-источник значения ручки (у каждого —
      edge.yaml; иной источник… — красный)»
    class: >-
      code-authoring §«Контракт, который нельзя выразить»: у одного значения (физический файл слоя)
      несколько написаний, и замысел предписывает одно на всех. testing-verdict п.14 «Твой СОБСТВЕННЫЙ
      разборщик — тоже распознаватель»: перепись судит «файл-источник» собственным разбором вызова.
      architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» —
      форма пути в trivy.yaml и в ведомости стыкуется по строке
    exposure: >-
      helm разрешает относительный `-f` от текущего каталога процесса. То же для trivy `helm.values`
      (NTF-1 М48 (2)). У семи семейств М67 четыре разные базы: `helmTemplate` вызывает
      `exec.Command("helm", "template", ".")` из каталога пакета `gateway/deploy`;
      `edge_retired_knobs_render_test.go` — из `deploy/` (`edgeChartDir = ../gateway/deploy`);
      `edge-keyset-hop-test.sh` называет `REPO_ROOT` каталог `deploy/`, а корень репозитория там —
      `MONOREPO`; `iam-trusted-forwarder-test.sh` — `REPO_ROOT` = корень; `lint-service-charts.sh` делает
      `cd` в корень; `check-volume-mounts.py` вызывает helm без `cwd`; trivy запускается из корня.
      Буквальная строка из замысла внутри `helmTemplate` даёт `Error: open
      deploy/testdata/notify-standalone/edge.yaml: no such file or directory`, код 1 (синтетика, helm
      4.2.4). Написание `../../deploy/…` из того же каталога даёт код 0. Сам рендер отказывает громко, `go
      test` краснеет, так что молча ничего не проходит. Опасна перепись D6: если она сверяет «файл-источник»
      с текстом `deploy/testdata/notify-standalone/edge.yaml`, у неё два неверных исхода. Первый — она
      требует написания, на котором два Go-семейства не рендерятся. Второй — краснеет «иным источником» на
      рабочем `../../deploy/…` или `filepath.Join(…)`. Если же сверять по подстроке `edge.yaml`, пройдёт и
      `$REPO_ROOT/deploy/testdata/…` в `edge-keyset-hop-test.sh`, а это `deploy/deploy/testdata/…`. Правило
      «обязан выпасть» (CX2-77 (б)) стыкует запись ведомости `-f <файл>` с записью `helm.values` того же
      `<файл>` по строке. `./deploy/…` и `deploy/…` — один файл, но разные строки: записи не найдут друг
      друга
    condition_on_code: >-
      (а) Замысел называет написание слоя по базе каждого семейства. Пример: `helmTemplate` —
      путь от каталога пакета (`../../deploy/testdata/notify-standalone/edge.yaml`) или от корня,
      вычисленного помощником; `edge_retired_knobs_render_test.go` — от `deploy/`;
      `edge-keyset-hop-test.sh` — `$MONOREPO/deploy/…`, не `$REPO_ROOT/…`;
      `iam-trusted-forwarder-test.sh` — `$REPO_ROOT/deploy/…`; ведомость, сверка томов и trivy.yaml —
      от корня, запускаются из корня. Слова «путь от корня репозитория» относятся к файлу, а не к
      аргументу каждого вызова. (б) Перепись D6 судит файл-источник по тождеству файла: аргумент `-f`
      разрешается от базы своего вызова, и результат совпадает с `<корень>/deploy/testdata/notify-standalone/edge.yaml`.
      По каждому рендеру печатаются координата, написание и разрешённый путь. Совпадение по тексту и по
      подстроке исходом не считается. Если базу вызова распознаватель не установил, исход — «не
      выполнилось» с координатой, а не зелёный. (в) Правило «обязан выпасть» стыкует записи по
      нормализованному пути от корня. Запись ведомости `-f <файл>`, для которой нет записи `helm.values`
      с тем же файлом, даёт красный с именем записи, а не пропуск. (г) Проба распознавателя в обе
      стороны. `helmTemplate` с написанием `deploy/testdata/…` (от корня) → перепись: «разрешённый путь не
      существует», красный, и `go test ./gateway/deploy` тоже красный. Близнец — `../../deploy/…` → оба
      молчат. `edge-keyset-hop-test.sh` с `$REPO_ROOT/deploy/…` → красный переписи с разрешённым путём
      `deploy/deploy/…`
    held_by: >-
      Сам неверный путь держится громко: рендер отказывает, и `go test`, шелл-пробы и ведомость краснеют.
      Исход переписи D6 и правила «обязан выпасть» держится только пробами (г), а их в замысле и
      маршруте нет. До отображения держится вниманием

remarks:
  - subject: "§13 Е13 замысла не называет D6 среди гейтируемых, а маршрут называет"
    text: >-
      Строка Е13 в design.md: «гейтит D3, D5, а D1 — через путь values.a8f60d.yaml». В tasks.md та же Е13:
      «гейтит D1, D3, D5, D6 (NTF1-D9, NTF1-D2, NTF1-D1s)», и З28 «Порядок» ставит D6 после Е13. Два
      места об одном предмете расходятся. Это тот же род, что у CX2-72 с Е12, который редакция 16
      исправила в строке Е12. Маршрут верен, класса это не даёт. Поправить при следующей правке замысла.
  - subject: "§0, строка замысла NTF-1: «вердикта и пересверки на замысел нет»"
    text: >-
      На 5228b32b (редакция 30 NTF-1) есть пересверка (outcome: to_code, коммит febdd4a23) и ревью
      design-reviewer (APPROVED, коммит e7dbe88c7). Оба закоммичены за 3–5 минут до 63bfbab5c. Решений
      NTF-2 это не меняет: Е17 (б), (д) держится сильнее, Е18 по-прежнему открыта — её предикат на
      5228b32b/d17ace5c перемерен: 0/0/0/0 и литерал «файлов значений 2» ×2. Строку §0 при следующей правке
      привести к записям.
  - subject: "правило «обязан выпасть» и запись ведомости с несколькими -f"
    text: >-
      CX2-77 (б) выводит правило из записи `<чарт>|-f <файл>`. Что делать с записью, где несколько `-f`,
      не сказано: требовать выпадения без каждого файла или без хотя бы одного. Сегодня такой записи нет.
      Ведомость содержит nlb и registry с `--set`, а notify вне её области (NTF-1 М49 (7)). Пункта это
      не даёт. Если появится вторая `-f`-запись, её семантику назначает тот, кто её заводит.

