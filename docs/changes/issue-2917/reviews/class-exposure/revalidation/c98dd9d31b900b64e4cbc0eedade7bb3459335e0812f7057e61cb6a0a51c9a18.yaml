new_items:
  - id: CX2-81
    decision: >-
      Отображение CX2-80 (З28 (а); tasks D6): «аргумент `-f` разрешается от базы своего вызова — текущего
      каталога процесса… либо корня, от которого вызов строит путь (переменная шелл-пробы, `REPO`)…
      базу вызова распознаватель не установил — «не выполнилось» с координатой». З28 (б) (1): `helmTemplate`
      — «от каталога пакета… либо от корня, вычисленного помощником»
    class: >-
      testing-verdict п.14 «Твой СОБСТВЕННЫЙ разборщик — тоже распознаватель»: распознаватель базы — свой
      разбор, и множество форм, которые он разрешает, не объявлено. gate-authoring §«исход вместо
      объявления»: у исхода «не выполнилось» нет пробы. code-authoring §«Умолчание, которое становится
      утверждением»: форма, не опознанная как база, склонна молча читаться как «корень»
    exposure: >-
      На 2564 базы шелл-проб — цепочки времени исполнения. В `edge-keyset-hop-test.sh` (строки 56–58)
      `HERE="$(cd "$(dirname "$0")" && pwd)"` → `REPO_ROOT="$(cd "$HERE/../.." && pwd)"` → `MONOREPO="$(cd
      "$REPO_ROOT/.." && pwd)"`. В `iam-trusted-forwarder-test.sh` (39–41) — HERE → DEPLOY_ROOT → REPO_ROOT.
      Базы в Python — `REPO = pathlib.Path(__file__).resolve().parents[2]`. «Корень, вычисленный помощником»
      в Go — возврат функции. Статически установить любую из этих баз распознаватель может только по
      объявленному правилу вида «имя → каталог». Правила в замысле нет, и два неверных исхода остаются
      открытыми. (1) Распознаватель не знает имени и честно даёт «не выполнилось» на рабочем написании.
      Перепись тогда не зеленеет никогда, D6 стоит, и есть соблазн ослабить исход. (2) Распознаватель
      подставляет неизвестной переменной корень. Проба «`$REPO_ROOT/deploy/…` → `deploy/deploy/…`» ловит
      это только для REPO_ROOT, а `$DEPLOY_ROOT/…`, `$HERE/…` и Go-вызов неизвестной функции остаются
      непокрытыми. У исхода «не выполнилось» проба не названа ни в §11 CX2-80, ни в УК76, ни в D6
      (прочитано), значит ветку можно не написать, и зелёный от этого не изменится
    condition_on_code: >-
      (а) Рядом с переписью объявлена таблица баз: по каждому семейству М67 (и по найденному сверх) —
      выражение базы, которое распознаватель принимает, и каталог, в который оно разрешается. Например:
      `edge-keyset-hop-test.sh`: `$MONOREPO` → корень, `$REPO_ROOT` → `deploy/`;
      `iam-trusted-forwarder-test.sh`: `$REPO_ROOT` → корень, `$DEPLOY_ROOT` → `deploy/`;
      `check-volume-mounts.py`: `REPO` → корень; Go без `Dir` → каталог пакета. Выражение вне таблицы даёт
      «не выполнилось» с координатой и текстом выражения. Корнем по умолчанию оно не считается. (б) Написание
      каждого семейства, выбранное D6, есть в таблице. Для `helmTemplate` вариант «корень, вычисленный
      помощником» либо снят, либо функция помощника названа строкой таблицы. (в) Пробы: написание с базой
      вне таблицы (`$OTHER/deploy/testdata/…` в шелл-пробе; Go-вызов незнакомой функции) → «не
      выполнилось» с координатой, не зелёный и не красный. Близнец — то же написание через выражение из
      таблицы → молчит. Строка таблицы, выражения которой нет ни в одном семействе, → красный (самоистечение)
    held_by: >-
      Нужны проба (в) и самоистечение таблицы в строке D6, а их нет. До отображения держится вниманием. Не
      тихо: перепись без контроля М67 не зеленеет, и неразрешимая база даёт громкое «не выполнилось».
      Тихий исход — только ветка (2)

remarks:
  - subject: "`sweep`: переписывание `-f` записи и два потребителя `$args`"
    text: >-
      `$args` в `sweep` читают `helm lint` (строка 110) и `helm template` (строки 118, 132). Если путь `-f`
      разрешать от `<корень>` не в `coords`/`args`, а у одного вызова, то lint в самопроверке прочтёт файл
      настоящего дерева. Проба `--self-test` («файла нет в копии → красный») покраснеет и при частичной
      правке, поэтому неверного вердикта это не даёт. Разумно переписывать один раз, там, где собирается
      `args`. Какие написания флага переписываются (`-f x`, `--values x`, `-f=x`), решает исполнитель.
      Сегодня в ведомости других `-f`-записей нет. Класса это не даёт.

