#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки прежних редакций относятся к
# своим редакциям и здесь не переписываются. Судится дельта редакции 13 против последней разобранной
# (редакция 11, 45992f0b; на редакцию 12, 05ce3d98, пересверки нет — её дельта входит сюда):
# git diff 4f8430b51 5c3502f8e -- docs/changes/issue-2917/{design,tasks}.md.
