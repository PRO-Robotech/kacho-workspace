new_items:
  - id: CX2-68
    decision: "З28 «Форма (а)» — «в значениях чарта края значения нет; шаблон края читает его как обязательный (`required`)»; tasks D6"
    class: >-
      code-authoring §«Решение и его следствие разнесены» (решение — `required` в шаблоне
      gateway/deploy; следствие — отказ каждого рендера этого чарта без значения); измерение —
      measurement-discipline §«Радиус: по имени механизма и по точкам применения»
    finding: >-
      Замысел меряет радиус только по цепочкам зонтика (М66, семь цепочек) и по переписи NTF1-D2
      «рендер `prod`». Но чарт края рендерят и отдельно, без значений зонтика. На 2564 таких
      читателей четыре семейства: (1) Go-помощник helmTemplate (gateway/deploy/render_geo_test.go) —
      8 вызовов в 3 файлах: render_geo_test.go, jwks_ca_render_test.go,
      render_internal_listener_retired_test.go; при ошибке рендера — t.Fatalf; (2)
      .github/scripts/lint-service-charts.sh — обходит gateway/deploy по индексу git. Его ведомость
      отказывающих чартов «самоистекает в обе стороны», сейчас в ней две записи (nlb, registry),
      записи края нет; (3) .github/scripts/check-volume-mounts.py — Chart("api-gateway",
      "gateway/deploy", --set image, name), матрица тумблеров; (4)
      deploy/tests/helm/iam-trusted-forwarder-test.sh — peer_san рендерит gateway/deploy, два цикла.
      После D6 каждый из них отказывает. Ни одно из имён не встречается в design.md, tasks.md и
      замысле NTF-1 (grep → 0). Самая дешёвая «починка» красного — умолчание в
      gateway/deploy/values.yaml. Ровно это Д51 и К1 запрещают: база молча вернулась бы на уровень
      подчарта.
    condition_on_code: >-
      (а) Полоса D6 перечисляет рендеры чарта края без зонтика переписью по дереву, а не по памяти.
      Перепись печатает число, контроль — эти четыре семейства на 2564. Пути всех четырёх семейств
      входят в пути полосы D6. (б) Каждый такой рендер подаёт значение ручки явно — синтетической
      координатой в форме ведомости. В lint-service-charts.sh — запись `gateway/deploy|--set <ключ>=…`;
      ведомость краснеет на записи без отказа, значит запись сама держит «чарт края отказывает без
      ручки». (в) В gateway/deploy/values.yaml ключа ручки нет: ни значения, ни пустышки.
    held_by: >-
      (а), (б) — красные этих гейтов в конвейере (go test ./gateway/deploy, «сервисный чарт
      рендерится», «каждый volumeMount имеет свой volume», helm-manifest-test): D6 без них не
      проходит. (в) — инъекция D6 «строка снята из values.own.yaml → рендер own отказывает». При
      умолчании в значениях подчарта own отрендерится `1`, и инъекция покраснеет. Условие: эта
      инъекция в D6 обязательна, а не одна из многих
  - id: CX2-69
    decision: "З8 «Одна ручка прыжков» (`0` — не верить пересланным, ключ — TCP-пир) × З28 «Форма (а)» (шаблон края)"
    class: "code-authoring §«Умолчание, которое становится утверждением» (отсутствие, представимое отдельно от значения); §«Контракт, который нельзя выразить»"
    finding: >-
      `0` — законное значение ручки со своей семантикой. В шаблоне края рядом уже стоит форма «ручка
      без умолчания» — `{{- with .Values.… }}`, 3 места в gateway/deploy/templates/deployment.yaml на
      2564 (identityProvider, iamLoginLaneUrl, iamIssuanceUrl). Замер helm 4.2.4: `with` на 0
      переменную не эмитит, `required … | quote` на 0 даёт "0", на пустой строке и отсутствии —
      отказ. Если перенести соседнюю форму, топология «прыжков 0» в чарте невыразима. Отказ при этом
      приходит от старта процесса (переменной нет), а не от рендера. Проба D6 утверждает только `1`
      из файлов стендов, близнеца со значением 0 у неё нет.
    condition_on_code: >-
      Шаблон края эмитит KACHO_API_GATEWAY_TRUSTED_HOPS безусловно, через `required "<имя ручки> …"`,
      без `with`, `if`, `default`, `empty`, `coalesce` вокруг ключа. Проба D6 несёт вариант «значение 0
      → переменная "0" в Deployment края» и близнец-инъекцию «форма with» — на 0 переменной нет,
      красный.
    held_by: "проба D6 — после внесения варианта; до того вниманием"
  - id: CX2-70
    decision: "tasks D6, предикат снятия: «рендер `prod` без образца — отказ с именем KACHO_API_GATEWAY_TRUSTED_HOPS, близнец — через обёртку с образцом каталога»; З28 «Держатель»"
    class: "change-graph: отрицательный кейс меняет ровно один факт против положительного близнеца; gate-authoring — отрицание в паре с положительным"
    finding: >-
      «prod без образца» против «prod с образцом» — это два факта: нет узла почты (Д46, `required`
      NTF1-D1) и нет ручки. helm 4.2.4 при двух незаданных `required` печатает одну ошибку (замер на
      игрушечном чарте: одна строка Error, имя — по порядку шаблонов, а не по предмету проверки).
      Какое имя выйдет, решает порядок шаблонов. Утверждение «отказ с именем ручки» станет
      недетерминированным по предмету либо стабильно красным. Та же находка на стороне NTF-1 —
      CX1-94 и N19 пересверки efff0ee7 (коммит 72929148b).
    condition_on_code: >-
      Отрицательный близнец D6 — рендер `prod` через обёртку NTF1-D9 с образцом каталога, из которого
      снята только строка ручки (узел почты на месте) → отказ с именем ручки. Положительный близнец —
      тот же образец со строкой → проходит. Проба печатает предпосылку «незаданное обязательное
      значение одно» и имя снятого ключа. Инъекция «сняты оба ключа» даёт исход «не выполнилось:
      предпосылка», а не зелёный и не красный с чужим именем.
    held_by: "проба D6 — после правки её предиката; форма согласуется с CX1-94 (а)–(г) NTF-1"

remarks:
  - subject: "E1 садится только вместе с D6"
    text: >-
      Связь названа (tasks E1 «зависит от», §4 п.6), но держится она сведением волны, а не гейтом.
      Если E1 войдёт без D6, конвейер рендера зелёный: значения нет — переменной нет, и
      producerless_input_test этого не ловит, он краснеет только когда у конструктора нет ни одного
      производимого входа. Отказ старта края виден лишь на подъёме стенда. Цена названа, отдельного
      пункта это не даёт.
    held_by: "вниманием: состав запроса волны; первый подъём стенда после сведения"
  - subject: "критический путь E-яруса"
    text: >-
      Через «E1 садится с D6» полосы E1 → E2 → E3, E4, X1, X2 теперь транзитивно стоят за Е12
      (вливание kacho#1276 в 2564; на замере не влит — merge-base → 1), за Е13 и за Е16. Замысел
      это называет, класса здесь нет, но это новая цена маршрута для диспетчера.
  - subject: "Е17 значится «принята», а пересверка NTF-1 efff0ee7 держит (б) лишь при пустом перечне prod (CX1-95)"
    text: >-
      Строка D6 «проба образца NTF1-D9 — каждый файл каталога → код 0» опирается на Е17 (б). Пока
      NTF-1 не отобразит CX1-95, статус «принята» у Е17 завышен. Предикат снятия Е17 следует
      привязать к отпечатку замысла NTF-1, отображающего CX1-95, а не к efff0ee7.

