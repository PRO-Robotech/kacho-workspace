# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 22.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки прежних редакций относятся к своим
# редакциям и здесь не переписываются. Судится дельта редакции 22 против последней пересверенной
# (редакция 21, e1dde68e): git diff 7e8b8298f d94a67fd9 -- docs/changes/issue-2917/{design,tasks}.md.
# Итог: к-замыслу. CX2-86 и остаток CX2-85 отображены. Правило вхождения для носителей `required` и `CHARTS`
# сформулировано общим правилом, а не перечнем форм. М74 перемерен и совпадает дословно. Строка §11,
# УК82 и D6 на месте. Новый CX2-87: три пробы отображения берут только формы записи, которые видит и
# распознаватель-перечень форм. Поэтому они не отличают объявленное правило вхождения от более слабой
# реализации, а ровно этот исход предупреждала пересверка e1dde68e. Кроме того, две неверные записи в
# тексте замысла: сводка §11 называет 86 строк при 87, а М74 называет контроль записи видящим «все формы»,
# хотя пять форм он не видит.
