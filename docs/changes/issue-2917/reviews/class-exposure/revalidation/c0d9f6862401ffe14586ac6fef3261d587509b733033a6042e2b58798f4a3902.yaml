mapped_from_previous:
  - id: CX2-85 (остаток)
    source: revalidation/e1dde68e
    where: "З28 (а) Б10 «Носители»; §11 CX2-85; §11а УК81 («запись атрибута в файле одна во всех формах, с редакции 22 — правило носителей, УК82»); М74"
    held: yes
    check: >-
      Запись в атрибут `required` судится теперь в любой форме, а не только как `self.required =`. Это
      присваивание через атрибут любого объекта, дополненное присваивание, запись по индексу и срезу,
      `setattr`/`delattr`, доступ по имени, `del` и изменяющий метод. Прежний контроль `self\.required\s*=`
      снят, и в М74 записано, почему
  - id: CX2-86
    source: revalidation/e1dde68e
    where: "З28 (а) Б10 «Носители», абзац о носителях, перечень «не выполнилось»; М74; §11 CX2-86; §11а УК82; tasks D6"
    held: partial
    check: >-
      Отображены (а), (б) и (в) условия. (а) Правило вхождения, а не перечень форм: у каждого носителя
      каждое вхождение в файле ровно в той роли, что названа якорем или звеном. `required` пишется звеном
      (0) и читается звеном (i). `CHARTS` связывается якорем и читается итерацией `in` и аргументом `len`.
      Псевдоним, через который можно писать, тоже считается вхождением вне роли. (б) Исход нарушения —
      «не выполнилось» `Б10 (0)` или `Б10 (ii)` с координатой вхождения; самоистечение молчит, зелёного нет.
      (в) Три инъекции с близнецом — файлом дерева есть в §11, УК82 и D6. Перемерено: предикат звеньев
      даёт 15 строк, дословно как заявлено; перепись вхождений — 2 + 5 строк, роли названы верно; контроль
      на дереве даёт 2 строки (89, 103); на всех восьми заявленных инъекциях — 1, на обоих чтениях — 0.
      НЕ отображено: пробы. Все три инъекции (`chart.required = []`, `.required.clear()`,
      `CHARTS = [… if …]`) — формы, которые видит и строковый контроль М74, то есть и распознаватель-перечень
      форм. Правило вхождения их пробами не отличено от перечня форм. Остаток — CX2-87

new_items:
  - id: CX2-87
    decision: >-
      З28 (а) Б10 «Носители»: распознаватель D6 судит носители `required` и `CHARTS` правилом вхождения
      по разбору, М74 прямо разводит «строковый контроль — прибор замера, распознаватель судит по разбору».
      Пробы отображения — §11 CX2-86, УК82, D6 — три инъекции
    class: >-
      gate-authoring — проба обязана отличать объявленное свойство от более слабой реализации, которая
      проходит те же пробы. code-authoring §«Инвариант и оснастка — это тоже прод-код»: распознаватель
      переписи судится по идентичности (роль вхождения), а не по имени формы. Продолжение CX2-84…86: там
      перечню звеньев не хватало факта, здесь пробам не хватает формы, на которой перечень форм и правило
      вхождения расходятся
    exposure: >-
      Все три пробы проходит распознаватель, который реализует перечень форм записи, например ровно
      регулярку контроля М74 или её AST-аналог: присваивание в `.required`/`CHARTS`, изменяющий метод,
      `setattr`, `del`, `global`. Правило вхождения при такой реализации не исполнено. Измерено, что
      контроль М74 (он и есть такой перечень) даёт 0 на формах, которые правило вхождения обязано поймать:
      `req = chart.required` + `req.clear()` (псевдоним), `charts = CHARTS` + `charts.pop()`,
      `for CHARTS in …:`, `CHARTS: list = …`, `(CHARTS := …)`, `vars(chart)["required"] = []`,
      `chart.__dict__["required"] = []`, `CHARTS.__setitem__(0, …)`. На каждой из них распознаватель-перечень
      печатает зелёный «Б10 (0)–(iii) + Б6» при `-f`, не доходящем до helm. Это исход (2) CX2-82, и все три
      пробы при этом зелёные
    condition_on_code: >-
      (а) К трём инъекциям CX2-86 добавить минимум две, взятые из форм, которых нет ни в одном перечне форм
      записи, и каждую сравнить с близнецом — файлом дерева (близнец молчит):
      (4) в `main` перед циклом `for chart in CHARTS:` вставлено `req = chart.required` и следом
      `req.clear()` → «не выполнилось» `Б10 (0)` с координатой вхождения `chart.required` в псевдоним;
      (5) после литерала вставлено `charts = CHARTS` и следом `charts.pop()` → «не выполнилось» `Б10 (ii)` с
      координатой вхождения `CHARTS` в псевдоним. Ни в одной нет красного самоистечения и зелёного «Б10 + Б6».
      (б) Пробы (4) и (5) названы в §11 CX2-86 (или новой строке CX2-87), в §11а и в строке D6.
      (в) В D6 записано, что распознаватель перечисляет вхождения носителя (узлы `Attribute` с `attr ==
      "required"` и `Name` с `id == "CHARTS"`, а также строковый литерал `"required"` в вызове
      `getattr`/`setattr`/`delattr` и в индексе `vars(…)`/`__dict__`) и сверяет роль каждого вхождения.
      Формы записи он не перечисляет
    held_by: >-
      Нужны пробы (4) и (5) — их нет. До отображения держится вниманием, а опасный исход тихий: ложный
      зелёный переписи при реализации «по перечню форм», которую все три текущие пробы принимают

remarks:
  - >-
    Сводка §11 неверна: «строк отображения — grep -c '^| CX2-' … → 86 на этой редакции; различных пунктов
    столько же — номера CX2-01…85 плюс CX2-47 · aaaff659». Замер на c0d9f686 даёт 87, номера CX2-01…86.
    Разбивка по записям в том же абзаце в сумме даёт 87, а итог не пересчитан. Абзац сам объявляет, что
    сводка «выводится из таблицы, а не пишется руками» (М1 ревью aaaff659). Правится тем же заходом, что и
    CX2-87
  - >-
    В М74 контроль назван «контроль записи во всех формах» и «видит все формы». Это неверно: на
    `CHARTS: list = []`, `for CHARTS in []:`, `(CHARTS := [])`, `vars(chart)["required"] = []`,
    `chart.__dict__["required"]=[]`, `CHARTS.__setitem__(0, x)` и псевдониме он даёт 0. Вывод о дереве от
    этого не меняется: полноту на 2564 держит перепись вхождений `\.required\b|\bCHARTS\b` (2 + 5 строк,
    каждой названа роль) вместе с отдельным `setattr|getattr|vars\(|__dict__|global` → 0. Поэтому это не
    пункт, а правка слов: «контроль записи в перечисленных формах; прочие формы видит перепись вхождений
    и отдельный предикат доступа по имени»
  - >-
    Правило вхождения строгое: безвредное новое чтение (например, `print(chart.required)`) тоже даст «не
    выполнилось» `Б10 (0)`. Это отказ в закрытую сторону, так и задумано. Отдельно не выношу

