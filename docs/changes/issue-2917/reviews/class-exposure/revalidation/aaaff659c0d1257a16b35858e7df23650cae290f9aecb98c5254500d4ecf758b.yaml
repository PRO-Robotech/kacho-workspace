mapping_check:
  - {id: "CX2-01…42", design: "без изменений", verdict: holds, note: "дельта этих решений не касается"}
  - id: CX2-43
    design: "З8 «Одноразовость доказательства и решение — одна транзакция»"
    verdict: holds
    note: >-
      Текст уточнён: `StoreUnavailable` — только до отправки COMMIT, ошибка COMMIT —
      `commitUnknown`. Неделимость пометки и момента не ослаблена. Исключение «база недоступна
      всё окно разрешения» названо в тексте, его судьба — вопрос Р5 (return_to_acceptance).
  - id: CX2-44
    design: "З8 (3а), (4) — три окна холодного пула"
    verdict: holds
    note: "УК54 исполнено: третье окно «срыв срока решения без ответа на отмену» названо рядом с двумя прежними."
  - {id: CX2-45, design: "З27, З24 (УК55)", verdict: holds, note: "УК55 исполнено; см. conditions_executed"}
  - id: CX2-46
    design: "З8 (1), (1а), (3а), «Исход фиксации», И6, И37, И40, §6, §7 П9, §8; §11 строка 2460"
    verdict: holds
    note: >-
      (а) Обработчик отмены выбран явно: CancelRequestContextWatcherHandler, CancelRequestDelay 0,
      DeadlineDelay = anonMailCancelGrace. Цена названа, запасной путь (закрытие по дедлайну
      сокета) — третье окно холодного пула. Одно уточнение по коду pgx: HandleCancel ставит
      дедлайн сокета сразу, на момент срыва плюс DeadlineDelay (pgconn.go:2983–2984). Описание
      «если ответ не пришёл за grace, ставит дедлайн» по исходу этому равносильно. Цена «порядка
      100 мс» в замысле приписана отдельному соединению отмены. На деле это фиксированный сон
      драйвера после отмены (pgconn.go:3004); в формулы границ он не вошёл — УК58.
      (б) COMMIT вынесен из срока решения на WithoutCancel со своим пределом. Его ошибка —
      `commitUnknown`, и `resolveCommit` разрешает её до ответа. Главный риск такого разрешения —
      статус `committed` раньше, чем фиксация видна новому снимку: в PostgreSQL clog
      обновляется до снятия транзакции из ProcArray (xact.c:2277 → 2301). По исходнику
      PostgreSQL 16 этот риск закрыт: pg_xact_status сперва спрашивает TransactionIdIsInProgress
      и лишь затем clog, с прямой ссылкой на эту гонку (xid8funcs.c:689–699). Поэтому порядок
      «статус ≠ in progress → отдельный оператор со своим снимком → строка» верен. Остаток
      «база не ответила всё окно разрешения» назван с ценой (один лишний вызов), и его судьба
      отдана ревью приёмки. По условию пересверки 2a329728 это правка Р5 — return_to_acceptance.
      Классификация ответов опроса неполна: NULL и ERROR 22023 не разобраны — УК57.
      (в) Бюджет пересчитан по счёту ожиданий: 6 × anonMailStoreWait = 1,5 с (IPv6: захват,
      3 ключа, пометка, ведро; IPv4 — 5). Сказано, что под конкуренцией действует срок решения,
      а срыв до COMMIT — определённый откат. Числа совпадают со счётом пересверки 2a329728.

new_items:
  - id: CX2-47
    decision: "З8 (1а), «Исход фиксации» — внутренний исход хранилища `commitUnknown` (новое sentinel-значение)"
    classes:
      - "code-authoring §«Умолчание, которое становится утверждением» — третий исход «не смог узнать»"
      - "code-authoring §«Чужой ответ: классификация и бюджет» — классификация ответов опроса статуса"
    exposure: >-
      Новое значение закрытого набора исходов хранилища. Здесь есть два риска. Первый — утечка
      наружу четвёртым исходом `Admit` или сведение к одному из четырёх без разрешения (прежний
      дефект CX2-46). Второй — у самого разрешения есть свой чужой ответ, опрос статуса: у него
      больше вариантов, чем «in progress / committed / aborted / не ответила».
    mapping: >-
      Отображение держится. Производитель один — ошибка COMMIT любого рода (З8 (1а)). Потребитель
      один — `resolveCommit` («Исход фиксации»). Закрытый набор `Admit` не меняется: Pass ·
      Challenge · Reject · StoreUnavailable (З8 (1а), И40). У `memory` исхода нет. Гейт формы
      `anonmail` считает операторы вне транзакции (= 2, в `resolveCommit`). Держатели — проба
      «срок истекает на COMMIT» с двумя близнецами-инъекциями и проба остатка (З8, E2). Неполная
      классификация ответов опроса вынесена в УК57; она не меняет ни решения, ни исхода «Тогда».
    mapped: true

