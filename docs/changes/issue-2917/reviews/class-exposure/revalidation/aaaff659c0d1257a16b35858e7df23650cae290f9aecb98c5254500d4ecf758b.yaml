conditions_to_code:
  - id: УК57
    item: "CX2-47, CX2-46 (б) — `resolveCommit`"
    class: "code-authoring §«Чужой ответ: классификация и бюджет»"
    condition: >-
      `resolveCommit` классифицирует ответ опроса `pg_xact_status` закрытым перечнем, без ветки
      «прочее»:
      `in progress` → ждать шаг;
      `committed` или `aborted` → читать строку;
      NULL (xid старше усечения clog, TransactionIdInRecentPast → false) → читать строку;
      ERROR 22023 «transaction ID … is in the future» (опрошена база с меньшим счётчиком, то есть
      после переключения, и фиксация до неё не дошла) → читать строку сразу, не опрашивать до
      конца бюджета;
      ошибка соединения, отмена или 57014 → повторить в пределах `anonMailResolveBudget`.
      WARN «исход фиксации не разрешён» и +1 к счётчику пишутся только тогда, когда за весь бюджет
      не удалось прочесть строку. Ответ базы с ошибкой — это ответ, а не «база не ответила».
    held_by: >-
      Нужна модульная проба `resolveCommit` на заглушке опроса: по одному варианту на каждый
      класс, утверждаются исход, число опросов и признак WARN. Близнец-инъекция — 22023 сведён к
      повтору: исход тот же (`503`), но опросов больше одного и WARN записан — красный. Строит
      автор полосы E2.
  - id: УК58
    item: "CX2-46 (а), И6, И37, §8 (границы удержания и худший ответ)"
    class: "measurement-discipline §«Форма числа»; code-authoring §«Унификация и стоимость» (цена чужого конструктора)"
    condition: >-
      Каждая отмена по сроку на пуле с CancelRequestContextWatcherHandler стоит, сверх
      DeadlineDelay, фиксированных 100 мс сна драйвера до снятия наблюдения
      (pgx v5.10.0 pgconn.go:3004; corelib db/pool.go 66–70 называет ту же цену). Этот сон не
      ограничен ни `anonMailCancelGrace`, ни сроком контекста. Формулы границ его не содержат:
      «живой держатель ≤ decision + commit + grace = 2 с» и «худший ответ ≈ 5,25 с». Там, где
      код или проба утверждают временную границу на НАСТОЯЩЕМ пуле ограничителя, допуск включает
      grace + 100 мс на каждую отмену пути. К ним относятся integration-проба «срок истекает на
      COMMIT», проба остатка «503 не раньше anonMailResolveBudget» и проба «после срыва срока
      соединений в пуле 4». Модульная проба срока на заглушке хранилища драйвера не содержит, её
      допуск не меняется. В следующей редакции замысла формулы §8 и З8 (2) пересчитываются с
      этим слагаемым; цена «порядка 100 мс» приписывается сну драйвера, а не соединению отмены.
    held_by: >-
      Гейта нет и не нужен. Держится пробами полосы E2: при допуске без 100 мс они нестабильно
      краснеют на медленном раннере. Число — из исходника драйвера на пине, а не из прогона.

