#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы (initial/9098d6ef….yaml,
# initial/ef9c6801….yaml) и пересверки на редакции 1, 2, 3, 5, 6, 7 и 8 (f21384ed…, 2886b89f…,
# c3e37381…, cc7bdad1…, cc42ace6…, 6fc3cae2…, 2a329728…) относятся к своим редакциям и здесь не
# переписываются. По решению диспетчера Д22 судится ТОЛЬКО дельта редакции 9 против последней
# разобранной (редакция 8, 2a329728):
# git diff a514bac3b a0ad3a711 -- docs/changes/issue-2917/design.md docs/changes/issue-2917/tasks.md
# (565 строк диффа; design.md +291/−54 вместе с tasks.md).
# Что проверено:
#   (1) отображение CX2-46 по трём частям его условия (а)–(в);
#   (2) исполнение условий к коду УК53–УК56 текстом замысла;
#   (3) новые внешние вызовы, асинхронные пути и sentinel-значения дельты;
#   (4) маркеры отсрочки и открытые решения;
#   (5) замеры М51–М55 (Д24) воспроизведены по дереву и модулям; утверждение о семантике
#       pg_xact_status проверено по исходнику сервера PostgreSQL 16.
# Итог: неотображённых пунктов нет; новый sentinel commitUnknown заведён пунктом CX2-47 и
# отображением замысла держится. Условий к коду два (УК57, УК58). Остаток CX2-46 противоречит
# буквальному тексту правила Р5 приёмки — «вернуть в приёмку» (заранее объявленное условие
# пересверки 2a329728).
