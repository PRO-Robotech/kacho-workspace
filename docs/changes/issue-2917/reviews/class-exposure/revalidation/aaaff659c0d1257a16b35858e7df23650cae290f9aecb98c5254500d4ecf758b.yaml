outcome: вернуть-в-приёмку
unmapped: []
return_to_acceptance:
  - rule: "Р5 (строка 2783): «`503` не истрачивает вызов — NTF2-59 (д)»"
    why: >-
      Замысел разрешает исход COMMIT во всех случаях, кроме одного, и этот неразрешимый остаток
      называет прямо (З8 «Исход фиксации»): COMMIT отправлен, а база не ответила всё окно
      `anonMailResolveBudget`. Тогда ответ — `503`, и если фиксация успела, вызов истрачен:
      повтор того же доказательства получит `Replayed` и новый вызов. Буквальный текст Р5 этого
      исключения не допускает, а по построению его не закрыть (исход фиксации знать нечем).
      По условию пересверки 2a329728 («назвать цену вместо разрешения — правка Р5») нужна правка
      «Тогда» Р5: исключение с ценой — один лишний вызов клиенту. Кейс NTF2-59 (д) останавливает
      хранилище до COMMIT и остаётся верным. Сценарий остатка в приёмке не заведён.
    scenarios: [NTF2-59]

