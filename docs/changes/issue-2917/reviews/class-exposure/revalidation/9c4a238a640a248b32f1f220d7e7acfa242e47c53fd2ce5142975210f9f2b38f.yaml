    predicate: "строка §0 о 5b1a7e41 называет запись вердикта"
  - id: N30-2
    blocking: false
    where: "design.md §11 строка CX2-102, держатель S5"
    text: >-
      Предикат «нового округления нет» — `git grep -nE 'math\\.Ceil|/ time\\.Second'` по нетестовым
      файлам `internal/handler/**`. Глагол приглашения, у которого появится срок, живёт в
      `internal/apps/kaname/api/user/handler.go` @bd8413637, то есть вне области. Четвёртая копия в
      `internal/apps/**` даст печать 0 при наличии копии. По всему нетестовому дереву kaname образец
      находит 9 мест, 3 из них — срок повтора (все три в `internal/handler/**`), прочие 6 — иные
      величины. Значит, предикат по всему дереву с разбором по референту исполним и способен сказать «да»
    predicate: "область предиката S5 — `'*.go' ':!*_test.go'`, печать: найдено, срок повтора, вне retryafter = 0"
  - id: N30-3
    blocking: false
    where: "design.md §11 строка CX2-101, маршрут X1"
    text: >-
      ConfigMap kaname со своим resourceVersion — объявление, а не процесс. Подчарт kaname несёт
      `kacho.cloud/config-checksum` от рендера ConfigMap (deployment.yaml:90 @ae4bde452f6), так что под
      перекатывается при helm-смене. Правка объекта мимо helm под не перекатит. Достаточно, чтобы
      проба X1 печатала момент последнего изменения ConfigMap и момент старта пода kaname и при
      «ConfigMap новее пода» давала «не выполнилось». Либо брать величины из самоотчёта процесса, если
      он их печатает
    predicate: "X1 печатает связь ConfigMap ↔ работающий под либо читает процесс"

