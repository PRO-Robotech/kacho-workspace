notes:
  - id: N30-1
    blocking: false
    where: "design.md §0 строка «приёмка NTF-2 — правка редакции 30»; change.yaml комментарий редакции 31"
    text: >-
      «Вердикта нет; одобрение редакции 30 к ней не переносится». Сейчас запись
      `5b1a7e41….yaml` есть: verdict APPROVED, blocking_count 0. Утверждение пережило свой предмет.
