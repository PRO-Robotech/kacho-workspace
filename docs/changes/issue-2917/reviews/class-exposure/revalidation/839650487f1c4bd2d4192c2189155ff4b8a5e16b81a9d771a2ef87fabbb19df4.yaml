new_items:
  - id: CX2-85
    decision: >-
      З28 (а) абзац о носителях: «Связь Б10 «`required` → `sets` → `subprocess.run`» … состоит ровно из якоря
      и звеньев (i)–(iii)». Строка Б10: «Якорь: третий позиционный аргумент записи `Chart(…)` …»; звено
      (i): «в методе `Chart.renders` локальная `sets` присвоена `list(self.required)`». М74: «путь элемента
      `required` … проходит якорь и три звена», предикат `grep -nE 'renders\(|render\(|subprocess\.run|sets\b'`
    class: >-
      code-authoring §«Умолчание, которое становится утверждением»: переход «третий позиционный аргумент
      записи» → «атрибут `self.required`» принят без сверки, и при его разрыве `-f` якоря засчитывается слоем
      вызова. measurement-discipline §«Форма числа» / §«Предикат — только с контролем»: утверждение «ровно
      три звена» выведено предикатом, который атрибута `required` не видит, поэтому объём осмотренного
      меньше объёма утверждения. Это тот же класс, что CX2-84 («звенья цепочки не перечислены»), только на
      звене, которое перечень пропустил
    exposure: >-
      На 2564 якорь связан со звеном (i) не прямо. Запись `Chart(…)` передаёт литерал третьим позиционным
      аргументом конструктора `def __init__(self, name, path, required, toggles)` (85), тот присваивает его
      атрибуту `self.required = required` (89), и только этот атрибут читает звено (i) —
      `list(self.required)` (95). Звено «(0)» — третий параметр после `self` присвоен `self.required` без
      изменения, и других записей в атрибут нет — не перечислено ни в строке Б10, ни в CX2-84, ни в УК80, ни в
      D6. Предикат М74 его не видит: `required` в его образце нет, поэтому строка 89 в «8 строк-совпадений»
      не попала. Пусть звено (0) разорвано одним фактом: `self.required = []`, фильтр
      `[a for a in required if a != "-f"]` или перестановка параметров `(self, name, path, toggles,
      required)`. Якорь на месте, звенья (i)–(iii) сверены, база установлена, и перепись печатает «Б10 + Б6»
      с зелёным, а `-f` края до helm не доходит. Это исход (2) CX2-82, от которого CX2-84 (б) обещает «зелёного
      при разорванном звене нет». Обещание держится только для перечисленных звеньев
    condition_on_code: >-
      (а) К выражению Б10 добавлено звено между якорем и (i). В `Chart.__init__` параметр, стоящий на позиции
      якоря (третий позиционный после `self`), присвоен атрибуту `self.required` без изменения — присваивание
      голого имени параметра. Других присваиваний атрибута `required` (`self.required = …`,
      `<ч>.required = …`, `setattr`) в файле нет. Звено (i) читает именно этот атрибут. Распознаватель сверяет
      звено как факт, как (i)–(iii). (б) Исход разрыва — тот же, что у CX2-84 (б): «не выполнилось» с
      координатой и именем нового звена, красного самоистечения и зелёного «Б10 + Б6» нет. (в) Проба —
      инъекция `self.required = []` в `__init__` → «не выполнилось» с именем звена, близнец — файл дерева
      молчит. Предикат М74 расширен так, чтобы видеть атрибут: образец включает `\brequired\b` или
      `__init__`, счёт строк-совпадений пересчитан. На 2564 присваивание атрибута одно (89), чтение одно (95)
    held_by: >-
      Нужна проба (в) в §11 (новая строка CX2-85), §11а и строке D6, её нет. До отображения звено держится
      вниманием. Опасный исход тихий: ложный зелёный переписи. Скрипт при этом краснеет отдельно, потому что
      чарт края без слоя отказывает рендеру, но по другой причине, и слой переписью засчитан

remarks:
  - >-
    Звено (ii) сопоставляет «выданный `sets`» с целью распаковки. Распознаватель обязан сверять это по
    ПОЗИЦИИ: элемент кортежа `yield` (второй) = цель распаковки в `for …, … in <ч>.renders()` (вторая), а не
    по совпадению имени `sets`. При перестановке `for sets, label in …` имя совпадает, а в `render` уходит
    подпись. Отдельным пунктом не выношу: формулировка (ii) «распаковывающий выданный `sets`» позиционную
    сверку уже подразумевает. Это условие к коду распознавателя, и рецензент диффа D6 видит его глазами
  - >-
    Запись края, написанная ключевым аргументом (`Chart(…, required=[…])`), под якорь «третий позиционный»
    не попадает. Её `-f` вне носителя не ищется, и выходит «слоя нет» — красный, а не зелёный. Опасной
    стороны нет, пунктом не выношу

