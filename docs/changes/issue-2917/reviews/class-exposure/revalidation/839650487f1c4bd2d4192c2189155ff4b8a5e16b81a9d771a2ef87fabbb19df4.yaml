# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 20.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки прежних редакций относятся к своим
# редакциям и здесь не переписываются. Судится дельта редакции 20 против последней пересверенной
# (редакция 19, 4ef3c1c9): git diff 73708488a eb7863957 -- docs/changes/issue-2917/{design,tasks}.md.
# Итог: к-замыслу. CX2-84 и остаток CX2-82 отображены целиком, замечание о втором локальном срезе Go
# закрыто пробой. Новый пункт CX2-85: замысел объявляет, что выражение Б10 «состоит ровно из якоря и звеньев
# (i)–(iii)», но на 2564 между якорем и звеном (i) есть ещё одно звено — `Chart.__init__` присваивает
# третий параметр атрибуту `self.required` (89), а звено (i) читает этот атрибут. Предикат М74 это звено
# не видит, потому что `required` в него не входит. Если разорвать звено в `__init__`, якорь и звенья
# (i)–(iii) остаются на месте, и перепись печатает зелёный «Б10 + Б6». Это ровно тот ложный зелёный, против
# которого заведён CX2-84.
