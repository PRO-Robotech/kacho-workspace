notes:
  - id: N31-1
    blocking: false
    where: "design.md §11 строка CX2-101, маршрут X1 (N30-3)"
    text: >-
      У объекта ConfigMap нет поля «момент последнего изменения». `creationTimestamp` при `helm upgrade`
      и `kubectl patch` не сдвигается, и сравнение «ConfigMap новее пода» по нему никогда не скажет «да».
      Ровно тот случай, ради которого N30-3 заведена (правка мимо helm), останется незамеченным.
      Источник момента — максимум `.metadata.managedFields[].time`. Инъекция: `kubectl patch` ConfigMap
      без перекатки → «не выполнилось»; близнец — перекатка после правки → проход
    predicate: "X1 называет поле, из которого берётся момент изменения, и несёт инъекцию с близнецом"

