# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 23.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки прежних редакций относятся к своим
# редакциям и здесь не переписываются. Судится дельта редакции 23 против последней пересверенной
# (редакция 22, c0d9f686): git diff a61014ed6 a3d081476 -- docs/changes/issue-2917/{design,tasks}.md.
# Итог: к-замыслу. CX2-87 отображён: пробы (4) и (5) через псевдоним, D6, УК83, обе правки слов.
# Сводка §11 перемерена и совпадает (88 строк). Новый CX2-88. Отображение CX2-87 описывает перечисление
# вхождений как обход узлов имени `CHARTS` и атрибута `required` плюс пяти названных доступов по имени.
# В разборе Python часть связываний несёт имя строковым полем, а не узлом имени: `import … as`,
# `def`/`class`, `except … as`, `global`, образцы `match`. К тому же `globals()`, `sys.modules[…]` и
# `operator.attrgetter` в перечень доступов по имени не входят. Распознаватель, собранный по этим словам,
# на девяти таких формах вхождения не видит и печатает ложный зелёный. Пробы (4) и (5) этого не отличают.
