new_items:
  - id: CX2-88
    decision: >-
      З28 (а) Б10 «Носители» (CX2-87) и D6: распознаватель обходит «каждый узел имени `CHARTS` в любом
      контексте (чтение, связывание, удаление, цель `for`, `:=`, аннотированное присваивание, `global`,
      `import … as`), каждый узел атрибута `required` в любом контексте и каждый доступ к атрибутам по
      имени (`setattr`, `getattr`, `delattr`, `vars`, `__dict__`)»
    class: >-
      code-authoring §«Инвариант и оснастка — это тоже прод-код»: распознаватель судит по идентичности,
      а не по виду узла. В разборе Python идентичность имени лежит не только в узле имени.
      gate-authoring: пробы обязаны отличать объявленное свойство от более слабой реализации.
      Продолжение цепочки CX2-84…87 (ложный зелёный переписи, класс CX2-84)
    exposure: >-
      Запись в скобках внутренне противоречива. В разборе Python (`ast`) связывания `global CHARTS`
      (`Global.names`) и `import … as CHARTS` (`alias.asname`) — строковые поля, а не узлы `Name`. Так же
      устроены `def CHARTS`/`class CHARTS` (`.name`), `except … as CHARTS` (`ExceptHandler.name`) и образцы
      `match` (`MatchAs`/`MatchStar.name`, `MatchMapping.rest`). Перечень доступов по имени не называет
      `globals()`, `sys.modules[__name__].CHARTS` (узел `Attribute` с `attr == "CHARTS"`, а не атрибут
      `required`) и `operator.attrgetter("required")`.
      Измерено на копии файла 2564@6edea09c2ee с инъекцией сразу после литерала `CHARTS`. Распознаватель
      «узлы Name `CHARTS` + Attribute `required`» даёт прирост 0 на девяти формах: `import json as CHARTS`,
      `from os import sep as CHARTS`, `def CHARTS()`, `class CHARTS`, `except … as CHARTS`,
      `globals()['CHARTS'] = []`, `sys.modules[__name__].CHARTS = []`, `operator.attrgetter('required')`,
      `case [*CHARTS]`. Перечисление по любому полю-идентификатору и строковой константе, равной имени
      носителя, даёт +1 на каждой из девяти. Каждая из форм перебивает `CHARTS` модульного уровня
      после литерала или пишет в носитель в обход звеньев, а распознаватель, собранный по словам замысла,
      печатает «Б10 (0)–(iii) + Б6». Пробы (4) и (5) такую реализацию принимают: обе дают +1 и при
      перечислении по узлам. Число измерено после инъекции, до кода опасный исход тихий
    condition_on_code: >-
      (а) Вхождением носителя считается любое появление его идентификатора в разборе файла. Это `Name.id`,
      `Attribute.attr` (у любого объекта, в том числе `sys.modules[…]`), `alias.name`/`alias.asname`,
      `FunctionDef`/`AsyncFunctionDef`/`ClassDef.name`, `ExceptHandler.name`, `Global`/`Nonlocal.names`,
      `arg.arg`, `keyword.arg`, `MatchAs`/`MatchStar.name`, `MatchMapping.rest`, а также строковая
      константа, равная `"CHARTS"` или `"required"`. Любой вызов `globals`, `locals`, `vars`, `exec`, `eval`,
      `__import__`, `setattr`/`getattr`/`delattr` с неконстантным именем — нарушение: имя по разбору не
      доказуемо. Роли на дереве есть у всех 9 вхождений по идентификатору, а не только у 7 узловых.
      Добавляются параметр `required` в `Chart.__init__` (85, `arg`) и его чтение справа в `self.required =
      required` (89, `Name` Load) — это роль звена (0), её надо назвать.
      (б) К пробам (1)–(5) добавить две из форм, которые узловой перечень не видит, и сравнить каждую с
      близнецом — файлом дерева: (6) после литерала `import json as CHARTS` → «не выполнилось» `Б10 (ii)`
      с координатой вхождения; (7) после литерала `globals()["CHARTS"] = []` → «не выполнилось» `Б10 (ii)`.
      Ни в одной нет красного самоистечения и зелёного «Б10 + Б6».
      (в) Скобки в Б10 переписать без слов «узел имени»: перечень — поля-идентификаторы из (а), а не виды
      узлов. Пробы (6) и (7) назвать в §11, §11а и D6
    held_by: >-
      Нужны пробы (6) и (7) — их нет. До отображения держится вниманием, а опасный исход тихий: ложный
      зелёный переписи при реализации, буквально следующей словам «узел имени», которую пробы (1)–(5)
      принимают

remarks:
  - >-
    Строгость (а) сверх нужного — любой вызов `getattr`/`vars`/`globals` в файле даёт «не выполнилось»
    независимо от имени. Это отказ в закрытую сторону. На дереве таких вызовов 0 (предикат из
    measurements), и из доступа по имени в файле есть только `nonlocal rc` (383) — это не носитель.
    Отдельным пунктом не выношу
  - >-
    Инъекция (4) ссылается на `chart` в `main` до цикла, где `chart` ещё не связан. Для распознавателя,
    который судит по разбору, а не исполнением, это законно. Если реализация исполняет файл (она не
    должна), проба упадёт NameError, а не нарушением `Б10 (0)`. Автору: пробу (4) лучше ставить внутрь
    функции с параметром `chart` — на копии так и измерено

