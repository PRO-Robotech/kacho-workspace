# Экспозиция классов — пересверка (revalidation) замысла NTF-2 (почта личности), редакция 19.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки прежних редакций относятся к своим
# редакциям и здесь не переписываются. Судится дельта редакции 19 против последней пересверенной
# (редакция 18, 12932661): git diff 3b0c50501 73708488a -- docs/changes/issue-2917/{design,tasks}.md.
# Итог: к-замыслу. CX2-83 отображён целиком. У CX2-82 отображены Go-носитель (Б9) и его пробы, а
# Python-носитель (Б10) — не полностью: подпункт «иной путь списка к `subprocess.run` — «не выполнилось»»
# заменён объявлением связи «`required` → `sets` → `subprocess.run`» и утверждением, что при изменении формы
# `render`, `renders()` или `Chart` строка «покраснеет самоистечением». Это утверждение выведено из самого
# отображения и не держится:
#   CX2-84 — какие синтаксические факты составляют «выражение» строки Б10, не перечислено. Если строка
#            совпадает по записи `Chart(…)` в `CHARTS` (так она написана), то разрыв цепочки в `render` или
#            `renders()` строку не снимает, и `-f`, до helm не доходящий, засчитывается слоем вызова. Это
#            исход (2) CX2-82. Если в выражение входит цепочка, то разрыв даёт в одном прогоне и красный
#            самоистечения, и «не выполнилось» записи края. Правила сложения замысел по CX2-83 не заводит.
#            Пробы разрыва цепочки нет ни в §11, ни в УК78, ни в D6.
