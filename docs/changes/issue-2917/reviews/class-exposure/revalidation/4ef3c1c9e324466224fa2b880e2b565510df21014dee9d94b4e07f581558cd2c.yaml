new_items:
  - id: CX2-84
    decision: >-
      З28 (а) Б10: «третий позиционный аргумент записи `Chart(…)` списка `CHARTS` того же файла (поле
      `required`), литерал списка; до `subprocess.run` он доходит через `renders()` и параметр `sets` функции
      `render` (М73)». Абзац о носителях: «Б10 объявляет связь «`required` → `sets` → `subprocess.run`» для
      одного файла, а не выводит её разбором потока данных: изменится форма `render`, `renders()` или
      `Chart` — выражения строки в файле не станет, и она покраснеет самоистечением». CX2-83: «Правила
      сложения исходов замысел не заводит»
    class: >-
      testing-verdict п.14 «Твой СОБСТВЕННЫЙ разборщик — тоже распознаватель»: множество фактов, по которым
      строка Б10 считается совпавшей, не объявлено, поэтому самоистечение по ней нельзя проверить.
      code-authoring §«Умолчание, которое становится утверждением»: объявленная, а не установленная связь
      «элемент `required` доходит до helm» засчитывает `-f` слоем вызова, когда связь разорвана.
      testing-verdict «не выполнилось ≠ красное»: у разрыва цепочки два исхода в одном прогоне, а правила их
      сложения нет — тот же класс, что CX2-83, только на рабочем сценарии, а не на инъекции
    exposure: >-
      На 2564 цепочка состоит из трёх звеньев в разных функциях: `renders()` начинает `sets` с
      `list(self.required)` (95), цикл `for chart in CHARTS: for label, sets in chart.renders(): render(chart,
      sets)` (327–329), `render(chart, sets)` зовёт `subprocess.run([…, str(REPO / chart.path)] + sets)`
      (311–313). Строка Б10 по тексту совпадает по записи `Chart(…)` в `CHARTS`, а звенья названы в ней
      прозой. Замысел не говорит, входят ли они в то, что распознаватель сверяет. Исходов два, оба плохие.
      (1) Звенья не сверяются. Правка `render` на `+ extra` или `renders()` на `sets = []` строку Б10 не
      снимает, запись `api-gateway` по-прежнему несёт `-f` и `str(REPO / …/edge.yaml)`, и перепись печатает
      «Б10 + Б6» с зелёным. При этом helm чарт края рендерит без слоя: скрипт падает на своём рендере (чарт
      отказывает без ручки) или, если правка ещё и снимает рендер, перепись зелена ложно. Это исход (2)
      CX2-82: `-f`, не доходящий до вызова, засчитан слоем. Обещание абзаца «покраснеет самоистечением»
      неверно. (2) Звенья сверяются. Тогда разрыв даёт в одном прогоне красный самоистечения строки Б10 и
      «не выполнилось» записи края (ей нечем установить базу). Это те же два факта, которые CX2-83 развёл в
      инъекции, но теперь на рабочем сценарии, который сам замысел предсказывает красным. Правила сложения
      нет по решению CX2-83. Ни в §11 CX2-82, ни в УК78, ни в D6 нет пробы «звено цепочки разорвано»
    condition_on_code: >-
      (а) Строка Б10 перечисляет синтаксические факты, из которых состоит её выражение: (i) в `Chart.renders`
      `sets` инициализирован `list(self.required)` и изменяется только `+=`; (ii) в том же файле цикл по
      `CHARTS` передаёт выданный `renders()` `sets` вторым аргументом `render`; (iii) в `render` параметр
      `sets` конкатенирован к литералу списка в первом аргументе `subprocess.run`. Распознаватель сверяет
      каждый факт, а не текст прозы. (б) Исход разрыва объявлен одним фактом: нарушение любого из (i)–(iii)
      даёт для вызова «не выполнилось» с координатой и именем звена, а самоистечение строки Б10 в этом
      прогоне не судится, потому что строка не пропала — её семейство не установлено. Либо объявлено иное
      правило, но одно и с исходом, названным заранее. Абзац «покраснеет самоистечением» приведён в
      соответствие. (в) Пробы с близнецами. Инъекция «`render` зовёт `subprocess.run([…] + extra)`» (звено
      iii) даёт объявленный исход (б) с именем звена, близнец — файл дерева молчит. Инъекция «`renders()`
      начинает `sets = []`» (звено i) — тот же исход с именем звена i. Ни одна инъекция не даёт зелёного
      «Б10 + Б6»
    held_by: >-
      Нужны пробы (в) в §11 CX2-84, §11а и строке D6, их нет. До отображения держится вниманием. Опасный
      исход (1) тихий: ложный зелёный переписи при рабочем скрипте, который сам по себе краснеет позже и по
      другой причине

remarks:
  - "Go: `-f` во втором локальном срезе той же функции (не носителе) по правилу «вне носителя не ищется» даёт вызову «слоя нет» — красный, а не зелёный. Это закрывает опасную сторону CX2-82, но пробы такой строки в D6 нет. Отдельным пунктом не выношу: исход не зелёный по построению правила, а не по вниманию"

