items:
  - id: CX2-57
    decision: D35, D36
    class: "code-authoring §«Умолчание, которое становится утверждением»; verdict-and-landing (expand → migrate → contract)"
    exposure: >-
      Флаг в поставке по умолчанию `true`, узел prod по умолчанию пуст. Пока перечень prod пуст (NTF-1
      без записи kaname), установка prod рендерится. После посадки полосы NTF-2, вносящей запись
      kaname, та же установка с теми же значениями при `helm upgrade` получает отказ рендера. Для
      существующей установки prod это ломающее изменение контракта поставки, и вносит его NTF-2. DoD п.22
      требует от страниц поставки назвать флаг, ручки Р8 и то, что почту шлёт notify. Что установке prod
      теперь нужно либо задать узел, либо выключить флаг, иначе рендер откажет, — этого не требует ни
      DoD, ни сценарий.
    condition: >-
      (а) сообщение коммита полосы, вносящей запись kaname в перечень, объявляет ломающее изменение
      поставки: «установка prod без узла global.kacho.identity.smtp отказывает в рендере; задайте
      connectionURI, fromAddress, fromName либо global.kacho.notifications.enabled: false»;
      (б) страница поставки и сайт документации kacho (тот же объём, что DoD п.22) называют оба выхода и
      текст отказа; (в) текст отказа required называет оба выхода, а не только путь узла. Это строка
      NTF-1 (полоса D1): заказ автору NTF-1.
    held_by: "вниманием: DoD п.22 этого не требует; заказ автору приёмки — дописать при следующей правке (не блокирует); (в) — заказ NTF-1"
  - id: CX2-58
    decision: D34, D33
    class: "architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    exposure: >-
      Для слоя «образец узла на prod в гейтах обхода» заведено два образца и две точки подстановки.
      У NTF-2 это П7-узел: `smtp://<узел>:<порт>/` без имени пользователя, fromAddress, fromName, без
      удостоверения; каждый гейт NTF-2 несёт его в своей фикстуре. Замысел NTF-1 редакций 19–20
      (@c9a81b71, после цитируемой приёмкой редакции 18) делает иначе. Образец там — форма оператора
      `smtps://<имя>@<хост>:465/` с парой credentialSecret, лежит в одном фикстурном файле (полоса D9).
      Слой подставляет только тестовая обёртка. Перепись D2 NTF-1 требует, чтобы число гейтов,
      рендерящих prod, и число гейтов со слоем были равны (строка Д48, CX1-86, CX1-87). Гейт NTF-2,
      который сам подставляет `-f <цепочка> -f <П7-узел>` мимо обёртки, эта перепись посчитает
      гейтом без слоя: красный на верной NTF-2. Либо перепись его не увидит — тогда её равенство
      ложно. Кроме того, счёт ссылок на удостоверение по цепочке prod в NTF2-30 зависит от образца:
      0 с П7-узлом, 1 с образцом D9.
    condition: >-
      (а) гейты NTF-2, обходящие каждую цепочку (NTF2-24, NTF2-30, NTF2-31, перемер Р16 п.2, признак
      K), подставляют слой prod только через тестовую обёртку NTF-1 (полоса D9). Своей сборки
      `-f … -f <образец>` у них нет. Образец обёртке передаётся параметром, и П7-узел — один из файлов
      того же фикстурного каталога; (б) оба образца проводятся через страж зонтика одной пробой D9:
      код 0, у каждого близнецы-отрицания; (в) гейт печатает имя образца, с которым рендерил prod, и
      счёт NTF2-30 по prod атрибутирован образцу; (г) перепись D2 NTF-1 считает гейт со слоем по
      вызову обёртки, а не по имени файла образца.
    held_by: "покраснеет перепись D2 NTF-1 «рендерящих prod = со слоем», если она считает вызовы обёртки; параметр образца у обёртки — заказ NTF-1; (в) — вниманием"
  - id: CX2-59
    decision: D41
    class: "measurement-discipline §«Чужое измерение и чужое заявление» (срок годности); polyrepo.md warning «Ключ домена и имя каталога — РАЗНЫЕ словари» (один словарь имён полос на две под-фазы)"
    exposure: >-
      Приёмка берёт зависимости полос из маршрута tasks.md @a0ad3a711 (редакция 9). Маршрут старше
      Д39: в нём 0 упоминаний `1276`. Его полоса D2 «снятие почты поставщика и страж листьев» правит
      values.dev.yaml, values.prod.yaml, _kratos-identity.tpl и заводит identity-provider-mail-guard.yaml.
      Всё это Д39 и DoD п.13 отдают kacho#1276 и запрещают NTF-2. D3 у маршрута — «снять 11,
      переписать 9», NTF2-18, 20, 21, а по §3а сейчас: правится 8, переписан 3, ID NTF2-18, 20…23
      сняты. Приёмка при этом утверждает «база D3 — NTF-1, D1 и D2 посажены». К тому же имена
      D1 и D2 означают разные полосы у NTF-1 и у NTF-2. Приёмка их в основном различает, но
      «K ложен (NTF-1 посажена, D1 нет)» без указания под-фазы читается двояко. Ветви K измеряются
      командой, так что вывод приёмки от устаревшего маршрута не зависит. Зависит порядок полос:
      полосу гейта NTF2-34 маршрут не называет.
    condition: >-
      (а) маршрут переписан под Д39–Д49. Ни одна полоса NTF-2 не правит values.dev.yaml,
      values.prod.yaml, values.fe3455*.yaml, cutover-fe3455.sh и файлы §3а с исходом «за
      kacho#1276». Строки D3 выведены из итога §3а; (б) полоса гейта NTF2-34 названа и зависит от
      полосы NTF-2, вносящей запись kaname, и от полос NTF-1 D1 (required, строки узла) и D9
      (обёртка слоя); (в) зависимости между под-фазами пишутся с префиксом под-фазы (NTF1-D1,
      NTF1-D9), голое D<n> означает полосу своего маршрута.
    held_by: "вниманием; полноту отображения пунктов в замысел держит cg.class; заказ автору замысла и маршрута NTF-2"
  - id: CX2-60
    decision: D33
    class: "measurement-discipline §«Предикат — только с контролем» (референт числа); code-authoring §«Инвариант и оснастка — это тоже прод-код»"
    exposure: >-
      K должен отвечать на вопрос «непуст ли перечень источников notify в prod», а меряет число
      объектов чарта notify в рендере prod. Эти два числа совпадают, только пока чарт notify
      рендерится целиком или не рендерится вовсе (З28 NTF-1: «notify там не рендерится»). Если чарт
      NTF-1 начнёт при пустом перечне рендерить хоть один объект (ServiceAccount, NetworkPolicy,
      ConfigMap с пустой таблицей), K станет истинен при пустом перечне. Тогда ветвь «K истинен» Р16
      п.6 (2) будет ждать отказа prod «как есть», не получит его, и на верной работе обеих под-фаз
      выйдет «не выполнено» с возвратом в приёмку.
    condition: >-
      (а) K считает записи перечня источников в отрендеренной конфигурации notify и печатает их имена;
      число объектов остаётся печатью, а не критерием; (б) либо NTF-1 держит свойство «при пустом
      перечне объектов чарта notify 0 в каждой цепочке» пробой с инъекцией «объект вне условия
      перечня» — красный; (в) K печатает перечень на каждой базе, где его меряют.
    held_by: "перепись D2 NTF-1 «цепочка → выведенный перечень» (если она утверждает 0 объектов при пустом перечне); иначе — вниманием; заказ автору NTF-1 и автору гейта NTF-2"
  - id: CX2-61
    decision: D37, D30
    class: "code-authoring §«Умолчание, которое становится утверждением» (запасной путь); gate-authoring (инъекция настоящим входом с законным близнецом)"
    exposure: >-
      NTF2-34 (г) ловит шаблон, который берёт адрес из ключа вне узла вместо узла: подставлен X, а
      доехало другое значение. Запасной путь он не ловит. Возьмём шаблон «узел, а если он пуст — другой
      ключ» (`default`, `coalesce`, `or`, `if/else`). При заданном X доезжает X, и (г') молчит. В (е)
      узел пуст и другой ключ в поставке пуст, required срабатывает — (е) тоже зелёный. Второй путь
      значений (Д42) живёт незамеченным, пока оператор не задаст второй ключ. Запрет NTF-1 «`default`
      у любого ключа — красный» ловит только функцию `default` по имени.
    condition: >-
      (а) у NTF2-34 есть вариант (г''): П7-tpl с шаблоном «узел, иначе ключ W», цепочка prod с пустым
      узлом и ключом W, заданным пробой. Верный исход — отказ рендера с именем connectionURI. Прошедший
      рендер с W в ключе адреса — красный «второй путь запасным»; (б) близнец — тот же шаблон без W:
      отказ, как в (е); (в) формы запасного пути перечислены в пробе (default, coalesce, or, ternary,
      if/else) и проверены хотя бы двумя формами.
    held_by: "нужен гейт (вариант (г'') NTF2-34), его нет — заказ автору гейта NTF-2; добавление варианта не меняет «Тогда» приёмки"
  - id: CX2-62
    decision: D38
    class: "gate-authoring (арифметическое равенство слепо к подмене строки); measurement-discipline §«Форма числа»"
    exposure: >-
      Близнец NTF2-53 утверждает, что число источников перечня равно числу объявлений с действующим
      флагом true, и в dev их два: notify-probe и kaname. Равенство чисел не видит подмену. Модуль с
      флагом true без строки в перечне плюс строка в перечне без флага дают те же 2 = 2. Именно этот
      дефект гейт и должен ловить: флаг включён, а источник не подключён.
    condition: >-
      (а) гейт сравнивает множества имён (записи перечня и объявления с действующим флагом) и печатает
      оба множества; (б) инъекция «флаг kaname true без записи + чужая запись без флага» красна при
      равных числах; (в) близнец dev = {notify-probe, kaname} молчит.
    held_by: "нужен гейт в форме (а); сейчас — вниманием; заказ автору гейта NTF-2 (полоса флага и перечня)"
  - id: CX2-63
    decision: D39
    class: "gate-authoring (пустой вход не равен вердикту); code-authoring §«Инвариант и оснастка — это тоже прод-код» (судить по идентичности, а не по имени)"
    exposure: >-
      DoD п.16 узнаёт вливание kacho#1276 по темам коммитов слияния: `свести 1276`, `merge #1276`,
      `#1276 merge #<полоса>`. Пустое M он читает как «снято другой посадкой», а это возврат в
      приёмку. Если kacho#1276 сядет в форме, которую темы не узнают (слияние кнопкой запроса с темой
      «Merge pull request …», перемотка без коммита слияния, сплющивание), M окажется пустым при
      влитой задаче. Приёмка вернётся на верной работе. Ветку задачи для распознавания по
      идентичности использовать нельзя: влитую ветку снимают при вливании.
    condition: >-
      (а) проба п.16 отдельно, по трекеру, устанавливает, влит ли kacho#1276 и каким коммитом
      (состояние запроса и SHA вливания) и достижим ли этот коммит из <B>; (б) если задача влита, а M
      пусто — исход «не выполнилось: распознаватель вливания не узнал форму» с напечатанной темой
      коммита вливания, а не возврат; (в) если задача не влита, а файл снят — снятие другой посадкой;
      (г) проба печатает M, SHA из трекера и число осмотренных слияний.
    held_by: "вниманием; заказ автору пробы DoD п.16 (форма (а)–(г)); правка «Тогда» п.16 — при следующей правке приёмки, не блокирует"
  - id: CX2-64
    decision: D31, D32
    class: "measurement-discipline §«Откуда читается предмет»; code-authoring §«Контракт, который нельзя выразить» (вторая копия цепочки)"
    exposure: >-
      Команда Р16 п.5 жёстко называет файлы `values.yaml` и `values.dev.yaml`, хотя это цепочка dev.
      П.6 (1) при этом берёт файлы цепочки fe3455 из deploy/stacks.txt. stacks.txt объявляет себя
      единственным местом, где записана цепочка `-f`; читатели — stacks.sh и deployStacks, а вторую
      копию цепочки гейты stack_table_test.go считают находкой. Проба п.5, положенная в дерево с
      захардкоженным списком файлов, — вторая копия цепочки dev. Она разойдётся с цепочкой, как только
      цепочку правят. На 2798 и 1276 dev = `values.dev.yaml`, так что сегодня исход тот же.
    condition: >-
      (а) пробы п.5 и п.6 (1) берут файлы цепочки через `stacks.sh --chain <имя>` (или deployStacks) и
      печатают их; своего списка файлов у них нет; (б) инъекция «в цепочку dev добавлен слой,
      переопределяющий connectionURI» меняет вывод пробы.
    held_by: "покраснеет stack_table_test.go, если проба ляжет в дерево со второй копией цепочки; иначе — вниманием"
  - id: CX2-65
    decision: D30, D35
    class: "doc-truthfulness (два места об одном предмете в одном решении); code-authoring §«Инвариант и оснастка — это тоже прод-код»"
    exposure: >-
      Р20 (строки 1186–1187) говорит: «своего отказа по узлу в рендере чарт не несёт; отказы по узлу
      в рендере — только страж». Та же Р20 (Д46), NTF2-34 (е) и §6б говорят, что рендер prod с пустым
      узлом отвергает required чарта notify с именем connectionURI. Строки 1236–1238 уточняют норму:
      поля узла, кроме адреса, не вносят ни умолчаний, ни своего отказа. Если гейт или страж
      напишут по общей фразе «отказы по узлу — только страж», он покраснеет на верном required NTF-1.
      DoD п.14 и NTF2-31 (ж) считают только отказы, называющие credentialSecret, и этого не задевают.
    condition: >-
      (а) ни одна перепись отказов в рендере не утверждает «отказы по узлу только в страже».
      Перепись NTF2-31 (ж) и проба CX2-48 (а) считают отказы, называющие credentialSecret, а required
      NTF-1 на connectionURI в чарте notify в них не попадает; (б) при следующей правке приёмки фраза
      строк 1186–1187 сужается до «по удостоверению» или до «кроме required на адресе (Д46)».
    held_by: "вниманием; заказ автору приёмки (не блокирует — ни один предикат приёмки на общей фразе не построен)"

