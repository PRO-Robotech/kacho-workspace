  - id: CX2-106
    decision: R31-3
    class: >-
      gate-authoring §«Отрицание только в паре с положительным»: «Тогда» (г) утверждает положительный
      ответ kaname («вход — 200», «предъявление — 401»). На этих путях у kaname есть второй страж, и
      Given не ставит его в известное положение. measurement-discipline §«Откуда читается предмет»:
      исход зависит от состояния, которое сценарий не создаёт и не печатает
    exposure: >-
      На kaname @bd8413637 вход и предъявление кода восстановления (сессия восстановления идёт путём
      смены пароля, `change_password.go`) проходят `attemptGate.check`. Это два окна неверных
      предъявлений: по адресу (`AddressKey(A)`) и по источнику (`in.Source` = S1 из пересылки края).
      Пороги — `authn.login.{address,source}-{attempts,window}`. Счёт хранится в базе kaname, это
      `CountFailures` за окно. Исчерпанное окно даёт `429`, `code 8`, `TOO_MANY_ATTEMPTS`, и до проверки
      пароля или кода дело не доходит. В (а) того же сценария следов нет: recovery попыткой не
      считается. Однако П11 обещает к началу сценария только «без глаголов почты, окон адресата и строк
      ленты». О следах неверных предъявлений по A и по S1 Given молчит. Если A или адрес источника S1
      использован в другом сценарии того же подъёма П6 в пределах окна (NTF2-6x предъявляют неверные
      коды и пароли), kaname ответит `TOO_MANY_ATTEMPTS`. Тогда (г) покраснеет на верной работе края:
      посредник насчитает по одному запросу, RATE_LIMITED не будет, а 200/401 не придут. Ответ kaname
      `TOO_MANY_ATTEMPTS` отличается от краевого `RATE_LIMITED` только `reason`, и разбор красного по
      коду 429 их не различит
    condition: >-
      (а) A и S1 сценария NTF2-60 свои на прогон: адрес и источник выводятся из runId, повторного
      использования другим сценарием на том же подъёме П6 нет. Печатаются. (б) Перед (г) проба
      печатает число следов неверных предъявлений по A и по S1 в окнах kaname (чтение базы kaname
      стенда или самоотчёт стража). Ненулевое значение — «не выполнилось» с обоими числами. (в) Ответ
      kaname `TOO_MANY_ATTEMPTS` на вход или предъявление в (г) даёт «не выполнилось» с текстом и
      `reason`, а не красный сценария. Красный — только `RATE_LIMITED` или вызов PoW от края либо
      расхождение счёта посредника. (г) Порядок внутри (г) — вход до предъявления, как в приёмке: успех
      входа обнуляет окно по адресу, и предъявление идёт с нулём
    held_by: "нужен держатель — E2 (проба NTF2-60 на П6). До отображения держится вниманием"

