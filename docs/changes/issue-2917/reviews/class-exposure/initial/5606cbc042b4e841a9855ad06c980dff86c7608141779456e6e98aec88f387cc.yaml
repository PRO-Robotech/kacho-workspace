items:
  - id: CX2-107
    decision: "R32-2: число следов по A и по S1 читается пробой края из хранилища kaname стенда"
    class: >-
      code-authoring §«Контракт, который нельзя выразить» — два написания одного значения: ключ, под
      которым kaname пишет след, и ключ, под которым проба его ищет. measurement-discipline §«Предикат —
      только с контролем»: напечатанный «0» доказывает известное положение, только если тот же запрос
      умеет сказать «не 0». code-authoring §«Умолчание, которое становится утверждением»: ошибка чтения
      или пустой результат не равны «следов нет»
    exposure: >-
      kaname пишет след под ключами, которых проба не видит. (1) Ось адреса: на базе `AddressKey(A)` —
      нижний регистр и обрезка (rate.go). После S3 этого же изменения — `mailkey.Account(A)`: локальная
      часть в нижнем регистре, домен A-label (З11). Проба живёт в kacho и не может импортировать ни то, ни
      другое (`internal/` kaname). Если A, выведенный из идентификатора прогона, несёт заглавные буквы
      (вывод из идентификатора прогона их не исключает: Given формы не задаёт), чтение по `A` как есть даёт 0 при любом
      числе следов. (2) Ось источника: полоса входа берёт значение X-Forwarded-For «как есть, цепочка не
      разбирается». Ключ — это строка, которую край переслал в kaname, а не `S1`, которую проба поставила
      краю. Если край дописывает цепочку или нормализует адрес (IPv6, отображённый IPv4), чтение по `S1`
      даёт 0. (3) Таблица и значения `scope` — внутренняя схема kaname, а S3 правит этот же код. При
      переименовании `count(*)` вернёт 0, а не ошибку. (4) Окно `failed_at > now − window`, посчитанное по
      часам пробы (в NTF2-60 они управляемые), отличается от окна стража. Во всех четырёх случаях Given
      печатает «0», и (г) продолжается. Ложного красного нет: TOO_MANY_ATTEMPTS даёт «не выполнилось». Но
      «известное положение», которое обещает Given, не доказано, а диагностика «не выполнилось» печатает
      «0 и 0» рядом с отказом стража — ложь, которая уводит разбор
    condition_on_code: >-
      (а) Ключ источника для чтения — значение X-Forwarded-For, которое посредник пробы увидел в запросе
      края к kaname. Литерал `S1` для этого не годится, ключ печатается. Если посредник видел больше
      одного значения, исход «не выполнилось». (б) A порождается в канонической форме: ASCII, локальная
      часть в нижнем регистре, без пробелов. Проба печатает A и проверяет, что A равен своей нижнерегистровой
      форме; иначе «не выполнилось». (в) Окно считается по часам базы (`now()` в том же запросе), а не по
      часам пробы. (г) Ошибка чтения или отсутствие таблицы и столбца дают «не выполнилось» с текстом
      ошибки, никогда не 0. (д) Контроль в обе стороны. Сразу после (г) проба перечитывает следы того
      стража, который судил предъявление (CX2-108), и ждёт ровно 1 по каждой оси: это след одного неверного
      предъявления. Число ≠ 1 — исход (г) «не выполнилось» с текстом «чтение следов не способно сказать
      „не 0“». (е) Вход в вывод A и S1 различает повторный запуск против той же базы стенда (номер попытки
      либо одноразовая соль, печатается). Иначе повтор упавшего задания найдёт след прошлой попытки и
      детерминированно даст «не выполнилось»
    held_by: >-
      Нужна проба E2, её нет. Инъекция: A с заглавной буквой в локальной части, чтение по A как есть →
      контроль (д) печатает 0 → «не выполнилось», а не зелёный. Близнец: каноническая A → контроль 1/1.
      Однофайлового признака нет
  - id: CX2-108
    decision: "R32-2, R32-5: печатаются окна attemptGate (Р10, `authn.login.{address,source}-*`), держатель обоих путей (г) в §7 — attemptGate"
    class: >-
      code-authoring §«Решение и его следствие разнесены»: какой страж судит предъявление, решает полоса
      S3 (kaname), а что печатать перед (г), решает проба E2 (kacho). measurement-discipline §«Радиус: по
      имени механизма и по точкам применения»: держатель измерен на базе, а изменение само переносит точку
      применения
    exposure: >-
      На bd8413637 и 0f2395a62 recovery/complete зовёт `gate.check` (attemptGate, Р10). Замысел NTF-2 З15 и
      приёмка Р6 ставят на recovery/complete AttemptGuard: ось «адрес + источник»
      (`authn.login.attempts.address-source-per-window` за `window`) и потолок неудач адреса
      (`address-failure-ceiling`, окно от первой неудачи). Ручки Р6 в kaname уже объявлены
      (`config/login_lane.go:121`), стража ещё нет. Приёмка (строка §3) оставляет ручки
      `authn.login.source-*` только за входом. Из этого следует одно из двух. Либо после S3 предъявление
      судит AttemptGuard, и тогда напечатанные окна Р10 — не про тот страж, а строка §7 устареет посадкой
      самого изменения. Либо S3 оставляет на recovery/complete оба стража, и тогда печать неполна. Замысел
      не говорит, какой вариант верен. Пока A и S1 свои на прогон, пара (A, S1) и потолок по A тоже чисты
      по построению, так что исход (г) не ломается. Не определён только предмет печати и контроля (CX2-107
      (д))
    condition_on_code: >-
      (а) Замысел (З15 и строка S3) решает и называет, остаётся ли `gate.check` на recovery/complete после
      S3 или его заменяет AttemptGuard. Гейт «вызывающих стража ровно 3» печатает и это. (б) Проба E2
      печатает ручки и числа следов каждого стража, который на ревизии kaname стенда судит вход и
      предъявление. Для AttemptGuard это `authn.login.attempts.{address-source-per-window,window,address-failure-ceiling}`,
      число неудач пары (A, S1) и число неудач по A от первой неудачи. Ревизия kaname стенда печатается.
      (в) Контроль CX2-107 (д) читает хранилище того стража, который судил предъявление
    held_by: >-
      Нужна проба E2, её нет. Инъекция: перед (г) записать в фикстуру `address-source-per-window` неудач
      пары (A, S1) в хранилище AttemptGuard → печать не 0 → «не выполнилось». Близнец — чистая пара →
      (г) зелёный. Однофайлового признака нет

