# Запись привязана к отпечатку ПРИЁМКИ 5606cbc0…. Предмет — дельта редакции 32 против одобренной
# редакции 31 (5b1a7e41…, первичный разбор initial/5b1a7e41….yaml — CX2-106). Дельта: Given NTF2-60
# (A и S1 свои на прогон, печать следов неверных предъявлений по A и S1 перед (г)), (г) (вход до
# предъявления, TOO_MANY_ATTEMPTS — «не выполнилось»), П11 с паролем, строка §7 «NTF2-60 (г), kaname».
# Пункты CX2-01…CX2-106 переносятся без изменений.
#
# Итог — к замыслу. Правка закрывает CX2-106 на уровне приёмки. Однако новое Given требует напечатать
# число из ЧУЖОГО хранилища (база kaname) по ключам, написание которых проба воспроизводит сама. Отсюда
# CX2-107: «0» по неверному ключу неотличим от «0» по верному. Кроме того, строка §7 называет держателем
# пути предъявления attemptGate — так на базе, а полоса S3 этого же изменения переводит
# recovery/complete на AttemptGuard (Р6) с другими ручками и осями. Отсюда CX2-108. Возврата в
# приёмку нет: классификация TOO_MANY_ATTEMPTS → «не выполнилось» ложного красного не даёт.
