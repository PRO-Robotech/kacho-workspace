    what: >-
      Держатель (6) по устройству не видит гашения находок самого чарта края: без edge.yaml чарт
      края выпадает из осмотра, и разность «без записи \ полный» по нему пуста (синтетика, trivy
      0.70.0). Инвариант «в edge.yaml один ключ ручки», от которого зависит безвредность файла для
      скана, другого держателя в приёмке не имеет. Нужно: (а) прямая проба «листья edge.yaml =
      {ключ ручки}» с инъекцией лишнего листа и близнецом; (б) в (6) названа граница — гашение в
      чартах, которые без записи не рендерятся, этим гейтом не проверяется, его держит (а); инъекция
      (6) нацелена на находку чарта, который рендерится и без edge.yaml. Класс — «Тогда, приписанное
      механизму без сверки с ним»: тот же род, что B-2 круга 2 редакции 25.
  - id: RA-4
    where: "DoD п.22"
    what: >-
      «Пустой вывод (страницы нет по пути) — "не выполнилось", а не ноль» — неверное утверждение о
      команде. `git grep -c` печатает пустоту и тогда, когда страница есть, а мест ноль (замер, git
      2.53.0). Дефект, который ловит п.22, попадает в «не выполнилось». Существование и счёт нужно
      разделить: `git cat-file -e <H>:<P>` и `git show <H>:<P> | grep -c '<ключ>'`, с контролем в обе
      стороны.
