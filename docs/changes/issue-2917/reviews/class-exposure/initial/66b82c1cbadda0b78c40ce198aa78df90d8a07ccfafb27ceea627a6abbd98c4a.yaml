  рендеров края — CX2-68. Форма `with` теряет 0 — CX2-69. Близнец D6 меняет два факта — CX2-70.
  Предпосылка отрицания берётся из входа пробы — CX2-71; D50 закрывает его на стороне приёмки.
  Два написания числа прыжков (`AUTHZ_TRUSTED_PROXY_COUNT` против `TRUSTED_HOPS`) — пункт первичного
  разбора 9098d6ef. Отличить свою фиксацию (`decision_id`) и отдельный счётчик неразрешённого
  исхода — CX2-46, CX2-47 и замысел «Исход фиксации». Эти пункты закрывают D42 по классам
  §«Чужой ответ: классификация и бюджет» и §«Решение и его следствие разнесены»: нового пункта D42
  не даёт. Гейт покрытия скана не проверяет форму `helm.values` — CX1-100 NTF-1; D48 его отражает.

items:
  - id: CX2-72
    decision: D44, D43 (и E1, который садится вместе с D6)
    class: "code-authoring §«Решение и его следствие разнесены»: решение — `required` в шаблоне края, следствие — строка значения в каждой цепочке стенда. Одна из этих строк ждёт внешнего события (вливания kacho#1276)"
    exposure: >-
      Приёмка разводит во времени две половины одного изменения. `required` в шаблоне края, строки в
      values.own.yaml и values.fe3455.yaml и строки в файлах каталога образцов по §7 вносит «одним
      изменением» полоса D6. Строку в values.dev.yaml, от которой зависят четыре цепочки из семи
      (dev, dev-prod, prorobotech, a8f60d — deploy/stacks.txt), DoD п.13 разрешает только «после
      вливания kacho#1276 в ветку эпика 2564». Замер: вливания нет (`git merge-base --is-ancestor
      origin/1276 origin/2564` → 1). Если D6 сядет раньше, четыре цепочки стенда перестанут
      рендериться. Строка values.dev.yaml, внесённая раньше вливания, нарушает DoD п.13. Р16
      («Порядок и условие начала») не называет вливание kacho#1276 условием полосы, которая делает
      ручку обязательной. П.4 касается только полосы стража почты. П.6 прямо говорит «Д49 не делает
      вливание kacho#1276 условием всей под-фазы». Маршрут tasks.md @4656a7f4b называет у D6
      зависимости Е12, Е13, Е16 и «садится вместе с E1», а вливания kacho#1276 среди них нет. По факту
      условие есть и у D6, и у E1: E1 без D6 не садится (замечание 695a1e95). Значит, край ярусов S3
      (DoD п.7) ждёт чужой посадки, и ни одна строка документа или маршрута этого не говорит.
      Возврата в приёмку здесь нет: порядок выводится из DoD п.13 однозначно. Пропущен он в маршруте.
    condition: >-
      (а) У полосы D6 — и у E1, потому что она садится вместе с D6, — есть условие начала: SHA вливания
      kacho#1276 по трекеру достижим из базы полосы. Предикат печатается, как в DoD п.13 («предикат
      вливания»). Пока условие не выполнено, полоса не начинается. Недопустимы оба частичных пути:
      `required` без строки values.dev.yaml и строка values.dev.yaml до вливания. (б) Проба D6
      проверяет по каждой цепочке, что значение выводится (печатает файл-источник). Поэтому посадка
      до вливания будет красной и назовёт четыре цепочки dev-семейства. Сборка волны не должна
      оказаться единственным, что это ловит. (в) Если владелец захочет, чтобы S3 не ждала kacho#1276,
      нужно отдельное решение диспетчера: например, строка в values.dev.yaml до вливания как второе
      исключение. Молча начинать D6 раньше нельзя.
    held_by: "покраснеет проба D6 по цепочкам (отказ рендера dev, dev-prod, prorobotech, a8f60d) и проверка исключения DoD п.13 (предикат вливания), но только на посадке; на старте полосы гейта нет, он держится вниманием, пока маршрут не получит условие (а)"

  - id: CX2-73
    decision: D48, D46 («других ключей в файле нет»)
    class: "gate-authoring: сравнение «с записью / без записи» ничего не говорит о чарте, который без этой записи вообще не рендерится (отрицание только в паре с положительным близнецом, у которого предмет осмотрен); code-authoring §«Инвариант и оснастка — это тоже прод-код»"
    exposure: >-
      §6б (6) предлагает держать «файл скана ничего не гасит» тем же механизмом, что и заглушки
      helm.set: «скан без каждой записи против полного набора». Для edge.yaml он слеп в главном
      случае. Запись edge.yaml — единственное, что делает чарт края рендеримым. Без неё trivy
      пропускает чарт целиком, молча и с кодом 0 (заголовок trivy.yaml; замер ниже). Поэтому в скане
      «без записи» находок края нет вовсе: разность «гасит = находки(без записи) \ находки(полный)» у
      края пуста при любом содержимом файла. Лишний ключ в edge.yaml, который гасит находку самого
      края, гейт пропустит. Поймает он только гашение в чарте, который рендерится и без edge.yaml
      (файл получает каждый чарт). Инъекция (6) «добавлен ключ, который читает misconfig-проверка →
      красный» становится красной или нет в зависимости от того, в каком чарте гаснет находка. На
      главном предмете — находке края — она по устройству остаётся зелёной. Синтетика это показала
      (trivy 0.70.0, helm v4.2.4): чарт с `required hops` и шаблоном, читающим `.Values.ro`. Без
      файла — целей 0, rc=0. Файл `hops: 1` — 1 цель, KSV-0014 FAIL = 1. Файл `hops: 1` + `ro: true` —
      1 цель, KSV-0014 = 0. Поштучный гейт на этом файле дал бы «гасит 0». Существующие заглушки этим
      изъяном на практике не страдают: каждая из двух (`zot.auth.password`, `db.password`) — одна
      величина, которую проверки не читают. edge.yaml безвреден по той же причине, пока в нём один
      ключ ручки. Но инвариант «других ключей нет» (Р8, строка §6б) приёмка не отдаёт никакому
      держателю, кроме (6). Проба формы (5) проверяет, где лежит ключ ручки, а не сколько в файле
      листьев.
    condition: >-
      (а) Инвариант «edge.yaml несёт ровно один лист — ключ ручки в корне» держится прямой пробой по
      разобранному YAML: множество листьев равно {<ключ ручки>}. Инъекция «добавлен второй лист» →
      красный с именем листа. Близнец — файл с одним листом → молчит. Если на сегодня (5) печатает
      только форму ключа, то (а) — её расширение. (б) Гейт заглушек при проверке записи helm.values
      печатает, какие чарты без этой записи выпадают из осмотра (целей 0). Для таких чартов он пишет
      «гашение в этом чарте этим прогоном не судится; держит (а)», а не молчит с «гасит 0». (в)
      Инъекция (6) нацелена на находку чарта, который рендерится без edge.yaml. Отдельно, как близнец,
      показано, что гашение находки самого края ловит (а), а не (6).
    held_by: "нужен держатель (а) — его нет ни в приёмке, ни в замысле; (б) и (в) держит гейт заглушек после расширения D6. До правки приёмки держится вниманием"

  - id: CX2-74
    decision: D52
    class: "measurement-discipline §«Предикат — только с контролем»: пустой вывод предиката не отличает «страницы нет» от «на странице ноль мест»; gate-authoring: «не выполнилось» не равно «красное»"
    exposure: >-
      DoD п.22 считает места с именем ключа командой `git grep -c '<ключ>' <H> -- <P>` и объявляет:
      «пустой вывод (страницы нет по пути) — "не выполнилось", а не ноль». `git grep -c` не печатает
      файлы с нулевым счётом. На существующей странице без ключа вывод тоже пуст, код тот же (1).
      Замер (git 2.53.0 @6edea09c2ee): существующий файл docs/architecture/admin-api-door-on-external-stand.md
      и ключ, которого в нём нет, дают пустой вывод и exit=1. Несуществующий путь даёт пустой вывод и
      exit=1. Контроль — существующий файл с ключом — даёт `…:gateway/README.md:14`, exit=0. Если
      следовать тексту, страница поставки, которая не называет обязательное значение (как раз
      дефект, который ловит п.22), попадёт в «не выполнилось», то есть в перепрогон, а не в красное.
    condition: >-
      Существование страницы и счёт мест проверяются разными командами. Существование — `git cat-file
      -e <H>:<P>` (0 — есть; иначе «не выполнилось», путь печатается). Счёт — командой, которая печатает
      ноль: `git show <H>:<P> | grep -c '<ключ>'` (0 → красный). Контроль в обе стороны: страница с
      ключом → ≥ 1; та же страница без строк ключа → 0 и красный, а не «не выполнилось».
    held_by: "держится вниманием: DoD п.22 проверяет рецензент по напечатанному. Пункт возвращён в приёмку (RA-4), потому что приёмка сама предписывает неверное соответствие исходов"

