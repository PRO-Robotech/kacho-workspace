    result: >-
      10 файлов без \b. Чужой референт — ceremonyhttp (OutcomeAuthorizeSourcePaceExceeded, 2 файла):
      \b его отсекает верно. Незамеченный член — RecoveryRequestSourcePaced (observer.go:115, :123;
