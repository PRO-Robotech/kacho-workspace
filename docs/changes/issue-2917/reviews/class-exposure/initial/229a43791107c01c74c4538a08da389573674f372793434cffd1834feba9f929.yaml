outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-1
    where: "Р19, §1.10 (вывод для Р19), §7 (строки NTF2-24, NTF2-30…32), §5 П1, DoD п.13, п.14"
    what: >-
      Приёмка утверждает, что после NTF-2 и kacho#1276 объявление удостоверения одно
      (global.kacho.identity.smtp.*) и что страж меняет только имя читателя на отправителя notify.
      Это верно, только если чарт notify читает полосу и удостоверение из этого узла и понимает его
      так же, как страж. Производитель этого не назван: приёмка NTF-1 @29cfa368 и её замысел узел
      не упоминают (0), а NTF1-I06 даёт notify свою форму значений. При этом DoD п.13 запрещает NTF-2
      править values.dev.yaml, где лежит полоса dev (адрес приёмника, якорь). Посев П1 и L
      NTF2-24 строятся только при названном чтении. Приёмке нужно назвать, кто и как проводит
      чтение (Р-строка и строка §7 с производителем), и дать сценарий-держатель вида «рендер dev →
      конфигурация notify несёт адрес приёмника этого релиза». Вариант — признать, что узлов два,
      и тогда Д42 «новый ключ значений не вводится» требует решения диспетчера.
  - id: RA-2
    where: "DoD п.16 (последний абзац), §3а строки 31, 32, 33, 35, 37, 42"
    what: >-
      DoD п.16 объявляет возвратом в приёмку файл §3а, который на базе старта «без строки» или
      красный с исходом «остаётся». Исключение сделано только для исхода «за kacho#1276». Р16 п.4
      сажает полосу стража после kacho#1276, а шесть файлов с исходом «остаётся» по своей колонке
      «куда предмет» или по имени — пробы конфигурации поставщика. Если kacho#1276 их снимет, п.16
      вернёт приёмку на верной реализации. Исключение п.16 надо связать с фактом снятия этих файлов
      kacho#1276, а не с исходом строки, либо переназначить этим шести файлам исход.
