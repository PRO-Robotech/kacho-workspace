items:
  - id: CX2-47
    decision: D23, D24, D27
    class: "architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; security-hardening.md hard-parts-must-converge, hard-control-carries-address-and-credential; code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    exposure: >-
      Р19 и §1.10 оставляют стражу 22 отказа (перепись вызовов `fail (printf` в файле стража
      @96e2fa72b3a) по узлу global.kacho.identity.smtp.* и меняют в нём только имя читателя — на
      отправителя notify. Каждый из 22 отказов описывает, как узел понимает читатель:
      раскрытие адреса через tpl (профиль dev пишет адрес выражением с именем релиза), схемы
      smtp/smtps, флаги снятия шифрования в адресе, пара «имя пользователя в адресе ↔ источник
      удостоверения», якорь почтового узла. Эти правила написаны под нынешних читателей: отправителя
      kaname и шаг подстановки поставщика. Какой узел значений читает чарт notify, не названо нигде.
      Приёмка NTF-1 @29cfa368 — 0 упоминаний global.kacho.identity.smtp и credentialSecret. Замысел
      NTF-1 называет только notify.smtp.sessionTimeout и notify.recipientKey. NTF1-I06 ставит чарт
      notify «без значений зонтика», то есть у него своя форма значений. Если notify читает свой
      узел, то после NTF-2 и kacho#1276 страж судит объявление, у которого нет читателя: 22 отказа
      молчат о настоящей полосе, а объявлений становится два. Кроме того, dev-цепочку (П1) не
      собрать: объявление полосы dev лежит в values.dev.yaml, а этот файл DoD п.13 запрещает NTF-2
      править (исход «за kacho#1276»).
    condition: >-
      (а) в зонтике чарт notify читает полосу и удостоверение только из
      global.kacho.identity.smtp.{connectionURI, fromAddress, fromName, credentialSecret,
      trustAnchorSecret}; своего узла полосы у notify в зонтике нет; одиночная поставка (NTF1-I06)
      отображается на тот же путь значений, второго ключа нет; (б) адрес раскрывается тем же
      помощником tpl, что у стража; (в) по каждому из 22 отказов стража записано, что делает
      разборщик notify на том же входе. Принятое стражем notify принимает, отвергнутое стражем
      notify отвергает при старте. Расхождение хотя бы одного отказа — правка стража по Д42 (его
      условия описывают читателя), а не переименование; (г) после kacho#1276 у узла ровно два
      читателя в шаблонах: страж и чарт notify. Перепись `identity).smtp` по templates → 2 файла.
    held_by: >-
      вниманием: гейта нет. Нужны (1) проба рендера «профиль dev → конфигурация notify несёт адрес
      приёмника этого релиза и якорь ca.crt приёмника» с близнецом a8f60d; (2) сверочная проба
      «22 входа отказов стража → разборщик notify» с законным близнецом на каждый — заказ. Кто
      производит (а), NTF-1 или NTF-2, приёмка не называет — RA-1.
  - id: CX2-48
    decision: D24
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (судить по идентичности, а не по образцу); 00-kacho-core.md ban17-gates; doc-truthfulness (два места об одном предмете)"
    exposure: >-
      Правило «страж один» записано двумя предикатами. NTF2-31 (ж) — «разбор вызова, а не образец
      имени файла». DoD п.14 — строчный git grep '\bfail\b.*credentialSecret'. Строчный поиск не
      видит (1) вызов fail, у которого текст на следующей строке; (2) имя ключа, собранное в
      переменной; (3) отказ через required, а замысел NTF-1 требует для notify.recipientKey
      именно required. На <H> в обход входит и deploy/helm/notify/templates, потому что по Р16 п.1
      NTF-1 влита. Если чарт notify отвергает незаданное удостоверение через required, второй страж
      есть, а перепись печатает 1. Если через fail — перепись печатает 2 на верной реализации.
      Отдельно: шапка стража утверждает «МЕСТ СТРАЖА ДВА» (второе — шаг подстановки поставщика,
      его снимает kacho#1276) и «все семнадцать отказов», а вызовов fail сегодня 22.
    condition: >-
      (а) гейт NTF2-31 (ж) разбирает шаблоны разборщиком шаблонов, а не строками. Отказом считается
      вызов fail или required, у которого строковый аргумент или имя переменной, собранной из
      литерала, содержит credentialSecret. Единица — файл шаблона. Обход — все templates под
      deploy/helm, включая чарт notify. Печатает число разобранных файлов, пустой обход красен;
      (б) у (ж) есть варианты «fail с переносом строки» и «required» — оба красные; (в) правка
      стража в NTF-2 не меняет число вызовов fail и required: до и после 22 (или столько, сколько на
      базе старта); проба печатает оба числа; (г) шапка стража после правки не утверждает второго
      места и не называет числа отказов, которое проба не держит.
    held_by: "NTF2-31 (ж), (ж'') — только если (а); DoD п.14 (строчный grep) держит лишь грубый случай; (в) — заказ пробы счёта отказов; (г) — вниманием"
  - id: CX2-49
    decision: D23
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код»; measurement-discipline §«Форма числа» (единица счёта)"
    exposure: >-
      Отправитель узнаётся по строке `# Source:` под чартом notify. Чарт notify — подчарт зонтика
      (NTF-1 Р1). После NTF-3 в нём два развёртывания, notify-api и notify-sender (NTF3-127), и
      граница чарта включает оба. Образец префикса без границы сегмента ловит и чарт с именем
      notify-<…>, и вложенный подчарт notify. Для NTF2-24 единица — «объявление полосы»: общая
      карта настроек чарта notify, которую читают оба развёртывания, считается одним объявлением
      при двух читателях. Р15 («лишний читатель — лишний путь») такой вход пропускает.
    condition: >-
      (а) принадлежность объекта чарту notify — равенство сегмента пути `charts/<имя>/` в
      `# Source:` имени зависимости из Chart.yaml зонтика (с учётом alias); вложенные подчарты
      notify перечислены отдельно или исключены явно; (б) в NTF2-24 и в части «адрес узла» NTF2-30
      единица — рабочий объект, который читает объявление (env, envFrom, том карты). Внутри чарта
      notify такой объект ровно один, и он же держит ссылку на секрет; (в) распознаватель один на
      NTF2-24, 30, 31 и П1. NTF1-I01 («только notify среди служб kacho») зовёт ту же функцию, а не
      вторую.
    held_by: "NTF2-30, NTF2-24 — только при (а), (б); вариант «общая карта notify читается notify-api» — заказ инъекции; (в) — вниманием"
  - id: CX2-50
    decision: D22
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения»; verdict-and-landing (общий клон и параллельные писатели)"
    exposure: >-
      DoD п.13 судит `git diff --name-only <B> <H>` по 24 путям, где <B> — база старта. Р16 п.4
      сажает полосу стража после вливания kacho#1276. Значит, между <B> первых полос и <H> в линию
      входит правка kacho#1276 по тем же 24 путям (снятие или переименование), и после слияния
      линии в полосу предикат краснеет на верной NTF-2. Обратное: коммит NTF-2 правит файл, а
      kacho#1276 потом его снимает — по именам 2798 диапазон печатает удаление, чьё — не различить.
    condition: >-
      (а) предикат судит только изменения NTF-2: коммиты диапазона от точки ветвления с линией
      релиза до <H>, без слияний с линией (`--no-merges --first-parent`, либо дифф <H> против
      merge-base <H> и линии на момент замера); (б) пути берутся по именам на обоих концах: файл,
      переименованный или снятый kacho#1276, сверяется по его судьбе в kacho#1276, а не по
      отсутствию; (в) проба печатает <B>, merge-base и число осмотренных коммитов.
    held_by: "вниманием: гейта DoD п.13 нет; заказ — предикат в форме (а) с инъекцией «коммит NTF-2 правит строку 3 §3а» → красный и близнецом «слита правка kacho#1276» → молчит"
  - id: CX2-51
    decision: D25
    class: "measurement-discipline §«Живость предмета»; architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
    exposure: >-
      Р16 п.4 открывает полосу стража по признаку «архивов подчартов kratos/hydra в зонтике 0».
      Основание условия — другой предмет: шапка стража (:11) и тексты отказов (:134, :183) называют
      шаг подстановки поставщика. kacho#1276 может снять архивы и оставить шаблон шага в подчарте
      kaname, а может наоборот. Признак по архивам тогда откроет полосу, пока страж ещё называет
      живой шаг, или закроет её, когда шаг уже снят. К тому же один файл правят обе задачи
      (kacho#1276 снимает место С2 и шаг, NTF-2 меняет имя читателя). Кто из них правит строки
      :11, :134, :183, не названо.
    condition: >-
      (а) условие полосы меряется по референту: `git grep -c
      'configRenderInitContainer\|identity-config-render' <база> -- deploy/helm` → 0; признак по
      архивам — дополнительный; (б) строки стража, которые называют шаг поставщика, правит
      kacho#1276 вместе со снятием шага. NTF-2 меняет только имя читателя, и её правка
      накладывается поверх, после вливания; (в) отказ (2) стража — «неподставленная ссылка» — после
      kacho#1276 обоснован для notify заново (см. CX2-47 (в)), не остаётся текстом о снятом шаге.
    held_by: "вниманием; заказ — строка условия Р16 п.4 в задаче kacho#2917 в форме (а); сверка с kacho#1276 — диспетчером"
  - id: CX2-52
    decision: D27
    class: "code-authoring §«Порядок операций внутри кода» (порядок снятия ресурса); verdict-and-landing (expand → migrate → contract)"
    exposure: >-
      DoD п.16 требует, чтобы под deploy/helm не было слова kaname-mail-credential. Единственное
      вхождение в дереве — имя секрета удостоверения в values.a8f60d.yaml. Сам секрет в дереве не
      заводится (перепись ссылок @96e2fa72b3a — 1 строка), его создают вне дерева, на установке.
      Переименование ссылки без секрета под новым именем на установке роняет старт рабочего объекта,
      который монтирует удостоверение, — отправителя notify.
    condition: >-
      (а) замысел называет порядок: секрет под новым именем создаётся на установке a8f60d до
      выкатки правки values.a8f60d.yaml; шаг записан в задаче kacho#2917 проверкой, которая читает
      объект установки; (б) либо имя секрета не меняется, и тогда предикат DoD п.16 его
      исключает — это правка приёмки, не кода.
    held_by: "вниманием; проба «рендер a8f60d → имя в secretKeyRef равно имени объекта на установке» — вне CI, шаг выкатки; заказ"
  - id: CX2-53
    decision: D27
    class: "00-kacho-core.md ban11 (исходов три); code-authoring §«Контракт, который нельзя выразить» (снимаемый ресурс без владельца снятия)"
    exposure: >-
      В charts/kaname/values.yaml лежит копия узла global.kacho.identity.smtp (:266–:271, на 2564 и
      2798). Её читают три шаблона подчарта kaname: deployment.yaml и configmap.yaml (читателей
      снимает NTF-2, §3а строки 38, 6) и _identity-provider.tpl (снимает kacho#1276). §3а строка 39
      оставляет копию, «пока её читает шаблон поставщика». После обеих посадок у копии нет
      читателя, а снимать её не обязана ни одна из двух задач.
    condition: >-
      (а) задача, садящаяся последней, снимает копию узла из values.yaml подчарта. Владелец снятия
      назван в §3а строке 39 и в маршруте kacho#1276; (б) после обеих посадок перепись читателей
      узла в templates подчарта kaname → 0, и объявлений узла в values.yaml подчарта 0.
    held_by: "вниманием; заказ — строка маршрута с владельцем снятия"
  - id: CX2-54
    decision: D26
    class: "measurement-discipline §«Чужое измерение и чужое заявление» (атрибуция, срок годности)"
    exposure: >-
      Шапка опирается на NTF-1 редакции 16 (390b5a33). Действующая одобренная редакция — 18
      (29cfa368). Дифф 390b5a33 → 29cfa368 по словам, на которые опираются Р1, Р4 и Р14
      (DeliveryNotConfigured, authorization: certificate, spiffe, J05), изменений не содержит. Зато
      редакции 17–18 завели узел гейта NTF1-B27 «приёмник address.Domain» по не-тестовому коду
      трёх деревьев вне пакета, и он судит код kaname, который пишет NTF-2.
    condition: >-
      (а) в не-тестовом коде kaname нет ни ссылки на тип address.Domain, ни подстановки его в
      параметр типа. Ключи mailkey.Account и mailkey.Abuse принимают address.Normalized (замысел,
      О2); (б) опора шапки приёмки и замысла переведена на 29cfa368 при следующей правке.
    held_by: "покраснеет NTF1-B27 (гейт, узел приёмника address.Domain), когда он в дереве"
  - id: CX2-55
    decision: D28
    class: "gate-authoring (снятие существующей проверки — назвать, что она держала)"
    exposure: >-
      TestMailLaneDeclarationNamesEveryLetterKind держит свойство «комментарий узла почты в
      deploy/values.yaml называет каждый вид письма из словаря схемы». При снятии узла пропадает и
      предмет, но свойство «поставка называет все виды» переходит на страницу поставки и шаблоны
      (NTF2-33, NTF2-45, DoD п.22). Без названного наследника проба снимается молча.
    condition: "сообщение коммита снятия называет наследников по ID (NTF2-45 — вид = шаблон; NTF2-33 — поставка без узла) и что именно из свойства не наследуется"
    held_by: "NTF2-45, NTF2-33; остаток — вниманием"
  - id: CX2-56
    decision: D26 (перемер базы)
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения»; api-conventions api-empty-means-empty (член закрытого набора без производителя)"
    exposure: >-
      Перепись механизма окна по источнику из замысла (З7, CX2-42 (б)) использует SourcePace\b.
      Граница слова верно отсекает чужой референт OutcomeAuthorizeSourcePaceExceeded (ceremonyhttp,
      темп точки authorize — механизм остаётся). Но она же не видит исход RecoveryRequestSourcePaced
      = "source-paced" в humansession/observer.go:115, :123. Его единственный производитель —
      ветка снимаемого окна (recovery_request.go:126). После снятия ветки исход остаётся членом
      закрытого набора метрики без производителя: ряд «source-paced = 0» неотличим от «окно не
      срабатывало». Закрытый набор исходов Р6 (§6б) этого исхода не содержит. Есть и на 357:
      радиус CX2-42 и М38 его не назвал.
    condition: >-
      (а) RecoveryRequestSourcePaced снимается тем же изменением, что ветка ChargeSource; закрытый
      набор исходов наблюдателя восстановления равен набору Р6; (б) перепись механизма дополнена
      образцом RecoveryRequestSourcePaced|source-paced → 0 в не-тестовом дереве; контроль в обе
      стороны на базе печатает 4 строки в 3 файлах, включая страницу
      docs/content/advanced/observability.mdx — она правится тем же изменением.
    held_by: "перепись З7 — только после (б); проба набора исходов наблюдателя против Р6 — заказ"

