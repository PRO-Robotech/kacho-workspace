    result: "копия есть (:266, :271) на 2798 и 2564; после NTF-2 и kacho#1276 читателей 0, владельца снятия нет (CX2-53)"
  - claim: "Р16 п.2–3, §1.6: признаки на 2798 совпали с 2564"
