items:
  - id: CX2-37
    decision: D16
    class: "architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; code-authoring §«Контракт, который нельзя выразить» (два написания одного значения); §«Умолчание, которое становится утверждением»"
    exposure: >-
      Замер: сертификат сервера kaname в подчарте строит URI-SAN из `mtls.spiffe` с тремя
      `default` (домен доверия — помощник, пространство имён — пространство релиза, учётка — имя
      чарта); `kaname.mtls.spiffe` не объявлен ни в одном из 12 профилей зонтика, то есть SAN
      сегодня целиком выводится умолчаниями. NTF-1 заводит декларацию `kaname.spiffe` — в
      подчарте это `.Values.spiffe`, второй ключ рядом с `.Values.mtls.spiffe` об одном предмете.
      notify сверяет запись перечня равенством полного URI: разойдись выпуск и запись одним
      сегментом — лента kaname отвергается целиком, и письма kaname (весь класс security) стоят
      в `pending`, а ответ глаголов не меняется (Р14) — снаружи отказ не виден.
    condition: >-
      (а) сертификат сервера kaname строит URI-SAN только из `kaname.spiffe`; ключ
      `mtls.spiffe` подчарта снят тем же изменением либо читается тем же помощником, что строит
      запись перечня notify, — второго вычисления SAN нет; (б) в этом пути нет `default` для
      trustDomain, namespace и saName: отсутствие поля — `fail` рендера с именем ключа, а не
      пространство релиза или имя чарта; (в) `kaname.notifications.enabled: true` при
      выключенном mTLS kaname — `fail` рендера с именами обоих ключей: без сертификата сервера
      запись `authorization: certificate` неисполнима.
    held_by: >-
      (а, б) — NTF1-J05 (гейт согласия SAN), если его перечень читателей включает Certificate
      подчарта kaname; иначе вниманием. (в) — сценария нет: нужен вариант рендера «флаг true,
      mTLS kaname выключен → отказ» — заказ.
  - id: CX2-38
    decision: D16
    class: "00-kacho-core.md ban #6 (внутреннее — только на внутреннем слушателе); code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей)"
    exposure: >-
      notify судит пространство kaname по сертификату, который предъявил сервер ленты. Сервер
      ленты, поднятый на своём слушателе со своим сертификатом (или без mTLS), предъявит не тот
      SAN, что внутренний gRPC-слушатель kaname, и NTF2-06-близнец покраснеет только на П6.
      Второе: замысел редакции 5 (З21, §9) ещё несёт строку «`service:kaname` sender» и вызов
      `ResolveSend` по пространству kaname, а приёмка это отменила; код, заводящий кортеж с этим
      субъектом не через манифест (посев, бутстрап), NTF2-47 не видит — она судит манифест.
    condition: >-
      (а) сервер ленты kaname регистрируется на существующем внутреннем gRPC-слушателе kaname,
      который предъявляет серверный сертификат подчарта; своего слушателя и своего сертификата
      у сервера ленты нет; (б) в не-тестовом дереве kaname нет ни одного места, пишущего или
      читающего кортеж с субъектом `service:kaname` либо объектом
      `notification_namespace:kaname`, и сгенерированные функции постановки kaname не зовут
      проверку права отправки — перепись печатает 0.
    held_by: >-
      NTF2-06 (близнец: ResolveSend 0, SENT), NTF2-47 (кортежей из манифеста с субъектом
      service:kaname 0); запись кортежа в обход манифеста — вниманием: заказ предиката дерева
      (литералы `service:kaname`, `notification_namespace:kaname` в не-тестовом Go и SQL → 0,
      инъекция строкой посева).
  - id: CX2-39
    decision: D17
    class: "code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей; два написания одного значения); security-hardening.md hard-no-err-echo"
    exposure: >-
      Замер: три из четырёх действий отвечают через полосу формы HTTP, у которой свой
      сериализатор отказа: `writeError` — закрытый выбор по типу ошибки глагола, ветка по
      умолчанию — 503 со своим текстом недоступности и строкой журнала «unclassified refusal»;
      `errorInfo` полосы — структура `{@type, reason, domain}` без `metadata`, а `domain` каждая
      ветка берёт из `RefusalDomain` kaname. Приглашение отвечает статусом gRPC через край
      (protojson). Статус corelib, возвращённый глаголом полосы, сегодня уйдёт в ветку по
      умолчанию — 503; ветка «как прочие отказы полосы» (так пишет З3) подставит домен kaname
      и потеряет `metadata`. NTF2-51 требует `code`, `message`, `details` равными полям функции
      corelib на обеих поверхностях.
    condition: >-
      (а) у `writeError` полосы — одна ветка для статуса corelib: `code`, `message` и `details`
      берутся из самого статуса, детали сериализуются тем же protojson, что у края; константы
      полосы и `RefusalDomain` в этой ветке не участвуют; (б) ветка узнаёт именно этот статус
      (по идентичности ошибки corelib), а не любой статус gRPC — иначе полоса начнёт отдавать
      наружу текст произвольной внутренней ошибки; (в) HTTP-код ветки берётся из того же
      отображения кода, что у края (FAILED_PRECONDITION → 400).
    held_by: "покраснеет NTF2-51 (а)–(д), (ж) — поля ответа против функции на пине; (б) — вниманием рецензента диффа"
  - id: CX2-40
    decision: D17
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код»; 00-kacho-core.md ban17-gates"
    exposure: >-
      NTF2-54 — новый гейт kaname с проверкой типов и достижимостью по статическому графу
      вызовов. Замер: в `internal/check` уже есть типизированный загрузчик (6 файлов, go/types
      с импортёром gc) и собственный разбор потока с диспетчеризацией через интерфейс;
      golang.org/x/tools в go.mod kaname нет. Второй загрузчик разойдётся с первым; граф без
      диспетчеризации через интерфейс покраснеет на верной реализации, если проверка флага в
      глаголе идёт через порт; сравнение по имени функции, а не по объекту типов, пропустит
      одноимённую функцию другого пакета.
    condition: >-
      (а) гейт использует существующий загрузчик `internal/check` и узнаёт
      `feed.DeliveryNotConfiguredStatus` по объекту проверки типов на пине corelib из go.mod
      kaname, а не по строке имени; (б) достижимость либо разрешает вызов через интерфейс тем же
      разбором, что уже есть в `internal/check`, либо замысел требует, чтобы проверка флага в
      каждом из четырёх действий была прямым вызовом функции пакета, — решение записано; (в) к
      инъекциям (а)–(в) добавлен положительный вариант «действие достигает функции только
      через порт» — гейт молчит.
    held_by: "инъекции NTF2-54 (а)–(в), пустой обход красен; ложный красный на пути через порт — заказ положительного варианта"
  - id: CX2-41
    decision: D18
    class: "code-authoring §«Контракт, который нельзя выразить» (два места одного числа); §«Умолчание, которое становится утверждением» (нуль как «границы нет»)"
    exposure: >-
      Приёмка требует, чтобы страж читал границу 50 из сгенерированного описания шаблона
      `invite`, а не держал второе место о ней. Держатель NTF2-71 (щ) гоняет 51 и 50, и страж
      с литералом 50 в коде kaname на обоих зелёный: правило «граница — число шаблона» держателя,
      красного на копии, не имеет (тот же вид, что B-1 круга 1, в пятую перепись §6б не попал).
      Второе: у шаблона без лимита на адресата константа генератора будет нулём — страж прочтёт
      это как «граница 0» (отказ любому значению) либо как «границы нет».
    condition: >-
      (а) страж kaname берёт границу из идентификатора сгенерированного пакета шаблона
      `invite`; числового литерала границы в конфигурации kaname нет; (б) генератор отвергает
      шаблон `invite` без положительного лимита на адресата в сутки — константы, равной нулю,
      не бывает; (в) сообщение стража называет источник границы (шаблон `invite`).
    held_by: "NTF2-71 (щ) — только значение; нужна проба на копии П8 с лимитом шаблона invite = 40: значение 45 — отказ старта (страж с литералом зелёный — красный) — заказ"
  - id: CX2-42
    decision: D19
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения»; code-authoring §«Порядок операций внутри кода» (порядок снятия ресурса)"
    exposure: >-
      Замер радиуса механизма, не символа: окно обращений по источнику — это `ChargeSource`
      (реализация и 2 вызывающих), порт `SourcePacer`, константы `SourceLane*`, тип `SourcePace`
      и его проводка в корне, таблица `source_request_windows`, уборщик
      `SweepAgedSourceWindows`, порт `SourceWindowReaper` и запись реестра удержания с
      проводкой в корне. Замысел З7 называет `ChargeSource`, `SourcePace` и таблицу; уборщик,
      его порт и запись реестра не названы. Предикат DoD п.7 (`ChargeSource` → пусто) и проба
      замысла «вызывающих ChargeSource 0» уборщика не видят. Уборщик, переживший снятую
      миграцией таблицу, на каждом шаге удержания получает ошибку «отношения нет».
    condition: >-
      (а) одним изменением снимаются все имена механизма, включая уборщик, его порт и запись
      реестра удержания; таблица — новой миграцией с записью в retired.json; (б) перепись после
      снятия печатает 0 по всем именам (`ChargeSource|SourcePacer|SourceLane|SourcePace|
      SweepAgedSourceWindows|SourceWindowReaper|source_request_windows` в не-тестовом дереве,
      кроме применённых миграций); (в) у ручек `source-{attempts,window}` остаётся одно
      семейство читателей — окно неудач входа — и описание ручки в INSTALL.md говорит только о
      нём.
    held_by: "NTF2-60 (а) — поведение; DoD п.7 — только ChargeSource; уборщик — вниманием, заказ расширить предикат DoD п.7 и пробу З7 до переписи (б)"
  - id: CX2-43
    decision: D20
    class: "code-authoring §«Решение и его следствие разнесены»; §«Порядок операций внутри кода»"
    exposure: >-
      Приёмка вводит правило «503 не истрачивает вызов» (§6б). Замысел З9 пишет одноразовость
      отдельной вставкой в множество использованных, а решение окна — транзакцией Admit (З8).
      Если вставка одноразовости зафиксирована, а Admit вернул StoreUnavailable (превышено
      ожидание блокировки ведра), ответ — 503, а вызов уже истрачен: следующая отправка того же
      решения — Replayed и новый вызов. NTF2-59 (д) строит только полный отказ хранилища до
      запроса, где ни одна запись не проходит, и на этой реализации зелёная.
    condition: >-
      (а) пометка вызова использованным и решение Admit — одна транзакция хранилища; любой
      StoreUnavailable в ней откатывает обе записи и отвечает 503; (б) у хранилища `memory` — та
      же неделимость под одной критической секцией; (в) исход «503 после пометки» невозможен по
      построению, а не по порядку вызовов в обработчике.
    held_by: "NTF2-59 (д) — только полный отказ; нужна модульная проба «одноразовость записана, ведро не получено в срок → 503, повтор того же решения — Fresh» с близнецом — заказ"
  - id: CX2-44
    decision: D20
    class: "code-authoring §«Унификация и стоимость»; §«Чужой ответ: классификация и бюджет»"
    exposure: >-
      Замер: хранилище края `postgres` — один пул pgx на хранилище однократности, и его уже делят
      однократность Idempotency-Key и повтор доказательства владения. Замысел З8 кладёт
      ограничитель на то же объявление хранилища. Анонимный поток на recovery/register занимает
      соединения того же пула, и аутентифицированные мутации с Idempotency-Key получают отказ
      хранилища; обратное — нагрузка однократности даёт 503 анонимным глаголам. `lock_timeout`
      ограничивает ожидание блокировки, но не ожидание соединения пула.
    condition: >-
      (а) ожидание соединения ограничено тем же пределом звена, что ожидание блокировки;
      превышение — StoreUnavailable → 503; (б) у ограничителя свой пул названного размера при
      том же объявлении хранилища, либо общий пул с ценой, названной в замысле числом, — решение
      записано.
    held_by: "вниманием; нужна проба «пул ограничителя исчерпан → 503 на анонимном пути, однократность мутаций не задета» — заказ"

