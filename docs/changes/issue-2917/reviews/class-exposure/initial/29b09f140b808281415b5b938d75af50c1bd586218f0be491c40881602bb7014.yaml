class_proposal:
  threshold: >-
    §9.1 (а): два независимых места у разных авторов и подсистем. NTF-2 — edge.yaml, чарт края
    (синтетика этого аналитика, 66b82c1c, CX2-73). NTF-1 — notify-standalone/values.yaml и
    mail-node/operator.yaml, чарт notify (синтетика автора NTF-1, М48 (1)). Оба — синтетика по
    замыслу, а не прогон по дереву: настоящих файлов пока нет. tooling-maintainer может счесть
    второе место предсказанным и отложить запись до прогона D1s.
  owner: "gate-authoring — противоядие предписывает построить проверку (§9.2)"
  record:
    name: "Сравнение «с записью / без записи» не видит предмета, который включает сама запись"
    sign: >-
      Гейт судит элемент конфигурации разностью двух прогонов (с элементом и без него). При этом
      элемент — единственный источник обязательного значения для какого-то предмета осмотра (чарт с
      `required`, рендер без которого отказывает). В прогоне «без» этот предмет выпадает молча, с
      целей 0 и кодом 0, и разность по нему пуста при любом содержимом элемента.
    antidote: >-
      (1) Гейт печатает по каждому элементу предметы, выпавшие из осмотра без него. «Гасит 0» по
      выпавшему не печатается никогда. (2) Для каждого выпавшего предмета из объявленной таблицы
      называется иной держатель, обычно прямая проба формы элемента (множество листьев). Выпавший
      предмет без строки таблицы — не зелёный. (3) Ожидаемое выпадение выводится из ведомости
      предметов, отказывающих без слоя, а не называется путём. (4) Инъекция: элемент, гасящий находку
      самого выпавшего предмета, → красный держателя из (2), близнец — молчит.
    incident: >-
      Два замысла сканирования IaC независимо подали сканеру файл значений, без которого чарт не
      рендерится. Поштучный гейт заглушек был бы зелёным при любом лишнем ключе в этом файле,
      в том числе при ключе, который снимает находку самого чарта. Обнаружено до кода, на синтетике
      сканера (0.70.0).
    observed: "2026-09-30, kacho@6edea09c2ee (состояние гейта), kacho-workspace@7e68ea1c1 (замыслы NTF-1 @45d535e1e, NTF-2 приёмка d331d103a)"
    removal_predicate: >-
      Гейт в конфиге сканера печатает для каждого элемента перечень выпавших предметов с держателем
      по таблице. Инъекция «элемент гасит находку выпавшего предмета» краснеет, а близнец молчит — на
      дереве, где такой элемент есть. Внешний факт: `trivy config` с флагом или режимом, который
      отказывает (не молчит) на не отрендеренном чарте, делает класс невозможным по построению.
      Проверяется вызовом без файла значений: код ≠ 0 — снять.
    held_by: "вниманием, гейта нет; после D6 — частично правкой гейта заглушек (CX2-77)"
single_file_predicate_candidate: "— (признак — отношение двух прогонов и ведомости, в одном файле не виден)"
