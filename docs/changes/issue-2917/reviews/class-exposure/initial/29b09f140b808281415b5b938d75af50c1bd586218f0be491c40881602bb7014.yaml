items:
  - id: CX2-75
    decision: R28-2
    class: "gate-authoring: исход вместо объявления. Предпосылку «гейт судит helm.values» доказывает то, что он краснеет на инъекции, а не строка с числом. code-authoring §«Инвариант и оснастка — это тоже прод-код»"
    exposure: >-
      Предпосылка (6) принимает за доказательство суда напечатанную строку «файлов значений M». Но
      печатать M и судить M файлов — разные свойства. Гейт, который пересчитал записи helm.values и
      не прогнал скан без каждой из них, напечатает ту же строку. Строку фиксирует чужая полоса (D1s:
      «печать "заглушек N; файлов значений M"», маршрут NTF-1 @45d535e1e). D6 будет разбирать её
      своим распознавателем. Если на изменённом тексте строки распознаватель не найдёт совпадения,
      предпосылка честно получит «не выполнилось». Если же он сматчится на `M` из другой строки
      вывода, получится ложное «выполнилось».
    condition: >-
      (а) Предпосылку D6 держат два исхода на базе полосы, а не одна строка: инъекция D1s
      (`deploy/scripts/assert-scan-stubs-hide-nothing-inject.sh` — файл, чей корневой ключ гасит
      находку чужого чарта) даёт красный с именем файла, её близнец — зелёный. Исход инъекции и
      строка печатаются. (б) M из вывода сверяется с числом записей `misconfiguration.helm.values`
      разобранного `trivy.yaml` базы. Если они расходятся — «не выполнилось», и печатаются оба числа.
      (в) Распознаватель строки привязан к полному тексту строки D1s и проверен в обе стороны: на
      настоящем выводе D1s находит, на выводе без строки не находит.
    held_by: "нужен держатель: проба D6 (предпосылка (6)); в маршруте D6 его нет. До отображения держится вниманием"

  - id: CX2-76
    decision: R28-3, R28-1
    class: "architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; code-authoring §«Инвариант и оснастка — это тоже прод-код» — близнец чужой полосы утверждает число литералом"
    exposure: >-
      D6 после D1s правит тот же гейт: добавляет печать выпавших и правило про edge.yaml. Кроме того,
      D6 меняет вход, на который опирается близнец D1s. Строка D1s @45d535e1e: «близнец — файлы
      каталога → зелёный, "файлов значений 2"». По R28-3 на голове D6 M = M базы + 1 = 3. Если
      близнец D1s сравнивает с литералом 2, на голове D6 он покраснеет. Файл инъекции — путь D1s. В
      путях D6 (маршрут NTF-2 @4656a7f4b) нет ни этого файла, ни самого гейта
      `deploy/scripts/assert-scan-stubs-hide-nothing.py`, ни `deploy/testdata/notify-standalone/edge.yaml`,
      ни пробы (7). Маршрут старше редакции 28, поэтому сверка путей D6 с новой дельтой ещё впереди.
    condition: >-
      (а) Близнец инъекции D1s выводит ожидаемое M из числа записей helm.values в разобранном
      `trivy.yaml`, а не из литерала. Иначе D6 обязана включить файл инъекции в свои пути, и это надо
      назвать. (б) В сдаче D6 на голове полосы прогнаны гейт заглушек и инъекция D1s. Оба зелёные,
      вывод напечатан с «файлов значений 3». (в) В пути D6 входят гейт заглушек, `edge.yaml` и проба
      (7). Правка гейта в D6 аддитивна: формула «гасит / без предмета» D1s не меняется, и дифф D6 в
      функциях снятия записи пуст.
    held_by: "покраснеет инъекция D1s на голове D6, но только если её кто-то прогонит: в триггерах конвейера ветки полосы её нет (D1s сама гонит гейт покрытия вручную). До отображения держится вниманием"

  - id: CX2-77
    decision: R28-3
    class: "doc-truthfulness / gate-authoring: напечатанный держатель — утверждение, и для большинства записей оно ложно; code-authoring §«Инвариант и оснастка — это тоже прод-код» — правило гейта названо путём файла, а не выведено"
    exposure: >-
      R28-3 печатает выпавшие чарты «по каждой записи helm.values» с одним и тем же текстом «держит
      (7)». (7) — проба однолистности edge.yaml, и больше она ничего не держит. Записи D1s —
      `notify-standalone/values.yaml` и `mail-node/operator.yaml` — тоже выбивают из осмотра чарт
      notify. Синтетика автора NTF-1 (М48 (1), trivy 0.70.0, 2026-09-30): при `[]` и при
      `[notify-standalone]` целей notify 0, при обоих файлах — 1. Значит, после D6 гейт на каждой из
      двух записей D1s напечатает «notify — не судится; держит (7)», а это ложь. У многоключевого
      `notify-standalone/values.yaml` держателя однолистности нет. Корневой ключ этого файла
      доходит до чужого шаблона: М48 (4) — у соседнего чарта пропадает KSV-0014. Правило «пустой
      перечень на edge.yaml — красный» названо путём файла. Такое же ожидание для записи чарта, который
      сам отказывает без своего слоя, гейт не выведет.
    condition: >-
      (а) Держатель, напечатанный гейтом для выпавшего чарта, берётся из объявленной таблицы «запись
      helm.values → держатель гашения в выпавших чартах», а не из константы. Если у записи есть
      выпавшие чарты, а в таблице нет строки, это не зелёный: печатаются имя записи и чарты. Каким
      исходом это считать (красный или названное послабление с предикатом снятия), решают D1s/NTF-1 —
      записи их. (б) Правило «чарт обязан выпасть» выводится из ведомости отказывающих чартов
      (`.github/scripts/lint-service-charts.sh`). Запись вида `<чарт>|-f <файл>` требует, чтобы
      `<чарт>` был в перечне выпавших для записи `<файл>`. Для `gateway/deploy|-f …/edge.yaml` это
      даёт ровно правило R28-3, и путь файла в гейте не пишется. (в) Инъекция правила: чарт края в
      копии получает значение ручки в собственных значениях и без edge.yaml рендерится → перечень
      выпавших на edge.yaml пуст → красный с именем записи. Близнец — дерево как есть, молчит. В
      приёмке для этого правила инъекции нет, её назначает замысел.
    held_by: "нужен гейт: (а) и (б) — правка гейта заглушек (D6 по R28-3; таблицу держателей для записей D1s ведёт NTF-1). (в) — инъекция в пробе D6. Сейчас держится вниманием"

  - id: CX2-78
    decision: R28-5
    class: "testing-verdict п.14 «Твой СОБСТВЕННЫЙ разборщик — тоже распознаватель»: имя ключа добывается разбором шаблона"
    exposure: >-
      Проба (7) берёт имя ключа «из шаблона, а не из своей константы». Это значит, что она разбирает
      Go-шаблон Deployment края. Чем «ключ ручки» отличается от прочих `required` в том же шаблоне,
      приёмка не говорит. У края могут появиться другие обязательные значения. Распознаватель «первый
      `required` в файле» или «`required` с подстрокой hops» даст неверный ключ, а (7) с ним сравнит
      множество листьев. Ключ может оказаться вложенным (`.Values.a.b`). Если его сравнить по
      последнему сегменту, файл `b: 1` в корне пройдёт (7), хотя шаблон его не читает. Такой файл
      поймали бы (2) и (5), но (7) о ключе солжёт.
    condition: >-
      (а) Якорь поиска — имя переменной окружения `KACHO_API_GATEWAY_TRUSTED_HOPS` (оно зафиксировано
      приёмкой). Ключ — аргумент `required` в выражении значения именно этой переменной. Проба
      печатает полный путь ключа от `.Values` и координату шаблона. (б) Множество листьев сравнивается
      по полным путям, а не по последним сегментам. (в) Распознаватель проверен в обе стороны.
      Инъекция «второй `required` на другом ключе в том же шаблоне» — ключ ручки найден тот же,
      печать не меняется. Инъекция «переменная есть, `required` снят» — «не выполнилось» с путём
      шаблона (как в R28-5).
    held_by: "нужен держатель — инъекции (в) в пробе D6; в приёмке и маршруте их нет. До отображения держится вниманием"

  - id: CX2-79
    decision: R28-4
    class: "gate-authoring: пустой вход как всеразрешение. code-authoring §«Контракт, который нельзя выразить»: значение, удаляющее умолчание, неотличимо от «ничего» для наивного обхода"
    exposure: >-
      Приёмка определяет однолистность как «множество листьев разобранного файла равно одному ключу».
      Что считать листом, не сказано. Замер (helm v4.2.4): у чарта в умолчаниях карта
      `sc.readOnlyRootFilesystem: true`. Файл `hops: 1` + `sc: null` удаляет её из рендера (`sc:
      "null"`), а `sc: {}` рендер не меняет. Наивный обход PyYAML («рекурсия в словари, остальное —
      лист») на этих файлах даёт `['hops', 'sc']` для null и `['hops']` для `{}`. Опасный случай
      наивный обход ловит. Но реализация, которая собирает только скаляры с непустым значением
      (`if v is not None`), пропустит `sc: null`. А `null` — ровно та форма, которой лишний ключ может
      снять умолчание безопасности чарта и погасить или породить находку скана.
    condition: >-
      Однолистность проверяется на форме всего документа: разобранный файл — отображение ровно с
      одним ключом верхнего уровня (или ровно с одним путём до ключа ручки), и значение по нему —
      целое ≥ 0. Любой иной узел считается лишним листом: `null`, пустая карта, пустой список,
      вложенная карта, второй документ YAML. Инъекции: `extra: null` → красный с именем `extra`;
      `extra: {}` → красный. Близнец — один ключ ручки → молчит.
    held_by: "нужен держатель — инъекции в пробе (7) D6. До отображения держится вниманием"

