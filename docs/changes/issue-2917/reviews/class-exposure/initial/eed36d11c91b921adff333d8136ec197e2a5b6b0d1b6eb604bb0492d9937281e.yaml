items:
  - id: CX2-99
    decision: R30-8
    class: >-
      gate-authoring §«Отрицание только в паре с положительным»: утверждение «путь вне ограничителя»
      проверено на одном ярусе из двух. code-authoring §«Порядок операций внутри кода»: принадлежность
      пути к ограничителю и выбор яруса — два решения, и порядок между ними не выражен
    exposure: >-
      До редакции 30 NTF2-63 утверждал, что login, csrf, /projects, recovery/complete и register/confirm не
      получают отказа при ИСЧЕРПАННОМ HARD. Теперь он утверждает только отсутствие вызова PoW на ступени
      PoW. Строка §6б `…ANON_MAIL_IP_HARD_*` больше не называет NTF2-63. NTF2-66, второй сценарий о путях
      предъявления кода «после исчерпания порога», идёт на П6-k, а там края нет. Значит, ни один сценарий
      не проверяет, что ярус HARD не задевает пути вне ограничителя. Пусть ограничитель сначала проверяет
      HARD для источника (по всем путям), а принадлежность пути — только внутри яруса PoW. Тогда NTF2-63
      зелёный, а исчерпанный HARD закрывает раннеру вход в систему.
    condition: >-
      (а) Звено ограничителя решает принадлежность пути до любого яруса. Это одна функция над одним
      объявлением перечня путей (`login_lane_paths.go` / перечень почтовых глаголов). Для пути вне перечня
      счётчики источника не читаются и не пишутся: вызова хранилища ограничителя 0. Рецензент диффа видит
      ранний возврат до первого обращения к ярусам. (б) На П6 (E2) есть близнец по ярусу HARD.
      Источник `S1` исчерпал HARD (исход NTF2-60 (в3)), затем идут пути полосы формы, которые есть на П6:
      login, recovery/complete, register/confirm. Ответы — от kaname, `RATE_LIMITED` 0, обращений к
      хранилищу ограничителя по этим запросам 0. Положительный — recovery с `S1` → `RATE_LIMITED`. Инъекция
      «ярус HARD до проверки пути» → близнец красный. /projects на П6 нет, его держит (а) по построению
      (один перечень)
    held_by: "нужен держатель — близнец (б) в E2; в приёмке после Д70 его нет. До отображения держится вниманием"

  - id: CX2-100
    decision: R30-13
    class: >-
      measurement-discipline §«Предикат — только с контролем»: предикат не может ответить «нет».
      testing-verdict п.13: чужой текст с плейсхолдером прогоняется дословно
    exposure: >-
      Предикат Р16 п.8 — ИЛИ двух образцов, и первый из них содержит буквальный `<модуль>`. На одобренной
      приёмке NTF-1 @1bffe10d: всего 7 строк = 3 (шаблонный текст `modules.<модуль>.enabled`) + 4
      (`spiffe.kaname`). Конкретный ключ `global.kacho.notifications.modules.kaname.enabled` встречается 0
      раз. Пусть W4a одобрит другой путь флага модуля. Термин spiffe даст ≥ 4, предикат скажет «тот же
      путь», а `--set` на неизвестный ключ молча оставит флаг kaname `true`. Ровно этот исход Р16 п.8 и
      должен был предотвратить: NTF2-53 (б) красная на верной работе
    condition: >-
      Проверку начала замысел реализует строже буквы приёмки: (а) два отдельных счёта, каждый ≥ 1: путь
      флага модуля и путь SAN kaname. (б) Образец флага — путь, который строит помощник чарта для модуля
      kaname. Сверка — по форме, разобранной из одобренного текста NTF-1 (подстановка `<модуль>` → имя
      модуля kaname в ключе зонтика), а не по шаблонной строке. Либо, что точнее, рендер: значение
      `--set <путь>=false` меняет перечень источников notify (kaname выпадает); не меняет — «не выполнено».
      (в) Печатаются оба счёта и отпечаток приёмки NTF-1, по которому они сняты
    held_by: "нужен держатель — проверка начала полосы D1 (или D0). До отображения держится вниманием"

  - id: CX2-101
    decision: R30-9
    class: >-
      measurement-discipline §«Откуда читается предмет»: величина взята из рендера, а не из процесса стенда.
      change-graph CONSTRUCTIBILITY: Given не называет условия, при котором Then однозначен
    exposure: >-
      (1) На П6-k NTF2-69 требует `pending-max > account-per-day` с печатью, иначе отказ неоднозначен
      (§11, класс найден на NTF2-69). Для (е) на П1 такого условия нет. Р8 допускает `pending-max ≥ 1` и
      `young ≤ account`, а между `pending-max` и `young-account-per-day` границы нет. Если в профиле `dev`
      `pending-max ≤ Y`, то запрос Y+1 (а то и раньше) получит `INVITATION_PENDING_LIMIT`, и (е) станет
      красной на верной работе. Поставляемые 200 > 50 это сейчас скрывают. (2) Y и Ya берутся «из рендера
      цепочки dev». Ревизия, с которой рендерит проба, и ревизия, с которой поднят П1, могут разойтись (стенд
      поднят раньше, ветка ушла вперёд). Тогда номер отказа сравнивается с чужим Y
    condition: >-
      (а) Проба (е) печатает `pending-max` и требует `pending-max > Y`, иначе «не выполнилось» с обоими
      числами. (б) Y, Ya, `pending-max` читаются у процесса kaname стенда (самоотчёт ручек при старте или
      ряд метрики), либо из рендера той ревизии, которой поднят стенд, и тогда печатаются обе ревизии.
      Рендер с иной ревизией без печати — не годится. (в) Адресаты (е) — по одному на запрос, свои на
      runId, поэтому `recipient-*` не срабатывают. Это условие печатается: число различных адресатов = Y+1
    held_by: "нужен держатель — предпосылки в кейсе X1 (newman). До отображения держится вниманием"

  - id: CX2-102
    decision: R30-10
    class: >-
      code-authoring §«Унификация и стоимость»: N реализаций одного правила, и вводится ещё одна.
      code-authoring §«Контракт, который нельзя выразить»: «целые секунды ≥ 1» — контракт края и консоли
    exposure: >-
      Замысел (З24) говорит «целое число секунд до момента выхода старейшего акта», а округление не
      называет. Усечение остатка 400 мс даст `retry-after: 0`. Тогда край выставит `Retry-After: 0`, (е)
      станет красной («> 0»), а консоль (`ui-future/shared/src/api/login-lane.ts`: «целые секунды ≥ 1; иначе
      срока нет») сочтёт, что срока нет. В kaname @a59862664 правило «вверх и не меньше 1» уже есть ТРИЖДЫ:
      `loginlanehttp.retryAfterSeconds`, `ceremonyhttp.writeRetryText`, `clienttokenhttp.writeRetryLater`.
      Все три согласны, но это три копии. Приглашение станет четвёртой
    condition: >-
      (а) Срок метаданных приглашения считает та же функция, что срок полосы формы (`retryAfterSeconds`,
      вынесенная в общий пакет kaname). Четвёртой копии нет: в диффе S5 нет нового `math.Ceil` или деления
      на `time.Second` для срока повтора. (б) Проба функции на границах: 0 → 1, 400 мс → 1, 1 с → 1,
      1,2 с → 2. (в) На П6-k для NTF2-69 (а) остаток окна дробный (момент запроса не кратен секунде
      относительно старейшего акта). Метаданные равны вверх округлённому остатку, и это печатается
    held_by: "нужен держатель — (б) в S5 и печать (в) в S9a. До отображения держится вниманием"

  - id: CX2-103
    decision: R30-4
    class: >-
      architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; gate-authoring
      §«Фикстура не снисходительнее продукта»: проба повторяет пересылку личности, которая живёт в
      компоненте, исключённом из стенда
    exposure: >-
      Края с REST-шлюзом на П6 нет (Д70). Но личность к gRPC kaname край переносит именно в REST-шлюзе:
      `gateway/internal/restmux/mux.go` — неэкспортируемые `buildPrincipalMetadata` / `principalMetadata`
      над ключами `gateway/internal/principalmeta` @ae4bde452f6. «Сессия, перенесённая так, как её
      переносит край», на П6 строится пробой — второй реализацией. При правке ключей или формы пересылки в
      продукте вторая не покраснеет. Глаголы NTF2-90…93, 96 получат отказ аутентификации, и сценарий
      прочтёт «строк ленты 0» как отсутствие письма. Обратное направление тоже возможно: проба кладёт
      принципала, которого край из этой сессии не вывел бы, и личность на П6 шире, чем в продукте
    condition: >-
      (а) Метаданные личности проба строит той же функцией, что REST-шлюз. Функция экспортируется из
      пакета края (или выносится в `principalmeta`), и `mux.go` зовёт её же. Литералов имён заголовков
      личности в пакете стенда `gateway/internal/ntf2stand` нет. (б) Положительный контроль канала:
      глагол на внешнем слушателе отвечает не `UNAUTHENTICATED`/`PERMISSION_DENIED`, и актор в записи
      kaname — `U`. Печатается. Отказ аутентификации на канале — «не выполнилось» с текстом, а не исход
      сценария о ленте. (в) Инъекция «проба кладёт ключ личности с иным именем» → (б) даёт «не выполнилось»
    held_by: "нужен держатель — (б), (в) в положительном контроле П6 (E1a). До отображения держится вниманием"

  - id: CX2-104
    decision: R30-11
    class: >-
      testing-verdict п.14 «Твой СОБСТВЕННЫЙ разборщик — тоже распознаватель»: проба разбирает формат
      шаблона сама, хотя у формата есть единственный загрузчик
    exposure: >-
      У формата тела есть загрузчик: corelib @8a9eb14 `notify/spec` — `Block.Kind`, `BlockButton`,
      `spec.AttrKinds()` = {text, secret, path, token, timestamp}, разбор `button` в `load.go`. Проба
      NTF2-68 «разбирает body.ru.yaml и печатает число блоков button». Свой обход YAML расходится с
      загрузчиком на всём, что тот нормализует: ключ блока, вложенность, `when`. Кроме того, обход читает
      только `body.ru.yaml`. Тело другой локали с `button` прошло бы. Утверждение «button — единственный
      блок, дающий ссылку» верно для загрузчика на этой ревизии corelib. Это свойство формата NTF-1, а не
      шаблона
    condition: >-
      (а) Блоки и виды атрибутов проба берёт загрузчиком corelib `notify/spec` на пине kaname. Счёт —
      `Kind == BlockButton` по ВСЕМ телам шаблона. Атрибуты — вид из `form.KindPath`/`form.KindToken`, а не
      сравнение строк. (б) Инъекции: `button` в теле → красный; атрибут вида `path` без кнопки → красный
      (вторая половина утверждения). Близнец — шаблон как есть
    held_by: "нужен держатель — инъекции (б) в пробе NTF2-68 (S9a). До отображения держится вниманием"

  - id: CX2-105
    decision: R30-2
    class: >-
      testing-verdict п.14 (собственный разборщик); measurement-discipline §«Предикат — только с
      контролем»: перечень функций чтения закрыт литералом, поэтому новый путь чтения приёмника не виден
    exposure: >-
      Таблицу «перемеряют на базе старта той же разборкой». Разборка ищет вызовы четырёх функций
      (`_await_letter`, `_letters_total`, `_await_code`, `_fp_await_letter`). Кейс, который читает приёмник
      новой функцией или прямым запросом по `standMailboxUrl`, разборка не найдёт, и таблица останется
      «полной». Второй предикат §3б ищет те же признаки по словам, но по ФАЙЛАМ, и с кейсами его никто не
      сверяет. Знаменатели я перемерил AST @a59862664: 6 / 8 / 17 объектов Case — совпадают с §3б
    condition: >-
      (а) Функции чтения разборка выводит из признака адреса приёмника — тех же образцов, что второй
      предикат §3б: функция модуля, тело которой ссылается на адрес приёмника, транзитивно. Литерального
      перечня нет. Печатаются найденные функции и знаменатели по наборам. (б) Сверка двух предикатов: каждый
      файл набора с найденным кейсом есть в перечне 14, а файл набора из перечня 14 без найденного кейса —
      «разошлось» с именем файла. (в) Инъекция в копии: кейс читает приёмник новой функцией → найден
    held_by: "нужен держатель — разборка полосы S8d. До отображения держится вниманием"

measurements:
  - claim: "отпечаток предмета; дельта 28 → 30"
    command: "sha256sum <приёмка>; git show fd3470cb6:<приёмка> | sha256sum; git diff --stat d331d103a fd3470cb6 -- <приёмка>"
    result: "eed36d11… оба; d331d103a = 29b09f14…; +403 −106"
  - claim: "Р16 п.8: предикат не 0 на одобренной приёмке NTF-1 (CX2-100)"
    command: "grep -cE '<образец Р16 п.8 дословно>' docs/specs/sub-phase-NTF-1-…-acceptance.md @1bffe10d; то же по каждому образцу; grep -cE 'global\\.kacho\\.notifications\\.modules\\.kaname\\.enabled'"
    result: "7 = 3 (буквальный `<модуль>`) + 4 (spiffe.kaname); конкретный путь модуля kaname — 0. Предикат на «нет» не способен"
  - claim: "§3б: читатели приёмника — 14 файлов @a59862664"
    command: "LC_ALL=C git grep -lE 'standMailboxUrl|stand-mailbox|mailbox-url|mailboxUrl|/codes\\?to=' origin/484-notify -- ':!*.md' | wc -l (kaname)"
    result: "14; голова origin/484-notify = a59862664, то есть ревизия §3б"
  - claim: "§3б: знаменатели наборов (CX2-105)"
    command: "python3 ast: Call(func=Case) с id='IAM-…' в tests/newman/cases/kaname-{address-verification,recovery-lane,second-factor}.py @a59862664"
    result: "6 / 8 / 17 — совпадают. Транзитивный предикат чтения (15 кейсов) не воспроизводил"
  - claim: "§3б: держатели «не наследуется» существуют"
    command: "git grep -l 'func <Имя>(' origin/484-notify -- '*_test.go' (kaname), четыре имени"
    result: "все четыре найдены по названным путям. Два — `*_integration_test.go`: их гонит задание `integration` ci.yml (run-integration.sh), а не быстрая сборка"
  - claim: "производители Retry-After в kaname (CX2-102)"
    command: "git grep -n '\"Retry-After\"' origin/484-notify -- '*.go' ':!*_test.go' (kaname)"
    result: "6 мест; округление «вверх, ≥ 1» в трёх функциях: loginlanehttp.retryAfterSeconds, ceremonyhttp.writeRetryText, clienttokenhttp.writeRetryLater; ещё два места — литерал «1»"
  - claim: "радиус переноса `retry-after` краем: кто сегодня кладёт этот ключ в метаданные gRPC"
    command: "git grep -n -i 'retry-after' origin/2564 -- ':!*_test.go' ':!*.md' ':!*.mdx' (kacho); git grep -n 'SetHeader(' origin/2564 -- gateway ':!*_test.go'"
    result: "производителей метаданных `retry-after` в kacho 0 (попадания — консоль, читающая HTTP-заголовок, и комментарий registry). SetHeader в крае — request-id и shimproxy; WithOutgoingHeaderMatcher/WithErrorHandler в крае нет. Глобальный сопоставитель сегодня ничего чужого не переименует"
  - claim: "пересылка личности к gRPC живёт в REST-шлюзе (CX2-103)"
    command: "git grep -n -i principal origin/2564 -- 'gateway/internal/**' ':!*_test.go' | grep -i 'metadata\\.|forward'"
    result: "restmux/mux.go:153 buildPrincipalMetadata, :222 principalMetadata (неэкспортируемые); ключи — gateway/internal/principalmeta"
  - claim: "формат тела: виды блоков и атрибутов, ссылка только кнопкой (CX2-104)"
    command: "git show origin/77-notify:notify/spec/{kinds.go,load.go} (corelib)"
    result: "AttrKinds = text, secret, path, token, timestamp; ссылку несёт только BlockButton (path — атрибут вида path либо литерал при token); у p/heading/warning/code/list/kv ссылочных полей нет"
  - claim: "Р8: умолчания приглашений (CX2-101)"
    command: "grep -n 'pending-max' <приёмка> (строка таблицы Р8)"
    result: "account-per-day 200, young-account-per-day 50, pending-max 200; границы: young ≤ account, pending-max ≥ 1. Связи pending-max с young нет"

