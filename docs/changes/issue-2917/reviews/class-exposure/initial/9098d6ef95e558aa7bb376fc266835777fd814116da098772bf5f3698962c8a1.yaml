decisions:
  D1: 'каждое письмо личности ставится сгенерированной функцией corelib notify/feed в транзакции события; сигнал — событие вида «нотификация» подписки kaname с объектом notification_feed:kaname; тело — Claim/Ack только service:notify (Р1)'
  D2: 'собственная почта kaname снимается: отправитель, 10 ручек invite-mail.*, креды, якорь, очередь invite_mail_outbox (новой миграцией), метрики; MAIL-47 замещается двумя гейтами; снятый ключ — отказ старта как неизвестный (Р2, Р8, NTF2-44, 45, 48)'
  D3: 'закрытый перечень 24 шаблонов, файл required-security.yaml, карта «вид аудита → шаблон → правило адресата» на 23 вида, письма без пользовательского текста (Р3)'
  D4: 'флаг почты kaname без умолчания; в зонтике — global.kacho.notifications.enabled с переопределением модуля, из него же — перечень источников notify; выключен — синхронный отказ MAIL_DELIVERY_DISABLED, одинаковый для любого адреса, строк 0, сервер ленты не поднят, метрика 0, действия класса S исполняются (Р4)'
  D5: 'звено-ограничитель края на recovery и register: ключи источник/подсеть на доверенной глубине, счёт пропущенных, скользящие окна, три ступени, общий поток, своя PoW (вызов подписан, одноразов, со сроком), 429 с Retry-After (Р5)'
  D6: 'рубеж kaname на пару (адрес, назначение): CAS-счётчик в транзакции постановки, тот же живой код, прогрессия, пол при скользящих окнах, закрытый набор исходов метрики, запас доверенного устройства, оси перебора на трёх путях предъявления, ответ вне пути постановки, письмо о торможении (Р6)'
  D7: 'приглашения: потолки аккаунта (моложе порога — ниже), молчаливые потолки адресата, явный отказ по pending-max до Operation, срок освобождает место без уборщика (Р7)'
  D8: '51 ручка лимитов без умолчаний с границами под стражем старта края и kaname; снятые ручки — неизвестный ключ; инвариант сетки notify ≥ 1,25 × суммы в рендере зонтика (Р8)'
  D9: 'регистрация «сначала письмо, потом сессия»: ожидающие записи со свёрткой пароля и кода, код привязан к паролю запроса, confirm ищет запись по коду и паролю, уникальность — база; край ретранслирует register/confirm (Р9)'
  D10: 'класс S: строка ленты в транзакции строки audit_outbox, ключ идемпотентности (событие, шаблон, адресат); адресаты — снимком в транзакции события; адрес — в момент отправки внутренним справочником, вызываемым только service:notify; новое ребро notify→kaname (Р10, Р11)'
  D11: 'метка доверенного устройства: подписанное печенье, свёртка в базе, срок от выдачи без продления; письмо нового устройства — только путь входа (Р12)'
  D12: 'глагол смены адреса не вводится; находка гейта people_address_writers называет письмо прежнему адресу (Р13)'
  D13: 'ответ глагола не зависит от доставки; решение на письмо — ALLOW · NOT_YET_GRANTED · REVOKED; тревога возраста строки (Р14)'
  D14: 'почта поставщика снимается из дерева прямым переключением: kratos.courier.enabled false, страж листа под courier, предикат единственного держателя секрета в трёх формах ссылки, приёмник стенда читает только notify (Р15, Р19, §0)'
  D15: 'перепись файлов §3а (49 в kacho) и §3б (94 в kaname) перемеряется на базе старта; снимаемые пробы уходят вместе с предметом (§3а, §3б, DoD 16–18)'

items:
  - id: CX2-01
    decision: D4
    class: "code-authoring §«Умолчание, которое становится утверждением» (sentinel-коллизия: «не задано» и false); architecture.md §«Конфигурация, впервые ставшая ЧИТАЕМОЙ, перебивает умолчание поставщика»"
    exposure: >-
      Флаг трёхзначен (не задан · true · false), а оба носителя схлопывают «не задан» в false: нулевое
      значение bool у загрузчика kaname и шаблонные `default`/`if` у Helm, для которых false пуст.
      Переопределение модулем, выведенное через `default`/`or`, молча теряет «модуль false при
      глобальном true» и «модуль true при глобальном false».
    condition: >-
      (а) загрузчик kaname судит наличие ключа (IsSet), а не значение; поле флага не имеет
      представления «false по умолчанию»; (б) в зонтике флаг и его переопределение выводятся через
      проверку наличия ключа (hasKey), ни `default`, ни `or`, ни `if` по значению флага не применяются;
      (в) перечень источников notify и значение kaname вычисляются ОДНИМ помощником шаблона.
    held_by: >-
      покраснеют NTF2-50 (не задан — отказ), NTF2-53 (а, б, в). Вариант «глобальный false, модуль true»
      не утверждает ни один сценарий — нужна проба рендера на этот вариант (заказ).
  - id: CX2-02
    decision: D4
    class: "code-authoring §«Решение и его следствие разнесены» (одно решение — четыре следствия); security.md sec-one-predicate-three-readers"
    exposure: >-
      У флага четыре следствия в разных местах: постановка строк (в т.ч. из писателя аудита), отказ
      четырёх глаголов, регистрация сервера ленты, метрика. Решение «ставить ли строку», принятое у
      каждого места вызова, расходится при первом новом шаблоне — строка появится при выключенном флаге.
    condition: >-
      (а) значение флага читается один раз в композиционном корне и передаётся; (б) решение «ставить
      строку или нет» принимает функция постановки ленты (одно место), а не места вызова; (в) проверка
      флага в recovery, register, users:invite, verify-email стоит до любого чтения по адресу (после
      правил пароля у register — Р9), так что ответ и путь исполнения не зависят от адреса.
    held_by: "покраснеют NTF2-51 (пары (а)=(б), (в)=(ж), (г)=(з), порядок (е)), NTF2-52 (строк 0 при исполненных глаголах класса S, UNIMPLEMENTED, метрика 0)"
  - id: CX2-03
    decision: D2
    class: "api-conventions.md §«Принято-и-проигнорировано — ЗАПРЕЩЕНО»; code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей)"
    exposure: >-
      NTF2-48 требует отказа старта на снятом ключе как неизвестном. Замер: загрузчик kaname сегодня
      декодирует конфигурацию без отказа на неиспользованных ключах, то есть неизвестный ключ файла
      принимается молча; ключи, приходящие переменной окружения с префиксом KANAME_, до декодера вовсе
      не доходят. Включение строгости меняет поведение для ВСЕХ ключей всех профилей, а не только снятых.
    condition: >-
      (а) декодер конфигурации kaname отвергает неизвестный ключ файла с его именем; (б) по второй
      поверхности — переменным окружения с префиксом — принято явное решение: отвергать переменную, не
      отображаемую ни в один известный ключ, либо записать, что поверхность — только файл, и снять
      KANAME_INVITE_MAIL_* из обеих поставок тем же изменением; (в) до включения строгости перемерены
      значения каждого профиля обеих поставок kaname — ключ без читателя снимается тем же изменением.
    held_by: "покраснеет NTF2-48 (а–г) — только поверхность файла; поверхность окружения держится вниманием — заказ пробы (переменная KANAME_INVITE_MAIL_RELAY → отказ старта либо записанное решение)"
  - id: CX2-04
    decision: D2
    class: "code-authoring §«Порядок операций внутри кода» (порядок снятия ресурса: производители первыми, объявление последним)"
    exposure: "снимаются очередь, её дренаж, отправитель, метрики и гейт MAIL-47; обратный порядок оставляет живую запись в снятую таблицу либо окно, в котором запрета SMTP не держит никто"
    condition: >-
      (а) в одном изменении: места постановки в очередь → проводка дренажа и отправителя → новая
      миграция снятия таблицы (применённые не правятся) и запись в retired.json → метрики; (б) гейт
      NTF2-44 заводится тем же коммитом, что снимает MAIL-47, — окна без запрета SMTP нет; (в) утверждение
      «таблицы очереди нет» идёт в паре с живым контролем «таблица ленты есть».
    held_by: "покраснеют NTF2-44 (импорты, граф ./cmd/kaname, миграции с парой ленты), NTF2-45; DoD 17 (предикат остатка)"
  - id: CX2-05
    decision: D10
    class: "code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей); measurement-discipline §«Радиус: по имени механизма и по точкам применения»"
    exposure: >-
      Р3 и DoD 11 называют «писатель аудита», ставящий строки по карте. Замер: форм записи в
      kaname.audit_outbox в не-тестовом Go вне миграций — 5 (общая функция insertAuditEventTx и четыре
      отдельных INSERT: в репозитории привязок, в репозитории отзыва сессий, в адаптере сверки и в
      посеве администратора). Карта, подключённая к одной форме, молча пропустит виды, пишущиеся другими.
    condition: >-
      (а) каждая форма записи audit_outbox проходит через одну точку, консультирующую карту, — формы
      сведены к общей функции либо каждая зовёт её; (б) по посеву администратора облака решение
      записано (письмо на посевную выдачу ставится или нет — и почему); (в) вид из карты, пишущийся
      формой в обход точки, — красный.
    held_by: >-
      NTF2-90 ловит пропуск только для видов и форм, которые исполняет её таблица; вид, пишущийся двумя
      формами, исполняется одной. Нужен гейт дерева «каждая запись в audit_outbox идёт через точку
      карты» с печатью числа форм — заказ.
  - id: CX2-06
    decision: D10
    class: "data-integrity.md db-unique (идемпотентность на DB-уровне, ban #10); code-authoring §«Решение и его следствие разнесены»"
    exposure: "ключ идемпотентности (событие, шаблон, адресат) проверкой перед вставкой даёт две строки под гонкой; ошибка уникальности на вставке ленты роняет ВСЮ транзакцию события — глагол класса S отказывает из-за письма"
    condition: >-
      (а) UNIQUE (audit_event_id, template, recipient) в схеме ленты kaname; (б) вставка с ON CONFLICT DO
      NOTHING на этом ключе — конфликт не превращается в ошибку транзакции события; (в) строка ленты
      пишется в транзакции события, а не дренажом аудита (иначе NTF2-97 (б) проходит на неверной
      реализации случайно либо даёт дубль).
    held_by: "покраснеет NTF2-97 (а, б); вторая половина (б) — вниманием рецензента схемы"
  - id: CX2-07
    decision: D10
    class: "code-authoring §«Решение и его следствие разнесены» (снимок адресатов в транзакции события); security-hardening.md §«Авторизация живёт в МОДЕЛИ»"
    exposure: >-
      Адресаты «владельцы аккаунта» и «администраторы облака» разрешаются снимком в транзакции события.
      Замер: выдачи администратора облака (cluster_admin_grants) и владелец аккаунта (owner_user_id)
      лежат в базе kaname — снимок в транзакции исполним. Чтение их через модель прав вне транзакции
      сделало бы снимок неснимком.
    condition: >-
      (а) множества адресатов читаются из таблиц kaname в той же транзакции, что строка аудита; (б)
      источник «владельцев аккаунта» назван в замысле одним определением (колонка владельца либо
      привязки роли владельца) и не выводится запросом к модели прав; (в) пустое множество адресатов у
      события перечня — ошибка транзакции с именем вида, а не тихий пропуск.
    held_by: "покраснеют NTF2-90 (строка account.deleted, cluster-admin-*, user.blocked), NTF2-93, NTF2-96; (в) — вниманием"
  - id: CX2-08
    decision: D10
    class: "security-hardening.md §«Авторизация живёт в МОДЕЛИ» (hard-no-hand-rolled-authz); security.md sec-forwarder-allowlist-nonempty; security-hardening.md hard-catalog-complete; polyrepo.md §«Runtime cross-domain edges»"
    exposure: "«только service:notify» проще всего написать сравнением имени службы в Go; пустой перечень вызывающих читается как «все»; внутренние методы без записи каталога — отказ всем, включая notify"
    condition: >-
      (а) право на справочник адресов и разрешение адресатов — запись каталога и отношение модели для
      служебного принципала, а не сравнение строки; (б) перечень методов служебного принципала закрыт и
      непуст, пустой — отказ старта; (в) методы в Internal*-службе на внутреннем слушателе с записями
      каталога; (г) отказ побайтово одинаков у трёх методов и не несёт адреса; (д) ребро notify→kaname
      записано с доводом ацикличности (kaname не зовёт notify).
    held_by: "покраснеют NTF2-88 (а–в) с близнецом notify, TestCatalogReachability_EveryRowResolvesToAServedMethod, assert-ban6-external-isolation.py; (а) — вниманием (гейта «нет самодельной проверки» нет)"
  - id: CX2-09
    decision: D1
    class: "polyrepo.md warning «Ключ домена и имя каталога — РАЗНЫЕ словари» (poly-two-dictionaries); subscription.md sub-two-dictionaries"
    exposure: >-
      Приёмка называет источник «kaname» (notification_namespace:kaname, notification_feed:kaname,
      service:kaname, kaname.notifications.enabled). Замер: в словаре подписки и внутренних адресов края
      kaname зовётся доменом «iam» (ключи iam/iamInternal, имена SUBSCRIPTION_OWNERS). Перечень
      источников notify, выведенный из ключей чарта, и владелец подписки, к которому notify дозванивается,
      — два словаря об одном предмете.
    condition: >-
      (а) переход «ключ модуля в чарте → домен подписки → пространство ленты» — одно явное отображение,
      исчерпывающее по источникам; вывод одного имени из написания другого запрещён; (б) имя вне
      отображения — отказ старта notify с именем, а не «источник не найден» на пути.
    held_by: "NTF2-53 считает записи перечня, но не их отображение в домен; нужен гейт отображения (инъекция: запись kaname→kaname вместо kaname→iam) — заказ; дом отображения — NTF-1 (перечень источников notify)"
  - id: CX2-10
