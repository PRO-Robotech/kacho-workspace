decisions_of_lanes:
  lane_36_replay_is_the_operation_answer: >-
    НЕ ослаблено, усилено. markReplayedFamily (notes.go:237-249) ставит точный
    случай операции тем же правилом «первый побеждает», что и record; снятые
    вызовы record(ours) шли сразу за ним с тем же ours. Единственное расхождение
    — пустой grantID (пометка молчит целиком) — на обоих местах недостижимо:
    GetAuthorizeCodeSession отвергает погашенный код без гранта раньше
    (bridge.go:431-433; replayedCode зовётся только с bridge.go:435),
    GetRefreshTokenSession — обёрнутый токен без гранта (bridge.go:618-621).
    Отказ справочника при сборке (grantClient, bridge.go:265) записывается
    ПОСЛЕ пометки и повтора не вытесняет. Комментарии, называющие
    markReplayedFamily единственным местом (bridge.go:452-457, 600-608;
    notes.go:227-236; translate.go:389-392), правдивы. Инъекция inj_A
    доказывает, что до #63 два места прятали друг друга (см. experiments).
  lane_37_closed_port_refusal_classification: >-
    НЕ ослаблено. Прод-классификация отказов портов в дельте не тронута
    (verifyClientSecret, closedPortFailure, fromPort — вне диффа). В подставке
    VerifyClientSecret вердикт считает secretVerdict под тем же m.mu, ветка
    verifyOverride сохранена; журнал сверок теперь несёт вердикт. Нулевое
    значение — SecretVerdictUnspecified (ports.go:547), не SecretMatched,
    поэтому неназванный вердикт предпосылку requireAuthenticatedBy не
    выполняет. Второй клиент теперь известен порту сверки, и проба повтора на
    пути кода доходит до выборки кода, а не судит invalid_client. Радиус: в
    пробах oauthceremony второго клиента заводят ровно два места, оба через
    registerClientLike (ceremony_test.go:121); прочие правки store.clients —
    по testClientID; ceremony_test.go:602 — намеренно незаведённый клиент.
  lane_39_ceilings_and_record_retention: >-
    НЕ ослаблено. Код потолков (tokenpolicy, validateConfig) вне дельты.
    Старение записи кода: прежние формы отказа сохранены — неэкспортированное
    поле с мгновением и ключ карты с мгновением отказывают и называют место
    (TestAgedCopyRefusesAFormItCannotShift); сверка сдвига написана отдельным
    обходом (instantsOf), не судит сдвиг им же самим; значения под `any` теперь
    стареют по самому значению — шире прежнего обхода типа. Слепые формы
    новой подставки те же, что у прежней (см. I-1). Инъекция inj_C: пропуск
    Session.AuthTime краснит предпосылку пробы записи с текстом, называющим поле.

