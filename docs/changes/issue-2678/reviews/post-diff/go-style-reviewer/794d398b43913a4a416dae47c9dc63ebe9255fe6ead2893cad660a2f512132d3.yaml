      finding: >-
        «замерено прямым вызовом по каждому из восьми написаний» стоит сразу после
        перечня, в котором написаний СЕМЬ («0», «00», «0000», «+0», «-0», « 0»,
        «0x0»). Восьмое («9090») названо в шапке у определения (nlb
        describe_test.go:150, storage describe_test.go:142), и счёт сходится только
        при чтении обоих файлов; дальше на нём держится «Девятое написание —
