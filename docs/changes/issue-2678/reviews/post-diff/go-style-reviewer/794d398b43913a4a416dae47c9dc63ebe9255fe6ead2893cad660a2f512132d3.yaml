  - id: 3
    q: соответствуют ли пометки достижимости поведению валидации
    verdict: СООТВЕТСТВУЮТ обе
    how: >-
      `{"tcp://0.0.0.0:", false, "ДОСТИЖИМО конфигурацией: Validate пропускает…"}`
      — достижимость доказана сквозным `Load` (см. п. 1): значение доезжает до
      `cfg.APIServer.Endpoint` дословно, страж отвечает «нет». Формулировка «для
      стража это НЕЗАДАННАЯ ручка» — ровно то, что делает код.
      `{"", false, "граница предиката: конфигурацией недостижимо — Validate
      отвергает пустой эндпойнт"}` — недостижимость доказана с ДВУХ сторон
      доставки: переменная (явно пустая → умолчание) и файл (пустая строка →
      отказ `Load`). Страж читает конфигурацию, собранную только `config.Load`
      (`bootConfig` это и объявляет), поэтому "" ему предъявить нечем — строка и
      правда граница предиката, а не достижимый вход.
      Порядок тоже сошёлся с текстом шапки: «первым в таблице расхождений стоит
      именно это написание» — `tcp://0.0.0.0:` на строке 66, "" на строке 67.
  - id: 4
    q: верен ли ОСТАВЛЕННЫЙ довод storage (файл не тронут — значит, утверждается заново)
    verdict: ВЕРЕН — перемерен мной отдельно, а не принят по прошлой записи
    how: >-
      Настоящий пакет services/storage/internal/config, тем же наложением:
        · `KACHO_STORAGE_GRPC_PORT` НЕ задана → GrpcPort "9090" (умолчание);
        · задана ЯВНО ПУСТОЙ                  → GrpcPort "" (умолчание НЕ получено);
        · задана "0"                          → GrpcPort "0".
      То есть у storage «явно пустая переменная умолчания не получает» — правда,
      и пустая конфигурация там действительно достижима. Решение НЕ править файл
      storage верно: довод принадлежит своему загрузчику (envconfig), и перенос
      его к nlb (viper) как раз и был прошлой блокирующей находкой.
  - id: 5
    q: держится ли таблица написаний на этом отпечатке
    verdict: держится, перемерена заново прямым вызовом
    how: >-
      Для каждого написания — `net.Listen("tcp", "127.0.0.1:"+p)` и `strconv.Atoi`:
      «0», «00», «0000», «+0», «-0» — слушатель поднимается (порты 46591, 35865,
      43309, 32773, 44269), распознаватель true; « 0» и «0x0» — слушатель
      ОТКАЗЫВАЕТ, распознаватель false; «9090»/«9091» поднимаются, распознаватель
      false (предмет запрета); "" — слушатель поднимается, распознаватель false
      (намеренное расхождение). Отдельно: `net.Listen("tcp","0.0.0.0")` —
      `missing port in address`, то есть строка 60 («двоеточия нет вовсе … здесь
      согласие») верна; `net.Listen("tcp",":")`, `("tcp","")` и `("tcp","0.0.0.0:")`
      — поднимаются на эфемерном, то есть оба «расхождения» несут верный факт.
  - id: 6
    q: держится ли ДОБАВЛЕННОЕ этим диффом утверждение о форме имени ручки
    verdict: держится — проверено, потому что помечено «Замерено»
    how: >-
      config.go:12-16 (добавленные строки) утверждают: viper заменяет только точку,
      дефис доезжает как есть, форма с подчёркиванием не читается ничем — «замерено
