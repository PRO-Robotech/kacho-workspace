      обоим названным ключам, с контролем:
        · `KACHO_NLB_API_SERVER__ENDPOINT=tcp://127.0.0.1:1` → endpoint остался
          умолчанием "tcp://0.0.0.0:9090"; `KACHO_NLB_API-SERVER__ENDPOINT=…:2` →
          endpoint "tcp://127.0.0.1:2";
        · `KACHO_NLB_FGA__REGISTER_DRAINER__ENABLE=false` → enable остался true
          (умолчание `SetDefault(…, true)`, defaults.go:156);
          `KACHO_NLB_FGA__REGISTER-DRAINER__ENABLE=false` → enable false.
      Контроль подобран так, чтобы значение ОТЛИЧАЛОСЬ от умолчания: первый заход
      с «true» не различал бы формы вовсе и зеленел бы на обеих.

