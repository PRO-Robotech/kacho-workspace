measurements:
  - id: 1
    q: верен ли НОВЫЙ довод о достижимости у nlb
    verdict: ВЕРЕН — перемерено мной, со слов не принято
    how: >-
      Композиция загрузчика воспроизведена НЕ копией: настоящий пакет
      services/nlb/internal/apps/kacho/config собран `go test -overlay=…` —
      пробный файл подан сборщику наложением, дерево не тронуто
      (`git status --porcelain` == 0 строк до и после каждого прогона).
      Контроль в обе стороны, четыре входа:
        · переменная НЕ задана                      → endpoint "tcp://0.0.0.0:9090"
        · `KACHO_NLB_API-SERVER__ENDPOINT=""` ЯВНО  → endpoint "tcp://0.0.0.0:9090"
        · `…=tcp://0.0.0.0:`                        → endpoint "tcp://0.0.0.0:"
        · `…=tcp://0.0.0.0:0`                       → endpoint "tcp://0.0.0.0:0"
      Первые две строки — ровно то, что утверждает новый комментарий (строки 28-29):
      явно пустая переменная у nlb умолчание ПОЛУЧАЕТ, то есть прежний (перенесённый
      от storage) довод опровергнут, и опровергнут именно так, как написано.
      Настоящая `validateEndpoint` того же пакета, вызванная напрямую:
        · ""                → `api-server.endpoint: required`
        · "   "             → то же (TrimSpace)
        · "tcp://0.0.0.0:"  → nil
        · "tcp://0.0.0.0:0" → nil
        · "tcp://0.0.0.0"   → `"tcp://0.0.0.0" missing :port`
      И — сильнее комментария — СКВОЗЬ полный `config.Load("")` в пакете
      services/nlb/cmd/kacho-loadbalancer, на том же наборе ручек, что у `bootConfig`:
        · endpoint "tcp://127.0.0.1:" → Load ОК, endpoint доезжает дословно,
          endpointIsKernelAssigned == false;
        · endpoint ""                 → Load ОК, endpoint == "tcp://0.0.0.0:9090";
        · endpoint "tcp://127.0.0.1:0"→ Load ОК, endpointIsKernelAssigned == true.
      Второй маршрут к пустому эндпойнту закрыт отдельно: файл конфигурации с
      `api-server.endpoint: ""` — `Load` ОТКАЗЫВАЕТ: `validate config:
      api-server.endpoint: required`. То есть пустой эндпойнт недостижим ОБОИМИ
      путями доставки, а не только переменной окружения.
      Пометка «(замерено: `Validate` возвращает nil)» стоит правомерно: nil
      возвращает не только helper, но и полный `Config.Validate` внутри `Load`.
