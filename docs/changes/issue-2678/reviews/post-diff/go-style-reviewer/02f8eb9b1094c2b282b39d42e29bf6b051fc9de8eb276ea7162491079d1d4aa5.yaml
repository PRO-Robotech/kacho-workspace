# ── находки ────────────────────────────────────────────────────────────────
findings:
  critical:
    - class: FALSE-MEASUREMENT / DOC-vs-CODE
      coord: services/nlb/cmd/kacho-loadbalancer/ephemeralport_test.go:24-25
      added_by: b3d1f75dbc0
      in_diff: true
      finding: >-
        Добавленная строка объявляет ЗАМЕРЕННЫМ то, что замер опровергает:
        «Достижимо это продуктовым путём — явно пустая переменная умолчания не
        получает (замерено)». Для nlb это неверно по обоим механизмам.
        (1) Загрузчик nlb — viper v1.21.0 (пин go.mod:135), композиция load.go:65-68
        (SetEnvPrefix / SetEnvKeyReplacer / AutomaticEnv). `AllowEmptyEnv` в дереве
        не зовётся НИ РАЗУ (`git grep AllowEmptyEnv` — 0), а viper.getEnv
        (viper.go:442-450 в пине) возвращает ok только при `allowEmptyEnv || val != ""`.
        Воспроизведено мной на той же композиции с контролем в обе стороны:
        ЯВНО ПУСТАЯ переменная → "tcp://0.0.0.0:9090" (умолчание!); контроль
        непустой → "tcp://0.0.0.0:0" доезжает; контроль незаданной → умолчание.
        То есть в nlb явно пустая переменная умолчание КАК РАЗ ПОЛУЧАЕТ.
        (2) Даже если бы не получала — `validateEndpoint` (validate.go:438-441)
        отвергает пустой эндпойнт: проверено на дословной копии функции,
        "" → `api-server.endpoint: required`. Значит `config.Load` в nlb пустой
        эндпойнт не отдаёт НИКОГДА, и строка таблицы `{""…}` описывает вход,
        которого продуктовый путь не производит.
        Откуда взялась строка: она верна для СОСЕДНЕЙ службы. storage грузится
        envconfig v1.4.0 (go.mod:130), и там явно пустая переменная умолчания
        действительно не получает — перемерено на том же пине: пустая → "",
        контроль незаданной → "9090"; адрес собирается склейкой `":" + порт`
        (services/storage/cmd/storage/serve.go:717-718). Довод storage перенесён в
        файл nlb, где ручка — целый эндпойнт, а загрузчик ведёт себя обратно.
      requirement: >-
        В файле nlb назвать ДОСТИЖИМЫЙ маршрут и только его. Достижим ровно один:
        `tcp://0.0.0.0:` — непустое значение с пустым портом; `validateEndpoint`
        его ПРОПУСКАЕТ (перемерено: "tcp://0.0.0.0:" → nil), а слушатель на нём
        поднимается эфемерным. Предложение про «явно пустую переменную» из файла
        nlb убрать либо заменить на то, что делает загрузчик nlb (пустая
        переменная → умолчание; пустой эндпойнт → отказ Validate). Пометка
        «(замерено)» вправе стоять только рядом с тем, что замерено для ЭТОЙ службы.
        В файле storage то же предложение верно и правки не требует.
      why_blocking: >-
        Предмет круга — «заголовок сужен до доказанного». Этот довод и есть то,
        на чём держится объявленное исключение: он отвечает на вопрос, почему
        расхождение названо намеренным, а не теоретическим. Он помечен
        «(замерено)» и замером опровергается — ровно тот класс, который коммит
        объявил снятым (arch-doc-truthfulness: «описывает реальность кода, а не
        намерение»). Утверждение о продуктовом пути шире и прямее замера.

    - class: HALF-APPLIED-FIX / DOC-vs-CODE
      coord: >-
        services/nlb/cmd/kacho-loadbalancer/describe_test.go:126 и
        services/storage/cmd/storage/describe_test.go:128
      added_by: f9dc93b3b79 (обе строки — ДОБАВЛЕННЫЕ строки этого же диффа)
      in_diff: true
      finding: >-
        Дифф, взятый целиком, утверждает об одном предмете и P, и НЕ-P.
        b3d1f75dbc0 снял заголовок «Распознаватель эфемерного порта знает ВСЕ
        законные написания своего предмета» из обеих проб и прямо назвал его
        неправдой: ephemeralport_test.go:9-11 — «сказать „знает ВСЕ законные
        написания“ было бы неправдой, а неправда в заголовке пробы дороже пропуска».
        Но та же фраза стоит ещё в двух местах, и оба — добавленные строки этого
        диффа (перемерено: `git diff origin/main...HEAD` несёт их со знаком «+»):
        «Распознаватель обязан знать ВСЕ законные написания своего предмета» —
        в шапке САМОГО определения распознавателя, в обеих службах.
        Это не копия фразы в прозе: читатель `endpointIsKernelAssigned` /
        `portIsKernelAssigned` приходит первым делом сюда, и здесь ему объявлена
        норма, которую код нарушает НАМЕРЕННО (пустой адрес — законное написание,
        на нём ядро выдаёт эфемерный порт, перемерено; распознаватель отвечает
        «нет»). Правка приложена к файлам, в которых дефект заметили, а не к
        механизму по имени (measurement-discipline §«Радиус»); радиус искался мной
        по имени — `git grep "ВСЕ законные написания"` даёт 3 попадания, из них
        1 — снятие, 2 — живое утверждение.
      requirement: >-
        Привести обе шапки определения к той же мере, что и заголовки проб:
        «знает все ЧИСЛОВЫЕ написания … и РАСХОДИТСЯ на пустом намеренно», либо
        сослаться на разбор в ephemeralport_test.go и не заводить второго
        утверждения. Оба файла — в диффе, правятся тем же изменением.
      why_blocking: >-
        Норма «обязан знать ВСЕ законные написания» в шапке распознавателя —
        то же утверждение шире замера, что круг и снимал, и оно стоит ближе к коду,
        чем снятое. Два места об одном предмете, из которых верно одно, стареют в
        сторону неверного: следующий, кто расширит распознаватель «по норме из
        шапки», уберёт намеренное расхождение, о котором шапка молчит.

  important:
    - class: PRECISION
      coord: >-
        services/nlb/cmd/kacho-loadbalancer/ephemeralport_test.go:16-17 и
        services/storage/cmd/storage/ephemeralport_test.go:11-12
      finding: >-
        «замерено прямым вызовом по каждому из восьми написаний» стоит сразу
        после перечня, в котором написаний СЕМЬ (`0`, `00`, `0000`, `+0`, `-0`,
        ` 0`, `0x0`). Восьмое («9090») живёт в перечне у определения
        (nlb describe_test.go:143, storage describe_test.go:135), и счёт сходится
