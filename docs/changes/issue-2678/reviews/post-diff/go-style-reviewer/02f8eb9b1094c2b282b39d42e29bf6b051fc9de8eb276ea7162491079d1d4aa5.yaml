        написание — ПУСТОЕ»: у storage восьмого написания нет нигде в файле, и
        «девятое» там повисает.
      requirement: >-
        Либо дописать восьмое в перечень, либо назвать число по своему перечню
        («по каждому из семи») и переименовать «девятое» соответственно.
      why_not_blocking: >-
        Счёт не расширяет утверждения: множество из восьми названо в соседней
        шапке того же пакета, и на всех восьми совпадение области приёма
        перемерено мной заново (`0`,`00`,`0000`,`+0`,`-0` — принимают оба;
        ` 0`,`0x0` — отвергают оба; `9090` — разбирают оба).

  style:
    - coord: >-
        services/nlb/cmd/kacho-loadbalancer/describe_test.go:146 и
        services/storage/cmd/storage/describe_test.go:138
      finding: >-
        `portIsKernelAssigned` по-прежнему живёт двумя копиями вместе с почти
