critical:
  - id: DEAD-KNOB-IN-THE-SAME-HELPER
    kind: страж поставлен на две ручки из трёх — соседняя того же класса остаётся мёртвой,
          и отрицательный близнец на ней вакуумен
    coordinates:
      - services/nlb/cmd/kacho-loadbalancer/describe_test.go:66
      - services/nlb/cmd/kacho-loadbalancer/describe_test.go:196
      - services/nlb/cmd/kacho-loadbalancer/describe_test.go:243
    measured: >-
      viper v1.21.0, устройство из load.go:66-68, ключ `extapi.iam.internal-addr`
      (defaults.go:87): `KACHO_NLB_EXTAPI__IAM__INTERNAL-ADDR` → доезжает;
      `KACHO_NLB_EXTAPI__IAM__INTERNAL_ADDR` → мимо, величина остаётся "".
      В дереве уже стоят ОБЕ формы: дефисная в config/load_test.go:94,
      подчёркнутая — в правленом диффом describe_test.go.
    consequence: >-
      1) `TestDescribeProbeCanFail` (:191) объявляет «адрес резолвится
      firstNonEmpty(internal, public), и обнулить надо ОБА, иначе проба
      зеленела бы на живом ребре» — но внутренний адрес НИКОГДА не был задан,
      и обнуляется фактически один. Отрицательный близнец судит половину
      предмета.
      2) Пробы носителя, которые страж диффа и удостоверяет
      (`TestCarrierRaisesTheService`, `TestCarrierRaisesNlbWithoutAStartRefusal`),
      идут на конфигурации, где ребро решения о доступе резолвится на ПУБЛИЧНЫЙ
      адрес вместо внутреннего (:9090 вместо :9091) — форма, которой нет ни на
      одной посадке. Это тот самый класс, который шапка `bootConfig` запрещает.
    requirement: >-
      В `services/nlb/cmd/kacho-loadbalancer/describe_test.go` заменить
      `KACHO_NLB_EXTAPI__IAM__INTERNAL_ADDR` на
      `KACHO_NLB_EXTAPI__IAM__INTERNAL-ADDR` в трёх местах (:66, :196, :243) и
      перепрогнать: `TestDescribeProbeCanFail` обязан остаться красным на
      пустых адресах и зелёным на заданных.
    removal_predicate: >-
      Замер перебором имён из `services/nlb/cmd/kacho-loadbalancer/*_test.go`
      по устройству load.go:66-68 даёт «доезжает» для каждого.
    norm: architecture.md §«arch-doc-truthfulness»; testing §«отрицание только в
          паре с положительным»; security-hardening §«hard-parts-must-converge»

  - id: RETRACTED-CAUSE-SURVIVES-IN-THE-NEIGHBOURING-DOC
    kind: два утверждения об одном предмете в одном файле, одно из них диффом
          объявлено ложным
    coordinates:
      - tools/declaredbreak/declaredbreak.go:221-224   # прежнее: «Наблюдалось вживую: buf breaking из корня…»
      - tools/declaredbreak/declaredbreak.go:388-392   # новое: «догадка… добросовестная, правдоподобная и НЕВЕРНАЯ»
    consequence: >-
      Отказ гейта теперь честно молчит о причине, а читатель, открывший код
      следом (именно он и есть адресат «Причину гейт не называет… сверьте обе
      величины сами»), получает ту же снятую догадку в шапке `Incoherent()` —
      и уходит чинить форму путей. Ущерб, ради снятия которого сделан #2594,
      воспроизводится на один шаг дальше.
    requirement: >-
      Привести шапку `Incoherent()` в соответствие с шапкой `IncoherentReport()`:
      либо снять «Наблюдалось вживую: `buf breaking` из корня репозитория…»,
      либо назвать, каким замером она держится, рядом с утверждением
      IncoherentReport'а «прогонщик зовёт `buf` именно изнутри каталога».
      Утверждение о предмете живёт в одном месте.
    norm: architecture.md §«arch-doc-truthfulness»; doc-truthfulness
          §«два места об одном предмете, где одно верно»

important:
  - id: GUARD-LANES-DECLARE-DIFFERENT-THINGS
    coordinates:
      - services/nlb/cmd/kacho-loadbalancer/describe_test.go:103-116
      - services/storage/cmd/storage/describe_test.go:112-120
    text: >-
      Две полосы одного механизма («страж предусловия проб носителя») называют
      в отказе РАЗНОЕ: nlb — ключ конфигурации (`api-server.endpoint`) с явным
      доводом «имя переменной — способ доставки»; storage — имя переменной
      окружения (`KACHO_STORAGE_GRPC_PORT`). Ни один из двух не неверен, но
      решения этого никто не принимал, и читатель отказа получает разный
      предмет. Плюс у storage имя ручки — литерал рядом с полем конфигурации:
      сменится тег `envconfig`, и сообщение солжёт, ничего не уронив.
    norm: architecture.md §«arch-lanes-compare-norm»
  - id: BOTH-SIDES-PROMISED-ONE-MAY-BE-PRINTED
    coordinates:
      - tools/declaredbreak/declaredbreak.go:408
    text: >-
      Строка «Вот по одному образцу с каждой стороны:» печатается безусловно, а
      оба образца — под `len(...) > 0`. `Incoherent()` (:235) требует
      `Matched == 0` и `len(Expired) == DeclarationsRead`, но не требует
      непустого `Undeclared`: находки могут целиком уйти в `SymbolMismatch`
      либо `Invalid`. Тогда заголовок обещает две стороны, а напечатана одна.
      Паники нет (границы проверены), но отказ обещает больше, чем даёт.
    norm: architecture.md §«arch-doc-truthfulness»
  - id: SPLITHOSTPORT-ERROR-SWALLOWED
    coordinates:
      - services/nlb/cmd/kacho-loadbalancer/describe_test.go:110-111
    text: >-
      `_, port, err := net.SplitHostPort(...)`; `err` участвует в условии, но в
      текст отказа не попадает. «Это не порт, назначенный ядром» одинаково
      покрывает «порт 9090» и «эндпоинт вообще не разобрался» — два разных
      дефекта под одним текстом.

style:
