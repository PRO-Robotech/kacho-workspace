# ── названные границы ──────────────────────────────────────────────────────
# Не находки продукта и не блокеры — свойства самой работы-проверки, измеренные и
# названные, чтобы не держаться вниманием.
named_borders:
  - id: 1
    title: чем СЕГОДНЯ держится способность стража эфемерных портов упасть
    asked_by: landing-reviewer
    their_reading: >-
      «только чтением кода, без инъекции, которая вернула бы дефектное имя ручки
      и потребовала красного»
    my_measurement: ПОДТВЕРЖДЕНО, и точнее, чем было прочитано.
    detail: >-
      Развести надо ДВА предмета, и держатся они по-разному.
      (а) РАСПОЗНАВАТЕЛЬ (endpointIsKernelAssigned / portIsKernelAssigned)
      держится АРТЕФАКТОМ: ephemeralport_test.go зовёт его напрямую таблицей из
      13 и 11 строк, утверждения двусторонние, и я перемерил эту таблицу против
      настоящего net.Listen (опыты 2, 3) — сходится, расхождения объявлены.
      (б) СТРАЖ НА МЕСТЕ (requireEphemeralListeners, вызванный до носителя на
      конфигурации, собранной подстановкой окружения) не держится НИЧЕМ.
      Перемерено: все три вызова положительные, ни одна проба не подаёт ему
      дефектного имени (опыт 17); снятие стража — молчаливое зелёное в обеих
      службах (опыты 7, 8); Go-доказательств инъекцией в дереве 350, в предмете
      этого изменения 0 (опыт 17).
      Цена названа числом, а не опасением: при снятом страже САМ дефект #2678
      не даёт ни одного красного, пока 9090/9091 свободны (опыт 9, RC=0 при
      измеренно свободных портах). То есть страж — единственное, что превращает
      «ручка не доехала» в красное, и его присутствие не заперто ничем.
    what_is_NOT_true: >-
      Опровергнуто при этом вот что: сама способность стража упасть под сомнение
      не ставится — она ПЕРЕМЕРЕНА (опыты 4, 5). Страж краснеет от одно-фактного
      дефекта, роняет ровно свою пробу и называет ручку и величину. Прочтением
      держится не «работает ли он», а «стоит ли он на месте завтра».
    asymmetry_worth_naming: >-
      Оболочечная половина ТОГО ЖЕ изменения свою способность краснеть заперла:
      три раздельные инъекции дефекта, у каждой объявлена норма «≥1 провал», на
      невоссоздаваемом дефекте — отказ (опыт 15), и гарнитура запускается
      scripts/ci-local.sh:423 (опыт 18). Go-половина той же нормы не несёт.
    remedy_if_taken_up: >-
      Проба рядом со стражем, подающая ему дефектное имя ручки и требующая
      отказа с координатой, — ровно та форма, которая в дереве живёт 350 раз.
      Не чинится этой ролью: приёмщик возвращает опыт, а не дописывает чужую
      проверку.
    blocking: false
    why_not_blocking: >-
      Изменение вводит страж там, где раньше не было ничего, и ни одного ЛОЖНОГО
      утверждения о нём не делает: шапка carrier_start_test.go говорит «что оно
      доехало, утверждает страж предусловия, а не комментарий», и это ИСТИНА —
      перемерено опытами 4 и 5. Недостающее — регрессионный замок на свойстве,
      которое сегодня верно и проверено ОПЫТОМ, а не чтением.

  - id: 2
    title: обе таблицы написаний дают зелёное на пустом корпусе
    my_measurement: >-
      Опустошение таблицы до нуля строк оставляет пробу зелёной в обеих службах
      (опыт 16, RC=0 дважды). Переписи осмотренного проба не печатает, непустоты
      корпуса не требует.
    blocking: false
    why_not_blocking: >-
      Корпус здесь — ЛИТЕРАЛ в том же файле, что и утверждение, которое он
      обслуживает; он не выводится обходом и не может опустеть молча: опустошить
      его — та же правка, что снять пробу. Класс
      «positive-control-needs-nonempty» заведён против корпуса, ОТКРЫВАЕМОГО
      обходом, и на литерал в одном файле с заголовком переносится не целиком.
      Названо, потому что дешёвая перепись («написаний осмотрено N») отличила бы
      «ноль расхождений» от «ноль осмотренного» и здесь.

