      ЗЕЛЁНОГО НЕТ. RC=1, число объявлено третьей категорией «н/д» (а не нулём
      провалов) и напечатан ОТКАЗ: «дефект области сборщика не воссоздан — форма
      обхода в хуке изменилась». Гарнитура судит СВОЮ предпосылку и закрывается
      в безопасную сторону.

  - n: 16
    kind: пустой обход (Go)
    what: таблица написаний опустошена до нуля строк — предмета нет вовсе
    command: >-
      удаление всех строк таблицы в ephemeralport_test.go (обе службы);
      go test -count=1 -run TestEndpointKernelAssigned…/TestPortKernelAssigned…
    outcome: >-
      ЗЕЛЁНОЕ, RC=0 в ОБЕИХ службах. «Ноль расхождений» на пустой таблице
      неотличимо от «ноль осмотренных написаний»: переписи проба не печатает и
      непустоты корпуса не требует. Граница названа ниже.

  - n: 17
    kind: перепись — чем держится способность стража упасть
    what: доказательства инъекцией в дереве, по обеим живым формам
    command: >-
      git ls-files '*_injection_test.go' | wc -l;
      git ls-files 'services/nlb/cmd/*_injection_test.go' 'services/storage/cmd/*_injection_test.go' | wc -l;
      git ls-files '*-inject.sh' '*_inject.sh' | wc -l;
      git grep -n requireEphemeralListeners -- services/
    outcome: >-
      350 Go-доказательств инъекцией по дереву (единица: файл, ревизия
      b3d1f75dbc0) и 0 из них в services/nlb/cmd/** или services/storage/cmd/**.
      34 доказательства отдельным файлом, из них про хук отправки — 2.
      Вызовов стража три (nlb carrier_start_test.go:60, nlb describe_test.go:331,
      storage carrier_start_test.go:58), и ВСЕ ТРИ положительные: ни одна проба
      в дереве не подаёт стражу дефектного имени и не требует от него красного.

  - n: 18
    kind: держатель гарнитуры хука
    what: кто её запускает
    command: git grep -n prepush-range-inject -- .
    outcome: >-
      scripts/ci-local.sh:423 — `run "hooks: база диапазона"`, то есть группа
      локального прогонщика, и deploy/scripts/run-injection-proofs.sh:131, обход
      которого выводится из `git ls-files` по форме имени. Оболочечная половина
      изменения держится МЕХАНИЗМОМ.

  - n: 19
    kind: слепота подделки, перемеренная на входе
    what: >-
      разбор сводки прогонщика хуком — спрошен НАПРЯМУЮ о входе, а не об исходе
    command: >-
      подача трёх написаний строки итога в предикат хука
      `sed -n 's/.*НЕ выполнено \([0-9]*\).*/\1/p' | tail -1`;
      git show origin/main:scripts/hooks/pre-push; git diff origin/main...HEAD
    outcome: >-
      Текущая форма → «2»; форма со строчным «не выполнено» → ПУСТО; форма со
      словом «пропущено» → ПУСТО. При пустом значении `${skipped:-0}` даёт 0, и
      третья категория исчезает молча.
      ОБЛАСТЬ: строка разбора существует в origin/main (там строка 145) и ЭТИМ
      диффом не тронута — свойство предшествует изменению и в вердикт о нём не
      входит.

