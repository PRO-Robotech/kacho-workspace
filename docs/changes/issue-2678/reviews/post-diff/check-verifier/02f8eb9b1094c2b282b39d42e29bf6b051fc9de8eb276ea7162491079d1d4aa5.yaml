# ── чего подделка не различает ─────────────────────────────────────────────
# Вердикт оболочечной половины дала не живая отправка, а фикстура. Сказано, чего
# она не видит, — отдельно от находок, потому что это свойство инструмента, а не
# дефект работы.
what_the_double_cannot_tell_apart:
  - double: заглушка прогонщика внутри prepush-range-inject.sh
    blind_to: >-
      ДРЕЙФ ФОРМУЛИРОВКИ СВОДКИ у настоящего прогонщика. Строка итога
      `== итог: проверок исполнено %d, отказов %d, НЕ выполнено %d` живёт ДВУМЯ
      копиями — scripts/ci-local.sh:1018 и заглушка (перемерено: ровно 2 файла
      несут литерал, связывающей их проверки в дереве нет). Разойдись формулировка —
      заглушка сохранит старую, гарнитура останется зелёной, а настоящий хук
      перестанет читать третью категорию: предикат на дрейфовавшей строке даёт
      ПУСТО (перемерено, опыт 19), и «НЕ выполнено N» исчезает молча.
      ОБЛАСТЬ: строка разбора предшествует этому диффу (есть в origin/main) —
      свойство названо, но в вердикт об изменении не входит.
  - double: заглушка `gh`, отвечающая кодом 1
    blind_to: >-
      поведение хука при УСПЕШНОМ ответе gh — идущие прогоны, чужая
      аутентификация, сетевая задержка. Детерминизм куплен ценой того, что
      вторая ветка этого вопроса не исполняется ни разу.
  - double: фикстурные репозитории в mktemp -d
    blind_to: >-
      настоящую раскладку этого клона. Сборщик остатков судится на двух
      каталогах, заведённых пробой, а рядом в живом клоне лежат десятки чужих
      рабочих копий — их сохранность перемерена НЕ на них.
      Смягчающее: признак сборщика (приставка + числовой идентификатор +
      живость процесса) от числа соседей не зависит, и дефект расширения
      области фикстура ловит (опыт 11).
  - double: probeExistence{} и пустые peerClients в пробах носителя
    blind_to: >-
      поведение обработчиков и ответы базы. Предмет этих проб — СОСТАВ служимого
      набора, и подделка делегирует перечень пробируемых типов настоящей пробе,
      то есть снисходительнее продукта в этой оси не становится.
      Существа продукта эта запись всё равно не судит.

