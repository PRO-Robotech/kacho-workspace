      outcome: >-
        3 файла, все — `_test.go` двух пакетов предмета:
        services/nlb/cmd/kacho-loadbalancer/describe_test.go,
        services/nlb/cmd/kacho-loadbalancer/ephemeralport_test.go,
        services/storage/cmd/storage/describe_test.go.
        Остальные 11 из 14 файлов изменения кругом не тронуты вовсе.
    - n: 2
      what: 'классификация строк диффа круга (единица: строка `+`/`-` без заголовков)'
      command: >-
        git diff b3d1f75dbc0 02c8b4f6d3f | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)';
        затем grep -cE '^[+-][[:space:]]*//'
      outcome: >-
        всего 53 · комментарных 49 · НЕкомментарных 4.
        Четыре некомментарные — это ДВЕ заменённые строки таблицы (по 2 на
        сторону), и никаких других.
    - n: 3
      what: >-
        не является ли тронутый комментарий ДИРЕКТИВОЙ (единственный класс,
        в котором комментарий Go несёт поведение)
      command: >-
        grep -E '^[+-][[:space:]]*//(go:|nolint|lint:|line| \+build)' по тем же
        53 строкам
      outcome: >-
        0 строк. Ни `//go:build`, ни `//go:generate`, ни `//nolint`, ни `//line`,
        ни `// +build` в круг не попали — снятое и добавленное является прозой
