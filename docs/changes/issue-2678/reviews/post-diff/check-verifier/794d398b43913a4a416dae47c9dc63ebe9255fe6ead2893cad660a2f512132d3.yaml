        services/storage/cmd/storage/describe_test.go — РАЗЛИЧИЙ НЕТ (побайтно);
        services/nlb/cmd/kacho-loadbalancer/ephemeralport_test.go — различия
        РОВНО в двух элементах составного литерала, оба — третье поле строки.
    - n: 5
      what: >-
        вход и ОЖИДАЕМОЕ значение каждой строки таблицы, взятые из РАЗБОРА, а не
