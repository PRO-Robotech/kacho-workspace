prior_findings:
  - id: BASIC-LANE-CUTOFF-READ-UNBOUNDED
    status: closed
    evidence: >-
      у авторитета базового секрета предел теперь подаётся конструктору и
      обязателен (отказ построения при неположительном); каждый из трёх операторов
      идёт под своим context.WithTimeout с defer cancel. Оба вызывающих получают
      одну величину из корня (credentialLanePeerTimeout): глаголы внутреннего
      слушателя через newBasicCredentialAuthority, полоса реестра — обязательным
      полем BuildConfig. Проба сборки идёт через корень, трассирует срок у каждого
      обращения к базе и падает, если вопрос до базы не дошёл; сборка реестра без
      предела отказывает (проба с законным близнецом).
  - id: BASIC-LANE-CUTOFF-REFUSAL-NOT-DISTINGUISHABLE-INSIDE
    status: closed
    evidence: >-
      причина отказа едет внутрь значением-обёрткой из закрытого словаря домена;
      текст ошибки равен тексту единого отказа, errors.Is с отказом-сторожевым
      остаётся истинным, наружу — прежние фиксированные код и текст. Оба глагола
      считают исход по закрытому набору клеток (включая нулевые, «причина не
      названа» и «авторитет не ответил») и пишут структурную запись журнала без
      предъявленной строки и идентификатора; витрина печатает объявленный набор
      клеток. Сравнений отказа через == в дереве нет.
  - id: PRINCIPAL-KIND-OPEN-ELSE
    status: closed
    evidence: >-
      вид принципала судится switch по закрытому словарю; вид вне словаря —
      Undecidable с сторожевой причиной; оба вызывающих обрабатывают Undecidable;
      проба на значение вне словаря есть.
  - id: LONG-COMMENT-LINE
