# местом об одном предмете. Документ назван отпечатком `hashes.acceptance_sha256`
# и ссылкой `links.acceptance`. Записи ревью приёмки лежат по координате
# `links.acceptance_reviews` (docs/specs/reviews/<имя приёмки>/<sha256>.yaml),
# а не в `reviews/acceptance/` пакета, как раскладывает SDD-1 §3: записи
# append-only и цитируются шапкой приёмки, перенос сменил бы её отпечаток.
#
# СОСТОЯНИЕ ISSUE_READY — у отпечатка `hashes.acceptance_sha256` (редакция 18) записи ревью нет.
# Редакция 17 (77ad7465…) одобрена кругом 17 (запись docs/specs/reviews/sub-phase-NTF-4-delivery-feedback-reputation-acceptance/77ad746588a0ee079767d0f5557a20aab7885020872e4465e89ca092cc6689b2.yaml,
# коммит 003cd67b6); первичный разбор классов на неё вернул RA-01, и редакция 18 — ответ на него.
# Одобрение редакции 17 к редакции 18 не переходит: вердикт привязан к отпечатку.
# Замысла (`design.md`) у изменения нет — `hashes.design_sha256: null`.
# Опора на соседние приёмки: NTF-1 — одобренная редакция 13 (05828e42…, коммит 46e2a3819);
# NTF-2 — одобренная редакция 11 (9098d6ef…, коммит 52fed403d); NTF-5 — одобренная редакция 12
# (2fe29c35…, коммит dbcd30a81). Моменты сверки с более поздними одобрениями — приёмка §1,
# «Правило опоры на соседний документ»; исход каждой сверки пишется в этот пакет.
