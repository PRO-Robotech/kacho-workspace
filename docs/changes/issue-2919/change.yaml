# него нет. Маршрут работ — `tasks.md` (проект; TASKS_READY им не объявлено). Сверка соседей в момент
# «перед одобрением замысла» (design.md §0а) дала исход (б) по NTF-1 и NTF-2: приёмке нужна новая
# редакция (design.md §13, Е1). Каталоги `evidence/*` несут отпечаток прежней редакции приёмки
# `97046469` — свидетельства на `cb947e50` не сняты.
# Опора на соседние приёмки (коммит записи — коммит её добавления): NTF-1 — одобренная редакция 13
