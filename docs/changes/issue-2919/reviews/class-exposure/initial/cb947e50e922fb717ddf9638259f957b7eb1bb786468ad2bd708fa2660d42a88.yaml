  # --- новые решения редакций 19–21 ---
  - id: CX4V-51
    decision: [D35, D36]
    class: >-
      code-authoring §«Контракт, который нельзя выразить» (граница «публичный / внутренний»,
      выраженная только именем); security-hardening §«Части, исправные по отдельности, не
      сходятся в целое»
    exposure: >-
      У прочих доменов метод Internal* не выходит наружу по двум независимым признакам: имени
      (звено отказа маршрута, перечень публичных методов края) и построению (соединение
      `<домен>` ведёт на публичный слушатель, где сервисы Internal* не зарегистрированы). У
      notify соединение одно, и оно ведёт на внутренний слушатель notify-api, где
      InternalSuppressionService зарегистрирован. Замер: все слои края, различающие публичный
      метод и внутренний, зовут один предикат по имени — allowlist.HasInternalSuffix
      (route_refusal.go:52-53; parity_test.go:239 делит поверхность дескрипторов этим же
      предикатом и требует, чтобы каждый «публичный» метод стоял в перечне края). Признака
      происхождения запроса, который читал бы бэкенд, в дереве нет: читателей listenerorigin
      под services/ и pkg/ — 0. Значит, для notify граница ban #6 выражена только именем
      сервиса. Ошибка в имени внутреннего сервиса notify (NTF-3 или последующей под-фазы)
      проходит все слои сразу, и построение её не ловит.
    condition: >-
      Условие на замысел S3. (а) Замысел называет число признаков, которые не пускают Internal*
      notify наружу, и сравнивает его с прочими доменами. (б) Признак, не зависящий от имени,
      восстановлен одним из двух способов, и выбор назван. Первый способ: notify-api отвергает
      вызов сервиса вне закрытого перечня «публичных по контракту» сервисов, если вызов пришёл с
      внешнего входа края. Для этого прозрачный маршрутизатор края ставит метку происхождения
      на исходящий вызов и снимает её с входящего, а notify-api читает её только от пира из
      круга пересылающих; при отсутствии метки — отказ. Второй способ: перечень публичных по
      контракту сервисов notify объявлен одним местом в дереве (не именем), и перечень края для
      пакета kacho.cloud.notify.v1 сверяется с этим объявлением, а не с HasInternalSuffix.
      (в) Держатель краснеет на инъекции «внутренний сервис пакета notify без Internal в имени,
      зарегистрированный на notify-api»; близнец — тот же сервис с Internal в имени.
    held_by: "NTF4-30, NTF4-112 держат только признак по имени (включая (в) — запись в перечне); признак построения — нужен гейт, его нет: заказ"
  - id: CX4V-52
    decision: [D36, D37]
    class: "code-authoring §«Умолчание, которое становится утверждением» (0 у процесса, который событий не производит; api-empty-means-empty)"
    exposure: >-
      notify-api обязан отдавать ровно три метрики NTF-4 (Р12, NTF4-113). Если метрики NTF-4
      регистрирует пакет при импорте, любой пакет, общий для двух корней, притащит в notify-api
      весь перечень с нулями. Это «событий не было» о процессе, который их не производит.
    condition: >-
      Реестр метрик строит корень развёртывания; набор метрик NTF-4 передаётся конструкторам
      явно, по развёртыванию. Регистрации при импорте пакета (init, пакетная переменная с
      автоматической регистрацией) в services/notify нет. Ряды по `object` у notify-api
      заводятся только для `address_key`.
    held_by: >-
      NTF4-113 (ровно три метрики, один ряд breach). Соглашение дерева то же: файлов с promauto
      в не-тестовом kacho services/ и pkg/ — 0, с MustRegister — 6; в corelib promauto — 0
      (@1d42a6728bf, @34bc810)
  - id: CX4V-53
    decision: [D37]
    class: "code-authoring §«Решение и его следствие разнесены» (общий признак над двумя независимыми объектами)"
    exposure: >-
      Признак secret_reload_rejected у notify-sender сведён по двум объектам: 1, пока последнее
      перечитывание хотя бы одного отвергнуто (Р12). Если признак ставит и снимает последнее
      событие, принятое перечитывание одного объекта снимет признак, поднятый другим. Сценария
      на этот случай нет: NTF4-77 оставляет объект почты нетронутым, NTF4-113 — у notify-api,
      где объект один.
    condition: >-
      Перечитыватель — один тип, параметризованный объектом, со своим состоянием на объект
      (действующий набор, исход последнего перечитывания, время поколения). Признак реплики
      вычисляется при чтении как «или» по исходам объектов, а не пишется событием. Исход
      «отложен» достижим только у объекта секрета почты: у объекта ключа отпечатка нет шага DNS.
    held_by: "NTF4-72, 77, 99, 113; случай «почта отвергнута, затем ключ принят — признак 1» — нужна проба, её нет: заказ"
  - id: CX4V-54
    decision: [D37]
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (третий исход «не смог спросить»)"
    exposure: >-
      Р11: оба развёртывания сверяют контрольное значение при старте и при каждом перечитывании
      объекта ключа. Если перечитывание читает строку из базы, у него появляется исход «база не
      ответила». Его нет среди трёх закрытых исходов, и у объекта ключа нет «отложен».
    condition: >-
      Строка контрольного значения читается один раз при старте. Р11 запрещает её перезапись на
      любом пути, поэтому перечитывание сверяет новый ключ с копией в памяти и в базу не ходит.
      Если замысел всё же читает базу при перечитывании, он называет исход её недоступности
      внутри закрытого набора и сценарий к нему.
    held_by: "вниманием автора замысла и design-reviewer; NTF4-77, 113 (исход при доступной базе)"
  - id: CX4V-55
    decision: [D37]
    class: "data-integrity §«Within-service инварианты — ТОЛЬКО на DB-уровне» (db-cas, single-row); code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      Одна строка контрольного значения на установку, пишут два развёртывания (Р11, Д23).
      Выбор «вставить или сверить» после чтения даёт две вставки. Без ограничения единственности
      на уровне таблицы две вставки дают две строки.
    condition: >-
      Таблица несёт ограничение единственности строки на уровне схемы (постоянный первичный
      ключ с CHECK). Запись — INSERT … ON CONFLICT DO NOTHING RETURNING. При нуле строк та же
      функция читает записанное значение и сравнивает. Проверки «строки нет, вставляю» до
      вставки нет. Функция одна, в пакете, который зовут оба корня; второй реализации в корне
      notify-api нет.
    held_by: "NTF4-116 (50 повторов под -race, (а) и (б), строк 1), NTF4-114/115"
  - id: CX4V-56
    decision: [D36]
    class: "code-authoring §«Решение и его следствие разнесены» (две независимые выкатки, одна схема)"
    exposure: >-
      Два развёртывания на одной базе kacho_notify катятся независимо. Шаблон дерева —
      шаг-мигратор в каждом поде службы (initContainer `migrate`, kacho-geo
      deployment.yaml:64-74; cmd/migrator есть у 6 из 6 служб @1d42a6728bf). Приёмка не говорит,
      поды какого развёртывания применяют миграции. Если только notify-sender, то notify-api
      новой версии может подняться на схеме без таблиц NTF-4 и упасть на первом запросе, а не
      при старте. Если оба, миграции идут конкурентно из двух развёртываний, а процессу с
      входящей поверхностью нужны права на изменение схемы.
    condition: >-
      Замысел называет, поды какого развёртывания применяют миграции. notify-api при старте
      сверяет версию схемы с ожидаемой и при меньшей отказывает в старте с её именем; рабочий
      запрос не падает на отсутствующей таблице. Если мигрируют оба развёртывания, применение
      исключает само себя (блокировка мигратора) и идемпотентно. Если мигрирует один, роль базы
      notify-api названа без прав на схему.
    held_by: "нужен гейт, его нет: заказ пробы «старт notify-api на схеме без таблиц NTF-4 — отказ с именем»"
  - id: CX4V-57
    decision: [D36]
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (проба, судящая по достижимости из корня)"
    exposure: >-
      З9 теперь судит поверхность по корню: предмет — пакеты, достижимые по импортам из корня
      развёртывания. Общий пакет, который импортирует регистрацию сервисов, делает регистрацию
      достижимой из корня notify-sender. Проба тогда краснеет, а построение «у notify-sender
      gRPC-слушателя нет» держится только её исходом.
    condition: >-
      Регистрация InternalSuppressionService и OperationService и сборка носителя Х5 — в
      пакете, который импортирует только cmd/notify-api. Общие пакеты (функция отпечатка,
      хранилище подавлений, контрольное значение, перечитыватель) не импортируют серверный gRPC
      и стабы регистрации. Проба выводит достижимость из графа импортов (go/packages), а не из
      имён каталогов.
    held_by: "servesurface_test.go (З9) с инъекцией «регистрация в пакете, достижимом из корня notify-sender» (DoD S3 п.8)"
  - id: CX4V-58
    decision: [D38]
    class: "code-authoring §«Контракт, который нельзя выразить» (одно объявление, два потребителя с разным составом)"
    exposure: >-
      Ручки NTF-1 у notify-api — закрытое подмножество (н1)–(н4) того же объявления, что у
      notify-sender (Р16, Р22). Подмножество, скопированное в загрузчик notify-api, — второе
      место об имени и границе ручки. Подмножество, выбранное по префиксу имени, — открытое.
    condition: >-
      Объявление ручек NTF-1 — одно значение в дереве. notify-api выбирает из него закрытый
      перечень имён, и выбор сверяется с объявлением в обе стороны: имя вне объявления —
      ошибка сборки или пробы. Границы берутся из тех же объектов объявления. Копии имени или
      границы в загрузчике notify-api нет.
    held_by: "NTF4-119; проба Р16 (три инъекции в группу NTF-1 notify-api)"
  - id: CX4V-59
    decision: [D36]
    class: "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
    exposure: >-
      Корень services/notify/cmd/notify-api и его развёртывание заводит та из NTF-3 и NTF-4,
      которая приходит первой (Р22). Вторая добавляет регистрации, ручки и оси дескриптора в
      чужой корень. Одобренная редакция NTF-3 (97afc066) регистрирует на том же слушателе
      публичные сервисы. Закрытая запись пробы З9, изъятия осей (CX4V-42) и перечень ручек
      notify-api (12 NTF-4 + (н1)–(н4)) правят обе под-фазы.
    condition: >-
      Замысел S3 называет порядок посадки относительно NTF-3 и то, что делает вторая: строки
      закрытой записи З9 — у каждой под-фазы свои, с причиной; перечень ручек notify-api —
      объединение двух закрытых частей, и проба Р16 судит только свою. Каждое изъятие оси
      дескриптора сверяется с сервисами обеих под-фаз на ревизии посадки второй.
    held_by: "З9 (запись без вызова — находка; вызов вне записи — находка); остальное — вниманием; заказ сверки изъятий — CX4V-42"
  - id: CX4V-60
    decision: [D38]
    class: "security-hardening §«Отношение, выполнимое подстановочным знаком, не сужает НИЧЕГО» (узнавание по префиксу против равенства)"
    exposure: >-
      Допуск kaname к AuthorizeService — любая учётка с приставкой `kacho-` (fgaproxy.go:59,
      SANToServiceDomain; caller_policy.go:366; сужающих перечней с AuthorizeService 0). Учётка
      notify-api `kacho-notify-api` начинается с учётки notify-sender `kacho-notify`. Если
      таблица звена идентичности источника ленты сравнит SAN по началу, notify-api получит
      субъект service:notify и право читать ленту, в том числе коды и ссылки писем. Разделение
      Д20 (3) существует ради обратного.
    condition: >-
      Ключ таблицы звена идентичности для notify-sender — полный URI SAN из декларации
      notify.spiffe, и сравнение — равенство. Замысел ссылается на держателя NTF-1: случай «равен
      ключу по началу, но длиннее» — ровно пара kacho-notify / kacho-notify-api. В чарте
      notify-api не попадает ни в перечень источников, ни в таблицу звена идентичности.
    held_by: "NTF1-M03 закреплённой редакции (равенство полного URI, случай «длиннее»); NTF4-117 (7), (8); NTF4-120/121"
  - id: CX4V-61
    decision: [D38]
    class: "code-authoring §«Умолчание, которое становится утверждением» (голое имя службы как элемент перечня)"
    exposure: >-
      Два перечня гейта посадки сравнивают элемент с `$svc` (строки :192 и :202 @1d42a6728bf).
      У notify две строки с одной службой. Правило «служба с несколькими строками судится по
      развёртыванию», записанное литералом `notify`, не распространится на следующую службу с
      двумя развёртываниями.
    condition: >-
      Гейт сам считает число строк таблицы служб на службу. Признак «судить по развёртыванию» —
      следствие этого счёта, а не литерала. Голое имя такой службы в любом из двух перечней —
      находка с именами развёртываний.
    held_by: "NTF4-109 (и)–(м) с положительными близнецами"
  - id: CX4V-62
    decision: [D37]
    class: "security-surface (секрет в процессе с входящей поверхностью); security-hardening hard-no-err-echo"
    exposure: >-
      notify-api держит ключ, который защищает таблицы от перебора адресов, и принимает вызовы
