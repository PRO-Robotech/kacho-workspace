      но она поднимает только пару. Форма «только внутренний слушатель» открывает три места, где
      вторая сборка возникнет незаметно: своя сборка внутреннего сервера, проверки на nil
      публичного сервера по всему Serve (handOut, servedOf, listenAndServe) и нулевое значение
      поля формы.
    condition: >-
      (а) сборка сервера одного слушателя — одна функция от (creds, слушатель). Пара зовёт её
      дважды, форма Х5 — один раз с ListenerInternal; второй сборки цепочки в corelib нет; (б)
      выбор формы стоит в одном месте Serve. В форме Х5 публичный *grpc.Server не создаётся вовсе,
      а не создаётся и потом пропускается проверками на nil; (в) нулевое значение поля формы
      означает пару: семь существующих служб не меняются. Форма Х5 требует непустой причины,
      неизвестное значение — отказ конструктора; (г) в форме Х5 ошибка внутреннего слушателя —
      исход Serve (ненулевой), и процесс не завершается кодом 0 при его падении; (д) все отказы
      старта О2–О11 судят служимый набор внутреннего сервера так же, как в паре; (е) публичный
      регистратор, не равный nil, в форме Х5 — отказ старта с именем аргумента.
    held_by: >-
      Integration-проба Х5 (DoD S3 п.8б): набор адресов и отказы старта. На уровне notify —
      матрица NTF4-24…27 и NTF4-91 (без звена прав они краснеют). Тождество цепочек форм не держит
      ни одна проба — заказ: TestBothListenersRefuseIdenticallyOnTheWire, расширенная на форму Х5
      (внутренний сервер формы Х5 и внутренняя половина пары отказывают одинаково), с инъекцией
      «форма Х5 собирает цепочку без звена прав». Пункт (г) — заказ пробы «внутренний слушатель
      падает → Serve возвращает ошибку».
  - id: CX4S-30
    decision: [D15, D8]
    class: "code-authoring §«Чужой ответ: классификация и бюджет»; §«Решение и его следствие разнесены»"
    exposure: >-
      По правилу повтора Ack NTF-1 (Р17, редакция 14) повтор тем же токеном с другой причиной
      получает OUTCOME_ALREADY_RECORDED. Причину SUPPRESSED notify выбирает по порядку причин Р5 из
      текущего состояния подавления. Если ответ на первый Ack потерян, а между попытками
      появилась запись другой причины, пересчёт даст новую причину и отказ сервера ленты. Если
      notify сочтёт этот отказ сбоем, строка уйдёт в DEFER или в повтор выдачи, хотя её исход уже
      записан.
    condition: >-
      (а) исход строки, включая причину SUPPRESSED, решается один раз на выдачу. Повтор Ack несёт
      тот же исход и не пересчитывает его; (б) OUTCOME_ALREADY_RECORDED — закрытая клетка «исход
      уже записан, строка закрыта»: SMTP-сессии нет, DEFER нет, счёт исходов не удваивается;
      LEASE_LOST — «строка не наша», SMTP-сессии нет; (в) классификация ответа Ack — таблица без
      корзины «прочее».
    held_by: >-
      Сервер ленты держит проба Х3 (DoD S2 п.2). Сторону notify не держит ни один сценарий —
      заказ: «ответ на Ack(SUPPRESSED(soft_bounce)) потерян; до повтора появилась запись
      COMPLAINT; повтор несёт soft_bounce; исход по строке один; SMTP-сессий 0».
  - id: CX4S-31
    decision: [D6, D2, D9]
    class: "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; code-authoring §«Контракт, который нельзя выразить»"
    exposure: >-
      В одобренной редакции 10 NTF-1 (d524e7bd) сборщик ссылки и заголовков notify принимает
      только типы form.Path, form.Token и form.HeaderText. Гейт NTF1-B28 находит преобразование в
      эти типы вне пакета notify/form, а по открытому RA-10 разбора NTF-1 типы, возможно, станут
      непрозрачными. NTF-4 кладёт в заголовки свои значения: List-Unsubscribe с токеном назначения
      u, адрес возврата с токеном b, подпись. Эти значения — не данные строки. Своя сборка
      заголовков NTF-4 стала бы второй полосой, а приведение своего токена к form-типу окрасило бы
      B28.
    condition: >-
      Заголовки NTF-4 собирает тот же сборщик, что заголовки NTF-1. Значения NTF-4 в него
      приходят через функции notify/form либо через отдельный вход сборщика для значений,
      порождённых notify, и этот вход назван в замысле. Преобразования в form-типы вне notify/form
      нет. Вторую функцию сборки заголовков или адреса возврата notify не заводит.
    held_by: >-
      Гейт NTF1-B28; NTF4-41, NTF4-70 (заголовки ушедшего письма). Окончательная форма зависит от
      исхода RA-10 у NTF-1 — сверка при перезакреплении (RA-01).
  - id: CX4S-32
    decision: [D18, D17]
    class: "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
    exposure: >-
      У разрешений notify.suppressions.get и .delete три записи: аннотация в proto kacho, таблица
      края (порождается из proto, гейт gateway permission-catalog-check) и запись каталога kaname
      (Х2, пишется руками в другом стволе). Гейта, сверяющего каталог kaname с аннотациями kacho,
      в kacho @1d42a6728bf нет: скрипт gen-permission-catalog.sh kaname не читает.
    condition: >-
      Аннотация proto — единственный источник имени разрешения и уровня. Запись kaname копирует
      их дословно, и в замысле названа команда сверки. Расхождение закрыто отказом: Check по
      незнакомому разрешению — PERMISSION_DENIED.
    held_by: >-
      Матрица глагол × роль NTF4-24…27 через kaname в процессе пробы на пине: при расхождении
      администратор получает отказ, и проба краснеет. Таблицу края держит
      permission-catalog-check.
  - id: CX4S-33
    decision: [D10, D12]
    class: "code-authoring §«Умолчание, которое становится утверждением»"
    exposure: "правило снятия feedback_route — RA-03"
    condition: "см. RA-03; до правки приёмки вычисление feedback_route не пишется"
    held_by: "вернуть в приёмку (RA-03)"
  - id: CX4S-34
    decision: [D20]
    class: "code-authoring §«Умолчание, которое становится утверждением» (bool без состояния «неприменимо»)"
    exposure: "форма слушателя в самоотчёте и public_mtls у службы без публичного слушателя — RA-04"
    condition: >-
      См. RA-04. Независимо от решения: notify не докладывает public_mtls=true, не имея
      публичного слушателя. Значение самоотчёта берётся из формы, которую реально поднял
      носитель, а не из настроек.
    held_by: "вернуть в приёмку (RA-04)"
  - id: CX4S-35
    decision: [D20, D14]
    class: "code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей)"
    exposure: "оси дескриптора носителя без ручек в закрытом перечне Р16 — RA-05"
    condition: "см. RA-05"
    held_by: "вернуть в приёмку (RA-05)"

