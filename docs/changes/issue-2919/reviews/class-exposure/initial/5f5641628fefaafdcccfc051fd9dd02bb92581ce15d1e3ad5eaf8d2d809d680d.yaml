items:
  - id: CX4S-01
    decision: [D19, D3]
    carried_from: [CX4R-01]
    class: "code-authoring §«Решение и его следствие разнесены»; §«Контракт, который нельзя выразить» (часы разных реплик как два источника одного значения)"
    exposure: >-
      Эпоху аренды и условие «держатель = я И эпоха = E» Р21 теперь называет сама. Остаётся
      допущение о часах: реплика, у которой часы ушли вперёд, видит аренду истёкшей раньше, чем её
      видит держатель. Её взятие под условием эпохи безопасно, пока каждая запись держателя несёт
      проверку эпохи.
    condition: >-
      (а) взятие аренды увеличивает эпоху, продление её не меняет; (б) каждая запись держателя
      — фиксация сообщения с отметкой дайджеста, заведение номера попытки контрольного письма,
      отметка «принят», метка опроса, строка состояния признака — идёт одной транзакцией с условием
      «держатель = я И эпоха = E И срок > $now». Ноль строк означает, что фиксации нет и сеанс
      закрывается; (в) допущение о расхождении часов реплик названо в замысле, и корректность от
      него не зависит — от него зависит только число отказов [IN-USE].
    held_by: >-
      NTF4-95 (эпоха за шаг не выросла), NTF4-97, NTF4-104. Два экземпляра с разными управляемыми
      часами не создаёт ни один сценарий — заказ пробы остаётся в силе.
  - id: CX4S-02
    decision: [D19, D1]
    carried_from: [CX4R-02]
    class: "code-authoring §«Решение и его следствие разнесены» (темп производителя и применения)"
    exposure: >-
      Р21 требует продлевать аренду не реже раза в треть срока, пока сеанс открыт, «так долгое
      чтение одного сообщения не снимает аренды». Если продление сидит в том же цикле, что чтение,
      оно само ждёт, пока RETR прочитает сообщение до 25 МиБ. Если его таймер идёт на системных
      часах, а не на часах процесса, на управляемых часах пробы оно не срабатывает никогда.
      NTF4-104 продлевает аренду фиксацией каждого сообщения и зелёна при любом из этих дефектов.
    condition: >-
      (а) независимое продление — отдельная горутина со своим соединением пула; транзакция
      фиксации её соединение не занимает; (б) таймер продления берётся от внедрённых часов
      процесса, как и прочие таймеры notify (см. CX4S-12); (в) ноль строк у продления отменяет
      контекст сеанса и ставит срок на сетевое соединение POP3, так что заблокированный RETR
      прерывается; (г) решение о праве фиксировать принимает только условие в транзакции
      фиксации, а продление лишь ускоряет выход; (д) DELE посылается только после успешной
      фиксации; QUIT после потери аренды удаляет только уже зафиксированное.
    held_by: >-
      NTF4-104 держит продление фиксацией. Независимое продление не держит ни один сценарий —
      нужна проба «одно сообщение, чтение которого П10 растягивает шагами часов Δ < TTL/3 на
      суммарно больше TTL: сообщение применено, эпоха та же, [IN-USE] 0»; её близнец — продление,
      сведённое к одному вызову в начале сеанса (красная). Заказ.
  - id: CX4S-03
    decision: [D10, D2, D19]
    carried_from: [CX4R-03]
    class: "code-authoring §«Чужой ответ: классификация и бюджет»; §«Умолчание, которое становится утверждением»"
    exposure: >-
      Попытка контрольного письма идёт через тот же ретранслятор и ту же таблицу входа, что строки
      ленты. Её исход не должен попадать в словарь строк NTF-1: ни в размыкатель, ни в
      misconfigured. Если классификатор ответа или размыкатель NTF-1 живёт в общей обёртке
      SMTP-транспорта, попытка пройдёт через него, минуя вызывающий код. Кроме того, состояние
      «ожидаемого выпуска нет» после (а) NTF4-103 должно отличаться от «есть выпуск с нулевым
      временем принятия».
    condition: >-
      (а) отправка контрольного письма — отдельная функция с закрытым результатом {accepted,
      not_accepted}. Классификатор исходов строк NTF-1 она не зовёт, счётчиков размыкателя и
      сигнала misconfigured не касается. Если размыкатель NTF-1 встроен в транспорт, у попытки
      свой путь без него, и это место названо в замысле; (б) номер попытки заводится под условием
      аренды до отправки; отметка принятия (момент ответа 250 на DATA) пишется под тем же условием
      и только после этого ответа; (в) «ожидаемый выпуск» — строка с заполненным моментом
      принятия и незаполненным моментом прочтения. Отсутствие — NULL, а не нулевое время; (г)
      письмо с номером, отличным от ожидаемого, — stale; (д) 250 на DATA при сорванной отметке
      принятия считается accepted в notify_feedback_canary_issues_total, но ожидаемым выпуском не
      становится; эта клетка названа в замысле.
    held_by: >-
      NTF4-103 (инъекция «номер ожидаемый при заведении»), NTF4-103/105 (инъекция «исход попытки
      классифицируется словарём строк»), NTF4-100. Клетку (д) ни один сценарий не создаёт.
  - id: CX4S-04
    decision: [D12, D19, D10]
    carried_from: [CX4R-04]
    class: "code-authoring §«Решение и его следствие разнесены» (общий счётчик); §«Умолчание, которое становится утверждением»"
    exposure: >-
      Р12 называет для признаков установки только переход 0→1. Для feedback_route правило снятия
      в 0 теперь влияет на наблюдаемое поведение — это RA-03 ниже. Для остальных признаков
      установки (hard_bounce_rate, complaint_rate, feedback_stale) переход 1→0 остаётся условием на
      код.
    condition: >-
      (а) значение признака установки на реплике — чтение строки состояния в kacho_notify;
      вычисляет и пишет его держатель одиночки условным обновлением; (б) темп обновления у
      не-держателей выводится из KACHO_NOTIFY_FEEDBACK_POLL_INTERVAL, новой ручки нет; (в) оба
      перехода, 0→1 и 1→0, делаются условным обновлением, и WARN пишет только выигравший переход
      0→1; (г) проба, сверяющая равенство признака на репликах, ждёт схождения в пределах такта.
    held_by: >-
      NTF4-15, NTF4-95, DoD S7 п.2а. Переход 1→0 и повторное нарушение с новой строкой WARN не
      держит ни один сценарий — заказ. Для feedback_route — RA-03.
  - id: CX4S-05
    decision: [D12, D5, D1, D10]
    carried_from: [CX4R-05]
    class: "code-authoring §«Контракт, который нельзя выразить» (одно событие, два байтовых написания)"
    exposure: >-
      Повторную доставку DSN с другими трассировочными заголовками идемпотентность по дайджесту
      не ловит. Знаменатель долей — отправленные письма. Контрольное письмо в знаменатель входить
      не должно, и попытки теперь повторяются каждым тактом.
    condition: >-
      (а) событие отказа или жалобы уникально по паре (id строки журнала, род события) — UNIQUE в
      kacho_notify; (б) числитель долей и порог мягких отказов считают уникальные события; (в)
      знаменатель — строки журнала с отметкой 250 на DATA в окне по часам процесса; (г) повтор
      строки ленты переиспользует строку журнала (UNIQUE по (ns, id строки ленты)); (д) ни
      попытки контрольного письма, ни их номера в журнал не пишутся.
    held_by: >-
      NTF4-64…67, NTF4-10, NTF4-73 (знаменатель без контрольного письма). Повторная доставка DSN
      с другими заголовками — заказ.
  - id: CX4S-06
    decision: [D2]
    carried_from: [CX4R-06]
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    exposure: "регистр локальной части, неизвестная версия ключа, произвольная длина; назначений три"
    condition: >-
      Разбор токена — одна функция на три назначения. Длина проверяется до декодирования, регистр
      приводится до сверки, код аутентичности сверяется за постоянное время. Неизвестная версия,
      неверная длина или алфавит дают bad_token без паники. Назначение читается из проверенного
      токена; ns и шаблон берутся из строки журнала.
    held_by: >-
      NTF4-02, 12, 61, 100. «Токен в нижнем регистре применяется» (Р2) сценария не имеет — заказ.
  - id: CX4S-07
    decision: [D13, D8, D10, D9]
    carried_from: [CX4R-07]
    class: "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; code-authoring §«Контракт, который нельзя выразить»"
    exposure: >-
      Нормализация теперь у NTF-1 (address.Normalize). В одобренной редакции 10 NTF-1 она
      возвращает тип address.Normalized, у домена своя функция NormalizeDomain с именованным
      профилем IDNA, а гейт NTF1-B27 обходит services/notify и находит любой не-тестовый вызов
      golang.org/x/net/idna. Внутри NTF-4 остаются три места, где адрес или домен сравниваются:
      (1) одна функция ключевого хеша на все таблицы и сетку; (2) сравнения доменов при
      выравнивании DMARC и SPF, домен d= подписи и домен возврата — вызов idna там окрасил бы
      B27, а сравнение сырых строк разошлось бы для Unicode-домена и его A-label; (3) контрольное
      значение ключа отпечатка (Р11). Если оно считается как хеш константы, смену профиля
      нормализации оно не видит, и тогда отпечатки существующих записей подавления молча
      перестают совпадать с новыми (последствие для записей — RA-02).
    condition: >-
      (а) функция отпечатка notify одна, принимает address.Normalized, а не строку, и зовут её
      сетка NTF-1, журнал, подавление, Lookup и разбор Final-Recipient/Original-Rcpt-To; (б) в
      services/notify нет вызовов пакета idna. Все сравнения доменов (выравнивание DMARC/SPF,
      d= подписи, домен возврата, домен From) идут через address.NormalizeDomain либо через
      значения, чья ASCII-форма гарантирована проверкой ручки (RFC 1123) — и это различие названо
      в замысле по каждому месту; (в) контрольное значение Р11 считается той же функцией
      отпечатка над закреплённым набором адресов, где есть заглавные буквы в домене, Unicode-домен
      и его A-label. Смена ключа или профиля нормализации тогда меняет контрольное значение;
      (г) неразбираемый адрес — ошибка, а не отпечаток сырой строки.
    held_by: >-
      NTF4-23, NTF4-101/102, NTF4-03, NTF4-78, NTF4-77 (смена ключа). Единственность нормализации
      держит гейт NTF1-B27; единственность функции хеша — кандидат в AST-гейт (заказ, после
      посадки). Смену профиля нормализации ловит контрольное значение — заказ пробы (инъекция
      другого профиля при том же ключе → отказ старта), исход — по RA-02.
