outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-01
    items: [CX4S-07, CX4S-08, CX4S-31]
    anchors: ["шапка", "§1 правило и сверка", "§1 строки «закрытый словарь исходов», «нормализация адреса»", "Р15", "Р17", "§1.1 второй список «нормализация адреса»"]
    what: >-
      Given NTF-1 закреплён на 530e2296 как на «действующем одобрении». Теперь действующее
      одобрение NTF-1 — редакция 10 d524e7bd (коммит c115d2008, предок записи круга 14). По
      правилу §1 документа нужна сверка по строкам. Дельта меняет строки «закрытый словарь
      исходов» (причины INVALID названы и получили сторону источника, CR/LF перешёл в
      attrs_invalid — утверждение NTF-4 «прочие причины имени не несут» и Р17 с ним расходятся) и
      «нормализация адреса» (типы Normalized и Domain, NormalizeDomain, профиль IDNA, узлы B27 в
      services/notify). Добавились notify/form и B28 (сборщик заголовков только для form-типов).
      Это новая редакция. N14-1 сам по себе оставлял сверку до вердикта NTF-1, и вердикт уже
      есть. Порядок: по NTF-1 открыт RA-10 (форма тех же типов), и редакция 11 NTF-1 снова
      заденет строку «нормализация адреса». Одна сверка на одобрение редакции 11 дешевле двух —
      решает диспетчер.
  - id: RA-02
    items: [CX4S-07]
    anchors: [Р15, Р11, NTF4-77, "N14-1 (б)"]
    what: >-
      Смена именованного профиля IDNA в corelib (NTF-1: «его смена перекладывает ключи окон и
      сетки») меняет отпечатки. Действующие записи подавления, строки журнала и ключи сетки
      перестают совпадать с новыми отпечатками тех же адресов, и подавление молча перестаёт
      срабатывать. Приёмка не называет исход. Нужно решение и сценарий, например: контрольное
      значение Р11 считается функцией отпечатка целиком над закреплённым набором адресов
      (заглавные буквы в домене, Unicode-домен, его A-label). Тогда смена ключа ИЛИ профиля —
      отказ старта с именем причины, как NTF4-77. Близнец — тот же набор при прежнем профиле. Если
      выбран другой исход (перерасчёт, перенос), он называется в Р15 вместе с ценой.
  - id: RA-03
    items: [CX4S-33, CX4S-04]
    anchors: [Р10, Р12, NTF4-73, NTF4-100]
    what: >-
      Не названо правило возврата feedback_route в 0. Ожидаемый выпуск один, DEADLINE < INTERVAL.
      При сломанном маршруте каждый следующий принятый выпуск становится ожидаемым. Если признак
      вычисляется как «текущий ожидаемый просрочен», он падает в 0 на каждом принятии и
      поднимается снова через DEADLINE: 0 на DEADLINE, 1 на INTERVAL − DEADLINE, WARN на каждом
      интервале. При этом 0 утверждает «маршрут в порядке», хотя маршрут не проверен. NTF4-73
      смотрит один интервал и оба прочтения допускает. Нужно решение (например: признак = 1, пока
      после первого просроченного принятого выпуска не прочитан ни один ожидаемый; новый выпуск
      признак не снимает) и сценарий-близнец NTF4-73 на два интервала: feedback_route = 1 без
      перерыва на каждом такте, WARN ровно одна; после починки маршрута и прочтения ожидаемого —
      0.
  - id: RA-04
    items: [CX4S-34, CX4S-29]
    anchors: ["§1.1 Х5", "§1.1 второй список «самоотчёт посадки»", "Р20", "З9", "DoD S3 п.8", "DoD S5 п.2"]
    what: >-
      DoD S3 п.8 и Х5 требуют, чтобы самоотчёт notify нёс форму «только внутренний слушатель», а
      assert-production-posture.sh её оценивал. Замер: самоотчёт — corelib
      observability.BootPosture, закрытый набор из 10 ключей; поля формы нет; PublicMTLS — bool без
      «неприменимо». Гейт требует public_mtls == true от каждой службы (:285 @1d42a6728bf). У
      notify без публичного слушателя честное значение false, и гейт краснеет. true было бы ложью
      самоотчёта. Приёмка при этом дважды говорит «corelib/observability не правится» (§1.1, DoD S5
      п.2), а в координатах Х5 bootposture.go нет. Нужно назвать: где лежит форма в самоотчёте
      (ключ, координата, правка Х5 или отдельная), как public_mtls выражает отсутствие публичного
      слушателя (три состояния, как InternalMTLS по #1024) и какая правка гейта в kacho его
      принимает. Предикат «observability не правится» — исправить. Сценарий: самоотчёт notify
      после S3 — форма internal_only, public_mtls «неприменимо», гейт зелёный. Близнец — служба
      пары с public_mtls false, гейт красный.
  - id: RA-05
    items: [CX4S-35, CX4S-23, CX4S-29]
    anchors: [Р16, Р20, "§1.1 Х5", "DoD S3 п.7", "§8 строка Р16"]
    what: >-
      Перечень ручек Р16 закрыт на 27, и держатель required_knobs_test.go сверяет объединение
