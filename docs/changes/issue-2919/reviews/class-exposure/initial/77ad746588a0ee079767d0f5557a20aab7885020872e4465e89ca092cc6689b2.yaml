outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-01
    items: [CX4T-47, CX4T-07, CX4T-31]
    anchors: ["шапка", "§1 «На какой редакции NTF-1 стоит Given»", "§1 «Открытый возврат разбора классов NTF-1 на d524e7bd…»", "§1 строки «нормализация адреса», «форма значений»"]
    what: >-
      Given NTF-1 закреплён на d524e7bd (редакция 10) как на «действующем одобрении». Действующее
      одобрение — редакция 13 (05828e42, коммит 46e2a3819), и оно предок и коммита редакции 17,
      и коммита её вердикта. Утверждение шапки и §1 ложно на ревизии, где оно записано. Правило
      связи §1 требует сверки по строкам. Замер сверки: свойства строк, которые называет NTF-4, в
      существе не изменились. Меняются три места. (1) Шапка и сверка — новый отпечаток.
      (2) Абзац «Открытый возврат … RA-10» говорит «узел гейтов B27 и B28 — запись через
      unsafe»; одобренная редакция 13 это опровергает: узел один, «обход типобезопасности» в
      B28, семь видов, три дерева целиком. (3) В строке «форма значений» держатель назван
      «гейт единственности формы»; в редакции 13 путь мимо функций пакета держат компилятор
      (непрозрачный тип) и узел B28, и формулировку надо заменить ссылкой на это свойство.
      Это четвёртый возврат одного рода в этом документе (круги 12 и 13, разбор на редакцию 14,
      этот). Пока закрепление идёт «за действующим одобрением», а NTF-1 одобряют чаще, чем
      NTF-4, утверждение ложно почти всегда. Решение, которое снимает класс, а не экземпляр
      (выбирает автор приёмки), — формулировка по неизменному факту: «Given стоит на одобренной
      редакции X; сверка с более поздними одобрениями NTF-1 — обязательный шаг перед
      одобрением замысла стадии S1 и перед стартом каждой стадии». Одна сверка на одобрение
      редакции 14 NTF-1 (коммит f25be4887, вердикта ещё нет) дешевле двух. Порядок решает
      диспетчер.

