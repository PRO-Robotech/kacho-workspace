  # --- новые решения редакций 15–17 ---
  - id: CX4T-36
    decision: [D22]
    class: "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; code-authoring §«Контракт, который нельзя выразить»"
    exposure: >-
      Адрес с токеном нужен в трёх местах с разными потребителями: envelope MAIL FROM (не
      заголовок), заголовок List-Unsubscribe (через сборщик NTF-1, только form.HeaderText) и
      RCPT/To контрольного письма. Одна функция на три назначения — решение; второе написание
      возникнет, если назначение передаётся строкой или если значение для заголовка собирается
      повторно, а не из результата той же функции.
    condition: >-
      (а) функция принимает назначение значением закрытого перечня {b, u, c}, а не строкой;
      неизвестное назначение — ошибка, а не умолчание; (б) значение для List-Unsubscribe —
      результат функции notify/form над строкой, которую вернула эта функция, без
      промежуточной правки; ошибка notify/form на пути строки — INVALID(attrs_invalid) без
      SMTP-сессии, а не письмо без заголовка; (в) envelope MAIL FROM в сборщик заголовков не
      передаётся; (г) в services/notify нет второго места, где склеиваются локальная часть,
      «+» и токен (кандидат в предикат после посадки).
    held_by: "NTF4-13, 14, 41, 70 (адрес и заголовок ушедшего письма); пункт (г) — вниманием до гейта"
  - id: CX4T-37
    decision: [D25]
    class: "code-authoring §«Контракт, который нельзя выразить»; §«Инвариант и оснастка — это тоже прод-код»"
    exposure: >-
      Закреплённый набор адресов контрольного значения стал контрактом установки: его правка
      (добавлен адрес, изменён порядок, иная кодировка байтов) меняет контрольное значение, и
      каждая существующая установка перестаёт стартовать после обновления notify — ровно как
      при смене ключа. Инъекция DoD S6 п.1 («код аутентичности над постоянной строкой») ловит
      только возврат к старой форме, но не правку набора или порядка склейки.
    condition: >-
      (а) набор объявлен один раз, неизменяемым значением, рядом — комментарий о следствии
      правки; (б) порядок обхода и склейка результатов фиксированы (не обход map); (в) проба
      «золотого значения»: контрольное значение при постоянном испытательном ключе равно
      литералу в дереве проб; правка набора, склейки, функции отпечатка или профиля IDNA
      краснеет в CI до посадки, а не на старте установки; (г) контрольное значение считается
      тем же экземпляром функции отпечатка, что и таблицы (CX4T-07).
    held_by: "NTF4-77, 106 — на старте; проба золотого значения — заказ"
  - id: CX4T-38
    decision: [D25]
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (шов для пробы, ставший ручкой)"
    exposure: >-
      Порт нормализации в конструкторе заведён ради NTF4-106. Приёмка утверждает «в корне одно
      значение порта — address.Normalize, других в не-тестовом дереве нет», но в §8 держателя
      этого утверждения нет. Порт, до которого дотянется конфигурация или второй корень
      (notify-probe), даст вторую нормализацию, которую гейт NTF1-B27 не видит: вызова idna нет.
    condition: >-
      (а) порт — параметр конструктора, а не поле конфигурации: из окружения, values и
      аргументов процесса недостижим; (б) в не-тестовых файлах kacho значение порта одно —
      address.Normalize, в том числе в cmd/notify-probe; (в) тип порта возвращает
      address.Normalized, так что подмена строится только из address.Normalize (NTF-1
      редакция 13: тип непрозрачен).
    held_by: "пункт (в) — компилятор (NTF1-B27 форма типа); пункты (а), (б) — вниманием; AST-предикат «значения порта нормализации в не-тестовом дереве» — заказ"
  - id: CX4T-39
    decision: [D24]
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    exposure: >-
      secret_reload_rejected снимается, когда «очередное перечитывание находит набор,
      совпадающий с действующим (оператор вернул прежний)». При атомарной записи тома
      kubelet создаёт новый каталог ..data на каждое обновление, даже если байты те же. Сравнение
      по пути, имени каталога или времени изменения никогда не скажет «совпадает», и признак
      не снимется.
    condition: >-
      Совпадение наборов определяется по содержимому: дайджест байтов всех файлов разрешённого
      каталога в фиксированном порядке имён. Путь, имя каталога ..data и mtime в сравнение не
      входят.
    held_by: "сценария нет — заказ пробы «отвергнутый набор, затем оператор возвращает прежние байты новым ..data → признак 0, перезагрузки не было»"
  - id: CX4T-40
    decision: [D28]
    class: "code-authoring §«Умолчание, которое становится утверждением»; §«Контракт, который нельзя выразить» (перечень входных поверхностей)"
    exposure: >-
      corelib grpcsrv.TLSServer несёт поле Enable, у которого нулевое значение означает
      insecure. Файлы читаются один раз при старте (grpcsrv/tls.go:20). Службы kacho встраивают
      TLSServer в конфигурацию под префиксом, и загрузчик выводит из этого ручку …_ENABLE
      (compute: config.go:460). Приёмка говорит: у notify три ручки удостоверения, ручки
      включения нет, границы — «файл читается и разбирается». Встроить TLSServer так же, как
      compute, значит получить ручку вне закрытого перечня 32 с опасным нулём и второй
      разборщик файлов для проверки границ.
    condition: >-
      (а) notify строит grpcsrv.TLSServer{Enable: true, …} в коде из трёх ручек; ENABLE не
      читается из окружения и в загрузчике не появляется; (б) проверка границ трёх файловых
      ручек вызывает grpcsrv.TLSServerTransportCreds и требует Verified — тот же разборщик,
      которым поднимается слушатель. Своего разбора PEM нет. Текст отказа называет ручку;
      (в) что файлы читаются один раз, а продление сертификата требует перезапуска пода, —
      названо в замысле тем же способом, что у служб kacho.
    held_by: "пункт (а) — держатель Р16 (ручка …_ENABLE вне перечня — красный) и отказ дескриптора на боевой посадке (contract.go:1211); пункт (б) — проба Р16 с файлами П11; пункт (в) — вниманием"
  - id: CX4T-41
    decision: [D28]
    class: "code-authoring §«Решение и его следствие разнесены» (граница поперёк двух групп ручек)"
    exposure: >-
      Граница «…_INTERNAL_PORT не равен порту диагностического слушателя» записана у ручки
      NTF-4, а вторая сторона — ручка группы NTF-1. Если проверка стоит в разборе группы NTF-4,
      она может прочесть сырое окружение соседней группы (второе чтение ручки NTF-1) либо
      сработать до того, как группа NTF-1 разобрана.
    condition: >-
      Проверка идёт одной функцией после разбора обеих групп и читает значение ручки NTF-1 из
      разобранной структуры NTF-1, а не из окружения. Так же проверяется …_HANDLING_BUDGET >
      …_AUTHZ_CHECK_TIMEOUT.
    held_by: "required_knobs_test.go (проба выставляет ручку NTF-1 под проверяемую границу, Р16)"
  - id: CX4T-42
    decision: [D28]
    class: "code-authoring §«Умолчание, которое становится утверждением» (изъятие, пережившее свой предмет)"
    exposure: >-
      Изъятия осей дескриптора — HideExistence, Narrowers, Emits/Registers/Delivery/BootGate,
      StreamBudget — верны для поверхности NTF-4 (права на объекте cluster, списочной выдачи
      нет). Рабочая редакция NTF-3 (вердикта нет) регистрирует на том же слушателе
      пользовательские сервисы настроек, подписок, контактов и ленты. После неё изъятия
      становятся ложью, а дескриптор их не пересматривает: они — строки корня notify.
    condition: >-
      Причина каждого изъятия называет факт, на котором стоит (например, «все методы спрашивают
      права на объекте cluster»). В замысле названо, какой гейт покраснеет, когда
      зарегистрированный метод этот факт опровергнет. Если такого гейта нет, об этом сказано
      прямо и выдан заказ.
    held_by: "не измерено, какие гейты дерева kacho читают изъятия осей notify — заказ замера до замысла"
  - id: CX4T-43
    decision: [D29]
    class: "code-authoring §«Умолчание, которое становится утверждением»; §«Решение и его следствие разнесены»"
    exposure: >-
      Приёмка требует, чтобы listener_form брался «из формы, которую реально поднял носитель, а
      не из настроек». Замер: BootPosture заполняет корень службы из cfg, и строка пишется ДО
      старта слушателей (bootposture.go: «ДО старта листенеров»; compute main.go:353 —
      самоотчёт, :556 — servicehost.Serve). В момент строки носитель ещё ничего не поднял.
    condition: >-
      Значение listener_form берётся из того же значения дескриптора, которое передаётся в
      servicehost.Serve (из поля формы после servicecontract.New), через функцию corelib, а не
      из конфигурации notify. Корень notify не присваивает форму литералом. У прочих служб
      поле не задаётся и печатается pair. Что значит «поднял» в момент строки, записано в
      замысле: «принял дескриптор, который носитель исполнит».
    held_by: "NTF4-108 (значение на стенде); проба Х5 DoD S3 п.8б (форма в самоотчёте носителя)"
  - id: CX4T-44
    decision: [D29]
    class: "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
    exposure: >-
      В assert-production-posture.sh уже есть перечень SERVICES (8 строк, @1d42a6728bf:141).
      Отсутствующий deployment — находка, если служба не названа в POSTURE_SKIP. Р20 добавляет в
      тот же скрипт второй перечень — службы без публичного слушателя. Запись второго перечня,
      которой нет в первом, никогда не судится: строку самоотчёта гейт ищет только по
      SERVICES. Правило «служба перечня доложила pair» её тоже не ловит.
    condition: >-
      (а) перечень служб без публичного слушателя — подмножество SERVICES, и гейт сам
      проверяет это до обхода (иначе находка с именем записи); (б) служба в POSTURE_SKIP
      исключается из обоих перечней одинаково; (в) запись перечня адресует тот же ключ,
      что строка SERVICES (имя deployment либо имя службы — одно из двух, названное в
      замысле).
    held_by: "NTF4-109 (а)–(г) не создают запись второго перечня вне SERVICES — заказ пятого варианта"
  - id: CX4T-45
    decision: [D31]
    class: "code-authoring §«Решение и его следствие разнесены» (темп производителя и применения)"
    exposure: >-
      Правило §7 «держатель действует только на такте» теперь продуктовое: выпуск — на первом
      такте не раньше «последний принятый + I», подъём feedback_route — на первом такте не
      раньше «принятие + D». Отдельный таймер на I или D внутри процесса выпустил бы письмо
      между тактами. NTF4-73/74/100/107 при I, кратном P, этого не увидят.
    condition: >-
      Выпуск контрольного письма и вычисление feedback_route стоят внутри функции такта
      держателя. Отдельных таймеров на …_CANARY_INTERVAL и …_CANARY_DEADLINE нет. Таймер
      независимого продления аренды (CX4T-02) — единственный таймер вне такта, и решений о
      выпуске и признаке он не принимает.
    held_by: "вниманием; проба «I не кратно P: выпуск на такте, а не в t0 + I» — заказ (пример нарушения С1 в Given NTF4-107 готов стать её входом)"
  - id: CX4T-46
    decision: [D31]
    class: "code-authoring §«Умолчание, которое становится утверждением» (память процесса вместо состояния установки)"
    exposure: >-
      «При первом старте установки — от взятия аренды» (Р10). Если под «взятием аренды»
      понимать аренду текущего держателя, то держатели, сменяющиеся чаще I (перезапуски,
      перекат), не выпустят ни одного письма. Ожидаемого выпуска нет, feedback_route остаётся 0,
      и этот 0 утверждает «маршрут исправен», хотя его никто не проверял.
    condition: >-
      Момент отсчёта до первого принятого выпуска — первое взятие аренды установки,
      записанное в kacho_notify один раз (INSERT … ON CONFLICT DO NOTHING); смена держателя его
      не переписывает. После первого принятого выпуска — момент его принятия из той же базы.
    held_by: "сценария нет — заказ пробы «держатель сменяется каждые I/2 до первого выпуска; выпуск 1 — на первом такте не раньше первой аренды + I»"
  - id: CX4T-47
    decision: [D22, D25, D26]
    class: "запрет конструкции (норма NTF-1, узел «обход типобезопасности» гейта NTF1-B28 в одобренной редакции 13)"
    exposure: >-
      Одобренная редакция 13 NTF-1 запрещает в рукописном не-тестовом коде трёх деревьев целиком
      семь видов обхода типобезопасности (§1.8, Р7). Код NTF-4 и её испытательные двойники в
      не-тестовых пакетах (cmd/notify-probe и любые пакеты двойников П5, П7, П10 вне _test.go)
      попадают в обход kacho. Разбор MIME, DSN/ARF, подпись DKIM и разбор ответов POP3 с
      «быстрым» доступом к памяти окрасили бы гейт.
    condition: >-
      В коде NTF-4 нет ни одного из семи видов узла. Разбор и подпись — стандартная
      библиотека и внешние модули. Двойники П5, П7, П10 лежат в тестовых файлах либо тоже без
      узлов.
    held_by: "NTF1-B28 (гейт) в CI kacho"
  - id: CX4T-48
    decision: [D25, D28, D29]
    class: "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» (две под-фазы об одном процессе)"
    exposure: >-
      NTF-4 (одобрена) строит одну службу notify, где один процесс держит объект секрета почты
      (в нём ключ отпечатка, Р15, З6) и обслуживает InternalSuppressionService (Lookup по адресу
      требует ключа отпечатка) и старт с контрольным значением. Рабочая редакция 14 NTF-3
      (вердикта нет) делит notify на notify-sender (секрет почты, gRPC-слушателя нет) и
      notify-api (единственный gRPC-слушатель, секрет почты не монтирует). InternalSuppressionService
      она регистрирует на notify-api (Р8, NTF3-159). В такой раскладке у процесса, который
      обслуживает Lookup, ключа отпечатка нет. Поэтому решить придётся одно из трёх: второй
      объект секрета, что противоречит З6 и предикату NTF-2 «ровно один объект»; монтирование
      секрета почты в notify-api, что противоречит NTF-3 Р8; либо перенос сервиса на
      отправителя, у которого слушателя нет. Д17 при этом говорит «notify один». Переписи
      портов пода (NTF4-108: 2) и перечень гейта посадки тоже предполагают один deployment.
    condition: >-
      Замысел NTF-4 называет процесс, который держит ключ отпечатка и обслуживает Lookup и
      Delete, и число deployment notify. До решения диспетчера по раскладке замысел стадии S3 не
      одобряется.
    held_by: "вопрос владельцу (диспетчеру); ни одна проба NTF-4 раскладку двух deployment не создаёт"

