      - "(б) два deployment, ключ отпечатка выносится из секрета почты в отдельный объект, смонтированный в оба. Цена — новая редакция NTF-4 (Р15, З6, Р11: контрольное значение у двух процессов), правка предиката NTF-2 по составу"
