class_proposal:
  title: "Опора на соседний документ названа временным свойством («действующее одобрение»), а не неизменным фактом"
  threshold: >-
    Дважды в независимых местах: NTF-4 → NTF-1 (четвёртый возврат одного рода в этом документе,
    последний — RA-01 выше) и NTF-3 → NTF-4 (сверена с @f9bc15ad, у которой вердикт
    CHANGES_REQUESTED, при одобренных 5f564162 и 77ad7465).
  owner_by_antidote: "doc-truthfulness (как написать утверждение, которое не станет ложью); держатель — гейт, отдельной записью в gate-authoring после измерения"
  sign: "в приёмке стоит «на действующем одобрении» или «сверено с @<отпечаток>» соседа, а у соседа есть одобренная запись новее, чья фиксация — предок коммита документа"
  antidote: >-
    Опора называет неизменный факт — «одобренная редакция X, запись Y». Сверка с более
    поздними одобрениями привязывается к названному моменту контура (одобрение замысла, старт
    стадии), а не к каждому одобрению соседа.
  holder_candidate: >-
    Проверка по записям ревью: для каждого отпечатка соседа, названного в шапке приёмки, — есть
    ли у соседа запись APPROVED новее, чей коммит предок коммита документа. Проверка не
    однофайловая (читает каталог записей), кандидатом в class-guard не является.
  removal_predicate: "контур меняет правило опоры на соседа так, что момент сверки задаётся фазой контура, и проверка выше ни разу не покраснела за эпик"
  handoff: "нужен следующий: tooling-maintainer"
