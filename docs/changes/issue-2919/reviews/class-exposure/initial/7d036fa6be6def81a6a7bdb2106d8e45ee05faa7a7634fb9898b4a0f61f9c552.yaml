  D16: отказы Delete — синхронные и проигрыш гонки в Operation.error, одна запись аудита (Р18)
  D17: путь личности край → внутренний слушатель notify; notifyInternal, перечень бэкендов только изнутри в opsproxy, круг пересылающих, звено прав (Р20)
