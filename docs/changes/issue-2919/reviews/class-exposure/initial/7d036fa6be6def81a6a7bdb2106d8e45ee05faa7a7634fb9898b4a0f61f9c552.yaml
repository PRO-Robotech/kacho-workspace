  - id: CX4-21
    decision: [D1]
    class: "code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей)"
    exposure: >-
      Размер из LIST объявляет сервер, и он может не совпадать с RETR. Степень распаковки
