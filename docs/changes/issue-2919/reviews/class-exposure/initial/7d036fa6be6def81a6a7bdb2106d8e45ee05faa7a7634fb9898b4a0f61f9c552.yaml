  D1: чтение ящика обратной связи по POP3 поверх TLS исходящим соединением; разбор ограничен, сообщение удаляется, идемпотентность по дайджесту (Р1, Р14)
  D2: токен возврата — назначение, версия ключа, id строки журнала, код аутентичности; три условия применения; источник токена по виду сообщения (Р2)
  D3: своя БД kacho_notify — журнал отправленных, подавления, счётчики потолков, отметки обработанного, операции, аудит (Р3)
  D4: закрытая классификация отказа по расширенному коду, общая для DSN и синхронного ответа на RCPT (Р4)
  D5: запись подавления — причина в ключе, область как функция причины, срок, невидимость истёкшей, подметальщик; обратная связь только сужает (Р5, Р13)
  D6: List-Unsubscribe только у notice, выводится из класса шаблона в сборке (Р6)
  D7: InternalSuppressionService Get/Lookup/Delete и ресурс Suppression (Р7)
  D8: точные потолки notice — установка и адресат, CAS в БД notify, DEFER(ceiling) (Р8)
  D9: подпись DKIM notify (Р9)
  D10: проверки DNS при старте и в работе, резолвер пода, контрольное письмо маршрута возврата (Р10)
  D11: ротация — перечитывание тома секрета, слоты current/previous SMTP и POP3, смена селектора DKIM, кольцо ключа токена, контрольное значение ключа отпечатка, стратегия переката (Р11)
  D12: закрытый перечень метрик, признаки, вычисляемые notify, одна строка WARN на переход (Р12)
