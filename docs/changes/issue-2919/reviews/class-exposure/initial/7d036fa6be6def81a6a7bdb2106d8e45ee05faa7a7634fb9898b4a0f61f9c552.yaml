  - "поведение конкретного почтового сервера оператора при двух сеансах POP3 (блокировка по RFC 1939 §8 обязательна не у всех реализаций) — продукт обязан быть верен при любом, отсюда CX4-01"
  - "эквивалентность отпечатка NTF-1 и NTF-4 — у NTF-1 кода нет, редакция не одобрена"

outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-01
    items: [CX4-01]
    anchors: [Р1, Р10, Р12, П10, NTF4-15, NTF4-73, NTF4-74]
    what: >-
      две реплики и один ящик: решение «опрос ящика и контрольное письмо — одиночка установки,
      признаки установки одинаковы на всех репликах, WARN один на установку» и сценарий с
      близнецом — два экземпляра notify на одной БД и одном двойнике ящика: каждое сообщение
      применено один раз, feedback_stale = 0 у обоих, одно контрольное письмо на интервал;
      близнец — один экземпляр. П10 исполняет исключительную блокировку ящика (RFC 1939 §8) и
      отвечает второму сеансу -ERR, иначе двойник снисходительнее настоящего сервера. В NTF4-15 на
      П1 (две реплики) названо, с какого пода читается признак и считается строка WARN.
  - id: RA-02
    items: [CX4-02]
    anchors: [Р2, Р10, Р12, NTF4-69, NTF4-73, NTF4-74]
    what: >-
      Р2 закрывает назначения токена двумя (b, u), а Р10 выпускает c; классификатор вида
      сообщения c не знает (по тексту это unparsed); у контрольного письма нет строки журнала,
      хотя токен её несёт; у result="canary" нет значения метки kind в закрытом перечне. Нужна
      правка Р2 и Р12 и утверждение в NTF4-74 о kind и о том, что повтор прежнего контрольного
      письма метку успеха не двигает.
  - id: RA-03
    items: [CX4-17, CX4-18]
    anchors: [Р11, NTF4-58, NTF4-62, NTF4-63, NTF4-72]
    what: >-
      закрытые перечни Р11 без клеток: (а) временный отказ DNS при проверке нового селектора во
      время перечитывания — это не одна из трёх причин отказа перезагрузки, и исход не назван;
      (б) для POP3 не названо, какой ответ на вход считается отказом пароля (переход на
      previous), а какой — временным ([IN-USE], [SYS/TEMP], -ERR без кода). Нужны клетки и хотя бы
      сценарий «занятый ящик не переключает слот» с близнецом NTF4-62.
  - id: RA-04
    items: [CX4-23]
    anchors: [Р3, Р16, "DoD S1 п.2", "DoD S1 п.5", §8]
    what: >-
      при закоммиченной NTF-1 базу kacho_notify заводит NTF-4, но закрытый перечень Р16 (30)
      не содержит ручек подключения к ней (адрес, sslmode, удостоверение), а §8 не называет
      поставщика базы в чарте и посадочные оси (sslmode=require у стража старта, pg_stat_ssl в
      assert-production-posture). Нужно назвать владельца этих ручек (NTF-1 или NTF-4) и, если
      NTF-4, дописать их в перечень с границами и держателем.
  - id: RA-05
    items: [CX4-27]
    anchors: [§1, Р3, Р8, Р15, Р17, "§3.1 Д11", З9]
    what: >-
      приёмка ссылается на NTF-1 номерами (NTF1-G16, NTF1-G21, Р22, словарь из шести исходов),
      не закрепив отпечаток редакции NTF-1. Рабочая редакция NTF-1 (a6cb0c…) их перенумеровала и
      заводит те же оси потолков и тот же ключевой хеш адреса в kacho_notify. Нужно: закрепить в §1
      отпечаток редакции NTF-1, на которой стоит Given; как только NTF-1 одобрят с базой и
      CAS-сеткой, свести Р8 и Р15 с NTF-1 в один механизм (одна таблица окон, один отпечаток, одни
      причины отсрочки) и переписать базовый словарь Р17 и ссылки З9.

orders:
  - to: автор проб notify (исполнитель NTF-4)
    what: >-
      пробы: токен в нижнем регистре применяется (CX4-03); отложенные попытки и повтор после
      обрыва аренды не растят знаменатель (CX4-05); CHECK подавления — отказ 23514 (CX4-07);
      истёкшая запись и новое событие → новый id, applied (CX4-08); повторная доставка DSN с
      другими заголовками засчитывается один раз (CX4-09); пустой suppressionId (CX4-11); сбой
      терминальной записи операции после коммита снятия (CX4-12); возврат слота потолка при
      отказе до DATA (CX4-13); источник объявляет security у шаблона notice (CX4-14); переключение
      ..data посреди чтения (CX4-17); POP3 [IN-USE] без смены слота (CX4-18); источник отвергает
      SUPPRESSED → SMTP-сессий 0 (CX4-24); повтор прежнего контрольного письма (CX4-02)
    basis: "code-authoring §§ по пунктам; testing §«Гейт на класс…» п.1"
  - to: автор проб notify
    what: "двойник П7 отдаёт запись DKIM несколькими строками TXT; двойник П10 исполняет блокировку ящика"
    basis: "gate-authoring §«фикстура не снисходительнее продукта»"
  - to: tooling-maintainer
    what: >-
      кандидаты в однофайловые предикаты: now()/CURRENT_TIMESTAMP в SQL службы с управляемыми
      часами (CX4-10); вызов ключевого хеша адреса вне одной функции (CX4-04); ручка адреса
      внутреннего бэкенда края с envconfig-умолчанием (CX4-25)
    basis: ".claude/hooks/class-guard/README.md §«Как добавить предикат» — оба близнеца из дерева; сейчас в notify кода нет, отрицательного близнеца в дереве нет — заводить после посадки NTF-4"
