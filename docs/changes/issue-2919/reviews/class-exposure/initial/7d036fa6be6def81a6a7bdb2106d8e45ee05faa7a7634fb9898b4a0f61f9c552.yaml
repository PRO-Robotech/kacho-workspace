    held_by: "нужна проба «строка источника объявляет security у шаблона класса notice», заказ; NTF1 — строка «класс не разрешён пространству → INVALID»"
  - id: CX4-15
    decision: [D9]
    class: "code-authoring §«Порядок операций внутри кода»"
    exposure: "подпись сверяется с байтами, которые ушли; любая правка заголовков или тела после подписи ломает её молча"
    condition: >-
      подпись ставится последним шагом над окончательными заголовками (Message-ID, List-Unsubscribe,
