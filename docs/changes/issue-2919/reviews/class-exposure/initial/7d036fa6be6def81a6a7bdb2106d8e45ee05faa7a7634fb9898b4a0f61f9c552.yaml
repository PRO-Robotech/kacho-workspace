    held_by: "NTF4-41, NTF4-70 (сквозные на П1)"
  - id: CX4-16
    decision: [D10]
    class: "code-authoring §«Чужой ответ: классификация и бюджет»"
    exposure: >-
      Ответ DNS бывает трёх родов: отсутствие (NXDOMAIN, NODATA), временный отказ (SERVFAIL,
      тайм-аут, REFUSED) и несколько записей. Запись DKIM с ключом RSA 2048 длиннее 255 октетов и
      поэтому всегда приходит несколькими строками TXT. Выравнивание требует организационного
      домена, то есть списка публичных суффиксов. Для временного отказа при перепроверке в работе
      исход не назван.
    condition: >-
      закрытая таблица родов ответа DNS без корзины «прочее»: отсутствие — немедленное
      нарушение; временный отказ — повтор до KACHO_NOTIFY_DNS_BOOT_DEADLINE; несколько записей
      DKIM на селекторе или несколько v=DMARC1 — нарушение; строки одной записи TXT склеиваются
      без разделителя (RFC 6376 §3.6.2.2); rua разбирается с суффиксом размера; организационный
      домен вычисляет одна функция на golang.org/x/net/publicsuffix (x/net v0.58.0 уже в go.mod
      kacho); исход временного отказа при перепроверке назван в замысле, и признак dns_posture
      от него не мигает.
    held_by: "NTF4-42…NTF4-49; двойник П7 обязан отдавать запись DKIM несколькими строками TXT — иначе проба снисходительнее продукта (заказ автору проб)"
  - id: CX4-17
    decision: [D11]
    class: "code-authoring §«Порядок операций внутри кода»; §«Решение и его следствие разнесены»"
    exposure: >-
      Кубелет подменяет символическую ссылку ..data атомарно, но чтение файлов по одному через
      ссылку может собрать набор из двух поколений. Проверка нового селектора DKIM в DNS при
      перечитывании может упасть временно, а закрытый перечень причин отказа перезагрузки (три)
      такого исхода не знает.
    condition: >-
      перечитывание разрешает ..data один раз и читает все файлы из разрешённого каталога;
      поколение — разрешённая цель или дайджест набора; набор собирается в неизменяемую
      структуру, проверяется целиком (разбор, DKIM в DNS, контрольное значение ключа отпечатка) и
      подменяется одним атомарным указателем; каждое SMTP- и POP3-соединение фиксирует набор при
      установке соединения; исход временного отказа DNS при перечитывании назван приёмкой
      (RA-03).
    held_by: "NTF4-71, NTF4-72, NTF4-77, NTF4-58/59; смешанное поколение — нужна проба «переключение ..data посреди чтения», заказ"
  - id: CX4-18
    decision: [D11]
    class: "code-authoring §«Чужой ответ: классификация и бюджет»"
    exposure: >-
      Р11 называет для SMTP только код 535. У POP3 в базовом протоколе кодов нет: -ERR на PASS
      бывает и неверным паролем, и занятым ящиком ([IN-USE], RFC 2449), и временным сбоем
      ([SYS/TEMP]). Если переходить на previous по любому -ERR, то занятый ящик (CX4-01) поднимет
      rotation_incomplete. Попытка current на каждом новом соединении во время ротации удваивает
      число неудачных входов и может заблокировать учётку у поставщика.
    condition: >-
      закрытая таблица ответов входа по протоколу: SMTP 535 → previous; 454 и прочие 4xx →
      временный сбой, слот не меняется; POP3 -ERR [AUTH] → previous; [IN-USE] и [SYS/TEMP] →
      временный сбой; исход -ERR без кода назван приёмкой (RA-03); у повторной попытки current
      после успеха previous есть бюджет, названный в замысле.
    held_by: "NTF4-53…NTF4-55, NTF4-62, NTF4-63; POP3 [IN-USE] без смены слота — нужна проба на П10, заказ"
  - id: CX4-19
    decision: [D11]
