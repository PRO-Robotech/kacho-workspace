items:
  - id: CX4-01
    decision: [D1, D10, D12]
    class: "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; code-authoring §«Решение и его следствие разнесены» (общий счётчик)"
    exposure: >-
      notify работает в ≥2 репликах (NTF-1). POP3 по RFC 1939 §8 даёт сеансу исключительную
      блокировку ящика, и второй сеанс получает -ERR. Если каждая реплика опрашивает ящик сама, то
      у неуспевшей реплики не растёт своя метка последнего успешного опроса, она поднимает
      feedback_stale, а каждая реплика ещё и шлёт своё контрольное письмо. Признаки установки
      (feedback_stale, feedback_route, hard_bounce_rate, complaint_rate) расходятся по подам, и
      «одна строка WARN на переход» становится одной на под.
    condition: >-
      (а) опрос ящика и выпуск контрольного письма исполняет одиночка установки: аренда в
      kacho_notify (строка держателя со сроком, CAS) либо advisory-lock; не-держатель POP3 не
      открывает и контрольного письма не шлёт; (б) признаки установки и метки времени
      last_success вычисляются из состояния kacho_notify, и значение одинаково на всех репликах;
      (в) переход признака 0→1 фиксируется CAS строки состояния признака, и WARN пишет только
      выигравший CAS; (г) выпущенное и ожидаемое контрольное письмо хранится в kacho_notify, а не
      в памяти реплики, выпустившей его.
    held_by: "нужен сценарий (вернуть в приёмку, RA-01) и проба с двумя экземплярами notify на одной БД и одном двойнике ящика — заказ"
  - id: CX4-02
    decision: [D2, D10, D12]
    class: "code-authoring §«Контракт, который нельзя выразить» (закрытый перечень входных поверхностей)"
    exposure: >-
      Р2 закрывает назначения токена двумя значениями (b, u), а Р10 выпускает токен назначения c.
      Классификатор вида сообщения из Р2 контрольного письма не знает: по его тексту письмо на
      адрес с токеном c — unparsed. У контрольного письма нет строки журнала, а токен по Р2 несёт
      её id. Метка kind у result="canary" значения в закрытом перечне Р12 не имеет.
    condition: >-
      назначения токена — одно перечисление {b, u, c} в одном месте, и код аутентичности
      покрывает назначение; токен c вместо id строки журнала несёт номер выпуска контрольного
      письма; вид c распознаётся до ветки unparsed; засчитывается только ожидаемое контрольное
      письмо (последнее выпущенное и ещё не полученное, CX4-01 (г)), а повтор прежнего метку
      успеха не двигает.
    held_by: "NTF4-73, NTF4-74 — после правки приёмки (RA-02); повтор прежнего контрольного письма — нужна проба, заказ"
  - id: CX4-03
    decision: [D2]
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    exposure: >-
      Токен приходит в локальной части адреса, и промежуточный узел может перевести её в нижний
      регистр. Токен несёт версию ключа, которой в кольце может не быть, а длина из входа
      произвольна. ns в коде аутентичности есть, а в самом токене его нет.
    condition: >-
      разбор токена: проверка постоянной длины до декодирования; регистр приводится до сверки
      кода; сверка кода — за постоянное время; неизвестная версия ключа, неверная длина и неверный
      алфавит → bad_token без паники; ns и шаблон берутся из строки журнала, а не из сообщения;
      постоянная длина ≤ 48 октетов держится константой с пробой.
    held_by: "NTF4-02, NTF4-12, NTF4-61; свойство «токен в нижнем регистре применяется» (Р2) сценария не имеет — нужна проба, заказ"
  - id: CX4-04
    decision: [D2, D13]
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    exposure: >-
      Адрес нормализуется и превращается в отпечаток на семи путях: проверка подавления при
      отправке, строка журнала, Final-Recipient DSN, Original-Rcpt-To ARF, From письма отписки,
      Lookup, ключ потолка адресата. Final-Recipient бывает типов rfc822 и utf-8 (RFC 6533), а
      IDNA — в нескольких профилях. Два нормализатора молча разводят подавление и отправку.
    condition: >-
      одна функция нормализации и отпечатка, и все семь путей зовут её; профиль IDNA назван в ней
      одной; неразбираемый адрес — ошибка (recipient_mismatch, либо INVALID_ARGUMENT на Lookup), а
      не отпечаток сырой строки; тип адреса в Final-Recipient — закрытый набор {rfc822, utf-8},
      иначе unparsed.
    held_by: "NTF4-23, NTF4-03, NTF4-78; единственность функции держится вниманием — кандидат в AST-гейт (вызовы ключевого хеша адреса вне одной функции)"
  - id: CX4-05
    decision: [D3, D12]
    class: "code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      Строку журнала надо создать ДО SMTP-сессии: её id нужен токену в MAIL FROM. Значит, строка
      появляется и у письма, которое не ушло (DEFER, разрыв, 535), и у повтора после обрыва
      аренды. Если знаменатель долей Р12 — это «строки журнала», он раздут, и доля отказов
      занижена.
    condition: >-
      повтор строки ленты переиспользует ту же строку журнала: UNIQUE по (ns, id строки ленты), и
      Message-ID детерминирован по NTF-1; отметка «отправлено» ставится только по 250 на DATA;
      знаменатели долей считают только отмеченные строки; контрольное письмо в журнал не пишется.
    held_by: "NTF4-64, NTF4-65 (частично); «отложенные попытки и повтор после обрыва аренды знаменатель не растят» — нужна проба, заказ"
  - id: CX4-06
    decision: [D4]
    class: "code-authoring §«Чужой ответ: классификация и бюджет»; §«Порядок операций внутри кода»"
    exposure: >-
      Классификация идёт двумя путями: DSN и синхронный 5xx на RCPT. На синхронном пути решение
      о подавлении (своя БД) и Ack источнику (чужая БД) — два разных хранилища.
    condition: >-
      одна таблица классификации и одна функция на оба пути; ветки по умолчанию, которая
      подавляет, нет; на синхронном пути запись подавления коммитится ДО Ack, и сбой Ack её не
      откатывает; повторная выдача строки после обрыва аренды даёт refreshed, а не вторую запись.
    held_by: "NTF4-05…NTF4-08; держатель корпуса образцов DoD S1 п.3"
  - id: CX4-07
    decision: [D5]
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения); §«Умолчание, которое становится утверждением»"
    exposure: >-
      Ключ уникальности (отпечаток, причина, ns, шаблон) содержит поля, пустые у всех областей,
      кроме NOTICE_TEMPLATE. Если хранить их как NULL, UNIQUE в Postgres их различает: под гонкой
      появится N записей. «Бессрочно» — это отсутствие expiresAt, а нулевое время было бы
      sentinel.
    condition: >-
      template_ns и template_name — NOT NULL, пустая строка вне NOTICE_TEMPLATE; CHECK
      (scope='NOTICE_TEMPLATE') = (template_ns<>'' AND template_name<>''); CHECK, связывающий
      причину с областью по таблице Р5; CHECK (expires_at IS NULL) = (reason IN
      ('COMPLAINT','UNSUBSCRIBE')); в proto expiresAt — поле-сообщение Timestamp, не
      заполняемое при NULL.
    held_by: "покраснеет NTF4-31 (ALL_CLASSES с пустыми полями шаблона под гонкой 8); CHECK — вниманием и интеграционной пробой на отказ 23514, заказ"
  - id: CX4-08
    decision: [D5]
    class: "code-authoring §«Решение и его следствие разнесены» (видимость против физического удаления)"
    exposure: >-
      Истёкшая запись невидима, но физически живёт до подметальщика. Upsert той же причины
      (ON CONFLICT DO UPDATE) по такой строке оживит прежний id со старым createdAt: Get(id),
      отвечавший NOT_FOUND, снова найдёт запись. Что получит новое событие — новый id или
      прежний, — будет зависеть от такта подметальщика, хотя Р5 требует, чтобы видимость от него
      не зависела.
    condition: >-
      путь конфликта считает строку с expires_at <= now отсутствующей: одна транзакция —
      удаление истёкшей строки по ключу и вставка с новым id, createdAt = now и result=applied
      (либо одно выражение с заменой id и createdAt при истёкшей строке); refreshed — только
      для действующей записи.
    held_by: "сценария нет; нужна интеграционная проба «SOFT_BOUNCE истёк, подметальщик не срабатывал, новый порог → новый id, applied» — заказ"
  - id: CX4-09
    decision: [D1, D5]
    class: "code-authoring §«Контракт, который нельзя выразить» (одно событие — два байтовых написания)"
    exposure: >-
      Идемпотентность по дайджесту байтов ловит только тот же экземпляр сообщения. DSN,
      доставленный повторно с другими трассировочными заголовками, даёт новый дайджест, и мягкий
      отказ засчитывается к порогу дважды, а жалоба дважды входит в числитель complaint_rate.
    condition: >-
      событие мягкого отказа и жалобы уникально по строке журнала (UNIQUE по id строки журнала и
      роду события); дайджест защищает от повторного чтения, а не от повторного события; отметки
      дайджестов хранятся не меньше KACHO_NOTIFY_SENT_LOG_RETENTION.
    held_by: "NTF4-10 (только тот же экземпляр); повторная доставка DSN с другими заголовками — нужна проба, заказ"
  - id: CX4-10
    decision: [D5, D7, D8, D16]
    class: "code-authoring §«Контракт, который нельзя выразить» (два источника одного значения — времени)"
    exposure: >-
      Видимость (expiresAt > now), окна потолков, окно мягких отказов, срок журнала и срок
      контрольного письма читают «сейчас». Сценарии ведут время управляемыми часами процесса
      (П9). Если хоть один запрос возьмёт now() базы, у кода окажутся два времени.
    condition: >-
      каждый предикат времени в запросах notify получает «сейчас» параметром от часов процесса;
      now(), CURRENT_TIMESTAMP и clock_timestamp() в запросах notify не встречаются; значения по
      умолчанию у колонок времени — тоже не от часов базы.
    held_by: "покраснеют NTF4-84, NTF4-21, NTF4-04, NTF4-89 (часы процесса переведены, база — нет); отсутствие now() в SQL notify — кандидат в однофайловый предикат"
  - id: CX4-11
    decision: [D7]
    class: "code-authoring §«Порядок операций внутри кода»; §«Умолчание, которое становится утверждением»"
    exposure: >-
      corevalidate.ResourceID пропускает пустую строку (api-resourceid-empty): Get или Delete с
      пустым suppressionId уйдёт в хранилище и ответит «Suppression  not found». Lookup
      возвращает repeated-поле, чей порядок объявлен. Адрес приходит во входе.
    condition: >-
      первые выражения Get и Delete — проверка «required», затем ResourceID; Lookup проверяет
      address первым выражением, фиксированными текстами без эха значения; в ответе Lookup
      ORDER BY created_at, id, и порядок назван в комментарии поля; createdAt, lastEventAt и
      expiresAt усекаются до секунды при отображении.
    held_by: "NTF4-29, NTF4-26, NTF4-33; пустой suppressionId сценария не имеет — проба на «suppression_id: required», заказ"
  - id: CX4-12
    decision: [D16, D17]
    class: "code-authoring §«Решение и его следствие разнесены»; §«Порядок операций внутри кода»"
    exposure: >-
      operations.RunSync пишет терминальный исход (MarkDone/MarkError) отдельным вызовом ПОСЛЕ
      транзакции снятия (corelib operations/worker.go). Сбой этой записи оставит снятое
      подавление с операцией done=false. Операций у notify до NTF-4 нет — сверщика операций нет
      тоже. Владелец операции — принципал из контекста (operations.OwnerFromContext). Если
      пересланный принципал не дойдёт до контекста операций, её создателем станет не
      администратор, и его опрос через край получит NOT_FOUND.
    condition: >-
      (а) снятие — одно DELETE … WHERE id=$1 AND (expires_at IS NULL OR expires_at > $now)
      RETURNING и запись аудита только при одной строке, в одной транзакции; (б) операция
      создаётся после синхронных проверок и несёт принципал, извлечённый доверенной парой
      grpcsrv; (в) в notify провязан сверщик операций, как у служб kacho, либо терминальная
      отметка входит в транзакцию снятия; (г) у каждого вызова в порт чтения есть обёртка,
      в которую проба ставит барьер (NTF4-86).
    held_by: "NTF4-24 (опрос через край краснеет при неверном владельце), NTF4-85, NTF4-86; п.(в) — нужна проба «терминальная запись упала после коммита снятия», заказ"
  - id: CX4-13
    decision: [D8]
    class: "code-authoring §«Решение и его следствие разнесены» (списание и следствие; темп производителя и применения)"
    exposure: >-
      Слот потолка списывается до SMTP, а письмо может не уйти (535, 4xx, разрыв). Тогда слоты
      утекают, и после восстановления ретранслятора notice откладываются до следующего окна
      (сравни NTF4-55: «после исправления все 15 строк → SENT»). Два потолка списываются
      по-отдельности. DEFER(ceiling) без «не раньше» заставляет реплики забирать ту же строку
      на каждом такте.
    condition: >-
      оба счётчика списываются CAS в одной транзакции, и откат идёт, если исчерпан любой;
      строка окна заводится INSERT … ON CONFLICT DO NOTHING, затем условный UPDATE … RETURNING;
      слот, за которым не последовал 250 на DATA, возвращается в своё окно (резерв → отправка →
      возврат при отказе), а утечка ограничена сбоем процесса между резервом и возвратом; пока
      потолок установки исчерпан, notice-строки не забираются до конца окна (или DEFER несёт
      «не раньше», если лента NTF-1 его принимает).
    held_by: "NTF4-34, NTF4-39 (атомарность); возврат слота — нужна проба «ретранслятор отказывает до DATA K раз при потолке N, после восстановления в том же окне ушло N», заказ; темп — вниманием"
  - id: CX4-14
    decision: [D5, D6, D8]
    class: "code-authoring §«Контракт, который нельзя выразить» (одно значение — один источник)"
    exposure: >-
