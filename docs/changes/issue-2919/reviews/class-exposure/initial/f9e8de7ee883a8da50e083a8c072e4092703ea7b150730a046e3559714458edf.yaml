      обнаружением обрыва соединения сервером, срок аренды — нет; состояние выпуска и признаков
      переживает смену держателя), но он не записан, и следующий автор заведёт третий механизм.
    condition: >-
      замысел записывает сравнение с singlepass и причину второго механизма; аренда либо остаётся
      частной для notify, либо, если она общего назначения, ложится в corelib рядом с singlepass с
      указанием в документации пакета, когда какой брать; своего advisory-замка notify не заводит.
      Если замысел найдёт, что singlepass достаточно, это правка приёмки (ручка LEASE_TTL осталась
      бы без читателя).
    held_by: "вниманием замысла и design-reviewer"

