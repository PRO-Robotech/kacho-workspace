items:
  - id: CX4R-01
    decision: [D19, D3]
    carried_from: [CX4-01]
    class: "code-authoring §«Решение и его следствие разнесены»; §«Контракт, который нельзя выразить» (два источника одного значения — часы разных реплик)"
    exposure: >-
      Р3 требует решать истечение аренды по часам процесса, а у каждой реплики свои часы.
      Реплика с часами, ушедшими вперёд, видит аренду истёкшей и берёт её, пока прежний держатель
      считает себя действующим. Р21 утверждает, что двух держателей не бывает, но сравнение сроков
      это держит только при согласованных часах. Решение «я держатель» и его следствия (фиксация
      результата сообщения, DELE, выпуск контрольного письма, метка последнего опроса) разнесены
      по времени.
    condition: >-
      (а) строка аренды несёт номер эпохи, который растёт при каждом взятии; (б) каждая запись,
      которую делает держатель (результат сообщения и отметка дайджеста, выпуск номера
      контрольного письма, метка последнего успешного опроса), идёт в транзакции с условием
      «держатель = я И эпоха = E»; ноль строк — фиксации нет, опрос прекращается; (в) DELE
      посылается только после успешной фиксации под этим условием; (г) не-держатели пробуют
      взять аренду каждым тактом опроса (иначе смена не уложится в LEASE_TTL + POLL_INTERVAL,
      NTF4-97); (д) допущение о расхождении часов реплик названо в замысле, и корректность
      состояния от него не зависит — зависит только число отказов [IN-USE].
    held_by: >-
      NTF4-95…NTF4-97 на общих управляемых часах; расхождение часов экземпляров они не создают —
      нужна проба «два экземпляра с разными управляемыми часами (сдвиг меньше и больше
      LEASE_TTL): записей 8, applied 8, duplicate 0, выпусков по одному на интервал» — заказ
  - id: CX4R-02
    decision: [D19, D1]
    class: "code-authoring §«Решение и его следствие разнесены» (темп производителя и применения)"
    exposure: >-
      Р21: «держатель продлевает аренду каждым тактом опроса». Длительность такта ничем не
      ограничена: ящик с накопленными сообщениями до KACHO_NOTIFY_FEEDBACK_MAX_MESSAGE_BYTES
      (граница 25 МиБ) каждое разбирается дольше LEASE_TTL (поставляемое 3 мин). Тогда держатель
      теряет аренду посреди такта, результат по правилу Р21 не фиксирует, следующий держатель
      начинает тот же ящик сначала — очередь не продвигается никогда, а признак feedback_stale
      поднимается как «ящик недоступен». Ни один сценарий прогресса при таком накоплении не
      утверждает.
    condition: >-
      аренда продлевается внутри такта, а не только на его границе: каждое сообщение фиксируется
      отдельной транзакцией, которая в том же условии эпохи продлевает аренду; число сообщений за
      сеанс ограничено константой кода либо выводом из существующих ручек (новой ручки перечень
      Р16 не допускает); метка последнего успешного опроса растёт после каждого зафиксированного
      сообщения, а не только в конце сеанса.
    held_by: "нужен сценарий (вернуть в приёмку, RA-02)"
  - id: CX4R-03
    decision: [D10, D2, D19]
    carried_from: [CX4-02]
    class: "code-authoring §«Умолчание, которое становится утверждением»; §«Чужой ответ: классификация и бюджет»"
    exposure: >-
      Номер выпуска контрольного письма нужен токену c до отправки, значит выпуск записывается в
      kacho_notify раньше, чем ретранслятор ответил. Если ретранслятор отказал (4xx, 5xx, разрыв,
      отказ AUTH), ожидаемым остаётся письмо, которого нет, и по истечении
      CANARY_DEADLINE поднимается feedback_route — признак «маршрут возврата сломан», хотя
      причина — отправка. Исход неотправленного выпуска приёмкой не назван: считается ли он
      выпущенным, повторяется ли до следующего интервала, поднимается ли feedback_route.
    condition: "см. RA-01; до правки приёмки код выпуска не пишется"
    held_by: "вернуть в приёмку (RA-01)"
  - id: CX4R-04
    decision: [D12, D19]
    class: "code-authoring §«Решение и его следствие разнесены» (общий счётчик); §«Умолчание, которое становится утверждением»"
    exposure: >-
      Признаки установки обязаны быть равны на всех репликах (Р12), а сценарии читают их с
      каждой реплики и считают расхождение красным. Реплики вычисляют их из базы в разные
      моменты: у темпа обновления нет ручки (перечень Р16 закрыт), и между двумя чтениями
      признак законно разный. Р12 называет только переход 0→1; если строка состояния признака
      не возвращается в 0 при выходе из нарушения, следующее нарушение перехода не даст, и
      строки WARN не будет.
    condition: >-
      (а) значение признака установки на реплике — чтение строки состояния в kacho_notify, а не
      собственное вычисление каждой реплики; вычисляет и пишет его держатель одиночки
      (либо любой, но условным обновлением); (б) темп обновления у не-держателей выводится из
      существующей ручки (KACHO_NOTIFY_FEEDBACK_POLL_INTERVAL), без новой; (в) переходы 0→1 и
      1→0 — оба условным обновлением; WARN пишет только выигравший переход 0→1; (г) проба,
      сверяющая равенство на репликах, ждёт схождения в пределах одного такта обновления, а не
      читает один раз.
    held_by: "NTF4-15, NTF4-95, DoD S7 п.2а (инъекция «признак из памяти реплики»); переход 1→0 и повторное нарушение — нужна проба, заказ"
  - id: CX4R-05
    decision: [D12, D5, D1]
    carried_from: [CX4-05, CX4-09]
    class: "code-authoring §«Контракт, который нельзя выразить» (одно событие — два байтовых написания)"
    exposure: >-
      Доли Р12 теперь вычисляются из базы (признаки установки). Числитель — события отказа и
      жалобы, знаменатель — отправленные письма окна. Идемпотентность по дайджесту ловит только
      тот же экземпляр сообщения: DSN, доставленный повторно с другими трассировочными
      заголовками, даёт новый дайджест и второй раз входит в числитель и в счёт мягких отказов.
      Строка журнала заводится до SMTP-сессии (её id нужен токену), и письма, которые не ушли,
      раздули бы знаменатель.
    condition: >-
      событие отказа и жалобы уникально по (id строки журнала, род события) — UNIQUE в
      kacho_notify; числитель долей и порог мягких отказов считают эти уникальные события;
      знаменатель — строки журнала с отметкой «отправлено» (250 на DATA) в окне по часам процесса;
      повтор строки ленты переиспользует ту же строку журнала (UNIQUE по (ns, id строки ленты));
      контрольное письмо в журнал не пишется.
    held_by: "NTF4-64/65, NTF4-66/67, NTF4-10 (тот же экземпляр); повторная доставка DSN с другими заголовками и знаменатель при отложенных попытках — нужна проба, заказ"
  - id: CX4R-06
    decision: [D2]
    carried_from: [CX4-03]
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    exposure: >-
      Токен приходит в локальной части адреса, промежуточный узел может перевести её в нижний
      регистр; версия ключа из входа может отсутствовать в кольце; длина из входа произвольна.
      Назначений три, и код аутентичности покрывает назначение.
    condition: >-
      разбор токена — одна функция на три назначения: постоянная длина проверяется до
      декодирования; регистр приводится до сверки; сверка кода аутентичности — за постоянное
      время; неизвестная версия ключа, неверная длина или алфавит → bad_token без паники;
      назначение читается из проверенного токена и выбирает ветку (b, u — строка журнала; c —
      номер выпуска); ns и шаблон — из строки журнала.
    held_by: "NTF4-02, NTF4-12, NTF4-61, NTF4-100; «токен в нижнем регистре применяется» (Р2) сценария не имеет — нужна проба, заказ"
  - id: CX4R-07
    decision: [D13, D8]
    carried_from: [CX4-04]
    class: "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»; code-authoring §«Контракт, который нельзя выразить»"
    exposure: >-
      Отпечаток адреса теперь ключует ещё и сетку NTF-1 (З11), а сетку реализует другое
      изменение (NTF-1), чья закреплённая редакция называла ключ «HMAC адреса ключом notify» без
      нормализации. Если NTF-1 сядет первой со своей функцией, у notify окажутся две функции
      отпечатка, и подавление с сеткой молча разойдутся по одному адресу. Адрес нормализуется на
      восьми путях: проверка подавления при выдаче, строка журнала, ключ сетки, Final-Recipient,
      Original-Rcpt-To, From отписки, Lookup, запись подавления.
    condition: >-
      одна функция нормализации и отпечатка в одном пакете notify, и её зовут и сетка NTF-1, и
      все пути NTF-4; если NTF-1 посажена со своей функцией, NTF-4 её заменяет, а не добавляет
      вторую (прода нет, Д12 — прямое переключение); профиль IDNA назван в ней одной;
      неразбираемый адрес — ошибка, а не отпечаток сырой строки; тип адреса Final-Recipient —
      закрытый набор {rfc822, utf-8}.
    held_by: "NTF4-23, NTF4-101/102 (строка сетки найдена по отпечатку Р15), NTF4-03, NTF4-78; единственность функции — кандидат в AST-гейт (вызов ключевого хеша адреса вне одной функции)"
  - id: CX4R-08
    decision: [D8, D15]
    carried_from: [CX4-24]
    class: "code-authoring §«Порядок операций внутри кода»; §«Чужой ответ: классификация и бюджет»"
    exposure: >-
      Строка notice, отложенная сеткой (DEFER(recipient_net)) или сбоем (platform_unavailable),
      выдаётся снова позже; подавление, появившееся между выдачами, обязано сработать на повторе.
      Источник на старом corelib (kaname — отдельная посадка со своим пином, Х4) отвергнет
      Ack(SUPPRESSED); если после этого письмо уйдёт, подавление не сработает.
    condition: >-
