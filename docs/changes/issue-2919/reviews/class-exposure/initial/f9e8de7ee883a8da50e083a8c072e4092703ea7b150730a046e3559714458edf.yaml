outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-01
    items: [CX4R-03]
    anchors: [Р2, Р10, Р12, NTF4-73, NTF4-74, NTF4-100]
    what: >-
      исход контрольного письма, которое не ушло: номер выпуска нужен токену до отправки, а
      ретранслятор может отказать (4xx, 5xx, разрыв, отказ входа). Приёмка не называет, считается
      ли такой выпуск ожидаемым, повторяется ли он до следующего интервала и поднимается ли
      feedback_route; по тексту Р10 признак маршрута поднимется от сбоя отправки. Нужно решение
      (например: ожидаемый выпуск — последний, принятый ретранслятором ответом 250 на DATA; срок
      ожидания — от этого момента; неотправленный выпуск повторяется следующим тактом и
      feedback_route не поднимает) и сценарий с близнецом NTF4-74: П5 отказывает контрольному
      письму — feedback_route = 0, applied +0, после восстановления П5 выпуск доходит.
  - id: RA-02
    items: [CX4R-02]
    anchors: [Р21, Р16, NTF4-95, NTF4-97, П10, П9]
    what: >-
      прогресс чтения ящика, когда такт дольше срока аренды. Р21 продлевает аренду «каждым тактом»
      и запрещает фиксацию без действующей аренды; при накоплении сообщений такт длиннее
      LEASE_TTL, и очередь не продвигается ни при одном держателе. Нужно решение (продление внутри
      такта с фиксацией каждого сообщения) и сценарий с близнецом NTF4-95: П10 уложено K
      сообщений, разбор которых на управляемых часах занимает больше LEASE_TTL (П10 переводит часы
      на RETR — управляемый факт), — все K применены, держатель один, duplicate 0; близнец — K
      сообщений в пределах срока.

