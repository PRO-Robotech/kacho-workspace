      прочие три одобрения NTF-1 (530e2296, b347b81f, d524e7bd) → 1. Записей, тронутых более
      чем одним коммитом, 11 из каталогов NTF-1/2/3/5, коммиты 189f2ad86 и 93b67a28d, правки
      verdict/sha256/round в них 0. Одобренная запись NTF-3 0478263a: добавлена 0f38646d1,
      последний коммит 189f2ad86 (CX4U-49, RA-01).
  - claim: "исход сверки соседей на ревизии этой записи (упреждающий замер для замысла)"
    command: >-
      перечень APPROVED с коммитом добавления по каталогам NTF-1, NTF-2, NTF-5;
      git merge-base --is-ancestor dbcd30a81 76953430f; sha256sum <NTF-5> по версиям;
