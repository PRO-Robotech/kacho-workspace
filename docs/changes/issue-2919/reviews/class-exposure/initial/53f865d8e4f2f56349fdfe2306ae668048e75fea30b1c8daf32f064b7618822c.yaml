  # --- новые решения редакции 18 ---
  - id: CX4U-49
    decision: [D32]
    class: "measurement-discipline §«Предикат — только с контролем»; code-authoring §«Инвариант и оснастка — это тоже прод-код» (правило, которое документ вводит для своих исполнителей, — тоже инструмент)"
    exposure: >-
      Правило опоры §1 называет предикат «более позднего одобрения»: запись с verdict: APPROVED,
      чей коммит — потомок коммита закреплённой записи (`git merge-base --is-ancestor
      <закреплённая> <запись>` → 0). Замер на каталогах записей эпика показывает три места, где
      предикат отвечает не то, что правило имеет в виду. (1) Сама закреплённая запись проходит
      предикат: is-ancestor коммита самого себя → 0 (NTF-1: 05828e42 @46e2a3819 → 0). Исход (а)
      «таких записей нет» буквальным прогоном недостижим. (2) «Коммит записи» не определён, а
      записи получают более одного коммита: 11 записей NTF-1/2/3/5 тронуты санитарными
      коммитами 189f2ad86 и 93b67a28d (вердикт не менялся). Среди них одобренная запись NTF-3
      0478263a: добавлена коммитом 0f38646d1, последний коммит — 189f2ad86. Если под коммитом
      понимать последний, санитарная правка старого одобрения делает его «более поздним».
      Утверждение §1 «записи ревью только дописываются» на ревизии документа неверно. (3) Для
      NTF-3 закреплённой записи нет: Р6 опоры на её текст не делает, но отсылает сверку
      «более поздних одобрений NTF-3» к правилу §1, а у предиката для NTF-3 нет якоря.
    condition: >-
      Условие на замысел (кода у D32 нет). (а) Раздел сверки соседей в design.md на каждого
      соседа (NTF-1, NTF-2, NTF-5; NTF-3 — по решению RA-01) называет: команду, коммит
      ДОБАВЛЕНИЯ каждой записи (`git log --diff-filter=A --format=%h -- <запись>`), исключённую
      закреплённую запись, исход (а)/(б)/(в) и отпечаток проверенной записи. (б) Исход (в)
      подкрепляется сравнением текста строк, на которых стоит NTF-4, между двумя одобренными
      редакциями (для NTF-5 — Р7 и NTF5-78…80, замер ниже). (в) Исход сверки при старте каждой
      стадии пишется в пакет по одной координате, названной в замысле. Приёмка её не называет.
    held_by: "вниманием автора замысла и design-reviewer; машинного держателя нет (кандидат — class_proposal записи на 77ad7465, адресат tooling-maintainer); предикат — RA-01 ниже"
  - id: CX4U-50
    decision: [D33]
    class: "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» (норма и приёмка об одном ребре)"
    exposure: >-
      Красное poly-edge-gateway-notify — защитное утверждение: край не должен достигать
      процесса с кредами почты. При одном notify (Д17) его буквальная правка («снять красное»)
      снимает и защиту, хотя в Р20 NTF-4 её место занимают другие свойства: у notify нет
      публичного слушателя, на ребре край→notify нет вызова отправки, край — единственный
      вызывающий. Если строку перепишут отдельно от этих свойств, правило перестанет называть
      наблюдаемый признак нарушения. Если не перепишут, S3 по DoD п.9 не стартует.
    condition: >-
      (а) Замысел S3 называет, какими свойствами Р20 заменяется красное строки при одном
      процессе. Каждое свойство — с наблюдаемым признаком: в перечне методов, которые край
      маршрутизирует в notify, нет метода отправки; notify не регистрирует публичный слушатель
      (NTF4-108: форма internal_only). (б) Правка строки правила идёт одной задачей с решением
      Q-01. Если выбран вариант с двумя deployment, в силе остаётся нынешнее красное, и
      переписывается Р20 NTF-4, а не правило.
    held_by: "DoD S3 п.9 (вниманием: пункт пройден, когда строки правила на ревизии посадки S3 не противоречат Р20 и Д17); NTF4-108/109 — форма слушателя; метода отправки на ребре край→notify держатель не проверяет — заказ"

