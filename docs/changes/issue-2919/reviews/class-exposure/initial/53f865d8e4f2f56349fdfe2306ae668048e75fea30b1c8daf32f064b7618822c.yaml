outcome: вернуть-в-приёмку
return_to_acceptance:
  - id: RA-01
    items: [CX4U-49]
    anchors: ["§1 «Правило опоры на соседний документ»: абзац о записях ревью и абзац «Предмет сверки»", "Р6 (сверка более поздних одобрений NTF-3)"]
    what: >-
      Предикат, который приёмка вводит для сверки соседей, в трёх местах отвечает не то, что
      имеет в виду правило, и одно утверждение о дереве неверно на ревизии документа.
      (1) Закреплённая запись проходит предикат сама (is-ancestor от самого себя → 0), и исход
      (а) буквальным прогоном недостижим. Закреплённую запись нужно исключить явно. (2) «Коммит
      записи» не определён. Фраза «записи ревью только дописываются» опровергнута замером:
      11 записей эпика тронуты санитарными коммитами 189f2ad86 и 93b67a28d. Вердикт при этом не
      менялся, так что верна только вторая половина фразы: «исход не меняется». Нужно назвать
      коммит добавления (`git log --diff-filter=A`), а утверждение сузить до того, что
      измерено: вердикт и отпечаток опубликованной записи не меняются. (3) Р6 отсылает сверку
      более поздних одобрений NTF-3 к правилу §1, а якоря для NTF-3 нет: закреплённой записи
      NTF-3 нет, и единственное одобрение NTF-3 (0478263a) добавлено раньше всех закреплённых.
      Нужно либо назвать якорь, либо сказать, что сверка NTF-3 идёт через опору на NTF-5 и
      отдельного предиката не имеет. Правка — один абзац §1 и одна фраза Р6. Сценариев и
      ручек она не меняет.
      Этот возврат — пятый того же рода. Цена здесь меньше, чем у RA-01 на 77ad7465: без правки
      сверка в момент замысла дала бы исход (б) вместо (а) на каждом соседе. Ложного одобрения
      это бы не дало, но заставило бы сверять строки ни с чем. Порядок решает диспетчер. Можно
      одобрить редакцию 19 кругом, ограниченным §1 и Р6.

questions_to_owner:
  - id: Q-01
    items: [CX4U-48, CX4U-50]
    question: >-
      Раскладка notify: один deployment (Д17 «notify один», NTF-4 Р15/Р20/З6, NTF4-108, DoD S3
      п.9 редакции 18) или два — notify-sender и notify-api (NTF-3 Р8, вердикта нет; строка
      poly-edge-gateway-notify правила polyrepo)? Вопрос тот же, что в записи на 77ad7465, варианты
      (а)–(в) там. Новое: норма в правиле закрепляет вариант с двумя deployment, и посадка S3
      (DoD п.9) без решения не стартует.
    recommendation: "решить до одобрения замысла стадии S3 NTF-4 и до следующего круга NTF-3; правка строки правила и приёмки NTF-3 — одной задачей после решения"

