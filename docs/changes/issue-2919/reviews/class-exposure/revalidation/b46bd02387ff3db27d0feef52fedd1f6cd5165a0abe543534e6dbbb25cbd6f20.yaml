questions_to_dispatcher:
  - >-
    CX4V-63 (б), Е7 замысла. Вопрос тот же, что в пересверке cd92e9ac. Одобрению сноса ограды нужен
    путь в init-контейнер `migrate` обоих развёртываний notify. Варианты: (1) один ключ values
    чарта notify, который рендерит `MIGRATOR_DROP_APPROVED` в `env` контейнера `migrate`, с
    рендер-пробой в S1-A8; (2) путь Е2: NTF-1 садится без ограды, и сноса нет. Любой вариант вносит
    в замысел содержание, которое Д26 запрещает в заходе отображения. Нужно решение и разрешённый
    заход под него.
findings_outside_subject:
  - >-
    Повтор находки cd92e9ac. Во всём дереве (kacho @1d42a6728bf) инструкцию оператору «назвать
    снос в `KACHO_MIGRATOR_DROP_APPROVED` и выкатить» через чарт исполнить нельзя: ни один
    контейнер `migrate` не принимает переменных из values.
