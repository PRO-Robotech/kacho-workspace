# Экспозиция классов: пересверка (revalidation) замысла NTF-4, редакция 3.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки на редакции 1 (b9149d3c…)
# и 2 (cd92e9ac…) относятся к своим редакциям и здесь не переписываются.
# Редакция 3 — тот же заход отображения по Д26: судятся только строки отображения, которые
# пересверка cd92e9ac оставила открытыми (CX4V-63 (а), CX4V-63 (б), CX4V-64), уточнение CX4V-56 и
# дельта 20164b92e → 3afa3df54 (design.md, tasks.md, change.yaml). Прочие 62 отображения
# выдерживали, дельта их не касается.
# Проверено четыре условия:
#   (1) каждый неотображённый пункт пересверки cd92e9ac отображён, и отображение выдерживает
#       условие пункта;
#   (2) дельта не вводит нового внешнего вызова, асинхронного пути, sentinel-значения или
#       механизма без пункта;
#   (3) маркеров отсрочки нет;
#   (4) открытых решений нет.
