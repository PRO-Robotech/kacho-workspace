approval_conditions:
  - condition: "каждый неотображённый пункт пересверки cd92e9ac отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: red
    detail: >-
      Строк §11 — 65, уникальных пунктов — 65, строк Д26 — 6. CX4V-63 (а) и CX4V-64 выдерживают,
      уточнение CX4V-56 перенесено. CX4V-63 (б) не выдерживает: строка Д26 · 4 (3) прямо пишет, что
      путь значения в окружение init-контейнера `migrate` этим заходом не назван, и отсылает к
      зависимости Е7. У пункта нет ни полосы, ни условия к коду, ни пробы-держателя, которая судит
      отрендеренный чарт. Форма отображения Д26 (пункт → полоса → условие → проба) не заполнена.
  - condition: "дельта не вводит внешнего вызова, асинхронного пути, sentinel-значения или механизма без пункта (CG_CLASS_NEW_EXTERNAL_CALL, CG_CLASS_NEW_ASYNC_PATH, CG_CLASS_NEW_SENTINEL)"
    result: green
    detail: >-
      Что вносит дельта: адаптер `stdlib.OpenDBFromPool` и отдельный отказ «схема не прочитана»
      (CX4V-56, это исход уже существующей ошибки `AppliedSet`, а не новое значение); имя таблицы в
      записи стража (CX4V-63 (а)); единица сверки УК4-34 (CX4V-64); зависимость Е7 (CX4V-63 (б)).
      Каждое изменение отнесено к своему пункту. Нового внешнего вызова, таймера, ручки, ключа чарта
      или sentinel нет.
  - condition: "нет маркеров отсрочки (ban #11)"
    result: green
    detail: "`grep -noE 'TODO|TBD|FIXME|XXX'` по design.md и tasks.md — 0."
  - condition: "нет открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: red
    detail: >-
      §13 (строка 1766) пишет: «Открытых решений этого замысла нет… путь одобрения сноса (Е7) —
      решение диспетчера». По существу Е7 — это выбор из двух вариантов, и от него зависит
      содержание самого замысла. Вариант (1) добавляет ключ чарта notify и рендер-пробу в S1-A8.
      Вариант (2) — путь Е2: NTF-1 садится без ограды, и тогда нет сноса, записи dropguard.json,
      УК4-35, одобрения и страницы S1-A10. Если одобрить замысел до выбора, будет одобрено одно из
      двух содержаний, неизвестно какое. Формально предмет вынесен в зависимость, но решение
      остаётся открытым.

mapping_check:
  - id: CX4V-56
    design: "З18; Д26 · 3 (4); УК4-28 вариант (4); tasks S3-C2, §2а"
    verdict: holds
    note: >-
      Условие (4) перенесено. `RequireApplied` получает `*sql.DB` через `stdlib.OpenDBFromPool`,
      ошибка `AppliedSet` — отдельный отказ «схема не прочитана». Вариант пробы исполним:
      `GooseApplied` проверяет присутствие таблицы через `to_regclass`, а для него право на таблицу
      не нужно. Затем идёт `SELECT … FROM goose_db_version`, и при отозванном праве он отдаёт
      ошибку, а не `false` (preflight.go:88–106 @34bc810). Закрытие `*sql.DB` в строку не вошло.
      Это не дефект: закрытие `*sql.DB` пул не закрывает (pgx v5.7.5, stdlib/sql.go:220), а число
      простаивающих соединений у такого `*sql.DB` — ноль.
    code_conditions: "`RequireApplied` закрывает `*sql.DB` после сверки (к коду; пул процесса этим не закрывается)."
  - id: CX4V-63 (а)
    design: "Д26 · 4 (1), (3); §6; tasks S1-A1, §2а"
    verdict: holds
    note: >-
      Имя таблицы `recipient_key_fence` теперь совпадает с миграцией сноса и в записи, и в значении
      одобрения. Вхождений `kacho_notify.recipient_key_fence` в design.md и tasks.md — 0.
      `ParseApprovals` разбирает `<version>/<table>` через `normaliseTable`, и ключ сверки общий с
      инвентаризацией (`Approval.key` → `declKey`, preflight.go:138).
    code_conditions: "—"
  - id: CX4V-63 (б)
    design: "Д26 · 4 (3); §10 п.4; §13 Е7; tasks S1-A8, §2а"
    verdict: does_not_hold
    note: >-
      Строка честно признаёт, что пути нет. Прежнее ложное утверждение о «существующей ручке у
      init-контейнера» снято. Но пункт не отображён: полосы, условия к коду и держателя, который
      судит отрендеренный чарт, нет. Вместо них стоит запрет «до снятия Е7 S1 не выкатывается на
      базу со строкой ограды». Этот запрет ничем не держится: ни гейтом, ни пробой, ни предикатом
      полосы. S1-A8 снимается без него. Д26 запрещает вводить механизм в этом заходе, поэтому
      автор замысла закрыть пункт сам не может. Выбор из вопроса пересверки cd92e9ac за
      диспетчером, решения в задании нет.
    code_conditions: >-
      После решения диспетчера. (1) Если выбран ключ чарта: чарт notify рендерит значение ключа
      values в `env` контейнера `migrate` обоих развёртываний под именем `MIGRATOR_DROP_APPROVED`.
      Пустой ключ — переменной нет. Рендер-проба в S1-A8 судит отрендеренный init-контейнер:
      значение задано → переменная с этим значением у `migrate` обоих развёртываний; близнец —
      ключ не задан → переменной нет. (2) Если выбран путь Е2: из замысла снимаются снос, запись
      dropguard.json, УК4-35, строки одобрения в §10 и S1-A10 — тем же заходом, что и решение.
  - id: CX4V-64
    design: "З13; Д26 · 5 (5); §11а УК4-34; tasks S1-A7, §2а"
    verdict: holds
    note: >-
      Единица сверки — семейства `notify_` реестра, который строит функция сборки корня после всех
      регистраций. Ожидаемое множество — объединение Р12 и перечня NTF-1. Инъекция — регистрация в
      `sentlog`, то есть там, где жила снятая метрика. Раньше она краснела только в одной форме
      держателя, теперь краснеет в той, что названа. Перечень NTF-1 проба держит своей таблицей с
      отсылкой к З27 NTF-1. Это копия, а условие cd92e9ac просило не копировать. Но кода NTF-1 в
      стволе нет (Е6), и машинного источника перечня нет. Сверка в обе стороны покраснеет на
      расхождении с деревом в любую сторону, так что дрейф копии тихим не станет. Замысел NTF-1
      @dba7c388 называет в З27 11 семейств `notify_`. Ревью этого замысла вернуло его на
      доработку, так что перечень ещё может поменяться.
    code_conditions: >-
      Таблица семейств NTF-1 в `metricsetparity_test.go` — одна, дословно по З27 одобренной
      редакции NTF-1 (11 семейств на dba7c388), с отпечатком этой редакции в комментарии. Когда в
      стволе появится машинный перечень NTF-1, проба берёт его, а таблица снимается.

