findings:
  - id: RV12-01
    class: >-
      code-authoring §«Контракт, который нельзя выразить» (два написания одного значения; закрытый перечень,
      который не равен дереву) × security.md sec-no-silent-default-for-guarded-knob (держатель стражей ручек)
    subject: "Е14 гейтит только S3-C6н, а тот же факт дерева касается S3-C2н: Р16 «Держатель» и NTF4-119 в части загрузчика notify-api"
    blocking: true
    measured: >-
      Карточка S3-C2н (tasks.md §2б) требует «держатель Р16 в части загрузчика notify-api — десять ручек
      стадии S3 и (н1)–(н4) … шестая–девятая инъекции Р16» и сценарий NTF4-119. Одобренная приёмка ред. 29
      (Р16 «Держатель») утверждает о загрузчике каждого развёртывания три вещи, и на e6075f09c2 все три
      красные. (1) «Группы не пересекаются, и их объединение — все ручки, которые читает загрузчик»
      (grep → 1 в приёмке). В загрузчике notify-api есть две ручки NTF-5 вне (н1)–(н4) и вне S3:
      `git -C kacho grep -c 'envconfig:"KACHO_NOTIFY_NOTICE_REMINDER_LEAD"\|envconfig:"KACHO_NOTIFY_LIST_FILTER_CACHE_TTL"'
      e6075f09c2 -- services/notify/cmd/notify-api/internal/config/config.go` → 2. Тега группы у загрузчика нет
      вовсе: `grep -c 'group:"'` → 0. (2) «имена и границы (н1)–(н4) — из того же объявления, что у
      notify-sender: второго объявления ручки NTF-1 нет» (grep → 1). В дереве объявлений два:
      `git -C kacho grep -l 'envconfig:"KACHO_NOTIFY_DB_MAX_CONNS"' e6075f09c2 -- services/notify` → 2 файла, у
      каждого свои постоянные DBMaxConnsMin/Max = 1/100. Оба загрузчика читают один ключ values
      `.Values.db.maxConns`: api-configmap.yaml, строка 33, и configmap.yaml, строка 25. (3) Инъекция Р16
      «умолчание у одной ручки — красная» против загрузчика notify-api: в дереве законное умолчание NTF-5
      Р17, `grep -c 'default:"'` → 1 (ListFilterCacheTTL 5s). Е14 называет тот же факт (ручки NTF-5 в
      notify-api), но только для NTF4-117 и S3-C6н: «гейтит только утверждение об окружении в S3-C6н».
    consequence: >-
      Буквальное исполнение S3-C2н даёт одно из двух. Либо держатель Р16 красный на голове волны, и волна
      не садится. Либо держатель ослабляют без санкции приёмки: исключают загрузчик notify-api, не берут
      инъекцию «умолчание» или ручки NTF-5 снимают с загрузчика. Держатель Р16 — единственный, кто судит
      «незаданная ручка — отказ с именем, умолчаний нет» у notify-api. Его ослабление вне приёмки снимает
      покрытие стража ручек посадки и звена прав (sec-no-silent-default-for-guarded-knob). Снятие ручек
      NTF-5 ломает уже посаженный NTF-5: ручка NoticeReminderLead без умолчания, и api-configmap её
      рендерит.
    condition_on_code: >-
      (а) Маршрут: строку Е14 (tasks.md §1) расширить на S3-C2н, указав, что именно она гейтит. Это
      утверждения Р16 о группах загрузчика notify-api: объединение, единственность объявления (н1)–(н4),
      инъекция «умолчание». Это и последний And NTF4-119: «группа NTF-1 — ровно (н1)–(н4)» и три инъекции.
      В карточке S3-C2н в after и «готово, когда» — «Е14 — только для этих утверждений», так же как у
      S3-C6н. Прочее S3-C2н (замок, RequireApplied, УК4-26, NTF4-92/119 (а)–(г) по старту, NTF4-122/124)
      от Е14 не зависит. (б) Приёмка (acceptance-author тем же кругом, что NTF4-117): у notify-api
      перечень ручек загрузчика — закрытое объединение частей под-фаз (н1)–(н4) ∪ S3 ∪ NTF-5 Р17. Это
      сверка в обе стороны с `Knobs()` загрузчика, а не постоянный список. Отдельно надо решить, что
      значит «одно объявление (н1)–(н4)» при правиле Д74, на которое приёмка уже ссылается в §8, строка
      Р16. Вариант 1: загрузчик notify-api берёт имена и границы (н1)–(н4) из пакета
      services/notify/internal/config, и тогда правка входит в пути S3-C2н (`cmd/notify-api/**`).
      Вариант 2: проба сверяет имена и границы двух объявлений по каждой ручке. Без решения второе
      объявление (н3) с общим ключом values разойдётся молча. Расхождение громкое, это отказ старта
      одного развёртывания, но держателя у него сейчас нет.
    held_by: "нужен держатель: проба Р16 в новой формулировке (S3-C2н); до правки приёмки — гейт Е14 на эти утверждения"
    outcome: блокер   # для «готово» S3-C2н; старт волны Н4-О и прочие полосы не держит

  - id: RV12-02
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (держатель судит идентичность, а не имя каталога)"
    subject: "З1: регистрации «только в apiserver», а в дереве — services/notify/internal/apps/kacho/api/<ресурс>/"
    blocking: false
    measured: >-
      Граница импорта (CX4V-57) в дереве соблюдена под другим именем пакета. `go list -deps
      ./services/notify/cmd/notify` @e6075f09c2 → 0 пакетов `internal/apps/kacho/api*` и 0
      `pkg/api/kacho/cloud/notify/v1`. От `cmd/notify-api` — 17 пакетов apps и стаб notify/v1.
      Держатель — servesurface_test.go. Он судит вызовы `grpc.NewServer`, точек входа фундамента и
      `Register…Server` по идентичности go/types против ведомости корней, а имена каталогов не судит
      (шапка файла). Ни одна полоса Основы в `internal/apiserver/**` не пишет: пути S3-C2н, S3-C4н, S3-C5,
      S3-C6н, S3-C7н сверены. Затронуты только строки S3-C2 и S3-C3 после Основы.
    condition_on_code: >-
      До старта S3 после Основы автор замысла переписывает таблицу пакетов З1. Строка `apiserver`
      заменяется раскладкой NTF-5 (`internal/apps/kacho/api/suppression/…`), пути S3-C2/S3-C3 правятся
      тем же заходом. Второй корень регистраций рядом с `apps/kacho/api` не заводится. В tasks.md
      §2, абзац «Что меняется в строках §2 после Основы», производитель решения по З1 и З22 — автор
      замысла. Сверка §0 с исходом (б) ведёт к acceptance-author, а не к нему.
    held_by: "покраснеет servesurface_test.go (TestNTF1G19Injection), если регистрация станет достижима от cmd/notify; раскладку каталогов держит вниманием ревью замысла"
    outcome: к-замыслу

  - id: RV12-03
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения)"
    subject: "З22, часть замысла: «одно объявление в internal/config/knobs.go, загрузчик notify-api выбирает ручки NTF-4 закрытым перечнем из 12 постоянных пакета»"
    blocking: false
    measured: >-
      В Основе не исполняется: десять ручек S3 уже в загрузчике notify-api, S3-C2н ручек не добавляет.
      После Основы S3-C2 добавляет `…_SECRET_RELOAD_INTERVAL` и `KACHO_NOTIFY_ADDRESS_KEY_DIR`. Буквальное
      З22 — тег GroupNTF4 в internal/config — красит существующий держатель: required_knobs_test.go
      печатает «ручка стадии S3 … в группе NTF-4 загрузчика notify-sender; её читатель — notify-api (Р22)»
      (строка 673 @e6075f09c2). Отказ громкий, не молчаливый. Часть З22, которая касается Основы,
      поглощена RV12-01.
    condition_on_code: >-
      До старта S3 после Основы З22 приводится к Д74 и к §8 приёмки, строка Р16. Каждый корень объявляет
      свои ручки под `cmd/<корень>/internal/config`, имена и границы общих ручек (н1)–(н4) берутся по
      решению RV12-01 (б). Ручки S3 и NTF-5 в объявлении notify-sender не появляются.
    held_by: "покраснеет TestRequiredKnobsS1 (подпроба групп) при ручке S3 в группе notify-sender"
    outcome: к-замыслу

  - id: RV12-04
    class: "code-authoring §«Контракт, который нельзя выразить» (закрытый перечень против дерева)"
    subject: "Е14: NTF4-117 и З21 — окружение notify-api «ровно (н1)–(н4) и десять ручек S3»"
    blocking: false
    measured: >-
      Подтверждено. В api-configmap.yaml @e6075f09c2 23 переменные, KACHO_NOTIFY_NOTICE_REMINDER_LEAD → 1.
      В загрузчике 25 ручек. Сверх рендера в нём DB_PASSWORD (из секрета) и LIST_FILTER_CACHE_TTL
      (умолчание 5s, в рендере нет). В маршруте есть всё нужное: производитель, предикат снятия,
      единственный гейтируемый предмет (утверждение об окружении в S3-C6н). Механизм NTF-4 от Е14 не зависит.
    condition_on_code: >-
      Формулировка NTF4-117 для acceptance-author: имена переменных рендера notify-api равны в обе стороны
      `Knobs()` загрузчика notify-api. Из `Knobs()` исключаются ручки с источником «секрет» и ручки с
      умолчанием, которые чарт не рендерит, и каждое исключение названо. Это выводится из дерева, а не
      ведётся постоянным списком. Ручек стадии S1 и KACHO_NOTIFY_ADDRESS_KEY_DIR в рендере Основы нет.
    held_by: "нужен гейт: рендер-гейт NTF4-117 (S3-C6н) в новой формулировке; до неё — Е14"
    outcome: вернуть-в-приёмку

