#
# Запись привязана к отпечатку ЗАМЫСЛА. Пересверки на редакции 1–6 (b9149d3c…, cd92e9ac…,
# b46bd023…, 72f13d01…, 80dea362…, 1a5cf53f…) относятся к своим редакциям и здесь не
# переписываются. Редакция 7 отвечает на пересверку 1a5cf53f (CX4V-66, CX4V-67) и её заказы.
# Судится дельта 832cc05ee → ac0cc65a5 (design.md, tasks.md, change.yaml) и то, что она вносит.
# Прочие 65 отображений выдерживали в 1a5cf53f, и дельта их не касается.
#
# Проверено четыре условия:
#   (1) каждый неотображённый пункт пересверки 1a5cf53f отображён;
#   (2) дельта не вводит внешнего вызова, асинхронного пути, sentinel-значения или механизма без
#       выдерживающего отображения;
#   (3) маркеров отсрочки нет;
#   (4) открытых решений нет.
# Все четыре — зелёные.
