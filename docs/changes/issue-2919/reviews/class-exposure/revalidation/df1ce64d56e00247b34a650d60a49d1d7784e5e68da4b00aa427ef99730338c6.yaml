    result: green
    detail: >-
      В 1a5cf53f `unmapped: [CX4V-67]`. CX4V-67 отображён строкой §11 и строкой Д26 · 7 (3) с
      выбранным вариантом (а) и держателем УК4-38 с близнецом «`250` позже LEASE_TTL»; отображение
      выдерживает (mapping_check). CX4V-66 получил строку §11 и условия Д26 · 7 (5)–(7). Строк §11 —
      67, уникальных пунктов — 67, строк Д26 — 9.
  - condition: "дельта не вводит внешнего вызова, асинхронного пути, sentinel-значения или механизма без выдерживающего отображения (CG_CLASS_NEW_EXTERNAL_CALL, CG_CLASS_NEW_ASYNC_PATH, CG_CLASS_NEW_SENTINEL)"
