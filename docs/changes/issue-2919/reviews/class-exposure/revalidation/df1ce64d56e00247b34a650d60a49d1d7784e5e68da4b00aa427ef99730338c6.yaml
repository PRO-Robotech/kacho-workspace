    detail: >-
      Новых внешних вызовов нет: canary.Send существовал, у него сужен срок. Новых асинхронных
      путей нет: условия (5)–(6) ограничивают уже названную горутину сеанса (ожидание выхода,
      признак на выходе), а не заводят новую. Sentinel-значений нет: срок вышел — существующий
      исход `not_accepted`; отмена родителя в dnscheck — не исход, а прекращение. Новых ручек нет:
      строка §8 `canary.AttemptTimeout` выводится из двух существующих ручек одной функцией.
  - condition: "нет маркеров отсрочки (ban #11)"
