    detail: >-
      §13: «Открытых решений нет». Е1–Е6 — зависимости с предикатом снятия, как в 1a5cf53f.

mapping_check:
  - id: CX4V-67 — срок попытки контрольного письма против срока аренды
    design: "З12 «срок попытки против срока аренды»; §8; §3 И24; Д26 · 7 (3); УК4-38; tasks S5-D3"
    verdict: holds
    exposure:
      - class: "rule-architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
        condition: >-
          Отношение названо и совпадает с соседними полосами: pop3.opTimeout ≤ LEASE_TTL / 3 (З7) и
          срок Claim NTF-1 (CX1-72). Шаг 1 продлевает аренду первым оператором, вызов кончается не
          позже LEASE_TTL / 3, шаг 3 застаёт аренду живой. Вычисление одно — в корне `cmd/notify`.
          Инвариант поднят в И24 для любого внешнего вызова держателя без продления, так что
          следующий такой вызов встанет под ту же границу. Держит УК4-38: инъекция «срок попытки =
          smtp.sessionTimeout» даёт эпоху +1 и expected_issue IS NULL — красный; близнец «`250`
          через 2 с» — accepted, эпоха та же.
      - class: "code-authoring §«Чужой ответ: классификация и бюджет» — срок доходит до каждой сетевой операции"
        condition: >-
          Граница действует, только если контекст попытки доходит до примитива `smtp.Session` NTF-1
          без подмены. NTF-1 ведёт SMTP-сессию под контекстом срока (issue-2915/design.md :1119),
          поэтому примитив срок контекста исполняет. Условие к коду: canary.Send передаёт в
          smtp.Session контекст попытки как есть — без `context.WithoutCancel`, без
          `context.Background()` и без собственного срока примитива поверх. Держит УК4-38: релей с
          ответом через 35 с при сроке 10 с даёт красный, если срок до примитива не дошёл.
      - class: "code-authoring §«Умолчание, которое становится утверждением» — названная цена"
        condition: >-
          Цена названа в З12: релей, отвечающий на DATA дольше LEASE_TTL / 3 (не меньше 10 с),
          даёт `not_accepted` на каждой попытке, feedback_route не поднимается. Прежний круг смены
          эпохи и рвущихся сеансов (1a5cf53f) снят. Остаток — один сигнал: рост
          `notify_feedback_canary_issues_total{result="not_accepted"}` (Р12) при неподвижной базе.
          Отдельного признака установки «контрольное письмо давно не принято» нет. Такой же остаток
          был и до редакции 7 у релея, отвергающего письмо, так что нового класса дельта не вносит.
          Держится вниманием оператора к ряду Р12.
    note: >-
      Вариант (б) не выбран, и довод замысла верен: (б) расширял бы асинхронный путь на время любого
      внешнего вызова, а (а) ограничивает сам вызов.
  - id: CX4V-66 — сеанс ящика вне такта
    design: "З7 п.1; З11 «жизненный цикл горутины сеанса», «уровень изоляции»; Д26 · 7 (4)–(7); УК4-37 (а)–(г); tasks S1-A3, S1-A5"
    verdict: holds
    exposure:
      - class: "rule-architecture §«Concurrency / lifecycle / читаемость»"
        condition: >-
          Все три условия пересверки 1a5cf53f приняты в замысел как написаны: контекст горутины
          производный, работа держателя ждёт выход горутин сеанса и продления, пул закрывается
          после; признак «сеанс идёт» — канал, закрываемый отложенным вызовом горутины; каждая
          транзакция держателя на запись — явный ReadCommitted. Держатели заказаны: УК4-37 (в)
          (остановка при молчащем П10) и (г) (умолчание роли `repeatable read`, 40001 — 0), прогон
          под `-race`. «Не больше одной горутины» по-прежнему держится прогоном и вниманием, гейта
          нет, это сказано в З11.
    note: >-
      Замечание к тексту из 1a5cf53f исполнено: З7 п.1 теперь говорит, что аренду перед запуском
      продлевает такт, а горутина начинает с независимого продления.
  - id: Д26 · 8 (2) — контекст RunSync
    design: "З17; Д26 · 8 (2); tasks S3-C3"
    verdict: holds
    note: "Условие 1a5cf53f принято дословно; держится вниманием рецензента, это названо в строке."
  - id: Д26 · 9 (2) — истечение своего срока против отмены родителя
    design: "З14; Д26 · 9 (2); УК4-40 второй близнец; tasks S5-D1"
    verdict: holds
    note: >-
      Признак различения назван проверяемо: `errors.Is(err, context.DeadlineExceeded)` и
      `parent.Err() == nil`. Близнец с инъекцией «отмена родителя сведена в "ответа нет"» заказан.
  - id: предикат посадки §0 tasks.md (заказ 80dea362 (г), повторён 1a5cf53f)
    verdict: holds
    note: >-
      Предикат теперь `git -C kacho log --first-parent -m --diff-filter=A …`. Контроль в обе
      стороны на kacho@1d42a67: файл, добавленный через слияние 4382f05c0a3
      (scripts/release/publish-service-artifact-probe-hermetic-inject.sh), — новый предикат
      называет слияние ствола 4382f05c0a3, старый — коммит ветки 48f5dba9c2e. Для файла,
      добавленного прямым коммитом ствола (5cfcd1aa0cc), оба предиката совпадают.

