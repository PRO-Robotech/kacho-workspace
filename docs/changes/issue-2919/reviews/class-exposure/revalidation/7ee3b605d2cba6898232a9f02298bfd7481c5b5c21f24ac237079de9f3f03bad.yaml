# Экспозиция классов: пересверка замысла NTF-4, редакция 10, дельта R9-1 (RV9-01), вместе с маршрутом
# NTF-3 редакции 19.
#
# Запись привязана к отпечатку ЗАМЫСЛА NTF-4 в рабочем дереве (не закоммичен). Пересверка 1e2562a8…
# относится к редакции 9 и здесь не переписывается. Судится дельта R9-1: §13 Е10, Е11 и §2а «Служимый
# набор носителя на посадке» замысла NTF-4; tasks.md NTF-4 §1 Е11, §2б; маршрут NTF-3
# docs/changes/issue-2918/tasks.md редакции 19 (шапка, §1 Е2, §4 строки Н3-Ф3а и Н3-Ф4).
#
# Замысел NTF-3 (docs/changes/issue-2918/design.md) не менялся: отпечаток 409f4aee… тот же, что на HEAD,
# и пересверка на него уже есть (коммит dfa879fff, к-коду). Отдельной записи по NTF-3 нет: координата
# занята свидетельством той же редакции, а новой редакции замысла NTF-3 не появилось. Правка NTF-3 этой
# дельты лежит в маршруте, и судится она здесь как предикатный факт зависимости Е11.
