approval_conditions:
  - condition: "каждый пункт пересверки 1e2562a8 отображён (CG_CLASS_ITEM_UNMAPPED)"
    result: green
    detail: >-
      Шапка редакции 10 отображает RV9-01…04 поимённо: RV9-01 → §13 Е11 и абзац «Следствие (RV9-01)» §2а;
      RV9-02 → порядок S3-C2н → S3-C7н → S2-B7 (§2а, Е11); RV9-03 → «Шаг на сведённой голове волны» §2а и
      DoD S3-C6н; RV9-04 → «Условия к коду» §2а. Таблицы «Отображение пересверки 1e2562a8» в §2а нет, в
      отличие от f9c77ef4; правило class.item-mapping судит exposure_items записей, поэтому форма прозой
      держателя не роняет. Пунктов предмета R9-1 — один (RV9-01), и он отображён.
  - condition: "предикат Е11 на внешнем факте и умеет ответить «нет»"
    result: green
    detail: >-
      Предикат «строка волны §4 маршрута NTF-3 содержит S2-B7 и S3-C6; grep -c 'до Н3-Ф4' → 0» прогнан в обе
      стороны. Рабочее дерево: строк с S2-B7 и S3-C6 — 1, 'до Н3-Ф4' — 0 → «да». HEAD 24f31fd00: 0 и 1 → «нет».
      Состояние «открыта до коммита» записано верно и одинаково в design.md и tasks.md NTF-4.
  - condition: "маршрут NTF-3 исполняет Д113 (б) без противоречия с замыслом NTF-4"
    result: green
    detail: >-
      Строка Н3-Ф3а: X5 → S3-C2н → S3-C7н → S2-B7, S3-C4н/S3-C5/S3-C6н параллельно после S3-C2н, S3-C8н
      последней на сведённой голове; один запрос волны; шаг notify-api-served-set-wave-check.sh; «после
      Н3-Ф3 (S2-B7 ждёт S2-B4)»; общий файл servesurface_ledger.go — последовательно. Это дословно то, что
      записано в §2а и Е11 NTF-4 и в «Месте S3-C8н». Н3-Ф4 — без S2-B7, «после посадки Н3-Ф3а», поэтому
      прежний запрет «пути … с Н3-Ф4 не параллельно» поглощён полным порядком волн, а не снят. Е2 маршрута
      NTF-3 раздвоена по предикату: для S2-B7 — ls-tree на сведённой голове волны, для S2-B8, S2-B10 — на
      origin/main. Строка полосы S2-B7 не называет S3-C7н в зависимостях, но несёт **Е2**, а Е2 называет
      «на голове после S3-C2н и S3-C7н», так что порядок до полосы доходит.
  - condition: "дельта не вводит внешнего вызова, асинхронного пути, sentinel-значения, ручки"
    result: green
    detail: "Дельта R9-1 — состав и порядок волны. Механизмов продукта не вводит."
  - condition: "нет маркеров отсрочки (ban #11)"
    result: green
    detail: "grep -noE 'TODO|TBD|FIXME|XXX' по design.md, tasks.md NTF-4 и tasks.md NTF-3 → 0"
  - condition: "нет открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: green
    detail: >-
      Е11 — зависимость с предикатом и состоянием, а не вариантная строка. Е10 снята в части выбора, а
      исполнимость выбора отдана Е11, и это сказано в §13 открытым текстом.

findings:
  - id: RV10-01
    class: "measurement-discipline §«Предикат — только с контролем» (разбор совпадений по референту)"
    subject: "предикат Е11: подстрока `S3-C6` в маршруте NTF-3"
    measured: >-
      В маршруте NTF-3 есть СВОЯ полоса S3-C6 (сквозные стенда NTF3-146…148), и она стоит в волне Н3-Ф5:
      `grep -n '^| Н3-Ф5' docs/changes/issue-2918/tasks.md` → «S1-A6, S2-B11, S3-C5, S3-C6». Значит подстрока
      `S3-C6` в предикате называет два референта. Перенос S2-B7 в Н3-Ф5 дал бы «да» без исполнения Д113 (б).
      Форма с референтом NTF-4 `S3-C6н` прогнана: рабочее дерево → 1, HEAD → 0, так что она тоже живая в обе
      стороны. Форма `S3-C6` пришла из моего же условия RV9-01, и автор взял её дословно.
    condition_on_code: >-
      В строке Е11 (design.md §13 и tasks.md §1) предикат читает `S3-C6н`, а не `S3-C6`. На исход
      сейчас не влияет: обе формы дают «да» в рабочем дереве и «нет» на HEAD.
    held_by: "вниманием; правится одной заменой в двух строках Е11"
    outcome: к-коду          # не блокирует одобрение: ложное «да» требует переноса S2-B7 в чужую волну

numbers_before_code:
  - claim: "Е11: маршрут NTF-3 держит S2-B7 и S3-C6н в одной строке волны, 'до Н3-Ф4' нет"
    how: "grep по таблице волн §4 docs/changes/issue-2918/tasks.md; рабочее дерево и git show HEAD"
    result: "рабочее дерево: 1 строка, 'до Н3-Ф4' 0 → да; HEAD 24f31fd00: 0 строк, 1 → нет"
  - claim: "предикат с референтом `S3-C6н` различает состояния"
