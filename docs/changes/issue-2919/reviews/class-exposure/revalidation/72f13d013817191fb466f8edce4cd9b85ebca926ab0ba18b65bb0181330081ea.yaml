# Экспозиция классов: пересверка (revalidation) замысла NTF-4, редакция 4.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки на редакции 1 (b9149d3c…),
# 2 (cd92e9ac…) и 3 (b46bd023…) относятся к своим редакциям и здесь не переписываются.
# Редакция 4 — тот же заход отображения по Д26. Судятся только строка отображения, которую
# пересверка b46bd023 оставила открытой (CX4V-63 (б), строка Д26 · 4), §13 и дельта
# 3afa3df54 → dfe2cea05 (design.md, tasks.md, change.yaml). Прочие 64 отображения выдерживали,
# дельта их не касается.
# Проверено четыре условия:
#   (1) каждый неотображённый пункт пересверки b46bd023 отображён, и отображение выдерживает
#       условие пункта;
#   (2) дельта не вводит нового внешнего вызова, асинхронного пути, sentinel-значения или
#       механизма без пункта;
#   (3) маркеров отсрочки нет;
#   (4) открытых решений нет.
