approval_conditions:
  - condition: "каждый неотображённый пункт пересверки b46bd023 отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: red
    detail: >-
      Строк §11 — 65, уникальных пунктов — 65, строк Д26 — 6. Единственный неотображённый пункт
      b46bd023 — CX4V-63 (б). Он по-прежнему не отображён, и замысел пишет это сам: строка Д26 · 4
      (5) говорит «Пока Е7 открыта, пункт CX4V-63 (б) не отображён в механизм». Автор здесь не
      ошибся. Под Д26 отобразить пункт нельзя: любой из двух вариантов Е7 вносит содержание,
      которое этот заход запрещает.
  - condition: "дельта не вводит внешнего вызова, асинхронного пути, sentinel-значения или механизма без пункта (CG_CLASS_NEW_EXTERNAL_CALL, CG_CLASS_NEW_ASYNC_PATH, CG_CLASS_NEW_SENTINEL)"
    result: green
    detail: >-
      Дельта меняет только тексты и маршрут: условие (5) в строке Д26 · 4, строку Е7 в §1
      tasks.md, зависимость «Е7» у S1-A8 и S1-A10, предикат снятия S1-A8 и формулировку §13.
      Ключа чарта, пробы, внешнего вызова, таймера, ручки и sentinel в дельте нет.
  - condition: "нет маркеров отсрочки (ban #11)"
    result: green
    detail: "`grep -noE 'TODO|TBD|FIXME|XXX'` по design.md и tasks.md — 0."
  - condition: "нет открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: red
    detail: >-
      Условие по-прежнему красное, но теперь это записано верно. §13 больше не утверждает
      «открытых решений нет»: Е7 названа открытым решением владельца, которое блокирует
      `DESIGN_APPROVED`. Названо и то, чем варианты меняют содержание замысла. Ложное
      утверждение, отмеченное в b46bd023, снято. Само решение не принято.

mapping_check:
  - id: CX4V-63 (б)
    design: "Д26 · 4 (3), (5); §13 абзац и Е7; tasks §1 Е7, S1-A8, S1-A10, §2а Д26 · 4, §3 п.1"
    verdict: does_not_hold
    note: >-
      Что изменилось против b46bd023. Запрет «S1 не выкатывается на базу со строкой ограды до
      снятия Е7» больше не держится одной прозой. Теперь его держит маршрут: у S1-A8 и S1-A10 в
      зависимостях стоит Е7; предикат S1-A8 требует записанного решения по Е7 и, при варианте
      ключа чарта, рендер-пробы с близнецом «ключ не задан — переменной нет»; S1-A9 (сквозные S1
      на стенде) зависит от S1-A1…A8. Это закрывает замечание b46bd023 «запрет ничем не держится» —
      в той части, где запрет касается маршрута полос.
      Что не изменилось. Полосы, условия к коду и держателя, который судит отрендеренный чарт, у
      пункта нет. Причина — открытая Е7, а не недосмотр автора.
      Три мелочи для следующего захода; ни одна не меняет исход.
      (а) Предикат строки Е7 в §1 tasks.md — `grep -n '^| Е7' design.md`. Строка Е7 есть в
      design.md и до решения, и после, поэтому ответ «решение записано» предикат дать не может: он
      не умеет сказать «нет». Судить надо поле, которое меняется при решении, например столбец
      состояния строки Е7.
      (б) §3 п.1 tasks.md ставит S1-A10 сразу после S1-A1, а Е7 не называет. Зависимость есть
      только в столбце таблицы — два места об одном порядке, и одно неполно.
      (в) Маршрут держит запрет только на стенде (S1-A9). Выкатку вне маршрута полос — посадкой
      ствола — он не держит (см. not_measurable).
    code_conditions: >-
      Без изменений против b46bd023, после решения по Е7. (1) Если выбран ключ чарта: чарт notify
      рендерит значение ключа values в `env` контейнера `migrate` обоих развёртываний под именем
      `MIGRATOR_DROP_APPROVED`. Пустой ключ — переменной нет. Рендер-проба в S1-A8: значение задано
      → переменная у `migrate` обоих развёртываний; близнец — ключ не задан → переменной нет.
      (2) Если выбран путь Е2: снос, запись dropguard.json, УК4-35, строки одобрения §10 и S1-A10
      снимаются тем же заходом, что и решение.

