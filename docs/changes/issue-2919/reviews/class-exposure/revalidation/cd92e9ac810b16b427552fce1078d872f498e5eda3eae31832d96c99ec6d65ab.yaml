# Экспозиция классов: пересверка (revalidation) замысла NTF-4, редакция 2.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверка на редакцию 1
# (b9149d3c…) относятся к своим редакциям и здесь не переписываются.
# Редакция 2 — заход отображения по решению диспетчера Д26. Поэтому судятся только строки
# отображения (§11: строки CX4V-07, 63, 64, 65; таблица «Строки отображения захода Д26», Д26 · 1…6;
# §11а УК4-34, УК4-35; tasks.md §2а) и дельта 2b0cea762 → 20164b92e. Прочие 59 отображений
# пересверки b9149d3c выдерживали, дельта их не касается.
# Проверено четыре условия:
#   (1) каждый неотображённый пункт пересверки b9149d3c отображён, и отображение выдерживает
#       условие пункта;
#   (2) дельта не вводит нового внешнего вызова, асинхронного пути, sentinel-значения или
#       механизма без пункта;
#   (3) маркеров отсрочки нет;
#   (4) открытых решений нет.
