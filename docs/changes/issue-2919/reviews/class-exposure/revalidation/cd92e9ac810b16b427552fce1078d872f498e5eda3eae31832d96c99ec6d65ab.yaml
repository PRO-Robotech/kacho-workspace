questions_to_dispatcher:
  - >-
    CX4V-63 (б). Одобрению сноса ограды нужен путь в init-контейнер `migrate` обоих развёртываний
    notify. Варианты: (1) разрешить в следующем заходе один ключ values чарта notify, который
    рендерит `MIGRATOR_DROP_APPROVED` в `env` контейнера `migrate`, с рендер-пробой; (2) пойти по
    Е2: NTF-1 садится без ограды, и сноса нет. Д26 запрещает (1) в заходе отображения.
findings_outside_subject:
  - >-
    Во всём дереве (kacho @1d42a6728bf) инструкция оператору «назвать снос в
    `KACHO_MIGRATOR_DROP_APPROVED` и выкатить» (docs/architecture/drop-preflight-counts-the-live-database.md,
    порядок для оператора, п. 3; install/deploy.mdx шести служб) неисполнима через чарт: ни один
    контейнер `migrate` не принимает переменных из values. Это находка о корректности выкатки, а не
    о NTF-4.
