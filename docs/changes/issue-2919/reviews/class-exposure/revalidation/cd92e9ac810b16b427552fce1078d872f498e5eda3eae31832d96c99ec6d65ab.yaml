mapping_check:
  - id: CX4V-07
    design: "З2, З3, З4; Д26 · 1; §11а УК4-06; tasks S1-A2, S6-E1"
    verdict: holds
    note: >-
      Выбран вариант (б). Перечитыватель `New` не зовёт, объект `address_key` судится по одному
      файлу; при несовпадении дайджеста — `control_mismatch` без построения. Условие (3) закрывает
      то, что оставалось в (б): `Func` и начальный дайджест берутся из одних и тех же байтов одного
      поколения. Инъекция УК4-06 названа: вызов `New` в `secretreload`.
    code_conditions: "—"
  - id: CX4V-55
    design: "Д26 · 2; tasks S1-A2"
    verdict: holds
    note: "Условие к коду перенесено дословно, NTF4-116 гоняется с `repeatable read` у роли, близнец назван."
    code_conditions: "—"
  - id: CX4V-56
    design: "З18; Д26 · 3; УК4-28; tasks S3-C2"
    verdict: holds
    note: >-
      Три условия перенесены. Уточнение по дереву: `dropguard.GooseApplied(ctx, db Querier)`
      принимает интерфейс `database/sql` (`QueryRowContext` → `*sql.Row`, dropguard/observe.go:30
      @34bc810), а З18 пишет `RequireApplied(ctx, pool)`. Пул pgx этому интерфейсу не
      удовлетворяет. Кроме того, `GooseApplied` отвечает ошибкой, если база недоступна, и `false`,
      если таблицы `goose_db_version` нет.
    code_conditions: >-
      `RequireApplied` получает `*sql.DB` через `pgx/v5/stdlib.OpenDBFromPool` (в services его
      импортируют 33 файла) и закрывает его после сверки. Ошибка `AppliedSet` — отказ старта с
      текстом «схема не прочитана», а не «версия не применена»: это два разных исхода.
  - id: CX4V-63
    design: "З2, §6, §10 п.2, п.4; Д26 · 4; УК4-35; tasks S1-A1, S1-A8, S1-A10"
    verdict: does_not_hold
    note: >-
      (а) Имя таблицы в строке расходится с миграцией. Д26 · 4 пишет в dropguard.json и в одобрении
      `kacho_notify.recipient_key_fence`, а миграция сноса в §6 (строка 1492) — `DROP TABLE
      recipient_key_fence;`, как и `CREATE TABLE recipient_key_fence` в NTF-1. Инвентаризация
      стража хранит имя так, как оно написано в миграции: «schema-qualified only when the migration
      qualified it» (inventory.go:20–21). Ключ сверки — точная строка (`declKey`, judge.go:308).
      Следствия: `Reconcile` даёт `undeclared-drop` для сноса и истёкшую запись для объявления;
      одобрение ни с чем не совпадает и печатается устаревшим; на базе со строкой ограды страж
      отказывает и с одобрением. Молча это не пройдёт: УК4-35 (близнец «с одобрением → накат») и
      производитель манифеста покраснеют. Но условие к коду в этой форме неисполнимо.
      (б) Одобрению нет пути в init-контейнер. Условие (3) говорит: «существующая ручка стража у
      init-контейнера `migrate`… Новой ручки чарта заход не заводит». Страж читает одобрение только
      из окружения процесса (`envknob.Get(ApprovalEnv, LegacyApprovalEnv)`, preflight.go:475).
      Контейнер `migrate` в семи чартах из семи получает закрытый список `env` без подстановки из
      values. `range .Values.env` есть в compute, registry и kaname, но только в основном
      контейнере. Имени `MIGRATOR_DROP_APPROVED` нет ни в одном yaml или tpl дерева. У чарта notify
      NTF-1 передачи тоже нет. Сама выкатка S1 — это `helm upgrade`, и она переписывает спецификацию
      init-контейнера. Поэтому в управляемой чартом выкатке оператору некуда положить одобрение.
      УК4-35 работает на уровне мигратора и этого не видит: проба будет зелёной, а выкатка S1 на
      базе с оградой встанет без выхода, кроме ручной правки объекта вне чарта.
    code_conditions: >-
      (а) Замысел пишет имя таблицы сноса ровно так, как его пишет миграция, в трёх местах: запись
      dropguard.json, строка одобрения, утверждение УК4-35 об имени таблицы в отказе. Раз NTF-1
      создаёт таблицу без схемы, это `recipient_key_fence`. Правится одна строка отображения.
      (б) Нужен путь одобрения до init-контейнера `migrate` обоих развёртываний notify, и
      держатель, который судит отрендеренный чарт, а не мигратор. Путь без нового механизма один:
      Е2 — NTF-1 садится без ограды, и сноса нет вовсе. Любой другой путь — это ключ values чарта
      notify, который рендерит `MIGRATOR_DROP_APPROVED` в `env` контейнера `migrate`. Д26 такой
      механизм в этом заходе запрещает, поэтому выбор — за диспетчером (вопрос ниже).
  - id: CX4V-64
    design: "З6, З10, З13; Д26 · 5; УК4-34; tasks S1-A7, S2-B1, S2-B2"
    verdict: does_not_hold
    note: >-
      Условия (1)–(3) выдерживают: две метрики сняты, сигналы взамен названы, второго счётчика у
      ветки «вне таблицы» нет. Держатель УК4-34 в этой редакции самопротиворечив. Строка говорит:
      «строит реестр каждого развёртывания и сверяет зарегистрированные имена и метки с таблицей Р12
      в обе стороны». В реестре корня `notify-sender` есть семейства NTF-1:
      `notify_outcomes_total`, `notify_misconfigured_total` и `notify_reserve_db_errors_total`
      (замысел NTF-1, строки 1391–1396). В Р12 NTF-4 их нет (`grep` по приёмке — 0). Если
      сверять реестр корня буквально, проба покраснеет на законном дереве. Если сверять свежий
      реестр после `reputation.Register`, она молчит, но не видит регистраций вне `reputation`. А
      обе снятые метрики жили именно там, в `sentlog` и `deliver`. Инъекция из строки («одна из двух
      снятых метрик») краснеет только в первой форме.
    code_conditions: >-
      Единица сверки УК4-34 — семейства с приставкой `notify_` в реестре, который построил корень
      каждого развёртывания. Они сверяются в обе стороны с объединением: Р12 NTF-4 и перечень
      семейств NTF-1, прочитанный из одного названного источника NTF-1, а не скопированный в пробу.
      Семейства без приставки `notify_` (сборщики процесса и среды) проба печатает числом и в
      сверку не берёт. Инъекция — регистрация семейства вне `reputation` (в `sentlog`) → красный.
      Близнец — корень по таблице → зелёный с печатью числа сверенных семейств.
  - id: CX4V-65
    design: "З6, З9, З11, З22, §6; Д26 · 6; УК4-01а; tasks S1-A1, S1-A5, S1-A6, S2-B2"
    verdict: holds
    note: >-
      Исполнитель назван: проход существующего подметальщика у держателя, на его таймере
      (`…_SUPPRESSION_SWEEP_INTERVAL` есть в Р16, строка 1383). Партия ограничена, первым вызовом в
      ней идёт `lease.Renew`, `$cut` считается на внедрённых часах один раз за проход. Индексы
      `sent_log (created_at)` (строка 1406) и `feedback_message (processed_at)` на месте. Изъятие
      двух функций пути письма закрыто и судится по идентичности. Граница окна и срока есть в
      приёмке редакции 22 (строки 1225, 1363, 1390, 1434) вместе с девятой инъекцией. Условие:
      одобрение редакции 22 (Е1).
    code_conditions: "—"

