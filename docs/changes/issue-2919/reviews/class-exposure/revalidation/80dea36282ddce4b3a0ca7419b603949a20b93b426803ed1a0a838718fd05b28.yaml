# Экспозиция классов: пересверка (revalidation) замысла NTF-4, редакция 5.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и пересверки на редакции 1 (b9149d3c…),
# 2 (cd92e9ac…), 3 (b46bd023…) и 4 (72f13d01…) относятся к своим редакциям и здесь не
# переписываются. Редакция 5 — заход по решению диспетчера Д28: Е7 снята (вариант 1), и заходу
# разрешён ровно один новый механизм — ключ values чарта notify, рендерящий одобрение сноса в
# окружение init-контейнера `migrate` обоих развёртываний. Судятся только строка отображения,
# которую пересверка 72f13d01 оставила открытой (CX4V-63 (б), строка Д26 · 4), §13, три мелочи
# 72f13d01 и дельта dfe2cea05 → 0ea674482 (design.md, tasks.md, change.yaml). Прочие 64
# отображения выдерживали, дельта их не касается.
# Проверено четыре условия:
#   (1) каждый неотображённый пункт пересверки 72f13d01 отображён, и отображение выдерживает
#       условие пункта;
#   (2) дельта не вводит нового внешнего вызова, асинхронного пути, sentinel-значения или
#       механизма без пункта (ключ values — разрешённый Д28 механизм, отображён в CX4V-63);
#   (3) маркеров отсрочки нет;
#   (4) открытых решений нет.
