approval_conditions:
  - condition: "каждый неотображённый пункт пересверки 72f13d01 отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: green
    detail: >-
      Строк §11 — 65, уникальных пунктов — 65, строк Д26 — 6. Единственный неотображённый
      пункт 72f13d01, CX4V-63 (б), отображён: путь одобрения в окружение init-контейнера
      `migrate` назван (ключ `migrator.dropApproved`, З21, Д26 · 4 (3)), у него есть полосы
      (S1-A8, S3-C6, S1-A10) и держатель УК4-36 с близнецом и инъекцией. Условия к коду из
      72f13d01 (1) перенесены дословно по смыслу и усилены: «ни у одного другого контейнера»,
      печать числа судимых развёртываний, ноль — красный. Остаётся одно замечание к маршруту —
      предикат посадки §0 tasks.md (mapping_check, (г)). Исход условия оно не меняет: запрет
      держит само правило §0 (одна волна S1-A1 + S1-A8), а неверна только команда, которой его
      проверяют.
  - condition: "дельта не вводит внешнего вызова, асинхронного пути, sentinel-значения или механизма без пункта (CG_CLASS_NEW_EXTERNAL_CALL, CG_CLASS_NEW_ASYNC_PATH, CG_CLASS_NEW_SENTINEL)"
    result: green
    detail: >-
      Новый механизм в дельте один — ключ values `migrator.dropApproved`. Его разрешает Д28,
      отображение — CX4V-63 (строка §11 и Д26 · 4), держатель — УК4-36. Sentinel-значение не
      заведено: пустой ключ означает отсутствие переменной, а не особое значение. Разборщик
      значения один — `dropguard.ParseApprovals`, чарт формат не проверяет. Внешнего вызова,
      таймера и асинхронного пути в дельте нет. Правило §0 tasks.md — порядок посадки, а не
      механизм продукта.
  - condition: "нет маркеров отсрочки (ban #11)"
    result: green
    detail: "`grep -noE 'TODO|TBD|FIXME|XXX'` по design.md и tasks.md — 0."
  - condition: "нет открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: green
    detail: >-
      §13: «Открытых решений нет». Строка Е7 несёт состояние «снята решением Д28». Предикат
      строки Е7 в §1 tasks.md теперь умеет сказать «нет»: на 0ea674482 даёт 1, на dfe2cea05 — 0.
      Е1–Е6 — зависимости с предикатом снятия, а не решения замысла; это так же, как в 72f13d01.

mapping_check:
  - id: CX4V-63 (б)
    design: "З21 (абзац init-контейнера `migrate`); §10 п.2; §11 CX4V-63; Д26 · 4 (3), (5); §11а УК4-36; §13 Е7; tasks §0, §1 Е7, S1-A8, S1-A10, S3-C6, §2а Д26 · 4, §3 п.1"
    verdict: holds
    exposure:
      - class: "code-authoring §«Умолчание, которое становится утверждением»"
        condition: >-
          Пустой или незаданный ключ — у контейнера нет переменной вовсе, а не переменная с пустым
          значением. Держит УК4-36: близнец «ключ не задан» плюс инъекция «шаблон рендерит пустую
          переменную → близнец красный». Замечу: страж читает пустую переменную как «одобрений
          нет» (`ParseApprovals("")` → пустой список, `envknob.Get` @34bc810). Значит, различие
          двух форм — дисциплина рендера, а не безопасность; проба всё равно строже, чем нужно
          стражу, и это допустимо.
      - class: "code-authoring §«Контракт, который нельзя выразить» — два написания одного значения"
        condition: >-
          Чарт рендерит только `MIGRATOR_DROP_APPROVED` (`dropguard.ApprovalEnv`). Прежнее
          написание `KACHO_MIGRATOR_DROP_APPROVED` страж принимает окном перехода
          (`LegacyApprovalEnv`, `envknob.Get(ApprovalEnv, LegacyApprovalEnv)`), но чарт его не
          рендерит — так записано в З21. Держит УК4-36: проба ищет имя переменной дословно.
          Условие к коду: проба утверждает и отсутствие прежнего написания у всех контейнеров —
          иначе второе написание, отрендеренное рядом, пройдёт незамеченным.
      - class: "rule-architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
        condition: >-
          Два развёртывания (`notify-sender` с S1, `notify-api` с S3-C6) получают ключ одним
          шаблоном. УК4-36 судит каждое развёртывание рендера и печатает число: S1-A8 — ≥ 1,
          S3-C6 — 2. Держится пробой.
      - class: "code-authoring §«Решение и его следствие разнесены» — перекат при смене ключа"
        condition: >-
          Значение идёт прямо в `env` шаблона пода, без ConfigMap. Поэтому смена ключа меняет
          ревизию шаблона и вызывает перекат, как записано в Д26 · 4 (3). Условие к коду: ключ не
          проходит через ConfigMap или Secret. Если пройдёт, нужна аннотация checksum
          (security.md sec-chart-config-checksum), иначе постановка и очистка одобрения не
          перекатят под. Держится вниманием рецензента чарта, если УК4-36 не утверждает, что
          переменная задана `value:`, а не `valueFrom`.
      - class: "code-authoring §«Контракт, который нельзя выразить» — тип значения в YAML"
        condition: >-
          Значение рендерится строкой (`| quote` или эквивалент), а не голым скаляром. Сегодня
          форма `<версия>/<таблица>` всегда содержит `/` и потому остаётся строкой. Но
          `ParseApprovals` принимает и перечень через пробелы и переводы строк, и тогда голый
          скаляр ломает YAML рендера. Держит УК4-36, если в числе её входов есть значение из двух
          одобрений через перевод строки. Сейчас он там не назван — это заказ к автору пробы, а не
          к замыслу.
    note: >-
      Три мелочи 72f13d01 исполнены. (а) Предикат строки Е7 судит поле состояния: на 0ea674482
      даёт 1, на dfe2cea05 — 0, то есть умеет сказать «нет». (б) §3 п.1 называет Е7. (в) Посадку
      ствола вне маршрута полос держит правило §0 tasks.md: S1-A1 и S1-A8 входят в один запрос
      волны.
      (г) Новое замечание к маршруту, исход не меняет. Предикат посадки в §0 tasks.md —
      `git log --diff-filter=A --format=%H origin/main -- <миграция сноса>.sql | tail -1` —
      обходит всю историю, достижимую из ствола, а не линию первого родителя. Ствол kacho
      вливается слияниями: @1d42a672 достижимо 3003 коммита, по первому родителю — 1039,
      слияний — 645. Поэтому предикат вернёт коммит полосы S1-A1 внутри ветки волны, а не коммит
      ствола. Если коммит S1-A1 предшествует коммиту S1-A8 (а §3 ставит S1-A1 раньше), файла
      `notify-drop-approval-test.sh` на C нет, и предикат покраснеет на правильной посадке.
      Контроль на живом слиянии #2618 (8d70f599834): для файла, добавленного в нём, форма без
      `--first-parent` вернула 751707a193b — его нет на линии первого родителя (0 вхождений).
      Форма `git log --first-parent -m --diff-filter=A` вернула само слияние 8d70f599834. Правка:
      предикат §0 ведётся по `--first-parent -m`. Утверждение Д26 · 4 (5) о коммите ствола от
      этого верно, неверна только команда в tasks.md.

