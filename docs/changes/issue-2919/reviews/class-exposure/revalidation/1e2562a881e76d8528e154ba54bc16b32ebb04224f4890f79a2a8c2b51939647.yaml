findings:
  - id: RV9-01
    class: "code-authoring §«Решение и его следствие разнесены» (решение записано в одном документе, следствие исполняет другой)"
    subject: "Е10, Д113 (б) — одна волна S3-C2н/S3-C6н/S3-C7н/S3-C8н с S2-B7 NTF-3"
    measured: >-
      docs/changes/issue-2918/tasks.md @24f31fd00 (в рабочем дереве файл не изменён), §4 «Волны»: строка
      «Н3-Ф3а (Д100) | corelib, kacho | X5 NTF-4 → S3-C2, S3-C4, S3-C5, S3-C6, S3-C7 NTF-4 в части носителя |
      до Н3-Ф4; … пути `cmd/notify-api/**`, `gateway/**`, `deploy/helm/notify/**` — с Н3-Ф4 не параллельно».
      Строка «Н3-Ф4 | kacho | S2-B9, S2-B7 → …». То есть S2-B7 стоит в ДРУГОЙ, более поздней волне.
      `grep -rln 'Д113' docs` → только три файла issue-2919. Строка S2-B7 зависит от «S2-B4, X5, Е2», S2-B4 — от
      «X2, Е3, S2-B1» (волна Н3-Ф3).
    condition_on_code: >-
      В §13 заводится зависимость, например Е11: «маршрут NTF-3 сводит S2-B7 и полосы NTF-4 части носителя
      в одну волну». Чей предмет — автор маршрута NTF-3 и диспетчер. Предикат снятия — на внешнем факте и
      способный ответить «нет»: в `docs/changes/issue-2918/tasks.md` §4 одна строка волны содержит и `S2-B7`,
      и `S3-C6` NTF-4. Строки «Н3-Ф3а … до Н3-Ф4» там больше нет. Пока предикат даёт «нет», полосы S3-C6н и
      S3-C8н не стартуют. В Е10 «снята» относится к выбору варианта, а исполнимость выбора держит Е11. §2б
      дополнительно называет следствие: из-за S2-B7 слияние части носителя ждёт цепочку NTF-3 S2-B4 → S2-B1
      (волна Н3-Ф3) и Е2. Фраза «От S3-C1, X2, X3, X4 и стадий S1, S2 эти полосы не зависят» верна о полосах,
      но не о запросе волны, и её нельзя читать как «посадка части носителя независима».
    held_by: "вниманием до записи зависимости; после неё — предикат Е11 на тексте маршрута NTF-3"
    outcome: к-замыслу
  - id: RV9-02
    class: "code-authoring §«Решение и его следствие разнесены» (параллельные писатели одного файла в одной волне)"
    subject: "S3-C7н и S2-B7 в одной волне — общий файл `services/notify/servesurface_ledger.go`"
    measured: >-
      §2б, строка S3-C7н, пути: `services/notify/servesurface_test.go`, `services/notify/servesurface_ledger.go`.
      Маршрут NTF-3, строка S2-B7, пути: `…/services/notify/servesurface_ledger.go`, `services/notify/cmd/notify-api/**`,
      `services/notify/internal/{apiserver,inbox}/**`. Порядок §2б: «Х5 → S3-C2н → S2-B7 на голове; S3-C4н,
      S3-C5, S3-C6н, S3-C7н параллельно после S3-C2н». Фраза «Общих путей у них нет» перечисляет C4н, C5, C6н и
      C7н, S2-B7 в ней нет. Пересечение S2-B7 с S3-C2н (`cmd/notify-api/**`, `internal/apiserver/**`) порядком
      снято, пересечение с S3-C7н — нет.
    condition_on_code: >-
      Порядок в §2б (и в строке волны маршрута NTF-3) называет S3-C7н и S2-B7 последовательными.
      Естественный порядок — S3-C2н → S3-C7н → S2-B7 на голове: запись З9 и её проба заводятся с нулём строк
      у `notify-api`, инъекция RV8-07 «на дереве без строк» исполняется на этом дереве, а S2-B7 добавляет
      строки к существующей записи. Обратный порядок тоже допустим, если назван.
    held_by: "вниманием (порядок маршрута); пересечение путей проверяет разведчик до раздачи"
    outcome: к-замыслу
  - id: RV9-03
    class: "code-authoring §«Решение и его следствие разнесены»; gate-authoring — исход вместо объявления"
    subject: "предикат посадки исхода (б) Е10 (§2а, DoD S3-C6н)"
    measured: >-
      Предикат: `git log --first-parent -m --diff-filter=A … <ветка эпика> -- …/deployment-api.yaml | tail -1`
      → коммит C, затем проба З9 на C печатает строк у `notify-api` ≥ 1. C — слияние, уже лежащее в ветке
      эпика. Проба З9 по RV8-07 и строке S3-C7н считает ноль строк законным состоянием и печатает число,
      не падая. Значит «≥ 1» никакая проба не утверждает: это чтение напечатанного числа.
    condition_on_code: >-
      Утверждение «запрос, несущий S3-C6н без S2-B7, не вливается» держится проверкой на СВЕДЁННОЙ голове
      волны до запроса в ветку эпика. Если дельта волны к базе ветки эпика добавляет
      `deploy/helm/notify/templates/deployment-api.yaml`, проба З9 на этой голове печатает у `notify-api`
      строк ≥ 1, а ноль даёт ненулевой код шага (красный, а не напечатанное число). В замысле названо, кто
      исполняет шаг — сборщик волны или посадка — и где лежит команда. Посадочный предикат на C остаётся
      ретроспективным контролем, а не держателем.
    held_by: "нужен шаг, его нет: проверка сведённой головы волны «развёртывание `notify-api` добавлено ⇒ строк записи у `notify-api` ≥ 1», красная на нуле"
    outcome: к-замыслу
  - id: RV9-04
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (судить узел, а не образец текста); api-hyphen-prefix"
    subject: "гейт литерала `nop` `internal/repohygiene/opprefixliteral_test.go` (Е8, Д113 (б))"
    measured: >-
      `git -C kacho grep -c '"nop"' f4c74ba -- '*.go'` → вывода нет (0). Обратных кавычек `nop` и `"nop-` → 0.
      `gateway/internal/opsproxy/proxy.go:86–102` @f4c74ba: из 8 ключей `prefixToBackend` 3 — локальные
      постоянные края (`prefixOperationVPCSubnet`, `prefixOperationIAM`, `prefixOperationGeo`). Значит форма
      «своя постоянная края» в дереве живая, и гейт на `nop` — не формальность.
      `git -C corelib merge-base --is-ancestor 4dabea4 origin/77-notify` → 0, `… 4dabea4 origin/main` → 1.
    condition_on_code: >-
      Гейт сравнивает значение литерала после `strconv.Unquote`, поэтому `"nop"` и обратные кавычки `nop`
      дают одну находку. Пакет `gateway/internal/opsproxy` из обхода не исключается. `prefix_routing_test.go`
      исключён как `_test.go`: его набор `want` законно несёт литерал. Объявление
      `const prefixOperationNotify = "nop"` в крае — находка гейта. Это и есть инъекция «своя постоянная»,
      и её стоит прогнать вторым случаем рядом с литералом-ключом. Пин corelib у S3-C2н — на голову
      `origin/77-notify` (или её потомка), а не на `main`: 4dabea4 в `main` нет.
    held_by: "покраснеет `opprefixliteral_test.go` (инъекции: литерал-ключ и своя постоянная края; близнец `ids.PrefixOperationNotify`)"
    outcome: к-коду

