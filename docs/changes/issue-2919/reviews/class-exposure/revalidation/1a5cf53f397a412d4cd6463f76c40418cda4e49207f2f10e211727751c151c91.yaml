approval_conditions:
  - condition: "каждый неотображённый пункт пересверки 80dea362 отображён (CG_CLASS_ITEM_UNMAPPED)"
    result: green
    detail: >-
      В 80dea362 `unmapped: []`. Строк §11 — 65, уникальных пунктов — 65, строк Д26 — 9 (было 6).
      Старые отображения дельта не меняет. Новые пункты этой пересверки — в следующем условии.
  - condition: "дельта не вводит внешнего вызова, асинхронного пути, sentinel-значения или механизма без выдерживающего отображения (CG_CLASS_NEW_EXTERNAL_CALL, CG_CLASS_NEW_ASYNC_PATH, CG_CLASS_NEW_SENTINEL)"
    result: red
    detail: >-
      Дельта вводит два новых механизма.
      (1) Асинхронный путь: сеанс ящика — горутина держателя вне lease.Tick, такт её не ждёт.
      Это CX4V-66. Отображён строкой Д26 · 7 (4) и держателем УК4-37 и выдерживает; условия
      (жизненный цикл, одна горутина, изоляция транзакций держателя) идут к коду.
      (2) Срок внешнего вызова canary.Send = notify.smtp.sessionTimeout. Это CX4V-67. Отображён
      строкой Д26 · 7 (3) и держателем УК4-38, но отображение не выдерживает. Срок допускается до
      120 с (NTF-1), а срок аренды — от 30 с (Р16, профиль стенда П1 — 30 с). Вызов идёт внутри
      такта, и аренду во время него не продлевает никто. Независимое продление живёт «пока сеанс
      открыт» (З7), а сеанс теперь идёт отдельно и может быть закрыт.
      Sentinel-значений нет: истёкший срок DNS — строка «ответа нет», истёкший срок попытки —
      not_accepted. Новых ручек нет: три постоянные §8.
  - condition: "нет маркеров отсрочки (ban #11)"
    result: green
    detail: "`grep -noE 'TODO|TBD|FIXME|XXX'` по design.md и tasks.md — 0."
  - condition: "нет открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: green
    detail: >-
      §13: «Открытых решений нет». Е7 снята Д28. Е1–Е6 — зависимости с предикатом снятия, как в
      80dea362.

mapping_check:
  - id: CX4V-66 (новый) — сеанс ящика вне такта
    design: "З7 «порядок сеанса»; З11 «порядок в такте, сеанс вне такта», «таймеров вне такта два»; §7 п.3; Д26 · 7 (4); УК4-37; tasks S1-A5, S1-A3"
    verdict: holds
    exposure:
      - class: "rule-architecture §«Concurrency / lifecycle / читаемость» — жизненный цикл горутины"
        condition: >-
          Замысел не говорит, кто ждёт горутину сеанса при остановке процесса. Условие к коду:
          контекст горутины сеанса — производный от контекста работы держателя. Функция работы
          держателя возвращается только после выхода горутины сеанса и горутины независимого
          продления. Пул базы закрывается после этого. При молчащем П10 возврат наступает не позже
          pop3.opTimeout плюс запас. Держится УК4-37, если в неё добавить вариант «остановка
          процесса во время молчания П10 → работа вернулась в пределах срока, горутин сеанса 0».
          Сейчас такого варианта нет — это заказ.
      - class: "code-authoring §«Решение и его следствие разнесены» — «не больше одной горутины»"
        condition: >-
          Признак «прежний сеанс завершился» выставляет сама горутина при выходе (канал или
          atomic), а читает такт. Новый сеанс не запускается, пока прежний не вышел, в том числе
          после потери и повторного взятия аренды с новой эпохой. Держится прогоном УК4-37 под
          -race и вниманием рецензента; гейта на «не больше одной» нет.
      - class: "code-authoring §«Порядок операций внутри кода» — сериализация транзакций держателя"
        condition: >-
          З11 утверждает, что транзакции такта, сеанса и подметальщика сериализует строчный замок
          feedback_lease. Это верно только под READ COMMITTED. Под REPEATABLE READ вторая
          транзакция на UPDATE той же строки получает 40001, а не ожидание. Умолчание роли
          `repeatable read` замысел сам признаёт возможным (Д26 · 2, CX4V-55). До редакции 6 сеанс
          и такт не пересекались, теперь пересекаются на каждом такте. Условие к коду: каждая
          транзакция держателя на запись открывается с явным pgx.TxOptions{IsoLevel:
          pgx.ReadCommitted}, как Establish. Держится вниманием: УК4-01а судит первый вызов
          lease.Renew, а не уровень изоляции. Заказ — вариант УК4-37 с умолчанием роли
          `repeatable read`: исход тот же, 40001 — 0.
    note: >-
      Мелочь к тексту, исход не меняет. В З7 «порядок сеанса» п.1 по-прежнему гласит «продление
      аренды в начале такта». Сеанс больше не такт, и первый шаг сеанса — вход по слотам. Продление
      перед запуском делает такт (З11).
  - id: CX4V-67 (новый) — срок попытки контрольного письма против срока аренды
    design: "З12 шаг 2; З11 «порядок в такте»; Д26 · 7 (3); УК4-38; tasks S5-D3"
    verdict: does_not_hold
    exposure:
      - class: "rule-architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
        condition: >-
          Внешний вызов держателя внутри аренды должен кончаться раньше аренды, если аренду во время
          него никто не продлевает. Две соседние полосы это соблюдают: pop3.opTimeout ≤
          LEASE_TTL / 3 плюс независимое продление (З7), и NTF-1 выводит sourceCallTimeout из
          LeaseTTL − (resolveSendTimeout + smtp.sessionTimeout), CX1-72. canary.Send — нет. Его
          срок равен smtp.sessionTimeout, а это [1 с … 120 с]. Нижняя граница LEASE_TTL — 30 с,
          на стенде П1 тоже 30 с. Такт продлевает аренду в начале, затем вызывает Send синхронно.
          Если релей отвечает дольше остатка аренды, но в пределах срока, аренда истекает внутри
          вызова, и её берёт другая реплика с эпохой +1. Шаг 3 получает ноль строк — это клетка (д):
          счётчик `accepted` +1, expected_issue IS NULL, база не сдвинута. Новый держатель на
          первом же такте выпускает снова и попадает в то же окно.
      - class: "code-authoring §«Умолчание, которое становится утверждением» — контроль, молча не срабатывающий"
        condition: >-
          При устойчиво медленном релее такой круг не кончается. Ожидаемого выпуска не бывает
          никогда, поэтому feedback_route, который требует expected_issue IS NOT NULL, не
          поднимается ни разу. Держатель меняется на каждом выпуске, и сеансы ящика рвутся сменой
          эпохи. Сигнал Р10 гаснет без следа: видна только растущая эпоха аренды.
    requirement_to_design: >-
      Назвать отношение срока попытки к сроку аренды и выбрать одно из двух. (а) Срок попытки —
      min(smtp.sessionTimeout, LEASE_TTL / 3), выводится в одном месте, строка §8.
      (б) Независимое продление З7 покрывает любой внешний вызов держателя внутри такта, не только
      сеанс ящика. В обоих случаях УК4-38 получает близнеца: релей отвечает `250` позже LEASE_TTL
      от продления такта, но в пределах smtp.sessionTimeout. При (б) ожидается accepted, отметка
      записана, эпоха та же. При (а) ожидается not_accepted в пределах LEASE_TTL / 3, эпоха та же.
      Инъекция — нынешняя форма: эпоха +1, expected_issue IS NULL, красный. Замысел NTF-1 правка не
      затрагивает.
  - id: Д26 · 7 (1), (2) — срок сетевых операций POP3
    design: "З7 «срок каждой сетевой операции»; З23; §8; УК4-37 (а); tasks S1-A3"
    verdict: holds
    exposure:
      - class: "code-authoring §«Чужой ответ: классификация и бюджет»"
        condition: >-
          Срок сработал — временный сбой опроса, без QUIT, метки опроса нет. Потеря аренды и
          остановка процесса ведут к тому же исходу, поэтому различать их тут не нужно. Названная
          цена: сервер, отдающий байты чаще раза в 10 с, держит сеанс. Её видно по feedback_stale,
          а УК4-37 (б) это утверждает. pop3.opTimeout = 10 с = 30 с / 3 — граница выполнена
          равенством, а замысел требует «не больше».
  - id: Д26 · 8 — OrphanGrace против HANDLING_BUDGET
    design: "З17; §8; УК4-39; tasks S3-C3"
    verdict: holds
    exposure:
      - class: "code-authoring §«Решение и его следствие разнесены»"
        condition: >-
          RunSync применяет контекст вызывающего напрямую (worker.go:657, комментарий «callerCtx
          применяется напрямую»). Носитель servicecontract ставит свой срок HandlingBudget, если у
          входящего контекста срока нет или он дальше (contract.go:657). Условие к коду: use-case
          Delete передаёт в RunSync контекст обработчика, не отвязанный (без WithoutCancel и без
          context.Background). Иначе граница «fn идёт в пределах бюджета» теряет носителя.
          Держится вниманием рецензента: УК4-39 сравнивает постоянные, а не путь контекста.
  - id: Д26 · 9 — срок запроса DNS
    design: "З14; §8; УК4-40; tasks S5-D1"
    verdict: holds
    exposure:
      - class: "code-authoring §«Чужой ответ: классификация и бюджет»"
        condition: >-
          В строку «ответа нет» идёт только истечение собственного срока запроса, когда родительский
          контекст ещё жив. Отмена родителя при остановке — не исход проверки. Она не меняет признак
          перепроверки и не даёт отказа старта с именем проверки. Держит УК4-40, если в неё добавить
          близнеца «родитель отменён во время молчания П7 → признак не изменён». Сейчас его нет —
          это заказ.
  - id: М1 (текст З11 о таймерах вне такта)
    verdict: holds
    note: "З11 называет два таймера вне такта и довод их сериализации; расхождение с З9 и Д26 · 6 снято."
  - id: предикат посадки §0 tasks.md (замечание 80dea362 (г))
    verdict: not_executed
    note: >-
      Заказ 80dea362 не исполнен. В §0 tasks.md (строка 58) предикат по-прежнему
      `git -C kacho log --diff-filter=A --format=%H origin/main -- …`, без `--first-parent -m`.
      Исход условий это не меняет: это команда проверки маршрута, а не механизм. Заказ
      повторяется.

