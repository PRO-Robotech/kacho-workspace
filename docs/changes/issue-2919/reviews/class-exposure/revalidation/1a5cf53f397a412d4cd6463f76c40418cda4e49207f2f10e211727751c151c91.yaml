# Экспозиция классов: пересверка (revalidation) замысла NTF-4, редакция 6.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Пересверки на редакции 1–5 (b9149d3c…, cd92e9ac…,
# b46bd023…, 72f13d01…, 80dea362…) относятся к своим редакциям и здесь не переписываются.
# Редакция 6 отвечает на ревью замысла 80dea362 ролью design-reviewer (К1, М1–М3) строками
# Д26 · 7…9 и заказами УК4-37…40. Судятся дельта 0ea674482 → 1ec98ef4b (design.md, tasks.md,
# change.yaml) и то, что она вносит. Прочие 65 отображений выдерживали в 80dea362, и дельта их не
# касается.
#
# По §7 правила агента новый асинхронный путь и новый срок внешнего вызова — новые пункты
# перечня. Дельта вводит оба:
#   - сеанс ящика вынесен из такта в горутину держателя (CX4V-66);
#   - у попытки контрольного письма появился срок `notify.smtp.sessionTimeout` (CX4V-67).
# CX4V-66 отображён и выдерживает, условия идут к коду. CX4V-67 не выдерживает: срок попытки не
# согласован со сроком аренды — см. mapping_check.
#
# Проверено четыре условия:
#   (1) каждый неотображённый пункт пересверки 80dea362 отображён (там их нет);
#   (2) дельта не вводит внешнего вызова, асинхронного пути, sentinel-значения или механизма без
#       выдерживающего отображения;
#   (3) маркеров отсрочки нет;
#   (4) открытых решений нет.
