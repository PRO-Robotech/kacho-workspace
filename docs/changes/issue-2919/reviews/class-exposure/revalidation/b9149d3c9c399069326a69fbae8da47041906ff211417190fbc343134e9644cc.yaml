return_to_acceptance:
  - id: RA-01
    what: >-
      Е1 замысла: исход (б) сверки соседей. Строки §1 о NTF-1: «закрытый словарь исходов» —
      `EXPIRED` несёт и `unclaimed`, и `no_ack`; «точный лимит у источника» — вклад возвращается и
      за `EXPIRED(unclaimed)`; фраза Р17 (строка 1382). Строки §1.2 о NTF-2: «флаг почты kaname» —
      `NOTIFICATION_DELIVERY_NOT_CONFIGURED` вместо `MAIL_DELIVERY_DISABLED` (строки 548, 558);
      «лестница края» — исход `503` `request limiter is unavailable`, для которого у П1 и П2 нет
      правила «не выполнилось»
    scenarios: "П1, П2; сценарии NTF4-80, NTF4-81 по исходу не меняются (замысел §0а)"
    basis: "правило опоры §1 приёмки; замысел §0а, §13 Е1"
  - id: RA-02
    what: >-
      Зависимой границы `KACHO_NOTIFY_REPUTATION_WINDOW ≤ KACHO_NOTIFY_SENT_LOG_RETENTION` в Р16 нет.
      Схема допускает окно 30 сут при сроке 7 сут, и тогда доли считаются за 7 сут: знаменатель и
      числитель уходят вместе со сроком журнала (CX4V-65). Либо граница, либо в Р12 названо, что
      действующее окно — меньшее из двух, и проба это печатает.
    scenarios: "Р16 (таблица ручек, строки 1286, 1298); сценарии долей Р12"
    basis: "api-accepted-ignored (значение ручки, действующее не целиком); code-authoring §«Умолчание, которое становится утверждением»"
return_to_acceptance_note: >-
  Если по CX4V-64 замысел оставит метрики (вариант (б)), их строки идут в Р12 той же редакцией, что
  RA-01 и RA-02. Любая новая редакция приёмки требует нового вердикта и первичного разбора дельты
  (Д22), затем перезакрепления §0 замысла и новой пересверки.

orders:
