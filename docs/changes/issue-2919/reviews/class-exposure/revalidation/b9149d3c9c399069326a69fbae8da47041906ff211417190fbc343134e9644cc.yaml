mapping_check:
  - id: CX4V-07
    design: "З2 (строки 211–216), З4 (строка 358), §11а УК4-06"
    verdict: does_not_hold
    note: >-
      Условие пункта: один построенный экземпляр функции отпечатка на процесс, им же считается
      контрольное значение. З2 исполняет его для старта. З4 для перечитывания объекта ключа строит
      второй экземпляр: разбор ключа → `addresskey.New` → контрольное значение → сравнение с копией.
      Гейт УК4-06 («вызовов вне cmd/notify, cmd/notify-api и тестов 0») этот вызов запрещает. Сам
      вызов лишний: у объекта ключа одно поле данных (`recipientKey`). Дайджест набора совпал —
      исход «принят» без проверки (З4). Дайджест не совпал — значит, сменились байты ключа, а при
      другом ключе HMAC над набором даёт другое значение. Значит, исход «принят» у этой ветки
      недостижим, и функция `Func` для него не нужна.
    code_conditions: >-
      Замысел выбирает одно из двух и правит §11 и УК4-06 одной редакцией. (а) Проверка нового
      ключа при перечитывании — функция пакета `addresskey`, которая по байтам ключа возвращает
      только 32 байта контрольного значения: `ControlOf(key, port) ([32]byte, error)`. Значения
      `*Func` она наружу не отдаёт, а гейт УК4-06 судит `New` и знает эту функцию по идентичности
      (`types.Func`), а не по имени. (б) Смена дайджеста объекта ключа — сразу исход «отвергнут» с
      причиной `control_mismatch`, без построения. Довод — выше; держатель — NTF4-77, 113. При
      любом выборе предикат УК4-06 остаётся «по одному вызову `New` в корне», а инъекция — вызов
      `New` в `secretreload` — красный.
  - id: CX4V-51
    design: "З19"
    verdict: holds
    note: >-
      (а) Признаков названо: у прочих доменов два, у notify на пути запроса один. (б) Выбран второй
      способ: класс поверхности `public`/`internal` в закрытой записи З9, гейт
      `notifysurfaceparity_test.go` сверяет перечень края по пакету notify с ней в обе стороны без
      `HasInternalSuffix`. Способ (а) отвергнут с доводом. (в) Инъекция и близнец названы, зелёного
      исхода у инъекции нет. Связка «класс ⇔ приставка имени» не делает класс производным от имени:
      класс пишется рукой из контракта, а расхождение с именем — красный, который требует решения.
    code_conditions: "Гейт не выводит класс из имени сервиса ни в одной ветке: класс читается только из строки записи, иначе связка тождественно истинна."
  - id: CX4V-55
    design: "З3, §6"
    verdict: holds
    note: >-
      Одиночка на уровне схемы, `INSERT … ON CONFLICT DO NOTHING RETURNING`, затем чтение, одна
      функция `Establish` на оба корня, писателей кроме неё нет (УК4-08). Довод «проигравший
      читает записанное, потому что конфликт ждёт коммита» верен только при READ COMMITTED: при
      REPEATABLE READ конфликт с коммитом после снимка даёт 40001, а чтение по снимку — ноль строк.
      Тот же класс замысел NTF-1 уже измерил (М31 NTF-1: умолчание изоляции задают база и роль).
    code_conditions: >-
      `Establish` исполняет оба оператора вне явной транзакции или в транзакции с явным
      `pgx.TxOptions{IsoLevel: pgx.ReadCommitted}`, а не с умолчанием сервера. Ноль строк чтения
      после нуля строк вставки — ошибка с текстом, а не «строки нет, вставляю снова». Проба NTF4-116
      гоняется и с `default_transaction_isolation = 'repeatable read'` у роли: исход тот же либо
      отказ старта с текстом, но не две строки и не молчаливый проход.
  - id: CX4V-56
    design: "З18 «Миграции», §8, §12"
    verdict: holds
    note: >-
      Кто мигрирует — названо (оба развёртывания). Накат исключает себя рекомендательным замком
      корня мигратора, ожидание ограничено `lock_timeout`. Отказ `notify-api` на схеме ниже —
      `RequireApplied` до подъёма слушателей, держатель УК4-28. Цена одной учётки базы названа, у
      остатка есть предикат снятия (§12).
    code_conditions: >-
      (1) `RequireApplied` определяет «применена ли версия» по последней строке версии в
      `goose_db_version` (`ORDER BY id DESC LIMIT 1`), а не по наличию любой строки с
      `is_applied`: откат версии пишет строку `is_applied = false`, и запрос из З18 такую версию
      сочтёт применённой. В corelib это уже умеет `dropguard.GooseApplied`
      (dropguard/preflight.go:79 @34bc810) — используется он, либо названо, почему второй читатель.
      (2) Имя замка `kacho_notify.migrate` отлично по `hashtext` от каждого имени `singlepass`,
      которое notify передаёт в `TryAcquire` (оба в одном пространстве ключей `hashtext(…)::bigint`,
      singlepass.go:87). Проба печатает оба множества значений. (3) Потеря соединения замка во время
      `Up` отменяет контекст наката, и мигратор выходит ненулевым кодом. Иначе второй мигратор входит,
      пока первый ещё применяет миграции.
  - id: CX4V-57
    design: "З1, З18"
    verdict: holds
    note: "Регистрация и Х5 — только в `apiserver`, его импортирует только `cmd/notify-api`; проба выводит достижимость через go/packages."
    code_conditions: "—"
  - id: CX4V-52
    design: "З13"
    verdict: holds
    note: "Реестр строит корень, наборы `SenderSet`/`APISet` передаются явно, регистрации при импорте нет (УК4-21). Состав `SenderSet` см. CX4V-64."
    code_conditions: "—"
  - id: CX4V-53
    design: "З4"
    verdict: holds
    note: "Один тип с состоянием на экземпляр, признак — `GaugeFunc` с `OR` при чтении, `deferred` недостижим построением у объекта ключа. Проба УК4-17 с близнецом."
    code_conditions: "—"
  - id: CX4V-54
    design: "З3"
    verdict: holds
    note: "Строка читается при старте, перечитывание сверяет с копией в памяти и в базу не ходит. Решение CX4V-07 это свойство не меняет."
    code_conditions: "—"
  - id: CX4V-58
    design: "З22"
    verdict: holds
    note: "Одно объявление `[]Knob`, выбор `notify-api` — теги групп и постоянные пакета, границы из того же `Knob`."
    code_conditions: "—"
  - id: CX4V-59
    design: "З18 «Порядок посадки относительно NTF-3»"
    verdict: holds
    note: "Порядок определяется предикатом на момент старта S3 с записью исхода; действия назначены для обоих исходов; изъятия сверяются УК4-27 на ревизии второй посадки."
    code_conditions: "—"
