      дайджеста объекта ключа — сразу `control_mismatch`; правка З4, УК4-06, строки §11;
      (2) CX4V-63 — встреча со стражем сноса: запись dropguard.json с производителем, одобрение в
      профиле перехода S1 у обоих init-контейнеров, условие снятия одобрения; §10 п.4 переписан; строка
      в tasks.md S1-A1; (3) CX4V-64 — метрики сняты с названными сигналами взамен либо переданы в
      приёмку; проба состава `SenderSet` против Р12; (4) CX4V-65 — исполнитель проходов уборки, их
      место в списке З11 и пакет `sentlog` в УК4-01а; (5) условия к коду CX4V-55 (изоляция
      `Establish`) и CX4V-56 (`RequireApplied` по последней строке версии, имя замка, потеря
      соединения замка); (6) §11 — строки CX4V-63…65; (7) §0 — перезакрепление на новую редакцию
      приёмки после RA-01, RA-02.
    basis: ".claude/rules/change-graph.md §4 «Классы риска размечаются ДВАЖДЫ, и второй раз — по замыслу»; SDD-1 §5 (новый механизм — новый пункт)"
  - to: автор приёмки NTF-4
    what: "RA-01 (Е1 замысла) и RA-02 одной редакцией; при варианте (б) CX4V-64 — строки двух метрик в Р12"
    basis: "правило опоры §1 приёмки; Д22"
  - to: автор проб notify (стадия S1)
    what: >-
      (1) интеграционная проба «накат цепочки S1 на базу, где ограда держит одну строку: без
      одобрения — отказ стража с именем таблицы, с одобрением — накат и `DROP`» (CX4V-63);
      (2) `dropguard_integration_test.go` notify — производитель записи dropguard.json;
      (3) NTF4-116 — вариант с `default_transaction_isolation = 'repeatable read'` у роли (CX4V-55).
    basis: "testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки» п.1; gate-authoring «отрицание только в паре с положительным»"
  - to: автор замысла NTF-1 (через диспетчера)
    what: >-
      Е2 замысла NTF-4 снимает ограду ключа сетки. Сама NTF-1 оставляет её, а старт NTF-1 пишет в
      неё строку. Значит, снос в S1 NTF-4 требует одобрения стража сноса на каждой установке, где
      стартовала NTF-1. Если NTF-1 примет модель Р11 до своей посадки (ограды нет вовсе), снос и
      одобрение не нужны. Выбор — в замысле NTF-1 (Е2 NTF-4, CX5-65 NTF-5).
    basis: "architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
  - to: tooling-maintainer
    what: >-
      Кандидат в класс (порог — два независимых места): «замысел заводит снос таблицы и не называет
      стража сноса, стоящего в накате». Здесь это один экземпляр, цена не измерена, — находка, а не
      класс. Запись класса не предлагается.
    basis: "code-authoring §«Механизм накопления опыта» п.1"
