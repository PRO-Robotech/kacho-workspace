# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы на 7d036fa6, f9e8de7e, 5f564162,
# 77ad7465, 53f865d8 и cb947e50 относятся к своим редакциям приёмки и здесь не переписываются.
