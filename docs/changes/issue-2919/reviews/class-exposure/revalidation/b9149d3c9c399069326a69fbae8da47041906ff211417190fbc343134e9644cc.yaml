new_items:
  - id: CX4V-63
    source: "З2 «Ограда ключа сетки NTF-1 снимается вместе с её предметом», §6 (`DROP TABLE recipient_key_fence`), §10 п.2, п.4; tasks.md S1-A1"
    kind: new_mechanism
    class: >-
      code-authoring §«Порядок операций внутри кода» (порядок снятия ресурса); measurement-discipline
      §«Радиус: по имени механизма и по точкам применения» (у механизма `DROP TABLE` в дереве есть
      страж, которого замысел не называет)
    exposure: >-
      Каждый мигратор дерева до наката зовёт `dropguard.Gate` (migratorrun/runner.go:162 @34bc810).
      Страж считает строки в каждой таблице, которую снесёт ещё не применённая миграция, и при
      числе больше 0 отказывает в накате, пока оператор не назовёт снос поимённо:
      `MIGRATOR_DROP_APPROVED=<версия>/<таблица>` (dropguard/preflight.go, `ApprovalEnv`; kacho
      docs/architecture/drop-preflight-counts-the-live-database.md, строка 48). В ограде ключа сетки
      на любой базе, где стартовала реплика NTF-1, одна строка: её пишет старт (З24 NTF-1). Поэтому
      на стенде S1 init-контейнер `migrate` обоих развёртываний откажет, и новые поды не встанут.
      Замысел этого не называет. В §10 п.4 он утверждает обратное: «Данных в ограде нет — это
      отпечаток ключа». Кроме того, заявленный снос требует записи в
      `services/notify/internal/migrations/dropguard.json`, а у записи — производителя: в kacho
      такие записи есть у 4 служб из 6, у каждой — `dropguard_integration_test.go`, и гейт
      `TestEveryDropGuardManifestHasAProducer` судит их связь. Ни записи, ни пробы в замысле и
      tasks.md нет.
    condition: >-
      (а) Замысел называет встречу снятия со стражем сноса и выбирает форму: запись в
      `dropguard.json` notify (`kind: retire`, `expect_rows: 0` — прогон цепочки строк не сеет) с
      производителем `dropguard_integration_test.go`; одобрение
      `MIGRATOR_DROP_APPROVED=<версия>/recipient_key_fence` у init-контейнера `migrate` обоих
      развёртываний — только в профиле, где идёт переход S1, и с условием снятия (страж печатает
      неиспользованное одобрение как устаревшее). (б) §10 п.4 переписан. Строка в ограде есть, и
      страж её считает. Откат S1 прежними образами невозможен: старт NTF-1 пишет в таблицу, которой
      нет, и отказывает. Значит, откат — это новая миграция заведения, и её несёт образ новее S1, а
      не прежний. (в) Окно переката З2 проверено против порядка стража: init-контейнер нового пода
      отказывает ДО наката, поэтому старые реплики продолжают резервировать под оградой, а переход
      не начинается. Одобрение должно быть на месте до выкатки, а не после отказа.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "нужен гейт, его нет: интеграционная проба «накат цепочки S1 на базу с оградой из одной строки — отказ стража без одобрения, накат с одобрением» — заказ"
  - id: CX4V-64
    source: "З6 (строки 428–430, `notify_sent_log_accept_mark_errors_total`), З10 (строка 592, `notify_ack_answer_unexpected_total`)"
    kind: new_mechanism
    class: >-
      code-authoring §«Контракт, который нельзя выразить» (закрытый перечень наблюдаемого с
      открытым дополнением); api-empty-means-empty (ряд без объявленного смысла)
    exposure: >-
      Приёмка Р12 (строка 1142): «Метрик notify, которых нет в таблице, NTF-4 не заводит».
      Замысел заводит две метрики, которых нет ни в таблице Р12, ни в приёмке и замысле NTF-1
      (`grep -c` по четырём документам — 0). Замысел утверждает, что «не меняет наблюдаемого
      поведения приёмки» (§12), а метрика — наблюдаемое поведение. Для `notify_ack_answer_unexpected_total`
      есть и второй источник того же факта: «ответ вне таблицы» классифицирует `deliver/peeranswer`
      NTF-1 со своим сигналом `misconfigured` (замысел NTF-1, строка 1309). Получается два
      счётчика об одном событии. Гейт `metricsregistration_test.go` (УК4-21) судит место
      регистрации, но не состав набора, поэтому расхождения с Р12 он не увидит.
    condition: >-
      Замысел выбирает одно из двух. (а) Метрик нет: провал отметки `accepted_at` и ответ вне
      таблицы видимы существующими сигналами — какими именно, названо. (б) Метрики нужны: их
      строки идут в приёмку той же редакцией, что Е1, и отображение §11 ссылается на новую строку
      Р12. При любом выборе держатель состава — проба, которая сверяет зарегистрированный набор
      `SenderSet` с таблицей Р12 в обе стороны (имя и метки). Инъекция — ряд вне таблицы —
      красный; близнец — набор ровно по таблице.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF4-113 судит только набор `notify-api`; у `notify-sender` состава не судит ничто — нужна проба, её нет: заказ"
  - id: CX4V-65
    source: "З6 «Срок» (строка 432), §6 (строки 1442–1445: уборка `canary_issue`, `feedback_message`, `feedback_event` каскадом), З11 (закрытый список писателей держателя), З13 (знаменатель и числитель долей)"
    kind: new_async_path
    class: >-
      code-authoring §«Решение и его следствие разнесены» (фоновая запись без названного
      исполнителя); §«Умолчание, которое становится утверждением» (окно, которое молча короче
      объявленного)
    exposure: >-
      Проходы уборки по сроку журнала (`sent_log`, `feedback_message`, `feedback_event` каскадом,
      `canary_issue`) — фоновые записи, но исполнитель у них не назван. Подметальщик подавлений
      назван: держатель одиночки (З9). Про эти проходы не сказано ни кто их ведёт, ни под арендой
      ли, ни каков предел партии. В закрытом списке писателей держателя (З11) их нет, пакета
      `sentlog` нет среди пакетов гейта УК4-01а. Второе следствие: доли `hard_bounce_rate` и
      `complaint_rate` берут числитель из `feedback_event`, а знаменатель из `sent_log` в окне
      `REPUTATION_WINDOW` (граница 1 ч … 30 сут, Р16). Уборка удаляет обе стороны старше
      `SENT_LOG_RETENTION` (граница 7 сут … 90 сут). При окне 30 сут и сроке 7 сут действующее окно
      — 7 сут. Приёмка допускает такую пару: зависимой границы между этими ручками нет. Ручка
      принимается, а её значение действует не целиком.
    condition: >-
      (а) Замысел называет исполнителя каждого прохода уборки: держатель одиночки на такте, в
      транзакции, открытой продлением, — тогда проходы входят в закрытый список З11, а `sentlog` —
      в пакеты УК4-01а. Если исполняет каждая реплика — названо, почему параллельные `DELETE` без
      аренды безопасны. Предел партии и часы (З23) названы. (б) Связь окна и срока закрывается
      приёмкой: зависимая граница `REPUTATION_WINDOW ≤ SENT_LOG_RETENTION` в Р16 (RA-02). Тогда
      `config.checkCrossBounds` проверяет её вместе с прочими, а проба Р16 получает инъекцию на
      эту пару.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "(а) — нужен гейт: УК4-01а по пакету `sentlog`; (б) — после RA-02, проба Р16"

