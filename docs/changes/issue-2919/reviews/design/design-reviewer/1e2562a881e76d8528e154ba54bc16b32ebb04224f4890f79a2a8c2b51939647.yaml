critical:
  - id: R9-1
    maps: "RV9-01, Е10, R8-1"
    where: "design.md:2065 (Е10 «снята… состав волны записывает автор маршрута NTF-3»), :1511-1516; tasks.md:230, :248; против docs/changes/issue-2918/tasks.md:302-303"
    finding: >-
      Маршрут NTF-3 (@24f31fd00, без правки в рабочем дереве): «Н3-Ф3а | … S3-C2, S3-C4, S3-C5, S3-C6, S3-C7 NTF-4
      в части носителя | до Н3-Ф4», а S2-B7 — в «Н3-Ф4». Исход Д113 (б) («S3-C2н, S3-C6н и S2-B7 — один запрос
      волны») этим маршрутом не исполняется: диспетчер, раскладывающий волны по маршруту NTF-3, выкатит
      развёртывание notify-api с пустым служимым набором (serve.go:496-498 → отказ старта, CrashLoop, красный
      rollout-ready). Решение записано в одном документе, следствие исполняет другой, который ему противоречит.
      Корректность Основы, тот же дефект, что R8-1.
    requirement: >-
      Завести в §13 зависимость (Е11) на автора маршрута NTF-3 с предикатом снятия на внешнем факте; пока
      предикат «нет», S3-C6н и S3-C8н не стартуют. В §2б назвать следствие: запрос волны ждёт цепочку NTF-3
      S2-B4 → S2-B1 и Е2. Параллельно — правка маршрута NTF-3 (снять «Н3-Ф3а … до Н3-Ф4», одна строка волны).
    predicate: >-
      Замысел: grep -c 'Е11' в §13 design.md ≥ 1 со ссылкой на issue-2918/tasks.md. Маршрут:
      в docs/changes/issue-2918/tasks.md §4 есть одна строка волны, содержащая и 'S2-B7', и 'S3-C6';
      grep -c 'до Н3-Ф4' docs/changes/issue-2918/tasks.md → 0.
  - id: R9-2
    maps: "RV9-03, Е10"
    where: "design.md:1517-1523 (предикат посадки); tasks.md:240 (DoD S3-C6н)"
    finding: >-
      Держатель исхода (б) вычисляется на слиянии C, уже лежащем в ветке эпика, и читает напечатанное
      пробой З9 число, а З9 по RV8-07 ноль строк считает законным и не падает. Утверждение «коммита ветки
      эпика с развёртыванием и пустым набором не бывает» ничем не удерживается до вливания — это
      ретроспективный замер, а не держатель. Корректность держателя решения.
    requirement: >-
      Шаг на сведённой голове волны до запроса в ветку эпика: если дельта волны к базе ветки эпика добавляет
      deploy/helm/notify/templates/deployment-api.yaml, проверка «строк записи у notify-api ≥ 1» завершается
      ненулевым кодом на нуле. Назвать исполнителя шага (сборщик волны или посадка) и место команды.
      Предикат на C оставить ретроспективным контролем.
    predicate: >-
      В DoD S3-C6н (или S3-C7н) записан шаг с ненулевым кодом на нуле и инъекция: сведённая голова с
      deployment-api.yaml без S2-B7 → красный; близнец с S2-B7 → зелёный.

