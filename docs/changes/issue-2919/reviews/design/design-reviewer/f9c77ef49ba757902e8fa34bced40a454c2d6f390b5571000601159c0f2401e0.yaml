critical:
  - id: R8-1
    maps: "RV8-02, Е10"
    where: "design.md §13 Е10; tasks.md §1 Е10, §2б S3-C6н; corelib servicehost/serve.go:496-499 @v1.10.0"
    finding: >-
      На волне Н3-Ф3а у notify-api служимый набор пуст (регистрации NTF-3 S2-B7 — волна Н3-Ф4, своих в Основе
      нет). serve.go: len(out) == 0 → ошибка «Ноль целей есть ОТКАЗ», Х5 распространяет отказ на форму
      «только внутренний слушатель». Развёртывание с replicas ≥ 2 и maxUnavailable: 0 на такой волне —
      CrashLoopBackOff, rollout-ready стенда красный и читается как поломка продукта. Исход не выбран.
      Корректность Основы.
    requirement: >-
      Записать один исход: (а) зонтик рендерит Deployment notify-api только вместе с регистрациями, признак
      выводится из того же источника, что kacho.notify.present (не новая ручка-флаг); либо (б) S3-C2н/S3-C6н
      и S2-B7 — одна волна, ребро маршрута. Гейт под выбранный исход назвать в DoD S3-C6н.
    predicate: >-
      (а) helm template зонтика Основы без регистраций NTF-3 → Deployment notify-api отсутствует; близнец с
      регистрациями → присутствует. (б) tasks §2б: S3-C6н зависит от S2-B7 issue-2918 той же волны.
  - id: R8-2
    maps: "RV8-03, Е8"
    where: "design.md §2а строка З19, §13 Е8; tasks.md §2б S3-C4н"
    finding: >-
      prefixToBackend[ids.PrefixOperationNotify] в Основе не собирается: git -C corelib grep -c '"nop"' v1.10.0
      -- ids/ids.go → нет совпадений; постоянная есть только в 4dabea4 (ids/ids.go:127). Вариант (б) «другой
      производитель» без ограничения разрешает локальную постоянную края — второе написание одного префикса
      и расхождение каталога. Конструируемость.
    requirement: >-
      Закрыть Е8 вариантом (а) (Х1 в Основе, тег в окне Основы) либо (б) с явным запретом: производитель —
      только каталог corelib ids; литерала "nop" в не-тестовом gateway/ нет.
    predicate: "git grep -c '\"nop\"' -- 'gateway/**/*.go' ':!*_test.go' → 0; ключ записи — ids.PrefixOperationNotify"
  - id: R8-3
    maps: RV8-01
    where: "design.md:1377 «23 ручки GroupNTF4 стадии S1», :1386 «33 ручки», :1820 «33 ручки»; tasks.md:120 «23 ручки S1» против §2а design.md:1473 «21 ручка … 31 ручки»"
    finding: >-
      Два места об одном числе, держатель Р16 (required_knobs_test.go) утверждает число в коде пробы:
      исполнитель S1-A6/S3-C2н получает противоречивое требование. После Д96 (DNS-ручки ушли в NTF-1) верно
      21/31. Конструируемость.
    requirement: "Привести З22, З14, §8, §11 CX4V-23 и tasks S1-A6 к 21/31 одной правкой."
    predicate: "grep -cE '\\b(23|33) ручк' design.md tasks.md → 0, 0"
  - id: R8-4
    maps: RV8-04
    where: "design.md:84-99 (§0, «редакция 22 — вердикта нет»), шапка ред. 8 («приёмка — редакция 24»)"
    finding: >-
      Замысел закреплён на редакции 21, а §2а судится по §0а редакции 25; три разных номера редакции
      приёмки в одном файле. Одобрение на незакреплённой опоре — вердикт не о том предмете.
    requirement: "Перезакрепить §0 на d337b360 (ред. 25), снять «вердикта нет», пересчитать Е1; шапка ред. 8 — тот же номер."
    predicate: "grep -c 'd337b360' design.md ≥ 1 в §0; grep -c 'редакция 24' design.md → 0"

