axes:
  atomicity_no_dual_write: >-
    закрыто. Снятие подавления и запись аудита — одна транзакция (З17), operation_id UNIQUE; событие
    обратной связи, подавление, метка опроса и отметка дайджеста — одна транзакция на сообщение
    (З7); синхронный 5xx на RCPT — запись подавления отдельной транзакцией ДО Ack, повтор — refreshed (З10).
  idempotency: >-
    закрыто. feedback_message по дайджесту, feedback_event по (sent_log_id, kind), sent_log по
    (ns, feed_row_id) с переиспользованием, suppression по UNIQUE ключу с ON CONFLICT DO UPDATE,
    Establish — INSERT ON CONFLICT DO NOTHING + чтение; накат goose идемпотентен.
  atomic_and_optimistic_concurrency: >-
    закрыто. Аренда — CAS взятия (INSERT … ON CONFLICT / UPDATE … WHERE lease_until <= $now) и
    продления (holder, epoch, lease_until > $now) первым оператором каждой транзакции держателя —
    строчный замок feedback_lease сериализует транзакции держателя с взятием; переходы признаков —
    UPDATE … WHERE value = $from; удаление — условный DELETE … RETURNING. Пробы с конкурирующими
    горутинами заказаны: NTF4-116 (Establish, 50 повторов -race), NTF4-31 (Apply, 8 горутин),
    NTF4-86 (Delete с барьером), УК4-01 (два экземпляра с разными часами).
  change_delivery_polling: >-
    закрыто. Watch/стрима нет; Delete возвращает Operation, опрос — через край prefixToBackend[nop].
  workers_and_reconcilers: >-
    ВОПРОС → К1. Одиночка установки — аренда с эпохой (З11), довод против singlepass назван. Сверщик
    операций — corelib operations.NewReconciler в корне notify-api. Дедлайн на внешнем вызове сеанса
    ящика не назван (К1).
  inter_service_edges: >-
    закрыто. край → notify-api (внутренний слушатель), notify-api → kaname Check, notify → kaname
    ResolveSend и лента; kaname и домены notify не зовут. Рёбра записаны в правиле
    (.claude/rules/polyrepo.md:60-62, poly-edge-notify-kaname несёт Check снятия). Нового
    незаписанного ребра нет.
  replica_state_isolation: >-
    закрыто. Признаки установки — строки базы, не-держатели читают каждым тактом; признаки реплики —
    GaugeFunc над своим процессом; контрольное значение сверяется с базой на старте.
  edge_ban6: >-
    закрыто. InternalSuppressionService только на внутреннем слушателе notify-api (публичного
    сервера в форме HostInternalOnly не строится), на крае — только внутренний mux; класс
    поверхности объявлен записью З9 и сверен гейтом в обе стороны (З19).
  clean_architecture: >-
    закрыто. apiserver импортирует только cmd/notify-api, порты — параметры конструкторов, реестр
    метрик и Func строит корень; проба по графу импортов.
  d28_drop_approval_path: >-
    закрыто. dropguard.Gate вызывается внутри Runner.Up до goose на том же db (runner.go:162),
    значит под замком мигратора notify (З18) — одобрение из двух init-контейнеров применяет ровно
    один накат, второй видит снос применённым. Имя переменной — dropguard.ApprovalEnv, прежнее
    написание страж ещё читает (envknob.Get(ApprovalEnv, LegacyApprovalEnv)), но чарт его не
    рендерит — одного источника достаточно. Пустой ключ — переменной нет, близнец в УК4-36.
    Серверные контейнеры переменной не получают. Одобрение сноса — не секрет, раскрытия нет.
    Посадку ствола без ключа держит правило §0 tasks.md (строка Д26 · 4 (5)).

