critical:
  - id: К1
    lane: S1-A3 (и S1-A4 — путь контрольного письма)
    coordinate: design.md З7 (строки 501–534), З11 (строки 690–694, 718–722), З12 (строка 749); tasks.md:92
    finding: >-
      У сеанса ящика нет срока ни на одну сетевую операцию. Клиент POP3 (Dial, рукопожатие TLS,
      USER/PASS/STAT/UIDL/RETR/DELE/QUIT) не несёт ни context.WithTimeout, ни conn.SetDeadline, кроме
      срока «сейчас», который ставится только при потере аренды (строка 529). При этом независимая
      горутина продлевает аренду «пока сеанс открыт» (строка 524). Сервер ящика, принявший TCP и
      замолчавший (полуоткрытое соединение, зависший RETR), даёт держателя, который продлевает
      аренду вечно и не делает ничего: смены держателя нет (граница приёмки «упавшего держателя
      сменяет другая реплика не позже TTL + POLL_INTERVAL», NTF4-97, обходится — держатель не упал),
      очередь ящика стоит. Сеанс идёт внутри такта держателя (§7 п.3, lease.Tick — З11 строка 719),
      а выпуск контрольного письма и переходы признаков установки, включая feedback_stale, вычисляет
      только держатель на такте (З12, З13 строка 795) — поэтому feedback_stale при зависшем сеансе
      не поднимается никогда, и инвариант Р12 «сигнал при опросе старше POLL_STALE_MAX» ломается
      без следа. То же у canary.Send: срок SMTP-сессии контрольного письма не назван (у пути строк он
      есть — smtpSessionTimeout NTF-1, issue-2915/design.md:1083, 1801). Правило
      arch-per-call-deadline: у каждого внешнего вызова свой срок.
    requirement: >-
      Условие к коду без новой ручки (в форме Д26 — строка отображения в §11 и в полосе S1-A3):
      (1) у каждой сетевой операции POP3 — Dial, рукопожатие, каждая команда с ответом и каждое
      чтение тела RETR — срок по реальному монотонному времени (conn.SetDeadline, продлеваемый на
      прогрессе чтения), постоянная кода, выведенная из LEASE_TTL (не больше LEASE_TTL / 3) — так
      «длительность сеанса ничем не ограничена» приёмки сохраняется, а молчание сервера — нет;
      срабатывание срока закрывает соединение без QUIT (незафиксированное остаётся в ящике, Р21),
      останавливает независимое продление и завершает такт временным сбоем опроса; (2) canary.Send
      получает контекст со сроком smtp.sessionTimeout NTF-1 и передаёт его примитиву smtp.Session;
      (3) шаг такта, вычисляющий признаки, не зависит от исхода сеанса — либо назвать, что он идёт
      после сеанса, срок которого ограничен (1). Держатель — вариант NTF4-104 / УК4-02: П10 принимает
      RETR и молчит → сеанс закрыт в пределах срока, продлений после него 0, следующий такт
      открывает новый сеанс, feedback_stale поднимается после POLL_STALE_MAX при постоянном
      молчании; близнец — NTF4-104 как есть (медленный, но идущий RETR на управляемых часах) остаётся
      зелёным: срок сети — реальное время, а не внедрённые часы.

