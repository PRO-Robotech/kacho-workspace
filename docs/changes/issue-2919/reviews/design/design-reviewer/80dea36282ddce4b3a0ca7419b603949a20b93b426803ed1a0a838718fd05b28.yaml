minor:
  - id: М1
    coordinate: design.md З11 строки 718–722 против З9 строки 605–607 и строки Д26 · 6 (1)
    finding: >-
      З11 утверждает «единственный таймер вне такта — независимое продление сеанса», а З9 и Д26 · 6
      заводят подметальщик (и уборку по сроку) на своём таймере SUPPRESSION_SWEEP_INTERVAL. Два
      места об одном предмете расходятся. Корректность не страдает: и транзакция сообщения, и
      партия уборки первым оператором продлевают аренду, строчный замок feedback_lease их
      сериализует (удаление строки sent_log, на которую ссылается фиксируемое событие, не
      пересекается с фиксацией).
    requirement: >-
      Выровнять текст: либо подметальщик — шаг lease.Tick, либо З11 называет второй таймер
      держателя и довод сериализации замком строки аренды. Не блокирует.
  - id: М2
    coordinate: design.md З17 строки 942–954; corelib operations/reconciler.go:187-196
    finding: >-
      Resolver сверщика читает аудит и запись подавления вне транзакции fn. Гонки с живым RunSync
      нет только потому, что сверщик берёт операции старше OrphanGrace (умолчание 5 мин), а RunSync
      ограничен сроком запроса (HANDLING_BUDGET ≤ 60 с). Это граница по построению, но в замысле
      она не названа.
    requirement: >-
      Назвать в З17: OrphanGrace сверщика notify-api строго больше верхней границы
      …_HANDLING_BUDGET (значение из конфигурации сверщика, а не умолчание по памяти). Не блокирует.
  - id: М3
    coordinate: design.md З14 строки 862–869
    finding: >-
      Срок одного DNS-запроса проверок и перепроверки не назван; ограничены только повтор при
      старте (DNS_BOOT_DEADLINE) и стандартный резолвер (таймауты resolv.conf).
    requirement: >-
      Назвать срок запроса (context.WithTimeout на каждый Lookup*) постоянной кода. Не блокирует:
      перепроверка на отдельном таймере, аренды не держит.

