prior_findings:
  К1: >-
    закрыто. Срок на каждую сетевую операцию POP3 (Dial, TLS, семь команд, продление на прогрессе
    RETR) — pop3.opTimeout 10 с ≤ наименьшего LEASE_TTL / 3, реальное время; срабатывание закрывает
    соединение без QUIT и гасит независимое продление. Сеанс вынесен из такта, признаки считает
    такт, поэтому feedback_stale поднимается при зависшем сеансе (УК4-37 (б)). canary.Send под
    сроком min(smtp.sessionTimeout, LEASE_TTL / 3) (УК4-38 с инъекцией и близнецом). «Капающий»
    сервер ограничен io.LimitReader на сообщение и перечнем UIDL — цена конечна и названа.
  М1: закрыто — З11 называет два таймера вне такта и сериализацию строчным замком feedback_lease.
  М2: закрыто — reconcileOrphanGrace 5 мин явно в корне, строго больше верхней границы HANDLING_BUDGET 60 с; контекст обработчика в RunSync не отвязывается (УК4-39).
  М3: закрыто — dnscheck.queryTimeout 5 с; отмена родителя исходом не считается (близнец УК4-40).

axes:
  atomicity_no_dual_write: закрыто; дельта транзакционных границ не меняет.
  idempotency: >-
    закрыто; обрыв по сроку после коммита и до QUIT оставляет сообщение в ящике, повтор даёт
    duplicate по дайджесту (Р14).
  atomic_and_optimistic_concurrency: >-
    закрыто. Сеанс и такт теперь пересекаются на каждом такте; явный ReadCommitted у всех
    транзакций держателя делает утверждение о строчном замке истинным (под repeatable read было бы
    40001), держатель УК4-37 (г) с инъекцией умолчания роли.
  change_delivery_polling: закрыто; не затронуто.
  workers_and_reconcilers: >-
    закрыто. Горутина сеанса не больше одной, признак «сеанс идёт» снимает она сама, новый сеанс
    после смены эпохи не стартует до выхода прежнего; работа держателя ждёт обе горутины, пул
    закрывается после (УК4-37 (в)). Разрыв продлений без сеанса ≤ POLL_INTERVAL + LEASE_TTL / 3 ≤
    LEASE_TTL / 2 + LEASE_TTL / 3 < LEASE_TTL по границе Р16 (LEASE_TTL ≥ 2 × POLL_INTERVAL) —
    выводится, но в замысле не выписан (М5).
  inter_service_edges: закрыто; новых рёбер дельта не вводит.
  replica_state_isolation: закрыто; не затронуто.
  edge_ban6: закрыто; не затронуто.
  clean_architecture: >-
    закрыто; canary.AttemptTimeout вычисляется один раз в корне cmd/notify и передаётся в пакет —
    связывание в композиционном корне.
  d28_drop_approval_path: закрыто прежней записью; дельта строку Д26 · 4 не меняет.

