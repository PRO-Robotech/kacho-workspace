minor:
  - id: М4
    coordinate: design.md З7 «Независимое продление» (строка 555 «Соединение — своё, из пула»), З11 строки Д26 · 7 (4)–(7)
    finding: >-
      С редакции 6 держатель одновременно держит до четырёх соединений (независимое продление,
      транзакция сообщения сеанса, транзакция такта, партия подметальщика) плюс пути писем NTF-1 на
      том же пуле. Размер пула и срок захвата соединения для продления не названы; при исчерпании
      пула продление ждёт захвата, и аренда может уйти. Безопасность держит эпоха в условии фиксации,
      страдает только живость (лишняя смена держателя).
    requirement: >-
      Назвать в handoff S1-A3 / S1-A5: захват соединения независимым продлением — под сроком не
      больше LEASE_TTL / 3, наименьший размер пула сверен с числом одновременных соединений
      держателя. Не блокирует.
  - id: М5
    coordinate: design.md З11 «Порядок в такте, сеанс вне такта»; §8
    finding: >-
      Граница «аренда без сеанса доживает до следующего такта» держится неравенством
      POLL_INTERVAL + canary.AttemptTimeout < LEASE_TTL, которое выводится из Р16 (LEASE_TTL ≥
      2 × POLL_INTERVAL) и min(…, LEASE_TTL / 3), но нигде не выписано; при будущей правке любой из
      трёх величин его не увидит ни текст, ни проба.
    requirement: Выписать неравенство в З11 рядом с И24 тем же заходом, что следующая правка замысла. Не блокирует.

