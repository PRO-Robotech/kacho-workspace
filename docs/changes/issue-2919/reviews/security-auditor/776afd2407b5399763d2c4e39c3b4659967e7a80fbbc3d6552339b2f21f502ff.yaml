surface: >-
  Новых RPC, слушателей, записей каталога и отношений модели нет. Новый секретный материал один —
  ключ отпечатка адреса. Он живёт в отдельном объекте Secret и монтируется томом целиком, только на
  чтение. В карту конфигурации попадает только путь каталога. Шаблон ключ не порождает; пустое
  значение, негодная форма и два способа сразу дают отказ рендера, и в тексте отказа нет ни значения,
  ни длины. Страж старта читает файл и отказывает при длине меньше 32 октетов, текст отказа тоже без
  материала. Хеш checksum/address-key считается от рендера, где 256 бит случайного материала, прообраз
  не восстановить. Посев стенда создаёт объект один раз и не перечеканивает. На SUPPRESSED пин corelib
  e7d6197fc5dc пока отвечает отказом: значения 8 там нет, проверка Ack его не пропускает.
