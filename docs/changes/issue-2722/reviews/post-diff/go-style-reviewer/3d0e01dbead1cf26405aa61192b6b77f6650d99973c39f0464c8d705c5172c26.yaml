approved:
  no_prod_go_touched: >-
    предикат назван и повторяем: git diff --name-only ac33f733...ea44be6e --
    '*.go' | grep -v '_test\.go$' | wc -l → 0. Ни services/*/internal/**, ни
    pkg/**, ни gateway/** (кроме deploy/values.yaml), ни **/cmd/*/main.go дифф
    не трогает. Направление зависимостей, тонкость handler'ов и слои по этому
    диффу НЕ судятся — их предмета в нём нет.
  no_panic_no_background_ctx: >-
    в семи новых файлах ноль вхождений panic(, context.Background, log.Fatal,
    MustParse (перемерено grep'ом по каждому файлу). Отказ везде через t.Fatalf
    и t.Errorf — верное разделение: Fatalf там, где дальше судить не о чем
    (файл пина не разобран, таблица стендов пуста), Errorf там, где обход обязан
    досчитать и напечатать ВСЕ находки разом.
  refusal_restores_the_next_step: >-
    каждый t.Fatalf называет координату и следующий шаг, а не только факт
    неудачи: «прогони go mod download … и повтори» (kanameModuleDir:122),
    «почини разбор, а не выписывай число рядом» (memoryPerVerificationAtCeiling:225),
    «Поднимите предел до N байт либо уменьшите ёмкость» (judgeLaneMemoryBudget:154),
    и отдельная ось инъекции требует именно этой величины
    (TestLaneMemoryBudgetJudgement_NamesTheNeededNumber:128).
  pure_judgement_separated_from_reading: >-
    во всех трёх парах судящая функция ЧИСТАЯ и принимает факты аргументом
    (judgeOwnStacks, judgeLaneMemoryBudget, judgeSecondFactorDeclarations), а
    чтение дерева вынесено в read*Facts. Следствие, ради которого это и сделано:
    инъекция подаёт синтетический вход, не трогая ни общего клона, ни кэша
    модулей. Признак, отличающий пина от кэша, тоже подаётся аргументом
    (pinNeedsBinding, perCheck) — оси не зависят от состояния диска.
  census_prints_two_numbers_not_one: >-
    все три переписи печатают И объём осмотренного, И объём предметного
    (ownStackCensus: стендов · из них на own; laneBudgetCensus: стендов · own ·
    объявляют числа полосы · байт на проверку; knobCensus: из пина выведено ·
    сверх пина проверено). Одно число скрыло бы ровно тот случай, ради которого
    проверка заведена, — и это сказано в коде, а не только в шапке.
  empty_walk_is_a_refusal: >-
    пустой обход везде отказ, а не «находок нет»: len(facts)==0 → Fatal в трёх
    предметных пробах; census.Own==0 в own_posture_stack_test.go — НАХОДКА, а не
    молчание (judgeOwnStacks:158), и это верно: состояние дерева до задачи и
    было нулём, молчащая здесь проверка не поймала бы свой предмет. Инъекция
    закрепляет это отдельной осью (TestOwnStackJudgement_AbsentOwnStackIsAFinding).
  naming_ascii: >-
    ban #17 цел. Все новые идентификаторы латиницей (laneBudgetFacts,
    laneBudgetCensus, judgeLaneMemoryBudget, memoryPerVerificationAtCeiling,
    argon2MemoryOf, kanameModuleDir, ceilingKeysOfPin, accessKeyKnobsOfPin,
    kanameServiceConfig, configSection, ownCeilingsSet, knobCensus,
    ownStackFacts, ownStackCensus, judgeOwnStacks, readOwnStackFacts,
    declaredString, secondFactorStackFacts, secondFactorCensus,
    judgeSecondFactorDeclarations, readSecondFactorStackFacts, legalOwnStack,
    legalOwnStackFacts, legalExternalStackFacts, legalBudgetStack, injPerCheck,
    containsConfigKey, parseMemoryQuantity, asInt64, maxInt64). Кириллица —
    только в комментариях, именах подпроб и текстах находок: законна, обязана
    остаться, под запрет не подпадает.
  name_collision_measured_not_assumed: >-
    declaredString (own_posture_stack_test.go:237) несёт шапку, объясняющую, ПОЧЕМУ
    имя не `str`: под признаком сборки `helmcharts` в этом же пакете уже есть
    помощник с таким именем, и обычная сборка тех файлов не читает — пакет
    собирался бы зелёным, а под признаком не собирался бы вовсе. Класс назван
    верно, и он неочевиден: обычный прогон о нём не узнал бы.
  no_magic_numbers: >-
    величины названы константами (secondFactorEnv, selfServiceFreshnessKey/Env/Value,
    accessKeysCeilingKey, kanameModulePart, injPerCheck), а не вписаны в тело.
    Единственные литералы в предметных пробах — координаты внутри пиненного
    модуля (пути файлов), и они по определению литералы.
  defer_and_resources: >-
    ресурсов, требующих освобождения, новые файлы не открывают: parser.ParseFile
    и os.ReadFile закрывают за собой, exec.Command(...).Output() — тоже. Течи нет.
  exec_without_context_is_prior_art: >-
    kanameModuleDir:113 зовёт exec.Command("go","env","GOMODCACHE") без контекста.
    Находкой НЕ является: перемерено по каталогу — exec.Command в deploy/ несут 9
    файлов, exec.CommandContext — 0, то есть это установленный порядок пакета, а
    не решение этого диффа; и класс «внешний вызов без своего предела» относится
    к рабочему пути службы, которого здесь нет вовсе.
  reading_the_pin_is_the_opposite_of_a_copy: >-
    ban #20 не нарушен, а ИСПОЛНЕН. Запрет касается копии ФАЙЛА чужого
    репозитория в этом дереве; здесь файла нет — есть чтение исходников по пину
    из кэша модулей, с резолвом через go.mod (версия) и `go env GOMODCACHE`
    (каталог), то есть по признаку, который дерево ПРОИЗВОДИТ. go.mod диффом не
    тронут (перемерено: git diff --name-only не называет ни одного go.mod),
    ребро сборки не заводится, рёбер полирепо дифф не меняет. Это ровно тот
    порядок, который ban #20 и предписывает взамен копии.

