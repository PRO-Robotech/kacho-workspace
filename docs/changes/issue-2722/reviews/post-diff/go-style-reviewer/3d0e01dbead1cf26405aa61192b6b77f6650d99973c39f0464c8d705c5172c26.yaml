  - id: BINDING-ARMS-FROM-A-TOKEN-THAT-DOES-NOT-EXIST-YET
    coord: >-
      deploy/own_ceilings_and_access_keys_umbrella_test.go:166-180 ·
      deploy/own_posture_stack_test.go:169
    what: >-
      accessKeyKnobsOfPin ищет `accessKeyRequirement("…")`. Перемерено у пина:
      совпадений 0 — и это ЗАКОННО, шапка это называет прямо (строки 45-51).
      Следствие: пустой исход читателя означает одновременно «привязки у службы
      ещё нет» и «читатель сломался», а от него вооружается условие
      pinNeedsBinding в own_posture_stack_test.go:169 и вся вторая половина
      TestAccessKeys_RenderEmitsTheBindingUnderOwn (цикл «перечень пина не должен
      УЙТИ ВПЕРЁД», строки 304-310). Появись привязка у службы под другим именем
      помощника — обе проверки промолчат, а не покраснеют.
      Инъекция TestOwnStackJudgement_BindingArmsItselfWithThePin доказывает, что
      СУДЬЯ вооружается (признак подаётся аргументом), — и она права; но
      вооружается ли ЧИТАТЕЛЬ, не доказывает ничто.
    requirement: >-
      привязать читателя к якорю, обязанному существовать на ЛЮБОМ пине: в том же
      required_settings.go счёт `Requirement(` даёт у пина 23 (перемерено).
      Ноль по этому якорю означает, что читатель сломался, и обязан быть
      t.Fatalf; ноль ключей привязки при ненулевом якоре — законный исход, как
      сейчас. Тогда «привязки нет» отличимо от «прочитать не удалось».
    blocks: false

