important:
  - id: AST-READER-DEGRADES-SILENTLY
    coord: deploy/own_lane_memory_budget_test.go:210 · argon2MemoryOf:232-268
    class: doc-truthfulness + gate-authoring (проверка, способная молча позеленеть)
    claim_in_code: >-
      шапка файла, строки 41-43: «Сменится форма таблицы — разбор не найдёт
      ничего и ОТКАЖЕТ; молча устареть он не может, и это единственное, что
      отличает чтение источника истины от его копии».
    what_is_true_instead: >-
      это верно для ГРУБОЙ смены формы и неверно для смены формы ОДНОЙ ЗАПИСИ.
      argon2MemoryOf возвращает (0,false) в ЧЕТЫРЁХ разных случаях, и вызывающий
      их не различает: (1) у записи нет ключа `Ceiling` — законно; (2) значение
      `Ceiling` не CompositeLit; (3) ключ параметра не *ast.Ident (например
      `domain.CostParamArgon2Memory` — SelectorExpr); (4) величина не десятичный
      BasicLit (`128 * 1024`, именованная константа, `0x20000`, `131_072`).
      Случаи 2-4 — смена формы, и каждый неотличим от случая 1, потому что
      обработчик у них один: `} else if bcryptBytes > worst {`.
    why_the_confusion_is_structural: >-
      путь «не нашли» УЖЕ живой и УЖЕ законный на сегодняшнем пине: первая запись
      таблицы (bcrypt) несёт `Ceiling` БЕЗ `CostParamArgon2Memory`
      (password_hash_format.go:180-183 у пина), поэтому падение на bcrypt-постоянную
      — штатный исход, а не признак поломки. Различить «законно нет потолка
      argon2» и «потолок есть, но разобрать нечем» разбор не может by construction.
    direction_and_size_of_the_error: >-
      в сторону ЗЕЛЁНОГО и на четыре порядка. Перемерено у пина
      v0.4.1-0.20260917085954-16b5cadead2a: потолок argon2 = 131072 КиБ → 134217728
      байт на проверку; bcrypt-постоянная = 10328 байт. При молчаливом падении
      бюджет 8 × 134217728 + 268435456 = 1342177280 (1280 МиБ) превратился бы в
      8 × 10328 + 268435456 = 268517080 (≈256 МиБ) — и предел 512Mi, то есть
      РОВНО исходный дефект, ради которого проба заведена (шапка, строки 16-26),
      прошёл бы зелёным. Сторож `records == 0 || worst == 0` (строка 222) при этом
      НЕ срабатывает: записей две, worst ненулевой.
    armed_today: >-
      да. Перемерено по пину: разбор резолвится, worst = 134217728 байт, бюджет
      1280 МиБ — арифметика шапки сходится. Дыра вооружается не сегодня, а на
      первом подъёме пина, меняющем форму литерала, — то есть там же, где
      расхождение и опасно.
    requirement: >-
      сделать отказ ТОТАЛЬНЫМ: argon2MemoryOf обязана вернуть три состояния, а не
      два — «ключа `Ceiling` нет» (законно, падать на bcrypt), «ключ есть и
      прочитан», «ключ есть и НЕ прочитан» (t.Fatalf с координатой записи).
      Отдельно: strconv.ParseUint(lit.Value, 10, 64) → база 0, иначе `0x`- и
      `_`-формы, законные для Go, читаются как поломка; и значение НЕ BasicLit
      обязано давать третье состояние, а не второе.
    predicate_of_closure: >-
      в пиненном модуле заменить `CostParamArgon2Memory: 131072` на
      `CostParamArgon2Memory: 128 * 1024` (форма, эквивалентная для Go) и
      прогнать TestOwnLaneMemoryBudget_ProfilesDeclareALimitThatTheGuardAccepts:
      сегодня проба зеленеет с перечнем «память одной проверки 10328 байт»,
      после фикса обязана ОТКАЗАТЬ с именем записи. Ось ставится в инъекционного
      близнеца — синтетическим *ast.CompositeLit, без правки пина.
    blocks: false

