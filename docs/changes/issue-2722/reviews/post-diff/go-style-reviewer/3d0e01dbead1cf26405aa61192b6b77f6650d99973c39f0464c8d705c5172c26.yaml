style:
  - id: SHADOWS-BUILTIN-CAP
    coord: deploy/own_lane_memory_budget_test.go:324
    note: >-
      `cap, okCap := lookup(...)` затеняет предобъявленный `cap`. Go это
      разрешает, но в области, где рядом делается арифметика по срезам, имя
      обманчиво. Короче и без тени: `capacity` либо `c`.
  - id: MAXINT64-DUPLICATES-BUILTIN
    coord: deploy/own_lane_memory_budget_test.go:369
    note: >-
      go.mod дерева объявляет `go 1.26.0`, встроенный `max` есть с 1.21 —
      `maxInt64(a, b)` дублирует его. LEAN: снять помощника, звать `max`.
  - id: DOC-COMMENT-NAMES-ANOTHER-FUNCTION
    coord: deploy/own_ceilings_and_access_keys_umbrella_test.go:217
    note: >-
      `// section — …` стоит над `func configSection`. Конвенция godoc (и стиль
      остальных файлов диффа, где каждая шапка начинается с имени) требует
      `// configSection — …`. Поиск по имени такую шапку не находит.
  - id: YAML-DECODE-ERROR-READS-AS-END-OF-INPUT
    coord: deploy/own_ceilings_and_access_keys_umbrella_test.go:186-193
    note: >-
      `err := dec.Decode(&doc); if err != nil { break }` схлопывает io.EOF и
      настоящую ошибку разбора в один исход. Сломанный рендер дойдёт до Fatal на
      строке 211 с текстом «в рендере нет карты настроек» — причина названа не
      та. Разделить: io.EOF — выход, прочее — Fatal с текстом ошибки.
  - id: HOST-PREFIX-INSTEAD-OF-SEGMENT
    coord: deploy/own_posture_stack_test.go:140
    note: >-
      `!strings.HasPrefix(host, svc+"-internal")` — по префиксу, а не по полному
      имени: хост `kaname-internal-<чужое>.example` находкой не станет, хотя
      утверждение пробы («слушатель выставлен на ВНУТРЕННЕМ Service службы»)
      он не выполняет. Сверять первую метку хоста целиком:
      `strings.Split(host, ".")[0] != svc+"-internal"`.
  - id: ANONYMOUS-STRUCT-LEAKS-INTO-SIGNATURE
    coord: >-
      deploy/own_ceilings_and_access_keys_umbrella_test.go:80 ·
      containsConfigKey:367
    note: >-
      анонимный `[]struct{ configKey, valueKey string }` вынуждает повторить тип
      целиком в подписи помощника. Именованный тип (`accessKeyKnob`) убирает
      повтор и даёт имя предмету.

