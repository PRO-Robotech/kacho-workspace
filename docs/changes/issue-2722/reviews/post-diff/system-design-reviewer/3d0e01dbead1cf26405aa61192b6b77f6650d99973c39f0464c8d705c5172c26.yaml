# ── оси, которые судит эта роль ────────────────────────────────────────────
axes:
  no_dual_write:
    status: not-applicable
    evidence: >-
      Предмета нет: в диффе ноль SQL, ноль миграций, ноль прод-кода Go. Предикат
      объёма: `git diff --name-only ac33f733...ea44be6e` → 15 файлов, из них
      `*_test.go` — 8, `*.yaml` — 6, `stacks.txt` — 1; файлов под
      `services/`, `pkg/`, `proto/`, `internal/migrations/` — ноль.
  idempotency:
    status: not-applicable
    evidence: >-
      Мутаций, `Operation` и воркеров дифф не вводит. Свойства ретранслируемых
      глаголов принадлежат службе за ребром и этим диффом не изменяются.
  cas_and_occ:
    status: not-applicable
    evidence: >-
      Ни одного оператора базы в диффе; проверка-затем-запись невыразима —
      предмета нет.
  change_delivery_model:
    status: untouched
    evidence: >-
      Поток изменений ресурсов не задет: ни `stacks.txt`, ни профили, ни копия
      чарта его не называют. Watch RPC не вводится, модель опроса не меняется.
  worker_and_replica_coordination:
    status: closed
    evidence: >-
      Реплика у службы одна (`charts/kaname/values.yaml:319` → `replicas: 1`;
      боевой слой её не перекрывает), поэтому координации между репликами по
      полосе формы сегодня нет предмета, а разделяемого состояния в памяти дифф
      не заводит. Предел памяти — величина ПОДА и считается по cgroup каждой
      реплики, поэтому при будущем росте числа реплик арифметика стража не
      деградирует.
  per_call_deadline_on_the_activated_edge:
    status: closed
    evidence: >-
      `LoginLaneRelay.ServeHTTP` оборачивает контекст запроса в
      `context.WithTimeout(req.Context(), r.timeout)` (login_lane_relay.go:154)
      ДО передачи обратному прокси; умолчание 10s задаётся конструктором
      (:118-122), провязка своего значения не подаёт. Предел ОДИН на все глаголы
      перечня: монтируются они циклом по `middleware.LoginLaneRoutes()`
      (main.go:1147-1150) на ОДИН и тот же обработчик, то есть «часть — да, часть
      — нет» здесь невыразимо by construction (инвариант architecture.md
      §Concurrency). Недостижимость соседа — fail-closed и без утечки причины:
      503 фиксированным текстом края, `Set-Cookie` не ставится
      (unreachableHandler).
  cross_domain_edge_direction_and_acyclicity:
    status: closed-with-finding      # направление верно, записи о ребре нет — SDR-2722-I1
    evidence: >-
      Направление потребитель → владелец: соединение открывает КРАЙ, служба о нём
      не знает. Обратного вызова нет — перемерено у пина: ручки адреса края в
      настройках службы нет ни одной (`grep -n Gateway
      internal/apps/kaname/config/config.go` → пусто; упоминания `api-gateway`
      там — только SAN круга доверенных отправителей и проза). Обратное ребро
      толчка инвалидации снято раньше (#1024, polyrepo.md), и служба остаётся
      листом. Цикла нет.
  public_vs_internal_edge_separation:
    status: closed
    evidence: >-
      Слушатель полосы выставлен ТОЛЬКО на внутреннем Service: `grep -rn
      'loginLane\|9100' deploy/helm/umbrella/charts/kaname/templates/` → четыре
      координаты, из них Service ровно одна — `service-internal.yaml:46-49`; в
      `service-public.yaml` полосы нет. Адрес накладки ведёт на
      `kaname-internal…`, и гейт посадки это требует отдельной находкой
      (own_posture_stack_test.go:140). Наружу тринадцать путей формы публикует
      КРАЙ на своём публичном mux (main.go:1147) — это и есть назначенная дверь,
      а не утечка внутренней поверхности: ban #6 про `Internal*`-методы gRPC, и
      их дифф не трогает.
      Дополнительно (не находка, а подтверждение): ретранслятор СНИМАЕТ
      клиентские заголовки удостоверения и личности
      (`principalmeta.StripCredentialAndIdentityHeaders`) и ставит ровно один
      `X-Forwarded-For` из общего оператора доверенных прыжков, а служба сужает
      круг тех, кто вправе говорить за пользователя, SAN'ом края.
  two_processes_agreeing_on_one_number:
    status: closed-with-finding      # см. SDR-2722-I2
    evidence: >-
      Согласие держится ДВУМЯ ЗАПИСЯМИ ПЛЮС ГЕЙТОМ, а не общим источником:
      `kaname.ports.loginLane: 9100` в боевом слое и литерал `:9100` внутри
      адреса накладки — разные объявления. Общего источника здесь и не может
      быть: половины читают разные процессы из разных подчартов. Гейт
      (own_posture_stack_test.go) сверяет обе половины, требует непустого стека
      `own` (иначе «находок нет» означало бы «судить нечего»), имеет
      инъекционного близнеца и вооружается по ПИНУ. Оговорка — I2: сверяется
      порт слушателя, а край набирает порт Service.
  memory_budget_agreement:
    status: closed
    evidence: >-
      Второе согласие об одном числе устроено ЛУЧШЕ первого: предел 1280Mi
      профиля против бюджета стража (ёмкость × потолок формата + резерв), и
      потолок формата не выписан, а ЧИТАЕТСЯ у пиненного модуля структурным
      разбором (go/ast) — копии арифметики нет, смена формы таблицы даёт ОТКАЗ
      разбора, а не тихое устаревание. Арифметика сходится точно:
      8 × 128 МиБ + 256 МиБ = 1280 МиБ, страж сравнивает «не больше».
  stand_actually_boots:
    status: open                     # см. SDR-2722-I3
    evidence: >-
      Древесная половина полная: из девяти требований пина под `own` цепочка
      `values.prod.yaml + values.own.yaml` объявляет восемь (чеканка токенов —
      четыре, предъявляемое удостоверение — три, окно свежести — накладкой), и
      все пятнадцать величин полосы боевой слой несёт (перемерено пофамильно:
      cookieDomain, sessionTtl, recoveryCodeTtl, breachCheck, address/source
      attempts и окна, passwordMinLength, hasher ×4, verifierCapacity,
      memoryReserveBytes — каждая ≥1 вхождения в боевом слое). Девятое —
      перечень ключей обёртки второго фактора — подаётся ТОЛЬКО переменной из
      объекта Secret, и производителя у этого объекта в дереве нет.

# ── пробы: чего заказывать не нужно и почему ───────────────────────────────
concurrency_probe:
  ordered_integration_tester: false
  reason: >-
    Пробы с конкурирующими горутинами здесь нет предмета: в диффе нет CAS, нет
    разделяемой строки и нет спорного пути «ровно одна транзакция выигрывает».
    Спорное число диффа — не строка базы, а ДВА ОБЪЯВЛЕНИЯ, и их сверяет гейт
    дерева, а не прогон под нагрузкой.
  present_probes:
    - name: TestOwnPostureStack_ExistsAndBothHalvesNameOneListener
      file: deploy/own_posture_stack_test.go (+ own_posture_stack_injection_test.go)
      asserts: >-
        обе половины объявили посадку и одинаково; адрес абсолютен и https; порт
        адреса равен порту полосы; хост — внутренний Service; отсутствие стека
        `own` — НАХОДКА, а не законный близнец.
    - name: own_lane_memory_budget_test.go (+ injection)
      asserts: >-
        профиль, объявивший ёмкость и резерв, объявил и предел; предел покрывает
        бюджет; потолок формата читается у пина, а не копируется.
    - name: own_second_factor_umbrella_test.go (+ injection)
      asserts: >-
        копия чарта выражает обе величины Ф12 — и координату секрета в
        значениях, и строку переменной в шаблоне (карты `secrets` в копии нет,
        поэтому одного объекта Secret мало).
    - name: own_ceilings_and_access_keys_umbrella_test.go
      asserts: >-
        перечень потолков ВЫВОДИТСЯ из пина (едет вместе с ним), сверх него
        проверяется четвёртый потолок и три величины привязки; перепись печатает
        обе величины — «из пина выведено N» и «сверх пина проверено M».
  not_ordered_but_named: >-
    Подъёмной пробы «стенд `own` поднялся» в дереве нет ни одной, и её отсутствие
    — не находка этой роли (ban #16 судит landing-полоса), но именно она
    закрывает SDR-2722-I3: до неё «профиль объявил посадку» и «посадка работает»
    неотличимы.

# ── пересечение с ревью схемы ──────────────────────────────────────────────
schema_review_intersection:
  intersects: false
  reason: >-
    В диффе нет SQL, миграции, CAS, `xmin`, advisory-lock — предмета у
    db-architect-reviewer на этот дайджест нет. Единственное касание базы —
    строка ведомости `own/kaname/слагаемое вне пула не выведено` в
    `pool_fits_database_test.go`, и она дословно повторяет три уже принятые
    записи того же класса (пробел объявлен, а не прощён; истекает сам, когда
    чарт уедет вслед за кодом).

# ── дисциплина исходов ─────────────────────────────────────────────────────
# Исход прогона проб и линтера этой ролью НЕ объявляется: сырой вывод читает
# landing-reviewer, независимый перемер — check-verifier. Здесь — распределённые
# свойства написанного.
linter_probes_outcome: not-claimed-by-this-role

return_to: null              # блокирующих находок нет — возврата автору диффа не требуется
next_requested: >-
  сбор пост-дифф записей: convergence-reviewer (если пакет линии есть) либо
  landing-reviewer (если пакета нет). Параллельно и отдельным предметом —
  tooling-maintainer: запись ребра `kacho-api-gateway → kaname (полоса формы,
  HTTPS + взаимный TLS, :9100)` в `.claude/rules/polyrepo.md`; дайджеста диффа
  это не меняет, повтора этой роли не требует.
