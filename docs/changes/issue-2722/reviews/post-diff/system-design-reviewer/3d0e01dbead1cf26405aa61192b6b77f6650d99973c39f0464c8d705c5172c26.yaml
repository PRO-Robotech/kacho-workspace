important:
  - id: SDR-2722-I1
    axis: граф межсервисных зависимостей
    coord: deploy/helm/umbrella/values.own.yaml:70 (адрес) · перечень рёбер — .claude/rules/polyrepo.md §«Runtime cross-domain edges»
    finding: >-
      Ребро `kacho-api-gateway → kaname (полоса формы, HTTPS + взаимный TLS,
      :9100)` становится ЖИВЫМ и в перечне рёбер НЕ ЗАПИСАНО. Предикаты:
      `grep -c '^- \`kacho-api-gateway' .claude/rules/polyrepo.md` → 2 (подписка
      на изменения и чтение журнала смены субъекта), `grep -c
      '9100\|iamLoginLaneUrl\|полос[аыу] формы' .claude/rules/polyrepo.md` → 0;
      записок рёбер в vault 78, о полосе — ни одной
      (`ls obsidian/kacho/edges/*.md | wc -l` → 78; совпадений по `iam/v1/auth` —
      одна, и она о перенаправлении к внешнему поставщику).
      HTTP-ребро перечню не чуждо: `kacho-registry → kacho-iam (jwks-fetch)`
      записано там же и тоже есть HTTPS GET, а не gRPC.
    blocking: false
    predicate_of_closure: >-
      `grep -c '9100' .claude/rules/polyrepo.md` → ≥1 в строке ребра, и строка
      называет направление, транспорт, порт, что происходит при недоступности
      владельца и почему ацикличность держится.
    separate_subject: true
    note: >-
      Идёт ОТДЕЛЬНЫМ предметом: предмет живёт в дереве воркспейса, дерева
      продукта не трогает и дайджеста этого диффа не меняет. Повтор этой роли на
      том же отпечатке от записи ребра не требуется.
    order_to: tooling-maintainer

  - id: SDR-2722-I2
    axis: согласие двух процессов об одном числе (предикат гейта)
    coord: deploy/own_posture_stack_test.go:131 · deploy/helm/umbrella/charts/kaname/templates/service-internal.yaml:48
    finding: >-
      Гейт сверяет порт из `iamLoginLaneUrl` с `kaname.ports.loginLane` — портом
      СЛУШАТЕЛЯ в контейнере. Край же набирает порт SERVICE, а шаблон берёт его
      как `service.internal.loginLanePort | default .Values.ports.loginLane`.
      Сегодня числа совпадают by default: `grep -rn loginLanePort
      deploy/helm/umbrella/ gateway/deploy/` → две строки, обе в чарте (шаблон и
      закомментированный образец), ни одного профиля. Но образец в чарте прямо
      приглашает профиль объявить свой порт («объявляет ПРОФИЛЬ»), и в тот день
      гейт останется ЗЕЛЁНЫМ, а край постучится в дверь, которой у Service нет, —
      ровно тот класс, ради которого гейт и заведён («половины называют разные
      двери», шапка пробы).
    blocking: false
    order: >-
      сверять эффективный порт Service (`service.internal.loginLanePort` с
      умолчанием `ports.loginLane`), а не порт слушателя; инъекция — профиль,
      объявивший override, отличный от `ports.loginLane`: без правки зелено, с
      правкой красно.

  - id: SDR-2722-I3
    axis: производственность посадки (ban #16 — профиль обязан РЕАЛЬНО подниматься)
    coord: deploy/helm/umbrella/charts/kaname/templates/deployment.yaml:641 · deploy/scripts/dev-prod-secrets.sh
    finding: >-
      У секрета `kaname-second-factor-enc-key` нет ПРОИЗВОДИТЕЛЯ ни в одном месте
      дерева. Страж службы требует `authn.second-factor-encryption-key-hex` под
      `identityProvider: own` (пин `16b5cade`, `required_settings.go`,
      `Lanes: [own]`, `Supply: SupplyEnv` — подать можно только переменной).
      Предикаты: `grep -rn 'SECOND_FACTOR|second-factor' --include='*.sh'
      --include='Makefile' --include='*.yaml' deploy/ | grep -v _test` → три
      строки, все в чарте (шаблон и координата), ни одной в посеве или рецепте
      раскатки; `grep -n kaname-second-factor-enc-key deploy/scripts/dev-prod-secrets.sh`
      → пусто (посев заводит только `kaname-jwks-enc-key`).
      Предполёт секретов его не поймает НАМЕРЕННО: `mandatorySecretRefs`
      пропускает ссылки с `optional: true` — «такой секрет приходит из посева», а
      здесь он оттуда не приходит. Цель `stack-up` зовёт предполёт только при
      `STACK=fe3455` (`deploy/Makefile:800`).
      Исход для стенда `own`: под стартует, страж отказывает ИМЕНОВАННО, `helm
      --wait` выстаивает предел и падает ПО СРОКУ — ровно та последовательность,
      против которой заведён `rollout_preflight_covers_required_secrets_test.go`.
    blocking: false
    blocking_basis: >-
      Свойство КЛАСТЕРА, а не дерева; обе пробы диффа этот предел объявляют
      вслух («не утверждает, что объект Secret существует»). Но это УСЛОВИЕ
      СНЯТИЯ предиката стадии S2: перевод стенда на `own` этим диффом объявлен,
      и без производителя секрета он не выполним.
    order: >-
      производитель секрета до первого подъёма `own`: строка в посеве стенда либо
      строка в таблице производителей рецепта раскатки с проверкой в предполёте;
      плюс охват предполётом стенда `own`, а не только `fe3455`.

  - id: SDR-2722-I4
    axis: правдивость утверждения в объявлении (doc-truthfulness)
    coord: deploy/helm/umbrella/values.own.yaml:55
    finding: >-
      Комментарий накладки говорит «край ретранслирует ЧЕТЫРЕ глагола (вход ·
      выход · смена пароля · признак формы)». Перечень края на этой же голове —
      ТРИНАДЦАТЬ: `grep -c '{Verb: ' gateway/internal/middleware/login_lane_paths.go`
      → 13 (четыре Ф3, регистрация Ф4, два восстановления Ф5, шесть второго
      фактора и повышение Ф12). Утверждение УЖЕ своего предмета в файле,
      заведённом сегодня, и оно же — единственное описание того, что уезжает на
      этот адрес.
    blocking: false
    order: >-
      не подновлять числом (перечень растёт фазами), а назвать производителя:
      «перечень глаголов — `middleware.LoginLaneRoutes()`, его печатает провязка
      края при старте (`verbs`, main.go:212)».

  - id: SDR-2722-I5
    axis: размен запрос/предел (планировщик против стража)
    coord: deploy/helm/umbrella/values.prod.yaml:581 · deploy/helm/umbrella/charts/kaname/values.yaml:807
    finding: >-
      Предел памяти поднят до 1280Mi, а ЗАПРОС остаётся 128Mi (умолчание
      подчарта; накладка и боевой слой его не трогают — слияние карт глубокое,
      `requests` переживает). Разрыв десятикратный на поде, чей страж старта
      ДОКАЗЫВАЕТ право занять 1280 МиБ: бюджет = 8 проверок × 128 МиБ + 256 МиБ
      резерва, то есть при восьми одновременных проверках пароля процесс занимает
      ровно то, чего планировщику не объявлено. Класс QoS — Burstable, и под
      давлением узла выселяется именно превысивший запрос.
      Комментарий профиля размен НАЗЫВАЕТ («стоит headroom узла, а не занятой
      памяти») — то есть решение принято, а не просмотрено; замечание здесь о
      том, что headroom планировщику как раз НЕ объявлен: предел ёмкости узла не
      расходует, расходует запрос.
    blocking: false
    order: >-
      назвать запрос рядом с пределом (хотя бы резерв + одна проверка) либо
      записать решение «запрос не поднимаем» с ценой, чтобы следующий не читал
      умолчание 128Mi как выбор.

observations:
  - id: SDR-2722-O1
    finding: >-
      `newLoginLaneTransport` собирает клиента хопа с `Timeout: 10s`
      (`newPinnedHopClientWithIdentity`), а возвращает из него ТОЛЬКО
      `*http.Transport` — предел клиента при этом отбрасывается. Дыры нет:
      предел держит сам ретранслятор контекстом (`login_lane_relay.go:154`), и
      величина та же (умолчание конструктора — 10s, `Timeout` в провязке не
      задан). Но единственная опора предела — умолчание в коде; ручки у
      оператора нет, в отличие от прочих величин полосы, которые приёмка Ф3
      требует нести ПРОФИЛЕМ. Не находка этого диффа: код предсуществует базе.
  - id: SDR-2722-O2
    finding: >-
      Лишний ключ `own-ceilings.access-keys-per-user` в карте настроек службе
      безвреден — перемерено у пина, а не принято со слов чарта: разбор
      нестрогий, `load.go:174` задаёт только `DecodeHook`, ни `ErrorUnused`, ни
      `UnmarshalExact` в нём нет; таблица потолков пина трёхстрочная
      (`own_ceilings.go`), четвёртой строки там нет. Утверждение комментария
      чарта («неизвестный ключ игнорируется») истинно на ЭТОМ пине.
  - id: SDR-2722-O3
    finding: >-
      Самовооружение гейта посадки читает пин регулярным выражением по имени
      конструктора `accessKeyRequirement("…")`. На `16b5cade` его там нет вовсе,
      значит `pinNeedsBinding` сегодня false — и профиль законно молчит о
      привязке. Цена приёма названа: назовут конструктор иначе — вооружение
      молча останется ложным, и «не требуется» будет неотличимо от «не нашли».
      Соседний гейт потолков этой цены не платит: он читает ТАБЛИЦУ, а не имя
      функции.

