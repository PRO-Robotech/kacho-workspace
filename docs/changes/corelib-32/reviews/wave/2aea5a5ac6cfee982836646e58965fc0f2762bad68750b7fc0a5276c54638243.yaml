return_39:
  to: go-implementer (полоса corelib #39)
  what: >-
    TestConsumedCodeRecordOutlivesTheCodeLifespan даёт срок кода 1 с по настоящим часам.
    Первый обмен обязан пройти внутри этой секунды, но в неё входит проверка секрета
    клиента: registerTestClient регистрирует конфиденциального клиента с bcrypt cost 10.
    Под -race на этом и тратится почти весь бюджет. Если окно не выдержано, проба падает
    текстом «первый обмен отказал: invalid_grant». Для читателя это отказ продукта, хотя
    на деле не создано условие пробы. Обратную предпосылку («срок истёк к повтору») проба
    судит сама (requireCodePastItsLifespan), а эту — нет.
  proof:
    - 'замер через -overlay (TestZZRetentionTimeline, 8 прогонов), -race, машина свободна: сравнение bcrypt 612–682 мс; от выдачи кода до конца первого обмена 639–698 мс из 1000. Без -race 52 мс'
    - 'go test -race -count=5 -run ^TestConsumedCodeRecordOutlivesTheCodeLifespan$ в контейнере: --cpus=1 — красная 5 из 5, обе половины, текст «первый обмен отказал: oauthceremony: invalid_grant…»; --cpus=2 — зелёная 5 из 5; --cpus=4 — зелёная 5 из 5'
    - 'причина измерена (TestZZFirstExchangeCause, -race -count=3, две параллельные половины): --cpus=1 — первый обмен кончается через 242–298 мс ПОСЛЕ записанного срока кода, 6 из 6 invalid_grant; --cpus=4 — за 321–357 мс ДО срока, 6 из 6 успешны'
    - 'в форме конвейера при --cpus=4 проба прошла (6,4 и 7,0 с). Запас до срока — треть секунды, скорость ранера конвейера деревом не задана'
  requirement: >-
    Первый обмен не должен зависеть от того, сколько настоящего времени съела проверка
    секрета. Как именно (клиент без bcrypt в бюджете, другой срок кода, собственная
    предпосылка окна) решает полоса. Если окно всё же не выдержано, отказ называет
    причину, а не выглядит отказом продукта. Тем же касанием: go-style I-3 (комментарий
    codeRetentionWait в том же файле, :30-33, про округление Round(time.Second), которого
    у кода нет) и столкновение C1 ниже.
  note_on_37: >-
    В локальной полосе 37 (6289fbc/36a3bf0, в сборку не входит, волна задачей не названа)
    registerTestClient уже без bcrypt: секрет проверяет порт (store.secrets). После её
    влития бюджет, скорее всего, освободится сам. Но это зависит от порядка влития, а не
    от пробы, поэтому довод к возврату не прибавляется и не отнимается.

