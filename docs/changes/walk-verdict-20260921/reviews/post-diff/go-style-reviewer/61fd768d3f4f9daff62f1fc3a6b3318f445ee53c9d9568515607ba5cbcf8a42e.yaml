foundation_candidates: []
foundation_candidates_note: >-
  Горизонтального выноса ни один из диффов не порождает. Оба судьи —
  `JudgeTreeWalk` и `JudgeProviderWalk` — суть корпус гигиены ЭТОГО дерева:
  первый привязан второй предпосылкой к пути собственного пакета платформы,
  второй читает словарь поверхностей платформы. Вынос в `corelib` сломал бы
  ровно то свойство, ради которого вторая предпосылка и заведена. Прибор
  потолка привязок судит три дерева, но два из них читает ПИНОМ (`go.mod`),
  а не копией, — норма `polyrepo.md` соблюдена, отдельной работы в репозитории
  фундамента изменение не требует.

