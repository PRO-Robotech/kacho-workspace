    полосы читают дерево через `gitenv.Command` и файловую систему.
  logging: 'сторонних логгеров, `fmt.Println`, `log.Printf` в диффах нет; печать гейтов — `t.Logf` / `t.Errorf`, как и у соседей'
  no_pii_in_logs: 'печатаются имена проб, пути, числа переписи, имена модулей и слова границы; персональных данных нет'
  naming_ascii: >-
    запрет #17 соблюдён: предикат — добавленные строки вида
    `+(func|var|const|type) <нелатинское>` — даёт ноль. Русские тексты идут
    только в комментариях, сообщениях находок и строковых константах исходов.
  outcome_constants_not_substrings: >-
    исходы объявлены константами (`treewalkverdict.go:79-87`,
    `providerwalkverdict.go:71-80`) с прямо названной причиной: инъекция
    утверждает ИСХОД, а не подстроку напечатанного. Пробы утверждают
    `v.Outcome`, а причину ищут подстрокой только для адресности — и это
    сказано в `treeWalkBlindBecause` (:79-90 injection).
  all_blind_reasons_collected: >-
    судья копит ВСЕ причины, а не первую, и это закреплено пробой
    `TestTreeWalkInjection_EveryBlindReasonIsNamed` (:185-196) и её двойником
    у поставщика. Внутри блока причины взаимоисключающи по построению
    (`switch` — последовательное уточнение), между блоками складываются.
  denominator_from_a_second_expression: >-
    знаменатель во всех парах снят ВТОРЫМ выражением, независимым от
    проверяемого обхода: индекс против коммита, синтаксическое дерево против
    лексического прохода, словарь против положительного контроля на
    синтетическом входе. Пары и их слепые зоны разобраны в шапке
    `providerwalkverdict.go:26-51` поимённо.
  ast_over_substring: >-
    ban17-gates соблюдён и усилен: мета-гейт судит узел синтаксического дерева,
    а не образец в тексте. Перемерено на настоящем входе — пакет держит
    синтетические исходники внутри сырых литералов
    (`treewalkindex_test.go:753`, `const src = ` с `func repoRoot` и
    `gitenv.Command` внутри), прежний текстовый отбор ловил их как объявления,
    `go/parser` в литерал не спускается.
  parse_failure_is_not_silence: >-
    `treeWalkParsePackage` падает на нечитаемом и неразбираемом файле
    (:411, :415) с прямо названной причиной — «молчаливый пропуск превратил бы
    „не прочитали“ в „нарушений нет“»; `MeasureLiteralsLexically` возвращает
    первую ошибку лексического разбора, а не считает по тому, что удалось.
  tool_failure_is_not_a_verdict: >-
    `TreeWalkBuildGraphEdges` и `treeWalkModulePath` при отсутствии коммита
    возвращают ноль/пусто, а не падают, и причина названа (:38-41, :83-84):
    иначе предпосылка судила бы ошибку инструмента вместо дерева. Решение
    верное — красным дерево делает судья, а не отказ `git`.
  no_orm_no_layering_change: >-
    запрет #3 не при чём, слои не трогаются: обе полосы целиком в
    `internal/repohygiene`, pgx · gRPC · sqlc · транспортных типов в диффах
    нет, конструкторов зависимостей вне `cmd/` не заводится, глобальных
    синглтонов продукта тоже (единственная новая пакетная переменная —
    `treeWalkAsked`, и она в критических по другой причине).
  ceiling_moves_only_down: >-
    оба убывающих потолка переписаны ТЕМ ЖЕ изменением, которым снижено число
    (`treeWalkSilentCeiling` 603 → 649 — рост объяснён тем, что прежний разбор
    не видел 47 проб; `vendorTreePlatform` 1963 → 1884), и ветвь «число упало —
    перепишите запись» у первого есть (:605-610).
  cost_of_the_rule_is_counted_not_hidden: >-
    цена границы слова названа числом и СЛОВАМИ (`BoundaryDropped`,
    `BoundaryWords`), печатается переписью каждого прогона и закреплена парой
    проб «считает» / «молчит на чистом дереве». Замечание — только к второй
    стороне цены, см. important[1].
  retraction_lives_where_the_predicate_is_read: >-
    оба отзыва стоят у предиката, а не в истории; второй заменяет неповторимое
    доказательство повторимым (перепись дерева фундамента в каждом прогоне).

