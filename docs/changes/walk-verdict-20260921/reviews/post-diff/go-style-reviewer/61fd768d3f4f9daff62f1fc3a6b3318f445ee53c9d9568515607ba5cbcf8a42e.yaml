critical:
  - id: shared-counter-map-written-from-thirty-parallel-gates
    coordinates:
      - internal/repohygiene/treewalkverdict_test.go:190
      - internal/repohygiene/treewalkverdict_test.go:202
      - internal/repohygiene/treewalkverdict_test.go:187-189
    finding: >-
      `var treeWalkAsked = map[string]int{}` (:190) инкрементируется в
      `RequireTreeWalk` (:202) БЕЗ синхронизации. Перемерено по дереву: зовущих
      судью мест 30, и ВСЕ ТРИДЦАТЬ стоят внутри проб, уже объявивших
      `t.Parallel()` — предикат
      `awk '/^func Test/{fn=$2;par=0} /t\.Parallel\(\)/{par=1}
      /requireTreeWalkOver|RequireTreeWalk\(/{print (par?"ПАРАЛЛЕЛЬНО":"последовательно")}'
      internal/repohygiene/*_test.go` даёт 30 ПАРАЛЛЕЛЬНО и 0
      последовательно. Это неохраняемая запись в общую карту из тридцати
      горутин. Два следствия, и оба про прогон: под `-race` (а `make test-unit`
      гоняет юниты именно так — Makefile:504 `$(GO) test $$pkgs -race -short
      -count=1`, без `-parallel`, то есть с умолчанием по числу ядер) это
      гонка; без `-race` это `fatal error: concurrent map writes` — паника
      среды, не восстанавливаемая и убивающая ВЕСЬ бинарь проб пакета, то есть
      вердикт всех гейтов дерева разом. Локальный предикат автора этого не
      показывает: Makefile:221 прямо пишет, что на машине замера `-race` не
      гоняется, — дефект уходит в ствол и краснеет в CI.
      ВТОРАЯ ПОЛОВИНА ТОЙ ЖЕ НАХОДКИ. Карта НИКЕМ НЕ ЧИТАЕТСЯ:
      `grep -rn treeWalkAsked internal/repohygiene/` даёт ровно три вхождения —
      комментарий, объявление и инкремент. Комментарий (:187-189) утверждает
      «счётчик … для МЕТА-ГЕЙТА: „ноль обращений за всю жизнь“ разбирается как
      находка», а мета-гейт `TestEveryTreeGateAsksTheWalkJudge` (:517-615)
      считает ВСЁ разбором синтаксического дерева и к этой карте не
      обращается. То есть риск паники куплен ни за что, а комментарий
      утверждает поведение, которого в коде нет, — ровно тот класс, который эта
      же полоса закрывает по всему дереву и ради которого написан отзыв на
      :255-266.
    requirement: >-
      СНЯТЬ `treeWalkAsked` вместе с комментарием :187-189 и инкрементом :202 —
      читателя у него нет, и чинить синхронизацией нечего. Если счётчик нужен
      как предмет, завести его с реальным читателем и под `sync.Mutex` либо
      `atomic`, но тогда он обязан появиться в переписи мета-гейта, иначе
      утверждение комментария снова окажется ложным. После правки дайджест
      новый — роль повторяется.
    return_to: 'автор диффа (pointpu), полоса lane/providersurface-empty-surface-20260921'

# ── ВАЖНЫЕ (не блокируют, но именованы) ────────────────────────────────────
important:
  - id: boundary-indexes-lower-but-reads-original
    coordinates:
      - internal/repohygiene/retiredidentityvendorceiling.go:611,625
      - internal/repohygiene/retiredidentityvendorceiling.go:642,655
      - internal/repohygiene/retiredidentityvendorceiling.go:678,686
      - internal/repohygiene/retiredidentityvendorceiling.go:746,874
    finding: >-
      Во всех трёх местах границы смещение ищется в `strings.ToLower(text)`, а
      байт границы читается в ИСХОДНОМ `text` по тому же смещению. Это верно
      ровно до тех пор, пока `ToLower` сохраняет длину в байтах, а он её не
      сохраняет: `İ` (U+0130) удлиняет, `K` (U+212A), `Å` (U+212B), `ẞ`
      (U+1E9E) укорачивают, а на НЕВАЛИДНОМ UTF-8 каждый негодный байт
      заменяется на U+FFFD и даёт +2. Проверено ИСПОЛНЕНИЕМ копии этой логики
      на однофактной паре: строка «знак Кельвина U+212A, затем
      hydra_client_id TEXT» даёт «не привязка», а её ASCII-близнец «латинская
      K, затем hydra_client_id TEXT» — «привязка»; та же пара на одном негодном
      байте (0xFF вместо K) расходится так же. То есть настоящая привязка
      молча исчезает из числа. Вес поднимает адресат: `vendorMarkBoundedIn`
      применён к СЫРЫМ БАЙТАМ — к `corpus.Blobs[rel]` (:874), куда файл попадает
      РОВНО ТОГДА, когда он не проходит `vendorTextBytes` (:511, `utf8.Valid`
      ложно или есть нулевой байт), и к `a.Text` нераспакованного архива
      (:746), где по замыслу лежат сырые сжатые байты (`vendorArchiveText`
      default-ветка возвращает `cut(string(data)), false` для xz · zstd ·
      bzip2 · 7z). На этих двух путях предпосылка совпадения смещений нарушена
      ПО ПОСТРОЕНИЮ.
      РАДИУС ИЗМЕРЕН, и сегодня он нулевой: из 6667 отслеживаемых путей
      смещение при `ToLower` дают 6, и все шесть — gzip-архивы
      (`deploy/helm/umbrella/charts/*.tgz`,
      `services/storage/tools/testdata/rg11-make/live-corpus.json.gz`), которые
      разворачиваются, и у РАЗВЁРНУТОГО текста смещение 0. Нераспакованных
      архивов и двоичных файлов в дереве сейчас нет. Поэтому число 1884 этим
      дефектом сегодня не испорчено, и находка не блокирующая — но механизм
      оживает от первого же архива в xz либо от первого нетекстового файла,
      и оживает МОЛЧА, в сторону занижения.
    requirement: >-
      Заменить `strings.ToLower` на побайтовое приведение только ASCII (метки
      `hydra` · `kratos` · `oryd/` — ASCII, признак границы `vendorLowerLetter`
      — тоже ASCII), тогда длина сохраняется по построению и смещения
      совпадают тождественно. Все три места — :611, :642, :678 — правятся
      одним помощником. Пара инъекций: строка с `U+212A` перед меткой и её
      ASCII-близнец обязаны давать ОДИН И ТОТ ЖЕ исход.
  - id: boundary-cost-is-named-in-one-direction-only
    coordinates:
      - internal/repohygiene/retiredidentityvendorceiling.go:588-596
      - internal/repohygiene/retiredidentityvendorceiling.go:598-607
      - internal/repohygiene/retiredidentityvendorceiling.go:625
    finding: >-
      Шапка объявляет прописную букву ГРАНИЦЕЙ — «это шов camelCase
      (`hydraClaims`, `kratosURL`)». Шов camelCase она и есть, но правило
      смотрит на РЕГИСТР следующего байта, а не на слово, и потому в тексте,
      написанном прописными, оно засчитывает привязкой английское слово:
      проверено исполнением — `HYDRATE_ENABLED: true`, `const HYDRATED = 1`,
      `export const HYDRATE = 'x';` все три дают «привязка». Отличить
      `HYDRATE_ENABLED` от `HYDRA_ADMIN_URL` это правило не может в принципе:
      у обоих следом прописная. Разница с ложным отрицанием в том, что ту
      сторону цены автор назвал ЧИСЛОМ — счётчик `BoundaryDropped` и перечень
      `BoundaryWords` (:345-350, печатаются переписью :364-372, закреплены
      пробой `…_WordBoundaryCostIsNamedByTheCensus`), — а эту не назвал нигде:
      такая строка уходит в `ByName` и становится неотличима от настоящей
      привязки. Радиус измерен: `git grep -c -P '(?i)hydra(?-i)[A-Z]' HEAD`
      среди совпадений НИ ОДНОГО слова семейства `hydrate` — сегодня класс
      пустой.
    requirement: >-
      Назвать эту сторону цены там же, где названа первая (шапка :598-607), и
      закрепить парой инъекций: `HYDRATE_ENABLED: true` против
      `KACHO_HYDRA_ADMIN_URL: …` с явным утверждением, что вторая — привязка, а
      первая засчитывается ею ЗАВЕДОМО и это принятая цена. Либо читать весь
      токен, а не следующий байт, — но тогда цена меняется на противоположную и
      должна быть перемерена.
  - id: meta-gate-census-has-no-second-expression-for-its-own-denominator
    coordinates:
      - internal/repohygiene/treewalkverdict_test.go:392-398
      - internal/repohygiene/treewalkverdict_test.go:455-487
      - internal/repohygiene/treewalkverdict_test.go:605-610
    finding: >-
      Мета-гейт держит УБЫВАЮЩИЙ потолок и при падении числа требует переписать
      запись (`:605-610`). Но число `silent` падает от ДВУХ разных причин, и
      гейт их не различает: гейт действительно позвал судью — либо разрешение
      имени сломалось, и проба перестала считаться пробой дерева. Второе
      возможно: `treeWalkParsePackage` (:394) разбирает ТОЛЬКО
      `internal/repohygiene/*_test.go`, а `reaches` (:460) ищет имя в
      `p.decls`, то есть исключительно среди объявлений этих файлов. В пакете
      175 НЕпроверочных файлов, и 20 из них уже трогают примитивы среды и
      дерева (`gitenv.Command` · `filepath.WalkDir` · `os.ReadDir` · `os.Getwd`
      — перемерено грепом по непроверочным файлам). Помощник, переехавший из
      `_test.go` в обычный файл пакета, уводит всех своих зовущих из переписи
      БЕСШУМНО, и мета-гейт прочитает это как успех: «проб без судьи стало
      меньше — перепишите потолок». Граница `SelectorExpr` в шапке (:453-454)
      названа; эта — нет, хотя она шире. Своего судью обхода мета-гейт зовёт
      (:555-562), но судья сверяет ЧИСЛО ФАЙЛОВ корпуса с коммитом, а не число
      разрешённых имён: потеря разрешения файлы не трогает.
    requirement: >-
      Дать `treeGates` второе выражение и упереть его в пол — печатать и
      судить «проб `Test…` всего N · разрешено до корня M · не разрешено
      ни во что K», где K растёт ровно тогда, когда разрешение ломается.
      Назвать в шапке границу «разбираются только `*_test.go` пакета» так же
      прямо, как названа граница селектора.
  - id: pkg-path-equal-to-module-is-judged-a-foreign-tree
    coordinates:
      - internal/repohygiene/treewalkverdict.go:162-165
    finding: >-
      Ветка требует `strings.HasPrefix(d.PkgPath, d.ModulePath+"/")`. Пакет,
      лежащий В КОРНЕ модуля, даёт `PkgPath == ModulePath`, префикс со слэшем
      не совпадает, и судья печатает «судимое дерево объявляет модуль %q, а
      гейт собран из пакета %q: это НЕ его дерево» — про своё собственное
      дерево. Сегодня не реализуется (`internal/repohygiene` — подпакет), но
      сообщение в этом случае утверждает неправду, а не отказывается судить.
    requirement: >-
      Принять равенство наравне с префиксом (`PkgPath == ModulePath ||
      HasPrefix(PkgPath, ModulePath+"/")`), либо назвать в шапке, почему корень
      модуля исключён. Инъекция: `PkgPath == ModulePath` — законный близнец.
  - id: reachability-recomputed-about-nine-thousand-times
    coordinates:
      - internal/repohygiene/treewalkverdict_test.go:455-487
      - internal/repohygiene/treewalkverdict_test.go:495-508
      - internal/repohygiene/treewalkverdict_test.go:531-551
    finding: >-
      `reaches` не запоминает ничего: `seen` живёт РОВНО один вызов верхнего
      уровня, и результат для имени не переживает возврата. Перемерено по
      корпусу: 655 файлов `_test.go`, 188 739 строк, 5173 объявления `func`
      верхнего уровня, из них 2538 `Test…`. Производители корня — по обходу на
      каждое не-`Test` объявление (≈2635 обходов, :498-503); дальше цикл по
      пробам зовёт `reaches` от двух до трёх раз на пробу (:535, :540, :541,
      :547) — ещё ≈6300. Итого ≈9000 обходов графа вызовов, в каждом из
      которых тело функции заново читается `ast.Inspect`. Разбор сам по себе
      предмету соразмерен — иначе класс не закрывается, — но эта его часть
      считает одно и то же по многу раз в пакете, который уже стоит 150–320 с
      локально и 436.8 с на ранере при восьмиминутном бюджете (замеры в
      Makefile:121-128,187). Исход прогона я не объявляю — это не моя роль; я
      называю устройство, из-за которого цена растёт от числа проб, а не от
      числа форм.
    requirement: >-
      Запоминать результат: одна карта `map[string]bool` на предикат, заведённая
      рядом с `seen`, снимает повторный обход и оставляет разбор тем же. Четыре
      предиката мета-гейта — четыре карты, заведённые один раз на прогон.
  - id: keep-predicate-and-its-printed-expression-travel-apart
    coordinates:
      - internal/repohygiene/treewalkverdict_test.go:163-172
      - internal/repohygiene/treewalkverdict_test.go:176-185
      - internal/repohygiene/listfiltercoverage_test.go:131
    finding: >-
      Отбор (`treeWalkKeepProdGo`) и его ОПИСАНИЕ («git ls-tree -r HEAD --
      *.go, непроверочные, вне игнорирования») передаются двумя независимыми
      аргументами на 28 местах зова. Описание — не украшение: именно оно
      печатается судьёй как источник знаменателя (`treewalkverdict.go:178-188`)
      и именно им знаменатель перепроверяют. Сегодня пары сходятся: перемерено
      — 4 различных пары на 28 мест (11 · 9 · 7 · 1), расхождений ноль. Держит
      их только копирование: двадцать девятый гейт, назвавший один отбор и
      передавший другой, останется зелёным и будет печатать ложное объяснение
      своего знаменателя.
    requirement: >-
      Связать пару одним значением — `treeWalkSelector{keep, expression}`,
      четыре объявленные константы, — и принимать её вместо двух аргументов.
      Тогда назвать одно, а передать другое станет невозможно по типу.

