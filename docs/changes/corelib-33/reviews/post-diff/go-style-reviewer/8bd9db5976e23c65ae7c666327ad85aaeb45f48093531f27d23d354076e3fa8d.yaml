findings:
  critical: []
  important:
    - id: I-1
      class: misconfig-surfaces-as-outage
      where: oauthceremony/bridge.go:489-497 (revocationReasonFor), следствие — ceremony.go:854-859
      summary: >-
        Отказ моста «отзыв без причины» (CodeCeremonyMisuse) не заносится в
        ведомость операции: note() пропускает только коды из coarsenable, а
        revocationReasonFor возвращает отказ, минуя и её. На пути, где отзывает
        движок, точный случай огрубляется: движок (revocation.go
        storeErrorsToRevocationError) отдаёт ErrTemporarilyUnavailable, и Revoke
        отвечает temporarily_unavailable — дефект провязки выглядит временной
        перегрузкой, клиент повторяет бесконечно. Измерено инъекцией выше.
        Сейчас путь недостижим (посылка подтверждена), поэтому не блокирует.
      requirement: >-
        занести отказ в ведомость (notesFrom(ctx).record(...)) рядом с возвратом,
        чтобы preferRecorded отдавал CodeCeremonyMisuse, и закрепить внутренней
        пробой на уровне операции: движок отзывает при ведомости без причины →
        CodeOf(err) == CodeCeremonyMisuse, а не temporarily_unavailable.
  foundation_candidates: []     # изменение и есть фундамент (corelib)
  style: []
  security_comments_contradicting_code: []

