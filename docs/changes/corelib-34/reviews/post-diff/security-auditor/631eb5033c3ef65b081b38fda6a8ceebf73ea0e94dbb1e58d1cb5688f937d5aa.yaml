cross_repo:
  - addressee: PRO-Robotech/kaname
    kind: условие на будущий код, а не находка
    text: >-
      Полоса, которая реализует GrantRevoker для oauthceremony, строит отсечку на
      месте предъявления по ключу семейства (GrantID в токене) и не сравнивает
      её с моментом выпуска. В kaname уже есть отсечка по моменту для
      пользователя (RevokedBefore в session_revocations и iamhooks). Это другой
      предмет, и его форма для семейства не годится, что абзац ports.go и
      называет. Проба на стороне kaname проходит через обе стороны: отзыв
      семейства, затем выпуск токена этого семейства, затем предъявление на
      проверке ключами, и в ответ — отказ.

outside_diff:
  - >-
    Опередивший на одновременном повторе получает ответом пару уже отозванного
    семейства. Со стороны церемонии эта пара негодна: выборка и интроспекция
    отвечают «нет». Место, которое сверяет токен доступа по ключам, отвергает
    его только отсечкой службы. Контракт порта называет это требованием, поэтому
    дефектом библиотеки это не считаю. Отказать опередившему в выдаче после
    отзыва было бы защитой в глубину, а не исправлением.

