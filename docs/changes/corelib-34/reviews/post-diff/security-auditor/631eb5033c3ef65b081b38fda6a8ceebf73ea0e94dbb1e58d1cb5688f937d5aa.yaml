premise:
  status: confirmed
  claim: >-
    После слияния с #40 опередивший гасит код при предъявлении, то есть раньше
    своего выпуска. Поэтому его выпуск достижим ПОСЛЕ того, как отставший
    отозвал семейство. Проба TestConcurrentCodeReplayWinnerMayIssueAfterTheRevocation
    держит эту предпосылку: она краснеет, если погашение перенести на выдачу, а
    близнец при этом остаётся зелёным.
  how: >-
    Инъекция накладкой `go test -overlay` (файлы вне git-деревьев,
    ~/.cache/sa34-FZBeIC): тело DeletePKCERequestSession заменено на `return
    nil`, так что код гасится только на выдаче. Проба FAIL, текст «ни один обмен
    не прошёл: выпуск не дождался отзыва (port_deadline; port_deadline)».
    Близнец TestConcurrentCodeRedemptionRevokesTheFamily — PASS в обоих
    подслучаях. На голове `-count=3`: обе пробы PASS 3 из 3. После прогонов
    `git status --porcelain` в копии полосы пуст.

answers:
  merge_resolution: >-
    Все 18 участков конфликта сведены по существу, ни одна сторона не потеряна.
    Config не несёт ни Issuer (его снял #38), ни SigningSecret (его сняла
    полоса). Порт ProofKeyVault снят вместе с полем Ports.ProofKeys (#40), а
    AccessTokenIssuer остаётся обязательным (validatePorts). Проверка
    `AccessTokenLifespan ≤ tokenpolicy.MaxTokenTTL` на месте. Литералы проб
    волны переведены на 20 минут: иначе их отверг бы сам New. Шапка
    GrantRecord.Form правдива на голове: codeRecordFromRequester удаляет
    code_challenge и code_challenge_method из Form записи кода и переносит их в
    ProofKey (translate.go:295-304).
  contract_change_revoker: >-
    По существу слияние изменило один контрактный абзац — отсечку GrantRevoker
    на месте предъявления. Раньше абзац утверждал, что выпуск победителя стоит
    раньше отметки отзыва. После #40 это утверждение стало бы ложью, и абзац
    заменён требованием: отсечка по ключу семейства действует на всякий токен
    семейства, когда бы он ни был выпущен. Абзац согласован с соседними
    требованиями того же порта: FetchAccessToken и FetchRefreshToken отвечают
    «когда бы он ни был положен», а отметка отзыва лежит у семейства. Подставка
    исполняет именно так: выборка сверяет revoked[grantID] и не смотрит на
    момент записи.
  public_text: >-
    Сообщения 8af040a и cadf776 и новый абзац ports.go описывают требование к
    реализации порта и пробу, а не действующий дефект: ни один потребитель
    oauthceremony в kacho (main @4382f05c0) и kaname (@32637536f) порт ещё не
    реализует (`git grep oauthceremony -- '*.go'` → 0). Признак
    восстановимости не срабатывает: восстанавливать нечего.
  trailers: 'c2261955..cadf776: строк трейлеров 0'

