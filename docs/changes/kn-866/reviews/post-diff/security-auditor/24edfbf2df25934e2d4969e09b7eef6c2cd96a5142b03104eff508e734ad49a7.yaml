reasons:
  - >-
    перечень термов производят ровно три места рендера, и все под ключом ресурса:
    голая запись класса — только у типа с ключом и только в отношениях его
    собственных действий чтения и в public_reader; терм ребёнка — только по
    указателям, выведенным загрузчиком на контейнер того же документа
    (поле неэкспортировано); прод-вызов допуска один и берёт перечень той же
    композиции
  - >-
    перечень пополняется только в ветке добавленных типов; подтверждённые и
    прежней редакции канонические блоки терма не дают, а допуск отвергает запись
    перечня на тип вне новых типов текста — канонический тип исключения не
    получает ни при каком перечне
  - >-
    исключение снимает лишь голую запись класса и лишь на узле-семени;
    именованный класс и прежнее слово публичного чтения остаются находкой в
    любой позиции, а всякое другое объявление, достигающее законной точки
    (вычисляемым ребром, указателем, усерсетом), получает находку на себе
  - >-
    ребро ребёнка к контейнеру режется только к новому типу, у которого законен
    собственный public_reader; контейнер в каноне либо без ключа ребра не режет,
    и путь до класса — находка (X4 и его близнец держатся пробой)
  - >-
    авторское отношение с именем следствия ключа терма не получает: терм
    привязан к собственному действию, а не к имени отношения (X1, X1b, X2 с
    близнецами держатся пробой); класс в действии чтения контейнера отвергается
    ещё и загрузкой
  - >-
    правка обхода (семя за семенем, вычисляемое ребро внутри нового типа)
    ужесточает Д3: всякая пара с подстановкой в новом типе сама есть семя, и
    снятой остаётся только законная запись своего семени
  - >-
    кортеж public_reader пишет прежний писатель по классовой выдаче и живому
    каталогу; дифф его не трогает, а цель выдачи на тип модуля входом API сейчас
    отвергается (возврат автора) — доступ сверх приёмки не открыт
