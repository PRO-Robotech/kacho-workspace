axes:
  CE-12:
    status: держится по построению; пробы-держателя нет
    evidence:
      - 'один предикат: manifest.Resource.PassesPublicRead (internal/manifest/resources.go:485). Его читают ветка ключа рендера (internal/modelrender/render.go:163, 198), откуда берутся KeyTerms, и колонка каталога (internal/apps/kaname/modulecatalog/rows.go:136). Прочитано @ba1f0f681'
      - 'одна доставка внутри пуска: одна переменная deliveredManifests (cmd/kaname/serve.go:282) идёт в installComposedModel (serve.go:326) и в применитель каталога (serve.go:350). Перечень допуска берётся из того же вызова Compose, что собрал текст (cmd/kaname/model_compose.go:55, 68)'
    residual: >-
      Писатель кортежа public_reader (reconcile/public_reader.go) читает НЕ доставку
      своего процесса, а снимок каталога из БД (catalog.Snapshot, отставание ограничено
      периодом обновления). При выкатке с новой редакцией манифестов строки может
      записать соседняя реплика. Расхождение безопасно в обе стороны. Если у кортежа
      есть строка каталога, а в модели процесса нет отношения public_reader, Check
      этот кортеж не читает. Если отношение в модели есть, а строки каталога нет,
      кортеж не пишется либо снимается, и доступ закрывается. Детей контейнера тоже
      выводят двумя путями: рендер — через linkPublicRead/childrenOf одного документа,
      каталог — через containersOf по ParentTypes одного модуля. Их расхождение тоже
      ведёт только к закрытию доступа: терма в модели нет — кортеж ничего не открывает;
      ребёнка нет в каталоге — кортеж не пишется. Класс существовал и до диффа:
      дифф впервые пускает типы модулей в строки с флагом, но писателя не меняет.
  CE-08:
    status: держится
    evidence:
      - 'выдача находок идёт только по срезам: m.Types, t.Relations, declarationsNamed, PointerTargets (compile.go:374, срез термов), wildcardRecords (сортирует и убирает повторы). Карта full обходится только для подсчёта премиссы, это число, а не порядок'
      - 'Term — slices.Sort и slices.Compact; путь — первое попадание BFS (order по срезу); порядок находок — по семени в порядке объявления'
      - 'порядок KeyTerms и строка ErrKeyTermNotInText следуют порядку доставки: filepath.WalkDir (internal/manifest/check.go:390) обходит лексически, поэтому порядок одинаков на всех репликах'
      - 'GOWORK=off go test -count=3 -shuffle=on authzmodel, modelcompose, modelrender, manifest, domain → 5 ok, код 0; TestAdmitFindingsAreDeterministic (200 повторов) зелёная'
  CE-05:
    status: держится
    evidence:
      - 'reach (admit.go) — BFS от ОДНОГО семени со своими seen и from; reachableWildcardFindings вызывает его по каждому семени в двух плечах'
      - 'голая запись класса снимается только при p == seed && lawful.class[seed]; ребро TTU public_reader режется только при cur == seed && lawful.via[seed][ptr]'
      - 'via законен, только когда КАЖДАЯ цель указателя — новый тип с законной записью класса в public_reader (CE-07); запись перечня без терма в тексте — отказ ErrKeyTermNotInText (fail-closed)'
      - 'go test -v -run TestCE0|TestAdmitKeyTerm|TestAdmitPath|TestAdmitEdge|TestAdmitFindingsAreDeterministic|TestPM_ (authzmodel, modelcompose) → PASS 10, FAIL 0'

