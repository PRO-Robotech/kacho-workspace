notes:
  - id: N1
    blocking: false
    text: >-
      У CE-12 нет пробы-держателя: равенство «контейнер в KeyTerms ⇔ строка каталога
      с PublicReadToChildren» для одной доставки держится тем, что предикат объявлен
      в одном месте. Держатель стоит дёшево и в запись ревью: для одной доставки
      сверить множество типов с KeyTerm{Relation: public_reader} и множество строк
      modulecatalog с флагом, ограничив его типами из rep.Composed.
  - id: N2
    blocking: false
    text: >-
      modelrender и modelcompose теперь импортируют authzmodel ради одного типа
      данных KeyTerm. При этом проза cmd/kaname/model_compose.go:29 и шапка
      compose.go утверждают, что «композиция не знает о допуске». Цикла сборки нет,
      и на корректность это не влияет. Чище держать KeyTerm в нейтральном пакете
      (domain или authzplan), тогда граф пакетов совпадёт с прозой.
