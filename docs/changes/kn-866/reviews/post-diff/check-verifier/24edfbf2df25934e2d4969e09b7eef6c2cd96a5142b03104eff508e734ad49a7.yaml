    result: голова — 0 находок (ЗЕЛЁНОЕ) во всех режимах I1, I2, I1+I2; на базе 3 находки
  empty_key_list_strict:
    command: TestCV866Census @ba1f0f681 с Admit(composed) без перечня
    result: PM-01 — 5 находок, X1/X2/PM-10 — 4–5; пустой перечень строгий, зелёного не даёт
x4_explanation: >-
  X4 на базе зелёный честно: база не исключает ничего, находка на othermod_thing.v_get есть. Красным X4 становится только
  на ДВУХ фактах сразу — законность по имени (иначе авторское v_get не даёт терма) И контейнер из канона (иначе указатель
  в registry_registry не законен); прототип нёс оба (ProtoDeclaredContainers = {registry_registry} из пробы). Поодиночке
  каждый факт ловят другие пробы: I1 — TestCE01, I2 — TestAdmitEdgeIsCutOnlyTowardADeclaredNewContainer. X4 — держатель
  регрессии на сочетание, а не TDD-красный; утверждение «канонический тип не в перечне термов» в той же пробе держит CE-02 по производителю
masks: не найдено; осмотрены проба автора в modelcompose целиком (pmEdit — ровно одна замена, иначе Fatal; pmChain — Fatal на отказе загрузки и композиции; pmRequireFindings — множество точно)
