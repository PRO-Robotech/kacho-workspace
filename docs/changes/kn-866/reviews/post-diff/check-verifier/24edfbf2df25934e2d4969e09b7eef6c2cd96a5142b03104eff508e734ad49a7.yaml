    command: PROTO_MODE=A go test -overlay (admit.go прототипа из scratchpad kn866/ov) @7642fc25e, TestCV866Census
    result: X1, X1b, X2, X4 — 0 находок (КРАСНОЕ против ожидания автора); близнецы и PM-01 — 0 (ЗЕЛЁНОЕ); PM-10 — 1 (ЗЕЛЁНОЕ). Замер аналитика воспроизведён
