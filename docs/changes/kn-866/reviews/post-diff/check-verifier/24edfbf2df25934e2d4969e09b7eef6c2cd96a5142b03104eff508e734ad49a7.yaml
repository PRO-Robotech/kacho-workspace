    result: >-
      TestAdmitEdgeIsCutOnlyTowardADeclaredNewContainer FAIL — «указатель в КАНОНИЧЕСКИЙ контейнер законным термом не становится:
      ждали одну находку на acme_thing.v_get, получено []» (admit_key_terms_test.go:196); пробы modelcompose (вкл. X4) — зелёные
  inj_I1_plus_I2_prototype_shape:
