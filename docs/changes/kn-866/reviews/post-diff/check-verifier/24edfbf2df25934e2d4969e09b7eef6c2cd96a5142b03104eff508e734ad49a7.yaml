      rc 1; FAIL — TestPM01, TestPM07, TestPM08, TestPM10 (3/3 подтеста), TestCE01; PASS — TestPM02, TestPM05, TestCE02_ForeignChild.
      Поимённо (TestCV866Census): X1 — 3 находки вместо 1, X1b — 3, X2 — 3 (все на probemod_box, не на item), X4 — 1 = ждали (ЗЕЛЁНОЕ),
