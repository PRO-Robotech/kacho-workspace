# ── ЗАЯВЛЕНИЕ «ГЕЙТ ПОДЧИНЯЕТСЯ СЕБЕ»: проверено ПРЯМО ─────────────────────
self_subjection_probe:
  заявлено: >-
    «гейт подчиняется себе: его область выведена из дельты к стволу, остаток
    измерен числом — вне дельты 87».
  проверено: подстановкой в копию дерева, тремя шагами, каждый коммитом.
  шаг_1: >-
    файл гейта В ИСХОДНОМ ВИДЕ в судимое множество НЕ ВХОДИТ: ни одного вызова
    из `treeWalkCallees` в нём нет — состав он берёт у `newTrackedTree`
    (выведенный корень). Счётчик `walking` его не считает, до вопроса об
    обещании дело не доходит.
  шаг_2: >-
    добавлен ВЫПИСАННЫЙ корень (`os.ReadDir(".")` перед `goTestFilesUnder`).
    Файл вошёл в множество: перепись выросла «обещают полноту в дельте 7 → 8 ·
    объявили область 4 → 5». Обещание у него своё, уже стоявшее: «Каждый раз
    чинился конкретный гейт» (стр. 13).
  шаг_3: >-
    сняты ОБА прозаических объявления из шапки (строки 36 и 45 —
    «ОБЛАСТЬ ОБХОДА:» и «ОСТАТОК:» заменены на «Смотрим только:» и «Прочее:»).
    Гейт ОСТАЛСЯ МОЛЧАЛИВ: перепись напечатала «в дельте объявили область 5»,
    находки не появилось.
  причина: >-
    обе части объявлены в этом же файле КОНСТАНТАМИ (строки 81-82) и печатаются
    в `t.Logf` (строка 218), а `declaresScope` судит сырой текст. Для
    СОБСТВЕННОГО исходника предикат истинен БЕЗУСЛОВНО — снять объявление и
    получить на себя находку нельзя ни при какой правке шапки.
  ruling: >-
    ОПРОВЕРГНУТО. Заявление верно как ПРОЗА — автор честно назвал и область, и
    остаток числом, — и ложно как МАШИННОЕ свойство: гейт не способен покраснеть
    на себе. Это ровно тот род, против которого он поставлен: утверждение о
    дереве, за которым не стоит обхода.

