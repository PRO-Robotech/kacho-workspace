    class: объявление шире исполняемого — теперь у САМОГО МЕХАНИЗМА
    coordinate: internal/repohygiene/gatescopedeclared_test.go:86-93, :248-254, :257-259, :304-327
    finding: >-
      шапка обещает, что «написать узкий обход, НЕ ЗАМЕТИВ этого, больше нельзя»
      (строки 58-61). Проверен 21 способ написать ровно это — 18 проходят
      МОЛЧА: 11 форм выписанного корня из 13, 5 форм обещания полноты из 6, обе
      формы «объявления», удовлетворяемого простым упоминанием обеих частей.
      Закрытым объявлен только перечень СЛОВ (строки 245-247); перечень форм
      КОРНЯ закрытым не объявлен нигде, а шапка (строки 25-27) определяет
      выписанный корень как «строковый литерал либо величина, которой литерал
      присвоен» — под это определение не попадает ни параметр, ни возврат
      функции, ни поле структуры, ни элемент перебираемого списка.
      Экземпляр НЕ синтетический и лежит В ДЕЛЬТЕ:
      gateway/cmd/api-gateway/session_carrier_wiring_test.go — корни
      «../../internal/middleware» и «../../internal/config» названы литералами
      на строках 67, 68, 86 и уходят параметром в обходы на строках 113 и 161;
      обещание полноты стоит на строках 9 и 44; объявления области нет.
    требование: >-
      1) решить перечень форм корня: либо признать его закрытым ВСЛУХ, как
      сделано со словами, — и тогда шапка обязана перестать обещать, что род
      больше не завести; либо накрыть формы, в которых литерал отделён от
      обхода одним узлом (параметр, возврат, поле, элемент перечня, соединение,
