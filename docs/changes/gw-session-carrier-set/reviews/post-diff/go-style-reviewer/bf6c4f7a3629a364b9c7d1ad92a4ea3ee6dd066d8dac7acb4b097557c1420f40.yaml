      2) `declaresScope` обязан судить ОБЪЯВЛЕНИЕ, а не упоминание: обе части —
      в комментарии верхнего уровня, а не в любой строке файла.
      3) привести названный в дельте экземпляр в соответствие с правилом гейта.
