# ── ОТДЕЛЬНОЕ РЕШЕНИЕ: отсутствие порога — честность или дыра ──────────────
threshold_ruling:
  предмет: >-
    gateway/internal/middleware/session_carrier_readers_gate_test.go:310-322 —
    «ПОРОГА ЗДЕСЬ НЕТ НАМЕРЕННО. Число — ПЕРЕПИСЬ, а не требование… Усадку
    переписи читает тот, кто смотрит отчёт».
  что_проверено_и_чем: >-
    проверено возражение «перепись зелёной пробы в конвейер не попадает»: оно
    ОПРОВЕРГНУТО замером. `make test-unit` гоняет `go test … -json`, а `-json`
    включает подробный вывод; ведомость `.github/scripts/go-test-verdict.py`
    строку переписи печатает — прогнал прямо этой цепочкой, строка
    «перепись: законных квалифицированных упоминаний … 3 (…)» в выводе есть.
    Механизм прочтения существует.
  ruling: >-
    ЧЕСТНО ПО СУЩЕСТВУ, НО ОДНА КЛАУЗА ШАПКИ ШИРЕ ИСПОЛНЯЕМОГО — не блокирует.
    Довод автора верен: выписанный порог сам стал бы выписанным знаменателем,
    который правят при каждом законном месте. Требование ≥1 в точности
    соответствует объявленному инварианту «сужение области опирается на живой
    предмет», и граница названа вслух. Но выше, строкой 407 того же файла,
    стоит «Исчезнут — пробу пересмотрит то же изменение»: при поле ≥1 исчезновение
    ДВУХ упоминаний из трёх не даёт ни красного, ни иного исхода, и пересмотреть
    пробу изменение не обязано ничем. Это утверждение о механизме, которого нет.
    Починка — одна из двух: либо снять эту клаузу, либо поставить ВЫВЕДЕННЫЙ
    пол (не литеральное число): например, требовать, чтобы упоминание
    находилось в каждом из перечисленных корней, — тогда усадка до одного
    корня краснеет, а перечень остаётся выведенным из предмета. Ложная
    дихотомия «порог или ничего» в дереве уже опровергнута ведомостями вида
    `.github/scripts/gate-skips-allowed.txt`.

