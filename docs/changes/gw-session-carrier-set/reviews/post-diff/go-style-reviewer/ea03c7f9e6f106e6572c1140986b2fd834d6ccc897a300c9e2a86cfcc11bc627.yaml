# ── ГЛАВНЫЙ ВОПРОС КРУГА: перебор САМ ЕСТЬ ОБЪЯВЛЕНИЕ ПОЛНОТЫ ──────────────
#
# Спрошено у перебора ровно то, что три круга спрашивалось у предмета: чем
# доказано, что форм именно столько. Ответ по каждому перебору — ниже, и он
# получен ПОДСТАНОВКОЙ, а не чтением.

critical:
  - id: C1
    class: ПЕРЕБОР НЕПОЛОН — ДВЕНАДЦАТАЯ ФОРМА ТЕРЯЕТСЯ МОЛЧА
    coord: gateway/cmd/api-gateway/session_carrier_wiring_test.go:922
    also: gateway/cmd/api-gateway/struct_fields_forms_test.go:53
    finding: >-
      Встроенный обобщённый тип с ДВУМЯ И БОЛЕЕ аргументами типа даёт
      *ast.IndexListExpr, которого switch в embeddedFieldName не разбирает:
      возвращается "", и поле исчезает из «выведенного» состава молча. Это
      ДОСЛОВНО тот дефект, ради которого механизм заведён («на ВСТРОЕННОМ поле
      список имён пуст, и цикл его пропускал»), сдвинутый на одну форму
      грамматики.
    measured: >-
      Подстановка на ДОСЛОВНО скопированных функциях механизма. `Embedded[int,
      string]` → []; `*Embedded[int, string]` → []; `other.Embedded[int,
      string]` → []. Для сравнения `Embedded[int]` → ["Embedded"].
      Спецификация Go: EmbeddedField = [ "*" ] TypeName [ TypeArgs ] — TypeArgs
      часть грамматики встроенного поля, а не экзотика.
    requirement: >-
      Разобрать *ast.IndexListExpr наравне с *ast.IndexExpr и завести обе формы
      строками перебора с исходом.

  - id: C2
    class: ПЕРЕЧЕНЬ СОСТАВЛЕН ОТ РУКИ, А НЕ ВЫВЕДЕН — та же конструкция этажом выше
    coord: gateway/cmd/api-gateway/struct_fields_forms_test.go:53
    finding: >-
      Перебор не выведен ни из грамматики, ни из самого механизма. Доказательство
      прямое: switch в embeddedFieldName несёт ЧЕТЫРЕ случая (Ident · StarExpr ·
      SelectorExpr · IndexExpr), а fieldFormCases() строки на IndexExpr НЕ
      ИМЕЕТ — при том что случай написан автором намеренно и снабжён
      комментарием «Встроенный обобщённый тип». Перебор, выведенный из
      механизма, не может пропустить случай, лежащий ВНУТРИ разбираемого им
      switch. Значит перечень выписан от руки — ровно та конструкция, за которую
      возвращали на девятом круге, перенесённая на уровень сдачи.
    second_half: >-
      Одиннадцать строк не перечисляют ФОРМЫ ВХОДА: «встроенный интерфейс»
      (`Reader`) и «встроенное поле» (`Embedded`) суть ОДИН вход (*ast.Ident);
      «поле-функция», «поле типа из другого пакета», «поле с тегом» и
      «неэкспортируемое» суть один вход (len(Names)>0). Перебор считает
      СЕМАНТИКУ и называет число числом форм входа.
    requirement: >-
      Вывести перечень из разбираемого множества (случаи switch + формы
      грамматики) либо объявить его выписанным и назвать, чем он держится.

  - id: C3
    class: ГРАНИЦА — ОТСРОЧКА ПОД ВИДОМ РЕШЕНИЯ
    coord: gateway/cmd/api-gateway/struct_fields_forms_test.go:24
    finding: >-
      Довод «ключом литерала служит имя типа, и назвав тип, корень передаёт и
      продвинутое поле» верен про КЛЮЧ и неверен про ФАКТ — а предикат гейта о
      факте.
    measured: >-
      Подстановка на дословной логике гейта. Ось читает продвинутое `Clock`
      встроенного `Base`.
      А) перечень осей назван ПО ТИПУ, как предписывает граница:
         корень `Subject{Base: Base{}, Posture: …}` → ЗЕЛЁНО, при Clock == 0.
         Это ровно то молчаливое выключение оси, ради которого гейт заведён:
         «поле, забытое в корне, даёт НУЛЕВОЕ значение — ось молча не
         срабатывает» (его собственная шапка).
      Б) перечень назван ПО ПРОДВИНУТОМУ ПОЛЮ:
         корень `Subject{Base: Base{Clock: 5}, …}` → КРАСНО, при ВЕРНОМ корне.
         Продвинутое имя ключом составного литерала быть не может никогда,
         поэтому ложное срабатывание здесь безусловно.
      Обе стороны мимо: на форме продвинутого поля гейт не «частичен», а неверен
      в обе стороны.
    requirement: >-
      Либо разрешать встроенный тип и спускаться в его состав, либо судить
      ЗНАЧЕНИЕ, а не присутствие ключа. Нынешняя формулировка границы отзывается:
      она объявляет достаточным то, что достаточным не является.

  - id: C4
    class: ЧИСЛО ИЗ СОСЕДНЕЙ РЕВИЗИИ — перекочевало, и перебор несёт своё опровержение
    coord: internal/repohygiene/gatescopewordboundary_test.go:177
    finding: >-
      «справа русская буква (129)». На ОБЪЯВЛЕННОЙ ревизии `9ae1ca86` живое
      значение — 130. 129 есть значение на `9134f5ba`, ПРЕДЫДУЩЕМ коммите:
      автор перемерил левую колонку (2678→2679) и правую эту строку не тронул.
    self_refuting: >-
      Две стороны перебора суть два разбиения ОДНОГО множества вхождений и
      обязаны давать одну сумму. Левая колонка автора: 2679+56+15+12+1+29 = 2792.
      Правая: 2238+208+89+75+23+20+6+2+1+129 = 2791. Перебор противоречит себе
      на единицу, и увидеть это можно не выходя из таблицы.
    measured: >-
      Независимая перепись по 2339 проверочным файлам на `9ae1ca86`: справа
      словесный сосед 130 — «каждому» 126 + «всякому» 4. Левая колонка
      воспроизвелась ДО ЗНАКА (2679 · 56 · 15 · 12 · 1, буква 29, край 0),
      правая — до знака во всём, кроме этой строки.
    requirement: 'Перемерить на объявленной ревизии; 129 → 130.'

  - id: C5
    class: ЧИСЛО ЗАСТАРЕЛО В ТРЁХ ДОМАХ, и машина печатает опровержение рядом
    coord: internal/repohygiene/gatescopedeclared_test.go:70
    also:
      - internal/repohygiene/gatescopedeclared_test.go:76
      - internal/repohygiene/gatescopewordboundary_test.go:105
      - gateway/cmd/api-gateway/session_carrier_wiring_test.go:49
    finding: >-
      «Из СЕМНАДЦАТИ проверочных файлов дельты гейт судит ОДИН». На HEAD дельта
      несёт ВОСЕМНАДЦАТЬ проверочных файлов. Восемнадцатый — `struct_fields_
      forms_test.go`, добавленный ТЕМ ЖЕ головным коммитом, который «семнадцать»
      переобъявил во всех трёх домах. Отношение («судит ОДИН») верно;
      знаменатель устарел.
    measured: >-
      `git diff --name-only --diff-filter=ACMR bec320cf47d...HEAD | grep -c
      '_test\.go$'` → 18 (на 9ae1ca86 → 17). Собственная перепись гейта в том же
      прогоне печатает «ОБЛАСТЬ ОБХОДА: … (18 файлов)» — проза и машина
      расходятся в одном выводе.
    second_half: >-
      У одного числа ТРИ дома. Тот же файл абзацем выше доказывает, почему так
      нельзя: «Дом у числа по-прежнему один, копий нет… расходятся именно копии».
      Здесь копии и разошлись — все три сразу.
    requirement: >-
      Оставить числу один дом, остальным — ссылку на него; перемерить на HEAD.

important:
  - id: V1
    class: ПЕРЕПИСЬ СНЯТА НЕ ТЕМ ПРЕДИКАТОМ, которым работает механизм
    coord: internal/repohygiene/gatescopewordboundary_test.go:91
    finding: >-
      Предикат переписи объявлен СТРОЧНЫМ («слово внутри строки, чья отбивка
      начинается с `//`»), а боевой вызывающий (gatescopedeclared_test.go:297)
      УЗЛОВОЙ: ему передаётся `c.Text` — текст узла комментария. Строчный
      предикат не видит ХВОСТОВЫХ комментариев (`код // текст`), которые боевой
      видит.
    measured: >-
      Перепись по УЗЛАМ на `9ae1ca86`: вхождений 2801 против 2792 строчных;
      справа край 210 против 208; запятая 88 против 89; скобка 3 против 2.
      Состав форм совпал, числа — нет. Четырнадцать из двадцати пяти строк несут
      числа о ДРУГОЙ совокупности, чем вход механизма.
    requirement: >-
      Снять перепись тем входом, которым работает механизм, либо объявить
      расхождение предикатов числом.

  - id: V2
    class: ДВАДЦАТЬ ШЕСТАЯ ФОРМА — ПЕРЕНОС СТРОКИ СОСЕДОМ
    coord: internal/repohygiene/gatescopewordboundary_test.go:135
    finding: >-
      У БЛОЧНОГО комментария узел охватывает несколько строк, значит `\n` есть
      законный сосед с обеих сторон. Строки в таблице нет ни слева, ни справа —
      при том что «на будущее» строки заведены для тире, неразрывного пробела и
      кавычки-лапки, которых в дереве столько же, сколько переноса: ноль.
      Асимметрия не объяснена.
    why_invisible: >-
      Строчная перепись (V1) НЕ МОЖЕТ выдать `\n` соседом by construction: она
      режет вход на строки прежде счёта. Значит полнота «слева пять, справа
      девять» обеспечена прибором, структурно слепым к форме.
    measured: >-
      На `9ae1ca86` в дереве 16 блочных узлов, из них 0 несущих слово перечня —
      форма латентна СЕГОДНЯ, ровно как четыре формы, для которых строки есть.
      Сам автор называет «оборот, разорванный переносом строки» шестой невидимой
      формой (gatescopedeclared_test.go:52), то есть многострочность входа ему
      известна — до перебора она не дошла.
    requirement: 'Завести строку на `\n` с обеих сторон, исход и помету присутствия.'

