# ── ОБЫЧНЫЙ ОБЪЁМ РОЛИ ПО ПОЛНОМУ ДИФФУ 43 КОММИТОВ ───────────────────────
ordinary_sweep:
  error_wrapping: >-
    ЧИСТО. `%w` везде, где ошибка переносится; обёртка называет, ЧТО
    спрашивали (sessioncarriers.go:… «…derived from %s: %w»). Ни одного
    голого `return err` в добавленном непроверочном коде.
  error_text_leak: >-
    ЧИСТО. Тексты отказов называют ручку, законные значения и следствие; текста
    драйвера и SQL наружу нет. `writeHTTPUnauthorized(w,
    sessionCutoffDenyDescription)` — фиксированный текст, эха ошибки нет
    (hard-no-err-echo).
  context: >-
    ЧИСТО. Ни одного `context.Background()`/`context.TODO()` в добавленном
    непроверочном коде. Новых внешних вызовов дельта не вносит (ни http.Client,
    ни Do, ни Dial), поэтому ось «свой дедлайн на каждом внешнем вызове» нового
    предмета в этом диффе не получает.
  panic_free: >-
    ЧИСТО. Ни panic, ни MustParse, ни must* в рабочем пути. Три новых
    `log.Fatalf` стоят в `main()` при старте, рядом с уже бывшим там
    «identity posture startup-validation» — это форма boot-guard fail-closed
    refuse-to-start (ban16-boot-guard), а не паника на вводе.
  logging: >-
    ЧИСТО. `log/slog` со структурными полями; сторонних логгеров, fmt.Println и
    log.Printf в дельте нет. `slog.NewLogLogger(cfg.Logger.Handler(),
    slog.LevelError)` — правильный мост для ErrorLog обратного прокси.
  pii_in_logs: >-
    ЧИСТО. В журнал уходят состояние множества, посадка, момент окна и адрес
    поставщика — единичный operational-config, прямо разрешённый исключением
    hard-no-pii-in-logs. Значений печенья, почты и удостоверений в аргументах
    журнала нет.
  thin_transport_and_layering: >-
    ЧИСТО. Разбор объявления живёт в `internal/config`, страж — отдельной
    функцией рядом с корнем, счётчики — в observability. Сборка зависимостей
    только в `cmd/api-gateway/main.go` (arch-wiring-cmd-only); глобальных
    синглтонов и init() с побочным эффектом дельта не вносит.
  naming_and_types: >-
    ЧИСТО. `SessionCarrierSet` — собственный тип с неэкспортируемыми полями,
    равенство значений означает одно состояние; голых string-идентификаторов
    домена не заведено (evgeniy §4). Имена латиницей (запрет #17). Имя ручки
    объявлено ОДНОЙ константой и оттуда читается текстами отказов, стражем и
    профилем.
  classification_without_other_bucket: >-
    ЧИСТО. `logoutOutcomeOf` (login_lane_relay.go) — закрытая классификация с
    тремя исходами и без корзины «прочее»; нераспознанный код получает
    собственный исход, а не молчание.
  clock_injection: >-
    ЧИСТО. Часы приходят полем `Now time.Time` из композиционного корня, внутри
    стража не читаются — страж проверяем на своём же предмете.
  chart_and_docs: >-
    ЧИСТО. `values.yaml` и `deployment.yaml` различают «не задано» и «задано
    пустым» через `with`; имена ручек побайтово совпадают с `config.go`.
  foundation_candidates: >-
    НЕТ. Горизонтального в дельте не заведено; `identityposture` уже берётся
    пином из corelib и переиспользуется общим словарём вместо второго разбора
    тех же имён — это ровно требуемое направление (arch-corelib-horizontal).
  deferral_markers: '0 — по полному диффу 43 коммитов, добавленные строки.'
  probes_in_the_same_pr: >-
    ДА. Дельта несёт 18 проверочных файлов; оба механизма сдаются переборами в
    том же изменении.

