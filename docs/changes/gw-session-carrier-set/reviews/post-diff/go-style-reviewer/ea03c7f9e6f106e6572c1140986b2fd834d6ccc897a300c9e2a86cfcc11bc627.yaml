  perebor_2_future_forms: >-
    Пять форм «на будущее» ПОДТВЕРЖДЕНЫ нулями: тире слева и справа, неразрывный
    пробел слева, кавычка-лапка слева и справа — ни одной в дереве. «Проверено»
