# ── род блокирующих прошлого круга: назван ДО нового вердикта ──────────────
#
# Четыре критические круга второго были ОБ ОДНОМ — ОБЪЯВЛЕНИЕ ШИРЕ
# ИСПОЛНЯЕМОГО. Ниже каждая, заявление автора и СВОЙ перемер. Подтверждение
# посылки отчитывается так же подробно, как опровержение (multi-agent-flow
# §14а); результат работы-проверки установлен ЭКСПЕРИМЕНТОМ — подстановкой в
# копию дерева, — а не чтением диффа (§15).
previous_round_blockers:
  - id: C1
    class: объявление шире исполняемого
    was: >-
      шапка гейта предикатов обещала находкой ВСЯКОЕ чтение имени носителя вне
      файла; обход шёл по одному каталогу и знал одну форму имени.
    author_claims: >-
      выбрано СУЖЕНИЕ объявления, не рост обхода — вне пакета имя называется, а
      не читается, и широкое объявление было бы ложным по существу. Сужение
      опирается на живой предмет: «проба находит ОБЕ квалифицированные
      координаты и падает, если их не останется».
    my_measurement: >-
      ДОВОД ПРИНЯТ КАК РАЗБОР, НЕ КАК ОТГОВОРКА — и вот почему. Предмет гейта
      назван точно — расхождение ДВУХ ПОЛОС, читающих одну браузерную сессию
      (`auth.go` и `session_identity_handler.go`); обе живут в
      `internal/middleware`, и область обхода РАВНА этому пакету: она выведена
      из дерева (`os.ReadDir(".")`), а не выписана. Остаток вне области назван
      ВСЛУХ и в переписи, и в шапке — «чужие пакеты, где имя НАЗЫВАЕТСЯ (текст
      отказа, обход перечня гасимых), читателем носителя не являются».
      Перемерено прогоном: «непроверочных файлов осмотрено 49 · констант имён 2
      · мест чтения носителя 2 · вне дома 0». Запрет на называние имени в
      чужом пакете действительно был бы запретом объяснять оператору, о каком
      печенье речь, — сужение по существу верно.
      ЧИСЛО ЖЕ В ЗАЯВЛЕНИИ НЕ ПОДТВЕРДИЛОСЬ — находка V2: проба печатает
      «законных квалифицированных упоминаний вне пакета полос 1», а не 2.
    ruling: закрыта по существу; число в заявлении опровергнуто (V2)

  - id: C2
    class: комментарий «стороны выводятся из множества» стоял над литералом
    author_claims: >-
      стороны выводятся разбором; инъекция третьей стороны краснит гейт и
      называет её по имени.
    my_measurement: >-
      ПОДТВЕРЖДЕНО ЭКСПЕРИМЕНТОМ. `carrierSetQuestions`
