      7 полей снимка читаются».
    my_measurement: >-
      ПОДТВЕРЖДЕНО ЭКСПЕРИМЕНТОМ. `TestSessionLane_EveryLaneSnapshotFieldIsRead`
      (`internal/observability/metrics/session_lane_test.go:148`) обходит поля
      снимка ОТРАЖЕНИЕМ, даёт каждому своё число и требует найти его в выдаче;
      область выведена из типа, гейт истекает сам. Коллектор действительно
      читает обе новые клетки — `TransitionalWindowClosed` уходит исходом
      `window_closed` в семейство отказов, `TransitionalFloorWithheld` имеет
      свою клетку (`session_lane.go:104,159`). Подстановка: дописано восьмое
      поле `ProbeUnread uint64` без читателя — прогон КРАСНЫЙ, поле названо по
      имени, перепись «полей-счётчиков в снимке 8 · прочитанных коллектором 7».
    ruling: закрыта, подтверждена подстановкой

  - id: C4
    class: >-
      заведено второе место гашения печенья мимо функции, чья шапка говорит
      «одно место, один способ»
    author_claims: >-
      второе место снято, заведён гейт «мест сборки 1» по 72 файлам; перепись
      выходов сравнивает ФОРМЫ, а не знак срока — и это сразу нашло, что
      собственный дублёр автора был снисходительнее настоящего.
    my_measurement: >-
      ДВЕ ПОЛОВИНЫ РАЗОШЛИСЬ.
      ПЕРВАЯ ПОДТВЕРЖДЕНА — в продукте одно место СБОРКИ атрибутов гашения,
      `internal/middleware/session_carrier_names.go:101`; измерено обходом
      всего модуля `gateway` — выражение по литералу `http.Cookie` в
      непроверочных файлах даёт ровно одну координату. Ретранслятор берёт
      печенья у неё (`handler/login_lane_relay.go:236`). Сравнение ФОРМ в
      переписи выходов (`carrierEndingShape` — путь, срок, httponly, secure,
      samesite) действительно сильнее знака срока, а дублёр службы берёт
      каноническую форму у самого продукта и потому не может быть
      снисходительнее; это перемерено чтением фикстуры и подтверждается
      сравнением форм между выходами.
      ВТОРАЯ ОПРОВЕРГНУТА — ГЕЙТ, объявленный держателем свойства, обходится
      тремя способами, и каждый измерен подстановкой: находка K1.
    ruling: половина о продукте закрыта; половина о гейте открыта заново как K1

