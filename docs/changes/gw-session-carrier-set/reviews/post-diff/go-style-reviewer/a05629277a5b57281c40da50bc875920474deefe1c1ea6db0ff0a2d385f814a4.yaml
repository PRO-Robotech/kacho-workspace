      ПОБОЧНОЕ НАБЛЮДЕНИЕ ТОЙ ЖЕ ПОДСТАНОВКИ стало находкой K2.
    ruling: закрыта, подтверждена подстановкой

  - id: C3
    class: >-
      две клетки писались и не читались никем, а опубликованная страница
      обещала по ним судить
    author_claims: >-
