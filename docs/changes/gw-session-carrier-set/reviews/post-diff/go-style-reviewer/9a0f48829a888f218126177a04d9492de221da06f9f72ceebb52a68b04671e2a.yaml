      - gateway/internal/middleware/session_identity_handler.go:149
      - gateway/internal/middleware/session_identity_handler.go:214
      - gateway/internal/middleware/session_carrier_readers.go:20
    finding: >-
      Общий предикат присутствия НАШЕГО носителя заведён верно и зовётся обеими
      полосами решения (`auth_own_session.go:91`, `session_identity_handler.go:149`),
      но в дереве осталась ТРЕТЬЯ, встроенная копия того же предиката:
      `meFromOwnSession` читает носитель заново — `r.Cookie(OurSessionCarrierName)`
      плюс `err != nil || carrier.Value == ""` (строки 228-231). Файл-заголовок
      `session_carrier_readers.go:20-24` при этом утверждает «Предикат поэтому
      ОДИН на сторону, и обе полосы зовут именно его» — утверждение о дереве,
      которое дерево не исполняет (arch-doc-truthfulness). Следствия два:
      (1) расхождение полос осталось ПРЕДСТАВИМЫМ ровно в том файле, который
      объявляет его невозможным, — правка одной копии молча разведёт «чья
      личность действует» на двух путях одного запроса;
      (2) вызывающий `Me` уже вычислил значение и выбросил его (`_, ours :=`),
