      зовёт `ourSessionCarrierOf`. Недостижимая ветка снимается вместе со своей
      докстрокой тем же изменением. Проба — сравнением полос, как уже устроено в
      `session_carrier_precedence_test.go`, а не чтением кода.
    return_to: автор диффа feat/gateway-session-carrier-set

  - id: C3
    class: GUARD-CLAIMS-MORE-THAN-IT-ENFORCES
    coordinates:
      - gateway/cmd/api-gateway/session_carrier_validation.go:60
      - gateway/cmd/api-gateway/session_carrier_validation.go:71
      - gateway/cmd/api-gateway/main.go:205
      - gateway/cmd/api-gateway/main.go:220
    finding: >-
      Докстрока стража объявляет ОБЩЕЕ свойство: «отвергает пару (посадка,
      множество), при которой провязка не состоится или состоится ВПУСТУЮ»
      (строка 60). Пара (посадка `own`, множество `external`) этому свойству
      противоречит и принимается: правило на строке 71 спрашивает ReadsOwn и на
      ней не срабатывает, правило на строке 81 спрашивает только адрес чужой
      стороны. На такой паре край поднимает ретрансляцию формы входа
      (`main.go:220`), наша полоса чеканит `kaname_session`, и НИ ОДИН читатель
      его не читает (`main.go:205` и `main.go:1172` не срабатывают): человек
      проходит форму входа и остаётся анонимом. Это зеркало правила «читатель
      без производителя», которое страж как раз отвергает, — и ровно тот
      наблюдаемый исход (молчаливая потеря входа), ради устранения которого
      множество и заводится. Пробы на эту пару нет ни в
      `session_carrier_validation_test.go`, ни в `session_carriers_test.go`:
      `TestSessionCarrierGuard_TheThreeLawfulStatesPass` перечисляет три пары,
      представимых пар при двух посадках — четыре.
    requirement: >-
      Выбрать исход и исполнить его: либо страж отвергает пару
      (посадка `own` ∧ ¬ReadsOwn) отказом, называющим ОБЕ ручки, либо докстрока
      сужается до двух перечисленных правил и перестаёт утверждать общее
      свойство. В обоих случаях — проба на эту пару в том же изменении, с
      переписью «представимых пар N · отвергнуто M · принято K».
    return_to: автор диффа feat/gateway-session-carrier-set

