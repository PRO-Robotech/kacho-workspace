      `session_carrier_validation_test.go:TestSessionCarrierGuard_OurReaderUnderThe
      ForeignPostureIsRefused`. Текст, добавленный тем же коммитом на семь строк
      выше значения (строка 208), сам говорит «Наша сторона требует посадки own
      … под external выдать его на этом стенде некому» — документ противоречит
      себе и коду. Оператор, скопировавший пример, получает стенд, который не
      поднимается.
    requirement: >-
      Привести пример к исполнимой паре: либо посадка `own` рядом с
      `own,external`, либо множество `external` под посадкой `external`. Плюс
      проба, связывающая опубликованный профиль со стражем (декларативный гейт
      по объявлениям примера, не по рендеру, — см. hard-declarative-values-test),
      иначе расхождение вернётся при следующей правке одной из сторон.
    return_to: автор диффа feat/gateway-session-carrier-set

  - id: C2
