      при байтовой границе файл оставался опознан через другой свой
      комментарий, `internal/repohygiene/gatescopedeclared_test.go:12`
      («…Каждый раз чинился»), где слово перечня стоит между обычными
      пробелами и никакой ёлочки рядом нет. Проверено на трёх ревизиях
      подряд — 73ef0a40, e3c78372 и на голове: во всех трёх файл опознан
      байтовой редакцией словом «каждый».
    что_ИСПОЛНЯЕТСЯ: >-
      темнели не файлы, а СТРОКИ: из пяти дословно процитированных строк шапки
      этого файла байтовая редакция молчала на всех пяти, рунная опознаёт ТРИ
      (две остальные молчат по устройству и не должны опознаваться). Единица
      счёта здесь «строка», а в том же предложении объявлена «файл».
    почему_это_тот_же_класс: >-
      абзацем ниже тот же коммит пишет: «это другая величина, и складывать их
      нельзя». Здесь величины ровно так и сложены — счёт по файлам и факт по
      строкам стоят в одном предложении под одним «среди них». Это и есть
      «объявление шире исполняемого», против которого заведён весь механизм.
    сосед_несёт_ту_же_привязку: >-
