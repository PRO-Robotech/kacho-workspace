# ── ГЛАВНЫЙ ВОПРОС КРУГА ───────────────────────────────────────────────────
main_question:
  question: >-
    оба дефекта круга девятого были механизмами против класса, воспроизводившими
    класс внутри себя. Что делают ДВА НОВЫХ механизма круга десятого?
  answer: 'КЛАСС ПЕРЕЕХАЛ В ТРЕТИЙ РАЗ — в ОБА новых механизма.'
  mechanism_1_three_valued_presence:
    what_holds_the_third_value: >-
      СЛОВО В КОММЕНТАРИИ, и ничего больше. Довод «недостижимо по устройству
      входа» ВЕРЕН РОВНО ДЛЯ ОДНОГО ИЗ ТРЁХ вызывающих. Перепись вызывающих
      `containsWord` (перебором, не чтением): gatescopedeclared_test.go:282 —
      `c.Text` узла комментария, там край СЛЕВА действительно недостижим по
      гарантии go/parser; gatescopewordboundary_test.go:145 — синтетика
      таблицы, и «каждое вхождение» начинается с индекса 0, то есть край слева
      ЗДЕСЬ И ЕСТЬ сосед, на той самой строке, которая объявлена недостижимой;
      gatescopewordboundary_test.go:268 (`wordOfPerchenIn`) — произвольная
      `line string` без всякой предпосылки. У `containsWord` нет ни условия на
      вход, ни утверждения, ни гейта, перечисляющего вызывающих. Смену входа
      не заметит НИЧТО.
    is_it_masking_a_zero: >-
      ЭТОТ ноль — не маскировка: у него есть настоящий довод для одного
      вызывающего. Но ТРЁХЗНАЧНАЯ СХЕМА МАСКИРУЕТ СЕМЬ ДРУГИХ НУЛЕЙ, и
      маскирует их ПОДМЕНОЙ ЕДИНИЦЫ. → V2.
  mechanism_2_field_composition:
    declares_wider_than_executable: >-
      ДА, И ЭТО ДОКАЗАНО ПОДСТАНОВКОЙ. Форма, которую он не различает, —
      ВСТРОЕННОЕ (анонимное) ПОЛЕ. → V1.
  both_stand_in_forms_invisible_to_the_neighbouring_gate:
    verdict: ДА, ОБА, И ЭТО ПЕРЕМЕРЕНО
    measured: >-
      gatescopewordboundary_test.go обходит только `os.ReadFile` (:231), а
      `walkRootsOf` для ReadFile выходит РАНЬШЕ разбора корня
      (gatescopedeclared_test.go:415-417, «ReadFile по одному файлу обходом
      дерева не является») — файл НЕ попадает в судимое множество вовсе, хотя
      обещает полноту заглавными: «ПЕРЕЧЕНЬ ФОРМ ОКРУЖЕНИЯ ВЫВЕДЕН ПЕРЕПИСЬЮ
      ДЕРЕВА» (:59), «ВСЕ ЧИСЛА ПРИСУТСТВИЯ ИЗМЕРЕНЫ» (:76), «ВСЕ ВЕЛИЧИНЫ
      ПЕРЕПИСИ ВЫВОДЯТСЯ ИЗ ТАБЛИЦЫ» (:139), «ВСЕ строки соседа» (:253).
      session_carrier_wiring_test.go обходит `os.ReadDir(dir)` на :130, :178 и
      :856, где `dir` — ПАРАМЕТР помощника: это слепая форма №1 из собственного
      перечня гейта («корень ПАРАМЕТРОМ помощнику», gatescopedeclared_test.go:40).
      Корень считается ВЫВЕДЕННЫМ, файл не судится.
      Прогон гейта на HEAD: «обещают полноту 88 (в дельте 1, вне дельты 87) ·
      в дельте объявили область 1» — из 17 проверочных файлов дельты судится
      ОДИН, и это session_carrier_readers_gate_test.go:144 (`os.ReadDir(".")`,
      литерал). Оба новых механизма — вне.

