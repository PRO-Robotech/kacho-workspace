critical:
  - id: V1
    coord: gateway/cmd/api-gateway/session_carrier_wiring_test.go:877-895
    title: >-
      «состав полей выведен разбором» СЛЕП К ВСТРОЕННОМУ ПОЛЮ — механизм против
      «объявление шире исполняемого» сам объявляет шире исполняемого
    mechanism: >-
      `fieldsOfStructIn` берёт только ИМЕНОВАННЫЕ поля: `for _, fld := range
      st.Fields.List { for _, nm := range fld.Names }` (:888-889). У встроенного
      (анонимного) поля `fld.Names` ПУСТ — такое поле не даёт ни одного имени и
      в `declared` не попадает. Продвинутое поле встроенного типа читается
      стражем как своё (`cfg.SixthAxisOperator`), то есть ось на нём строится
      ровно так же, как на `Now`.
    proved_by_substitution: >-
      ЗАКОННЫЙ БЛИЗНЕЦ (дерево как есть): `go test -count=1 -run
      TestSessionCarrierWiring_TheGuardIsGivenEveryFieldItsAxesNeed` — PASS,
      «полей У ТИПА (выведено разбором) 5 · названо перечнем осей 5 · не
      названо 0».
      ПОДСТАНОВКА А (ИМЕНОВАННОЕ шестое поле): красное с именем — «поле
      SixthAxisField объявлено у SessionCarrierConfig и не названо в перечне
      осей», перепись «полей у типа 6 · названо перечнем 5 · не названо 1».
      Заявление автора ПОДТВЕРЖДЕНО ДОСЛОВНО.
      ПОДСТАНОВКА Б (ВСТРОЕННОЕ шестое поле): в SessionCarrierConfig встроен
      тип `SixthAxis` с полем `SixthAxisOperator`; в стража добавлена шестая
      ось, читающая продвинутое поле и ВЫКЛЮЧАЕМАЯ ЕГО ОТСУТСТВИЕМ — дословно
      форма `Now`; композиционный корень поле не передаёт. Исход: гейт
      ПРОШЁЛ, перепись напечатала «полей У ТИПА (выведено разбором) 5 · назван
      перечнем осей 5 · не названо 0», и ВЕСЬ пакет `go test -count=1
      github.com/PRO-Robotech/kacho/gateway/cmd/api-gateway` — `ok`. Ось
      выключена молча, и не заметил НИКТО.
    why_it_is_worse_than_what_it_replaced: >-
      Выписанный от руки перечень хотя бы не печатал числа со словом
      «ВЫВЕДЕНО». Теперь перепись утверждает «полей У ТИПА (выведено разбором)
      5» о типе, у которого шесть читаемых полей: ложное число под словом,
      означающим машинный вывод. Это ровно тот сдвиг, против которого заведён
      сосед: «объявление шире исполняемого».
    requirement: >-
      Считать и встроенные поля: у `fld.Names == nil` взять имя типа из
      `fld.Type` и раскрыть его состав (или объявить встроенное поле находкой —
