    note: >-
      речь о ~12 строках ФИКСТУРЫ внутри проверочного файла, который и так
      держит синтетическую таблицу из 21 строки ровно ради семантики предиката.
      Производитель входа — то, чего gate-authoring требует от всякой проверки,
      и мёртвым кодом он по мерке этого дерева не является.
  conclusion_no_guard:
    verdict: НЕ СЛЕДУЕТ ИЗ ПОСЫЛОК — пропущен третий исход
    why: >-
      «Число историческое» НЕВЕРНО в том виде, в каком число записано. Оно
      стоит в НАСТОЯЩЕМ ВРЕМЕНИ и о СЕГОДНЯШНЕМ дереве: «опознание меняется у
      ВОСЬМИ проверочных файлов модуля ИЗ 2339». Историческое число нельзя
      перемерить против движущегося дерева — это можно, я перемерил обе
      величины сегодня, и обе сошлись. Значит это ЖИВОЕ утверждение без
