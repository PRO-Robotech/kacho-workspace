  per_call_deadline: >-
    ОК. Единственный внешний вызов диффа идёт через `KratosClient`, у которого
    настроенный предел `http.Client{Timeout: 5s}` на все sibling-методы
    (kratos_session.go:95; файл диффом не тронут) — arch-per-call-deadline.
  no_panic_on_the_working_path: >-
    ОК. `panic(` в добавленных строках нет. `log.Fatalf` — только в
    композиционном корне до подъёма слушателей (main.go:181,187,198), там же,
    где на базе уже стояло 40 таких вызовов: boot-guard fail-closed, ban16.
    `must*` — только в проверочных файлах с `*testing.T`. `MustParse` на
    пользовательском вводе нет.
  structured_logging: >-
    ОК. Сторонних логгеров, `fmt.Print`, `log.Printf` в добавленных строках
    нет. Самоотчёт старта — структурными полями
    (`"carriers", …, "declared", …, "identity_provider", …,
    "transitional_window_opened_at", …`), без интерполяции.
  no_pii_and_no_driver_text: >-
    ОК. Значение носителя (`ProviderSessionCarrierHeader`) уходит только соседу
    и не логируется нигде; `slog`-строк со значением печенья, почтой или
    токеном в диффе нет. `err.Error()` в тексте наружу, `codes.Internal` с
    сырым текстом — ни одного.
  error_wrapping: >-
    ОК. `%w` стоит ровно там, где есть причина (config.go:143 — отказ разбора
    посадки; sessioncarriers.go:243 — отказ разбора RFC 3339). Остальные 12
    `fmt.Errorf` порождают ошибку и причины не имеют, поэтому `%w` в них
    правильно отсутствует. Контекст содержательный, не «error»/«failed».
  thin_transport_and_dependency_direction: >-
    ОК. pgx, database/sql, ORM, SQL-текста в диффе НЕТ (0 совпадений).
    Новое разбирается в `internal/config` (чистый разбор), сверяется стражем в
    композиционном корне, читается предикатами в `internal/middleware`.
    Классификация исхода выхода живёт в `internal/handler` и судится напрямую.
  ban09_operations: 'не применимо — изменение не заводит мутирующих RPC.'
  reuse_foundation: >-
    ОК, и это сильная сторона: словарь сторон берётся у внешнего фундамента
    пином (`corelib/identityposture`), второго разбора тех же имён не заведено;
    кэш соседа — общий примитив `internal/lrucache`. Копий чужого репозитория
    в дереве нет.

