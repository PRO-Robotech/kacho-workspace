    же 3592 файлам `*.go` того же модуля та же перепись даёт ШЕСТНАДЦАТЬ форм —
    добавляются `-` (U+002D, 3), `*` (U+002A, 2), `/` (U+002F, 1),
    `<` (U+003C, 1). Слово «дерево» не различает эти две области. → V3.
  in_tree_marker_does_not_distinguish: >-
    НЕТ, НЕ ОТЛИЧАЕТ — на четырёх строках из восемнадцати. → V1, критическая.

