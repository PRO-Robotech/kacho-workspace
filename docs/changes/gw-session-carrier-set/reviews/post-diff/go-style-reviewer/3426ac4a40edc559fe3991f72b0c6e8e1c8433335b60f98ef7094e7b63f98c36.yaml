    утверждение в запись, которая не может протухнуть, и снятый предикат
    держать живым не требует. Сегодня ни при одном из четырёх чисел
    (8 · 2339 · 18 · 9) ревизии не стоит: `grep -nE '2026-|sha|@[0-9a-f]{7}'`
    по обоим файлам даёт ноль. → V2.
