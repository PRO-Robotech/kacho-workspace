# ── КРИТИЧЕСКИЕ (блокируют посадку) ────────────────────────────────────────
critical:
  - id: V1
    coord: internal/repohygiene/gatescopewordboundary_test.go:83,101,104,105
    title: >-
      помета `inTree`, заведённая ради «проверено ≠ встречается», лжёт на
      ЧЕТЫРЁХ строках из восемнадцати
    measured: >-
      Перепись по 2339 проверочным файлам И по всем 3592 файлам Go модуля —
      результат один, от референта не зависит:
        :83  «край строки слева»   — 0 вхождений. Не просто отсутствует:
             НЕДОСТИЖИМА. Настоящий вход предиката — `c.Text` узла комментария,
             который всегда начинается с `//` либо `/*`, поэтому край слева
             соседом не бывает никогда (край СПРАВА — 207 вхождений);
        :101 «часть длинного слова» (словесные руны с ОБЕИХ сторон) — 0;
        :104 «цифра слева»  — 0;
        :105 «цифра справа» — 0.
      Все четыре несут `inTree: true`. Перепись, которую печатает сама проба,
      говорит «форм, проверяемых на будущее, 3 (в дереве не встречаются ни
      разу)» — читатель берёт всякую прочую строку как встречающуюся.
    why_critical: >-
      Это предикат, ради проверки которого созван круг, и он не исполняется.
      Помета заведена абзацем «они помечены, чтобы «проверено» не читалось как
      «встречается»» — и на четырёх строках читается именно так.
    requirement: >-
      Либо пометить эти четыре так же, как три «на будущее», либо объявить в
      документации поля, что `inTree` — утверждение о ФОРМЕ, а не о строке,
      стороне и случае, и снять флаг со строк, где это чтение не держится.
      Вместе с тем: `12` в строке переписи — литерал в форматной строке, а
      `inTree-5` несёт зашитую 5; шестая отрицательная строка молча сделает
      напечатанное «строк на них» неверным. Обе величины вывести из таблицы.
  - id: V4
    coord: gateway/cmd/api-gateway/session_carrier_wiring_test.go:732,745-751
    title: >-
      «КОРЕНЬ ПЕРЕДАЁТ СТРАЖУ ВСЕ ПОЛЯ» — обещание в невидимой форме «все»,
      которое держит ВЫПИСАННЫЙ от руки перечень
    measured: >-
      `axisFields` — пять имён, выписанных литералами. `SessionCarrierConfig`
      (session_carrier_validation.go:74-90) несёт ровно пять полей — Posture,
      Carriers, ProviderURL, WindowOpenedAt, Now, — и все пять в перечне.
      УТВЕРЖДЕНИЕ НА ЭТОЙ SHA ВЕРНО. Механизма под ним нет: шестое поле,
      добавленное в тип и прочитанное новой осью, в `axisFields` не попадёт,
      гейт останется зелёным, ось выключится молча.
    why_critical: >-
      Это ДОСЛОВНО дефект, который закрывает коммит bce51658458 («ось проверки
      момента не выключается отсутствием величины») — на одно касание раньше в
      этом же диффе. Держатель, заведённый против класса, воспроизводит класс.
      Довод шапки «вывести «от чего зависит ось» из типа нечем» верен про
      КАКАЯ ОСЬ и неверен про КАКИЕ ПОЛЯ: сегодня поля осей = все поля типа, а
      состав полей выводится тем же `go/ast`, которым проба уже пользуется.
      Средство известно и применено в сорока строках отсюда:
      `session_carrier_validation_test.go:82-96` выводит ОБЕ оси произведения
      из `identityposture.Values()`/`Names()` и говорит об этом вслух.
    requirement: >-
      Вывести состав полей из разбора типа `SessionCarrierConfig` (либо
      утверждать `len(axisFields)` против него), чтобы новое поле краснило.

