    belongs_to: НОСИТЕЛЬ СЕССИИ
    coord: gateway/cmd/api-gateway/main.go:216, читается на :224
    finding: >-
      `windowReport := "<окна нет>"`, и далее это уезжает полем самоотчёта
      `"transitional_window_opened_at", windowReport`. Область значений поля
      становится {момент RFC 3339} ∪ {фраза}. Отсутствие окна представимо
      ОТДЕЛЬНО — своим полем, — и здесь вместо этого записано сторожевым
      значением внутрь величины, которая во всех прочих случаях есть момент.
    why_it_matters: >-
      Это собственный довод ветки, применённый к её же строке: клетка
      `TransitionalWindowClosed` заведена ровно потому, что «ноль в клетке»
      обязан отличаться от «полосы нет». Здесь же два состояния — «окна нет» и
      «окно открыто в такой-то момент» — сведены в одно поле, и читатель
      самоотчёта (запрос по журналу, панель) обязан разбирать фразу.
      Язык к находке отношения не имеет: `"<none>"` был бы тем же дефектом.
      Русскоязычные строки для оператора — house style края: перепись по
      непроверочному дереву gateway даёт около ста таких литералов в 12 файлах,
      так что одноязычие здесь не нарушено.
    requirement: >-
      Нести отсутствие своим полем (например `transitional_window: false`) либо
      не эмитить поле момента, когда момента нет.
    blocking: false

