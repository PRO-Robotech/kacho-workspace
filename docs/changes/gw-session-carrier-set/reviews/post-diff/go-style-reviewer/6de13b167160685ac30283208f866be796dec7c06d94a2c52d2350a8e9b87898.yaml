# ── ГЛАВНЫЙ ВОПРОС КРУГА: ОБЪЯВЛЕННЫЙ ПЕРЕЧЕНЬ ОСЕЙ ───────────────────────────
#
# Вопрос задан не чтением, а ДВУМЯ ИНЪЕКЦИЯМИ в живое дерево с восстановлением.
declared_enumeration:
  coord: gateway/cmd/api-gateway/session_carrier_wiring_test.go:745-823
  question: 'честен ли объявленный перечень, и не стало ли «полнота не судится» тихим ослаблением'
  answer: ЧЕСТЕН. Тихого ослабления НЕТ.
  evidence:
    - id: E1
      what: 'перечень ПОЛОН СЕГОДНЯ — 5 объявленных полей, 5 названных'
      measured: >-
        Состав SessionCarrierConfig выведен разбором go/ast своей программой:
        Posture · Carriers · ProviderURL · WindowOpenedAt · Now — ровно пять,
        встроенных полей нет. axisFields называет ровно эти пять. Расхождения
        между перечнем и объявлением на HEAD НОЛЬ, то есть разрез не оставил
        ни одного поля без оси.
    - id: E2
      what: 'выживший гейт ПАДАЕТ на том, ради чего заведён'
      measured: >-
        ИНЪЕКЦИЯ: из литерала корня (main.go:190) снято `Now: time.Now(),`.
        Гейт КРАСНЕЕТ: «корень не передаёт стражу поле Now (ось «момент окна
        обязан быть фактом») … (main.go:190:43)». Восстановлено; дерево чисто.
    - id: E3
      what: 'остаток РОВНО ТАКОЙ, КАК ОБЪЯВЛЕН — не шире и не уже'
      measured: >-
        ИНЪЕКЦИЯ: в SessionCarrierConfig добавлено шестое поле SixthAxisField,
        перечню не названное. Гейт ЗЕЛЁН — то есть дыра существует и равна
        объявленной. При этом перепись печатает «полей, НАЗВАННЫХ перечнем осей,
        5», а НЕ «полей у типа 6»: число верно для своего предиката, и ложного
        числа под словом «выведено» здесь нет. Восстановлено; дерево чисто.
    - id: E4
      what: 'остаток сказан там, где читатель ГЕЙТА его видит — в трёх местах'
      measured: >-
        (1) шапка самой пробы, прямо над перечнем; (2) t.Logf зелёного прогона
        (виден под -v); (3) тот же t.Logf в КРАСНОМ прогоне — напечатан в выводе
        инъекции E2 без -v, потому что Go печатает журнал упавшей пробы всегда.
        Третье снимает возражение «Logf не виден без -v».
  agreement_with_the_author: >-
    СОГЛАСЕН. Довод «объявленный перечень честен, выведенный-но-неполный — хуже»
    держится, и держится НА ДЕЛЕ, а не на словах: E3 показывает, что печатаемое
    число истинно для своего предиката, тогда как прежняя редакция печатала
    число состава под словом «выведено», умея терять формы грамматики молча
    (C1/C2 круга 11). Ложное число под словом «выведено» есть активное
    утверждение неправды; истинное число под словом «названо» плюс объявленный
    остаток — правда с названной границей. Квалификация одна и вынесена в V1:
    остаток есть долг, а у долга обязан быть адрес, переживающий имя ветки.

