# ── ГЛАВНЫЙ ВОПРОС КРУГА ──────────────────────────────────────────────────
main_question:
  вопрос: >-
    МОЖНО ЛИ ВНОСИТЬ — есть ли то, что делает внесение хуже невнесения?
  ответ: >-
    ВНОСИТЬ МОЖНО. Такого нет.
    Головной коммит закрыл блокер прошлого круга правильным из двух путей и
    ничего исполняемого не сломал: пакет зелёный целиком в обоих режимах,
    механизм цитат ЖИВОЙ (краснеет подстановкой, текстом самой цитаты, и
    отказывает на пустом перечне), параллельность гонок не завела — общего
    изменяемого состояния три пробы не держат, и это установлено разбором, а не
    доверием. Прод-кода головной коммит не касается вовсе.
    Остались ДВА текстовых долга (И-1, И-2), оба в прозе комментариев, оба —
    продолжение уже объявленного круга шестого. Ни один не меняет исполняемого,
    не расширяет наблюдаемую область ни одного гейта и не уходит в конвейер.
    Цена невнесения — тридцать девять коммитов края, отсуженных шестью кругами,
    остаются вне ствола. Цена внесения — две строки комментария, которые
    следующее касание файла обязано поправить. Соразмерности между этими
    величинами нет.
  что_говорю_прямо_вопреки_заявленному: >-
    одно из четырёх заявлений задания неверно. «Обе величины записаны с
    референтами, чтобы читатель не выбирал наугад» — читатель ВЫБИРАЕТ:
    :29-30 того же файла и :309 соседа по-прежнему говорят «девять», а :20-23
    заявляет, что девятки здесь нет. Тело коммита утверждает, что замена
    сделана. Она сделана в одном месте из трёх. Вердикт от этого не меняется —
    меняется то, с каким знанием его читают.
  число_осмотренного: >-
    2339 проверочных файлов модуля прочитаны и разобраны СВОЕЙ программой в
    ДВУХ редакциях предиката — 4678 разборов, из них 26 расхождений выписаны
    поимённо · 5 прогонов пакета `internal/repohygiene` ЦЕЛИКОМ (обычный, `-v`,
    `-short -v`, два `-shuffle=on`) плюс `-count=3` по трём именам предмета ·
    3927 проб и подтестов исполнено в полном прогоне, PASS 3921, SKIP 2,
    FAIL 0 · 2 подстановки в механизм цитат, обе с возвратом дерева и
    перемером дайджеста · 2 ханка головного коммита прочитаны построчно, оба
    файла целиком (216 и 484 строки) · 4 поиска на радиус по всему дереву
    («судит одну строку», «НЕ ВИДНЫ», «девять/девятка», «один узел») — три
    места о предмете найдено, все три названы · 827 файлов пакета опрошены на
    мутацию общей величины, смену каталога и правку окружения — ноль · 2 формы
    попытки `-race` · дайджест снят дважды, оба раза сошёлся с объявленным.

