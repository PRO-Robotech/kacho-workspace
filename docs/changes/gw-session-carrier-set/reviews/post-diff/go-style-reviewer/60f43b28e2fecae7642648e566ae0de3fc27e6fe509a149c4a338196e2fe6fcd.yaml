      прогона от девятки не зависит. Блокировать на седьмом круге то, что на
      шестом объявлено неблокирующим, значило бы судить одно и то же двумя
      мерками.
    требование: >-
      одна строка правки и одна придаточная, в любом ближайшем изменении,
      трогающем файл: :29-30 — «возвращает ВОСЕМЬ файлов»; :309 — назвать при
      девятке её референт («против редакции c530d0a6, до снятия хвостового
      пробела»), либо поставить восьмёрку и сослаться на абзац :20-23.
      Заводить отдельную задачу ради двух строк не нужно; нужно, чтобы
      следующее касание файла их не пропустило — на этот раз касание было и
      пропустило.
