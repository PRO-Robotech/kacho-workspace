      в сообщение отказа `t.Errorf`, то есть читает его оператор красного
      прогона.
    почему_не_блокирует: >-
      IM-4 круга шестого закрыт ТАМ, ГДЕ БЫЛ НАЗВАН (gatescopedeclared_test.go
