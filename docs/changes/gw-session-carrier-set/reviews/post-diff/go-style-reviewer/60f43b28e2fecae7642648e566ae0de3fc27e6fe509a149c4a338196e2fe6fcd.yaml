    class: >-
      формулировка, объявленная неполной в одном месте, оставлена в её
      близнеце — причём в строке, которую ТОТ ЖЕ коммит правил.
    finding: >-
      `why` второй отрицательной цитаты говорит: «оборот "ни одного" разорван
      переносом строки, а предикат СУДИТ ОДНУ СТРОКУ КОММЕНТАРИЯ». Сосед на
      :53-58 этим же коммитом объявил, что так говорить нельзя: «предикат судит
      ОДИН УЗЕЛ… "судит одну строку" было бы верно лишь для половины видов».
      Для самой этой цитаты (`//`-строка) формулировка локально ВЕРНА, поэтому
      находка не о лжи, а о двух местах об одном предмете, из которых одно
      исправлено. Строка :212-213 коммитом ПРАВИЛАСЬ (хвост «…назвать её обязано
      то же изменение» заменён на «…она названа в шапке соседа») — то есть
