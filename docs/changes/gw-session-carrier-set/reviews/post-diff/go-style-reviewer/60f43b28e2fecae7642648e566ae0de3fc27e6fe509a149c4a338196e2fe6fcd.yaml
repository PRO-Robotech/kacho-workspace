      место, где число стоит без своей мерки.
    чем_ещё_отягчено: >-
      тело головного коммита утверждает: «"девять файлов" заменено измеренной
      восьмёркой… обе величины записаны с референтами». В дереве заменено одно
      место из трёх. Сообщение коммита — тоже артефакт, и на голове оно шире
