      больше, — это не род «объявление шире исполняемого», ради которого
      заведён весь механизм.
    требование: >-
      при следующем касании — «предикат судит ОДИН УЗЕЛ комментария (у `//` —
      строку)», либо короче: «оборот, разорванный переводом строки».
