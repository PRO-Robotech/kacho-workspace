      шапке и в строке переписи.
  - id: I3
    class: LOAD-BEARING-ASYMMETRY-WITHOUT-A-PROBE
    coordinates:
      - gateway/internal/config/sessioncarriers.go:118
      - gateway/internal/config/sessioncarriers.go:119
      - gateway/internal/config/session_carriers_test.go:155
    finding: >-
      `raw := strings.TrimSpace(c.SessionCarriers)` (:118) и следом
      `if c.SessionCarriers == ""` (:119) — вопрос задаётся ДВУМ разным
      величинам в соседних строках. Асимметрия несущая и, насколько я проследил,
      намеренно верная: значение `"   "` непусто как строка, поэтому идёт путём
      ОБЪЯВЛЕННОГО и отказывает «нулём элементов», а не выводится молча из
      посадки. Но ни комментария, ни пробы на этот вход нет: ближайший случай
