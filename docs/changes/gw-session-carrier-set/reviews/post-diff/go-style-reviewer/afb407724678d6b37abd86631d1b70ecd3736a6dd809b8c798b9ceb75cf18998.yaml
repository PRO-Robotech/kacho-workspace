      узнаёт о второй открытой двери не раньше, чем кто-нибудь пожалуется.
      Переписи «поле снимка → метрика» в
      `internal/observability/metrics/session_lane_test.go` нет — ни один гейт
      этого не держит, и поле, добавленное без метрики, проходит молча.
    requirement: >-
      Отдать обе клетки коллектором рядом с соседями (desc + `Describe` +
      `Collect`) и завести перепись: каждое поле
      `middleware.SessionLaneSnapshot` имеет метрику — разбором или рефлексией
      по полям, с печатью «полей N · с метрикой M», падением на пустом обходе и
      инъекцией синтетическим полем. Либо снять обещание со страницы установки
      и из докстрок — но тогда на вопрос «пора ли закрывать окно» отвечать
      нечем, а окно заводится ровно затем, чтобы его закрыли.
    rule: >-
      security-hardening §«hard-zero-refusals-visible», §«hard-soft-pass-counted»;
      00-kacho-core «naming-env → TestDeclaredKnobHasAReader» (тот же класс:
      объявлено и не читается); doc-truthfulness §«Утверждение, пережившее свой
      предмет» — здесь предмета ещё и не было
    return_to: автор диффа feat/gateway-session-carrier-set

  - id: C4
    class: SECOND-PLACE-ABOUT-ONE-SUBJECT
    repeat_of: круг 1, C2 — тот же класс (копия в файле, чья шапка объявляет единственность)
    coordinates:
      - gateway/internal/middleware/session_carrier_names.go:69
      - gateway/internal/handler/login_lane_relay.go:227
      - gateway/internal/handler/logout_exits_census_test.go:39
    finding: >-
      Шапка `EndSessionCarriers` утверждает: «Одно место продукта гасит печенье
      одним способом: путь отказа F4d-22 и обработчик выхода зовут ЭТУ функцию»
      (`session_carrier_names.go:69`). Этот дифф заводит ВТОРОЕ место и второй
      способ: `endEveryCarrierOnLogout` собирает гасящее печенье вручную
      (`login_lane_relay.go:227-235`) — `Path`, `MaxAge`, `HttpOnly`, `Secure`,
      `SameSite` выписаны литералами, `EndSessionCarriers` не зовётся.
      Сегодня атрибуты совпадают — измерено сравнением двух мест, — и держится
      это совпадение вниманием автора: его собственный комментарий там так и
      говорит («Атрибуты те же, что у выдачи и у `EndSessionCarriers`»).
      Гейта на параллель нет: `endedNames` (`logout_exits_census_test.go:39`)
      смотрит ТОЛЬКО на `c.MaxAge < 0` и об атрибутах не утверждает ничего.
      Правка `Path` или `SameSite` в одном месте разойдётся с другим молча, и
      наблюдаемое следствие — то самое, против которого заведён весь файл:
      браузер не сопоставит гашение со своим печеньем, и «выйти» оставит
      человека вошедшим.
    requirement: >-
      Завести ОДНУ форму гасящего печенья (например `endedCarrierCookie(name)
      *http.Cookie`), из которой берут и `EndSessionCarriers`, и
      `endEveryCarrierOnLogout`; перепись выходов после этого сравнивает
      атрибуты ПОБАЙТНО, а не только знак `MaxAge`. Шапку
      `session_carrier_names.go:69` привести к тому, что дерево исполняет,
      — сегодня она называет одно место там, где их два.
    rule: >-
      security-hardening §«hard-hide-existence-byte-identical» (тот же приём:
      равенство держится обходом, не намерением); architecture
      §«arch-doc-truthfulness»; code-authoring §«два места об одном предмете»
    return_to: автор диффа feat/gateway-session-carrier-set

