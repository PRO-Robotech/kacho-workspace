  - id: IM-4
    coordinate: internal/repohygiene/gatescopedeclared_test.go:50-53
    finding: >-
      шестая невидимая форма названа как «ОБОРОТ, РАЗОРВАННЫЙ ПЕРЕНОСОМ СТРОКИ
      — предикат судит одну строку комментария». Для `//`-комментария это точно
