# ── КРИТИЧЕСКИЕ ───────────────────────────────────────────────────────────
critical:
  - id: C7
    class: >-
      новый НЕОБЪЯВЛЕННЫЙ красный: коммит заводит пробы, которые роняют живой
      гейт того же пакета, и тело коммита об этом молчит
    coordinates:
      - internal/repohygiene/gatescopewordboundary_test.go:35
      - internal/repohygiene/gatescopewordboundary_test.go:78
      - internal/repohygiene/probeparallelism_test.go:18
    finding: >-
      обе новые пробы — `TestScopeWordBoundary_AWordAgainstANonASCIISeparatorIsFound`
      (:35) и `TestScopeWordBoundary_TheMechanismsOwnHeaderLinesAreRecognised`
      (:78) — не объявляют `t.Parallel()` первым оператором и не внесены в
      ведомость `sequentialProbes` (`probeparallelism_test.go:18`). Живой гейт
      пакета `TestEveryTreeGateProbeDeclaresItsParallelism` требует одного из
      двух и печатает ДВЕ находки с координатами; пакет `internal/repohygiene`
      от этого КРАСНЫЙ.
      Соседний гейт `gatescopedeclared_test.go:150` объявляет `t.Parallel()`
      первым оператором — образец стоит в том самом файле, который коммит
      правит.
    доказано: >-
      ПОДСТАНОВКОЙ ПО РЕВИЗИЯМ, одна команда на чистых отсоединённых копиях:
      `go test ./internal/repohygiene/ -count=1` →
      на aea3935 `ok  github.com/PRO-Robotech/kacho/internal/repohygiene`;
      на 73ef0a4 `FAIL`. Красное воспроизведено ТРИЖДЫ подряд, детерминировано.
      Флаг `-short` его НЕ прячет — `go test ./internal/repohygiene/ -count=1
      -short` на голове тоже FAIL. Перепись самого гейта на голове: «каталогов
      с пробами 2 · файлов проб прочитано 699 · проб осмотрено 2661 ·
      параллельных 2656 · последовательных по ведомости 3; находок 2».
      Обе находки называют ровно те две пробы, которые добавил этот коммит.
    почему_блокирует: >-
      голова ветки оставляет пакет КРАСНЫМ, и тело коммита красного не
      объявляет — норма ban11-three-outcomes и запрет #12 знают объявленное
      TDD-красное, но не молчаливое. Это не придирка к стилю: предмет коммита —
      правдивость механизма, а механизм он оставляет в состоянии, где вердикта
      не получает НИ ОДНА проба пакета, включая его собственные две. Прицельный
      прогон `-run TestScopeWordBoundary` зелёный, и именно поэтому дефект
      пережил коммит: узкая команда его не видит.
      Отдельно отмечаю, что дефект — ровно того же рода, что судится этим
      изменением шестой круг: частное измерение («моя проба зелёная») выдано за
      общее («пакет в порядке»).
    требование: >-
      одно из двух, на выбор автора, оба на одну строку:
      (а) поставить `t.Parallel()` первым оператором в обеих новых пробах —
      обе чисты, общего состояния не держат, читают только литералы и
      `completenessWords`; либо
      (б) внести обе в `sequentialProbes` с названной причиной, чем именно
      ломает их параллельный сосед.
      После правки — прогон `go test ./internal/repohygiene/ -count=1` целиком,
      а не прицельный `-run`.

