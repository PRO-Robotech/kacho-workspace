main_question:
  вопрос: >-
    остаётся ли в дельте утверждение, которое читается шире, чем исполняется?
  ответ: >-
    У САМОГО МЕХАНИЗМА — НЕТ, и это перемерено, а не прочитано. Перечень
    невидимых форм полон на шесть (проверены все шесть, две новые — подстановкой
    S6/S7); объявленно видимая форма действительно видима на всех тринадцати
    разделителях, какие в этом дереве встречаются (23 формы окружения, 0
    расхождений); числа, которые механизм ПЕЧАТАЕТ — «6 формах», «ОДНУ форму
    обещания из СЕМИ», 88, «вне дельты 87» — сняты своей командой на чистых
    копиях и сошлись. Клауза «ГЕЙТ ПОДЧИНЯЕТСЯ СЕБЕ», из-за которой возвращал
    круг 5, этим коммитом не воскрешена.
    ОСТАЛОСЬ ДВА, и оба в прозе, ни одно не расширяет наблюдаемую область:
    «возвращает девять файлов» при исполнении в восемь (IM-3) и «пробу обязано
    пересмотреть то же изменение» без механизма (IM-5).
  число_осмотренного: >-
    2339 проверочных файлов модуля прочитано и разобрано своей программой, с
    тремя редакциями предиката на каждом · 23 формы окружения опрошены прямым
    вызовом · 8 синтетических файлов внесены подстановкой, в две ревизии
    каждый · 3 ревизии прогнаны чистыми копиями (c530d0a6, aea3935, 73ef0a4) ·
    3 подстановки в сам предикат (возврат к байту, «границей считается всё»,
    откат) · 6 ханков головного коммита прочитаны построчно · 5 дословных строк
    шапки сверены с деревом поимённо · 2 вызывающих `containsWord` переписаны
    по всему дереву.
  почему_вердикт_всё_же_возврат: >-
    не из-за этих двух. Возврат ставит C7: голова оставляет пакет красным, и
    красное не объявлено. Предмет круга — починка C6 и то, что она могла
    задеть; она задела соседний гейт того же пакета, и это ровно «то, что могла
    задеть починка», о чём спрашивало задание.

