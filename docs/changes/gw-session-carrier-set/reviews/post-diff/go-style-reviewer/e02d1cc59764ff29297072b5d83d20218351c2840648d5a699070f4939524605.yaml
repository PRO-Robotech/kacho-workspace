      СЕМИ», 88/87). Ошибка живёт в прозе комментария и завышает размер уже
      починенного, а не обещанного. Девятка к тому же инерция МОЕЙ записи круга
      5 — автор взял её на веру, измерив при этом восемь.
    требование: >-
      при следующем касании файла — «возвращает восемь файлов», и одной
