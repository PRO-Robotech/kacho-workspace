# ── ГЛАВНЫЙ ВОПРОС КРУГА ─────────────────────────────────────────────────
main_question:
  вопрос: >-
    остаётся ли в дельте хоть одно утверждение, которое читается шире, чем
    исполняется?
  ответ: >-
    ДА. Одно, на оси обещания механизма, тремя координатами (C6). Осмотрено
    ради этого ответа: 3 оси механизма целиком · 13 форм корня (2 объявленных
    видимыми проверены подстановкой, 11 объявленных невидимыми сверены со своим
    замером круга 4) · 6+1 форм обещания · 2 формы объявления · 3 подстановки в
    распознаватель гашения · 5 собственных строк шапки механизма · 2338 файлов
    модуля обойдено его же переписью · 9 файлов регрессии названы координатами
    · 2 соседние головы сравнены одним и тем же файлом.
  прочее_на_что_смотрел_и_не_нашёл: >-
    C1 (ось корня), C2, C3, C4, C5 — закрыты, каждое перемерено. Прежние
    переобещания сняты, не переписаны. Числа остатка воспроизводятся.

# ── ВЕРДИКТ ────────────────────────────────────────────────────────────────
