critical:
  - id: C6
    class: >-
      объявление шире исполняемого — в том самом абзаце, который сужает
      объявление до измеренного; плюс комментарий, противоречащий коду того же
      коммита (род C4/C5)
    coordinates:
      - internal/repohygiene/gatescopedeclared_test.go:46-48
      - internal/repohygiene/gatescopedeclared_test.go:282-283
      - internal/repohygiene/gatescopedeclared_test.go:243-244
    finding: >-
      1) :46-48 — «ОСЬ ОБЕЩАНИЯ. Видна ОДНА форма: слово из закрытого перечня
      ниже, с разделителем после него. НЕ ВИДНЫ пять: …». Невидимых форм не
      пять, а шесть: слово ИЗ ПЕРЕЧНЯ, стоящее вплотную за многобайтным знаком
      (русская ёлочка «», тире «—»), не опознаётся, хотя разделитель после него
      стоит. Читатель, сверившийся с перечнем и написавший «каждый файл …»,
      получит молчание там, где шапка обещает наблюдение.
      2) :282-283 — «containsWord — вхождение как ОТДЕЛЬНОГО слова: границей
      считается всё, что не буква и не цифра». Это ЛОЖЬ о коде, стоящем на
      :309: `scopeWordByteAt` возвращает true для каждого байта `>= 0x80`, то
      есть считает «буквой» и ёлочку, и тире, и любой небуквенный знак вне
      ASCII. Комментарий и код разошлись в одном коммите — ровно род C4/C5,
      который этот коммит закрывает.
      3) :243-244 — перепись печатает «обещающие в 5 формах вне перечня … ОДНУ
      форму обещания из шести». Число слепых форм занижено тем же способом, и
      это число уходит в отчёт конвейера.
    доказано: >-
      РЕГРЕССИЯ, установленная подстановкой ОДНОГО И ТОГО ЖЕ файла в две
      соседние головы: на c530d0a6 — КРАСНОЕ с координатой, на aea3935 —
      ЗЕЛЁНОЕ. Радиус по дереву: 9 существующих файлов перестали опознаваться
      (координаты в narrowing_audit.ось_обещания.радиус_регрессии_по_дереву).
      Собственные пять строк шапки механизма, которыми он ИЛЛЮСТРИРУЕТ обещание
      полноты (:10, :47, :183, :184, :252), его же предикатом не опознаются ни
      одна.
    почему_блокирует: >-
      единственное назначение головного коммита — сделать обещание механизма
      равным измеренному, и ценность, которую он сам себе назначает (:68-71,
      «частичный предикат, ЧЕСТНО ОБЪЯВЛЕННЫЙ частичным, полезнее полного
      обещания»), держится ровно на точности перечня. Перечень неточен в форме,
      которая в этом дереве является ГОСПОДСТВУЮЩЕЙ. Пятый круг подряд
      возвращает один род; принять его здесь значило бы принять его именно там,
      где он объявлен побеждённым.
    требование: >-
      одно из двух, на выбор автора, и оба маленькие:
      (а) чинить предикат — считать границей слова руну, а не байт: разбирать
      `utf8.DecodeRuneInString` / `DecodeLastRuneInString` и спрашивать
      `unicode.IsLetter || unicode.IsDigit`; тогда и ёлочка, и тире станут
      границей, 9 потерянных файлов вернутся, а комментарий :282-283 станет
      правдой;
      (б) чинить объявление — назвать шестую форму в перечне невидимых
      (:46-48), исправить :243-244 на «в 6 формах» и переписать :282-283 так,
      как код себя ведёт («границей считается ASCII-небуква; знак вне ASCII
      границей НЕ считается»).
      Ветка (а) предпочтительна: она ещё и снимает регрессию против c530d0a6.
      Чего делать НЕЛЬЗЯ — оставить как есть: сегодня перечень невидимых форм
      сам является утверждением, которое читается шире, чем исполняется.

