# ── 1. СУЖЕНИЕ: честное или косметическое — подстановкой, не чтением ───────
narrowing_audit:
  ось_корня:
    заявлено_шапкой: >-
      `gatescopedeclared_test.go:35-44` — «видны ДВЕ формы»: строковый литерал
      прямо в вызове и величина того же файла, которой присвоен литерал (в том
      числе через `filepath.Join`). «НЕ ВИДНЫ одиннадцать», названы списком.
    сверка_списка_с_замером_круга_4: >-
      СОШЁЛСЯ ОДИН В ОДИН, все 11. Параметр помощнику · возврат функции ·
      окружение · соединение строк · поле структуры · перебор списка ·
      псевдоним импорта · `fs.FS` · другой пакет путей · `fmt.Sprintf` ·
      значение таблицы — каждая из измеренных мной в круге 4 названа в шапке.
      Пропущенных нет, подменённых нет.
    видимые_формы_проверены_подстановкой:
      - id: V1
        форма: литерал прямо в вызове (`os.ReadDir("../repohygiene")`)
        исход: >-
          КРАСНОЕ — «ОБЪЯВЛЕНИЕ ШИРЕ ИСПОЛНЯЕМОГО: internal/zprobe/v1_test.go —
          обещает «каждый», обходит os.ReadDir литерал "../repohygiene"».
      - id: V2
        форма: величина файла, которой присвоен `filepath.Join` из литералов
        исход: >-
          КРАСНОЕ — «обходит os.ReadDir величина root = filepath.Join с литерал ".."».
      - id: I1
        форма: тот же литерал, ушедший ПАРАМЕТРОМ помощнику (отрицательный близнец)
        исход: МОЛЧАНИЕ — верно, форма объявлена невидимой.
    ruling: >-
      ЧЕСТНО. Обе объявленные видимыми формы действительно краснеют с
      координатой; объявленная невидимой — молчит. Косметики на этой оси нет.
  ось_обещания:
    заявлено_шапкой: >-
      `gatescopedeclared_test.go:46-48` — «Видна ОДНА форма: слово из закрытого
      перечня ниже, С РАЗДЕЛИТЕЛЕМ ПОСЛЕ НЕГО. НЕ ВИДНЫ пять: «ни один» · «все»
      · «исчерпывающий» · «полон» · англоязычные формулировки».
    названные_пять_сошлись: >-
      ДА, все пять совпали с моим замером круга 4.
    но_найдена_ШЕСТАЯ_слепая_форма: >-
      слово ИЗ САМОГО ПЕРЕЧНЯ, стоящее рядом с любым МНОГОБАЙТНЫМ знаком —
      русскими кавычками-ёлочками «», тире «—», — не опознаётся. Это не пятая и
      не одна из пяти: слово взято из перечня и разделитель после него стоит,
      то есть ровно та форма, которая объявлена ВИДИМОЙ.
    причина_в_коде: >-
      `scopeWordByteAt` (:304-310) возвращает true для КАЖДОГО байта `>= 0x80`
      (строка :309). В UTF-8 таковы все байты кириллицы, ёлочек и тире.
      `containsWord` (:284-300) требует, чтобы НЕ-словесными были ОБЕ границы,
      поэтому «каждый` (открывающая ёлочка вплотную) отвергается.
    доказано_тремя_независимыми_замерами:
      - id: D1
        что: прямой опрос предиката на формах записи
        исход: >-
          «// Осматривается каждый файл пакета.» → опознано «каждый»;
          «// Обещание: «каждый файл пакета осмотрен».» → опознано "";
          «// Здесь судится «КАЖДЫЙ» читатель носителя.» → "";
          «// —каждый файл» → "". Пробел и скобка границей работают, ёлочка и
          тире — нет.
      - id: D2
        что: >-
          опрос предиката о СОБСТВЕННЫХ строках механизма — тех самых, которыми
          шапка ИЛЛЮСТРИРУЕТ, как выглядит обещание полноты
        исход: >-
          стр. 10 («Гейт обещает шапкой «всякое», «каждое», «ни одного вне»») → "";
          стр. 47 («НЕ ВИДНЫ пять: «ни один» · «все» · …») → "";
          стр. 183-184 («шапка обещает полноту («всякое», «каждое», «ни одного вне»)») → "";
          стр. 252 («текст отказа, называющий «каждый»») → "".
          Ни один собственный пример механизма его же предикатом не опознаётся.
      - id: D3
        что: РЕГРЕССИЯ — тот же файл на двух соседних головах
        исход: >-
          файл с выписанным литеральным корнем, без объявления области и с
          обещанием «Требование полосы: «каждый файл пакета осматривается»»:
          на c530d0a6 (голова круга 4) — КРАСНОЕ, назван координатой;
          на aea3935 (голова круга 5) — ЗЕЛЁНОЕ, молчание.
          Форму сломал сам головной коммит: `strings.Contains(low, "каждый ")`
          заменён на `containsWord`, и хвостовой пробел перестал быть
          достаточным.
    радиус_регрессии_по_дереву: >-
      измерен своей программой разбора по всем `_test.go` модуля, сравнением
      СТАРОГО и НОВОГО предикатов: новый шире на 64 файла и УЖЕ на 9. Девять
      потерянных — все по этой причине, координаты:
      deploy/internal_listener_knob_retired_test.go («ни одной») ·
      gateway/deploy/render_geo_test.go («ни одной») ·
      gateway/internal/middleware/role_get_is_scope_filtered_test.go («ни одного») ·
      internal/repohygiene/consoleformatproducer_test.go:52 («каждый») ·
      services/registry/internal/clients/jwks/f1_refetch_test.go («ни одного») ·
      services/storage/internal/domain/disk_type_policy_test.go:140 («полнота») ·
      services/storage/internal/fgaregister/fgaregister_test.go («полный») ·
      services/vpc/internal/observability/metrics/direction_series_render_test.go («ни одного») ·
      tools/revocationwindowgate/implicit_test.go:51 («каждый»).
      У каждого слово стоит вплотную за открывающей ёлочкой.
    ruling: >-
      СУЖЕНИЕ НА ЭТОЙ ОСИ НЕ ЧЕСТНОЕ. Перечень невидимого неполон на одну форму,
      и это не редкая форма: ёлочки — господствующий способ цитирования в
      комментариях этого дерева, включая собственную шапку механизма. См.
      critical/C6.
  ось_объявления:
    заявлено_шапкой: >-
      `:50-52` — «Видна ОДНА форма: обе канонические части СЫРЫМ ТЕКСТОМ в
      файле. НЕ ВИДНА вторая: части, собранные из констант».
    ruling: >-
      ЧЕСТНО. Автор выбрал не чинить `declaresScope`, а назвать его как есть:
      «сырой текст» прямо говорит, что достаточно УПОМИНАНИЯ, в том числе внутри
      текста отказа. Обе формы, которые я в круге 4 нашёл проходящими молча,
      этой формулировкой покрыты. Требование C1 п. 2 не исполнено, но оно и
      предлагало выбор из двух — взята вторая ветка, и взята вслух.

# ── 2. ТРЕТИЙ ИСХОД РАСПОЗНАВАТЕЛЯ ГАШЕНИЯ: щель или объявленная граница ──
third_outcome_probe:
  предмет: >-
    gateway/internal/middleware/session_carrier_readers_gate_test.go:470-530 —
    `cookieValueKind` с тремя значениями; `valueUnknown` не приписывается к
    выдаче и печатается переписью.
  база_на_голове: >-
    «Осмотрено непроверочных файлов Go 1253 · мест сборки гасящего печенья 1
    (gateway/internal/middleware/session_carrier_names.go:101) · значений, не
    разрешённых разбором, 0».
  подстановки:
    - id: E1
      форма: >-
        каноническая — `Value: ""`, `MaxAge: -1`, отдельным пакетом
      исход: >-
        КРАСНОЕ — «мест сборки гасящего печенья 2, ожидалось 1
        (…/session_carrier_names.go:101, gateway/internal/probe1/e1.go:7)».
    - id: E2
      форма: >-
        C3 ДОСЛОВНО — `const blankCarrierValue = ""`, `Value: blankCarrierValue`
      исход: >-
        КРАСНОЕ — «мест … 2 (…, gateway/internal/probe2/e2.go:9)». C3 ЗАКРЫТ:
        именно та запись, которой прежде обходился предикат, теперь краснеет.
    - id: E3
      форма: >-
        три неразрешимые записи разом — константа СОСЕДНЕГО ФАЙЛА пакета,
        пакетная переменная, возврат функции
      исход: >-
        ЗЕЛЁНОЕ, и перепись напечатала «мест сборки гасящего печенья 1 (…) ·
        значений, не разрешённых разбором, 3 (gateway/internal/probe3/e3.go:12,
        …:17, …:7)» — число и ВСЕ ТРИ координаты.
  ответ_на_вопрос_щели: >-
    ПЕЧАТАЕТСЯ С КООРДИНАТОЙ — да, проверено: три места названы поимённо и
    сосчитаны. СПРЯТАТЬ второе место сборки МОЛЧА — нельзя: оно выходит в
    перепись с файлом и строкой. Но третий исход НЕ РОНЯЕТ прогон, и настоящее
    второе место гашения, записанное неразрешимой формой, посадку не остановит.
  ruling: >-
    ЭТО ОБЪЯВЛЕННАЯ ГРАНИЦА, А НЕ ЩЕЛЬ, и не блокирует. Автор нигде не обещал,
    что третий исход краснеет: шапка (:480-484) и тело коммита говорят ровно
    «печатается числом с координатами, а не приписывается к выдаче» — и именно
    это исполняется. Против прежней редакции это строгое улучшение: там та же
    запись молча числилась ВЫДАЧЕЙ, без числа и без координаты. Механизм
    прочтения переписи в конвейере установлен в круге 4 (`make test-unit` гоняет
    `go test -json`, ведомость `.github/scripts/go-test-verdict.py` строку
    печатает) и здесь не перепроверялся.

# ── 3. ЧИСЛА ОСТАТКА: воспроизводятся ли ──────────────────────────────────
remainder_numbers:
  своя_команда: >-
    `go test ./internal/repohygiene/ -run TestGateScopeIsDeclaredWhereTheWalkIsWrittenOut -v -count=1`
    в своей копии на замороженной голове.
  напечатано: >-
    «Прочитано файлов модуля 2338 · обходят дерево 163 · от выписанного корня
    115 · обещают полноту 87 (в дельте 1, вне дельты 86) · в дельте объявили
    область 1. СЛЕПЫЕ ЗОНЫ, числами: корень назван выведенным у 48 обходов …;
    обещание не опознано у 28 файлов с выписанным корнем …»
  сверка:
    "48": ВОСПРОИЗВЕДЕНО точно.
    "28": ВОСПРОИЗВЕДЕНО точно.
    "2338 · 163 · 115": совпали с моим замером круга 4 побайтово.
    "87 вместо 88": >-
      расхождение с кругом 4 ОБЪЯСНЕНО и объяснение подтверждено: перевод
      предиката с хвостового пробела на `containsWord` отнял у множества
      обещающих больше, чем добавил, среди файлов с ВЫПИСАННЫМ корнем.
      Автор честно перенёс число в шапку («вне дельты 86»). Само число верно;
      неверна причина, по которой один файл из него выпал, — см. C6.
  ruling: >-
    ЧИСЛА ВЕРНЫ. Претензия не к ним: они честно названы тем, чем являются —
    «среди них и настоящие выведенные, и выписанные в невидимых формах», и
    прямо сказано, что различить разбором нечем.

