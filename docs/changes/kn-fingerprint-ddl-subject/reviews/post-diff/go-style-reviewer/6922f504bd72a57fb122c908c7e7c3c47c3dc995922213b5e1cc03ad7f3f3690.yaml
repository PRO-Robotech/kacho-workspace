      SINGLE-SQL-SCANNER-CLAIM-IS-FALSE…). Тело `scanSQLSpans` в
      kacho@main/internal/repohygiene/migrationsqltext.go и в
      kaname/internal/migrations/sql_text.go совпадало побайтово на прошлом
      круге; расхождение имён путей — причина, по которой гейт копий,
      судящий одноимённый отслеживаемый путь, эту пару не видит.
      Знания у восьми домов РАЗНЫЕ и уже разошлись: долларовые кавычки и имя в
      кавычках знает только `ddlsubject.go`, `E'…'` — тоже только он, границы
      операторов — тоже.
    why_foundation: >-
      Предикат «где в тексте SQL комментарий, где литерал, где тело в
      долларовых кавычках, где граница оператора» нужен обоим продуктам и
      доменной логики не несёт. Место такого — PRO-Robotech/corelib, ребро
      пином (`architecture.md` §«Переиспользование»; `00-kacho-core.md`
      ban20-copy-ban: «в дереве не лежит: либо ребро пином, либо файла нет»).
      Правка в дереве платформы ИЗ ЭТОЙ ПОЛОСЫ ЗАПРЕЩЕНА — это отдельная задача
      в репозитории фундамента, и в платформу она приходит пином.
    requirement: >-
      Завести задачу в фундаменте на один дом для разбора участков SQL
      (комментарий · литерал обычный и экранированный · тело в долларовых
      кавычках · имя в кавычках · границы операторов), после чего оба ствола и
      `ddlsubject.go` берут его пином, а восемь домов сводятся к одному.

