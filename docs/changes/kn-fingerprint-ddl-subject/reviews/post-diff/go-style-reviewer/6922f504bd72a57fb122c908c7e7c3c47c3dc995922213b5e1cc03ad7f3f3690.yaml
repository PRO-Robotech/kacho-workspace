      Перемер зондом на голове: судимых прибором 545 (543 с головой определения
      или обслуживания + 2 непрозрачных), различных форм 19 (18 + «<динамический
      DDL>»), незнакомых видов 0. Совпадает с числами 361d43f7 дословно.
      Число форм теперь ПЕЧАТАЕТСЯ числом (:126-128), а не считается глазом.

# ── СУЖЕНИЕ СЛОВАРЯ БЕЗВРЕДНЫХ: СУЖУ КАК КОД ───────────────────────────────
narrowing_of_the_harmless_dictionary:
  what_changed: >-
    Перечень слов заменён картой записей `harmlessObject` (ddlsubject.go:643) с
    тремя операторами доказательства; `proven()` (:650) требует все три;
    `harmless()` (:678) отдаёт молчание только доказанному. Записей две:
    `function` и `sequence`.
  the_proof_is_real_not_a_ritual: >-
    Три оператора ДЕЙСТВИТЕЛЬНО прогоняются: TestHarmlessObjectKindsAreProven-
    NotDeclared (plan_changing_forms_test.go:271) зовёт `migrationTouches` по
    каждому и требует молчания от первых двух и КРАСНОГО от третьего. Положи-
    тельный контроль здесь не формальность: без него «молчит» неотличимо от «не
    видит имени», и проба это прямо говорит (:305-311). Обратная инъекция есть
    в обе стороны: незаполненная запись доказанной не считается (:320), запол-
    ненная — считается (:326). Это конструкция, способная упасть.
  but_the_proof_is_not_bound_to_the_kind: >-
    И ровно здесь оно ПРИПИСЫВАЕТСЯ НЕ ГЛЯДЯ. Ни `proven()`, ни проба не
    проверяют, что три оператора вообще ОТНОСЯТСЯ к тому виду, чью безвредность
    они доказывают. Перемер зондом ревью (заведён на время ревью и снят):
    запись `{why:"выдумано", naming:"SELECT 1;", foreign:"SELECT 2;",
    control:"ALTER TABLE kaname.access_bindings ADD COLUMN z text;"}` даёт
    naming=false, foreign=false, control=true — то есть проходит все три
    утверждения пробы целиком. Вторая такая же запись из операторов `COMMENT ON
    TABLE` — тоже проходит.
    Отказ переписи говорит: «Объявить вид безвредным СЛОВОМ нельзя: запись
    словаря безвредных несёт три оператора доказательства, и без них молчания
    не покупает» (ddlsubject_census_test.go:161-165). Буквально это верно —
    одним словом уже не объявить. По существу дверь стала уже, но не закрылась:
    теперь нужно три строки, и они могут быть о чём угодно. См. находку
    HARMLESS-PROOF-IS-NOT-BOUND-TO-ITS-KIND.
  absence_of_subject_is_a_finding_not_silence: >-
    ДА, находка. plan_changing_forms_test.go:354 — `t.Errorf` на `seen[word] == 0`
    с текстом «запись пережила свой предмет и молча покрывает пустоту».
    Перемер на дереве: `function` — 84 оператора, `sequence` — 13. Обе записи
    предмет имеют, объявление не пустое.
    НО предикат этой переписи ШИРЕ того, который покупает молчание: считается
    любое слово-идентификатор в позициях 1..3 головы create/alter/drop, а не
    вид объекта в том месте, где его читает разбор. Перемер: различных слов в
    этих позициях по корпусу — 191, среди них `only` (106), `on` (91), `if`
    (46), `exists` (45), `kaname` (297). Запись, ключом которой стоит любое из
    них, проверку «предмет есть» пройдёт. Сегодня совпадение верно — но по
    совпадению, а не by construction. См. ту же находку.

# ── КРИТИЧЕСКИЕ (блокируют посадку) ────────────────────────────────────────
critical:
  - id: DYNAMIC-DDL-VOCABULARY-DID-NOT-GROW-WITH-THE-PARSER
    tag: '[HEADER LIES ABOUT CODE / SILENT BLIND SPOT]'
    coordinate: internal/repo/kaname/pg/scalegrid/ddlsubject.go:362
    also_at: internal/repo/kaname/pg/scalegrid/fingerprint.go:93-94 (subjectClause)
    claim: >-
      Шапки ЧЕТЫРЁХ сторожимых отчётов утверждают безоговорочно: «…и DDL, чей
      субъект подставляется во время выполнения (EXECUTE format(...)), судятся
      ОСТОРОЖНО — „задевает“, потому что молчание на них было бы слепотой».
      Код этого не делает для целого семейства глаголов. Признак
      непрозрачности парный (`statementExecutesDDL`, :393): нужны И `EXECUTE`,
      И совпадение с `dynamicVerb`. А `dynamicVerb` (:362) знает только
      ALTER/DROP TABLE, CREATE TABLE, CREATE [UNIQUE] INDEX, DROP/ALTER INDEX,
      CREATE/DROP/ALTER [MATERIALIZED] VIEW, CREATE/DROP/ALTER SCHEMA. Он НЕ
      знает ни STATISTICS, ни POLICY, ни TRIGGER, ни RULE, ни FOREIGN TABLE,
      ни ANALYZE/REINDEX/CLUSTER/VACUUM — то есть ровно тех форм, которые ЭТОТ
      ЖЕ ДИФФ завёл в разбор с доводом «менять план — их единственное
      назначение».
    measured: >-
      Проба-зонд в пакете (заведена на время ревью и снята), искомые
      `access_bindings`, `users`:
      определение `CREATE FUNCTION kaname.mk_policy() … EXECUTE format('CREATE
      POLICY p ON %I.%I USING (true)', 'kaname', 'users') …` →
      `buildCorpusIndex` распознал функций с динамическим DDL 0; вызов
      `DO $$ BEGIN PERFORM kaname.mk_policy(); END $$;` → задевает=FALSE.
      ЗАКОННЫЙ БЛИЗНЕЦ, отличающийся РОВНО глаголом в теле: то же определение с
      `ALTER TABLE %I.%I ADD COLUMN z text` → распознано 2 записи, вызов →
      задевает=TRUE.
      Без функции, прямым исполнением в теле миграции:
      `DO $$ BEGIN EXECUTE format('CREATE STATISTICS s (dependencies) ON a,b
      FROM %I.%I', 'kaname','users'); END $$;` → задевает=FALSE;
      близнец с `ALTER TABLE` → TRUE;
      `DO $$ BEGIN EXECUTE format('ANALYZE %I.%I', 'kaname','users'); END $$;`
      → задевает=FALSE.
    why_critical: >-
      Три довода, и каждый — тот же класс, который эта полоса и закрывает.
      (1) Документ лжёт о коде, и не в комментарии, а в ЧЕТЫРЁХ опубликованных
      шапках отчётов: «судятся ОСТОРОЖНО» сказано без оговорок, а измерено
      «молчит». Это ровно критическая находка прошлого круга «шапка лгала о
      себе», только про другое предложение той же шапки.
      (2) Отказ МОЛЧАЛИВЫЙ: потерянный оператор неотличим от его отсутствия, и
      гейт свежести объявит отчёт свежим при сдвинувшемся плане.
      (3) Расхождение СОЗДАНО ЭТИМ ДИФФОМ и предсказано прошлым ревью:
      находка SECOND-VOCABULARY-OF-DDL-VERBS-AS-A-REGEXP предлагала два
      законных исхода — свести словарь глаголов к одному дому ЛИБО назвать
      границу в шапке `dynamicVerb`. Не сделано ни то ни другое: тело
      `dynamicVerb` побайтово то же, что на 2ddf2b64 (`git diff
      2ddf2b64..b05c00be -- ddlsubject.go` этих строк не трогает), а разбор с
      тех пор вырос на четыре семейства глаголов. Расстояние между двумя
      словарями выросло в том же диффе, который их расхождение и удорожил.
    live_instances_today: >-
      0. Словарь динамических функций на голове — 2 записи, одна функция
      (`kaname.rename_cluster_anchor`), и её тело исполняет ALTER TABLE, то
      есть глагол, который `dynamicVerb` знает. Дефект латентный и молчаливый —
      как и три из четырёх критических находок прошлого круга, которые были
      приняты к починке на том же основании.
    requirement: >-
      Перечень глаголов и видов объекта, признаваемых DDL, вывести из ОДНОГО
      места — того же, что питает `parseCreate`/`parseAlter`/`parseDrop`/
      `parseMaintenance`, — и `dynamicVerb` строить поверх него; ЛИБО назвать
      границу явно и в шапке `dynamicVerb`, и в `subjectClause`
      (fingerprint.go:86), потому что сегодня шапка отчёта обещает
      осторожность, которой у кода нет. Пробу — одно-фактной парой на каждое
      семейство, заведённое в разбор этим диффом: тело с `EXECUTE
      format('CREATE POLICY … ON <измеряемая>')` против близнеца с `ALTER
      TABLE <измеряемая>`. Шапки отчётов, если граница останется, обязаны
