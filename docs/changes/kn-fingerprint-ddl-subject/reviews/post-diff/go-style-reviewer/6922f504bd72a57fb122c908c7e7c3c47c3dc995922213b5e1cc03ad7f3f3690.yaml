# ── ОТВЕТЫ НА ВОПРОСЫ ЗАДАНИЯ ──────────────────────────────────────────────
answers:
  q_is_the_parser_more_expensive_than_its_subject_now: >-
    Тот же ответ, что в прошлый раз, на выросшем объёме, и он стал жёстче.
    Как ФОРМА разбор оправдан: две накладки по тексту сняты, третий путь
    («не разбирать текст вовсе, сравнивать снимки схемы») теперь честно
    назван нерассмотренным, а не отвергнутым. Как ОБЪЁМ — второй круг
    полностью оплачен будущим.
    Замер: после первого коммита круга разбор вырос с 931 до 1265 строк
    (+334), пробы — на 1784 вставки; состав отпечатка ЧТЕНИЯ не двинулся
    ни на один файл (7 миграций из 32 и там, и там), и экземпляров в
    корпусе у всех добавленных форм ноль — статистика и политика 0,
    внешняя таблица 0, E-строка 0, единственный ANALYZE над неизмеряемыми
    таблицами. То есть 334 строки разбора и около 1100 строк новых проб
    купили СЕГОДНЯ ноль файлов.
    Это не довод их снимать: две из них заведены по воспроизведённому
    приёмкой молчанию, и цена ошибки несимметрична — пропущенное изменение
    даёт ложное число, лишний файл даёт лишний прогон. Это довод СКАЗАТЬ
    ЭТО В ТОМ ЖЕ МЕСТЕ, где уже сказано про 190 строк первого круга:
    таблица цены в шапке покрывает 931 строку из 1265 и про второй круг
    молчит (находка COST-TABLE-ACCOUNTS-FOR-931-LINES-OF-1265).
    Дороже предмета разбор не стал, но его дорогая часть выросла с трети
    до примерно половины, и половина эта оправдана формами, а не корпусом.
  q_is_the_proof_a_ritual: >-
    Ритуалом не стало: три оператора действительно исполняются, у пары есть
    положительный контроль, и инъекция ходит в обе стороны. Но ПРИПИСАТЬ ИХ
    НЕ ГЛЯДЯ можно: ничто не связывает операторы с видом, чью безвредность они
    покупают, — запись из `SELECT 1;` / `SELECT 2;` / `ALTER TABLE
    <измеряемая> ADD COLUMN` проходит пробу целиком (перемерено зондом).
    Вторая половина замка — «предмет в каталоге есть» — держится предикатом
    шире того, что покупает молчание (любое слово в позициях 1..3; таких слов
    в корпусе 191). Дверь стала уже, но не закрылась.
  q_absence_of_subject_is_a_finding: >-
    Да, находка, а не молчание: `t.Errorf` на нулевом счёте
    (plan_changing_forms_test.go:354). Перемерено: function — 84 оператора,
    sequence — 13. Оговорка — в предыдущем ответе: счёт ведётся не тем
    предикатом, каким читает вид разбор.
  q_six_findings_named_out_of_scope: >-
    Пять из шести — действительно ВНЕ диффа, перемерено по `git diff --numstat`:
    ни один из файлов, несущих независимые проходы по тексту SQL, диффом не
    тронут (internal/migrations/sql_text.go, internal/check/catalog_seed_parity.go,
    internal/repo/kaname/pg/pgmaperr_role_name_form_test.go,
    internal/repo/kaname/pg/relverdict/typedict_gate_test.go,
    internal/authzmap/group_member_kinds_agree_test.go), как не тронуты
    freshness_test.go и runhint_executable_test.go. Их счёт при этом занижен:
    по имени механизма домов восемь, а не четыре (шесть в kaname, два в kacho).
    ШЕСТАЯ — «предикат читает раздел отката» — ВНЕ диффа НЕ находится: её
    координата, `bodies[name] = string(body)` (fingerprint.go:838), — строка,
    которую этот дифф добавляет. Поведение от базы не изменилось, но решение
    переписано новой строкой и в шапке не названо. Отложенным из диффа это
    назвать нельзя, вне диффа — тоже.
  q_traces_of_the_unbuilt_state: >-
    Следов нет: пакет и все восемь его файлов проб собираются (`go vet` — код 0,
    пустой вывод), осиротевших ссылок на пять снятых символов прежнего
    предиката — 0.
    Но ПРИЧИНА того прогона в дереве не названа ни в коде, ни в записке: поиск
    по `GOCACHE`, `GOFLAGS`, «кэш сборки» в `*.go`, `*.md` и Makefile дерева
    полосы даёт только чужие пробы (internal/release/pack_test.go,
    tools/standalonetargets/gate_test.go) и три упоминания в чужих приёмках, ни
    одно из которых не о двух инструментах, деливших кэш. Признание живёт
    только в возврате. Это не находка по коду этого диффа и вердикта не меняет,
    но и класса не закрывает: следующий прогон двух инструментов на общем кэше
    повторится без предупреждения.

