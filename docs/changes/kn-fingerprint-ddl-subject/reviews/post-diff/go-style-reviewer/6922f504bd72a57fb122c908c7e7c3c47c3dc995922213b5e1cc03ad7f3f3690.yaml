previous_criticals_remeasured:
  - id: FOREIGN-TABLE-IS-SILENT-NOT-CAUTIOUS
    status: снято по существу
    measured: >-
      Обе половины. (1) Разбор: `parseAlter` (ddlsubject.go:874) и `parseDrop`
      (:945) зовут `foreignTableName`, как это уже делал `parseCreate` (:747);
      комментарий на :747-752 приведён к коду и говорит то, что код делает.
      Запись `"foreign"` из словаря безвредных снята целиком.
      (2) Молчание обёртки: `CREATE FOREIGN DATA WRAPPER` прежде давал пустой
      разбор и тихо обходил собственное правило осторожности; теперь
      `foreignKindName` (:790) возвращает «foreign data», исход осторожный.
      Перемер пробой-зондом ревью: ALTER/DROP FOREIGN TABLE над измеряемой —
      true, над чужой — false, `FOREIGN DATA WRAPPER` и `SERVER` — true с
      непустым `unknownObject`. Проба утверждает ТЕКСТ находки, а не только
      красное (statement_boundaries_test.go:176-179).

  - id: E-STRING-BREAKS-STATEMENT-BOUNDARY
    status: снято по существу
    measured: >-
      Две формы литерала различены: `skipSingleQuoted` (ddlsubject.go:1216)
      получил параметр `escaped`, приставку устанавливает
      `escapedStringPrefix` (:1242), и она считается приставкой только
      ОТДЕЛЬНЫМ словом (`some_e'x'` — хвост имени). Оба вызывающих —
      `sqlTokens` (:986) и `sqlStatements` (:1152) — зовут её.
      ХВОСТ УВИДЕН ПРЕДИКАТОМ, а не просто выделен, и это главное:
      statement_boundaries_test.go:114-117 после сверки числа операторов
      требует `migrationTouches(src, measured, scopeReadPlan, corpusIndex{})`
      по каждому из девяти случаев; хвост у всех девяти один и тот же
      (`ALTER TABLE kaname.access_bindings ADD COLUMN` плюс `CREATE INDEX` на
      ней), отличие пары — РОВНО форма литерала. Законный близнец к набору —
      тот же хвост над неизмеряемой таблицей — молчит (:122-128).

  - id: RESTAMP-NOTE-LIES-ABOUT-THE-WRITE-REPORT
    status: снято по существу
    measured: >-
      Дельта ИЗМЕРЕНА, а не передана. `restampHeaderWithDelta`
      (restamp_test.go:93) строит `reportDelta` из ДВУХ источников, оба свои:
      `recorded` — разбор пофайлового перечня САМОГО отчёта, `fp.Identities` —
      обход дерева прибором. Ручка `KACHO_SCALEGRID_RESTAMP` теперь несёт
      только довод по ПРИШЕДШИМ файлам, то есть ровно то, чего прибор знать не
      может. В дереве: `grep -h 'пересчёт шапки' REPORT-*.txt` даёт у
      REPORT-R7-2-write-delete «выбыло 0 (—) · пришло 1 (…)», у трёх остальных
      «выбыло 3 (…поимённо…) · пришло 1 (…)» — четыре шапки, три разные строки.
      Проба держит именно расхождение, а не форму строки:
      TestRestampNotePrintsThisReportsOwnDelta (restamp_test.go:429) прогоняет
      два синтетических отчёта с ОДНИМ доводом оператора и разной дельтой и
      падает, если строки совпали.

  - id: CLOSED-LIST-SWALLOWS-PLAN-AFFECTING-FORMS
    status: снято по существу, механизм заменён
    measured: >-
      `statistics` и `policy` больше не в разрешающем перечне: у обоих свои
      ветки разбора — `CREATE STATISTICS … FROM <таблица>` (ddlsubject.go:719),
