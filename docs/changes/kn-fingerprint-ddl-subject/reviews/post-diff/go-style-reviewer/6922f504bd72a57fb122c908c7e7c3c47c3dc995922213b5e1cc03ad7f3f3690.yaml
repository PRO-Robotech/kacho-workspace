      Сам перечень сужен с 24 объявленных слов до 2 доказанных (`function`,
      `sequence`) — см. раздел narrowing_of_the_harmless_dictionary.

  - id: CORPUS-CENSUS-NUMBER-DOES-NOT-REPRODUCE
    status: снято, объяснение проверено
    measured: >-
      Проверено ОБЪЯСНЕНИЕ, а не число. Объяснение (ddlsubject_census_test.go:
