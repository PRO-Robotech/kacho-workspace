      стоять не должны; для каждого либо разбор позиции таблицы (у STATISTICS
      это `FROM <таблица>`, у POLICY — `ON <таблица>`), либо вывод в
      `unknownObject` ради осторожного исхода. Пробу — одно-фактной парой на
