      (`grep -rniE 'CREATE (STATISTICS|POLICY)' internal/migrations/*.sql` = 0),
      дефект латентный и молчаливый.

  - id: E-STRING-BREAKS-STATEMENT-BOUNDARY
    tag: '[STATEMENT BOUNDARY]'
    coordinate: internal/repo/kaname/pg/scalegrid/ddlsubject.go:900
    claim: >-
      `skipSingleQuoted` знает только удвоение кавычки (`''`) и не знает
      escape-строк `E'…'`, где обратный слэш экранирует кавычку ВСЕГДА,
      независимо от standard_conforming_strings. На такой строке разрез
      операторов съезжает, и ВЕСЬ хвост текста после неё теряется.
    measured: >-
      Проба-зонд в пакете (заведена на время ревью и снята). Вход:
      `COMMENT ON TABLE kaname.limits IS E'it\'s here'; ALTER TABLE
      kaname.access_bindings ADD COLUMN e text;`
      `sqlStatements` возвращает 1 оператор вместо 2, и `migrationTouches` по
      измеряемой `kaname.access_bindings` даёт false — правка измеряемой таблицы
      ПОТЕРЯНА. Законный близнец без `E` разбирается верно.
      Отдельно перемерено, что имя в кавычках границу держит:
      `ALTER TABLE kaname."weird;name" ADD COLUMN q text; ALTER TABLE
      kaname.access_bindings ADD COLUMN w text;` даёт 2 оператора, второй виден
      (read=true).
    why_critical: >-
      Это тот самый класс, ради которого заведён `sqlStatements`, и шапки всех
      четырёх отчётов теперь утверждают «границы операторов тоже разбираются —
      точка с запятой внутри литерала… оператора не кончает» (fingerprint.go:87).
      Отказ молчаливый: потерянный хвост не отличим от отсутствия правок, и гейт
      свежести объявит отчёт свежим при сдвинувшемся предмете.
    live_instances_today: >-
      `grep -rnoE "[^A-Za-z0-9_]E'" internal/migrations/*.sql | wc -l` = 0 —
      escape-строк в корпусе сегодня нет; восемь совпадений на `\'` в каталоге
      приходятся на два .go-файла, а не на SQL. Дефект латентный.
    requirement: >-
      Разобрать `E'…'` (обратный слэш экранирует следующий символ) ЛИБО отказать
      на ней явно — вернуть осторожный исход на весь файл, а не терять хвост
      молча. Пробу — парой «E-строка с экранированной кавычкой» против «обычная
      строка с удвоенной кавычкой»; вторая половина в диффе уже есть.

