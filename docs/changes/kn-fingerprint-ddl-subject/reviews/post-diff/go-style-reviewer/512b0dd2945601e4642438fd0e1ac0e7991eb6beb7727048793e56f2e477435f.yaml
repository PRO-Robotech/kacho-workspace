# ── ОТВЕТЫ НА ВОПРОСЫ ЗАДАНИЯ ──────────────────────────────────────────────
answers:
  q1_is_the_parser_more_expensive_than_its_subject: >-
    Как ФОРМА — нет; как ОБЪЁМ — частично да, и этот кусок называется числом.
    Замер: ddlsubject.go 931 строка (692 не-пустых не-комментарных, из них 175 —
    одна закрывающая скобка; 194 строки комментария; 27 функций), при этом из
    fingerprint.go снято 132 строки — прежний предикат и ДВЕ наросшие на него
    накладки (#1833 временный объект, #69 триггер). Снятие накладок — довод в
    пользу разбора: обе чинили исход там, где имя стояло не на месте субъекта,
    и обе были выражениями по тексту поверх выражения по тексту.
    Оценку альтернатив подтверждаю в главном и дополняю. Подтверждаю: в go.mod
    разборщика SQL нет (перемерено), обёртка над настоящим разборщиком сервера
    тянет межъязыковой вызов, а чистый порт грамматики — величина порядка
    сотни тысяч строк. Дополняю двумя вещами, которых оценка не взвесила.
    Первое: сравнивались только «разбирать текст своим» и «разбирать текст
    чужим», и ни разу — «не разбирать текст вовсе». Вопрос «изменилась ли
    СТРУКТУРА измеряемых таблиц» отвечается по РЕЗУЛЬТИРУЮЩЕЙ схеме, а не по
    тексту миграций; снимок схемы в дереве дал бы сравнение на несколько
    десятков строк. Он не бесплатен — снимка сегодня нет (`schema/` содержит
    один JSON-схемник манифеста модуля), и его пришлось бы заводить и
    сторожить, — но он не был назван и отвергнут, а просто не рассматривался.
    Второе: выгода распределена неравномерно, и это измерено. Ответ меняют
    разрез операторов, разбор головы и сбор раздела ссылок — 9 миграций стало
    7 на чистом дереве. Замыкание по динамическому DDL меняет ответ на +1 файл
    (7 против 6 без словарей). Словарь «индекс -> таблица» (218 записей,
    ~45 строк кода) и ветка схемы меняют ответ на 0 файлов сегодня. То есть
    примерно 190 строк (ddlsubject.go:206-400 — buildCorpusIndex,
    indexOwnersIn, dynamicVerb, definesFunction, namingHeads,
    statementExecutesDDL, bodyExecutesDDL, namesAnyOf, functionBodiesIn,
    dollarQuotedBodyOf) покупают один файл и ноль файлов, и ровно эта часть
    несёт два из трёх мест, где логика «что есть субъект» размазана
    (`dynamicVerb`, `namingHeads`). Вывод: разбор оправдан, но его дорогая
    треть оправдана БУДУЩИМИ формами, а не сегодняшним предметом, — и так это
    и надо записать, а не как «закрыты три слепые зоны».
  q2_readability: >-
    Какая форма разбирается — видно: три функции по глаголу, `switch` по виду
    объекта, `default` с закрытым разрешающим перечнем. Что будет при
    незнакомой — видно и измерено: `unknownObject` называет себя, исход
    осторожный. Логика «что есть субъект» РАЗМАЗАНА по пяти местам, и это четыре
    отдельные находки: закрытый перечень `objectsWithoutTableSubject`
    противоречит ветке `parseCreate` на слове `foreign` (критическая);
    `dynamicVerb` — второй словарь глаголов выражением по тексту; `namingHeads`
    описан шапкой неверно; перечень шумных слов выписан четырежды, причём
    перепись форм в пробе читает вид объекта СВОИМ кодом, а не кодом разбора.
  q3_caution_not_a_stub: >-
    В коде так, как объявлено: неизвестное имя индекса, незнакомый вид объекта и
    динамический DDL дают true. Заглушкой это не стало — 7 файлов из 32 под
    отпечатком чтения, 2 миграции под отпечатком записи. Но осторожность не
    сплошная: ALTER/DROP FOREIGN TABLE над измеряемой таблицей отсеивается
    МОЛЧА, и ни один гейт этого не видит (критическая находка).
  q4_statement_boundaries: >-
    В коде, а не в комментарии: `--`, вложенный `/* */`, литерал, имя в кавычках,
    тело в долларовых кавычках. Пробы есть на `;` внутри литерала и внутри тела
    функции; на `;` внутри имени в кавычках пробы нет, хотя шапка это
    утверждает. Одна законная форма границу ломает — escape-строка `E'…'`:
    разрез съезжает и теряется ВЕСЬ хвост текста (критическая находка,
    экземпляров в корпусе сегодня 0).
  q5_dynamic_case: >-
    Довод верен по существу и разведён в коде: `definesFunction` отделяет
    определение от исполнения, и пара «определитель / исполнитель» проверена на
    настоящих файлах дерева, а не на синтетике. Но слово «корпус» шире
    измеренного: замыкание идёт по КАТАЛОГУ МИГРАЦИЙ, и функция, определённая
    вне него, осторожного исхода не даст. Словарь на голове — 2 записи, одна
    функция; пары «функция зовёт функцию» в дереве нет, значит транзитивность
    замыкания держится только чтением кода. Плюс: у любого оператора с головой
    create/alter/drop проверка «зовёт ли он такую функцию» пропускается целиком
    (`namingHeads`), и шапка этого не говорит.
  q6_russian_comments: >-
    Нарушений 0. Метод счёта и пять законных латинских строк — в разделе
    approved.

