  - id: FOREIGN-TABLE-IS-SILENT-NOT-CAUTIOUS
    tag: '[BLIND SPOT]'
    coordinate: internal/repo/kaname/pg/scalegrid/ddlsubject.go:477
    claim: >-
      В ЗАКРЫТОМ перечне `objectsWithoutTableSubject` стоит `"foreign": true` с
      доводом «FOREIGN DATA WRAPPER / FOREIGN TABLE — своя таблица, не
      измеряемая». Из-за этой записи `ALTER FOREIGN TABLE <измеряемая>` и
      `DROP FOREIGN TABLE <измеряемая>` отсеиваются МОЛЧА: `parseAlter`
      (ddlsubject.go:568) и `parseDrop` (:616) уходят в `default`, вид объекта в
      перечне найден, `unknownObject` остаётся пустым, субъекта нет. Это
      слепота, а не осторожность, — прямо против объявленного в шапке отчёта
      правила «незнакомый вид объекта судится ОСТОРОЖНО».
    measured: >-
      Проба-зонд в пакете (заведена на время ревью и снята):
      `ALTER FOREIGN TABLE kaname.access_bindings ADD COLUMN note text;` даёт
      read=false write=false subjects=[] unknown="" opaque=false;
      `DROP FOREIGN TABLE kaname.access_bindings;` — то же;
      контроль `ALTER TABLE kaname.access_bindings ADD COLUMN note text;` даёт
      read=true write=true subjects=[{kaname access_bindings}].
    contradicts_its_own_diff: >-
      `parseCreate` (ddlsubject.go:525) ту же обёртку берёт: `CREATE FOREIGN TABLE
      <имя>` кладётся в `subjects`, и собственная проба диффа это утверждает —
      fingerprint_ddl_subject_test.go:260 «внешняя таблица с именем ИЗМЕРЯЕМОЙ
      отсеяна: вид обёртки не отменяет субъекта» (перемер: read=true). То есть
      комментарий на :477 противоречит и коду на :525, и пробе на :260.
    no_gate_catches_it: >-
      Перепись форм (ddlsubject_census_test.go:88) такой оператор в `unknown` не
      кладёт — вид объекта в разрешающем перечне есть, — а заносит его в
      `byObject` как форму «alter foreign» и остаётся зелёной. Ни одна проверка
      дерева этого не увидит.
    requirement: >-
      Снять `"foreign"` из `objectsWithoutTableSubject` (тогда ALTER/DROP FOREIGN
      TABLE даст `unknownObject` и осторожный исход) ЛИБО разобрать
      `FOREIGN TABLE` в `parseAlter` и `parseDrop` так же, как это уже сделано в
      `parseCreate`. В пробу — одно-фактная пара `ALTER FOREIGN TABLE
      <измеряемая>` против `ALTER FOREIGN TABLE <чужая>`, иначе починка снова
      будет держаться только чтением.
    live_instances_today: >-
      В корпусе миграций внешних таблиц нет: `grep -rniE 'foreign +table'
      internal/migrations/*.sql` = 0. Дефект латентный, но молчаливый: первая же
      такая миграция уйдёт из-под отпечатка без следа.

  - id: CLOSED-LIST-SWALLOWS-PLAN-AFFECTING-FORMS
    tag: '[BLIND SPOT]'
    coordinate: internal/repo/kaname/pg/scalegrid/ddlsubject.go:470
    claim: >-
      Тот же дефект, что у `"foreign"`, но с экземпляром, у которого есть
