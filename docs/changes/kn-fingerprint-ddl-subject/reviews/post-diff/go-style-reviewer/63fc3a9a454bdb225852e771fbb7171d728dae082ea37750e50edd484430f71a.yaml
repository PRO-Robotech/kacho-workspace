main_question_of_this_run:
  question: 'чинит ли 4e327936 названный род ПО СУЩЕСТВУ, а не по форме'
  answer: 'ДА, ПО СУЩЕСТВУ — и это измерено прогоном с законным близнецом, а не прочитано в диффе.'
  which_of_the_two_lawful_outcomes_was_taken: >-
    Первый и более сильный: второй словарь СНЯТ ЦЕЛИКОМ. Идентификатора
    `dynamicVerb` в дереве на голове нет (`grep -n 'dynamicVerb'` по
    `ddlsubject.go` и `fingerprint.go` даёт пусто). Содержимое исполняемого
    литерала разбирается `ddlStatementOf` — той же функцией, что разбирает
    оператор в файле (`ddlsubject.go:463-478`), то есть расходиться двум спискам
    больше нечем by construction.
  measured_by_experiment: >-
    ПЕРЕМЕРЕНО СОБСТВЕННЫМ ЗОНДОМ НА СТАБИЛЬНОМ API (`migrationTouches`), один и
    тот же зонд прогнан в ДВУХ рабочих копиях: на пред-фиксной b05c00be и на
    голове 39a1f19a. Форма входа — та же, что у находки прошлого круга:
    `DO $$ BEGIN EXECUTE format('<оператор>', 'kaname', 'users'); END $$;`,
    измеряемая таблица `users`. Исходы (чтение/запись):

      форма                     b05c00be          39a1f19a
      ALTER TABLE (близнец)     true / true       true / true
      CREATE POLICY             FALSE / FALSE     true / true
      CREATE STATISTICS         FALSE / FALSE     true / true
      ANALYZE                   FALSE / FALSE     true / true
      REINDEX                   FALSE / FALSE     true / true
      CREATE TRIGGER            FALSE / FALSE     false / true
      CREATE RULE               FALSE / FALSE     true / true
      ALTER FOREIGN TABLE       FALSE / FALSE     true / true

    Семь из восьми форм на пред-фиксном коде МОЛЧАЛИ при зелёном законном
    близнеце — слепота прошлого круга воспроизведена. На голове молчит ноль.
    Зонд снят, дерево чисто, дайджест перемерен и совпал.
  a_second_property_was_gained_not_only_the_first: >-
    Сверх снятия слепоты починка СУЗИЛА прежнюю грубость, и это тоже измерено
    тем же зондом: выписанный исполняемый оператор над ЧУЖОЙ таблицей
    (`EXECUTE 'ALTER TABLE kaname.limits …'`) на b05c00be давал `true` (краснел
    зря), на голове даёт `false`; над ИЗМЕРЯЕМОЙ — `true` в обоих. Одно-фактная
    пара сошлась в обе стороны.
  scope_separation_survived_the_unification: >-
    `CREATE TRIGGER` в динамическом виде даёт чтение=false, запись=true — то есть
    разведение областей приборов сохранено и в динамике, а не потеряно ради
    единого словаря. Прежняя непрозрачность красила оператор целиком и обоим.
  the_four_report_headers_now_tell_the_truth: >-
    Предмет второй половины прошлого требования. Шапки пересчитаны тем же заходом
    и сегодня описывают то, что код делает: «исполняемый SQL (EXECUTE)
    разбирается ТЕМ ЖЕ разбором, второго перечня глаголов нет — выписанный
    оператор судится ТОЧНО по своему субъекту, а подстановка format(%I) делает
    имя подстановочным… В ТОМ ПОЛЕ, где стоит». Универсальное утверждение той же
    шапки «неизвестное имя и незнакомый вид объекта судятся ОСТОРОЖНО» проверено
    ОТДЕЛЬНЫМ зондом в динамическом виде: `EXECUTE format('CREATE QUANTUM STORAGE
    %I.%I …')` → чтение=true (осторожно); тот же незнакомый вид над чужой
    таблицей → true. Шапка не лжёт.

