author_deviations:
  - id: a-mandatory-update-also-sets-live
    claim: 'мандатный UPDATE дополнен установкой признака, иначе нарушал парное ограничение'
    verdict: ВЫНУЖДЕННОЕ И ВЕРНОЕ
    reasoning: >-
      token_families_live_pair_ck держит `live = (revoked_at IS NULL)` и
      проверяется в конце оператора. Оператор, тронувший одну половину пары, а
      вторую нет, отвергается базой — иного исхода не существует. Обе половины
      идут одним оператором, и это ровно тот случай, когда решение неотделимо
      от своего следствия. Одна точность: пара — это одно состояние, записанное
      дважды, и вторая запись живёт исключительно ради попадания в ключ; так и
      объяснено в комментарии колонки.

  - id: b-set-active-false-removed-predicate-changed
    claim: '`SET active=false` снят из четырёх операторов, предикат отбора заменён с признака активности на отметку деактивации'
    verdict: ВЫНУЖДЕННОЕ И ВЕРНОЕ
    reasoning: >-
      `SET active` невозможен физически — 428C9, измерено на обоих видах
      оператора (UPDATE: «column "active" can only be updated to DEFAULT»;
      INSERT: «cannot insert a non-DEFAULT value»). Замена предиката тоже
      вынуждена и по другой причине: каскад снимает family_live ДО того, как
      дописывающий оператор дойдёт до строки, поэтому `AND active` не нашёл бы
      НИ ОДНОЙ строки, и причина не записалась бы вовсе. `deactivated_at IS
      NULL` — единственный предикат, который здесь выражает «ещё не помечена»,
      и он же даёт идемпотентность: причину первого отзыва второй не
      переписывает. Перемерено: в прогоне гонки этот оператор записал причину
      выигравшей строке.
    but: >-
      Верность этого отступления не отменяет того, что дописывающие операторы
      вообще не нужны — см. important/dead-without-recorded-ground.

  - id: c-sentinel-removed
    claim: 'снят сигнальный тип domain.ErrTokenFamilyRevoked — 2 производителя, 0 читателей'
    verdict: ВЕРНОЕ ПО СЧЁТУ, НО ЗАКРЫВАЕТ РАЗЛИЧЕНИЕ, КОТОРОЕ ПОНАДОБИТСЯ
    reasoning: >-
      Счёт подтверждён: `grep -rn 'ErrTokenFamilyRevoked'` по дереву = 1
      попадание, и то комментарий-надгробие. Читателей четырёх исходов сегодня
      нет ни у одного — перепись читателей всех сентинелов церемонии даёт
      только internal/domain (объявления) и oauth_ceremony_race_integration_test.go.
      Прод-вызывающих у ExchangeAuthorizationCode/RotateRefreshToken в дереве
      НОЛЬ: церемония ещё не подключена к краю. Снятие объявления, которого
      никто не возвращает, — верно; ветвь, не получающая входа, — мёртвая, и
      снятие её верно.
    what_is_lost: >-
      Потеряно РАЗЛИЧЕНИЕ, а не тип. Четвёртый исход был не «ещё одной ветвью»:
      он отделял «семейство снято по неинцидентной причине» (выход, окончание
      сессии, отзыв согласия, снятие клиента — четыре из шести значений
      закрытого словаря) от «обнаружено похищение». После снятия все шесть
      причин наблюдаются одинаково — как повтор. Различение понадобится в тот
      день, когда край получит обработчик: «войдите заново» и «ваш доступ
      отозван, потому что обнаружено повторное предъявление» — разные ответы
      человеку и разные записи в журнале безопасности.
    requirement: >-
      Снятие типа оставить (объявление без читателя — долг). Различение вернуть
      не типом, а ЧТЕНИЕМ — `revoked_reason` семейства тем же запросом разбора,
      см. important/logout-now-reads-as-theft. Сегодня это не блокирует ничего,
      потому что края нет; пометить предметом, чтобы не всплыло при подключении.

# ── ФАЗА ВНЕСЕНИЯ ──────────────────────────────────────────────────────────
phasing:
  author_claim: 'расширение и сужение внесены В ОДНОМ файле — файл не применён, предмет рождается в конечной форме'
  verdict: СОГЛАСЕН, скрытого перехода нет
  predicate: >-
    `git cat-file -e origin/main:internal/migrations/20260920175117_authorization_code_is_our_record.sql`
    → «exists on disk, but not in 'origin/main'», код выхода 128. Файла на
    стволе нет, значит применённой миграции нет, значит ban #5 не наступил.
  why_no_hidden_expand_contract: >-
    Обратного заполнения нет и быть не может: все три таблицы ЗАВОДЯТСЯ этой же
    миграцией. Затронутых строк ноль не по заявлению автора, а по устройству —
    таблицы до этого файла не существуют, и перепись это подтверждает: ни одна
    другая миграция дерева три имени не упоминает
    (`grep -rn … internal/migrations/*.sql` минус сам файл = 0 попаданий).
    Expand→migrate→contract нужен там, где есть строки и читатели старой формы;
    здесь нет ни тех, ни других.
  caveat: >-
    Законность держится на одном предикате — «на стволе файла нет», — и предикат
    этот СТАРЕЕТ. Если файл сядет в ствол раньше исправляющего круга, правка на
    месте перестанет быть законной, и требования этой записи придётся вносить
    НОВОЙ миграцией. Перемерять перед каждым следующим кругом.

