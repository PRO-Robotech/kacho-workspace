critical:
  - id: deadlock-victim-is-the-control
    title: >-
      Каскад по обновлению завёл цикл порядка замков, и жертвой становится САМ
      ОТЗЫВ: семейство остаётся ЖИВЫМ, а отзыв по обнаруженному повтору не
      исполняется.
    coordinate:
      - 'internal/migrations/20260920175117_authorization_code_is_our_record.sql:173-175 (authorization_codes_family_fk … ON UPDATE CASCADE)'
      - 'internal/migrations/20260920175117_authorization_code_is_our_record.sql:234-236 (refresh_tokens_family_fk … ON UPDATE CASCADE)'
      - 'internal/repo/kaname/pg/oauth_ceremony_repo.go:416-419 (RevokeFamily, оператор отметки)'
      - 'internal/repo/kaname/pg/oauth_ceremony_repo.go:497-501 (revokeFamiliesOfSessionsTx, тот же оператор)'
    mechanism: >-
      Выдача берёт замки в порядке «ребёнок, затем родитель»: условный UPDATE
      предъявленной строки держит её строчный замок, а следующая за ним вставка
      преемника берёт на строке семейства FOR KEY SHARE. Отзыв берёт их в
      ОБРАТНОМ порядке: UPDATE семейства берёт FOR UPDATE (ключевое обновление —
      ровно то, ради чего заведена колонка live), после чего ON UPDATE CASCADE
      идёт за строчными замками ВСЕХ детей. Цикл ожидания замыкается, Postgres
      снимает одну сторону кодом 40P01.
    measured: >-
      Три прогона на ротации (отзыв стартует через 0.1 с после UPDATE
      предъявленной строки, вставка преемника через 0.3 с): жертвой 3 из 3 стал
      ОТЗЫВ, `SELECT coalesce(revoked_reason,'LIVE')` = LIVE во всех трёх.
      Отдельно прогнан обмен КОДА против отзыва, состоящего из ОДНОГО оператора
      (без дописывающих причину операторов вовсе): жертвой снова 3 из 3 стал
      отзыв, семейство LIVE. Значит цикл даёт САМ КАСКАД, а не дописывание
      причины — снятие операторов 2-3 его не лечит.
    control: >-
      Тот же сценарий на ПРЕЖНЕЙ форме: взаимной блокировки нет ни разу, отзыв
      проходит (revoked_reason='refresh-replay'). Но там же виден дефект, ради
      которого полоса и затеяна: преемник r1 остаётся active=true при отозванном
      семействе. То есть прежняя форма теряла ОДНУ строку, новая — ВЕСЬ отзыв.
    why_it_is_worse_than_it_looks: >-
      Проигравшая сторона — не запрос арендатора, а контроль безопасности. Отзыв
      вызывается из refuseCode/refuseRefresh как следствие, НЕОТДЕЛИМОЕ от
      решения «это повтор» (так и написано в шапке функции), и повтора у него
      нет: ошибка уезжает вызывающему через `%w`, признак повторяемости
      сохраняется (pgmaperr.go:198 класс SerializationConflict держит 40001 и
      40P01), но ПОВТОРИТЬ обязан клиент. Похититель, чьё предъявление вызвало
      разбор, не повторяет ничего — и семейство остаётся живым.
    requirement: >-
      Одно из двух, и любое — с пробой. (а) Ограниченный повтор самого отзыва на
      классе pgfault.SerializationConflict: отзыв идемпотентен по построению
      (`revoked_at IS NULL` в том же операторе), дом класса уже существует, и
      повтор ЗДЕСЬ честнее, чем надежда на повтор клиента. (б) Снять цикл:
      обмен и ротация берут замок семейства ПЕРВЫМИ — отдельным оператором
      `SELECT 1 FROM kaname.token_families WHERE id = (SELECT family_id FROM
      kaname.<t> WHERE <digest_col> = $1) FOR KEY SHARE` ДО условного UPDATE
      ребёнка. Это замок, а не проверка: условие CAS остаётся в UPDATE, ban #10
      не нарушается.

  - id: cascade-rewrites-issued-evidence
    title: >-
      ON UPDATE CASCADE поставлен на ВСЕ ШЕСТЬ столбцов, хотя нужен ровно
      одному: обновление контекста семейства перестало ОТВЕРГАТЬСЯ и стало
