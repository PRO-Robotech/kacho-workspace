      свидетельство, а не кэш.
    requirement: >-
      Расщепить ключ на два, пока миграция не применена: (1) контекст —
      `FOREIGN KEY (family_id, client_id, user_id, session_id, scope)
      REFERENCES token_families(id, client_id, user_id, session_id, scope)
      ON DELETE CASCADE` БЕЗ ON UPDATE (расхождение остаётся ОТКАЗОМ);
      (2) живость — `FOREIGN KEY (family_id, family_live) REFERENCES
      token_families(id, live) ON DELETE CASCADE ON UPDATE CASCADE` при
      `UNIQUE (id, live)` на родителе. Ключевое обновление на отзыве и конфликт
      со вставкой ребёнка сохраняются полностью: `live` остаётся в уникальном
      индексе. Цена — второй индекс на родителе.

