      семейство пройти не может.
    coordinate: 'internal/migrations/20260920175117_…sql:36-40 («Строки после истечения убирает уборка»)'
    predicate: >-
      Писателей уборки в дереве НОЛЬ — та же перепись писателей трёх таблиц.
      Единственное, что сегодня удаляет строки, — ON DELETE CASCADE от
      human_sessions, то есть удержание строки сессии, а не решение о хранении.
      Обещание в шапке миграции переживает свой предмет.
    requirement: >-
      Либо завести писателя уборки в этой же полосе, либо снять обещание из
      шапки и завести предмет с предикатом снятия (ban #11: исходов три).
      Отдельно — revokeFamiliesOfSessionsTx исполняется ВНУТРИ транзакции снятия
      сессии, и теперь эта транзакция держит замки на всех детях всех семейств
      сессии.

  - id: logout-now-reads-as-theft
    title: >-
      Отзыв по выходу/окончанию сессии наблюдается предъявителю как ПОВТОР и
      влечёт ВТОРОЙ отзыв с причиной 'refresh-replay'.
    coordinate: 'internal/repo/kaname/pg/oauth_ceremony_repo.go:379-384 (refuseRefresh), :282-290 (refuseCode)'
    mechanism: >-
      Признак активности производен от живости семейства, поэтому строка
      семейства, отозванного по logout/session-ended/consent-withdrawn/
      client-removed, приходит в разбор как `!active` — первой же ветвью, то
      есть как повтор. Ветвь возвращает ErrRefreshTokenReplayed и вызывает
      RevokeFamily(refresh-replay). Второй отзыв пуст по `revoked_at IS NULL`,
      причину первого не переписывает (это ВЕРНО), но обычный выход теперь
      порождает обращение к контролю обнаружения похищения.
    requirement: >-
      Различение восстановить ОДНИМ чтением, а не ветвью, опрашивающей
      семейство: добавить в разбор `f.revoked_reason` тем же запросом (соединение
      по PK семейства, каскадный ключ его существование гарантирует) и судить по
      нему — своя отметка ребёнка ('redeemed'/'rotated') значит повтор, отметка
      семейства из четырёх «неинцидентных» причин значит «семейство снято».
      Отзыв при неинцидентной причине не вызывать вовсе.

  - id: header-says-four-columns
    title: 'Шапка repo-файла говорит «СОСТАВНОЙ внешний ключ по четырём столбцам сразу» — столбцов шесть.'
    coordinate: 'internal/repo/kaname/pg/oauth_ceremony_repo.go:46-47'
    note: >-
      Ниже, в строках 48-55 того же файла, шесть столбцов названы верно. Два
      места об одном предмете, одно верно — правится тем же изменением.

  - id: dead-without-recorded-ground-is-representable
    title: >-
      Состояние «мертва по производной, основание не записано» (family_live=false,
      deactivated_at IS NULL, deactivated_reason IS NULL, active=false) —
      ПРЕДСТАВИМО и ни одним ограничением не закрыто.
    measured_both_ways: >-
      ПРЕДСТАВИМО: отзыв одним оператором оставляет ровно такую строку, все
      парные CHECK выполнены. НО код её НЕ ПРОИЗВОДИТ, и это тоже измерено —
      автор назвал это последствие, оно ОПРОВЕРГНУТО: в прогоне «вставка
      выиграла гонку у отзыва» отзыв заблокировался на 2015 мс, дождался
      фиксации вставки, каскад снял family_live свежей строке, а следующий
      оператор ТОЙ ЖЕ транзакции (`WHERE family_id=$1 AND deactivated_at IS
      NULL`, свежий снимок на READ COMMITTED) увидел её и записал
      'family-revoked'. Итог: `rWIN | family_live=f | marked=t |
      family-revoked | active=f`. Причина записана.
    requirement: >-
      CHECK здесь невозможен по той же причине, по которой невозможен
      `CHECK (family_live OR NOT active)` — он падал бы на каскаде и ронял бы
      транзакцию отзыва. Механизм есть другой: ОСНОВАНИЕ смерти ребёнка по
      отзыву принадлежит строке СЕМЕЙСТВА (`revoked_reason`), а не копии на
      ребёнке. Снять 'family-revoked' из словарей обоих детей, снять оба
      дописывающих оператора из RevokeFamily и revokeFamiliesOfSessionsTx,
      основание читать соединением по family_id. Тогда состояние перестаёт
      быть «без основания» и становится НОРМОЙ с основанием на семействе.
      Взаимную блокировку это НЕ лечит (измерено отдельно), но снимает два
      оператора из транзакции отзыва и одно место двойной записи.

