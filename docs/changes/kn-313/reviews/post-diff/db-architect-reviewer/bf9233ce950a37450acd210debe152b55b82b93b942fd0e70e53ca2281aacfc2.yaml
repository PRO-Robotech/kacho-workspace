  - 'Третьего пути записи НЕТ: представлений, правил, триггеров и функций на трёх таблицах ноль (ни одна другая миграция их не упоминает); писателей в Go ровно три, все в этом диффе.'
  - 'Запись в производный признак отвергается кодом 428C9 — измерено на UPDATE и на INSERT.'
  - 'Вставка ребёнка в отозванное семейство отвергается кодом 23503 на <t>_family_fk — измерено, DETAIL называет все шесть столбцов ключа.'
  - 'Каскад по обновлению пересчитывает производную: строка, выигравшая гонку, приходит с family_live=false и active=false — измерено.'
  - 'Накат дампа подделанный признак не несёт: pg_dump опускает производный столбец из COPY (измерено, COPY-список без active), а family_live=true против отозванного семейства отвергает сам ключ.'
  - 'Выбор производной колонки вместо CHECK (family_live OR NOT active) обоснован верно: проверяемое ограничение падало бы на каскаде и роняло бы транзакцию отзыва.'
  - 'goose Up/Down на месте, многоинструкционные блоки обёрнуты StatementBegin/StatementEnd, CHECK стоят inline с CREATE TABLE.'
  - 'Down снимает таблицы в обратном порядке заведения; невосстановимого материала в них нет, и это названо.'
  - 'Нет внешнего ключа через границу сервиса: все три FK семейства ведут в ту же схему kaname.'
  - 'Нет ORM-артефактов — рукописный DDL и рукописный pgx.'
  - 'OFFSET-пагинации в диффе нет.'
  - 'Проба на 428C9 несёт ПОЛОЖИТЕЛЬНЫЙ БЛИЗНЕЦ (снятие отметкой проходит, признак пересчитывается) — без него «запись отвергнута» было бы истинно и в мире, где колонка не пишется никак.'
  - 'Отзыв идемпотентен условием `revoked_at IS NULL` в том же операторе; причина первого отзыва вторым не переписывается.'
  - 'Сведение выборки и пометки в один UPDATE … RETURNING (7a0ee753) верно и чинит перепись: число считает сделанное вызовом, а не увиденное им.'

# ── ЗАКАЗЫ (проб нет — роль их не пишет) ───────────────────────────────────
orders:
  - to: integration-tester
    title: 'Проба гонки «отзыв против выдачи» на testcontainers. Утверждение дословно — ниже.'
    assertions_verbatim:
      - id: A
        text: >-
          «После того как обе транзакции завершились, при КАЖДОМ из N прогонов и
          при каждом чередовании: если вызов отзыва вернул nil, то
          `SELECT count(*) FROM kaname.refresh_tokens WHERE family_id = $f AND
          active` равен НУЛЮ и `SELECT count(*) FROM kaname.authorization_codes
          WHERE family_id = $f AND active` равен НУЛЮ.»
      - id: A-denominator
        text: >-
          «И в том же прогоне `SELECT count(*) FROM kaname.refresh_tokens WHERE
          family_id = $f` СТРОГО БОЛЬШЕ НУЛЯ — иначе «живых ноль» истинно на
          пустом семействе и не утверждает ничего.»
      - id: B
        text: >-
          «Если вызов отзыва вернул ошибку, то `token_families.revoked_at`
          этого семейства ПУСТ (отзыв откатился целиком, полуотозванного
          состояния не бывает), ошибка удовлетворяет предикату повторяемости
          класса pgfault.SerializationConflict, и ПОВТОР того же вызова
          проходит и приводит к утверждению A. Прогон, в котором отзыв вернул
          ошибку, а утверждение A проверено НЕ БЫЛО, засчитывается КРАСНЫМ, а не
          пропущенным.»
      - id: C
        text: >-
          «Вставка ребёнка в семейство, у которого `revoked_at` не пуст,
          отвергается кодом 23503 на ограничении `<таблица>_family_fk` — при
          каждом чередовании, и ни разу не проходит.»
      - id: D
        text: >-
          «Положительный близнец к C: ТА ЖЕ вставка с ТЕМ ЖЕ входом в семейство,
          у которого `revoked_at` пуст, ПРОХОДИТ. Между C и D различается ровно
          один факт — отметка отзыва семейства.»
      - id: E
        text: >-
          «У каждой строки обоих детей, у которой `active` ложно, основание
          смерти ЧИТАЕМО: либо собственная `deactivated_reason` не пуста, либо
          `revoked_reason` её семейства не пуст. Строк, мёртвых без читаемого
          основания, ноль.»
    note_on_E: >-
      Утверждение E сформулировано так, чтобы пережить исправление по
      important/dead-without-recorded-ground: оно истинно и в форме, где причину
      дописывают на ребёнке, и в форме, где основание живёт на семействе.

  - to: integration-tester
    title: 'Проба на взаимную блокировку — сегодня КРАСНАЯ, и красной обязана быть до исправления critical/deadlock-victim-is-the-control.'
    assertion_verbatim: >-
      «Ротация (или обмен кода) и отзыв ТОГО ЖЕ семейства, запущенные внахлёст,
      завершаются так, что отзыв ИСПОЛНЕН: `token_families.revoked_at` не пуст.
      Исход, в котором отзыв снят кодом 40P01 и `revoked_at` остался пуст,
      КРАСНЫЙ. Число прогонов печатается; сценарий, не породивший ни одного
      наложения, тоже КРАСНЫЙ — он не проверил ничего.»

  - to: migration-writer
    title: 'Расщепление шестиколоночного ключа на два (контекст без ON UPDATE, живость с ON UPDATE CASCADE) в той же неприменённой миграции.'

  - to: 'автор Go-кода полосы kn-313'
    title: 'Повтор отзыва на классе SerializationConflict либо взятие замка семейства первым в обмене и ротации; восстановление различения неинцидентных причин отзыва чтением revoked_reason; правка шапки про «четыре столбца».'

# ── пересечения ────────────────────────────────────────────────────────────
overlaps:
  distributed_properties: true
  distributed_properties_note: >-
    Пересечение есть и оно живое: класс 40P01/40001, повторяемость отказа и
    отсутствие повтора у контроля безопасности — предмет system-design-reviewer
    на ТОТ ЖЕ дайджест. Я называю механизм и измерение; решение о том, где живёт
    повтор (слой доступа, use-case или клиент), — не моё поле.
  go_style: >-
    Шапка про «четыре столбца» и мёртвая ветвь switch — соседнее поле
    go-style-reviewer; ветвь уже снята этим же диффом (ed409a34), и снята верно.
  out_of_scope_named: >-
    Второй класс того же рода в 0001_initial.sql (схемные писатели отсечки
    переписывают причину и актора безусловно; один триггер кладёт одну запись из
    двух) — ОТДЕЛЬНАЯ полоса, объём не расширен. СВЯЗЬ названа: там и здесь
    ОСНОВАНИЕ смены состояния лежит в столбце, который пишет ДРУГОЙ оператор,
    чем тот, что состояние сменил. Здесь автор развёл их верно (условие
    `deactivated_at IS NULL` не переписывает чужую причину), там — нет
    (безусловная перезапись). Общее лекарство одно: основание принадлежит той
    строке, чей оператор флаг и переключает.
