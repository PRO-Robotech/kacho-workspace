critical:
  - id: session-end-mark-is-outside-every-key
    title: >-
      ТОТ ЖЕ КЛАСС ДЕФЕКТА, ОДНИМ УРОВНЕМ ВЫШЕ. Отметка снятия сессии
      (`human_sessions.ended_at`) не входит НИ В ОДИН уникальный индекс, поэтому
      снятие сессии — НЕключевое обновление, и со вставкой семейства оно НЕ
      конфликтует. Семейство, заводимое внахлёст с выходом, выход НЕ ОТЗЫВАЕТ.
    coordinate:
      - 'internal/repo/kaname/pg/oauth_ceremony_repo.go:536-580 (revokeFamiliesOfSessionsTx — писатель, заводимый ЭТИМ диффом)'
      - 'internal/repo/kaname/pg/oauth_ceremony_repo.go:187-230 (IssueAuthorizationCode — вторая сторона гонки, замка на сессии не берёт и `ended_at` не читает)'
      - 'internal/repo/kaname/pg/human_session_repo.go:276-291 (EndSession), :350-388 (endSessionsAndRevokeWhatTheyHold), :423-447 (EndAllSessions)'
      - 'internal/migrations/20260916190000_human_session_is_our_record.sql:71,88 (ended_at — обычная колонка, уникальных индексов на human_sessions два: PK и bearer_digest)'
    mechanism: >-
      Дословно тот довод, которым эта же миграция объясняет вынос `live` в ключ
      (её головной раздел, строки 78-90): «Пока `revoked_at` не входит НИ В ОДИН
      уникальный индекс, отзыв меняет неключевую колонку и берёт `FOR NO KEY
      UPDATE`, а вставка дочерней строки берёт `FOR KEY SHARE`. Эти два замка
      СОВМЕСТИМЫ». Ровно это верно и для `human_sessions.ended_at`: `UPDATE
      human_sessions SET ended_at=…` берёт `FOR NO KEY UPDATE`, а вставка
      `token_families` по `token_families_session_fk` берёт на строке сессии
      `FOR KEY SHARE`. Транзакция выхода не блокируется, идёт дальше и
      исполняет `UPDATE kaname.token_families … WHERE session_id = ANY($1)` —
      а незафиксированного семейства в её снимке НЕТ. Выход фиксируется,
      выдача фиксируется следом, и на СНЯТОЙ сессии остаётся ЖИВОЕ семейство.
    measured: >-
      3 прогона из 3 на дословном DDL: выход НЕ ждал (1.165 / 1.175 / 1.281 мс),
      отозвал 0 семейств, итог каждого прогона — `сессия_снята=true`,
      `семейств_живых_на_снятой_сессии=1`, `кодов_активных=1`. Ни один механизм
      базы этому не препятствует: внешний ключ требует СУЩЕСТВОВАНИЯ строки
      сессии, а не её живости.
    why_it_is_worse_than_it_looks: >-
      Ротация `revoked_at` не читает — так и написано в шапке `EndSession`:
      «оператор ротации не читает ни отметку окончания сессии, ни одну из
      отсечек». Значит проскочившее семейство ротируется в свежие токены
      БЕССРОЧНО: каждая ротация двигает `expires_at` вперёд. Вторая сторона
      гонки — не только вторая вкладка человека: `force_logout.go:422` зовёт
      `EndAllSessions`, то есть ПРИНУДИТЕЛЬНЫЙ выход распорядителя. Это тот
      самый контроль, ради которого, по шапке `EndSession`, писатель и заведён
      («то же, что чинилось для распорядителя»), — и он теряет ровно то, что
      обязан был вернуть.
    liveness_measured_honestly: >-
      Прод-вызывающих у церемонии СЕГОДНЯ НОЛЬ — перепись вне тестов и вне
      самого repo-файла: IssueAuthorizationCode 0, ExchangeAuthorizationCode 0,
      RotateRefreshToken 0, RevokeFamily 0. Находка, как и критическая №2
      прошлого круга, — о том, что код и схема ЭТО РАЗРЕШАЮТ, а не о сегодняшнем
      поведении. Судить её мягче, чем судил я критическую №2 при той же живости,
      было бы двумя мерками на один класс.
    my_own_miss: >-
      Находка присутствовала и на ed409a34: `revokeFamiliesOfSessionsTx` вошёл
      коммитом 7a0ee753, который я в круге 1 судил и одобрил по форме («сведение
