      ТРЕТЬЕГО писателя я тогда не мерил. Это мой промах, а не регресс автора.
    requirement: >-
      Инвариант «в снятой сессии живого выданного не остаётся» обязан держать
      МЕХАНИЗМ, а не порядок двух операторов в одной транзакции (ban #10).
      Вариантов ДВА, и оба ложатся без правки применённой миграции:
      (а) БЕЗ СХЕМЫ, в этой же полосе: `IssueAuthorizationCode` первым
      оператором берёт `SELECT 1 FROM kaname.human_sessions WHERE id=$1 AND
      ended_at IS NULL FOR NO KEY UPDATE` (замок конфликтует с замком выхода и
      упорядочивает обоих «сессия → семейство» — тот же приём, что уже применён
      уровнем ниже), а сама вставка становится `INSERT … SELECT … FROM
      kaname.human_sessions s WHERE s.id=$4 AND s.ended_at IS NULL` — ноль
      вставленных строк есть отказ, пары «проверил, затем записал» не
      возникает; (б) СО СХЕМОЙ, НОВЫМ файлом миграции (файл 20260916190000 на
      стволе — правке не подлежит, ban #5): признак живости сессии отдельной
      колонкой в уникальном индексе `(id, live)` и ссылка семейства на него —
      дословное повторение лекарства, применённого здесь к семейству.
      Выбор между (а) и (б) — не моё поле; назван механизм, не фикс.
    probe_required: >-
      Проба с конкурирующими транзакциями: выдача кода внахлёст со снятием
      сессии, несколько порядков старта; утверждение — «после того как обе
      транзакции завершились, живых семейств на снятой сессии НОЛЬ, и число
      семейств этой сессии СТРОГО БОЛЬШЕ НУЛЯ». Отрицательный кейс с
      положительным близнецом: та же выдача на ЖИВОЙ сессии проходит.

# ── ВАЖНЫЕ ─────────────────────────────────────────────────────────────────
important:
  - id: liveness-refusal-has-no-probe
    title: >-
      Отказ вставки в отозванное семейство (`<t>_family_live_fk`, 23503) — тот
      самый механизм, ради которого заведён второй ключ, — не утверждается НИ
      ОДНОЙ пробой дерева.
    predicate: "`grep -rn 'family_live_fk' --include=*_test.go .` = 0"
    note: >-
      Каскадная сторона живости пробу этим кругом ПОЛУЧИЛА
      (`TestIntegration_IssuedContextSurvivesAnUpdateOfItsFamily` — положительный
      близнец проверяет, что отзыв проходит и сносится на ребёнка). Вставочная
      сторона осталась без пробы: она держится только замером рецензента.
    requirement: 'Заказ C и D из круга 1 остаётся открытым, с новым именем ограничения.'

  - id: a-denominator-still-open
    title: '«Живых ноль» без знаменателя истинно на пустом семействе — см. probe_assertion_coverage.A_denominator.'
    requirement: 'Утверждать число строк семейства в том же запросе и печатать его.'

  - id: header-says-a-single-removal-path
    title: >-
      Заменённое описание уборки ВЕРНО НАПОЛОВИНУ: реестр назван правильно,
      квантор «ЕДИНСТВЕННЫЙ путь» — ложь. Путей ТРИ, и у всех трёх есть живой
      писатель.
    coordinate: 'internal/migrations/20260920175117_authorization_code_is_our_record.sql:41-51'
    what_is_true: >-
      «Своей записи в реестре уборки у этих трёх таблиц НЕТ» — ПОДТВЕРЖДЕНО:
      в `internal/apps/kaname/retention/registry.go` среди предметов
      (SubjectHumanSessions, SubjectLoginFailures, SubjectRecoveryCodes,
      SubjectSecondFactorEnrollments, SubjectAccessKeyChallenges и прочих)
      предмета церемонии нет ни одного. Прежнее обещание уборки снято верно.
    what_is_false: >-
      «Строки снимает ЕДИНСТВЕННЫЙ путь — каскад `token_families_session_fk`» —
      ОПРОВЕРГНУТО. У `token_families` ТРИ родителя с ON DELETE CASCADE
      (:176-181): `interactive_clients(client_id)`, `users(id)`,
      `human_sessions(id)`. Писатели удаления есть у всех трёх и все живые:
      `internal/repo/kaname/pg/interactive_client_repo.go:180` (зовётся из
      `internal/apps/kaname/api/interactive_client/usecases.go:453`),
      `internal/repo/kaname/pg/user_repo.go:815`,
      `internal/repo/kaname/pg/human_session_repo.go:181`.
    why_the_quantifier_is_load_bearing: >-
      Из него выведен СЛЕДУЮЩИЙ абзац — «действительный порог жизни этих строк:
      срок необслуживаемой сессии плюс порог её уборки». С тремя путями вывод
      неверен в обе стороны: строка может исчезнуть РАНЬШЕ (снят клиент, удалён
      человек) и по причине, к сессии отношения не имеющей. Соседнее место об
      этом же предмете написано ВЕРНО —
      `own_interactive_client_provider.go:24-26` прямо называет каскад от
      `interactive_clients`. Два места об одном предмете, одно верно.
    requirement: >-
      Снять квантор «единственный», перечислить три пути и вывести порог по
      самому короткому из них; либо назвать, почему два других к вопросу о
      пороге не относятся.

  - id: revocation-now-waits-for-the-whole-issuing-transaction
    title: >-
      Цена порядка названа не полностью: отзыв теперь ждёт ВСЮ транзакцию
      обмена/ротации, с её ПЕРВОГО оператора, а ограничителя ожидания в дереве
      нет.
    measured: >-
      Обмен держит замок 1 с; отзыв, пришедший через 0.15 с, ждал 869.1 / 862.3
      / 860.3 мс (3 из 3) и прошёл. Это ВЕРНОЕ поведение — отзыв не теряется, —
      но окно блокировки выросло: прежде встречный порядок снимался движком за
      `deadlock_timeout`, теперь ожидание ограничено только длительностью чужой
      транзакции. `lock_timeout` и `statement_timeout` по дереву не
      выставляются: перепись `grep -rn 'lock_timeout\|statement_timeout\|
      idle_in_transaction'` вне тестов даёт ОДНО попадание, и то комментарий
      (`internal/apps/kaname/api/module/plan.go:154`).
    cost_of_the_lock_statement_itself: >-
      Ничтожна: на населённых таблицах план — два индексных доступа
      (`Index Scan using refresh_tokens_pkey` + `Index Scan using
      token_families_live_uk`). На пустых планировщик выбирает Seq Scan — это
      мощность, а не отсутствие индекса; замерено на 2000 семействах после
      ANALYZE.
    cost_at_scale: >-
      Отзыв семейства с 20 000 детей — 820.7 мс ПОД ИСКЛЮЧИТЕЛЬНЫМ ключевым
      замком (каскад живости; дети гаснут все 20 000, живых 0). Снятие двух
      дописывающих операторов убрало из-под этого замка ~241 мс прошлого круга —
      подтверждаю, улучшение реально. Но порядок величины остался: выдача в это
      семейство в течение ~0.8 с пройти не может.
    requirement: >-
      Назвать ограничитель ожидания (пул либо контекст вызова) или назвать,
      почему его нет. Это НЕ блокирует: пересечение с распределёнными
      свойствами, поле system-design-reviewer.

# ── ЧТО ОСМОТРЕНО И ВОЗРАЖЕНИЙ НЕ ВЫЗВАЛО ──────────────────────────────────
third_writer:
  question: 'Не появился ли новый цикл с третьим писателем (отсечка, снятие сессии, уборка)?'
  answer: НЕТ — и это измерено, а не выведено
  measured: >-
    Три писателя на одном семействе одновременно (ротация с замком-первым;
    `RevokeFamily`; снятие сессии + `revokeFamiliesOfSessionsTx`), ШЕСТЬ РАЗНЫХ
    порядков старта: блокировок 0 из 6, отзыв исполнен 6 из 6, живых токенов 0
    из 6, знаменатель 1–2 строки. Причина отзыва распределилась между
    `refresh-replay` и `session-ended` — значит оба отзывающих писателя
    действительно выигрывали, сцена не выродилась в одну.
  first_attempt_was_flawed_and_is_named: >-
    Первый заход дал все шесть прогонов с задержками 0/0/0 (арифметика `bc`
    схлопнулась), то есть проверил ОДНУ сцену шесть раз. Перемерено с
    выписанными вручную шестёрками задержек. Числа выше — из перемера.
  ordering_reasoned_and_consistent: >-
    Все писатели берут замки в порядке `human_sessions → token_families →
    дети`: выдача (вставка семейства берёт FOR KEY SHARE на сессии, затем код),
    обмен и ротация (семейство первым, детей потом), отзыв (семейство, затем
    каскад), снятие сессии (сессия, затем семейства), уборка
    (`SweepUnservableSessions` — DELETE сессии, затем два каскада). Встречного
    порядка не осталось ни у одного. Дверь отсечки в общую транзакцию не
    входит: отсечка ложится СВОЕЙ транзакцией ДО `EndAllSessions`
    (`force_logout.go:422` и шапка `EndAllSessions`).

approved:
  - 'Замок-первым — ЗАМОК, а не проверка: подзапрос по ребёнку строчного замка не берёт, `FOR KEY SHARE` ложится только на семейство; условие CAS целиком осталось в `UPDATE … RETURNING`. ban #10 не нарушен.'
  - 'Контекстный ключ БЕЗ `ON UPDATE`: обновление сессии и области у семейства с выданным отвергается 23503 — измерено в обе стороны и на живом, и на отозванном семействе.'
  - 'Живостный ключ с `ON UPDATE CASCADE`: отзыв остаётся КЛЮЧЕВЫМ обновлением, каскад гасит и ранее лежащих детей, и вставленных в гонке — измерено.'
  - 'Основание смерти ребёнка перенесено на семейство: `family-revoked` снят из ОБОИХ словарей, оба дописывающих оператора сняты из `RevokeFamily` и `revokeFamiliesOfSessionsTx`. По дереву `family-revoked` = 1 попадание, и то комментарий-надгробие. Моя рекомендация круга 1 ИСПОЛНЕНА.'
  - 'Побочное свойство расщепления: «мёртв без читаемого основания» стало непредставимым цепочкой живостный-ключ → live_pair_ck → revoked_pair_ck. Три попытки построить руками отвергнуты.'
  - 'Детерминированная проба порядка (`TestOAuthExchangeTakesTheFamilyBeforeTheChild`) утверждает ИНВАРИАНТ, а не вероятность: ждущий опознан по PID, проверено что он стоит ИМЕННО на держателе семейства, и что `RowExclusiveLock` на `authorization_codes` у него НЕТ. На сломанной форме краснеет всегда, а не иногда.'
  - 'Возврат числа столкновений с 6 на 12 (ad50a2e5) верен, и довод верен: сокращение делалось ради чужого флейка и флейка не починило — сеть сузили, не купив ничего.'
  - 'Новая проба контекста несёт ПОЛОЖИТЕЛЬНЫЙ БЛИЗНЕЦ, отличающийся ровно одним фактом (обновляется живость, а не контекст), и близнец обязателен: без него «обновление отвергнуто» было бы истинно и у схемы, отвергающей ВСЯКОЕ обновление семейства.'
  - 'Правка шапки repo-файла про «четыре столбца» исполнена: теперь «по ПЯТИ столбцам сразу (family_id плюс четыре столбца контекста)» — и это верно по DDL.'
  - 'Гигиена миграции: тронут ОДИН файл, он не применён (`git cat-file -e origin/main:…` → «exists on disk, but not in origin/main»), ban #5 не наступил; `0001_initial.sql` и схемных писателей отсечки в диффе НОЛЬ — фенс задания соблюдён; goose-разметка на месте (8 маркеров), CHECK и ограничения inline с CREATE TABLE.'
  - 'Нет внешнего ключа через границу сервиса: все пять FK ведут в схему kaname той же базы.'
  - 'Нет ORM-артефактов; OFFSET-пагинации в диффе нет.'

# ── ГРАНИЦЫ УТВЕРЖДЕНИЯ «НЕПРЕДСТАВИМО» — названы, находками не считаю ─────
boundaries_named:
  - >-
    Строку с ЯВНЫМ `family_live=false` вставить в отозванное семейство МОЖНО
    (измерено, `INSERT 0 1`) — она рождается мёртвой (`active=false`) и ничего
    не даёт предъявителю. Свойство не новое: то же было у шестиколоночной формы.
  - >-
    Воскрешение семейства ручным SQL представимо: `revoked_at=NULL, live=true`
    проходит парные CHECK, и каскад возвращает к жизни ВСЕХ детей, включая
    вставленных после отзыва (измерено). Писателя, который это делает, в дереве
    нет; свойство не новое. Утверждение шапки «живая запись ПРИ ОТОЗВАННОМ
    семействе непредставима» этим не опровергается — после воскрешения семейство
    не отозвано.

# ── пересечения ────────────────────────────────────────────────────────────
overlaps:
  distributed_properties: true
  distributed_properties_note: >-
    Пересечение живое и на ТОТ ЖЕ дайджест: (1) отзыв ждёт чужую транзакцию без
    ограничителя — где живёт бюджет ожидания, решает не моя роль; (2) окно
    «выдача проскочила мимо выхода» имеет и распределённое прочтение — кто
    закрывает окно, механизм базы или сверка. Я называю механизм и измерение.
  go_style: 'Шапки и комментарии приведены в соответствие с DDL — соседнее поле go-style-reviewer, возражений по моему предмету нет.'
  out_of_scope_named: >-
    `0001_initial.sql` и схемные писатели отсечки — отдельная полоса, объём не
    расширен, в диффе их ноль. Замечу связь: лекарство, найденное здесь
    (признак состояния обязан стоять В КЛЮЧЕ, иначе его смена не конфликтует со
    вставкой ребёнка), — общее, и `human_sessions.ended_at` первый кандидат
    после церемонии.

