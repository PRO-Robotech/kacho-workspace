        (у выдающего `invited_by IS NULL`), выдача свою строку завела.
        ПЕРВАЯ сборка этой руки условия НЕ СОЗДАЛА: приглашающим у меня оказался
        владелец аккаунта, и `accounts_owner_fk` RESTRICT отверг снятие раньше
