# ── ЦЕНА И БЮДЖЕТ ОЖИДАНИЯ ──────────────────────────────────────────────────
wait_budget:
  question_from_task: 'блокирует ли отсутствие ограничителя ожидания посадку или идёт отдельным предметом'
  answer: 'ОТДЕЛЬНЫМ ПРЕДМЕТОМ. Посадку НЕ блокирует.'
  remeasured_predicate: >-
    Перепись по трём осям, знаменатель 974 непроверочных `.go`: `lock_timeout` /
    `statement_timeout` / `idle_in_transaction_session_timeout` — в непроверочном
    Go попаданий 3, и все три КОММЕНТАРИИ (`plan.go:154`,
    `oauth_ceremony_repo.go:179` и `:196`); в чартах, values и конфигурации — 0;
    в SQL — 2 в шапке дампа `0001_initial.sql` (`SET … = 0`) и 1 в комментарии
    миграции. Предикат проверен в обратную сторону: в проверочном коде он
    находит 8 файлов, то есть умеет находить. Заявление автора «в непроверочном
    коде попаданий ноль» ПОДТВЕРЖДЕНО.
  why_not_blocking:
    - >-
      Это свойство ДЕРЕВА, а не этого изменения: ждущих на строке сессии четыре
      класса (уборка `human_session_repo.go:181`, свой выход `:278`,
      принудительный выход `:306`, перепредъявление `:455` и `:478`) — все
      существовали до него, и ни у одного ограничителя нет тоже. Изменение
      добавляет пятого участника к уже неограниченному ожиданию, а не заводит
      неограниченное ожидание.
    - >-
      Держатель замка не может быть задержан ничем медленным, и это измерено по
      телу транзакции: между `pool.Begin` и `tx.Commit` в
      `IssueAuthorizationCode` пять операторов и НИ ОДНОГО внешнего вызова —
      вся валидация (форма свёртки, PKCE, redirect_uri, TTL) исполняется ДО
      `Begin`. Длительность — единицы миллисекунд (замер выше).
    - >-
      Ожидание не бесконечно со стороны вызывающего: pgx отменяет запрос по
      `ctx`, а `ctx` несёт срок запроса. Это не бюджет — срок назначает
      вызывающий, а не владелец строки, — но и не «ждать сколько живёт чужая
      транзакция» без всякого предела.
  what_the_separate_subject_is: >-
    Назначить бюджет ожидания на строке сессии и класс повтора для 40P01 —
    предмет РАСПРЕДЕЛЁННЫХ СВОЙСТВ, не схемы. Автор бюджета не назначал
    сознательно, как чужой предмет, и это верное решение: назначенный здесь, он
    был бы вторым местом об одном предмете.

# ── ЧТО ПРОВЕРЕНО ПО СПИСКУ РОЛИ ────────────────────────────────────────────
checked_by_task:
  ban10_db_level_invariant: >-
    Соблюдён. Условие живости и запись исполняет ОДИН оператор под строчным
    замком; разбор идёт по КАРДИНАЛЬНОСТИ его результата (два числа), а не
    повторным чтением. Пары «посмотрел — записал» нет ни в одной ветке.
  three_outcomes_not_two: >-
    Новое в этом круге и ВЕРНО: возвращаются два числа — сколько строк сессии
    нашлось и сколько семейств вставлено. Ноль первых — сессии нет
    (`ErrCeremonySessionUnknown`), ноль вторых при единице первых — сессия есть,
    но не жива (`ErrCeremonySessionNotLive`). Прежняя форма отвергала
    отсутствующую сессию внешним ключом, называя его имя; слияние двух фактов в
    один отказ потеряло бы различение, которое УЖЕ БЫЛО. Довод верен, и он же
    объясняет, почему снятую и истёкшую сессию сливать ЗАКОННО: предъявителю
    они говорят одно.
  cross_service_fk: 'Нет ни одного. Все внешние ключи — внутри схемы `kaname`, одна база.'
  applied_migration_not_edited: >-
    Запрет #5 соблюдён. `20260920175117_…sql` в `origin/main` ОТСУТСТВУЕТ
    (`git cat-file -e origin/main:<путь>` → «exists on disk, but not in
    origin/main»), заведена внутри этой полосы (69f3d733), применённой нигде не
    была. Правка её в полосе законна.
  migration_hygiene: >-
    `-- +goose Up` (156) и `-- +goose Down` (371) на месте; `StatementBegin` 3 и
    `StatementEnd` 3 — сошлись. Ограничения ВСЕ inline с `CREATE TABLE`:
    post-hoc `ALTER TABLE … ADD CONSTRAINT` — ноль. Данных окружения в миграции
    нет (`INSERT INTO` — 0). `OFFSET` — ноль. Частичного `UNIQUE … WHERE name
    <> ''` — нет.
  error_text_leak: >-
    Течи нет: оба признака несут только идентификатор сессии, отказы драйвера
    идут через существующий единственный дом `internal/repo/kaname/pg/pgmaperr.go`.
  concurrent_probe_requirement: >-
    НЕ ВЫПОЛНЕНО, и это ЗАКАЗ, а не запрет одобрять. Условная вставка — это
    compare-and-set по моему же списку (§2: «0 строк → sentinel»), и правило
    роли требует для неё пробы с конкурирующими транзакциями. В дереве такой
    пробы нет: зелёные `TestOAuthFamilyRevocationDoesNotDeadlockWithIssuance`,
    `TestOAuthExchangeTakesTheFamilyBeforeTheChild`,
    `TestOAuth{CodeExchange,RefreshRotation}UnderConcurrentTransactions`,
    `TestIntegration_EndingSessionsRevokesTheirTokenFamilies` судят ОБМЕН и
    ОТЗЫВ, а не ЗАВЕДЕНИЕ. Все перечисленные прогнаны мной без кеша и зелены,
    с напечатанным знаменателем (12 столкновений в трёх сценах).

