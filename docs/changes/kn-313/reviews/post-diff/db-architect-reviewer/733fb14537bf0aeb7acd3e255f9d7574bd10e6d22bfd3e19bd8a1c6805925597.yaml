# ── ГЛАВНОЕ: довод «у каскада ровно две вершины» ────────────────────────────
level_closure_claim:
  claim_as_stated: >-
    «У каскада ровно две вершины — `users` и `interactive_clients`. Выше
    человека стоит аккаунт, но оба ребра туда объявлены `ON DELETE RESTRICT`,
    вниз не каскадируют и в порядок замков не входят.»
  verdict_on_claim: 'ПОДТВЕРЖДЁН — и подтверждение отчитывается так же, как опровержение'
  how_measured: >-
    Не чтением миграции, а переписью КАТАЛОГА поднятой базы: `pg_constraint`
    `contype='f'` по схеме `kaname`, с `confdeltype`, `condeferrable`,
    `condeferred`, суженная до рёбер, входящих в предмет и выходящих из него.
    Читать `0001_initial.sql` глазами здесь недостаточно: правило удаления
    задаётся не только текстом, но и тем, что применилось.
  measured_edges:
    into_inserted_rows: >-
      `token_families` → `human_sessions` (CASCADE), → `interactive_clients`
      (CASCADE), → `users` (CASCADE); `authorization_codes` → `token_families`
      двумя ключами (CASCADE, второй с `ON UPDATE CASCADE`); `human_sessions` →
      `users` (CASCADE).
    upward_from_users: >-
      `users_account_fk` → `accounts` ON DELETE RESTRICT, DEFERRABLE INITIALLY
      DEFERRED; `users_invited_by_fk` → `users` ON DELETE SET NULL, DEFERRABLE
      INITIALLY DEFERRED.
    upward_from_accounts: >-
      `accounts_owner_fk` → `users` ON DELETE RESTRICT, DEFERRABLE INITIALLY
      DEFERRED.
    interactive_clients_parents: >-
      НЕТ НИ ОДНОГО — перемерено по каталогу и по `CREATE TABLE
      kaname.interactive_clients` (0001_initial.sql:2063): ни одного
      `REFERENCES` в определении.
  verdict_detail: >-
    Замыкание вверх от вставляемых строк по рёбрам, которые каскад СПОСОБЕН
    пройти вниз (CASCADE и SET NULL), даёт ровно {`users`,
    `interactive_clients`}. Оба ребра к аккаунту — RESTRICT, и это не довод на
    словах: рука «выдача × удаление аккаунта» (4 столкновения) получила
    `ERROR: update or delete on table "accounts" violates foreign key constraint
    "users_account_fk"`, то есть удаление аккаунта вниз не пошло ВООБЩЕ.
    Третьей вершины нет.
  unnamed_edge: >-
    Автор НЕ НАЗВАЛ третье ребро верхнего уровня: `users_invited_by_fk`
    (`users` → `users`, ON DELETE SET NULL, отложенное). Оно вершины не
    добавляет — это петля, — но означает, что снятие человека ПИШЕТ строку
    ДРУГОГО человека, и пишет её НА ФИКСАЦИИ, то есть внутри того самого
    порядка, про который идёт довод. Перепись в шапке кода неполна на это ребро.
    Вреда от него нет, и это ИЗМЕРЕНО, а не выведено: см. руку `inviter` ниже.

