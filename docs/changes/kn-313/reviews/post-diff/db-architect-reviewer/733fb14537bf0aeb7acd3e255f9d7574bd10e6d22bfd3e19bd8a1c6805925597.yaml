verdict_completeness:
  mechanism: >-
    О МЕХАНИЗМЕ вердикт НЕ неполон: три отсутствующие пробы я заменил
    собственными замерами — 89 столкновений суммарно (27 на цикле удаления, 36
    на половинах решения, 22 на неназванных противниках, 4 на аккаунте), у
    каждой руки знаменатель и строка «не выполнилось».
  regression: >-
    О РЕГРЕССИИ вердикт НЕПОЛОН, и я это заявляю прямо: в дереве нет ни одной
    проверки, способной покраснеть, если порядок этих трёх замков переставят
    обратно, если условие живости уйдёт из оператора вставки или если разбор
    двух чисел сольётся в одно. Сегодня механизм держат МОИ замеры (которые в
    дереве не живут) и шапка файла (которая не исполняется). Гейт
    `TestTokenFamilyIsWrittenByASingleGuardedProducer` закрывает ОДНУ из трёх
    дыр — появление второго писателя без условия; порядок замков и разбор
    кардинальности не закрыты ничем.
  does_it_block: >-
    НЕТ. Вопрос посадки — «есть ли то, что делает внесение хуже невнесения».
    Невнесение оставляет в дереве форму, на которой контроль безопасности
    проигрывает 9 раз из 9 (перемерено). Внесение эту форму снимает и не заводит
    ни одной новой гонки (перемерено пятью руками). Отсутствие регрессионного
    прибора — дыра, которую закрывает ЗАКАЗ, а не запрет.

