  arms_run:
    - arm: 'выдача × снятие интерактивного клиента (вторая вершина)'
      collisions: 6
      deadlocks: 0
      condition_created: 'да — клиент снят (0 живых), семейство снесено каскадом (0)'
    - arm: 'выдача × снятие ПРИГЛАСИВШЕГО (неназванное ребро users_invited_by_fk, SET NULL, отложенное)'
      collisions: 6
      deadlocks: 0
      condition_created: >-
