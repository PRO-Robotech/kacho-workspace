# ── ОТДЕЛЬНО СУЖДЕНО: создаёт ли окончательная сцена условие опыта ──────────
scene_creates_its_condition:
  question: >-
    Первая попытка автора воспроизвести руку «только условие» дала зелёное,
    потому что его выход фиксировался за 3 мс и вставка честно его видела.
    Создаёт ли окончательная сцена условие ДЕЙСТВИТЕЛЬНО — или повторяет ту же
    ошибку в другой форме?
  answer: 'СОЗДАЁТ. Перемерено независимой сценой, построенной мной, а не пересказом его.'
  how: >-
    Условие опыта здесь — ОКНО НЕЗАФИКСИРОВАННОГО СНЯТИЯ, и оно обязано быть
    наблюдаемым СО СТОРОНЫ вставки, а не заявленным. Моя сцена держит
    транзакцию снятия открытой `pg_sleep(1.2)` ПОСЛЕ обоих её операторов
    (отметка на сессии и отзыв семейств) и запускает вставку внутрь этого окна
    (`pg_sleep(0.3)` перед замками). Проверка, что окно действительно было:
    рука «только условие» в этой сцене даёт ДЕФЕКТ 6 из 6, а та же рука в сцене
    «снятие уже зафиксировано» — 0 из 6. Один и тот же код, два разных исхода,
    различаемые ровно фактом незафиксированности: значит сцена различает то, что
    обещает различать, а не что-то другое.
  two_way_control: >-
    Контроль в обратную сторону есть и он отдельный: рука «только замок» даёт
    дефект в ОБЕИХ сценах — то есть сцена «снятие зафиксировано» не является
    всеразрешающей и умеет краснеть. Сцена, в которой краснеет всё, и сцена, в
    которой не краснеет ничто, одинаково бесполезны; здесь ни того, ни другого.
  residual: >-
    Ошибки «условие не создано» я не нашёл ни в одной из шести клеток. Нашёл её
    У СЕБЯ, на первой сборке прибора (см. measurement_stand), и это ровно та же
    ошибка в другой форме — она дёшево воспроизводится, и защита от неё одна:
    печатать знаменатель и требовать от прибора доказательства, что он вообще
    исполнялся.

# ── ПОИСК ЧЕТВЁРТОГО ЭТАЖА ──────────────────────────────────────────────────
fourth_floor_search:
  method: >-
    Уровень закрыт тогда, когда цикл невозможен НЕ ТОЛЬКО с тем противником,
    который его обнаружил. Свойство, которое даёт закрытие: у транзакции выдачи
    первый же оператор берёт `users`, и всё, чего она может ждать, — это
    `users`, `interactive_clients` либо `human_sessions`, взятые в этом порядке.
    Значит цикл возможен ровно с транзакцией, которая берёт строку сессии (или
    клиента, или семейства) РАНЬШЕ, чем строку человека в режиме, конфликтующем
    с `FOR KEY SHARE`, — то есть раньше удаления человека либо КЛЮЧЕВОГО
