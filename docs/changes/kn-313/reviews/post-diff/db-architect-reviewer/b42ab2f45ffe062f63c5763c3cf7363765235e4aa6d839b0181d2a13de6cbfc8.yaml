critical:
  - id: lock-order-inverted-one-level-above-the-session
    title: >-
      НОВЫЙ ЦИКЛ ЗАМКОВ, КОТОРОГО НА ПРЕЖНЕЙ ФОРМЕ НЕТ. Удаление человека идёт
      «человек → сессия → семейство → дети», а выдача теперь идёт «сессия →
      человек» (замок сессии берётся ПЕРВЫМ оператором и держится, а замки
      родителей по внешним ключам берёт лишь СЛЕДУЮЩИЙ). Встречный порядок даёт
      взаимную блокировку, и жертвой её становится УДАЛЕНИЕ ЧЕЛОВЕКА.
    coordinate:
      - 'internal/repo/kaname/pg/oauth_ceremony_repo.go:176-177 (lockSessionOfCeremonySQL — оператор, заводимый ЭТИМ диффом)'
      - 'internal/repo/kaname/pg/oauth_ceremony_repo.go:211-216 (место его вызова: замок держится до COMMIT)'
      - 'internal/repo/kaname/pg/oauth_ceremony_repo.go:218-226 (вставка семейства — здесь берутся FOR KEY SHARE на users и interactive_clients)'
      - 'internal/migrations/20260920175117_authorization_code_is_our_record.sql:194-197 (token_families_user_fk, token_families_session_fk)'
      - 'internal/migrations/20260916190000_human_session_is_our_record.sql:76 (human_sessions_user_fk … ON DELETE CASCADE — вторая половина цикла)'
      - 'internal/repo/kaname/pg/user_repo.go:815 (единственный живой писатель удаления человека; читатель — DeleteUserUseCase, handler.go:157)'
    mechanism: >-
      Выдача держит `FOR SHARE` на строке сессии со своего ПЕРВОГО оператора и
      до фиксации. Её ВТОРОЙ оператор (вставка семейства) берёт по внешним
      ключам `FOR KEY SHARE` на строках `users` и `interactive_clients`.
      Удаление человека берёт исключительный замок на строке `users`, а затем
      каскад `human_sessions_user_fk` идёт за строкой сессии — и встаёт на
      `FOR SHARE` выдачи. Выдача в это время стоит на строке человека. Цикл
      замкнут.
    measured: >-
      9 прогонов из 9 на дословном DDL: `deadlock detected`, и жертвой КАЖДЫЙ
      раз транзакция УДАЛЕНИЯ (`CONTEXT: while deleting tuple in relation
      "human_sessions"`, `SQL statement "DELETE FROM ONLY
      "kaname"."human_sessions" WHERE $1 = "user_id"`). Выдача при этом
      фиксируется (`INSERT 0 1`, `COMMIT`).
    control_arm: >-
      ПРЕЖНЯЯ форма, та же сцена, 3 из 3: взаимных блокировок НОЛЬ, и исход
      ОБРАТНЫЙ — удаление человека проходит (`DELETE 1`, `COMMIT`), а выдача
      отказывает (`INSERT 0 0`). То есть до этой правки конфликт разрешался в
      пользу удаления, а после — в пользу церемонии. Цикл НОВЫЙ.
    second_control_arm: >-
      Обратный порядок старта (удаление первым, выдача через 0.2 с), 3 из 3:
      блокировок 0, человек удалён, семейств 0. Цикл требует, чтобы удаление
      пришло, ПОКА выдача держит сессию, — то есть окно равно длительности
      транзакции выдачи.
    why_it_is_the_same_class_the_lane_exists_to_fix: >-
      В круге 1 критической №1 было «жертвой цикла становится ОТЗЫВ — контроль
      безопасности, у которого повтора нет». Здесь жертвой становится удаление
      человека — вывод человека из продукта, действие того же рода, и повтора у
      него в дереве тоже нет: перепись `grep -rn 'retryOnAborted\|
      RetryOnSerialization\|withRetry'` по `internal/` даёт НОЛЬ попаданий.
      Судить эту находку мягче, чем я судил ту, было бы двумя мерками на один
      класс.
    what_softens_it_and_названо_честно: >-
      Три смягчения, и я их называю, чтобы диспетчер судил полно: (1) 40P01
      отображается в `iamerr.ErrAborted` (pgmaperr.go:198-216) — отказ ВИДИМЫЙ и
      объявленный повторяемым, текст драйвера наружу не идёт; (2) откат полный —
      неверного состояния не остаётся, теряется операция, а не целостность;
      (3) прод-вызывающих у церемонии сегодня НОЛЬ (перемерено: Issue/Exchange/
      Rotate/Revoke — 0 вне проб и вне самого repo-файла). Находка, как и обе
      прежние, о том, что код ЭТО РАЗРЕШАЕТ.
    requirement: >-
      Порядок замков обязан быть ОДИН на всё дерево, и он задан каскадами:
      `users → human_sessions → token_families → дети`. Выдача обязана брать
      строки родителей НЕ ПОЗЖЕ строки сессии — либо своим оператором до замка
      сессии (`SELECT 1 FROM kaname.users WHERE id=$1 FOR KEY SHARE`, то же для
      клиента), либо иначе, но так, чтобы «сессия → человек» не возникало.
      Фикса не пишу; назван механизм.
    probe_required: >-
      Проба с конкурирующими транзакциями: выдача внахлёст с удалением человека,
      оба порядка старта; утверждение — «взаимных блокировок НОЛЬ, и удаление
      исполнено» с положительным близнецом (та же выдача без удаления проходит).

  - id: the-argument-credits-the-half-that-does-not-close-it
    title: >-
      ДОВОД, КОТОРЫМ ОБОСНОВАН ВЫБОР, В ПОЛОВИНЕ ЛОЖЕН. «Условие в самой вставке
      закрывает обе» — опровергнуто. Условие закрывает ОДНО чередование из двух;
      второе закрывает ЗАМОК, объявленный доводом ничего не решающим.
    what_was_claimed: >-
      Дословно из задания и из шапки коммита: «Истечение сессии ключом
      невыразимо в принципе… Признак живости в ключе закрыл бы гонку с выходом и
      оставил бы открытой выдачу в истёкшую сессию; условие в самой вставке
      закрывает обе».
    first_half_is_true: >-
      «Ключом истечение невыразимо» — ВЕРНО, и это не рассуждение, а замер.
      Производная колонка от хода времени в Postgres НЕВОЗМОЖНА:
      `GENERATED ALWAYS AS (expires_at > now()) STORED` отвергается — `ERROR:
      generation expression is not immutable`. Обход через IMMUTABLE-обёртку над
      `now()` схемой принимается, но даёт колонку, ЗАМЕРЗАЮЩУЮ в момент вставки:
      через 2 секунды у строки со сроком в 1 секунду колонка говорит «жива», а
      сравнение со временем — «мертва» (измерено обе величины рядом). То есть
      ключ не просто не закрывает истечение — производная колонка на нём ЛГАЛА
      БЫ, и лгала бы внутри уникального индекса. Половина довода подтверждена
      сильнее, чем заявлена.
    second_half_is_false: >-
      «Условие закрывает обе» — ОПРОВЕРГНУТО. Рука «ТОЛЬКО УСЛОВИЕ, без замка»,
      сцена «выдача первой», 6 прогонов из 6: выход не ждёт (1.55–1.77 мс), и
      итог — сессия СНЯТА, семейство ЖИВО, код АКТИВЕН. Ровно тот дефект,
      который полоса и чинит. Причина механическая: `INSERT … SELECT` читает
      СНИМОК — незафиксированного снятия он не видит, а `UPDATE token_families`
      выхода не видит незафиксированного семейства. Двое проходят мимо друг
      друга.
    and_the_lock_alone_is_not_enough_either: >-
      Рука «ТОЛЬКО ЗАМОК, вставка безусловная», сцена «выход первым», 6 из 6:
      семейство ЗАВЕДЕНО в уже снятую сессию, код АКТИВЕН. То есть половины
      закрывают РАЗНЫЕ чередования и обе несущие: замок — «выдача первой»,
      условие — «выход первым». Полная форма чиста 12 из 12.
    why_this_is_load_bearing_and_not_a_wording_nit: >-
      Довод объявляет лишним ровно то, что единственно закрывает одну из двух
      сцен, и это написано не только в шапке коммита, но и В ДЕРЕВЕ:
      `oauth_ceremony_repo.go:136-138` — «ЗАМОК СЕССИИ, А НЕ ПРОВЕРКА. Состояния
      он не читает и ни на что не влияет своим результатом; решение о живости
      принимает условная вставка ниже». Соседнее место о том же предмете
      написано ВЕРНО (`:211-214` — «иначе они расходятся и снятие проходит мимо
      заводимого семейства»). Два места об одном предмете, одно верно. А пробы,
      которая бы покраснела на снятии замка, в дереве НЕТ и по замыслу этой
      дельты не будет.
    requirement: >-
      Довод привести в соответствие с замером: назвать, КАКОЕ чередование
      закрывает каждая половина, и что раздельно ни одна не закрывает гонку.
      Правка — в шапке `lockSessionOfCeremonySQL` (координата выше); текст
      коммита не переписывается, но следующий круг обязан нести верное
      утверждение. Неразделимость пары обязана стать наблюдаемой — заказ пробы
      с двумя контрольными руками ниже.

