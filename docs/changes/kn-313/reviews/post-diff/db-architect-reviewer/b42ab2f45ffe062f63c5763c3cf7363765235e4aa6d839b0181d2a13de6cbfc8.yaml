      ничем.
    measured: >-
      Транзакция выдачи целиком, без искусственных задержек, на моём стенде:
      BEGIN 0.052 мс · замок 0.223 мс · вставка семейства 1.272 мс · вставка
      кода 0.082 мс · COMMIT 0.024 мс — около 1.6 мс. Ровно столько и ждёт
      выход. В моих сценах выход ждал 460–465 мс, потому что сцена держала
      транзакцию 0.6 с; у автора 658–665 мс по той же причине.
    why_it_matters: >-
      Число, названное ценой, завышает её примерно в четыреста раз. Ошибка в
      безопасную сторону, но она же скрывает НАСТОЯЩИЙ предмет: ограничителя
      ожидания в дереве по-прежнему нет. Перепись
      `grep -rn 'lock_timeout\|statement_timeout\|idle_in_transaction'
      --include=*.go . | grep -v _test.go` даёт ДВА попадания, и ОБА —
      комментарии (`module/plan.go:154`, `oauth_ceremony_repo.go:163`).
    new_waiters_named: >-
      Ждущих на строке сессии теперь ЧЕТЫРЕ класса, а не один: снятие сессии
      (`EndSession`, `EndAllSessions`), уборка (`SweepUnservableSessions` —
      DELETE), ротация носителя (`RotateBearer` — обновление `bearer_digest`,
      то есть КЛЮЧА, `FOR UPDATE`) и каскад удаления человека. Из них цикл даёт
      только последний (критическая выше); остальные просто ждут.
    requirement: 'Назвать бюджет ожидания или назвать, почему его нет. Не блокирует — поле system-design-reviewer, тот же дайджест.'

  - id: refusal-swallows-the-unknown-session
    title: >-
      Отказ `ErrCeremonySessionNotLive` объявлен об ИСХОДАХ ДВУХ, а производится
      ТРЕМЯ: снятая сессия, истёкшая сессия и СЕССИИ НЕТ ВОВСЕ.
    coordinate: 'internal/domain/oauth_ceremony.go:50-57 (шапка признака); internal/repo/kaname/pg/oauth_ceremony_repo.go:227-230 (производитель)'
    measured: >-
      Несуществующий идентификатор сессии: замок возвращает 0 строк (ошибки
      нет), условная вставка — `INSERT 0 0`, то есть `ErrCeremonySessionNotLive`.
      ПРЕЖНЯЯ форма на том же входе давала `23503` с `DETAIL: Key
      (session_id)=(…) is not present in table "human_sessions"`. Различимость
      «такой сессии нет» и «сессия не жива» потеряна.
    judgement: >-
      Сам отказ стал ЧИЩЕ (наружу не идёт текст драйвера — это верно и хорошо),
      потеря различимости для предъявителя безразлична. Находка не о коде
      отказа, а о ШАПКЕ: она перечисляет причины исчерпывающе и перечисляет не
      все. Утверждение, пережившее свой предмет, в тот же день, что написано.
    requirement: 'Дописать третий исход в шапку признака либо сказать, почему он неотличим намеренно.'

  - id: non-representability-holds-through-this-writer-only
    title: >-
      Граница названа автором честно, и я с ней СОГЛАСЕН — но она обязана
      держаться предикатом, а не вниманием.
    what_is_true: >-
      Писателей `token_families` в дереве ДВА: `oauth_ceremony_repo.go:178`
      (прод) и `internal/migrations/authorization_code_schema_integration_test.go:154`
      (проба схемы). Предикат: `grep -rn 'INSERT INTO kaname.token_families'
      --include=*.go .` = 2. Сегодня прод-писатель ОДИН, и пара «замок +
      условие» у него есть.
    why_the_boundary_is_acceptable_here: >-
      Согласен с автором: вариант (б) — признак живости сессии в ключе — это
      новый файл на таблицу СТВОЛА, меняющий силу замка каждому снятию сессии во
      всём продукте. Радиус несоразмерен предмету полосы церемонии, и владелец у
      него другой. Ставить его условием посадки этой дельты было бы требованием
      чужой работы.
    why_it_still_needs_a_gate: >-
      Уровнем ниже (живость семейства) непредставимость держит СХЕМА — её не
      обойдёт ни второй писатель, ни ручной запрос. Здесь она держится одним
      файлом. Второй писатель `token_families` родится молча: ни одна красная
      проверка этого не заметит.
    requirement: >-
      Гейт дерева на перепись писателей `token_families`: всякий, кроме
      названного, — находка. Не блокирует.

  - id: derived-column-is-a-subject-but-a-narrower-one
    title: >-
      На вопрос «стоит ли заводить предметом признак как производную колонку» —
      ДА, но предмет уже, чем назван, и это измерено.
    measured: >-
      `GENERATED ALWAYS AS (ended_at IS NULL) STORED` схемой принимается И
      ложится в уникальный индекс `(id, live)` — проверено обе операции.
      `GENERATED ALWAYS AS (expires_at > now()) STORED` отвергается (42P17,
      «generation expression is not immutable»), а обход IMMUTABLE-обёрткой даёт
      ЛОЖЬ в колонке (см. критическую 2).
    what_that_means: >-
      Производная колонка закрывает ПОЛОВИНУ живости — снятие, — и закрывает её
      для ЛЮБОГО писателя, а не только для этого; истечение остаётся за условной
      вставкой навсегда, при любом механизме. То есть (а) и (б) не альтернативы,
      а слои: условие в операторе нужно в обоих мирах.
    requirement: 'Предмет владельцу полосы сессий: `live` производной от `ended_at` в ключе `(id, live)`. Не блокирует эту дельту.'

# ── ТРИ ПРЕДМЕТА ЗАДАНИЯ, ПРОВЕРЕННЫЕ ОТДЕЛЬНО ─────────────────────────────
checked_by_task:
  quantifier_and_the_second_falsehood:
    status: ОБА УТВЕРЖДЕНИЯ ВЕРНЫ — ПРОВЕРЕНО
    three_paths: >-
      У `token_families` три родителя с `ON DELETE CASCADE`
      (миграция :192-197), и у каждого РОВНО ОДИН живой писатель удаления вне
      проб. Перепись, предикатом автора и на его же форме:
      `interactive_clients` → `interactive_client_repo.go:180` (1 попадание);
      `users` → `user_repo.go:815` (1); `human_sessions` →
      `human_session_repo.go:181` (`SweepUnservableSessions`, 1). Квантор
      «единственный» был ложью, «три» — верно, и вывод «строка живёт до
      РАНЬШЕГО из трёх, расписание есть только у третьего» — тоже.
    second_falsehood: >-
      «Обновляющий токен, переживающий сессию, этим путём не убирается вовсе»
      было ложью, и снята она верно. Измерено на дословном DDL: до удаления
      строки сессии — семейств 3, токенов 1, кодов 0; после `DELETE FROM
      kaname.human_sessions` — 0/0/0. Каскад идёт от строки сессии через
      семейство, как теперь и написано. Знаменатель не пуст: убирать было что.
  denominator:
    status: ИСПРАВЛЕНО — И ПРОВЕРЕНО ПРОГОНОМ, А НЕ ЧТЕНИЕМ
    measured: >-
      `TestOAuthFamilyRevocationDoesNotDeadlockWithIssuance` прогнан (PASS,
      3.49 с, 12 столкновений). В сцене «отзыв первым», 4 прогона из 4,
      напечатано: «токенов 0, из них живых 0 · кодов 1, из них живых 0». То есть
      знаменатель кодов РАВЕН ЕДИНИЦЕ и утверждается (`require.Positive
      (rowCodes)`) — утверждение о живых кодах перестало быть истинным на пустом
      множестве. Знаменатель токенов в этой сцене НОЛЬ, и это законно: строка
      токена появляется только там, где обмен выиграл, и `require.Positive
      (rowTokens)` поставлен ровно под этим условием. Вакуумным там остаётся
      `require.Zero(liveTokens)`, но прогон в этой сцене несёт кодовое
      утверждение — пустым он не бывает.
    note: >-
      В сцене «обмен первым» и в «одновременно» (когда обмен выиграл) печатается
      «токенов 1, из них живых 0» — оба числа сняты, как и заявлено.
  previous_work_intact:
    status: НЕ ЗАДЕТА — ПЕРЕМЕРЕНО ЧЕТЫРЬМЯ ЗАМЕРАМИ И ДВУМЯ ПАКЕТАМИ ПРОБ
    measured:
      - 'вставка ребёнка в ОТОЗВАННОЕ семейство → 23503 на `refresh_tokens_family_live_fk`, DETAIL: `Key (family_id, family_live)=(…, t) is not present in table "token_families"`'
      - 'каскад по живости гасит лежащих детей: до отзыва активных токенов 1, после отзыва строк 1, из них активных 0 (знаменатель не пуст)'
      - 'контекстный ключ по-прежнему отвергает смену сессии у семейства с выданным → 23503 на `refresh_tokens_family_context_fk`'
      - 'фикстуры проб сеют ЖИВУЮ сессию (`expires_at = now() + 1 hour`, `ended_at` пуст) во всех четырёх местах — условная вставка их не отсекает; прогон это подтвердил'
      - '`go test ./internal/repo/kaname/pg/ ./internal/migrations/ -run "OAuth|Ceremony|Issued|Authorization|Session|TxDoor"` → ok, ok'
  hot_path_price_and_new_cycle:
    status: 'ЦЕНА НАЗВАНА НЕВЕРНО (важное выше); ЦИКЛ ЕСТЬ, НО НЕ ТОТ, О КОТОРОМ СПРАШИВАЛИ'
    the_chain_asked_about_is_acyclic: >-
      «Выход ждёт выдачу → выдача ждёт семейство → отзыв ждёт детей» цикла не
      даёт: выдача ждёт СВОЁ семейство, которого никто больше не видит (строка
      не зафиксирована), а все три писателя идут одним порядком `сессия →
      семейство → дети`. Подтверждено: в руке «полная форма, выдача первой»
      6 из 6 выход дождался и отозвал, взаимных блокировок 0.
    the_cycle_that_does_exist: 'этажом ВЫШЕ сессии — см. критическую 1.'

# ── ЧТО ОСМОТРЕНО И ВОЗРАЖЕНИЙ НЕ ВЫЗВАЛО ──────────────────────────────────
approved:
  - 'Выбор варианта (а) над (б) по РАДИУСУ — принят: (б) правит таблицу ствола и меняет силу замка каждому снятию сессии во всём продукте; предмет принадлежит владельцу полосы сессий. Ошибка довода выбора не переворачивает.'
  - 'Сила замка `FOR SHARE` — перемерена в трёх силах, выбор верен целиком (см. lock_strength_verified).'
  - 'ban #10 не нарушен: условие и запись — один оператор, ноль строк есть отказ; замок состояния не читает.'
  - 'Отказ несёт СВОЙ признак с единственным производителем; текст драйвера наружу не идёт (40P01 → ErrAborted, 23503 → FailedPrecondition — дом один, `pgmaperr.go`).'
  - 'Гигиена миграции: правка КОММЕНТАРНАЯ (не-комментарных строк 0), файл не применён (`git cat-file -e origin/main:…` → «exists on disk, but not in origin/main»), ban #5 не наступил.'
  - 'Фенс задания соблюдён: `0001_initial.sql` в диффе 0 попаданий, схемных писателей отсечки нет; файл двери отсечки пришёл слиянием соседней полосы и по существу не судится.'
  - 'Нет внешнего ключа через границу сервиса; нет ORM-артефактов; OFFSET-пагинации в диффе нет.'
  - 'Знаменатель заведён верно и в правильном месте — безусловно там, где строка есть по построению, и под условием там, где её появление зависит от исхода гонки.'

# ── ГРАНИЦЫ УТВЕРЖДЕНИЙ — названы, находками не считаю ────────────────────
boundaries_named:
  - >-
    Непредставимость живого семейства в снятой сессии держится ЭТИМ писателем.
    Ручной `INSERT INTO kaname.token_families … VALUES (…)` в снятую сессию
    проходит — внешний ключ требует СУЩЕСТВОВАНИЯ строки сессии, а не её
    живости. Автор это назвал; я согласен, что здесь граница приемлема, и
    заказываю ей предикат (важное выше).
  - >-
    `now()` в условной вставке — момент НАЧАЛА транзакции. Сессия, истёкшая
    между началом транзакции выдачи и её вставкой, условие пройдёт. Окно равно
    длительности транзакции (≈1.6 мс) и одинаково у любого механизма: ход
    времени оператором не наблюдается. Находкой не считаю, называю.

# ── пересечения ────────────────────────────────────────────────────────────
overlaps:
  distributed_properties: true
  distributed_properties_note: >-
    Живое и на ТОТ ЖЕ дайджест: (1) бюджет ожидания — ограничителя в дереве нет,
    а ждущих на строке сессии стало четыре класса; (2) класс повтора для 40P01
    на удалении человека: признак повторяемости есть, повторяющего нет.
  go_style: 'Шапки и признак отказа — соседнее поле go-style-reviewer; по моему предмету возражений нет.'
  out_of_scope_named: >-
    Двух проб (отказ вставки в отозванное семейство и её положительный близнец)
    и пробы гонки «выдача против снятия сессии» в этой дельте нет НАМЕРЕННО —
    заказаны отдельной полосой, находкой этой ветки не считаю. Но вердикт без
    них НЕПОЛОН, и я это заявляю: механизм, заведённый ЭТИМ коммитом, в дереве
    не имеет ни одной проверки, способной покраснеть на его снятии. Сегодня его
    держат мои замеры и шапка файла.

