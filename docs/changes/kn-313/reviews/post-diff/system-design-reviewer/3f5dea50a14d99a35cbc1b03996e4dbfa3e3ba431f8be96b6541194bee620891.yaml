# ── ВАЖНЫЕ ЗАМЕЧАНИЯ ───────────────────────────────────────────────────────
important_findings:

  - id: important-1
    title: >-
      ИНВАРИАНТ, ДЕРЖАЩИЙСЯ ТОЛЬКО КОДОМ ПРИЛОЖЕНИЯ ТАМ, ГДЕ ЕГО МОГЛА БЫ
      ДЕРЖАТЬ БАЗА: живая строка внутри ОТОЗВАННОГО семейства представима
    coordinate: internal/repo/kaname/pg/oauth_ceremony_repo.go:457
    also: internal/migrations/20260920175117_authorization_code_is_our_record.sql
    blocking: false
    class: >-
      Это ровно тот класс, который заказан отдельной строкой задания.
    mechanism: >-
      `revokeFamiliesOfSessionsTx` выбирает живые семейства сессии
      (`SELECT id FROM kaname.token_families WHERE session_id = ANY($1) AND
      revoked_at IS NULL`, `:471`) БЕЗ `FOR UPDATE`, затем тремя `UPDATE`
      помечает семейство и снимает живое, что по нему выдано (`:494`, `:500`,
      `:506`). Перепись блокирующих чтений по обоим файлам церемонии и сессии:
      `grep -rn 'FOR UPDATE\|FOR SHARE'` — НИ ОДНОГО.
      Встречный путь — `exchangeCodeSQL` / `rotateRefreshSQL` — проверяет
      живость семейства ОБЫЧНЫМ подзапросом `NOT EXISTS (SELECT 1 FROM
      kaname.token_families f WHERE f.id = … AND f.revoked_at IS NOT NULL)`, а
      обычное чтение под READ COMMITTED на незакоммиченный `UPDATE` НЕ
      БЛОКИРУЕТСЯ и видит прежнюю версию строки.
      Отсюда переплетение: обмен (или ротация), начавшийся ПОСЛЕ трёх операторов
      снятия и ДО его коммита, читает семейство ещё живым, проходит и
      вставляет строку `kaname.refresh_tokens` с `active = true` — в семейство,
      которое мгновением позже окажется отозванным. Снятие своим `UPDATE …
      WHERE family_id = ANY($1) AND active` её уже не видит: на момент того
      оператора она не была закоммичена.
    why_the_schema_does_not_hold_it: >-
      Миграция 20260920175117 прочитана целиком: у `refresh_tokens` и
      `authorization_codes` НЕТ ни триггера, ни ограничения, связывающего
      `active` с отметкой отзыва семейства. `CHECK` соседнюю таблицу не видит
      by construction, а составной внешний ключ по четырём столбцам держит
      СОГЛАСИЕ КОНТЕКСТА, но не живость. Значит безвредность состояния держится
      тем, что КАЖДЫЙ читатель присоединяет `token_families` — сегодня это
      делают ровно два оператора, и оба в одном файле.
    state_is_not_hypothetical: >-
      Разбор отказа сам его учитывает: ветвь `case familyRevoked`
      (`:274` и `:374`) достижима ТОЛЬКО когда строка `active` при отозванном
      семействе, то есть ровно в этом состоянии. Код его предвидит; схема — нет.
    direction_of_error: >-
      Безопасная, и потому находка не критическая. Строка инертна: ротацию
      останавливает тот же `NOT EXISTS`, то есть отказ читается на
      ПРЕДЪЯВЛЕНИИ. Сверх того ПРОИЗВОДИТЕЛЯ у церемонии сегодня нет (см.
      reachability ниже), поэтому переплетение в боевом контуре не наступает
      НИ ПРИ КАКОМ входе. Критической эта находка станет ровно в тот день,
      когда у обмена появится путь запроса.
    requirement: >-
      Закрыть состояние там, где его может закрыть база, а не перечнем
      читателей. Два годных способа, сильный первым:
      (1) ТРИГГЕР `BEFORE INSERT` на `kaname.refresh_tokens` и
          `kaname.authorization_codes`, отвергающий вставку в семейство с
          непустым `revoked_at`. Делает состояние НЕВЫРАЗИМЫМ, а не редким, и
          защищает от писателя на голом SQL мимо этого файла;
      (2) сериализация движком: `SELECT … FOR UPDATE` по строкам семейства в
          `revokeFamiliesOfSessionsTx` И блокирующее чтение семейства
          (`FOR SHARE`) в обмене и ротации. Слабее: держится тем, что оба конца
          не забыли.
      Выбор между ними — предмет ревью схемы, не мой: требование с моей стороны
      в том, что инвариант обязан перестать держаться только кодом.
    order: >-
      Красная проба с КОНКУРИРУЮЩИМИ транзакциями на границу двух механизмов:
      снятие сессии против обмена/ротации ТОГО ЖЕ семейства. Сегодня её нет —
      перемерено: `session_end_revokes_families_integration_test.go` и
      `cutoff_writers_write_both_integration_test.go` несут восемь проб и НИ
      ОДНОЙ горутины (`grep -n 'go func\|WaitGroup'` по обоим файлам — ноль).
      Конкурирующие пробы в волне есть, но все три — ВНУТРИ одного механизма
      (16 гонщиков на один код, на один токен, на одну тройку согласия).

  - id: important-2
    title: >-
      СХЕМНЫЕ ПИСАТЕЛИ ОТСЕЧКИ РАЗОШЛИСЬ С ДВЕРЬЮ, КОТОРУЮ ВВЕЛА ЭТА ВОЛНА:
      кладут одну запись из двух и переписывают причину БЕЗУСЛОВНО
    coordinate: internal/migrations/0001_initial.sql:1282
    also: internal/migrations/0001_initial.sql:1262
    blocking: false
    mechanism: >-
      Волна ввела единственную дверь к отсечке субъекта
      (`upsertSubjectCutoff`, `user_token_revocations_repo.go:104`): она кладёт
      ОБЕ записи и кладёт их ОДНОЙ транзакцией даже на пуле — состояние «одна
      запись без другой» сделано невыразимым В ПРЕДЕЛАХ ПАКЕТА. Заодно
      введён замок «причина и актор принадлежат СТОЯЩЕМУ моменту»
      (`CASE WHEN EXCLUDED.revoke_before >= … THEN … ELSE …`).
      Схемные писатели той же строки остались прежними:
      `kaname.minted_cutoff_on_owner_deactivation()` и
      `kaname.minted_cutoff_on_client_removal()` пишут ТОЛЬКО
      `kaname.minted_token_revocations` и переписывают `reason` и `revoked_by`
      через `= EXCLUDED.`, без условия на момент.
      Для триггера `user_deactivation_cuts_minted_tokens` (по `kaname.users`,
      `:5297`) вторая запись — `user_token_revocations` — ПРИМЕНИМА и не
      кладётся: это та самая форма «контроль исполнен наполовину», ради которой
      дверь и заведена.
      Расхождение СОЗДАНО этой волной: до неё оба писателя переписывали
      безусловно и были согласны между собой.
    direction_of_error: >-
      Безопасная. Пропущена запись, которую читает ВЫДАЧА, а выдача
      деактивированной личности закрыта самой деактивацией; запись, по которой
      судит авторитет отзыва НА ПУТИ ЗАПРОСА, триггер кладёт. Безусловная
      причина не меняет момент — его держит `GREATEST`.
    remnant_is_named_but_unaddressed: >-
      Автор остаток НАЗВАЛ и дал предикат снятия
      (`minted_token_revocation_repo.go:89-94`: «у функций `minted_cutoff_on_*`
      стоит тот же `CASE WHEN` по моменту, что и здесь»), но НОМЕРА ЗАДАЧИ у
      остатка нет — сказано прямо: «задачи заводит не эта полоса». Такой же
      безномерный остаток стоит ещё в трёх местах волны
      (`provider_road_posture_answer.go:50`, `force_logout.go:410`,
      `human_session_repo.go:347`), и последний ссылается на перечень в
      `tmp/kn-313-own-executor-runs/remnants-as-issue-lines.txt` — то есть во
      ВРЕМЕННЫЙ каталог, который дерево не хранит.
    requirement: >-
      Остатки адресовать задачей (ban11: исход «завести предмет с причиной и
      предикатом снятия» требует ответственного, а координата в шапке им не
      является), и адрес их перенести из `tmp/` в дерево. Сам предмет
      закрывается миграцией: триггер, зеркалящий первую запись во вторую, снял
      бы разом и это расхождение, и объявленную границу двери («писатель на
      голом SQL мимо этих функций по-прежнему может положить одну запись»).

  - id: important-3
    title: >-
      ПОРЯДОК ВЕТВЕЙ РАЗБОРА: токен, снятый ОТЗЫВОМ СЕМЕЙСТВА, при предъявлении
      классифицируется как ПОХИЩЕНИЕ
    coordinate: internal/repo/kaname/pg/oauth_ceremony_repo.go:369
    also: internal/repo/kaname/pg/oauth_ceremony_repo.go:266
    blocking: false
    mechanism: >-
      В `refuseRefresh` ветвь `case !active` (`:369`) стоит ПЕРЕД
      `case familyRevoked` (`:374`). Отзыв семейства ставит `active = false`
      всему живому с причиной `family-revoked` (`:506`). Значит человек, чью
      сессию сняли обычным выходом или принудительным выходом распорядителя,
      предъявив свой обновляющий токен, получает `ErrRefreshTokenReplayed` —
      «повтор», то есть признак похищения, — и влечёт повторный `RevokeFamily`
      с причиной `refresh-replay`. То же у `refuseCode` (`:266` против `:274`).
    direction_of_error: >-
      Безопасная и бесследная в данных: повторный отзыв пуст по условию
      `revoked_at IS NULL`, причина первого отзыва (`session-ended` / `logout`)
      НЕ переписывается. Портится только СИГНАЛ: вызывающий и журнал получают
      «обнаружено похищение» там, где был обычный выход. Цену платит разбор
      происшествия — ровно та сторона, ради которой отличение и заведено.
    requirement: >-
      Разбирать `familyRevoked` РАНЬШЕ `!active`, либо различать по
      `deactivated_reason` (`rotated` ⇒ повтор, `family-revoked` ⇒ семейство
      отозвано). Словарь причин закрыт ограничением схемы, так что
      различение полное и корзины «прочее» не заводит.

# ── ФАКТ, КОТОРЫЙ МЕНЯЕТ ЧТЕНИЕ ВСЕГО ОСТАЛЬНОГО ───────────────────────────
reachability_of_the_ceremony:
  statement: >-
    СОБСТВЕННАЯ ЦЕРЕМОНИЯ OAuth НЕ ИМЕЕТ ПУТИ ЗАПРОСА. Слой доступа написан и
    верен; производителя и потребителя у него нет ни одного.
  measured: >-
    · `grep -rn 'NewOAuthCeremonyRepo\|ExchangeAuthorizationCode\|
      RotateRefreshToken\|IssueAuthorizationCode\|RevokeFamily\|GrantConsent'
      --include=*.go .` по НЕ-тестовому дереву даёт РОВНО ОДНО вхождение вне
      самого файла: `cmd/kaname/wiring.go:869`, и там репозиторий передаётся
      как `kanamepg.ClientSecretStore` — интерфейс из трёх методов о СЕКРЕТЕ
      КЛИЕНТА (`own_interactive_client_provider.go:101`). Обмен, ротация,
      выдача кода, согласие и публичный `RevokeFamily` не зовутся ниоткуда;
    · единственный токен-эндпоинт службы принимает ЗАКРЫТЫЙ перечень видов
      выдачи — `client_credentials` и `jwt-bearer`
      (`internal/handler/clienttokenhttp/handler.go:207`); `authorization_code`
      в нём нет, всё прочее отвергается `unsupported_grant_type`;
    · живой путь есть только у `revokeFamiliesOfSessionsTx` — его зовёт снятие
      сессии (`human_session_repo.go:287` и `:385`), и сегодня он отзывает
      пустое множество, потому что семейств никто не заводит.
  what_it_does_and_does_not_change: >-
    НЕ отменяет вердикта: свойства, которые я сужу, в слое доступа ДЕРЖАТСЯ, и
    держатся механизмом базы. Но меняет чтение фразы «починено»: починен СЛОЙ,
    а не живая церемония — двойной выдачи по одному коду в боевом контуре не
    было и быть не могло, поскольку своей выдачи кода в нём нет вовсе.
    Утверждать «дефект двойной выдачи устранён на стенде» на этом отпечатке
    нельзя: предмет ещё не жив (measurement-discipline §«Живость предмета»).
  not_my_axis: >-
    «Написано раньше потребителя» — предмет ban #14 (production-complete в своих
    границах) и приёмки, не распределённых свойств. Называю фактом, не находкой.
    Гейт `TestEveryRevocationWriterHasACaller` этот класс НЕ ловит и законно:
    его предмет — таблицы, чьё имя оканчивается суффиксом отсечки, а цепочку
    достижимости от композиционного корня он не строит (границы названы в
    шапке, `revocation_writer_has_a_caller.go:31-47`).

