# ── ОСЕВОЙ ОБХОД: ЧТО ИЗМЕРЕНО ─────────────────────────────────────────────
axes:

  atomicity_no_dual_write:
    status: ЗАКРЫТО
    measured: >-
      Двойной записи «сохранили ресурс (коммит #1), затем опубликовали событие
      (коммит #2)» в диффе нет ни одной. Перечислено поимённо:
      · пара записей отсечки + строка журнала — ОДНА транзакция
        (`hook_pool_adapters.go:170` `RevokeAllUserTokensTx`: `pool.Begin`,
        `UpsertRevokeAllTx`, `emitAuditTx`, `tx.Commit`);
      · семейство и его код — одна транзакция
        (`oauth_ceremony_repo.go:127` `IssueAuthorizationCode`);
      · гашение кода и вставка первого поколения — одна транзакция
        (`:195` `ExchangeAuthorizationCode`);
      · пометка отротированного и вставка преемника — одна транзакция
        (`:300` `RotateRefreshToken`);
      · снятие сессии и отзыв её семейств — одна транзакция
        (`human_session_repo.go:280` и `:423`, через
        `revokeFamiliesOfSessionsTx(ctx, w.tx|tx, …)`).
    deliberate_two_step_is_not_a_dual_write: >-
      `ForceLogout` коммитит отсечку, ПОТОМ снимает сессию — два коммита, и это
      НЕ запрещённая двойная запись. Событие журнала со-коммитится с отсечкой;
      второй шаг — снятие сессии, действие над другим предметом, и порядок
      назван решением с доводом (`force_logout.go:452-462`): первой идёт
      половина, держащаяся без чужого содействия, вторая делает отказ
      восстановимым. Отказ второго шага помечает Operation ошибкой и НЕ
      откатывает отсечку; повтор идемпотентен (отсечка — монотонный upsert,
      снятие сессии — условие `ended_at IS NULL`).
    nonwired_teardown_is_a_closed_refusal: >-
      `force_logout.go:358` — ни одного исполнителя снятия не провязано ⇒
      `codes.Unavailable`, а не молчаливый успех. Это закрывает класс
      «непровязка, отвечающая успехом, молча снимает контроль».

  idempotency:
    status: ЗАКРЫТО
    measured: >-
      · отзыв семейства — условие `revoked_at IS NULL`, повтор пустой, причину
        победителя проигравший не переписывает (`oauth_ceremony_repo.go:406`,
        `:494`);
      · согласие — `ON CONFLICT … DO UPDATE` по тройке (`:556`), пары
        «посмотреть — записать» нет;
      · отсечка — монотонный `GREATEST`, причина и актор переезжают ТОЛЬКО
        вместе с принятым моментом (`minted_token_revocation_repo.go:95`,
        `user_token_revocations_repo.go:49`);
      · повторный выход ничего не пишет и ничего не отзывает — отзыв стоит под
        `tag.RowsAffected() == 1` (`human_session_repo.go:284`);
      · `SetClientSecretVerifier` / `ClearClientSecretVerifier` — одноинструкционные
        с проверкой кардинальности, ноль строк ⇒ отказ «нет такого клиента».

  atomic_and_optimistic_concurrency:
    status: ЗАКРЫТО НА ЦЕРЕМОНИИ, см. important[1] о ГРАНИЦЕ между механизмами
    measured: >-
      Обмен кода — ОДИН оператор с условием на прежнее состояние и возвратом
      строки (`exchangeCodeSQL`, `:175`): `UPDATE … SET active=false … WHERE
      code_digest=$1 AND c.active AND c.expires_at > now() AND NOT EXISTS (…
      семейство отозвано) RETURNING …`. Ротация — ТОТ ЖЕ механизм
      (`rotateRefreshSQL`, `:288`). Пары «прочитать — записать» на этих путях
      НЕТ: перепись `grep -n 'SELECT'` по файлу даёт четыре вхождения, и все
      четыре — либо подзапрос внутри того же UPDATE, либо РАЗБОР ПРИЧИНЫ,
      идущий ПОСЛЕ отката транзакции выдачи, по пулу (`:255`, `:358`).
      Ноль затронутых строк ⇒ `pgx.ErrNoRows` ⇒ разбор с ЗАКРЫТЫМ словарём
      исходов; корзины «прочее» нет — пятый исход отдельный громкий отказ,
      называющий, что условие и разбор разошлись (`:278`, `:381`).
      Схема подпирает это же: `refresh_tokens_generation_uk UNIQUE (family_id,
      generation)` делает разветвление семейства невыразимым, а
      `authorization_codes_family_uk UNIQUE (family_id)` — второй код у
      семейства.
    concurrent_probe_present: >-
      ЕСТЬ, и она именно конкурирующая, а не последовательная:
      `internal/repo/kaname/pg/oauth_ceremony_race_integration_test.go`.
      16 горутин со стартовым барьером (`start := make(chan struct{})`,
      `<-start`, `close(start)`), утверждения: выдач РОВНО одна; исходов ровно
      два и третьего нет; семейство отозвано с причиной `code-replay`;
      обновляющих токенов в семействе ровно один — то есть транзакция
      проигравшего ОТКАЧЕНА; погашенный код остался строкой и неактивен.
      Тот же приём у ротации (`:205`) и у согласия (`:352`). Перепись печатается
      (`t.Logf("перепись: гонщиков %d, выдач %d, …")`).

  change_delivery_polling_model:
    status: ЗАКРЫТО
    measured: >-
      Watch RPC и серверного стрима волна не вводит: перепись
      `git diff <base>..<head> | grep '^+' | grep -E 'stream\.Send|rpc Watch|grpc\.ServerStream'`
      — ноль строк. Очередь компенсаций остаётся внутренней доставкой, публичным
      контрактом наблюдения не становится.

  worker_and_replica_coordination:
    status: ЗАКРЫТО
    measured: >-
      · дренаж очереди компенсаций и её ПРОИЗВОДИТЕЛЬ гейтируются ОДНИМ
        предикатом, а не двумя копиями: и `wiring.go:883`
        (`providerAdminHopIsBuilt(cfg)` перед `WithCompensationEmitter`), и
        `provider_compensation_wiring.go:64` (`roadBuilt` — второе значение
        `mustProviderAdminClient`, которое читает тот же
        `providerAdminHopIsBuilt`) сводятся к одной функции. Класс «очередь с
        производителем без применителя» / «применитель без производителя»
        закрыт по устройству, а не правилом;
      · nil-задача проверяется ДО постановки в очередь задач
        (`serve.go:1796`) — отсутствие дороги приходит записью в журнал, а не
        паникой разыменования;
      · перепись очереди (глубина, возраст старейшей недоставленной,
        отравленные) поднимается ОТДЕЛЬНОЙ задачей и переживает выключение
        дренажа — «ноль доставленных строк за всю жизнь» остаётся заметно;
      · дренаж живёт на `taskCtx`, а не на контексте запроса.
    per_call_deadline: >-
      Проверено на КАЖДОМ внешнем вызове волны.
      · дорога поставщика — `&http.Client{Timeout: ProviderAdminHopTimeout}`
        (`internal/clients/hydra_admin_client.go:88`), настроенный предел общий
        на все методы клиента (arch-per-call-deadline: «все sibling-методы
        клиента — один configured-timeout»);
      · зеркало издателя — выделенный `&http.Client{Timeout: timeout}`, НИКОГДА
        `http.DefaultClient` (`jwksproxyhttp/handler.go:169`), плюс
        `context.WithTimeout` на чтении набора (`keyset.go:105`);
      · `http.DefaultClient.Do` с сырым контекстом запроса в диффе не
        появляется.

  upstream_issuer_mirror:
    status: ЗАКРЫТО; прод-код зеркала волной НЕ ТРОНУТ
    measured: >-
      `git diff --name-status <base>..<head> -- internal/handler/jwksproxyhttp/`
      даёт ТРИ файла, и все три — `_test.go` (`handler_test.go`,
      `keyset_rotation_test.go`, `upstream_trust_test.go`). Прод-файлы
      `handler.go`, `keyset.go`, `binding.go` в волне не меняются. Поэтому по
      этой оси волна не вносит нового распределённого свойства, и судить её
      предметом ревью диффа нечего.
      Действующее поведение перемерено чтением прод-кода, чтобы утверждение не
      осталось предположением: холодный кэш + недостижимый издатель ⇒
      FAIL-CLOSED (`handler.go:30-35`); тёплый кэш в пределах TTL переживает
      краткую недоступность (ограниченная несвежесть, `:269`); TTL берётся из
      `Cache-Control max-age` издателя, при его отсутствии — 5 минут; предел
      вызова — 5 секунд по умолчанию.

  service_graph_acyclicity:
    status: ЗАКРЫТО — НОВЫХ РЁБЕР ВОЛНА НЕ ЗАВОДИТ
    measured: >-
      `git diff --name-status <base>..<head> -- internal/clients/` — НОЛЬ строк.
      Ни одного нового типизированного клиента, ни одного нового адреса
      вышестоящего. Дорога поставщика (`HydraAdminClient`) и зеркало издателя —
      рёбра к ВНЕШНЕМУ поставщику удостоверений, существовавшие до базы, а не
      межсервисные рёбра графа доменов. Значит записи в
      `.claude/rules/polyrepo.md` §«Runtime cross-domain edges» эта волна НЕ
      ТРЕБУЕТ, и заказа `tooling-maintainer` по ребру нет.
      Направление графа модулей не трогается: `go.mod` в диффе отсутствует.

  replica_state_isolation:
    status: ЗАКРЫТО
    measured: >-
      Разделяемого состояния в памяти между репликами волна не вводит: ни
      пакетной переменной-источника-истины, ни глобального кэша. Кэш зеркала
      издателя — per-replica и ограниченно несвежий, он не источник истины и
      волной не тронут. Все решения церемонии читаются из базы на каждом
      предъявлении.

  edge_public_vs_internal:
    status: ЗАКРЫТО
    measured: >-
      Новый маршрут волны — `POST /iam/v1/hooks/recovery`
      (`iamhooks/http_server.go:124`), и он встаёт на ТОТ ЖЕ mux, что три
      соседних, — слушатель объявлен cluster-internal-only (шапка файла,
      ban #6), требует `Bearer X-Kacho-Hook-Token`. Публичный mux волной не
      трогается: `git diff --name-only` по `restmux`/`mux` даёт только
      `cmd/kaname/serve.go`, и правка в нём — гейтирование фоновой задачи, а не
      монтирование метода. `Internal*` на внешнем эндпоинте не появляется.
      Опись маршрутов теперь держится пробой
      (`route_prose_names_every_route_test.go`): маршрут восстановления приехал
      позже трёх соседних, и обе описи пакета молча остались трёхстрочными —
      класс «документ пережил свой предмет», закрытый прибором.

  clean_architecture_layers:
    status: ЗАКРЫТО
    measured: >-
      · порты названы наружу в слое, который их ОБЪЯВЛЯЕТ, и реализуются
        адаптерами: `ProviderSessions`, `ExternalIDResolver`, `OwnSessions` —
        в `internal/apps/kaname/api/internal_iam/force_logout.go`, реализации в
        `internal/clients/` и `internal/repo/kaname/pg/`;
      · связывание — только в `cmd/kaname/wiring.go` (`:775-776`
        `WithProviderSessions` / `WithOwnSessions`); глобальных синглтонов и
        побочных эффектов `init()` вне `cmd/` волна не заводит;
      · выбор посадки принимается в композиционном корне, а НЕ ветвью в
        use-case — довод выписан (`wiring.go:1100-1108`): ветвь внутри глагола
        была бы решением о развёртывании, принимаемым на каждом запросе;
      · `kanamepg.ClientSecretStore` объявлен в слое адаптеров
        (`own_interactive_client_provider.go:101`) — это шов МЕЖДУ ДВУМЯ
        адаптерами одного слоя, а не порт use-case; порт use-case здесь
        `interactiveclientapp.ProviderClients`. Нарушением правила зависимостей
        это не является.
      · `typed nil` закрыт по существу: `forceLogoutProviderSessions` возвращает
        ЧИСТЫЙ nil, и это названо решением — типизированный nil прошёл бы
        страж провязки насквозь (`wiring.go:1121`).

