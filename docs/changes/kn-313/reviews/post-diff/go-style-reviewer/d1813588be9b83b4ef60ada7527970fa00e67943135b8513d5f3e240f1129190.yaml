  Горизонтального выноса изменение не порождает. `go.mod`/`go.sum` не тронуты
  (перемерено по составу диффа). Обход дерева взят пином у фундамента
  (`corelib/treecorpus`), пул — `corelib/db`. `upsertSubjectCutoff`,
