# ── одобрено: что проверено и на чём ───────────────────────────────────────
approved:
  single_door_to_the_subject_cutoff: >-
    ПОДТВЕРЖДЕНО (см. reexamined.prior_critical_1). Обходного пути внутри
    пакета к первой записи не осталось; гейт краснеет на возвращённом дефекте с
    точной координатой.
  gate_blind_spot_named_in_the_gate_itself: >-
    ПОДТВЕРЖДЕНО, и названо ИМЕННО ТАМ, где требовалось: четвёртое слепое пятно
    стоит в шапке САМОГО соседнего гейта
    (`internal/check/revocation_writer_has_a_caller.go:44-48`), а не только в
    возврате, и несёт довод «перечень границ, названный не полностью, хуже
    отсутствующего». Указана и координата отдельного гейта, который это свойство
    судит.
  gates_as_code: >-
    Оба новых гейта судят ДЕРЕВО, а не ведомость. Пара записей подаётся ИМЕНАМИ
    (`pairedCutoffFirst`/`pairedCutoffSecond`), а не выводится — и это названо
    решением. Предпосылка отдельной функцией (`RevocationWriterPremise`) и
    проверяется ВЫЗОВОМ на синтетике; пустой обход вердикта не выносит; порог
    файлов отделяет «предмета нет» от «до дерева не дошли»; отдельный отказ на
    «писателей первой записи ноль». Перепись печатается двумя числами и
    перечнем выведенных таблиц. Ведомостей исключений и skip-списков ни одной.
    Ось «писатель ТОЛЬКО второй записи — не находка» несёт ПРИЧИНУ
    односторонности (схемные писатели второй первую не пишут и не должны).
    Каждая ось сверх исхода утверждает ПЕРЕПИСЬ («вставка не долетела»), а ось
    вызова — ещё и собственную осмысленность («до достраивания дверь читается
    писателем одной записи»). Оговорка — important[1].
  probes_judge_the_observable: >-
    Обе новые интеграционные пробы судят НАБЛЮДАЕМОЕ состояние, а не вызов, и
    несут положительный близнец прежде отрицания:
    `TestIntegration_LoginLaneCutoffWriterWritesBothRecords` спрашивает
    авторитет отзыва ДО отсечки и требует «не отозван»;
    `TestIntegration_EndingOtherSessionsRevokesTheirFamilies` требует успешной
    ротации ДО снятия. Фикстура кладётся ТЕМ ЖЕ писателем, что и продукт
    (`sessions.Writer(ctx).UpsertCutoff`, `ceremony.IssueAuthorizationCode`), а
    не своим INSERT'ом — фикстура не снисходительнее продукта.
  no_panic_in_prod_path: >-
    Добавленных `panic(`, `log.Fatal`, `Must*` в прод-коде диффа — одно
    вхождение, `regexp.MustCompile` на пакетной переменной гейта
    (`revocation_writer_has_a_caller.go:64`): это не путь запроса.
    `fmt.Errorf("provider compensation drainer panic: %v", r)` — печать
    ПОДНЯТОГО значения в `recover()`; `%w` там неприменим, `r` не ошибка.
  no_raw_context_and_no_todo: >-
    Добавленных `context.Background()` / `context.TODO()` в прод-коде диффа ноль
    (перемерено по составу диффа с исключением `*_test.go`). `ctx` первым
    аргументом у всех новых функций, включая `upsertSubjectCutoff`,
    `upsertMintedCutoff`, `revokeFamiliesOfSessionsTx`, `endSessionsOf`.
  no_error_echo: >-
    Добавленных `status.Error*(…, err…)` в прод-коде диффа ноль. Оба отказа
    провязки несут ФИКСИРОВАННЫЙ текст; `err.Error()` уходит в журнал оператору.
  error_wrapping: >-
    `%v` вместо `%w` в новых обёртках ошибок нет (единственное `%v` —
    recover-значение, см. выше). Сравнений `err.Error() == "…"` нет; признак
    отсутствия сравнивается по значению (`stderrors.Is(err, iamerr.ErrNotFound)`).
  no_pii_in_logs: >-
    В добавленных строках журнала — `operation_id`, `user_id`, `sessions_ended`,
    имена ручек. Ни адреса, ни телефона, ни носителя, ни свёртки.
  layering: >-
    Направление зависимостей цело. Порты объявлены у потребителя-use-case и
    несут нейтральные типы; `cutoffExecutor` — узкий интерфейс на один метод,
    объявленный у потребителя в слое repo. Выбор исполнителя по посадке сделан в
    композиционном корне, а не ветвью в use-case. Глобальных синглтонов и
    `init()` с побочным эффектом в диффе нет. `internal/check` прод-импортёров не
    имеет — установленная форма этого дерева.
  naming_ascii: >-
    Все новые идентификаторы латиницей (запрет #17): `upsertSubjectCutoff`,
    `subjectCutoffRowSQL`, `mechanismDecider`, `cutoffExecutor`,
    `endSessionsAndRevokeWhatTheyHold`, `PropagateTablesThroughCalls`,
    `WritersOfOneCutoffWithoutTheOther`, `PairedCutoffFinding`,
    `sortedTableSet`. Магических чисел нет.

