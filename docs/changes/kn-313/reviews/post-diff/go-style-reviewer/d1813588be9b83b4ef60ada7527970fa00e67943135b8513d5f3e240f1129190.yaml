    пишут — ось `TestPairedCutoffInjection_SecondOnlyIsNotAFinding` это решение
    несёт с причиной. Производственного вызывающего у метода сегодня нет.
  per_call_deadline: >-
    Ни `endSessionsAndRevokeWhatTheyHold`, ни `revokeFamiliesOfSessionsTx`, ни
    `upsertSubjectCutoff` не ставят собственный `context.WithTimeout`. Это НОРМА
    дерева, а не регрессия диффа: собственный предел в
    `internal/repo/kaname/pg` ставит один файл из 79 (`reconcile_notify.go`,
    LISTEN/NOTIFY). Предмет — древовое решение, не эта полоса.
  known_red_on_this_branch: >-
    Со слов задания: три пакета красны по дефекту ЧУЖОГО предиката отбора
    миграций (чинит другая полоса, ложащаяся раньше), один — по подписи восьми
    старых коммитов, проверка на гонки неисполнима (нет компилятора C — третий
    исход, не красное). Ни одно из этого не предмет этого ревью и в вердикт не
    входит.

