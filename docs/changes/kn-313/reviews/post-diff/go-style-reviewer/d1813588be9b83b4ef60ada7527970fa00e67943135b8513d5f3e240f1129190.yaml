critical:
  - id: SESSION-END-BY-ID-DOES-NOT-REVOKE-WHAT-THE-SESSION-HOLDS
    tag: '[HALF-APPLIED CONTROL] + [SECURITY COMMENT CONTRADICTS CODE]'
    coordinate: internal/repo/kaname/pg/human_session_repo.go:259
    claim: >-
      Асимметрия отзыва семейств сведена у ДВУХ методов из ТРЁХ. Третий —
      `humanSessionWriter.EndSession` (снятие ОДНОЙ записи по её
      идентификатору) — ставит `ended_at`/`ended_reason` своим оператором
      (`:261`) и семейства НЕ отзывает. Живой производственный вызывающий у него
      есть, и это СОБСТВЕННЫЙ ВЫХОД ЧЕЛОВЕКА — предмет, именем которого названа
      эта полоса.
    live_caller:
      - internal/apps/kaname/api/humansession/logout.go:78   # LogoutUseCase.Execute
    measured: >-
      Радиус взят по имени механизма, а не по диффу.
      1) Перепись снимающих операторов: `grep -rn 'UPDATE human_sessions'
         --include=*.go` по не-тестовому дереву — четыре вхождения (:261, :281,
         :414, :437); ставят `ended_at` два — :261 (`EndSession`) и :281
         (`endSessionsOfSQL`).
      2) Единственный писатель причины отзыва «сессия окончена»:
         `grep -rn 'FamilyRevokedBySessionEnd' --include=*.go` — прод-вхождение
         ОДНО, `human_session_repo.go:321`, внутри
         `endSessionsAndRevokeWhatTheyHold`. `EndSession` туда не заходит.
      3) Привязка: `token_families.session_id text NOT NULL` → `human_sessions(id)
         ON DELETE CASCADE` (`20260920175117…sql:62,76`). Каскад срабатывает на
         УДАЛЕНИИ строки; снятие строку не удаляет — это довод самой полосы.
      4) Ротацию останавливает только отзыв семейства (перемер rotateRefreshSQL
         выше). Ни одна из двух отсечек ротацию не читает.
      5) Проб, судящих собственный выход и семейство, ни одной: обе новые
         интеграционные пробы судят `EndOtherSessions`
         (`cutoff_writers_write_both_integration_test.go:86`) и путь
         `endSessionsAndRevokeWhatTheyHold`
         (`session_end_revokes_families_integration_test.go:33`). Набор проб
         повторяет слепое пятно кода.
    consequence: >-
      Дословно тот вред, который дифф выписал сам
      (`oauth_ceremony_repo.go:436`, `human_session_repo.go:300`): сессия,
      снятая БЕЗ отзыва семейства, снята только в записи — её обновляющий токен
      живёт и ротируется в свежие, а окно равно величине УДЕРЖАНИЯ, то есть
      настройке хранения, а не решению о безопасности. Отсечка этого не
      закрывает: она отвергает носитель, ВЫПУЩЕННЫЙ раньше неё, а ротация чеканит
      носитель со свежей отметкой выпуска. После собственного выхода человека
      прежний держатель сохраняет возобновляемый доступ.
    liveness: >-
      Вред СЕГОДНЯ латентен и это названо честно: производственного вызывающего
      у `IssueAuthorizationCode`/`ExchangeAuthorizationCode`/`RotateRefreshToken`
      ни одного (перепись: `grep -rn 'RotateRefreshToken\|ExchangeAuthorizationCode'
      --include=*.go | grep -v _test.go` даёт только объявления), поверхность
      собственной церемонии ещё не провязана. Латентность — не смягчение:
      асимметрия ЗАВЕДЕНА этим диффом (до него семейств не отзывал ни один путь),
      механизм и его единственный писатель приходят этим же диффом, а
      провязка поверхности есть следующий шаг той же эпики.
    second_half_of_the_finding: >-
      Шапка `endSessionsAndRevokeWhatTheyHold` (`:305-307`) утверждает «Теперь
      снимающий метод ровно один, и обойти отзыв нечем», а шапка `endSessionsOf`
      (`:330-331`) — «Единственный его читатель». Первое НЕПРАВДА по дереву:
      снимающих метода два. Это комментарий о защите, противоречащий коду, на
      механизме снятия доступа — он зовёт следующего писателя выбрать
      `EndSession` и считать, что отзыв придёт сам.
    requirement: >-
      Либо `EndSession` отзывает семейство снимаемой записи той же `w.tx` (у
      `revokeFamiliesOfSessionsTx` вход уже перечень идентификаторов —
      `[]string{string(id)}`), либо собственный выход переводится на ту же
      дверь. Отдельно: привести шапку `:305-307` в соответствие с деревом ОДНОЙ
      правкой того же коммита, и завести пробу, судящую НАБЛЮДАЕМОЕ — до выхода
      обновляющий токен ротируется, после выхода нет. Принцип полосы («состояние,
      которого нельзя выразить, не нужно сторожить») тут применён наполовину: в
      отличие от пары отсечек, у пары «снятие / отзыв» НИ ОДНОГО гейта дерева
      нет, дверь держится только прозой.

  - id: PAIRED-CUTOFF-ROWS-DISAGREE-ON-REASON-AND-ACTOR
    tag: '[HALF-APPLIED CONTROL]'
    coordinates:
      - internal/repo/kaname/pg/minted_token_revocation_repo.go:77
      - internal/repo/kaname/pg/user_token_revocations_repo.go:47
    claim: >-
      Расхождение семантики конфликта двух операторов отсечки, названное прежней
      записью латентным (important[6]) с явным предсказанием «становится живым
      ровно в тот момент, когда исполняется critical[1]», СТАЛО ЖИВЫМ и не
      закрыто. `subjectCutoffRowSQL` защищает причину и актора замком
      (`reason = CASE WHEN EXCLUDED.revoke_before >= … END`, то же у
      `revoked_by_user_id` и `updated_at`); `upsertMintedCutoffSQL` переписывает
      `reason` и `revoked_by` БЕЗУСЛОВНО (`= EXCLUDED.`). Обе строки кладёт ОДНА
      дверь ОДНИМ вызовом — и на проигравшей записи они расходятся.
    measured: >-
      1) Полоса входа несёт момент РАНЬШЕ административного: `UpsertCutoff`
         получает `RevokeBefore = revocationMoment(...)` — «на единицу
         разрешения хранилища РАНЬШЕ первой аутентификации личности»
         (`humansession/logout.go:86`, `logout.go:115-121`), а административный
         путь несёт `RevokeBefore: now`
         (`internal_iam/force_logout.go:282`, `:320`).
      2) Живые вызывающие полосы входа: `humansession/logout.go:92`,
         `change_password.go`, `recovery_complete.go`, `user/reset_second_factor.go`
         — все через `humanSessionWriter.UpsertCutoff` → дверь.
      3) Следствие на проигравшей записи: `user_token_revocations` СОХРАНЯЕТ
         причину и актора администратора (замок), а
         `minted_token_revocations` ПЕРЕПИСЫВАЕТ их на «logout» /
         `kaname:logout`, сохранив момент администратора (GREATEST).
      4) Шапка `upsertMintedCutoffSQL` (`:74-75`) по-прежнему утверждает «Форма
         совпадает со схемными писателями … монотонный GREATEST одинаков у
         всех» — верно про МОМЕНТ и умалчивает о расхождении с
         записью-сиблингом ровно в том, ради чего замок заводился. Диффом
         четырёх последних коммитов этот файл тронут на 6 строк, и ни одна из
         них расхождения не касается (переименование `mintedCutoffExecutor` →
         `cutoffExecutor`).
    consequence: >-
      Запись, по которой судит авторитет отзыва НА ПУТИ ЗАПРОСА, называет
      неверную причину и неверного принявшего решение: административный отзыв
      отображается как выход человека. Оспорить отсечку и разобрать инцидент по
      ней больше нельзя, а сиблинг рядом говорит другое. Заведено это ТЕМ ЖЕ
      изменением, которое сделало полосу входа писателем второй записи.
    requirement: >-
      Привести `upsertMintedCutoffSQL` к замку сиблинга (`reason`/`revoked_by`
      переписываются только вместе с принятым моментом) — либо назвать
      расхождение решением в шапке ОБОИХ операторов и в шапке двери, и завести
      предмет с предикатом снятия. Проба — на наблюдаемом уровне: положить
      административную отсечку, затем отсечку полосы входа с меньшим моментом,
      утверждать причину и принявшего решение на ОБЕИХ записях.

# ── ВАЖНЫЕ ─────────────────────────────────────────────────────────────────
important:
  - id: PROPAGATION-THROUGH-CALLS-MASKS-A-CONDITIONAL-SECOND-WRITE
    coordinate: internal/check/revocation_writer_has_a_caller.go:300
    claim: >-
      Достраивание множества таблиц ЧЕРЕЗ ВЫЗОВ (`PropagateTablesThroughCalls`)
      заведено верно — ложная находка на собственной двери снята, ось
      `TestPairedCutoffInjection_SecondRecordThroughACallIsSeen` этот факт
      утверждает и несёт свою проверку осмысленности («до достраивания дверь
      читается писателем одной записи»). Но достраивание СЛИШКОМ ШИРОКО в ту
      сторону, которая гасит находки, а не рождает их: множество склеивается по
      ГОЛОМУ ИМЕНИ, без пакета, приёмника и достижимости, поэтому вызов в
      недостижимой ветви засчитывается как запись второй строки.
    measured_by_experiment: >-
      ПЕРЕМЕРЕНО ИНЪЕКЦИЕЙ, а не выведено. В `humanSessionWriter.UpsertCutoff`
      подставлен прямой `w.tx.Exec(ctx, subjectCutoffRowSQL, …)` плюс вызов
      `upsertMintedCutoff` В ЗАВЕДОМО МЁРТВОЙ ВЕТВИ
      (`if u.Reason == "never-happens-sentinel"`). Гейт
      `TestSubjectCutoffWritersWriteBothRecords` ПРОМОЛЧАЛ (ok, 0.453s) —
      при том, что тот же дефект БЕЗ мёртвой ветви он ловит и называет
      координатой. Дерево восстановлено.
    why_it_matters_here: >-
      Довод шапки («направление ошибки то же, что у соседнего гейта: ложная
      находка у гейта о безопасности заставляет снимать сам гейт») к ЭТОМУ гейту
      не переносится. У соседнего щедрость теряет находку о МЁРТВОМ коде; здесь
      она теряет находку о ЖИВОМ половинном снятии доступа — и теряет её у
      прибора, который шапка двери объявляет ЕДИНСТВЕННЫМ держателем:
      «Пока его нет, дверь держит гейт дерева
      `TestSubjectCutoffWritersWriteBothRecords`»
      (`user_token_revocations_repo.go:95-97`).
    missing_axis: >-
      В инъекционном наборе пяти осей нет отрицательного контроля НА САМО
      ДОСТРАИВАНИЕ: ни одна ось не утверждает, что оно НЕ засчитывает то, чего
      писатель не делает на каждом пути.
    requirement: >-
      Либо сузить достраивание (засчитывать вызов, стоящий на безусловном пути
      тела, а не любой найденный обходом), либо назвать эту границу ПЯТЫМ
      пунктом в перечне «чего разбор не видит» — там же, где полоса назвала
      четвёртый. И в обоих случаях завести ось инъекции на эту границу: перечень
      границ, названный не полностью, хуже отсутствующего — это довод самой
      полосы.

  - id: DOOR-IS-ONE-DOOR-BUT-NOT-ALWAYS-ONE-TRANSACTION
    coordinate: internal/repo/kaname/pg/user_token_revocations_repo.go:102
    claim: >-
      Дверь принимает `cutoffExecutor` — «пул ЛИБО транзакция»
      (`minted_token_revocation_repo.go:84`). На ПУЛЕ два `Exec` суть два
      автокоммита: первая запись коммитится, и отказ второй оставляет
      «одну без другой» В БАЗЕ. Код состояние выразить не даёт, данные — дают.
      Текст отказа самого гейта говорит «класть обе ОДНОЙ дверью И ОДНОЙ
      ТРАНЗАКЦИЕЙ» (`paired_cutoff_writers_test.go:133`) — на пуловом пути
      второе неправда.
    aggravating: >-
      Проверки входа ВТОРОЙ записи (пустой субъект, пустой решивший) стоят в
      `upsertMintedCutoff` (`minted_token_revocation_repo.go:97-103`), то есть
      ПОСЛЕ того, как первая уже исполнена. На транзакции это покрывает откат;
      на пуле отказ проверки оставляет первую запись закоммиченной.
    liveness: >-
      Латентно. Пуловый путь — `UserTokenRevocationRepo.UpsertRevokeAll` (:66),
      его единственный вызывающий `SessionRevocationsAdapter.RevokeAllUserTokens`
      (`hook_pool_adapters.go:154`), и у НЕГО производственного вызывающего нет:
      перепись `grep -rn 'RevokeAllUserTokens\b' --include=*.go | grep -v Tx`
      даёт объявление, прозу и поля proto-сообщения. Все живые записи отсечки
      идут транзакцией.
    requirement: >-
      Либо дверь открывает собственную транзакцию, когда исполнитель — пул (и
      тогда `cutoffExecutor` перестаёт принимать пул), либо снять пуловый путь
      вместе с его единственным делегатом, либо сузить обещание «одной
      транзакцией» до транзакционного исполнителя — в шапке двери и в тексте
      отказа гейта.

  - id: LATENT-REMAINDERS-WITHOUT-A-SUBJECT
    coordinates:
      - internal/apps/kaname/api/internal_iam/force_logout.go:401   # «РЕШЕНО: нужна миграция…»
      - internal/apps/kaname/api/internal_iam/force_logout.go:410   # «ПРЕДИКАТ СНЯТИЯ ОСТАТКА: словарь…»
      - internal/check/provider_road_posture_answer.go:50           # «ПРЕДИКАТ СНЯТИЯ ОСТАТКА: у каждого потребителя…»
      - cmd/kaname/wiring.go:1183                                   # «остаток заводится своей задачей»
      - internal/apps/kaname/api/internal_iam/force_logout.go:347   # НОВЫЙ: неперемеренная нога довода + предикат
    claim: >-
      Маркера отсрочки ни одного — запрет #11 в буквальной форме соблюдён. Но
      третий законный исход ban11 требует ЗАВЕДЁННОГО ПРЕДМЕТА с причиной и
      предикатом снятия. Причина и предикат выписаны образцово во всех пяти
      местах; номера заведённой задачи не несёт ни одно. `wiring.go:1183` прямо
      говорит «заводится своей задачей» — то есть ещё не заведена. Прежняя
