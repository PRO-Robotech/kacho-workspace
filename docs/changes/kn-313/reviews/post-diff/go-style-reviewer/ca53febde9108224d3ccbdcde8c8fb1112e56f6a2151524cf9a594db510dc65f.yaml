# ── КРИТИЧЕСКИЕ (блокируют посадку) ────────────────────────────────────────
critical:
  - id: EXECUTOR-DISCRIMINATOR-DOES-NOT-DISCRIMINATE
    tag: '[SECURITY/ATOMICITY COMMENT CONTRADICTS CODE] + [UNDECLARED NESTED TRANSACTION]'
    coordinates:
      - internal/repo/kaname/pg/user_token_revocations_repo.go:115   # шапка ветви
      - internal/repo/kaname/pg/user_token_revocations_repo.go:120   # сама ветвь
      - internal/repo/kaname/pg/minted_token_revocation_repo.go:142  # объявление признака
    claim: >-
      Признак, которым дверь отличает пул от транзакции вызывающего, НЕ ОТЛИЧАЕТ
      их. `cutoffTxBeginner` требует метод `Begin(ctx) (pgx.Tx, error)`, и он
      есть У САМОГО `pgx.Tx`: в pgx v5 интерфейс `Tx` несёт
      `Begin(ctx context.Context) (Tx, error)` — псевдо-вложенную транзакцию на
      SAVEPOINT. Значит ветвь `if beginner, ok := ex.(cutoffTxBeginner); ok`
      берётся и на ТРАНЗАКЦИИ вызывающего, и дверь открывает свою вложенную —
      ровно то, что шапка объявляет невозможным и нежелательным.
    measured_by_experiment: >-
      ПЕРЕМЕРЕНО ЭКСПЕРИМЕНТОМ, а не выведено. Во внутрипакетную пробу
      `internal/repo/kaname/pg` подставлено НЕ-nil значение конкретного типа,
      реализующего `pgx.Tx` (`type fakeTx struct{ pgx.Tx }`), и проверено
      утверждение типа: `var ex cutoffExecutor = fakeTx{}; _, ok :=
      ex.(cutoffTxBeginner)` — ok ИСТИНА. Рядом компилируется статическое
      утверждение `var _ cutoffTxBeginner = (pgx.Tx)(nil)`, то есть
      удовлетворение есть и по системе типов, не только у подставленного типа.
      Источник перемерен пином: `go.mod` несёт `github.com/jackc/pgx/v5 v5.10.0`,
      `…/pgx/v5@v5.10.0/tx.go:122-124` — `type Tx interface { // Begin starts a
      pseudo nested transaction. Begin(ctx context.Context) (Tx, error) …}`.
      Временный файл пробы снят, `git status --porcelain` = 0.
    live_callers_taking_the_wrong_branch:
      - internal/repo/kaname/pg/tx.go:262                    # writeTx.UpsertUserTokenRevokeAll, поле tx pgx.Tx (:39)
      - internal/repo/kaname/pg/human_session_repo.go:493    # humanSessionWriter.UpsertCutoff, поле tx pgx.Tx (:212)
      - internal/repo/kaname/pg/user_token_revocations_repo.go:164  # UpsertRevokeAllTx, параметр tx pgx.Tx
    consequence: >-
      1) КОММЕНТАРИЙ О МЕХАНИЗМЕ СНЯТИЯ ДОСТУПА ПРОТИВОРЕЧИТ КОДУ, и это тот
         самый класс, который полоса чинит везде: следующий писатель прочтёт
         «на транзакции своей не заводится» и будет рассуждать о пути, которого
         нет. Прежняя запись вела ровно такой класс как половину критического.
      2) ВСЕ ЖИВЫЕ ЗАПИСИ ОТСЕЧКИ ИДУТ ТРАНЗАКЦИЕЙ (довод самой полосы,
         important[2] прошлого круга), значит ветвь, объявленная пуловой,
         берётся на КАЖДОЙ живой записи: `SAVEPOINT` и `RELEASE SAVEPOINT` на
         каждую отсечку — два лишних обращения, которых никто не решал.
      3) ПОВЕДЕНИЕ НА ОТКАЗЕ ИЗМЕНЕНО МОЛЧА: отказ внутри `writeBothCutoffs`
         теперь гасится `ROLLBACK TO SAVEPOINT`, и внешняя транзакция остаётся
         пригодной, тогда как прежде отказ оператора отравлял её целиком.
         Сегодня все три вызывающих отказ пробрасывают и откатывают внешнюю —
         но свойство «половина не переживёт отказа» держится теперь их
         дисциплиной, а не отравлением транзакции, и это нигде не сказано.
      4) РЕШЕНИЕ «различать их надо» НЕ ИСПОЛНЕНО: признак различения
         тождественно истинен на обоих исполнителях.
    no_holder: >-
      Прибора у этого свойства нет. Новая проба
      `TestIntegration_PoolDoorIsAtomicToo`
      (`cutoff_writers_write_both_integration_test.go:306`) утверждает ДВЕ вещи:
      негодный вход не оставляет первой записи, и годный кладёт обе. Ни одна из
      них не отличает «одной транзакцией» от «двумя автокоммитами»: обе записи
      оказываются на месте и без транзакции. Имя пробы обещает атомарность,
      утверждения её не судят — проба объявляет свойство, которого не меряет.
      Ни один гейт дерева ветвь исполнителя не читает.
    requirement: >-
      Различать исполнителя признаком, который РАЗЛИЧАЕТ: принимать пул по его
      конкретному типу (`ex.(*pgxpool.Pool)`), либо дать двери отдельный вход
      для пула и отдельный для транзакции, либо потребовать от признака метод,
      которого у `pgx.Tx` нет. Шапки `user_token_revocations_repo.go:115-118` и
      `minted_token_revocation_repo.go:142-146` привести к тому, что делает код,
      ТЕМ ЖЕ коммитом. Пробу — на РАЗЛИЧАЮЩЕЕ свойство: отказ второй записи на
      пуловом исполнителе не оставляет первой в базе; на транзакции вызывающего
      дверь своей не открывает. Утверждение о присутствии обеих строк этого
      свойства не судит по построению.

