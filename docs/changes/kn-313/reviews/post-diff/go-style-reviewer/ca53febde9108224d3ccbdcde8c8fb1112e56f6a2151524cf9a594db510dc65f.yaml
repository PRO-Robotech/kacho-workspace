  claim_2_reason_and_actor_lock:
    status: ПОДТВЕРЖДЕНО — прежнее critical[2] снято по существу; довод об остатке ГОДЕН
    what_the_code_does: >-
      `upsertMintedCutoffSQL` (`minted_token_revocation_repo.go:92-102`) несёт
      тот же замок, что и сиблинг: `reason`, `revoked_by` и `updated_at`
      переписываются только `CASE WHEN EXCLUDED.revoke_before >= …`. Форма
      побайтово того же рода, что у `subjectCutoffRowSQL`
      (`user_token_revocations_repo.go:48-57`). Шапка (`:66-91`) приведена к
      делу: она называет, ЧЕМ прежняя редакция ограничивалась, КОГДА следствие
      наступило и ЧТО теперь.
    residual_argument_judged: >-
      Остаточное расхождение названо: схемные писатели той же строки
      (`kaname.minted_cutoff_on_client_removal`,
      `kaname.minted_cutoff_on_owner_deactivation`) переписывают причину и
      актора БЕЗУСЛОВНО. ПЕРЕМЕРЕНО МНОЙ, а не принято со слов:
      `internal/migrations/0001_initial.sql:1262-1295` — в обеих функциях
      `SET … reason = EXCLUDED.reason, revoked_by = EXCLUDED.revoked_by,
      updated_at = now()`, без `CASE WHEN`. Довод «они SQL, и правит их
      миграция, то есть другая полоса» верен по дереву: файл применённой
      миграции (ban05 — не правится), а новой миграции дифф не несёт.
      Предикат снятия НАЗВАН И ИСПОЛНИМ: «у функций `minted_cutoff_on_*` стоит
      тот же `CASE WHEN` по моменту, что и здесь» — предикат читается по дереву
      и опровержим в обе стороны. Это законный третий исход ban11 — с одной
      недостачей, общей для всех остатков полосы: номера заведённой задачи нет
      (important[2]).
    liveness_of_the_residual: >-
      Латентно и узко: триггеры пишут `now()`, и переписывают чужое только
      проиграв момент, то есть при стоящей отсечке в будущем. Классом это
      остаётся тем же, что чинился в Go, — и потому название с предикатом
      здесь правильный исход, а не отговорка.

