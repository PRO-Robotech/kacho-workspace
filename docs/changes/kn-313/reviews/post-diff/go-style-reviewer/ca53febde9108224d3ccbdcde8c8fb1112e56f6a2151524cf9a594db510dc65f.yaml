approved:
  third_ending_method_revokes: >-
    ПОДТВЕРЖДЕНО экспериментом и переписью (см. reexamined.claim_1). Дверь пары
    «снятие / отзыв» получила прибор, прибор заводился НЕ на нуле (2 находки на
    прежнем дереве, `EndSession` назван поимённо), помощник-половинка СНЯТ, а не
    выведен исключением, и оператор исполняется в самой двери.
  reason_and_actor_lock: >-
    ПОДТВЕРЖДЕНО чтением обоих операторов и миграции. Замок тождествен сиблингу;
    остаток схемных писателей назван с предикатом, который я перемерил сам и
    нашёл верным.
  narrow_gluing: >-
    ПОДТВЕРЖДЕНО МОИМ замером на одном дереве двумя приборами: 5 против 4,
    разница — живой пуловый путь. Необычный результат оказался верным, и он
    означает ровно то, чего опасалось задание: широкая склейка засчитывала
    непокрытое как покрытое.
  input_checks_before_the_first_statement: >-
    ПОДТВЕРЖДЕНО чтением: проверки вынесены отдельной функцией и стоят до любого
    оператора; довод выписан у самой функции.
  probes_judge_the_observable: >-
    Три новые интеграционные пробы судят НАБЛЮДАЕМОЕ состояние и несут
    положительный близнец прежде отрицания (ротация обязана проходить ДО
    выхода). Фикстура кладётся тем же писателем, что и продукт. Оговорка по
    имени пуловой пробы — important[1].
  gate_census_and_refusals: >-
    Оба гейта печатают перепись пятью числами, падают на пустом обходе (порог
    файлов), несут отдельные отказы на «операторов первой половины ноль» и
    «операторов второй половины ноль», ведомостей исключений не имеют. Отказ
    прогона на кешируемом запуске (`-count=1`) сработал у меня первым же
    прогоном — прибор отличает «прочитано ноль» от «находок ноль».
  no_panic_in_prod_path: >-
    Добавленных `panic(`, `log.Fatal`, `Must*` в прод-коде диффа — одно
    вхождение, `regexp.MustCompile` на пакетной переменной гейта: не путь
    запроса.
  no_raw_context_and_no_todo: >-
    `context.Background()`/`context.TODO()` в добавленных прод-строках — 0
    (перемерено по составу диффа с исключением `*_test.go`). `ctx` первым
    аргументом у всех новых функций, включая `writeBothCutoffs`.
  error_wrapping_and_no_echo: >-
    `status.Error*(…, err.Error())` в добавленных прод-строках — 0. `%v` вместо
    `%w` — одно вхождение, печать поднятого значения в `recover()`, где `%w`
    неприменим. Новые обёртки идут через `mapErr`/`wrapPgErr`.
  layering: >-
    Направление зависимостей цело. `cutoffExecutor`/`cutoffTxBeginner` — узкие
    интерфейсы, объявленные у потребителя в слое repo; use-case
