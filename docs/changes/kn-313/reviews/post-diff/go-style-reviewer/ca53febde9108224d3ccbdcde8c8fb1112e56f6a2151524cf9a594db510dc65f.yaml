# ── перемеренное, что НЕ является находкой этого диффа ─────────────────────
measured_not_a_finding:
  red_packages_by_a_foreign_predicate: >-
    Три пакета красны по чужому предикату отбора миграций, один — по подписи
    восьми старых коммитов, проверка на гонки неисполнима. Названо заданием как
    предмет другой полосы; диффа не касается и мною не судится. Исход линтера и
    проб я не объявляю (сырой вывод читает landing-reviewer, независимый
    перемер — check-verifier); прогоны выше делались РАДИ НАХОДКИ и названы
    поимённо вместе с командой.
  savepoint_semantics: >-
    Вложенная транзакция pgx НЕ ломает свойство «обе записи или ни одной»:
    `RELEASE SAVEPOINT` на успехе и `ROLLBACK TO SAVEPOINT` на отказе оставляют
    пару целой внутри внешней транзакции. Находка critical[1] — не о целости
    пары, а о признаке, который не различает, и о шапке, которая утверждает
    обратное коду.
