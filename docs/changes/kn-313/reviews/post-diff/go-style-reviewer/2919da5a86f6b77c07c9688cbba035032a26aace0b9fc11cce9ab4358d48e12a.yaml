critical:
  - id: CUTOFF-HALF-WRITTEN-ON-SELF-SERVICE-PATHS
    tag: '[HALF-APPLIED CONTROL]'
    coordinate: internal/repo/kaname/pg/human_session_repo.go:434
    claim: >-
      Полоса закрыла «отсечка пишется в одну запись, а читатель предъявления
      спрашивает другую» ТОЛЬКО на пути распорядителя. Тот же дефект остался
      живым на четырёх путях полосы входа: `humanSessionWriter.UpsertCutoff`
      исполняет ОДИН оператор `upsertRevokeAllSQL`
      (`internal/repo/kaname/pg/user_token_revocations_repo.go:44`), то есть
      пишет только `user_token_revocations`, и НЕ пишет
      `minted_token_revocations`.
    live_callers:
      - internal/apps/kaname/api/humansession/logout.go:92        # собственный выход человека
      - internal/apps/kaname/api/humansession/change_password.go:203  # смена пароля
      - internal/apps/kaname/api/humansession/recovery_complete.go:234 # завершение восстановления
      - internal/apps/kaname/api/user/reset_second_factor.go:184  # сброс второго фактора
    measured: >-
      Читатель пути запроса — `tokenrevocation.Revoked` над
      `MintedTokenRevocationRepo.RevokedBefore`
      (`internal/repo/kaname/pg/minted_token_revocation_repo.go:43`,
      `SELECT revoke_before FROM kaname.minted_token_revocations`), и именно он
      провязан публичному слушателю (`cmd/kaname/serve.go:941`, `:1474`) — это
      утверждает и новая проба диффа
      `force_logout_minted_cutoff_integration_test.go`. Схемные писатели этой же
      строки закрывают ДРУГИЕ события: триггеры
      `sa_oauth_client_removal_cuts_minted_tokens`,
      `service_account_deactivation_cuts_minted_tokens`,
      `user_deactivation_cuts_minted_tokens`,
      `user_oauth_client_removal_cuts_minted_tokens`
      (`internal/migrations/0001_initial.sql:5255,5276,5297,5304`) — снятие
      клиента и деактивация владельца; выход, смену пароля, восстановление и
      сброс второго фактора они не покрывают. Иных писателей
      `minted_token_revocations` в Go-дереве нет: единственный оператор —
      `upsertMintedCutoffSQL`.
    consequence: >-
      Дословно тот довод, который дифф сам выписал в
      `hook_pool_adapters.go:199`: «снятие доступа, дошедшее до одной и не
      дошедшее до другой, есть контроль, исполненный наполовину и выглядящий
      исполненным целиком». После смены пароля личный токен, выпущенный до неё,
      продолжает проходить предъявление.
    requirement: >-
      Провести `upsertMintedCutoff` в ту же транзакцию писателя полосы входа —
      тем же приёмом, что применён на пути распорядителя
      (`internal/repo/kaname/pg/hook_pool_adapters.go:242`), — либо завести
      предмет с причиной и предикатом снятия. Радиус ищется по имени механизма
      («писатель отсечки предъявления»), а не по диффу, в котором дефект
      замечен.
    note_on_the_fix: >-
      Правка немедленно упрётся в important[6]: два оператора отсечки расходятся
      семантикой конфликта, и запись полосы входа несёт момент РАНЬШЕ
      административного.

  - id: SESSION-END-LANES-DIVERGE-ON-FAMILY-REVOCATION
    tag: '[HALF-APPLIED CONTROL]'
    coordinate: internal/repo/kaname/pg/human_session_repo.go:287
    claim: >-
      Оператор снятия сведён ВЕРНО (см. approved.operator_consolidation), но
      расхождение, ради устранения которого его сводили, переехало на уровень
      выше — в функции вокруг оператора. Из двух исполнителей `endSessionsOfSQL`
      семейства выданного отзывает только `EndAllSessions`
      (`human_session_repo.go:376` → `revokeFamiliesOfSessionsTx`);
      `EndOtherSessions` получает от `endSessionsOf` ТЕ ЖЕ идентификаторы снятых
      записей и отбрасывает их (`return len(ended), nil`,
      `human_session_repo.go:292`).
    live_callers_of_the_uncovered_lane:
      - internal/apps/kaname/api/humansession/change_password.go:196
      - internal/apps/kaname/api/humansession/sf_remove.go:123
      - internal/apps/kaname/api/humansession/recovery_complete.go:231
    measured: >-
      Ротацию обновляющего токена останавливает РОВНО отзыв семейства:
      `rotateRefreshSQL`
      (`internal/repo/kaname/pg/oauth_ceremony_repo.go:287-296`) гасит ротацию
      условием `NOT EXISTS (… token_families f WHERE f.id = t.family_id AND
      f.revoked_at IS NOT NULL)` и НЕ смотрит ни на `human_sessions.ended_at`,
      ни на одну из двух отсечек (в файле нет ни одного вхождения
      `revoke_before`). Привязка `token_families_session_fk … ON DELETE CASCADE`
      (`internal/migrations/20260920175117_authorization_code_is_our_record.sql:76`)
      срабатывает на УДАЛЕНИИ строки, а снятие строку не удаляет.
    consequence: >-
      Дословно тот вред, который дифф сам выписал в
      `oauth_ceremony_repo.go:436`: «обновляющий токен снятой сессии живёт и
      ротируется в свежие, а окно равно величине УДЕРЖАНИЯ — то есть настройке
      хранения, а не решению о безопасности». После смены пароля и после сброса
      второго фактора это ровно так и есть, а после принудительного выхода — нет.
      Асимметрия ЗАВЕДЕНА этим диффом: до него семейства не отзывал ни один путь
      снятия сессии.
    requirement: >-
      Либо `EndOtherSessions` зовёт `revokeFamiliesOfSessionsTx` той же `w.tx`
      теми же возвращёнными идентификаторами, либо расхождение названо предметом
      с предикатом снятия и шапка `endSessionsOfSQL`
      (`human_session_repo.go:268`) перестаёт обещать, что сведение оператора
      закрывает расхождение полос.

