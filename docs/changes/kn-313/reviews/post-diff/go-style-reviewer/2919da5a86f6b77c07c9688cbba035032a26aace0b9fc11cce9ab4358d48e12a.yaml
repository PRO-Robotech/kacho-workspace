foundation_candidates: []
foundation_note: >-
  Горизонтального выноса изменение не порождает. Обход дерева взят пином у
  фундамента (`corelib/treecorpus`), идентификаторы — `corelib/ids`, операции —
  `corelib/operations`, пул — `corelib/db`; ни одной локальной копии чужого
  файла в диффе нет, `go.mod`/`go.sum` не тронуты. `endSessionsOfSQL`,
  `upsertMintedCutoff`, `revokeFamiliesOfSessionsTx` — доменная логика kaname и
