# ── одобрено: что проверено и на чём ───────────────────────────────────────
approved:
  two_cutoffs_one_transaction: >-
    ПОДТВЕРЖДЕНО. Обе записи лежат на одной `tx`, открытой
    `hook_pool_adapters.go:175` и закоммиченной `:254`:
    `userRepo.UpsertRevokeAllTx(ctx, tx, …)` на `:180` и
    `upsertMintedCutoff(ctx, tx, …)` на `:242`, между ними — событие журнала
    `emitAuditTx(ctx, tx, …)`. `defer tx.Rollback(ctx)` на `:179` покрывает отказ
    в середине: отказ второй записи откатывает первую, частичного снятия не
    бывает by construction. Пути, где кладётся только одна, ВНУТРИ этого метода
    нет. Путь СНАРУЖИ — есть, и это critical[1] и important[1].
  minted_cutoff_executor_port: >-
    `mintedCutoffExecutor` — узкий интерфейс на один метод `Exec`, объявленный у
    потребителя; пул и транзакция исполняют его одинаково, проверки входа (пустой
    субъект, пустой решивший) стоят в одном месте `upsertMintedCutoff`, а не у
    каждого вызывающего. Ограничение схемы
    `minted_token_revocations_decider_ck` (длина 1..128) замещающим значением
    `"kaname:" + eventType` удовлетворяется: самое длинное сегодня —
    `kaname:iam.session.force_logout`, 31 символ.
  non_atomicity_of_teardown_argument: >-
    ДОВОД ПРИНЯТ в границах этого диффа. Отсечка коммитится первой
    (`force_logout.go:320`), снятие идёт следом своей транзакцией
    (`EndAllSessions`, `human_session_repo.go:351`), и `EndAllSessions` ВНУТРИ
    атомарна: снятие строк и отзыв семейств лежат на одной `tx`
    (`:355`…`:381`). Направление отказа безопасное — отсечка остаётся, глагол
    отвечает Unavailable, повтор накладывает ту же отсечку и повторяет то же
    снятие; обе операции идемпотентны (`GREATEST` у отсечки, `ended_at IS NULL` у
    снятия, `revoked_at IS NULL` у семейств). Порядок тот же, каким уже шёл путь
    чужого поставщика.
  non_atomicity_unverified_leg: >-
    ОДНА НОГА ДОВОДА НЕ ПЕРЕМЕРЕНА ЗДЕСЬ. «Отсечка защитна сама по себе»
    опирается на то, что край сравнивает момент аутентификации с отсечкой
    (приёмка Ф3-25). Дифф про край ничего не утверждает и правильно делает; но
    из этого следует, что при отказе ПОСЛЕ коммита отсечки и ДО снятия защита
    держится краем, которого этот дифф не измеряет. Предмет — не моя роль
    (system-design-reviewer / security-auditor); называю, чтобы довод не читался
    как измеренный целиком.
  operator_consolidation: >-
    ПОДТВЕРЖДЕНО, третьего писателя нет. Перемер:
    `grep -rn -A3 'UPDATE human_sessions' --include=*.go` по не-тестовому дереву
    даёт четыре оператора — `endSessionsOfSQL` (:279), `EndSession` по одному id
    (:260), `RotateBearer` (:394) и обновление предъявленного (:417); последние
    три меняют ДРУГИЕ колонки либо адресуют одну строку. У `endSessionsOfSQL`
    ровно два исполнителя: `EndOtherSessions` (:288) и `EndAllSessions` (:361),
    оба через `endSessionsOf`. Оговорка о семантике вокруг оператора —
    critical[2].
  absence_marker_compared_by_value: >-
    ПОДТВЕРЖДЕНО. `refuseNoSuchClient` (`oauth_ceremony_repo.go:80`) несёт
    признак `iamerr.ErrNotFound`, и обёртка причину НЕ теряет: `iamerr.Wrapf`
    (`internal/errors/errors.go:190`) собирает `fmt.Errorf("%w: "+format,
    sentinel, …)`, то есть признак стоит в цепочке. Потребитель сравнивает ПО
    ЗНАЧЕНИЮ — `stderrors.Is(err, iamerr.ErrNotFound)`
    (`own_interactive_client_provider.go:166`), не по тексту. Три копии текста
    (`:641`, `:660`, `:679`) сведены в одного производителя. Проба
    `own_interactive_client_provider_integration_test.go` утверждает признак
    отдельным положительным контролем прежде, чем опереть на него
    идемпотентность.
  gates_as_code: >-
    Оба гейта судят ДЕРЕВО, а не ведомость; предмет подаётся ИМЕНЕМ
    (`postureAnswerBuilder = "mustProviderAdminClient"`, суффикс `_revocations`),
    а не выводится. Потолки — замер по факту (оба 0), и оба называют число, на
    котором заводились (4 и 1). Предпосылка отдельной функцией
    (`ProviderRoadCallPremise`, `RevocationWriterPremise`), и проверяется она
    ВЫЗОВОМ на синтетике, а не чтением ветви. Пустой обход вердикта не выносит;
    порог файлов (300) отделяет «предмета нет» от «до дерева не дошли». Инъекция
    в обе стороны, дефект и близнец отличаются ровно одним фактом, каждая
    инъекция сверх исхода утверждает ПЕРЕПИСЬ. Ведомостей исключений,
    allowlist'ов и skip-списков ни одного. Текст находки несёт координату
    `файл:строка`, имя функции, таблицу и ПРИЧИНУ отдельным полем (`Form`,
    `Why`) — «его не зовут» и «по имени не разобрать» не слиты в одно. Оговорка
    о неназванном слепом пятне — important[4].
  posture_answer_by_value: >-
    Решение «дорога есть / дороги нет» вынесено ВТОРЫМ возвращаемым значением
    (`wiring.go:1059`), а не предикатом, который можно позвать и не прочесть:
    связанное и неиспользованное имя — ошибка сборки, поэтому «связан» влечёт
    «прочитан». Все потребители ответ принимают
    (`provider_compensation_wiring.go:64`, `wiring.go:1111`, `:1132`, `:1211`).
  clean_nil_not_typed_nil: >-
    `forceLogoutProviderSessions` и `forceLogoutOwnSessions` возвращают ЧИСТЫЙ
    nil интерфейса (`return nil, nil` / `return nil` при объявленном интерфейсном
    типе результата), поэтому страж провязки `if p == nil` / `if s == nil`
    (`force_logout.go:119`, `:171`) срабатывает. Типизированного nil, который
    прошёл бы стража насквозь и упал бы на разыменовании, в диффе нет.
  nil_task_is_checked: >-
    `buildProviderCompensationDrainer` возвращает `(nil, nil)` третьим законным
    исходом, и вызывающий проверяет задачу на nil ПРЕЖДЕ постановки в очередь
    (`serve.go:1796`): nil-задача уронила бы под на разыменовании. Форма возврата
    названа в шапке сборщика (`provider_compensation_wiring.go:45`).
  closed_refusal_instead_of_silent_success: >-
    «Ни одного исполнителя снятия не провязано» стало ЗАКРЫТЫМ отказом
    (`force_logout.go:347`) с пометкой операции ошибкой; прежняя проба,
    утверждавшая обратное, переписана, а не снята
    (`TestForceLogout_NoTeardownWired_RefusesAndKeepsTheCutoff`).
  no_panic_in_prod_path: >-
    `panic(`, `log.Fatal`, `MustParse` в добавленных строках прод-кода — ноль
    (`git diff … | grep '^+' | grep -E 'panic\(|log\.Fatal|Must…'` пуст).
    `log.Fatalf` в `mustProviderAdminClient` — прежний, стоит в композиционном
    корне `cmd/kaname` и исполняется при старте.
  no_error_echo: >-
    Оба новых отказа несут ФИКСИРОВАННЫЙ текст: `codes.Unavailable, "no
    login-session teardown is wired: the cutoff alone does not end a session"`
    и `codes.Unavailable, "could not end the login session"`. `err.Error()` уходит
    в журнал оператору, а не вызывающему.
  no_pii_in_logs: >-
    В добавленных строках журнала — `operation_id`, `user_id`, `sessions_ended`,
    имена ручек (`authn.identity-provider`, `authn.client-token.enabled`).
    Ни адреса, ни телефона, ни носителя, ни свёртки.
  layering: >-
    Направление зависимостей цело. Порты объявлены у потребителя-use-case
    (`ProviderClients` в `interactive_client/ports.go`, `OwnSessions` /
    `ProviderSessions` / `ExternalIDResolver` в `internal_iam/force_logout.go`)
    и несут нейтральные типы (`domain.UserID`, `time.Time`, DTO слоя) — ни
    pgx, ни grpc-стабов в сигнатурах. Адаптер `OwnInteractiveClientProvider`
    живёт в `internal/repo/kaname/pg` и импортирует пакет use-case ради его DTO —
    это норма дерева (так же делают `access_key_repo.go`,
    `human_session_repo.go`, `login_method_repo.go`, `catalog_plan_reader.go` и
    зеркало чужого реестра `internal/clients/hydra_interactive_clients.go`).
    Выбор исполнителя по посадке сделан в композиционном корне, а не ветвью в
    use-case. Глобальных синглтонов и `init()` с побочным эффектом в диффе нет.
  ports_exported_with_reason: >-
    Четыре порта именованы наружу, и причина названа в каждом: корню нужен ТИП,
    чтобы вернуть «никого» чистым nil и чтобы выбор исполнителя был выразим
    типом, а не ветвью внутри use-case.
  error_wrapping: >-
    Новые обёртки несут признак и контекст: `iamerr.Wrapf(iamerr.ErrInvalidArg,
    …)`, `wrapPgErr(err, "TokenFamily", …)`, `mapErr(err, "HumanSession.EndAll",
    …)`. `%v` вместо `%w` в новых строках нет; `err.Error() == "…"` нет.
  naming_ascii: >-
    Все новые идентификаторы латиницей (запрет #17): `endSessionsOfSQL`,
    `upsertMintedCutoff`, `mintedCutoffExecutor`, `refuseNoSuchClient`,
    `revokeFamiliesOfSessionsTx`, `OwnInteractiveClientProvider`,
    `ClientSecretStore`, `ownInteractiveClientIDPrefix`,
    `ownPublicClientAuthMethod`, `ScanProviderRoadCalls`,
    `RevocationWritersWithoutACaller` и прочие. Магических чисел нет — приставка,
    метод удостоверения и причины вынесены константами.
  tests_on_mock_ports: >-
    Пробы слоя use-case стоят на двойниках портов (`recordingOwnSessions`,
    `ownClientRegistryDouble`, `fakeForceLogoutRecorder`) без Postgres; пробы,
    которым нужна база, объявлены интеграционными и снимаются `testing.Short()`.
    Утечки адаптера в пробу слоя нет. Фикстура сессии кладётся ТЕМ ЖЕ писателем,
    что и продукт (`seedOwnLoginSession` → `repo.Writer(ctx).InsertSession`), а
    не своим INSERT'ом — фикстура не снисходительнее продукта.
  cascade_claims_verified: >-
    Утверждения шапки `own_interactive_client_provider.go` о каскадах перемерены
    по схеме: `token_families_client_fk` и `consent_grants` ссылаются на
    `interactive_clients(client_id) ON DELETE CASCADE`
    (`20260920175117…sql:73`, `20260920175119…sql:62`), а
    `authorization_codes_family_fk` и парный ему у `refresh_tokens` — на
    составной ключ `token_families` с тем же каскадом
    (`20260920175117…sql:122`, `:178`). Утверждение о закрытом словаре причин снятия
    сессии тоже верно: `human_sessions_ended_reason_check` несёт `logout`,
    `password-change`, `second-factor-removed`
    (`20260917160000…sql:101`), и `domain.RevokeReasonLogout = "logout"` в нём
    есть.

# ── перемеренное, что НЕ является находкой этого диффа ─────────────────────
measured_not_a_finding:
  per_call_deadline: >-
    Ни `EndAllSessions`, ни `revokeFamiliesOfSessionsTx`, ни `upsertMintedCutoff`
    не ставят собственный `context.WithTimeout`. Это НОРМА дерева, а не регрессия
    диффа: из 79 не-тестовых файлов `internal/repo/kaname/pg` собственный предел
    ставит ОДИН (`reconcile_notify.go`, и там это LISTEN/NOTIFY). Предмет —
    тревое решение, а не эта полоса; называю, чтобы следующая роль не
    перепроверяла.
  internal_check_has_no_prod_importer: >-
    `internal/check/*.go` — не-тестовые файлы без прод-импортёров, и это
    установленная форма этого дерева (так же живёт `internal/repohygiene`):
    разбор вынесен из `_test.go` затем, чтобы инъекционная проба могла подать ему
    настоящий вход из дерева. Под `arch-lean-no-vestigial` не подпадает.
  known_red_on_this_branch: >-
    Со слов задания: три пакета красны по дефекту ЧУЖОГО предиката отбора
    миграций, один — по подписи автора, проверок с обнаружением гонок на машине
    нет (нет компилятора C — третий исход, не красное). Ни одно из этого не
    предмет этого ревью и в вердикт не входит.

