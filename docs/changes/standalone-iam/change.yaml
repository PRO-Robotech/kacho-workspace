# ПРЕЖНЕЙ редакции. Прежние значения: acceptance 3d1fdd73…, design 9bf78c51….
# Следствие названо в design.md §2.3: планы свидетельств с текущими предметами
# больше не сходятся; ни у одного из них исход не был снят.
