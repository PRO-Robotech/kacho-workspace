# Точное множество требуемых держателей изменения issue-3172 — посадка эпика
# kacho#3172 в `main` продукта (запрос kacho#3227). Образец формы —
# `docs/changes/issue-1266/holders.yaml` и `docs/changes/kn-746/holders.yaml`.
#
# ЗДЕСЬ НЕ ОБЪЯВЛЕН НИ ОДИН ИСХОД. Вердикт по человеческому держателю — внешнее
# событие актора из `docs/changes/policy.yaml` §2 (сейчас pointpu) на отпечаток,
# названный в `change.yaml`. Записи агентов вне этого пакета (в том числе
# записи ветки ws `1095-f8-s7-security-settings`) событием роли этого пакета
# не являются и держателя не закрывают.
#
# ПАКЕТ ЗАВЕДЁН ЗАРАНЕЕ: отпечаток `change.yaml` снят 2026-10-16 на
# origin/3172-identity-own-2 71cef905; голова будет обновлена при посадке
# (волна 9 и перенос пина службы доступа), после сдвига каждая запись на
# прежнем отпечатке новую линию не судит (пересчёт — поле `remeasure`).
#
# Признаки применимости измерены в клоне kacho на паре a9524846...71cef905:
#   пути диффа        git diff --name-only <B>...<H> | wc -l                          → 176
#   Go                git diff --name-only <B>...<H> | grep -c '\.go$'                 → 49
#   миграции и .sql   git diff --name-only <B>...<H> -- '*/migrations/*' '*.sql' | wc -l → 0
#   proto             git diff --name-only <B>...<H> -- '*.proto' | wc -l              → 0
#   консоль           git diff --name-only <B>...<H> -- 'ui-future/*' | wc -l          → 78
#   чарты и deploy    git diff --name-only <B>...<H> -- 'deploy/*' | wc -l             → 33
#   слияния в линии   git rev-list --merges --count <B>..<H>                          → 25
#   приёмки           acceptance_set_predicate (`change.yaml`)                        → 1
#   замысел           design_set по `*-design.md` (дом и дифф)                        → 0
schema_version: 1
change_id: issue-3172

# ── ПРИМЕНИМОСТЬ РОЛЕЙ: все роли review_authority ───────────────────────────
# Перечень выведен из `review_authority` политики и сверяется в обе стороны
# `scripts/change-graph-gate/check-04-package-releases-reproduce.sh`; он же
# пересчитывает каждое освобождение на коммите, который судит.
#
# ui-reviewer и security-auditor В РЕЕСТРЕ review_authority НЕТ (policy.yaml
# §2) и строкой раздела стоять не могут. Консоль (78 путей) и периметр (край:
# `gateway/internal/middleware/auth.go`, `authz.go`, `login_lane_paths.go`,
# `auth_session_cutoff.go`; сертификат операторского круга
# `deploy/helm/umbrella/templates/internal-rest-operator-certificate.yaml`)
# затронуты; их разбор — пред-посадочные записи агентов, держателя не
# закрывают. Вердикт по безопасности в контуре несут `system-design-reviewer`
# и `go-style-reviewer` событиями pointpu.
role_applicability:

  # ── освобождены: предмета роли в изменении нет ────────────────────────────

  design-reviewer:
    status: not-applicable
    predicate_id: no-design-document-in-change
    evidence_field: design_documents_referenced
    evidence_value: 0
    evidence_command: >-
      python3 scripts/change-graph-gate/applicability.py field
      design_documents_referenced --package docs/changes/issue-3172 --rev HEAD
    why: >-
      Документа замысла изменение не называет: `design.md` в корне пакета нет,
      `hashes.design_sha256` null; предикат набора (`change.yaml`) по
      `docs/specs/*-design.md` на ревизии d7c42384 находит 0, дифф линии
      `*-design.md` не несёт (0 из 176). Появится замысел — поле станет 1, роль
      применима, её вердикт даёт только событие pointpu на его отпечаток.

  db-architect-reviewer:
    status: not-applicable
    predicate_id: no-migrations-in-change
    evidence_field: migrations_touched
    evidence_value: 0
    evidence_command: >-
      python3 scripts/change-graph-gate/applicability.py field
      migrations_touched --package docs/changes/issue-3172 --rev HEAD
    why: >-
      В диффе kacho 0 путей `*/migrations/*` и `*.sql` из 176. Миграции
      линии identity-own-2 — в службе доступа (пакет `kn-746`, 12 путей), где
      роль применима.

  proto-api-reviewer:
    status: not-applicable
    predicate_id: no-proto-in-change
    evidence_field: proto_files_touched
    evidence_value: 0
    evidence_command: >-
      python3 scripts/change-graph-gate/applicability.py field
      proto_files_touched --package docs/changes/issue-3172 --rev HEAD
    why: >-
      В диффе kacho 0 путей `*.proto` из 176. Контракты линии
      (`internal_iam_service.proto`, `internal_module_service.proto`,
      `fga_model.fga`) меняет служба доступа — пакет `kn-746`, где роль
      применима; kacho получает их пином go.mod.

  # ── применимы: предмет есть, вердикт обязателен ───────────────────────────

  acceptance-reviewer:
    status: applicable
    holder: human-acceptance
    reason: >-
      изменение называет набор из 1 приёмки (`change.yaml`, acceptance_set):
      F8-S7 «экран „Безопасность“ и подтверждение любым заведённым способом»,
      реализация kacho#3230; одобрение — событие роли на её отпечаток.

  class-exposure-analyst:
    status: applicable
    holder: human-class-exposure-initial
    reason: >-
      приёмка названа — первичный разбор привязан к её отпечатку. Перепроверки
      по замыслу нет: замысла изменение не называет.

  go-style-reviewer:
    status: applicable
    holder: human-post-diff-go
    reason: >-
      дифф несёт 49 путей `*.go` (a9524846...71cef905): край
      (`gateway/internal/middleware/`, `restmux/`, `streamrevocation/`,
      `config/`, `linktls/`), `gateway/cmd/api-gateway/main.go`, гейты дерева
      `internal/repohygiene/`, пробы `deploy/*_test.go` и `tools/standns/`.

  system-design-reviewer:
    status: applicable
    holder: human-post-diff-system
    reason: >-
      распределённая поверхность в диффе есть: ребро к службе доступа — пин
      go.mod `github.com/PRO-Robotech/kaname` 3d5b02ed → cd796be9 (ревизия ветки
      kaname `746`, не её `main`); отказ соседа на крае —
      `auth_session_cutoff.go` (отсечка сессии при сбое разбора),
      `introspection_failure_report.go`, `permission_denied_response.go`;
      операторский круг внутреннего слушателя — `linktls/anchor.go` и
      `internal-rest-operator-certificate.yaml`; подчарт службы доступа зонта
      (`charts/kaname/values.yaml`, `templates/configmap.yaml`) и почтовая
      полоса (`identity-mail-lane-guard.yaml`) в боевых профилях.

  wave-reviewer:
    status: applicable
    holder: human-wave
    reason: >-
      линия собрана слияниями волн: `git rev-list --merges --count
      a9524846..71cef905` = 25; предикат `no-lane-merges-in-change` ложен.

  integration-tester:
    status: applicable
    holder: [prod-required-verdict, prod-newman-e2e]
    reason: >-
      роль — владелец проб и первого прогона; дифф трогает
      `services/nlb/tests/newman/` (кейсы и коллекция), `gateway/tests/` и
      сквозные пробы консоли `ui-future/e2e/specs/` (25 путей); отдельной
      человеческой записи не даёт, держит машинных держателей ниже.

  convergence-reviewer:
    status: applicable
    holder: human-convergence
    reason: единственная роль, выпускающая конечную запись контура.

  landing-reviewer:
    status: applicable
    holder: human-landing
    reason: >-
      применённое содержимое сверяется с одобренным после посадки; до неё исход
      держателя — «не выполнилось».

required_holders:

  # ── машинные ──────────────────────────────────────────────────────────────

  prod-required-verdict:
    kind: machine
    owner: integration-tester
    executable: >-
      CI-контекст «сводный вердикт (все проверки завершились и зелены)»
      (.github/workflows/required-verdict.yml) на запросе эпика kacho#3227
    predicate: >-
      сводный вердикт читает завершение ВСЕХ проверок запроса эпика на голове
      из `change.yaml`, а не подмножество
    evidence_coordinate: evidence/prod-required-verdict/
    producer_exists: >-
      `.github/workflows/required-verdict.yml` отслеживается на origin/main
      kacho a9524846 (`git ls-tree --name-only a9524846 .github/workflows/`).

  prod-newman-e2e:
    kind: machine
    owner: integration-tester
    executable: .github/workflows/e2e-newman.yml на запросе эпика kacho#3227
    predicate: >-
      второй эшелон — сквозные пробы края по развёрнутому, отдельно от
      unit/integration (`00-kacho-core.md#ban12-second-echelon`)
    evidence_coordinate: evidence/prod-newman-e2e/
    producer_exists: >-
      `.github/workflows/e2e-newman.yml` отслеживается на origin/main kacho a9524846.

  # ── человеческие ──────────────────────────────────────────────────────────
  # Вердикт выпускает внешнее событие актора из policy.yaml §2, подтверждённое
  # через API. Событий на отпечаток a0af03f4… (и набора приёмок 5779c006…) нет.

  human-acceptance:
    kind: human-external
    owner: acceptance-reviewer
    executable: внешнее review event на отпечаток каждой приёмки набора
    predicate: каждая приёмка набора `change.yaml` acceptance_set одобрена на текущем отпечатке
    evidence_coordinate: evidence/human-acceptance/

  human-class-exposure-initial:
    kind: human-external
    owner: class-exposure-analyst
    executable: внешнее review event на отпечаток набора приёмок
    predicate: пункты exposure приёмок разобраны и сопоставлены
    evidence_coordinate: evidence/human-class-exposure-initial/

  human-post-diff-go:
    kind: human-external
    owner: go-style-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: раскладка слоёв цела, мёртвого кода и маркеров отсрочки нет, пробы в том же изменении
    evidence_coordinate: reviews/post-diff/go-style-reviewer/

  human-post-diff-system:
    kind: human-external
    owner: system-design-reviewer
    executable: внешнее review event на точный отпечаток содержимого изменения
    predicate: распределённые свойства целы, отказ соседа фейлится закрыто, лишних рёбер нет
    evidence_coordinate: reviews/post-diff/system-design-reviewer/
    distributed_surface: true

  human-wave:
    kind: human-external
    owner: wave-reviewer
    executable: внешнее review event на отпечаток собранной линии
    predicate: полосы, лежащие рядом, не решают одну задачу дважды и не отменяют правку соседа
    evidence_coordinate: reviews/wave/wave-reviewer/

  human-convergence:
    kind: human-external
    owner: convergence-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: >-
      множество ролей сверено с review_authority в обе стороны, освобождения
      опираются на зарегистрированные предикаты, записи — на текущем отпечатке
    evidence_coordinate: evidence/human-convergence/

  human-landing:
    kind: human-external
    owner: landing-reviewer
    executable: внешнее review event на посаженное содержимое
    predicate: >-
      канонический набор диффа посаженного совпадает с объявленным в
      `change.yaml` (canonical_diff_set_sha256)
    evidence_coordinate: evidence/human-landing/

# ── отличия от образца `issue-1266` ─────────────────────────────────────────
#   1. Пакет заведён без записей ролей: каталогов `reviews/` и `evidence/` нет;
#      записи появляются событиями ролей на отпечаток `change.yaml`.
#   2. Набор приёмок назван на ревизии ветки ws, а не `main` воркспейса
#      (`change.yaml`, acceptance_set_rev): приёмка F8-S7 ещё в запросе ws#1111.
#   3. Освобождён и `proto-api-reviewer`: proto линии — в службе доступа.
