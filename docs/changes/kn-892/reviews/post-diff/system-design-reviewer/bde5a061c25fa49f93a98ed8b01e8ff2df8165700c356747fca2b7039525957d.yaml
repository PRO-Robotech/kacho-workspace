findings:
  SD-892-1:
    severity: критическая
    where: internal/ceremonyport/client_secrets.go:144; cmd/kaname/ceremony.go:65-78; internal/passwordverify/capacity.go:115-122
    summary: >-
      Ожидание места вычисления сверки секрета клиента ограничено сроком ПОРТА (PortTimeout =
      credentialLanePeerTimeout = 3 с, cmd/kaname/client_token.go:56; ceremony.go:219), а не сроком
      операции: мост фундамента зовёт VerifyClientSecret с context.WithTimeout(ctx, PortTimeout)
      (corelib v1.14.2 oauthceremony/bridge.go:64-65, 374-376). До диффа очередь контекста не читала,
      и сверка, ждавшая дольше 3 с, давала вердикт в сроке операции; теперь она кончается отказом
      port_deadline. Слагаемое очереди в ceremonyOperationDeadline (ёмкость × стоимость) для
      единственного ждущего порта недостижимо, и при очереди длиннее 3 с одновременные обмены
      конфиденциального клиента снова отказывают по сроку — симптом kaname#818/#882. Тексты
      ceremony.go и capacity.go утверждают, что ожидание прерывается контекстом ОПЕРАЦИИ, — это
      неверно (arch-doc-truthfulness). Проба client_secrets_queue_test.go подаёт срок прямо в порт и
      срок порта от срока операции не отличает.
    requirement: >-
      Ожидание места сверкой секрета клиента ограничено сроком операции церемонии (как объявляет
      ceremonyOperationDeadline), а не PortTimeout; либо, если границей выбран срок порта, —
      ceremonyOperationDeadline и тексты ceremony.go/capacity.go/client_secrets.go пересчитаны под неё
      и проба #882 доказывает, что очередь доли укладывается в PortTimeout. Механизм выбирает автор
      (бюджет очереди, переданный порту при сборке; правка моста фундамента пином; иное).
    removal_predicate: >-
      Детерминированная проба (synctest) через мост oauthceremony с PortTimeout P и OperationTimeout
      O > P: сверка, ждущая места дольше P, но меньше O, даёт вердикт (обмен 200); ждущая дольше O —
      отказ port_deadline. Красная на 94c728fe8, зелёная на голове возврата.

