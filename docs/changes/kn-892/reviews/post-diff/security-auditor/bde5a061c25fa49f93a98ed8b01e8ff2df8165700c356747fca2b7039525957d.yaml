    по контексту снимается с очереди, мест не удерживает
  - >-
    изменение СУЖАЕТ прежнее окно: до него вычисление шло и после конца вызова,
    а запись попытки затем падала на отменённом контексте; теперь вызов,
    кончившийся в очереди, не вычисляет вовсе
  - >-
    при совпавшем пароле и прерванной сверке второго фактора попытка не пишется,
    при несовпавшем — пишется; ответ один и тот же (refusalOf -> общий отказ), а
    каждое неверное предъявление пароля по-прежнему считается — ограничение
    подбора держится; ветвь та же, что при настоящем исчерпании ёмкости, до диффа
  - >-
    чеканка хеша мимо мест вычисления — свойство производительности и срока
    очереди, предмета подбора не касается; оговорка в комментарии отражает код
