round1_findings:
  - id: C1
    status: closed
    how: >-
      Чтение заведённых способов снято с участка до точки решения; теперь оно в complete(),
      только у применённого кода и незаблокированной личности, через Writer.LoginMethod
      (recovery_complete.go:321). Зависимость Methods из CompleteRecoveryDeps убрана
      (cmd/kaname/loginlane.go:507), значит use-case достаёт хранилище только через Store.
    evidence: >-
      Эксперимент на снимке head вне git-деревьев (/home/dk/.cache/review-305/src):
      TestRecovery_WrongCodeRefusalDoesTheSameStoreWorkForNobodyAndForSomeone PASS, на всех
      трёх вариантах «адрес есть» по 12 обращений, столько же у «адреса нет». Положительный
      контроль: у полосы выдачи 17 обращений, и в ряду есть чтение способов. Инъекция: вернул
      чтение enrolledMethods(ctx, w.LoginMethod, …) до ConsumeRecoveryCode при found. Проба
      стала красной, 14 обращений против 12. Правку откатил, снимок сверен с head побайтно.
  - id: I1
    status: closed
    how: >-
      Перечень «Порядок внутри обращения» (recovery_complete.go:24-30) и шапка complete()
      (:248-251) идут в порядке кода: точка решения → материал → снятие сессий → отсечка →
      журнал → выдача → чтение заведённого → решение о счёте → событие → фиксация.
  - id: I2
    status: closed
    how: >-
      completed_login.go:127-131 прямо называет, что завершение восстановления сюда не ходит.
      Перепись в пробе конструкторов дала 5 полос и CompleteRecoveryUseCase в них нет, что
      совпадает с кодом.

