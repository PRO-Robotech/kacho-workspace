critical:
  - id: C1
    class: REFUSAL-LANE-PARITY
    coordinate: internal/apps/kaname/api/humansession/recovery_complete.go:203-206
    finding: >-
      Свойство неразличимости полос отказа завершения (recovery-of-access Р7, §8 инв. 4;
      утверждение в recovery-of-access.md:384-386) изменением не держится: новое чтение
      заведённых способов стоит ДО единой точки отказа и исполняется только на одной из двух
      полос отказа, поэтому работа двух полос до отказа стала неравной. До правки полосы
      исполняли одну и ту же работу.
    evidence: >-
      Одноразовая проба (удалена, дерево чистое): счётчик чтений хранилища способов на двух
      полосах отказа завершения при head — 0 против 2; отказ на обеих полосах тот же
      (ErrAuthenticationFailed). Чтения на base нет по построению (зависимости Methods не было).
    requirement: >-
      Решение о счёте не должно добавлять работы, которую одна полоса отказа исполняет, а другая
      нет. Допустимо: читать заведённое только после применения кода и на соединении самой
      транзакции записи (метод порта Writer, делегированный адаптеру способов — как
      replaceLoginVerifierTx), без вложенного захвата пула; либо равная работа на обеих полосах.
      Плюс проба уровня use-case, запирающая равенство работы двух полос отказа (красная на head).
    return_to: 'автор полосы kaname#305 (исполнитель реализации)'

important:
  - id: I1
    class: DOC-TRUTH
    coordinate: internal/apps/kaname/api/humansession/recovery_complete.go:24-29, 247-249
    finding: >-
      Раздел «Порядок внутри обращения — несущий» и шапка complete() перечисляют «событие»
      до «выдачи сессии» и решение о счёте последним; код: выдача → решение о счёте → событие
