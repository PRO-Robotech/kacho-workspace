# Versioned policy Change Graph — корень доверия ПОСЛЕ cutover.
#
# Приёмка: docs/specs/sub-phase-SDD-1-kacho-change-graph-acceptance.md (§4, §5, §8).
# До cutover действует единственное bootstrap-исключение Issue #480; с момента
# cutover оно недействительно, и вся authority читается ОТСЮДА.
#
# Роль в этом файле — КООРДИНАТА, а не доказательство личности: actor обязан быть
# подтверждён внешним GitHub-событием при каждой проверке. Список ниже сужает
# «кому позволено», но сам по себе никого не аутентифицирует.
schema_version: 1
schema: docs/changes/policy.schema.json

# --- 1. Две координаты repository: у каждого DAG свой cutover ---------------
#
# SHA привязан к repo НАМЕРЕННО: одинаково валидный по форме SHA другого repo
# обязан отвергаться (SDD-1-POLICY-05). Проверено в обе стороны при записи —
# каждый существует в своём repo и отсутствует в соседнем.
repositories:
  - repo: PRO-Robotech/kacho-workspace
    cutover_commit: 1202e3cf5f6cb4600294ceb2e30fa72b61630eac
    verified:
      method: GET /repos/{repo}/commits/{sha}
      exists_in_named_repo: true
      absent_in_sibling_repo: true
      checked_at: '2026-09-02T11:05:48Z'
  - repo: PRO-Robotech/kacho
    cutover_commit: c2d573654cd755c6bbc6755ff0874c8c83501004
    verified:
      method: GET /repos/{repo}/commits/{sha}
      exists_in_named_repo: true
      absent_in_sibling_repo: true
      checked_at: '2026-09-02T11:05:48Z'

# --- 2. Реестр полномочий --------------------------------------------------
#
# Разрешённый actor — необходимое условие, не достаточное: gate обязан получить
# внешнее событие через API и сверить digest тела и subject. Самообъявленная
# роль без события authority не даёт (приёмка §4).
review_authority:
  # единственный, кто выпускает effective approval приёмки
  acceptance-reviewer: [pointpu]
  # initial analysis и revalidation exposure items
  class-exposure-analyst: [pointpu]
  # вердикт по design
  design-reviewer: [pointpu]
  # specialist post-diff: схема и миграции
  db-architect-reviewer: [pointpu]
  # specialist post-diff: Go
  go-style-reviewer: [pointpu]
  # specialist post-diff: контракт
  proto-api-reviewer: [pointpu]
  # specialist post-diff: распределённые свойства
  system-design-reviewer: [pointpu]
  # владелец tests/**, fixtures и первого прогона
  integration-tester: [pointpu]
  # единственный, кто выпускает final durable record
  convergence-reviewer: [pointpu]
  # сверяет applied content и записывает landed SHA
  landing-reviewer: [pointpu]

# --- 3. Реестр применимости ------------------------------------------------
#
# N/A законен ТОЛЬКО по id отсюда и ТОЛЬКО с evidence, удовлетворяющим предикату
# (приёмка §5). Свободный текст evidence не является. Предикат машинно проверяем:
# назван путь в evidence и условие на его значение — иначе «выполнен» решался бы
# чтением прозы, а это ровно то, что реестр и запрещает.
applicability_predicates:
  - id: no-migrations-in-change
    role: db-architect-reviewer
    evidence_field: migrations_touched
    satisfied_when: equals
    value: 0
  - id: no-proto-in-change
    role: proto-api-reviewer
    evidence_field: proto_files_touched
    satisfied_when: equals
    value: 0
  - id: no-acceptance-document-in-change
    role: acceptance-reviewer
    evidence_field: acceptance_documents_referenced
    satisfied_when: equals
    value: 0
    note: >-
      Предмет — legacy-изменение, заведённое ДО Change Graph и не несущее приёмки
      (правка, тех-долг, batch). Предикат существует, чтобы отсутствие приёмки было
      ЗАЯВЛЕНО и проверяемо, а не изображено пустой строкой в acceptance_path.

# --- 4. Перепись наследия --------------------------------------------------
legacy_census:
  path: docs/changes/census/1c85491a8335882c7abc47a690a267d0464f19623348e15f552e2644a89a45b0.yaml
  sha256: 1c85491a8335882c7abc47a690a267d0464f19623348e15f552e2644a89a45b0

# --- 5. Реестр наследия: exact-set со снимком переписи ----------------------
#
# Ровно 60 координат — столько же, сколько в snapshot переписи. Лишняя запись и
# пропущенная активная — обе RED (SDD-1-CENSUS-08/09).
#
# Route у всех legacy, и это не умолчание: пакета Change Graph нет ни у одного
# из этих изменений, потому что на момент cutover формата пакета ещё не
# существует. Legacy-маршрут ровно для того и заведён. Route migrate выбирается
# ОСОЗНАННО и требует пакета (SDD-1-CENSUS-12/13); изменение observable contract
# на legacy-маршруте — RED (SDD-1-CENSUS-11).
#
# acceptance_repo назван отдельно от пути: приёмки живут в ВОРКСПЕЙСЕ, поэтому у
# задачи ПРОДУКТА путь резолвится в соседнем дереве. Путь без repo двусмыслен.
