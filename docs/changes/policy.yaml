# Versioned policy Change Graph — корень доверия ПОСЛЕ cutover.
#
# Приёмка: docs/specs/sub-phase-SDD-1-kacho-change-graph-acceptance.md (§4, §5, §8).
# До cutover действует единственное bootstrap-исключение Issue #480; с момента
# cutover оно недействительно, и вся authority читается ОТСЮДА.
#
# Роль в этом файле — КООРДИНАТА, а не доказательство личности: actor обязан быть
# подтверждён внешним GitHub-событием при каждой проверке. Список ниже сужает
# «кому позволено», но сам по себе никого не аутентифицирует.
schema_version: 1
schema: docs/changes/policy.schema.json

# --- 1. Две координаты repository: у каждого DAG свой cutover ---------------
#
# SHA привязан к repo НАМЕРЕННО: одинаково валидный по форме SHA другого repo
# обязан отвергаться (SDD-1-POLICY-05). Проверено в обе стороны при записи —
# каждый существует в своём repo и отсутствует в соседнем.
repositories:
  - repo: PRO-Robotech/kacho-workspace
    cutover_commit: 1202e3cf5f6cb4600294ceb2e30fa72b61630eac
    verified:
      method: GET /repos/{repo}/commits/{sha}
      exists_in_named_repo: true
      absent_in_sibling_repo: true
      checked_at: '2026-09-02T11:05:48Z'
  - repo: PRO-Robotech/kacho
    cutover_commit: c2d573654cd755c6bbc6755ff0874c8c83501004
    verified:
      method: GET /repos/{repo}/commits/{sha}
      exists_in_named_repo: true
      absent_in_sibling_repo: true
      checked_at: '2026-09-02T11:05:48Z'

# --- 2. Реестр полномочий --------------------------------------------------
#
# Разрешённый actor — необходимое условие, не достаточное: gate обязан получить
# внешнее событие через API и сверить digest тела и subject. Самообъявленная
# роль без события authority не даёт (приёмка §4).
review_authority:
  # единственный, кто выпускает effective approval приёмки
  acceptance-reviewer: [pointpu]
  # initial analysis и revalidation exposure items
  class-exposure-analyst: [pointpu]
  # вердикт по design
  design-reviewer: [pointpu]
  # specialist post-diff: схема и миграции
  db-architect-reviewer: [pointpu]
  # specialist post-diff: Go
  go-style-reviewer: [pointpu]
  # specialist post-diff: контракт
  proto-api-reviewer: [pointpu]
  # specialist post-diff: распределённые свойства
  system-design-reviewer: [pointpu]
  # владелец tests/**, fixtures и первого прогона
  integration-tester: [pointpu]
  # приёмка волны: единственный, кто видит диффы всех полос РЯДОМ (внесено
  # 2026-09-22, ws#766). Посадка волны требует её вердикта (нормы ws#763);
  # применима роль только к изменению, собранному из нескольких полос, — это
  # решает предикат `no-lane-merges-in-change` в §3, а не отметка автора пакета.
  wave-reviewer: [pointpu]
  # единственный, кто выпускает final durable record
  convergence-reviewer: [pointpu]
  # сверяет applied content и записывает landed SHA
  landing-reviewer: [pointpu]

# --- 3. Реестр применимости ------------------------------------------------
#
# N/A законен ТОЛЬКО по id отсюда и ТОЛЬКО с evidence, удовлетворяющим предикату
# (приёмка §5). Свободный текст evidence не является. Предикат машинно проверяем:
# назван путь в evidence и условие на его значение — иначе «выполнен» решался бы
# чтением прозы, а это ровно то, что реестр и запрещает.
#
# ЧИСЛО ПОЛЯ ПРОИЗВОДИТ ОДНА ПРОГРАММА, а не строка оболочки в пакете (внесено
# 2026-09-22):
#   python3 scripts/change-graph-gate/applicability.py field <поле> --package docs/changes/<id> --rev HEAD
# Она читает КОММИТ, а не индекс; опознаёт клон по cutover-коммиту из §1, а не по
# имени каталога; ревизии линии берёт из манифеста пакета; на непрочитанном
# дереве числа не выдаёт вовсе (код 2, пустой stdout). Эта строка — единственная
# форма `evidence_command`, которую принимает сверка: освобождения КАЖДОГО пакета
# с этим реестром в обе стороны пересчитывает
# `scripts/change-graph-gate/check-04-package-releases-reproduce.sh`, а
# способность производителя отказать доказывает
# `scripts/change-graph-gate/selftest/prove_applicability.py`. Прежняя форма
# `git ls-files … | wc -l` давала 0 и освобождение на несуществующем корне, на
# опечатке, в чужом клоне и вне git (код 128 терялся в трубе), не видела клаузы
# `hashes` и читала индекс вместо коммита — приёмка `check-verifier` 2026-09-22,
# опыты N1, N2, E1, E2, H1, I5.
applicability_predicates:
  - id: no-migrations-in-change
    role: db-architect-reviewer
    evidence_field: migrations_touched
    satisfied_when: equals
    value: 0
  - id: no-proto-in-change
    role: proto-api-reviewer
    evidence_field: proto_files_touched
    satisfied_when: equals
    value: 0
  - id: no-acceptance-document-in-change
    role: acceptance-reviewer
    evidence_field: acceptance_documents_referenced
    satisfied_when: equals
    value: 0
    note: >-
      Предмет — legacy-изменение, заведённое ДО Change Graph и не несущее приёмки
      (правка, тех-долг, batch). Предикат существует, чтобы отсутствие приёмки было
      ЗАЯВЛЕНО и проверяемо, а не изображено пустой строкой в acceptance_path.

  # ── Две ДОСОБЫТИЙНЫЕ роли (внесено 2026-09-22) ────────────────────────────
  #
  # До этой правки реестр нёс ТРИ предиката на ДЕСЯТЬ ролей, и двух дособытийных
  # среди них не было. Следствие измерено, а не предположено: для изменения, не
  # несущего документов замысла, роли `class-exposure-analyst` и `design-reviewer`
  # УДОВЛЕТВОРИТЬ нельзя (предмета не существует) и ОСВОБОДИТЬ нельзя
  # (идентификатора предиката под них в реестре нет) — конечная запись контура
  # недостижима ПО ПОСТРОЕНИЮ. Перепись по ОТСЛЕЖИВАЕМОМУ дереву базы 6e5b9a60:
  # пакетов 2, из них 1 (`issue-2713`) несёт только `reviews/`; исходов
  # `convergence-reviewer` 0 (план свидетельства
  # `standalone-iam/evidence/human-convergence/` исхода не несёт) —
  # `git ls-tree -r --name-only 6e5b9a60 docs/changes/`. Здесь прежде стояло
  # «11 живых пакетов из 12»: это число рабочего дерева общей копии ВМЕСТЕ с
  # неотслеживаемыми каталогами, то есть перепись чужих черновиков, а не дерева
  # (опровергнуто приёмкой `check-verifier` 2026-09-22).
  #
  # Оба предиката отвечают на вопрос О ДЕРЕВЕ — «несёт ли изменение документ» —
  # и НЕ отвечают на вопрос о намерении: «замысел не требовался» числом не
  # является и этих полей не заполняет.
  - id: no-design-document-in-change
    role: design-reviewer
    evidence_field: design_documents_referenced
    satisfied_when: equals
    value: 0
    note: >-
      ПРЕДМЕТ. Роль судит ОДИН артефакт — документ замысла изменения (`design.md`
      пакета): её держатель `human-design` есть внешнее событие на ОТПЕЧАТОК
      этого документа (§7). Изменения, не несущего документа замысла, роли не на
      чем отсудить: нет отпечатка, к которому вердикт привязался бы.

      ПОЧЕМУ ОСВОБОЖДАЕТ. Роль освобождается ПОТОМУ, ЧТО ПРЕДМЕТА НЕТ, а не
      потому, что разбор замысла необязателен. Там, где документ есть, вердикт
      роли обязателен и ничем не заменяется — ни запиской, ни ссылкой на
      обсуждение, ни высказыванием соседней роли.

      ЧИСЛО — О ДЕРЕВЕ, НА НАЗВАННОЙ РЕВИЗИИ. Документ замысла НАЗВАН
      изменением, если `docs/changes/<change_id>/design.md` отслеживается на
      коммите `--rev` ИЛИ `hashes.design_sha256` манифеста пакета на том же
      коммите не null — документ вне каталога пакета и висячий отпечаток оба
      остаются предметом роли. Отпечаток пустой строкой — тоже название:
      отсутствие заявляется предикатом, а не изображается пустым полем. Поле
      равно 0 или 1. Производитель — `applicability.py field
      design_documents_referenced --package docs/changes/<change_id> --rev
      HEAD`: он читает коммит, а не индекс, и печатает объём осмотренного.
      Числа НЕТ вовсе (код 2, пустой stdout) вне git, в клоне без этого реестра
      или без cutover-коммита §1 предком ревизии, на ревизии без корня пакета
      или без его манифеста: ноль непрочитанного дерева не есть ноль находок, и
      опечатка в `change_id` освобождения не покупает. Командой, называющей
      ЧУЖОЙ существующий пакет, — тоже: сверка принимает только каноническую
      строку для пакета, в каталоге которого лежит `holders.yaml`.

      ГДЕ ОН ОТВЕЧАЕТ «НЕТ». Изменение, несущее `docs/changes/<id>/design.md`,
      даёт 1 — предикат ложен, роль применима, её запись обязана лежать по
      отпечатку этого документа. ПУСТОЙ ДОКУМЕНТ ОСВОБОЖДЕНИЯ НЕ ДАЁТ: считается
      НАЛИЧИЕ файла, а не его содержательность, поэтому пустой `design.md` тоже
      даёт 1, и роль обязана высказаться — и, высказавшись, пустой замысел
      отклонить. Предикат по НЕПУСТЫМ документам обращал бы опорожнение файла в
      способ снять роль.

      ГРАНИЦА. Освобождение снимает обязанность ИМЕТЬ вердикт и не касается
      ПОЛНОМОЧИЯ: неопубликованный вердикт им опубликованным не становится, и
      запись роли без подтверждённого внешнего события остаётся RED по §2 этого
      файла и §4 приёмки независимо от предиката. Сверка идёт в ОБЕ стороны:
      запись освобождённой роли в пакете означает, что предмет всё-таки был, и
      тогда ложно освобождение, а не запись. Эту сторону держит `check-04`:
      след освобождённой роли в пакете — каталог с её именем либо свидетельство
      её держателя — находка.
  - id: no-exposure-subject-document-in-change
    role: class-exposure-analyst
    evidence_field: exposure_subject_documents_referenced
    satisfied_when: equals
    value: 0
    note: >-
      ПРЕДМЕТ. У роли ДВА держателя, и у каждого свой артефакт (§5): первичный
      разбор привязан к отпечатку ПРИЁМКИ, перепроверка — к отпечатку ЗАМЫСЛА.
      Поэтому поле считает ОБА документа вместе. Изменение, не несущее НИ ОДНОГО
      из них, не даёт ни одного артефакта, к отпечатку которого привязалась бы
      запись ЛЮБОГО из двух держателей роли. Это не то же, что «у роли нет
      предмета», — см. «ЧЕГО ПОЛЕ НЕ ВИДИТ» ниже.

      ПОЧЕМУ СОЮЗ, А НЕ ДВА ПРЕДИКАТА. Предикат, ключующийся на одном документе,
      снимал бы роль ЦЕЛИКОМ — вместе со вторым её держателем, предмет которого
      налицо. Это и было бы расширением освобождения сверх предмета.

      ЧИСЛО — О ДЕРЕВЕ, НА НАЗВАННОЙ РЕВИЗИИ. Сумма по двум документам,
      `acceptance.md` и `design.md`: каждый НАЗВАН, если его файл отслеживается
      в корне пакета на коммите `--rev` ИЛИ его отпечаток
      (`hashes.acceptance_sha256`, `hashes.design_sha256`) в манифесте на том же
      коммите не null. Поле равно 0, 1 или 2. Производитель —
      `applicability.py field exposure_subject_documents_referenced --package
      docs/changes/<change_id> --rev HEAD`; отказы — те же, что у
      `no-design-document-in-change`: на непрочитанном дереве числа нет.

      ГДЕ ОН ОТВЕЧАЕТ «НЕТ». Любой из двух документов налицо — поле даёт 1 или 2,
      предикат ложен, роль применима. Пустой документ считается наличным — тот же
      разбор, что у `no-design-document-in-change`.

      СОСТОЯНИЕ «ОДИН ЕСТЬ, ДРУГОГО НЕТ» — НЕ СОСТОЯНИЕ СХОЖДЕНИЯ, и предикат
      намеренно не делает его освобождением. Пакет с приёмкой и без замысла стоит
      ДО DESIGN_APPROVED (§5), а схождение идёт ПОСЛЕ него. Честный ответ такому
      пакету — «он не в CONVERGED», а не «роль освобождена»: второе сняло бы
      обязанность, у которой предмет есть.

      ЧЕГО ПОЛЕ НЕ ВИДИТ — И ЭТО ОТКРЫТЫЙ ВОПРОС ПОЛИТИКИ, А НЕ «ПРЕДМЕТА НЕТ».
      Приёмка SDD-1 §5: «Новый external call, async path либо sentinel является
      новым exposure item и требует mapping + revalidation». Поле считает
      документы и таких пунктов в диффе не видит: изменение без документов,
      вводящее новый асинхронный путь, этим предикатом освобождается. Первый
      такой случай — `issue-2713` (2026-09-22): его линия вводит `go func(` в
      `gateway/internal/restmux/backend_call_deadline.go:90`, на базе ac33f733
      совпадений 0 (измерено приёмкой `check-verifier`). Законно ли такое
      освобождение, решает владелец: либо это политика — «без документов
      держателям роли не к чему привязать запись», — и тогда она стоит здесь
      этими словами, либо предикату нужно второе условие (пунктов exposure в
      диффе 0), а такому изменению — приёмка и замысел. До решения условие
      предиката не меняется, а этот абзац не даёт прочесть освобождение как
      отсутствие предмета.

      ГРАНИЦА. Та же, что у `no-design-document-in-change`: полномочия
      освобождение не касается, сверка идёт в обе стороны.

  # ── Приёмка волны (внесено 2026-09-22, ws#766) ─────────────────────────────
  #
  # Роль `wave-reviewer` заведена в §2 той же правкой: посадка волны требует её
  # вердикта (нормы ws#763), а без строки в реестре этот вердикт некому было бы
  # засчитать. Применима роль не к каждому изменению — только к собранному из
  # НЕСКОЛЬКИХ полос, — поэтому вместе с ней заведён предикат, освобождающий
  # изменение из одной полосы. Без него запись схождения такого изменения снова
  # была бы недостижима по построению: вердикта роли нет и не будет, а
  # освободить нечем.
  - id: no-lane-merges-in-change
    role: wave-reviewer
    evidence_field: lane_merges_in_change
    satisfied_when: equals
    value: 0
    note: >-
      ПРЕДМЕТ. Роль судит то, что видно, только когда полосы лежат РЯДОМ: два
      решения одной задачи, два имени одного предмета, правку и её отмену в
      соседней полосе. У изменения из одной полосы сравнивать не с чем — такого
      предмета нет by construction.

      ЧИСЛО — О ДЕРЕВЕ, НА НАЗВАННЫХ РЕВИЗИЯХ. Коммиты слияния в линии каждого
      репозитория, который манифест пакета называет С ГОЛОВОЙ:
      `git rev-list --merges --count <base_sha>..<head_sha>`, сумма по
      репозиториям. Производитель — `applicability.py field
      lane_merges_in_change --package docs/changes/<change_id> --rev HEAD`:
      `base_sha` и `head_sha` он берёт из манифеста на коммите `--rev`, а не из
      командной строки; клон опознаёт по cutover-коммиту репозитория из §1
      (предок базы), а не по имени каталога; базу требует предком головы. Числа
      НЕТ (код 2) у манифеста без головы — линии ещё нет, и освобождения нет, —
      у клона без ревизий линии и у пустого диапазона.

      ГДЕ ОН ОТВЕЧАЕТ «НЕТ». Любое слияние в линии даёт 1 и больше — роль
      применима. Слияние СТВОЛА в полосу считается тоже: предикат намеренно
      ошибается в строгую сторону, и полоса, которой нужно освобождение,
      перебазируется на ствол, а не сливает его в себя.

      ЧЕГО ПОЛЕ НЕ ВИДИТ — И ЧЕМ ЭТО ДЕРЖИТСЯ. Линия, собранная из нескольких
      полос ПЕРЕНОСОМ коммитов (cherry-pick, rebase, squash) без коммитов
      слияния, даёт 0 и освобождается. Форму сборки волны — слияние голов
      полос в одну ветку — держит вниманием тот, кто волну собирает
      (`git-operator`), а не этот предикат.

      ГРАНИЦА. Освобождение снимает обязанность ИМЕТЬ вердикт и не касается
      ПОЛНОМОЧИЯ: вердикт роли засчитывается только внешним событием актора из
      §2. Сверка идёт в обе стороны: след `wave-reviewer` в пакете при
      освобождении — находка `check-04`.
# --- 4. Перепись наследия --------------------------------------------------
legacy_census:
  path: docs/changes/census/1c85491a8335882c7abc47a690a267d0464f19623348e15f552e2644a89a45b0.yaml
  sha256: 1c85491a8335882c7abc47a690a267d0464f19623348e15f552e2644a89a45b0

# --- 5. Реестр наследия: exact-set со снимком переписи ----------------------
#
# Ровно 60 координат — столько же, сколько в snapshot переписи. Лишняя запись и
# пропущенная активная — обе RED (SDD-1-CENSUS-08/09).
#
# Route у всех legacy, и это не умолчание: пакета Change Graph нет ни у одного
# из этих изменений, потому что на момент cutover формата пакета ещё не
# существует. Legacy-маршрут ровно для того и заведён. Route migrate выбирается
# ОСОЗНАННО и требует пакета (SDD-1-CENSUS-12/13); изменение observable contract
# на legacy-маршруте — RED (SDD-1-CENSUS-11).
#
# acceptance_repo назван отдельно от пути: приёмки живут в ВОРКСПЕЙСЕ, поэтому у
# задачи ПРОДУКТА путь резолвится в соседнем дереве. Путь без repo двусмыслен.
legacy_changes_count: 60
legacy_changes:
  - issue: https://github.com/PRO-Robotech/kacho/issues/693
    coordinate: PRO-Robotech/kacho#693
    kind: live-issue
    acceptance_repo: null
    acceptance_path: null
    acceptance_absence_predicate: no-acceptance-document-in-change
    route: legacy
  - issue: https://github.com/PRO-Robotech/kacho/issues/695
    coordinate: PRO-Robotech/kacho#695
    kind: live-issue
    acceptance_repo: null
    acceptance_path: null
    acceptance_absence_predicate: no-acceptance-document-in-change
    route: legacy
  - issue: https://github.com/PRO-Robotech/kacho/issues/707
    coordinate: PRO-Robotech/kacho#707
    kind: live-issue
