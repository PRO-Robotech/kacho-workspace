# Versioned policy Change Graph — корень доверия ПОСЛЕ cutover.
#
# Приёмка: docs/specs/sub-phase-SDD-1-kacho-change-graph-acceptance.md (§4, §5, §8).
# До cutover действует единственное bootstrap-исключение Issue #480; с момента
# cutover оно недействительно, и вся authority читается ОТСЮДА.
#
# Роль в этом файле — КООРДИНАТА, а не доказательство личности: actor обязан быть
# подтверждён внешним GitHub-событием при каждой проверке. Список ниже сужает
# «кому позволено», но сам по себе никого не аутентифицирует.
schema_version: 1
schema: docs/changes/policy.schema.json

# --- 1. Две координаты repository: у каждого DAG свой cutover ---------------
#
# SHA привязан к repo НАМЕРЕННО: одинаково валидный по форме SHA другого repo
# обязан отвергаться (SDD-1-POLICY-05). Проверено в обе стороны при записи —
# каждый существует в своём repo и отсутствует в соседнем.
repositories:
  - repo: PRO-Robotech/kacho-workspace
    cutover_commit: 1202e3cf5f6cb4600294ceb2e30fa72b61630eac
    verified:
      method: GET /repos/{repo}/commits/{sha}
      exists_in_named_repo: true
      absent_in_sibling_repo: true
      checked_at: '2026-09-02T11:05:48Z'
  - repo: PRO-Robotech/kacho
    cutover_commit: c2d573654cd755c6bbc6755ff0874c8c83501004
    verified:
      method: GET /repos/{repo}/commits/{sha}
      exists_in_named_repo: true
      absent_in_sibling_repo: true
      checked_at: '2026-09-02T11:05:48Z'

# --- 2. Реестр полномочий --------------------------------------------------
#
# Разрешённый actor — необходимое условие, не достаточное: gate обязан получить
# внешнее событие через API и сверить digest тела и subject. Самообъявленная
# роль без события authority не даёт (приёмка §4).
review_authority:
  # единственный, кто выпускает effective approval приёмки
  acceptance-reviewer: [pointpu]
  # initial analysis и revalidation exposure items
  class-exposure-analyst: [pointpu]
  # вердикт по design
  design-reviewer: [pointpu]
  # specialist post-diff: схема и миграции
  db-architect-reviewer: [pointpu]
  # specialist post-diff: Go
  go-style-reviewer: [pointpu]
  # specialist post-diff: контракт
  proto-api-reviewer: [pointpu]
  # specialist post-diff: распределённые свойства
  system-design-reviewer: [pointpu]
  # владелец tests/**, fixtures и первого прогона
  integration-tester: [pointpu]
  # единственный, кто выпускает final durable record
  convergence-reviewer: [pointpu]
  # сверяет applied content и записывает landed SHA
  landing-reviewer: [pointpu]

# --- 3. Реестр применимости ------------------------------------------------
#
# N/A законен ТОЛЬКО по id отсюда и ТОЛЬКО с evidence, удовлетворяющим предикату
# (приёмка §5). Свободный текст evidence не является. Предикат машинно проверяем:
# назван путь в evidence и условие на его значение — иначе «выполнен» решался бы
# чтением прозы, а это ровно то, что реестр и запрещает.
applicability_predicates:
  - id: no-migrations-in-change
    role: db-architect-reviewer
    evidence_field: migrations_touched
    satisfied_when: equals
    value: 0
  - id: no-proto-in-change
    role: proto-api-reviewer
    evidence_field: proto_files_touched
    satisfied_when: equals
    value: 0
  - id: no-acceptance-document-in-change
    role: acceptance-reviewer
    evidence_field: acceptance_documents_referenced
    satisfied_when: equals
    value: 0
    note: >-
      Предмет — legacy-изменение, заведённое ДО Change Graph и не несущее приёмки
      (правка, тех-долг, batch). Предикат существует, чтобы отсутствие приёмки было
      ЗАЯВЛЕНО и проверяемо, а не изображено пустой строкой в acceptance_path.

  # ── Две ДОСОБЫТИЙНЫЕ роли (внесено 2026-09-22) ────────────────────────────
  #
  # До этой правки реестр нёс ТРИ предиката на ДЕСЯТЬ ролей, и двух дособытийных
  # среди них не было. Следствие измерено, а не предположено: для изменения, не
  # несущего документов замысла, роли `class-exposure-analyst` и `design-reviewer`
  # УДОВЛЕТВОРИТЬ нельзя (предмета не существует) и ОСВОБОДИТЬ нельзя
  # (идентификатора предиката под них в реестре нет) — конечная запись контура
  # недостижима ПО ПОСТРОЕНИЮ. Перепись, на которой это снято: 11 живых пакетов
  # `docs/changes/*/` из 12 несут только `reviews/`, записей схождения в дереве
  # ноль (`ls docs/changes/*/`, 2026-09-22).
  #
  # Оба предиката отвечают на вопрос О ДЕРЕВЕ — «несёт ли изменение документ» —
  # и НЕ отвечают на вопрос о намерении: «замысел не требовался» числом не
  # является и этих полей не заполняет.
  - id: no-design-document-in-change
    role: design-reviewer
    evidence_field: design_documents_referenced
    satisfied_when: equals
    value: 0
    note: >-
      ПРЕДМЕТ. Роль судит ОДИН артефакт — документ замысла изменения (`design.md`
      пакета): её держатель `human-design` есть внешнее событие на ОТПЕЧАТОК
      этого документа (§7). Изменения, не несущего документа замысла, роли не на
      чем отсудить: нет отпечатка, к которому вердикт привязался бы.

      ПОЧЕМУ ОСВОБОЖДАЕТ. Роль освобождается ПОТОМУ, ЧТО ПРЕДМЕТА НЕТ, а не
      потому, что разбор замысла необязателен. Там, где документ есть, вердикт
      роли обязателен и ничем не заменяется — ни запиской, ни ссылкой на
      обсуждение, ни высказыванием соседней роли.

      ЧИСЛО — О ДЕРЕВЕ. Считаются документы замысла, которые изменение НЕСЁТ:
      `git ls-files docs/changes/<change_id>/design.md | wc -l`, плюс
      `hashes.design_sha256` в `change.yaml`, если пакет называет документ вне
      своего каталога. Обход обязан напечатать объём осмотренного: ноль,
      полученный на НЕСУЩЕСТВУЮЩЕМ корне пакета, есть непрочитанное дерево, а не
      ноль находок, и освобождения не даёт. Иначе опечатка в `change_id`
      покупала бы освобождение.

      ГДЕ ОН ОТВЕЧАЕТ «НЕТ». Изменение, несущее `docs/changes/<id>/design.md`,
      даёт 1 — предикат ложен, роль применима, её запись обязана лежать по
      отпечатку этого документа. ПУСТОЙ ДОКУМЕНТ ОСВОБОЖДЕНИЯ НЕ ДАЁТ: считается
      НАЛИЧИЕ файла, а не его содержательность, поэтому пустой `design.md` тоже
      даёт 1, и роль обязана высказаться — и, высказавшись, пустой замысел
      отклонить. Предикат по НЕПУСТЫМ документам обращал бы опорожнение файла в
      способ снять роль.

      ГРАНИЦА. Освобождение снимает обязанность ИМЕТЬ вердикт и не касается
      ПОЛНОМОЧИЯ: неопубликованный вердикт им опубликованным не становится, и
      запись роли без подтверждённого внешнего события остаётся RED по §2 этого
      файла и §4 приёмки независимо от предиката. Сверка идёт в ОБЕ стороны:
      запись освобождённой роли в пакете означает, что предмет всё-таки был, и
      тогда ложно освобождение, а не запись.
  - id: no-exposure-subject-document-in-change
    role: class-exposure-analyst
    evidence_field: exposure_subject_documents_referenced
    satisfied_when: equals
    value: 0
    note: >-
      ПРЕДМЕТ. У роли ДВА держателя, и у каждого свой артефакт (§5): первичный
      разбор привязан к отпечатку ПРИЁМКИ, перепроверка — к отпечатку ЗАМЫСЛА.
      Поэтому поле считает ОБА документа вместе. Изменение, не несущее НИ ОДНОГО
      из них, не даёт роли ни одного предмета.

      ПОЧЕМУ СОЮЗ, А НЕ ДВА ПРЕДИКАТА. Предикат, ключующийся на одном документе,
      снимал бы роль ЦЕЛИКОМ — вместе со вторым её держателем, предмет которого
      налицо. Это и было бы расширением освобождения сверх предмета.

      ЧИСЛО — О ДЕРЕВЕ. `git ls-files docs/changes/<change_id>/acceptance.md
      docs/changes/<change_id>/design.md | wc -l`, плюс `hashes.acceptance_sha256`
      и `hashes.design_sha256` в `change.yaml`, если пакет называет документы вне
      своего каталога. Обход печатает объём осмотренного; ноль на несуществующем
      корне пакета — непрочитанное дерево, а не ноль находок.

      ГДЕ ОН ОТВЕЧАЕТ «НЕТ». Любой из двух документов налицо — поле даёт 1 или 2,
      предикат ложен, роль применима. Пустой документ считается наличным — тот же
      разбор, что у `no-design-document-in-change`.

      СОСТОЯНИЕ «ОДИН ЕСТЬ, ДРУГОГО НЕТ» — НЕ СОСТОЯНИЕ СХОЖДЕНИЯ, и предикат
      намеренно не делает его освобождением. Пакет с приёмкой и без замысла стоит
      ДО DESIGN_APPROVED (§5), а схождение идёт ПОСЛЕ него. Честный ответ такому
      пакету — «он не в CONVERGED», а не «роль освобождена»: второе сняло бы
      обязанность, у которой предмет есть.

      ГРАНИЦА. Та же, что у `no-design-document-in-change`: полномочия
      освобождение не касается, сверка идёт в обе стороны.
