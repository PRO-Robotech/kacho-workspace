# APPROVED), первичный разбор классов на тот же отпечаток записан
# (reviews/class-exposure/initial/47bd8b70….yaml). Замысел — `design.md` редакции 7
# (2026-09-30), отпечаток — `hashes.design_sha256`; вердикта и пересверки на него нет
# (редакция 3 `defdbe67` возвращена ревью замысла, редакции 4 `7294a684`, 5 `dd683a30` и
# 6 `0fff30f0` — пересверками разбора классов, `к-замыслу`). Маршрут работ — `tasks.md` (проект;
# TASKS_READY им не объявлено). Каталоги `evidence/*` несут отпечаток прежней редакции
# приёмки `7a50855c` — свидетельства на `47bd8b70` не сняты.
