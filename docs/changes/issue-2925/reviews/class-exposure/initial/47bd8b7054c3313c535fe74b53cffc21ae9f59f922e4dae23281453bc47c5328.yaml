  # ── Новые пункты редакции 6 ────────────────────────────────────────────────
  - id: CX6-15
    decision: D2
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (объявление, которое наследуется не так, как читается); security-surface: заголовки защиты ответа раздачи"
    exposure: >-
      Р2 заводит в шаблоне раздачи новый location = /console-config.json с собственным add_header
      (Cache-Control: no-store). В nginx location со своим add_header НЕ наследует заголовки уровня
      server: без повторного включения ui.securityHeaders ответ теряет X-Content-Type-Options,
      X-Frame-Options, Referrer-Policy и CSP. В шаблоне это соблюдается соглашением: у 4 из 4
      location хоста с собственным add_header include есть; гейта, сверяющего это, в дереве нет
      (тестов, называющих securityHeaders / X-Frame-Options / nosniff в ui-future, — 0).
      NTF6-47 и NTF6-61 (а) утверждают тело, тип и Cache-Control, но не заголовки защиты.
    condition: >-
      новый location включает ui.securityHeaders тем же образцом, что = /index.html; пара рендеров
      NTF6-47 утверждает у /console-config.json тот же набор заголовков защиты, что у /index.html.
    held_by: "держится вниманием, гейта нет — нужна строка в паре рендеров DoD 8 либо гейт «каждый location с add_header включает ui.securityHeaders», заказ"
  - id: CX6-16
    decision: D2
    class: "code-authoring §«Решение и его следствие разнесены» (одно решение, прочитанное несколько раз); §«Умолчание, которое становится утверждением» (третий исход, ставший постоянным)"
    exposure: >-
      shared компилируется в каждый бандл отдельно (§1.8), поэтому «один загрузчик при старте
      бандла» исполняется хостом и каждым загруженным модулем, несущим карточку, — отдельными
      запросами с независимыми исходами. Кратковременный сбой одного из чтений даёт вход в рейле
      при «true» и карточку того же окна в «не прочитано» (действия подписки нет, без объяснения на
      карточке). Р2 не называет пути выхода из «не прочитано» без перезагрузки: одно неудачное
      чтение при старте фиксирует исход на всю жизнь вкладки.
    condition: >-
      (а) чтение признака — одно на окно: результат (включая «не прочитано») хранится на window под
      именем-константой из shared, и все бандлы получают один исход; (б) у исхода «не прочитано»
      есть объявленный путь выхода — повторное чтение (по фокусу или по действию на названной
      странице) либо текст названной страницы прямо предлагает перезагрузку.
    held_by: "нужна модульная проба console-config.test.ts «два вызова загрузчика — один запрос, один исход» и ветка восстановления — её нет, заказ"
  - id: CX6-17
    decision: D3
    class: "code-authoring §«Унификация и стоимость» (одна функция на два входа разной формы); §«Умолчание, которое становится утверждением»"
    exposure: >-
      Р18 определяет правило на ПЕРВОЙ странице (хост, pageSize=100) и говорит «те же правила
      помечают строки на экране центра». Центр же показывает страницы по 50 с «Показать ещё»
      (NTF6-06). Правило «seenUpTo не найден на странице — новое всё» при применении постранично
      помечает «новым» вторую страницу, хотя seenUpTo был найден на первой и все строки второй
      старше него (порядок position DESC). Ни один сценарий не держит пометки за первой страницей:
      NTF6-06 — без seenUpTo, NTF6-13, 14 — три-четыре строки.
    condition: >-
      центр применяет unreadCount к сцепке всех загруженных страниц, а не к каждой; после того как
      seenUpTo найден, ни одна строка ниже него не помечена «новое»; неточный исход (seenUpTo не
      найден среди загруженного и есть nextPageToken) помечает только загруженное выше конца.
    held_by: "нужна ветка unread-count.test.ts / NotificationCenterPage.test.tsx «seenUpTo на первой странице → строки второй не новые» — её нет в DoD 2, заказ"
  - id: CX6-18
    decision: D7
    class: "code-authoring §«Умолчание, которое становится утверждением» (законное отсутствие, слитое с негодным значением)"
    exposure: >-
      Р7 передаёт в ResourceLink resourceId и projectId, «только если каждый — непустая строка в
      алфавите». Но projectId — сегмент адреса не у всех спек: у спек службы доступа
      resourceDetailHref строит /iam/<route>/<id> без проекта, а у события scope = cluster проект
      пуст законно (NTF-3 Р9). В объёме это не наблюдаемо: у kaname в каталоге нет ячейки CONSOLE
      (NTF-3 Р29), cluster-строки vpc_address_pool спеки в STREAM_SUBJECTS не имеют. Когда модуль
      службы доступа получит вид RESOURCE_CHANGE с лентой (Р5 обещает приход без правки консоли),
      все её строки потеряют ссылку молча.
    condition: >-
      проверка алфавита отвергает НЕГОДНОЕ значение, а пустой projectId передаётся как null
      (resourceDetailHref сам решает, нужен ли проект спеке); строка с негодным непустым projectId —
      по-прежнему текст.
    held_by: "держится вниманием, в объёме наблюдать нечем — предикат пересмотра: в каталоге notify появилась ячейка CONSOLE у модуля, чьи спеки не несут проект в адресе (kaname) либо спека вида scope = cluster в STREAM_SUBJECTS; тогда — ветка NTF6-16 с пустым projectId"
  - id: CX6-19
    decision: D9
    class: "code-authoring §«Унификация и стоимость» (стоимость страницы принадлежит запросу)"
    exposure: >-
      каждое открытие карточки любой спеки из STREAM_SUBJECTS при признаке true читает каталог и
      полный список своих подписок (обход до пустого токена, CX6-08; потолок подписок —
      ручка NTF-3 с границей 1000); общий QueryClient бандлов не делится (react-query в перечне общих
      библиотек федерации нет, §1.8).
    condition: >-
      каталог и список подписок кэшируются в бандле одним ключом запроса на всё окно бандла и
      сбрасываются только своей мутацией подписки; список читается pageSize = 1000 с обходом токена.
    held_by: "держится вниманием; число запросов на открытие карточки — модульной пробой ResourceDetailExtensions.test.tsx (две карточки подряд → каталог 1 раз), её нет, заказ"

