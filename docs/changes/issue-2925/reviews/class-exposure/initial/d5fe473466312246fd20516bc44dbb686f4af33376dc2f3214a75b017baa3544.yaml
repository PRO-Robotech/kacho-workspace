    condition: >-
      замысел перечисляет все 13 мест с решением по каждому (правится / notify туда не входит — с
      основанием); отдельно — перечень проксирования края в configmap-nginx (CX6-06).
    held_by: "частично гейтами DoD 9, 10 (переписи модулей); прочие места — вниманием"
  - id: CX6-11
    decision: D2
    class: "code-authoring §«Умолчание, которое становится утверждением» (отказ, показанный пустотой)"
