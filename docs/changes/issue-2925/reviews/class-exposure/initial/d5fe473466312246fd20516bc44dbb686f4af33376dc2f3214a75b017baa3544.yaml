    held_by: "NTF6-56, 58 для двух экранов; экран настроек — нужна модульная проба NotificationSettingsPage «каталог не 200 → текст отказа, матрицы нет», заказ"
  - id: CX6-12
    decision: D6
    class: "code-authoring §«Контракт, который нельзя выразить»"
    exposure: "запрос :setEntries, собранный из состояния формы целиком, несёт ALWAYS-ячейки или неизменённые SWITCHABLE и делает explicit = true там, где человек ничего не выбирал"
