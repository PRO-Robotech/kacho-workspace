  - claim: "адрес ресурса не может увести ни при каком ответе"
    command: "git show 1d42a6728bf:ui-future/shared/src/components/molecules/ResourceLink/ResourceLink.tsx | sed -n 51,57p; grep -c encodeURIComponent"
    result: "сегменты склеиваются как есть; encodeURIComponent — 0"
  - claim: "опрос операции notify через край"
    command: "git show 1d42a6728bf:ui-future/shared/src/lib/use-operation.ts; git show 1d42a6728bf:gateway/internal/opsproxy/proxy.go | sed -n 1,90p; grep -cE 'opsproxy|prefixToBackend' docs/specs/sub-phase-NTF-{1,3}-*.md"
    result: "useOperation опрашивает хотя бы раз и при done = true; край выбирает владельца по приставке ручной картой; в NTF-1 и NTF-3 упоминаний 0"
  - claim: "радиус: где модули консоли перечислены руками"
    command: "по git ls-tree -r ui-future @1d42a6728bf без тестов, e2e, docs, .md, package-lock и каталога registry — файлы, где встречаются все шесть слов nlb|registry|storage|system|dashboard|compute"
    result: "13 из 960 осмотренных; контроль: moduleCatalog.ts найден (положительный), error-presentation.ts не найден (отрицательный)"
  - claim: "Р17: литерал прежнего текста — один файл, проб по нему нет"
    command: "git grep -n 'администраторам платформы\\|Этот раздел доступен' 1d42a6728bf -- ui-future; git grep -n FORBIDDEN_EXPLANATION 1d42a6728bf -- ."
    result: "подтверждено: литерал — error-presentation.ts:106; имя константы — 3 места прод-кода в одном файле и строка фикстуры инъекционной пробы"
  - claim: "§1.5 гейт письма обходит весь ui-future; §1.2 матрица ui.yml и каталог модулей"
