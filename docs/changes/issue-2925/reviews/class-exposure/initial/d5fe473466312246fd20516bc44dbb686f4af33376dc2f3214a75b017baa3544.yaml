decisions:
  D1: вход в рейле, счётчик нового — в хосте (Р1, Р18)
  D2: признак «служба объявлена» из global.kacho.notifications.enabled в конфигурацию хоста; названная страница, «модуль не загрузился» против «вызов отвергнут» (Р2)
  D3: счётчик — опрос 60 с, по фокусу и после своей отметки; счёт из первой страницы ленты и seenUpTo; те же правила метят строки «новое» в центре (Р4, Р18)
  D4: «просмотрено» — PATCH одной позиции (Р19)
  D5: модули, виды, каналы, подписи и порядок — только из каталога notify (Р5)
  D6: ALWAYS фактом, :setEntries строится только из SWITCHABLE (Р6)
  D7: адрес ресурса строит консоль из (resourceType, resourceId, projectId) через STREAM_SUBJECTS (Р7)
  D8: данные ответа — только текстом, инициатор дословно (Р8)
  D9: «Подписаться на изменения» — в общей карточке ресурса для всех модулей; видимость — STREAM_SUBJECTS[spec].owner против ячейки каталога; «Вы подписаны» — из списка своих подписок (Р10)
  D10: контакты — выбор из пользователей аккаунта, источник словами поля source (Р11)
  D11: замена текста FORBIDDEN_EXPLANATION (Р17)
  D12: мутации — Operation; опрос OperationService.Get только при done = false (Р3)
  D13: новый модуль ui-future/notify, объекты чарта по флагу, матрица конвейера (Р12, §3, NTF6-47, 48)
