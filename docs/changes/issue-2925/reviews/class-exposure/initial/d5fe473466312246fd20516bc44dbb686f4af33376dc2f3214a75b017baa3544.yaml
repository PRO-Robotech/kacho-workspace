    result: "заменяет: registeredExtensions[specId] = ext; базовые записи у 9 спек (networks … network-interfaces, load-balancers)"
  - claim: "Р2: чарт кладёт признак в конфигурацию хоста"
    command: "git show 1d42a6728bf:ui-future/shared/src/lib/config.ts; git show 1d42a6728bf:ui-future/deploy/templates/deployment-host.yaml | grep -n env -A1"
    result: "канала нет: конфигурация — import.meta.env во время сборки с молчаливым запасным значением; env процесса хоста — только апстримы nginx"
