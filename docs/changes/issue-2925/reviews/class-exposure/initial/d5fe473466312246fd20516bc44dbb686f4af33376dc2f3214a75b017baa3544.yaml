    command: "git grep -lE \"from ['\\\"]@(vpc|compute|iam|storage|nlb|registry|system|dashboard)[/'\\\"]\" 1d42a6728bf -- ui-future/shared/src | wc -l; git show 1d42a6728bf:ui-future/host/vite.config.ts | grep -n shared"
    result: "импортов shared → модуль 0; общие библиотеки федерации — antd, lucide-react, react, react-dom, react-router; @shared — алиас, компилируется в каждый бандл"
  - claim: "регистрация расширения карточки дополняет существующее"
