items:
  - id: CX6-01
    decision: D9
    class: "code-authoring §«Контракт, который нельзя выразить» (два написания одного значения); polyrepo.md warning «Ключ домена и имя каталога — РАЗНЫЕ словари»"
    exposure: >-
      Р10 ищет ячейку (RESOURCE_CHANGE, EMAIL) у модуля каталога с ключом STREAM_SUBJECTS[spec].owner.
      Это два разных словаря: владелец в STREAM_SUBJECTS — домен контракта (балансировщик —
      «loadbalancer», служба доступа — «iam»), ключ модуля каталога notify — имя модуля источника
      («nlb», «kaname», NTF-3 Р29 и NTF3-149). Для трёх видов балансировщика поиск промахивается, и
      действие «Подписаться на изменения» молча отсутствует на их карточках при подключённом модуле
      nlb и ячейке SWITCHABLE. Единственная проба действия (NTF6-33, 34) идёт по vpc, где оба
      написания совпадают, поэтому промах не виден ни одному сценарию.
    condition: >-
      (а) переход «спека консоли → ключ модуля каталога» объявлен ровно в одном месте, и это не
      STREAM_SUBJECTS.owner как есть; (б) гейт обходит все записи STREAM_SUBJECTS и для каждой,
      чей модуль в каталоге стенда есть, требует найденную ячейку (печатает число записей, падает
      на пустом обходе); (в) сценарий на карточке ресурса балансировщика — действие есть.
    held_by: "ничем: сценария вне vpc нет, гейта нет — вернуть в приёмку (решение о месте перехода и сценарий)"
  - id: CX6-02
    decision: D14
    class: "code-authoring §«Унификация и стоимость» (одна реализация на все места); §«Инвариант и оснастка — это тоже прод-код» (проверка, которую верная реализация красит)"
    exposure: >-
      Федерация хоста делит только antd, lucide-react, react, react-dom, react-router; @shared —
      алиас, компилируемый в каждый бандл отдельно. Импортов из shared в модули ноль, хост модуль
      notify не импортирует (§8 приёмки). Отсюда: действие подписки в общей карточке (shared) не
      может звать ui-future/notify/src/api/subscriptions.ts, а счётчик хоста — клиент ленты и
      настроек модуля notify. DoD 6 требует, чтобы путь /notify/v1/subscriptions встречался только в
      ui-future/notify/src/api/subscriptions.ts, — верная реализация с одним клиентом в shared этот
      предикат красит, а зелёная ему — либо импорт shared → модуль (новое направление), либо второй
      клиент. То же с правилом Р18: §8 кладёт его в host/src/lib/unread-count.ts, а центр (модуль
      notify) обязан метить строки теми же правилами и импортировать хост не может — два места.
    condition: >-
      клиент /notify/v1/* (лента, настройки, каталог, подписки, контакты) и функция счёта Р18 живут
      в shared и импортируются хостом, карточкой и модулем; второго клиента и второй реализации
      счёта нет; предикат DoD 6 и координаты §8 (NTF6-10, 11, 13, 14, 33, 57; DoD 2
      unread-count.test.ts) называют этот дом.
    held_by: "DoD 6 в нынешней форме держит обратное — вернуть в приёмку (дом клиента и счёта, предикат DoD 6, координаты §8)"
  - id: CX6-03
    decision: D9
    class: "code-authoring §«Решение и его следствие разнесены» (регистрация, заменяющая чужое)"
    exposure: >-
      registerDetailExtension(specId, ext) ЗАМЕНЯЕТ расширение спеки, а не дополняет его
      (registeredExtensions[specId] = ext; чтение — registered ?? DETAIL_EXTENSIONS). У восьми спек
      vpc и у load-balancers есть базовые расширения (например, networks — управление CIDR), у
      compute-instances, registries и спек iam — регистрируемые. Действие подписки, заведённое через
      этот вход на каждую спеку STREAM_SUBJECTS, стёрло бы доменное содержимое карточки; к тому же
      реестр — состояние модуля shared внутри одного бандла, и регистрация из бандла notify до
      карточки vpc не доходит.
    condition: >-
      действие подписки — сквозное место карточки, составляемое с расширением спеки, а не запись
      registerDetailExtension; ни одна спека не теряет headerActions/overviewExtra/extraTabs от
      появления действия.
    held_by: "нужна модульная проба ResourceDetailExtensions: спека со своим headerActions (networks) показывает и его, и действие подписки — её нет, заказ"
  - id: CX6-04
    decision: D2
    class: "code-authoring §«Умолчание, которое становится утверждением» (третий исход «не смог прочесть»); architecture.md §«Конфигурация, впервые ставшая ЧИТАЕМОЙ, перебивает умолчание поставщика»"
    exposure: >-
      Конфигурация хоста сегодня — только время сборки: import.meta.env с молчаливым запасным
      значением (envStr(key, fallback)); чарт хосту в процесс ничего не передаёт (у deployment-host
      в env только адреса апстримов nginx). «Чарт кладёт признак в конфигурацию хоста» канала не
      имеет. Прочитанный через env со умолчанием, признак из values до собранного образа не доходит, а
      умолчание решает за установку: умолчание true показывает центр установке с false, умолчание
      false прячет его молча — ровно то, что Р2 называет неотличимым от «сервиса нет». Рендер
      (NTF6-47) и модульная проба (NTF6-02) канал не проходят: первый смотрит объект чарта, вторая
      подставляет значение в хост сама; на стенде значение true, и проба зелена при любом умолчании.
    condition: >-
      (а) признак читается во время работы из объекта, отрендеренного чартом из
      .Values.global.kacho.notifications.enabled, а не из import.meta.env; (б) чтение возвращает
      три исхода — true, false, «не прочитано»; третий не сводится ни к true, ни к false и
      показывается явно; (в) проба на стенде: признак, отданный хосту как false (подмена
      отдаваемого объекта), убирает вход — доказывает, что канал читается.
    held_by: "ничем: исхода «не прочитано» в приёмке нет, сценария, проходящего канал, нет — вернуть в приёмку"
  - id: CX6-05
    decision: D3
    class: "code-authoring §«Решение и его следствие разнесены» (темп производителя и применения)"
    exposure: >-
      Счётчик — пара чтений (лента + настройки) по таймеру, по фокусу и после отметки; ответы
      асинхронны. Опоздавший ответ прежнего цикла перетирает новый; опрос, ушедший до PATCH отметки,
      возвращает старый seenUpTo и зажигает погасший значок; лента одного цикла с настройками
      другого даёт счёт, которого не было ни в одном состоянии. Сигнала «отметка сделана» между
      бандлом notify и хостом нет: общей памяти у бандлов нет (см. CX6-02), событий окна в хосте и
      shared ноль.
    condition: >-
      (а) один цикл — одна пара запросов, в полёте не больше одного цикла; таймер и фокус
      схлопываются; (б) у цикла номер поколения, ответ цикла старше последнего начатого
      отбрасывается; (в) отметка «просмотрено» делает все начатые циклы устаревшими и начинает
      новый после done; (г) сигнал «отметка сделана» из модуля в хост — одним объявленным каналом
      окна с именем-константой в shared.
    held_by: "NTF6-12 (точное число запросов), NTF6-13 (значка нет сразу после done); ветки «опоздавший ответ» и «опрос в полёте во время отметки» в перечне DoD 2 нет — нужна модульная проба, заказ"
  - id: CX6-06
    decision: D3
    class: "code-authoring §«Умолчание, которое становится утверждением» (200 без формы ответа)"
    exposure: >-
      Раздача консоли проксирует на край только ^/(vpc|compute|storage|geo|nlb|registry|operations)/ и
      ^/iam/v1/; прочий путь отдаёт общий location /, то есть index.html с кодом 200. Клиент хоста на
      теле не-JSON возвращает null без ошибки. Без префикса notify в этом перечне и без проверки формы
      ответа счётчик получает «200, лента пустая» и гасит значок, центр показывает «Уведомлений пока
      нет» — отказ выглядит успехом.
    condition: >-
      (а) префикс notify добавлен в перечень проксирования края тем же изменением; (б) ответ ленты,
      настроек, каталога и контактов принимается только при совпадении формы (items — массив,
      entries — массив, …); иная форма при 200 — исход «ответ не получен» (Р18 «!», Р2 «вызов
      отвергнут»), а не пустота.
    held_by: "(а) — NTF6-22 на стенде (ждёт 401, HTML 200 его красит); (б) — нужна модульная проба «200 с HTML → «!»», её нет — заказ"
  - id: CX6-07
    decision: D7
    class: "code-authoring §«Контракт, который нельзя выразить» (перечень входных поверхностей); security-surface: адрес из данных ответа"
    exposure: >-
      resourceDetailHref склеивает сегменты `${own}/${id}` без кодирования (encodeURIComponent в
      ResourceLink.tsx — 0). До NTF-6 id приходили из списков своего модуля; лента несёт resourceId и
      projectId из чужого ответа. Значение с «/», «..», «?» или «#» даёт ссылку на другой адрес
      консоли — Р7 утверждает, что лента «не может увести человека на чужой адрес ни при каком
      ответе», а NTF6-16 проверяет только тип без спеки.
    condition: >-
      сегменты адреса из ответа проходят проверку формы id (приставка + crockford-base32) до
      построения ссылки; не прошедшее — имя текстом без ссылки, как у типа без спеки; кодирование
      сегмента — вторым рубежом.
    held_by: "ничем: ветки с разметкой пути в resourceId/projectId у NTF6-16 нет — вернуть в приёмку (ветка-близнец NTF6-16)"
  - id: CX6-08
    decision: D9
    class: "code-authoring §«Умолчание, которое становится утверждением» (отсутствие на первой странице ≠ отсутствие)"
    exposure: >-
      «Вы подписаны» выводится из GET /notify/v1/subscriptions, а он постраничный (NTF3-93; потолок
      подписок на пользователя — ручка с границами [10, 1000]); перечень кандидатов контакта — из
      постраничного /iam/v1/users. Чтение первой страницы превращает «не нашлось на странице» в «нет»:
      карточка предлагает подписаться на уже подписанный ресурс, повтор даёт 409 ALREADY_EXISTS
      (NTF3-91), и после отказа карточка продолжает утверждать «не подписаны».
    condition: >-
      (а) факт «подписан» и перечень кандидатов выводятся после обхода до пустого nextPageToken; (б)
      после любого отказа создания подписки состояние карточки перечитывается из списка, а не
      остаётся локальным флагом.
    held_by: "вниманием; нужна модульная проба «список из двух страниц, цель на второй → «Вы подписаны»» — её нет, заказ"
  - id: CX6-09
    decision: D12
    class: "code-authoring §«Чужой ответ: классификация и бюджет»"
    exposure: >-
      Общий useOperation(opId) делает хотя бы один GET /operations/{id} и при done = true; край
      маршрутизирует опрос операции по приставке id ручной картой (opsproxy prefixToBackend), и
      приставки операций notify в ней нет — ни NTF-1, ни NTF-3 её не заводят (opsproxy,
      prefixToBackend — 0 упоминаний в обеих). Мутация, закоммиченная и вернувшая done = true, при
      переиспользовании общего потока формы опрашивается и получает отказ края — консоль показывает
      сбой успешной операции.
    condition: >-
      при done = true исход берётся из ответа мутации, GET /operations не выполняется; опрос —
      только при done = false (Р3) и только общим useOperation, второго опросчика нет.
    held_by: "NTF6-27, 36, 38, 43 на стенде (ждут успеха); маршрут приставки notify на краю для ветки done = false — заказ соседу"
  - id: CX6-10
    decision: D13
    class: "measurement-discipline §«Радиус: по имени механизма и по точкам применения»; code-authoring §«Контракт, который нельзя выразить» (перечень поверхностей)"
    exposure: >-
