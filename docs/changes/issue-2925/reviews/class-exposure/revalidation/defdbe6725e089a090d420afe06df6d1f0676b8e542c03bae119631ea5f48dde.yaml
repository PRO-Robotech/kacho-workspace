  - id: CX6-22
    design: "З6, З13, И13"
    verdict: holds
    note: >-
      условие пересверки deeea79a исполнено: одна функция createNotifyQueryClient() с
      defaultOptions.queries.retry = notifyQueryRetry, её зовут NotifyPage и экранные пробы модуля;
      «своего new QueryClient в ui-future/notify/src вне этой функции нет» — утверждение покрывает и
      тестовые файлы модуля (они лежат под src), поэтому проба «обход — без повтора» не может
      оказаться зелёной на клиенте с retry: false, построенном самой пробой (в дереве так строят
      клиент 105 тестовых файлов ui-future). Гейта, ограничивающего форму создания QueryClient, в
      дереве нет — утверждение проверяется грепом рецензента диффа.
  - id: CX6-23
    design: "З9, И14"
    verdict: holds
  - id: CX6-24
    design: "З13, §9"
    verdict: holds
  - id: CX6-25
    design: "З14, И17"
    verdict: holds-with-condition
    note: >-
      Снятие и публикация по идентичности (stored === p в обоих обработчиках), обработчики вешаются
      тем же синхронным вызовом, что кладёт p; довод о недостижимости ветки «исход прежнего при
      хранимом новом» через публичный load() проверен и верен: новое кладётся только при
      stored = null, а null ставит лишь обработчик отказа самого p, после которого у p обработчиков
      rememberLoad не остаётся. Держится вниманием рецензента диффа — с названной причиной, это
      допустимая третья строка. Условие к коду: подписчик, подписавшийся ПОСЛЕ исхода (хранимое
      обещание уже исполнено; load() возвращает его и ничего не публикует), обязан получить текущий
      исход при подписке, а не ждать публикации — rememberLoad хранит последний исход, и хук
      useLoadOutcome читает его снимком (useSyncExternalStore или эквивалент). Иначе pending
      становится вечным для позднего подписчика и значит уже не «загрузка в полёте», как его
      определяет З14; кнопка сегодня рисует pending и available одинаково, поэтому наблюдаемого
      дефекта нет, но определение состояния ложно. Проба: «подписка после успеха — состояние
      available сразу, вызовов загрузчика 1».

