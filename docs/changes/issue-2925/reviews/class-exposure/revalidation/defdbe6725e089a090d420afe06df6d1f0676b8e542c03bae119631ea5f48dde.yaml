      попутные упоминания); вне ui-future перечни пакетов консоли руками есть в четырёх файлах
      internal/repohygiene (console{formatterversion,stylelintconfig,lintproducer,typecheckproducer}
      _injection_test.go), но это синтетические входы инъекционных проб, а древесные близнецы
      выводят состав обходом package.json/tsconfig.json — notify они судят сами и покраснеют на
      расходящемся каркасе (версия форматтера, цепочка lint, судья stylelint, производитель
      typecheck); решения в §10 не требуют. Строки 28–32 сверены с кодом гейтов: 28 — все три
      ветки обхода CONSOLE_APPS (каталог pages/iam, path="/iam…", переход navigate/to/href) верно
      названы; 29, 30 — отсутствие реестра модуль пропускает (нет файлов resource-registry*),
      порог ≥ 5 не меняется; 32 — EXCUSED = перечень освобождений, nlb/jest.config.cjs несёт
      общий setup, своего src/test/setup.ts у nlb нет. Условие к коду по строке 31: проба делит
      configmap-nginx.yaml по строкам, равным ровно `---`, и берёт имя блока первым совпадением
      `name: (.+)-nginx`; блок notify, объявленный под условием флага, обязан начинаться строкой
      `---` без ведущих пробелов и директив шаблона на той же строке, и первым `name:` в куске
      должно быть имя с `ui.notifyName` — иначе блок сольётся с соседним и проба судит не тот блок.
