# Экспозиция классов — пересверка (revalidation) замысла NTF-6 (консоль: центр уведомлений,
# личные настройки, контакты аккаунта), редакция 7 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. Первичный разбор (initial/47bd8b70….yaml) и пересверки на
# редакции 1–6 свидетельствуют о своих редакциях и здесь не переписываются. Проверено: (1) каждый
# пункт CX6-01…36 отображён и отображение выдерживает условие пункта; (2) новые внешние вызовы,
# (3) новые асинхронные пути, (4) новые sentinel-значения, внесённые редакцией 7 сверх редакции 6.
# Редакция 7 заводит ключ чтения центра по номеру чтения (readSeq уровня модуля) и дедлайн на
# промежуток без ответа, переставляемый каждым HTTP-ответом запросов чтения. Механизмы разобраны
# против исходника @tanstack/query-core 5.101.2 и дерева kacho @1d42a6728bf; отсюда новые пункты
# CX6-37 (жизненный цикл таймеров центра при размонтировании и перестановка таймера ответом
# чужой попытки), CX6-38 (видимость позиции в порядке фиксации — зависимость, которую первичный
# разбор NTF-3 на 97afc066 завёл как CX3E-06), CX6-39 (одновременно висящие запросы центра
# против бюджета соединений источника).
