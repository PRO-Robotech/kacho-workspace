conditions_to_code:
  - id: CX6-36
    measured: >-
      retry: notifyQueryRetry повторяет queryFn чтения целиком (retryer зовёт fn заново); запросы
      первой попытки не отменяются (M15: клиент края signal не принимает), и их поздние ответы
      вызывают ту же обёртку «ответ получен» того же объекта чтения. Правило З13 «у чтения, чей
      исход уже применён, отметка ничего не делает» отсекает чужое ЧТЕНИЕ, но не чужую ПОПЫТКУ
      своего чтения.
    must_hold_in_code: >-
      отметка «ответ получен» переставляет таймер только для ответа ТЕКУЩЕЙ попытки своего чтения
      (номер попытки в объекте чтения, захваченный обёрткой при старте попытки); ответ запроса
      отменённой повтором попытки таймер не трогает. Проба на управляемых часах: попытка 1 —
      страница отвечает 503 на 1-й секунде, настройки молчат; повтор на 2-й секунде молчит;
      настройки попытки 1 отвечают на 25-й секунде — «отвергнуто» на 31-й, а не на 55-й; близнец —
      ответ настроек ПОВТОРА на 25-й секунде переставляет таймер.
    held_by: "NotificationCenterPage.test.tsx (ветка «ответ отменённой попытки не продлевает дедлайн»)"

new_items:
  - id: CX6-37
    decision: "З13 — таймер CENTER_POLL_MS и таймер дедлайна чтения центра; редакция 7: каждый HTTP-ответ запроса чтения переставляет таймер своего чтения, пока исход чтения не применён"
    class: "code-authoring §«Порядок операций внутри кода» (порядок снятия ресурса: таймер, поставленный после очистки эффекта); §«Решение и его следствие разнесены» (решение «чтение больше не текущее» принимает gen или размонтирование, а перестановку таймера разрешает флаг «исход применён», который этого решения не несёт)"
    measured: >-
      grep -n 'размонтир\|unmount' design.md → 5 строк: 547, 556 (З9 — эффект хоста с остановкой
      таймера и проба «размонтирование — таймеров дедлайна нет»), 660, 675 (З10), 878 (проба
      перемонтирования центра — только «новое чтение делает запрос»). У useInboxSnapshot правила
      снятия таймеров при размонтировании нет. Перестановку таймера разрешает «исход не применён»;
      у чтения, висящего в момент размонтирования, и у чтения, устаревшего по gen++ (отметка, смена
      фильтра), исход не применён — их поздний ответ ставит новый таймер уже после очистки эффекта
      или для чтения, чей исход будет отброшен. Отмены запроса нет (M15), так что ответ приходит.
    must_hold_in_code: >-
      (а) очистка эффекта useInboxSnapshot снимает таймер CENTER_POLL_MS и таймер дедлайна текущего
      чтения и помечает экземпляр снятым; (б) перестановка таймера и применение исхода разрешены
      только чтению, которое ТЕКУЩЕЕ у смонтированного экземпляра (идентичность объекта чтения
      равна текущей и экземпляр не снят), а не «исход не применён»; чтение, устаревшее по gen++,
      перестаёт быть текущим тем же синхронным вызовом, что делает gen++, и его таймер снимается
      там же. Проба: центр размонтирован при чтении в полёте, затем чтение отвечает —
      jest.getTimerCount() 0, обновлений состояния 0; близнец — смонтирован, ответ переставляет
      таймер (счёт 1). Вторая ветка: отметка во время чтения, затем устаревшее чтение отвечает —
      таймеров устаревшего 0.
    held_by: "NotificationCenterPage.test.tsx (ветки «размонтирование при чтении в полёте», «устаревшее чтение не переставляет таймер»)"
    design_mapping: "нет: З13 называет правило только для «исход применён»; §11 строки нет; S2 предиката нет"
    verdict: unmapped
  - id: CX6-38
    decision: "З13 «Отметить всё просмотренным» — patchSeenUpTo(items[0].position) при монотонной отметке Д25; пометки «новое» и счётчик З9 — позиции выше seenUpTo на загруженных страницах"
    class: "code-authoring §«Решение и его следствие разнесены» (позиция выдаётся последовательностью при вставке, видимой становится при коммите; решение консоли «всё ниже items[0] прочитано» принимается по видимому)"
    measured: >-
      первичный разбор NTF-3 на 97afc066 (docs/changes/issue-2918/reviews/class-exposure/initial/97afc066….yaml,
      CX3E-06): Р9 определяет позицию как монотонную последовательность базы notify —
      монотонна по выдаче, не по видимости; при двух параллельных транзакциях приёма P4 может
