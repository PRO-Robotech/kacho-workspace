      зелёная; довод I1 в З13 («позиция новее не нашлась бы…») называет эту предпосылку.
    held_by: "у владельца — проба CX3E-06 (заказ integration-tester через NTF-3); у NTF-6 — предикат снятия зависимости"
    design_mapping: "нет: §9 зависимости нет, §11 строки нет"
    verdict: unmapped
  - id: CX6-39
    decision: "З13 редакции 7 — каждое чтение центра делает новый запрос (readSeq), отмены нет (M15), следующий таймер CENTER_POLL_MS после дедлайна начинает новое чтение рядом с зависшим"
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (новое чтение после дедлайна — повтор отказавшего без бюджета: попытки копятся, пока прежние держат соединения)"
    measured: >-
      до редакции 7 таймерное чтение того же поколения присоединялось к зависшему (M31) — висящий
      запрос центра был один на поколение. Теперь при зависшем соединении с апстримом (M24
      редакции 7: 60 s — умолчание nginx) чтение R1 висит 0–60 s, дедлайн на 30-й, R2 стартует на
      33-й и висит до 93-й: запросов центра одновременно 4 при k = 1 (настройки и страница двух
      чтений), плюс цикл счётчика З9 — 2. Консоль по умолчанию раздаётся без TLS
      (ui-future/deploy/values.yaml @1d42a6728bf: ingress.enabled true, tls: []), а без TLS браузер
      ходит HTTP/1.1 с пределом соединений на источник (6 у Chromium); все модули консоли — один
      источник. Замысел называет хвост («не больше числа чтений, начатых, пока запрос висит»), но
      не его число и не бюджет источника: отказ notify при таком отказе может занять пул
      соединений и задержать запросы vpc, compute и прочих модулей.
    must_hold_in_code: >-
      выбрать и записать в З13 одно: (а) бюджет — таймерное чтение не стартует, пока у экземпляра
      висит больше одного чтения, отвергнутого дедлайном (экран держит «отвергнуто»; висящих
      запросов центра не больше двух наборов); либо (б) принять хвост с названным числом (при
      60 s — 4 запроса центра, 6 с опросом хоста) и с доводом, почему пул соединений источника
      этим не исчерпывается на названной посадке (HTTP/2 за TLS или иное — с провенансом стенда).
      Проба к (а): управляемые ответы молчат 60 с управляемых часов — одновременно висящих
      запросов к /notify/v1/inbox ≤ 2; близнец — ответ приходит, следующее чтение стартует по
      таймеру.
    held_by: "NotificationCenterPage.test.tsx (счёт одновременно висящих) при (а); при (б) — рецензент замысла по доводу"
    design_mapping: "нет: З13 называет хвост словами, без числа и без бюджета; §11 строки нет"
    verdict: unmapped

