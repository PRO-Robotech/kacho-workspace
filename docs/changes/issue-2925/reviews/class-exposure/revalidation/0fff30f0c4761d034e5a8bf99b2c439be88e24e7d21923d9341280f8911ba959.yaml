conditions_to_code:
  - id: CX6-31
    measured: >-
      useResourceStream вызывается ВНУТРИ useResourceList (use-resource-list.ts:182, enabled:
      target.resolved), не в ResourceListPage; ResourceListPage держит серверные фильтры
      spec.listFilters и серверный поиск spec.search.serverTerm / spec.serverSearchField
      (ResourceListPage.tsx:82–122, 614–618), которые уходят только в запрос useResourceList.
    must_hold_in_code: >-
      (а) опция enabled: false гасит и useInfiniteQuery, и useResourceStream (передаётся в его
      enabled); проба G4 считает не только запросы к spec.apiPath, но и открытия потока (подмена
      транспорта подписки или счёт вызовов с enabled: true) — иначе «ни потока» держится вниманием;
      (б) при заданном source серверные фильтры и серверный поиск спеки не отрисовываются либо
      сочетание source с listFilters / search.serverTerm / serverSearchField отвергается (ошибка
      сборки спеки или проверка на старте компонента) — иначе элемент управления принят и
      проигнорирован: запрос выключен, а фильтр «работает». Проба: спека с listFilters и source —
      фильтров на экране 0 либо отказ.
    held_by: "ResourceListPage.source.test.tsx (две ветки выше); спека ленты без серверного сужения — рецензент диффа"
  - id: CX6-33
    measured: >-
      query.ts:411–413: тихая отмена идущего чтения при cancelRefetch только если у ключа уже есть
      данные (state.data !== undefined); иначе новое чтение присоединяется к идущему (414–418).
      invalidateQueries → refetchQueries стартует fetch синхронно внутри notifyManager.batch
      (queryClient.ts:291–337; query.ts: dispatch fetch и createRetryer до первого await).
    must_hold_in_code: >-
      действие «Подписаться»/«Отписаться» недоступно, пока у ключа ["notify","subscriptions"] нет
      данных (первое чтение в полёте): иначе событие исхода не снимает чтение, начатое ДО исхода, и
      следствие присоединяется к нему — флаг опустится по списку без только что созданной
      подписки. Проба: первое чтение списка отвечает позже — кнопки нет.
    held_by: "ResourceDetailExtensions.test.tsx (ветка «список ещё не прочитан»)"

new_items:
  - id: CX6-35
    decision: "З13 — ключ чтения центра [\"notify\",\"center\",module,gen,\"pair\"|token], поколение растёт только по отметке и смене фильтра; после дедлайна «следующий таймер начинает новую пару»"
    class: "code-authoring §«Решение и его следствие разнесены» (решение «чтение устарело, начать новое» принято счётчиком механизма, а исполняет его кэш клиента запросов по ключу, который этого решения не несёт); §«Чужой ответ: классификация и бюджет» (повтор после дедлайна не делает запроса)"
    measured: >-
      queryClient.ts fetchQuery (5.101.2, 363–367): при staleTime 0 зовёт query.fetch(options) БЕЗ
      fetchOptions; query.ts fetch (404–419): если у ключа идёт чтение и retryer не отказал —
      возвращается обещание ИДУЩЕГО чтения (continueRetry), нового запроса нет; cancelRefetch у
      fetchQuery не передать. optionalRemove (226–230) снимает ключ только при fetchStatus 'idle',
      так что gcTime: 0 зависшее чтение из кэша не убирает. Ключ пары не несёт ничего, кроме gen, а
      таймерные пары gen не меняют: после истечения дедлайна пара следующего таймера того же
      поколения присоединяется к зависшему чтению — запроса нет, её исход — исход зависшего. То же у
      дочитывания: повторное «Показать ещё» после дедлайна по тому же токену присоединяется к
      зависшему. Проба З18 «следующий таймер начинает новую пару», считающая запросы, на такой
      конструкции красная; считающая только состояние экрана — не отличит.
    must_hold_in_code: >-
      ключ каждого чтения центра уникален для ЧТЕНИЯ, а не для поколения (номер чтения, растущий
      на каждом старте, рядом с gen), либо чтение центра не идёт через кэш клиента запросов вовсе;
      исход применяется при текущем gen и однократно, как записано. Проба: пара не отвечает →
      дедлайн → «отвергнуто» → следующий таймер — обращений к /notify/v1/preferences и к
      /notify/v1/inbox по 2 (новый запрос ушёл); близнец — ответивший первый запрос: следующий
      таймер тоже делает новый запрос (обращений 2), снимок — из второго ответа. То же для
      дочитывания: второе «Показать ещё» после дедлайна — запросов по токену 2.
    held_by: "NotificationCenterPage.test.tsx (две ветки выше, счёт обращений)"
    design_mapping: "нет: З13 называет ключ с gen и утверждает «ключ нового поколения не присоединяется к чтению, начатому раньше» — верно между поколениями, ложно внутри поколения"
    verdict: unmapped
  - id: CX6-36
    decision: "§8, З13, З20 — CENTER_READ_DEADLINE_MS = 30 с, «равен proxy_read_timeout 30s раздачи — меньший объявил бы отказом чтение, которого раздача ещё ждёт»; дедлайн ставится на чтение центра — пару (настройки ∥ страницы 1…k подряд) с retry: notifyQueryRetry"
    class: "code-authoring §«Умолчание, которое становится утверждением» (число, выведенное для одного запроса, применено к составному чтению); doc-truthfulness — обоснование числа о другом предмете"
    measured: >-
      единица дедлайна — чтение центра (З13: «каждое чтение центра ставит таймер окна»); пара
      читает k страниц ПОДРЯД (токен следующей — из ответа предыдущей), fetchQuery повторяет по
      notifyQueryRetry (failureCount < 1 — один повтор) с defaultRetryDelay 1000·2^0 = 1 с
      (retryer.ts:49–51). Предел раздачи — 30 с на ОДИН запрос (M24). Законная длительность пары
      при зависающем апстриме — до k·30 с, с повтором — до 2·k·30 + 1 с; при k = 1 и первом ответе
      504 на 30-й секунде повтор уходит на 31-й, а дедлайн уже истёк. Обоснование «меньший объявил
      бы отказом чтение, которого раздача ещё ждёт» для пары ложно при любом k с повтором и при
      k ≥ 2 без него. Вместе с CX6-35 следующий таймер присоединяется к тому же чтению.
    must_hold_in_code: >-
      выбрать и записать в §8 одно: (а) дедлайн на КАЖДЫЙ запрос чтения (обоснование «равен
      proxy_read_timeout» тогда верно), а у пары — названный предел как функция k и повтора; либо
      (б) дедлайн пары — граница ожидания экрана, с обоснованием, не ссылающимся на раздачу, и с
      названным исходом: законное медленное чтение объявляется «отвергнуто», следующий таймер
      начинает НОВОЕ чтение (CX6-35). Проба на управляемых часах: k = 2, каждая страница отвечает
      через 20 с — при (а) снимок обновлён, «отвергнуто» не было; при (б) «отвергнуто» на 30-й
      секунде и новый запрос следующим таймером.
    held_by: "NotificationCenterPage.test.tsx (ветка «медленная пара из двух страниц»); одна константа — рецензент диффа"
    design_mapping: "нет: §8 и З13 выводят 30 с из предела одного запроса"
    verdict: unmapped

