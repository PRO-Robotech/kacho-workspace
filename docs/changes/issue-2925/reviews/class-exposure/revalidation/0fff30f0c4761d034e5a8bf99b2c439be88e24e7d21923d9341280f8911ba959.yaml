# личные настройки, контакты аккаунта), редакция 6 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. Первичный разбор (initial/47bd8b70….yaml) и пересверки на
# редакции 1 (7613071f), 2 (deeea79a), 3 (defdbe67), 4 (7294a684) и 5 (dd683a30) свидетельствуют
# о своих редакциях и здесь не переписываются. Проверено: (1) каждый пункт CX6-01…34 отображён и
