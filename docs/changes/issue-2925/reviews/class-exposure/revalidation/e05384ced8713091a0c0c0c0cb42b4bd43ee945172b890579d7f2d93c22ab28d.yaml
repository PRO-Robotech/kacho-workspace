approval_conditions:
  - condition: "каждый пункт первичного разбора и прежних пересверок отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: green
    detail: >-
      §11 — 41 строка, уникальных пунктов 39 из 39; строк не прибыло и не убыло, правлены строки
      CX6-35, CX6-36, CX6-39. Держатели CX6-35/CX6-36 больше не спорят с порогом CX6-39 (K1 (1)
      ревью 20db8619 исполнено): новое чтение — после ответа висящих, ветка «висят — обращений не
      добавляет» названа. Условия к коду пересверки 20db8619 (CX6-39 (1)–(3), CX6-37) внесены в
      З13 и tasks.md S2 дословно по смыслу. Уточнение входа проб — условием к коду ниже.
  - condition: "новый внешний вызов заведён пунктом и отображён (CG_CLASS_NEW_EXTERNAL_CALL)"
    result: green
    detail: >-
      дельта адресов и вызовов не вносит: те же GET /notify/v1/preferences и GET /notify/v1/inbox;
      «отметка сверх того вызывает пару хоста» — существующий путь З9 (NOTIFY_SEEN_EVENT), в
      дельте только назван в хвосте.
  - condition: "новый асинхронный путь заведён пунктом и отображён (CG_CLASS_NEW_ASYNC_PATH)"
    result: green
    detail: >-
      новых таймеров, слушателей и продолжений нет. «Монтирование порогом не задерживается» —
      не новое решение: порог и прежде стоял только на таймерном чтении, а держатель CX6-35
      «перемонтирование при зависшем чтении — новый запрос» был в редакции 9.
  - condition: "новое sentinel-значение заведено пунктом и отображено (CG_CLASS_NEW_SENTINEL)"
    result: green
    detail: "дельта значений на проводе и в состоянии экрана не вносит (loading · rejected · data — прежние)"
  - condition: "нет маркеров отсрочки и открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: green
    detail: >-
      grep -c 'TODO\|FIXME' design.md → 0; §13 «открытых решений нет». Вынесен вопрос владельцу
      (K1 (3) ревью 20db8619): приемлем ли против NTF6-04 исход порога. Класс этого исхода
      (§«Умолчание, которое становится утверждением»: снимок показан текущим без срока и без
      отметки «устарело») теперь НАЗВАН исходом в З13 (3) и §8 — отображение честно. Приемлемость
      судит не эта роль; ответ «неприемлемо» — новое решение вне Д26, а значит новый пункт и
      новая пересверка.

mapping_check:
  - {id: "CX6-01…CX6-34, CX6-37, CX6-38", design: "без изменений против 20db8619 (CX6-37 — только условие к коду пересверки 20db8619 внесено в З13 (2) и S2)", verdict: holds, note: "по Д26 не перемерялись: дельта их строк не трогает"}
  - id: CX6-35
    design: "З13 (механизм, «Названный исход»); З18 строка CX6-35; §11 строка CX6-35; tasks.md S2"
    verdict: holds-with-condition
    note: >-
      вход «пара не отвечает → дедлайн → оба висящих отвечают (счёт 0 напечатан) → следующий
      таймер по 2» больше не противоречит CX6-39 (б); ветка «пара висит — по 1, экран в
      «отвергнуто»» совпадает с CX6-39 (а). Пара держателей ловит и неназванное в замысле
      правило перевзвода: таймер, пропущенный порогом, обязан снова поставить
      setTimeout(CENTER_POLL_MS) — иначе «после ответа — по 2» краснеет. Условие к коду ниже:
      «отвечают» значит конец цепочки отвергнутого чтения (k = 1 или все k страниц, 200).
  - id: CX6-36
    design: "З13 (дедлайн, «Названный исход»); З18 строка CX6-36; З20; §8 CENTER_READ_DEADLINE_MS; §11 строка CX6-36; tasks.md S2"
    verdict: holds-with-condition
    note: >-
      «первая страница молчит — «отвергнуто»; пока висит — запроса нет, после её ответа — новый
      запрос» верно только если ответ страницы 1 кончает цепочку отвергнутого чтения. Пара
      читает страницы 1…k подряд, токен каждой — из ответа предыдущей того же чтения, отмены нет
      («чтение дорабатывает», З13). Если случай строится на снимке k = 2 (как соседний «две
      страницы по 20 с»), поздний ответ страницы 1 порождает запрос страницы 2 отвергнутого
      чтения: счёт 1, таймер верно не стартует, а держатель ждёт «новый запрос» — красное на
      верном коде либо неразличимость (запрос страницы 2 тоже GET /notify/v1/inbox с токеном).
      Решение не меняется — это вход пробы (условие к коду ниже).
  - id: CX6-39
    design: "З13 условие (3) (Число, Названный исход, Проба); §8 строка «висящих HTTP-запросов центра»; §11 строка CX6-39; З18; tasks.md S2"
    verdict: holds
    note: >-
      условия к коду пересверки 20db8619 (счёт 0 в начале случая, все висящие в (б), −1 в finally
      и при синхронном броске) внесены; text_remarks 20db8619 исполнено: 5 — при одной паре хоста,
      хвост хоста — сроки края, прочие запросы окна не охвачены, отметка добавляет пару хоста.
      Названный исход порога и его выход (монтирование, фильтр, отметка, «Показать ещё») — в З13,
      §8 и З20; И18 перепись снова называет механизм без срока с путём выхода.

conditions_to_code:
  - id: CX6-35
    must_hold_in_code: >-
      (1) таймер CENTER_POLL_MS, пропущенный порогом (счёт висящих > 0) или схлопнутый в чтение
      в полёте, в том же вызове снова ставит setTimeout(CENTER_POLL_MS) при видимой вкладке; без
      этого после ответа висящих новое чтение не начнётся никогда. (2) «оба висящих отвечают»
      во входе пробы — ответы, которые КОНЧАЮТ отвергнутое чтение: 200, последняя страница его
      цепочки (k = 1 на первом чтении), без повтора notifyQueryRetry; счёт 0 напечатан перед
      следующим таймером (как уже требует строка З18).
    held_by: "NotificationCenterPage.test.tsx — «после дедлайна висящие отвечают, затем следующий таймер: обращений по 2» (краснеет без перевзвода); ветка «пара висит — по 1»"
  - id: CX6-36
    must_hold_in_code: >-
      близнец «первая страница молчит» строится на снимке, где страница 1 — последняя в
      цепочке пары (k = 1), либо ответ отвергнутого чтения доводится до конца цепочки (все k
      страниц ответили); счёт висящих перед следующим таймером напечатан и равен 0, а «новый
      запрос» отличён от продолжения цепочки номером чтения (новый readSeq / GET без токена
      первой страницы), а не одним путём /notify/v1/inbox.
    held_by: "NotificationCenterPage.test.tsx — близнец CX6-36 «первая страница молчит — отвергнуто; пока висит — запроса нет, после её ответа — новый запрос»"

text_remarks:
  - where: "design.md З13, конец абзаца «Названный исход» дедлайна (строка 903–904): «центр держит «отвергнуто» и не выдаёт прежний снимок за текущий»"
    remark: >-
      K1 (3) ревью 20db8619 просило назвать исход порога ВМЕСТО этого обещания; редакция 10
      назвала его рядом, а фразу оставила. Под своей посылкой («лента стабильно отвечает
      медленнее предела») фраза верна: и таймерное чтение, и чтение действием получают
      «отвергнуто». Ложна она была бы без посылки — путь «один запрос висит, чтение действием
      дало снимок, таймер подавлен» теперь назван в (3). Решение не меняется; при следующей
      правке З13 стоит сослаться из фразы на «Названный исход порога», чтобы два места об одном
      экране не читались как противоречие (doc-truthfulness).

