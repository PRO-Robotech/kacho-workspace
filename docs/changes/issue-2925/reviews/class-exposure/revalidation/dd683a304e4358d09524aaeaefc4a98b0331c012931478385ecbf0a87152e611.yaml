new_items:
  - id: CX6-31
    decision: "З13 — центр стоит на ResourceListPage (приёмка §1.4, NTF6-04), и одновременно пометки берутся из снимка пары, «Показать ещё» дописывает страницу к снимку, а «самостоятельного перечитывания одного ключа центра нет»"
    class: "code-authoring §«Унификация и стоимость» (опора на общий компонент берёт его семантику: он опрашивает и владеет дочитыванием); §«Решение и его следствие разнесены» (строки видны из одного источника, пометки считаются из другого)"
    measured: >-
      ResourceListPage.tsx @1d42a6728bf: Props — 7 полей (spec, parentField, parentParam,
      parentValue, pageSize, panelForms, disableChildRoute), ни одно не принимает строки, не
      отключает опрос и не перехватывает дочитывание; запрос ленты — свой useResourceList
      (строка 123), кнопка «Показать ещё» — свой fetchMore (строка 724). use-resource-list.ts:
      useInfiniteQuery, refetchInterval `streamed ? false : 3_000` (строка 208), staleTime 0
      (строка 212); streamed истинно только для предмета потока (use-resource-stream.ts:140),
      а ленте поток не открывается (приёмка Р4) — лента центра перечитывается каждые 3 с всеми
      загруженными страницами. Полоса S2 (tasks.md) пишет только
      ui-future/notify/src/pages/NotificationCenterPage/** и InboxItemRow/** — shared
      ResourceListPage в её путях нет.
    must_hold: >-
      одно из двух, выбранное в замысле с держателем: (а) ResourceListPage получает названные
      свойства — источник строк извне (снимок) и управляемое дочитывание, опрос выключаем, — и
      правка shared идёт полосой с путями ResourceListPage и пробами на всех существующих
      потребителях (поведение по умолчанию прежнее); либо (б) центр строит ленту своим запросом
      на общих ResourceTable и прочих компонентах §1.4, без ResourceListPage, — это расходится с
      приёмкой NTF6-04 («NotificationCenterPage на ResourceListPage») и тогда — вернуть в
      приёмку. В обоих случаях строки на экране и пометки считаются из ОДНОГО снимка: строка,
      пришедшая опросом и не вошедшая в снимок, не показывается без пометки, вычисленной по
      той же паре. Проба: опрос ленты приносит новую верхнюю строку между парами — строки и
      пометки меняются одним переходом либо не меняются вовсе.
    held_by: "NotificationCenterPage.test.tsx (новая ветка «опрос между парами»); при (а) — пробы ResourceListPage на существующих потребителях"
    design_mapping: "нет: З13 называет ResourceListPage и снимок, не называя, как одно встаёт на другое; «одиночного перечитывания нет» ложно при refetchInterval 3 с"
    verdict: does-not-hold
  - id: CX6-32
    decision: "З13 п.(2) — снимок после отметки: refetchQueries обоих ключей с cancelRefetch: true, снимок — после Promise.all; «отказ любого из двух — экран в «отвергнуто», снимок не обновляется»; п.(3) «Показать ещё» дописывает к снимку"
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (отказ, «не спрашивали» и «ответил не тот запрос» свёрнуты в успех); gate-authoring — пустой вход как всеразрешение (ключ не найден — пара «успешна»)"
    measured: >-
      queryClient.ts refetchQueries (5.101.2, строки 313–337): возвращает Promise<void>
      (.then(noop)) — данных пары не отдаёт; без throwOnError каждое обещание обёрнуто
      .catch(noop) — отказ перечитывания разрешает Promise.all успехом; ключи с isDisabled() и
      isStatic() отфильтрованы, при fetchStatus 'paused' — Promise.resolve() сразу; ни одного
      найденного ключа — Promise.all([]) успехом. query.ts fetch: при cancelRefetch и данных в
      кэше идущее чтение снимается silent-отменой, и его обещание подменяется обещанием НОВОГО
      чтения (строки 411–413, 589–593). infiniteQueryObserver.fetchNextPage идёт через fetch с
      cancelRefetch ?? true (queryObserver.ts:328): «Показать ещё» во время пары снимает
      перечитывание ленты, и обещание пары разрешается ответом дочитывания — прежние страницы
      плюс одна, при новых настройках. Это та самая пара «новые настройки + прежняя лента»
      сценария I1, которую CX6-29 запрещает. Отказ перечитывания оставляет в кэше прежние
      данные ключа (данные при ошибке не сбрасываются) — снимок из кэша после Promise.all
      собрал бы ту же несогласованную пару.
    must_hold_in_code: >-
      (а) снимок собирается из значений, которые вернули ДВА чтения этой пары (fetchQuery /
      fetchInfiniteQuery или refetchQueries с throwOnError: true и чтением состояния обоих ключей
      с dataUpdatedAt позже успеха отметки и status 'success'), а не из кэша после Promise.all;
      (б) отказ любого — «отвергнуто» (И4); ноль найденных ключей, пауза сети или отключённый
      ключ — не успех пары; (в) дочитывание «Показать ещё» недоступно, пока пара в полёте (или
      его ответ в пару не входит — выбрать одно); (г) перечитываются только активные ключи центра
      (type: 'active'), иначе Promise.all ждёт закэшированные ленты других фильтров модуля.
      Пробы: перечитывание ленты отвечает 503 — «отвергнуто», пометки прежние; «Показать ещё»
      во время пары — пометки не пересчитаны по прежним страницам; близнец — оба 200 — пометки
      по новой паре.
    held_by: "NotificationCenterPage.test.tsx — три ветки выше; (г) — рецензент диффа"
    design_mapping: "нет: З13 п.(2) называет refetchQueries + Promise.all как достаточный механизм"
    verdict: does-not-hold
  - id: CX6-33
    decision: "З10 — useGuardedMutation опускает флаг «по исходу этого вызова (finally)»; «Вы подписаны» — только из перечитанного списка, отправитель лишь бросает NOTIFY_SUBSCRIPTIONS_EVENT, слушатель инвалидирует ключ"
    class: "code-authoring §«Решение и его следствие разнесены» (решение «действие недоступно» снимается исходом мутации, а следствие, делающее действие ненужным, приходит отдельным чтением)"
    measured: >-
      mutation.ts execute (5.101.2): обещание mutateAsync разрешается после await
      options.onSuccess/onSettled (строки 246, 263); onSuccess действия подписки лишь вызывает
      dispatchEvent, слушатель зовёт invalidateQueries, чьё обещание никто не ждёт (З10) — флаг
      падает раньше, чем перечитанный список вернётся. В этом окне кнопка «Подписаться» видна и
      доступна: второе нажатие даёт POST → ALREADY_EXISTS (NTF3-91) → текст отказа рядом с «Вы
      подписаны» — ровно дефект I2, который охрана закрывает, в более узком окне (одно время
      ответа списка). То же у снятия подписки: второй DELETE → NOT_FOUND. У отметки, :setEntries,
      периода и контакта повтор идемпотентен (Д25; набор значений) — видимого дефекта нет.
    must_hold_in_code: >-
      для создания и снятия подписки флаг охраны опускается не раньше, чем завершится
      перечитывание списка подписок, начатое после исхода (например, хук принимает
      необязательное «дождаться следствия», которое действие подписки заполняет чтением своего
      ключа), либо кнопка недоступна, пока ключ ["notify","subscriptions"] перечитывается после
      исхода; локальный флаг «подписан» по-прежнему не заводится. Проба: POST 200, список
      отвечает позже (управляемый ответ) — нажатие в промежутке запроса не делает; после ответа
      списка — «Вы подписаны», кнопки нет; близнец — отказ POST 503 — после перечитывания кнопка
      снова доступна.
    held_by: "ResourceDetailExtensions.test.tsx, NotificationSettingsPage.test.tsx (снятие подписки)"
    design_mapping: "нет: З10 называет снятие флага по исходу вызова без оговорки о следствии"
    verdict: holds-with-condition-unmapped
  - id: CX6-34
    decision: "З10 — «Отказ mutateAsync хук не глотает: он доходит до onError действия, как у useMutation»"
    class: "code-authoring §«Унификация и стоимость» (сведение шести действий в один хук берёт самую узкую семантику — useMutation.mutate)"
    measured: >-
      react-query useMutation.ts (5.101.2, строки 52–56): mutate = observer.mutate(...).catch(noop)
      — onError доходит через опции, а обещание вызывающему не отказывает; mutateAsync — голое
      обещание. «Как у useMutation» и «не глотает» — разные семантики: хук, возвращающий
      обещание mutateAsync обработчику onClick без catch, даёт необработанный отказ на каждый
      отказ мутации. В дереве каждый из 5 вызовов mutateAsync вне тестов обёрнут своим try/catch
      (например RoutesPanel.tsx:284–289); ловца необработанных отказов в ui-future нет
      (git grep pageerror|unhandledrejection|unhandledRejection → 0) — гейт этого не увидит.
    must_hold_in_code: >-
      вызов, который хук отдаёт действию, — форма mutate: возвращает void, onError доходит один
      раз через опции, цепочка кончается catch(noop) после finally; либо хук отдаёт обещание и
      каждый вызывающий обязан его ловить — выбрать одно и записать в З10. Проба в
      useGuardedMutation.test.tsx: mutationFn отказывает — onError вызван 1 раз, необработанных
      отказов 0 (process.on('unhandledRejection') в пробе), флаг опущен.
    held_by: "useGuardedMutation.test.tsx (ветка «отказ»)"
    design_mapping: "нет: формулировка З10 допускает обе семантики"
    verdict: holds-with-condition-unmapped

