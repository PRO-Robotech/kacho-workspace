# Экспозиция классов — пересверка (revalidation) замысла NTF-6 (консоль: центр уведомлений,
# личные настройки, контакты аккаунта), редакция 5 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. Первичный разбор (initial/47bd8b70….yaml) и пересверки на
# редакции 1 (7613071f), 2 (deeea79a), 3 (defdbe67) и 4 (7294a684) свидетельствуют о своих
# редакциях и здесь не переписываются. Проверено: (1) каждый пункт CX6-01…30 отображён и
# отображение выдерживает условие пункта; (2) новые внешние вызовы, (3) новые асинхронные пути,
# (4) новые sentinel-значения, внесённые редакцией 5 сверх редакции 4. Редакция 5 заводит хук
# синхронной охраны мутаций и снимок пары «настройки + лента», собираемый из перечитываний
# клиента запросов. Оба механизма разобраны против исходника @tanstack/query-core 5.101.2 и
# против общего компонента `ResourceListPage`, на котором стоит центр; отсюда новые пункты
# CX6-31…34.
