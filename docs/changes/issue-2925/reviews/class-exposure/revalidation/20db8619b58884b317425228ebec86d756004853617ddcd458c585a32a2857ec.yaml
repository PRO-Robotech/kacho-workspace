      на то, что перестановка ставит полную константу, — условие к коду ниже.
  - id: CX6-39
    design: "З13 условие (3); §8 строка «висящих HTTP-запросов центра»; §11 строка CX6-39; З18; tasks.md S2; шапка"
    verdict: holds
    note: >-
      единица — висящие запросы по обоим путям, счёт модуля, снятие по любому исходу независимо
      от признака «текущее»: закрывает все три невидимых прежде вида (устаревшие по gen++,
      прежний экземпляр, осиротевшая попытка 1) и ветку (iii) c0e3b6a5 («навсегда отвергнуто»).
      Порог «больше нуля» — наименьший, при котором таймерный путь жив. Арифметика центра верна:
      одно чтение — настройки параллельно со страницами подряд — 2; единственный повтор
      notifyQueryRetry (failureCount < 1) — осиротевший запрос плюс пара — 3. Хвост действий
      пользователя назван числом на действие. Две неточности, не меняющие решения: число «с
      циклом хоста — 5» (text_remarks) и формулировка близнеца (б) (условие к коду).

conditions_to_code:
  - id: CX6-39
    must_hold_in_code: >-
      (1) счёт висящих — состояние уровня модуля и переживает случай пробы. Каждый случай
      «бюджета висящих запросов» начинается при счёте 0, и этот счёт напечатан до первого
      действия: либо изоляция модуля на случай (jest.isolateModules / resetModules с повторным
      импортом), либо afterEach разрешает все висящие обещания подменённого клиента и утверждает
      счёт 0. Без этого ветки «следующий таймер не стартует» ((а) после 60 с, (в)) зеленеют
      от счёта, унаследованного от предыдущего случая, а близнецы краснеют от него же.
      (2) близнец (б): отвечают ВСЕ висящие запросы отвергнутого чтения (в (а) их 2 — настройки и
      страница), либо сценарий строится так, что висит ровно один (настройки ответили до
      дедлайна, страница молчит). Счёт перед следующим таймером напечатан и равен 0. Ответ одного
      из двух оставляет счёт 1, и таймер верно не стартует: такой «близнец» краснеет на верном
      коде. (3) −1 ставится в finally того же обещания, на котором стоит +1, — и для
      синхронного броска клиента тоже (обёртка async либо try/finally вокруг вызова).
    held_by: "NotificationCenterPage.test.tsx (ветка «бюджет висящих запросов»; счёт в начале случая напечатан)"
  - id: CX6-37
    must_hold_in_code: >-
      перестановка дедлайна ставит setTimeout ровно с константой CENTER_READ_DEADLINE_MS (отсчёт
      от ответа, как §8), а не с остатком «дедлайн минус прошедшее»; таймер опроса — setTimeout с
      CENTER_POLL_MS, а не setInterval. Иначе фильтр шпиона по задержке не видит таймеров центра,
      и ветки «новых таймеров 0» зеленеют пусто. Альтернатива, снимающая зависимость, — порт часов
      хука, которым проба считает таймеры центра поимённо.
    held_by: "NotificationCenterPage.test.tsx (ветки «размонтирование при чтении в полёте», «устаревшее чтение не переставляет таймер»): близнец (2) «ровно один новый таймер CENTER_READ_DEADLINE_MS» краснеет, если перестановка ставит остаток"

text_remarks:
  - where: "З13 условие (3) «Число»; §8 строка «висящих HTTP-запросов центра на таймерном пути» (колонка значения «с циклом хоста — 5»)"
    remark: >-
      «с циклом хоста З9 — не больше 5» предполагает у хоста одну пару в полёте. З9 этого не
      обещает: у цикла хоста нет порога по висящим, запрос не отменяется, и хвост хоста ограничен
      сроками края — 30 с при молчащем апстриме, 60 с при зависшем соединении, при медленно
      отдающем апстриме только ими (З9 «Предел хвоста»). Отметка на экране центра добавляет,
      кроме пары центра, ещё и пару хоста (NOTIFY_SEEN_EVENT, gen++). Фраза верна при одном
      цикле хоста в полёте; следует дописать это условие и сослаться на хвост хоста З9, а в
      хвост отметки добавить пару хоста. Решение не меняется: вклад центра ограничен порогом
      «больше нуля» — наименьшим, какой оставляет опрос живым, — а хвост хоста — предмет З9
      (CX6-27 (а)), уже названный. Ошибка перенесена из c0e3b6a5 conditions_to_code CX6-39 (2)
      («с циклом хоста З9 — 4»): неточность в той записи, а не в переносе.

