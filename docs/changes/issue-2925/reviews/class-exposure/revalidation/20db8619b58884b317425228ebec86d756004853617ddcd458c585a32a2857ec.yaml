    design: "З13 условие (2); §11 строка CX6-37; З18; tasks.md S2"
    verdict: holds
    note: >-
      проба больше не краснеет на верном коде: таймер сборки react-query (задержка 0) и повтор
      (1 000 мс) задержкой отличаются от CENTER_POLL_MS (3 с) и CENTER_READ_DEADLINE_MS (30 с),
