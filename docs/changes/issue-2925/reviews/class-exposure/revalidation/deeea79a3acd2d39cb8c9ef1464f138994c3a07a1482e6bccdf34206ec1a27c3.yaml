approval_conditions:
  # Пять условий, запрещающих DESIGN_APPROVED по части разбора классов (SDD-1 §5; CLASS-05, 08, 09, 10;
  # DESIGN-02). Исход по каждому — на отпечатке deeea79a.
  - condition: "каждый пункт первичного разбора и прежней пересверки отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
