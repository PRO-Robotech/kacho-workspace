    detail: >-
      строк отображения 24 из 24 (CX6-06 двумя строками); 23 выдерживают, из них CX6-22 — с условием к коду.
      CX6-10 не выдерживает: перепись тестовых перечней M2 неполна — в
      дереве 6 перечней модулей, написанных руками, а не 2; три из них (CONSOLE_APPS в
      iam-pages-authz-single-source.test.ts, ResourceIcon.registry.test.ts,
      spec-columns.bool-labels.test.ts) решения в замысле не имеют, четвёртый (REMOTES в
      ui-chart-remote-entry-cache.test.ts) решён в З3, но в §10 не назван.
  - condition: "новый внешний вызов заведён пунктом и отображён (CG_CLASS_NEW_EXTERNAL_CALL)"
    result: green
    detail: "новых внешних вызовов сверх редакции 1 нет; обход /iam/v1/users (CX6-24) теперь несёт accountId"
  - condition: "новый асинхронный путь заведён пунктом и отображён (CG_CLASS_NEW_ASYNC_PATH)"
    result: green
    detail: >-
      1 новый: rememberLoad — общее обещание загрузки модуля с публикацией исхода подписчикам и
      снятием отклонённого (З14). Заведён пунктом CX6-25; отображён решением З14 с держателем
      rememberLoad.test.ts; условие к коду — снятие по идентичности обещания. useUnreadPoll и
      useNotifySubscriptionsSync — форма уже заведённых путей (CX6-05, CX6-20), не новые пути.
  - condition: "новое sentinel-значение заведено пунктом и отображено (CG_CLASS_NEW_SENTINEL)"
    result: green
    detail: >-
      состояния available/unavailable подписчика rememberLoad — в пункте CX6-25; ResponseShapeError
      заменяет ApiError(200) пункта CX6-22 и отображён; Error("listAllAccountUsers: accountId
      required") недостижим с экрана (обход без аккаунта не начинается, З13) — не исход, видимый
      пользователю.
  - condition: "нет маркеров отсрочки и открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: green
    detail: >-
      grep -niE 'TODO|TBD|FIXME|XXX|позже|потом|отлож' → 3 попадания, все — слово «потому»; §13
      «Открытые решения — нет»; выбор по CX6-23 сделан (вариант (а)).

