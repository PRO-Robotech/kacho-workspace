new_items:
  - id: CX6-25
    source: "З14 «Одна загрузка — один исход для маршрута и кнопки» (rememberLoad, новый в редакции 2)"
    kind: async_path
    class: "code-authoring §«Решение и его следствие разнесены» (общий исход, снимаемый не тем, кто его положил)"
    exposure: >-
      rememberLoad хранит обещание загрузки модуля и снимает отклонённое в момент отказа; маршрут
      (свежий lazy на каждую попытку makeRemote) и предзагрузка кнопки рейла зовут один загрузчик.
      Если снятие безусловное (stored = null в обработчике отказа), обработчик отказа прежнего
      обещания, сработавший после того, как повтор уже положил новое, снимет НОВОЕ — следующий вызов
      начнёт третью загрузку, а подписчики получат исход не той загрузки. Подписчик до первого исхода
      находится в третьем, неназванном состоянии (загрузка в полёте): кнопка в нём рисуется без
      признака недоступности.
    condition: >-
      снятие по идентичности: отказ снимает хранимое обещание, только если хранимое — то самое
      отклонённое (stored === p); исход подписчику публикует только текущее хранимое обещание;
      состояние подписчика до исхода названо в коде третьим значением, и ветка кнопки рейла на нём
      определена явно.
    mapped_in_design: true
    mapping: "З14 (решение и держатель rememberLoad.test.ts); строки §11 у пункта нет — пункт заведён этой пересверкой"
    outcome: к-коду
    held_by: "rememberLoad.test.ts — нужна ветка «отказ прежнего обещания после начала повтора не снимает новое»; в перечне З14 её нет, заказ"

