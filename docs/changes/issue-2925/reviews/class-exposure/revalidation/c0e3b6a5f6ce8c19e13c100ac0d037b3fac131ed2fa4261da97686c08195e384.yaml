mapping_check:
  - {id: "CX6-01…CX6-35", design: "без изменений против 1e70adcd", verdict: holds, note: "по Д26 не перемерялись: дельта их строк не трогает (строки CX6-35 и CX6-36 основной таблицы не изменены)"}
  - id: CX6-36
    design: "З13 условие (1); §11 строка «CX6-36 (условие к коду)»; З18; tasks.md S2"
    verdict: holds
    note: >-
      условие перенесено дословно; проба различает варианты: retryDelay не задан — повтор через
      1000 * 2^0 = 1 000 мс (retryer.ts defaultRetryDelay, M31), поэтому «503 на 1-й с → повтор
      на 2-й с → дедлайн на 31-й с, а не на 55-й» — одно следствие. Близнец меняет ровно один
      факт (чья попытка отвечает).
  - id: CX6-37
    design: "З13 условие (2); §11 строка CX6-37; З18; tasks.md S2"
    verdict: does_not_hold
    note: >-
      условие к механизму (а), (б) выдерживает. Проба-держатель — нет: её предикат
      «jest.getTimerCount() 0» после ответа размонтированного экземпляра краснеет на ВЕРНОМ коде,
      а близнец «смонтирован — счёт 1» неисполним. Измерено: ответ чтения завершает fetch, в его
      finally — scheduleGc (query.ts:623); gcTime 0 проходит isValidTimeout (utils.ts:107–108:
      число ≥ 0 и не Infinity), и таймер ставится timeoutManager.setTimeout, чей
      defaultTimeoutProvider зовёт ГЛОБАЛЬНЫЙ setTimeout в момент вызова (timeoutManager.ts:44),
      то есть поддельные часы jest его считают. После ответа висит минимум один таймер
      react-query. У смонтированного экземпляра, кроме перестановленного дедлайна, живёт
      периодический CENTER_POLL_MS (З13: «таймер при чтении в полёте схлопывается в него», §8:
      3 с), значит счёт ≥ 2, и «1» недостижимо. Предикат перенесён дословно из записи 1e70adcd.
  - id: CX6-38
    design: "§9 Е7; З13 довод I1; §11 строка CX6-38; tasks.md §1 Е7"
    verdict: holds
    note: >-
      предикат снятия — на внешнем факте и умеет ответить «нет»: перемерено сегодня —
      grep -c 'CX3E-06' docs/changes/issue-2918/reviews/class-exposure/initial/97afc066….yaml → 3,
      ls docs/changes/issue-2918/reviews/class-exposure/ → только initial (каталога revalidation
      нет). Замечание к тексту (не к отображению): довод I1 в З13 (строка 786) говорит «граница
      сверки seen_up_to не выше позиций транзакций приёма в полёте». «Не выше» разрешает
      равенство, а seen_up_to = P делает P «просмотренной». Значит, граница, равная позиции
      транзакции в полёте, накрывает ту самую невидимую строку. Е7 (§9) говорит верно:
      «наибольшая позиция без транзакций приёма в полёте». Два места об одном предмете
      расходятся на единицу; следует привести I1 к «строго ниже наименьшей позиции транзакции
      приёма в полёте».
  - id: CX6-39
    design: "З13 условие (3); §11 строка CX6-39; З18; tasks.md S2; шапка редакции 8"
    verdict: does_not_hold
    note: >-
      (i) Число. Условие (3) пускает таймерное чтение, пока висящих отвергнутых ≤ 1, поэтому
      висящих наборов центра до 2. Набор — это настройки и страница (З13: пара параллельно),
      то есть 4 запроса. Цикл хоста З9 — ещё 2 (listInbox + getPreferences параллельно; З9,
      строки 510–511). Всего 6. Шапка редакции 8 отвергает исход (б) доводом, что его хвост
      «вместе с опросом хоста равен этому пределу» (6 у источника по HTTP/1.1 при tls: []). Но
      исход (а) с порогом «> 1» даёт те же 6. Довод выбора ложен, и класс (пул соединений
      источника, который запросы vpc, compute и прочих модулей ждут за зависшим notify) не
      удержан. Предел «≤ 2 набора» предписала запись 1e70adcd: ошибка её, не переноса.
      (ii) Единица. Условие считает только чтения, «отвергнутые дедлайном», и только у
      экземпляра. Три вида висящих запросов туда не попадают. Во-первых, чтения, устаревшие по
      gen++ от смены фильтра: смену фильтра И19 не охраняет, условие (3) её явно не задерживает,
      и каждое переключение при зависшем апстриме оставляет ещё набор. Во-вторых, чтения
      прежнего экземпляра после перемонтирования: readSeq — счётчик модуля, а счёт висящих —
      экземпляра. В-третьих, запрос попытки 1, осиротевший после успешного повтора: чтение
      завершено, а его запрос настроек ещё висит. Поэтому фраза «одновременно висящих наборов —
      не больше двух» условием не гарантирована. Проба считает только /notify/v1/inbox и
      висящие /notify/v1/preferences не видит.
      (iii) Связь с условием (2)(б): (б) запрещает не-текущему чтению переставлять таймер и
      применять исход. Если автор закроет обёртку «ответ получен» признаком «текущее» целиком,
      то ответ висящего отвергнутого чтения не снимет его из счёта. Центр тогда навсегда
      остаётся в «отвергнуто», и после восстановления сети тоже. Близнец «ответ приходит,
      следующее чтение стартует» не говорит, ЧЕЙ ответ, и эту ветку не различает.

conditions_to_code:
  - id: CX6-37
    must_hold_in_code: >-
      проба считает таймеры ЦЕНТРА, а не все таймеры окна. Годится шпион setTimeout с
      фильтром по задержке CENTER_READ_DEADLINE_MS и CENTER_POLL_MS либо порт часов хука. Годится
      и getTimerCount после того, как таймеры react-query исполнены (jest.runOnlyPendingTimers до
      замера), с напечатанным счётом до и после. Ветки: (1) размонтирован при чтении в полёте,
      затем чтение отвечает — новых таймеров задержкой CENTER_READ_DEADLINE_MS 0, таймеров
      CENTER_POLL_MS 0, обновлений состояния 0; (2) близнец — смонтирован, ответ ставит ровно
      один таймер задержкой CENTER_READ_DEADLINE_MS; (3) отметка во время чтения, затем
      устаревшее чтение отвечает — таймеров задержкой CENTER_READ_DEADLINE_MS после его ответа 0.
    held_by: "NotificationCenterPage.test.tsx (ветки «размонтирование при чтении в полёте», «устаревшее чтение не переставляет таймер») с исправленным предикатом"
  - id: CX6-39
    must_hold_in_code: >-
      (1) единица — висящие HTTP-запросы центра по ОБОИМ путям (/notify/v1/preferences и
      /notify/v1/inbox). Счёт ведёт уже существующая обёртка «ответ получен»: +1 на вызове
      клиента, −1 на любом его исходе (значение, отказ). Решение о текущем чтении, попытке и
      смонтированности в счёт не входит, а условие (2)(б) решает только перестановку таймера и
      применение исхода. Счёт уровня модуля, как readSeq. (2) порог: таймерное чтение не
      стартует, пока висит хотя бы один запрос центра, не принадлежащий текущему чтению. Тогда
      висящих запросов центра таймерного пути не больше 2 (один набор), с циклом хоста З9 — 4,
      ниже предела 6 источника по HTTP/1.1. Число — в З13 и §8 с этой арифметикой. (3) фраза о
      пределе утверждает то, что даёт условие: смена фильтра и отметка начинают чтение вне
      порога (обе — действия пользователя, отметка ещё и охранена И19). Хвост смены фильтра
      назван словами «по 2 запроса на переключение, пока апстрим висит», либо смена фильтра
      тоже входит в порог. Выбор записывается одной фразой, без нового механизма. Проба: (а)
      ответы молчат 60 с управляемых часов — одновременно висящих запросов к ОБОИМ путям ≤ 2
      на таймерном пути, счёт напечатан; (б) близнец — ответ пришёл у ВИСЯЩЕГО отвергнутого
      запроса, следующий таймер стартует чтение; (в) повтор: попытка 1 — страница 503, её
      настройки висят, повтор отвечает 200 — осиротевший запрос настроек в счёте есть,
      следующий таймер не стартует до его ответа; (г) при выбранной форме (3) — смена фильтра
      при висящем наборе даёт названное число.
    held_by: "NotificationCenterPage.test.tsx (ветка «бюджет висящих чтений», счёт висящих запросов подменённого клиента по двум путям)"

