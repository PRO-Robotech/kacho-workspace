# Экспозиция классов — пересверка (revalidation) замысла NTF-6 (консоль: центр уведомлений,
# личные настройки, контакты аккаунта), редакция 8 замысла — заход отображения по Д26.
#
# Привязана к отпечатку ЗАМЫСЛА. Первичный разбор (initial/47bd8b70….yaml) и пересверки на
# редакции 1–7 свидетельствуют о своих редакциях и здесь не переписываются. По Д26 судятся только
# строки отображения («Строки отображения пересверки 1e70adcd» в §11, З13 «Условия к коду
# пересверки 1e70adcd», З18, §9 Е7, tasks.md S2 и §1 Е7) и дельта a59e93d23 против 02796a2bf.
# Четыре условия: (1) каждый пункт отображён и отображение выдерживает условие пункта;
# (2) нового внешнего вызова, (3) нового асинхронного пути, (4) нового sentinel-значения дельта
# не вносит либо они заведены пунктом.
#
# Два дефекта ниже (CX6-37 — предикат пробы; CX6-39 — предел 2 набора) внесены прежней
# пересверкой 1e70adcd: замысел перенёс её формулировки дословно. Ошибка — в записи 1e70adcd,
# а не в переносе; запись 1e70adcd не правится, поправка — здесь.
