new_items:
  - id: CX6-20
    source: "З10 (событие окна NOTIFY_SUBSCRIPTIONS_EVENT); в приёмке его нет — заведено замыслом"
    kind: async_path
    class: "code-authoring §«Решение и его следствие разнесены» (решение в одном бандле, следствие в кэше другого)"
    exposure: >-
      замысел регистрирует слушателя «один раз на бандл при загрузке модуля notify.ts» и
      инвалидирует ключ «в QueryClient бандла». Но QueryClient создаётся страницей модуля
      (new QueryClient в семи страницах, M5), а не модулем: при загрузке notify.ts ссылки на него
      нет, а после размонтирования и повторного монтирования страницы слушатель, привязанный к
      прежнему клиенту, инвалидирует кэш, которого никто не читает — карточка остаётся на «Вы
      подписаны».
    condition: >-
      слушатель регистрируется хуком внутри дерева QueryClientProvider (useQueryClient в эффекте с
      отпиской при размонтировании), а не побочным действием загрузки модуля; событие несёт только
      имя, без данных; отправитель инвалидирует и свой ключ тем же путём.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "нужна ветка ResourceDetailExtensions.test.tsx «страница размонтирована и смонтирована заново → событие перечитывает список» — её нет, заказ"
  - id: CX6-21
    source: "З2 п.1 (state: \"loading\" | \"true\" | \"false\" | \"unread\"); приёмка Р2 знает три исхода"
    kind: sentinel
    class: "code-authoring §«Умолчание, которое становится утверждением» (четвёртое значение без своей ветки у читателя)"
    exposure: >-
      у читателей признака (маршрут /notifications/* в App.tsx, кнопка рейла, действие карточки,
      опрос) З2, З9, З10, З14 и П1 называют ветки true / false / unread, ветки "loading" нет. При
      переходе по прямой ссылке на /notifications первым рендером приходит "loading"; реализация,
      сводящая «не true и не unread» к ветке false, на время чтения показывает «Уведомления в этой
      установке не подключены» — утверждение, которого раздача не делала. Кроме того, имя состояния
      "unread" в том же модуле совпадает со словом «непрочитанное» счётчика (unread-count,
      unread-poll, unreadBadge) — два значения одного слова в одном предмете.
    condition: >-
      каждый читатель признака ветвится исчерпывающе по четырём значениям (switch с проверкой
      never), у "loading" — своя ветка: маршрут не показывает ни названную страницу, ни перевод на
      панель; состояние «не прочитано» названо словом, не совпадающим со счётчиком (например
      "unreadable").
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "нужна ветка пробы хоста App «признак в loading → нет названной страницы false и нет перевода на панель» — её нет, заказ"
  - id: CX6-22
    source: "З6 (ApiError(status = 200, code = \"RESPONSE_SHAPE\"))"
    kind: sentinel
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (исход, закодированный статусом успеха)"
    exposure: >-
      отказ формы кодируется ApiError со статусом 200. presentError переводит статус функцией
      statusFromHttp: 200 → "error" (общий заголовок), devDetail — «HTTP 200»; у всех семи
      QueryClient консоли retry: 1, значит неверная форма запрашивается повторно. Любой читатель,
      ветвящийся по err.status (успех — < 400), примет отказ за успех.
    condition: >-
      ни один читатель не ветвится по err.status === 200 или < 400 для ApiError; presentError даёт
      на RESPONSE_SHAPE текст отказа данных (проба словаря); retry для RESPONSE_SHAPE выключен
      (ответ той же сборки края не исправится повтором).
    mapped_in_design: false
    outcome: к-коду
    held_by: "notify.test.ts (З18) плюс ветка error-presentation.test.ts «RESPONSE_SHAPE → текст отказа, не общий «error»» — её нет, заказ"
  - id: CX6-23
    source: "З9 (NOTIFY_SEEN_EVENT делает цикл устаревшим: gen++ и AbortController.abort())"
    kind: async_path
    class: "code-authoring §«Решение и его следствие разнесены» (отмена, не доходящая до исполнителя)"
    exposure: >-
      общий клиент края не принимает сигнал отмены: fetchJson(method, path, body, replayed) строит
      RequestInit без signal, у api.get / api.list параметра нет. Отмена по замыслу требует правки
      shared/src/api/client.ts — её нет ни в §4, ни в §10, а радиус такой правки — все потребители
      клиента. Без неё abort() ничего не отменяет, и держит только сравнение поколения; при
      отмене же отклонение AbortError, пропущенное мимо сравнения поколения, превратит значок в «!».
    condition: >-
      замысел выбирает одно: (а) отмена не заводится, устаревший цикл отбрасывается только
      сравнением gen — на ветке успеха И на ветке отказа; либо (б) клиент получает необязательный
      signal, правка названа в §4 и §10 с радиусом, AbortError устаревшего цикла не даёт «!».
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "unread-poll.test.ts, ветка «отказ устаревшего цикла не меняет значок» — в перечне З9 её нет, заказ"
  - id: CX6-24
    source: "З13 «Контакты»: GET /iam/v1/users?pageSize=1000 до пустого токена"
    kind: external_call
    class: "code-authoring §«Умолчание, которое становится утверждением» (пустой фильтр = «все»)"
    exposure: >-
      в запросе замысла нет accountId. ListUsersRequest.account_id — фильтр аккаунта; обработчик
      передаёт его в ListFilter.AccountID, и репозиторий добавляет условие членства только при
      непустом значении — пустой читает всех, кого вызывающий видит. Приёмка Р11 требует
      «/iam/v1/users аккаунта». Пользователь, состоящий в двух аккаунтах, увидит кандидатами
      людей второго аккаунта; NTF6-39 утверждает присутствие U-A, U-B и отсутствие sa/grp, но не
      отсутствие не-члена, поэтому это не заметит. Сервер откажет при назначении (NTF6-41), но
      перечень кандидатов уже лжёт.
    condition: >-
      обход пользователей несёт accountId выбранного в хосте аккаунта; модульная проба
      NotificationContactsPage.test.tsx утверждает параметр запроса.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "нужна ветка NotificationContactsPage.test.tsx «запрос кандидатов несёт accountId» — её нет, заказ"

