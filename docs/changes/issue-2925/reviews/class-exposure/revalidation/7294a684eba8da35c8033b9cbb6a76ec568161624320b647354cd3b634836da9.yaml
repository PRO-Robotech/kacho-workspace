new_items:
  - id: CX6-26
    decision: "З2 п.3 — дедлайн T1 чтения /console-config.json: свой AbortController на чтение, setTimeout(T1) окна сам завершает чтение исходом unreadable, применение однократно по идентичности inFlight"
    class: "code-authoring §«Чужой ответ: классификация и бюджет» (третий исход «не получил ответа»); §«Умолчание, которое становится утверждением»"
    must_hold_in_code: >-
      (а) исход дедлайна — unreadable, никогда disabled/enabled; (б) таймер ставится тем же
      синхронным вызовом, что кладёт inFlight, и снимается применением любого исхода; (в) ветка
      отказа fetch после abort() находит inFlight не своим и ничего не применяет; (г) T1 читается
      одной константой §8, литерала 10000 в console-config.ts вне неё нет.
    held_by: "console-config.test.ts — три пробы B1 (З2, З18); (г) — рецензент диффа"
    design_mapping: "З2 п.3–4, З20, И18, §8 — по существу выдерживает; строки §11 нет"
    verdict: holds-unmapped
  - id: CX6-27
    decision: "З9 — дедлайн T2 цикла счётчика без отмены запроса; исход цикла — первое из «ответ пары» и «дедлайн»; запросы после дедлайна — хвост без получателя"
    class: "code-authoring §«Решение и его следствие разнесены» (исход решён дедлайном, а запрос-следствие живёт дальше)"
    must_hold_in_code: >-
      (а) предел хвоста назван и держится раздачей: префикс notify стоит в том же location
      `~ ^/(…|notify)/`, что несёт `proxy_read_timeout 30s` (configmap-nginx.yaml @1d42a6728bf,
      location на строке 132, таймауты 140–141), — отдельный location для notify без таймаута
      сделал бы хвост неограниченным при зависшем апстриме (новая пара каждые 60 с); (б) флаг «исход
      применён» — на объекте цикла, не общий на механизм.
    design_defect: >-
      З9 и §8 утверждают «каждый срабатывающий таймер находит прежний цикл завершённым», потому что
      T2 < 60 с. Это ложно: цикл, начатый фокусом или NOTIFY_SEEN_EVENT меньше чем за T2 до таймера,
      к таймеру исхода не имеет, и таймер в него схлопывается. Схлопывание верно (цикл получит исход
      не позже T2), неверен довод. «Живут, сколько их держит сеть» — предел хвоста не назван, а он
      есть (а).
    held_by: "unread-poll.test.ts (пробы B1, I3); (а) — рецензент диффа чарта: гейта, требующего таймаут у location префикса notify, в дереве нет"
    design_mapping: "З9, З20, И14, И18, §8 — строки §11 нет; довод T2 < 60 с и предел хвоста — к правке текста"
    verdict: holds-with-condition-unmapped
  - id: CX6-28
    decision: "З10, З13, И19 — одна мутация на действие: «Подписаться», отметка, сохранение матрицы, период, снятие подписки, контакт недоступны, пока мутация в полёте; охрана — `isPending` её `useMutation` (З10)"
    class: "code-authoring §«Решение и его следствие разнесены» (решение «действие недоступно» и его видимое следствие разнесены планировщиком)"
    measured: >-
      useMutation в дереве консоли — 23 файла ui-future (без node_modules) @1d42a6728bf, охрана
      отрисованным isPending (строки с isPending и disabled|loading вне тестов) — 11: замысел
      повторяет принятый в дереве образец. В @tanstack/query-core 5.101.2 состояние мутации
      доходит до React через notifyManager.batchCalls → schedule → defaultScheduler =
      systemSetTimeoutZero (setTimeout(cb, 0)); useMutation подписан через useSyncExternalStore с
      notifyManager.batchCalls(onStoreChange). Отрисованный isPending отстаёт от mutate() на одну
      макрозадачу. В окне человеческих нажатий (десятки миллисекунд) задача таймера исполняется
      раньше второго нажатия — наблюдаемого дефекта в браузере не ожидается; но в пробах на
      jest.useFakeTimers (З18: часы управляемые) setTimeout(0) не исполняется, пока часы не
      сдвинуты: проба «двойное нажатие — один запрос» с двумя синхронными нажатиями покраснеет на
      верной по замыслу реализации, а проба, сдвигающая часы между нажатиями, будет зелёной и
      гонки не испытает. Держатель И19 в нынешней форме не различает исправную и неисправную охрану,
      а граница I3 (З9, «не больше одной отметки на время ответа PATCH») опирается на И19 строго.
    must_hold_in_code: >-
      охрана читается синхронно в обработчике нажатия: флаг в useRef, поднятый до mutate() и
      снятый в onSettled, либо queryClient.isMutating({ mutationKey }) (мутация попадает в кэш и
      получает status 'pending' синхронно внутри mutate); отрисованный isPending — только для вида
      кнопки. Проба: два нажатия в одном синхронном блоке без сдвига часов — запросов 1; близнец —
      нажатие после исхода первой мутации — запросов 2.
    design_note: "З10 называет охраной `isPending` её `useMutation`; сохранить его как вид кнопки и назвать синхронную охрану — одной фразой в З10, И19"
    held_by: "ResourceDetailExtensions.test.tsx, NotificationCenterPage.test.tsx, NotificationSettingsPage.test.tsx, NotificationContactsPage.test.tsx — в форме «два нажатия в одном синхронном блоке без сдвига часов»"
    design_mapping: "З10, З13, И19 — по существу выдерживает при условии к коду; строки §11 нет"
    verdict: holds-with-condition-unmapped
  - id: CX6-29
    decision: "З13 «Центр» — после успешной отметки перечитываются настройки И загруженные страницы ленты; действующая позиция ищется в перечитанной ленте (I1, Д25)"
    class: "code-authoring §«Решение и его следствие разнесены» (одно решение — пометки — из двух независимых чтений)"
    must_hold_in_code: >-
      пометки после отметки вычисляются из пары, оба чтения которой начаты после успеха; промежуточная
      пара «новые настройки + прежняя лента» пометок не пересчитывает. Иначе в сценарии I1 (сервер
      оставил позицию новее верхней загруженной строки) настройки, отвечающие первыми, дают
      «не найдено, токен есть» → Р18 помечает новым всё загруженное до прихода ленты. Проба:
      управляемые ответы, настройки отвечают раньше ленты — ни в один момент не помечено всё
      загруженное; близнец — лента раньше настроек.
    held_by: "NotificationCenterPage.test.tsx (строка I1 З18 расширяется порядком ответов)"
    design_mapping: "З13, П3 — по существу выдерживает («ищет её в перечитанной ленте»); строки §11 нет"
    verdict: holds-with-condition-unmapped
  - id: CX6-30
    decision: "З13, П3, Е6 — опора на монотонную отметку соседа (Д25): владелец пишет наибольшее из хранимого и присланного"
    class: "code-authoring §«Контракт, который нельзя выразить» (позиция на проводе — строка, у владельца — последовательность базы; «наибольшее» строкой и числом расходятся на смене числа разрядов); measurement-discipline §«Предикат — только с контролем»"
    measured: >-
      предикат снятия Е6 (`sed -n '/^\*\*Р10\./,/^\*\*Р11\./p' <приёмка NTF-3> | grep -ciE
      'GREATEST|только вперёд'` ≥ 1) на закоммиченной редакции 88ad95c6 → 0 (верно: Д25 нет); на
      незакоммиченной правке автора NTF-3 (рабочее дерево issue-880, c481e642), которая Д25 вносит
      («Сервер записывает наибольшее … откат назад невозможен», сценарий NTF3-161), → тоже 0.
      Предикат отвечает «нет» и тогда, когда зависимость снята: он судит слово, а не предмет.
    must_hold: >-
      (а) Е6 снимается по якорю, а не по слову: сценарий монотонности (сейчас NTF3-161) есть в Р10
      одобренного отпечатка NTF-3 — предикат по ID сценария и записи APPROVED; (б) «наибольшее»
      у владельца — в порядке позиции ленты (последовательность Р9), а не в строковом порядке; у
      сценария соседа позиции пересекают смену числа разрядов (например 9 → 10), иначе строковое
      сравнение пройдёт его зелёным.
    held_by: "(а) — правка Е6 замысла и tasks.md Е6; (б) — приёмка NTF-3 и её держатель (заказ)"
    design_mapping: "Е6, З13 — предикат снятия слеп; строки §11 нет"
    verdict: does-not-hold

