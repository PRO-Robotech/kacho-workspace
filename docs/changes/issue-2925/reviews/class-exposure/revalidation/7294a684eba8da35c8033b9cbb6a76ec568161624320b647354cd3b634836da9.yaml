# личные настройки, контакты аккаунта), редакция 4 замысла.
#
# Привязана к отпечатку ЗАМЫСЛА. Первичный разбор (initial/47bd8b70….yaml) и пересверки на
# редакции 1 (7613071f), 2 (deeea79a) и 3 (defdbe67) свидетельствуют о своих редакциях и здесь не
# переписываются. Проверено: (1) каждый пункт CX6-01…25 отображён и отображение выдерживает условие
# пункта; (2) новые внешние вызовы, (3) новые асинхронные пути, (4) новые sentinel-значения,
# внесённые редакцией 4 сверх редакции 3. Редакция 4 заводит два таймера дедлайна, первую в дереве
# отмену запроса, охрану «одна мутация на действие» и перечитывание ленты после отметки, а также
# опирается на новую семантику соседа (Д25, Е6). Это новые пункты CX6-26…30; строк §11 у них нет.
