important:
  - id: N3
    coordinate: "design.md §13; З13 условие (3) «Названный исход порога»; §8 строка «висящих HTTP-запросов»"
    finding: >-
      Одобрение относится к замыслу, как он написан: исход «экран держит последний снимок без
      обновления и без срока, пока висит запрос прежнего чтения» назван, И18 держится, распределённое
      свойство и безопасность не затронуты. Против NTF6-04 («строка появляется без перезагрузки»)
      его приемлемость не решена — это вопрос владельцу §13. Ответ «неприемлемо» — новое решение
      (индикатор или переход в «отвергнуто» по сроку подавления), новый отпечаток и повтор этой
      роли; полоса S2 по нынешнему механизму тогда переписывается.
    requirement: "не раздавать S2 до ответа владельца на вопрос §13; прочие полосы от него не зависят"
    lane: "S2 (раздачу держит диспетчер)"
  - id: N4
    coordinate: "design.md З13 строки 919–922 (условие (2): «таймер опроса — setTimeout, а не setInterval»); З13 условие (3) «Порог»"
    finding: >-
      Цепочка setTimeout без перевзвода на пропуске порогом или схлопывании гасит опрос навсегда:
      после ответа висящих нового таймера нет. В тексте замысла правило перевзвода не написано;
      его несёт только условие к коду пересверки e05384ce CX6-35 (1), а держит проба CX6-35
      «висящие отвечают → по 2» и близнец CX6-39 (б). Держатель у свойства есть, поэтому
      неблокирующее; повтора в замысле этот заход (Д26) не требует.
    requirement: "реализатор S2 берёт условие к коду CX6-35 (1) пересверки e05384ce дословно; рецензент диффа сверяет перевзвод в обеих ветках (пропуск порогом, схлопывание)"
    lane: "S2"
  - id: N5
    coordinate: "design.md З13 строки 898–902 («Если лента стабильно отвечает медленнее … не выдаёт прежний снимок за текущий»)"
    finding: >-
      Фраза верна в своём сценарии (стабильно медленная лента: каждое чтение отвергается), но
      стоит рядом с новым названным исходом порога, где снимок держится без обновления. Два места
      об одном предмете без ссылки — то же text_remarks пересверки e05384ce (строка 904).
    requirement: "при следующей редакции З13 — ссылка из фразы на «Названный исход порога»; отдельного захода не требует"
    lane: "S2 (текст замысла; кода не меняет)"

orders:
