blocking:
  - id: B1
    coordinate: "design.md §2 З2 п.3–4 (строки 127–138), З9 (строки 357–366), §8 таблица величин (строки 808–817), §9"
    finding: >-
      Ни у чтения /console-config.json, ни у цикла опроса счётчика нет дедлайна, а оба механизма
      держат «не больше одного в полёте». Общий клиент края запрос без предела времени (M15; init
      fetchJson без signal @1d42a6728bf), у fetch браузера своего предела нет. Следствия:
      (а) первое чтение признака не отвечает — окно навсегда в loading: выход по фокусу и «Повторить»
      есть только из unreadable, кнопки нет, маршрут крутит Spin; (б) цикл опроса не отвечает — таймер
      и фокус схлопываются в него бессрочно, значок держит прежний счёт без «!», хотя приёмка
      (Р18, «Ответ не получен») требует «!» вместо сохранённого счёта. Сломана живость механизма, а не
      И3/И14. Поведение утверждает приёмка, поэтому условие — в замысел, а не в приёмку (Д22).
    requirement: >-
      Назвать предел времени у каждого из двух путей и внести его в §8 одним местом:
      (1) console-config — fetch с AbortSignal.timeout(T1). У простого fetch сигнал есть, M15 касается
      только client.ts. Истечение → unreadable, дальше обычный выход по фокусу и «Повторить».
      (2) unread-poll — дедлайн цикла T2 на управляемых часах без отмены запроса (З9 в силе): по
      истечении цикл покидает «в полёте», его исход — отказ, «!» при текущем gen; опоздавший ответ
      отбрасывается поколением. Ввести инвариант «механизм с дедупликацией в полёте не остаётся в
      полёте дольше своего дедлайна» с держателями: console-config.test «чтение не отвечает → по
      истечении T1 unreadable; фокус начинает новое чтение»; unread-poll.test «цикл не отвечает → по
      истечении T2 значок «!»; следующий таймер начинает цикл; опоздавший ответ не меняет значок».
      Разнести пробы в tasks.md F1 и S5. Дедлайн — новый элемент асинхронного пути, после правки нужна
      пересверка разбора классов на новом отпечатке.
    return_to: автор замысла (acceptance-author)

important:
  - id: I1
    coordinate: "design.md З13 «Центр» (строка 470), П3 (строка 764); NTF-3 Р10 (acceptance NTF-3 строки 885–905)"
    finding: >-
      «Отметить всё просмотренным» пишет patchSeenUpTo(items[0].position) со страницы, загруженной
      раньше. PATCH NTF-3 устанавливает значение: последний писатель побеждает, сверки нет. Окно,
      открытое давно, либо второе устройство откатит seen_up_to назад, и уже просмотренное снова станет
      «новым». Позиция приёма у notify монотонна (NTF-3 Р9), консоль позиции сравнивает только на
      равенство (Р18) и защититься сама не может.
    requirement: >-
      Назвать это в замысле и завести внешнюю зависимость Е6 к NTF-3: продвижение seen_up_to только
      вперёд атомарным CAS у владельца (UPDATE … SET seen_up_to=$p WHERE seen_up_to='' OR
      seen_up_to < $p), либо записанное в приёмке NTF-3 «последний писатель побеждает» как принятый
      размен. NTF-6 от выбора не блокируется, но выбор обязан быть назван.
    order_to: автор NTF-3 (через диспетчера)
  - id: I2
    coordinate: "design.md З10 (строка 378 и далее), П4 (строка 773)"
    finding: >-
      Не сказано, что действие «Подписаться» не принимает второго нажатия, пока мутация в полёте.
      Дубля в базе не будет (NTF3-91, UNIQUE → ALREADY_EXISTS). Но второе нажатие покажет текст отказа
      409 рядом с «Вы подписаны» из перечитанного списка.
    requirement: "назвать: пока мутация подписки в полёте, действие недоступно (одна мутация на цель); держатель — ветка ResourceDetailExtensions.test.tsx «двойное нажатие — один POST»"
  - id: I3
    coordinate: "design.md З9 (строка 364); приёмка NTF-6 строки 676–680"
    finding: >-
      Приёмка говорит «в полёте не больше одного цикла» и тут же — «делает начатые циклы устаревшими и
      начинает новый». Замысел пишет «могут быть два», но без отмены каждая отметка во время цикла
      добавляет ещё один устаревший цикл.
    requirement: "назвать границу точно: текущий цикл — один, устаревших — не больше числа отметок за время их полёта, каждый ограничен дедлайном B1; указать, как это читается против фразы приёмки"

