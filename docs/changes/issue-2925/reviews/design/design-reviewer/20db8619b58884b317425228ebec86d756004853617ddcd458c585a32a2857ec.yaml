blocking:
  - id: K1
    coordinate: >-
      design.md З13 строки 868–869 и 880–881 («следующий таймер начинает новое чтение … с новым
      запросом»); З13 условие к коду (3), строки 907–910 (порог «не стартует, пока счёт больше
      нуля»); З13 держатели, строки 962–965 и 971; §8 строка CENTER_READ_DEADLINE_MS (1379);
      З18 строки CX6-35 (1133) и CX6-36 (1134); §11 строка CX6-35 (1507); З20 строка «чтение
      центра» (1178); tasks.md S2, проба 11 (CX6-35) против проб 17–18 (CX6-39 (а)/(б)).
    finding: >-
      Порог CX6-39, введённый редакциями 8–9, противоречит строкам CX6-35, CX6-36 и З20, которые
      написаны раньше и не правились. Случай: пара не отвечает, по CENTER_READ_DEADLINE_MS чтение
      получает исход «отвергнуто», оба запроса висят, счёт висящих равен 2. По условию (3)
      следующий таймер CENTER_POLL_MS чтения не начинает, пока счёт больше нуля; проба CX6-39 (б)
      это утверждает («отвечает висящий отвергнутый запрос — следующий таймер стартует»). Проба
      CX6-35 на том же входе требует «после дедлайна следующий таймер — обращений к preferences и
      inbox по 2», а CX6-36 — «новый запрос следующим таймером». Одна из двух проб краснеет на
      любом коде, поэтому полоса S2 зелёной быть не может.
      Строка З20 «чтение центра» утверждает, что выход после дедлайна идёт мимо зависшего
      чтения. После порога это ложно: таймерный путь ждёт, пока висящие запросы ответят, а срока
      у этого ожидания нет. Висящий запрос снимается только своим исходом. Его предел — сроки
      края, которые сам замысел называет нестрогими (M24): медленно отдающий апстрим и обрыв
      между браузером и раздачей ими не ограничены. И18 требует, чтобы механизм без дедлайна был
      назван в переписи З20 с путём выхода. Порог в ней не назван, значит И18 нарушен текстом
      замысла. Это тот же класс, что B1 ревью defdbe67: живость механизма, который подавляет
      триггер, пока ответ в полёте.
      Следствие для названного исхода. §8 и З13 (строки 880–882) обещают: центр держит
      «отвергнуто» и не выдаёт прежний снимок за текущий. Порог даёт достижимый путь, где это
      неверно. Запрос прежнего чтения или прежнего экземпляра висит (счёт уровня модуля
      переживает перемонтирование). Смена фильтра или монтирование — чтения действием, порог
      их не задерживает — кладёт data(snapshot). После этого таймерные чтения не стартуют, пока
      висит старый запрос, и экран показывает снимок как текущий без обновления (NTF6-04 —
      «строка появляется без перезагрузки»). Состояния «отвергнуто» на этом пути нет.
    requirement: >-
      Правка в рамке Д26: только строки отображения и условия к коду, механизм и порог не
      меняются.
      (1) Строки CX6-35 и CX6-36 (З13 строки 868–869, 880–881, 962–965, 971; §8 строка
      CENTER_READ_DEADLINE_MS; З18 строки CX6-35 и CX6-36; §11 строка CX6-35; tasks.md S2,
      проба 11) переписать так, чтобы следующий таймер начинал новое чтение после того, как
      висящие запросы отвергнутого чтения ответили. Вход пробы CX6-35: пара молчит, дедлайн даёт
      «отвергнуто», затем оба висящих запроса отвечают (поздно, их исход отброшен), затем
      следующий таймер — обращений к preferences и inbox по 2. Так проба держит своё свойство
      «новое чтение к зависшему не присоединяется» и не спорит с CX6-39 (б). Отдельно назвать
      ветку «запросы висят — следующий таймер обращений не добавляет»: сейчас её несёт только
      CX6-39 (а).
      (2) В З20 строку «чтение центра» дополнить таймерным путём: он ждёт ответа висящих
      запросов, собственного дедлайна у этого ожидания нет, предел — сроки края (нестрогие,
      M24). Выход мимо ожидания — монтирование, смена фильтра, отметка и «Показать ещё». Так
      перепись снова отвечает И18: механизм без дедлайна назван с путём выхода.
      (3) Исход «снимок, полученный чтением действием, при подавленном таймерном пути» назвать в
      З13 и §8 одной фразой вместо обещания «не выдаёт прежний снимок за текущий», которое на
      этом пути ложно. Если такой исход неприемлем против NTF6-04, это новое решение (индикатор
      или переход в «отвергнуто» по сроку подавления). Д26 новые решения в этом заходе
      запрещает, поэтому это вопрос диспетчеру, а не правка автора.
      После правки: пересверка разбора классов судит строки отображения и дельту; эта роль —
      повтор на новом отпечатке.
    return_to: "автор замысла NTF-6 (acceptance-author)"

important:
  - id: N1
    coordinate: "design.md З13 условие (3) «Число» (строки 913–915); §8 строка «висящих HTTP-запросов центра на таймерном пути»"
    finding: >-
      «С циклом хоста — не больше 5, ниже предела 6» верно только при одной паре хоста в полёте.
      У цикла З9 нет ни отмены, ни порога по висящим, поэтому его хвост ограничен только сроками
      края; отметка добавляет ещё пару хоста. Это то же замечание, что text_remarks пересверки
      20db8619. Предел 6 — общий на источник, а в счёт не входят остальные запросы окна того же
      источника: чтение признака, загрузки бандлов, карточки. Число о расходе соединений окна, не
      о правильности значка или снимка, поэтому находка неблокирующая.
    requirement: "назвать условие «одна пара хоста в полёте», сослаться на хвост З9 и не выдавать 5 за предел; в той редакции, которая правит З13 и §8 по K1"
    lane: "S2 (текст замысла; кода не меняет)"
  - id: N2
    coordinate: "tasks.md §1 Е2, Е6 (3); design.md §9 Е2, Е6"
    finding: >-
      Упорядочивание seen_up_to при смене числа разрядов у владельца не доказано: близнеца в
      NTF3-161 нет. Если владелец сравнивает позиции строкой, отметка на переходе "9" → "10"
      застревает. Консоль этого не видит, потому что сравнивает позиции только на равенство.
      Замысел это называет, а полосы стартуют после Е2, так что держатель у ограды есть.
    requirement: "не снимать Е2 без Е6 (3); держит диспетчер при раздаче полос"
    lane: "вне NTF-6 (NTF-3, через диспетчера)"

