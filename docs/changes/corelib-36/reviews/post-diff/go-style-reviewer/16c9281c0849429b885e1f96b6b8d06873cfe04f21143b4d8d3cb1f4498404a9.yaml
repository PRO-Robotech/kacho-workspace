important:
  - id: I1
    tag: UNTRIMMED-VALUE
    at: oauthceremony/logincontext.go:38
    summary: >-
      Пустоту SessionID судит TrimSpace, а в запись сеанса и в грант порта выпуска уходит
      значение без обрезки. Выдача с SessionID " <id> " принимается (overlay-проба zz_gsr_probe,
      err=<nil>). Это второе написание имени сессии, по которому служба потом ищет семейство.
      Тот же класс, что I2 в круге 1 записи corelib-38. Субъект (ceremony.go:656) устроен так
      же, но это было до диффа.
    requirement: >-
      отвергать SessionID, не равный strings.TrimSpace(SessionID), и называть поле; на записи
      хранилища — тем же судьёй (loginContextDefect). Отрицательный случай — близнец годной
      сессии с пробелом по краю, по аналогии с «уровень с пробелом» в TestGrantWithoutAGoodLoginContextIsRefused.
  - id: I2
    tag: UNBOUNDED-INSTANT
    at: oauthceremony/logincontext.go:43
    summary: >-
      У AuthTime судится только нулевое время. Момент позже самой выдачи принимается
      (overlay-проба zz_gsr_probe, now+24h, err=<nil>), хотя doc.go называет отказом всякую выдачу
      «без годного контекста». Решать, какой момент считать годным, — дело полосы безопасности,
      а не стиля. Запись здесь нужна, чтобы вопрос не потерялся.
    requirement: >-
      решить в полосе безопасности: либо отказ ErrCeremonyMisuse при AuthTime позже момента
      выдачи (часов с ручкой у церемонии нет, стратегия читает time.Now), либо записать в шапке
      AuthorizationGrant.AuthTime, почему верхней границы нет.
  - id: I3
    tag: DOC-CITATION
    at: oauthceremony/logincontext.go:18
    related: 'oauthceremony/types.go:403'
    summary: >-
      Ссылка «RFC 9470 §3» ведёт не туда: §3 — Authentication Requirements Challenge
      (параметры acr_values/max_age вызова). Утверждения acr и auth_time в токене доступа и в
      интроспекции — §6 (6.1 JWT Access Tokens, 6.2 Token Introspection). Сверено по
      rfc-editor.org/rfc/rfc9470.txt. `sid` у Front-Channel Logout 1.0 §3 и OIDC Core §2
      названы верно.
    requirement: 'в обоих местах заменить «RFC 9470 §3» на «RFC 9470 §6»'

