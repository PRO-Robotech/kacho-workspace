review_scope: >-
  Дельта круга прочитана целиком. Прод: bridge.go (replayedCode, шапки GetAuthorizeCodeSession и
  GetRefreshTokenSession, тело ветки CodeRefreshTokenRotated), notes.go (шапка ведомости,
  markReplayedFamily), translate.go (комментарий у hydrateSession). Проба: replay_build_test.go.
  Вне дельты прочитаны: record, preferRecorded, note, coarsenable, replayed (notes.go);
  pairEngine, consumeCode, RotateRefreshToken, codeReplayed, refreshReplayed (bridge.go);
  requesterFromGrant (translate.go:340-372); ответы Exchange/Introspect/Revoke по
  replayed() и preferRecorded (ceremony.go:860-869, 967-976, 1025-1041); помощники проб
  corruptRefreshRecords, requireRevokedFor, requireNotRevoked, requireCodeReplayRefusal,
  requireReplayRefusal, TestReplayOfATokenWhoseClientIsGoneStillRevokesTheFamily.
  Перепись вызывающих markReplayedFamily: 4 места, все в bridge.go (:272, :321, :436, :484).
  Все передают codeReplayed/refreshReplayed; оба случая есть в перечне coarsenable. Поэтому
  то, что markReplayedFamily пишет precise мимо фильтра note, поведения не меняет. Пустой
  грант до пометки не доходит: :243, :431 и :479 отвергают его раньше как нарушение
  контракта. На путях нуля строк (:321, :484) pairEngine заносил тот же случай следом и до
  правки, так что там поведение прежнее.

