findings:
  - id: F1
    severity: medium
    key: 'corelib:oauthceremony/translate.go:replay-case-shadowed-by-session-breach'
    at: >-
      oauthceremony/translate.go:362-364 (строки диффа); затронутые, но не правленные
      утверждения — bridge.go:219-220, 268-270, 410-413, 434-436; notes.go:38-40
    sign: >-
      requesterFromGrant теперь сам заносит в ведомость отказ hydrateSession. На двух путях
      повтора (replayedCode и ветка обёрнутого токена в GetRefreshTokenSession) мост
      помечает семейство и собирает запрос, а случай повтора заносит ПОСЛЕ отказа сборки.
      Ведомость хранит первый случай, поэтому повтор больше не записывается. Операция
      отвечает случаем port_contract (на проводе server_error), а не
      authorization_code_consumed / refresh_token_rotated (invalid_grant). Семейство
      по-прежнему отзывается. Но комментарии моста говорят «церемония ответит повтором», а
      правило ведомости — что причиной считается первый отказ хранилища, и первым был
      повтор. Для отказа сборки по справочнику клиентов инвариант закреплён пробой
      TestReplayOfATokenWhoseClientIsGoneStillRevokesTheFamily. Для отказа сборки по
      записи сеанса близнеца нет, и дифф этот инвариант сломал.
    failure_scenario: >-
      хранилище службы отдаёт погашенный код или обёрнутый токен обновления вместе с записью,
      которую hydrateSession не принимает. На этой ревизии таких записей больше: сюда
      попадает и запись, чей адаптер ещё не переносит сессию, acr или auth_time. Затем
      погашенный артефакт предъявляют повторно. Служба получает ErrPortContract вместо
      случая повтора. Повтор — сигнал возможной кражи, и её журнал и реакция на этот сигнал
      не срабатывают. Клиент получает server_error вместо invalid_grant. Отзыв по обёрнутому
      токену (RFC 7009) отвечает отказом, хотя семейство отозвано. Это не обход контроля
      (отзыв исполняется), а потеря классификации события безопасности и ложные
      утверждения у самого контроля.
    proof: >-
      одна и та же проба на базе f213439a и голове 6289fbcf, порча одной записи
      повторяемого артефакта (NotAfter с нулевым сроком — вид порчи, существовавший до
      диффа):
      база — refresh-replay/exchange refresh_token_rotated invalid_grant;
      code-replay/exchange authorization_code_consumed invalid_grant;
      refresh-replay/revoke nil; family_revoked=true во всех трёх.
      голова — во всех трёх port_contract server_error, family_revoked=true.
      На голове то же при SessionID="" и ACR="0". Близнец без порчи на обеих ревизиях
      отвечает повтором. Интроспекция обёрнутого токена: база active=false, голова отказ
      port_contract. Это fail-closed, не находка.
    fix_direction: >-
      признак для исполнителя, диагноз он вправе опровергнуть. На путях повтора случай
      повтора обязан остаться ответом операции и тогда, когда запрос не собран из-за записи
      сеанса. Например, заносить его в ведомость ДО сборки, а нарушение контракта оставить в
      Debug/cause. Занесение порчи в ведомость на живых путях (отзыв и интроспекция живого
      артефакта) сохраняется: его держит TestStoredRecordWithoutAGoodLoginContextIsAContractBreach,
      и инъекция I3 это подтверждает. Закрепить пробой-близнецом
      TestReplayOfATokenWhoseClientIsGoneStillRevokesTheFamily: повтор кода и обёрнутого
      токена с записью сеанса, которую не принимает hydrateSession. Ожидается: случай
      повтора, invalid_grant, семейство отозвано с причиной повтора; отзыв обёрнутым
      токеном отвечает nil. Если исполнитель решит, что нарушение контракта важнее повтора,
      то тем же коммитом комментарии bridge.go:219-220, 268-270, 410-413, 434-436 и
      notes.go:38-40 должны говорить именно это, и проба закрепляет такой ответ.

below_bar:
  - id: N1
    severity: low
    key: 'corelib:oauthceremony/logincontext.go:auth-time-not-bounded-by-issuance'
    note: >-
      судья отвергает только нулевой AuthTime. Момент аутентификации позже момента выдачи
      (с учётом tokenpolicy.ClockSkew) проходит и на выдаче, и из хранилища. Значение
      подаёт служба, не клиент. На него опираются проверки края по моменту аутентификации
      (замысел, стр. 2998-3005). Направление: AuthTime ≤ момент выдачи + ClockSkew на
      выдаче. Не блокирует.
  - id: N2
    severity: low
    key: 'corelib:oauthceremony/types.go:session-id-is-identifier-not-bearer'
    note: >-
      SessionID хранится в каждой записи и называется интроспекцией. В шапке поля не
      сказано, что это идентификатор сессии, а не её носитель. У kaname носитель отделён
      (bearer_digest), так что сейчас это верно. Одна фраза в types.go закрыла бы это для
      любого потребителя. Не блокирует.
  - id: N3
    severity: low
    key: 'corelib:oauthceremony/types.go:rfc9470-section'
    note: >-
      ссылка «RFC 9470 §3» у acr/ACR (types.go, logincontext.go). В §3 определены
      параметры вызова acr_values/max_age, а передача acr и auth_time в токене и
      интроспекции описана в §6. Правдивость текста, не безопасность.

cross_repo:
  - repo: PRO-Robotech/kaname
    subject: >-
      адаптер портов хранилища переносит SessionRecord.SessionID/ACR/AuthTime без потерь
      во все три записи (код, токен доступа, токен обновления). Иначе после пина каждая
      выборка — ErrPortContract, а пока F1 не исправлена, повтор тоже читается как
      нарушение контракта. Решение о шаге вверх (acr_values выше уровня сессии, LAX-7)
      остаётся за службой: церемония сверяет ACR только со словарём, не с запросом.
      Прекращение семейства вместе с сессией (шапка AuthorizationGrant.SessionID) исполняет
      служба. Отметка ended_at каскад не запускает, поэтому это отзыв семейства по сессии
      (kaname #319, #322, #340), а не внешний ключ.

