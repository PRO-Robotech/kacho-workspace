      | grep -nE '^module:'; done; NTF-3 Р29 таблица ячеек; ls-tree proto/kacho/cloud
    result: >-
      Словарей ключа модуля три, и у nlb они расходятся: каталог notify — `nlb`; манифест — `module:
      loadbalancer` (services/nlb/manifest.yaml:95), токены службы доступа `loadbalancer.*`; пакет proto —
