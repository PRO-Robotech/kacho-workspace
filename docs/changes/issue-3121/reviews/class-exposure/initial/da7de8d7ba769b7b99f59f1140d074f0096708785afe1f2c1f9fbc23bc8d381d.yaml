      совпадают. Сценарии доставки приёмки (NTF7-12…32) — только storage и vpc: расхождение ни одним
      сценарием не проходится (CX7-05).
  - claim: "Р3 п.6: форма пар — общий валидатор validate.Labels; первый отказ возвращается"
    how: "git -C corelib show 18d105d0f50a:validate/validate.go | sed -n 216,236p"
    result: >-
      Обход пар — `for k, v := range labels` (validate.go:223): при двух негодных парах поле первого
      нарушения выбирает порядок обхода map, то есть случай. Однопарные сценарии NTF7-06 это не видят (CX7-01).
  - claim: "Р8: дубль держит база; CHECK формы, обойдённый мимо проверки входа, — дефект (INTERNAL)"
    how: >-
      git -C corelib show 18d105d0f50a:db/pgfault/pgfault.go | sed -n 263,286p;
      git -C kacho show e6075f09c2:pkg/journalfault/journalfault.go | sed -n 1,30p
    result: >-
      Общая полоса 23514 `pgfault.CheckLaneOf` относит к дефекту сервиса только ограничение формы имени
      (`nameform.IsConstraint`), любое другое — `LaneCallerInput` → INVALID_ARGUMENT. Прецедент того же
      класса уже в дереве: ограничение формы инициатора журнала решается отдельно (`journalfault.Initiator`)
      и раньше общей полосы — держит TestJournalInitiatorFaultIsDecidedBeforeTheCheckClass (CX7-03).
  - claim: "NTF-3 §6: subscription(owner text NOT NULL, …)"
    how: "sed -n 2185,2192p docs/changes/issue-2918/design.md"
    result: >-
      `owner` без CHECK непустоты; inbox_audience.subject — с `CHECK (subject <> '')`. У ветви селектора
      нет вызова Check, который отказал бы на пустом субъекте (Р7) (CX7-04).
  - claim: "Р8: набор видов упорядочен сервером; база держит порядок"
    how: >-
      git -C kacho grep -c 'COLLATE' e6075f09c2 -- 'services/*/internal/migrations/*.sql' → 0 файлов;
      сравнение порядка 20 видов: LC_ALL=C sort против LC_ALL=ru_RU.utf8 sort (контроль: ab_c/abc/a_b_c
      различает локали — живой).
    result: >-
      На сегодняшних 20 видах порядок байтов и лингвистический совпадают; COLLATE в миграциях не
      встречается ни разу — порядок CHECK базы задаёт локаль кластера. Класс скрыт, а не исключён (CX7-02).
  - claim: "Р8: уникальность по канонической форме цели одним UNIQUE (owner, target_key, channel)"
    how: >-
      postgres:16-alpine: UNIQUE (owner, k, ch); вставка ключа 'label_selector/vpc/' || jsonb::text для
      16 пар ключ 63 + значение 63 (печатные случайные; управляющие и экранируемые случайные)
    result: >-
      Вставлено всё: 2181 символ (печатные) и 6631 символ (экранируемые — сжимаются в кортеже индекса).
      Предела строки btree предельный законный селектор не достигает — экспозиции нет, пункта нет.
  - claim: "DoD 10.4 п.1: S2 — когда пин kaname несёт ListEventAudience"
    how: "git -C kaname grep -c 'rpc ListEventAudience' <ревизия> -- proto (сумма по файлам)"
    result: "пин 33010d434767 → 0; 484-notify d93b69712 → 1. Пин поднимает NTF-3 (окна В-2/В-5), не NTF-7."
  - claim: "§1.2: 20 видов, по манифестам 3+9+3+2+3"
