items:
  - id: CX7-01
    design_decision: "З3 п.(6): validate.Labels(\"target.label_selector.match_labels\", …) на всём словаре"
    verdict: not_held
    severity: to_design
    blocking: false
    why: "вызов на всём словаре наследует случайный порядок обхода map (validate.go:223 @18d105d0f50a)"
    to_design: "З3 п.(6): пары — по возрастанию ключа, общий валидатор на однопарном словаре; §5 — строка порядка; ответ владельца (вопрос initial)"
    holder: "проба N4: две негодные пары, поле меньшего ключа, 50 повторов"
  - id: CX7-02
    design_decision: "З5 «массив равен своей отсортированной форме без повторов (неизменяемая функция схемы)»; З6"
    verdict: partial
    severity: to_code
    blocking: false
    why: "механизм назван, правило сравнения — нет; COLLATE в миграциях дерева 0"
    to_code: "сравнение и сортировка в функции схемы — COLLATE \"C\"; УК7-04 — пара, байтовый и лингвистический порядок которой различны"
  - id: CX7-03
    design_decision: "З5 «23514 → INTERNAL фиксированным текстом по дому SQLSTATE»; «23505 … тем же отображением»"
    verdict: not_held
    severity: to_design
    blocking: true
    why: >-
      Утверждение замысла о доме SQLSTATE неверно для дерева: pgfault.CheckLaneOf
      (corelib pgfault.go:277 @18d105d0f50a) отдаёт LaneCallerInput любому 23514, кроме ограничения формы
      имени, — то есть INVALID_ARGUMENT. Прецедент обхода — journalfault.Initiator, решение по имени
      ограничения раньше общей полосы.
    to_design: >-
      З5: решение по ИМЕНИ ограничения (формы селектора, дочерней таблицы) раньше общей полосы →
      INTERNAL фиксированным текстом; ALREADY_EXISTS — только по имени UNIQUE (owner, target_key, channel);
      держатель — УК (строка в обход проверки входа через use-case → INTERNAL, не INVALID_ARGUMENT).
  - id: CX7-04
    design_decision: "— (З4 ветвит до порта прав; о личности владельца ни слова; З5 не добавляет CHECK owner)"
    verdict: not_held
    severity: to_design
    blocking: true
    why: "у ветви селектора нет ни одного вызова, отказавшего бы на отсутствующей личности; subscription.owner в схеме NTF-3 без CHECK непустоты"
    to_design: "З4: владелец — функцией с признаком присутствия, нет — UNAUTHENTICATED; З5: CHECK (owner <> '') у subscription и дочерней таблицы; И-строка и проба N4"
  - id: CX7-05
    design_decision: "З2 (б) — токен из строки манифеста (верно); З3 п.(2), З7 «module = M» — словарь не назван"
    verdict: partial
    severity: to_design
    blocking: true
    why: "у nlb три словаря расходятся (nlb · loadbalancer); держателя доставки на nlb нет ни в приёмке, ни в заказах замысла"
    to_design: "З7: label_module сравнивается с модулем записи ленты в словаре ключа источника notify; новый УК7-07 — доставка селектора на nlb_listener и близнец; исполнение — N9"
  - id: CX7-06
    design_decision: "З8 «Ответы живут в локальной переменной одной сборки … кэша нет»; «вся сборка откладывается до следующего прохода»"
    verdict: not_held
    severity: to_design
    blocking: true
    why: >-
      Противоречит приёмке: Р9 — отложенный ответ откладывает письмо «до решающего ответа о НЕЙ» (о
      строке), Р5 (п2) — после N(k)-го решающего по ключу вызовов нет. При локальной переменной повтор
      отложенной сборки спрашивает о строке с уже решающим ALLOW ещё раз — лишний решающий, красное на
      штатном переходном UNAVAILABLE второй строки. И11 (не переиспользовать между сборками) при этом
      верен и сохраняется.
    to_design: >-
      З8: решающий исход ResolveSend хранится по паре (адресат, строка) вне памяти прохода, повтор
      спрашивает только нерешённые строки; отложенный Resolve{self} ResolveSend не повторяет; состав
      сборки фиксирован закрытием окна. Хранению нужна колонка/таблица — миграция (маршрут: CX7R-01).
      Новый УК7-08 — unit-проба «V1 ALLOW, V2 UNAVAILABLE→ALLOW: решающих о V1 ровно 1».
  - id: CX7-07
    design_decision: "З7 «Resolve{event, via_subscription} для ветвей resource/project — путь NTF-3 до транзакции, без изменений»"
    verdict: partial
    severity: to_code
    blocking: false
    why: "держится, если перечень NTF-3 выбирает подписчиков по ключу цели ресурса/проекта; условие не названо"
    to_code: "перечень via_subscription — только ветви resource/project, условием по ветви; держатель NTF7-31"
  - id: CX7-08
    design_decision: "З7 «owner = ANY(<владельцы строк аудитории этой записи>)»"
    verdict: partial
    severity: to_code
    blocking: false
    why: "источник списка (строки inbox_audience в транзакции или параметр из Go) и форма owner/subject не названы"
    to_code: "соединение с inbox_audience вставленной записи в той же транзакции; форма субъекта — функция S2-B6"
  - id: CX7-09
    design_decision: "З7 «строка мгновенного письма ключуется (адресат, запись события), ON CONFLICT DO NOTHING»; З8 «отметка … — механизм NTF-3 З22 без изменений»"
    verdict: partial
    severity: to_code
    blocking: false
    why: "в схеме NTF-3 (замысел issue-2918 §6) таблица с этим ключом одна — inbox_instant_sent, отметка «ушло»; таблицы кандидатов в схеме нет"
    to_code: "кандидат ≠ отметка «ушло»; отметка — только транзакцией постановки письма по строкам ALLOW; NTF7-32 «после V2» — отметок 0; таблица кандидатов S2-B6 — замером scout после В-4"
  - id: CX7-10
    design_decision: "З2 «признак пишется руками в исходнике таблицы (или во входе её генератора, если таблицу собирает шаг bundle)»"
    verdict: not_held
    severity: to_design
    blocking: true
    why: >-
      Решение оставлено открытым двумя вариантами; замысел NTF-3 (CX3B-35) говорит, что перечень видов
      ресурсов генерирует notifygen из Mapping.Kinds модулей и «своей таблицы у notify нет», а путь полосы
      N2 — services/notify/kinds/. Нулевое значение поля у вида без явного признака не запрещено.
    to_design: >-
      З2: дом объявления — там, где перечень видов ресурсов проверки Р11 на базе после В-3 (замер scout);
      признак обязателен у каждого вида, отсутствие — отказ сборки/загрузчика; путь N2 и plans/L-1.json —
      по замеру.
  - id: CX7-11
    design_decision: "З5 subscription_label_kind: FK только subscription_id → subscription(id); равенство — «тот же оператор» (И4, УК7-03)"
    verdict: not_held
    severity: to_code
    blocking: false
    why: "копии owner и модуля базой не сверены (ban10)"
    to_code: "составной FK (subscription_id, owner, label_module) → UNIQUE (id, owner, label_module) родителя; прямая вставка с чужим owner → 23503 в УК7-04"
  - id: CX7-12
    design_decision: "З9 «параметр конструктора корня (не переменную окружения и не ручку), продуктовая сборка передаёт пустой набор; второго пути сборки корня не появляется»"
    verdict: held
    severity: —
    blocking: false
  - id: CX7-13
    design_decision: "— (tasks.md §1: «журнал без ПД и без меток ресурса» — только самопроверка; И12 и УК7-06 — письмо, ответ, метрики)"
    verdict: not_held
    severity: to_code
    blocking: false
    why: "третий выход — журнал процесса — не назван ни инвариантом, ни держателем"
    to_code: "И12 дополнить журналом; проба NotContains значения метки в журнале прогона NTF7-12 и NTF7-06 (г)"

