new_items:
  - id: CX7V-01
    blocking: false
    severity: to_code
    design_decision: "З8 / И11 «о строке адресата решающий ответ один за все проходы»; механизм — ON CONFLICT DO NOTHING в instant_send_decision"
    class: "code-authoring §«Решение и его следствие разнесены» (вызов и запись исхода — разные шаги)"
    finding: >-
      ON CONFLICT DO NOTHING держит единственность ЗАПИСИ исхода, а не единственность ВЫЗОВА. Если два
      прохода одной сборки идут одновременно (две реплики notify-sender), оба читают V1 нерешённой и
      оба зовут ResolveSend — лишний решающий против Р5 (п2). Исключительность прохода сборки пары не
      названа ни в З8/З13, ни в NTF-3 З22: `grep -c -i 'SKIP LOCKED\|FOR UPDATE\|аренд\|реплик'` по
      design.md NTF-7 → 0; по З22 NTF-3 → 0. Не блокирующий: возможность параллельных проходов одной
      пары не установлена (планировщик прохода — производитель NTF-3 S2-B6, в дереве его нет), т.е.
      дефект не доказан предикатом; И11 при этом утверждает больше, чем держит механизм.
    to_code: >-
      проход сборки пары «адресат + ресурс» исключителен между репликами (захват строки окна пары
      FOR UPDATE SKIP LOCKED либо эквивалент того же оператора), либо N8 печатает, чем это уже держит
      планировщик S2-B6; формулировка И11 — «в пределах исключительного прохода».
    holder: "заказ integration-tester: УК7-08 с двумя экземплярами сборщика на одной базе — решающих о V1 ровно 1"
  - id: CX7V-02
    blocking: false
    severity: to_code
    design_decision: "З5 «ALREADY_EXISTS — только 23505 по имени UNIQUE (owner, target_key, channel) NTF-3»"
    finding: >-
      У UNIQUE NTF-3 имени в схеме нет (issue-2918/design.md §6 — безымянное, имя даёт Postgres); инъекция
      УК7-09 «ограничение переименовано» судит имена миграции З5, а не это неявное имя.
    to_code: "константа имени UNIQUE NTF-3 сверяется с pg_constraint мигрированной схемы, а не с текстом файла; держит и близнец УК7-09 (дубль → ALREADY_EXISTS)"
  - id: CX7V-03
    blocking: false
    severity: to_code
    design_decision: "З5 «решение по имени раньше общей полосы — тем же устройством, что journalfault.Initiator»"
    finding: "гейт единого дома SQLSTATE считает находкой решение по литералу кода вне corelib/db/pgfault"
    to_code: "функция имени решает по полям pgfault.Fault (Class, Constraint, Table), без строковых литералов 23514/23503/23505; иначе — красный TestIntegritySQLStateIsDecidedInOnePlace"

