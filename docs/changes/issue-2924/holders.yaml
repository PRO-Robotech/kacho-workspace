# Точное множество требуемых держателей изменения issue-2924 (NTF-5, эпик kacho#2914).
#
# Форма ключей — по образцу `docs/changes/standalone-iam/holders.yaml`; её не
# задаёт ни приёмка SDD-1, ни испытуемый контура.
#
# МНОЖЕСТВО ТОЧНОЕ: держатель, не названный здесь, вердикта по изменению не даёт,
# а названный и не отдавший исхода даёт «не выполнилось» — не «наверное прошло».
#
# ЗДЕСЬ НЕ ОБЪЯВЛЕН НИ ОДИН ИСХОД. Снятые исходы живут в свидетельствах
# (`evidence/<holder>/<subject-sha256>.yaml`), вердикт по отпечатку — в записи
# ревью роли, запись схождения выпускает `convergence-reviewer`.
#
# МАШИННЫЕ ДЕРЖАТЕЛИ ПРОДУКТА выведены из DoD ТЕКУЩЕЙ редакции приёмки (отпечаток —
# `hashes.acceptance_sha256` манифеста); ссылка на пункт DoD стоит в `predicate`.
# Правка DoD приёмки обязана перемерить этот перечень тем же заходом.
#
# ПРИМЕНИМЫ ВСЕ РОЛИ `review_authority`. Освобождать нечем: изменение несёт
# приёмку, и замысел по ней обязателен (§5 SDD-1). Поля освобождений
# (`migrations_touched`, `proto_files_touched`, `lane_merges_in_change`) до голов
# линии числа не дают (код 2 производителя), поэтому освобождение и не могло бы
# быть пересчитано. Строки ниже перечисляют роли явно, чтобы их сверял `check-04`
# в обе стороны.
schema_version: 1
change_id: issue-2924

role_applicability:
  acceptance-reviewer:
    status: applicable
    holder: [human-acceptance]
  class-exposure-analyst:
    status: applicable
    holder: [human-class-exposure-initial, human-class-exposure-revalidation]
  design-reviewer:
    status: applicable
    holder: [human-design]
  db-architect-reviewer:
    status: applicable
    holder: [human-post-diff-db]
  go-style-reviewer:
    status: applicable
    holder: [human-post-diff-go]
  proto-api-reviewer:
    status: applicable
    holder: [human-post-diff-proto]
  system-design-reviewer:
    status: applicable
    holder: [human-post-diff-system]
  integration-tester:
    status: applicable
    holder: [ws-docs-gate, ws-vault-gate, prod-ci-local, prod-notify-notice, prod-notify-bundle-check, prod-kaname-directory, prod-ban6-isolation, sev-notice-e2e]
  wave-reviewer:
    status: applicable
    holder: [human-wave]
  convergence-reviewer:
    status: applicable
    holder: [human-convergence]
  landing-reviewer:
    status: applicable
    holder: [human-landing]

required_holders:

  # ── машинные: воркспейс ──
  ws-docs-gate:
    kind: machine
    owner: integration-tester
    executable: ./scripts/docs-gate/run-all.sh
    predicate: вердикт приёмки этого пакета читается машинно, у каждой строки Scope есть сценарий
    evidence_coordinate: evidence/ws-docs-gate/

  ws-vault-gate:
    kind: machine
    owner: integration-tester
    executable: ./scripts/vault-gate/run-all.sh
    predicate: висячих ссылок нет, оболочка записок цела, указатель свеж
    evidence_coordinate: evidence/ws-vault-gate/

  # ── машинные: продукт (исполняемое — из DoD приёмки; дерево названо в скобках) ──
  prod-ci-local:
    kind: machine
    owner: integration-tester
    executable: 'scripts/ci-local.sh proto go (дерево kacho)'
    predicate: 'notice.proto, notice_service.proto, internal_notice_service.proto и contact_service.proto проходят buf lint и buf breaking (DoD §10.1 п.1, §10.2 п.1)'
    evidence_coordinate: evidence/prod-ci-local/

  prod-notify-notice:
    kind: machine
    owner: integration-tester
    executable: 'ЗАВОДИТСЯ NTF-1: go test -tags integration ./services/notify/... -count=1 в дереве kacho (пробы NTF5-* заводятся этим изменением)'
    predicate: 'пробы NTF5-01…54, 55…83, 86…106 зелёные; инварианты извещения и контактов — ограничения базы (DoD §10.1 п.6, §10.2 п.7, §10.4 п.1)'
    evidence_coordinate: evidence/prod-notify-notice/
    note: >-
      Производителя в дереве нет; до его появления исход держателя — «не выполнилось», и он НЕ вычитается из вердикта.

  prod-notify-bundle-check:
    kind: machine
    owner: integration-tester
    executable: 'ЗАВОДИТСЯ NTF-1: make -C services/notify bundle-check в дереве kacho'
    predicate: '19 шаблонов notice-* на каждой локали набора собраны, эталоны .eml и превью совпадают (DoD §10.2 п.3)'
    evidence_coordinate: evidence/prod-notify-bundle-check/
    note: >-
      Производителя в дереве нет; до его появления исход держателя — «не выполнилось», и он НЕ вычитается из вердикта.

  prod-kaname-directory:
    kind: machine
    owner: integration-tester
    executable: 'ЗАВОДИТСЯ ЭТИМ ИЗМЕНЕНИЕМ: go test ./... -count=1 в дереве kaname (проба NTF5-68 заводится этим изменением)'
    predicate: 'методы DescribeScope и ListAccounts внутреннего справочника в перечне звена служб (DoD §10.1 п.5, §10.2 п.6)'
    evidence_coordinate: evidence/prod-kaname-directory/
    note: >-
      Производителя в дереве нет; до его появления исход держателя — «не выполнилось», и он НЕ вычитается из вердикта.

  prod-ban6-isolation:
    kind: machine
    owner: integration-tester
    executable: 'python3 deploy/scripts/assert-ban6-external-isolation.py (дерево kacho)'
    predicate: 'внутренний сервис извещений не резолвится на внешнем слушателе края (DoD §10.1 п.4)'
    evidence_coordinate: evidence/prod-ban6-isolation/

  sev-notice-e2e:
    kind: machine
    owner: integration-tester
    executable: 'ЗАВОДИТСЯ ЭТИМ ИЗМЕНЕНИЕМ: сквозные NTF5-84, NTF5-85 на стенде в боевой посадке через assert-suites-green.sh (дерево kacho)'
    predicate: 'сквозные зелёные числом исполненного; новая коллекция внесена в ведомость производителя (DoD §10.3 п.1)'
    evidence_coordinate: evidence/sev-notice-e2e/
    note: >-
      Производителя в дереве нет; до его появления исход держателя — «не выполнилось», и он НЕ вычитается из вердикта.

  # ── человеческие: роль — координата, вердикт даёт внешнее событие ──
  human-acceptance:
    kind: human-external
    owner: acceptance-reviewer
    executable: внешнее review event на отпечаток приёмки
    predicate: наблюдаемое поведение описано полно, у каждого «Тогда» есть производитель, у каждого отрицания — положительный близнец
    evidence_coordinate: evidence/human-acceptance/

  human-class-exposure-initial:
    kind: human-external
    owner: class-exposure-analyst
    executable: внешнее review event на отпечаток приёмки
    predicate: перечень классов дефектов, которые изменение может задеть, назван и сохранён
    evidence_coordinate: evidence/human-class-exposure-initial/

  human-class-exposure-revalidation:
    kind: human-external
    owner: class-exposure-analyst
    executable: внешнее review event на отпечаток design.md
    predicate: каждый пункт первичного разбора отображён в решение замысла, отображение не устарело
    evidence_coordinate: evidence/human-class-exposure-revalidation/

  human-design:
    kind: human-external
    owner: design-reviewer
    executable: внешнее review event на отпечаток design.md
    predicate: решения и инварианты замысла полны; открытых решений, маркеров отсрочки и неотображённых классов нет
    evidence_coordinate: evidence/human-design/

  human-post-diff-db:
    kind: human-external
    owner: db-architect-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: схема и миграции отвечают требованиям целостности; применённая миграция не правлена
    evidence_coordinate: evidence/human-post-diff-db/

  human-post-diff-proto:
    kind: human-external
    owner: proto-api-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: изменение контрактов отвечает конвенциям; внутренняя поверхность не опубликована наружу
    evidence_coordinate: evidence/human-post-diff-proto/

  human-post-diff-go:
    kind: human-external
    owner: go-style-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: раскладка слоёв цела, транспорт не протёк в use-case, мёртвого кода не заведено
    evidence_coordinate: evidence/human-post-diff-go/

  human-post-diff-system:
    kind: human-external
    owner: system-design-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: ацикличность графа вызовов сохранена (рёбра notify — polyrepo.md#poly-edge-notify-acyclic); распределённые свойства не нарушены
    evidence_coordinate: evidence/human-post-diff-system/

  human-wave:
    kind: human-external
    owner: wave-reviewer
    executable: внешнее review event на отпечаток содержимого СОБРАННОЙ линии
    predicate: полосы изменения в нескольких репозиториях, лежащие рядом, не решают одну задачу дважды, не вводят двух имён одного предмета и не отменяют правку соседа
    evidence_coordinate: evidence/human-wave/

  human-convergence:
    kind: human-external
    owner: convergence-reviewer
    executable: внешнее review event на отпечаток содержимого изменения
    predicate: множество применимых ролей сверено в обе стороны, повторные ревью собраны, отпечатки базы и источника названы по КАЖДОМУ репозиторию
    evidence_coordinate: evidence/human-convergence/

  human-landing:
    kind: human-external
    owner: landing-reviewer
    executable: внешнее review event на посаженное содержимое
    predicate: применённое содержимое совпадает с одобренным; сохранность работы доказана содержимым, а не тождеством коммита
    evidence_coordinate: evidence/human-landing/
