#
# Манифест НЕ несёт нормативной прозы (CG_HUMAN_MANIFEST_PROSE): наблюдаемое
# поведение — в приёмке, чем изменение держится — в `holders.yaml`.
#
# ПРИЁМКА ЛЕЖИТ ВНЕ КАТАЛОГА ПАКЕТА, и это не пропуск: её дом — `docs/specs/`
# (кросс-репозиторный предмет, polyrepo.md note «У приёмки домов ДВА»), и там
# её читает docs-gate check-01. Копия `acceptance.md` здесь была бы вторым
# местом об одном предмете. Документ назван отпечатком `hashes.acceptance_sha256`
# и ссылкой `links.acceptance`. Записи ревью приёмки лежат по координате
# `links.acceptance_reviews` (docs/specs/reviews/<имя приёмки>/<sha256>.yaml),
# а не в `reviews/acceptance/` пакета, как раскладывает SDD-1 §3: записи
# append-only и цитируются шапкой приёмки, перенос сменил бы её отпечаток.
#
# СОСТОЯНИЕ ISSUE_READY — запись APPROVED на текущий отпечаток приёмки есть (редакция 17,
# круг 16: docs/specs/reviews/sub-phase-NTF-5-operator-notices-acceptance/367b948297cf260266223e12c62715355435ac894789f73c998b24bc35760153.yaml),
# но публикация внешнего события полномочия этой записью не засвидетельствована — переход
# состояния не объявляется. Первичный разбор классов на этот отпечаток —
# reviews/class-exposure/initial/367b9482….yaml (к-замыслу, CX5-45…48); прежние — на 1f4852e4,
# 2fe29c35, 88fabd09, 03e291ee. Замысел — `design.md` редакции 2 (2026-09-30), отпечаток —
# `hashes.design_sha256`; вердикта и пересверки на него нет. Пересверка на редакцию 1
# (a43a19fa…) — reviews/class-exposure/revalidation/a43a19fa….yaml, «к замыслу»; редакция 2
# отвечает на неё. Маршрут работ — `tasks.md` редакции 2 (проект; TASKS_READY им не объявлено).
# Свидетельства `evidence/**` сняты на отпечатке приёмки
# редакции 2 (47ac6f8b…) и на текущий отпечаток не переносятся; перечень `holders.yaml` этим
# коммитом по DoD редакции 17 не перемерялся.
