    command: "git -C project/corelib grep -nE '^func \\(r \\*pgRepo\\) [A-Z]' 34bc8104a -- operations/repo.go; git -C project/corelib show 34bc8104a:operations/repo.go | sed -n 570,700p | grep -n 'r.pool'; git -C project/corelib grep -nE 'markDoneCAS|markErrorCAS' 34bc8104a -- '*.go' ':!*_test.go'"
    result: >-
      опровергнуто для экспортируемого API: 13 методов pgRepo, все записи (Create, CreateWithPrincipal,
      MarkDone, MarkDoneWithMetadata, MarkError, Cancel, CancelOwned, ClaimForExecution) — на r.pool;
      markDoneCAS / markErrorCAS принимают pgx.Tx, но неэкспортируемы, вызывающий — только
      reconciler.go:243, 252 (CX5-34)
  - claim: "kacho: пишет ли кто-либо таблицу операций своим оператором"
    command: "git -C project/kacho grep -nlE 'UPDATE [a-z_.%]*operations|INSERT INTO [a-z_.]*operations' 1d42a6728bf -- 'services/*.go' ':!*_test.go' | wc -l"
    result: "0 файлов; сервисы создают операцию opsRepo.Create отдельно от записи ресурса (vpc address/create.go:290 и др.)"
  - claim: "Create операции без явного принципала"
    command: "git -C project/corelib show 34bc8104a:operations/repo.go | sed -n 325,345p"
    result: "порядок источников: op.Principal → PrincipalFromContext → SystemPrincipal() (запасной, «системные операции, бутстрап, миграции») (CX5-33)"
  - claim: "Р10: три терминальных писателя операции Create"
    command: "git -C project/kacho grep -nE 'operations\\.NewReconciler\\(' 1d42a6728bf -- '*.go' ':!*_test.go' | wc -l; git -C project/corelib show 34bc8104a:operations/reconciler.go | sed -n 64,110p; grep -ciE 'reconciler|orphan|осирот|OrphanGrace' <приёмка>"
    result: "6 вызовов (compute, geo, nlb, registry, storage, vpc); OrphanGrace по умолчанию 5m по modified_at, Interval 30s; окно Create — [1m, 1h], умолчание 10m (Р17); упоминаний движка в приёмке 0 (CX5-35)"
  - claim: "Р16: окно сужателя — умолчание фундамента, «тот же размен, что у списков модулей»"
    command: "git -C project/kacho grep -nE 'authzfilter\\.New\\(' 1d42a6728bf -- '*.go' ':!*_test.go' (+8 строк каждого места, CacheTTL); git -C project/kacho show 1d42a6728bf:tools/revocationwindowgate/gate.go | sed -n 163,189p; git -C project/corelib show 34bc8104a:listnarrow/narrower.go | sed -n 109,120p"
    result: >-
      опровергнуто: 4 места сборки сужателя модулей, все 4 передают CacheTTL своей ручкой (compute,
      storage — KACHO_*_LIST_FILTER_CACHE_TTL_MS; vpc, nlb — ключ конфигурации list-filter); knobNames
      гейта окна отзыва ведёт их как «list-filter»; у сужателя ноль = умолчание, выключить окно
      нельзя; словарь конструкторов кеша вердиктов гейта — NewCache, NewCacheWithLimit,
      newDecisionCache, listnarrow.New в нём нет (CX5-36)
  - claim: "окно отзыва процесса notify-api объявлено"
    command: "grep -nE 'AUTHZ_CACHE_TTL|CacheWindow' docs/specs/sub-phase-NTF-4-delivery-feedback-reputation-acceptance.md"
    result: "NTF-4 объявляет KACHO_NOTIFY_AUTHZ_CACHE_TTL [1 с … 30 с], умолчание 5 с (строки 1035, 1078, 1237) — окно звена прав; окна сужателя нет ни в NTF-1, ни в NTF-3, ни в NTF-4, ни в Р17 NTF-5"
  - claim: "З19: у строки obligation нет срока"
    command: "grep -nE 'expires_at|ttl' docs/specs/sub-phase-NTF-1-notification-gateway-core-acceptance.md"
    result: "читателей expires_at в NTF-1 — 4 места: сверка перед DATA (785), окно Р14 (893), тревога «половина наименьшего ttl» (1049), уборщик (1296); ключ ttl обязателен в notification.yaml (643) (CX5-31)"
  - claim: "Р2, Р18: отказ без system_admin у InternalNoticeService держится на notify-api"
