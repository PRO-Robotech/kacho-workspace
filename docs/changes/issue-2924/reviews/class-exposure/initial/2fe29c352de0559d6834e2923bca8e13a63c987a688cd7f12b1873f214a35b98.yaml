items:
  - id: CX5-29
    decision: N1, N2
    class: "code-authoring §«Решение и его следствие разнесены» (решение о закрытии события и запись строк по нему — в разных транзакциях разных процессов); rule ban10 (check-then-act)"
    exposure: >-
      Закрытие события (переход закрывает неотправленные строки SUPERSEDED и «раскрытие закрытого
      события прекращается») делает notify-api, а строки по событию пишет раскрытие в notify-sender —
      после сетевых вызовов, отдельной транзакцией страницы (CX5-12). Раскрытие, прочитавшее событие
      открытым до перехода, записывает строки адресата ПОСЛЕ его фиксации: новые строки не SUPERSEDED
      (оператор перехода их не видел), письмо отменённого или перенесённого этапа уходит. То же у
      планировщика: событие reminder, записываемое в момент dueAt, против Start/Cancel/Update,
      снимающих напоминания. Приостановленное allAccounts-раскрытие (NTF5-67) растягивает окно гонки
      до минут.
    condition: >-
      (а) каждая транзакция, пишущая строки события (страница раскрытия, повтор отложенной строки
      кандидата) или само событие reminder, первым оператором берёт строку события либо извещения с
      условием «событие не закрыто, извещение в ожидаемом состоянии» (UPDATE … WHERE … RETURNING или
      SELECT … FOR SHARE) и при нуле строк откатывается без записи; (б) переход закрывает событие
      записью в той же строке (признак закрытия), а не только строки доставки — так обе стороны
      спорят за одну строку; (в) планировщик снимает напоминание CAS-записью по строке напоминания
      (DELETE … RETURNING), и событие reminder пишется только при одной снятой строке.
    held_by: "нет: NTF5-112…115 закрывают строки, записанные ДО перехода; перехода во время незавершённого раскрытия (NTF5-67 с Cancel) и гонки «dueAt × Start» сценарии не держат — заказ пробы исполнителю"
  - id: CX5-30
    decision: N3
    class: "code-authoring §«Контракт, который нельзя выразить» (два вида строк под общим именем «строка доставки»); code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      Приёмка называет «строкой доставки» оба вида и кладёт отложенную строку кандидата рядом со
      строкой адресата («аренда строки — NTF-1 Р7»). Строка кандидата — не письмо: у неё нет адреса,
      и её повтор — это Resolve раскрытия, а не SMTP. Если строки кандидата лежат в ленте конвейера
      NTF-1 или берутся его «взять порцию», конвейер попытается отправить строку без адресата
      (исход по словарю Р11 — не тот) либо закроет её уборщиком. Второе: отложенная строка кандидата
      по области A1 держит повтор, хотя субъект уже адресат по A2 — повтор, давший ADDRESS, вставляет
      строку адресата «если нет» (пустая операция) и снимает строку кандидата; без этого снятия
      строка кандидата живёт вечно и держит fanout_pending выше нуля.
    condition: >-
      (а) вид строки выражен схемой (отдельная таблица либо столбец вида с CHECK на обязательные
      поля каждого вида), предикат взятия конвейера отправки строк кандидата не видит; (б) повтор
      отложенной строки кандидата — путь раскрытия со своей арендой, а не конвейер отправки;
      (в) снятие строки кандидата и вставка строки адресата — одна транзакция, как в Р8; (г) счётчики
      этапа по исходу читают вид строки, а не угадывают его по полям.
    held_by: "покраснеют NTF5-111 (DENIED=1, SENT=2), NTF5-62 (а) (DEFER кандидата без письма); взятие строки кандидата конвейером и повтор, давший ADDRESS при уже существующей строке адресата, сценариями не держатся — заказ пробы"
  - id: CX5-31
    decision: N4
    class: "code-authoring §«Умолчание, которое становится утверждением» (отсутствие срока как новое значение общего поля); measurement-discipline §«Радиус: по имени механизма и по точкам применения»"
    exposure: >-
      До З19 у строки ленты срок был всегда (NTF-1 Р7: expires_at = enqueued_at + ttl). Отсутствие
      срока — новое значение общего поля фундамента, и каждый его читатель написан в допущении
      «срок есть». Радиус по имени в приёмке NTF-1 — четыре читателя: сверка срока перед DATA
      (строка 785), уборщик (1296), окно Р14 «источник недоступен notify до expires_at» (893),
      тревога «половина наименьшего ttl» (1049). В Go незаданное время читается нулём, и сравнение
      «срок прошёл» на нуле истинно: строка obligation закрывается EXPIRED первым же читателем, не
      знающим про класс. Обратная сторона: строка класса notice или security без срока (ошибка
      постановки) молча становится бессрочной.
    condition: >-
      (а) отсутствие срока — NULL в столбце и тип с признаком присутствия в Go (не time.Time);
      (б) CHECK таблицы связывает класс и срок: expires_at IS NULL тогда и только тогда, когда класс
      obligation; (в) каждый читатель expires_at из переписи выше обрабатывает NULL явной веткой,
      перепись приложена к замыслу командой по имени столбца по corelib/notify и services/notify;
      (г) правило «у obligation нет ttl» живёт в одном валидаторе notify/spec, постановка строки
      берёт срок только из ведомости сборки.
    held_by: "покраснеют NTF5-116 (30 суток, EXPIRED 0; близнец notice — EXPIRED), NTF5-117; окно Р14 и тревога «половина ttl» на строке без срока сценарием не держатся — держится переписью читателей в замысле (вниманием)"
  - id: CX5-32
    decision: N5
    class: "security.md sec-per-rpc-check-both-listeners, sec-internal-trusted-assumption-banned; code-authoring §«Инвариант и оснастка — это тоже прод-код» (контроль, держащийся только на внешнем звене)"
    exposure: >-
      До Д17 внутренний слушатель notify-api обслуживал только операторов, и отказ без system_admin
      держался двумя звеньями. По Д17 на одном слушателе — трафик арендаторов (публичные маршруты
      края через notifyInternal) и операторов (внутренние маршруты), и арендатор с пересланным
      принципалом достигает того же слушателя, что InternalNoticeService. Отказ права у
      InternalNoticeService утверждён только у края: NTF5-22, 24 шлют запрос на внутренний слушатель
      края, чья прослойка прав отвечает 403 раньше, чем вызов дойдёт до notify-api. Звено прав
      notify-api для методов InternalNoticeService (Р2, Р18) не держит ни одна буква; строитель
      носителя, собравший цепочку «по слушателю», а не «по методу», пропустит или отвергнет не те
      методы.
    condition: >-
      (а) цепочка notify-api судит право по аннотации метода: InternalNoticeService — system_admin /
      system_viewer на cluster:cluster_root по Р18, восемь методов §9 — освобождение с Check в
      use-case, других освобождений нет; (б) проба на уровне notify-api: InternalNoticeService.Create,
      доставленный клиентом с SAN края и пересланным принципалом без system_admin, — PERMISSION_DENIED,
      близнец — тот же вызов оператора; (в) перепись «метод notify-api ↔ отношение аннотации либо
      освобождение с Check» — один гейт на все сервисы notify (заказ прежнего разбора CX5-13
      расширяется на аннотированные методы).
    held_by: "нет на уровне notify-api — возвращено в приёмку (RA-9); на уровне края — NTF5-22, 24"
  - id: CX5-33
    decision: N6
    class: "code-authoring §«Умолчание, которое становится утверждением» (запасной принципал операции); security.md sec-forwarded-trust-aware-extract"
    exposure: >-
      Отмена и опрос операции Create — только создавшему её (GetOwned, CancelOwned по Owner из
      контекста). Владелец пишется при создании операции. Замер: corelib operations.Create при пустом
      op.Principal берёт принципал из контекста, а при его отсутствии — SystemPrincipal (repo.go:329–345,
      «системные операции, бутстрап»). На слушателе notify-api вызывающий — край (SAN края), личность
      пользователя пересылается; если звено личности носителя Х5 не положило пересланный принципал в
      контекст operations, операция Create пишется от системного принципала: создавший оператор
      получает NOT_FOUND на опрос и отмену, а круг «кто может отменить» определяется не тем, кого
      назвала приёмка.
    condition: >-
      (а) операции notify (Create, переходы, PATCH контактов) создаются только CreateWithPrincipal с
      принципалом из trust-aware пары личности (CertIdentityExtract → TrustedPrincipalExtract);
      отсутствие пересланного принципала — отказ, а не запасной системный; (б) Owner в GetOwned /
      CancelOwned берётся той же функцией, что принципал при создании; (в) id — приставка nop из
      каталога префиксов операций (Х1), не своя строка.
    held_by: "покраснеют NTF5-118 (а) (создавший отменяет), (в) (другой оператор — NOT_FOUND), NTF5-26 (г), (е) на стенде"
  - id: CX5-34
    decision: N6, N7
    class: "measurement-discipline §«Чужое измерение и чужое заявление» (транзакционность, заявленная через API, у которого нет входа транзакции); code-authoring §«Унификация и стоимость» (второй писатель таблицы фундамента)"
    exposure: >-
      Приёмка требует записи операции в транзакции вызывающего в трёх местах: фиксация шага 3 и
      терминальные записи шагов 4, 5 — «запись Operation в этой транзакции с условием done = false
      (тот же предикат, на котором стоит отмена фундамента)», при 0 строк — откат целиком; переходы Р5
      — «эта же транзакция записывает Operation (сразу done=true)»; PATCH контактов — done=true в
      ответе. Замер corelib @34bc810: все экспортируемые записи операций (Create, CreateWithPrincipal,
      MarkDone, MarkDoneWithMetadata, MarkError, CancelOwned) исполняются на пуле, а не на транзакции
      вызывающего; CAS-помощники на транзакции (markDoneCAS, markErrorCAS) неэкспортируемы и зовутся
      только движком Reconciler. В kacho ни один сервис не пишет таблицу операций своим оператором
      (перепись ниже). Значит, либо фундамент получает запись на транзакции вызывающего — правка
      corelib, которой нет ни в DoD NTF-5, ни в co_issues (#77 — notify/spec), — либо notify пишет
      таблицу операций фундамента своим SQL, вторым писателем с копией предиката done = false. NTF-3
      Р18 («терминальная запись становится транзакционной: фундамент принимает транзакцию
      вызывающего») называет такую правку для терминальной записи, но NTF-3 на cbdb3431 без вердикта,
      а NTF-5 на неё не опирается и создание операции в транзакции ею не покрыто.
    condition: >-
      (а) запись операции в транзакции вызывающего — одна экспортируемая функция фундамента на каждую
      форму (создание с done=true, терминальная запись с CAS done=false), с тем же текстом предиката,
      что у CancelOwned; второго писателя таблицы операций в notify нет; (б) ноль строк CAS —
      различимый исход (ErrAlreadyDone), по которому транзакция фиксации откатывается, а не ошибка
      «прочее»; (в) уровень изоляции транзакции фиксации — READ COMMITTED, ошибка сериализации не
      смешивается с «отменена».
    held_by: "покраснеют NTF5-118, NTF5-119 (а)–(д) (20 повторов гонки); производитель записи на транзакции не назван — возвращено в приёмку (RA-8)"
  - id: CX5-35
    decision: N7
    class: "architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» (четвёртый терминальный писатель операции); code-authoring §«Умолчание, которое становится утверждением» (OrphanGrace по умолчанию)"
    exposure: >-
      Приёмка называет ровно трёх терминальных писателей операции Create: фиксация (шаг 3),
      терминальный отказ (шаги 4, 5) и отмена фундамента (шаг 6). Фундамент несёт четвёртого —
      движок Reconciler осиротевших операций, который поднимают все шесть модулей kacho
      (NewReconciler — 6 вызовов) и который NTF-3 §1.5 описывает как штатный путь. Его OrphanGrace по
      умолчанию — 5 мин по modified_at, а окно проверки Create — KACHO_NOTIFY_NOTICE_CREATE_VALIDATION_WINDOW
      в границах [1m, 1h] с умолчанием 10m; ожидающая заявка modified_at не двигает. Поднятый в notify по
      образцу модулей, движок переведёт ожидающую операцию в «interrupted» раньше окна — вместо
      UNAVAILABLE / PEER_UNAVAILABLE по истечении окна (Р10 шаг 5), и фиксация шага 3 после этого не
      применится. В приёмке слов reconciler / orphan / OrphanGrace — 0.
    condition: >-
      (а) в замысле названо, поднимает ли notify движок Reconciler над своей таблицей операций;
      (б) если поднимает — Resolver для операции Create отвечает Skip, пока строка заявки существует,
      и терминальных писателей операции Create остаётся три; OrphanGrace не короче верхней границы окна
      (1h) и задан явно, не умолчанием; (в) если не поднимает — это записано решением с основанием
      (осиротевшей операции Create нет: заявка долговечна, её снимает взятие шага 2).
    held_by: "нет: NTF5-18 (б), (в) и NTF5-118 идут по управляемым часам notify, а движок меряет возраст по modified_at часами базы — сценарии его не увидят; заказ пробы исполнителю"
  - id: CX5-36
    decision: N8
    class: "security-hardening.md hard-short-lived-by-decision, hard-revocation-antidote-cache-fail-closed; security.md sec-no-silent-default-for-guarded-knob; measurement-discipline §«Чужое измерение и чужое заявление»"
    exposure: >-
      Р16: «Окно положительных вердиктов — умолчание фундамента RevocationPolicy.Default, 5 с … Это тот
      же размен, что у списков модулей». Замер kacho @1d42a6728bf опровергает вторую половину: все
      четыре модуля с сужателем (compute, storage, nlb, vpc) передают CacheTTL своей объявленной
      ручкой (KACHO_COMPUTE_LIST_FILTER_CACHE_TTL_MS, KACHO_STORAGE_LIST_FILTER_CACHE_TTL_MS, ключ
      authz.list-filter.cache-ttl у vpc, nlb), и гейт окна отзыва (tools/revocationwindowgate
      knobNames) ведёт эти ручки как «list-filter». У того же процесса notify-api окно звена прав
      объявлено ручкой KACHO_NOTIFY_AUTHZ_CACHE_TTL (NTF-4 Р16, [1 с, 30 с]); окно сужателя, взятое
      неявным умолчанием, не подчиняется ни ей, ни своей ручке: оператор, сузивший окно отзыва до 1 с,
      получает 5 с на затронутых ресурсах. Гейт окна отзыва сужатель notify не увидит — listnarrow.New
      не входит в словарь конструкторов кеша вердиктов, так что держать будет только внимание. Закрытый
      перечень ручек Р17 окна сужателя не содержит.
    condition: >-
      (а) окно сужателя notify-api задаёт объявленная ручка с границами и стражем старта — своя
      (list-filter) либо явно та же, что KACHO_NOTIFY_AUTHZ_CACHE_TTL, решением приёмки; CacheTTL в
      сборке сужателя никогда не ноль; (б) ручка внесена в перепись гейта окна отзыва (knobNames) и в
      запись Windows политики; (в) CacheMaxEntries — так же явно.
    held_by: "нет — утверждение документа о дереве опровергнуто, возвращено в приёмку (RA-7); гейт TestEveryAuthzWindowKnobIsDeclared увидит ручку, только когда её имя будет в knobNames — заказ"

measurements:
