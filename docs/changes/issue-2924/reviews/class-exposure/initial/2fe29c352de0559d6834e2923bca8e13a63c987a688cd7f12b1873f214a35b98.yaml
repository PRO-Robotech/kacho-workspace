outcome: вернуть-в-приёмку
return_to_acceptance:
  - item: RA-7
    cx: CX5-36
    anchors: [Р16, Р17, NTF5-45]
    what: >-
      неизмеренное и опровергнутое утверждение о дереве: «окно положительных вердиктов — умолчание
      фундамента RevocationPolicy.Default, 5 с; тот же размен, что у списков модулей». Все четыре
      модуля с сужателем задают окно своей объявленной ручкой, гейт окна отзыва ведёт их переписью.
      Назвать ручку окна сужателя notify-api (своя list-filter с границами и стражем в закрытом
      перечне Р17, либо явно KACHO_NOTIFY_AUTHZ_CACHE_TTL NTF-4 с обоснованием одного окна на процесс)
      и снять фразу про умолчание.
  - item: RA-8
    cx: CX5-34
    anchors: [Р5, "Р10 шаги 3–6", Р21, "§9 строка NTF5-118, 119", "DoD 10.1 п.3", "§5", "§11"]
    what: >-
      производитель записи операции в транзакции вызывающего не назван: на corelib @34bc810 все
      экспортируемые записи операций идут на пуле, запись с условием done = false на транзакции
      неэкспортируема. Назвать путь — правка фундамента (какая задача corelib, какая стадия её ждёт;
      NTF-3 Р18 называет её только для терминальной записи и без вердикта) либо собственная запись
      notify (тогда — второй писатель таблицы фундамента и чем держится совпадение предиката с
      CancelOwned); покрыть и создание операции с done=true в транзакции перехода и PATCH контактов.
  - item: RA-9
    cx: CX5-32
    anchors: [Р2, Р18, NTF5-22, NTF5-24, "§9"]
    what: >-
      после Д17 трафик арендаторов и операторов приходит на один слушатель notify-api, а отказ права у
      InternalNoticeService утверждён только у края (NTF5-22, 24 — внутренний слушатель края). Нужна
      буква отказа на уровне notify-api с близнецом: InternalNoticeService.Create, доставленный на
      слушатель notify-api клиентом с SAN края (средство §6) с пересланным принципалом без
      system_admin — PERMISSION_DENIED; тот же вызов оператора с system_admin — проходит.

