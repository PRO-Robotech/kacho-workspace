# Прежний первичный разбор — на редакцию 8 (1f4852e4…, CX5-01…28, RA-1…RA-6). Он свидетельствует о
# своей редакции и не переписывается. Здесь разобрана ДЕЛЬТА редакций 9–12 против редакции 8
# (`git diff b41b014f8 13e0b5996 -- <приёмка>`, 856 добавленных и 135 снятых строк): закрытие RA-1…RA-6,
# поверхность по Д17/Д18, операции `nop`, отмена операции `Create`, две формы строк события этапа,
# бессрочность строки `obligation`, сужение по типу. Пункты CX5-01…28 не повторяются — их условия на
# код действуют и отображаются замыслом по прежней записи. Новые номера — CX5-29…36.
#
# Исход — «вернуть в приёмку»: три пункта требуют правки документа (RA-7…RA-9).
