# Экспозиция классов — первичный разбор (initial), под-фаза NTF-5 (извещения оператора), редакция 17.
#
# Разбор сделан ДО кода и привязан к отпечатку одобренной приёмки. Разрешения писать реализацию
# запись не даёт. Когда появится design.md, каждый пункт CX5-* должен получить точное отображение
# в решение замысла, а затем пересверку на отпечаток замысла
# (class-exposure/revalidation/<design-sha256>.yaml).
#
# Прежние первичные разборы: редакция 8 (1f4852e4…, CX5-01…28), редакция 12 (2fe29c35…, CX5-29…36),
# редакция 14 (88fabd09…, CX5-37…41), редакция 15 (03e291ee…, CX5-42…44). Каждый свидетельствует о
# своей редакции и не переписывается.
# По Д22 здесь судится ТОЛЬКО дельта редакций 16–17 против редакции 15
# (`git diff 3ba8e31e1 a8f880009 -- <приёмка>`: 219 добавленных и 52 снятые строки). В дельту
# входят: закрытие RA-11 разделением держателя (перепись строк (з), (и) по таблицам миграций
# corelib и перепись входов хранилища DoD 10.1 п.2а (б)); Д20 (2), (3) — методы notify, не
# являющиеся Internal*, на внешнем gRPC-входе края по перечню, NTF5-49 (б), (г), NTF5-84, З21;
# держатели строк перечня и ключа notify — вычисляемые пробы края (DoD 10.1 п.4 (i), (ii), 10.2 п.5).
# Новые номера — CX5-45…48.
#
# Исход — «к замыслу». По Д22 условие к коду вносится в замысел, а не в приёмку. Каждое новое
# условие касается кода, у которого наблюдаемый исход, обязательный для документа, уже утверждён
# (NTF5-49 (б), NTF5-84, NTF5-122 (з)). Два неточных утверждения документа о дереве названы
# неблокирующими строками автору приёмки.
