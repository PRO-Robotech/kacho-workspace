items:
  - id: CX5-45
    decision: N23, N24
    class: "code-authoring §«Контракт, который нельзя выразить» (одно значение — адрес единственного слушателя notify-api — получает два написания); code-authoring §«Умолчание, которое становится утверждением» (умолчание адреса у второго ключа)"
    exposure: >-
      На крае ключ карты соединений — это отдельное соединение. dialBackends
      (gateway/cmd/api-gateway/mtls_config.go:60) на каждый ключ из config.BackendAddrs() вызывает
      grpc.NewClient, а BackendAddrs (config.go:992) берёт адрес каждого ключа из своего поля
      конфигурации. У всех семи доменов своя ручка с умолчанием в теге
      (KACHO_API_GATEWAY_<DOMAIN>_GRPC, default "<svc>:9090"). Ключ `notify` для внешнего gRPC-входа
      (Д20 (2)), заведённый по образцу соседей, откроет второе соединение со второй ручкой адреса.
      Это расходится с утверждением документа «по тому же соединению» / «второго соединения к
      notify нет» (Р2 строки 668, 677; DoD 10.1 п.4; 10.2 п.5). Образец соседа ещё и подставит
      умолчание: адрес публичного порта (:9090), которого по Д17 у notify-api нет. Тогда REST через
      notifyInternal работает, а внешний gRPC к тем же методам отвечает UNAVAILABLE. Ни одна
      in-process проба этого не увидит: NewClient ленив, а route_wiring_parity проверяет только,
      что ключ есть. NTF-4 Р20 (@5cb8057d, строки 1391–1400) запрещает молчаливое умолчание только
      адресу `notifyInternal` и о происхождении адреса ключа `notify` не говорит.
    condition: >-
      (а) Ключи `notify` и `notifyInternal` берут адрес из ОДНОГО поля конфигурации края. Второй
      ручки адреса notify (KACHO_API_GATEWAY_NOTIFY_GRPC и подобной) в config.go нет, у поля нет
      умолчания в теге (NTF-4 Р20). (б) Оба ключа указывают на один и тот же *grpc.ClientConn:
      dialBackends либо BackendAddrs объявляет `notify` псевдонимом `notifyInternal`, а не
      открывает второе соединение. Только так верно утверждение документа «второго соединения
      нет». Если замысел выбирает два соединения на один адрес, он пишет это прямо, и автор
      приёмки правит формулировку (см. to_acceptance_author). (в) backendEdge даёт обоим ключам
      одно ребро mTLS (`notify`), как у пар vpc/vpcInternal. (г) Когда notify в установке нет
      (NTF-4 Р20), нет ни одного из двух ключей. Методы notify перечня на внешнем gRPC-входе
      получают тогда отказ маршрута, а не звонок по пустому адресу.
    held_by: "нужен гейт, его нет: (а), (в) видны по диффу config.go и mtls_config.go; (б) — проба «backends[notify] == backends[notifyInternal]» по карте, которую строит dialBackends, с близнецом «два ключа vpc/vpcInternal — разные соединения»; на стенде расхождение адресов покажет NTF5-49 (б)"
  - id: CX5-46
    decision: N25, N24
    class: "gate-authoring §«фикстура не снисходительнее продукта» (проба судит установку, собранную из умолчаний, а умолчания у notify по правилу нет); code-authoring §«Умолчание, которое становится утверждением»"
    exposure: >-
      DoD 10.1 п.4 (ii) требует, чтобы TestRouteWiring_EveryAllowedMethodResolvesOnTheRealBackends
      был зелёным, и объявляет, что «эта под-фаза их не правит, кроме импорта в (i)» (строка 3625).
      Проба строит карту вызовом config.Load() из окружения тестового процесса
      (route_wiring_parity_test.go, realBackends). TestMain и t.Setenv адресов в пакете нет: все
      семь доменов попадают в карту только за счёт умолчаний в тегах полей. У адреса notify
      умолчания по NTF-4 Р20 нет, а незаданный адрес означает «notify в установке нет». В тестовом
      окружении ключей notify тогда нет. Строки notify, которые эта под-фаза вносит в перечень,
      не резолвятся, и (ii) краснеет на зелёном продукте. Проще всего выйти из этого, добавив полю
      адреса умолчание. Это нарушит NTF-4 Р20 и CX5-45 (а), а (ii) при этом станет зелёным. Итог:
      держатель, объявленный неизменным, при неизменном тексте либо красный, либо зеленеет ценой
      запрещённого умолчания.
    condition: >-
      (а) Проба (ii) задаёт установку с notify явно: t.Setenv адреса notify и пары mTLS либо
      признака «notify в установке есть», — а не получает её из умолчания поля. Правка пробы
      названа в замысле как правка держателя, которую приёмка не предусмотрела (см.
      to_acceptance_author). (б) Близнец в той же пробе: без адреса notify ключей `notify` и
      `notifyInternal` в карте нет, строк notify среди резолвящихся нет. Так проба доказывает,
      что зелёный цвет не получен умолчанием. (в) В config.go у поля адреса notify нет тега
      default (CX5-45 (а)).
    held_by: "нужен гейт, его нет: (а), (б) — правка route_wiring_parity_test.go, заказ исполнителю края; (в) — видно по диффу тега"
  - id: CX5-47
    decision: N22, N21
    class: "measurement-discipline §«Предикат — только с контролем» (перепись входов хранилища не видит два канала, по которым функция пакета получает настройку мимо хранилища); code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      Р23 (строки 1515–1523) утверждает: «без такого входа у функции нет ни писателя, ни
      настройки, и обвязка (з) — единственная конфигурация хранилища». Из остатка названа одна
      позиция — флаг из окружения процесса. На дереве каналов ещё два, и перепись (б) их не видит.
      (1) Глобальная переменная пакета, которую настраивает экспортируемая свободная функция. В
      пакете operations прецедент уже есть: `var defaultRegistry = NewWorker()` (worker.go:83)
      настраивается вызовом `ConfigureDefault(opts ...WorkerOption)` (worker.go:699). По NTF-3 Р18
      писатель ленты исполнителя — законная опция Worker. Попав в defaultRegistry, он достижим из
      любой функции пакета, в том числе из markErrorCAS. ConfigureDefault не возвращает хранилище и
      не является методом его типа, поэтому (б) его не разбирает. (2) Значение в контексте: у Ф1…Ф4
      параметр context.Context, и (б) его допускает. Пакет уже читает из контекста
      (PrincipalFromContext, principal_ctx.go:44), и флаг либо писатель, положенный исполнителем в
      ctx, (б) тоже не видит. Обвязка (з) ни того ни другого не включает, так что (з) остаётся
      зелёной. Условие CX5-44 (б) («Ф3, Ф4 — обёртки из одного вызова») закрывает оба канала только
      при неизменном ТЕЛЕ markDoneCAS и markErrorCAS. Документ же требует от Ф3, Ф4 «экспорт без
      изменения условия», а не тела.
    condition: >-
      (а) Ф1…Ф4 и все неэкспортируемые функции пакета, которые они вызывают (markDoneCAS,
      markErrorCAS, помощник вставки), не читают глобальных переменных пакета, кроме
      сигнальных ошибок (ErrAlreadyDone, ErrNotFound) и констант. Они не вызывают ctx.Value
      (напрямую или через *FromContext) и не читают окружение процесса. Из полей pgRepo им
      доступны только pool и schema через tableName(). (б) Тела markDoneCAS и markErrorCAS в
      правке не меняются, кроме переименования для экспорта, либо изменение названо в замысле с
      обоснованием. (в) Кандидат в гейт corelib: разбор тел Ф1…Ф4 и их замыкания вызовов внутри
      пакета. Находка — ссылка на глобальную переменную пакета вне перечня сигнальных ошибок,
      вызов ctx.Value или os.Getenv. Близнецы: на теге молчит; инъекция чтения defaultRegistry в
      markErrorCAS — красная с именем функции; перепись печатает число разобранных функций.
      (г) CX5-44 (а) заменяется этим пунктом: граница проходит по Ф1…Ф4, а не по пакету, и
      Worker/Reconciler ставить operation-failed вправе (NTF-3 Р18).
    held_by: "нужен гейт, его нет: (в) — заказ исполнителю corelib; до гейта (а), (б) видны по диффу тел функций"
  - id: CX5-48
    decision: N25, N23
    class: "code-authoring §«Решение и его следствие разнесены» (переключатель — blank-импорт пакета — судит весь пакет, а строки перечня принадлежат разным под-фазам)"
    exposure: >-
      TestAllowlist_EveryPublicRPCIsRoutable требует, чтобы в AllowedMethods был КАЖДЫЙ метод
      любого сервиса пакета, не являющегося Internal* (parity_test.go:366; HasInternalSuffix,
      list.go:482). TestAllowlist_CensusCoversEveryProtoFile требует blank-импорт, как только на
      диске под proto/kacho/cloud появился любой .proto пакета notify. Импорт поэтому обязателен уже
      с первой правкой контракта notify, а не с этой под-фазы. С момента импорта перечень должен
      содержать строки всех публичных сервисов notify, какие есть в дереве: у соседей названы
      NotificationPreferencesService, NotificationSubscriptionService, NotificationInboxService,
      NotificationCatalogService, AccountNotificationContactsService, а не только восемь методов
      этой под-фазы. Правка, которая заводит NoticeService или ProjectNotificationContactsService
      в контракте без строк перечня, краснеет. Та, что вносит строки при ещё не заведённом ключе
      `notify`, краснеет в (ii). Порядок задан тремя под-фазами.
    condition: >-
      (а) Строки перечня четырёх методов NoticeService входят в тот же коммит, что сервис в
      контракте (S1), строки Get, Update контактов проекта — в тот же, что
      ProjectNotificationContactsService (10.2 п.5). Так записано в DoD, и замысел это
      подтверждает. (б) Замысел проверяет на ревизии посадки, что в дереве нет публичного сервиса
      notify без строк перечня. Если импорт вносит эта под-фаза, она вносит и строки публичных
      методов notify, уже лежащих в дереве, — кто бы их ни заводил. (в) Посадка S1 идёт после
      посадки ключа `notify` (NTF-4 Р20 по Д20 (2), §5).
    held_by: "покраснеет TestAllowlist_EveryPublicRPCIsRoutable и TestRouteWiring_EveryAllowedMethodResolvesOnTheRealBackends — гейты есть; пункт о порядке, а не о новом гейте"

measurements:
  - claim: "ключ `notify` на внешнем gRPC-входе идёт «по тому же соединению», второго соединения нет (Р2, DoD 10.1 п.4)"
    command: "git -C project/kacho show 1d42a6728bf:gateway/cmd/api-gateway/mtls_config.go | sed -n 60,100p; git -C project/kacho show 1d42a6728bf:gateway/internal/config/config.go | sed -n 992,1016p"
    result: >-
      опровергнуто как свойство образца: dialBackends открывает по одному grpc.NewClient на ключ
      BackendAddrs, 14 ключей = 14 соединений плюс петля operation; у каждого ключа своё поле адреса
      (CX5-45). Верно только при псевдониме ключа, которого в дереве нет
  - claim: "поля адресов бэкендов края несут умолчание"
    command: "git -C project/kacho grep -nE 'VPCAddr|VPCInternalAddr|StorageInternalAddr' 1d42a6728bf -- gateway/internal/config/config.go"
    result: "подтверждено: теги default:\"vpc.kacho.svc:9090\", \"vpc.kacho.svc:9091\", \"kacho-storage.kacho.svc:9091\" — образец, который NTF-4 Р20 для notify запрещает (CX5-45, CX5-46)"
  - claim: "пробы (ii) существуют и под-фаза их не правит"
    command: "git -C project/kacho show 1d42a6728bf:gateway/cmd/api-gateway/route_wiring_parity_test.go | grep -n '^func Test'; git -C project/kacho grep -nE 'func TestMain|Setenv\\(' 1d42a6728bf -- 'gateway/cmd/api-gateway/*_test.go'"
    result: >-
      4 пробы, названы две — существуют. realBackends вызывает config.Load() без Setenv адресов; в
      пакете TestMain нет, Setenv только ручек mTLS и пары носителя. Без умолчания адреса notify
      ключей notify в карте пробы не будет (CX5-46) — «не правит» неверно
  - claim: "пробы (i) существуют; население — blank-импорты; внутренний сервис — по имени"
    command: "git -C project/kacho show 1d42a6728bf:gateway/internal/allowlist/parity_test.go | grep -n '^func Test\\|^\\s*_ \"'; git -C project/kacho show 1d42a6728bf:gateway/internal/allowlist/list.go | sed -n 482,500p"
    result: >-
      4 пробы, 11 blank-импортов, пакета notify среди них нет; HasInternalSuffix — «InternalService»
      в пути или префикс Internal + суффикс Service у сервиса. InternalNoticeService под него
      попадает. Перепись диска обходит все .proto под корнями — импорт notify обязателен с первого
      .proto пакета (CX5-48)
  - claim: "перепись входов хранилища на 34bc810 молчит: NewRepo и 13 экспортируемых методов"
    command: "git -C project/corelib grep -nE '^func \\([a-z]+ \\*?pgRepo\\) [A-Z]' 34bc8104a -- 'operations/*.go' ':!*_test.go' | wc -l; git -C project/corelib grep -nE '^func [A-Z][A-Za-z]*\\([^)]*\\) \\(?(Repo|FullRepo|OwnedOperationRepo)' 34bc8104a -- 'operations/*.go' ':!*_test.go'"
    result: "13 методов (12 в repo.go и SweepTerminal в retention.go), функций, возвращающих хранилище, — 2 (NewRepo, AsOwned) — подтверждено"
  - claim: "у функции пакета нет настройки вне входов хранилища (Р23 «единственная конфигурация»)"
    command: "git -C project/corelib grep -nE '^var ' 34bc8104a -- 'operations/*.go' ':!*_test.go'; git -C project/corelib grep -n 'func ConfigureDefault\\|func PrincipalFromContext' 34bc8104a -- operations/"
    result: >-
      опровергнуто: глобальная переменная defaultRegistry (worker.go:83) с экспортируемой
      настройкой ConfigureDefault (worker.go:699) и чтение контекста (principal_ctx.go:44) —
      два канала вне переписи (б) (CX5-47)
  - claim: "исполнитель и Reconciler лежат в пакете operations (довод §26 против предиката импортов)"
    command: "git -C project/corelib ls-tree --name-only 34bc8104a operations/ | grep -E 'worker.go|reconciler.go'"
    result: "подтверждено: operations/worker.go, operations/reconciler.go — CX5-44 (а) снят"
  - claim: "(з) видит все таблицы миграций corelib"
    command: "git -C project/corelib ls-tree -r --name-only <rev> | grep '\\.sql$' — на 34bc8104a и v1.10.0-rc.5; CREATE TABLE по ним"
    result: >-
      один каталог migrations/common, 4 файла, 1 CREATE TABLE (operations) на обеих ревизиях.
      Миграция ленты по NTF-3 (строка 1423) генерируется notifygen в дерево модуля, не в corelib —
      (з) её не видит, и документ это говорит прямо. Число не меняет вывод о (з), приложено ради
      объёма
  - claim: "внешний gRPC-вход не пропускает личность, присланную клиентом, до notify-api"
    command: "git -C project/kacho grep -n 'x-kacho-principal' 1d42a6728bf -- gateway/internal/middleware/auth.go"
    result: "подтверждено: звено аутентификации срезает входящие x-kacho-principal-* (auth.go:424) и ставит своё; класс для notify не новый, отдельного пункта нет"

