# Экспозиция классов — первичный разбор (initial), под-фаза NTF-5 (извещения оператора), редакция 15.
#
# Разбор ДО кода, привязан к отпечатку одобренной приёмки. Разрешения писать реализацию запись не
# даёт: после появления design.md каждый пункт CX5-* должен получить точное отображение в решение
# замысла, а затем — пересверку на отпечаток замысла (class-exposure/revalidation/<design-sha256>.yaml).
#
# Прежние первичные разборы: редакция 8 (1f4852e4…, CX5-01…28), редакция 12 (2fe29c35…, CX5-29…36;
# в неё вошли поверхность по Д17/Д18, операции nop, опрос и отмена Create на внутреннем слушателе
# края, PATCH контактов с done=true) и редакция 14 (88fabd09…, CX5-37…41). Все три свидетельствуют
# о своих редакциях и не переписываются; их условия действуют без изменений.
# Здесь разобрана ДЕЛЬТА редакции 15 против редакции 14 (`git diff 63278f069 3ba8e31e1 -- <приёмка>`,
# 109 добавленных и 47 снятых строк): Р23 с единицей «функция» Ф1…Ф4, пункт «функция пишет только
# строку операции», граница с NTF-3 Р18 по функциям, NTF5-122 (з), (и), (к), DoD 10.1 п.2а.
# Д17 и Д18 уже отображены записью на редакцию 12 (N5, N6, CX5-29…36) и повторно не возвращаются.
# Новые номера — CX5-42…44.
#
# Исход — «вернуть в приёмку»: один пункт требует правки документа (RA-11).
