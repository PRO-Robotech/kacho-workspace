items:
  - id: CX5-42
    decision: N16, N18
    class: "code-authoring §«Решение и его следствие разнесены» (решение о тексте терминального отказа принимает надстройка над репозиторием, а новая терминальная запись идёт мимо неё); code-authoring §«Унификация и стоимость» (общая Ф4 берёт семантику самого узкого потребителя)"
    exposure: >-
      Прежний CX5-38 (а) велел сделать Ф1…Ф4 методами хранилища «расширением FullRepo». В kaname
      терминальную запись ошибки перехватывает надстройка TerminalRefusalRepo: она встраивает
      operations.FullRepo целиком и переопределяет только MarkError (выбор текста отказа по носителю,
      kacho#2439). Надстройку ставят в серверный корень, cmd/kaname/serve.go:216. Метод, который
      добавлен в FullRepo, встраивание продвигает в надстройку без переопределения. Поэтому Ф4,
      вызванная через неё, запишет терминальный отказ в обход выбора текста. Компилятор этого не
      покажет: встраивание удовлетворяет интерфейсу. Дойдёт до этого, если по NTF-3 Р18 исполнитель
      фундамента переведёт терминальную запись ошибки на Ф4 (NTF-5 Р23: «Ф4 заводит та правка, что
      сядет первой»). Тогда в kaname на терминальной полосе снова поедет синхронный совет «повтори
      запрос». Сама надстройка перечисляет апгрейды, которые обязана сохранить, и Ф4 в этом перечне
      нет — его снимали до Р23.
    condition: >-
      (а) Ф1…Ф4 объявлены отдельным экспортируемым интерфейсом пакета operations, который НЕ входит
      в FullRepo и Repo; pgRepo его реализует; notify-api и notify-sender получают этот интерфейс
      из того же экземпляра NewRepo, что и обработчик операций (CX5-38 (в) действует);
      (б) Ф4 не берётся типовым утверждением у значения типа Repo или FullRepo: вызывающий получает
      её параметром этого интерфейса, и подмена надстройкой ломает сборку, а не проходит молча;
      (в) если замысел всё же вносит Ф4 в FullRepo, то в том же изменении у надстройки kaname
      появляется переопределение Ф4 с тем же выбором текста, что у MarkError, и её проба
      покрывает Ф4.
    held_by: "нужен гейт, его нет: в corelib ни одна проба не видит надстройку kaname; (а) и (б) видны по диффу сигнатур; заказ исполнителю corelib и строка диспетчеру для NTF-3"
  - id: CX5-43
    decision: N16, N18
    class: "code-authoring §«Умолчание, которое становится утверждением» (запасной путь «нет транзакции — открою свою»); code-authoring §«Контракт, который нельзя выразить» (pgx.Tx — интерфейс, nil проходит компиляцию)"
    exposure: >-
      Р23 говорит, что Ф1…Ф4 принимают pgx.Tx и пула не принимают. pgx.Tx — интерфейс: nil проходит
      по типу. NTF-3 Р18 в действующей редакции cbdb3431 (строка 1075) требует: «фундамент
      принимает транзакцию вызывающего либо открывает свою». Правка NTF-3, сев первой, может
      выполнить эту букву ветвью «tx == nil → своя транзакция из пула хранилища» внутри Ф4. Тогда
      вызывающий notify, по ошибке передавший nil (например, неинициализированную переменную на
      ветке отказа Р10 шаг 4), получит терминальную запись вне своей транзакции. Снятие заявки
      откатится, а операция будет зафиксирована с ошибкой. Против этого исхода Р23 и отвергает
      «запись операции отдельной транзакцией». NTF5-122 такой вход не проверяет: ни одна буква не
      подаёт nil.
    condition: >-
      (а) в телах Ф1…Ф4 нет ветви по tx == nil, открывающей транзакцию; на nil функция возвращает
      ошибку до первого запроса; (б) путь «фундамент открывает свою транзакцию» NTF-3 Р18 — это
      отдельный метод на пуле (нынешний MarkError, repo.go:586, либо его транзакционная пара), а не
      режим Ф4; (в) в пробе фундамента есть буква «Ф1…Ф4 с nil вместо транзакции → ошибка, строк
      операции 0» с близнецом «та же функция с транзакцией → строка есть».
    held_by: "нужен гейт, его нет: буква NTF5-122 с nil заказана исполнителю corelib; (б) — строка диспетчеру для автора NTF-3"
  - id: CX5-44
    decision: N17, N19
    class: "gate-authoring §«фикстура не снисходительнее продукта»; measurement-discipline §«Предикат — только с контролем» (перепись строк, не видящая таблицу, в которую пишет искомый дефект)"
    exposure: >-
      Р23 и DoD 10.1 п.2а утверждают: «Функция, ставящая строку operation-failed или иную строку
      сама, роняет (з)». Обвязка (з) по §6 и Given NTF5-122 содержит таблицу операций, T1 и T2.
      Таблицы ленты фундамента (notify/feed, Д6) в ней нет, флага модуля нет. В corelib @34bc810
      каталога notify нет вовсе. NTF-3 Р18 в действующей редакции предписывает ровно ту Ф4, которую
      (з) должна ловить: «терминальная запись … при включённом флаге ставит в ту же транзакцию строку
      operation-failed». Реализация такой буквы — опция хранилища (писатель ленты или флаг),
      выключенная по умолчанию. В обвязке (з) эта опция не включена, строки ленты не возникает, и
      перепись меняет только таблицу операций. (з) зелёная на том самом построении, против
      которого написана. Положительный контроль (и) это не закрывает: он доказывает, что перепись
      видит T2, но не то, что видна таблица ленты. Перепись по числу строк не видит и UPDATE либо
      DELETE в чужой таблице, но Р23 запрещает именно «ставить строки», так что это не
      дефект держателя.
    condition: >-
      (а) пакет operations не импортирует corelib/notify/* и у pgRepo нет поля писателя ленты или
      флага модуля: у Ф4 нет механизма поставить строку ленты; (б) Ф3 и Ф4 — обёртки ровно из
      одного вызова markDoneCAS / markErrorCAS с r.tableName(); (в) держатель «не ставит строк
      других таблиц» либо строит обвязку со всеми опциями хранилища, какие экспортирует пакет, и с
      таблицей ленты, либо судится предикатом импортов с контролем в обе стороны.
    held_by: "нет: утверждение документа о силе (з) неверно на предписанной им обвязке — возвращено в приёмку (RA-11); (а) держится предикатом импортов, кандидатом в гейт — в заказах"

