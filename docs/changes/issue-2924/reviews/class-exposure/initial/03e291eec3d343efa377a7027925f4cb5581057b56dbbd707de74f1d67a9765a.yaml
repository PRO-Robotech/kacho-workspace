outcome: вернуть-в-приёмку
return_to_acceptance:
  - item: RA-11
    cx: CX5-44
    anchors: [Р23 «Функция пишет только строку операции», "NTF5-122 Given, (з), (и)", "§6 строка «запись операции фундамента»", "DoD 10.1 п.2а"]
    what: >-
      утверждения «функция, ставящая строку operation-failed … сама, роняет (з)» (NTF5-122 Then) и
      «иначе NTF5-122 (з) красный» (DoD 10.1 п.2а) неверны на обвязке, которую предписывает сам
      документ. В ней нет ни таблицы ленты, ни флага модуля, а NTF-3 Р18 предписывает Ф4, ставящую
      строку только «при включённом флаге». Нужно одно из двух. (1) В Given (з) — таблица ленты
      фундамента и хранилище, собранное со всеми опциями, какие экспортирует пакет operations, при
      включённом флаге. (2) Держатель пункта — предикат: «пакет operations не импортирует
      corelib/notify/*, у хранилища нет поля писателя ленты или флага», с отрицательным близнецом
      из дерева (пакет, который импортирует notify) и печатью объема осмотренного. Буквы (з), (и)
      тогда остаются держателем для строк, которые видит перепись.

orders:
  - to: acceptance author (NTF-5)
    what: "RA-11; после правки — новый отпечаток, новое одобрение, повтор первичного разбора дельтой"
    basis: "change-graph.md §4; SDD-1 §5 (ACCEPTANCE_APPROVED → CLASS_EXPOSURE_RECORDED)"
  - to: design author (NTF-5)
    what: >-
      отображение CX5-01…44 в решения замысла. Отдельно: интерфейс Ф1…Ф4 вне FullRepo и Repo, Ф4 не
      берётся типовым утверждением (CX5-42; уточняет CX5-38 (а)); отказ на nil вместо транзакции
      (CX5-43); Ф3, Ф4 — обёртки из одного вызова, хранилище без опции ленты (CX5-44 (а), (б))
    basis: "change-graph: второй разбор — по замыслу (SDD-1 §5, CLASS_EXPOSURE_RECORDED → DESIGN)"
  - to: dispatcher
    what: >-
      строка автору NTF-3 (Р18 @cbdb3431): (1) подлежащее «терминальная запись ставит строку
      operation-failed» переписать на «вызывающий терминальной записи ставит» — так читает границу
      NTF-5 Р23; (2) «либо открывает свою» — отдельный метод на пуле, не режим функции с
      транзакцией; (3) перевод исполнителя фундамента на Ф4 требует переопределения Ф4 в надстройке
      kaname TerminalRefusalRepo, иначе на терминальной полосе kaname вернётся совет «повтори
      запрос» (kacho#2439). Строка автору NTF-2 / владельцу надстройки kaname — то же (3)
    basis: "code-authoring §«Решение и его следствие разнесены»; verdict-and-landing (общий ствол, параллельные писатели)"
  - to: go implementer (corelib operations, NTF-5)
    what: >-
      в пробу NTF5-122 — буква «Ф1…Ф4 с nil вместо транзакции → ошибка, строк операции 0» с
      близнецом (CX5-43). Гейт-кандидат: «пакет operations не импортирует corelib/notify/*» —
      go list -deps с отрицательным близнецом (CX5-44 (а))
    basis: "gate-authoring (отрицание с близнецом); testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки» п.1"

proposals:
  class_guard_candidate: "—: однофайлового признака у CX5-42…44 нет — надстройка и интерфейс лежат в разных репозиториях, импорт судится графом пакета"
  new_class:
    status: находка, не класс
    note: >-
      «Новый метод интерфейса, который встраивает надстройка, продвигается мимо неё» наблюдался один
      раз (CX5-42, kaname TerminalRefusalRepo), цена измерена не на стволе — порог
      code-authoring §«Механизм накопления опыта» не пройден. Родственная запись в самой надстройке —
      «НАДСТРОЙКА ОБЯЗАНА СОХРАНИТЬ ВСЕ АПГРЕЙДЫ РЕПОЗИТОРИЯ» (перечень снят по дереву, не держится
      гейтом). Второе независимое вхождение переводит находку в класс.
