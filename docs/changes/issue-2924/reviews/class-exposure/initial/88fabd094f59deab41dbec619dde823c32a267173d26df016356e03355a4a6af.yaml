# Экспозиция классов — первичный разбор (initial), под-фаза NTF-5 (извещения оператора), редакция 14.
#
# Разбор ДО кода. Привязан к отпечатку одобренной приёмки. Разрешения писать реализацию эта запись
# не даёт: после появления design.md каждый пункт CX5-* обязан получить точное отображение в решение
# замысла и пересверку на отпечаток замысла (class-exposure/revalidation/<design-sha256>.yaml).
#
# Прежние первичные разборы — на редакцию 8 (1f4852e4…, CX5-01…28, RA-1…RA-6) и на редакцию 12
# (2fe29c35…, CX5-29…36, RA-7…RA-9). Они свидетельствуют о своих редакциях и не переписываются.
# Здесь разобрана ДЕЛЬТА редакций 13–14 против редакции 12
# (`git diff 13e0b5996 d3cb7bafa -- <приёмка>`, 375 добавленных и 44 снятых строки): Р23 (запись
# операции в транзакции вызывающего), ручка окна сужателя с умолчанием загрузчика и перепись гейта
# окна отзыва (Р16, Р17, DoD 10.1 п.10), NTF5-120…122, DoD 10.1 п.2а, п.11. Пункты CX5-01…36 не
# повторяются — их условия действуют и отображаются замыслом по прежним записям. Новые номера —
# CX5-37…41.
#
# Исход — «вернуть в приёмку»: один пункт требует правки документа (RA-10).
