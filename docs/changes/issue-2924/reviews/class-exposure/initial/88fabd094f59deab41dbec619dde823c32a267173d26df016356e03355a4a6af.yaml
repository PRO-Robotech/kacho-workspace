  N11: "Р23: функции создания отвергают пустой принципал без SystemPrincipal; транзакции notify — READ COMMITTED; второго писателя таблицы операций нет; тег corelib с Р23 поднят в kacho до старта S1 (DoD 10.1 п.2а)"
  N12: "Р16, Р17: окно сужателя notify-api — ручка KACHO_NOTIFY_LIST_FILTER_CACHE_TTL, умолчание загрузчика 5s, граница [1s, 10s] (верх — RevocationPolicy.Ceiling), в values не задаётся"
  N13: "DoD 10.1 п.10: ручка в knobNames, каталог services/notify/internal/config в revocationScanRoots, запись RevocationPolicy.Windows «notify KACHO_NOTIFY_LIST_FILTER_CACHE_TTL» = 5s в corelib; тег corelib с записью и объявление ручки садятся в kacho одним изменением"
  N14: "NTF5-120, §6: часы сужателя — порт часов обвязки (listnarrow WithClock); окно из ручки держит проба со значением 2s"
  N15: "NTF5-121, DoD 10.1 п.11: звено прав notify-api судит методы InternalNoticeService по аннотации; перепись «метод ↔ аннотация либо освобождение с Check» — гейт дерева"

items:
  - id: CX5-37
    decision: N10
    class: "code-authoring §«Унификация и стоимость» (сведение двух потребителей к одной функции — по самой узкой семантике); code-authoring §«Контракт, который нельзя выразить» (единица «форма» не выражена тем, что считает предикат)"
    exposure: >-
      Р23 и DoD 10.1 п.2а считают «формами» три предмета и требуют ровно одну экспортируемую функцию
      на форму. Форма 3 при этом — «экспорт существующих markDoneCAS и markErrorCAS»: это две функции
      (а у фундамента их три — ещё markDoneWithMetadataCAS). Предикат п.2а на построении, которое
      предписывает тот же пункт, даёт 2 на форме 3 — выполнить букву можно только слиянием успеха и
      ошибки в одну функцию, о котором документ не говорит. Второе: граница с NTF-3 Р18 («функцию формы
      заводит та под-фаза, что сядет первой; вторая не заводится») сводит не одну и ту же форму. NTF-3
      Р18 делает транзакционной только терминальную запись ОШИБКИ и в ту же транзакцию ставит строку
      operation-failed при включённом флаге. Если NTF-3 сядет первой, половины «успех» у фундамента не
      будет, а буква «вторая не заводится» запретит NTF-5 её завести. Если общая функция формы 3 несёт
      постановку строки operation-failed внутри себя, терминальный отказ Create (шаги 4, 5 Р10) пошлёт
      оператору извещение о сбое. Такого исхода NTF-5 не описывает, и принципал операции nop — всегда
      user (Р23).
    condition: >-
      (а) единица предиката выражена сигнатурой: экспортируемые идентификаторы пакета operations с
      параметром-транзакцией, перечислены поимённо, их число названо; успех и ошибка — либо две
      формы (всего четыре), либо одна функция с исходом-oneof, решением приёмки; (б) функции записи
      на транзакции пишут только строку таблицы операций: строку operation-failed NTF-3 ставит её
      вызывающий в той же транзакции, а не функция фундамента; (в) граница с NTF-3 Р18 названа
      по функциям, а не по «форме».
    held_by: "нет — предикат DoD 10.1 п.2а невыполним на предписанном им построении; возвращено в приёмку (RA-10)"
  - id: CX5-38
    decision: N10, N11
    class: "code-authoring §«Контракт, который нельзя выразить» (запись вне транзакции и чужое имя таблицы — выразимы); rule api-outcome / ban10 db-cas"
    exposure: >-
      «Экспорт без изменения» переносит наружу сигнатуру помощников как есть:
      markDoneCAS(ctx, q rowQuerier, table, id, …). rowQuerier по комментарию фундамента — «общий для
      *pgxpool.Pool и pgx.Tx интерфейс» (repo.go:158). Вызывающий, передавший пул вместо своей
      транзакции, получает запись вне транзакции фиксации, и компилятор этого не видит. Шаг 3 Р10
      тогда фиксирует операцию, даже если запись извещения откатилась: успешная операция без
      извещения, против которой Р23 отверг «запись операции отдельной транзакцией». Второе: параметр
      table — строка. Имя таблицы у CancelOwned и общего обработчика берёт r.tableName() из схемы
      NewRepo, а экспортированной функции его подаёт notify — второе написание одного значения. При
      расхождении схемы запись идёт в одну таблицу, а отмена и опрос — в другую. Третье:
      CreateWithPrincipal подставляет SystemPrincipal при пустом принципале (repo.go:384). Новая
      функция создания, собранная из её тела, наследует запасной путь.
    condition: >-
      (а) функции Р23 — методы хранилища operations (расширение FullRepo), имя таблицы — r.tableName();
      параметра table у экспортируемой функции нет; (б) параметр — pgx.Tx, а не rowQuerier: запись вне
      транзакции вызывающего не компилируется; (в) обработчик операций notify-api и писатель на
      транзакции получают один и тот же экземпляр NewRepo (одна схема), что видно в композиционном
      корне; (г) общий построитель INSERT не содержит запасного принципала, SystemPrincipal остаётся
      только в пуловых Create/CreateWithPrincipal.
    held_by: "покраснеют NTF5-122 (а), (в) (откат оставил операцию — запись шла мимо транзакции), (д1), (д2) (запасной принципал); подача пула на месте вызова в notify и расхождение схемы сценариями не держатся — держатся сигнатурой (а), (б) и видны в диффе"
  - id: CX5-39
    decision: N11, N13
    class: "code-authoring §«Решение и его следствие разнесены» (запись политики в corelib, её предмет — в kacho, связь — через пин, который поднимают чужие полосы); verdict-and-landing (общий ствол, параллельные писатели)"
    exposure: >-
      Гейт окна отзыва kacho читает RevocationPolicy.Windows из ПИНА corelib
      (revocationwindow_test.go импортирует corelib/authz). Запись «notify
      KACHO_NOTIFY_LIST_FILTER_CACHE_TTL» в любом теге corelib делает красным ствол kacho,
      поднявший пин на этот тег раньше, чем в services/notify/internal/config объявлена ручка с
      умолчанием: гейт называет это «запись политики без предмета». Каталога services/notify на стволе
      kacho нет. До старта S1 пин поднимают минимум трижды и разными полосами: тег с Р23 (DoD 10.1
      п.2а, «до старта S1»), тег с Х5 и Х1 (NTF-4). Объявление ручки садится только в S1. Значит,
      запись не может ехать ни в одном из этих тегов. Приёмка требует «одним изменением» лишь от
      подъёма на тег с записью, а в каком теге запись и кто поднимет пин раньше, не говорит. Полоса
      NTF-1 или NTF-4, поднявшая пин ради своего, окрасит ствол всем.
    condition: >-
      (а) в замысле названа последовательность тегов corelib: запись Windows — в отдельном теге ПОСЛЕ
      тегов с Р23, Х5 и Х1; (б) подъём пина kacho на этот тег, объявление ручки с умолчанием и каталог в
      revocationScanRoots — один коммит одного изменения; (в) задача corelib (Р23) и задачи NTF-1/NTF-4
      несут строку «не поднимать пин kacho на тег с записью notify вне изменения S1 NTF-5».
    held_by: "покраснеет TestRevocationWindowIsDeclaredPolicy, но уже на стволе, после посадки чужого подъёма; порядок тегов держится вниманием — заказ диспетчеру (строка в задачах)"
  - id: CX5-40
    decision: N12
    class: "code-authoring §«Контракт, который нельзя выразить» (граница ручки — второе написание потолка политики); security-hardening.md hard-short-lived-by-decision"
    exposure: >-
      Верх границы ручки — «потолок политики окон отзыва, 10 с» (Р16), и NTF5-54 (д) держит его
      литералом 11s. Гейт окна отзыва сравнивает с потолком (Ceiling, revocation_policy.go:153) только
      умолчание в исходнике (revocationwindow_test.go, «окно превышает потолок»), а не границу стража.
      Потолок, сниженный в corelib, оставит notify-api принимать прежние 10 с, и ни один держатель не
      покраснеет. На том же процессе notify-api окно звена прав — ручка NTF-4
      KACHO_NOTIFY_AUTHZ_CACHE_TTL с границей «1 с … 30 с» (NTF-4 строка 1163): верх втрое выше потолка,
      которого NTF-5 держится. Гейт этого не видит, потому что умолчание 5 с в потолке.
    condition: >-
      (а) верх границы стража KACHO_NOTIFY_LIST_FILTER_CACHE_TTL читается из authz.RevocationPolicy.Ceiling,
      литерала 10s в services/notify нет; (б) проба NTF5-54 (д) берёт значение как Ceiling + 1s, а не
      литерал 11s.
    held_by: "покраснеет NTF5-54 (д) только при нынешнем потолке; смену потолка держит (а), вниманием. Граница ручки NTF-4 — строкой диспетчеру, предмет NTF-4"
  - id: CX5-41
    decision: N14
    class: "gate-authoring §«фикстура не снисходительнее продукта»; code-authoring §«Инвариант и оснастка — это тоже прод-код»"
    exposure: >-
      Окно, взятое сборкой сужателя мимо ручки, гейт не видит по построению (DoD 10.1 п.10), и
      держит его одна NTF5-120. Проба видит сборку продукта только тогда, когда обвязка строит сужатель
      тем же кодом, что main. Обвязка, вызвавшая listnarrow.New сама (ей нужен WithClock), с CacheTTL
      из своей конфигурации, будет зелёной и на продукте, который передаёт ноль, — а ноль сужатель
      превращает в 5 с (narrower.go:215).
    condition: >-
      (а) в notify-api ровно одна функция сборки сужателя, она принимает конфигурацию и часы; её зовут
      и main (часы — time.Now), и обвязка (управляемые часы); (б) вызов listnarrow.New в не-тестовом
      дереве services/notify — один, в этой функции; в тестах — ноль.
    held_by: "покраснеет NTF5-120 (б), если обвязка идёт через (а); (б) — однофайловый кандидат в предикат class-guard, см. блок предложений"

