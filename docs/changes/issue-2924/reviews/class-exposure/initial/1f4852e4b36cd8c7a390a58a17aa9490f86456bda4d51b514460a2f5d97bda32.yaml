decisions:
  D1: "строки доставки этапа — в базе notify, той же формы, что собственная лента notify (NTF-3 Р19), в транзакции этапа; дальше общий конвейер (Р1)"
  D2: "три поверхности: InternalNoticeService на внутреннем слушателе notify-api (REST только *InternalAddr), публичный NoticeService только чтение, контакты формы NTF-3 Р20; справочник зовёт только notify-sender (Р2, Р18, З16)"
  D3: "префикс ntc в hyphenFormPrefixes corelib, чеканка NewHyphenID, неверная форма — INVALID_ARGUMENT первым стейтментом (Р3)"
  D4: "закрытая таблица видов, полей, начальных состояний и категорий; закрытый перечень текстов отказов формы и порядок проверок; закрытый перечень 18 типов ресурса арендатора — константа контракта (Р4)"
  D5: "переходы Start/Complete/Cancel/Update — один оператор записи с условием на состояние в транзакции запроса, Operation сразу done, отказ синхронный без Operation; маска Update; напоминания; SUPERSEDED (Р5)"
  D6: "письмо — моменты UTC и ссылка path сегментами области; свой Message-ID на письмо, корень нити — первое SENT письмо адресату (Р6, Р13)"
  D7: "класс obligation — только у владельца notify, атрибуты timestamp/path, без limits и отписки; вид OPERATOR_NOTICE, ячейка EMAIL = ALWAYS (Р7, Р11, Р12, З1, З13)"
  D8: "адресация: цепочка кандидатов области → Resolve по области → первый ADDRESS; закрытые строки кандидатов по клеткам NTF-3 Р24; уникальность (noticeId, stage, revision, dueAt, subject) и вставка «если нет» (Р8)"
  D9: "Create — длительная операция: заявка и Operation в notify-api, проверка DescribeScope каждой области в notify-sender мимо кэша, окно KACHO_NOTIFY_NOTICE_CREATE_VALIDATION_WINDOW, своя двухстрочная таблица отказов (INVALID_ARGUMENT не терминален); кэш областей без срока (Р10)"
  D10: "allAccounts раскрывается ListAccounts page_size=100 постранично с позицией курсора в базе notify; отказ страницы и отказ DescribeScope раскрытия — приостановка без возврата к первой странице (Р10)"
  D11: "удаления нет; подметальщик по KACHO_NOTIFY_NOTICE_RETENTION от completedAt/cancelledAt (Р14)"
  D12: "лимиты OB: потолок на адрес за скользящие 24 ч и темп потока установки — DEFER, не потеря; подавление только ALL_CLASSES (Р15)"
  D13: "публичное чтение: область запроса, Check(v_get) в use-case при освобождении у края, вложенность проект∈аккаунт на чтении по аккаунту, сужение affectedResources через corelib/listnarrow, NOT_FOUND побайтно как несуществующее (Р16, З18)"
  D14: "пять ручек без умолчаний со стражем старта и границами (Р17)"
  D15: "метрики: счётчики исходов, gauge fanout_pending, overdue, create_pending, unaddressed_total, ob_deferred_total (Р19)"
  D16: "контакты: поля account_legal, operations ресурса аккаунта NTF-3 Р20, ресурс проекта той же формы, одна строка на (область, категория), годность — Check о назначаемом с закрытой картой ответа (Р21, З14)"
  D17: "служба доступа: методы DescribeScope и ListAccounts справочника, ограждение звеном service:notify + reader на notification_recipient_directory:root, тип в перечне без надзора администратора облака (Р10, З15, Д14)"

items:
  - id: CX5-01
    decision: D8
    class: "code-authoring §«Контракт, который нельзя выразить» (один ключ для двух разных фактов); code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      Строкой доставки названы две разные вещи: закрытая строка кандидата (DENIED(audience), NO_ADDRESS,
      NO_ADDRESS(inactive), INVALID — «этот субъект не прошёл по ЭТОЙ области») и строка адресата
      («субъект получит письмо»). Обе ложатся под одну уникальность (noticeId, stage, revision, dueAt,
      subject) со вставкой «если нет» (Р8; DoD 10.2 п.4). Субъект X — контакт двух областей аудитории A1
      и A2, права на A1 у него нет, на A2 есть: если A1 раскрыта первой, закрытая строка X по A1
      занимает ключ, вставка адресата X по A2 становится пустой операцией, и X письма не получает,
      хотя право на A2 у него есть (нарушение Д8 «право получателя = v_get в момент отправки»). Если
      первой раскрыта A2 — письмо уходит. Исход зависит от порядка обхода областей и от того, какая
      реплика первой взяла страницу.
    condition: >-
      (а) закрытая строка кандидата ключуется по (событие этапа, subject, область), строка адресата —
      по (событие этапа, subject); инвариант «одно письмо на субъекта» стоит только на строках
      адресатов; (б) исход «X получил письмо» не зависит от порядка обхода областей; (в) счётчики
      этапа по исходу (DENIED, SENT, …) считают строки своего вида и не смешиваются. Форма
      уникальности — решение приёмки (DoD 10.1 п.3, 10.2 п.4 называют ключ), поэтому пункт возвращён.
    held_by: "нет: ни один сценарий не держит субъекта, закрытого по одной области и адресата по другой; NTF5-65 — субъект с правом на всех трёх. Возвращено в приёмку (RA-1)."
  - id: CX5-02
    decision: D8
    class: "code-authoring §«Решение и его следствие разнесены» (ключ идемпотентности, вычисляемый в момент обработки)"
    exposure: >-
      dueAt у этапов, кроме reminder, — «момент фиксации перехода часами notify». Если раскрытие
      вычисляет его в момент обработки (часы реплики), две реплики, взявшие одно событие, получают
      разные dueAt, и уникальность перестаёт дедуплицировать — два письма.
    condition: >-
      dueAt пишется в запись события этапа той же транзакцией, что фиксирует переход (или назначает
      напоминание), и раскрытие берёт его только из этой записи; ни одно место раскрытия и отправки не
      зовёт часы для ключа строки.
    held_by: "покраснеют NTF5-65 (две реплики, одно письмо), NTF5-107 (две реплики на одном напоминании, ключ с dueAt)"
  - id: CX5-03
    decision: D5
    class: "code-authoring §«Порядок операций внутри кода»; data-integrity.md db-cas"
    exposure: >-
      Текст отказа перехода несёт ФАКТИЧЕСКОЕ состояние («Notice <id> is <STATE>, expected …»), а
      отказ вида — kind. При нуле затронутых строк нужен ответ «почему»; прочтённое ДО записи состояние
      устаревает (NTF5-33: проигравший обязан назвать COMPLETED — состояние победителя). Уровень
      изоляции REPEATABLE READ превращает ожидание блокировки в ошибку сериализации 40001, а не в ноль
      строк.
    condition: >-
      (а) переход — один UPDATE … WHERE id=$1 AND state=$expected AND kind = ANY($allowed) RETURNING;
      состояние до записи не читается; (б) ноль строк → чтение той же транзакцией ПОСЛЕ оператора
      (READ COMMITTED) различает NOT_FOUND, «вид не поддерживает» и «состояние не то» с фактическим
      состоянием; (в) Operation, запись этапа, снятие напоминаний и закрытие неактуальных строк —
      в той же транзакции и только после одной затронутой строки; (г) порядок «вид не поддерживает»
      раньше «состояние не то» — один и тот же для всех пяти глаголов.
    held_by: "покраснеют NTF5-33 (20 повторов, текст проигравшего), NTF5-30, 31, 32, 35, 86"
  - id: CX5-04
    decision: D5
    class: "rule ban10 / data-integrity.md db-check, sqlstate-to-grpc; code-authoring §«Порядок операций внутри кода»"
    exposure: >-
      Update с частичной маской (только endsAt, только startsAt) судит новое значение против
      ХРАНИМОГО второго момента; «правка без изменения ревизию не повышает» — тоже сравнение с
      хранимым. Get → сравнение в Go → UPDATE — check-then-act: параллельный перенос проходит мимо
      проверки. Ограничение базы (ends_at > starts_at) без отображения даёт 23514 общим текстом, а не
      закрытым текстом Р4.
    condition: >-
      (а) согласованность моментов и допустимость полей по виду — CHECK-ограничения таблицы (DoD 10.1
      п.3 их называет); (б) «без изменения» — условие IS DISTINCT FROM в том же UPDATE, ноль строк
      различается повторным чтением (CX5-03 (б)); (в) имя каждого CHECK отображается в единственном
      доме sqlstate на свой текст Р4 («endsAt: must be after startsAt», «startsAt: must be in the
      future» — последнее судится часами до записи); (г) до записи читается только неизменяемое (kind).
    held_by: "покраснеют NTF5-41, 87, 88; вариант «маска только endsAt раньше хранимого startsAt» сценарием не держится — заказ пробы исполнителю"
  - id: CX5-05
    decision: D5
    class: "code-authoring §«Контракт, который нельзя выразить» (открытая таблица «переход → неактуальные этапы»); code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      Р5: письма этапа, не отправленные к моменту, «когда этап стал неактуален (отмена, начало, перенос
      до напоминания)», закрываются SUPERSEDED. Какие этапы делает неактуальными каждый переход — не
      названо: Cancel при неотправленном (отложенном потолком Р15 до 24 ч) scheduled; Update при
      неотправленных scheduled или rescheduled прежней ревизии; Complete при отложенном started. Код
      обязан выбрать, и выбор — наблюдаемое поведение (письмо уходит или нет). Кроме того, строка,
      уже взятая отправителем, и переход, закрывающий строки, гоняются между собой.
    condition: >-
      (а) закрытая таблица «переход × этап строки → SUPERSEDED | остаётся» в одном месте кода,
      совпадающая с приёмкой; (б) транзакция перехода закрывает незахваченные строки одним оператором
      по этой таблице; (в) отправитель захватывает строку CAS pending → in-flight, поэтому SUPERSEDED
      ложится только на незахваченные, а захваченная доходит до своего исхода.
    held_by: "только NTF5-74 (Start → reminder). Таблица и сценарий на Cancel при отложенном scheduled — возвращено в приёмку (RA-2)."
  - id: CX5-06
    decision: D12
    class: "code-authoring §«Умолчание, которое становится утверждением» (срок строки, унаследованный от формата соседа); code-authoring §«Решение и его следствие разнесены»"
    exposure: >-
      NTF-1 Р7 делает ttl обязательным ключом notification.yaml, строка получает expires_at =
      enqueued_at + ttl, уборщик закрывает её EXPIRED. Р15 обещает, что письмо obligation сверх потолка
      «откладывается до освобождения окна, а не отбрасывается», NTF5-83 утверждает «исходов EXPIRED 0».
      Приёмка NTF-5 ttl шаблонов obligation не называет (grep ttl|expires_at по документу — 0
      попаданий): откладывание дольше ttl молча превращается в потерю обязательства.
    condition: >-
      одно из двух, решённое приёмкой: (а) класс obligation срока не имеет (валидатор notify/spec
      запрещает ttl у obligation, уборщик строк obligation не истекает) либо (б) ttl obligation
      ограничен снизу величиной, вычисленной из окна 24 ч и темпа потока, и валидатор эту нижнюю
      границу держит. В коде — одно правило в едином валидаторе, без второго места.
    held_by: "нет; NTF5-82 откладывает меньше суток без названного ttl. Возвращено в приёмку (RA-3)."
  - id: CX5-07
    decision: D12
    class: "rule ban10 (check-then-act через реплики); architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»"
    exposure: >-
      Потолок на адрес «поперёк всех извещений» и темп «всей установки» при ≥2 репликах notify-sender
      (посадка NTF-1): подсчёт отправленных за 24 ч, затем отправка — две реплики видят 9 из 10 и
      обе шлют; ограничитель темпа в памяти процесса даёт N × 600 в минуту.
    condition: >-
      (а) место в окне адреса резервируется в базе атомарно (UPDATE … WHERE count < limit RETURNING
      либо вставка резерва под ограничением) в транзакции захвата строки, до SMTP; (б) темп потока —
      общее ведро в базе notify, а не ограничитель процесса; (в) освобождённый резерв (строка не
      отправлена) возвращается той же транзакцией, что закрывает строку.
    held_by: "покраснеют NTF5-82, 83 — но только если прогоняются при двух репликах; §6 называет две реплики лишь для NTF5-65, 107 — заказ исполнителю"
  - id: CX5-08
    decision: D9
    class: "code-authoring §«Чужой ответ: классификация и бюджет»; code-authoring §«Унификация и стоимость» (чужой классификатор с другой клеткой)"
    exposure: >-
      Для DescribeScope и ListAccounts своя таблица (Р10 шаг 5), отличная от таблицы NTF-3 Р7 ровно
      клеткой INVALID_ARGUMENT (здесь не терминальна). Готовый классификатор NTF-3 рядом — соблазн
      свести; сведение делает клетку терминальной (закрывает Operation до окна, закрывает строку
      acc-150). Второе: проверка заявки идёт сетевыми вызовами; захват заявки удержанием строки под
      FOR UPDATE SKIP LOCKED на время вызовов держит транзакцию открытой на срок сети.
    condition: >-
      (а) две таблицы — две функции с исчерпывающим выбором по коду, без ветки «прочее»; тест на
      каждый из 16 кодов плюс «OK без exists»; (б) захват заявки — аренда (столбец срока), вызовы
      вне транзакции записи; шаг 3 — одна транзакция с CAS по состоянию заявки; (в) окно истечения
      судится от записанного момента приёма в начале каждой попытки; ответ, полученный после
      истечения окна, извещения не создаёт.
    held_by: "покраснеют NTF5-18 (а)–(е), NTF5-67 (а)–(в), NTF5-62 (в) (там клетка NTF-3 терминальна — противоположная сторона)"
  - id: CX5-09
    decision: D9
    class: "code-authoring §«Умолчание, которое становится утверждением» (отсутствие поля неотличимо от false)"
    exposure: >-
      Шаг 5 Р10 относит «OK без поля exists (расхождение версий)» ко второй строке (приостановка,
      misconfigured). В proto3 обычное поле bool отсутствия не выражает: пустой ответ читается как
      exists=false → FAILED_PRECONDITION PEER_RESOURCE_MISSING — терминальный отказ оператору по
      неисправности настройки. Так же ответ exists=true с пустым accountId или ownerUserId попал бы
      в кэш без срока.
    condition: >-
      (а) exists объявлен с признаком присутствия (optional bool либо перечисление с UNSPECIFIED);
      отсутствие → вторая строка шага 5; (б) exists=true с пустым accountId или ownerUserId —
      вторая строка, в кэш не пишется; (в) exists=false с непустыми полями — тоже вторая строка.
