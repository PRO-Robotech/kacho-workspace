    held_by: "покраснеют NTF5-26, 49; assert-ban6-external-isolation.py печатает InternalNoticeService в объёме"
  - id: CX5-28
    decision: D15
    class: "architecture.md §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ» (gauge при нескольких репликах)"
    exposure: >-
      notify_notice_fanout_pending, notify_notice_overdue, notify_notice_create_pending — состояние
      общей базы. Каждая реплика, отдающая его, удваивает сумму; тревоги Р19 порогом «> 0» этого не
      заметят, а «не падает до 0» — ложно при одной отставшей реплике.
    condition: >-
      gauge состояния базы отдаёт один экспортёр (выбранная реплика) либо правило агрегации (max)
      названо в правиле тревоги; счётчики исходов — на процесс.
    held_by: "NTF5-52, 18, 67 снимают /metrics одного процесса — удвоение не видят; держится вниманием, пока замысел не выберет форму"

