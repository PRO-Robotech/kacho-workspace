outcome: вернуть-в-приёмку
return_to_acceptance:
  - item: RA-1
    cx: CX5-01
    anchors: [Р8, "DoD 10.1 п.3", "DoD 10.2 п.4", NTF5-65, NTF5-62]
    what: >-
      уникальность строк: закрытая строка кандидата и строка адресата под одним ключом (noticeId, stage,
      revision, dueAt, subject) — субъект, закрытый по одной области, теряет письмо по другой области, где
      право есть, в зависимости от порядка обхода. Нужны: ключ закрытой строки кандидата с областью; сценарий
      «X — контакт A1 и A2, v_get только на A2» с исходом «одно письмо X по A2, владелец A1 получил своё»,
      не зависящим от порядка областей (два прогона с обратным порядком).
  - item: RA-2
    cx: CX5-05
    anchors: [Р5, NTF5-74]
    what: >-
      закрытая таблица «переход × этап неотправленной строки → SUPERSEDED | остаётся» для Start, Cancel,
      Update, Complete; сценарий хотя бы на Cancel при отложенной (потолком Р15) строке scheduled и на
      Update при неотправленной строке прежней ревизии.
  - item: RA-3
    cx: CX5-06
    anchors: [Р12, Р15, NTF5-82, NTF5-83, "NTF-1 Р7 (ttl)"]
    what: >-
      срок строки obligation: ttl шаблонов класса obligation не назван, а формат NTF-1 делает строку
      истекающей — обещание «откладывают, не теряют» при откладывании дольше ttl не держится. Решить
      (без срока у obligation либо нижняя граница ttl в валидаторе) и дать сценарий откладывания дольше
      ttl шаблона probe-класса с исходом «не EXPIRED».
  - item: RA-4
    cx: CX5-13
    anchors: [Р16, Р21, NTF5-44, NTF5-103]
    what: >-
      буквы отказа права с близнецами для двух <exempt> методов, у которых проверку несёт только use-case:
      NoticeService.Get по проекту без v_get на проект (403, code 7) и
      ProjectNotificationContactsService.Update без v_update на проект (403, code 7, вопроса о годности нет).
  - item: RA-5
    cx: CX5-14
    anchors: [Р16, NTF5-45]
    what: >-
      неизмеренное утверждение о дереве: «corelib/listnarrow, один вызов BatchCheck» для ссылок до 18 типов —
      на corelib @34bc810 публичная поверхность listnarrow берёт один resourceType на вызов. Указать путь:
      новая функция фундамента (тогда пункт DoD 10.1 п.2 и corelib#77) либо вызов на тип (тогда «один
      вызов» снять, NTF5-45 — с оговоркой одного типа); плюс решение о повторной ссылке в affectedResources.
  - item: RA-6
    cx: CX5-23
    anchors: [Р1, Р8, Р10]
    what: >-
      Р1 «строки доставки … в той же транзакции, что фиксирует этап» неисполним для allAccounts и для любой
      аудитории с Resolve до строки адресата; переписать как «запись события этапа в транзакции перехода,
      строки — раскрытием (Р10)».

