# Экспозиция классов — первичный разбор (initial), под-фаза NTF-5 (извещения оператора: ресурс
# «извещение», класс OB, контакты по категориям, адресация по цепочке, методы справочника областей
# в службе доступа), редакция 8.
#
# Разбор ДО кода. Привязан к отпечатку одобренной приёмки, а не к будущему замыслу: после появления
# design.md каждый пункт CX5-* обязан получить точное отображение в решение замысла и отдельную
# пересверку на отпечаток замысла (class-exposure/revalidation/<design-sha256>.yaml). Разрешения
# писать реализацию эта запись не даёт.
#
# Прежних первичных разборов у изменения нет. Номера CX5-01…28 — первичные. Исход — «вернуть в
# приёмку»: шесть пунктов требуют правки документа (новый сценарий либо исправление утверждения о
# дереве), поэтому этот разбор свидетельствует о редакции 8 и после правки приёмки повторяется на
# новый отпечаток.
