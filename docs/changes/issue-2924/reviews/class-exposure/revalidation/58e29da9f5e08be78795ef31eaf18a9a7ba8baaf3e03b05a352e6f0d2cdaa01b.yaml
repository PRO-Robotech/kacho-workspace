#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы на 1f4852e4, 2fe29c35, 88fabd09,
# 03e291ee и 367b9482 и пересверки на a43a19fa, 379efc2a и 108c05d2 свидетельствуют о своих
# редакциях и здесь не переписываются.
# По Д22 судится ДЕЛЬТА редакции 4 против редакции 3 (`git diff 68da8a6be 14e9e87a1 --
# docs/changes/issue-2924/design.md`, 725 строк диффа). Отображения, которые прежние пересверки
# признали выдерживающими и которые дельта не тронула, повторно не судятся.
# Проверено пять вещей:
#   (1) CX5-60…62 пересверки на 108c05d2 отображены, отображение выдерживает условие пункта, и
#       условие к коду CX5-19/58 внесено;
#   (2) новые внешние вызовы, (3) новые асинхронные пути, (4) новые sentinel-значения и механизмы
#       дельты заведены пунктами;
#   (5) маркеров отсрочки и открытых решений нет.
# Условие «нет применимого ревью замысла» здесь не судится: ревью замысла — следующий шаг
# (роль design-reviewer исполняет system-design-reviewer в режиме «замысел»).
# Новые пункты этой пересверки — CX5-63 и CX5-64. У замысла для них строк отображения нет.
