mapping_check:
  # Судятся только строки, изменённые дельтой. Прочие — как в пересверках на a43a19fa, 379efc2a, 108c05d2.
  - id: CX5-19
    design: "З12, З28"
    verdict: holds
    note: >-
      Условие к коду пересверки на 108c05d2 внесено: порядок корня берётся из
      `nextval('notice_sent_seq')` в транзакции записи исхода `SENT`, а не из часов процесса.
  - id: CX5-58
    design: "З12 п.3, З25, §6"
    verdict: holds
    note: >-
      Последовательность `CACHE 1` выдаёт значения в порядке вызовов `nextval` по всем сеансам.
      Вторая строка пары выдаётся только после фиксации исхода первой (голова нити). Поэтому
      `nextval` её записи исхода вызван позже `nextval` первой, и её значение больше. Разрывы
      при откате порядок не нарушают. `UNIQUE (sent_seq)` и `CHECK (> 0)` — на уровне базы. Проба
      N10 при двух репликах с часами, расходящимися на 10 мин, названа.
  - id: CX5-07
    design: "З11 п.1–п.4"
    verdict: holds
    note: >-
      Потолок, резерв с `DO NOTHING` и снятие по `feed_row_id` сохранены. Отличие редакции 4 — у
      `DEFER(ob_stream_pace)` резерв остаётся (строка держит место), и И17 это называет. Цена
      формулы — CX5-62, часы расписания — CX5-63.
  - id: CX5-55
    design: "З28, З12 п.1, З21 п.1, §4, §10"
    verdict: holds
    note: "решение не изменилось; держатель «один оператор» — предмет CX5-61"
  - id: CX5-56
    design: "З21 п.1"
    verdict: holds
    note: "условие (а) уточнено пунктом CX5-60; композиция наблюдателей не менялась"
  - id: CX5-59
    design: "З11 п.3"
    verdict: holds
    note: >-
      `limits.DeferFor` не менялся. Сырое значение темпа теперь — расстояние до своего места, и
      зажим в `[MinDefer, MaxDefer]` применяется к нему. Проба «20 строк — `INVALID_ARGUMENT` 0».
  - id: CX5-60
    design: "З21 п.1, З11 п.2, п.4"
    verdict: holds
    note: >-
      (а) Ветка — по классу строки из `AckedRow`, который `recordOutcome` возвращает тем же
      оператором. Не `obligation` — `nil` без SQL. (б) Окно OB — по `feed_row_id` у каждой строки
      `obligation`, одним утверждением; противоречие редакции 3 снято. (в) `obligation` без
      адресата — счётчик аномалии, WARN без адреса, тревога; запись исхода не откатывается.
      (г) Проба с близнецом названа. Посылка M28 («шаблонов `obligation` вне извещений нет»)
      перемерена по всем пяти соседним приёмкам, а не по одной NTF-3: вхождений `obligation` 1, 0,
      0, 1, 0. Оба ненулевых — ссылки на свойство NTF-5 (NTF-1 строка 1191, NTF-4 строка 766),
      шаблонов класса они не заводят.
  - id: CX5-61
    design: "З28 п.2, п.4, п.6, §3 И24"
    verdict: does-not-hold
    note: >-
      (а) Опознание по дереву разбора, печать объёма, пустой обход — красный, инъекция
      переставленных столбцов — выражены. (б) и (в) не выдерживают. Перечень З28 п.6 закрыт по
      писателям (восемь), но не по их столбцам. Правило сверки «столбцы исхода (`recorded_kind`,
      `outcome_token`) разрешены только строке `recordOutcome`» судит имя столбца, а не
      присваиваемое значение. Оператор уборщика истечения замысла NTF-1 эти столбцы обнуляет
      (`outcome_token = NULL, recorded_kind = NULL, recorded_reason = NULL`, ред. 5 строки
      568–571). Строка перечня для уборщика называет только `SET state = 'expired'`. Итог: гейт в
      заявленной форме красный на законном операторе, и его «молчит на теге правки» невыполним.
      Столбцы `Supersede` замысел не называет вовсе («`UPDATE …`», З8 п.5, строка 426), поэтому
      строку перечня для него сверить не с чем.
      Нужно: (1) у каждой строки перечня — закрытый набор изменяемых столбцов, взятый из оператора
      писателя (для уборщика — `state`, `outcome_reason`, `outcome_token`, `recorded_kind`,
      `recorded_reason`, `secret_attrs`, `outcome_at` — по замыслу NTF-1; для `Supersede` — назвать);
      (2) исключительность `recordOutcome` сформулирована по значению: непустое присваивание
      столбцов исхода — только `recordOutcome`, обнуление законно у писателей, чья строка это
      называет; (3) положительный близнец гейта — дерево с оператором уборщика дословно из замысла
      NTF-1, гейт молчит; отрицательный — тот же оператор с `recorded_kind = $k` вместо `NULL`,
      красный с именем `StartSweeper` и столбца.
    code_conditions: >-
      Выдерживающая часть (а) — с условиями к коду: (i) множество обходимых пакетов выводится из
      дерева — все не-тестовые пакеты модуля corelib, ссылающиеся на объект функции имени таблицы
      `feed`; гейт печатает их, а не читает перечень `notify/feed`, `retention`; (ii) константа, не
      разобравшаяся парсером (заполнитель таблицы — не идентификатор SQL), — находка с именем
      функции, а не пропуск; (iii) `CopyFrom` и `SendBatch` либо судятся тем же правилом, либо
      их отсутствие у получателей пакета утверждается гейтом с числом. (iv) Утверждение «своего
      SQL к таблице ленты у `notify` нет» (З8 п.5, строки 434 и 940) гейт corelib не держит — он
      дерева kacho не видит. Держатель на стороне kacho: константы SQL `services/notify`,
      называющие таблицу собственной ленты, — 0, кроме строки конфигурации, передающей имя в `feed`.
  - id: CX5-62
    design: "З11 п.1, п.3, п.4, З25, §6"
    verdict: holds
    note: >-
      (а) Строка ведра пишется один раз на письмо. Возврат с резервом (шаг 2) ведро не трогает.
      Транзакций слоя на письмо — `1 + ⌈ожидание / MaxDefer⌉`; при NTF5-83 последнее место —
      119,9 с < 15 мин, всего ≤ 2·1200. Проверено на границах M31: места 0; 0,1; …; 119,9 с при часах,
      идущих по минуте, проходят числом 1, 600, 599. (б) Счётчик считает письма отметкой
      `(feed_row_id, reason)` — по определению приёмки (M30). (в) Проба цены с близнецом названа.
      Путь снятия отметок подметальщиком неполон, и это новый механизм, а не невыдерживание (б) —
      CX5-64. Часы расписания — CX5-63.

new_items:
  - id: CX5-63
    source: "З11 п.1 шаг 4–5 и «Темп» (`next_slot = GREATEST(next_slot, $now) + $interval`, проход при `slot_at <= $now`), З25 («моменты расписания … с полной точностью часов `notify`»), З27 п.4 (`$now` — порт часов процесса), §3 И30 («… NTF5-83 при двух репликах»)"
    kind: new_mechanism
    class: "code-authoring §«Решение и его следствие разнесены» (темп производителя и применения — место выдаёт одна реплика по своим часам, проход судит другая по своим)"
    exposure: >-
      Место в расписании выдаётся по часам процесса той реплики, что взяла строку. Проход тоже
      судится по часам реплики, взявшей строку при возврате, а это может быть другая реплика.
      Пусть реплика A опережает реплику B на Δ. Строки A проходят на Δ раньше своих мест по
      реальному времени, строки B — в свои места. В одну реальную минуту попадают места из двух
      разных минут расписания, и темп установки доходит до 2·N в минуту, а при k репликах — до k·N.
      Кроме того, `GREATEST(next_slot, $now)` у реплики, чьи часы убежали вперёд, сдвигает
      `next_slot` для всех, и письма реплик с верными часами ждут до Δ. Это задержка, а не потеря.
      Тот же замысел в той же дельте признал расхождение часов двух реплик опасностью (проба корня
      нити при часах, расходящихся на 10 мин, З12 п.3) и убрал часы процесса из порядка корня. Для
      темпа он утверждает И30 «при двух репликах» без границы на расхождение. Прежнее ведро
      жетонов (ред. ≤ 3) стояло на тех же часах; прежние пересверки этого не называли, и это их
      пропуск.
    condition: >-
      Одно из двух, названное в З11 п.1 и в И30.
      (1) Одни часы на выдачу места и на проход — часы базы `kacho_notify` в транзакции слоя
      лимитов (`clock_timestamp()` в обоих операторах). Порт часов `notify` для пробы NTF5-83 тогда
      управляет временем базы, либо проба меряет темп по часам базы.
      (2) Часы процесса остаются, и граница названа: И30 — «не больше N·(1 + Δ/1 мин) за минуту
      реального времени при расхождении часов реплик Δ». Δ наблюдаем: транзакция слоя лимитов
      читает `now()` базы вместе с `$now` и выставляет `notify_clock_skew_seconds`, тревога — выше
      названного порога. Проба N10: две реплики, у одной часы впереди на 10 мин, 1200 строк —
      при (1) за любую минуту часов базы не больше 600; при (2) — не больше названной границы и
      тревога сработала. Близнец — часы совпадают, ровно NTF5-83.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF5-83 и проба цены гоняются на общих управляемых часах; расхождение часов реплик для темпа не держит ни одна буква — заказ"
  - id: CX5-64
    source: "З11 п.4 («Отметки строки снимаются … транзакциями `Supersede` и `DeleteUnleased`»), З28 п.6 строка `DeleteUnleased` («снимает резервы окна без `SENT` и отметки (З24 п.6)»), З24 п.6 (процедура: только `DELETE FROM notice_ob_address_window …`), §6 (`notice_ob_deferred_letters` — PK без внешнего ключа)"
    kind: new_mechanism
    class: "code-authoring §«Порядок операций внутри кода» (порядок и полнота снятия ресурса); doc-truthfulness «два места об одном предмете, где одно верно»; data-integrity db-fk-same-db (ban #10)"
    exposure: >-
      Новая таблица отметок отсрочки держит строки по `feed_row_id`, а снимает их код, перечисленный
      в трёх местах. Два места (З11 п.4, З28 п.6) говорят, что подметальщик отметки снимает, а
      третье — сама процедура подметальщика З24 п.6 — снимает только резервы окна. Реализация по
      процедуре оставит отметки каждой строки `obligation`, отложенной и удалённой подметальщиком
      до исхода. Уборки у этой таблицы нет (З11 п.5 чистит только окно). Таблица растёт без
      границы, и ни одна проба это не видит. Счётчик `notify_ob_deferred_total` не искажается:
      идентификаторы строк ленты не переиспользуются.
    condition: >-
      (а) Снятие отметок — ограничением базы, а не перечнем в коде. Собственная лента `notify`
      лежит в `kacho_notify`, поэтому
      `notice_ob_deferred_letters.feed_row_id REFERENCES <таблица ленты>(id) ON DELETE CASCADE`
      снимает отметки при любом удалении строки ленты: подметальщиком, уборкой закрытых строк,
      будущим писателем. Для окна OB внешний ключ неприменим: записи `SENT` переживают строку
      ленты (З24 п.6, 24 ч), и это названо. (б) Если внешнего ключа нет, З24 п.6 называет
      `DELETE FROM notice_ob_deferred_letters WHERE feed_row_id = ANY($deleted)` в той же
      транзакции, и три места говорят одно. (в) Проба C5/N10: строка `obligation` с отметкой
      темпа удалена `DeleteUnleased` — отметок строки 0. Близнец — строка, получившая `SENT`:
      отметок 0, запись окна осталась.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "ни одна буква не утверждает отсутствие отметок после удаления строки подметальщиком — заказ"

