approval_conditions:
  # Пять условий: SDD-1 §5, CLASS-05, 08, 09, 10, DESIGN-02. Исход каждого — на отпечатке 58e29da9.
  # Шестое условие DESIGN_APPROVED — применимое ревью замысла — предмет следующего шага, здесь не судится.
  - condition: "каждый пункт первичного разбора отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: red
    detail: >-
      Строк отображения 63, уникальных пунктов 62 из 62. Из пунктов, отображение которых изменила
      дельта (CX5-07, 19, 55, 56, 58, 59, 60, 61, 62), не выдерживает один — CX5-61. Правило гейта
      З28 п.4 «столбцы исхода (`recorded_kind`, `outcome_token`) разрешены только строке
      `recordOutcome`» и строка перечня З28 п.6 для уборщика истечения («`UPDATE … SET state =
      'expired'`») расходятся с оператором уборщика в замысле NTF-1. Этот оператор ставит
      `outcome_token = NULL, recorded_kind = NULL, recorded_reason = NULL, secret_attrs = NULL`
      (ред. 5, строки 568–571; ред. 4, строки 532–535). Гейт в заявленной форме красный на
      законном дереве: его близнец «на теге правки молчит» невыполним. Либо исполнитель ослабит
      правило, и ослабление никто не назовёт. Подробно — mapping_check. CX5-60 и CX5-62 выдерживают.
      CX5-61 выдерживает с условием к коду (см. mapping_check). Новые пункты CX5-63 и CX5-64 этим
      условием не судятся: они в `unmapped`.
  - condition: "новый внешний вызов заведён пунктом и отображён (CG_CLASS_NEW_EXTERNAL_CALL)"
    result: green
    detail: >-
      Новых сетевых вызовов 0. `pg_query_go` — тестовая зависимость гейта corelib, разбор в
      процессе. Сборка у неё через cgo, и конвейер corelib cgo уже требует: `go test ./... -race`,
      ci.yml строка 170. `nextval('notice_sent_seq')`, `RETURNING … class, template`, вызов
      `recordOutcome` из `finishClaim` — операторы к той же базе либо вызовы в процессе.
  - condition: "новый асинхронный путь заведён пунктом и отображён (CG_CLASS_NEW_ASYNC_PATH)"
    result: green
    detail: >-
      Новых асинхронных путей 0. Закрытие после расшифровки идёт через `recordOutcome` и остаётся
      на том же пути после коммита взятия (замысел NTF-1 З8). Возврат строки к своему месту в
      расписании — тот же `DEFER` → повторное взятие ленты, а не новый путь.
  - condition: "новое sentinel-значение или механизм заведены пунктом и отображены (CG_CLASS_NEW_SENTINEL)"
    result: red
    detail: >-
      Выдерживают: `sent_seq NULL` («не отправлено»), класс строки в `feed.AckedRow`, счётчик
      `notify_notice_observer_orphan_total`, признак `slot_at <= $now`. Не заведены пунктами два
      новых механизма дельты:
      CX5-63 — расписание мест темпа (`next_slot = GREATEST(next_slot, $now) + $interval`, проход
