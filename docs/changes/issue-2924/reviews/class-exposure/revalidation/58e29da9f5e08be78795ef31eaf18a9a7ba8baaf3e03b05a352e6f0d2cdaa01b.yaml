      (1) З28 п.4, п.6 — у каждой строки перечня закрытый набор изменяемых столбцов из оператора
      писателя: уборщик истечения — по замыслу NTF-1 (строки 568–571 ред. 5), `Supersede` —
      назвать. Правило исключительности `recordOutcome` — по присваиваемому значению (непустое),
      обнуление законно у названных строк. Близнец гейта — оператор уборщика дословно (CX5-61);
      условия к коду (i)–(iv) CX5-61 — в текст гейта и строку §4;
      (2) З11 п.1, И30 — источник часов расписания темпа: часы базы на выдаче места и на проходе
      либо названная граница N·(1 + Δ/1 мин) с наблюдаемым Δ и тревогой (CX5-63);
      (3) З24 п.6 и §6 — снятие `notice_ob_deferred_letters` внешним ключом `ON DELETE CASCADE` на
      строку ленты либо оператором в процедуре подметальщика; три места говорят одно (CX5-64);
      (4) §11 — строки отображения CX5-63, CX5-64 и переписанная строка CX5-61;
      (5) §0 и M27 — предикат читает поле `verdict` записи, а не её существование; строка NTF-1 —
      на редакцию, лежащую в дереве на коммите (0be18f04 или новее), M18, M26, M29 — с её номерами
      строк; строки NTF-3 и NTF-4 — на текущие отпечатки.
    basis: "SDD-1 §5 (точное отображение; новый механизм — новый пункт); change-graph.md §4; measurement-discipline §«Предикат — только с контролем»"
