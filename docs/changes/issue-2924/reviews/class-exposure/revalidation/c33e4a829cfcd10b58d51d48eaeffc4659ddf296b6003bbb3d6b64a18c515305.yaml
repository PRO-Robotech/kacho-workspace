mapping_check:
  - id: CX5-67
    design: "З11 п.1 шаг 4 (строки 686–705), З11 п.3 п.8, §3 И34, §6, §7, §11 CX5-67; tasks.md N10"
    verdict: holds
    note: >-
      Выбран вариант (а) пересверки 24e6168b: на нуле строк оператора шага 4 та же транзакция
      в месте вызова шага 4 читает строку ведра. Три случая разведены. «Горизонт занят»
      производится только при существующей строке с нарушенным условием. Отсутствие строки —
      `ErrStreamBucketMissing`, откат, исхода нет, `DEFER` нет. Ноль шага 2 и ноль шага 4
      классифицируются каждый в своём месте, общей ветки по `pgx.ErrNoRows` нет. Третий случай
      (`ErrStreamBucketInconsistent`) по построению недостижим, проверено: изоляция `READ
      COMMITTED` (строка 684). `UPDATE` оценивает условие на последней зафиксированной версии
      после ожидания блокировки. Следующий `SELECT` берёт новый снимок, который видит эту
      версию или более позднюю. `next_slot` не убывает, а `GREATEST(next_slot, $t) − $t`
      монотонна по `next_slot`. Значит, чтение, где условие выполнено, после нуля строк
      невозможно, и ветка остаётся защитой, а не штатным путём. Отказ от варианта (б) обоснован
      верно: `CHECK (id = 1)` отсутствия строки не запрещает. Проба п.8 снимает ровно один факт
      (строка ведра удалена). Есть близнец «строка есть, `next_slot = $t + H + 1 с`» и
      инъекция «ноль без чтения» — красная на первой расстановке. Бесконечного круга
      «взятие → ошибка → истечение аренды» с переводом строки в конечный статус нет: у NTF-1
      нет счёта взятий (`grep attempt_count|MaxAttempts|взятий` по issue-2915/design.md → 0),
      и строки `obligation` ждут восстановления строки ведра, а не пропадают.
    code_conditions: >-
      (1) Отказ «строки ведра нет» виден не только журналом. Замысел говорит, что он «снаружи
      отличим от перегрузки», потому что `notify_ob_deferred_total` не растёт. Это отличимость
      по отсутствию сигнала. При пустом потоке `obligation` она неотличима от тишины, а
      журнал `ERROR` на каждое взятие каждой строки — не счётчик
      (`security-hardening.md` hard-soft-pass-counted, hard-zero-refusals-visible). В коде
      ошибка слоя считается читаемой величиной. Если перечень метрик закрыт приёмкой, годится
      существующий счётчик ошибок слоя либо путь Р19 — выбирает автор кода, но проба п.8
      утверждает рост величины на 1 за взятие, а не только строку журнала. (2) Вызывающий слой
      в `notify-sender` не приводит ошибку слоя к исходу. Классификатор ошибок строки
      (Р10 шаг 5) не отображает `ErrStreamBucketMissing`/`ErrStreamBucketInconsistent` ни в
      `DEFER`, ни в повтор с `Ack`. Проба п.8 это держит утверждением «исхода нет»: `Ack` не
      отправлен, запись исхода не менялась.
  - id: Н1
    design: "§8 «Сроки вызовов kaname» (строки 1833–1845), §9 (1878), §11 Н1, §13 Е9 и заказ автору NTF-1; tasks.md N3, N9"
    verdict: holds
    note: >-
      Перечень §8 сужен до вызовов этой под-фазы (`DescribeScope`, `ListAccounts`, `Resolve`).
      `ResolveSend` отнесён к конвейеру NTF-1. Второго места срока здесь не заводится: у одного
      вызова было бы два места срока, и одно из них в коде, которым под-фаза не владеет. Посылка
      пересверки 24e6168b «срока у NTF-1 нет» ОПРОВЕРГНУТА перемером. NTF-1 ред. 10 на
      d0573311b, строки 1111 и 1119–1120: крайний момент строки `min(t_send + lease_remaining −
      ackMargin, t_start + resolveSendTimeout + smtpSessionTimeout)`, и «`ResolveSend`, резерв
      сетки и SMTP-сессия до ответа на `DATA` идут под контекстом с этим сроком (CX1-27)».
      Ручка `notify.resolveSendTimeout` `[100ms..30s]` — строка 1800. Прежний поиск искал срок
      в одной строке с именем вызова и срока не увидел, хотя тот стоит строкой ниже; число 0
      было верным для предиката, но не для утверждения. Держателя «заглушка молчит на
      `ResolveSend`» у NTF-1 нет: поиск по tasks.md NTF-1 даёт одну строку N3, где `ResolveSend`
      и `DEADLINE_EXCEEDED` встречаются вместе, но `DEADLINE_EXCEEDED` там про контекст `Ack`.
      Это зависимость Е9 с внешним предикатом снятия. Предикат клиента ищет обе формы
      (`context.With(Timeout|Deadline)`) и в §8, и в N9.
    code_conditions: >-
      Предикат снятия Е9 — `grep -nE 'ResolveSend' tasks.md | grep -cE 'DeadlineExceeded' ≥ 1`
      по строке NTF-1. Сегодня он даёт 0 и умеет сказать «нет». Но он судит совпадение двух
      слов в одной строке таблицы, а строка N3 уже несёт `ResolveSend` и код срока в другом
      смысле (контекст `Ack`). Правка N3, написавшая про `Ack` `DeadlineExceeded` вместо
      `DEADLINE_EXCEEDED`, закроет Е9 без пробы. Тот же класс, что опроверг посылку 24e6168b,
      только в обратную сторону. Снимающий Е9 судит по имени пробы (имя теста или кейса, например
      `…ResolveSend…Deadline…` в дереве `services/notify/internal/deliver`) и по её зелёному
      исходу на `origin/main`, а не по совпадению в строке полосы.
  - id: "К1 — условия к коду (1)–(3) пересверки 24e6168b"
    design: "З11 п.3 пп. 6–7; §11 К1; tasks.md N10"
    verdict: holds
    note: >-
      (1) Предикат писателя судит оператор записи. Имя таблицы допускается только литералом в
      текстах операторов слоя, константа с именем — находка. Разбор `pg_query_go`, операторов
      `UPDATE`/`INSERT`/`DELETE` строки ведра ровно один. Пробы предпосылки «второй `UPDATE`» и
      «запись через константу в другом пакете» красные, близнец «чтение шага 4» молчит. Чтение
      строки ведра, которое добавил CX5-67, предикат видит как читателя, а не как писателя, и
      близнец это утверждает. (2) Числа пробы горизонта вычисляются из `feed.MaxDefer` и
      `$interval`. (3) Масштабный прогон печатает число транзакций слоя и утверждает И29 суммой
      по строкам; оценка `n²/(2·N·H)` названа выводом, а не замером.
    code_conditions: "—"
  - id: "прочие отображения CX5-01…66, Н2, Н3"
    design: "§11"
    verdict: holds
    note: "Word-diff §11 затрагивает только строки CX5-67, К1, Н1 и итог; прежние пробы в N3, N9, N10 не сняты, условия дописаны."
    code_conditions: "—"

