# Экспозиция классов — пересверка (revalidation) замысла NTF-5 (извещения оператора), редакция 11.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и прежние пересверки (a43a19fa, 379efc2a,
# 108c05d2, 58e29da9, 5c62808f, 112ccca0, a383ddbd, 1004e1c8, f32e0fe2, 24e6168b) относятся к своим
# редакциям и здесь не переписываются.
# Редакция 11 — заход отображения по Д26 на пересверку 24e6168b: новых механизмов нет. Судятся
# строки, которые пересверка 24e6168b оставила неотображёнными (CX5-67, Н1 в части `ResolveSend`),
# условия к коду К1 (1)–(3) и вся дельта ред. 10 → 11: `git diff c50b57773 db8a3fa2f --
# docs/changes/issue-2924/`, 3 файла, 130 вставок и 36 удалений. Проверено:
#   (1) CX5-67 отображён, и отображение выдерживает условие пункта;
#   (2) Н1: сужение перечня и зависимость Е9 выдерживают; посылка «срока у NTF-1 нет» перемерена;
#   (3) условия к коду К1 (1)–(3) внесены в замысел и в полосу N10;
#   (4) новые значения-метки редакции 11 (`ErrStreamBucketMissing`, `ErrStreamBucketInconsistent`)
#       заведены внутри отображения CX5-67 и И34 и держатся пробой;
#   (5) маркеров отсрочки и открытых решений нет.
