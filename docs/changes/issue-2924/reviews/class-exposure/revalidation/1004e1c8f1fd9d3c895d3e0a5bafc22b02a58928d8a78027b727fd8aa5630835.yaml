# Экспозиция классов — пересверка (revalidation) замысла NTF-5 (извещения оператора), редакция 8.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и прежние пересверки (a43a19fa, 379efc2a,
# 108c05d2, 58e29da9, 5c62808f, 112ccca0, a383ddbd) относятся к своим редакциям и здесь не
# переписываются.
# Редакция 8 — заход отображения по Д26 на ревью замысла a383ddbd (design-reviewer, возврат: К1,
# Н1–Н3, М1–М3). Поэтому судятся только строки отображения и дельта редакции 8 против редакции 7
# (`git diff f444718cf b6f6361f1 -- docs/changes/issue-2924/`, 259 строк диффа: design.md, tasks.md,
# change.yaml). Проверено:
#   (1) каждая отображённая находка получила строку §11 и строку полосы tasks.md, и отображение
#       выдерживает пункт;
#   (2) дельта не вводит новых механизмов, решений, сторожей, асинхронных путей и внешних вызовов;
#   (3) маркеров отсрочки и открытых решений нет;
#   (4) дельта не сдвигает прежних отображений моего перечня.
# Условие «есть применимое ревью замысла» здесь не судится: это следующий шаг.
