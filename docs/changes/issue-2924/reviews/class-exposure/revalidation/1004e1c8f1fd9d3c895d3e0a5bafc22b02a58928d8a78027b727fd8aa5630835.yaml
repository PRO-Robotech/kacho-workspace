return_to_acceptance_note: >-
  Пусто. И30 (темп) и Р15 (потолок) приёмки держатся и сейчас. Верхнюю границу задержки письма
  `obligation` приёмка не утверждает, поэтому решение о механизме — вопрос замысла. Если диспетчер
  захочет сделать такую границу наблюдаемым обещанием, это уже правка приёмки, а не замысла.

questions_to_dispatcher:
  - >-
    CX5-62 / К1: какой механизм ограничивает потерю места в расписании темпа OB у строки, закрытой
    мимо отправки? Ревью предлагает горизонт выдачи мест `H = feed.MaxDefer` с ценой «строки без
    места соревнуются с новыми». Возможен и возврат мест (сдвиг `next_slot` назад при закрытии), но
    он требует упорядоченного освобождения. Решение вводит механизм, значит следующая редакция —
    уже не заход отображения по Д26, и пересверка на неё судит механизм целиком, а не строки.

