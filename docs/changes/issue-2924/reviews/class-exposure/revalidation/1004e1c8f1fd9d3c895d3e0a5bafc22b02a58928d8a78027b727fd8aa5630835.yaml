  - condition: "нет открытых решений (CG_DESIGN_DECISION_OPEN, часть 2)"
    result: red
    detail: >-
      §13, строка 1829: «Открытое решение одно — К1 ревью замысла на a383ddbd … до него замысел к
      коду не готов». tasks.md N10: «К1 открыт — полоса не стартует до решения диспетчера». Автор
      сам объявил открытое решение, а не прикрыл его ценой. Это честно, но условие красное.
  - condition: "каждый пункт отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: red
    detail: >-
      Строк CX5 в §11 — 67, уникальных пунктов — 66 (предикат §11 «→ 66» верен). CX5-62 больше не
      выдерживает: строка §11 CX5-62 по-прежнему говорит «место закрытой мимо отправки строки
      теряется (темп ниже, не выше)», то есть называет цену принятой. А З11 п.1 редакции 8 говорит,
      что эта потеря сверху не ограничена, и §13 выносит её в открытое решение. Строка отображения
      и текст замысла теперь расходятся. Главное, по существу: цена «темп ниже, не выше» описывает
      только пропускную способность. Задержку, которую получает следующее письмо `obligation`
      (в том числе `OUTAGE` и `SECURITY_INCIDENT`), она не ограничивает. Это недосмотр моей
      пересверки на 108c05d2, которая приняла CX5-62 с этой ценой. Находка К1 ревью — то же
      свойство, найденное с другой стороны. Прочие отображения дельты (Н1, Н2, Н3, М1, М2, М3)
      выдерживают, у Н1 и Н3 есть условия к коду (mapping_check).
  - condition: "новый внешний вызов, асинхронный путь, sentinel-значение или механизм заведены пунктом и отображены"
    result: green
    detail: >-
      Новых сетевых вызовов 0, новых асинхронных путей 0, новых sentinel-значений 0. Срок вызова
      через `context.WithTimeout` — это константа кода, а не ручка. Отказ по сроку (`DEADLINE_EXCEEDED`)
      уже входит в строку «не ответила» классификатора З3 п.7 (Р10 шаг 5, строка 1056 приёмки),
      так что новой классификации чужого отказа нет. `$class` замка — константа, а не значение-метка.
      `corelib db.NewPool` — существующий конструктор, его пределы замысел только называет. Н2 и
      М3 — цены без механизма.

clean: false

mapping_check:
  - id: CX5-62
    design: "§11 строка CX5-62; З11 п.1 абзац «Место строки, закрытой мимо отправки»; §13"
    verdict: does_not_hold
    note: >-
      Отображение держалось на цене «место теряется, темп ниже, не выше». Редакция 8 сама измерила
      величину потери (100 000 строк `allAccounts` при 600 в минуту — около 166 минут вперёд) и
      назвала её неограниченной. Цена, которая не ограничивает задержку письма класса
      `obligation`, — это не противоядие к классу §«Решение и его следствие разнесены» (место
      выдаётся решением, а закрытие строки — следствие, которое место не возвращает). Строка §11
      устарела и расходится с З11 п.1 и §13. По Д26 механизм в этом заходе вводить нельзя, поэтому
      пункт закрыть может только решение диспетчера либо владельца. Выбор механизма — не моя
      работа. Ниже — условия к коду, которые должны быть верны при ЛЮБОМ выбранном механизме.
    code_conditions: >-
      (1) Граница ожидания места для строки `obligation`, которая приходит после закрытия N строк
      мимо отправки, выражена одной именованной константой либо выражением от ручек. Это число, а не
      слово «ограничено», и оно записано в строке §11 CX5-62 вместо фразы «темп ниже, не выше».
      (2) Проба N10 на часах `DBClock`: 100 000 строк занимают места при 600 в минуту, `Cancel`
      закрывает их мимо отправки, затем приходит новая строка `obligation` — её `defer_for`
      (или момент прохода) не больше границы (1). Близнец: те же строки, но не закрытые, — новая
      строка честно ждёт за ними (это темп, И30). Проба предпосылки: без механизма та же
      расстановка даёт ожидание больше границы — красный. (3) И30 (не больше `$per_minute` за любую
      минуту часов базы) проба с 1200 строками продолжает держать и при механизме.
  - id: Н1
    design: "§8 «Сроки вызовов kaname»; §11; tasks.md N3, N9"
    verdict: holds
    note: >-
      Сроки названы, вывод аренды из них требуется, проба «заглушка молчит — `DeadlineExceeded` в
      пределах срока» с близнецом есть. `DEADLINE_EXCEEDED` классификатор относит к строке «не
      ответила», то есть к повтору (Р10 шаг 5), а не к неисправности настройки. Так что срок не
      превращает медленного соседа в «misconfigured». Но в формулировке есть две щели, и
      закрываются они условиями к коду, без механизма.
    code_conditions: >-
      (1) **Кратность вызовов в попытке.** «Сумма сроков вызовов одной попытки» не вычисляется
      без числа вызовов: `DescribeScope` идёт на КАЖДУЮ область заявки (З3 п.3), а областей до 100
      (приёмка, строки 995–996: «at most 100 items»). Комментарий константы аренды заявки выписывает
      вывод с этой кратностью и с формой вызовов (последовательно — `100 × срок`; параллельно —
      назвать предел параллельности). Модульная проба: 100 областей, заглушка молчит на каждой —
      попытка кончается раньше аренды; близнец — одна область. (2) **«Срок транзакции страницы»
      не назван.** Такой константы в замысле нет. Транзакция страницы раскрытия и транзакция
      фиксации идут под `context.WithTimeout` с именованной константой, и эта константа входит в
      сумму. Опора на `statement_timeout` пула (30 с на оператор, не на транзакцию) суммы не даёт.
      (3) «Одна константа на клиента» против «константы пакета `admit` либо `fanout`»: клиент
      `kaname_client.go` один, а пакетов два. Срок ставится на одном уровне, и строка N3 называет,
      на каком. Если в клиенте — одна константа на все четыре метода. Если у вызывающих — по
      константе на пакет, и в клиенте `WithTimeout` нет.
  - id: Н2
    design: "З11 п.2 «Одно исключение — цена, а не механизм»; §11; tasks.md N10"
    verdict: holds
    note: >-
      Цена названа, проба с управляемым порядком событий и близнецом есть. Уточнение без правки:
      потолок считает только `reserved_at > $t − 24h` (З11 п.1 шаг 3), поэтому резерв закрытой
      строки строже нужного лишь 24 часа, а не до удаления извещения. Живёт он дольше, но в потолок
      после суток не входит. Место в расписании в этом случае тоже потеряно — это CX5-62/К1, а не
      новая цена.
    code_conditions: "—"
  - id: Н3
    design: "§8 «Серверные пределы транзакций kacho_notify»; §11; tasks.md N10"
    verdict: holds
    note: >-
      Замер подтверждает: corelib db/pool.go:49–50 и на v1.8.0 (пин kacho, go.mod:119), и на
      34bc8104a ставит `statement_timeout` = 30000 и `idle_in_transaction_session_timeout` = 60000.
      `25P03` — код разрыва сессии по `idle_in_transaction_session_timeout`. Предел 60 с верен для
      держателя, который молчит в транзакции. Держателя, занятого оператором, ограничивает
      `statement_timeout` (30 с).
    code_conditions: >-
      (1) Условие «пул строится `corelib db.NewPool`» держится предикатом, а не вниманием:
      `git grep -nE 'pgxpool\.(New|NewWithConfig)\(' -- 'services/notify/*.go' ':!*_test.go' | wc -l`
      → 0, `git grep -n 'NewPool(' …` → 2 (по одному на корень), с числом осмотренных файлов.
      Сегодня `services/notify` в kacho @1d42a6728bf нет, поэтому предикат до N10 выдаёт 0 и 0, и
      это не «зелёное». (2) Близнец-инъекция «пул без `idle_in_transaction_session_timeout`»
      ждёт под собственным сроком пробы (больше 60 с) и печатает «транзакция слоя не прошла за
      <срок>». Без своего срока близнец не краснеет, а повисает.
  - id: М1
    design: "З11 п.1 шаг 1, п.5; §11; tasks.md N7, N10"
    verdict: holds
    note: >-
      Замер утверждения «других рекомендательных замков этой формы с тем же классом в
      `kacho_notify` нет»: из замыслов, где упомянута база `kacho_notify` (issue-2915, 2919, 2924),
      `pg_advisory` есть только в issue-2919 (одна форма `pg_advisory_lock(hashtext('kacho_notify.migrate'))`
      с одним аргументом) и в issue-2924. У формы с одним `bigint` и формы с двумя `int4`
      пространства ключей в PostgreSQL не пересекаются. Утверждение верно на ревизии замера.
    code_conditions: "—"
  - id: М2
    design: "§9; §11; tasks.md W1"
    verdict: holds
    note: "Ребро не новое (`.claude/rules/polyrepo.md:61`), меняется перечень, исполнитель — tooling-maintainer."
    code_conditions: "—"
  - id: М3
    design: "З3 п.4; §11; tasks.md N3"
    verdict: holds
    note: >-
      Цена названа. Однако фраза «страдает только живость» верна лишь в одну сторону. Если часы
      `notify-sender` отстают от часов `notify-api`, окно удлиняется на это расхождение, и
      извещение может быть создано позже заданного окна. Это ослабление границы окна (CX5-08 (в)),
      а не потеря живости. Величина ограничена расхождением часов, механизма не нужно.
    code_conditions: >-
      Комментарий у проверки окна (N3) называет обе стороны: часы отправителя впереди — окно
      короче, раньше наступает терминальный `UNAVAILABLE`; позади — окно длиннее на расхождение.
      Строку §11 М3 править не нужно, если комментарий кода говорит это.

