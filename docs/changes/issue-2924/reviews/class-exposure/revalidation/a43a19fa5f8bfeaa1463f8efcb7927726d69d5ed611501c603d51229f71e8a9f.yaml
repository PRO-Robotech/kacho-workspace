return_to_acceptance: []
return_to_acceptance_note: >-
  Пусто по Д22. Р14 утверждает наблюдаемое поведение («удаляет … вместе со строками доставки»),
  и замысел обязан его исполнить. Путь исполнить его внутри приёмки есть: подметальщик закрывает
  незабранные строки функцией ленты и ждёт только строку под действующей арендой — не дольше
  feed.LeaseTTL. Если автор замысла всё же оставит «не удаляет при незакрытой строке», это новый
  наблюдаемый исход против Р14, и тогда пункт уходит в приёмку.

orders:
  - to: design author (NTF-5)
    what: >-
      Редакция 2 замысла:
      (1) §0 — снять довод «Д21 не касается» и дать таблицу «шаблон × атрибут × откуда значение
      × законен ли нуль» по CX5-49;
      (2) З8 п.5, З12 п.1 и З3 п.2 — одна формула «аренда действует» для ленты и трёх аренд
      notify (CX5-05, CX5-50, CX5-52);
      (3) З11 — резерв окна идемпотентен по feed_row_id и снимается любым исходом, кроме SENT;
      названа транзакция, в которой он ставится (CX5-07);
      (4) З24 — исполнение Р14 без SQL notify к таблице ленты: id строк ленты собираются до
      каскада той же транзакцией, в предикат входят открытые события и отложенные кандидаты
      (CX5-24);
      (5) З9 и §6 — признак «раскрытие завершено» и начальная позиция (CX5-51);
      (6) З2 п.5 — IsAnonymous вместо равенства с Principal{} (CX5-53);
      (7) З21 — наблюдатель только на изменившем строку Ack, порядок обновления счётчиков
      (CX5-54);
      (8) §4 — строки «Claim: исключение по thread_key» и «Ack: порт OutcomeObserver» в corelib
      notify/feed;
      (9) §11 — строки отображения CX5-49…54.
    basis: "SDD-1 §5 (точное отображение; новый sentinel или механизм — новый пункт); change-graph.md §4"
  - to: corelib implementer (NTF-5 S1, S2)
