new_items:
  - id: CX5-49
    source: >-
      §0 замысла: «Д19 и Д21 предмета NTF-5 не касаются: … атрибутов с законным нулём у шаблонов
      obligation нет (Р12: только timestamp и path, оба обязательны по NTF-1 Р7)»
    kind: sentinel
    class: "code-authoring §«Умолчание, которое становится утверждением» (нулевое время незаданного endsAt)"
    exposure: >-
      Довод опровергнут замером. Р12 ограничивает ТИПЫ атрибутов, а не их число и не их
      обязательность. NTF5-57 требует у каждого из 19 шаблонов атрибуты startsAt, endsAt
      (timestamp) и link (path). У endsAt нуль законен: OUTAGE без endsAt (NTF5-02),
      MAINTENANCE без endsAt (NTF5-08), а у DECOMMISSION endsAt запрещён вовсе (NTF5-07,
      «endsAt: not allowed for kind DECOMMISSION»). NTF-1 Р7 на 29cfa368 требует ключ presence
      required|optional у каждого атрибута без умолчания. Нулевое значение required — «не
      значение», и Put отказывает (NTF1-B28, G26). Если endsAt объявлен required, либо
      раскрытие передаёт time.Time{} полем required, транзакция страницы раскрытия
      откатывается на каждом извещении без endsAt. Раскрытие стоит, писем 0, и это на всех
      DECOMMISSION.
    condition: >-
      (а) В замысле есть таблица «шаблон × атрибут × откуда значение × законен ли нуль» на 19
      шаблонов и три атрибута (по Д21). (б) endsAt объявлен presence: optional во всех
      шаблонах, где вид допускает отсутствие. Блоки, ссылающиеся на endsAt, несут when: endsAt,
      а тема на endsAt не ссылается. (в) Значение берётся из notices.ends_at: NULL означает
      нулевое значение optional-поля сгенерированного XAttrs, и ключ в строку не пишется.
      startsAt и link — required. (г) На каждую пару «шаблон × локаль» есть эталон .eml, в том
      числе для случая без endsAt.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "покраснеют NTF5-73 и NTF5-107 (письма DECOMMISSION, endsAt всегда пуст) и NTF5-57 (сборка: валидатор NTF-1 требует presence); эталона .eml для пары «шаблон × локаль без endsAt» в перечне проб нет — заказ"
  - id: CX5-50
    source: >-
      З3 п.2 (WHERE lease_until < now(), lease_owner = $me); З8 п.2, п.3 и З9 п.2 (аренда строки
      кандидата и события); §6 (у lease_owner и lease_until нет NOT NULL и начального значения)
    kind: sentinel
    class: "code-authoring §«Умолчание, которое становится утверждением» (отсутствие аренды как значение столбца); code-authoring §«Решение и его следствие разнесены» (два предиката одного состояния)"
    exposure: >-
      Строка заявки вставляется в notify-api без аренды. Если lease_until там NULL, предикат
      взятия «lease_until < now()» даёт NULL, и заявку не возьмёт никто. Create висит в
      done=false и после окна: терминальный отказ шагов 4 и 5 исполняет только взявший заявку. В том же замысле feed.Supersede трактует NULL как «не в работе» (З8 п.5).
      Отсутствие аренды получает две противоположные записи. «$me» не определён. Если это
      имя пода или константа, CAS «lease_owner = $me» не различает прежнее и новое воплощение
      процесса и не различает реплики с одинаковой константой. Часы аренды — now() базы, а
      окно проверки судится часами notify (З3 п.4). Пробы с управляемыми часами (NTF5-18)
      истечения аренды упавшей реплики не увидят.
    condition: >-
      (а) Во всех трёх арендах notify (заявка, событие этапа, строка кандидата) одно написание
      «не в работе». Либо lease_until NOT NULL и при вставке равно моменту вставки, либо
      предикат взятия «lease_until IS NULL OR lease_until < $now». Выбор один на три таблицы и
      назван в §6. (б) $me — уникальный на процесс идентификатор, созданный при старте, а не
      имя пода и не константа. (в) Часы аренды названы: либо now() базы во всех трёх арендах,
      либо часы notify, переданные параметром. Проба «упавшая реплика держит аренду — другая
      берёт после срока» исполнима теми же часами, что NTF5-18.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF5-18 (а) покраснеет на NULL-варианте (заявка не берётся); истечение аренды упавшей реплики сценарием не держится — заказ пробы"
  - id: CX5-51
    source: >-
      З9 п.1, п.4 («позиция — индекс последней завершённой области»; «Окончание — страница с
      пустым next_page_token; позиция для следующей страницы не хранится»); §6 (позиция
      scope_pos либо page_token); З6 п.3 и З21 (fanout_pending)
    kind: sentinel
    class: "code-authoring §«Умолчание, которое становится утверждением» (одно значение позиции для «не начато» и «закончено»)"
    exposure: >-
      Пустой page_token — это и начальная позиция allAccounts, и то, что остаётся после
      последней страницы. Отдельного признака «раскрытие завершено» у события нет, а closed_at
      означает «закрыто переходом» (З6 п.2). Завершённое событие остаётся открытым: следующий
      проход начинает ListAccounts с начала. Дубликатов уникальности не дают, но проход
      повторяется бесконечно, и notify_notice_fanout_pending не падает до нуля — тревога Р19
      ложная. У областей «индекс последней завершённой» 0 означает «область 0 завершена», и
      начального значения нет. Реализация, которая пометит конец раскрытия через closed_at,
      сломает З6 п.2 и З8 п.5: переход закрывает строки только тех событий, которые закрыл сам,
      и неотправленные строки такого события уйдут письмом отменённого этапа.
    condition: >-
      (а) У события этапа отдельный признак «раскрытие завершено» (например, fanned_out_at),
      который ставит транзакция последней страницы. Он не совпадает с closed_at, и взятие
      события и fanout_pending его читают. (б) Начальная позиция выражена отдельно от любой
      законной: scope_pos NULL — «ни одна область не завершена», page_token NULL — «страниц не
      было». Пустая строка не пишется, это CHECK. (в) Проба: событие allAccounts на двух
      страницах раскрыто — следующий проход ListAccounts не зовёт, fanout_pending = 0.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF5-66, 67 держат число писем, но не число вызовов ListAccounts после конца; тревога Р19 по fanout_pending на завершённом событии сценарием не держится — заказ пробы"
  - id: CX5-52
    source: "З10 п.4, З12 п.1 (необязательный столбец thread_key у строки ленты; предикат взятия исключает строку того же thread_key под действующей арендой)"
    kind: sentinel
    class: "code-authoring §«Умолчание, которое становится утверждением» (отсутствие ключа нити пустой строкой); measurement-discipline §«Радиус: по имени механизма и по точкам применения»"
    exposure: >-
      thread_key — новый столбец таблицы ленты фундамента, общей для всех источников и классов.
      Предикат исключения стоит в Claim, то есть в каждом взятии конвейера. Незаданное строковое
      поле в Go — пустая строка. Строки без нити с thread_key = '' попадают под «тот же
      thread_key под действующей арендой», и весь конвейер notify сваливается к одной строке в
      полёте. SQL-равенство на NULL такого не даёт — значит, всё решает одно написание
      отсутствия. Правка предиката Claim — это правка сервера ленты corelib, а в §4 для corelib
      notify/feed перечислены только «срок NULL, thread_key, Supersede, DeleteTerminal».
      «Действующая аренда» опять не названа предикатом (CX5-05, CX5-50).
    condition: >-
      (а) Отсутствие thread_key — NULL: CHECK (thread_key IS NULL OR thread_key <> ''), в Go —
      тип с признаком присутствия. (б) Исключение в Claim — одно условие рядом с условием аренды
      уборщика, с той же формулой «аренда действует». (в) §4 называет правку Claim сервера ленты
      отдельной строкой: corelib notify/feed, стадия S2. (г) Проба-близнец: две строки без
      thread_key берутся одним Claim обе, две строки одного thread_key — одна.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF5-75, 95, 108 держат нить; параллельность строк без нити не держит ни одна буква — заказ пробы corelib feed"
  - id: CX5-53
    source: "З2 п.5 («p == Principal{} → ErrEmptyPrincipal, без подстановки SystemPrincipal»)"
    kind: sentinel
    class: "code-authoring §«Контракт, который нельзя выразить» (второй распознаватель «никто» рядом с существующим); security.md sec-forwarded-trust-aware-extract"
    exposure: >-
      В фундаменте уже есть единственный распознаватель «принципал не называет никого»:
      Principal.IsAnonymous() — Type пуст, или ID пуст, или ID = AnonymousPrincipalID
      (operations/types.go:69 @34bc8104a). Шапка константы требует, чтобы любое сравнение
      личностей его учитывало. Условие замысла «p == Principal{}» ловит только полностью пустую
      пару. Принципал с одним Type, с одним DisplayName или {system, anonymous} проходит Ф1/Ф2 и
      пишет операцию с владельцем «никто». GetOwned и CancelOwned такого владельца отсекают
      (owner.go:80), и операция недостижима ни для кого. Кроме того, у значения «пусто» в пакете
      появляются два распознавателя.
    condition: >-
      Ф1 и Ф2 отказывают по p.IsAnonymous() и возвращают ErrEmptyPrincipal (либо имя, которое
      назовёт замысел). Сравнения с Principal{} в Ф1/Ф2 и в построителе нет. Проба corelib
      (NTF5-122) несёт буквы {Type:"user", ID:""} и {system, anonymous} → ошибка, строк
      операции 0, с близнецом «полная пара → строка есть».
    mapped_in_design: false
    outcome: к-коду
    held_by: "NTF5-122 (д1), (д2) держат полностью пустую пару; частичную пару и анонимное слово — ни одна буква; заказ исполнителю corelib"
  - id: CX5-54
    source: "З21 п.1 (порт OutcomeObserver конвейера зовётся в транзакции записи исхода и увеличивает notice_counters); З8 п.4, З9 п.2 (счётчики в транзакции страницы)"
    kind: new_mechanism
    class: "code-authoring §«Решение и его следствие разнесены» (общий счётчик, увеличиваемый в чужой транзакции)"
    exposure: >-
      Исход строки ленты пишет Ack сервера ленты, то есть транзакция corelib. По NTF-1 Р8 повтор
      Ack с тем же токеном и исходом — «успех без изменения строки»: ответ мог потеряться
      после коммита. Наблюдатель, вызванный на каждом Ack, при таком повторе увеличит
      notify_notice_letters_total{SENT} второй раз. Строки notice_counters общие для всех
      извещений одного вида и этапа. Страница раскрытия увеличивает несколько строк (DENIED,
      NO_ADDRESS, UNADDRESSED), переход — SUPERSEDED, наблюдатель — SENT. Два писателя,
      обновляющие пересекающийся набор строк в разном порядке, получают взаимную блокировку
      (40P01). Страница откатывается и повторяет сетевые вызовы. Сам порт — правка сервера
      ленты corelib, а в §4 её нет.
    condition: >-
      (а) Наблюдатель зовётся только тогда, когда Ack действительно изменил строку. На ветке
      «повтор с тем же токеном и исходом» его нет. (б) Каждая транзакция обновляет строки
      notice_counters одним оператором в порядке (name, labels) последним действием. (в) §4
      называет порт в сервере ленты corelib отдельной строкой со стадией. (г) Проба: потерянный
      ответ Ack и повтор — SENT = 1.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF5-58 и подобные держат SENT=1 без повтора Ack; повтор Ack (NTF1-B26 — со стороны ленты) в NTF-5 со счётчиком не сведён — заказ пробы"

