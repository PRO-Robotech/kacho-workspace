approval_conditions:
  # Пять условий: SDD-1 §5, CLASS-05, 08, 09, 10, DESIGN-02. Исход каждого — на отпечатке a43a19fa.
  # Шестое условие DESIGN_APPROVED — применимое ревью замысла — предмет следующего шага, здесь не судится.
  - condition: "каждый пункт первичного разбора отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: red
    detail: >-
      Строк отображения 48 из 48. Три отображения пересверку не выдерживают. CX5-05: предикат
      Supersede «lease_until IS NULL» пропускает строку, которая уже была забрана и отложена
      (DEFER), — а пункт назван ради именно этого случая. CX5-07: резерв окна адреса с PK
      feed_row_id при повторном взятии отложенной строки даёт 23505 — строка застревает. CX5-24:
      предикат подметальщика противоречит Р14, запрету З8 п.5 на SQL notify к таблице ленты и
      порядку каскада. Остальные 45 выдерживают; у CX5-19 и CX5-28 — с условием к коду (см.
      CX5-52, CX5-54).
  - condition: "новый внешний вызов заведён пунктом и отображён (CG_CLASS_NEW_EXTERNAL_CALL)"
    result: green
    detail: >-
      Новых сетевых вызовов 0. Рёбра §9 (DescribeScope, ListAccounts, Resolve, ResolveSend,
      Check, пакетная проверка сужателя) названы приёмкой (ResolveSend — 8 упоминаний в приёмке).
      ops.Get, feed.Supersede, feed.DeleteTerminal и порт OutcomeObserver — вызовы в процессе к
      той же базе. Порт OutcomeObserver — новое звено в чужой транзакции; он заведён пунктом
      CX5-54 по классу, а не как внешний вызов.
  - condition: "новый асинхронный путь заведён пунктом и отображён (CG_CLASS_NEW_ASYNC_PATH)"
    result: green
    detail: >-
      Новых асинхронных путей 0. Взятие заявки по аренде, повтор отложенной строки кандидата,
      планировщик, подметальщик, раскрытие и сборщик метрик названы приёмкой или пунктами
      CX5-08, 29, 30 и отображены. Повторное взятие после истечения аренды — часть пути
      CX5-08; его значения судятся пунктом CX5-50.
  - condition: "новое sentinel-значение заведено пунктом и отображено (CG_CLASS_NEW_SENTINEL)"
    result: red
    detail: >-
      Пять новых sentinel-значений, строк отображения у них нет:
      нулевое значение endsAt в строке ленты при шаблонах, где presence не объявлен, — CX5-49;
      NULL и истёкший срок аренды, а также личность «$me» в трёх арендах notify — CX5-50;
      пустая позиция раскрытия означает и «не начато», и «закончено» — CX5-51;
      отсутствие thread_key, записанное пустой строкой, — CX5-52;
      ErrEmptyPrincipal распознаётся по «p == Principal{}» мимо Principal.IsAnonymous — CX5-53.
      ErrNilTx, pause, pauseMisconfigured и метка code="UnknownOutcome" заведены пунктами
