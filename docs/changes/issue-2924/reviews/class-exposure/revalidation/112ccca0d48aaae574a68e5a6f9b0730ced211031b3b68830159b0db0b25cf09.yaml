approval_conditions:
  # Пять условий: SDD-1 §5, CLASS-05, 08, 09, 10, DESIGN-02. Исход каждого определён на отпечатке 112ccca0.
  # Шестое условие DESIGN_APPROVED — применимое ревью замысла — предмет следующего шага, здесь не судится.
  - condition: "каждый пункт первичного разбора отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: green
    detail: >-
      Строк отображения 66, уникальных пунктов 65 из 65 (CX5-44 двумя строками). Отображения,
      тронутые дельтой, выдерживают: CX5-61 (форма NTF-1 принята, ведомость одна, `feed.TableSQL` и
      константа имени в kacho сняты, G3 SQL не судит), CX5-63 (уборка окна — своя транзакция на адрес
      под замком адреса, три места вызова `Now`, их держит G3), CX5-64 (прогон `AuditFeedTableWrites`
      kacho с миграцией N7, `superseded` — новой версией схемы), CX5-65 (предикат Е8 по механизму с
      контролем в обе стороны). У CX5-61 и CX5-63 есть условия к коду, они в mapping_check. Новый
      пункт CX5-66 этим условием не судится: он в `unmapped`.
  - condition: "новый внешний вызов заведён пунктом и отображён (CG_CLASS_NEW_EXTERNAL_CALL)"
    result: green
    detail: >-
      Новых сетевых вызовов нет (0). Проход уборки окна `limits.SweepWindow` ходит в ту же базу
      `kacho_notify`. `pg_query_go` из kacho снят (M34), в corelib он остаётся тестовой зависимостью
      гейта, разбор идёт в процессе.
  - condition: "новый асинхронный путь заведён пунктом и отображён (CG_CLASS_NEW_ASYNC_PATH)"
    result: green
    detail: >-
      Проход `limits.SweepWindow` на такте подметальщика `notice/sweeper` — фоновая запись. Отдельным
      пунктом он не заводится: это исполнение условия к коду CX5-63 пересверки на 5c62808f («уборка
      в своей транзакции — третий вызывающий `DBClock`, и п.7 его называет»), и отображение CX5-63
      его несёт. Порядок замков совпадает со слоем: сначала замок адреса, затем часы, затем
      `DELETE`. Строк ведра проход не трогает, взаимной блокировки со слоем нет. Остановка прохода
      правильности не ломает: записи старше 24 ч в счёт не входят по условию окна. Страдает только
      размер таблицы (условие к коду — в mapping_check CX5-63).
  - condition: "новое sentinel-значение или механизм заведены пунктом и отображены (CG_CLASS_NEW_SENTINEL)"
    result: red
    detail: >-
      Выдерживают: пустое описание записи у читающего места. Оно совпадает с нулевым значением поля,
      но сверка идёт в обе стороны с разобранным текстом, поэтому забытое описание у пишущего места
      даёт красный «запись вне описания», а не молчание. Выдерживает и исход «место не судимо», с
      условием к коду CX5-61. Не заведён пунктом новый механизм дельты: **единица гейта
      `entrypoints_test.go` сменилась с исполняющего вызова (`Exec`/`Query`/`QueryRow`/`Batch.Queue`,
      ред. 5) на место `fmt.Sprintf` с вызовом `tablename.Of`**. Это CX5-66. Модель NTF-1 не
      связывает место текста с исполнителем: УК90 запрещает сохранять результат `Of`, а результат
      `Sprintf` — нет. Замысел NTF-1 сам отдаёт текст места другой функции:
      `feed.RetentionSubjects(db, table) []retention.Subject`, строка 667 ред. 7, текст исполняет
      петля `corelib/retention`. Исключительность «непустое значение столбцам исхода — только
      `recordOutcome`» и «`gen_random_uuid()` в `lease_token` — только `claimTx`» гейт судит по
      функции-владельцу ТЕКСТА. Кто этот текст исполняет, он не видит.
  - condition: "нет маркеров отсрочки и открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: green
    detail: >-
      `grep -noE 'TODO|TBD|FIXME|XXX'` — 0. «позже» (6) и «пока не» (1) описывают поведение, в
      добавленных строках — только «отложенной» (термин исхода). §13: «Открытых решений нет. З1–З28
      приняты» (строка 1712), последнее решение — З28 (строка 1232). Отвергнутая альтернатива CX5-61
      (NTF-1 переходит на константы) названа с доводом в §12.

mapping_check:
  # Судятся только строки, изменённые дельтой. Прочие — как в прежних пересверках.
  - id: CX5-61
    design: "З28 п.4, п.6, п.7, З8 п.5, З11 п.2, §3 И24, §4, §6"
    verdict: holds
    note: >-
      Все четыре следствия пересверки на 5c62808f закрыты. (а) Гейт больше не требует константного
      SQL у исполнителя. Он судит место `Sprintf` с `Of`: текст для разбора — литеральная форматная
      строка, где `%s`/`%[n]s` подставлены идентификатором вида из константного аргумента `Of`.
      Уборщик NTF-1 в своей форме сборки (`WITH x AS (UPDATE %[1]s …)`, M33 на 8d01a10e) —
      положительный близнец, он выполним. (б) `feed.TableSQL` нет, решение NTF-1 об `internal` не
      отменяется. Тест `notify/feed/entrypoints_test.go` лежит в поддереве `notify/feed` и
      `notify/feed/internal/tablename` импортировать может. (в) Константы имени таблицы в kacho нет.
      Условие (iv) держит тонкий вызывающий `AuditFeedTableWrites` в kacho, его существование
      подтверждено (NTF-1 ред. 7, строка 834: «Тесты kacho (`internal/repohygiene/…`) … — тонкие
      вызывающие»). Печать «kacho и kaname — 0» — строка 911. (г) Ведомость одна. Тип строки получает
      описание записи, `claimTx`, `recordOutcome`, `Supersede`, `DeleteUnleased` входят в ведомость
      тем же коммитом T2, место закрытия после расшифровки уходит. Исключительность проверяется и на
      самой ведомости. Отрицательный близнец отличается от положительного одним фактом
      (`recorded_kind = NULL` → `$k`). Выдерживает при одной оговорке: исполнитель текста с гейтом не
      связан. Она выделена в новый пункт CX5-66, потому что это свойство новой единицы гейта, а не
      несоответствие отображения условию CX5-61.
    code_conditions: >-
      (1) Исход «место не судимо» — красный теста с именем функции-владельца и причиной, а не
      строка печати. В тексте п.4 не сказано, валит ли он гейт, а инъекция «`%d` рядом с `Of`»
      ждёт только «место не судимо». Близнец: то же место с `%s` молчит. (2) Ведомость NTF-1 держит на
      функцию МУЛЬТИМНОЖЕСТВО мест без ключа места (NTF-1 ред. 7, строки 875–877), а описание
      записи в п.6 привязано к месту. У `DeleteUnleased` мест два: чтение `FOR UPDATE` с пустым
      описанием и `DELETE`. Поэтому описания функции — тоже мультимножество, и гейт сопоставляет их
      с разобранными местами взаимно-однозначно по содержанию. Место без пары и описание без пары —
      красный. Инъекция: у `DeleteUnleased` чтение `FOR UPDATE` заменено вторым `DELETE` при
      неизменной ведомости — красный. При сверке «по объединению» описаний функции эта инъекция
      промолчала бы. (3) `%%` в форматной строке гейт превращает в `%` до разбора и глаголом не
      считает. Иначе оператор с `LIKE` станет «не судим».
  - id: CX5-63
    design: "З11 п.1, п.5, п.7, З25, З27 п.4, §3 И9, И30, §6"
    verdict: holds
    note: >-
      Условие к коду пересверки на 5c62808f исполнено вариантом «своя транзакция». Каждая
      транзакция уборки на адрес берёт `pg_advisory_xact_lock(hashtext($h))`, затем читает `$t` из
      `DBClock`, затем удаляет. Решения слоя и уборки одного адреса упорядочены замком, и каждое
      судит своим `$t` — промежуток `($t' − 24h, $t − 24h]` потерять нельзя. Выбор адресов идёт без
      часов и ничего не решает. Остановка по «ни одной удалённой строки» верна: выбираются
      старейшие по `reserved_at`. Каждый круг удаляет хотя бы одну строку, иначе проход кончается,
      поэтому проход конечен. Мест вызова `Now` три, G3 печатает и требует это число, инъекция
      четвёртого места красная. Индекс `(reserved_at) WHERE sent_at IS NOT NULL` внесён в §6. Запись
      `SENT` наблюдателя замка адреса не берёт, но уборка удаляет только строки с `sent_at IS NOT
      NULL`. `DELETE` ждёт замка строки и под READ COMMITTED перечитывает условие, поэтому гонки с
      наблюдателем нет.
    code_conditions: >-
      Сбой прохода `SweepWindow` не откатывает транзакцию партии З24 и не прерывает такт
      подметальщика: он считается счётчиком и пишется в журнал без адреса (`address_hash` — не PII,
      но и в журнал не нужен). Число кругов прохода за такт ограничено, чтобы долгий хвост не держал
      такт; остаток доберёт следующий такт. Проба N10 — на часах `DBClock`, как названо.
  - id: CX5-64
    design: "З11 п.4, З24 п.6, §6, §3 И32"
    verdict: holds
    note: >-
      Условия к коду внесены. N7: прогон тонкого вызывающего `AuditFeedTableWrites` kacho с миграцией
      отметок, «находок SQL — 0». Правило SQL NTF-1 перечисляет тело функции, процедуры или
      триггера, `DO` и одиночные `INSERT INTO`/`UPDATE`/`DELETE FROM`/`MERGE INTO`/`TRUNCATE`
      (ред. 7, строки 904–906). `REFERENCES … ON DELETE CASCADE` в `CREATE TABLE` ни одна из этих
      форм не является. `superseded` в `CHECK` и `outcome_pair` вносит новая версия схемы
      `notify/feed/schema`, ban #5 не задет.
    code_conditions: "—"
  - id: CX5-65
    design: "§13 Е8, §1 M32, §0 (Д23)"
    verdict: holds
    note: >-
      Предикат судит механизм: `grep -c 'recipient_key_fence'` и `grep -ciE 'оград[а-я]* ключа'`
      по одобренному замыслу NTF-1. Контроль в обе стороны перемерен: ред. 4 — 0 и 0, ред. 5 — 5 и
      5, ред. 6 — 8 и 9, ред. 7 — 12 и 12. «Снята» требует обоих нулей И того, что одобренный замысел
      NTF-1 называет модель NTF-4 Р11. Любой иной исход ведёт к пересверке. Ошибка возможна только в
      безопасную сторону: таблица с прежним именем, но без перезаписи, даст «жива» и лишнюю
      пересверку, а не ложное снятие. §0 и M32 — на ред. 7, лежащей в дереве на 49f5b0a8d (предок
      b3ba899f4 — код 0; отпечаток 8d01a10e на 49f5b0a8d и на HEAD).
    code_conditions: "—"

new_items:
  - id: CX5-66
    source: "З28 п.4 (единица гейта — место `fmt.Sprintf` с вызовом `tablename.Of`), п.6 (описание записи у места ведомости по функции-владельцу), §3 И24; NTF-1 ред. 7 УК90 (строки 885–890), `feed.RetentionSubjects` (строка 667)"
    kind: new_mechanism
    class: "code-authoring §«Инвариант и оснастка — это тоже прод-код» (страж судит идентичность не того узла); §«Решение и его следствие разнесены» (место текста и место исполнения разнесены); gate-authoring «исход вместо объявления»"
    exposure: >-
      Ред. 5 судила исполняющий вызов, ред. 6 судит место текста. В модели NTF-1 результат
      `Sprintf` сохранять можно, запрещено только сохранять результат `Of`. Пример: текст строится
      один раз в конструкторе, `s.q.record = fmt.Sprintf("UPDATE %s SET recorded_kind = $k …",
      tablename.Of(svc, tablename.Outbox))`, а исполняет его `recordOutcome`. Тогда функция-владелец
      места — конструктор, а не `recordOutcome`. Строки ведомости `claimTx`/`recordOutcome` не
      совпадут с местами, либо описание придётся писать на конструктор. Хуже другое: второй
      исполнитель того же текста, например `tx.Exec(ctx, s.q.record, …)` в `Local.Ack` в обход
      `recordOutcome`, не добавляет ни одного места `Sprintf`. Гейт `entrypoints_test.go` и
      `AuditFeedTableWrites` оба промолчат. Проверка достижимости «метод `Ack` достигает
      `recordOutcome`» тоже промолчит, если метод зовёт ядро на другой ветке. Цена — И24:
      строка извещения получает исход без вызова наблюдателя. Её окно OB не снято, резерв не стал
      записью, счётчик этапа не увеличен. Это ровно тот класс, который CX5-55 и CX5-61
      закрывали. Законное дерево NTF-1 уже разносит текст и исполнение: текст уборки закрытых строк
      отдаётся петле `corelib/retention` (`feed.RetentionSubjects`, строка 667 ред. 7).
    condition: >-
      (а) Для мест с видом `Outbox`, чьё описание присваивает хоть одному столбцу исхода
      (`recorded_kind`, `recorded_reason`, `outcome_token`), аренды (`lease_token`, `lease_until`) или
      `state`, результат `Sprintf` — непосредственный SQL-аргумент исполняющего вызова (`Exec`,
      `Query`, `QueryRow`, `Batch.Queue`, методы найдены по типу получателя) в том же выражении.
      Присваивание переменной, полю, возврат и передача иной функции — красный с координатой, по
      образцу УК90 NTF-1. Тогда функция-владелец места и есть исполнитель, и исключительность по
      функции-владельцу становится исключительностью по исполнителю. (б) Места с описанием «только
      чтение» или «только `DELETE`» (уборка закрытых строк, `DeleteUnleased`) из правила (а)
      исключены по описанию, а не по имени. Это законный путь `RetentionSubjects`. Исключение
      названо в п.4 с доводом: такое место не пишет столбцов, которые судит исключительность.
      (в) Близнецы: текст `recordOutcome`, построенный в конструкторе и исполненный в
      `recordOutcome`, — красный с координатой присваивания; тот же текст внутри
      `tx.Exec(ctx, fmt.Sprintf(…), …)` в `recordOutcome` — молчит. Факт один. Инъекция второго
      исполнителя в `Local.Ack` в форме (а) невыразима, а в сохранённой форме красная по (а).
      (г) Вариант вместо (а): гейт прослеживает значение от места `Sprintf` до каждого исполняющего
      вызова (поток данных внутри пакета `feed`) и судит исключительность по исполнителю. Тогда
      выбор и его граница — сохранение в поле структуры, передача через интерфейс — называются
      в п.4.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "ни одна буква на ред. 6: ни гейт п.4, ни `AuditFeedTableWrites` (УК90 судит только результат `Of`) исполнителя не видят — заказ автору замысла"

