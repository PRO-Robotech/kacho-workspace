questions_to_dispatcher:
  - >-
    К1 / CX5-62 (без изменений с 1004e1c8): какой механизм ограничивает потерю места в расписании
    у строки, закрытой мимо отправки? Варианты: горизонт выдачи мест `H = feed.MaxDefer` (ревью
    a383ddbd; цена — строки без места соревнуются с новыми) или возврат мест при закрытии строки.
    Решение вводит механизм, поэтому следующая редакция — уже не заход отображения Д26, и
    пересверка на неё будет судить механизм целиком. Ещё один заход отображения без решения
    ничего не изменит: всё, что можно отобразить без механизма, отображено.

