mapping_check:
  - id: CX5-62
    design: "§11 строка CX5-62; §11 строка К1; §13; tasks.md N10"
    verdict: unmapped_declared
    note: >-
      Строка §11 больше не называет потерю места ценой. Она говорит, что потеря ожидания письма
      `obligation` сверху не ограничена, «темп ниже, не выше» её не ограничивает, отображения нет,
      это К1. Устаревшее противоядие снято, расхождение с З11 п.1 закрыто, и это правильный исход
      для захода, которому механизм вводить нельзя. Условия к коду (1)–(3) пересверки 1004e1c8
      перенесены в строку К1, §13 и N10 без потерь. Отображением пункт от этого не становится:
      границы числом нет, потому что нет механизма. Прочие части строки CX5-62 (расписание мест,
      `defer_for`, число транзакций слоя, счётчик `notify_ob_deferred_total`) и её держатели не
      менялись и выдерживают, как на 1004e1c8.
    code_conditions: "как в записи 1004e1c8, mapping_check CX5-62 (1)–(3); в замысле они уже стоят в строке К1 и N10"
  - id: Н1
    design: "§8 «Сроки вызовов kaname» (строки 1669–1680); §11 строка Н1; tasks.md N3, N9"
    verdict: holds
    note: >-
      Условия пересверки 1004e1c8: (2) именованный срок транзакции фиксации и страницы ≤ 30 с
      внесён; (3) уровень назван — место вызова пакетов `admit` и `fanout`, у клиента
      `kaname_client.go` своего срока нет; (1) кратность внесена: аренда ≥ сумма сроков попытки с
      `DescribeScope` на каждую из до 100 областей плюс срок транзакции. Форма вызовов
      (последовательно или параллельно) не названа. Но «сумма с кратностью» — верхняя граница при
      любой форме: при параллельных вызовах время попытки только меньше, поэтому аренда, выведенная
      из суммы, короче попытки не окажется. Отдельной строки это не требует. Щель одна:
      модульной пробы кратности («100 областей, заглушка молчит на каждой — попытка кончается
      раньше аренды; близнец — одна область») нет ни в строке §11 Н1, ни в N3, ни в N9. Без неё
      вывод в комментарии константы держится вниманием. Это условие к коду, а не неотображённый
      пункт: сам Н1 на 1004e1c8 выдерживал. Остаток формулировки «одна константа на клиента»
      соседствует со «сроком пакета `admit` либо `fanout`». Читается это как «все вызовы одного
      пакета — под одной константой», противоречием по существу не является.
    code_conditions: >-
      (1) Проба кратности в N3 (аренда заявки) и N9 (аренда события и кандидата): 100 областей,
      заглушка kaname молчит на каждом вызове `DescribeScope` — попытка кончается раньше
      константы аренды, вторая реплика заявку не перехватывает; близнец — одна область. Проба
      предпосылки: константа аренды, заданная меньше суммы, — красный. (2) Константа срока
      вызова одна на пакет: в `admit` одна, в `fanout` одна. Предикат `git grep -n
      'context.WithTimeout' -- services/notify/internal/clients/` → 0 держит «клиент своего срока
      не ставит» и печатает число осмотренных файлов клиентов.
  - id: Н2
    design: "§11 строка Н2"
    verdict: holds
    note: "Уточнение «потолок считает только резервы моложе 24 ч, строже нужного не дольше суток» внесено дословно по записи 1004e1c8. Механизма нет."
    code_conditions: "—"
  - id: Н3
    design: "§8 «Серверные пределы транзакций kacho_notify»; §11 строка Н3; tasks.md N10"
    verdict: holds
    note: >-
      Внесено: (1) предикат «пулы `kacho_notify` строятся только `db.NewPool`» печатает число
      осмотренных файлов `services/notify` и падает на пустом обходе, с оговоркой, что сегодня
      `services/notify` в kacho нет и ноль ничего не доказывает; (2) близнец-инъекция идёт под
      собственным сроком пробы (> 60 с) и краснеет, а не повисает. Форма предиката — это
      формулировка «только», а не пара чисел (`pgxpool.New…` → 0, `NewPool(` → 2). Она
      равносильна при условии, что предикат ищет оба признака. Это условие к коду.
    code_conditions: "Предикат ищет и запрещённую форму (`pgxpool.New`/`NewWithConfig` вне тестов → 0), и разрешённую (`NewPool(` → по одному на корень `notify-api`, `notify-sender`), и печатает обе величины."
  - id: М3
    design: "З3 п.4 (строки 369–372); §11 строка М3; tasks.md N3"
    verdict: holds
    note: "Обе стороны расхождения часов названы: часы `notify-sender` впереди — окно короче, страдает живость; позади — окно длиннее на расхождение, это ослабление границы. Комментарий у проверки окна — условие полосы N3."
    code_conditions: "—"
  - id: "прежние отображения CX5-01…66 (кроме CX5-62)"
    design: "§11"
    verdict: holds
    note: >-
      Дельта других строк CX5 не меняла: word-diff §11 затрагивает только CX5-62, К1, Н1, Н2, Н3,
      М3 и итог. Правка перечня отображений в строке 1723 — только список пересверок-источников.
      Дельта N3, N9, N10 дописывает условия к коду и не снимает прежних проб.
    code_conditions: "—"

