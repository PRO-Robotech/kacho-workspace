#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы и прежние пересверки (a43a19fa, 379efc2a,
# 108c05d2, 58e29da9, 5c62808f, 112ccca0, a383ddbd, 1004e1c8) относятся к своим редакциям и здесь
# не переписываются.
# Редакция 9 — заход отображения по Д26 на пересверку 1004e1c8. Поэтому судятся только строки
# отображения и дельта редакции 9 против редакции 8 (`git diff 6ef9142c3 7361cd8bb --
# docs/changes/issue-2924/`, 204 строки диффа: design.md, tasks.md, change.yaml). Проверено:
#   (1) каждое условие к коду пересверки 1004e1c8 получило строку §11 и строку полосы tasks.md,
#       и отображение выдерживает пункт;
#   (2) дельта не вводит новых механизмов, решений, сторожей, асинхронных путей и внешних вызовов;
#   (3) маркеров отсрочки и открытых решений нет;
#   (4) дельта не сдвигает прежних отображений моего перечня.
