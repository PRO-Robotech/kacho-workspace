approval_conditions:
  - condition: "нет маркеров отсрочки (CG_DESIGN_DECISION_OPEN, часть 1)"
    result: green
    detail: "`grep -nE 'TODO|TBD|FIXME|XXX' design.md tasks.md | wc -l` → 0."
  - condition: "нет открытых решений (CG_DESIGN_DECISION_OPEN, часть 2)"
    result: red
    detail: >-
      §13 (строки 1851–1859): «Открытое решение одно — К1 … до него замысел к коду не готов», и
      к нему теперь явно отнесён CX5-62. tasks.md N10: «К1 открыт — полоса не стартует до решения
      диспетчера». Решения по К1 в заданиях Д1–Д27 нет. Д26 запрещает вводить механизм в заходе
      отображения, поэтому этот заход закрыть К1 не мог.
  - condition: "каждый пункт отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: red
    detail: >-
      Строк CX5 в §11 — 67, уникальных пунктов — 66. Итог §11 теперь говорит правду: «строк
      отображения 66 из 66, отображение CX5-62 в части потери места не выдерживает — это К1,
      открыт». Устаревшая цена «темп ниже, не выше» из строки CX5-62 снята, расхождение строки с
      З11 п.1 и §13, найденное на 1004e1c8, устранено. Но пункт CX5-62 по-прежнему без
      противоядия: автор честно объявил его неотображённым. Условия к коду будущего механизма
      (граница числом, проба на `DBClock` со 100 000 закрытых строк, близнец, проба предпосылки,
      И30) внесены в строку К1 §11, в §13 и в N10 полностью, как сформулированы на 1004e1c8.
      Условия к коду Н1, Н3, М3 и уточнение Н2 отображены и выдерживают (mapping_check), у Н1
      остаётся одно условие к коду — проба кратности.
  - condition: "новый внешний вызов, асинхронный путь, sentinel-значение или механизм заведены пунктом и отображены"
    result: green
    detail: >-
      Новых механизмов, сторожей, асинхронных путей, внешних вызовов и sentinel-значений 0.
      `DescribeScope`, добавленный в перечень вызовов полосы N9, — не новый вызов: design.md
      строка 566 уже ведёт `DescribeScope` (промах кэша) в раскрытии под арендой события. Правка
      исправляет неполный перечень N9 и снимает щель в Н1: иначе вызов раскрытия остался бы без
      срока. «Срок ставится в месте вызова, клиент своего срока не ставит» — выбор уровня среди
      вариантов, названных условием Н1 (3), а не механизм. Предикат «пулы только `db.NewPool`» —
      условие к коду Н3 (1), а не новый страж.

