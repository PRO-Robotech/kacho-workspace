# Экспозиция классов — пересверка (revalidation) замысла NTF-5 (извещения оператора), редакция 2.
#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы на 1f4852e4, 2fe29c35, 88fabd09,
# 03e291ee и 367b9482 и пересверка на a43a19fa свидетельствуют о своих редакциях и здесь не
# переписываются.
# По Д22 судится ДЕЛЬТА редакции 2 против редакции 1 (`git diff 4697e3f39 eb9a51abc --
# docs/changes/issue-2924/design.md`, 719 строк диффа). Отображения, которые пересверка на a43a19fa
# признала выдерживающими и которые дельта не тронула, повторно не судятся.
# Проверено пять вещей:
#   (1) CX5-05, 07, 24, не выдержавшие пересверку на a43a19fa, и новые CX5-49…54 отображены, и
#       отображение выдерживает условие пункта;
#   (2) новые внешние вызовы, (3) новые асинхронные пути, (4) новые sentinel-значения и механизмы
#       дельты заведены пунктами;
#   (5) маркеров отсрочки и открытых решений нет.
# Условие «нет применимого ревью замысла» здесь не судится: ревью замысла — следующий шаг.
# Новые пункты этой пересверки — CX5-55…59. У замысла для них строк отображения нет.
