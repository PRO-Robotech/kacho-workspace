orders:
  - to: design author (NTF-5)
    what: >-
      Редакция 3 замысла:
      (1) З12 п.1, З21 п.1, §4, §10 — место условия головы нити и вызова наблюдателя, общее для
      сервера ленты и для взятия собственной ленты в процессе (NTF-3 Р19), либо обе точки названы
      поимённо (CX5-54, CX5-55);
      (2) З21 п.1 — вход наблюдателя: строки без notice_addressees не трогаются и ошибкой не
      являются, ярлыки берутся из извещения, композиция с наблюдателем NTF-3 (CX5-56);
      (3) З24 п.4 — DeleteUnleased: сначала блокировка по id, потом деление, без второго чтения
      (CX5-57);
      (4) З12 п.3 — корень с условием sent_at IS NOT NULL, порядок (sent_at, id), полная точность
      (CX5-58);
      (5) З11 п.3 — clamp defer_for в [MinDefer, MaxDefer] (CX5-59);
      (6) §11 — строки отображения CX5-55…59 и переписанная строка CX5-54;
      (7) §0 — строка замысла NTF-1: текущая редакция 774e8562, M18 на ней подтверждён.
    basis: "SDD-1 §5 (точное отображение; новый sentinel или механизм — новый пункт); change-graph.md §4"
  - to: author NTF-3 (через диспетчера)
    what: >-
      Назвать функцию взятия собственной ленты в процессе и функцию записи исхода на этом пути.
      Замыслу NTF-5 нужно поставить туда условие головы нити и наблюдателя исхода (CX5-55, CX5-56).
      Если у NTF-3 свой наблюдатель на той же ленте, нужна одна композиция, а не два поля.
    basis: "code-authoring §5.3 «Перечень входных поверхностей неполон»"
  - to: corelib implementer (NTF-5 S2)
    what: >-
      Пробы C5:
      строка извещения, взятая путём собственной ленты, — Ack SENT зовёт наблюдателя, вторая строка
      нити не выдаётся (CX5-55);
      DeleteUnleased в чередовании с Ack DEFER — строка либо в deleted, либо в leased (CX5-57).
    basis: "gate-authoring §«отрицание только в паре с положительным»; testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки»"
  - to: go implementer (NTF-5 notify)
    what: >-
      Пробы:
      Ack SENT строки credential-expiring — notice_counters без изменений, Ack успешен; близнец —
      строка извещения (CX5-56);
      первое письмо пары BOUNCED, второе SENT — второе без In-Reply-To (CX5-58);
      темп 600 в минуту, ведро пусто — Ack DEFER с defer_for = 1 с принят (CX5-59).
    basis: "gate-authoring §«отрицание только в паре с положительным»"
