approval_conditions:
  # Пять условий: SDD-1 §5, CLASS-05, 08, 09, 10, DESIGN-02. Исход каждого — на отпечатке 379efc2a.
  # Шестое условие DESIGN_APPROVED — применимое ревью замысла — предмет следующего шага, здесь не судится.
  - condition: "каждый пункт первичного разбора отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: red
    detail: >-
      Строк отображения 55, уникальных пунктов 54 из 54. Из девяти пунктов, отображение которых
      изменила дельта, выдерживают CX5-05, 49, 50, 51, 53. С условием к коду выдерживают CX5-07
      (CX5-55, CX5-59), CX5-24 (CX5-57) и CX5-52 (CX5-55). Не выдерживает CX5-54. Замысел ставит
      наблюдателя исхода портом `feed.NewServer`, и его зовёт `Ack` сервера ленты. Но строки
      извещений — строки собственной ленты notify (приёмка NTF-5 Р1; З8 п.1 замысла), а
      собственную ленту notify отправитель забирает «функцией взятия фундамента в своём процессе —
      без сервера ленты» (NTF-3 Р19). На пути строк извещений наблюдатель не вызывается ни разу. Тогда
      счётчик SENT равен 0, `sent_at` адресата не ставится, и корня нити нет. Резерв окна OB тоже
      не превращается в запись и не снимается на DEFER. Условие (в) пункта CX5-54 в прежней записи
      само называло «сервер ленты», и эта неточность — ошибка прежней пересверки. Замысел её
      повторил. Исправленное условие — новый пункт CX5-55.
  - condition: "новый внешний вызов заведён пунктом и отображён (CG_CLASS_NEW_EXTERNAL_CALL)"
    result: green
    detail: >-
      Новых сетевых вызовов 0. `feed.NoActiveLease`, `feed.DeleteUnleased`, `feed.OutcomeObserver`,
      `notice/lease.FreeSQL`, `notice/metrics.Add`, `letterAttrs` — вызовы в процессе к той же базе
      kacho_notify. Место вызова наблюдателя — пункт CX5-55 по классу, а не как внешний вызов.
  - condition: "новый асинхронный путь заведён пунктом и отображён (CG_CLASS_NEW_ASYNC_PATH)"
    result: green
    detail: >-
      Новых асинхронных путей 0. Извещение с арендованной строкой уходит из партии подметальщика и
      удаляется следующим проходом того же подметальщика. Это повтор существующего пути CX5-24, а
      не новый путь; его решение судится пунктом CX5-57. Слой лимитов OB — шаг конвейера,
      названный приёмкой (Р15).
  - condition: "новое sentinel-значение заведено пунктом и отображено (CG_CLASS_NEW_SENTINEL)"
    result: red
    detail: >-
      Дельта вносит новые значения отсутствия и граничные значения, и у трёх из них нет строки
      отображения.
      `notice_addressees.sent_at` NULL означает и «ещё не отправлено», и «отправки не будет»,
      а корень выбирается по наименьшему `sent_at` — CX5-58.
      Список `leased` из `DeleteUnleased`: если его вычислять вторым чтением, «ни удалена, ни под
      арендой» становится третьим молчаливым исходом — CX5-57.
      `defer_for` темпа потока ниже `feed.MinDefer` — CX5-59.
      Сами значения `fanned_out_at` NULL, `scope_done` NULL, `page_token` NULL, `lease_token` и
      `lease_until` NULL, `thread_key` NULL отображены пунктами CX5-50, 51, 52 и выдерживают.
      `notice_ob_address_window.sent_at` NULL («зарезервировано, не отправлено») одно по смыслу и
      держится З11 п.2, п.4; его исполнение зависит от CX5-55.
  - condition: "нет маркеров отсрочки и открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: green
    detail: >-
      grep -ciE 'TODO|TBD|FIXME|XXX|позже|потом|отлож|пока не' по замыслу даёт 17 строк. 12 из них
      — «отложенн…» (исход DEFER, термин предмета). Остальные 5: «не позже feed.LeaseTTL» (З8 п.5,
      З24 п.5), «пока не получит исхода» (З11 п.2), «берётся позже» (З12 п.1) и порядок тегов в §8.
      Всё это описание поведения, а не отсрочка работы. §13: «Открытых решений нет»; зависимость
      Е6 несёт предикат снятия.

mapping_check:
  # Судятся только строки, изменённые дельтой. Прочие 45 — как в пересверке на a43a19fa.
  - id: CX5-05
    design: "З8 п.5, З1"
    verdict: holds
    note: >-
      `Supersede` берёт строки по `feed.NoActiveLease` = `lease_until IS NULL OR lease_until <=
      now()`. Это та же формула, что у Claim и уборщика NTF-1. `Ack` снимает аренду при каждом
      исходе, включая DEFER. Оба утверждения стоят на обеих редакциях замысла NTF-1: 9bfa92be
      (строки 319, 335, 376) и 774e8562 (строки 370, 396, 444). Отложенная строка лежит с
      `lease_until = NULL`, и `Supersede` её закрывает.
  - id: CX5-07
    design: "З11 п.1–п.3"
    verdict: holds-with-condition
    note: >-
      (а), (б) и идемпотентность резерва (`ON CONFLICT (feed_row_id) DO NOTHING`, свой резерв
      переиспользуется) выдерживают. Место транзакции названо: слой лимитов notify, а не Claim.
      Два условия к коду. Резерв на любом исходе, кроме SENT, снимает наблюдатель, а он на пути
      строк извещений не вызывается (CX5-55). `defer_for` темпа меньше `feed.MinDefer`, и Ack его
      отвергает (CX5-59).
  - id: CX5-19
    design: "З12"
    verdict: holds-with-condition
    note: "корень теперь выбирается по `notice_addressees.sent_at`; его ставит наблюдатель (CX5-55), а значение NULL — CX5-58"
  - id: CX5-24
    design: "З24"
    verdict: holds-with-condition
    note: >-
      (1)–(4) прежней записи сняты. Р14 исполняется без условия на исход. Блокировка идёт в порядке
      «извещение → события». id строк ленты собираются до каскада, строки снимает функция feed,
      открытое событие и отложенный кандидат уходят вместе с извещением. Условие к коду — как
      получается список `leased` (CX5-57).
  - id: CX5-28
    design: "З21 п.1, п.2"
    verdict: holds
    note: "изменена только ссылка на CX5-54"
  - id: CX5-49
    design: "З26, §0"
    verdict: holds
    note: >-
      Таблица из четырёх строк на 19 шаблонов и три атрибута. Р4 на 367b9482 это подтверждает:
      endsAt обязателен только у MAINTENANCE и запрещён у пяти прочих видов. Отсюда required в 5
      шаблонах и optional в 14. Путей вызова `feed.Put` два (П1, П2), планировщик идёт через П1.
      Посева нет: в kacho @1d42a6728bf у services/notify 0 файлов, serve.go нет. NULL переводится в
      «поле не задано» одной функцией, стоят `when: endsAt` и 38 эталонов. Прежняя пересверка
      неточно называла NTF5-08 случаем «MAINTENANCE без endsAt»: NTF5-08 — отрицательный близнец
      (отказ). Вывод пункта от этого не меняется.
  - {id: CX5-50, design: "З27, З3 п.2, §6", verdict: holds, note: "одна формула с веткой NULL, CHECK парности, токен на взятие, часы notify параметром; расхождение часов реплик даёт повтор работы, а не двойную запись — запись держится токеном"}
  - {id: CX5-51, design: "З9 п.1, п.4, §6", verdict: holds}
  - id: CX5-52
    design: "З12 п.1, З10 п.4, §4"
    verdict: holds-with-condition
    note: >-
      (а) NULL с CHECK и `*string`, (г) проба-близнец выдерживают. Условие головы нити выдерживает
      и при двух параллельных Claim: ветка «pending и раньше в порядке» исключает вторую строку
      нити и тогда, когда аренда первой ещё не зафиксирована. Но (б) и (в) поставлены в «Claim
      сервера ленты», а строки извещений идут взятием в процессе без сервера (NTF-3 Р19). Условие к
      коду — CX5-55.
  - {id: CX5-53, design: "З2 п.5", verdict: holds}
  - id: CX5-54
    design: "З21 п.1, §4"
    verdict: fails
    note: >-
      (а) и (б) выражены: вызов стоит только в ветке, изменившей строку, счётчики обновляются одним
      оператором в порядке (name, labels) последним. Но сам вызов — поле `feed.NewServer`, и его
      зовёт `Ack` сервера ленты. На пути строк извещений сервера ленты нет (NTF-3 Р19 на c0ea704a,
      строка 1055: «функцией взятия фундамента в своём процессе — без сервера ленты»). Значит,
      наблюдатель не вызывается ни на одной строке извещения. Три решения стоят на нём: резерв окна
      OB (З11 п.2), `sent_at` адресата и корень нити (З12 п.3), счётчики SENT и DEFER(ob_*)
      (З21 п.1). Перенос места вызова — пункт CX5-55.

new_items:
  - id: CX5-55
    source: >-
      З21 п.1 («поле конфигурации feed.NewServer … Наблюдатель notify регистрирует корень
      notify-sender для ленты пространства notify»), З12 п.1 и §4 («сервер ленты: Claim — условие
      головы нити», «сервер ленты: Ack — порт OutcomeObserver»); против NTF-3 Р19 и З8 п.1
      замысла («строка собственной ленты notify»)
    kind: new_mechanism
    class: "measurement-discipline §4 «Радиус: по имени механизма и по точкам применения» (у механизма взятия и записи исхода две точки входа, а замысел правит одну); code-authoring §5.3 «Перечень входных поверхностей неполон»"
    exposure: >-
      У ленты две точки входа, и обе ведут к одним и тем же строкам. Первая — сервер ленты:
      Claim и Ack по сети, для модулей. Вторая — взятие в процессе, для собственной ленты notify
      (NTF-3 Р19). Строки извещений лежат в собственной ленте. Замысел кладёт условие головы нити
      и наблюдателя исхода только в первую точку. На второй точке голова нити не действует: два
      письма одной пары уходят одновременно, и корень нити выбирается неоднозначно. Наблюдатель на
      второй точке не вызывается: SENT = 0 навсегда, у адресатов нет `sent_at` и корня, резерв окна
      OB не становится записью и на DEFER не снимается.
    condition: >-
      (а) Условие головы нити стоит в операторе взятия пакета feed, общем для обеих точек входа.
      Наблюдатель — параметр функции записи исхода, общей для обеих точек, и его вызов стоит там,
      а не в сервере. Альтернатива: замысел называет функцию взятия в процессе и функцию записи
      исхода, через которые notify-sender берёт строки собственной ленты, и ставит условие и
      вызов в обе. (б) §4 и §10 называют правку по этому месту, а не «сервер ленты». (в) Проба:
      строку извещения берёт notify-sender тем путём, которым NTF-3 Р19 берёт собственную ленту.
      Ack SENT ставит `notice_addressees.sent_at` и `sent_at` окна, счётчик SENT = 1. Близнец: Ack
      DEFER(ob_stream_pace) снимает резерв. Вторая строка той же нити тем же путём не выдаётся,
      пока первая в полёте.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF5-75, 95, 108 (нить) и NTF5-82, 83 (OB) покраснеют на сквозном прогоне; путь взятия собственной ленты в пробах C5 не назван — заказ"
  - id: CX5-56
    source: "З21 п.1 (наблюдатель регистрируется для всей ленты пространства notify и делает три вещи на каждом изменившем строку Ack); NTF-3 Р19 (в той же ленте строки credential-expiring и digest)"
    kind: new_mechanism
    class: "code-authoring §5.3 «Перечень входных поверхностей неполон» (вход наблюдателя — все строки ленты, а не только строки извещений); code-authoring §1.2 «Запасной путь, фабрикующий утверждение»"
    exposure: >-
      В собственной ленте notify лежат не только строки извещений, но и письма
      `notify/credential-expiring` класса security и `notify/digest` (NTF-3 Р19). Наблюдатель
      получит Ack и этих строк. Если он считает отсутствие `notice_addressees` по `feed_row_id`
      ошибкой, то откатывает Ack: строка security после конца аренды берётся снова, и письмо
      уходит повторно при каждом проходе. Если он увеличивает счётчик без строки адресата, то
      `notify_notice_letters_total` считает чужие письма, а ярлыков вида и этапа у них нет.
    condition: >-
      (а) Наблюдатель находит строку адресата по `feed_row_id` и берёт ярлыки вида и этапа из
      найденного извещения. Нет строки — нет действия и нет ошибки: счётчики, `sent_at` и окно не
      трогаются. (б) Если NTF-3 заводит свой наблюдатель на той же ленте, их композиция названа
      одной функцией, а не двумя регистрациями в одном поле. (в) Проба: Ack SENT строки
      credential-expiring — Ack успешен, `notice_counters` без изменений. Близнец: строка
      извещения — SENT +1.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "ни одна буква NTF5 не держит Ack чужой строки собственной ленты — заказ пробы"
  - id: CX5-57
    source: "З24 п.4, п.5 (`feed.DeleteUnleased(ctx, tx, feedIDs) (deleted, leased []string, err error)`; «id, которого уже нет, … не строка ответа»; извещения с арендованной строкой выходят из партии)"
    kind: new_mechanism
    class: "code-authoring §2 «Решение и его следствие разнесены» (решение «строка под арендой» и следствие «извещение удаляется каскадом» — на двух разных чтениях)"
    exposure: >-
      `leased` — не дополнение к `deleted`: пропавший id в ответ не входит. Значит, реализация
      вычисляет `leased` вторым чтением после DELETE. В READ COMMITTED между двумя операторами
      может зафиксироваться Ack этой строки: DELETE её пропустил, потому что аренда была, а второе
      чтение аренды уже не видит. Строка не удалена и не в `leased`. Её извещение удаляется
      каскадом, а строка ленты остаётся. Если это был DEFER, строка остаётся pending, и следующее
      взятие отправит письмо по извещению, которого уже нет. Атрибуты письма лежат в самой строке,
      поэтому рендер её не остановит.
    condition: >-
      (а) `DeleteUnleased` сначала блокирует все переданные строки одним оператором `SELECT … WHERE
      id = ANY($ids) ORDER BY id FOR UPDATE`. Затем делит заблокированные версии по
      `NoActiveLease`, удаляет свободные и возвращает `leased` = заблокированные минус свободные.
      Второго чтения аренды нет. Порядок по id — тот же, что у Supersede. (б) Проба C5 с
      управляемым порядком: Ack DEFER строки фиксируется между вызовом и возвратом (или строка
      уже заблокирована Ack, когда зовётся DeleteUnleased), и строка оказывается либо в
      `deleted`, либо в `leased`, но не вне обоих. Близнец: отсутствующий id — ни там ни там.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "проба C5 DeleteUnleased из §11 держит три статических случая, но не гонку с Ack — заказ"
  - id: CX5-58
    source: "З12 п.3 («корень — notice_addressees того же (notice, subject) с наименьшим sent_at»), §6 (`notice_addressees.sent_at`)"
    kind: sentinel
    class: "code-authoring §1.3 «Sentinel-коллизия: «не задано» и законное значение имеют одно представление»"
    exposure: >-
      `sent_at` NULL означает три разных состояния: «в полёте», «отложено» и «терминально не
      отправлено» (BOUNCED, INVALID, SUPERSEDED). Запрос «наименьший sent_at» через ORDER BY
      sent_at LIMIT 1 ставит NULL последним. Если строк SENT нет, он вернёт неотправленную строку,
      в том числе ту, что сейчас рендерится. Письмо получит In-Reply-To на Message-ID письма,
      которое не уходило. Это против Р13: «письмо, у которого корня ещё нет, само становится
      корнем». Ещё одна вещь: если `sent_at` усечён до секунды (З25), два SENT одной пары в одну
      секунду дают ничью, и корень выбирается от запроса к запросу по-разному.
    condition: >-
      (а) Запрос корня содержит `sent_at IS NOT NULL`. Нет строки — нет In-Reply-To и References.
      (б) `sent_at` пишется с полной точностью базы, без усечения: это внутреннее поле, а не
      ресурс. Порядок — (sent_at, id), детерминированно. (в) Проба: первое письмо пары без
      заголовков нити. Первое письмо BOUNCED, второе SENT — второе без заголовков. Третье письмо
      ссылается на второе.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF5-75, 95 держат In-Reply-To второго письма; случай «первое не SENT» не держит ни одна буква — заказ"
  - id: CX5-59
    source: "З11 п.3 («defer_for … DEFER(ob_stream_pace) — время до следующего жетона; оба ограничены сверху feed.MaxDefer»)"
    kind: sentinel
    class: "code-authoring §5 «Контракт, который нельзя выразить» (вычисленное значение вне допустимого диапазона принимающего контракта)"
    exposure: >-
      Ack NTF-1 принимает `defer_for` только в [feed.MinDefer..feed.MaxDefer] = [1 с, 15 мин]. Иначе
      INVALID_ARGUMENT до SQL (замысел NTF-1 774e8562, З9, строка 420; константы — строка 1221).
      Время до следующего жетона при `KACHO_NOTIFY_OB_STREAM_PER_MINUTE` в [60, 6000] (Р17,
      умолчание установки 600) — от 10 мс до 1 с. При умолчании это 100 мс. Каждый DEFER темпа
      отвергается, строка висит под арендой до `feed.LeaseTTL` = 5 мин и берётся снова. Темп потока
      падает на порядки, а резерв окна не снимается. В замысле `MinDefer` встречается 0 раз.
    condition: >-
      (а) `defer_for` обоих исходов OB вычисляется как clamp(значение, feed.MinDefer,
      feed.MaxDefer) одной функцией слоя лимитов. (б) Проба: темп 600 в минуту, ведро пусто — Ack
      DEFER принят с defer_for = 1 с, INVALID_ARGUMENT 0. Близнец: потолок адреса со старейшим
      резервом через 20 ч — defer_for = 15 мин.
    mapped_in_design: false
    outcome: к-коду
    held_by: "NTF5-82, 83 при двух репликах покраснеют по времени; прямой буквы о диапазоне defer_for нет — заказ"

