new_items:
  - id: CX5-68
    decision: "З23 п.5 — пятая форма аудитории Resolve: project_reader{project_id}"
    classes:
      - "code-authoring §«Умолчание, которое становится утверждением»: ветвление по форме аудитории без исчерпывающей проверки (exhaustive в .github/golangci.yml kaname не включён — измерено), новая форма может пройти мимо вопроса к модели"
      - "architecture §«Параллельные полосы одного механизма обязаны сверяться МЕЖДУ СОБОЙ»: account_reader и project_reader — один вопрос v_get к одной двери"
      - "code-authoring §«Контракт, который нельзя выразить»: одно поле входа на два смысла (AccountID для id проекта)"
    radius: >-
      `git grep -nE 'AudienceAccountReader|ResolveRecipientRequest_AccountReader' origin/484-notify
      -- '*.go' ':!pkg/api' ':!*_test.go'` → 6 строк в 3 файлах (handler.go отображение, input.go
      перечисление и два switch обязательности, resolve.go switch решения) — каждое место
      получает ветку project_reader.
    code_conditions:
      - "(1) В каждом из трёх ветвлений по форме аудитории (отображение транспорта, обязательность, решение) project_reader — явная ветка; в ветвлении решения нет группы «без вопроса», в которую попадает форма, требующая права."
      - "(2) Вопрос v_get — одна функция над объектом `<тип>:<id>`, общая для account_reader и project_reader (отказ двери → UNAVAILABLE, причина email_not_verified → NO_CONFIRMED_ADDRESS); копии readsAccount под проект нет."
      - "(3) Вход несёт отдельное поле ProjectID; AccountID для project_reader не заполняется."
      - "(4) Счёт отказов в шапке input.go («десять») перемерен под две новые строки (subject при project_reader, audience.project_reader.project_id)."
    held_by:
      - "(1) — буква (м) краснеет, если ветка решения пропущена (usr-x получил бы адрес); (л) — если пропущено отображение; (о), (п) — если пропущена обязательность"
      - "(2) — держится вниманием: буквы на отказ двери для project_reader в NTF5-68 нет; общая функция переносит на неё держатель account_reader"
      - "(3), (4) — вниманием; видно в диффе"
    mapped_to: "tasks K2 (условия (1)–(4) — к коду K2)"
