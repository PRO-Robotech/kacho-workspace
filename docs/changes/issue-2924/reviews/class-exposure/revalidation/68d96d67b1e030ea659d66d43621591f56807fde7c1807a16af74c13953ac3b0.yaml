    findings:
      - "P3 `grep -c '^\\s*rpc '` → 4 верно лишь на базе без X4e NTF-3 (X4e добавляет ListExpiringCredentials в тот же файл): на d93b69712 rpc = 2 (Resolve, ListEventAudience) → 2 + 2 = 4; после X4e — 5. Предикат — «число на базе + 2» с @ревизией базы."
      - "K1 предикат требует «база … зелёные», но база NTF5-68 утверждает и ListAccounts (отказ storage/notify-api, одна страница N) — метод реализуется в K2; на коммите K1 база красна построением. Половины базы по ListAccounts — в предикат K2 (там названа лишь ветка user:usr-op)."
      - "База ветки цепочки не названа: P3 «зависит от Е2 (посажены)», а файла контракта справочника на kaname origin/main нет (измерено); по заданию (и) PR — «#484 …», то есть ветка от головы origin/484-notify (fa-a5). Назвать базу и что значит Е2 для цепочки."
    mapped_to: "tasks P3, K1, K2 (правка маршрута; не механизм)"
