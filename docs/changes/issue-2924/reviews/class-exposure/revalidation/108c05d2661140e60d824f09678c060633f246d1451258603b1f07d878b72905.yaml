orders:
  - to: design author (NTF-5)
    what: >-
      Редакция 4 замысла:
      (1) З21 п.1 — ветка наблюдателя по классу строки из `feed.AckedRow`; окно OB — по
      `feed_row_id` независимо от строки адресата, одно утверждение вместо двух; `obligation` без
      адресата — учтённая аномалия, а не откат и не молчание (CX5-60);
      (2) З28 п.4 — гейт по разобранному SQL, а не по подстроке; закрытый перечень писателей
      состояния строки ленты с решением о наблюдателе у каждого; уточнение И24 (CX5-61);
      (3) З11 п.3 — отсрочка темпа с ограниченным числом возвратов на письмо (например,
      виртуальное расписание мест с резервом места по `feed_row_id`); смысл счётчика DEFER темпа
      (CX5-62);
      (4) З12 п.3 — источник `sent_at` адресата: часы базы в транзакции записи исхода или
      последовательность базы, а не порт часов процесса (условие к CX5-58, CX5-19);
      (5) §13 — «З1–З28 приняты»;
      (6) §11 — строки отображения CX5-60…62.
    basis: "SDD-1 §5 (точное отображение; новый sentinel или механизм — новый пункт); change-graph.md §4"
  - to: corelib implementer (NTF-5 S2)
    what: >-
      Гейт `notify/feed/entrypoints_test.go` по разобранному SQL с инъекцией писателя с
      переставленными столбцами и печатью объёма обхода (CX5-61).
    basis: "testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки»; ban17-gates (судит узел, а не образец)"
  - to: go implementer (NTF-5 notify)
    what: >-
      Пробы N10:
      `SENT` строки `obligation` без строки адресата — запись исхода успешна, аномалия +1, резерв
      окна стал записью; близнец `credential-expiring` — аномалия 0 (CX5-60);
      корень нити при двух репликах с расходящимися часами — корень первое SENT (CX5-58);
      1200 строк, темп 600 в минуту — транзакций слоя лимитов не больше 2·1200 + отсрочки дольше
      MaxDefer (CX5-62).
    basis: "gate-authoring §«отрицание только в паре с положительным»; testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки»"
