approval_conditions:
  # Пять условий: SDD-1 §5, CLASS-05, 08, 09, 10, DESIGN-02. Исход каждого — на отпечатке 108c05d2.
  # Шестое условие DESIGN_APPROVED — применимое ревью замысла — предмет следующего шага, здесь не судится.
  - condition: "каждый пункт первичного разбора отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: green
    detail: >-
      Строк отображения 60, уникальных пунктов 59 из 59. Из десяти пунктов, отображение которых
      изменила дельта (CX5-07, 19, 24, 52, 54, 55…59), не выдерживает ни один. CX5-54 выдерживает:
      наблюдатель — параметр функции записи исхода ядра, общей для обеих точек входа, и строки
      извещений идут точкой входа в процессе, где он вызывается. С условием к коду выдерживают
      CX5-19 и CX5-58: источник часов `sent_at` адресата не назван (см. mapping_check). Новые
      пункты CX5-60…62 этим условием не судятся — они в `unmapped`.
  - condition: "новый внешний вызов заведён пунктом и отображён (CG_CLASS_NEW_EXTERNAL_CALL)"
    result: green
    detail: >-
      Новых сетевых вызовов 0. `feed.NewLocal`, `claimTx`, `recordOutcome`, `validateAck`,
      `finishClaim`, `ComposeObservers`, `notice/outcome.Observe`, `thread.Root`, `limits.DeferFor`
      — вызовы в процессе к той же базе kacho_notify либо чистые функции.
  - condition: "новый асинхронный путь заведён пунктом и отображён (CG_CLASS_NEW_ASYNC_PATH)"
    result: green
    detail: >-
      Новых асинхронных путей 0. Точка входа в процессе — путь собственной ленты, названный
      приёмкой NTF-3 Р19 (M24); замысел даёт ему форму (З28), а не заводит. Её место — пункт CX5-55,
      и он отображён.
  - condition: "новое sentinel-значение заведено пунктом и отображено (CG_CLASS_NEW_SENTINEL)"
    result: red
    detail: >-
      `feed.NopObserver` и `feed.ErrNilObserver` (явное «наблюдателя нет» против забытого `nil`),
      признак `free` шага 1 `DeleteUnleased`, «строки корня нет → заголовков нет» в `thread.Root` —
      отображены строками CX5-55, CX5-57, CX5-58 и выдерживают.
      Не отображено одно: в `notice/outcome.Observe` отсутствие строки адресата по `feed_row_id`
      стало признаком «строка не извещения». Этим же значением представлена строка `obligation`,
      у которой строки адресата нет, — CX5-60. Текст замысла о действии с окном OB при этом
      значении противоречит сам себе (там же).
  - condition: "нет маркеров отсрочки и открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: red
    detail: >-
      Маркеров отсрочки нет: `grep -ciE 'TODO|TBD|FIXME|XXX|позже|потом|отлож|пока не'` даёт 20
      строк, из них «отложенн…» — исход DEFER, термин предмета; прочие 7 («не позже
      feed.LeaseTTL», «пока не получит исхода», «берётся позже», «позже T1, Х5, Х1») — описание
      поведения и порядка тегов. Красное — перечень принятых решений §13: «Открытых решений нет.
      З1–З27 приняты» (строка 1287), а решение З28 в замысле есть (строка 974) и в перечень не
      входит. По тексту §13 З28 не объявлено принятым. Правка — одна: «З1–З28». «Имя `Local` —
      рабочее» (З28 п.2) открытым решением не считается: предмет решён (точка входа — вызывающий
      ядра без своего SQL), имя зависит от соседа, и у зависимости есть предикат снятия (Е7).

mapping_check:
  # Судятся только строки, изменённые дельтой. Прочие 49 — как в пересверках на a43a19fa и 379efc2a.
  - id: CX5-07
    design: "З11 п.1–п.3, З28"
    verdict: holds
    note: >-
      Оба условия к коду прежней записи внесены: наблюдатель на пути строк извещений вызывается
      (`recordOutcome` ядра, `Local.Ack`), `defer_for` зажат `limits.DeferFor`. Цена формулы
      отсрочки темпа — отдельный пункт CX5-62, а не невыдерживание CX5-07: потолок и темп держатся.
  - id: CX5-19
    design: "З12, З28"
    verdict: holds-with-condition
    note: "условие к коду — источник часов `sent_at` адресата (см. CX5-58)"
  - {id: CX5-24, design: "З24", verdict: holds, note: "`leased` — из того же чтения, что решение об удалении (CX5-57)"}
  - {id: CX5-52, design: "З12 п.1, З10 п.4, З28, §4", verdict: holds, note: "голова нити — в операторе `claimTx`, общем для обеих точек входа"}
  - id: CX5-54
    design: "З21 п.1, З28, §4"
    verdict: holds
    note: >-
      (а) вызов только в ветке, изменившей строку, (б) счётчики одной функцией последним
      оператором — сохранены. (в) вызов теперь в `recordOutcome`, общей для `Server.Ack` и
      `Local.Ack`; строки извещений идут `Local.Ack` (NTF-3 Р19 на 88ad95c6, строка 1203 — M24).
      На пути строк извещений наблюдатель вызывается.
  - id: CX5-55
    design: "З28, З12 п.1, З21 п.1, §4, §10"
    verdict: holds
    note: >-
      (а) условие головы нити — в операторе `claimTx`, наблюдатель — параметр `recordOutcome`,
      точки входа без своего SQL; (б) §4 и §10 называют правку ядра; (в) проба C5 и N10 по пути
      `Local`. Держатель «один оператор» (З28 п.4) опознаёт операторы по подстроке — это пункт
      CX5-61, а не невыдерживание CX5-55: решение выражено, слаб его держатель.
  - id: CX5-56
    design: "З21 п.1"
    verdict: holds
    note: >-
      (а) нет строки адресата — нет действия и нет ошибки, ярлыки из извещения; (б) одна
      композиция `ComposeObservers`, одно поле; (в) проба `credential-expiring` с близнецом.
      Условие (а) прежней записи было неполным: оно не различало «строка чужого класса» и
      «строка `obligation` без адресата». Это ошибка прежней пересверки; исправленное условие —
      новый пункт CX5-60.
  - id: CX5-57
    design: "З24 п.4"
    verdict: holds
    note: >-
      Блокировка всех переданных строк одним `SELECT … WHERE id = ANY($ids) ORDER BY id FOR UPDATE`
      с признаком `free` в списке выборки, затем `DELETE` только свободных. Утверждение «строка,
      которую держала запись исхода, после её фиксации перечитывается в последней версии, и `free`
      считается по ней» верно для PostgreSQL в READ COMMITTED: перепроверка строки после ожидания
      блокировки исполняет план заново на новой версии, включая список выборки. `WHERE` условия
      аренды не содержит, поэтому строка, освобождённая записью исхода, возвращается, а не
      пропадает. `now()` — момент начала транзакции подметальщика; аренда, взятая позже, видна
      как действующая — ошибка в безопасную сторону (строка откладывает удаление).
  - id: CX5-58
    design: "З12 п.3, З25, §6"
    verdict: holds-with-condition
    note: >-
      (а) `sent_at IS NOT NULL`, (б) полная точность и порядок `(sent_at, id)`, (в) проба —
      выражены. Исключение из усечения гейт дерева не задевает: `TestOperationTimestampsAreTruncatedEverywhere`
      судит только сборки `operationpb.Operation{…}` (замер ниже), а `sent_at` на wire не
      выходит (в приёмке `sentAt` — 0 строк). Условие к коду: ЧЬИМИ часами пишется
      `notice_addressees.sent_at`, замысел не называет, а прочие моменты `notify` пишутся портом
      часов `notify` (З27 п.4, `$now`). Порядок корня — порядок фиксаций записей исхода одной пары,
      и они последовательны (голова нити). Часы двух реплик `notify-sender` этот порядок могут
      перевернуть: второе письмо, отправленное репликой с отстающими часами, получит `sent_at`
      меньше первого и станет корнем. Нужно: `sent_at` ставит база в транзакции записи исхода
      (`now()` этой транзакции; её начало позже фиксации исхода предыдущей строки пары, потому что
      вторая строка выдаётся только после неё), либо порядок корня берётся из последовательности
      базы, а не из часов процесса. Проба N10 на корень гоняется при двух репликах с разными
      часами.
  - id: CX5-59
    design: "З11 п.3"
    verdict: holds
    note: >-
      `limits.DeferFor` = зажим в `[feed.MinDefer, feed.MaxDefer]` константами пина, одна функция,
      модульная проба на пяти значениях и N10. Диапазон сверен с замыслом NTF-1 на ред. 3 и ред. 4
      (M26). Цена того, что все ожидающие строки возвращаются к ведру одновременно, — пункт CX5-62.

new_items:
  - id: CX5-60
    source: "З21 п.1 («Нет строки — нет действия и нет ошибки. … окно OB не трогаются»; «Снятие резерва окна OB привязано к feed_row_id … DELETE по ним — 0 строк без ошибки»), З11 п.1 (резерв — только `obligation`)"
    kind: sentinel
    class: "code-authoring §1 «Умолчание, которое становится утверждением» (отсутствие строки соединения принято за утверждение «строка не моя»); doc-truthfulness «два места об одном предмете»"
    exposure: >-
      Наблюдатель решает, «моя ли строка», по отсутствию строки `notice_addressees` с этим
      `feed_row_id`, а не по признаку самой строки ленты. Отсутствие тогда означает два состояния:
      «строка чужого класса» (`credential-expiring`, `digest`) — законно, и «строка `obligation`,
      у которой строки адресата нет» — нарушение инварианта И26, которое замысел исключает
      построением. Оба обрабатываются одинаково и молча: письмо ушло, счётчик `SENT` не вырос,
      резерв окна не стал записью и не снят. Нарушение инварианта незаметно ни в метрике, ни в
      журнале. Кроме того, текст о действии с окном при отсутствии строки противоречит сам себе:
      первый подпункт — «окно OB не трогается», третий — «`DELETE` по ним — 0 строк без ошибки»,
      то есть оператор выполняется. Реализация выберет одно из двух чтений.
    condition: >-
      (а) Наблюдатель различает строку по её собственному признаку: `feed.AckedRow` несёт класс
      строки (и шаблон), и ветка выбирается по нему. Не `obligation` — возврат `nil` без SQL к
      таблицам извещений. `obligation` — строка адресата обязана быть. (б) Резерв окна OB
      снимается или становится записью по `feed_row_id` независимо от поиска строки адресата: у
      резерва ключ — строка ленты, а не адресат. Текст З21 п.1 о действии с окном — одно
      утверждение. (в) `obligation` без строки адресата — не откат записи исхода (откат вернул бы
      отправленное письмо на повтор), а учтённая аномалия: счётчик
      `notify_notice_observer_orphan_total` и одна строка WARN без адреса. (г) Проба N10: `SENT`
      строки `obligation`, у которой строка адресата удалена фикстурой, — запись исхода успешна,
      аномалия +1, резерв окна стал записью. Близнец — `credential-expiring`: аномалия 0,
      `notice_counters` без изменений.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "проба N10 «credential-expiring» держит только законную сторону; случай «obligation без адресата» не держит ни одна буква — заказ"
  - id: CX5-61
    source: "З28 п.4 (гейт `notify/feed/entrypoints_test.go`: «строковая константа оператора взятия (`SET lease_token = gen_random_uuid()`) стоит только в `claimTx`, а записывающего оператора исхода (`SET recorded_kind`) — только в `recordOutcome`»), И24"
    kind: new_mechanism
    class: "code-authoring §7 «Инвариант и оснастка — это тоже прод-код» (страж судит по тексту, а не по идентичности); code-authoring §5.3 «Перечень входных поверхностей неполон» (писателей исхода больше, чем точек входа)"
    exposure: >-
      Гейт узнаёт второй оператор взятия и записи исхода по подстроке. Второй писатель, у которого
      столбцы стоят в другом порядке (`SET outcome_token = $T, recorded_kind = $k`) или иначе
      расставлены пробелы, гейтом не виден, и «один оператор» держится только внешним видом
      строки. Та же подстрока не отличает законных писателей состояния строки ленты помимо
      `recordOutcome`. По замыслу NTF-1 (ред. 4) их не меньше трёх: закрытие `INVALID(sealed_mismatch |
      key_unavailable)` после расшифровки — условный `UPDATE` с токеном аренды (строка 466);
      уборщик истечения — `SET state='expired', … recorded_kind = NULL` (строки 533–539); `Supersede`
      этого замысла (З8 п.5). И24 говорит «наблюдатель вызывается на каждой строке, изменённой
      записью исхода», но не говорит, какие из этих писателей — «запись исхода». Закрытие после
      расшифровки идёт мимо `recordOutcome`, и строка извещения, закрытая им, наблюдателя не
      получает.
    condition: >-
      (а) Гейт опознаёт оператор по разобранному SQL, а не по подстроке: каждый вызов
      `Exec`/`Query`/`QueryRow` пакета `feed`, чей оператор изменяет таблицу ленты, найден, и
      набор изменяемых столбцов (`lease_token`, `state`, `recorded_kind`) определён разбором.
      Инъекция — второй писатель с переставленными столбцами в `Local.Ack` — красный с именем
      функции. Гейт печатает число найденных операторов, пустой обход — красный. (б) Перечень
      писателей состояния строки ленты в пакете `feed` закрыт и назван в замысле: `claimTx`,
      `recordOutcome`, закрытие после расшифровки, уборщик истечения, `Supersede`,
      `DeleteUnleased`. У каждого указано, зовёт ли он наблюдатель, а если нет — почему это
      безопасно для строк извещений. Например: у строк `obligation` нет срока, поэтому уборщик их
      не закрывает; у строк извещений нет запечатанных атрибутов, поэтому закрытия после
      расшифровки у них нет — это утверждение с командой, а не вывод. (в) Гейт сверяет
      фактический набор писателей с этим перечнем в обе стороны.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "гейт З28 п.4 в заявленной форме пропускает переставленный оператор — нужен гейт по разобранному SQL; заказ"
  - id: CX5-62
    source: "З11 п.3 («сырое значение DEFER(ob_stream_pace) — время до следующего жетона»; «Нижний зажим темп не нарушает … Жетон за это время не расходуется»), З11 п.1 (одна строка ведра `notice_ob_stream_bucket` на установку), З21 п.1 (счётчик DEFER — строка `notice_counters`)"
    kind: new_mechanism
    class: "code-authoring §«Унификация и стоимость» (стоимость на строку против стоимости на страницу); code-authoring §2 «Решение и его следствие разнесены» (темп производителя и применения)"
    exposure: >-
      Отсрочка темпа у всех ожидающих строк одна и та же — «до следующего жетона», теперь не
      меньше `MinDefer` = 1 с. Поэтому каждую секунду к ведру возвращаются все N ожидающих строк, и
      жетон получают r из них (r — темп в секунду). Каждый возврат — взятие строки, транзакция
      слоя лимитов с замком адреса и записью в единственную строку ведра, `Ack DEFER` и
      увеличение строки счётчика. Все эти записи сериализуются на одной строке ведра. Возвратов на
      одно отправленное письмо — порядка N/r. Чтобы отправить N писем, нужно около N²/(2·r·1 с)
      транзакций слоя лимитов. При границах NTF5-83 (N = 1200, темп 600 в минуту, r = 10/с) это
      около 72 000 транзакций на 1200 писем. Кроме того, `notify_ob_deferred_total{reason="ob_stream_pace"}`
      считает возвраты, а не отложенные письма. Заявление «нижний зажим темп не нарушает» верно
      о темпе и ничего не говорит о цене. До редакции 3 было не лучше: 100 мс вместо 1 с дают
      цену в 10 раз выше.
    condition: >-
      (а) Число возвратов строки к слою лимитов на одно отправленное письмо ограничено
      постоянной, не зависящей от N. Например, ведро хранит момент следующего свободного места
      (виртуальное расписание), и строка при отсрочке занимает своё место: `defer_for` =
      `DeferFor(место − сейчас)`. При возврате в своё место строка проходит без нового жетона —
      резерв места идемпотентен по `feed_row_id`, как резерв окна. Место строки, закрытой мимо
      отправки (`SUPERSEDED`, удаление), освобождается той же транзакцией, что снимает резерв окна
      (З11 п.2), либо теряется, и тогда это названо: темп ниже, а не выше. (б) Счётчик DEFER темпа
      считает письма, а не возвраты, либо его подпись это называет. (в) Проба N10 по границам
      NTF5-83: 1200 строк, темп 600 в минуту — транзакций слоя лимитов не больше 2·1200 + число
      отсрочек дольше `MaxDefer`, за любую минуту принято не больше 600, через 2 минуты — ровно 1200.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "NTF5-83 держит темп и полноту, но не цену; буквы о числе транзакций слоя лимитов нет — заказ"

