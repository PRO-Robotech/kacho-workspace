#   (2) новые исходы и значения-метки, которые механизм вводит, заведены пунктом и отображены;
#   (3) условия к коду пересверки f32e0fe2 (Н1, Н3) отображены и выдерживают;
#   (4) маркеров отсрочки и открытых решений нет.
