mapping_check:
  - id: "К1 / CX5-62 — горизонт выдачи мест"
    design: "З11 п.1 шаг 4, «Место строки … не возвращается», «Цена горизонта»; п.3 «Проба горизонта»; §3 И29, И33; §8; §11 CX5-62, К1; §12; §13; tasks.md N10"
    verdict: holds
    note: >-
      Проверено по построению. (а) Граница: оператор пишет, только если `GREATEST(next_slot, $t) −
      $t ≤ H`, место `= GREATEST(next_slot, $t) ≤ $t + H`, после выдачи `next_slot ≤ $t + H +
      $interval`. Писатель `next_slot` один, поэтому граница стоит в одном месте. `$t`,
      прочитанный до ожидания блокировки ведра, может отстать от настоящих часов. Отставший `$t`
      делает условие только строже, а границу относительно настоящего `now ≥ $t` не ослабляет.
      (б) Довод «не голодание» п.1 верен: при отказе `next_slot > t + H` места в `(t, t + H]` идут
      подряд, потому что разрыв возникает только у места, равного моменту выдачи, то есть `≤ t`.
      Каждое такое место выдано не раньше `место − H > t − H`. Отсюда `≥ N·H / 1 мин − 1` выдач за
      `(t − H, t]`, и проба N10 п.1 это число утверждает. (в) И29 держится: при k отказах, выдаче
      места и отдельном проходе `tₚ − t₀ > k·MaxDefer`, значит `⌈…⌉ ≥ k + 1` и транзакций
      `k + 2 ≤ 1 + ⌈…⌉`. (г) Зажим И28 на исходе темпа строки с местом не срабатывает (`slot −
      $t ≤ H = MaxDefer`), отказ даёт ровно `MaxDefer`, и граница `[MinDefer, MaxDefer]` у `Ack`
      замкнута. (д) И30 не задет: горизонт только отказывает. (е) Цена «строки без места
      соревнуются с новыми» названа. Порядок взятия `ORDER BY enqueued_at, id` измерен M38 на
      NTF-1 ред. 10 с контролем предиката присваивания (`not_before` → 2). Возврат мест отвергнут
      доводом о перечне путей. Близнец-инъекция снимает один факт — условие горизонта. Есть
      положительный близнец и масштабный прогон. Условия к коду ниже механизм не меняют: они о
      форме пробы и предиката.
    code_conditions: >-
      (1) Предикат «писатель `next_slot` один» судит оператор записи, а не упоминание имени:
      `git grep -n 'notice_ob_stream_bucket'` считает и читателей, и константу с именем таблицы,
      через которую запись может уйти в другое место. Годится одно из двух: разбор SQL (как у
      `AuditFeedTableWrites`, CX5-61) с числом `UPDATE`/`INSERT`/`DELETE` строки ведра = 1 вне
      миграций, либо запрет имени таблицы вне литерала оператора шага 4 (константа с именем —
      находка). Второй близнец пробы предпосылки — запись через константу с именем таблицы в
      другом пакете — красный. (2) Числа пробы горизонта (901, 9001, `15 мин 0,1 с`, 299)
      вычисляются в тесте из `feed.MaxDefer` и `$interval`, а не записаны литералами: `H`
      привязан к константе соседа (M38 — `MaxDefer = 15m` на NTF-1 ред. 10), и при её смене
      литералы разойдутся с кодом молча. (3) Масштабный прогон (100 000 строк) печатает и
      утверждает И29 на масштабе: сумма транзакций слоя ≤ Σ(1 + ⌈ожиданиеᵢ / MaxDefer⌉). Отказы
      по горизонту возвращают строки одной волной через `MaxDefer`, каждая волна проходит шаги 3–4
      (счёт потолка и ожидание блокировки ведра, а не дешёвый шаг 2). Общее число транзакций на
      всплеск растёт сверхлинейно: около `n² / (2·N·H)` при `n ≫ N·H`, примерно 5·10⁵ на 100 000
      строк против 2·10⁵ без горизонта. Это цена, и её надо видеть числом прогона, а не выводом.
  - id: Н1
    design: "§8 «Сроки вызовов kaname»; §11 строка Н1; tasks.md N3, N9"
    verdict: does_not_hold
    note: >-
      Условия пересверки f32e0fe2 внесены полностью: проба кратности со 100 областями, близнец —
      одна область, проба предпосылки «аренда меньше суммы»; константа срока одна на пакет;
      предикат `context.WithTimeout` в `services/notify/internal/clients/` → 0 с числом
      осмотренных файлов. Для `DescribeScope`, `ListAccounts`, `Resolve` отображение выдерживает.
      Не выдерживает перечень: `ResolveSend` назван среди вызовов «под константой пакета `admit`
      либо `fanout`», но его место вызова — общий конвейер NTF-1 (приёмка, строка 644). Пакет
      конвейера этой под-фазе не принадлежит (§12: в `feed` правится только названное), а замысел
      NTF-1 срока не называет. Предикат «клиент срока не ставит» в сумме с этим даёт вызов
      `ResolveSend` без срока ни на одном уровне. Это прямо противоречит Д29 («сроки на вызовы
      kaname обязательны»), а все держатели Н1 зелёные.
    code_conditions: >-
      Исправление в замысле — одно из двух. (а) Перечень §8 сужается до вызовов этой под-фазы
      (`DescribeScope`, `ListAccounts`, `Resolve`), а `ResolveSend` назван зависимостью от NTF-1:
      строка §13 (Е-строка) с предикатом снятия «в замысле NTF-1 у вызова `ResolveSend` назван срок
      и его держатель» и заказ автору NTF-1. (б) Срок `ResolveSend` ставит место, которым владеет
      эта под-фаза, и тогда назван пакет, константа и проба «заглушка молчит на `ResolveSend` —
      `DeadlineExceeded` в пределах срока». Предикат клиента дополнительно ищет
      `context.WithDeadline`: срок, поставленный им, `WithTimeout`-предикат не видит.
  - id: Н2
    design: "З11 п.2; §11 строка Н2"
    verdict: holds
    note: "Потеря места строки из цены Н2 отнесена к границе И33. Верно: граница горизонта не различает, каким путём закрыта строка."
    code_conditions: "—"
  - id: Н3
    design: "§8 «Серверные пределы транзакций kacho_notify»; §11 строка Н3; tasks.md N10"
    verdict: holds
    note: "Предикат ищет обе формы и печатает обе величины: `pgxpool.New`/`NewWithConfig` вне тестов → 0, `NewPool(` → по одному на корень `notify-api`, `notify-sender`. Условие f32e0fe2 исполнено дословно."
    code_conditions: "—"
  - id: "прежние отображения CX5-01…66 (кроме CX5-62)"
    design: "§11"
    verdict: holds
    note: "Word-diff §11 затрагивает только строки CX5-62, К1, Н1, Н2, Н3 и итог. В N3, N9, N10 условия дописаны, прежние пробы не сняты."
    code_conditions: "—"

new_items:
  - id: CX5-67
    decision: "З11 п.1 шаг 4: «оператор вернул 0 строк — горизонт занят», исход `DEFER(ob_stream_pace)` на `MaxDefer`"
    class: "code-authoring §«Умолчание, которое становится утверждением» (третий исход «не смог спросить» слит с ответом)"
    exposure: >-
      Ноль строк у `UPDATE … WHERE id = 1 AND <горизонт> RETURNING` получается двумя путями:
      горизонт занят либо строки ведра `id = 1` нет. Строку ставит посев миграцией (§6). Её
      отсутствие (частичное восстановление, ручная правка, будущая миграция) редакция 10 читает как
      «горизонт занят». Тогда каждое письмо `obligation` уходит в отсрочку на `MaxDefer` навсегда, в
      том числе `OUTAGE` и `SECURITY_INCIDENT`. Исход и счётчик `notify_ob_deferred_total{reason=
      "ob_stream_pace"}` при этом ровно те же, что при законной перегрузке. В той же транзакции уже
      есть второй «ноль строк» с другим смыслом: шаг 2, «резерва нет — идти дальше». Классификация
      по `pgx.ErrNoRows` на уровне транзакции спутала бы эти смыслы.
    code_condition: >-
      Значение «горизонт занят» производится только в месте вызова оператора шага 4, и только если
      строка ведра доказанно существует и нарушает горизонт. Способ выбирает замысел. (а) На нуле
      строк — `SELECT next_slot FROM notice_ob_stream_bucket WHERE id = 1` в той же транзакции:
      строки нет — ошибка слоя (громко, `INTERNAL` фиксированным текстом, журнал), а не `DEFER`;
      строка есть и `next_slot − $t > H` — горизонт занят. (б) Отсутствие строки невыразимо
      конструкцией базы, и довод о невыразимости выписан. `CHECK (id = 1)` отсутствия строки не
      запрещает. Ошибка `ErrNoRows` шага 2 и нуль шага 4 не сводятся к одной ветке.
    held_by: >-
      Нужна проба N10 «строки ведра нет» (фикстура удаляет посеянную строку): транзакция слоя
      возвращает ошибку, исход не `DEFER`, счётчик отсрочек без изменений. Близнец — строка есть,
      `next_slot = $t + H + 1s`: `DEFER(ob_stream_pace)` на `MaxDefer`. Сегодня в замысле нет ни
      условия, ни пробы.
    mapped: false

