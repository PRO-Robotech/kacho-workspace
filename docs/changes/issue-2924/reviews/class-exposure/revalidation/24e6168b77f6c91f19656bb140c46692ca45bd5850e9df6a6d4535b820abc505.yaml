  - "CX5-67 — новый пункт: «горизонт занят» производится нулём строк оператора, который даёт ноль и при отсутствии строки ведра; нужен признак присутствия (З11 п.1 шаг 4) и проба с близнецом"
  - "Н1 (часть `ResolveSend`) — отображение не выдерживает: вызов назван «под константой пакета `admit` либо `fanout`», но зовётся общим конвейером NTF-1, у которого срока нет"
return_to_acceptance: []
return_to_acceptance_note: "Пусто: приёмка верхнюю границу задержки письма `obligation` не утверждает, а срок `ResolveSend` и присутствие строки ведра — предметы замысла."

orders:
  - to: автор замысла issue-2924
    what: >-
      (1) З11 п.1 шаг 4 и §11: строка CX5-67 — «горизонт занят» только при доказанном присутствии
      строки ведра (чтение в той же транзакции либо довод о невыразимости отсутствия), отсутствие —
      громкая ошибка слоя, а не `DEFER`; проба N10 «строки ведра нет» с близнецом; строка в N10.
      (2) §8 и §11 Н1: `ResolveSend` — либо сузить перечень до вызовов этой под-фазы и завести
      зависимость от NTF-1 с предикатом снятия, либо назвать место и константу срока; предикат
      клиента дополнить `context.WithDeadline`. (3) Строка К1 и N10: условия к коду (1)–(3)
      mapping_check К1 — предикат писателя по оператору записи, числа пробы из `feed.MaxDefer`,
      И29 на масштабе числом. Механизма заход не вводит; следующая пересверка судит только эти
      строки и дельту.
    basis: "code-authoring §«Умолчание, которое становится утверждением», §«Чужой ответ: классификация и бюджет», §«Инвариант и оснастка — это тоже прод-код», §«Унификация и стоимость»; change-graph.md §4"
  - to: автор замысла NTF-1 (issue-2915)
    what: "Срок вызова `ResolveSend` из общего конвейера и его держатель («заглушка молчит — `DeadlineExceeded` в пределах срока»), если NTF-5 выберет вариант (а)."
    basis: "code-authoring §«Чужой ответ: классификация и бюджет»; решение Д29 (Н1)"
