mapping_check:
  - id: CX5-66
    design: "З28 п.4 «Исполнитель места — функция-владелец места», инъекции «Близнецы исполнителя места»; §11; tasks.md C5"
    verdict: holds
    note: >-
      Выбран вариант (а), исключение (б) — по описанию, а не по имени, близнецы (в) названы, (г)
      отвергнут. Сохранённый текст, возврат и передача иной функции для мест, пишущих столбцы исхода,
      аренды или `state`, — красный с координатой. Функция-владелец места и есть исполнитель, поэтому
      исключительность по владельцу становится исключительностью по исполнителю. Исключение
      безопасно: описание сверяется с разобранным текстом в обе стороны (ред. 6), и назвать запись
      «только `DELETE`» при `UPDATE … SET state` нельзя. Правило держится, но у формулировки,
      которую пересверка на 112ccca0 дала сама и которую автор перенёс дословно, три щели. Все три
      закрываются условиями к коду ниже, новых механизмов для них не нужно.
    code_conditions: >-
      (1) **`Batch.Queue` исполнителем не считается.** C5 требует, чтобы в пакетах с местами вызовов
      `SendBatch` было 0. Значит, текст, поставленный в очередь пакета, исполняет функция за пределами
      пакета — это и есть второй исполнитель. Место записи исхода, аренды или `state` внутри
      `Batch.Queue` — красный с координатой, как сохранение. Инъекция: `b.Queue(fmt.Sprintf(… recorded_kind
      = $k …))` в `recordOutcome` — красный; близнец — тот же текст в `tx.Exec` — молчит.
      (2) **Место уборщика истечения NTF-1 подпадает под правило (а).** Оператор З10 NTF-1 ставит
      `state`, `outcome_token`, `recorded_kind`, `recorded_reason`. Замысел NTF-1 (ред. 7, строки
      626–640; ред. 8, УК90) запрещает сохранять только результат `tablename.Of`, а текст `Sprintf`
      разрешает посчитать один раз до цикла пачек. Уборщик, написанный полосой C10 NTF-1 в такой
      форме, по правилу (а) красный, и близнец CX5-61 «гейт молчит на теге T2 с местом уборщика»
      не выполнится. Условие: C5 проверяет форму места уборщика на теге T2. Если текст вынесен из
      вызова `Exec`, C5 возвращает его в вызов тем же коммитом, потому что пакет `notify/feed` и так
      правится C5. В З28 п.4 это названо как требование к месту уборщика, а автору NTF-1 правило
      передано заказом (orders).
      (3) **Литерал функции с местом записи не уходит из функции-владельца.** По УК93 NTF-1 ред. 8
      владелец места — ближайшее объемлющее объявление функции. Текст можно поставить прямо в `Exec`
      внутри литерала функции, а сам литерал вернуть, присвоить или передать не исполнителю
      транзакции. Тогда исполнитель снова другой. Условие: литерал, содержащий место записи исхода,
      аренды или `state`, допустим только аргументом вызова, исполняющего транзакцию, в том же
      выражении (`pgx.BeginFunc`/`BeginTxFunc` — по типу). Присваивание, возврат и иной аргумент —
      красный с координатой. Инъекция: `recordOutcome` возвращает `func(pgx.Tx) error` с `tx.Exec(ctx,
      fmt.Sprintf(…))` — красный; близнец — тот же литерал аргументом `pgx.BeginFunc` — молчит.
  - id: CX5-61
    design: "З28 п.4 «Условия к коду CX5-61 пересверки на 112ccca0», инъекции; §11; tasks.md C5"
    verdict: holds
    note: >-
      Все три условия пересверки на 112ccca0 внесены дословно по смыслу, у каждого проба и близнец.
      «Место не судимо» — красный теста с именем функции-владельца, близнец `%s` молчит.
      Взаимно-однозначное сопоставление — инъекция по `DeleteUnleased`, близнец — ведомость и места
      как на теге. `%%` — не глагол, `LIKE 'x%%'` судится. Близнец строки §11 для `%%` («`%d` рядом с
      `Of` — место не судимо») отличается от отрицательного случая не одним фактом. Судить этим он не
      мешает, но точный близнец — тот же оператор с `LIKE 'x%'`, собранный без `Sprintf`: исполнитель
      проверки выберет форму сам.
    code_conditions: "—"
  - id: CX5-63
    design: "§11 (строка CX5-63, условие к коду пересверки на 112ccca0); tasks.md N10"
    verdict: holds
    note: >-
      Сбой прохода не откатывает партию З24 и не прерывает такт. Сбой считается и пишется в журнал
      без адреса. Круги за такт ограничены, остаток добирает следующий такт. Обе пробы названы с
      близнецами. Текст З11 п.5 не правился — по Д26 условие живёт в §11 и в N10, этого достаточно.
    code_conditions: >-
      Счёт сбоев назван в §11 и в N10 («счёт сбоев +1»), а метрики не названо, и проба утверждает
      величину без имени. Условие: полоса N10 заводит счётчик с именем по форме `notify_…_total` и
      вносит его в перечень метрик замысла рядом с `notify_notice_observer_orphan_total`. Р19 перечень
      метрик закрытым не объявляет, возврата в приёмку нет. Предел кругов — константа кода, а не
      ручка: ручки без читающего и без стража З-решениями не заведено.

