orders:
  - to: corelib implementer (NTF-5 C5)
    what: >-
      Гейт `notify/feed/entrypoints_test.go`, правило «исполнитель места — функция-владелец места»:
      (1) `Batch.Queue` исполнителем не считается — место записи исхода, аренды или `state` в
      `Batch.Queue` красный (близнец — `tx.Exec`); (2) место уборщика истечения NTF-1 на теге T2 — в
      форме «`Sprintf` непосредственным аргументом `Exec`», если нет — вернуть в вызов тем же
      коммитом; (3) литерал функции с таким местом — только аргументом исполнителя транзакции в том
      же выражении (инъекция «`recordOutcome` возвращает литерал» — красный, близнец —
      `pgx.BeginFunc` — молчит).
    basis: "code-authoring §«Инвариант и оснастка — это тоже прод-код»; gate-authoring «отрицание только в паре с положительным»; testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки»"
  - to: kacho implementer (NTF-5 N10)
    what: "Счётчик сбоев прохода `SweepWindow` получает имя `notify_…_total` и строку в перечне метрик замысла; предел кругов за такт — константа кода; пробы N10 утверждают счётчик по имени."
    basis: "code-authoring §«Решение и его следствие разнесены»; security-hardening hard-zero-refusals-visible"
  - to: dispatcher
    what: >-
      (а) Автору NTF-1: правило NTF-5 З28 п.4 (вариант (а) CX5-66) ограничивает форму места уборщика
      истечения — текст `Sprintf` исполняется в том же выражении, а не сохраняется до цикла пачек.
      Это стоит внести в C10 NTF-1, чтобы C5 не правил чужой код. (б) Редакция 8 NTF-1 (`dba7c388`)
      меняет вход Е6/CX5-65: `tablename.Of` вне `Sprintf` в `retention.Subject.Name` и владелец места
      по УК93. Исключение (б) CX5-66 опирается на форму ред. 7 («место `feed.RetentionSubjects`»).
      Когда ред. 8 установится, нужна пересверка этого замысла на новый отпечаток NTF-1, как требуют
      Е6 и CX5-65. (в) §0, M24, M27, Е2 — при следующей правке замысла перемерить на коммите
      редакции: NTF-3 там уже ред. 27 `0ce5883b`, записи нет, строка M24 — 1512. На выводы это не
      влияет, но это третий подряд случай того же класса.
    basis: "change-graph.md §4 (правка соседа — пересверка); measurement-discipline §«Форма числа» (ревизия замера — коммит документа)"
