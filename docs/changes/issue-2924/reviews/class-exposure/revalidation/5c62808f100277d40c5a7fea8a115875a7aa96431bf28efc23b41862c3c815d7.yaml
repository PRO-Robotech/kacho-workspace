orders:
  - to: design author (NTF-5)
    what: >-
      Редакция 6 замысла:
      (1) З28 п.4, п.6, п.7 и §13 — выбрать и назвать одну форму для CX5-61. Форма первая: гейт
      судит место `fmt.Sprintf` с `tablename.Of`, разбирая литеральную форматную строку с
      подставленными идентификаторами, а набор столбцов и класс значения — колонки единой ведомости
      `AuditFeedTableWrites` NTF-1 (в неё входят `claimTx`, `recordOutcome`, `Supersede`,
      `DeleteUnleased`). Условие (iv) держится без константы имени таблицы в kacho. Форма вторая:
      решение NTF-1 о константах и экспортируемой функции — с предикатом снятия в Е6. Строка §13
      автору NTF-1 приводится к выбранной форме;
      (2) Е8 и M32 — предикат снятия по механизму (запись ограды `recipient_key_fence`), с
      контролем на ред. 6 и ред. 7 NTF-1 (CX5-65);
      (3) §0, M18, M26, M29, M33, M35 — на ред. 7 NTF-1 (8d01a10e) с её номерами строк; §0, Е2, Е3 —
      NTF-3 97afc066 `APPROVED`, NTF-4 cb947e50 `APPROVED`. Сверить З16/З18 с ред. 21 NTF-4
      (обязательства `notify-api`);
      (4) З11 п.7 — назвать, в какой транзакции идёт уборка окна п.5 и сколько мест зовут `DBClock`;
      (5) §11 — переписанная строка CX5-61 и строка CX5-65.
    basis: "SDD-1 §5 (точное отображение; новый механизм — новый пункт); change-graph.md §4; measurement-discipline §«Предикат — только с контролем»; doc-truthfulness «два места об одном предмете»"
  - to: dispatcher
    what: >-
      Строка NTF-5 §13 требует от автора NTF-1 «все операторы ленты — константы с заполнителем,
      подставляемым одной функцией». Замысел NTF-1 ред. 5–7 устроен противоположно: `tablename.Of`
      во внутреннем пакете, `fmt.Sprintf`, константа со суффиксом — находка. У двух замыслов две
      ведомости писателей одной таблицы в двух гейтах corelib. Решение о форме — общее для NTF-1 и
      NTF-5 (З16 NTF-1 ↔ З28 NTF-5), пересверку NTF-5 оно перезапускает.
    basis: "doc-truthfulness «два места об одном предмете»; ban20 (один предмет — одно место)"
  - to: corelib implementer (NTF-5 S2)
    what: >-
      В какой бы форме ни был выбран гейт писателей ленты: положительный близнец — дерево,
      написанное по действующему замыслу NTF-1 (оператор уборщика в его форме сборки текста), гейт
      молчит; отрицательный — тот же оператор с `recorded_kind = $k`, красный. Проба C5 «`Supersede`
      строки с истёкшей, но не снятой арендой — поздний `Ack` → `LEASE_LOST`». Значение `superseded`
      в `CHECK` и `outcome_pair` вводится новой версией `notify/feed/schema`, а не правкой применённой
      миграции.
    basis: "testing.md §«Гейт на класс: измерить по дереву, доказать инъекцией, снабдить проверкой предпосылки»; gate-authoring «отрицание только в паре с положительным»; ban05"
  - to: go implementer (NTF-5 notify)
    what: >-
      Прогон гейта NTF-1 `AuditFeedTableWrites` на дереве kacho с миграцией отметок N7 (внешний ключ
      на таблицу ленты): находок SQL — 0. Проба N10 на границе окна 24 ч на часах `DBClock`.
    basis: "data-integrity db-fk-same-db; gate-authoring «исход вместо объявления»"
