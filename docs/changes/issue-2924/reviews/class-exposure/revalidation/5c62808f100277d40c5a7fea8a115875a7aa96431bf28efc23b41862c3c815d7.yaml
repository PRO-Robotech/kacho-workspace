      1614), последнее решение — З28 (строка 1178).

mapping_check:
  # Судятся только строки, изменённые дельтой. Прочие — как в пересверках на a43a19fa, 379efc2a, 108c05d2, 58e29da9.
  - id: CX5-61
    design: "З28 п.4, п.6, п.7, З8 п.5, §3 И24"
    verdict: does-not-hold
    note: >-
      Выдержаны все три требования пересверки на 58e29da9. (1) У каждой из восьми строк
      перечня — закрытый набор столбцов с классом значения. Строка уборщика совпадает с M33:
      семь целей `SET`, три `NULL`, это подтверждено на ред. 6 и ред. 7 NTF-1. У `Supersede`
      назван оператор, и `secret_attrs`/`outcome_at` выведены из `CHECK` ленты (M35). (2)
      Исключительность записана по значению. (3) Близнецы сформулированы: уборщик дословно — молчит,
      `recorded_kind = $k` — красный. Условия (i)–(iv) внесены.
      Не выдерживает форма, в которой всё это исполнено: она не совместима с тем, как замысел NTF-1
      строит те же операторы. Его З16 «Перепись писателей таблиц ленты» (ред. 5–7) делает три вещи.
      Первое: имя таблицы производит `tablename.Of(svc, kind)` во внутреннем пакете
      `notify/feed/internal/tablename`, чтобы вне поддерева `notify/feed` имя собрать было нельзя.
      Второе: результат `Of` допустим только аргументом `fmt.Sprintf` с литеральной форматной
      строкой в том же вызове. Третье: строковая константа со суффиксом `_notification_…` вне
      `tablename` — находка. Отсюда четыре следствия.
      (а) Аргумент SQL у `Exec` в дереве NTF-1 — результат `fmt.Sprintf`, а не константа. Поэтому
      правило З28 п.4 «не разрешимый в константу — находка "не судим"» даёт находку на каждом
      операторе ленты, в том числе на операторе уборщика. Положительный близнец «на теге молчит»
      невыполним. Это тот же класс, что в ред. 4: правило гейта не выдерживает законного
      оператора соседа.
      (б) Экспортируемая `feed.TableSQL` и обход «все пакеты, использующие её объект» отменяют решение
      NTF-1 о том, что имя вне `notify/feed` не собрать. Со стороны NTF-1 согласия на это нет:
      строка §13 автору NTF-1 («все операторы — константы с заполнителем») стоит с ред. ≤ 4, а NTF-1
      ред. 5–7 ушла в противоположную форму. Число вызовов `tablename.Of` в тексте NTF-1 растёт:
      ред. 3 — 0, ред. 4 — 0, ред. 5 — 6, ред. 6 — 10, ред. 7 — 15.
      (в) G3 (З28 п.7) берёт имя таблицы из «константы конфигурации, которую корень `notify-sender`
      передаёт в `feed.NewLocal`». В модели NTF-1 корень передаёт `svc`, а не имя таблицы.
      Строковая константа со суффиксом `_notification_outbox` в kacho — находка `AuditFeedTableWrites`
      (NTF-1 печатает «kacho — 0»). Держатель условия (iv) либо не найдёт источника имени, либо
      покраснит соседний гейт.
      (г) Две ведомости об одном предмете. Перечень З28 п.6 (восемь писателей со столбцами) и
      ведомость `AuditFeedTableWrites` (мультимножество мест по функции-владельцу, `corelib/treehygiene`)
      судят одних и тех же писателей в двух пакетах corelib. В ведомости NTF-1 нет `claimTx`,
      `recordOutcome`, `Supersede`, `DeleteUnleased`, а закрытие после расшифровки там — свой
      оператор (M29). Посадка S2 без правки ведомости NTF-1 даст «место вне ведомости», а замысел
      эту правку не называет.
      Что нужно, одно из двух, названное в З28 п.4, п.6, п.7 и в §13:
      (1) Гейт З28 п.4 принимает форму NTF-1. Единица — место `fmt.Sprintf` с вызовом
      `tablename.Of`, как у УК92. Текст для разбора — литеральная форматная строка, где `%s` и
      `%[n]s` подставлены фиксированными идентификаторами по виду из аргумента `Of`. Обход берётся по
      объекту `tablename.Of`, то есть только поддерево `notify/feed`. Класс значения и набор
      столбцов становятся колонками ведомости `AuditFeedTableWrites` либо читаются гейтом из неё:
      ведомость одна, и в неё тем же изменением входят `claimTx`, `recordOutcome`, `Supersede`,
      `DeleteUnleased`, а закрытие после расшифровки перестаёт быть своим местом. G3 держит условие
      (iv) без константы имени. Вариант первый: его держит сам `AuditFeedTableWrites` на дереве
      kacho — «вызовов `Of` 0, констант со суффиксом 0, SQL-операторов записи со суффиксом 0», и
      остаток «имя, собранное во время исполнения» назван так же, как у NTF-1. Вариант второй: G3
      ищет суффикс ленты в разобранных операторах, а не имя из конфигурации.
      (2) Либо NTF-1 принимает форму «константы с заполнителем и экспортируемая функция». Тогда
      это решение соседа, а не строка §13, и зависимость Е6 получает предикат снятия по нему:
      `grep -c 'tablename.Of'` по одобренному замыслу NTF-1 → 0.
      В обоих случаях Е6 дополняется условием о модели имени таблицы, и пересверка перезапускается,
      если NTF-1 модель сменит.
    code_conditions: >-
      Выдерживающая часть: оператор `Supersede` не пишет столбцы аренды. Строка ленты, взятая с
      истёкшей арендой, закрывается с `lease_token <> NULL`. Опасности в этом нет: `recordOutcome`
      требует `state = 'pending'`, и поздний `Ack` прежнего держателя получит `LEASE_LOST`. Проба C5
      «`Supersede` отложенной строки — повтор `Ack DEFER` → `LEASE_LOST`» должна включать и строку с
      истёкшей, но не снятой арендой.
  - id: CX5-63
    design: "З11 п.1, п.7, З25, З27 п.4, §3 И9, И30, §6"
    verdict: holds
    note: >-
      Выдача места и проход берут один `$t` из порта `limits.Clock`. `$t` читается один раз и после
      замка адреса. Боевая реализация одна — `DBClock` (`clock_timestamp()`). Порт часов процесса
      слою не подаётся по сигнатуре, а число реализаций в не-тестовом дереве держит G3. `$t`,
      прочитанный до замка строки ведра, к моменту шага 4 может устареть. Это смещает место и
      проход только позже: `GREATEST(next_slot, $t)` монотонен, а проверка `$slot <= $t` при
      меньшем `$t` строже. Граница при смене первичного узла базы названа. Проба N10 с пробой
      предпосылки на часах процесса умеет покраснеть. Обвязка приёмки — интеграционные тесты
      `services/notify` (приёмка, строка 1639), поэтому адаптер управляемых часов законно живёт
      только в тестовом дереве.
    code_conditions: >-
      «`DBClock` зовут ровно два места» (З11 п.7) и «записи окна старше 24 ч снимает тот же слой
      пачкой по тем же часам» (п.5) не сведены. Возможны два исполнения. Если уборка окна идёт в
      транзакции слоя, она берёт тот же `$t` и нового вызова не добавляет. Если в своей
      транзакции, это третий вызывающий `DBClock`, и текст п.7 тем же изменением его называет. Проба
      N10 «запись окна с `reserved_at` = `$t − 24h − 1s` снята, `= $t − 24h + 1s` осталась» — на
      часах `DBClock`.
  - id: CX5-64
    design: "З11 п.4, З24 п.6, §6, §3 И32"
    verdict: holds
    note: >-
      Три места говорят одно. Внешний ключ `feed_row_id REFERENCES` таблицы собственной ленты
      `ON DELETE CASCADE` лежит внутри одной базы одного сервиса (ban #4 не задет). Ключ ленты — `id
      text PRIMARY KEY`, это подтверждено на ред. 6 и ред. 7 NTF-1 (M35). Каскад пользуется
      ведущей колонкой PK `(feed_row_id, reason)`. Вставка отметки наблюдателем идёт в транзакции
      записи исхода, где строка ленты уже заперта `UPDATE`. Проверка внешнего ключа берёт
      `FOR KEY SHARE` и с ним совместима, а `DeleteUnleased` строку под арендой не удаляет. Для
      окна OB причина отказа от внешнего ключа названа. Проба с близнецом названа.
    code_conditions: >-
      DDL таблицы ленты строит `notify/feed/schema` через `notifygen init`, файлы версий схемы
      сверяются с ведомостью NTF-1 по отпечатку. Миграция отметок (N7) ссылается на имя таблицы
      литералом в `.sql`. Правило SQL в `AuditFeedTableWrites` судит только операторы записи,
      функции и `DO`, поэтому `REFERENCES` в DDL находкой не станет, но это нужно подтвердить
      прогоном гейта NTF-1 на дереве kacho с миграцией N7: «находок SQL — 0». Значение `superseded`
      в `CHECK` состояния и `outcome_pair` вносит новая версия схемы `notify/feed/schema`, а не
      правка применённой миграции (ban #5).

new_items:
  - id: CX5-65
    source: "§13 Е8 (предикат снятия: «`grep -c` M32 по NTF-1 даёт 0 (NTF-1 приняла отказ старта) — зависимость снята»), §0 M32, разбор Д23 в шапке"
    kind: new_mechanism
    class: "measurement-discipline §«Предикат — только с контролем»; code-authoring §«Умолчание, которое становится утверждением» (ноль совпадений фразы прочитан как факт о модели); doc-truthfulness «утверждение, пережившее свой предмет»"
    exposure: >-
      Предикат снятия Е8 ищет фразу, а не модель, и уже ошибся на дереве, где лежит сама
      редакция 5. На коммите 1de812f34 замысел NTF-1 — ред. 7 (8d01a10e, коммит b3ba899f4 — предок).
      `grep -c 'последняя стартовавшая реплика задаёт'` даёт на нём 0. Модель при этом не
      сменилась: ограда `recipient_key_fence` с записью `ON CONFLICT (singleton) DO UPDATE` на
      старте осталась (строка 1173), а фраза переставлена — «Действующий ключ задаёт последняя
      стартовавшая реплика» (строка 1174). По букве Е8 зависимость уже снята, и пересверка при
      смене модели не случится. Цена ложного снятия — транзакция слоя лимитов OB без ограды ключа
      (`hashtext($h)` и счёт окна по `address_hash` при двух ключах). Потолок `obligation` на адрес
      тогда делится на два независимых окна.
    condition: >-
      (а) Предикат снятия Е8 судит модель по её механизму, а не фразу. Два варианта: строка
      «зависимость жива», пока в одобренном замысле NTF-1 есть запись ограды ключа — `grep -c
      'recipient_key_fence'` больше 0; либо предикат читает поле решения, которое называют оба
      соседа. (б) Контроль в обе стороны записан в М32. На ред. 6 и ред. 7 NTF-1 предикат даёт «жива».
      На тексте, где ограды нет, он даёт «снята». (в) §0 и M32 переводятся на редакцию NTF-1, которая
      лежит в дереве на коммите замысла (сейчас ред. 7, 8d01a10e), с её номерами строк.
    mapped_in_design: false
    outcome: к-замыслу
    held_by: "ни одна буква; предикат снятия зависимости сам по себе не проверяется — заказ автору замысла"

