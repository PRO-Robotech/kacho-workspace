approval_conditions:
  # Пять условий: SDD-1 §5, CLASS-05, 08, 09, 10, DESIGN-02. Исход каждого определён на отпечатке 5c62808f.
  # Шестое условие DESIGN_APPROVED — применимое ревью замысла — предмет следующего шага, здесь не судится.
  - condition: "каждый пункт первичного разбора отображён, и отображение выдерживает условие пункта (CG_CLASS_ITEM_UNMAPPED)"
    result: red
    detail: >-
      Строк отображения 65, уникальных пунктов 64 из 64. CX5-63 и CX5-64 выдерживают. CX5-61 не
      выдерживает второй раз подряд, и снова из-за расхождения с соседом, но по другой оси.
      Гейт З28 п.4 стоит на трёх посылках, которые замысел NTF-1 опровергает. Посылка первая:
      все операторы ленты — константы, и SQL разрешим в `types.Info.Types[arg].Value`. Посылка
      вторая: имя таблицы подставляет экспортируемая `feed.TableSQL`. Посылка третья: у корня
      kacho есть константа конфигурации с именем таблицы. Замысел NTF-1 — и ред. 6, которую
      называет §0, и ред. 7, лежащая в дереве на коммите редакции 5, — устроен иначе. Имя производит
      `tablename.Of(svc, kind)` во ВНУТРЕННЕМ пакете `notify/feed/internal/tablename`. Оператор
      собирается через `fmt.Sprintf("UPDATE %s …", tablename.Of(…))` в том же выражении вызова.
      Любая строковая константа со суффиксом таблицы ленты вне `tablename` — находка
      `AuditFeedTableWrites`. Итоги такие. Первое: на законном дереве NTF-1 гейт З28 п.4 объявит
      каждый оператор ленты «не судим» — его положительный близнец невыполним. Второе:
      `feed.TableSQL` отменяет решение NTF-1 об `internal`. Третье: константа G3 (З28 п.7) —
      находка гейта NTF-1 на дереве kacho. Четвёртое: у писателей таблицы ленты становится две
      ведомости в двух гейтах (п.6 здесь и ведомость `AuditFeedTableWrites` NTF-1). Ведомость NTF-1
      о `claimTx`, `recordOutcome`, `Supersede`, `DeleteUnleased` не знает, и посадка S2 её
      покраснит. Подробно — в mapping_check. Новый пункт CX5-65 этим условием не судится: он в
      `unmapped`.
  - condition: "новый внешний вызов заведён пунктом и отображён (CG_CLASS_NEW_EXTERNAL_CALL)"
    result: green
    detail: >-
      Новых сетевых вызовов нет (0). `SELECT clock_timestamp()` (`limits.DBClock`) — оператор к той
      же базе `kacho_notify` в уже открытой транзакции слоя или записи исхода. `pg_query_go` в kacho —
      тестовая зависимость G3, разбор идёт в процессе; сборка под cgo в конвейере kacho есть (M34,
      ci.yaml строка 254). Каскад `ON DELETE CASCADE` исполняется внутри того же `DELETE`.
  - condition: "новый асинхронный путь заведён пунктом и отображён (CG_CLASS_NEW_ASYNC_PATH)"
    result: green
    detail: >-
      Новых асинхронных путей нет (0). Отметки снимает каскад внешнего ключа в операторе удаления
      строки ленты, синхронно. Часы слоя читаются внутри его же транзакции. `Supersede` исполняется
      в транзакции перехода, как и в ред. 4.
  - condition: "новое sentinel-значение или механизм заведены пунктом и отображены (CG_CLASS_NEW_SENTINEL)"
    result: red
    detail: >-
      Выдерживают: `limits.Clock`/`DBClock` (CX5-63), внешний ключ отметок (CX5-64), значение
      состояния `superseded` и пара `outcome_pair` — клетка `SUPERSEDED` приёмки (строка 393) через
      оператор З8 п.5, класс значения цели `SET` в гейте. В этом разделе они судятся как отображение
      CX5-61. Не заведён пунктом новый механизм дельты — зависимость Е8 с предикатом снятия
      (CX5-65). Предикат — `grep -c` фразы «последняя стартовавшая реплика задаёт», и его ноль
      объявлен так: «NTF-1 приняла отказ старта — зависимость снята». На ред. 7 NTF-1, которая уже
      лежала в дереве на коммите 1de812f34, предикат даёт 0. Модель при этом та же: фразу
      переставили («Действующий ключ задаёт последняя стартовавшая реплика», строка 1174), а ограда
      `recipient_key_fence` с `ON CONFLICT (singleton) DO UPDATE` осталась (строка 1173). Предикат
      снятия уже говорит «снята» о живой зависимости.
  - condition: "нет маркеров отсрочки и открытых решений (CG_DESIGN_DECISION_OPEN)"
    result: green
    detail: >-
      `grep -noE 'TODO|TBD|FIXME|XXX'` — 0. Формы «отложенн…» — исход DEFER, термин предмета; «позже»
