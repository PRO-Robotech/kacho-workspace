#
# Запись привязана к отпечатку ЗАМЫСЛА. Первичные разборы на 1f4852e4, 2fe29c35, 88fabd09,
# 03e291ee и 367b9482, а также пересверки на a43a19fa, 379efc2a, 108c05d2 и 58e29da9 относятся к своим
# редакциям и здесь не переписываются.
# По Д22 судится ДЕЛЬТА редакции 5 против редакции 4 (`git diff 14e9e87a1 1de812f34 --
# docs/changes/issue-2924/design.md`, 686 строк диффа). Отображения, которые прежние пересверки
# признали выдерживающими и которые дельта не тронула, повторно не судятся.
# Проверено пять вещей:
#   (1) отображены CX5-61 (переписан), CX5-63 и CX5-64 пересверки на 58e29da9, и отображение
#       выдерживает условие пункта;
#   (2) новые внешние вызовы, (3) новые асинхронные пути и (4) новые sentinel-значения и механизмы
#       дельты заведены пунктами;
#   (5) маркеров отсрочки и открытых решений нет.
# Условие «нет применимого ревью замысла» здесь не судится: ревью замысла — следующий шаг
# (роль design-reviewer исполняет system-design-reviewer в режиме «замысел»).
# Новый пункт этой пересверки — CX5-65. Строки отображения для него в замысле нет.
