axes:
  atomicity_no_dual_write: закрыта. Дельта двойной записи не вводит. Горизонт — условие в существующем операторе, отказ — откат без записи.
  idempotency: закрыта. Повторное взятие строки с резервом проходит шагом 2 и места второй раз не занимает. Отказ по горизонту ничего не пишет, отметка отсрочки ставится ON CONFLICT DO NOTHING.
  cas_and_locking: >-
    закрыта. Горизонт — CAS на одной строке (UPDATE … WHERE <условие> RETURNING), а не
    проверка-затем-запись. Ноль строк классифицируется чтением в той же транзакции. Порядок
    блокировок один: замок адреса, затем строка ведра.
  delivery_model: закрыта; Watch RPC нет.
  worker_and_replica_coordination: >-
    закрыта. Темп — на установку, одними часами базы. Состояния в памяти нет. Ошибка слоя при
    отсутствии строки ведра оставляет строку следующему взятию.
  deadlines: закрыта (Н1, Н3; ResolveSend — Е9 у NTF-1).
  edges_acyclicity: закрыта; новых рёбер нет, kaname → notify вызовов нет (polyrepo.md:60).
  public_vs_internal_edge: закрыта; дельта край не трогает.
  clean_architecture: закрыта; порт limits.Clock, сентинелы ErrStreamBucketMissing/Inconsistent в пакете слоя.
  invariants_and_holders: у И33 и И34 есть держатели с близнецами-инъекциями. У И1–И32 держатели не изменились.
  tasks_correspondence: соответствует; К1, CX5-67, Н2, Н3 — N10; Н1 — N3, N9; М2 — W1.

