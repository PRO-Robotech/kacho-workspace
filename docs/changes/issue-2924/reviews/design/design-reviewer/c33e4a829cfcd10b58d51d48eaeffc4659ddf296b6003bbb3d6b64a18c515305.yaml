prior_findings:
  К1:
    status: закрыт
    evidence: >-
      З11 п.1 шаг 4: условие GREATEST(next_slot, $t) − $t <= $H стоит в том же UPDATE, что выдача
      места, единственном писателе next_slot. Под READ COMMITTED однострочный UPDATE после ожидания
      блокировки перепроверяет WHERE на последней версии строки, поэтому конкурирующая транзакция
      условие не обойдёт. Вывод границы проверен: после любой выдачи next_slot ≤ $t + H + $interval.
      $t снимается clock_timestamp() до ожидания блокировки строки ведра (п.7), и устаревший $t
      делает условие только строже, так что граница в реальном времени базы держится. Выданных и
      не пройденных мест ≤ N·H/1мин + 1, и потеря от закрытия любого числа строк ограничена
      H + $interval независимо от числа строк. Инвариант И33, держатель — проба N10 «горизонт» на
      DBClock с близнецом-инъекцией (условие снято → около 20 мин, красный), положительным
      близнецом и масштабным прогоном 100 000 строк. Числа вычисляются из feed.MaxDefer и $interval.
      Предикат «писатель строки ведра один» судит разобранный оператор записи и падает на пустом
      обходе. Цена горизонта названа: строки без места соревнуются с новыми. Довод «не голодание»
      верен в той форме, в какой записан: отказ в момент t требует ≥ N·H/1мин − 1 выдач за
      (t − H, t], и ненасыщенный отрезок отказов не даёт. При устойчивом приходе ≥ N в минуту
      строку, отложенную горизонтом, могут обгонять новые. Это не нарушение И33, потому что обгоняющие
      места будут пройдены, а Р15 держится. Проба п.3 п.6 (близнец «за H пришло N·H новых строк»)
      это фиксирует. И29 сохраняет форму: отказ — ровно MaxDefer, и k отказов ⇒ ожидание ≥
      k·MaxDefer. Сверхлинейный рост транзакций на всплеске назван и выводится числом прогона.
  CX5-67:
    status: закрыт
    evidence: >-
      Ноль строк шага 4 больше не читается как «горизонт занят». Чтение строки ведра в той же
      транзакции различает три случая: занят → DEFER, нет строки → ErrStreamBucketMissing, противоречие
      → ErrStreamBucketInconsistent. Исхода нет, Ack не шлётся. Строка ленты obligation не истекает
      уборщиком (З10 п.3), а у взятия NTF-1 нет счёта попыток (issue-2915 design.md:575), поэтому
      ошибка слоя строку не теряет и отравленной её не делает (Р15). Держатель — N10 п.8 с близнецом
      и инъекцией. И34.
  Н1:
    status: закрыт
    evidence: >-
      §8: каждый вызов DescribeScope, ListAccounts и Resolve идёт под context.WithTimeout с одной
      константой на пакет (admit, fanout), срок ставится в месте вызова, а не в клиенте. Предикат
      «клиент срока не ставит» ищет и WithDeadline. Аренда выводится с кратностью (до 100
      DescribeScope) плюс срок транзакции. Проба кратности и проба предпосылки названы.
      Классификатор относит DEADLINE_EXCEEDED к повтору. Срок ResolveSend стоит у NTF-1 (M39,
      issue-2915 design.md:1111–1119, проверено), держатель — зависимость Е9 с предикатом снятия.
      Два места срока у одного вызова не заводятся — это верно.
  Н2:
    status: закрыт (цена названа)
    evidence: З11 п.2 «Одно исключение — цена, а не механизм»; окно потолка — сутки; потеря места — в границе И33; проба N10 с управляемым порядком событий и близнецом.
