axes:
  atomicity_no_dual_write: >-
    закрыта. Транзакция страницы раскрытия пишет строки адресатов и feed.Put (З8 п.1, З9 п.2).
    Одна транзакция перехода делает UPDATE notices, закрывает события, выполняет Supersede,
    снимает резервы окна и отметки, пишет новое событие, Ф2 и счётчики (З5 п.3, З8 п.5). Одна
    транзакция фиксации Create снимает заявку, пишет извещение и Ф3 (З3 п.5). Запись исхода ленты
    и её следствия (окно, sent_seq, счётчики) идут в одной транзакции recordOutcome (З21 п.1,
    З28). Всё это одна база kacho_notify. Паттерна «коммит, затем публикация» нет.
  idempotency: >-
    закрыта. Мутации возвращают Operation. Create идёт заявкой с арендой, окончание исполнения —
    CAS Ф3 и Ф4 по done = false. Операции переходов и контактов рождаются завершёнными (Ф2).
    Одно письмо на субъекта держит UNIQUE (event_id, subject). Исход области пишется один раз
    ON CONFLICT DO NOTHING. Резерв окна вставляется ON CONFLICT (feed_row_id) DO NOTHING,
    отметка отсрочки — по PK (feed_row_id, reason). Повтор Ack наблюдателя не зовёт.
  cas_and_locking: >-
    закрыта по механизму. Переходы — одна запись с условием, после нуля строк отказ
    классифицируется (З5). Три аренды несут токен взятия, и каждая запись под арендой содержит
    lease_token = $T (З27). Supersede и DeleteUnleased блокируют строки FOR UPDATE по id.
    Порядок «извещение → события → строки ленты → счётчики последними» один у перехода, у
    подметальщика, у страницы раскрытия и у наблюдателя, цикла ожиданий нет (З6 п.2, З21 п.1).
    Слой лимитов берёт замок адреса, затем строку ведра. Пробы с конкурирующими горутинами
    названы: NTF5-33 и 111 с 20 повторами, «две страницы и переход — 40P01 0», чередование
    DeleteUnleased. Решение о резерве не сверяется с арендой строки ленты — Н2.
  delivery_model: >-
    закрыта. Watch RPC нет. Строки извещений идут собственной лентой notify через взятие в
    процессе, клиенты опрашивают Operation. Публичного контракта наблюдения нет (§12).
  worker_and_replica_coordination: >-
    закрыта по механизму, с находкой К1 и замечанием Н1. Заявки, события и кандидаты берутся
    арендами с токеном. Подметальщик берёт партии через SKIP LOCKED. Планировщик забирает
    напоминание DELETE … RETURNING ровно одной строки. Уборка окна идёт под замком адреса.
    Состояния в памяти между итерациями нет: кэш областей лежит в базе, темп и потолок тоже.
    Метрики снимаются из базы, агрегация max. Лимиты судятся часами базы (З11 п.7). Аренды
    живут на часах процесса: расхождение часов реплик влияет только на живость, потому что
    безопасность держит токен.
  deadlines: >-
    НЕ закрыта. У вызовов notify-sender → kaname (DescribeScope, ListAccounts, Resolve,
    ResolveSend) нет названного срока. §8 выводит аренду из «суммы сроков вызовов попытки», но
    самих сроков нет ни в §2, ни в §8 (Н1). Со стороны базы удержание строки ведра и строк
    счётчиков ограничено только пределами пула db.NewPool, и замысел их не называет (Н3).
  edges_acyclicity: >-
    закрыта. notify-sender → kaname, notify-api → kaname (Check и сужатель), край → notify-api.
    kaname клиента notify не держит (§9). Ребро записано: poly-edge-notify-kaname, строка 60, уже
    называет «внутренний справочник адресатов и областей (NTF-3, NTF-5)». Строка 61,
    poly-edge-gateway-notify, операторскую поверхность извещений не перечисляет (М2).
  public_vs_internal_edge: >-
    закрыта. InternalNoticeService регистрируется только на внутреннем mux, NoticeService — на
    публичном, через одно соединение notifyInternal (З18 п.6). У notify один слушатель (Д17).
    Гейт изоляции знает носителя notify (З19). DescribeScope и ListAccounts стоят только во
    внутреннем сервисе справочника kaname и огорожены звеном service:notify на точном SAN (З23
    п.1). Освобождённые методы вызывают RequireScope, и это держит гейт (З16 п.3).
  clean_architecture: >-
    закрыта. Use-case разложены по методам. Порты — limits.Clock и feed.OutcomeObserver.
    Связывание — только в корнях notify-api и notify-sender (З1, З2 п.2, З28 п.3). Клиент kaname
    — internal/clients/kaname_client.go.
  invariants_and_holders: >-
    у каждого из И1–И32 есть держатель. Для К1 инварианта и держателя нет, требование ниже.
    Утверждение З11 п.1 «известная потеря — темп ниже, а не выше» верно по направлению и не
    называет величину.
  tasks_correspondence: >-
    соответствует: у каждого З1–З28 есть полоса, у каждой полосы — предикат снятия. Параллельные
    полосы одного яруса (N2 ∥ N3 ∥ N4, N8 ∥ N9) путей не делят. К1, Н2 и Н3 ложатся в полосу N10,
    Н1 — в N3 и N9, М1 — в N10 и N7, М2 — в W1.

critical:
  - id: К1
    coordinate: >-
      design.md З11 п.1 шаг 4 (строки 606–609) и абзац «Место строки, закрытой мимо отправки»
      (строки 643–646); З8 п.5 (строки 511–513); З24 п.6; И29, И30 (строки 1480–1481); tasks.md N10
    finding: >-
      Место в расписании темпа выдаётся при первом взятии строки, задолго до прохода. Строка ведра
      next_slot только растёт. Место строки, закрытой мимо отправки (SUPERSEDED от Cancel, Update
      или Complete; удаление DeleteUnleased), в расписание не возвращается. Замысел называет это
      «известной потерей — темп ниже, а не выше», но без величины, а величина не ограничена.
      Возьмём извещение на allAccounts. Все его строки obligation конвейер забирает сразу:
      not_before пуст, каждая строка занимает место одной короткой транзакцией и уходит в DEFER
      до места. За минуты next_slot уходит вперёд на (число строк) / N. При 100 000 адресатов и
      N = 600 в минуту это около 166 минут. Оператор переносит работы (Update закрывает
      неотправленные строки прежней ревизии, З26) или отменяет извещение. Неотправленные строки
      закрыты, а next_slot остаётся на +166 мин. Каждое следующее письмо obligation установки,
      включая OUTAGE и SECURITY_INCIDENT, получает место после этого хвоста и ждёт часы, хотя
      поток пуст. Установка ставит одну глобальную очередь позади выданных впрок мест, которым
      уже некому пройти. Время простоя пропорционально числу закрытых строк и сверху ничем не
      ограничено. Это то же, что возврат ресурса пула не на каждом пути высвобождения
      (lease-recycle-every-path), только ресурс здесь — время расписания. Р15 («откладывают, не
      теряют») и граница темпа И30 при этом держатся. Нарушено свойство распределённой очереди:
      задержку письма задаёт закрытое чужое извещение, а не темп и не потолок адреса.
    requirement: >-
      (1) Ограничить величину потери. Годится любой механизм, который даёт верхнюю границу
      независимо от числа закрытых строк. Пример — горизонт выдачи мест: место выдаётся, только
      если GREATEST(next_slot, $t) − $t ≤ H при H = feed.MaxDefer. Иначе исход
      DEFER(ob_stream_pace) с defer_for = MaxDefer без места и без резерва; потолок при этом не
      судится и строку ведра транзакция не пишет. Тогда впрок выдано не больше N·H мест, потеря
      не превышает H при любом числе закрытых строк, а граница цены И29
      (1 + ⌈ожидание / MaxDefer⌉) сохраняет форму. Если выбран горизонт, назвать его цену: строки
      без места соревнуются с новыми и могут ждать дольше. Нужен довод, почему это не голодание,
      либо порядок «старые раньше».
      (2) В З11 п.1 заменить «известная потеря» верхней границей потери с выводом. Инвариантом
      записать: «письмо obligation ждёт места не дольше H сверх очереди мест, которые реально
      будут пройдены».
      (3) Держатель — интеграционная проба N10 на часах DBClock. 1200 строк при 600 в минуту
      занимают места, затем переход закрывает все неотправленные строки. Новое извещение с одной
      строкой проходит не позже H плюс цикл взятия. Близнец-инъекция меняет один факт: горизонт
      снят, и та же строка ждёт около 2 минут хвоста — красный. Масштаб границы — отдельный
      прогон при N = 60.
      (4) Д26 запрещает новые механизмы в заходе отображения. Выбор механизма и его цены —
      решение диспетчера либо владельца, до захода автора.

important:
  - id: Н1
    coordinate: design.md §8 (строки 1612–1616); З3 п.2–п.4 (строки 323–342); З9 п.2 (строки 532–537); tasks.md N3, N9
    finding: >-
      §8 выводит аренду заявки, события и кандидата из «суммы сроков вызовов попытки». Но срока
      ни одного вызова notify-sender → kaname (DescribeScope, ListAccounts, Resolve, ResolveSend)
      замысел не называет: ни константы, ни context.WithTimeout. Поиск по design.md и tasks.md
      даёт 0 строк. Безопасность держится токеном аренды: запись реплики, потерявшей аренду, даёт
      0 строк. Но вызов без срока держит работника без предела, аренда уходит второй реплике,
      вызовы дублируются. Вывод константы аренды опирается на величины, которых нет
      (arch-per-call-deadline).
    requirement: >-
      Условие к коду полос N3 и N9: каждый вызов kaname — под context.WithTimeout с
      константой-сроком пакета admit либо fanout. У всех вызовов одного клиента срок одной
      настройки. Константа аренды — не меньше суммы сроков вызовов попытки плюс срок транзакции
      страницы, и в комментарии константы этот вывод выписан. Держатель — модульная проба:
      заглушка kaname не отвечает, вызов возвращает DeadlineExceeded в пределах срока, работник
      свободен. Близнец — ответ внутри срока. Механизма это не добавляет: срок уже подразумевает
      §8. Не блокирует.
  - id: Н2
    coordinate: design.md З11 п.1 (строки 588–591, «под арендой строки ленты»), п.2 (строки 659–661, «резерв без строки не повисает»); З8 п.5 (строки 511–513); tasks.md N10
    finding: >-
      Транзакция слоя лимитов аренду строки ленты не сверяет, и SQL к ленте у notify нет (З28
      п.7). Возьмём порядок событий. Аренда строки X истекла, пока держатель A был между
      взятием и фиксацией транзакции слоя (пауза процесса дольше feed.LeaseTTL). Затем переход
      закрывает X через Supersede и удаляет её резерв по feed_row_id. Незафиксированная вставка A
      этому DELETE не видна, удалено 0 строк. После этого A фиксирует резерв. Остаётся резерв
      sent_at IS NULL закрытой строки. SweepWindow снимает только sent_at IS NOT NULL (З11 п.5),
      так что резерв 24 часа считается в потолок адреса и живёт до удаления извещения
      подметальщиком (З24 п.6). Утверждение З11 п.2 «резерв без строки не повисает» в этом
      порядке событий неверно. Распределённое свойство не ломается: потолок только строже, Р15
      держится. Место в расписании при этом тоже теряется (К1).
    requirement: >-
      Назвать цену в З11 п.2: «резерв закрытой строки возможен при истечении аренды до фиксации
      транзакции слоя, считается в потолок не дольше 24 ч, снимается подметальщиком». Либо
      закрыть окно: уборка окна снимает и записи без sent_at, у которых строки ленты нет или она
      закрыта. Это решение диспетчера, если оно вне Д26. Держатель — проба N10 с управляемым
      порядком событий. Не блокирует.
  - id: Н3
    coordinate: design.md З11 п.1 шаг 4 (строки 606–609); З21 п.1 (строки 1048–1056); §8
    finding: >-
      notice_ob_stream_bucket — одна строка на установку, через неё проходит каждая транзакция
      слоя, занимающая место. Строки notice_counters берутся каждой транзакцией исхода
      obligation. Допустим, держатель такой строки завис: реплика исчезла, сеть разделилась без
      RST. Тогда весь поток obligation установки стоит, пока сервер базы не снимет сессию. Предел
      есть, если пул notify строится corelib db.NewPool: statement_timeout 30 с и
      idle_in_transaction_session_timeout 60 с (замер: corelib db/pool.go строки 49–50 на v1.8.0
      и на 34bc8104a). Но замысел не называет, каким пулом строится notify, и не выписывает эту
      границу. Замысел NTF-2 по тому же классу поставил серверные пределы явно.
    requirement: >-
      В §8 или З11 п.1 записать: пул kacho_notify — db.NewPool (значит, пределы 30 с и 60 с), и
      остановка потока obligation на зависшем держателе строки ведра или строки счётчика не
      дольше 60 с. Либо SET LOCAL тех же пределов первыми операторами транзакции слоя. Держатель
      — интеграционная проба: соседняя сессия берёт строку ведра и замолкает. Транзакция слоя
      проходит после предела, сессия держателя завершена с кодом 25P03. Близнец-инъекция — пул
      без idle_in_transaction_session_timeout, и проба красная. Не блокирует.

minor:
  - id: М1
    coordinate: design.md З11 п.1 шаг 1 (строка 594), п.5 (строка 717); §6
    finding: >-
      Замок адреса берётся в форме с одним аргументом: pg_advisory_xact_lock(hashtext($h)). Его
      ключ делит пространство с любым другим рекомендательным замком базы kacho_notify в той же
      форме. Совпадение даёт лишнее ожидание, но не ломает корректность. Замысел NTF-2 взял
      форму с двумя int4 и классом.
    requirement: >-
      Форма с двумя аргументами: константа класса замка слоя OB и hashtext($h). Судит
      db-architect-reviewer на полосе N10/N7.
  - id: М2
    coordinate: .claude/rules/polyrepo.md строка 61 (poly-edge-gateway-notify); design.md §9
    finding: >-
      Запись ребра «край → notify» перечисляет публичные сервисы настроек, подписок, контактов и
      ленты консоли и InternalSuppressionService. Публичного NoticeService и операторского
      InternalNoticeService (через внутренний слушатель края) этой под-фазы в ней нет. Ребро не
      новое, дополняется только его содержание.
    requirement: дописать оба сервиса в запись ребра тем же изменением, что полоса W1 (tooling-maintainer).
  - id: М3
    coordinate: design.md З3 п.1 и п.4 (строки 318–342)
    finding: >-
      Окно проверки меряется от accepted_at, который записан часами процесса notify-api, до now
      по часам процесса notify-sender, то есть часами двух разных процессов. Сдвиг часов Δ
